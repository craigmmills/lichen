<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face { font-family: "PT Serif"; src: url(../tools/fonts/PTSerif-Bold.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "PT Serif"; src: url(../tools/fonts/PTSerif-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Barlow Condensed"; src: url(../tools/fonts/BarlowCondensed-SemiBold.woff2) format("woff2"); font-weight: 600; }
html, body { margin: 0; width: 1200px; height: 627px; overflow: hidden; background: #f5f2ea; color: #262a2b; }
.text { position: absolute; left: 60px; top: 56px; width: 530px; height: 515px; display: flex; flex-direction: column; }
.mast { font: 700 30px/1 "PT Serif", serif; letter-spacing: -.01em; padding-bottom: 14px; border-bottom: 2px solid #262a2b; }
h1 { font: 700 62px/1.06 "PT Serif", serif; letter-spacing: -.015em; margin: 34px 0 26px; }
.lede { font: 400 25px/1.36 "PT Serif", serif; margin: 0; }
.cta { margin-top: auto; align-self: flex-start; font: 700 23px/1 "PT Serif", serif; color: #f5f2ea; background: #d94f26; padding: 15px 20px; }
.legend { position: absolute; left: 642px; top: 574px; width: 518px; display: flex; justify-content: space-between; font: 600 15px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .09em; color: #4e5a63; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
.cap { position: absolute; left: 642px; top: 36px; font: 600 15px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .12em; color: #4e5a63; }
svg { position: absolute; left: 0; top: 0; }
</style></head><body>
<div class="text">
  <div class="mast">lichen</div>
  <h1>Who works on data and AI for nature</h1>
  <p class="lede">{{records}} records in {{countries}} countries. Every fact quoted from a public page.</p>
  <div class="cta">Find your organisation</div>
</div>
<div class="cap">One mark for each record</div>
<svg width="1200" height="627" viewBox="0 0 1200 627" shape-rendering="crispEdges">{{marks}}</svg>
<div class="legend">{{legend}}</div>
</body></html>
