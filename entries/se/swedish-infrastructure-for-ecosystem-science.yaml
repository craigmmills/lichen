summary: National infrastructure established in 2013, with nine field stations, openly available
  data, Swedish Research Council funding and operation by the Swedish University of Agricultural
  Sciences.
facts:
- claim: A national infrastructure with nine research stations.
  url: https://www.slu.se/en/research/research-excellence/research-infrastructure/anlaggningar/swedish-infrastructure-for-ecosystem-science-sites/
  fetched: '2026-11-02'
  quote: SITES is a national research infrastructure for terrestrial and limnological field
    research open to all scientists.
- claim: All data is openly available.
  url: https://www.slu.se/en/research/research-excellence/research-infrastructure/anlaggningar/swedish-infrastructure-for-ecosystem-science-sites/
  fetched: '2026-11-02'
  quote: All data produced within SITES is openly available at the SITES Data Portal .
- claim: Describes itself as a network of stations across Sweden since 2013.
  url: https://www.fieldsites.se/about
  fetched: 2026-11-02
  quote: The Swedish Infrastructure for Ecosystem Science (SITES) is a network of stations
    across Sweden that enables field-based research
- claim: Has thematic programmes in remote sensing, catchment monitoring and aquatic mesocosms.
  url: https://www.fieldsites.se/about
  fetched: 2026-11-02
  quote: SITES has Thematic Programs in ecosystem remote sensing, catchment monitoring and
    aquatic mesocosms.
- claim: A network of stations across Sweden, since 2013.
  url: https://www.fieldsites.se/about
  fetched: '2026-11-02'
  quote: is a network of stations across Sweden that enables field-based research of the highest
    international standards since 2013
- claim: The Swedish Research Council page, updated in February 2024, says SITES coordinated
    nine field stations.
  url: https://www.vr.se/english/mandates/research-infrastructure/find-research-infrastructure/list/2018-10-18-sites---swedish-infrastructure-for-ecosystem-science.html
  fetched: '2026-11-02'
  quote: coordinates a number (currently nine) of the country’s field stations
- claim: National infrastructure providing data and field access.
  url: https://www.fieldsites.se/
  fetched: '2026-11-02'
  quote: The Swedish Infrastructure for Ecosystem Science is a national infrastructure for
    ecosystem research that provides data and field access for your research.
- claim: Wildlife cameras are used at Grimsö to estimate population sizes.
  url: https://www.fieldsites.se/2024/04/30/may-collaboration-focus-wildlife-cameras-provide-valuable-data-several-research-projects
  fetched: '2026-11-02'
  quote: At Grimsö, wildlife cameras are widely used as they provide valuable data, e.g.,
    to estimate population sizes and frequency of animal visits.
