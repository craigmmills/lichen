facts:
- claim: The national research infrastructure for open biodiversity data, including the Swedish
    GBIF node.
  url: https://biodiversitydata.se/uploads/SBDI-Organizational-and-Technical-Overview.pdf
  fetched: '2026-11-02'
  quote: The Swedish Biodiversity Data Infrastructure SBDI, including the Swedish node of
    the Global Biodiversity Information Facility GBIF, is the national research infrastructure
- claim: Delivered by a consortium of 11 universities and government agencies.
  url: https://biodiversitydata.se/uploads/SBDI-Organizational-and-Technical-Overview.pdf
  fetched: '2026-11-02'
  quote: SBDI services are delivered by a consortium of 11 universities and government agencies
    in Sweden
- claim: Describes itself as a national e-infrastructure that gives open access to data and
    analysis tools.
  url: https://biodiversitydata.se/about/
  fetched: 2026-11-02
  quote: The Swedish Biodiversity Data Infrastructure (SBDI) is a national e-infrastructure
    that empowers research and innovation in biodiversity and ecosystems.
- claim: Its consortium has eleven partner organisations.
  url: https://biodiversitydata.se/about/organization/consortium-partners/
  fetched: 2026-11-02
  quote: The SBDI Consortium consists of eleven partner organizations.
- claim: Lists portals and tools including the Bioatlas, built on Living Atlases technology.
  url: https://biodiversitydata.se/explore-data/
  fetched: 2026-11-02
  quote: Our core tools and data access functionality is based on Living Atlases technology
- claim: In March 2026 the Swedish Museum of Natural History was recruiting a new SBDI director.
  url: https://www.gbif.se/news/2026/director-for-sbdi-position-open/
  fetched: 2026-11-02
  quote: The Swedish Museum of Natural History is recruiting a new Director for the Swedish
    Biodiversity Data Infrastructure (SBDI).
- claim: A national e-infrastructure for biodiversity and ecosystem research.
  url: https://biodiversitydata.se/about/
  fetched: '2026-11-02'
  quote: The Swedish Biodiversity Data Infrastructure (SBDI) is a national e-infrastructure
- claim: Serves as the Swedish GBIF node.
  url: https://biodiversitydata.se/about/
  fetched: '2026-11-02'
  quote: Serving as the Swedish node of the Global Biodiversity Information Facility (GBIF)
- claim: Tools let users integrate biodiversity data with satellite and climate data.
  url: https://www.nrm.se/engelska/in-english/research/research-infrastructure/sbdi
  fetched: '2026-11-02'
  quote: With the analysis tools, users can integrate data on biodiversity with variables
    from sources such as satellite and climate data
