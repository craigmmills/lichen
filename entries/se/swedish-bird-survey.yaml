status: active
summary: Volunteer bird counting programme at several hundred sites for over 40 years, run by Lund University,
  with a November 2021 report citing 700 to 800 volunteers annually and much data available through SBDI.
facts:
- claim: A November 2021 report said between 700 and 800 volunteers had participated annually in recent
    years.
  url: https://biodiversitydata.se/news/2021/bird-count-environmental-hero-of-the-year/
  fetched: '2026-11-02'
  quote: In recent years, between 700 and 800 volunteers have participated annually.
- claim: Much of the data is available through SBDI.
  url: https://biodiversitydata.se/news/2021/bird-count-environmental-hero-of-the-year/
  fetched: '2026-11-02'
  quote: Much of the project data is available via SBDI.
- claim: Part of the environmental monitoring programmes of Naturvårdsverket and the county boards.
  url: https://www.fageltaxering.lu.se/om-oss
  fetched: '2026-11-02'
  quote: som en del i Naturvårdsverkets och länsstyrelsernas miljöövervakningsprogram
- claim: The 2023 report calls it a project run by the Department of Biology at Lund University.
  url: https://lup.lub.lu.se/search/publication/07f73f21-b165-450f-8236-6635c3b60804
  fetched: '2026-11-02'
  quote: We present the results of the Swedish Bird Survey, a project run by the Department of Biology,
    Lund University
- claim: Fixed routes began in 1996 to track bird abundance and distribution; mammal monitoring on these
    routes began in 2011.
  url: https://collections.biodiversitydata.se/public/show/co50
  fetched: '2026-11-02'
  quote: The fixed routes were initiated in 1996 as a standardized method for detecting and reporting
    changes in the abundance of birds (since 1996) and mammals (since 2011), and their distributions in
    Sweden over time.
