  fetched: '2026-11-02'
  quote: The main objective of this thesis is to develop deep learning methods for improved
    active fire detection, daily burned area mapping and post-fire burned area mapping utilizing
    multi-sensor multi-resolution earth observation images.
- claim: SBDI says it coordinates work on integrating sequence-based species observations.
