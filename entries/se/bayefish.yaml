facts:
- claim: Will develop a hierarchical Bayesian model for electrofishing data, using quantitative
    surveys to strengthen estimates from simple qualitative ones.
  url: https://www.naturvardsverket.se/om-miljoarbetet/forskning/miljoforskning/forskningssatsningar-samhalle/framtidens-miljoovervakning/
