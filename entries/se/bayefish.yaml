  quote: Projektet BAYeFISH ska utveckla en hierarkisk Bayesiansk modell för elfiskedata som
    nyttjar data från kvantitativa fisken för att stärka skattningar från enkla kvalitativa
    fisken.
- claim: A user-friendly interactive web tool (Shiny app) is to be built so others can use
    the model.
