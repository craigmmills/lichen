id: swedish-forest-conservation-value-map
kind: dataset
name: AI map of Swedish forests with high conservation value
scope: se
ai_label: ai
realms:
- land
status: active
runner: unknown
summary: Active machine learning map covering 22 million one-hectare areas in Sweden
  with at least 50 percent forest, showing probability of high conservation value,
  built on 128 open geographic variables and validated with independent data.
facts:
- claim: The map covers 22 million one-hectare areas in Sweden with at least 50 percent
    forest and shows the probability of forest and forest landscapes with high conservation
    value.
  url: https://internt.slu.se/nyheter-originalen/2024/5/nytt-ai-verktyg-hjalper-att-hitta-svenska-skogar-med-hoga-naturvarden/
  fetched: '2026-11-08'
  quote: Totalt omfattar kartan 22 miljoner hektarytor med minst 50 procent skog.
- claim: Built with machine learning on 128 independent variables from open geographic
    data, at one-hectare resolution with a value from 0 to 100.
  url: https://internt.slu.se/nyheter-originalen/2024/5/nytt-ai-verktyg-hjalper-att-hitta-svenska-skogar-med-hoga-naturvarden/
  fetched: '2026-11-08'
  quote: Modellen har tagits fram med hjälp av maskininlärning och baseras på 128
    oberoende variabler från öppet tillgängliga geografiska datakällor på bestånds-
    och landskapsnivå.
- claim: Validated with independent data from the Swedish National Forest Inventory
    and stand data from Sveaskog.
  url: https://internt.slu.se/nyheter-originalen/2024/5/nytt-ai-verktyg-hjalper-att-hitta-svenska-skogar-med-hoga-naturvarden/
  fetched: '2026-11-08'
  quote: oberoende data från Riksskogstaxeringen och beståndsdata från statliga Sveaskog
