summary: Uppsala University-run laboratory in Norrtälje that monitors Lake Erken with manual
  and automatic measurements, including greenhouse gas fluxes since 2014, and is an accredited
  water and sediment analysis laboratory.
facts:
- claim: Runs an environmental monitoring programme for Lake Erken with manual and high-frequency
    automatic measurements, covering physical and chemical parameters, phytoplankton and,
    since 2014, greenhouse gas fluxes.
  url: https://gis.fieldsites.se/Home/Station/4
  fetched: '2026-11-08'
  quote: The station has an extensive environmental monitoring program for Lake Erken, including
    both manual and high-frequency automatic measurements The monitoring program includes
    measurements of physical and chemical parameters, phytoplankton, and since 2014, greenhouse
    gas fluxes.
- claim: Focuses on long-term monitoring of water quality and population and community dynamics
    in lakes.
  url: https://gis.fieldsites.se/Home/Station/4
  fetched: '2026-11-08'
  quote: Particular focus is placed on the long-term monitoring of water quality, climate
    effects on aquatic systems, nutrients cycling and population and community dynamics in
    lakes.
- claim: Accredited laboratory for water and sediment analysis and for phytoplankton and zooplankton
    determination.
  url: https://gis.fieldsites.se/Home/Station/4
  fetched: '2026-11-08'
  quote: The Erken Laboratory is also an accredited laboratory for water and sediment sampling
    and analysis, and for phytoplankton and zooplankton determination.
- claim: Address at Norra Malmavägen 45, Norrtälje.
  url: https://gis.fieldsites.se/Home/Station/4
  fetched: '2026-11-08'
  quote: Norra Malmavägen 45
