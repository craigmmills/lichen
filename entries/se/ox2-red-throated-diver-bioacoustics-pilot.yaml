summary: Active pilot, launched by OX2 in summer 2026 with ecovibes, Calluna and EnviroPlanning,
  testing automated sound monitoring of red-throated divers using ecovibes' AI bioacoustic
  technology to support biodiversity management around renewable energy projects.
facts:
- claim: OX2 launched the pilot in summer 2026 with ecovibes, Calluna and EnviroPlanning
    to test automated sound monitoring for biodiversity management around renewable
    energy projects.
  url: https://www.ox2.com/newsroom/articles-and-insights/can-ai-help-us-understand-nature-better/
  fetched: '2026-11-08'
  quote: During summer 2026, OX2 launched a pilot project together with the Swedish
    bioacoustics company ecovibes and specialist environmental consultants from Calluna
    and EnviroPlanning
- claim: Recordings from the audioboxes are analysed with ecovibes' AI bioacoustic
    technology, which identifies species from their acoustic signatures.
  url: https://www.ox2.com/newsroom/articles-and-insights/can-ai-help-us-understand-nature-better/
  fetched: '2026-11-08'
  quote: The recordings are then analysed using AI-powered bioacoustic technology
    developed by ecovibes
- claim: Acoustic recorders are installed where red-throated divers are known to occur.
  url: https://www.ox2.com/newsroom/articles-and-insights/can-ai-help-us-understand-nature-better/
  fetched: '2026-11-08'
  quote: we have installed a number of acoustic monitoring devices, or "audioboxes",
    in areas where red-throated divers (Gavia stellata) are known to occur
