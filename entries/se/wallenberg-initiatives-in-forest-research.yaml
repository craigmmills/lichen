summary: Basic science forest research programme funded by the Knut and Alice Wallenberg Foundation,
  run by SLU and led by Ove Nilsson, with a national research arena announced in January 2026.
facts:
- claim: A basic science programme on forest growth, survival and biodiversity.
  url: https://www.slu.se/en/about-slu/organisation/faculties/faculty-of-forest-sciences/wallenberg-initiatives-in-forest-research/about-the-research-programme/about-wiforce/
  fetched: '2026-11-02'
  quote: Wallenberg Initiatives in Forest Research (WIFORCE) is a basic science research program
    that aims to deepen our understanding of the processes behind forest growth, survival,
    and biodiversity.
- claim: A national forest research arena combining data analysis and field research was announced
    within WIFORCE in January 2026.
  url: https://kaw.wallenberg.org/en/node/4545
  fetched: '2026-11-02'
  quote: A national research arena for forests is now being launched within the Wallenberg
    Initiatives in Forest Research programme at the Swedish University of Agricultural Sciences
    and Umeå University.
- claim: SLU describes it as a basic science research programme on forest growth, survival
    and biodiversity.
  url: https://www.slu.se/en/about-slu/organisation/faculties/faculty-of-forest-sciences/wallenberg-initiatives-in-forest-research/about-the-research-programme/about-wiforce/
  fetched: 2026-11-02
  quote: is a basic science research program that aims to deepen our understanding of the
    processes behind forest growth, survival, and biodiversity.
- claim: A PhD position advertised in December 2025 concerned a project to apply deep learning
    to acoustic monitoring of birds and bats in Swedish forests.
  url: https://climateainordics.com/job-openings/2025-12-10-slu-phd-position/
  fetched: 2026-11-02
  quote: The project focuses on the use of passive acoustic monitoring of birds and bats in
    Swedish forests, applying (and potentially further developing) deep learning models to
    identify species
