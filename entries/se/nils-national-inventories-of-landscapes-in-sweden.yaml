summary: National landscape monitoring programme run by SLU and funded by the Swedish Environmental Protection
  Agency, whose 2003 to 2020 basic inventory collected vegetation data to estimate landscape status and
  change.
facts:
- claim: The 2003–2020 basic inventory collected vegetation data and supported estimates of landscape
    status and change.
  url: https://www.slu.se/en/environment/statistics-and-environmental-data/environmental-data-catalogue/nils/
  fetched: '2026-11-02'
  quote: basic inventory aims to collect vegetation data in the field, and to analyse and present estimates
    of current status and changes in the landscape.
- claim: GBIF Sweden describes it as a landscape monitoring programme combining field observations, transects
    and aerial-photo interpretation.
  url: https://www.gbif.se/news/2025/new-vegetation-dataset-from-nils-opens-a-window-onto-sweden-s-changing-landscapes/
  fetched: 2026-11-02
  quote: it combines field observations, transects and aerial-photo interpretation to track how forests,
    farmland, wetlands, mountains, urban areas and other environments evolve over time.
- claim: National environmental monitoring programme with several targeted inventories.
  url: https://www.slu.se/om-slu/organisation/institutioner/skoglig-resurshushallning/miljoanalys/NILS/
  fetched: '2026-11-02'
  quote: NILS är ett nationellt miljöövervakningsprogram med flera riktade inventeringar av naturtyper
    och livsmiljöer i Sverige
