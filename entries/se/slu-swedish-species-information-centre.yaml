summary: Centre run by the Swedish University of Agricultural Sciences that gathers Swedish
  species information, and from 1 January 2026 forms a joint organisation with the SLU Centre
  for Biological Diversity.
facts:
- claim: Gathers information on Swedish species from private persons, authorities and institutions.
  url: https://www.slu.se/en/slu-swedish-species-information-centre
  fetched: '2026-11-02'
  quote: We gather information from private persons as well as various authorities and institutions
    concerning the occurrence and distribution of Swedish species.
- claim: SBDI says it provides parts of the SBDI data flow through the Species Observation
    System and supplies Dyntaxa exports.
  url: https://biodiversitydata.se/about/organization/consortium-partners/
  fetched: 2026-11-02
  quote: SLU Adb is the home of SBDI Deputy Director, provides with the Species Observation
    System (SOS) parts of the SBDI data flow infrastructure, and contributes with Dyntaxa
    exports to the taxonomic backbone used by SBDI.
- claim: Its site footer gives a visiting address at Almas allé 8 E.
  url: https://www.slu.se/artdatabanken/om-oss/svenska-artprojektet/digital-artinformation/
  fetched: 2026-11-02
  quote: 'SLU Artdatabanken, Besöksadress: Almas allé 8 E'
- claim: Says Artfakta, Artportalen and Dyntaxa are important parts of the infrastructure
    for species information.
  url: https://www.slu.se/artdatabanken/om-oss/svenska-artprojektet/digital-artinformation/
  fetched: 2026-11-02
  quote: Artfakta, Artportalen och Dyntaxa är viktiga delar i denna infrastruktur för artinformation.
- claim: From 1 January 2026 it forms a joint organisation with the SLU Centre for Biological
    Diversity.
  url: https://www.slu.se/artdatabanken/
  fetched: '2026-11-02'
  quote: Från och med 1 januari 2026 är SLU Centrum för biologisk mångfald och SLU Artdatabanken
    en gemensam organisation.
- claim: Released an improved version of the Sök med bild image recognition service.
  url: https://internt.slu.se/nyheter-originalen/2023/9/battre-bildigenkanning-i-artfakta/
  fetched: '2026-11-02'
  quote: SLU Artdatabanken har släppt en ny och förbättrad version av bildigenkänningstjänsten
    Sök med bild.
