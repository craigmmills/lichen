summary: A project funded with SEK 3,886,000 from the Wildlife Conservation Fund for 2026
  to 2028, planning computer-vision models to extract sex, age and distance from wildlife
  camera images.
facts:
- claim: Will develop computer-vision models that extract sex and age and estimate animal
    distance from cameras.
  url: https://www.slu.se/en/research/research-catalogue/projekt/d/digiwild--ai-and-citizen-science-for-monitoring-swedish-ungulates/
  fetched: '2026-11-02'
  quote: We will develop computer-vision models that automatically extract information on
    sex and age and estimate the distance between animals and cameras.
- claim: Funded from the Wildlife Conservation Fund with SEK 3,886,000 for 2026 to 2028.
  url: https://www.naturvardsverket.se/om-miljoarbetet/forskning/viltforskning/forskning-om-jakt-och-viltovervakning/digiwild/
  fetched: '2026-11-02'
  quote: Projektet finansieras ur Viltvårdsfonden med 3 886 000 kronor i anslag för 2026-2028.
- claim: Combines wildlife camera images, citizen science, AI and population models.
  url: https://www.slu.se/en/research/research-catalogue/projekt/d/digiwild--ai-and-citizen-science-for-monitoring-swedish-ungulates/
  fetched: '2026-11-02'
  quote: We study how climate change affects Swedish ungulates using wildlife camera images,
    citizen science, AI and population models.
