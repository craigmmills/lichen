summary: Dataset led by Fredrik Ronquist and funded by the Knut and Alice Wallenberg Foundation,
  charting insect faunas of Sweden and Madagascar by DNA sequencing, with over 30,000 species
  detected in Sweden.
facts:
- claim: Aims to chart the insect faunas of Sweden and Madagascar using DNA sequencing.
  url: https://www.insectbiomeatlas.org/
  fetched: 2026-11-02
  quote: a large-scale insect project aimed at charting the insect faunas of Sweden and Madagascar
    and their associated microbiomes using high-throughput DNA sequencing of Malaise trap
    and soil samples.
- claim: GBIF Sweden says its datasets are open through GBIF and SBDI.
  url: https://www.gbif.se/news/2025/groundbreaking-study-reveals-insect-diversity-in-sweden-and-madagascar-data-now-available-via-gbif/
  fetched: 2026-11-02
  quote: The datasets are now fully accessible via GBIF.org and the Swedish Biodiversity Data
    Infrastructure (SBDI).
- claim: Charts insect faunas of Sweden and Madagascar with high-throughput DNA sequencing.
  url: https://www.insectbiomeatlas.org/
  fetched: '2026-11-02'
  quote: is a large-scale insect project aimed at charting the insect faunas of Sweden and
    Madagascar
- claim: During its 2019–2020 field phase, insects were collected with 200 traps in Sweden
    and 50 in Madagascar.
  url: https://www.insectbiomeatlas.org/
  fetched: '2026-11-02'
  quote: 200 traps in Sweden and 50 in Madagascar
- claim: Aim of the project.
  url: https://www.insectbiomeatlas.org/
  fetched: '2026-11-02'
  quote: aimed at charting the insect faunas of Sweden and Madagascar and their associated
    microbiomes using high-throughput DNA sequencing of Malaise trap and soil samples
- claim: More than 30,000 species detected in Sweden.
  url: https://www.gbif.se/news/2025/groundbreaking-study-reveals-insect-diversity-in-sweden-and-madagascar-data-now-available-via-gbif/
  fetched: '2026-11-02'
  quote: More than 30,000 species were detected in Sweden, including approximately 10,000
    species new to the country.
- claim: Occurrence records available.
  url: https://www.gbif.se/news/2025/groundbreaking-study-reveals-insect-diversity-in-sweden-and-madagascar-data-now-available-via-gbif/
  fetched: '2026-11-02'
  quote: With more than 3.4 million occurrence records
