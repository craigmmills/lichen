summary: SLU-run wildlife station, established in 1974, that runs annual surveys of wildlife
  and habitats, uses wildlife cameras for population estimates, and publishes several datasets
  in the SITES data portal.
facts:
- claim: Runs annual surveys of wildlife and habitats in the Grimsö research area, including
    moose and roe deer population estimates, vole cycles, ticks and fox and starling breeding
    success.
  url: https://www.slu.se/en/about-slu/organisation/departments/ecology/grimso/wildlifemonitoring/
  fetched: '2026-11-08'
  quote: These include population estimates of moose and roe deer, vole population cycles,
    tick occurrence and the reproductive success of red foxes and starlings.
- claim: Several of its datasets are published in the SITES data portal.
  url: https://www.slu.se/en/about-slu/organisation/departments/ecology/grimso/wildlifemonitoring/
  fetched: '2026-11-08'
  quote: Several datasets are also published in the SITES data portal.
- claim: Uses wildlife cameras to estimate population sizes and how often animals visit.
  url: https://www.fieldsites.se/2024/04/30/may-collaboration-focus-wildlife-cameras-provide-valuable-data-several-research-projects
  fetched: '2026-11-08'
  quote: At Grimsö, wildlife cameras are widely used as they provide valuable data, e.g.,
    to estimate population sizes and frequency of animal visits.
- claim: Established in 1974; it says it is Sweden's first and only wildlife research station.
  url: https://gis.fieldsites.se/Home/Station/5
  fetched: '2026-11-08'
  quote: Grimsö Wildlife Research Station was established in 1974 and is Sweden’s first and
    only wildlife research station.
