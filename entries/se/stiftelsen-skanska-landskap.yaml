facts:
- claim: Manages just over ten state nature reserves in Skåne where Region Skåne is
    the principal (huvudman).
  url: https://www.lansstyrelsen.se/skane/besoksmal/friluftsliv-och-allemansratt/fragor-och-svar-om-skotsel-av-naturreservat.html
  fetched: '2026-11-17'
  quote: Drygt tio av dessa har Region Skåne som huvudman och förvaltas genom Stiftelsen
    Skånska Landskap.
- claim: Responsible for the loop trails in its 19 recreation areas (strövområden).
  url: https://www.lansstyrelsen.se/skane/besoksmal/friluftsliv-och-allemansratt/fragor-och-svar-om-skotsel-av-naturreservat.html
  fetched: '2026-11-17'
  quote: Stiftelsen Skånska Landskap ansvarar för skötseln av rundslingorna i sina
    19 strövområden.
- claim: Owns just over 2,300 hectares, including the Fulltofta recreation area, out
    of the foundations’ combined 10,759 hectares; manages the remaining land for five
    other foundations.
  url: https://skanskalandskap.se/sv/stiftelser-vi-forvaltar
  fetched: '2026-11-17'
  quote: Av stiftelsernas totala markinnehav på 10 759 hektar äger Stiftelsen Skånska
    Landskap drygt 2300 hektar, där Fulltofta strövområde ingår.
