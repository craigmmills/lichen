summary: BirdLife Sverige-run observatory whose trapping, standardised since 1972, BirdLife
  called the world’s longest such series in 2020, when over 30,000 birds were ringed by 12
  October.
facts:
- claim: In an October 2020 release, BirdLife Sverige said trapping had been standardised
    since 1972, allowing totals to monitor bird population changes, and described the series
    as the longest of its kind in the world.
  url: https://www.mynewsdesk.com/se/birdlifesverige/pressreleases/30-dot-000-faaglar-rekordaar-vid-ottenby-faagelstation-3042545
  fetched: '2026-11-08'
  quote: Sedan 1972 har fångsten bedrivits i standardiserad form vilket gör att fångstsummorna
    kan användas för övervakning av förändringar i fågelpopulationernas storlek. Denna fångstserie
    är den längsta av sitt slag i världen.
- claim: Had ringed more than 30,000 birds by 12 October 2020, exceeding every previous annual
    total at the station.
  url: https://www.mynewsdesk.com/se/birdlifesverige/pressreleases/30-dot-000-faaglar-rekordaar-vid-ottenby-faagelstation-3042545
  fetched: '2026-11-08'
  quote: Igår passerade fågelstationen dessutom 30.000 ringmärkta fåglar vilket aldrig tidigare
    skett under ett år vid Ottenby.
