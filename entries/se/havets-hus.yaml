summary: Organisation that has released about 200 tagged aquarium-bred sharks into the Gullmar
  Fjord since 2003, tracks them with acoustic transmitters from 2021, and released tagged
  cod with SLU in October 2023.
facts:
- claim: Since 2003 has released about 200 tagged aquarium-bred sharks into the Gullmar Fjord.
  url: https://www.havetshus.se/akvariet/bevarande/
  fetched: '2026-11-08'
  quote: Sedan 2003 har vi satt ut ca 200 märkta akvarieuppfödda hajar i Gullmarsfjorden.
- claim: From 2021 started a project with acoustic transmitters implanted in the sharks, picked
    up by receivers in the Gullmar Fjord and along the west coast, recording position, depth,
    acceleration, temperature and ID.
  url: https://www.havetshus.se/akvariet/bevarande/
  fetched: '2026-11-08'
  quote: Sändarna skickar ut ljudsignaler som fångas upp av mottagare som placerats ut i Gullmarsfjorden
    och utmed svenska västkusten. Sändarna registrerar position, djup, acceleration, temperatur
    och hajens ID.
- claim: In October 2023 released nearly 60 cod, 50 of them with telemetry transmitters, with
    SLU.
  url: https://www.havetshus.se/akvariet/bevarande/
  fetched: '2026-11-08'
  quote: I oktober 2023 sattes närmare 60 torskar ut, varav 50 med telemetrisändare, i samarbete
    med Sveriges Lantbruksuniversitet SLU.
