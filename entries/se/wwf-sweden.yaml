- claim: Says it started several projects in 2024 where AI was central.
  url: https://www.wwf.se/om-oss/goda-resultat/mer-effektiv-inventering-av-rovdjur-med-hjalp-av-ai/
  fetched: 2026-11-02
  quote: Under 2024 har WWF satt i gång flera projekt där användningen av artificiell intelligens
    varit central.
- claim: Says the AI work aims mainly to reduce conflict between people and large carnivores.
  url: https://www.wwf.se/om-oss/goda-resultat/mer-effektiv-inventering-av-rovdjur-med-hjalp-av-ai/
  fetched: 2026-11-02
  quote: Satsningen på ny AI-teknik syftar främst till att minska konflikterna mellan människor
    och stora rovdjur.
- claim: A WWF page describes Flox Intelligence’s AI system for detecting and diverting wolves,
    tested on sheep farms without any wolf recorded; validation in areas with many wolves
    was the next step.
  url: https://www.wwf.se/projekt/dronarbaserade-system-kan-avleda-varg-och-skydda-tamdjur/
