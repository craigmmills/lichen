facts:
- claim: In 2018, WWF and SLU invited the public to comment on a live broadcast from a seabird
    ledge on Stora Karlsö.
  url: https://www.ai.se/en/news/ai-hackathon-teach-us-more-about-baltic-sea
  fetched: '2026-11-02'
  quote: Last year, WWF and SLU invited the public to watch and comment on events in a live
    broadcast from one of the ledges on Stora Karlsö.
- claim: Says it has supported the seabird research on Stora Karlsö since 1997.
  url: https://via.tt.se/pressmeddelande/4368859/nu-startar-wwfs-livesandning-fran-sillgrisslornas-hackning?lang=sv
  fetched: '2026-11-02'
