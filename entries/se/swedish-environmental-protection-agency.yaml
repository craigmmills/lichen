summary: State agency for climate, environment and nature that forms national parks, manages
  wildlife nationally, is the CBD SBSTTA focal point, and partners with the Swedish Bird Survey.
facts:
- claim: Has central responsibility for protecting natural areas and coordinates several types
    of protection at national level.
  url: https://www.naturvardsverket.se/amnesomraden/skyddad-natur/sa-bildas-skyddade-omraden/vem-gor-vad-inom-skyddad-natur/
  fetched: '2026-11-02'
  quote: Naturvårdsverket har det centrala ansvaret för skyddet av naturområden och samordnar
    arbetet med flera olika typer av skydd på nationell nivå.
- claim: Handles the operational work of forming national parks.
  url: https://www.naturvardsverket.se/amnesomraden/skyddad-natur/sa-bildas-skyddade-omraden/vem-gor-vad-inom-skyddad-natur/
  fetched: '2026-11-02'
  quote: Naturvårdsverket svarar också för det operativa arbetet med att bilda nationalparker
- claim: Says it handles the selection and preparation of new national parks, with county
    administrative boards and other local actors.
  url: https://www.naturvardsverket.se/en/topics/protected-areas/different-types-of-nature-conservation/national-parks-in-sweden/
  fetched: 2026-11-02
  quote: The selection and preparations are handled by the Swedish Environmental Protection
    Agency together with county administrative boards and other local actors.
- claim: A state agency responsible for climate, environment and nature.
  url: https://www.naturvardsverket.se/om-oss/om-naturvardsverket/
  fetched: '2026-11-02'
  quote: Naturvårdsverket är en statlig myndighet som ansvarar för frågor om klimat, miljö
    och natur.
- claim: Responsible for forming national parks.
  url: https://www.naturvardsverket.se/om-oss/om-naturvardsverket/
  fetched: '2026-11-02'
  quote: Ansvarar för bildande av nationalparker genom projektledning vid bildande
- claim: The national agency responsible for wildlife management.
  url: https://www.naturvardsverket.se/om-oss/om-naturvardsverket/
  fetched: '2026-11-02'
  quote: Naturvårdsverket är den nationella myndighet som har ansvar för en effektiv viltförvaltning
- claim: The formal focal point for the CBD scientific body SBSTTA.
  url: https://www.naturvardsverket.se/om-miljoarbetet/internationellt-miljoarbete/internationella-miljokonventioner/konventionen-om-biologisk-mangfald-cbd
  fetched: '2026-11-02'
  quote: Naturvårdsverket är formell kontaktpunkt (focal point) för detta vetenskapliga organ.
- claim: Its CBD page says Sweden reported for the seventh time in 2026.
  url: https://www.naturvardsverket.se/om-miljoarbetet/internationellt-miljoarbete/internationella-miljokonventioner/konventionen-om-biologisk-mangfald-cbd
  fetched: '2026-11-02'
  quote: År 2026 redovisade Sverige för sjunde gången om vårt arbete för att följa konventionen.
