summary: Platform built by the University of Gothenburg and others for managing underwater
  image and video data, funded by Vinnova, Formas and the Swedish Research Council,
  and reported to identify marine species with machine learning.
facts:
- claim: A platform for managing and processing underwater image and video data.
  url: https://subsim.se/
  fetched: 2026-11-02
  quote: SUBSIM, a platform for efficient management and processing of underwater
    image and video data.
- claim: Lists a 2025 paper applying deep learning to a Swedish marine protected area.
  url: https://subsim.se/
  ai_type: deep-learning
  fetched: 2026-11-02
  quote: Applying deep learning to quantify drivers of long-term ecological change
    in a Swedish marine protected area.
- claim: SBDI says it became available through EDITO.
  url: https://biodiversitydata.se/news/2026/sbdi-tools-now-available-in-the-digital-twin-ocean-dto/
  fetched: 2026-11-02
  quote: SUBSIM, the Swedish platform for subsea image analysis, is now available
    through the European Digital Twin Ocean infrastructure EDITO.
- claim: The University of Gothenburg says it has been adapted with the Geological
    Survey of Sweden to help map Baltic Sea bottom environments.
  url: https://www.gu.se/en/news/ai-can-improve-monitoring-of-the-marine-environment
  fetched: 2026-11-02
  quote: the tool has been adapted to assist in the mapping of various bottom environments
    in the Baltic Sea, such as mussel banks.
- claim: A platform for underwater image and video data.
  url: https://subsim.se/
  fetched: '2026-11-02'
  quote: a platform for efficient management and processing of underwater image and
    video data
- claim: The University of Gothenburg says it identifies marine species in photos
    and videos with machine learning.
  url: https://www.gu.se/en/news/ai-can-improve-monitoring-of-the-marine-environment
  fetched: '2026-11-02'
  quote: The digital tool SUBSIM identifies marine species in photographs and videos
    using machine learning and artificial intelligence.
- claim: EMBRC reports results from 4.4 million images run on NAISS.
  url: https://www.embrc.eu/ai-underwater-image-analysis-koster-fjord/
  fetched: '2026-11-02'
  quote: Using the National Academic Infrastructure for Supercomputers in Sweden (NAISS),
    the model produced robust results from 4.4 million images in just a few hours.
