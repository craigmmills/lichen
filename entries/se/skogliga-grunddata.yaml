  quote: I produkten ingår sex kartskikt som beskriver volym, grundyta, grundytevägd
    medelhöjd, grundytevägd medeldiameter och biomassa.
- claim: Nationwide geodata describing forest and land.
  url: https://www.skogsstyrelsen.se/e-tjanster-och-kartor/karttjanster/skogliga-grunddata/
  fetched: '2026-11-02'
  quote: Skogliga grunddata är rikstäckande geodata som beskriver skogen och marken.
- claim: Values come from statistical models combining laser scanning with field measurements.
