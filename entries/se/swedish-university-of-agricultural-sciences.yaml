facts:
- claim: Leads the seabird monitoring project on Stora Karlsö, according to a video software
    supplier.
  url: https://www.milestonesys.com/customer-stories/video-research-tools/
  fetched: '2026-11-02'
  quote: Led by the Swedish University of Agricultural Sciences (SLU), this ambitious project
    relies on Milestone Systems’ XProtect open platform video management software (VMS)
- claim: Contributes to SBDI, whose Deputy Director sits at SLU.
  url: https://biodiversitydata.se/uploads/SBDI-Organizational-and-Technical-Overview.pdf
  fetched: '2026-11-02'
  quote: The Executive Office (ExO) is located at NRM (Director, Project Coordinator) and
    SLU (Deputy Director).
- claim: Says its main locations are Alnarp, Uppsala and Umeå.
  url: https://www.slu.se/en/research/research-infrastructures/research-infrastructures-at-slu-open-to-external-users/wram/about-wram/
  fetched: 2026-11-02
  quote: SLU, the Swedish University of Agricultural Sciences, has its main locations in Alnarp,
    Uppsala and Umeå.
- claim: SBDI says four SLU departments take part and contribute data, from citizen science
    to systematic monitoring.
  url: https://biodiversitydata.se/about/organization/consortium-partners/
  fetched: 2026-11-02
  quote: All SLU partners also contribute significant amounts of data from their respective
