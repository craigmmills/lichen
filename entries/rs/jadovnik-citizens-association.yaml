summary: Citizens' association linked by UNDP Serbia to a watering troughs project under the EU Green
  Agenda initiative, with cameras on Jadovnik recording bears leaving winter dormancy.
facts:
- claim: UNDP Serbia reports that the project "Watering troughs for strictly protected animal species"
    was carried out by the association, and that cameras on Jadovnik recorded bears emerging from winter
    dormancy.
  url: https://www.undp.org/serbia/news/why-do-bears-wake-middle-winter-dinaric-mountains
  fetched: 2026-11-08
  quote: This sight would not have been available to the public had it not been for the project “ Watering
    troughs for strictly protected animal species ”, implemented by the Jadovnik Citizens’ Association
    .
- claim: UNDP Serbia reports that the project installed video equipment for continuous monitoring of animal
    movement at the feeding station and in the surrounding forest.
  url: https://www.undp.org/serbia/news/why-do-bears-wake-middle-winter-dinaric-mountains
  fetched: 2026-11-08
  quote: One of the project’s most important innovations is the installation of modern video equipment,
    which enable continuous monitoring of animal movement
- claim: UNDP Serbia says the project was carried out within the EU for the Green Agenda in Serbia initiative,
    implemented by UNDP.
  url: https://www.undp.org/serbia/news/why-do-bears-wake-middle-winter-dinaric-mountains
  fetched: 2026-11-08
  quote: The project was implemented within the EU for the Green Agenda in Serbia initiative
