summary: Tara brown bear tracking project with Tara National Park and Telekom Srbija,
  which fitted a camera collar to a male in summer 2021, described as a first in Serbia,
  and a camera transmitter to a female two years later.
facts:
- claim: In summer 2021 a male brown bear on Tara was fitted with a GPS/GSM collar
    with a camera, which Telekom Srbija describes as a first in Serbia.
  url: https://mts.rs/About-Telekom/Social-responsibility/a122263-Motherhood-in-the-wild-New-secrets-from-the-lives-of-brown-bears-unveiled.html
  fetched: 2026-11-12
  quote: It was then that the male called Aleksandar of the Tara Mountain was tagged
    by a GPS/GSM collar with a camera.
- claim: Two years later a satellite transmitter with a camera was deployed on a female,
    tracked for ten months.
  url: https://mts.rs/About-Telekom/Social-responsibility/a122263-Motherhood-in-the-wild-New-secrets-from-the-lives-of-brown-bears-unveiled.html
  fetched: 2026-11-12
  quote: Two years later, for the first time in this country, a satellite transmitter
    with a camera was deployed on a brown bear female.
