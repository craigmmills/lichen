    policy, forest conservation and protection, and inspection in forestry and hunting.
  url: https://upravazasume.gov.rs/
  fetched: 2026-11-15
  quote: Управа за шуме обавља послове државне управе и стручне послове који се односе
    на политику шумарства
- claim: FAO, as the GEF project's implementing agency, delivered the final data of
    the Second National Forest Inventory to the Ministry's Forest Directorate.
  url: https://upravazasume.gov.rs/
  fetched: 2026-11-15
  quote: доставила је Министарству пољопривреде, шумарства и водопривреде – Управи
