summary: Novi Sad-based society founded in 1989, which says it has researched birds for over 30 years
  and became a CEPF implementation partner for the Balkans in 2019.
facts:
- claim: Says it has researched birds and nature for over 30 years and that the data its staff, members
    and collaborators collect are the largest source of information on the nature of Serbia.
  url: https://pticesrbije.rs/
  fetched: 2026-11-08
  quote: Duže od 30 godina istražujemo ptice i prirodu, a podaci koje naši zaposleni, članovi i saradnici
    prikupe
- claim: A Novi Sad news site reports that the society called on the public to join the International
    Waterbird Census, and that the monitoring began in 1966.
  url: https://www.021.rs/zivot/svet-zivotinja/431859/drustvo-za-zastitu-ptica-srbije-poziva-gradjane-prikljucite-se-popisu-ptica-vodenih-stanista
  fetched: 2026-11-08
  quote: Društvo za zaštitu i proučavanje ptica Srbije pozvalo je građane da se priključite Međunarodnom
    popisu ptica vodenih staništa (International Waterbird Census - IWC).
- claim: The January 2026 report says monitoring began in 1966 and describes the winter 2026 count as
    the 60th.
  url: https://www.021.rs/zivot/svet-zivotinja/431859/drustvo-za-zastitu-ptica-srbije-poziva-gradjane-prikljucite-se-popisu-ptica-vodenih-stanista
  fetched: 2026-11-08
  quote: Monitoring je započet još davne 1966. godine, a ove zime je 60. po redu.
- claim: Biologer says its new server was funded through the Swedish-funded project "Eco network for the
    future of Serbia", carried out by Young Researchers of Serbia in partnership with the society.
  url: https://biologer.org/
  fetched: 2026-11-08
  quote: The project was realised by Young Researchers of Serbia in partnersheep with Bird Protection
    and Study Society of Serbia .
- claim: Says it has managed the winter waterbird census in Serbia since 2012 and widened its volunteer
    network and the sites covered.
  url: https://pticesrbije.rs/programi/
  fetched: 2026-11-08
  quote: Od 2012. godine, od kada DZPPS rukovodi zimskim popisom ptica, povećana je mreža volontera-saradnika
- claim: Says it collects and processes data for the first breeding bird atlas of Serbia alongside the
    European Breeding Bird Atlas 2.
  url: https://pticesrbije.rs/programi/
  fetched: 2026-11-08
  quote: U sklopu izrade evropskog uporedo prikupljamo i obrađujemo podatke za potrebe izrade i prvog
    Atlasa ptica gnezdarica Srbije.
- claim: Founded in Novi Sad in 1989 as the Bird Protection and Study Society of Vojvodina, and renamed
    in 2010.
  url: https://pticesrbije.rs/ko-smo-mi/
  fetched: 2026-11-08
  quote: 2010. se dešava strukturna reforma i organizacija menja ime u Društvo za zaštitu i proučavanje
    ptica Srbije – DZPPS.
- claim: Its head office is in Novi Sad, with an office in Belgrade.
  url: https://pticesrbije.rs/programi/
  fetched: 2026-11-08
  quote: Radomira Raše Radujkova 1a/211, 21000 Novi Sad
- claim: Became a CEPF implementation partner for the Balkans in 2019 and began awarding funds to other
    organisations.
  url: https://pticesrbije.rs/ko-smo-mi/
  fetched: 2026-11-08
  quote: 2019. Društvo postaje CEPF (Critical Ecosystem Partnership Fund) implementacioni partner za Balkan
    i započinje dodelu sredstava drugim organizacijama
- claim: Biologer's funding page says it developed BirdLoger.
  url: https://info.biologer.org/pages/funding/
  fetched: 2026-11-08
  quote: BirdLoger was developed by Bird Protection and Study Society of Serbia.
