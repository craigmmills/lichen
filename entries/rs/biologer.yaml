website: https://biologer.org/
summary: Open source platform for collecting and digitising data on Eastern European biodiversity, built
  by the University of Niš biology department, with volunteer records, a butterfly counting app and local
  community sites.
facts:
- claim: Describes the project as an interactive platform with open content for collecting and digitising
    knowledge about the biological diversity of Eastern Europe, based on open source Biologer software
    and volunteer work.
  url: https://biologer.hr/pages/about/about-project
  fetched: 2026-11-08
  quote: The Biologer project was created as interactive platform with open content, intended for collecting
    and digitalising the knowledge about biological diversity of Eastern Europe.
- claim: Its Android app supports a 15-minute butterfly count for monitoring species trends.
  url: https://biologer.org/
  fetched: 2026-11-08
  quote: You need to install Biologer for Android on your phone and logg in. In Biologer you can count
    butterflies by long pressing the "+" button and choosing "timed count".
- claim: Says its new web server and site were made possible by Swedish funding through the project "Eco
    network for the future of Serbia", carried out by Young Researchers of Serbia with the Bird Protection
    and Study Society of Serbia.
  url: https://biologer.org/
  fetched: 2026-11-08
  quote: The project was realised by Young Researchers of Serbia in partnersheep with Bird Protection
    and Study Society of Serbia .
- claim: Says a new Biologer community runs in Montenegro at biologer.me.
  url: https://biologer.org/
  fetched: 2026-11-08
  quote: A new Biologer community is now running in Montenegro at biologer.me
- claim: Describes itself as an interactive platform with free content for collecting and digitising knowledge
    about the biological diversity of Eastern Europe.
  url: https://info.biologer.org/pages/about/index.html
  fetched: 2026-11-08
  quote: The Biologer project was created as interactive platform with free content, intended for collecting
    and digitalising the knowledge about biological diversity of Eastern Europe.
- claim: Says it is an initiative with no single organisation behind it, led by a project team delegated
    by supporting organisations.
  url: https://info.biologer.org/pages/about/index.html
  fetched: 2026-11-08
  quote: You could realise by now that there is not a single Organisation standing behind Biologer.
- claim: Has local community platforms, each with its own administrators, editors and users, including
    biologer.hr, biologer.rs and biologer.ba.
  url: https://info.biologer.org/pages/about/index.html
  fetched: 2026-11-08
  quote: Each local Biologer platform (e.g. biologer.hr , biologer.rs or biologer.ba ) has its own Local
    community made of Administrators , Editors and Users .
- claim: The software is free and published under the MIT licence.
  url: https://info.biologer.org/pages/about/index.html
  fetched: 2026-11-08
  quote: Note that Biologer is free software, published under MIT license
- claim: The app supports 15-minute butterfly counts, with records checked by editors.
  url: https://info.biologer.org/posts/monitoring-butterflis-using-15-minute-count/
  fetched: 2026-11-08
  quote: In Biologer you can do this by long pressing the "+" button and choosing "time count".
- claim: Development of the platform continued through the "Eco network for the future of Serbia" project,
    part of the ECO-SYSTEM programme carried out by Young Researchers of Serbia and supported by Sweden.
  url: https://info.biologer.org/pages/funding/
  fetched: 2026-11-08
  quote: Development of entire software platform was continued in the course of the project "Eco network
    for the future of Serbia", as part of ECO-SYSTEM program realised by Young Researchers of Serbia ,
    and supported by Sweden .
