facts:
- claim: The project aims to carry out detailed floristic surveys and spatial mapping
    of species distributions with GPS and GIS.
  url: https://www.rufford.org/projects/nenad-zlatic/monitoring-and-assessment-in-the-serpentinite-habitat-of-brdjani-gorge/
