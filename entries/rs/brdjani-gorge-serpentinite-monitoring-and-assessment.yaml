  quote: to conduct detailed floristic surveys and spatial mapping of species distributions
    using GPS and GIS technologies
- claim: It aims to expand the survey area from 15 ha to about 50 ha, about 80% of
    the serpentinite zone.
  url: https://www.rufford.org/projects/nenad-zlatic/monitoring-and-assessment-in-the-serpentinite-habitat-of-brdjani-gorge/
