  and partners with EURING.
facts:
- claim: Organises the monitoring and study of animal movements at local to intercontinental
    level, mostly of birds and to a lesser extent bats.
  url: https://nhmbeo.rs/centar-za-markiranje-zivotinja/?pismo=lat
  fetched: 2026-11-13
  quote: Centar za markiranje životinja organizuje praćenje i proučavanje kretanja
    životinja na lokalnom, regionalnom, kontinentalnom i interkontinentalnom nivou.
- claim: The national centre was founded in 1993 within the Natural History Museum
    in Belgrade.
  url: https://nhmbeo.rs/centar-za-markiranje-zivotinja/?pismo=lat
  fetched: 2026-11-13
  quote: Nacionalni Centar za markiranje životinja osnovan je 1993. godine u okviru
    Prirodnjačkog muzeja u Beogradu.
- claim: A member of EURING since 1997 and taking part in the European Constant Effort
    Sites project since 2005.
  url: https://nhmbeo.rs/centar-za-markiranje-zivotinja/?pismo=lat
  fetched: 2026-11-13
  quote: Od 1997, Centar je član Evropske unije za prstenovanje ptica – EURING, a
    od 2005. učestvuje u evropskom CES (The Constant Effort Sites) projektu.
- claim: Has marked more than 300,000 birds and about 10,000 bats since it was founded.
  url: https://nhmbeo.rs/centar-za-markiranje-zivotinja/?pismo=lat
  fetched: 2026-11-13
  quote: Od osnivanja, prstenovima Centra markirano je više od 300.000 ptica i oko
    10.000 slepih miševa.
- claim: Supplies rings, schedules training exams and issues marking permits.
  url: https://nhmbeo.rs/centar-za-markiranje-zivotinja/?pismo=lat
  fetched: 2026-11-13
  quote: Centar obezbeđuje prstenove, zakazuje ispite za osposobljavanje saradnika
    i izdaje dozvole za markiranje.
