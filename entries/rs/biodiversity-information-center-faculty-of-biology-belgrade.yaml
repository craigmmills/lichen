facts:
- claim: Founded in 2006 as a separate organisational unit of the Faculty of Biology.
  url: https://bio.bg.ac.rs/en/organizacija/centri/centar-za-informaci%D1%98e-o-biodiverzitetu/
  fetched: 2026-11-08
  quote: The Biodiversity Information Center was founded in 2006 and operates as a separate organizational
    unit of the Faculty of Biology
- claim: Says it has carried out projects on the ecological network of Serbia, Natura 2000 and red lists
    continuously since 2006 for the Institute for Nature Conservation of Serbia.
  url: https://bio.bg.ac.rs/en/organizacija/centri/centar-za-informaci%D1%98e-o-biodiverzitetu/
  fetched: 2026-11-08
  quote: The Center has been implementing these three projects continuously since 2006 for the needs of
    the Serbian Institute for Nature Conservation.
- claim: Says it provides NGOs and individuals, on official request, with data on species and habitats
    of conservation importance in areas affected by construction or land use.
  url: https://bio.bg.ac.rs/en/organizacija/centri/centar-za-informaci%D1%98e-o-biodiverzitetu/
  fetched: 2026-11-08
  quote: it provides data on species and habitats of conservation importance that are present in areas
    that are under various negative impacts of construction or land use.
- claim: Founded in 2006 as a separate organisational unit of the Faculty of Biology.
  url: https://bio.bg.ac.rs/organizacija/centri/centar-za-informaci%d1%98e-o-biodiverzitetu/
