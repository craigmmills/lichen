summary: Serbian forest monitoring system combining satellite observations, climate data and machine learning
  for vitality, fires and pests in all public forests, built and run by the Institute of Lowland Forestry
  and Environment.
facts:
- claim: Combines Sentinel-1, Sentinel-2, Landsat, MODIS and FIRMS observations with climate data and
    machine learning to give vitality indicators, automatic fire alarms and detection of disturbance in
    forest cover.
  url: https://blog.nimos.ilfe.org/
  fetched: 2026-11-08
  quote: sa klimatskim podacima i mašinskim učenjem. Rezultat su jasni pokazatelji vitalnosti, automatski
    požarni alarmi i detekcija poremećaja u šumskom pokrivaču
- claim: Covers vitality, fires and pests for all public forests in Serbia.
  url: https://blog.nimos.ilfe.org/
  fetched: 2026-11-08
  quote: Vitalnost, požari i štetočine za sve javne šume Srbije.
- claim: In its July 2026 account of the Blata-Malovanci fire, its early warning system checked satellite
    data every 15 minutes.
  url: https://blog.nimos.ilfe.org/studija-blata-malovanci.html
  fetched: 2026-11-08
  quote: proverava satelitske podatke svakih 15 minuta
- claim: On 29 May 2026, minister Sara Pavkov opened the promotion of the national forest vitality monitoring
    system, with the directors of ILFE, Srbijašume and the Forest Directorate speaking.
  url: https://blog.nimos.ilfe.org/
  fetched: 2026-11-08
  quote: Ministarka Sara Pavkov otvorila je promociju nacionalnog sistema za praćenje vitalnosti šuma.
- claim: NIS lists among projects it supported in 2026 a grant of 3,000,000 dinars to the institute for
    a secure data storage system to keep NIMOS running reliably.
  url: https://www.nis.rs/rezultati-zajednici-zajedno-2026/
  fetched: 2026-11-08
  quote: koji će obezbediti pouzdan rad nacionalnog sistema NIMOS
