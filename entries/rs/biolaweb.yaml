  quote: The EU-funded BIOLAWEB project will strengthen the research and innovation capacity in biodiversity
    assessment and biomonitoring at the Institute of Chemistry, Technology and Metallurgy, University
    of Belgrade via application of such cutting-edge methods.
- claim: Ran from 1 October 2022 to 30 September 2025.
