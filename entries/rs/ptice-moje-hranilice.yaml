summary: Citizen science feeder bird count run by the Bird Protection and Study Society
  of Serbia since 2019, in which 811 observers reported 21,540 birds in results reported
  February 2024.
facts:
- claim: In results reported in February 2024, 811 observers across Serbia counted
    and reported 21,540 birds of more than 75 species for this citizen science feeder
    count.
  url: https://pticesrbije.rs/sirom-srbije-se-broje-ptice-rezulati-akcije-ptice-moje-hranilice/
  fetched: 2026-11-13
  quote: učestvovalo rekordnih 811 posmatrača, koji su zajedno širom Srbije izbrojali
    i dostavili podatke o 21.540 jedinki preko 75 različitih vrsta ptica.
- claim: Organised since 2019, it teaches citizens to count birds and submit their
    findings to help collect data.
  url: https://pticesrbije.rs/sirom-srbije-se-broje-ptice-rezulati-akcije-ptice-moje-hranilice/
  fetched: 2026-11-13
  quote: „Ptice moje hranilice“ je jedinstvena akcija koja se organizuje od 2019.
