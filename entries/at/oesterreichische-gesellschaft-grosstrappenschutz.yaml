  habitat monitoring analysed with GIS.
facts:
- claim: The association was founded in 2004 at the request of the nature conservation
    departments of Lower Austria and Burgenland.
  url: https://www.grosstrappe.at/de/kontakt/oegg.html
  fetched: 2026-11-12
  quote: Aus Gründen der Effizienzsteigerung wurde im Jahr 2004 auf Wunsch der beiden
    Abteilungen für Naturschutz der Länder Niederösterreich und Burgenland der Verein
    "Österreichische Gesellschaft Großtrappenschutz (ÖGG)" gegründet.
- claim: Its chair gives an address in Zurndorf.
  url: https://www.grosstrappe.at/de/kontakt/oegg.html
  fetched: 2026-11-12
  quote: A-2424 Zurndorf
- claim: Was project holder of the LIFE project on cross-border protection of the
    great bustard in Central Europe, which ran from July 2016 to December 2023.
  url: https://www.bmluk.gv.at/themen/wasser/wasser-eu-international/eu-foerderprogramme/life-natur/life-projekte-aktuell/grosstrappe-grenz%C3%BCberschreitender-schutz.html
  fetched: 2026-11-12
  quote: 'Projektträger: Österreichische Gesellschaft Großtrappenschutz'
- claim: The project provided for monitoring of population size and habitats in all
    project areas, analysed with GIS.
  url: https://www.bmluk.gv.at/themen/wasser/wasser-eu-international/eu-foerderprogramme/life-natur/life-projekte-aktuell/grosstrappe-grenz%C3%BCberschreitender-schutz.html
  fetched: 2026-11-12
  quote: Ein Monitoring der Populationsgröße und der Lebensräume erfolgt in allen
    Projektteilbereichen in enger Zusammenarbeit mit der lokalen Bevölkerung und wird
    mit Geographischen Informationssystemen ( GIS ) ausgewertet.
