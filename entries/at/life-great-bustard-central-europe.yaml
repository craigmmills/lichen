summary: Project run by the Österreichische Gesellschaft Großtrappenschutz from 2016
  to 2023, which planned GPS transmitters for 24 adult female great bustards in Austria
  and Hungary and provided for population and habitat monitoring with GIS analysis.
facts:
- claim: The 2016–2023 project planned to fit 24 adult female great bustards in Austria
    and Hungary with GPS-based transmitters.
  url: https://www.bmluk.gv.at/themen/wasser/wasser-eu-international/eu-foerderprogramme/life-natur/life-projekte-aktuell/grosstrappe-grenz%C3%BCberschreitender-schutz.html
  fetched: 2026-11-12
  quote: Insgesamt werden in Österreich und Ungarn 24 erwachsene, weibliche Großtrappen
    mit GPS -basierten Sendern ausgestattet.
- claim: The 2016–2023 project provided for monitoring population size and habitats
    in all project areas, with GIS analysis.
  url: https://www.bmluk.gv.at/themen/wasser/wasser-eu-international/eu-foerderprogramme/life-natur/life-projekte-aktuell/grosstrappe-grenz%C3%BCberschreitender-schutz.html
  fetched: 2026-11-12
  quote: Ein Monitoring der Populationsgröße und der Lebensräume erfolgt in allen
    Projektteilbereichen in enger Zusammenarbeit mit der lokalen Bevölkerung und wird
    mit Geographischen Informationssystemen ( GIS ) ausgewertet.
- claim: Ran from 25 July 2016 to 31 December 2023.
  url: https://www.bmluk.gv.at/themen/wasser/wasser-eu-international/eu-foerderprogramme/life-natur/life-projekte-aktuell/grosstrappe-grenz%C3%BCberschreitender-schutz.html
