summary: Project aiming to produce at least 5,000 open-access DNA barcodes in the
  BOLD database for at least 1,500 Austrian animal, plant and fungal species, run
  by Austrian Barcode of Life and funded by the Biodiversitätsfonds.
facts:
- claim: Aims to produce at least 5,000 DNA barcodes for at least 1,500 species of
    animals, plants and fungi found in Austria.
  url: https://www.abol.ac.at/project/abol-refdat/
  fetched: 2026-11-12
  quote: Das ABOL-Projekt RefDat hat zum Ziel, mindestens 5.000 DNA-Barcodes für mindestens
    1.500 Arten von Tieren, Pflanzen und Pilzen , die in Österreich vorkommen, zu
    erstellen.
- claim: The barcodes will be available open access in the international BOLD database.
  url: https://www.abol.ac.at/project/abol-refdat/
  fetched: 2026-11-12
  quote: Die dabei erstellten DNA-Barcodes werden in der internationalen Datenbank
    BOLD für zahlreiche Anwendungen Open Access zur Verfügung stehen.
- claim: Its project leads are Elisabeth Haring and Nikolaus Szucsich of the Natural
    History Museum Vienna.
  url: https://www.abol.ac.at/project/abol-refdat/
  fetched: 2026-11-12
  quote: Projektleitung Priv.-Doz. Dr. Elisabeth Haring Dr. Nikolaus Szucsich (NHM
    Wien)
