status: active
summary: Austrian Federal Forests project using AI-assisted acoustic analysis to monitor
  rare birds; a pilot with the Austrian Research Centre for Forests used 20 recorders
  in Nationalpark Kalkalpen and confirmed capercaillie from about 200,000 minutes
  of audio.
facts:
- claim: The Austrian Federal Forests increasingly use acoustic survey methods with
    AI-assisted analysis to monitor rare and endangered bird species.
  url: https://www.biologischevielfalt.at/service/chmnews/2026/aktives-zuhoeren-bundesforste-setzen-auf-akustisches-monitoring-fuer-seltene-vogelarten
  fetched: 2026-11-12
  quote: Daher setzen die Österreichischen Bundesforste (ÖBf) beim Monitoring verstärkt
    auf akustische Erhebungsmethoden mit KI-gestützter Auswertung.
- claim: Recordings are separated from other forest sounds with AI software, checked
    by experts and assigned to species.
  url: https://www.biologischevielfalt.at/service/chmnews/2026/aktives-zuhoeren-bundesforste-setzen-auf-akustisches-monitoring-fuer-seltene-vogelarten
  fetched: 2026-11-12
  quote: Nach Einholen der Rekorder werden die Tierlaut-Aufnahmen mit Hilfe von KI-Software
    von anderen Waldgeräuschen unterschieden, von Expert*innen überprüft und bestimmten
    Arten konkret zugeordnet.
- claim: A pilot study with the Austrian Research Centre for Forests installed 20
    recorders in Nationalpark Kalkalpen and confirmed capercaillie from about 200,000
    minutes of audio.
  url: https://www.biologischevielfalt.at/service/chmnews/2026/aktives-zuhoeren-bundesforste-setzen-auf-akustisches-monitoring-fuer-seltene-vogelarten
  fetched: 2026-11-12
  quote: 20 Audiorekorder, die im Zuge einer Pilotstudie gemeinsam mit dem Bundesforschungszentrum
    für Wald im Nationalpark Kalkalpen installiert wurden, gaben nun Aufschluss über
    das Auerhuhn-Vorkommen der Region.
