summary: Floodplain national park of more than 9,600 hectares, founded in 1996, which surveys
  bats by call recording and mist-netting and takes part in the BiKoS project.
facts:
- claim: Surveys bat populations in the park partly by recording calls and identifying the
    species, and partly by mist-netting.
  url: https://www.donauauen.at/aktuelles/blog/fledermausforschung-in-der-au
  fetched: 2026-11-07
  quote: Ein Teil der Erfassung erfolgt über die Aufzeichnung ihrer Rufe und die anschließende
    Artbestimmung.
- claim: Takes part in BiKoS, a project of four large protected areas in Lower Austria funded
    by the Province of Lower Austria and the EU.
  url: https://www.donauauen.at/aktuelles/blog/fledermausforschung-in-der-au
  fetched: 2026-11-07
  quote: an dem die vier Großschutzgebiete Wildnisgebiet Dürrenstein-Lassingtal, Biosphärenpark
    Wienerwald, Nationalpark Thayatal und Nationalpark Donau-Auen beteiligt sind.
- claim: Protects more than 9,600 hectares of floodplain landscape and was founded in 1996.
  url: https://www.donauauen.at/
  fetched: 2026-11-07
  quote: Der Nationalpark Donau-Auen bewahrt auf mehr als 9.600 Hektar Fläche die letzte große
    Flussauenlandschaft Mitteleuropas. Mit seiner Gründung im Jahr 1996
- claim: Describes itself as an open-air laboratory for research into natural processes.
  url: https://www.donauauen.at/
  fetched: 2026-11-07
  quote: Als großes Freiluftlabor bietet der Nationalpark Donau-Auen der Wissenschaft vielfältige
    Möglichkeiten, natürliche Prozesse und Zusammenhänge zu erforschen.
