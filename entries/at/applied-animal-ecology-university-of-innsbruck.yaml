summary: University of Innsbruck research group that runs DNA des Waldes, which began in May
  2022 to test eDNA monitoring of forest biodiversity from forest stream samples.
facts:
- claim: Launched a project in May 2022 testing eDNA monitoring of forest biodiversity from
    samples of streams in forests.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/the-dna-of-forests/
  fetched: 2026-11-07
  quote: This is precisely the starting point for the project launched in May 2022. We are
    investigating how suitable the method of eDNA monitoring is for recording the diversity
    of organisms in these habitats using samples from flowing waters in forests.
- claim: A researcher in the group works on monitoring invasive or endangered species with
    eDNA and co-founded Sinsoma, a University of Innsbruck spin-off.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/group-members/sint/
  fetched: 2026-11-07
  quote: Daniela is furthermore a co-founder of the Sinsoma GmbH, a spin-off company of the
    University of Innsbruck, where she is responsible for R&D.
