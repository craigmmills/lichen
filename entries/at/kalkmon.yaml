summary: Project led by Nationalpark Kalkalpen and funded by the Biodiversitätsfonds,
  which from August 2023 to October 2025 extended species monitoring to stepping-stone
  sites and linked it with neighbouring protected areas' monitoring systems.
facts:
- claim: The 2023–2025 project extended species monitoring in Nationalpark Kalkalpen
    to stepping-stone sites and linked it with the monitoring systems of neighbouring
    protected areas.
  url: https://www.kalkalpen.at/aktuelle-projekte
  fetched: 2026-11-12
  quote: In diesem Projekt wird das umfangreiche Artenmonitoring im Nationalpark Kalkalpen
    auf die Trittsteinflächen ausgeweitet und mit den Monitoringsystemen der Nachbarschutzgebiete
    – Wildnisgebiet Dürrenstein-Lassingtal und Nationalpark Gesäuse – vernetzt.
- claim: Ran from 11 August 2023 to 31 October 2025, with survey packages on wasps,
    Habitats Directive mosses, dragonflies and grasshoppers, and fungi.
  url: https://www.kalkalpen.at/aktuelle-projekte
  fetched: 2026-11-12
  quote: Im Projektzeitraum 11. August 2023 bis 31. Oktober 2025 konnten die konzipierten
    vier Erhebungspakte Wespen, FFH-Moose, Libellen und Heuschrecken sowie Funga mit
    Werkvertragnehmerinnen und Werkvertragnehmer erfolgreich umgesetzt werden
