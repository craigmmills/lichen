  with the European Environment Agency.
facts:
- claim: GBIF Austria's site says the Austrian initiative for mobilising biodiversity data
    is coordinated by the Umweltbundesamt.
  url: https://www.gbif.at
  fetched: 2026-11-07
  quote: Diese österreichische Initiative zur Mobilisierung von Biodiversitäts-Daten wird
    vom Umweltbundesamt koordiniert.
- claim: Published the 2020 report on monitoring habitat types and species of Community interest
    in Austria 2016 to 2018, prepared as the basis for the Article 17 report under the Habitats
    Directive, commissioned by the Austrian federal states.
  url: https://www.umweltbundesamt.at/fileadmin/site/publikationen/rep0734.pdf
  fetched: 2026-11-07
  quote: Diese Publikation wurde im Auftrag der österreichischen Bundesländer erstellt.
- claim: Its 2020 report gives its address as Spittelauer Lände 5, Vienna.
  url: https://www.umweltbundesamt.at/fileadmin/site/publikationen/rep0734.pdf
  fetched: 2026-11-07
  quote: Spittelauer Lände 5, 1090 Wien/Österreich
- claim: Set up under the Environmental Control Act of 1985 and a limited liability company
    since 1999, active in environmental protection and monitoring in Austria and Europe.
  url: https://www.umweltbundesamt.at/en/about-us
  fetched: 2026-11-07
  quote: In 1999 it received the legal status of a limited liability company. In our 40-year
    history we played an active role in environmental protection and monitoring in Austria
    and in Europe.
