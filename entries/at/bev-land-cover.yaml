  fetched: 2026-11-07
  quote: This detailed representation is based on remote sensing data, including digital orthophotos and
    elevation models, and is available at a resolution of 20 cm.
- claim: Generated by an automated classification of pixels by spectral, geometric and spatial properties.
  url: https://www.bev.gv.at/en/Press/News/Land-Cover.html
  fetched: 2026-11-07
  quote: The data is generated by an automated classification process that analyzes pixels based on spectral,
    geometric and spatial properties.
