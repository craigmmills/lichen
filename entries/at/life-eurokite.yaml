summary: Project led by the Mitteleuropäische Gesellschaft zur Erhaltung der Greifvögel,
  which from 2020 to 2025 fitted GPS trackers to raptors in about 40 areas in 12 countries;
  its database held 3,306 tagged red kites by December 2025.
facts:
- claim: From 2020 to 2025 red kites and other raptors were fitted with GPS trackers
    in about 40 project areas in 12 countries.
  url: https://www.life-eurokite.eu/de/unsere-voegel/zahlen-fakten.html
  fetched: 2026-11-12
  quote: Von 2020 bis 2025 wurden bzw. werden Rotmilane und andere Greifvögel (Seeadler,
    Kaiseradler, Wespenbussard & Schwarzmilan) in ca. 40 Projektgebieten in 12 Ländern
    mit GPS-Trackern ausgestattet
- claim: As of December 2025, the project database held 3,306 tagged red kites.
  url: https://www.life-eurokite.eu/de/unsere-voegel/zahlen-fakten.html
  fetched: 2026-11-12
  quote: 3.306 besenderte Rotmilane in der Datenbank des LIFE EUROKITE Projekts
- claim: A telemetry-based space-use analysis learns the behaviour of tagged birds
    by data mining and predicts where each species is likely to be from land use.
  url: https://www.life-eurokite.eu/de/unsere-voegel/zahlen-fakten.html
  fetched: 2026-11-12
  quote: Die telemetriebasierte Raumnutzungsanalyse tRNA erlernt durch „data mining“
    die Verhaltensweise von besenderten Vögeln
- claim: Runs from 7 December 2019 to 31 January 2027.
