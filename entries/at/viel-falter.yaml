summary: Volunteer butterfly monitoring programme at 480 Austrian sites, based at Innsbruck's
  Institute of Ecology, nationwide since 2023, with 310 volunteers recording 58,493 butterflies
  by the end of 2024.
facts:
- claim: Volunteers count butterflies at one of 480 selected sites across Austria using a
    standardised method.
  url: https://www.uibk.ac.at/de/newsroom/2025/eins-zwei-drei-viele-falter/
  fetched: 2026-11-07
  quote: indem sie an einem von 480 ausgewählten Standorten in ganz Österreich mittels einer
    standardisierten Erhebungsmethode Schmetterlinge zählen
- claim: Systematic monitoring began in Tyrol in 2018 with 100 sites and has run nationwide
    since 2023.
  url: https://www.uibk.ac.at/de/newsroom/2025/eins-zwei-drei-viele-falter/
  fetched: 2026-11-07
  quote: 2018 startete das systematische Monitoring in Tirol mit 100 Standorten, seit 2023
    wird Viel-Falter bundesweit mit vielen Partnern umgesetzt
- claim: Based at the Institute of Ecology of the University of Innsbruck.
  url: https://www.uibk.ac.at/de/newsroom/2025/eins-zwei-drei-viele-falter/
  fetched: 2026-11-07
  quote: Das Viel-Falter Monitoring ist am Institut für Ökologie der Universität Innsbruck
    beheimatet und wird von Johannes Rüdisser geleitet.
- claim: By the end of 2024, 310 volunteers had observed 58,493 butterflies.
  url: https://www.uibk.ac.at/de/newsroom/2025/eins-zwei-drei-viele-falter/
  fetched: 2026-11-07
  quote: Bisher haben 310 Freiwillige 58.493 Falter beobachtet und ihre Sichtungen dokumentiert
    (Stand Ende 2024).
