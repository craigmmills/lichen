summary: Citizen science platform for Austrian plants, fungi and animals, run by Naturschutzbund Österreich
  and science4you, reporting its millionth record and around 60 supporting specialists in August 2024.
facts:
- claim: Reached its millionth record in August 2024.
  url: https://naturschutzbund.at/newsreader-36/items/die-1-millionste-meldung-auf-naturbeobachtung-at.html?pdf=535
  fetched: 2026-11-07
  quote: Die 1-millionste Meldung auf naturbeobachtung.at ist da!
- claim: An August 2024 announcement said around 60 specialists supported the citizen scientists.
  url: https://naturschutzbund.at/newsreader-36/items/die-1-millionste-meldung-auf-naturbeobachtung-at.html?pdf=535
  fetched: 2026-11-07
  quote: Dies geschieht im Austausch mit rund 60 Fachexpert*innen
- claim: Says volunteers supply data on plants, fungi and animals as a contribution to biodiversity research
    in Austria.
  url: https://naturschutzbund.at/newsreader-36/items/die-1-millionste-meldung-auf-naturbeobachtung-at.html?pdf=535
  fetched: 2026-11-07
  quote: Hobbyforscher*innen wichtige Daten zu Pflanzen, Pilzen und Tieren liefern – als bedeutenden Beitrag
    zur Biodiversitätsforschung in Österreich
- claim: Holds 940,000 observations with 660,000 images; more than 60 experts help identify and check
    incoming records.
  url: https://naturschutzbund.at/das-online-portal-fuer-naturbeobachtungen.html
  fetched: 2026-11-07
  quote: Mittlerweile sind 940.000 Beobachtungen mit 660.000 Bildern dokumentiert. Mehr als 60 Fachleute
    aus allen biologischen Fachrichtungen helfen bei der Bestimmung und Prüfung der eingehenden Daten.
- claim: Its data were used in a study of painted lady migration published in Ecography.
  url: https://naturschutzbund.at/naturbeobachtung-at-hilft-der-wissenschaft.html
  fetched: 2026-11-07
  quote: In die Studie flossen auch Daten der Meldeplattform www.naturbeobachtung.at des Naturschutzbundes
    ein.
