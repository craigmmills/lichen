summary: Atlas published by BirdLife Österreich in spring 2024, showing distributions
  of all 235 bird species breeding in Austria in 2013 to 2018, from over 2.1 million
  citizen science records by more than 2,300 volunteers.
facts:
- claim: Shows on 680 pages the distribution of all 235 bird species that bred in
    Austria in 2013 to 2018 and compares them with the first Austrian atlas.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/brutvogelatlas/
  fetched: 2026-11-15
  quote: Der Brutvogelatlas stellt auf 680 Seiten die Verbreitungen aller 235 Vogelarten
    dar, die im Zeitraum 2013–2018 in Österreich gebrütet haben
- claim: Data were collected as citizen science, mainly through ornitho.at, by more
    than 2,300 volunteer mappers, who gathered more than 2.1 million records in six
    years.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/brutvogelatlas/
  fetched: 2026-11-15
  quote: 'Die Datenerhebung erfolgte in Form von Citizen Science, hauptsächlich über
    die Online-Meldeplattform ornitho.at: Mehr als 2.300 ehrenamtlich tätige Kartierer:innen
    sammelten in sechs Jahren mehr als 2,1 Millionen Datensätze.'
- claim: BirdLife Österreich published the new atlas in spring 2024.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/brutvogelatlas/
  fetched: 2026-11-15
  quote: haben wir im Frühling 2024 den neuen Österreichischen Brutvogelatlas veröffentlicht
