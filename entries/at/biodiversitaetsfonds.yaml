summary: Environment ministry funding line for Austrian biodiversity, which the ministry reported on 29
  June 2026 had funded 251 projects; a 2026 call has a 5 million euro budget.
facts:
- claim: The ministry describes the fund as the environment ministry's funding line for protecting, conserving
    and restoring Austria's biodiversity, including improving scientific knowledge of its state and development.
  url: https://www.bmluk.gv.at/service/presse/klima-umwelt/2026/neue-ausschreibung-des-oesterreichischen-biodiversitaetsfonds-gestartet.html
  fetched: 2026-11-07
  quote: Der Biodiversitätsfonds des Umweltministeriums ist eine wichtige Förderschiene für den Schutz,
    Erhalt und die Wiederherstellung der österreichischen Artenvielfalt.
- claim: On 29 June 2026, the ministry reported that 251 projects were funded from the fund.
  url: https://www.bmluk.gv.at/service/presse/klima-umwelt/2026/neue-ausschreibung-des-oesterreichischen-biodiversitaetsfonds-gestartet.html
  fetched: 2026-11-07
  quote: Derzeit werden bereits 251 Projekte zum Erhalt der Biodiversität in Österreich aus Mitteln des
    Biodiversitätsfonds gefördert.
- claim: The 2026 call, with a budget of 5 million euros and a deadline of 15 September 2026, covers ecosystem
    restoration and grassland butterfly monitoring with citizen science.
  url: https://www.bmluk.gv.at/service/presse/klima-umwelt/2026/neue-ausschreibung-des-oesterreichischen-biodiversitaetsfonds-gestartet.html
