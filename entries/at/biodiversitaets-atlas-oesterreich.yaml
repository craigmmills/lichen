summary: Free online portal, online since December 2019, run and built by the Biodiversity Hub, giving
  access to over 16 million species occurrence records, including citizen science data.
facts:
- claim: An online platform for exploring the diversity of organisms in Austria, run by the Biodiversity
    Hub at the University for Continuing Education Krems.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/institution/university-for-continuing-education-krems-danube-university-krems_22?id=4966
  fetched: 2026-11-07
  quote: die vom Biodiversitäts-Hub an der Universität für Weiterbildung Krems betrieben wird
- claim: Gives free access to over 16 million species occurrence records under Creative Commons licences.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/institution/university-for-continuing-education-krems-danube-university-krems_22?id=4966
  fetched: 2026-11-07
  quote: können im Atlas über 16 Mio. Funddaten von Arten kostenlos abgerufen und anhand der festgelegten
    Creative Commons Lizenzen verwendet werden
- claim: Includes data from citizen science projects.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/institution/university-for-continuing-education-krems-danube-university-krems_22?id=4966
  fetched: 2026-11-07
  quote: Neben Daten aus Museen und Forschungseinrichtungen sind auch Daten aus Citizen Science Projekten
    enthalten.
- claim: Free online portal for Austria's biodiversity data, online since December 2019.
  url: http://www.biodiversityatlas.at
  fetched: 2026-11-07
  quote: Online since December 2019 it provides open access to species occurrence data in Austria provided
    by various data partners.
- claim: GBIF Austria makes over 6 million species occurrence records available for inclusion in the atlas
    through a cooperation begun in November 2021.
  url: http://www.biodiversityatlas.at
  fetched: 2026-11-07
  quote: Durch diese Kooperation werden über 6 Millionen Datensätze zu Vorkommen von Tier-, Pflanzen-
    und Pilzarten für die Einbindung in den Atlas von der Initiative GBIF-Austria zur Verfügung gestellt.
- claim: A project funded by the science and research department of the Province of Lower Austria.
  url: https://biodiversityatlas.at/ueber-den-atlas/
  fetched: 2026-11-07
  quote: Der Biodiversitäts-Atlas Österreich ist ein von der Abteilung Wissenschaft und Forschung vom
    Land NÖ gefördertes Projekt.
