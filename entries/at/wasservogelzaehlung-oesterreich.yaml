  more than 330 participants each year.
facts:
- claim: BirdLife Österreich organises the waterbird counts across Austria together
    with the provincial coordinators; the main count is the midwinter count in January.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/wasservogelzaehlung/
  fetched: 2026-11-12
  quote: Wir organisieren zusammen mit den Koordinator:innen der Bundesländer die
    Zählungen in ganz Österreich. Der wichtigste Zähltermin ist die „Mittwinterzählung“
    im Jänner.
- claim: The counts record the numbers of migrating and wintering waterbirds.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/wasservogelzaehlung/
  fetched: 2026-11-12
  quote: Mit den Wasservogelzählungen werden die Bestände durchziehender und überwinternder
    Wasservögel erfasst.
- claim: BirdLife publishes reports on the results of the International Waterbird
    Census in Austria, including January 2024.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/wasservogelzaehlung/
  fetched: 2026-11-12
  quote: Bericht Ergebnisse der Internationalen Wasservogelzählung (IWC) in Österreich
    Jänner 2024
- claim: BirdLife's December 2025 article reports that more than 330 people take part
    each year in Austria.
  url: https://www.birdlife.at/artikel/die-internationale-wasservogelzaehlung-feiert-60-jahre/
  fetched: 2026-11-12
  quote: Über 330 Personen beteiligen sich jährlich in Österreich.
