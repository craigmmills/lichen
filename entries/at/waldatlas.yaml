summary: Free geodata platform on Austria's forests, natural hazards and protected
  areas, run by the federal ministry, with new tree species (14 classes) and tree
  height maps described as orientation aids only.
facts:
- claim: The geodata platform WALDATLAS is an initiative of the federal ministry BMLUK
    and gives free geodata on Austria's forests, natural hazards and protected areas.
  url: https://www.bmluk.gv.at/service/presse/wald/2026/waldatlas-eroeffnet-neuen-zugang-zu-oesterreichs-waeldern.html
  fetched: 2026-11-15
  quote: Die Geodatenplattform WALDATLAS ist eine Initiative des Bundesministeriums
    für Land- und Forstwirtschaft, Klima- und Umweltschutz, Regionen und Wasserwirtschaft
    (BMLUK).
- claim: New maps of tree species and tree heights were added; the tree species map
    has 14 classes and the tree height map 5 m height steps. Both are orientation
    aids and do not provide exact determinations.
  url: https://www.bmluk.gv.at/service/presse/wald/2026/waldatlas-eroeffnet-neuen-zugang-zu-oesterreichs-waeldern.html
  fetched: 2026-11-15
  quote: Zur leichteren Lesbarkeit wurde die Baumartenkarte in 14 praxisnahe Klassen
    unterteilt und die Baumhöhenkarte in 5-m-Höhenstufen berechnet.
- claim: The minister says it provides information on biodiversity and protection
    against natural hazards.
  url: https://www.bmluk.gv.at/service/presse/wald/2026/waldatlas-eroeffnet-neuen-zugang-zu-oesterreichs-waeldern.html
  fetched: 2026-11-15
  quote: Er liefert außerdem wichtige Informationen zur Biodiversität und zum Schutz
    vor Naturgefahren.
