summary: National park that joined a Helsinki-led European research data register pilot from
  January to October 2025 and participates in eLTER with the University of Graz.
facts:
- claim: From January to October 2025 took part in a pilot, led by the University of Helsinki,
    testing a Europe-wide register for ecological research data, and fed vegetation and climate
    data into it with the Wegener Center of the University of Graz.
  url: https://nationalpark-gesaeuse.at/service/news/gesaeuse-liefert-daten/
  fetched: 2026-11-07
  quote: Gemeinsam mit dem Wegener Center für Klima und Globalen Wandel der Universität Graz
    wurden Vegetations- und Klimadaten aufbereitet und erstmals in dieses zentrale Register
    eingespeist.
- claim: Takes part in eLTER with the Gesäuse-Johnsbachtal site and builds the infrastructure
    for it with the University of Graz.
  url: https://nationalpark-gesaeuse.at/service/news/gesaeuse-liefert-daten/
  fetched: 2026-11-07
  quote: Der Nationalpark Gesäuse beteiligt sich mit dem Standort Gesäuse-Johnsbachtal und
    baut zusammen mit der Universität Graz die hierfür notwendige Infrastruktur und methodische
    Expertise auf.
- claim: Its 13 climate stations record temperature, precipitation, radiation and other values
    every ten minutes.
  url: https://nationalpark-gesaeuse.at/service/news/gesaeuse-liefert-daten/
  fetched: 2026-11-07
  quote: Allein die 13 Klimastationen im Nationalpark erfassen im Zehn-Minuten-Takt Messwerte
    zu Temperatur, Niederschlag, Strahlung und vielen weiteren Parametern.
- claim: Says it is a national park under IUCN category II.
  url: https://nationalpark-gesaeuse.at
  fetched: 2026-11-07
  quote: Wir sind ein Nationalpark nach IUCN II
- claim: Its website has a section on research and monitoring.
  url: https://nationalpark-gesaeuse.at
  fetched: 2026-11-07
  quote: Forschung und Monitoring
- claim: Says monitoring has a fixed place in each of its research projects.
  url: https://nationalpark-gesaeuse.at/nationalpark-gesaeuse/forschung-und-monitoring/
  fetched: 2026-11-07
  quote: In jedem Forschungsprojekt nimmt das Monitoring einen festen Platz ein.
- claim: Says its research mandate derives from international requirements and the National
    Park Act.
  url: https://nationalpark-gesaeuse.at/nationalpark-gesaeuse/forschung-und-monitoring/
  fetched: 2026-11-07
  quote: Aus internationalen Vorgaben und dem Nationalparkgesetz leitet sich heute unser Forschungsauftrag
    ab
