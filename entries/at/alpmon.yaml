- claim: The AlpMon forest monitoring system, developed at the institute's remote
    sensing and geoinformation group, has a near real-time service for detecting and
    typing forest changes and a forest map service with tree species, forest type
    and canopy cover.
  url: https://www.joanneum.at/digital/projekte/alpmon-schadenserkennung-fuer-die-waldwirtschaft/
  fetched: 2026-11-15
  quote: 'Das am Institut Fernerkundung und Geoinformation entwickelte AlpMon-Waldmonitoring-System
    umfasst zwei Services: Ein nahezu Echtzeit-System zur raschen Detektion und Typisierung
    von Waldänderungen (Sturm, Schlägerung, etc.)'
- claim: Service 1 maps damaged and felled forest areas by time-series analysis within
    about 0 to 14 days, distinguishing windthrow, clear-cuts and insect damage.
