summary: Austria's first cross-border national park, covering about 90 square kilometres on
  Austrian territory, with long-term monitoring of birds, fish ecology and grazing, and frequent
  monitoring of about 40 saline lakes.
facts:
- claim: The federal research infrastructure database says the park's long-term monitoring
    programmes on bird populations, fish ecology and grazing let it provide biological data
    on flora and fauna.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/mapping/?id=5234
  fetched: 2026-11-07
  quote: Long-term monitoring programs regarding bird populations, fish ecology or the grazing
    management enable the cross-border National Park Neusiedler See - Seewinkel to provide
    biological data from flora and fauna.
- claim: Its approximately 40 saline lakes are monitored frequently for physical and biological
    parameters.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/mapping/?id=5234
  fetched: 2026-11-07
  quote: all approx. 40 saline lakes are monitored frequently regarding salinity, oxygen,
    temperature, color etc. and biological parameters such as species diversity and quantity
    of macrozoobenthos
- claim: Described as the first cross-border national park in Austria, covering about 90 square
    kilometres on Austrian territory.
  url: https://forschungsinfrastruktur.bmfwf.gv.at/en/mapping/?id=5234
  fetched: 2026-11-07
  quote: The Neusiedler See - Seewinkel National Park is the first cross-border National Park
    in Austria and the first Austrian National Park recognised by the IUCN.
