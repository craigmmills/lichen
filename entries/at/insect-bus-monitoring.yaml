website: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/insect-bus-monitoring-ibm/
summary: Active project using DNA analysis to document flying insects in Austria, collected
  on ÖBB Postbus vehicles, run by Innsbruck's applied animal ecology group and being extended
  from a 2021 Tyrol pilot to other provinces.
facts:
- claim: Uses DNA analysis to give the first large-scale documentation of flying insect populations
    and their species diversity in Austria.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/insect-bus-monitoring-ibm/
  fetched: 2026-11-15
  quote: Using DNA analysis , Insect Bus Monitoring (IBM) offers the first large-scale documentation
    of flying insect populations and their species diversity in Austria.
- claim: Insects are collected on the fronts and windscreens of ÖBB Postbus vehicles during
    regular journeys, and the eDNA is analysed at the Institute of Zoology with Sinsoma GmbH.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/insect-bus-monitoring-ibm/
  fetched: 2026-11-15
  quote: This eDNA (environmental DNA) is carefully tested and then analysed at the Institute
    of Zoology at the University of Innsbruck in cooperation with Sinsoma GmbH .
- claim: Is being extended to Tyrol, Carinthia, Upper Austria and Lower Austria after a 2021
    pilot in Tyrol.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/insect-bus-monitoring-ibm/
  fetched: 2026-11-15
  quote: With the ongoing expansion of the IBM project to the four federal states of Tyrol,
    Carinthia, Upper Austria and Lower Austria
