- claim: An October 2025 project announcement names it as consortium leader of BioDivAI,
    with planned tasks including AI development to model habitats and the effects
    of landscape changes for selected animal species in Austria.
  url: https://www.pentamap.com/
  fetched: 2026-11-12
  quote: Die wichtigsten technologischen Aufgaben von pentamap in BioDivAI werden
