- claim: A September 2022 project announcement lists DeerAI, which aims to develop
    AI for automatic recognition of wildlife in camera-trap images.
  url: https://www.pentamap.com/
  fetched: 2026-11-12
  quote: DeerAI hat die automatische Erkennung von Wildtieren in Wildkamerabildern
    zum Ziel.
- claim: An October 2024 announcement says SmartMowAI aims to extend AI methods to
    derive vegetation height for roadside mowing, using Vision Transformers; pentamap's
    planned main task is the proof of concept.
