summary: Earth observation project, finished in August 2025 after starting in September 2022, that aimed
  to support Austria's National Restoration Plan and reports a nationwide mowing detection system needing
  no training data.
facts:
- claim: Develops a monitoring system based on a combination of Earth observation data and field surveys.
  url: https://www.joanneum.at/fernerkundung-und-ki-biodiversitaet-von-oben-betrachtet/
  fetched: 2026-11-07
  quote: In Kooperation mit dem Umweltbundesamt, der Universität Graz und dem Institut E.C.O. wird hier
    ein Monitoringsystem entwickelt, das auf einer Kombination aus Erdbeobachtungsdaten und Felderhebungen
    basiert.
- claim: Combines field work with remote sensing data, especially from the Copernicus programme.
  url: https://www.joanneum.at/fernerkundung-und-ki-biodiversitaet-von-oben-betrachtet/
  fetched: 2026-11-07
  quote: Das Innovative an RestorEO ist die Verbindung von traditioneller Feldarbeit mit modernen Fernerkundungsdaten,
    insbesondere aus dem Copernicus-Programm.
