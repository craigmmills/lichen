  url: https://rfcx.org/projects/austria
  fetched: 2026-11-07
  quote: The goal was to answer a multitude of questions regarding the current conservation status and
    ecology of species in the reed belt of Lake Neusiedl
- claim: Used a deep learning pipeline with a convolutional neural network to classify species from spectrogram
