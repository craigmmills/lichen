summary: Programme run by BirdLife Österreich, counting breeding birds at fixed points twice each spring
  since 1998, and the source of the Farmland Bird Index, which shows indicator species down about 40 per
  cent over 28 years.
facts:
- claim: The breeding bird monitoring is the data source for the Austrian Farmland Bird Index.
  url: https://eu-cap-network.ec.europa.eu/sites/default/files/publications/2025-02/ev-at-report-farmland-bird-index-2022.pdf
  fetched: 2026-11-07
  quote: Datengrundlage für den österreichischen Farmland Bird Index ist das „Monitoring der Brutvö- gel
    Österreichs“
- claim: Counts at fixed points across Austria twice each spring since 1998, from which trends are calculated.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/monitoring-der-brutvoegel-oesterreichs/
  fetched: 2026-11-07
  quote: Dazu erfolgen seit 1998 zweimal pro Frühjahr Zählungen an festgelegten Punkten in ganz Österreich.
- claim: The Farmland Bird Index, from 23 farmland species, shows indicator species down by about 40 per
    cent over 28 years.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/monitoring-der-brutvoegel-oesterreichs/
  fetched: 2026-11-07
  quote: Im Durchschnitt sind die Bestände der Indikatorarten in den letzten 28 Jahren um etwa 40 % zurückgegangen.
- claim: The page says the Farmland Bird Index project is funded by the federal ministry then named for
    agriculture and forestry, regions and water management, and by the European Union.
  url: https://www.birdlife.at/vogelschutz/forschung-und-monitoring/monitoring-der-brutvoegel-oesterreichs/
  fetched: 2026-11-07
  quote: Dieses Projekt wird vom Bundesministerium für Land- und Forstwirtschaft, Regionen und Wasserwirtschaft
    sowie der Europäischen Union gefördert.
