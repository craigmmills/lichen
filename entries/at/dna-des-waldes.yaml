summary: Project run by Innsbruck's applied animal ecology group, funded by Waldfonds Österreich, planning
  DNA metabarcoding of 500 samples from two forest areas in the Zillertal and Karwendel nature parks.
facts:
- claim: Studies two forest areas, in the Zillertal and Karwendel nature parks.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/the-dna-of-forests/
  fetched: 2026-11-07
  quote: One of the forest areas investigated in this model study is in the Gunggl in the Zillertal Nature
    Park and the other is the Taschbach Valley in the Karwendel Nature Park.
- claim: Plans to analyse 500 samples from the two forest areas using DNA metabarcoding.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/the-dna-of-forests/
  fetched: 2026-11-07
  quote: For this project, 500 samples from the two areas will be analysed to characterise the biodiversity.
- claim: Financed from the Waldfonds Österreich by the federal ministry then named for agriculture, regions
    and tourism.
  url: https://www.uibk.ac.at/de/zoology/forschung/applied-animal-ecology/projects/the-dna-of-forests/
  fetched: 2026-11-07
  quote: Das Projekt wird aus Mitteln des Waldfonds Österreich vom Bundesministerium für Landwirtschaft,
    Regionen und Tourismus finanziert.
