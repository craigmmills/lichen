summary: Programme built and run by the Umweltbundesamt, founded in 2017/18 to document
  long-term biodiversity change in open farmland; its 2023/24 round mapped plants,
  grasshoppers and butterflies on 200 sites, with analyses starting from remote sensing
  data.
facts:
- claim: The Umweltbundesamt laid the foundation for the programme in 2017/18, to
    document long-term change in biodiversity in the open farmed landscape.
  url: https://www.biologischevielfalt.at/biodiversitaet-in-oesterreich/chm-monitoring/chm-oebm
  fetched: 2026-11-12
  quote: Mit dem Biodiversitäts-Monitoring der offenen Kulturlandschaft (ÖBM-Kulturlandschaft)
    legte das Umweltbundesamt in den Jahren 2017/18 den Grundstein, um die langfristige
    Entwicklung der biologischen Vielfalt auch für diesen Landschaftstyp zu dokumentieren.
- claim: In 2023/24 a second round mapped vascular plants, grasshoppers and butterflies
    on 200 sites across Austria.
  url: https://www.biologischevielfalt.at/biodiversitaet-in-oesterreich/chm-monitoring/chm-oebm
  fetched: 2026-11-12
  quote: In den Jahren 2023/24 haben die Expertinnen und Experten des Umweltbundesamts
    bzw. im Auftrag des Umweltbundesamts in einem zweiten Durchgang österreichweit
    Gefäßpflanzen, Heuschrecken und Tagfalter auf 200 Aufnahmeflächen kartiert.
- claim: Analyses started from remote sensing data, including NDVI in the sample sites
    and a national survey of land cover.
  url: https://www.biologischevielfalt.at/biodiversitaet-in-oesterreich/chm-monitoring/chm-oebm
  fetched: 2026-11-12
  quote: Neben der Bestimmung und geometrischen Abgrenzung einzelner Biotoptypen wurden,
    ausgehend von Fernerkundungsdaten, Analysen auf drei Ebenen durchgeführt
