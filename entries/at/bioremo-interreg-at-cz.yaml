summary: Cross-border Austria and Czech Republic project, planned for 2025 to 2028
  and led by Nationalpark Thayatal, to build a shared biodiversity database and a
  standardised monitoring protocol for selected species and habitats.
facts:
- claim: Aims first to build a shared cross-border database of biodiversity data,
    with an interface to the Nature Conservation Agency of the Czech Republic's database.
  url: https://vuk.gov.cz/project/bioremo-interreg-at-cz/
  fetched: 2026-11-12
  quote: Cílem projektu je za prvé vybudovat společnou přeshraniční databázi údajů
    o biodiverzitě, kterou lze dlouhodobě přenášet do jiných regionů.
- claim: Develops a standardised monitoring protocol for selected species and habitats,
    to be used by both national parks and conservation partners.
  url: https://vuk.gov.cz/project/bioremo-interreg-at-cz/
  fetched: 2026-11-12
  quote: Dalším pilířem projektu je vývoj standardizovaného monitorovacího protokolu
    pro vybrané druhy a stanoviště.
- claim: Planned outputs include geodata for biodiversity monitoring, a digital model
    of forest canopies and a set of lichen DNA sequences.
  url: https://vuk.gov.cz/project/bioremo-interreg-at-cz/
  fetched: 2026-11-12
