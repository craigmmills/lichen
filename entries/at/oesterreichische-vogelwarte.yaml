summary: Austrian bird ringing organisation whose ringing centre took over national
  ringing coordination from the Vogelwarte Radolfzell on 1 January 2016 and documents
  recoveries through international data exchange.
facts:
- claim: Its ringing centre took over the coordination of bird ringing in Austria
    on 1 January 2016, from the Vogelwarte Radolfzell.
  url: https://www.vetmeduni.ac.at/aoc/beringungszentrale
  fetched: 2026-11-12
  quote: Ab diesem Zeitpunkt übernimmt die neue Zentrale offiziell die Koordination
    der Vogelberingung in Österreich, welche bisher durch die Vogelwarte Radolfzell
    (Max-Planck Institut für Ornithologie) geleistet wurde.
- claim: The ringing centre coordinates ringing nationally and documents recoveries
    through international data exchange.
  url: https://www.vetmeduni.ac.at/aoc/beringungszentrale
  fetched: 2026-11-12
  quote: Ihre zentrale Aufgabe ist es, die Beringungen von Vögeln auf nationaler Ebene
    zu koordinieren und Fundmeldungen durch internationalen Datenaustausch zu dokumentieren.
- claim: Austria joined EURING, described on the page as the European organisation
    for scientific bird ringing, in September 2015 as part of establishing the centre.
  url: https://www.vetmeduni.ac.at/aoc/beringungszentrale
  fetched: 2026-11-12
  quote: Ein wichtiger Meilenstein in der Gründungsphase der Österreichischen Vogelwarte
    war die Aufnahme Österreichs als Mitglied in die Europäische Organisation für
    wissenschaftliche Vogelberingung EURING
- claim: The page gives the University of Veterinary Medicine Vienna's address in
