summary: A Western Cape government entity managing 31 nature reserve complexes with 112 reserves,
  which supports conservation through a Scientific Services Unit and at least four biodiversity
  information systems.
facts:
- claim: A government entity managing 31 nature reserve complexes comprising 112 nature reserves.
  url: https://www.capenature.co.za/about-us
  fetched: '2026-10-31'
  quote: CapeNature is a government entity responsible for managing and maintaining 31 nature
    reserve complexes comprising 112 nature reserves
- claim: A Schedule 3C Public Entity governed by a board under the Western Cape Biodiversity
    Act.
  url: https://www.capenature.co.za/about-us
  quote: CapeNature is a Schedule 3C Public Entity and is governed by a Board as established
    in terms of section 9 of the Western Cape Biodiversity Act, No. 6 of 2021.
  fetched: '2026-10-31'
- claim: SANBI says BGIS shares the Fine-scale Biodiversity Plans developed by CapeNature.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/biodiversitygis-bgis/
  quote: the Fine-scale Biodiversity Plans developed by CapeNature
  fetched: '2026-10-31'
- claim: Its Scientific Services Unit supports conservation management in the Western Cape.
  url: https://www.capenature.co.za/biodiversity-sciences
  fetched: '2026-10-31'
  quote: provides a professional scientific support service to conservation management in
    the Western Cape Province.
- claim: Maintains at least four biodiversity information systems.
  url: https://www.capenature.co.za/biodiversity-sciences
  fetched: '2026-10-31'
  quote: the maintenance of at least four biodiversity information management systems
- claim: Granted BirdLife South Africa and Panthera a research permit for a camera trap survey
    at De Hoop Nature Reserve.
  url: https://www.capenature.co.za
  fetched: '2026-10-31'
  quote: CapeNature granted BirdLife South Africa and Panthera a research permit to undertake
    a camera trap survey at De Hoop Nature Reserve.
- claim: Introduced additional permit conditions on the translocation, management, possession
    and keeping of game animals in response to Foot and Mouth Disease outbreaks.
  url: https://www.capenature.co.za
  fetched: '2026-10-31'
  quote: CapeNature has introduced additional permit conditions applicable to the translocation,
    management, possession, and keeping of wild animals
