summary: An institute whose citizen science projects, it says, supply 32 million of 47 million
  southern African GBIF records; it curates waterbird count data and is reported as a SABAP2
  funder.
facts:
- claim: The Biodiversity and Development Institute says SABAP2 is funded by the FitzPatrick
    Institute and SANBI.
  url: https://thebdi.org/?p=15564
  fetched: '2026-10-31'
  quote: is funded by the FitzPatrick Institute of African Ornithology and the South African
    National Biodiversity Institute
- claim: A June 2021 Biodiversity and Development Institute post said the institute co-managed
    the Virtual Museum.
  url: https://thebdi.org/2021/06/07/the-virtual-museum/
  fetched: '2026-10-31'
  quote: It is now managed by the Biodiversity and Development Institute (an independent non-profit
    company) and the FitzPatrick Institute of African Ornithology (UCT)
- claim: Curates Coordinated Waterbird Counts data.
  url: https://cwac.birdmap.africa/
  quote: the data is curated by the University of Cape Town's FitzPatrick Institute of African
    Ornithology
  fetched: '2026-10-31'
- claim: Says its citizen science projects contribute 32 million of 47 million southern African
    GBIF records.
  url: https://science.uct.ac.za/fitzpatrick/research-citizen-science/southern-african-bird-atlas-project-sabap2
  fetched: '2026-10-31'
  quote: citizen science projects coordinated by the FitzPatrick Institute contribute 32 million,
    representing 68% of the region’s data.
- claim: Its citizen science projects contribute 32 million of the 47 million southern African
    records on GBIF.
  url: https://science.uct.ac.za/fitzpatrick/research-citizen-science/southern-african-bird-atlas-project-sabap2
  fetched: '2026-10-31'
  quote: citizen science projects coordinated by the FitzPatrick Institute contribute 32 million,
    representing 68% of the region’s data
- claim: Hosts and manages an Integrated Publishing Toolkit installation on behalf of SANBI.
  url: https://science.uct.ac.za/fitzpatrick/research-citizen-science/southern-african-bird-atlas-project-sabap2
  fetched: '2026-10-31'
  quote: hosted and managed by the Fitz on behalf of SANBI
- claim: Postal address in Rondebosch.
