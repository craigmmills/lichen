summary: Web-based tool on the spatial distribution of carbon stocks and fluxes in South Africa, built
  by SAEON and the CSIR from the CSIR's 2014 assessment, with GIZ funding.
facts:
- claim: A web-based data and information tool on the spatial distribution of carbon stocks and fluxes
    across South Africa.
  url: https://csa.environment.gov.za/
  fetched: '2026-10-31'
  quote: The Carbon Sinks Atlas is a web-based data and information tool aimed at providing the spatial
    distribution of carbon stocks and fluxes across South Africa.
- claim: The CSIR and SAEON converted the National Terrestrial Carbon Sinks Assessment outputs into atlas
    format.
  url: https://csa.environment.gov.za/about
  fetched: '2026-10-31'
  quote: The CSIR in collaboration with SAEON later converted the NTCSA outputs into atlas format
- claim: The CSIR produced the assessment in 2014 and later worked with SAEON to turn it into an atlas.
  url: https://csa.environment.gov.za/about
  fetched: '2026-10-31'
  quote: In 2014 the CSIR (in partnership with a number of other organisations) produced the National
    Terrestrial Carbon Sinks Assessment for South Africa.
