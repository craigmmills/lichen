facts:
- claim: A September 2011 account says 25,000 hectares were restored to the Makuleke
    community following a 1999 court ruling, including northern Kruger's Pafuri area
    and a small conservation area near the Madimbo corridor, together known as the
    Makuleke Contractual Park.
  url: https://www.polity.org.za/article/land-restitution-community-rights-and-conservation-a-success-story-2011-09-13
  fetched: 2026-11-17
  quote: Following a 1999 Land Claims Court ruling in favour of the Makuleke, 25,000
    hectares were restored to the community.
- claim: A September 2011 account describes a Joint Management Board of Makuleke community
    and South African National Parks Board members established with final decision-making
    power over the contractual park.
  url: https://www.polity.org.za/article/land-restitution-community-rights-and-conservation-a-success-story-2011-09-13
  fetched: 2026-11-17
  quote: a Joint Management Board (with members from the Makuleke community and the
    South African National Parks Board) was established with final decision-making
    power.
- claim: A September 2011 account says the Outpost lodge contract entitled the community,
    through its Communal Property Association, to 14% of turnover, with 2% required
    to go to community bursaries.
  url: https://www.polity.org.za/article/land-restitution-community-rights-and-conservation-a-success-story-2011-09-13
  fetched: 2026-11-17
  quote: the Makuleke community (though its Communal Property Association (9) ) should
    receive 14% of the turnover generated by the high-value business
