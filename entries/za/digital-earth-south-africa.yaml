summary: Earth observation data platform built and run by the South African National Space Agency, with
  a beta launched in 2022 covering over 30 years of archived imagery, and partnered with SARAO.
facts:
- claim: Space in Africa reported in November 2022 that a beta version of the platform had been launched.
  url: https://spaceinafrica.com/2022/11/01/sansa-launches-digital-earth-south-africa-earth-observation-data-cubes-platform/
  fetched: '2026-10-31'
  quote: has launched a beta version of the Digital Earth South Africa ’s data cube platform
- claim: A November 2022 report said Digital Earth SA technology translated over 30 years of archived
    and newly acquired Earth observation imagery covering South Africa, SADC countries and other African
    countries.
  url: https://spaceinafrica.com/2022/11/01/sansa-launches-digital-earth-south-africa-earth-observation-data-cubes-platform/
  fetched: '2026-10-31'
  quote: Digital Earth SA technology translates over 30 years of archived Earth observation (EO) satellite
    imagery and newly acquired imagery
- claim: A November 2022 report said private sector access to the platform was limited to open satellite
    datasets; SANSA also offered commercial imagery products through customer services for a fee.
  url: https://spaceinafrica.com/2022/11/01/sansa-launches-digital-earth-south-africa-earth-observation-data-cubes-platform/
  fetched: '2026-10-31'
  quote: Non-governmental private sector users are allowed access only to the available tier of Digital
    Earth SA services, offering open satellite datasets
- claim: Listed in SANSA Earth Observation's portfolio as its data cubes.
  url: https://www.sansa.org.za/?p=16957
  quote: A comprehensive data cubes portfolio (Digital Earth South Africa).
  fetched: '2026-10-31'
- claim: At its October 2022 beta launch, SANSA described Digital Earth SA as translating over 30 years
    of archived satellite imagery and newly acquired imagery into information for government priorities
    and environmental management.
  url: https://www.sansa.org.za/2022/10/the-south-african-national-space-agency-sansa-launches-digital-earth-south-africa-digital-earth-sa-earth-observation-data-cubes-platform/
  quote: translates over 30 years of archived Earth Observation (EO) satellite imagery
  fetched: '2026-10-31'
- claim: Aims to distribute SANSA's 30-year archive of Earth observation data in usable formats.
  url: https://desa.sansa.org.za/about-us
  fetched: '2026-10-31'
  quote: Digital Earth South Africa (DESA) aims to leverage emerging technologies to deliver a unique
    capability
