summary: A programme conceptualised by the Department of Forestry, Fisheries and the Environment and built
  by the CSIR, which says it applies satellite remote sensing and geospatial information to support governance
  of South Africa's oceans and coasts.
facts:
- claim: Conceptualised by the Department of Forestry, Fisheries and the Environment to use existing observations
    and data to derive ocean knowledge.
  url: https://www.csir.co.za/how-sa-using-spatial-data-technology-coastal-and-oceans-monitoring
  fetched: '2026-10-31'
  quote: The system was conceptualised by the Department of Forestry, Fisheries and the Environment (DFFE)
    to use existing observations and data to derive ocean knowledge
- claim: According to the CSIR, it applies satellite remote sensing and geospatial information and provides
    wide area monitoring.
  url: https://www.csir.co.za/how-sa-using-spatial-data-technology-coastal-and-oceans-monitoring
  fetched: '2026-10-31'
  quote: OCIMS applies satellite remote sensing and geospatial information; provides operational wide
    area monitoring
