id: sanbi-gbif
kind: programme
name: SANBI-GBIF
scope: za
ai_label: data-infrastructure
status: active
also_known_as:
- SABIF
- South African Biodiversity Information Facility
realms:
- land
- freshwater
- ocean
summary: South African biodiversity data mobilisation programme run by SANBI, partnering with
  GBIF; its page cites over 12 million records mobilised, and a data library entry cites over
  32 million occurrences.
facts:
- claim: A SANBI notice says it works with partners to mobilise primary biodiversity data
    and make them available on the internet.
  url: https://www.sanbi.org/job/msc-biodiversity-informatics-bursaries-for-2020-x2/
  fetched: '2026-10-31'
  quote: SANBI-GBIF works with partners to mobilise primary biodiversity data, such as species,
    specimen and observation records and makes them available on the internet
- claim: A data library entry says it gives access to over 32 million species occurrences.
  url: https://library.award.org.za/dataset/sanbi-gbif-sabif-documentation
  fetched: '2026-10-31'
  quote: Provides access to over 32 million species occurrences from 9 data publishers in
    South Africa
- claim: Mobilises primary biodiversity information and makes it freely available on the internet.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/south-african-biodiversity-information-facility-sabif/
  quote: SABIF mobilises primary biodiversity information to make it freely available on the
    internet
  fetched: '2026-10-31'
- claim: Its secretariat is housed in SANBI's Biodiversity Information Management Directorate.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/south-african-biodiversity-information-facility-sabif/
  quote: the secretariat is housed in SANBI's Biodiversity Information Management Directorate
  fetched: '2026-10-31'
- claim: South Africa is a voting member of GBIF.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/south-african-biodiversity-information-facility-sabif/
  quote: South Africa is a voting member of the Global Biodiversity Information Facility
  fetched: '2026-10-31'
- claim: A network of national partners publishing data through the SANBI-GBIF portal or to
    GBIF.
  url: https://www.sanbi-gbif.org/about
  fetched: '2026-10-31'
  quote: SANBI-GBIF is a network consisting of key national partners and stakeholders who
    provide and publish data through the SANBI-GBIF portal or to GBIF directly
- claim: SANBI's page says SABIF has mobilised more than 12 million records.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/south-african-biodiversity-information-facility-sabif/
  fetched: '2026-10-31'
  quote: Mobilising more than 12 million records through partnerships and digitisation grants
- claim: Digitises species and specimen records with partners and publishes them on the SABIF
    and GBIF websites.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/south-african-biodiversity-information-facility-sabif/
  fetched: '2026-10-31'
  quote: digitise species and specimen records and make them accessible on the SABIF and GBIF
