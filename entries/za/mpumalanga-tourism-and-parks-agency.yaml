    farms on species of conservation concern.
- claim: Scientific Services aims to establish a Centre of Excellence to provide the scientific
    foundation for its biodiversity conservation and natural resources mandate.
  url: https://www.mpumalanga.com/corporate-information/programmes/biodiversity-conservation/scientific-services
