summary: A research council that researched and implemented the Oceans and Coastal Information
  System in 2016 and partners with Peace Parks Foundation.
facts:
- claim: Researched, developed and implemented the Oceans and Coastal Information System in
    2016 under contract to the then Department of Environmental Affairs.
  url: https://www.csir.co.za/how-sa-using-spatial-data-technology-coastal-and-oceans-monitoring
  fetched: '2026-10-31'
  quote: Contracted by the then Department of Environmental Affairs (DEA), the CSIR, under
    its e-government impact area, researched, developed and implemented the Oceans and Coastal
    Information System (OCIMS) in 2016
- claim: Produced the National Terrestrial Carbon Sinks Assessment in 2014 with other organisations.
  url: https://csa.environment.gov.za/about
  fetched: '2026-10-31'
  quote: In 2014 the CSIR (in partnership with a number of other organisations) produced the
    National Terrestrial Carbon Sinks Assessment for South Africa.
- claim: WWF South Africa says it conducted research with the CSIR in 2013 to assess and map
    strategic water source areas.
  url: https://www.wwf.org.za/our_work/initiatives/water_source_areas
  fetched: '2026-10-31'
  quote: In 2013 WWF conducted research with the Council for Scientific and Industrial Research
    (CSIR) to assess and map our country’s strategic water source areas.
- claim: Announced an upgrade to its Advanced Fire Information System.
  url: https://www.csir.co.za/south-africas-fire-spotting-system-now-faster-and-more-accurate
  quote: the Council for Scientific and Industrial Research (CSIR) has announced that its
    Advanced Fire Information System (AFIS) has been upgraded
  fetched: '2026-10-31'
- claim: SANBI says the Strategic Water Source Areas were developed by the CSIR.
  url: https://www.sanbi.org/biodiversity/science-into-policy-action/biodiversity-information-management/biodiversitygis-bgis/
  quote: the Strategic Water Source Areas (SWSA) developed by the Council for Scientific and
    Industrial Research (CSIR)
  fetched: '2026-10-31'
- claim: Developed a radar and optical detection system with Reutech Radar Systems.
  url: https://www.csir.co.za/what-we-do/defence-and-security/integrated-security
  fetched: '2026-10-31'
  quote: the CSIR developed the first radar and optical detection system in collaboration
    with Reutech Radar Systems
- claim: A February 2022 Engineering News report describes its wetland study using software
    with machine learning algorithms to assess classification accuracy.
  url: https://www.engineeringnews.co.za/article/space-based-sensors-offer-promising-tools-for-wetland-monitoring-2022-02-18
  fetched: '2026-10-31'
  quote: used in software programmes with machine learning algorithms to assess the accuracy
    of our classification
