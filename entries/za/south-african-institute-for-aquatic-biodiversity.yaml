facts:
- claim: Hosts the Acoustic Tracking Array Platform.
  url: https://saiab.ac.za/platforms/acoustic-tracking-array-platform/
  fetched: '2026-10-31'
  quote: The Acoustic Tracking Array Platform (ATAP) is hosted by the South African Institute
    for Aquatic Biodiversity
- claim: An October 2018 Save Our Seas post said SAIAB researchers had tagged more than 120
    spotted grunter with acoustic transmitters.
  url: https://saveourseas.com/project/the-acoustic-tracking-array-platform-atap/
  fetched: '2026-10-31'
  quote: with more than 120 individuals having been tagged with acoustic transmitters to date
- claim: A national facility of the National Research Foundation, in Makhanda.
  url: https://saiab.ac.za/about-us/
  quote: The South African Institute for Aquatic Biodiversity (NRF-SAIAB) is a national facility
    of the National Research Foundation (NRF).
  fetched: '2026-10-31'
- claim: Its genomics platform covers DNA extraction through to Next-Generation Sequencing.
  url: https://saiab.ac.za/platforms/aquatic-genomics-research-platform-agrp/
  quote: The platform is equipped with laboratory equipment for capabilities that extend from
    DNA extraction through to Sanger Sequencing, as well as Next-Generation Sequencing.
  fetched: '2026-10-31'
- claim: Its contact page gives an address on Somerset Street, Makhanda.
  url: https://saiab.ac.za/contact-us/
  quote: Somerset Street Makhanda (Grahamstown), 6139
