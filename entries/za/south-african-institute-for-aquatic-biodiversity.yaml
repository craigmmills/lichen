- claim: Serves as a scientific resource on the biodiversity and functioning of aquatic ecosystems.
  url: https://www.saiab.ac.za/
  fetched: '2026-10-31'
  quote: SAIAB serves as a major scientific resource for knowledge and understanding the biodiversity
    and functioning of globally significant aquatic ecosystems
- claim: Its technicians and instrument scientists manage and operate the SAIAB Marine Platform,
