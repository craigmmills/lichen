summary: South African partner of BirdLife International; the Mail & Guardian reports it leads
  a project tagging, colour-ringing and monitoring shorebirds, and it provides analytical
  support to citizen science projects.
facts:
- claim: The Mail & Guardian reports that it leads a project tagging, colour-ringing and monitoring
    shorebirds at coastal sites.
  url: https://mg.co.za/the-green-guardian/2026-04-14-tiny-birds-vast-journeys-inside-sas-first-shorebird-tracking-project/
  fetched: '2026-10-31'
  quote: Led by BirdLife South Africa , the project focuses on tagging, colour-ringing and
    monitoring birds at key coastal sites
- claim: The South African partner of BirdLife International.
  url: https://www.birdlife.org.za/what-we-do/science-and-innovation/what-we-do/
  quote: As the South African partner of BirdLife international
  fetched: '2026-10-31'
- claim: The Endangered Wildlife Trust says BirdLife South Africa collaborated on species
    data for the national screening tool; the page calls another collaborator the “South African
    Biodiversity Institute”.
  url: https://ewt.org/resources/no-go-map-tool/
  quote: The South African Biodiversity Institute, the Endangered Wildlife Trust, and BirdLife
    South Africa have collaborated to develop the species data
  fetched: '2026-10-31'
- claim: Its seabird habitat work draws on satellite tags and GPS biologgers.
  url: https://birdlife.org.za/project/critical-seabird-habitat/
  fetched: '2026-10-31'
  quote: is typically collected from satellite tags and GPS biologgers that are fitted to
    birds at their nest sites.
- claim: Provides analytical support to citizen science projects hosted at the FitzPatrick
    Institute.
  url: https://birdlife.org.za/project/citizen-science-support/
  fetched: '2026-10-31'
  quote: This project provides scientific and analytical support to South Africa’s major citizen
    science initiatives hosted at the FitzPatrick Institute of African Ornithology
