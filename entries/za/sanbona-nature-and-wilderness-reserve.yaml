facts:
- claim: Sanbona is a privately owned nature reserve of 58,000 hectares in the Little
    Karoo, proclaimed a nature reserve in partnership with CapeNature's Biodiversity
    Stewardship Programme under a Protected Area Management Agreement.
  url: https://pressportal.co.za/leisure-and-entertainment/story/western-cape-reaches-conservation-milestone-with-sanbona.html
  fetched: 2026-11-17
  quote: Sanbona is one of South Africa’s largest privately-owned nature reserves,
    stretching across 58 000 hectares of rich protected ecosystems within two biodiversity
    hotspots.
- claim: In 2021, CALEO Foundation announced its decision to donate and transfer Sanbona
    into a non-profit company, naming Sanbona Nature and Wilderness Reserve NPC as
    the reserve's new non-profit entity.
  url: https://pressportal.co.za/leisure-and-entertainment/story/western-cape-reaches-conservation-milestone-with-sanbona.html
  fetched: 2026-11-17
  quote: The new non-profit entity of the reserve is the Sanbona Nature and Wilderness
    Reserve NPC.
