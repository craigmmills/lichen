summary: South African government department, renamed in April 2021, with a mandate on citizens'
  environmental rights; in August 2026 its minister published the draft NBSAP 2026-2035 for
  public comment.
facts:
- claim: Mandated to give effect to the right of citizens to an environment that is not harmful
    to their health or wellbeing, and that is protected.
  url: https://www.gcis.gov.za/sites/default/files/docs/11%20Forestry%2C%20Fisheries%20and%20the%20Environment.pdf
  fetched: '2026-10-31'
  quote: The Department of Forestry, Fisheries and the Environment (DFFE ) is mandated to
    give effect to the right of citizens to an environment that is not harmful to their health
    or wellbeing
- claim: 'The 2022/23 Official Guide to South Africa lists the National Environmental Management:
    Biodiversity Act among the laws behind its mandate.'
  url: https://www.gcis.gov.za/sites/default/files/docs/11%20Forestry%2C%20Fisheries%20and%20the%20Environment.pdf
  fetched: '2026-10-31'
  quote: 'National Environmental Management: Biodiversity Act (NEMBA) of 2004'
- claim: Its deputy minister said in December 2025 that South Africa will report on genetic
    indicators in its 7th National Report to the Convention on Biological Diversity.
  url: https://www.gov.za/news/speeches/deputy-minister-bernice-swarts-launch-national-biodiversity-assessment-2025-09-dec
  fetched: '2026-10-31'
  quote: will be among the first countries globally to report on genetic indicators in our
    7th National Report to the Convention on Biological Diversity
- claim: SANBI says it is a public entity under this department.
  url: https://www.sanbi.org/about/sanbi-partners-and-associates/
  quote: SANBI is a public entity under the Department of Forestry, Fisheries and the Environment
    (DFFE)
  fetched: '2026-10-31'
- claim: The Endangered Wildlife Trust says the department established the open-access national
    Environmental Screening Tool.
  url: https://ewt.org/resources/no-go-map-tool/
  quote: has established an online, open-access national Environmental Screening Tool (EST)
  fetched: '2026-10-31'
- claim: Renamed from the Department of Environment, Forestry and Fisheries in April 2021.
  url: https://www.gov.za/about-sa/forestry-fisheries-and-environment
  fetched: '2026-10-31'
  quote: In April 2021, the Department of Environment, Forestry and Fisheries changed its
    name to the Department of Forestry, Fisheries and the Environment (DFFE).
- claim: In August 2026, the minister published the draft NBSAP 2026-2035 for public comment.
  url: https://www.gov.za/news/media-statements/minister-david-maynier-invites-public-comments-draft-national-biodiversity
  fetched: '2026-10-31'
  quote: his publication of the draft National Biodiversity Strategy and Action Plan 2026-2035
    (draft NBSAP) for public comment
- claim: The government statement calls the NBSAP the main instrument for implementing the
    Convention on Biological Diversity nationally.
  url: https://www.gov.za/news/media-statements/minister-david-maynier-invites-public-comments-draft-national-biodiversity
  fetched: '2026-10-31'
  quote: The NBSAP is the primary instrument for implementing the Convention on Biological
    Diversity (CBD) at a national level
- claim: The CBD's list of national focal points gives a Director of Biodiversity Multilateral
    Coordination in this department for South Africa.
  url: https://www.cbd.int/doc/lists/nfp-cbd.pdf
  fetched: '2026-10-31'
  quote: Biodiversity Multilateral Coordination
- claim: The department's statement on the Global Biodiversity Framework says the CBD focal
    point works with other departments.
  url: https://www.gov.za/news/media-statements/forestry-fisheries-and-environment-mobilising-biodiversity-related
  fetched: '2026-10-31'
  quote: The Convention on Biological Diversity focal point also works very closely with other
    departments
- claim: Address in Pretoria on the CBD list.
  url: https://www.cbd.int/doc/lists/nfp-cbd.pdf
  fetched: '2026-10-31'
  quote: Pretoria 0001 South Africa
