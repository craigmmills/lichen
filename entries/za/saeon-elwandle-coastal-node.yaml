summary: Active SAEON node that, according to SAEON eNews in 2024, had run monthly
  pelagic ecological research at the Algoa Bay sentinel site since 2007 and added
  a FlowCam for phytoplankton imaging.
facts:
- claim: In 2024, SAEON eNews said the node had conducted monthly pelagic long-term
    ecological research at the Algoa Bay sentinel site since 2007.
  url: https://enews.saeon.ac.za/issue-02-2024/smcri-microalgae-laboratory-new-capabilities-for-impactful-research/
  fetched: 2026-11-09
  quote: The Node has been conducting monthly pelagic ecosystem long-term ecological
    research (PELTER), commonly referred to in the Node as "plankton runs", in the
    Algoa Bay sentinel site since 2007.
- claim: SAEON eNews says the Microalgae Laboratory added a FlowCam to capture and
    quantify phytoplankton images for routine monitoring.
  url: https://enews.saeon.ac.za/issue-02-2024/smcri-microalgae-laboratory-new-capabilities-for-impactful-research/
  fetched: 2026-11-09
  quote: The FlowCam 8100 provides a rapid and reliable method for the routine monitoring
    of marine waters in Algoa Bay and other sentinel sites across the country as part
    of the PELTER programme.
