summary: An open-access platform for freshwater biodiversity data in South Africa, built by the Freshwater
  Research Centre and Kartoza, which JRS reported in August 2020 had mobilised over 300,000 river records.
facts:
- claim: An open-access platform for serving, hosting, analysing, visualising and sharing freshwater biodiversity
    data in South Africa.
  url: https://freshwaterbiodiversity.org
  quote: FBIS is an open-access, online platform for serving, hosting, analyzing, visualising and sharing
    freshwater biodiversity data in South Africa.
  fetched: '2026-10-31'
- claim: A mobile app uploads data from field monitoring sites to the platform.
  url: https://freshwaterbiodiversity.org
  quote: The FBIS mobile application is a quick and easy way to upload freshwater biodiversity data from
    field monitoring sites directly to the FBIS platform
  fetched: '2026-10-31'
- claim: An open-access platform for freshwater biodiversity data in South Africa.
  url: https://freshwaterbiodiversity.org/
  fetched: '2026-10-31'
  quote: FBIS is an open-access, online platform for serving, hosting, analyzing, visualising and sharing
    freshwater biodiversity data in South Africa.
- claim: In August 2020, JRS reported that FBIS mobilised more than 300,000 biodiversity records for South
    African rivers.
  url: https://jrsbiodiversity.org/welcome-to-fbis/
  fetched: '2026-10-31'
  quote: FBIS mobilizes in excess of 300,000 biodiversity records for South African rivers.
- claim: An August 2020 JRS report says FBIS enabled users to search and extract data, add data and generate
    reports.
  url: https://jrsbiodiversity.org/welcome-to-fbis/
  fetched: '2026-10-31'
  quote: enabling users to search and extract data, add data, and easily generate reports
