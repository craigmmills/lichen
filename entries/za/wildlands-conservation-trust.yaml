summary: Trust that, in May 2013, was announced by the Department of Environmental
  Affairs as recipient of R33 million over three years for a greening project, and
  that manages the 12,000-hectare Somkhanda community-owned game reserve.
facts:
- claim: In May 2013, the Department of Environmental Affairs announced R33 million
    over three years for the trust to implement a greening project aiming to restore
    2,160 hectares across five district municipalities in KwaZulu-Natal and Mpumalanga.
  url: https://www.gov.za/news/media-statements/department-environmental-affairs-allocates-33-million-wildlands-community
  fetched: 2026-11-17
  quote: The first is to restore a total of 2 160 hacters of degraded land across
    five District Municipalities (uMgungundlovu, uThukela, uMkhanyakude, uThungulu
    and eHlanzini) and 2 provinces (KwaZulu-Natal and Mpumalanga)
- claim: The project announced in May 2013 also aimed at stewardship and improved
    management of over 50,000 hectares between the Royal Natal and Cathedral Peak
    reserves.
  url: https://www.gov.za/news/media-statements/department-environmental-affairs-allocates-33-million-wildlands-community
  fetched: 2026-11-17
  quote: stewardship and improved management of over 50 000 hacters in the corridor
    separating the Royal Natal and Cathedral Peak Reserves
- claim: Runs the day-to-day management of the 12,000-hectare Somkhanda community-owned
    game reserve in Zululand, with the KwaGumbi community as owners.
  url: https://www.vukuzenzele.gov.za/successful-land-claim-leads-thriving-game-reserve
  fetched: 2026-11-17
  quote: Wildlands is still responsible for the day-to-day running of the game reserve
    but suitable community members are being trained to take over this function in
    the future.
