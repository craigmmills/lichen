summary: Data infrastructure run by SAEON for publishing, discovering, disseminating and preserving Earth
  observation and environmental data, certified as a Trustworthy Data Repository on 5 September 2023.
facts:
- claim: A data infrastructure for the publication, discovery, dissemination and preservation of Earth
    observation and environmental data.
  url: https://www.saeon.ac.za/2024/07/12/nrf-saeons-ulwazi-node-wins-nstf-south32-data-for-research-award/
  quote: The ODP is a data infrastructure that facilitates the publication, discovery, dissemination,
    and preservation of earth observation and environmental data in South Africa.
  fetched: '2026-10-31'
- claim: SAEON distributes data systems and applications on the platform.
  url: https://www.saeon.ac.za/
  fetched: '2026-10-31'
  quote: which are distributed on an Open Data Platform (ODP)
- claim: Certified as a Trustworthy Data Repository on 5 September 2023.
  url: https://enews.saeon.ac.za/issue-05-2023/saeon-open-data-platform-receives-coretrustseal-certification/
  fetched: '2026-10-31'
  quote: certified as a Trustworthy Data Repository by the CoreTrustSeal Standards and Certification Board
    on 5 September 2023
- claim: The SAEON Data Portal is the frontend for datasets hosted within it.
  url: https://enews.saeon.ac.za/issue-05-2023/saeon-open-data-platform-receives-coretrustseal-certification/
  fetched: '2026-10-31'
  quote: the SAEON Data Portal is the frontend system for accessing datasets hosted within the infrastructure
