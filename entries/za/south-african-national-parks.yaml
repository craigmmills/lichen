summary: Body established under the 2003 Protected Areas Act to conserve and manage national
  parks, reported to be responsible for 21 parks and to collect camera trap and underwater
  video data.
facts:
- claim: 'Established under the National Environmental Management: Protected Areas Act of
    2003, with a mandate to conserve, protect, control and manage national parks.'
  url: https://www.gcis.gov.za/sites/default/files/docs/11%20Forestry%2C%20Fisheries%20and%20the%20Environment.pdf
  fetched: '2026-10-31'
  quote: Its mandate is to conserve, protect, control and manage national parks and other
    defined protected areas and their biodiversity.
- claim: SANBI says SANParks manages a system of parks representing the country's fauna, flora
    and landscapes.
  url: https://www.sanbi.org/about/sanbi-partners-and-associates/
  quote: SANParks manages a system of parks which represents the indigenous fauna, flora,
    landscapes and associated cultural heritage of the country.
  fetched: '2026-10-31'
- claim: The South African Government states its mandate is to conserve and manage national
    parks.
  url: https://www.gov.za/about-sa/forestry-fisheries-and-environment
  fetched: '2026-10-31'
  quote: The SANParks’ mandate is to conserve, protect, control and manage national parks
    and other defined protected areas and their biodiversity.
- claim: The South African Government states it is responsible for 21 national parks.
  url: https://www.gov.za/about-sa/forestry-fisheries-and-environment
  fetched: '2026-10-31'
  quote: The SANParks is responsible for 21 national parks in seven provinces
- claim: South Africa Yearbook 2021/22 says its mandate is to conserve, protect, control and
    manage national parks and other defined protected areas.
  url: https://www.gcis.gov.za/sites/default/files/docs/gcis/7.%20Forestry,%20Fisheries%20and%20Environment.pdf
  fetched: '2026-10-31'
  quote: mandate is to conserve, protect, control and manage national parks and other defined
    protected areas and their biodiversity
- claim: South Africa Yearbook 2021/22 says it is responsible for 21 national parks in seven
    provinces.
  url: https://www.gcis.gov.za/sites/default/files/docs/gcis/7.%20Forestry,%20Fisheries%20and%20Environment.pdf
  fetched: '2026-10-31'
  quote: responsible for 21 national parks in seven provinces
