summary: A completed 100,000-hectare AI- and drone-powered census capturing nearly three million
  images according to Daily Maverick, with Timbavati noting unreliable sex differentiation
  for species requiring separate counts.
facts:
- claim: A completed AI- and drone-powered game census covering 100,000 hectares across the
    Sabi Sand and Timbavati Nature Reserves.
  url: https://www.timbavati.co.za/news-reports/project-gaia-ai-and-drone-powered-game-census-across-100-000-ha-of-the-timbavati-and-sabi-sand-nature-reserve
  fetched: '2026-10-31'
  quote: an AI- and drone-powered game census covering 100,000 hectares across the iconic
    Sabi Sand and Timbavati Nature Reserves
- claim: Daily Maverick reports nearly three million images were captured and machine learning
    used to identify and map more than 50 wildlife species.
  url: https://www.dailymaverick.co.za/article/2026-03-29-how-south-africans-are-using-high-tech-to-rewrite-the-rules-of-wildlife-conservation
  fetched: '2026-10-31'
  quote: they used machine-learning technology and a battery of Nvidia graphics processing
    units to identify and map the precise location of more than 50 wildlife species
- claim: The Timbavati Nature Reserve says current AI models cannot reliably distinguish males
    and females of species where separate counts are required.
  url: https://www.timbavati.co.za/news-reports/project-gaia-ai-and-drone-powered-game-census-across-100-000-ha-of-the-timbavati-and-sabi-sand-nature-reserve
  fetched: '2026-10-31'
  quote: Current AI models cannot reliably differentiate between males and females of species
    where separate counts are required.
- claim: The census took place in the Sabi Sands, Timbavati, Kwandwe and Karongwe reserves.
  url: https://www.dailymaverick.co.za/article/2026-03-29-how-south-africans-are-using-high-tech-to-rewrite-the-rules-of-wildlife-conservation
  quote: During the Project Gaia wildlife census in the Sabi Sands, Timbavati, Kwandwe and
    Karongwe reserves
  fetched: '2026-10-31'
- claim: The Timbavati reserve reports the census as successfully completed.
  url: https://www.timbavati.co.za/news-reports/project-gaia-ai-and-drone-powered-game-census-across-100-000-ha-of-the-timbavati-and-sabi-sand-nature-reserve
