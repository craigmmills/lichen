summary: A KwaZulu-Natal conservation agency established under a 1997 Act, managing 92 protected
  areas, with reported drone use and a command centre launched in 2018 in Hluhluwe-iMfolozi
  Park.
facts:
- claim: Daily Maverick reports that a qualified drone pilot at the agency has pioneered the
    use of drones in its conservation work.
  url: https://www.dailymaverick.co.za/article/2026-03-29-how-south-africans-are-using-high-tech-to-rewrite-the-rules-of-wildlife-conservation
  fetched: '2026-10-31'
  quote: Jewitt, a qualified drone pilot who has pioneered the use of drones in Ezemvelo’s
    conservation work
- claim: A September 2020 statement by the provincial environment MEC described cameras in
    Hluhluwe-iMfolozi Park using AI to identify people and alert an operations centre.
  url: https://www.gov.za/news/media-statements/mec-nomusa-dube-ncube-use-digital-infrastructure-rhino-populations-21-sep
  fetched: '2026-10-31'
  quote: These cameras using artificial intelligence (AI) identify people and send an immediate
    alert to the Operations Centre
- claim: In February 2018, ITWeb reported that it had launched a command and control centre
    in Hluhluwe-iMfolozi Park aggregating data from technology systems deployed in the park.
  url: https://www.itweb.co.za/article/ms-azure-comes-to-rescue-of-on-the-brink-rhinos/DZQ587VJ9z27zXy2
  fetched: '2026-10-31'
  quote: which acts as a hub for the aggregation and visualisation of data collected from
    technology systems deployed in the park
- claim: KZN Top Business describes it as the provincial agency mandated to carry out biodiversity
    conservation in KwaZulu-Natal.
  url: https://www.kzntopbusiness.com/parastatals/ezemvelo-kzn-wildlife
  quote: Ezemvelo KZN Wildlife is the provincial agency mandated to carry out biodiversity
    conservation and associated activities in the province of KwaZulu-Natal.
  fetched: '2026-10-31'
- claim: The Daily Maverick reports that its scientist qualified as a Beyond Visual Line of
    Sight drone pilot and has applied those skills to several projects.
  url: https://www.dailymaverick.co.za/article/2026-03-29-how-south-africans-are-using-high-tech-to-rewrite-the-rules-of-wildlife-conservation
  quote: Ezemvelo KZN Wildlife scientist Dr Debbie Jewitt spotted the potential advantage
    of such tools almost a decade ago and qualified as a Beyond Visual Line of Sight (BVLOS)
    drone pilot.
  fetched: '2026-10-31'
- claim: Its 2023/24 annual report describes monitored remote trap camera systems.
  url: https://provincialgovernment.co.za/entity_annual/947/2024-kwazulu-natal-ezemvelo-kzn-wildlife-annual-report.pdf
  fetched: '2026-10-31'
  quote: Network of real-time reporting and monitored remote trap camera systems with one
    hundred and eighty
- claim: Shares responsibility for marine protected areas, according to the South African
    Government.
  url: https://www.gov.za/about-sa/forestry-fisheries-and-environment
  fetched: '2026-10-31'
  quote: Government shares joint responsibility for South Africa’s MPAs with the SANParks
    and Ezemvelo KwaZulu-Natal Wildlife.
- claim: Established under the KwaZulu-Natal Nature Conservation Management Act of 1997 and
    mandated to conserve biodiversity and manage protected areas.
  url: https://www.kznwildlife.com/resource-centre/news/king-misuzulu-pledges-continued-support-for-ezemvelos-conservation-efforts-at-hl
  fetched: '2026-10-31'
  quote: is mandated to conserve biodiversity, manage protected areas
- claim: Manages 92 protected areas for the province.
  url: https://www.kznwildlife.com/resource-centre/news/king-misuzulu-pledges-continued-support-for-ezemvelos-conservation-efforts-at-hl
  fetched: '2026-10-31'
  quote: Ezemvelo manages 92 protected areas for the province
- claim: Address in Pietermaritzburg.
  url: https://www.kznwildlife.com/resource-centre/news/king-misuzulu-pledges-continued-support-for-ezemvelos-conservation-efforts-at-hl
  fetched: '2026-10-31'
  quote: Queen Elizabeth Park, 1 Peter Brown Drive, Montrose, Pietermaritzburg
