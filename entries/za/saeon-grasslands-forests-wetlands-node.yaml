summary: An active SAEON node, it reportedly prioritised four mesic grassland catchments
  for refurbishment in 2011; SAEON eNews reported a second Maputaland Coastal Plain
  site in 2023.
facts:
- claim: SAEON eNews says that when the node started in 2011, four mesic grassland
    catchments were prioritised for refurbishment, with an integrated approach to
    studying energy balance, biodiversity, carbon and meteorological processes.
  url: https://enews.saeon.ac.za/issue-05-2023/long-term-observations-enhance-knowledge-impact-as-saeon-extends-historic-measurements/
  fetched: 2026-11-09
  quote: When the Grasslands Node started in 2011, four of the "pristine" fire climax
    mesic grassland catchments were prioritised for refurbishment.
- claim: In 2023, SAEON eNews said a node technician maintained long-term biodiversity
    trials, and that the node had a second site in the Maputaland Coastal Plain.
  url: https://enews.saeon.ac.za/issue-05-2023/long-term-observations-enhance-knowledge-impact-as-saeon-extends-historic-measurements/
  fetched: 2026-11-09
  quote: Paul Gordjin maintains long-term biodiversity trials which are revealing
    exciting information about the links between biodiversity and above- and below-ground
    processes
