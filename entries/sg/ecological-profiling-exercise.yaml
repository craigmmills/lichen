summary: An island-wide NParks programme begun in 2021 that uses spatial models to
  predict wildlife movement, and which identified four new ecological corridors and,
  in 2022, ecologically significant habitats on Lazarus and Kusu Islands.
facts:
- claim: The Centre for Liveable Cities says NParks began the island-wide Ecological
    Profiling Exercise in 2021, developing an agent-based spatial model of dispersal
    and a least-resistance pathway model to predict wildlife movement.
  url: https://knowledgehub.clc.gov.sg/liveability-in-action/box-story--nparks--ecological-profiling-exercise--employing-a-science-based-approach-in-stewarding-singapore-s-natural-capital/
  fetched: '2026-11-13'
  quote: NParks embarked on an island-wide Ecological Profiling Exercise (EPE), developing
    an agent-based spatial model to better understand dispersal patterns and a least-resistance
    pathway model to predict wildlife movement
- claim: The page says the profiling tool projects the movement of six target fauna
    species between core habitats.
  url: https://knowledgehub.clc.gov.sg/liveability-in-action/box-story--nparks--ecological-profiling-exercise--employing-a-science-based-approach-in-stewarding-singapore-s-natural-capital/
  fetched: '2026-11-13'
  quote: an ecological profiling tool was developed using a least-resistance pathway
    model that projects the movement of six targeted fauna species
- claim: The page says the exercise identified four new ecological corridors in the
    north, north-west and north-east of Singapore.
  url: https://knowledgehub.clc.gov.sg/liveability-in-action/box-story--nparks--ecological-profiling-exercise--employing-a-science-based-approach-in-stewarding-singapore-s-natural-capital/
  fetched: '2026-11-13'
  quote: Through the EPE, NParks identified four new ecological corridors
- claim: The page calls the exercise a continuous iterative process supporting NParks'
    research.
  url: https://knowledgehub.clc.gov.sg/liveability-in-action/box-story--nparks--ecological-profiling-exercise--employing-a-science-based-approach-in-stewarding-singapore-s-natural-capital/
  fetched: '2026-11-13'
  quote: The EPE is a continuous iterative process that supports NParks’ overarching
    research efforts
- claim: NParks' annual report says its 2022 Ecological Profiling Exercise on the
    coastal and marine environment found habitats at Lazarus Island and Kusu Island
    to be ecologically significant.
  url: https://www.nparks.gov.sg/portals/annualreport/chapters/our-conservation-for-nature
  fetched: '2026-11-13'
  quote: In 2022, NParks' Ecological Profiling Exercise on Singapore's coastal and
    marine environment found habitats at Lazarus Island and Kusu Island to be ecologically
    significant
