summary: NParks-listed UNESCO World Heritage Site that launched a ten-garden phenology network in August
  2024, set up an Environmental Monitoring section in January 2025, and is sequencing native plant genomes
  with Nanyang Technological University.
facts:
- claim: Listed among the NParks websites as Singapore's first UNESCO World Heritage Site.
  url: https://www.nparks.gov.sg/
  fetched: '2026-11-08'
  quote: Singapore Botanic Gardens Explore our first UNESCO World Heritage Site
- claim: Launched the Southeast Asia Plant Phenology Network at the Global Botanic Gardens Congress in
    August 2024, bringing together ten botanic gardens for long-term phenology monitoring.
  url: https://www.nparks.gov.sg/portals/annualreport/chapters/our-innovation-for-nature
  fetched: '2026-11-08'
  quote: the Singapore Botanic Gardens launched the Southeast Asia Plant Phenology (SEAPP) Network, which
    brings together ten botanic gardens from tropical Asia for long-term phenology monitoring
- claim: Says its forest research includes tracking ecosystem processes and monitoring tree populations
    over their life cycles.
  url: https://sbg.nparks.gov.sg/science/forest-ecology---environmental-monitoring/
  fetched: '2026-11-08'
  quote: Our research encompasses the full spectrum of forest ecology—studying plant and animal communities,
    tracking ecosystem processes, and monitoring tree populations over their life cycles.
- claim: An Environmental Monitoring section was set up in January 2025 to study Singapore's biophysical
    environment in relation to urban forestry and forest dynamics.
  url: https://sbg.nparks.gov.sg/science/forest-ecology---environmental-monitoring/
  fetched: '2026-11-08'
  quote: The Environmental Monitoring section was set up in Jan 2025 to study Singapore’s biophysical
    environment and their relations to urban forestry, forest dynamics, and management policies.
- claim: Is working to sequence annotated genomes of native and naturalised plants with Nanyang Technological
    University, beginning with angiosperms in Bukit Timah Nature Reserve; around 500 genomes have been
    assembled and annotated.
  url: https://sbg.nparks.gov.sg/science/biodiversity-genomics/
  fetched: '2026-11-08'
  quote: We are working to sequence full annotated genomes of all native and naturalised species in collaboration
    with Nanyang Technological University, beginning with angiosperm diversity found in the Bukit Timah
    Nature Reserve.
- claim: The National Parks Board's home page lists the Singapore Botanic Gardens among its other websites.
  url: https://www.nparks.gov.sg/
  fetched: '2026-11-08'
  quote: Explore our first UNESCO World Heritage Site
