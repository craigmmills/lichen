summary: Project run by the Singapore Botanic Gardens, begun in 2025 to digitise the herbarium's collections
  and give online access, aiming to finish by 2027, with a new system planned for March 2027.
facts:
- claim: Began in 2025, the herbarium's 150th anniversary, to digitise its collections and give online
    access to the specimens.
  url: https://sbg.nparks.gov.sg/get-involved/singapore-herbarium-digitalisation-project/
  fetched: '2026-11-08'
  quote: To mark the 150th anniversary of the Singapore Herbarium in 2025, we embarked on the process
    to digitalise the institution's extensive collections, extending online access to these precious specimens
    throughout the world.
- claim: Aims to complete the digitisation by 2027.
  url: https://sbg.nparks.gov.sg/get-involved/singapore-herbarium-digitalisation-project/
  fetched: '2026-11-08'
  quote: Your support will help us achieve completion of digitalisation by 2027
- claim: The herbarium uses the BRAHMS system for its collection data and says the new system from the
    digitisation will be launched in March 2027.
  url: https://sbg.nparks.gov.sg/science/singapore-herbarium---plant-taxonomy/
  fetched: '2026-11-08'
  quote: We are currently digitalising our entire collection, and the new system will be launched in March
    2027.
