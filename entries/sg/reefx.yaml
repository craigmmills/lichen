summary: Citizen science programme run by Marine Stewards with NParks, training recreational
  scuba divers in reef survey data collection, with CNA reporting an aim of about
  60 divers trained in the year reported.
facts:
- claim: Marine Stewards describes it as training recreational scuba divers to gather
    reef survey data.
  url: https://marinestewards.org/
  fetched: 2026-11-12
  quote: A citizen science programme to train recreational scuba divers in gathering
    reef survey data to support local reef research and conservation efforts.
- claim: CNA quotes NParks' National Biodiversity Centre calling it a first step in
    training citizen scientists to provide reef data.
  url: https://www.channelnewsasia.com/singapore/coral-reef-marine-conservation-reefx-nparks-divers-2623811
  fetched: 2026-11-12
  quote: ReefX by Marine Stewards is a small but critical first step in training up
    a new generation of citizen scientists skilled to provide us with important reef
    data," said Dr Karenne Tun, director for coastal and marine at NParks’ National
    Biodiversity Centre.
- claim: CNA reported that, working with NParks, Marine Stewards aimed to train about
    60 divers that year in reef survey techniques, including photo and video documentation
    of reefs.
  url: https://www.channelnewsasia.com/singapore/coral-reef-marine-conservation-reefx-nparks-divers-2623811
  fetched: 2026-11-12
  quote: Working with the National Parks Board (NParks), the organisation aims to
    train about 60 divers this year in basic reef survey techniques
