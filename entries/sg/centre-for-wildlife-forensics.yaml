facts:
- claim: The Animal and Veterinary Service page says the centre's molecular work focuses
    on protocols to identify wildlife and timber species through DNA targets and genetic
    markers.
  url: https://avs.nparks.gov.sg/wildlife/wildlife-trade/wildlife-forensics/fauna-identification/about/
  fetched: '2026-11-13'
  quote: Development and validation of protocols to identify focus wildlife and timber
    species through specific DNA targets and genetic markers
- claim: The page says the centre builds and curates reference libraries of wildlife
    species with molecular technologies.
  url: https://avs.nparks.gov.sg/wildlife/wildlife-trade/wildlife-forensics/fauna-identification/about/
  fetched: '2026-11-13'
  quote: Building and curation of reference libraries of various wildlife species
    with advanced molecular technologies
- claim: The page lists next generation sequencing among the molecular laboratory's
    capabilities.
  url: https://avs.nparks.gov.sg/wildlife/wildlife-trade/wildlife-forensics/fauna-identification/about/
  fetched: '2026-11-13'
  quote: Next generation sequencing
- claim: The page lists pangolins, rhinoceros, elephants, saiga antelopes, sharks
    and rays, seahorses, sea cucumbers and eels among species it has worked with.
  url: https://avs.nparks.gov.sg/wildlife/wildlife-trade/wildlife-forensics/fauna-identification/about/
