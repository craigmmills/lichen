summary: National University of Singapore museum of Southeast Asian specimens that publishes eight datasets
  to GBIF and joined a Naturalis-coordinated project to digitise its butterfly specimens.
facts:
- claim: GBIF's record says it houses zoological and botanical specimens collected mainly in Singapore
    and Southeast Asia and does biodiversity research with a Southeast Asian focus.
  url: https://api.gbif.org/v1/organization/14c4c7da-fb56-44f7-9589-76bd670bf8a7
  fetched: '2026-11-08'
  quote: Lee Kong Chian Natural History Museum houses zoological and botanical specimens collected primarily
    in Singapore and Southeast Asia. The museum engages in biodiversity research with a Southeast Asian
    focus
- claim: GBIF lists its address at 2 Conservatory Drive, National University of Singapore.
  url: https://api.gbif.org/v1/organization/14c4c7da-fb56-44f7-9589-76bd670bf8a7
  fetched: '2026-11-08'
  quote: 2 Conservatory Drive, National University of Singapore
- claim: Publishes eight datasets to GBIF, including SIGNIFY and butterfly records of Singapore and Peninsular
    Malaysia.
  url: https://api.gbif.org/v1/organization/14c4c7da-fb56-44f7-9589-76bd670bf8a7/publishedDataset?limit=50
  fetched: '2026-11-08'
  quote: Butterflies of Singapore and Peninsular Malaysia (Papilionidae)
- claim: Joined the Butterflies of the Southeast Asian Islands Consortium Project, coordinated by Naturalis
    Biodiversity Center, to digitise butterfly specimens in its collection.
  url: https://api.gbif.org/v1/organization/14c4c7da-fb56-44f7-9589-76bd670bf8a7/publishedDataset?limit=20
  fetched: '2026-11-08'
  quote: The Lee Kong Chian Natural History Museum (LKCNHM) joined the Butterflies of the Southeast Asian
    Islands Consortium Project coordinated by Naturalis Biodiversity Center
- claim: The International Commission on Zoological Nomenclature says its secretariat is based at the
    museum, which supports the commission.
  url: https://www.iczn.org/about-the-iczn/
  fetched: '2026-11-08'
  quote: The work of the Commission is supported by a small Secretariat based at the Lee Kong Chian Natural
    History Museum in Singapore.
- claim: Its GBIF publisher record says it houses zoological and botanical specimens collected mainly
    in Singapore and Southeast Asia and does biodiversity research with a Southeast Asian focus.
  url: https://api.gbif.org/v1/organization/14c4c7da-fb56-44f7-9589-76bd670bf8a7
  fetched: 2026-11-08
  quote: Lee Kong Chian Natural History Museum houses zoological and botanical specimens collected primarily
    in Singapore and Southeast Asia.
- claim: Publishes butterfly specimen datasets for Singapore and Peninsular Malaysia on GBIF under a CC
