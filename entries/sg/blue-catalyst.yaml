summary: Twelve-month Singapore programme, run by WWF Singapore and Hatch Blue, for technologies tackling
  implementation and MRV challenges in blue carbon credits; its 2026 cohort includes Arkadiah Technology
  and Kumi Analytics.
facts:
- claim: A 12-month programme hosted in Singapore for technologies that address implementation and MRV
    challenges in blue carbon credits.
  url: https://www.edb.gov.sg/en/business-insights/insights/unlocking-southeast-asias-blue-carbon-potential-through-advanced-technologies.html
  fetched: '2026-11-08'
  quote: Hosted in Singapore, Blue Catalyst is a 12-month programme designed to attract and develop novel
    technologies that address technical implementation and MRV challenges in the generation of blue carbon
    credits.
- claim: Focus areas include accurate mapping and geospatial data, and biodiversity monitoring.
  url: https://www.edb.gov.sg/en/business-insights/insights/unlocking-southeast-asias-blue-carbon-potential-through-advanced-technologies.html
