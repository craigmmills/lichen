- claim: Established on 1 April 2026 as a department under the Ministry of Trade & Industry, taking over
    the functions of OSTIn, Singapore's former national space office.
  url: https://www.space.gov.sg/about-us/about-our-history/
  fetched: '2026-11-08'
  quote: NSAS is established on 1 April 2026 as a department under the Ministry of Trade & Industry. It
    assumes the functions of the Office for Space Technology & Industry (OSTIn), which was Singapore’s
    national space office.
- claim: OSTIn was established in 2013 by the Singapore Economic Development Board with other ministries
    and agencies.
  url: https://www.space.gov.sg/about-us/about-our-history/
  fetched: '2026-11-08'
  quote: In 2013, the Singapore Economic Development Board (EDB), together with other participating ministries
    and agencies, established the Office for Space Technology and Industry (OSTIn)
- claim: OSTIn received a mandate in 2020 to serve as Singapore's national space office, covering space
    policy and regulations.
  url: https://www.space.gov.sg/about-us/about-our-history/
  fetched: '2026-11-08'
  quote: In 2020, OSTIn received an expanded mandate to serve as Singapore's national space office
