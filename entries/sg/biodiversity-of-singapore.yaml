summary: Online reference collection and research database of Singapore species, hosted
  by the Lee Kong Chian Natural History Museum, which says it adds an average of 200
  species a month.
facts:
- claim: Its about page says it is hosted by the Lee Kong Chian Natural History Museum
    and is an online digital reference collection of Singapore species and a research
    database of the museum's species discoveries.
  url: https://m.singapore.biodiversity.online/about.html
  fetched: 2026-11-15
  quote: It is also a research database that tracks the numerous species discoveries
    made by LKCNHM.
- claim: Says an average of 200 species are added each month, many found by a museum
    project using DNA and morphological tools on Singapore's invertebrates.
  url: https://m.singapore.biodiversity.online/about.html
  fetched: 2026-11-15
  quote: They are discovered as part of LKCNHM’s species discovery project that targets
    Singapore’s unknown invertebrate diversity with DNA and morphological tools.
- claim: Says it grew from the Digital Nature Archive into Animals and Plants of Singapore
    in 2015 and took its present name in 2017.
  url: https://m.singapore.biodiversity.online/about.html
  fetched: 2026-11-15
  quote: In 2017, its name was changed to ‘The Biodiversity of Singapore’ to reflect
    the inclusion of other biodiverse groups such as Fungi and Algae.
- claim: Says it is a museum digitisation initiative whose specimen images are made
    available to the public and taxonomic experts.
  url: https://m.singapore.biodiversity.online/about.html
  fetched: 2026-11-15
  quote: At its core, BOS is also a museum digitization initiative.
