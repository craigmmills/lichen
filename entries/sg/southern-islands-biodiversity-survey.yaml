summary: An NParks survey begun in January 2020 and reported complete on 31 May 2025,
  producing the first comprehensive Southern Islands biodiversity database with over
  30,000 records and 44 native species recorded for the first time.
facts:
- claim: NParks said on 31 May 2025 that it had completed the survey, producing the
    first comprehensive biodiversity database of the Southern Islands with over 30,000
    records.
  url: https://www.nparks.gov.sg/news/news-detail/over-6-500-taxa-of-flora-and-fauna-recorded-in-first-extensive-biodiversity-survey-of-singapore-s-southern-islands
  fetched: '2026-11-13'
  quote: The National Parks Board (NParks) has completed the Southern Islands Biodiversity
    Survey, culminating in the first comprehensive biodiversity database of the Southern
    Islands
- claim: NParks says it began the survey in January 2020, with field surveys and a
    literature review, covering terrestrial and marine species.
  url: https://www.nparks.gov.sg/news/news-detail/over-6-500-taxa-of-flora-and-fauna-recorded-in-first-extensive-biodiversity-survey-of-singapore-s-southern-islands
  fetched: '2026-11-13'
  quote: NParks commenced the Southern Islands Biodiversity Survey in January 2020,
    comprising field surveys and an extensive literature review of secondary data.
- claim: NParks says 44 native species were recorded for the first time on the Southern
    Islands.
  url: https://www.nparks.gov.sg/news/news-detail/over-6-500-taxa-of-flora-and-fauna-recorded-in-first-extensive-biodiversity-survey-of-singapore-s-southern-islands
  fetched: '2026-11-13'
  quote: 44 new additions to Southern Islands’ fauna records in Southern Islands Biodiversity
    Survey
- claim: NParks said on 31 May 2025 that the findings had been published online in
    16 chapters, with the remaining three planned for publication by the end of 2025.
  url: https://www.nparks.gov.sg/news/news-detail/over-6-500-taxa-of-flora-and-fauna-recorded-in-first-extensive-biodiversity-survey-of-singapore-s-southern-islands
  fetched: '2026-11-13'
  quote: The findings of the Southern Islands Biodiversity Survey have been published
    online in 16 chapters
