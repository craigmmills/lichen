summary: A citizen science programme under the 2016 species action plan, with Mongabay
  reporting in April 2026 over 100 weekend surveyors and roughly 900 volunteers trained.
facts:
- claim: Mongabay reported in April 2026 that more than 100 volunteer surveyors carry
    out weekend surveys at the reserve throughout the year, recording group sizes,
    demographics and behaviour.
  url: https://news.mongabay.com/2026/04/citizen-science-helps-reconnect-singapore-treetops-for-elusive-leaf-eating-langurs/
  fetched: '2026-11-13'
  quote: Hoon is one of more than 100 volunteer surveyors who carry out weekend surveys
    at the reserve throughout the year as part of the initiative.
- claim: The article says launching a citizen science programme was part of the species
    action plan, to gather long-term, consistent data on the species.
  url: https://news.mongabay.com/2026/04/citizen-science-helps-reconnect-singapore-treetops-for-elusive-leaf-eating-langurs/
  fetched: '2026-11-13'
  quote: Part of that plan was to launch a citizen science program in Singapore to
    encourage locals to participate in the species’ conservation
- claim: The article says the 2016 species action plan was developed by the Raffles'
    Banded Langur Working Group, involving NParks, the Jane Goodall Institute (Singapore),
    Mandai Nature, NUS and regional partners.
  url: https://news.mongabay.com/2026/04/citizen-science-helps-reconnect-singapore-treetops-for-elusive-leaf-eating-langurs/
  fetched: '2026-11-13'
  quote: a species action plan was developed in 2016 by the Raffles’ Banded Langur
    Working Group
- claim: The April 2026 article says roughly 900 volunteers had been trained by then.
  url: https://news.mongabay.com/2026/04/citizen-science-helps-reconnect-singapore-treetops-for-elusive-leaf-eating-langurs/
  fetched: '2026-11-13'
  quote: With roughly 900 volunteers trained to date
- claim: In a 2018 Asian Scientist interview, Andie Ang, then newly appointed president
    of the Jane Goodall Institute (Singapore), said the citizen science effort had
    run since August 2016, recruiting volunteers every six months.
  url: https://www.asianscientist.com/?p=103679
  fetched: '2026-11-13'
  quote: We have been carrying out this citizen science effort since August 2016,
    recruiting volunteers every six months.
