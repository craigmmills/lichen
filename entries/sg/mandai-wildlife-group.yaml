summary: Organisation reporting camera trap and transect monitoring at Mandai Wildlife Reserve in February
  2022, and saying it funds gibbon surveys and post-release monitoring of black-winged mynas.
facts:
- claim: Its February 2022 release says cameras on the Mandai Wildlife Bridge were part of a long-term
    ecological monitoring programme at Mandai Wildlife Reserve that also included transect surveys.
  url: https://www.mandai.com/en/about-mandai/media-centre/nearly-70-species-of-wildlife-observed-using-mandai-wildlife-bridge-since-its-opening-in-2019.html
  fetched: '2026-11-08'
  quote: They are part of a long-term ecological monitoring programme at Mandai Wildlife Reserve, which
    also includes fauna monitoring in the form of transect surveys.
- claim: Its February 2022 release says camera trap monitoring recorded Sunda pangolin and lesser mousedeer
    near the bridge, and that the group will continue monitoring.
  url: https://www.mandai.com/en/about-mandai/media-centre/nearly-70-species-of-wildlife-observed-using-mandai-wildlife-bridge-since-its-opening-in-2019.html
  fetched: '2026-11-08'
  quote: There will be continued monitoring to track usage of the wildlife bridge by some of the more
    elusive residents of the area by Mandai Wildlife Group.
- claim: Says it supports a partner project by funding regular gibbon population surveys.
  url: https://www.mandai.com/en/partnerships/conservation-programmes.html
  fetched: 2026-11-08
  quote: We support CPCP through funding regular gibbon population surveys
- claim: Says it gives financial support for post-release monitoring of black-winged mynas under the Cikananga
    Conservation Breeding Center programme, which aims to breed and eventually reintroduce the birds.
  url: https://www.mandai.com/en/partnerships/conservation-programmes.html
  fetched: 2026-11-08
  quote: providing financial support for the post-release monitoring of the birds
- claim: In 2019 the Mandai Research Fund, disbursed by Mandai Park Development, awarded SGD 600,000 to
    four projects, including an insect survey by Lee Kong Chian Natural History Museum researchers.
  url: https://www.mandai.com/en/about-mandai/media-centre/over-half-a-million-dollars-in-research-grants-awarded-by-mandai.html
  fetched: 2026-11-08
  quote: grants amounting to SGD $600,000 under the Mandai Research Fund
