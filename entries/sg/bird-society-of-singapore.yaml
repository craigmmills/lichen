summary: Registered society, launched on 27 August 2023 after the Singapore Birds
  Project, that partnered with eBird in October 2025 and runs the Singapore Bird Database.
facts:
- claim: Says it registered as a society after working as the Singapore Birds Project,
    and held its launch on 27 August 2023.
  url: https://singaporebirds.com/blog/the-bird-society-of-singapore-is-officially-launched
  fetched: 2026-11-15
  quote: By registering as a Society, we demonstrate our commitment to our mission,
    as we now have a formal structure and defined membership.
- claim: Its launch post describes its online work publishing species writeups and
    the Singapore Bird Database.
  url: https://singaporebirds.com/blog/the-bird-society-of-singapore-is-officially-launched
  fetched: 2026-11-15
  quote: Discussing our efforts in the online space in publishing species writeups
    as well as the Singapore Bird Database
- claim: Says it partnered with eBird in October 2025 and that its moderating team
    works to improve the quality and reliability of the local eBird database.
  url: https://singaporebirds.com/2025/12/09/why-am-i-receiving-emails-from-ebird-moderators/
  fetched: 2026-11-15
  quote: The Bird Society of Singapore has partnered with eBird and our moderating
    team are working hard to improve the quality and reliability of the local database.
- claim: In its December 2025 post, the society said it planned to tighten Singapore's
    eBird filters and might ask observers for evidence to support flagged records.
  url: https://singaporebirds.com/2025/12/09/why-am-i-receiving-emails-from-ebird-moderators/
  fetched: 2026-11-15
  quote: Primarily, we’ll be tightening the eBird filters (species and counts that
    will be “flagged” observations).
