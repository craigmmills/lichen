summary: Collaboration between NParks and Delta Electronics set up to start the 100k
  Corals Initiative, with tanks announced in December 2024 to carry a smart aquaculture
  system for remote monitoring, and a citizen science training programme planned.
facts:
- claim: NParks describes it as a collaborative project with Delta Electronics, set
    up to start the 100k Corals Initiative.
  url: https://www.nparks.gov.sg/news/news-detail/nparks-launches-singapore-s-most-extensive-coral-restoration-effort--tapping-on-technology-and-research-to-plant-100-000-corals-in-singapore-s-waters
  fetched: 2026-11-12
  quote: Established to kickstart the 100k Corals Initiative, the NParks-Delta Corals
    Research Programme is a collaborative project between NParks and Delta Electronics
    that integrates smart technology into NParks’ coral cultivation efforts.
- claim: NParks' December 2024 announcement said the tanks would be installed with
    a Delta smart aquaculture system designed to monitor water conditions and transmit
    data to researchers for real-time remote monitoring.
  url: https://www.nparks.gov.sg/news/news-detail/nparks-launches-singapore-s-most-extensive-coral-restoration-effort--tapping-on-technology-and-research-to-plant-100-000-corals-in-singapore-s-waters
  fetched: 2026-11-12
  quote: The tanks will be installed with a smart coral culture aquaculture system
    set up by Delta that integrates intelligent aquaculture and environment management.
- claim: NParks says a training programme for citizen science monitoring of the transplanted
    corals is to be developed with SJINML and Friends of Marine Park.
  url: https://www.nparks.gov.sg/news/news-detail/nparks-launches-singapore-s-most-extensive-coral-restoration-effort--tapping-on-technology-and-research-to-plant-100-000-corals-in-singapore-s-waters
  fetched: 2026-11-12
  quote: A training programme will also be developed by NParks, SJINML and Friends
    of Marine Park for citizen science monitoring of the transplanted corals
