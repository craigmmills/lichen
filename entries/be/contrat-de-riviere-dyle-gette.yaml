summary: River contract non-profit set up on 5 July 2009 by merging two river contracts,
  whose partners voluntarily commit to an action programme for the Dyle-Gette basin,
  one of 14 Walloon sub-basins.
facts:
- claim: The non-profit was set up on 5 July 2009 by merging the Dyle and Gette river
    contracts, as the legal framework for Walloon river contracts requires.
  url: https://crdg.eu/crdg-2/historique/le-contrat-de-riviere-dyle-gette
  fetched: '2026-11-17'
  quote: l'asbl "Contrat de rivière Dyle-Gette" s'est mise en place en 2009, entérinant
    la fusion des deux contrats de rivière.
- claim: The partners (institutions, business federations, associations) commit voluntarily
    to carry out an action programme for the whole river basin.
  url: https://crdg.eu/crdg-2/historique/le-contrat-de-riviere-dyle-gette
  fetched: '2026-11-17'
  quote: Les partenaires (institutions,fédérations d’entreprises, associations…) s’engagent,
    dans une démarche volontaire, à réaliser un programme d’actions.
- claim: The Dyle-Gette is one of 14 hydrographic sub-basins set by the Walloon Government
    in February 2000; the Walloon part of the Dyle basin covers 668 square kilometres.
  url: https://crdg.eu/crdg-2/historique/le-contrat-de-riviere-dyle-gette
  fetched: '2026-11-17'
  quote: La superficie du bassin wallon est de 668 km 2 .
