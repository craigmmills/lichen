summary: Research drone that, from May 2025, was to fly autonomously every day over De Inslag
  forest with seven instruments, recording tree species, health, water content, drought stress
  and wildfire risk.
facts:
- claim: The University of Antwerp announced that from May 2025 the drone would fly autonomously
    every day over De Inslag forest, with seven instruments measuring simultaneously.
  url: https://www.uantwerpen.be/en/research-groups/global-change-ecology/news/2025/drone-brasschaat/
  fetched: 2026-11-08
  quote: A unique drone from the University of Antwerp will now fly autonomously every day
    over the Brasschaat forest De Inslag.
- claim: Its data show the tree species present, photosynthesis, health, water content and
    drought stress of the trees in the forest.
  url: https://www.uantwerpen.be/en/research-groups/global-change-ecology/news/2025/drone-brasschaat/
  fetched: 2026-11-08
  quote: This data provides us with insights into the tree species present, photosynthesis
    activity, health, water content, and drought stress of all the trees in the forest
- claim: It can also map wildfire risk.
  url: https://www.uantwerpen.be/en/research-groups/global-change-ecology/news/2025/drone-brasschaat/
  fetched: 2026-11-08
  quote: In addition, it can also map the risk of a wildfire.
