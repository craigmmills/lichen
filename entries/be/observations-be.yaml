summary: Belgian nature database launched in 2008, run by Natagora and built with
  Natuurpunt; Natagora reported over 80 million observations in December 2024, checked
  by AI or volunteers.
facts:
- claim: Natagora reported in December 2024 that it was Belgium’s largest participatory
    naturalist database, with more than 80 million observations.
  url: https://www.natagora.be/news/10-millions-dobservations-naturalistes-en-1
  fetched: 2026-11-02
  quote: Observations.be est la plus grande base de données naturalistes participative
    du pays, avec plus de 80 millions d'observations.
- claim: Artificial intelligence assesses reliability and decides which observations
    need extra checks.
  url: https://www.natagora.be/news/10-millions-dobservations-naturalistes-en-1
  fetched: 2026-11-02
  quote: l'intelligence artificielle qui évalue la fiabilité des observations, déterminant
    lesquelles nécessitent un contrôle supplémentaire
- claim: Covers more than 21,000 species.
  url: https://www.natagora.be/observationsbe-un-portail-dencodage-pour-tous
  fetched: '2026-11-02'
  quote: le portail rassemble des données concernant plus de 21 000 espèces
