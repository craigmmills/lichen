summary: Limburg nature area of more than 12,000 hectares of managed and protected
  forest and heath across ten municipalities, with a National Park Bureau acting for
  a 32-partner coalition.
facts:
- claim: The park is a nature area in Limburg where more than 12,000 hectares of forest
    and heath are managed and protected, across ten municipalities.
  url: https://www.nationaalparkhogekempen.be/nl/over-ons
  fetched: '2026-11-17'
  quote: Het Nationaal Park Hoge Kempen, in de Belgische provincie Limburg, is een
    uniek natuurgebied waar meer dan 12 000 hectare bos en heide beheerd en beschermd
    worden.
- claim: A National Park Bureau acts for the 32-partner National Park Coalition, which
    the nature managers, municipalities, province and Flemish government form together;
    the Bureau is hosted within Regionaal Landschap Kempen en Maasland.
  url: https://www.nationaalparkhogekempen.be/nl/over-ons
  fetched: '2026-11-17'
  quote: Het Regionaal Landschap Kempen en Maasland vzw is de opdrachthouder voor
    de uitbouw van het Nationaal Park Bureau binnen haar werking.
- claim: The Agency for Nature and Forests, Natuurpunt, Limburgs Landschap and Orchis
    each manage their own terrain in the park; the Agency is responsible for managing
    a large part of the public land.
  url: https://www.nationaalparkhogekempen.be/nl/natuur/natuurbeheer
  fetched: '2026-11-17'
  quote: Het Agentschap voor Natuur en Bos van de Vlaamse Overheid is verantwoordelijk
    voor het beheer van een groot deel van de publieke eigendommen in het Nationaal
    Park Hoge Kempen.
