  quote: Il s’étend ainsi, au sud-ouest de la Province de Namur, sur plus de 48.000
    ha et près de 30.000 personnes y habitent.
- claim: Names protecting nature as an essential mission.
  url: https://pnvh.org/parc-naturel/
