summary: Belgium-registered organisation that, in an April 2026 article, said it uses AI to
  sort camera-trap images and identify species, and that funds the Semois monitoring project.
facts:
- claim: Its April 2026 article says AI automatically sorts WWF wildlife camera images and
    helps identify species.
  url: https://wwf.be/nl/actualiteit/ai-en-natuurbehoud-van-illusie-tot-bescherming
  fetched: 2026-11-02
  quote: AI sorteert deze gegevens nu automatisch en biedt hulp bij soorten identificeren,
    waardoor de analysetijd aanzienlijk wordt verkort.
- claim: Works in Belgium and in areas of Africa, South America, Asia and Europe.
  url: https://wwf.be/nl/actualiteit/ai-en-natuurbehoud-van-illusie-tot-bescherming
  fetched: 2026-11-02
  quote: Zowel in België als in verschillende gebieden van Afrika, Zuid-Amerika, Azië en Europa.
- claim: Wants to monitor with wildlife cameras whether otters reach Grenspark Kempenbroek.
  url: https://wwf.be/nl/projecten/otter-in-vlaanderen
  fetched: 2026-11-02
  quote: Of die zijn weg naar het park vindt, willen we monitoren met wildcamera’s.
- claim: Works in Belgium and in several areas of Africa, South America, Asia and Europe.
  url: https://wwf.be/nl/actualiteit/ai-helpt-natuurbehoud-de-semois
  fetched: '2026-11-02'
  quote: WWF-België komt in actie om de achteruitgang van de natuur te stoppen. Zowel in België
    als in verschillende gebieden van Afrika, Zuid-Amerika, Azië en Europa.
- claim: Gives financial support to the Semois monitoring project through its partnership
    with the park.
  url: https://wwf.be/nl/actualiteit/ai-helpt-natuurbehoud-de-semois
  fetched: '2026-11-02'
  quote: Dit project wordt geleid door het Nationaal Park Semoisvallei met financiële steun
    van WWF-België in het kader van ons lopende partnerschap.
- claim: Says its wildlife monitoring with camera traps produced tens of thousands of images
    of fifty species.
  url: https://wwf.be/nl/projecten/semoisvallei-paradijs-otter-lynx
  fetched: '2026-11-02'
  quote: Onze faunamonitoring met wildcamera's leverde tienduizenden beelden op van vijftig
    verschillende diersoorten.
- claim: Says donors enabled it to buy a high-tech drone in the Scheldt valley.
  url: https://wwf.be/nl/actualiteit/deze-drone-beschermt-otters-en-waakt-over-de-biodiversiteit
  fetched: '2026-11-02'
  quote: waar we met jullie steun een hoogtechnologische drone konden kopen
- claim: Registered in Belgium.
  url: https://wwf.be/fr/projets/semois
  fetched: '2026-11-02'
  quote: 'Numéro d’enregistrement national: BE 0408.656.248'
- claim: Its April 2026 article says WWF uses AI to sort camera-trap images and help identify
    species.
  url: https://wwf.be/nl/actualiteit/ai-en-natuurbehoud-van-illusie-tot-bescherming
  fetched: '2026-11-02'
  quote: AI sorteert deze gegevens nu automatisch en biedt hulp bij soorten identificeren
- claim: Co-manages, with Natagora, the lake of Virelles, the 'gateway' to the national park.
  url: https://wwf.be/nl/actualiteit/ken-jij-de-zes-nationale-parken-van-belgie
  quote: 'samen met Natagora beheren we de ''toegangspoort'' tot het nationaal park: het meer
    van Virelles'
