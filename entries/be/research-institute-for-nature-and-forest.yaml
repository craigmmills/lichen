  url: https://www.lifewatch.be/news/lifewatch-flanders-ready-next-level
  fetched: 2026-11-02
  quote: The Flemish LifeWatch Consortium consists of the Flanders Marine Institute ( VLIZ
    ) and the Research Institute for Nature and Forest ( INBO ).
- claim: The GBIF.be team includes a data officer at INBO.
  url: https://gbif.biodiversity.be/post/2024/node-staff/
