summary: Three-year project begun in June 2025, led and run by VITO and funded by VLAIO, aiming to identify
  and quantify plastic litter in the Belgian North Sea and Scheldt estuary using remote sensing and AI.
facts:
- claim: Kicked off in June 2025 as a three-year project.
  url: https://vito.be/en/news/seabed-satellite-vito-leads-research-plastic-pollution-innovative-detection-technologies
  fetched: '2026-11-02'
  quote: The kick-off of this three-year project took place in June 2025.
- claim: VITO is investigating how drone images, cameras, smartphones and AI can help identify plastic.
  url: https://vito.be/en/news/seabed-satellite-vito-leads-research-plastic-pollution-innovative-detection-technologies
  fetched: '2026-11-02'
  quote: is investigating how drone images, images from special cameras and smartphones, and artificial
    intelligence can help to identify plastic on banks and beaches
- claim: Aims to identify and quantify plastic litter in the Belgian North Sea and Scheldt estuary using
    remote sensing, advanced AI data processing and modelling.
  url: https://remotesensing.vito.be/news/sspirit-tackling-plastic-pollution
  fetched: '2026-11-02'
  quote: using state-of-the-art remote sensing technologies, advanced (AI) data processing and modelling
