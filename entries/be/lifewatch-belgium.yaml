summary: Belgian programme combining regional and federal contributions, one of eight
  LifeWatch ERIC national nodes, with camera traps and acoustic and genomic observatories,
  which says AI analyses remote sensing data.
facts:
- claim: Flanders built biodiversity data systems and observation infrastructure from
    2012 to 2020 as part of its commitment to LifeWatch.
  url: https://www.lifewatch.be/news/lifewatch-flanders-ready-next-level
  fetched: 2026-11-02
  quote: In recent years (2012-2020), Flanders has built a unique set of biodiversity
    data systems and observation infrastructure.
- claim: The Flemish LifeWatch observatories and connected virtual laboratories maintained
    by VLIZ and INBO generate open data.
  url: https://www.lifewatch.be/news/lifewatch-flanders-ready-next-level
  fetched: 2026-11-02
  quote: The regional marine, freshwater and terrestrial observatories and the connected
    virtual laboratories, maintained by both VLIZ and INBO generate open data through
    automated and innovative pipelines
- claim: Monitors bats along the Belgian coast by passively listening to echolocation
    calls.
  url: https://www.lifewatch.be/bats
  fetched: 2026-11-02
  quote: Within LifeWatch we monitor the presence of bats along the Belgian coast
    on a long term basis by passively listening to their echolocation calls.
- claim: Combines the regional and federal LifeWatch contributions from Belgium.
  url: https://www.lifewatch.be
  fetched: '2026-11-02'
  quote: LifeWatch Belgium, also called the National Distributed Centre for LifeWatch
    Belgium combines the regional and federal LifeWatch contributions from Belgium.
- claim: One of the eight national nodes of LifeWatch ERIC.
  url: https://www.lifewatch.be/about-lifewatch
  fetched: '2026-11-02'
  quote: LifeWatch Belgium is one of the eight national nodes composing LifeWatch
    ERIC
- claim: Says remote sensing data are analysed using artificial intelligence.
  url: https://www.lifewatch.be/remote-sensing-0
  fetched: '2026-11-02'
  quote: The data is analysed using artificial intelligence in order to translate
    the signal into meaningful geographic information.
- claim: Says it has built a dynamic camera trap network.
  url: https://www.lifewatch.be/camera-trapping-0
  fetched: '2026-11-02'
  quote: For LifeWatch, we have built a dynamic camera trap network
- claim: Describes plankton imaging with semi-automated recognition.
  url: https://www.lifewatch.be/plankton-imaging-0
  fetched: '2026-11-02'
  quote: quick detection of plankton and its semi-automated recognition
- claim: Runs genomic observatories in the Belgian part of the North Sea using DNA-based
    techniques.
  url: https://www.lifewatch.be/genomic-observatories
  fetched: '2026-11-02'
  quote: Under the genomic observatories, we investigate a range of habitats and taxa
    in the Belgian Part of the North Sea using DNA-based techniques.
- claim: Operates a broadband acoustic network in the Belgian part of the North Sea.
  url: https://www.lifewatch.be/acoustics-0
  fetched: '2026-11-02'
  quote: LifeWatch Belgium operates a broadband acoustic network in the Belgian part
    of the North Sea
- claim: Volunteers look after some camera traps.
  url: https://lifewatch.be/citizen-science
  fetched: '2026-11-02'
  quote: In the camera trap network, some camera traps are assigned to volunteers
