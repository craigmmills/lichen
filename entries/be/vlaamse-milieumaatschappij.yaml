facts:
- claim: BEPROACT reports that VMM staff showed how sensors, alarms and AI-based methods are
    applied to water quality in Flanders.
  url: https://beproact.nweurope.eu/blog/beproact-news-23/smart-monitoring-and-ai-for-better-water-quality-management-2270
  fetched: 2026-11-02
  quote: Koen De Witte and Simon Nachtergaele from Vlaamse Milieumaatschappij (VMM) demonstrated
    how advanced sensors, smart alarms and AI-based methods are being applied to monitor and
    interpret water quality in Flanders.
- claim: Uses multiparameter probes that report water quality every 15 minutes.
  url: https://vmm.vlaanderen.be/beleid/waterbeleid/kwaliteit-waterlopen/sensoren-en-iot
  fetched: '2026-11-02'
  quote: Die leveren elke 15 minuten data aan over de waterkwaliteit.
- claim: Takes part in LIFE SMART IAS with fieldwork in Belgium.
