summary: Closed citizen science project that sought 5,000 sensor hosts in 2021, transmitted
  real-time data to the University of Antwerp and continued in 2022 with 3,000 soil
  sensors.
facts:
- claim: In 2021, the project appealed to 5,000 citizen scientists to place a smart
    sensor in a garden, school playground, park or private land.
  url: https://www.uantwerpen.be/en/research-groups/geobiology/research/past-research-projects/curieuzeneuzen-garden/
  fetched: 2026-11-08
  quote: CurieuzeNeuzen appealed 5000 citizen scientists to place a smart sensor in
    their garden, school playground, park or private domain.
- claim: The sensors sent their data to the University of Antwerp's database over
    the Internet of Things, in real time.
  url: https://www.uantwerpen.be/en/research-groups/geobiology/research/past-research-projects/curieuzeneuzen-garden/
  fetched: 2026-11-08
  quote: These smart sensors transmitted their data to the database of the University
    of Antwerp by using the Internet of Things, thereby making the data available
    to scientists in real time.
- claim: Extended in 2022 with 3,000 sensors in the soil.
  url: https://www.uantwerpen.be/en/research-groups/geobiology/research/past-research-projects/curieuzeneuzen-garden/
  fetched: 2026-11-08
  quote: 'The project was extended for 2022: 3000 smart sensors were placed in the
    soil for CurieuzeNeuzen in the Garden.'
