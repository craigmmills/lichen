summary: The Brussels Capital Region's public environment and energy body, founded in 1989
  according to GBIF, which drew up the Brussels Forêt de Soignes management plan, revised
  in June 2019.
facts:
- claim: Drew up the management plan for the Brussels part of the Forêt de Soignes, adopted
    in 2003 and revised and adopted in June 2019.
  url: https://environnement.brussels/thematiques/espaces-verts-et-biodiversite/action-de-la-region/plan-de-gestion-pour-la-foret-de
  fetched: 2026-11-02
  quote: Bruxelles Environnement a élaboré pour la forêt de Soignes un plan de gestion qui
    a été adopté par le Gouvernement bruxellois en 2003.
- claim: The Region has designated 14 nature reserves and two forest reserves.
  url: https://environnement.brussels/citoyen/lenvironnement-bruxelles/preserver-la-nature-en-ville/les-reserves-naturelles-forestieres-et-archeologiques-de-bruxelles-qui-protegent-la-biodiversite
  fetched: 2026-11-02
  quote: 14 réserves naturelles (130 ha) et 2 réserves forestières (112 ha) ont été désignées
    en Région de Bruxelles-Capitale.
- claim: The public body with a wide range of powers on environment, animal welfare and energy
    policy.
  url: https://leefmilieu.brussels/burgers/over-leefmilieu-brussel
  fetched: '2026-11-02'
  quote: Leefmilieu Brussel is de openbare instelling die op het vlak van milieu, dierenwelzijn
    en energiebeleid een uitgebreid gamma aan bevoegdheden beheert.
- claim: GBIF's publisher record describes it as the public service for the environment and
    energy of the Brussels Capital Region, founded in 1989.
  url: https://api.gbif.org/v1/organization/e8626d75-f861-4496-afc8-6826153a67cd
  fetched: &id001 2026-11-02
  quote: Founded in 1989, Brussels Environment is the public service for the environment and
    energy of the Brussels Capital Region.
- claim: It prepares and carries out the environmental policy of the Brussels Capital Region.
  url: https://leefmilieu.brussels/burgers/over-leefmilieu-brussel
  fetched: *id001
  quote: Leefmilieu Brussel verzorgt de voorbereiding en uitvoering van het milieubeleid van
    het Brussels Hoofdstedelijk Gewest.
- claim: GBIF's publisher record lists management of the Sonian Forest, green spaces and natural
    areas among its areas of work.
  url: https://api.gbif.org/v1/organization/e8626d75-f861-4496-afc8-6826153a67cd
  fetched: *id001
  quote: management of the Sonian Forest, green spaces and natural areas
- claim: It started a network in 1992 that tracks the state of the environment through bio-indicators.
  url: https://leefmilieu.brussels/burgers/regionaal-beleid/rapporten-van-milieuprojecten/toezicht-en-inventaris-van-de-fauna-flora-en-hun-habitats-brussel
  fetched: *id001
  quote: Dit ‘Informatie- en toezichtnetwerk’ werd in 1992 door Leefmilieu Brussel opgestart.
