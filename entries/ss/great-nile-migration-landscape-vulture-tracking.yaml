summary: Active vulture research project led by African Parks with the Endangered
  Wildlife Trust; Radio Yei reported 15 vultures tagged in Badingilo National Park,
  and 2024 Boma tags reportedly show travel to Kenya, Ethiopia and Chad.
facts:
- claim: Radio Yei reported on 28 June 2026 that 15 vultures were fitted with tracking
    tags in Badingilo National Park, in a research effort that follows 27 birds.
  url: https://radioyei.org/news/environment/vultures-tagged-in-badingilo-to-track-migration-routes/
  fetched: 2026-11-15
  quote: 15 vultures have been fitted with tracking tags in Badingilo National Park,
    strengthening a research effort that now follows 27 birds across South Sudan and
    beyond.
- claim: The article describes the operation as the second phase of vulture research
    in the Great Nile Migration Landscape.
  url: https://radioyei.org/news/environment/vultures-tagged-in-badingilo-to-track-migration-routes/
  fetched: 2026-11-15
  quote: It marks the second phase of vulture research inside the Great Nile Migration
    Landscape
- claim: The article says tags placed in Boma National Park in 2024 have delivered
    data showing the birds travel to Kenya, Ethiopia and Chad.
  url: https://radioyei.org/news/environment/vultures-tagged-in-badingilo-to-track-migration-routes/
  fetched: 2026-11-15
  quote: Tags placed in Boma National Park in 2024 have already delivered clear data.
    The birds breed in South Sudan and then travel to Kenya, Ethiopia and as far west
    as Chad.
