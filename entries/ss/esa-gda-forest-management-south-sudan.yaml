summary: Active European Space Agency activity using Copernicus satellite data to support a World Bank
  project, mapping tree cover and change from 2018 to 2024 in the Imatong range; both baseline phases
  are complete.
facts:
- claim: The ESA GDA Forest Management activity supports the World Bank's South Sudan Natural Resources
    and Livelihoods Project with satellite Earth observation to identify priority areas for community
    forest management.
  url: https://gda.esa.int/?p=9064
  fetched: 2026-11-12
  quote: The ESA Global Development Assistance (GDA) Forest Management activity is supporting the South
    Sudan Natural Resources & Livelihoods Project, run by the World Bank (WB).
- claim: Both phases of baseline geospatial products are complete, with a final feedback session still
    to be held.
  url: https://gda.esa.int/?p=9064
  fetched: 2026-11-12
  quote: Both phases are now complete, with a final feedback session with the WB team and national counterparts
    still to be held
- claim: Using Copernicus data, the consortium mapped tree cover, its condition and its change from 2018
    to 2024 in the Imatong range and surrounding cross-border areas.
  url: https://knowledge-hub-gda.esa.int/?p=2791
  fetched: 2026-11-12
  quote: has mapped where tree cover exists, its condition, and how it has changed from 2018–2024, focusing
    on the Imatong mountain range and surrounding cross‑border areas
- claim: Products include a 2020 tree cover density map for the demonstration site.
  url: https://gda.esa.int/?p=9064
