summary: Programme run by the wildlife ministry and WCS, with USAID funding, that in 2013 fitted elephants
  with GPS collars and by July 2013 also monitored collars on kob, tiang and giant eland.
facts:
- claim: In 2013 the ministry, with WCS assistance and USAID funding, fitted elephants with GPS collars
    for remote tracking.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/5697/South-Sudan-Expands-Efforts-To-Protect-Remaining-Elephants.aspx
  fetched: 2026-11-12
  quote: With expert assistance from the Wildlife Conservation Society and funding from USAID, South Sudan’s
    Ministry of Wildlife Conservation and Tourism (MWCT) has ramped up efforts to protect its last elephants
    by fitting individual animals with GPS collars for remote tracking
- claim: In July 2013, WCS reported that the wildlife tracking programme was also monitoring GPS/satellite
    collars on white-eared kob, tiang and giant eland.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/5697/South-Sudan-Expands-Efforts-To-Protect-Remaining-Elephants.aspx
  fetched: 2026-11-12
  quote: The wildlife tracking program is also monitoring GPS/satellite collars previously deployed on
    key migratory antelope species white-eared kob, tiang, and giant eland.
