summary: Closed 2022 to 2025 African Parks project in Boma and Badingilo National Parks, which planned
  to tag 94 more animals and enhance aerial surveillance, after what is described as South Sudan's largest
  collaring operation.
facts:
- claim: Since its 2022 co-management agreement, African Parks has carried out aerial surveillance and
    completed South Sudan's largest wildlife collaring operation.
  url: https://www.fondationsegre.org/increasing-operational-capacity-in-south-sudan-to-develop-conservation-strategies-for-the-boma-badingilo-landscape/
  fetched: 2026-11-12
  quote: Since entering into a 10-year co-management agreement in 2022, African Parks has established
    ranger teams, carried out aerial surveillance, and completed South Sudan’s largest wildlife collaring
    operation.
- claim: For the 2022–2025 project, African Parks planned to tag 94 additional animals and enhance aerial
    surveillance and habitat monitoring.
  url: https://www.fondationsegre.org/increasing-operational-capacity-in-south-sudan-to-develop-conservation-strategies-for-the-boma-badingilo-landscape/
  fetched: 2026-11-12
  quote: expand wildlife collaring by tagging 94 additional individuals for monitoring, and enhance aerial
    surveillance and habitat monitoring
- claim: Radio Tamazuj reports that African Parks teams use camera traps to study wildlife movement across
    the landscape.
  url: https://www.radiotamazuj.org/en/news/article/african-parks-repeated-lion-sightings-offer-hope-for-south-sudan
  fetched: 2026-11-12
  quote: As part of ongoing conservation efforts, African Parks teams are using camera traps to better
    understand wildlife movement across the vast landscape.
