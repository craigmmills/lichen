summary: Web app built by Makhosane Morapeli that combines map and satellite data using the
  RUSLE model to map safe, at-risk and endangered land by village and year, with field tests
  under way in August 2025.
facts:
- claim: The National University of Lesotho reported in August 2025 that a Computer Systems
    student, Makhosane Morapeli, created a tool that shows where soil might be lost in future.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: He created a computer tool that can look at the land, study its secrets, and show
    us where the soil might disappear in the future.
- claim: The tool collects data from maps and satellites.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: First, the tool collects “ingredients” from maps and satellites up in space.
- claim: It combines the data using the RUSLE soil loss model.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: That recipe is called RUSLE
- claim: The page says the tool studies patterns in rainfall, slope, plant and soil data and
    learns what usually happens next.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: It studies patterns from all that data—rainfall, slopes, plants, soils—and learns
    what usually happens next.
- claim: It is set up as a web app that maps safe, at-risk and endangered land for a chosen
    village and year.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: The tool is set up as a web app, which is just a program you can open online.
- claim: In August 2025, field tests were being run to compare its predictions with real erosion
    sites.
  url: https://nul.ls/nul-student-s-app-lets-you-see-soil-erosion-before-it-happens/
  fetched: 2026-11-12
  quote: field tests are now being conducted to check how well the predictions and estimates
    match what really happens on the ground
