summary: Land cover mapping project run and built by FAO under Lesotho's Integrated Catchment Management
  programme; FAO said in March 2023 it had trained 61 national staff and set six annual baselines for
  2017 to 2022.
facts:
- claim: The project builds the government's capacity to produce standardised, validated official annual
    land cover maps from free Earth observation data, vegetation and climate modelling and field survey
    data.
  url: https://www.fao.org/sustainable-development-goals-data-portal/resources/news/news-detail/next-generation-earth-observation-tools-help-monitor-land-cover-change-in-lesotho/en
  fetched: 2026-11-12
  quote: EOSTAT uses next generation Earth observation tools to monitor land cover change in Lesotho.
- claim: It analyses satellite images with machine learning to assess land cover change.
  url: https://www.fao.org/sustainable-development-goals-data-portal/resources/news/news-detail/next-generation-earth-observation-tools-help-monitor-land-cover-change-in-lesotho/en
  fetched: 2026-11-12
  quote: It also introduces analysis of satellite images using machine learning to assess land cover change
    in an objective and quantitative manner
- claim: FAO said in March 2023 that the project had trained 61 national staff and established six annual
    land cover baselines for 2017 to 2022.
  url: https://www.fao.org/sustainable-development-goals-data-portal/resources/news/news-detail/next-generation-earth-observation-tools-help-monitor-land-cover-change-in-lesotho/en
  fetched: 2026-11-12
  quote: EOSTAT has trained 61 national staff from different institutions and established six annual land
    cover baselines (2017–2022)
- claim: The project falls under Lesotho's Integrated Catchment Management programme.
  url: https://www.fao.org/sustainable-development-goals-data-portal/resources/news/news-detail/next-generation-earth-observation-tools-help-monitor-land-cover-change-in-lesotho/en
  fetched: 2026-11-12
  quote: FAO’s EOSTAT project falls under the national Integrated Catchment Management (ICM) programme
