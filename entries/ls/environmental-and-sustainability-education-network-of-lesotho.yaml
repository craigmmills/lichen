summary: Lesotho NGO with GEF Small Grants Programme support, which the GEF reports
  surveyed Southern Bald Ibis with local communities, counting up to 29 birds on one
  cliff.
facts:
- claim: The GEF reports an annual survey of the Southern Bald Ibis on the Thaba-Khubelu
    and Ha-Sechele cliffs in Tlokoeng Valley, conducted by the NGO ESENEL and local
    communities, which counted up to 29 birds and 6 to 10 active nests a year on one
    cliff.
  url: https://www.thegef.org/news/engaging-herd-boys-conserve-southern-bald-ibis-mountain-kingdom-lesotho
  fetched: 2026-11-12
  quote: An annual survey, conducted by the NGO Environmental and Sustainability Education
    Network of Lesotho (ESENEL) and the local communities, counted a maximum of 29
    birds and 6 – 10 active nests each year on one cliff
- claim: With GEF Small Grants Programme support, ESENEL implemented a project to
    conserve the Southern Bald Ibis by reducing threats, educating the local community
    and developing eco-tourism.
  url: https://www.thegef.org/news/engaging-herd-boys-conserve-southern-bald-ibis-mountain-kingdom-lesotho
  fetched: 2026-11-12
  quote: With the support of GEF SGP Lesotho, ESENEL implemented a project to conserve
    the Southern Bald Ibis
- claim: Unemployed youth took part in the project's scientific surveys under the
    supervision of an ornithologist.
  url: https://www.thegef.org/news/engaging-herd-boys-conserve-southern-bald-ibis-mountain-kingdom-lesotho
  fetched: 2026-11-12
  quote: unemployed youth became involved in conducting the project’s scientific surveys
