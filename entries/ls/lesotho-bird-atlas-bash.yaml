summary: Closed bird-recording series run by BirdLife South Africa and the LHDA, reportedly
  logging 2,601 records of 135 species in 2023, with another bash in February 2025.
facts:
- claim: BirdLife South Africa reports that the first Lesotho atlas bash, in 2023,
    was coordinated by BirdLife South Africa and the LHDA to obtain species distribution
    data for the Polihali catchment.
  url: https://www.birdlife.org.za/february-2024-newsletter/
  fetched: 2026-11-12
  quote: In 2023 nine birders participated in the first Lesotho atlas bash, coordinated
    by BirdLife South Africa and the Lesotho Highlands Development Authority (LHDA).
- claim: During the 2023 bash, data were collected using SABAP2 protocols, with point
    data recorded in the BirdLasser app, and 2,601 records of 135 species were logged.
  url: https://www.birdlife.org.za/february-2024-newsletter/
  fetched: 2026-11-12
  quote: The data were collected using SABAP2 protocols and point data were recorded
    using the BirdLasser mobile app. During the bash, 2601 records for 135 species
    were logged
- claim: An LHDA news item reports a Bird Atlas Bash from 7 to 10 February 2025 targeting
    the eastern region of Mokhotlong and Ha Lejone in the western area near Katse
    Dam.
  url: https://www.lhda.org.ls/Uploads/Documents/Newsroom/News/Preserving%20our%20biodiversity.pdf
  fetched: 2026-11-12
  quote: February 2025 targeting the eastern region of Mokhotlong and Ha Lejone in
    the western
