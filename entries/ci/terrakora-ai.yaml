summary: Based in Abidjan and Toronto, the company reportedly signed a 24-month environment ministry agreement
  on 2 October 2026, with mapping and carbon work expected.
facts:
- claim: African Sustainability Matters describes it as an Ivorian geospatial technology company that
    signed a 24-month framework agreement with the Ministry of Environment and Ecological Transition on
    2 October 2026.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: 2026-11-08
  quote: The Ministry of Environment and Ecological Transition signed a 24-month framework agreement with
    Ivorian geospatial technology company TerraKora AI on October 2
- claim: The same article says the partnership will combine Earth observation, geospatial analysis, AI
    and digital MRV systems; it describes the mapping and carbon work as expected, not yet delivered.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: 2026-11-08
  quote: The technology is expected to combine satellite imagery with field-level information and artificial
    intelligence to map land use, identify environmental changes, monitor ecosystem restoration and estimate
    carbon stocks.
- claim: The article says the company has positioned its technology around sovereign environmental data
    infrastructure, including satellite observation, AI and environmental modelling.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: 2026-11-08
  quote: TerraKora AI has positioned its technology around the development of sovereign environmental
    data infrastructure, including satellite observation, artificial intelligence and environmental modelling.
- claim: African Sustainability Matters reports that the Ministry of Environment and Ecological Transition
    signed a 24-month framework agreement with the company on 2 October 2026 to strengthen national capabilities
    for observing, analysing and monitoring ecosystems.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: '2026-11-08'
  quote: The Ministry of Environment and Ecological Transition signed a 24-month framework agreement with
    Ivorian geospatial technology company TerraKora AI on October 2 to strengthen national capabilities
    for observing, analysing and monitoring ecosystems.
