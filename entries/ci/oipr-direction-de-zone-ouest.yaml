summary: Western zone directorate of the Office Ivoirien des Parcs et Réserves, whose
  staff were reportedly trained in June 2026 in satellite monitoring, and which reported
  about 496 elephant camera-trap observations at Mont Péko in 2025.
facts:
- claim: In June 2026 about ten OIPR staff from Mont Péko, Mont Sangbé and the Mont
    Nimba reserve, including ecological monitoring specialists, were trained in satellite
    monitoring of protected areas, according to man-info.net.
  url: https://man-info.net/2026/06/21/duekoue-la-zone-ouest-de-loipr-entre-dans-lere-du-satellite-pour-proteger-ses-forets/
  fetched: '2026-11-12'
  quote: chefs de services, spécialistes du suivi écologique, coordonnateurs de brigades
    mobiles et chefs de secteurs des parcs nationaux du Mont Péko, du Mont Sangbé
    et de la Réserve naturelle intégrale du Mont Nimba ont été initiés aux outils
    de télédétection appliqués à la surveillance environnementale
- claim: The training included supervised classification of Sentinel-2 images and
    an updated map of Mont Péko National Park, which man-info.net says will feed the
    park's SMART system and patrol risk maps.
  url: https://man-info.net/2026/06/21/duekoue-la-zone-ouest-de-loipr-entre-dans-lere-du-satellite-pour-proteger-ses-forets/
  fetched: '2026-11-12'
  quote: Cette cartographie alimentera désormais les outils de gestion du parc, notamment
    le système SMART et les cartes de risques utilisées pour la planification des
    patrouilles.
- claim: The directorate's officer responsible for ecological monitoring and GIS told
    AIP in May 2026 that camera-trap monitoring at Mont Péko National Park recorded
    about 496 elephant observations in 2025 against 182 in 2024.
  url: https://www.aip.ci/cote-divoire-aip-suivi-ecologique-du-parc-national-du-mont-peko-la-faune-en-constante-progression/?amp=1&noamp=mobile
  fetched: '2026-11-12'
  quote: Le suivi par pièges photographiques a renforcé nos connaissances sur la répartition
    et l’abondance relative de la faune.
