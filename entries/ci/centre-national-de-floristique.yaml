summary: A biodiversity information and research centre in Abidjan with an arboretum and a herbarium of
  about 60,000 specimens, publishing 37 datasets through GBIF and run by Université Félix Houphouët-Boigny.
facts:
- claim: Its GBIF publisher record says it houses an arboretum of at least 750 species and a herbarium
    of about 60,000 specimens from Côte d'Ivoire and Africa.
  url: https://api.gbif.org/v1/organization/a3250342-34a5-4101-8831-d1a136483952
  fetched: '2026-11-08'
  quote: It houses an arboretum of at list 750 species and a rich herbarium of about 60 000 specimens
    of Côte d'Ivoire and Africa.
- claim: The same record says it works on biodiversity information management and carries out research.
  url: https://api.gbif.org/v1/organization/a3250342-34a5-4101-8831-d1a136483952
  fetched: '2026-11-08'
  quote: It steps in biodiversity information management. Research activities are also carried out in
    this center.
- claim: The same record shows 37 published datasets.
