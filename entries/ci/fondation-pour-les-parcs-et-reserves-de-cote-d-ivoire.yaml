summary: A foundation that funds the Office Ivoirien des Parcs et Réserves, reported to have signed a
  700 million CFA franc agreement for Taï and Comoé parks in 2017.
facts:
- claim: Abidjan.net reported in May 2017 that the FPRCI signed a funding agreement granting the OIPR
    700 million CFA francs for the recurrent costs of Taï (400 million) and Comoé (300 million) National
    Parks for 2017.
  url: https://news.abidjan.net/articles/615237/mise-en-valeur-des-parcs-de-tai-et-de-la-comoe-la-fondation-pour-les-parcs-et-reserves-octroie-700-millions-a-loipr
  fetched: 2026-11-08
  quote: C'est la bagatelle de 700 millions F CFA que ladite Fondation a attribuée à l'OIPR à hauteur
    de 400 millions pour le financement des couts récurrents du Parc national de Taï et de 300 millions
    pour celui de la Comoé pour l'exercice 2017.
- claim: The same report quotes the FPRCI board chair saying it granted the OIPR 1.6 billion CFA francs
    in non-repayable grants for Taï and Comoé from 2014 to 2016.
  url: https://news.abidjan.net/articles/615237/mise-en-valeur-des-parcs-de-tai-et-de-la-comoe-la-fondation-pour-les-parcs-et-reserves-octroie-700-millions-a-loipr
  fetched: 2026-11-08
  quote: de 2014 à 2016, la FPRCI a octroyé à l'OIPR des subventions non remboursables d'un montant total
    de 1,6 milliards de FCFA pour les Parcs nationaux de Taï et de la Comoé
- claim: AIP reports the OIPR director general saying the foundation provided 8.1% of the resources mobilised
    for protected-area management in 2026.
  url: https://www.aip.ci/cote-divoire-aip-environ-20-milliards-de-fcfa-mobilises-pour-la-gestion-des-aires-protegees-ivoiriens-en-2026/
  fetched: 2026-11-08
  quote: Les quote-parts de contribution des parties prenantes, a souligné Général Tondossama, sont de
    8,1% pour la Fondation pour les parcs et réserves
