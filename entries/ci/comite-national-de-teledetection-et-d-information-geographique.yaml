summary: A national remote sensing and geographic information body that presented a land monitoring geoportal
  in December 2017, reported as developed with C2D support through the French development agency AFD.
facts:
- claim: Abidjan.net, carrying an AIP report of December 2017, says the CNTIG presented a geoportal for
    spatial monitoring of the country's land.
  url: https://news.abidjan.net/articles/627034/la-cote-divoire-se-dote-dun-geoportail-pour-la-surveillance-de-ses-terres
  fetched: 2026-11-08
  quote: La Côte d'Ivoire s'est dotée d'un géoportail pour la surveillance spatiale de ses terres, présenté
    lundi par le directeur général du Comité national de télédétection et d'informations géographiques
    (CNTIG), Dr Edouard Fonh-Gbéi.
- claim: The minister quoted in the same report said the geoportal was developed by the CNTIG to follow
    land cover and land-use change.
  url: https://news.abidjan.net/articles/627034/la-cote-divoire-se-dote-dun-geoportail-pour-la-surveillance-de-ses-terres
  fetched: 2026-11-08
  quote: Ce géoportail, développé par le Comité national de télédétection et d'informations géographiques
    (CNTIG), est un outil important pour le suivi de la dynamique en matière d'occupation des terres et
    de changements d'usage des sols
- claim: The report says the project came from C2D support through the French development agency AFD.
  url: https://news.abidjan.net/articles/627034/la-cote-divoire-se-dote-dun-geoportail-pour-la-surveillance-de-ses-terres
  fetched: 2026-11-08
  quote: Ce projet est la résultante de l'appui du contrat de désendettement et de développement (C2D)
    par le biais de l'agence française pour le développement (AFD).
links:
- type: funded-by
