  url: https://news.abidjan.net/articles/627034/la-cote-divoire-se-dote-dun-geoportail-pour-la-surveillance-de-ses-terres
  fetched: 2026-11-08
  quote: Pour la représentante de l'AFD, Caroline Piquet, il était important pour sa structure de contribuer
    au financement de ce géoportail pour la surveillance spatiale des terres.
