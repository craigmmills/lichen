summary: Closed drone study by Nitidæ's team, published in Drones, that detected 107
  tree losses, about 2 ha, between November 2018 and April 2019 with 97% overall accuracy.
facts:
- claim: Carried out by Nitidæ's team as part of a doctoral thesis and the REDD+ de
    la Mé project, and published in the journal Drones.
  url: https://www.nitidae.org/a-la-une/actualites/detection-des-pertes-d-arbres-dans-les-forets-de-cote-d-ivoire-bossematie-a-l-aide-de-photographies-aeriennes-prises-par-drone
  fetched: 2026-11-12
  quote: Une étude réalisée dans le cadre d’une Thèse de Doctorat et projet REDD+
    de la Mé (PRM) par l’équipe de Nitidæ, a été publiée récemment dans la revue Drones
    .
- claim: Detected 107 tree losses, about 2 ha of deforestation, across the study sites
    between November 2018 and April 2019, with 97% overall accuracy.
  url: https://www.nitidae.org/a-la-une/actualites/detection-des-pertes-d-arbres-dans-les-forets-de-cote-d-ivoire-bossematie-a-l-aide-de-photographies-aeriennes-prises-par-drone
  fetched: 2026-11-12
  quote: Ces données structurales des arbres ont permis de détecter 107 pertes d’arbres
    correspondant à une surface de déforestations de 2 ha sur l’ensemble des sites
    étudiées au cours de la période Novembre 2018 à Avril 2019 avec une précision
    globale de 97%.
