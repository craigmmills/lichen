summary: Primate conservation programme that identified the Tanoé-Ehy swamp forest
  as high conservation value in 2004, with surveillance and ecological monitoring
  documented in 2023 and tree-top cameras in 2022.
facts:
- claim: The programme identified the Tanoé-Ehy swamp forest as a site of high conservation
    value after foot surveys in 2004.
  url: https://www.rasapci.org/index.php/historique/
