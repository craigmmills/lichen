summary: A remote sensing research centre that receives training in the Comoé drone monitoring project
  and belongs to two GMES and Africa consortia on wetlands and coastal areas.
facts:
- claim: GFA's project page names CURAT, with OIPR, as the Ivorian stakeholders receiving training and
    knowledge transfer in the drone wildlife monitoring project.
  url: https://www.gfa-group.de/projects/Drone_data_in_wildlife_surveys_4143703.html
  fetched: 2026-11-08
  quote: notably the Office Ivoirienne des Parcs et Réserves (OIPR) and the Centre Universitaire de Recherche
    et d'Application en Télédétection (CURAT)
- claim: The GMES and Africa consortia page lists it as a Côte d'Ivoire member of the consortium on sustainable
    wetlands and flood management in West Africa, led by the Centre de Suivi Ecologique.
  url: https://gmes4africa.blogspot.com/p/consortia.html?m=0
  fetched: '2026-11-08'
  quote: University Research and Application Center in Remote Sensing (CURAT) ** – Côte d’Ivoire
- claim: The same page says that consortium provides Earth observation products including mangrove mapping
    and invasive aquatic vegetation.
  url: https://gmes4africa.blogspot.com/p/consortia.html?m=0
  fetched: '2026-11-08'
  quote: Dynamic mapping of mangroves
- claim: The same page lists it as a member of the marine and coastal areas consortium for North and West
    Africa, led by the University of Ghana.
  url: https://gmes4africa.blogspot.com/p/consortia.html?m=0
  fetched: '2026-11-08'
  quote: Centre Universitaire De Recherche d’Application en Télédétection (CURAT) ** - Cote d’Ivoire
- claim: Space in Africa reports that Université Félix Houphouët-Boigny organised the 14th AARSE conference
    in Abidjan in November 2024 through CURAT.
  url: https://spaceinafrica.com/2024/12/03/the-14th-aarse-international-conference-advancing-earth-observations-for-africas-sustainable-development/
  fetched: '2026-11-08'
  quote: the conference was organised by Université Félix Houphouët-Boigny through the Centre Universitaire
    de Recherche et d’application en Télédétection (CURAT).
