summary: Ivorian organisation seated at the Centre National de Floristique, which lists building a natural
  resources database among its aims and received a $27,125 CEPF grant for biological surveys in 2004–2005.
facts:
- claim: Its site gives its seat at the Centre National de Floristique of Université Félix Houphouët-Boigny,
    with an Abidjan postal address.
  url: https://sosforets.ci/
  fetched: 2026-11-08
  quote: SOS-Forêts à son siège social au Centre National de Floristique de l'université Félix Houphouët-Boigny
- claim: Its site lists building a database on natural resources, especially forests, among its aims.
  url: https://sosforets.ci/
  fetched: 2026-11-08
  quote: constituer une banque de données sur les ressources naturelles surtout les forêts
- claim: CEPF's grant page says SOS-Forêts received $27,125 for September 2004 to September 2005 to conduct
    biological surveys with local communities in the Monogaga and Dassioko Sud classified forests.
  url: https://www.cepf.net/grants/grantee-projects/biological-inventory-and-ecological-study-southern-dassioko-and-monogaga
  fetched: 2026-11-08
  quote: Conduct biological surveys together with local communities and raise environmental awareness
    in two classified forests - Monogaga and Dassioko Sud - in the littoral forest zone of Côte d'Ivoire.
- claim: Its site says it organised a national stakeholder consultation in July 2024 for updating the
    ecosystem profile of the Guinean Forests of West Africa, with BirdLife International and CEPF.
  url: https://sosforets.ci/
  fetched: 2026-11-08
  quote: SOS-Forêts a organisé l'Atelier national de consultation des parties prenantes pour la mise à
    jour du profil d'écosystème des forêts guinéennes de l'Afrique de l'Ouest, en collaboration avec BirdLife
    International et le CEPF.
