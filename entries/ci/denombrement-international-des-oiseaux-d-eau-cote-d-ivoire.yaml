summary: Côte d'Ivoire's annual participation in the International Waterbird Census,
  run by the Ministry of Water and Forests, which counted 49,305 waterbirds of 68
  species at 38 sites in 2026.
facts:
- claim: Côte d'Ivoire takes part each year in the International Waterbird Census,
    which in 2026 was carried out nationally by the Ministry of Water and Forests
    with university ornithologists, OIPR, NGOs and volunteers.
  url: https://www.eauxetforets.gouv.ci/actualite/denombrement-international-des-oiseaux-deau-dioe-2026-des-resultats-encourageants-pour-la
  fetched: 2026-11-12
  quote: cette activité a été conduite au niveau national par le Ministère des Eaux
    et Forêts, avec l’appui des ornithologues des universités (UAO Bouaké, UFHB Cocody,
    ULOG Daloa et UPGC Korhogo), de l’Office Ivoirien des Parcs et Réserves (OIPR)
- claim: The 2026 count recorded 49,305 waterbirds of 68 species, against 45,759 in
    2025.
  url: https://www.eauxetforets.gouv.ci/actualite/denombrement-international-des-oiseaux-deau-dioe-2026-des-resultats-encourageants-pour-la
  fetched: 2026-11-12
  quote: 49 305 oiseaux d’eau recensés, appartenant à 68 espèces et 17 familles (contre
    45 759 en 2025)
- claim: 38 coastal and inland sites were surveyed in 2026.
  url: https://www.eauxetforets.gouv.ci/actualite/denombrement-international-des-oiseaux-deau-dioe-2026-des-resultats-encourageants-pour-la
  fetched: 2026-11-12
  quote: 38 sites (côtiers et continentaux) prospectés
