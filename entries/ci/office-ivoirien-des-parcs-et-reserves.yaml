summary: Ivorian body created in 2002 to manage parks and reserves, now covering 19 protected areas, which
  carries out ecological monitoring including camera traps and, per AIP, recorded about 496 elephant observations
  in Mont Péko in 2025.
facts:
- claim: AIP reports that the OIPR was created in 2002 and is charged with managing the parks and reserves.
  url: https://www.aip.ci/cote-divoire-aip-environ-20-milliards-de-fcfa-mobilises-pour-la-gestion-des-aires-protegees-ivoiriens-en-2026/
  fetched: 2026-11-08
  quote: Créé en 2002, l'OIPR a pour objectif, entre autres, de préserver et de valoriser un échantillon
    représentatif de la diversité biologique nationale et maintenir les processus écologiques dans les
    aires protégées de façon durable.
- claim: AIP reports that its network grew from 14 to 19 national parks and reserves since 2002, and that
    about 600 staff in six zone directorates carry out surveillance and ecological monitoring.
  url: https://www.aip.ci/cote-divoire-aip-environ-20-milliards-de-fcfa-mobilises-pour-la-gestion-des-aires-protegees-ivoiriens-en-2026/
  fetched: 2026-11-08
  quote: Ces équipes assurent la gestion quotidienne des aires protégées à travers plusieurs fonctions
    clés, notamment la surveillance, les aménagements, le suivi écologique
- claim: Wrote a manual for ecological monitoring of the national parks and nature reserves, first edition
    September 2017, covering camera traps among other methods.
  url: https://ci.chm-cbd.net/sites/ci/files/2022-04/Suivi%20%C3%A9cologique%20des%20parcs%20nationaux%20et%20des%20r%C3%A9serves%20nationales%20de%20C%C3%B4te%20d%27Ivoire.pdf
  fetched: 2026-11-08
  quote: a été rédigé par l'Office Ivoirien des Parcs et Réserves (OIPR)
- claim: The manual includes camera-trap sampling of mammals and birds.
  url: https://ci.chm-cbd.net/sites/ci/files/2022-04/Suivi%20%C3%A9cologique%20des%20parcs%20nationaux%20et%20des%20r%C3%A9serves%20nationales%20de%20C%C3%B4te%20d%27Ivoire.pdf
  fetched: 2026-11-08
  quote: Echantillonnage de la faune mammalienne et aviaire par cameras à déclenchement
- claim: AIP reports its western zone officer for ecological monitoring and GIS saying camera-trap monitoring
    in Mont Péko National Park recorded about 496 elephant observations in 2025, against 182 in 2024.
  url: https://www.aip.ci/cote-divoire-aip-suivi-ecologique-du-parc-national-du-mont-peko-la-faune-en-constante-progression/
  fetched: 2026-11-08
  quote: Le suivi par pièges photographiques a renforcé nos connaissances sur la répartition et l'abondance
    relative de la faune.
- claim: AIP reports the director general saying that in 2026 the Fondation pour les parcs et réserves
    provided 8.1% of the resources for protected-area management, French cooperation through the C2D 17.8%
    and German financial cooperation 28.3%.
  url: https://www.aip.ci/cote-divoire-aip-environ-20-milliards-de-fcfa-mobilises-pour-la-gestion-des-aires-protegees-ivoiriens-en-2026/
  fetched: 2026-11-08
  quote: sont de 8,1% pour la Fondation pour les parcs et réserves, 17,8% pour la coopération française
    via le Contrat de désendettement et de développement (C2D), 28,3% pour la coopération financière allemande
- claim: Created by Decree No. 2002-359 of 24 July 2002 to preserve and develop a representative sample
    of national biological diversity and keep ecological processes going in protected areas.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: L’Office Ivoirien des Parcs et Réserves (OIPR) crée par le Décret N° 2002-359 du 24 Juillet 2002,
    a pour objectif de préserver et valoriser un échantillon représentatif de la diversité biologique
    nationale
- claim: Says its network now holds 19 protected areas, 8 national parks, 10 nature reserves and one marine
    protected area.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: le réseau des aires protégées compte désormais 19 aires protégées dont 08 parcs nationaux, 10
    réserves naturelles et 01 aire maritime protégée
- claim: Lists ecological monitoring and research among its activities, to guide management measures.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: Contrôle des phénomènes de dynamique et/ou de comportement de la végétation et des populations
    animales, permettant d’orienter en conséquence les mesures de gestion d’un milieu naturel
- claim: Its site lists ecological monitoring reports among its studies and publications.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: Résultats du suivi écologique, Phase 11
- claim: Gives an address in Cocody 2 Plateaux, Abidjan.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: 9253+J7F, Abidjan Cocody 2 Plateaux
- claim: Its newest news item listed on the home page, dated 20 July 2026, is on Côte d'Ivoire and Liberia
    strengthening their alliance to preserve the Taï-Grebo-Krahn-Sapo forest complex.
  url: https://oipr-ci.org/
  fetched: '2026-11-08'
  quote: la Côte d’Ivoire et le Libéria renforcent leur alliance pour préserver le complexe forestier
    Taï-Grebo-Krahn-Sapo (TGKS)
- claim: A NatureMetrics final report to CEPF, dated January 2023, says OIPR staff were trained to use
    eDNA kits and collected water samples in four national parks and the Lamto reserve during the February
    2021–July 2022 project.
  url: https://cepf.net/resources/final-project-report/final-project-report-2665
  fetched: '2026-11-08'
  quote: OIPR staff participated in workshops and was trained to use eDNA kits in the field (take water
    samples in four National Parks (Comoe, Tai, Banco, Azagny) and one reserve (Lamto).
