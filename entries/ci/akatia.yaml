summary: Ivorian NGO, founded in 2017 by its own account, that follows wild chimpanzees
  in Yapo-Abbé forest and, since 2026, has begun camera-trap, transect and flora monitoring
  in two concessions under a ten-year EticWood project.
facts:
- claim: Describes itself as an Ivorian NGO for primate conservation and forest protection,
    founded in 2017.
  url: https://www.akatia.org/fr/nos-actions/proteger-la-foret
  fetched: '2026-11-12'
  quote: ONG ivoirienne de conservation des primates et de protection de la forêt,
    fondée en 2017.
- claim: A researcher follows wild chimpanzee groups in the Yapo-Abbé forest, mapping
    territories, counting individuals and using camera traps.
  url: https://www.akatia.org/fr/nos-actions/proteger-la-foret
  fetched: '2026-11-12'
  quote: 'Un chercheur suit les groupes de chimpanzés sauvages dans la forêt de Yapo-Abbé
    : identification des territoires, dénombrement des individus, analyse des comportements
    et caméras pièges.'
- claim: Works closely with the Special Surveillance and Intervention Brigade (BSSI),
    whose wildlife service protects its camps and patrols the forests.
  url: https://www.akatia.org/fr/nos-actions/proteger-la-foret
  fetched: '2026-11-12'
  quote: Pour mener à bien notre mission, nous collaborons étroitement avec la BSSI,
    Brigade Spéciale de Surveillance et d'Intervention.
- claim: Since 2026 it has taken part in a ten-year EticWood project for 14 classified
    forests, where biodiversity monitoring began in its concessions at Yapo-Abbé and
    Comoé 1 with camera traps, transects and flora assessment.
  url: https://www.akatia.org/fr/ils-nous-soutiennent/projet-eticwood
  fetched: '2026-11-12'
  quote: Celui-ci inclut la pose de caméras pièges, le parcours de transects pour
    détecter les traces de la faune, ainsi que l'analyse de l'état de la flore.
