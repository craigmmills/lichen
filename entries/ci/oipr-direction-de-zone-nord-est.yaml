summary: OIPR directorate in charge of Comoé National Park, whose director and head
  of ecological monitoring co-authored the AI-assisted survey paper, and which presented
  its use of SMART in October 2026.
facts:
- claim: Its director and its head of ecological monitoring, the directorate in charge
    of Comoé National Park, co-authored the Ecological Informatics paper on the AI-assisted
    survey.
  url: https://asfbelgium.org/fr/news-challenges/une-premiere-en-afrique-de-l-ouest-inventaire-aerien-photographique-de-la-grande-faune-du-parc-national-de-la-comoe-assiste-par-l-intelligence-artificielle
  fetched: 2026-11-12
  quote: les Colonels KOUADIO Yao Roger et OUATTARA Amara, respectivement Directeur
    de Zone Nord-est et Responsable du Suivi écologique de la même Direction en charge
    du PNC
- claim: Gave administrative and technical support in the field for the Comoé aerial
    surveys.
  url: https://asfbelgium.org/fr/news-challenges/une-premiere-en-afrique-de-l-ouest-inventaire-aerien-photographique-de-la-grande-faune-du-parc-national-de-la-comoe-assiste-par-l-intelligence-artificielle
  fetched: 2026-11-12
  quote: en particulier la Direction de la Zone Nord-Est (DZNE), pour leur appui administratif
    et technique sur le terrain
- claim: At its October 2026 quarterly workshop, the directorate presented the use
    of SMART in the park's surveillance and the results of monitoring of waterbirds,
    migratory land birds and resident birds.
  url: https://www.aip.ci/cote-divoire-aip-un-atelier-presente-loutil-smart-et-le-suivi-des-oiseaux-dans-la-surveillance-du-parc-national-de-la-comoe/
  fetched: 2026-11-12
  quote: Les résultats du suivi des oiseaux d’eau, des oiseaux migrateurs terrestres
    et des oiseaux résidents ont été présentés aux participants
