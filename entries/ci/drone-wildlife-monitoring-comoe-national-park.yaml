summary: A GIZ-commissioned project for 2025 to 2026 developing drone-based wildlife monitoring in Côte
  d'Ivoire, with a machine learning image analysis workflow and training for OIPR and CURAT.
facts:
- claim: GFA's project page says it supports the development and operationalisation of a drone-based wildlife
    monitoring system in Côte d'Ivoire, commissioned by GIZ for 2025 to 2026.
  url: https://www.gfa-group.de/projects/Drone_data_in_wildlife_surveys_4143703.html
  fetched: 2026-11-08
  quote: this project supports the development and operationalisation of a drone-based wildlife monitoring
    system in Côte d'Ivoire
- claim: The page says it develops an automated image analysis workflow using machine learning, with training
    for OIPR and CURAT.
  url: https://www.gfa-group.de/projects/Drone_data_in_wildlife_surveys_4143703.html
  fetched: 2026-11-08
  quote: through the development of an automated image analysis workflow using machine learning technologies,
    combined with targeted training and knowledge transfer to Ivorian stakeholders
- claim: A GFA news item says deep-learning tools will help detect, identify and count animals in aerial
    photographs.
  url: https://www.gfa-group.de/news/AERIAL_WILDLIFE_MONITORING_4143691.html
  fetched: 2026-11-08
  quote: deep-learning tools will help to detect, identify and count animals in aerial photographs
  ai_type: deep-learning
- claim: The GFA project page names the funding framework as DIMIA triangular cooperation between Côte
    d'Ivoire, Rwanda and Germany.
  url: https://www.gfa-group.de/projects/Drone_data_in_wildlife_surveys_4143703.html
  fetched: 2026-11-08
  quote: 'Funding framework: DIMIA – Triangular Cooperation (Côte d''Ivoire, Rwanda, Germany)'
