summary: Support in which UNDP handed twelve drones with paired smartphones to the
  Ministry of Water and Forests in February 2021, intended to make its special surveillance
  and intervention brigade more effective against illegal logging.
facts:
- claim: In February 2021 UNDP handed a dozen drones to the Ministry of Water and
    Forests to strengthen forest surveillance.
  url: https://cotedivoire.un.org/fr/115423-discours-de-la-repr%C3%A9sentante-r%C3%A9sidente-du-pnud-%C3%A0-la-c%C3%A9r%C3%A9monie-de-remise-officielle-de-drones
  fetched: '2026-11-12'
  quote: Pour renforcer plus efficacement la surveillance des forêts en Côte d'Ivoire,
    le PNUD a remis une douzaine de drones au Ministère des Eaux et Forêts.
- claim: The February 2021 speech said the 12 drones were coupled with 12 smartphones
    capable of receiving remotely recorded photos and videos and showing in real time
    what happens in areas suspected of illegal logging.
  url: https://cotedivoire.un.org/fr/115423-discours-de-la-repr%C3%A9sentante-r%C3%A9sidente-du-pnud-%C3%A0-la-c%C3%A9r%C3%A9monie-de-remise-officielle-de-drones
  fetched: '2026-11-12'
  quote: A ces drones, sont couplés 12 smartphones qui permettent de capter les photos
    et vidéos enregistrées à distance et de savoir en temps réel ce qui se passe dans
    les zones à suspicion d’exploitation illégale.
- claim: In February 2021, UNDP said the drones were intended to make the ministry's
    special surveillance and intervention brigade more effective.
  url: https://cotedivoire.un.org/fr/115423-discours-de-la-repr%C3%A9sentante-r%C3%A9sidente-du-pnud-%C3%A0-la-c%C3%A9r%C3%A9monie-de-remise-officielle-de-drones
  fetched: '2026-11-12'
  quote: contribuer ainsi à rendre plus efficace la Brigade Spéciale de Surveillance
    et d'intervention du Ministère des Eaux et forêts
- claim: The speech is dated 26 February 2021.
  url: https://cotedivoire.un.org/fr/115423-discours-de-la-repr%C3%A9sentante-r%C3%A9sidente-du-pnud-%C3%A0-la-c%C3%A9r%C3%A9monie-de-remise-officielle-de-drones
