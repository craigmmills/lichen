summary: Ivorian environment ministry that, per African Sustainability Matters, signed a 24-month framework
  agreement with TerraKora AI on 2 October 2026 on ecosystem monitoring, and which oversees the Office
  Ivoirien des Parcs et Réserves.
facts:
- claim: The Ivorian news agency AIP reports that the government updated the national biodiversity strategy
    and action plan to align them with the Kunming-Montreal Global Biodiversity Framework, in a statement
    delivered by the minister on 22 May 2026.
  url: https://www.aip.ci/cote-divoire-aip-biodiversite-le-gouvernement-intensifie-les-actions-pour-restaurer-le-capital-biologique-ivoirien/
  fetched: 2026-11-08
  quote: Le gouvernement a également procédé à l'actualisation de la stratégie nationale et du plan d'actions
    pour la biodiversité afin de les aligner sur le Cadre mondial pour la biodiversité de Kunming-Montréal.
- claim: AIP names the minister of the environment, sustainable development and ecological transition
    as Abou Bamba.
  url: https://www.aip.ci/cote-divoire-aip-biodiversite-le-gouvernement-intensifie-les-actions-pour-restaurer-le-capital-biologique-ivoirien/
  fetched: 2026-11-08
  quote: Dans une déclaration prononcée par le ministre de l'Environnement, du Développement durable et
    de la Transition écologique, Abou Bamba
- claim: African Sustainability Matters reports that the ministry signed a 24-month framework agreement
    with TerraKora AI on 2 October 2026 to strengthen national capabilities for observing, analysing and
    monitoring ecosystems.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: 2026-11-08
  quote: The Ministry of Environment and Ecological Transition signed a 24-month framework agreement with
    Ivorian geospatial technology company TerraKora AI on October 2 to strengthen national capabilities
    for observing, analysing and monitoring ecosystems.
- claim: AIP describes the Office Ivoirien des Parcs et Réserves as one of the bodies under the ministry's
    supervision, visited by the minister on 4 May 2026.
  url: https://www.aip.ci/cote-divoire-aip-environ-20-milliards-de-fcfa-mobilises-pour-la-gestion-des-aires-protegees-ivoiriens-en-2026/
  fetched: 2026-11-08
  quote: lors de la visite des locaux de son institution par le ministre de l'Environnement et de la Transition
    écologique, Abou Bamba, dans le cadre de sa tournée au sein des structures sous tutelle.
- claim: Lists the Office Ivoirien des Parcs et Réserves among the bodies under its supervision, with
    the national environment agency and the anti-pollution centre.
  url: https://www.environnement.gouv.ci/index.php/structures-sous-tutelle
  fetched: '2026-11-08'
  quote: L’Office Ivoirien des Parcs et Réserves (OIPR)
- claim: Gives its cabinet address in the Cité Administrative, Plateau.
  url: https://www.environnement.gouv.ci/index.php/structures-sous-tutelle
  fetched: '2026-11-08'
  quote: 'Adresse : Cabinet, Plateau-Cité Administrative, Tour A, 1er et 4ème Etages'
- claim: African Sustainability Matters reports that Minister Abou Bamba signed the October 2026 framework
    agreement with TerraKora AI.
  url: https://africasustainabilitymatters.com/cote-divoire-turns-to-ai-and-satellite-data-to-strengthen-forest-monitoring-and-climate-finance/
  fetched: '2026-11-08'
  quote: The agreement was signed by Environment and Ecological Transition Minister Abou Bamba and TerraKora
    AI co-founder and Chief Executive Officer Kolia Alpha-Yaya Touré
- claim: A GBIF publisher record created in 2022, titled IPBES Côte d’Ivoire / Ministry of Environment
    and Sustainable Development, describes the national IPBES focal point as assessing scientific documentation
    on biodiversity.
  url: https://api.gbif.org/v1/organization/1863c93a-7831-4ea7-80ef-281474b5a2fd
  fetched: '2026-11-08'
  quote: Point focal national IPBES pour la Côte-d'Ivoire, dont les missions sont d'évaluer la documentation
    scientifique relative à la biodiversité.
- claim: The same record lists among its duties the management of national parks and nature reserves,
    with the Minister of Water and Forests.
  url: https://api.gbif.org/v1/organization/1863c93a-7831-4ea7-80ef-281474b5a2fd
  fetched: '2026-11-08'
  quote: Gestion des Parcs Nationaux et Réserves Naturelles en collaboration avec le Ministre des Eaux
    et forêts
- claim: The same record lists among its duties drawing up and coordinating water and biodiversity protection
    policy.
  url: https://api.gbif.org/v1/organization/1863c93a-7831-4ea7-80ef-281474b5a2fd
  fetched: '2026-11-08'
  quote: Elaboration, animation et coordination de la politique de l’eau et de la protection de la biodiversité.
