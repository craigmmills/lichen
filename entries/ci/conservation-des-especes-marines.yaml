summary: A local non-profit whose members have worked on sea turtle conservation since 2010, using local
  eco-guards for field work and helping create a voluntary nature reserve since 2016.
facts:
- claim: IUCN's member page describes CEM as a local non-profit association whose members have worked
    on sea turtle conservation since 2010 with US-FWS support.
  url: https://iucn.org/node/35062
  fetched: 2026-11-08
  quote: CEM es une association local de Côte d'ivoire à but non lucratif. Ses membres travaillent dans
    la conservation de tortues marines de Côte d'Ivoire depuis l'année 2010 avec l'appui du US-FWS.
- claim: The page says local eco-guards carry out all field activities, organising surveillance of nesting
    females at night and protection of nests.
  url: https://iucn.org/node/35062
  fetched: 2026-11-08
  quote: Ils organisent eux-mêmes la surveillance des femelles venant pondre sur la plage la nuit, la
    protection des nids, le relâcher des nouveau-nés
- claim: The page says that since 2016 CEM has been involved in creating a voluntary nature reserve behind
    the nesting beach with Rainforest Trust support.
  url: https://iucn.org/node/35062
  fetched: 2026-11-08
  quote: Depuis 2016, CEM est aussi involucré dans la création d'une reserve Naturelle Volontaire dans
    la zone située à l'arriere de la plage de ponte des tortuesavec l'appui de Rainforest Trust.
- claim: IUCN lists it as a national NGO member since October 2018.
  url: https://iucn.org/node/35062
  fetched: 2026-11-08
  quote: 'Membership category: National NGO Member since: Oct, 2018'
