facts:
- claim: In December 2021, the ministry described the GIS as a tool for decision support,
    coordination, surveillance and evaluation based on data on forests, wildlife,
    flora and water resources.
  url: https://eauxetforets.gouv.ci/actualite/seance-de-presentation-du-systeme-dinformation-geographique-sig
  fetched: '2026-11-12'
  quote: Le SIG est un outil extrêmement moderne d'aide à la décision, de coordination,
    de surveillance, d'évaluation et de consultation, basé sur les données disponibles
    sur la forêt, la faune la flore et les ressource en eau.
- claim: In December 2021, the ministry said the GIS would allow data on forest, wildlife
    and water resources to be shared transparently.
  url: https://eauxetforets.gouv.ci/actualite/seance-de-presentation-du-systeme-dinformation-geographique-sig
  fetched: '2026-11-12'
  quote: partager en toute transparence les données relatives aux ressources forestières,
    fauniques et en eau
