id: comoe-2022-ai-assisted-aerial-photographic-wildlife-survey
kind: project
name: Inventaire aérien photographique de la grande faune du Parc national de la Comoé
  assisté par l'intelligence artificielle (2022)
scope: ci
ai_label: ai
ai_types:
- deep-learning
realms:
- land
techniques:
- computer-vision
- remote-sensing
status: closed
summary: Closed 2022 field trial in Comoé National Park, run by OIPR, in which the
  HerdNet model processed 148,239 aerial photographs and deep learning cut human processing
  effort by 98%.
facts:
- claim: The field trial took place during the 2022 aerial survey of large fauna in
    Comoé National Park, carried out by OIPR under the KfW co-financed Comoé biodiversity
    protection project.
  url: https://asfbelgium.org/fr/news-challenges/une-premiere-en-afrique-de-l-ouest-inventaire-aerien-photographique-de-la-grande-faune-du-parc-national-de-la-comoe-assiste-par-l-intelligence-artificielle
  fetched: 2026-11-12
  quote: L'expérimentation sur le terrain a été menée lors de l’inventaire aérien
    de la grande faune du Parc national de la Comoé en 2022, réalisé par l’Office
    Ivoirien des Parcs et Réserves
- claim: The HerdNet model was used to speed up the processing of 148,239 survey photographs.
  url: https://asfbelgium.org/fr/news-challenges/une-premiere-en-afrique-de-l-ouest-inventaire-aerien-photographique-de-la-grande-faune-du-parc-national-de-la-comoe-assiste-par-l-intelligence-artificielle
  fetched: 2026-11-12
  quote: Le modèle HerdNet, préalablement entraîné sur des images d'Ouganda, a été
    utilisé pour accélérer le traitement de 148.239 photos d’inventaires.
- claim: Deep learning reduced the human effort of processing the aerial photographs
    by 98%.
  url: https://asfbelgium.org/fr/news-challenges/une-premiere-en-afrique-de-l-ouest-inventaire-aerien-photographique-de-la-grande-faune-du-parc-national-de-la-comoe-assiste-par-l-intelligence-artificielle
  fetched: 2026-11-12
  quote: l’effort humain lié au traitement des photographies aériennes a été réduit
    de 98% grâce à l’utilisation du Deep Learning.
  ai_type: deep-learning
