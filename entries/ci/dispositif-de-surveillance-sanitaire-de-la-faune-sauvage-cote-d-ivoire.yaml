summary: Wildlife health surveillance system launched at Bouna in November 2024 with
  electronic data collection tools, and backed by a September 2026 ministerial memorandum
  giving OIPR a monitoring and reporting role in protected areas.
facts:
- claim: The Minister of Animal Resources and Fisheries launched the wildlife health
    surveillance system and handed over electronic data collection tools at Bouna
    on 10 November 2024.
  url: https://ressourcesanimales.gouv.ci/actualites/lancement-officiel-du-dispositif-de-surveillance-sanitaire-de-la-faune-sauvage-en-cote-divoire/
  fetched: '2026-11-15'
  quote: a procédé au lancement officiel du dispositif de surveillance sanitaire de
    la faune sauvage en Côte d'Ivoire et à la remise symbolique des outils de collecte
    électronique de données
- claim: The system aims to strengthen health surveillance and detect emerging hazards
    linked to wild fauna early.
  url: https://ressourcesanimales.gouv.ci/actualites/lancement-officiel-du-dispositif-de-surveillance-sanitaire-de-la-faune-sauvage-en-cote-divoire/
  fetched: '2026-11-15'
  quote: Ce dispositif vise à renforcer le système de surveillance sanitaire et à
    détecter précocement les dangers émergents liés à la faune sauvage.
- claim: On 15 September 2026 the environment and animal resources ministers signed
    a memorandum on wildlife health surveillance in national parks and nature reserves.
  url: https://www.environnement.gouv.ci/index.php/actualite/641
  fetched: '2026-11-15'
  quote: à la signature d’un Mémorandum d’accord relatif à la surveillance de la santé
    de la faune sauvage dans les parcs nationaux et réserves naturelles de Côte d’Ivoire
- claim: Under the memorandum, OIPR is to play a role in wildlife monitoring, surveillance
    of health events and reporting from protected areas.
  url: https://www.environnement.gouv.ci/index.php/actualite/641
  fetched: '2026-11-15'
  quote: jouera un rôle essentiel dans le suivi de la faune sauvage, la surveillance
    des événements sanitaires et la remontée des informations depuis les aires protégées
