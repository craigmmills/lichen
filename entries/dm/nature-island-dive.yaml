summary: Local dive operation based in Soufriere which, according to Alert Diver (Q3
  2025), monitors reefs and hand-treats corals with stony coral tissue loss disease.
facts:
- claim: Alert Diver (Q3 2025, Divers Alert Network) describes it as a local dive
    operation based in Soufriere.
  url: https://dan.org/?p=53984
  fetched: 2026-11-13
  quote: Even more impressive were the conservation efforts spearheaded by Nature
    Island Dive, a local dive operation based in Soufrière.
- claim: The same article says the team actively monitors reefs and hand-treats corals
    with stony coral tissue loss disease.
  url: https://dan.org/?p=53984
  fetched: 2026-11-13
  quote: The team actively monitors reefs and hand-treats diseased corals using a
    medicinal paste.
- claim: It says the staff tagged and monitored key corals to track the progress and
    effectiveness of treatments.
  url: https://dan.org/?p=53984
  fetched: 2026-11-13
  quote: By tagging and monitoring key corals, they could track the progress and effectiveness
    of treatments
- claim: It says the 2024 bleaching event and the disease led the company to build
    a land-based coral biobank and restoration centre in June 2024.
  url: https://dan.org/?p=53984
  fetched: 2026-11-13
  quote: This devastation and SCTLD pushed Nature Island Dive to build a land-based
    coral biobank and restoration center in June 2024.
