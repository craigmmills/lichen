summary: National databases of land use, land-use changes and disturbances for 2000
  to 2021, produced by Saint Lucia and Dominica experts using satellite imagery, which
  Dominica will use to draft its REDD+ results technical annex.
facts:
- claim: A December 2022 Coalition for Rainforest Nations news item says national
    experts from Saint Lucia and Dominica studied point locations on satellite imagery
    and extended their land use and land-use change time series to include 2019 to
    2022.
  url: https://www.rainforestcoalition.org/news/saint-lucia-and-dominica-gather-redd-data/
  fetched: 2026-11-13
  quote: both extended their land use and land use changes time series to include
    the years 2019-2022
- claim: The assessment covered disturbances such as fires, hurricanes, logging and
    shifting cultivation.
  url: https://www.rainforestcoalition.org/news/saint-lucia-and-dominica-gather-redd-data/
  fetched: 2026-11-13
  quote: the impact of disturbances such as fires, hurricanes, logging, and shifting
    cultivation on emissions and removals
- claim: The same item says the work produced national databases of land use, land-use
    changes and disturbances for 2000 to 2021.
  url: https://www.rainforestcoalition.org/news/saint-lucia-and-dominica-gather-redd-data/
  fetched: 2026-11-13
  quote: National Databases of Land Use, Land Use Changes and Disturbances for the
    years 2000 to 2021
- claim: The same item says Dominica will use the new data to draft its REDD+ results
    technical annex.
  url: https://www.rainforestcoalition.org/news/saint-lucia-and-dominica-gather-redd-data/
  fetched: 2026-11-13
  quote: Dominica will use the new data to draft its REDD+ results Technical Annex
    as well.
