summary: Forestry service established in 1949, run by the environment ministry, with parrot, national
  park, mountain chicken and Black-capped Petrel monitoring work, including song meters in 2016.
facts:
- claim: Established in 1949 as the Dominica Forest Service; now commonly called the Forestry, Wildlife
    and Parks Division.
  url: https://forestry.gov.dm/notices/two_sisserous_chiicks/
  fetched: '2026-11-12'
  quote: The Dominica Forest Service was established in 1949
- claim: Its units include a National Parks Section and a Research and Monitoring Unit.
  url: https://forestry.gov.dm/notices/two_sisserous_chiicks/
  fetched: '2026-11-12'
  quote: Research and Monitoring Unit
- claim: A division notice says the parrot conservation and research programme began in 1980 with field
    monitoring of wild populations and nesting sites.
  url: https://forestry.gov.dm/notices/two_sisserous_chiicks/
  fetched: '2026-11-12'
  quote: The parrot conservation and research program commenced in 1980 with field monitoring of wild
    populations and nesting sites
- claim: The same notice says the Government of Dominica partnered with the Rare Species Conservatory
    Foundation in 1997 to research and conserve its endangered parrots.
  url: https://forestry.gov.dm/notices/two_sisserous_chiicks/
  fetched: '2026-11-12'
  quote: In 1997, the Government of Dominica partnered with the Rare Species Conservatory Foundation
- claim: The CBD country profile says all three of Dominica's national parks have management plans and
    continuous monitoring activities.
  url: https://www.cbd.int/countries/profile?country=dm
  fetched: '2026-11-12'
  quote: All three of the country’s national parks have management plans and continuous monitoring activities.
- claim: An October 2023 BIAZA report lists the division among the Mountain Chicken Recovery Programme
    partners and says recent surveys found only 23 mountain chicken frogs on Dominica.
  url: https://biaza.org.uk/news/detail/conservationists-sound-alarm-as-one-of-worlds-largest-frogs-becomes-virtually-extinct
  fetched: '2026-11-12'
  quote: The Forestry, Wildlife and Parks Division of the Government of the Commonwealth of Dominica
- claim: A 2016 Conservation Metrics report says Stephen Durand of the Department of Forestry and Adam
    Brown of EPIC deployed song meters on Dominica in the search for Black-capped Petrels.
  url: https://www.birdscaribbean.org/wp-content/uploads/2015/10/ConservationMetricsBCPE_2016_ReportFINAL.pdf
  fetched: '2026-11-12'
  quote: Adam Brown (EPIC) and Stephen Durand (Department of Forestry) deployed song meters at
- claim: A 2023 report on Black-capped Petrel nest searches on Dominica says a 2016 search was conducted
    in collaboration with the Forestry, Wildlife and Parks Division; camera traps were used during the
    2023 effort.
  url: https://www.birdscaribbean.org/wp-content/uploads/2023/06/2023DominicaDiablotin_search_REPORT.pdf
  fetched: '2026-11-12'
  quote: Forestry, Wildlife & Parks Division of Dominica with the intent of finding nesting petrels.
- claim: Gives its address in Roseau.
  url: https://forestry.gov.dm/notices/two_sisserous_chiicks/
  fetched: '2026-11-12'
  quote: Windsor Park Road
