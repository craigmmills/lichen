facts:
- claim: The zoo describes itself as an organisation established by the Ministry of
    Environment of the Slovak Republic.
  url: https://zoobojnice.sk/macky-dive-na-moravsko-slovenskom-pohranici-ohrozuje-krizenie-s-mackou-domacou-preukazal-to-geneticky-vyskum/
  fetched: 2026-11-15
  quote: Národná zoologická záhrada Bojnice ako zriadená organizácia MŽP SR
- claim: A June 2022 article says the Interreg V-A SK-CZ 2014–2020-funded project
    “Hľadáme mačku, pozor, divú!” was carried out by the Institute of Vertebrate Biology,
    National Zoo Bojnice and Hnutí DUHA Šelmy and was due to end in 2022. The article
    calls the institute part of “Akadémie vied SR” in the project paragraph but “AV
    ČR” elsewhere.
  url: https://zoobojnice.sk/macky-dive-na-moravsko-slovenskom-pohranici-ohrozuje-krizenie-s-mackou-domacou-preukazal-to-geneticky-vyskum/
  fetched: 2026-11-15
  quote: Projekt „Hľadáme mačku, pozor, divú!,“ ktorý realizujú Ústav biológie stavovcov
    Akadémie vied SR, Národná zoologická záhrada Bojnice a Hnutia DUHA Šelmy
- claim: In June 2022 the zoo identified Branislav Tám as its coordinator of wildcat
    monitoring in the Strážovské vrchy and quoted him describing hair traps, camera
    traps and subsequent DNA analysis.
  url: https://zoobojnice.sk/macky-dive-na-moravsko-slovenskom-pohranici-ohrozuje-krizenie-s-mackou-domacou-preukazal-to-geneticky-vyskum/
  fetched: 2026-11-15
  quote: dodáva Branislav Tám zo slovenskej NZOO Bojnice, ktorý koordinuje monitoring
    v oblasti Strážovských vrchov.
- claim: The genetic research found hybrids with domestic cats; in the Strážovské
    vrchy four hybrids made up 15% of the population recorded there.
  url: https://zoobojnice.sk/macky-dive-na-moravsko-slovenskom-pohranici-ohrozuje-krizenie-s-mackou-domacou-preukazal-to-geneticky-vyskum/
