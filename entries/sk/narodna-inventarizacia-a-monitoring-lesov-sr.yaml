summary: Statistical inventory of Slovakia's forests built by the National Forest
  Centre, with field plots on a 4 by 4 km grid (3,069 plots) and field collection
  for the next cycle expected in 2025 to 2026.
facts:
- claim: A large-area mathematical and statistical inventory of Slovakia's forests.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
  fetched: 2026-11-13
  quote: Národná inventarizácia a monitoring lesov (NIML) SR je veľkoplošná matematicko-štatistická
    inventarizácia lesov.
- claim: Field inventory is carried out on 3,069 plots on a 4 by 4 km grid.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
  fetched: 2026-11-13
  quote: Terestrická inventarizácia sa uskutočňuje v sieti 4×4 km na inventarizačných
    plochách (IP) založených v teréne. Ich celkový počet je 3069.
- claim: A photo inventory on a 2 by 2 km grid interprets points on an orthophoto
    map to separate forest from non-forest and classify stands.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
  fetched: 2026-11-13
  quote: Snímková inventarizácia sa uskutočňuje v sieti 2×2 km interpretáciou plôšok
    na ortofotomape.
- claim: Plots record ecological characteristics, including naturalness of the stand
    and ecologically valuable and protected natural features, and deadwood.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
  fetched: 2026-11-13
  quote: 'Ekologické charakteristiky: Stupeň prirodzenosti porastu'
- claim: ForestPortal says field data collection for the next cycle is expected in
    2025 to 2026.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
  fetched: 2026-11-13
  quote: Očakáva sa pokračovanie terénneho zberu údajov v rokoch 2025-2026.
- claim: The ministry, as the central state forestry authority, orders the national
    forest inventory under the Forest Act.
  url: https://www.forestportal.sk/odborna-sekcia-i/ekologia-a-monitoring/niml/
