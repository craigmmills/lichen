summary: Closed large carnivore project run by the State Nature Conservancy, which
  by 2022 had tracked 28 animals by telemetry and by end 2020 had collected 1,334
  bear DNA samples, recording occurrences in KIMS.
facts:
- claim: By 2022 the project had tracked 28 large carnivores by telemetry, 11 lynx,
    13 wolves and 4 bears.
  url: https://www.sopsr.sk/projekty/operacny-program-kvalita-zivotneho-prostredia/realizacia-programov-starostlivosti-o-velke-selmy-na-slovensku/
  fetched: 2026-11-12
  quote: V doterajšom riešení projektu bolo telemetricky monitorovaných 28 jedincov
    veľkých šeliem (11 rysov, 13 vlkov a 4 medvede).
- claim: Occurrences of bear, wolf and lynx from staff fieldwork and camera traps
    were recorded in the Complex Information and Monitoring System (KIMS).
  url: https://www.sopsr.sk/projekty/operacny-program-kvalita-zivotneho-prostredia/realizacia-programov-starostlivosti-o-velke-selmy-na-slovensku/
  fetched: 2026-11-12
  quote: údaje z fotopascí (snímky, videosekvencie), ktoré sa evidovali v Komplexnom
    informačnom a monitorovacom systéme (KIMS).
- claim: By 31 December 2020, 1,334 bear samples had been collected for DNA analysis
    to estimate population size.
  url: https://www.sopsr.sk/projekty/operacny-program-kvalita-zivotneho-prostredia/realizacia-programov-starostlivosti-o-velke-selmy-na-slovensku/
  fetched: 2026-11-12
  quote: K 31.12.2020 bolo zozbieraných 1 334 vzoriek z medveďa na analýzy DNA.
- claim: Bear samples were handed to the Faculty of Science of Charles University
    in Prague, an external contractor, for the studies.
  url: https://www.sopsr.sk/projekty/operacny-program-kvalita-zivotneho-prostredia/realizacia-programov-starostlivosti-o-velke-selmy-na-slovensku/
  fetched: 2026-11-12
  quote: vzorky boli odovzdané externému spracovateľovi -Prírodovedeckej fakulte Karlovej
    Univerzity v Prahe kde prebieha vypracovanie štúdií.
