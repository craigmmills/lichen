summary: Cave administration, founded in 1970 and a unit of the State Nature Conservancy
  since 2008, with long-term bat monitoring and fixed biospeleological plots for sampling
  cave invertebrates.
facts:
- claim: Since 2008 it has been an organisational unit of the State Nature Conservancy,
    a contributory organisation directly managed by the Ministry of the Environment.
  url: https://www.ssj.sk/sk/sprava-slovenskych-jaskyn
  fetched: 2026-11-12
  quote: Od roku 2008 je začlenená ako organizačná zložka Štátnej ochrany prírody
    Slovenskej republiky so sídlom v Banskej Bystrici, ktorá je príspevkovou organizáciou
    v priamom riadení Ministerstva životného prostredia Slovenskej republiky
- claim: Bat monitoring is a long-term focus, following species, numbers and distribution
    through the year, mainly in winter.
  url: https://www.ssj.sk/sk/biospeleologicky-vyskum-a-monitoring
  fetched: 2026-11-12
  quote: Dlhodobým predmetom záujmu Správy slovenských jaskýň je monitoring netopierov
    .
- claim: In caves it sets out fixed biospeleological plots for observing and sampling
    terrestrial invertebrates.
  url: https://www.ssj.sk/sk/biospeleologicky-vyskum-a-monitoring
  fetched: 2026-11-12
  quote: V rámci výskumu terestrickej zložky fauny sa v jaskyniach vymedzujú biospeleologické
    stacionárne plochy, na ktorých sa uskutočňujú pozorovania a reprezentatívny zber
    živočíchov.
- claim: Founded in Liptovský Mikuláš in 1970 as a separate specialist organisation.
  url: https://www.ssj.sk/sk/sprava-slovenskych-jaskyn
  fetched: 2026-11-12
  quote: Správu slovenských jaskýň v Liptovskom Mikuláši ako samostatnú odbornú organizáciu
    zriadili v roku 1970.
