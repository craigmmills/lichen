facts:
- claim: Asks the public to upload a photo of a tick and where it was found, to help
    an artificial intelligence recognise ticks and to build a map of their occurrence.
  url: https://www.infokliest.sk/
  fetched: 2026-11-15
  quote: Pomôžeš umelej inteligencii rozoznávať kliešte a spolu vytvárať mapu ich
    výskytu a možných ochorení, ktoré prenášajú.
- claim: Uses tick plots to follow when ticks are most active in forests, parks and
    housing estates.
  url: https://www.infokliest.sk/
  fetched: 2026-11-15
  quote: Pomocou tzv. kliešťových záhradiek sledujeme, kedy sú kliešte najaktívnejšie
    – v lesoch, parkoch aj na sídliskách.
- claim: Studies whether new tick species from warmer areas are appearing in Slovakia.
  url: https://www.infokliest.sk/
  fetched: 2026-11-15
  quote: či sa na Slovensku objavujú nové druhy z teplejších oblastí
- claim: CVTI SR's open science portal says scientists from the Institute of Informatics
    SAS train the AI on the reported data and zoologists' expertise to identify tick
    species.
