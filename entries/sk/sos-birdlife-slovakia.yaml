summary: Bird conservation organisation collecting bird data, organising censuses according to Wikipedia,
  participating in LIFE STEPPE ON BORDER, and party to a camera-trap and DNA monitoring agreement ending
  in 2021.
facts:
- claim: Wikipedia says it collects bird data and organises bird censuses, including the Common Bird Census
    and the Waterbird Census.
  url: https://en.wikipedia.org/wiki/SOS/BirdLife_Slovakia
  fetched: 2026-11-08
  quote: It also collects bird data and organizes censuses of birds (Common Bird Census, Waterbird Census,
    voluntary bird monitoring of IBAs and another schemes).
- claim: A participant in the LIFE STEPPE ON BORDER project for red-footed falcon and great bustard, coordinated
    by Raptor Protection of Slovakia.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE20-NAT-SK-001077/long-term-conservation-of-great-bustard-and-red-footed-falcon-in-border-region-of-hungary-and-slovakia
  fetched: 2026-11-08
  quote: SOS(Slovenská ornitologická spoločnosť/BirdLife Slovensko), Slovakia ACTIVE Participant
- claim: A party, with WWF Slovensko, to a cooperation agreement with the State Nature Conservancy, running
    to the end of 2021, to monitor large carnivores and other species in the Prešov and Košice regions
    with camera traps and non-invasive DNA samples.
  url: https://www.crz.gov.sk//data/att/2612993.pdf
  fetched: 2026-11-08
