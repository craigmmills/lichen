summary: Led by Michal Babnič, this administration participated in the November 2025 chamois
  census involving 111 counters and takes part in SPEN’s planned chamois and marmot DNA work.
facts:
- claim: The November 2025 autumn chamois census on the Slovak side of the Tatras involved
    111 counters, park administration staff and volunteers.
  url: https://www.tanap.sk/pozname-vysledky-jesenneho-scitania-kamzikov-8041/
  fetched: 2026-11-12
  quote: Do terénu vyrazili pracovníci Správy TANAP-u, ako aj dobrovoľníci.
- claim: Joint Slovak and Polish monitoring of the chamois population has run continuously
    since 1959.
  url: https://www.tanap.sk/pozname-vysledky-jesenneho-scitania-kamzikov-8041/
  fetched: 2026-11-12
  quote: Spoločné slovensko-poľské monitorovanie populácie kamzíkov sa realizuje nepretržite
    od roku 1959.
- claim: The administration takes part in the Interreg Poland-Slovakia project SPEN, which
    is to collect genetic samples and analyse DNA of chamois and marmot.
  url: https://www.tanap.sk/pozname-vysledky-jesenneho-scitania-kamzikov-8041/
  fetched: 2026-11-12
  quote: budeme zbierať genetické vzorky, analyzovať DNA a rozširovať poznatky nielen o kamzíkovi,
    ale aj svišťovi vrchovskom tatranskom.
- claim: STVR reported in November 2022 that a mobile app, already used in Poland that spring,
    was tried for the autumn chamois count in Slovakia for the first time.
  url: https://spravy.stvr.sk/2022/11/aplikacia-pomaha-pri-scitani-kamzikov-vo-vysokych-tatrach/
  fetched: 2026-11-12
  quote: Aplikáciu použili Poliaci už na jar, na Slovensku ju vyskúšali po prvý raz.
- claim: The State Nature Conservancy lists it, with its seat in Tatranská Lomnica, as a partner
    in the national project monitoring species and habitats of European importance.
  url: https://www.sopsr.sk/projekty/program-slovensko/monitoring-biotopov-a-druhov-europskeho-vyznamu-na-slovensku/
  fetched: 2026-11-12
  quote: Správa Tatranského národného parku so sídlom v Tatranskej Lomnici
