  fetched: 2026-11-13
  quote: Spoločnosť pre ochranu netopierov na Slovensku (SON) je občianske združenie
    zamerané na ochranu a výskum netopierov s celoslovenskou pôsobosťou.
- claim: Founded in 1993 mainly to count bats at winter roosts; its work has since
    extended to monitoring summer colonies in attics.
