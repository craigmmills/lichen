summary: Slovak organisation whose experts have long monitored large carnivores in
  Poloniny National Park; an August 2026 article says it made the Cluey app available
  in Slovak for COOP4SAFE, and in October 2026 it reported a stalled exemption application.
facts:
- claim: Its experts have long monitored the occurrence of large carnivores in Poloniny
    National Park.
  url: https://www.aevis.org/navstevnici-polonin-su-sucastou-vyskumu-divokej-prirody/
  fetched: 2026-11-13
  quote: Experti z organizácie Aevis sa dlhodobo venujú monitorovaniu výskytu veľkých
    šeliem v Národnom parku Poloniny.
- claim: An August 2026 article says it made the Cluey mobile app available in Slovak
    so the public can record signs of large carnivores as part of COOP4SAFE.
  url: https://www.aevis.org/navstevnici-polonin-su-sucastou-vyskumu-divokej-prirody/
  fetched: 2026-11-13
  quote: Organizácia Aevis ju sprístupnila v slovenskom jazyku v rámci medzinárodného
    projektu zameraného na výskum medveďa hnedého, vlka dravého a rysa ostrovida
- claim: The August 2026 article says expert coordinators will check each observation
    before publication and verified records will become part of a shared database
    mapping large carnivores.
  url: https://www.aevis.org/navstevnici-polonin-su-sucastou-vyskumu-divokej-prirody/
  fetched: 2026-11-13
  quote: Každé nahrané pozorovanie pred zverejnením overia odborní koordinátori.
- claim: Its site names two legal bodies, Nadácia Aevis and Aevis n.o.
  url: https://www.aevis.org/navstevnici-polonin-su-sucastou-vyskumu-divokej-prirody/
  fetched: 2026-11-13
  quote: Ochrana osobných údajov Nadácia Aevis
- claim: In October 2026 it said the Prešov district office had not decided for more
    than a year on its exemption application, blocking field monitoring in Poloniny
    National Park.
  url: https://www.aevis.org/urad-blokuje-medzinarodny-vyskum-v-poloninach-aevis-preto-podava-podnet-na-prokuraturu/
  fetched: 2026-11-13
  quote: Nečinnosť úradu blokuje terénny monitoring vzácnych druhov živočíchov, brzdí
    získavanie dôležitých údajov o stave prírody
