facts:
- claim: Slovak Wildlife Society (SWS) describes itself as a civic association working
    on brown bears, wolves and lynx. Its website renders its Slovak name as “Spoločnosť
    pre Výskum, Vzdelávanie a Spolužitie so prírodou”, while the cited register uses
    “Spoločnosť pre výskum, vzdelávanie a spolužitie s prírodou”.
  url: https://www.medvede.sk/?action=onas
  fetched: 2026-11-15
  quote: SWS (Spoločnosť pre Výskum, Vzdelávanie a Spolužitie so prírodou) je občianske
    združenie, ktoré sa zaoberá šelmami ako sú medveď hnedý, vlk dravý a rys ostrovid.
- claim: Says its research provides a basis for the authorities responsible for carnivore
    management.
  url: https://www.medvede.sk/?action=onas
  fetched: 2026-11-15
  quote: Náš výskum vytvára podklad pre zodpovedné orgány a ich manažment šeliem
- claim: The Slovak NGO register lists Spoločnosť pre výskum, vzdelávanie a spolužitie
    s prírodou as a civic association with its seat in Liptovský Hrádok, founded on
    11 February 2005.
  url: https://ives.minv.sk/rmno/detail/13542112870672787454
  fetched: 2026-11-15
  quote: Belanská štvrť 574/6, 033 01 Liptovský Hrádok
- claim: Implemented the Living with Carpathian Spirits project from May 2013 to February
    2015, with a pilot study adapting systematic lynx monitoring from Switzerland
    to two reference areas in the Slovak Carpathians.
  url: https://environment.ec.europa.eu/news/monitoring-monitoring-status-carpathian-lynx-slovakia-and-switzerland-2023-12-04_en?prefLang=sk
  fetched: 2026-11-15
  quote: The project set up a pilot study to adapt systematic monitoring from Switzerland
    to conditions in the Slovak Carpathians, in two reference areas.
