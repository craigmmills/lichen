summary: Six-year project with 15 partners from seven countries, led by Raptor Protection
  of Slovakia; initial 2021 monitoring checked 12,535 pylons along more than 1,380
  km of power lines, with camera traps planned for bird mortality.
facts:
- claim: Initial monitoring from January to April 2021 surveyed more than 1,380 km
    of power lines in all project countries.
  url: https://www.danubefreesky.eu/sk
  fetched: 2026-11-12
  quote: Počas úvodného mapovania sa vo všetkých projektových krajinách preskúmalo
    viac ako 1380 km elektrických vedení rôzneho napätia a konštrukcie.
- claim: Monitoring identified the most dangerous pylons, checking 12,535 pylons in
    the project areas.
  url: https://www.danubefreesky.eu/sk
  fetched: 2026-11-12
  quote: v rámci ktorého bolo skontrolovaných 12 535 stĺpov v projektových oblastiach
- claim: Its monitoring activities are to use camera traps, video cameras and night-vision
    equipment to identify the extent and causes of bird mortality, under an international
    monitoring scheme.
  url: https://www.danubefreesky.eu/sk
  fetched: 2026-11-12
  quote: V rámci monitorovacích aktivít budú použité fotopasce , videokamery a zariadenia
    pre nočné videnie .
- claim: The project runs for six years with 15 partner organisations from seven countries.
  url: https://www.danubefreesky.eu/sk
  fetched: 2026-11-12
  quote: Počas 6 rokov realizácie projektu bude 15 partnerských organizácií zo 7 krajín
    intenzívne spolupracovať pri zavádzaní najúčinnejších riešení.
