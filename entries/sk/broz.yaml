summary: Non-governmental organisation in Bratislava protecting and restoring Slovak
  nature; under LIFE Metamorphosis it asks volunteers to record butterflies, initially
  Colias myrmidone in the Bošácka and Moravsko-Lieskovská valleys.
facts:
- claim: A non-governmental organisation that protects and restores nature in Slovakia,
    including wetlands, meadows, floodplain forests and endangered species.
  url: https://broz.sk/vyzva-pomozte-nam-s-mapovanim-motylov/
  fetched: 2026-11-15
  quote: Mimovládna organizácia, ktorá chráni a obnovuje prírodu na Slovensku - mokrade,
    lúky, lužné lesy aj ohrozené druhy.
- claim: Its address is in Bratislava and it gives a company registration number.
  url: https://broz.sk/vyzva-pomozte-nam-s-mapovanim-motylov/
  fetched: 2026-11-15
  quote: IČO 31771815
- claim: Under the LIFE Metamorphosis project it asks volunteers to record butterflies,
    their food plants and other data on a form, so that it knows current sites of
    threatened species.
  url: https://broz.sk/vyzva-pomozte-nam-s-mapovanim-motylov/
  fetched: 2026-11-15
  quote: Aby sme mohli cielene aplikovať opatrenia na ochranu a záchranu ohrozených
    druhov motýľov, je potrebné v aktuálnom čase poznať čo najväčší počet lokalít
    výskytu týchto druhov a ich živných rastlín.
- claim: The mapping initially focuses on Colias myrmidone in the Bošácka and Moravsko-Lieskovská
    valleys, especially SKUEV Holubyho kopanice.
  url: https://broz.sk/vyzva-pomozte-nam-s-mapovanim-motylov/
  fetched: 2026-11-15
  quote: Na začiatok by sme chceli upriamiť pozornosť primárne na výskyt žltáčika
    zanoväťového ( Colias myrmidone ).
