summary: Closed lynx project run by the Slovak Wildlife Society, which used 60-day
  camera-trapping sessions in two reference areas, plus snow tracking and DNA sampling,
  and captured 843 lynx images.
facts:
- claim: The project ran 60-day deterministic camera-trapping sessions in each of
    two reference areas to estimate lynx abundance and density with capture-recapture
    statistics.
  url: https://environment.ec.europa.eu/news/monitoring-monitoring-status-carpathian-lynx-slovakia-and-switzerland-2023-12-04_en?prefLang=sk
  fetched: 2026-11-12
  quote: 'Deterministic camera trapping sessions of 60 days in each of two reference
    areas: estimation of lynx abundance and density (using capture-recapture statistics)'
- claim: Fieldwork also included snow tracking and DNA sampling to assess genetic
    diversity.
  url: https://environment.ec.europa.eu/news/monitoring-monitoring-status-carpathian-lynx-slovakia-and-switzerland-2023-12-04_en?prefLang=sk
  fetched: 2026-11-12
  quote: Fieldwork also included snow tracking and DNA sampling to allow assessment
    of genetic diversity.
- claim: The project captured 843 images of lynx.
  url: https://environment.ec.europa.eu/news/monitoring-monitoring-status-carpathian-lynx-slovakia-and-switzerland-2023-12-04_en?prefLang=sk
  fetched: 2026-11-12
  quote: During the project, a total of 843 images of lynx were captured.
- claim: A closing workshop presented two years of lynx monitoring.
  url: https://environment.ec.europa.eu/news/monitoring-monitoring-status-carpathian-lynx-slovakia-and-switzerland-2023-12-04_en?prefLang=sk
  fetched: 2026-11-12
