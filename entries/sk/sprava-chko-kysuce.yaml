- claim: In autumn 2023 two of its staff surveyed the ground and prepared wolf capture
    on the Slovak side of the LECA project's Beskydy-Kysuce pilot area, with the Czech
    project partner.
  url: https://www.sopsr.sk/projekty/interreg-stredna-europa/leca-supporting-the-coexistence-and-conservation-of-carpathian-large-carnivores/
  fetched: 2026-11-13
  quote: V rámci pilotnej oblasti Beskydy-Kysuce sa na jeseň 2023 naši kolegovia z
    CHKO Kysuce, Peter Drengubiak a Zuzana Václavová, v spolupráci s českým projektovým
    partnerom venovali rekognoskácii terénu a príprave na odchyt vlka dravého na slovenskej
    strane pilotnej oblasti.
