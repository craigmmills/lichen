facts:
- claim: Its 2023 report describes year-round extensive monitoring of large carnivores
    in its territory using camera traps.
  url: https://chkokysuce.sopsr.sk/wp-content/uploads/2023/04/Monitoring-velkych-seliem-2023.pdf
  fetched: 2026-11-13
  quote: Celoročne prebiehajúci extenzívny monitoring veľkých šeliem v území pomocou
    fotopascí
- claim: Its 2023 report gives the results of the international large carnivore monitoring
    in its territory.
  url: https://chkokysuce.sopsr.sk/wp-content/uploads/2023/04/Monitoring-velkych-seliem-2023.pdf
  fetched: 2026-11-13
  quote: Správa z medzinárodného monitoringu veľkých šeliem 2023 – výsledky z územnej
- claim: During the February 2023 monitoring, 26 wolf track trails were found in the
    area surveyed.
  url: https://chkokysuce.sopsr.sk/wp-content/uploads/2023/04/Monitoring-velkych-seliem-2023.pdf
  fetched: 2026-11-13
  quote: V priebehu  monitoringu bolo v sledovanom území zistených  26 stopových dráh
    vlka.
- claim: Its 2023 report gives its address as U Tomali 1511, Čadca.
  url: https://chkokysuce.sopsr.sk/wp-content/uploads/2023/04/Monitoring-velkych-seliem-2023.pdf
