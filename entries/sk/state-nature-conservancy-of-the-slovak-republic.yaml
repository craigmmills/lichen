summary: National expert body for nature protection in Banská Bystrica that monitors ecosystems, keeps
  the protected species register, runs the KIMS and the state list, and uses camera traps and GPS collars.
facts:
- claim: The CBD lists staff of the State Nature Conservancy in Banská Bystrica as Slovakia's SBSTTA and
    protected areas national focal points.
  url: https://www.cbd.int/countries/nfp?country=sk
  fetched: 2026-11-08
  quote: State Nature Conservancy SOP SR Banská Bystrica Tajovského ul. 28B 974 01 Banská Bystrica Slovakia
    SBSTTA NFP, Protected Areas NFP
- claim: A 2016 presentation by its staff said the care of Slovakia's national parks was carried out by
    the State Nature Conservancy, an expert body set up by the environment ministry.
  url: https://www.krnap.cz/media/ttgk3y0l/17_thompson_slovensko_sop.pdf
  fetched: 2026-11-08
  quote: Starostlivosť o NP na Slovensku vykonáva Štátna ochrana prírody SR - Príspevková odborná organizácia
    OP zriadená MŽP SR
- claim: The LIFE project database names its Complex Information and Monitoring System (KIMS), where status
    data on species and habitats in Natura 2000 sites are to be published.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE19-IPE-SK-000003/role-of-the-natura-2000-network-and-management-of-some-prioritized-habitats-in-the-integrated-landscape-protection-in-the-slovak-republic
  fetched: 2026-11-08
  quote: Complex Information and Monitoring System of the State Nature Conservancy (KIMS)
- claim: A national expert organisation for nature and landscape protection with nationwide competence,
    seated in Banská Bystrica.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: je odbornou organizáciou ochrany prírody a krajiny s celoslovenskou pôsobnosťou. Sídli v Banskej
    Bystrici
- claim: Monitors the state of and changes in natural ecosystems.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: vykonáva monitoring stavu a zmien prírodných ekosystémov v meniacich sa ekologických podmienkach
- claim: Keeps the register of protected animals and plants.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: vedie evidenciu chránených živočíchov a chránených rastlín,
- claim: Acts as the scientific authority of the Slovak Republic for CITES.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: plní funkcie vedeckého orgánu SR pre CITES
- claim: Made up of a directorate, protected-area administrations, a regional nature protection centre
    and the Slovak caves administration, working across 14 protected landscape areas.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: Člení sa na riaditeľstvo a správy chránených území, regionálne centrum ochrany prírody a správu
    slovenských jaskýň.
- claim: Registered as a GBIF data publisher endorsed by GBIF Slovakia, with no published datasets.
  url: https://api.gbif.org/v1/node/477b14bb-3d5c-474b-8dec-6bd73dd67dec/organization?limit=100
  fetched: 2026-11-08
  quote: '"title":"State Nature Conservancy"'
- claim: Says it keeps records of protected animals and plants and runs the state list of specially protected
    parts of nature and landscape.
  url: https://www.sopsr.sk
  fetched: 2026-11-08
  quote: vedie evidenciu chránených živočíchov a chránených rastlín
- claim: Its GBIF publisher record describes it as a professional organisation of the Ministry of the
    Environment with nationwide scope.
  url: https://api.gbif.org/v1/organization/22113474-e777-42aa-bb8a-5271d568f98c
  fetched: 2026-11-08
  quote: State Nature Conservancy of the Slovak Republic is a professional organization of the Ministry
    of the Environment of the Slovak Republic with nationwide scope
- claim: Says all protected-area administrations in Slovakia also use camera traps for supplementary monitoring.
  url: https://www.sopsr.sk/medved-hnedy/monitoring-velkych-seliem/
  fetched: 2026-11-08
  quote: Na všetkých správach chránených území na Slovensku je taktiež využívaný doplňujúci monitoring
    prostredníctvom fotopascí.
- claim: Describes fitting large carnivores with GPS satellite telemetry collars as one of its monitoring
    methods.
  url: https://www.sopsr.sk/medved-hnedy/monitoring-velkych-seliem/
  fetched: 2026-11-08
  quote: označenie odchytených jedincov veľkých šeliem GPS satelitným telemetrickým vysielačom
- claim: In 2019, contracted the Faculty of Science of Charles University in Prague to estimate the population
    sizes of wolf, lynx and brown bear and to study wolf hybridisation by DNA analysis.
  url: https://www.sopsr.sk/medved-hnedy/monitoring-velkych-seliem/
  fetched: 2026-11-08
  quote: Zmluva nadobudla účinnosť dňa 09.04.2019 a je platná do 09.04.2024.
