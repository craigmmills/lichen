facts:
- claim: A non-governmental organisation focused on nature conservation, registered
    as a civic association, with an address in Bratislava.
  url: https://daphne.sk/ziva-bratislava/
  fetched: 2026-11-15
  quote: 'Právna forma: Občianske združenie'
- claim: In spring 2025 it started the citizen science project Živá Bratislava, collecting
    data on the biodiversity of Bratislava through iNaturalist.
  url: https://daphne.sk/ziva-bratislava/
  fetched: 2026-11-15
  quote: Na jar roku 2025 sme odštartovali projekt občianskej vedy Živá Bratislava,
    zameraný na zber údajov o biodiverzite Bratislavy pomocou iNaturalist.
- claim: In May 2026 it held a pilot BioBranie event in Bratislava-Petržalka, with
    another planned for 2027.
  url: https://daphne.sk/ziva-bratislava/
  fetched: 2026-11-15
  quote: V máji 2026 sme v mestskej časti Bratislava-Petržalka uskutočnili pilotný
    ročník podujatia BioBranie a môžete sa na neho tešiť aj v roku 2027.
- claim: Živá Bratislava is carried out within the cross-border Austrian-Slovak project
    Ecovisit SKAT under the INTERREG VI-A SK-AT programme.
  url: https://daphne.sk/ziva-bratislava/
  fetched: 2026-11-15
  quote: Živá Bratislava sa realizuje v rámci cezhraničného, rakúsko-slovenského projektu
