summary: Slovak ministry in Bratislava hosting the primary CBD focal point and leading the LIFE-IP NATURA
  2000 SK project, with a nature and landscape protection section and a biodiversity department.
facts:
- claim: The CBD lists the ministry's Directorate for Nature Protection and Landscape Development as the
    home of Slovakia's primary CBD national focal point, with the clearing-house and protected areas focal
    points.
  url: https://www.cbd.int/countries/nfp?country=sk
