summary: Slovak database of plant, animal and habitat records, run and built by the State Nature Conservancy,
  in use since 2015, which the LIFE-IP project expects to update and fill with Natura 2000 status data.
facts:
- claim: The LIFE-IP NATURA 2000 SK project expects to publish missing data and status evaluations for
    target species and habitats of Natura 2000 sites in KIMS.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE19-IPE-SK-000003/role-of-the-natura-2000-network-and-management-of-some-prioritized-habitats-in-the-integrated-landscape-protection-in-the-slovak-republic
  fetched: 2026-11-08
  quote: published in the Complex Information and Monitoring System of the State Nature Conservancy (KIMS)
    for 37% of species target features and 32% of habitat features
- claim: Among the project's complementary actions, KIMS is to be updated and habitats and species monitored
    on 11,000 permanent sites.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE19-IPE-SK-000003/role-of-the-natura-2000-network-and-management-of-some-prioritized-habitats-in-the-integrated-landscape-protection-in-the-slovak-republic
  fetched: 2026-11-08
  quote: Monitoring of habitat types and species of community importance performed on 11 000 permanent
    monitoring sites; Complex Information and Monitoring System (KIMS) updated
- claim: The State Nature Conservancy says it put KIMS into use in 2015 as a database of records of plants,
    animals and habitats in Slovakia.
  url: https://www.sopsr.sk/medved-hnedy/monitoring-velkych-seliem/
  fetched: 2026-11-08
  quote: V roku 2015 Štátna ochrana prírody SR uviedla do praxe Komplexný informačný a monitorovací systém
    (KIMS) . Ide o databázu údajov o výskyte rastlín, živočíchov a biotopov na Slovensku.
- claim: Observations are located with GPS, and the public can contribute records and draw information
    from the database.
  url: https://www.sopsr.sk/medved-hnedy/monitoring-velkych-seliem/
  fetched: 2026-11-08
  quote: Prispievateľmi do databázy sa môžete stať aj vy. Samozrejme, z databázy je možné informácie aj
    čerpať.
