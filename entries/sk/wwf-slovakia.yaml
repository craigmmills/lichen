summary: Conservation organisation, Bratislava-based, party to a cooperation agreement to 31 December
  2021 on camera-trap and DNA monitoring of large carnivores and other species in the Prešov and Košice
  regions.
facts:
- claim: A cooperation agreement running to 31 December 2021 covered monitoring of bear, lynx, wolf, golden
    jackal, wild boar and red deer in the Prešov and Košice regions and identification of large carnivore
    migration sites.
  url: https://www.crz.gov.sk//data/att/2612993.pdf
  fetched: 2026-11-08
  quote: Predmetom tejto dohody o spolupráci je zabezpečenie a vykonávanie monitoringu druhov Ursus arctos,
    Lynx lynx, Canis lupus, Canis aureus, Sus scrofa a Cervus elaphus
- claim: Under the agreement ending in 2021, monitoring was to use non-invasive samples for DNA and diet
    analysis of bear and wolf, and camera traps.
  url: https://www.crz.gov.sk//data/att/2612993.pdf
  fetched: 2026-11-08
  quote: oportunistický a systematický monitoring vybraných druhov pomocou automatických kamier – fotopascí.
- claim: The agreement ending in 2021 named WWF Slovensko and SOS/BirdLife Slovensko as the parties to
    carry out the activities and gave WWF Slovensko's seat in Bratislava.
  url: https://www.crz.gov.sk//data/att/2612993.pdf
  fetched: 2026-11-08
  quote: 'Obchodné meno: WWF Slovensko, občianske združenie Sídlo: Medená 101/05, 811 02 Bratislava'
- claim: The agreement ran for a fixed term to 31 December 2021.
  url: https://www.crz.gov.sk//data/att/2612993.pdf
  fetched: 2026-11-08
  quote: Táto dohoda sa uzatvára na dobu určitú do 31.12.2021.
