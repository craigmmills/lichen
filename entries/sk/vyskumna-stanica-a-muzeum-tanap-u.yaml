summary: Tatra National Park research and documentation unit, run by the park administration,
  which monitors changes after the 2004 windstorm and later disturbances, and the
  invasive northern bark beetle.
facts:
- claim: The research station and museum is the Tatra National Park unit for research
    and documentation of the park's natural environment.
  url: https://www.tanap.sk/vyskumna-stanica-tanap-u/
  fetched: 2026-11-15
  quote: Výskumná stanica a Múzeum TANAP-u (VSaM TANAP-u) je pracoviskom pre výskum
    a dokumentáciu prírodného prostredia Tatranského národného parku.
- claim: In the 1980s it added monitoring of air pollution and tourism impacts and
    began building a monitoring and information system on the state of nature.
  url: https://www.tanap.sk/vyskumna-stanica-tanap-u/
  fetched: 2026-11-15
  quote: Začali sme budovať monitorovací a informačný systém o stave prírody
- claim: After the 2004 windstorm, it took up systematic monitoring of the changes
    caused by the windstorm and later fire and bark beetle disturbances, in the international
    post-disturbance research programme, part of EXPEER.
  url: https://www.tanap.sk/vyskumna-stanica-tanap-u/
  fetched: 2026-11-15
  quote: Udalosť sa stala silným impulzom pre ekologický výskum a systematický monitoring
    zmien, ktoré spôsobila víchrica i následné ďalšie disturbancie ako požiar či podkôrny
    hmyz v lesných ekosystémoch a ich okolí.
- claim: Its research tasks include monitoring the invasive northern bark beetle.
  url: https://www.tanap.sk/vyskumna-stanica-tanap-u/
  fetched: 2026-11-15
  quote: monitoring invázneho druhu lykožrúta severského
