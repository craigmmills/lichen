summary: National long-term ecological research network, run by the Institute of Landscape
  Ecology SAS, whose sites and platforms are managed by four organisations; a founding member
  of LTER Europe.
facts:
- claim: A national network for co-operation in long-term ecological research that develops
    a network of research sites and platforms to study ecosystems and environmental change.
  url: https://lter.sav.sk/index.php/en/
  fetched: 2026-11-15
  quote: LTER Slovakia develops network of research sites designed to study ecosystems and
    socio-ecological regions (platforms) that can help understand environmental change.
- claim: Four organisations manage its LTER sites and LTSER platforms, including the Institute
    of Landscape Ecology SAS, the Institute of Forest Ecology SAS, the National Forestry Centre
    and the TANAP research station.
  url: https://lter.sav.sk/index.php/en/
  fetched: 2026-11-15
  quote: Currently, four organisations manage LTER sites and LTSER platforms in Slovakia
- claim: Its sites include Báb, Kremnické vrchy Ecological Experimental Station, Jalovecká
    dolina, Poľana Biosphere Reserve, Tatra National Park, Tatras-alpine summits and Kráľova
    hoľa; its LTSER platforms are Trnava and Poloniny National Park.
  url: https://lter.sav.sk/index.php/en/
  fetched: 2026-11-15
  quote: Poloniny National Park LTSER
- claim: It is a member of ILTER and its European chapter LTER Europe, and a founding member
    of LTER Europe.
  url: https://lter.sav.sk/index.php/en/
  fetched: 2026-11-15
  quote: LTER Slovakia is a founding member of the LTER Europe , established in 2007 in Balatonfüred
    (Hungary).
