summary: In February 2022, this park administration reported 30 years of hibernating
  bat monitoring, starting in 1991/1992, with about 100 underground sites included
  in annual counts by then.
facts:
- claim: In February 2022, the park reported that its bat specialists, with colleagues
    from other national parks and volunteers, had monitored hibernating bats in its
    underground sites for 30 years.
  url: https://www.npslovenskykras.sk/30-rokov-systematickeho-zimneho-scitania-netopierov-v-np-slovensky-kras/
  fetched: 2026-11-12
  quote: Odborníci (chiropterológovia) zo správy NP Slovenský kras v spolupráci s
    kolegami z iných národných parkov a za pomoci dobrovoľníkov už rovných 30 rokov
    monitorujú výskyt zimujúcich netopierov
- claim: The first systematic winter count was in the 1991/1992 season.
  url: https://www.npslovenskykras.sk/30-rokov-systematickeho-zimneho-scitania-netopierov-v-np-slovensky-kras/
  fetched: 2026-11-12
  quote: Prvým ročníkom takého sčítania bola zimná sezóna 1991/1992.
- claim: By February 2022, about 100 underground sites had been included in the regular
    annual bat count.
  url: https://www.npslovenskykras.sk/30-rokov-systematickeho-zimneho-scitania-netopierov-v-np-slovensky-kras/
  fetched: 2026-11-12
  quote: Približne 100 týchto lokalít bolo zaradených do pravidelného, každoročného
    sčítania
- claim: The State Nature Conservancy lists it, with its seat in Brzotín, as a partner
    in the national project monitoring species and habitats of European importance.
  url: https://www.sopsr.sk/projekty/program-slovensko/monitoring-biotopov-a-druhov-europskeho-vyznamu-na-slovensku/
  fetched: 2026-11-12
  quote: Správa Národného parku Slovenský kras so sídlom v Brzotíne
