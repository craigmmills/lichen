summary: Bratislava conservation organisation coordinating LIFE STEPPE ON BORDER for 2022 to 2027, whose
  members supported eagle monitoring described in a 2022 paper, including drone checks from 2019.
facts:
- claim: A 2022 paper in its journal, by its staff, says the imperial eagle's breeding range in western
    Slovakia has been systematically monitored since 1977.
  url: https://reference-global.com/download/article/10.2478/srj-2022-0005.pdf
  fetched: 2026-11-08
  quote: In Western Slovakia, the breeding range of eastern imperial eagles has been systematically monitored
    since 1977
- claim: The paper thanks the organisation's members and supporters for help monitoring the nests.
  url: https://reference-global.com/download/article/10.2478/srj-2022-0005.pdf
  fetched: 2026-11-08
  quote: We would like to express our gratitude to the members and supporters of Raptor Protection of
    Slovakia for their assistance in monitoring the nests
- claim: Nest checks were made with drones from 2019.
  url: https://reference-global.com/download/article/10.2478/srj-2022-0005.pdf
  fetched: 2026-11-08
  quote: starting in 2019, with drones
