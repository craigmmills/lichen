facts:
- claim: It runs year-round monitoring of large carnivores, raptors, amphibians and
    rare plant species, with more than 40 camera traps in the park.
  url: https://npvelkafatra.sk/o-parku/ochrana/
  fetched: 2026-11-12
  quote: 'Monitoring: Správa NP zabezpečuje celoročný monitoring veľkých šeliem, dravcov,
    obojživelníkov a vzácnych rastlinných druhov. Na území je rozmiestnených viac
    ako 40 fotopascí.'
- claim: After long-term camera-trap monitoring of brown bears, the administration
    removed a non-transmitting telemetry collar from the bear Slava on 4 May 2018
    and planned further removals.
  url: https://npvelkafatra.sk/monitoring-medvedov-v-uzemi-velkej-fatry/
  fetched: 2026-11-12
  quote: Dňa 4. mája 2018 sa nám podarilo uspať a odpojiť telemetrovaného medveďa
    „Slava“, ktorý bol v minulosti označený NLC.
- claim: The State Nature Conservancy lists it, with its seat in Martin, as a partner
    in the national project monitoring species and habitats of European importance.
  url: https://www.sopsr.sk/projekty/program-slovensko/monitoring-biotopov-a-druhov-europskeho-vyznamu-na-slovensku/
  fetched: 2026-11-12
  quote: Správa Národného parku Veľká Fatra so sídlom v Martine
