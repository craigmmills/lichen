summary: Park administration that takes part in national species and habitat monitoring,
  tracks invasive species, Apollo butterfly and white storks, records data on biomonitoring.sk
  and bociany.sk, and maps bear, wolf and lynx in autumn and winter.
facts:
- claim: Its staff take part in the national monitoring and data collection on selected
    species and habitats.
  url: https://pienap.sk/sprava-np/konferencie/
  fetched: 2026-11-12
  quote: Pracovníci Správy PIENAP-u sú zapojený do celoslovenského monitorovania a
    zberu dát o vybraných druhoch a biotopoch .
- claim: It regularly monitors the occurrence and spread of invasive species and makes
    a regular inventory of the Apollo butterfly.
  url: https://pienap.sk/sprava-np/konferencie/
  fetched: 2026-11-12
  quote: pravidelne monitorujeme napr. výskyt prípadne šírenie inváznych druhov v
    územnej pôsobnosti Správy.
- claim: In spring and summer it monitors white stork arrivals, nesting and young,
    recording data on biomonitoring.sk and bociany.sk.
  url: https://pienap.sk/sprava-np/konferencie/
  fetched: 2026-11-12
  quote: Údaje zaznamenávame na www.biomonitoring.sk a tiež na www.bociany.sk .
- claim: In autumn and winter it maps the occurrence of brown bear, wolf and lynx
    in the area.
  url: https://pienap.sk/sprava-np/konferencie/
  fetched: 2026-11-12
  quote: V jesennom a zimnom sa zameriavame najmä na mapovanie výskytu veľkých šeliem
    v území
- claim: The State Nature Conservancy lists it, with its seat in Spišská Stará Ves,
    as a partner in the national project monitoring species and habitats of European
    importance.
  url: https://www.sopsr.sk/projekty/program-slovensko/monitoring-biotopov-a-druhov-europskeho-vyznamu-na-slovensku/
  fetched: 2026-11-12
  quote: Správa Pieninského národného parku so sídlom v Spišskej Starej Vsi
