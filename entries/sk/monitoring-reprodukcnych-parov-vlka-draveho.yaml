summary: Wolf breeding pair monitoring in Slovakia, run by the National Forest Centre;
  a 2025 notice says it has run continuously since 2016 and is one source used to
  set the annual hunting quota.
facts:
- claim: A 2025 notice says the monitoring had run continuously since 2016 and aimed
    to locate breeding packs, estimate the minimum number of young and population
    trend, and update the breeding range.
  url: https://polovnickakomora.sk/sk/spk-aktualne/spravy-a-informacie/4068-monitoring-populacie-vlka-draveho-na-slovensku-informacia-a-ziadost-25.html
  fetched: 2026-11-13
  quote: Cieľom monitoringu je určenie lokalít reprodukčných svoriek (párov), odhad
    minimálnej veľkosti prírastku, odhad trendu populácie a aktualizácia reprodukčného
    areálu. Monitoring sa realizuje nepretržite od roku 2016.
- claim: The 2025 notice describes the monitoring as one source used to set the annual
    wolf hunting quota.
  url: https://polovnickakomora.sk/sk/spk-aktualne/spravy-a-informacie/4068-monitoring-populacie-vlka-draveho-na-slovensku-informacia-a-ziadost-25.html
  fetched: 2026-11-13
  quote: jeden zo zdrojov informácií, na základe ktorých sa stanovuje výška ročnej
    kvóty lovu vlka dravého
- claim: The 2025 notice invited participants to submit observations through the Monitoring
    vlka application.
  url: https://polovnickakomora.sk/sk/spk-aktualne/spravy-a-informacie/4068-monitoring-populacie-vlka-draveho-na-slovensku-informacia-a-ziadost-25.html
  fetched: 2026-11-13
  quote: Zapojiť sa do monitoringu môžete prostredníctvom aplikácie Monitoring vlka
