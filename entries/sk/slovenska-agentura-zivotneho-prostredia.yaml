summary: Specialist organisation of the Ministry of the Environment, set up in 1993,
  whose experts processed and updated Slovakia's land cover data for the completed
  and published CORINE Land Cover 2024 mapping.
facts:
- claim: A specialist organisation of the Ministry of the Environment with nationwide
    remit, set up by the minister in 1993 and a contributory organisation since 2001.
  url: https://www.sazp.sk/sazp
  fetched: 2026-11-12
  quote: SLOVENSKÁ AGENTÚRA ŽIVOTNÉHO PROSTREDIA je odbornou organizáciou Ministerstva
    životného prostredia SR s celoslovenskou pôsobnosťou
- claim: A team of its experts processed and updated the land cover data for Slovakia's
    CORINE Land Cover 2024 mapping, now completed and published.
  url: https://www.sazp.sk/index.php/novinky/zverejnenie-vystupov-projektu-corine-land-cover-2024
  fetched: 2026-11-12
  quote: Na realizácii projektu sa podieľal tím odborníkov zo Slovenskej agentúry
    životného prostredia (SAŽP), ktorí zabezpečili spracovanie a aktualizáciu údajov
    o krajinnej pokrývke a využití územia.
- claim: The 2024 update follows earlier mappings for 1990, 2000, 2006, 2012 and 2018.
  url: https://www.sazp.sk/index.php/novinky/zverejnenie-vystupov-projektu-corine-land-cover-2024
  fetched: 2026-11-12
  quote: Rok 2024 predstavuje aktuálny referenčný rok pravidelnej aktualizácie databázy
    Corine Land Cover, ktorá nadväzuje na predchádzajúce mapovania z rokov 1990, 2000,
    2006, 2012 a 2018.
