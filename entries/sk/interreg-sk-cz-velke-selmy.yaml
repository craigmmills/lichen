facts:
- claim: Intensive camera-trap monitoring was planned for 80 to 90 days from November
    to January, with one or two camera traps per 5 by 5 km square and 140 squares
    in all.
  url: https://selmyskcz.sopsr.sk/opis-projektu-a-aktivity/
  fetched: 2026-11-12
  quote: V rámci projektu tak bude fotopascami pokrytých celkom 140 kvadrátov.
- claim: Regularly spaced camera traps allow individuals to be followed and population
    density estimated from recaptures with CMR and SECR models.
  url: https://selmyskcz.sopsr.sk/opis-projektu-a-aktivity/
  fetched: 2026-11-12
  quote: na základe opätovných záchytov odhadnúť hustotu ich populácie pomocou CMR
    a SECR modelov.
- claim: Planned outputs included a shared database of field signs and of individuals
    identified by camera traps and DNA analysis.
  url: https://selmyskcz.sopsr.sk/opis-projektu-a-aktivity/
  fetched: 2026-11-12
  quote: Vytvorenie spoločnej databázy empirického materiálu (nálezová databáza pobytových
