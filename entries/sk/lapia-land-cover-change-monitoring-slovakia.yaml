- claim: It aimed to design approaches for monitoring illegal landscape changes from Sentinel-1 and Sentinel-2
    imagery and airborne laser scanning data.
  url: https://geography.sav.sk/en/news/projects-en/esa-lapia-over-en/
  fetched: 2026-11-08
  quote: The LAPIA project aimed to design innovative approaches for monitoring illegal landscape changes
    based on EO data, particularly the Sentinel-1 and Sentinel-2 satellite imagery and airborne laser
    scanning data.
- claim: The illegal activities targeted include ploughing and devastation of protected grasslands and
    removal of non-forest woody vegetation in agricultural landscapes.
