summary: Park administration that fitted satellite collars to two adult male bison
  at the end of winter 2026 and plans camera-trap monitoring of large carnivores and
  wildcat, using 25 camera traps donated by Aevis.
facts:
- claim: At the end of winter 2026, its expert team, working with veterinarian Juška,
    fitted satellite telemetry collars to two adult male bison to track their movement
    and behaviour.
  url: https://www.nppoloniny.sk/zubry-dostali-novu-vybavu-pozname-prve-detaily/
  fetched: 2026-11-12
  quote: Presne takáto náročná operácia sa začiatkom tohto roka podarila odbornému
    tímu Správy Národného parku Poloniny v spolupráci s MVDr. Juškom.
- claim: The collars continuously record the bison's position, activity and other
    data.
  url: https://www.nppoloniny.sk/zubry-dostali-novu-vybavu-pozname-prve-detaily/
  fetched: 2026-11-12
  quote: Od tej chvíle začali obojky nepretržite zaznamenávať ich polohu, aktivitu
    aj ďalšie dôležité údaje.
- claim: Wolf, bear, lynx and wildcat in the park are to be monitored with camera
    traps using the same method as in Bieszczady National Park in Poland and Uzhansky
    National Park in Ukraine.
  url: https://www.nppoloniny.sk/vyskum-velkych-seliem-v-poloninach/
  fetched: 2026-11-12
  quote: sa v území NP Poloniny uskutoční monitoring týchto druhov prostredníctvom
    fotopascí (snímky, videosekvencie).
- claim: Aevis bought and donated 25 camera traps for this monitoring.
  url: https://www.nppoloniny.sk/vyskum-velkych-seliem-v-poloninach/
  fetched: 2026-11-12
  quote: V týchto dňoch nám Aevis, n. o. zakúpila a venovala 25 fotopascí aj s príslušenstvom.
