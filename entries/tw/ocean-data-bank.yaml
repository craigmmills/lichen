facts:
- claim: Its August 2023 newsletter said the National Science and Technology Council's
    Ocean Data Bank was building a marine microbial gene database and had collected
    Taiwanese teams' published marine microbial 16S/18S rRNA eDNA barcode sequence
    data from NCBI SRA.
