facts:
- claim: An agency of the Ministry of Agriculture that has set up automatic cameras for long-term wildlife
    monitoring in national forest areas.
  url: https://www.forest.gov.tw/en/news/0073612
  fetched: 2026-11-12
  quote: The Forestry and Nature Conservation Agency (FANCA), Ministry of Agriculture, has set up automatic
    cameras to conduct long-term wildlife monitoring in national forest areas, with over 480,000 photos
    of wildlife taken over the past eight years.
- claim: Its branches include an Aerial Survey and Remote Sensing Branch.
