- claim: According to a January 2024 Public Television Service report, it had collected
    marine environmental DNA data from more than 100 stations across Taiwan's waters,
    analysed microbes, eukaryotes and fish, and published a whole-sea baseline ecological
    survey eDNA dataset on a shared platform.
  url: https://news.pts.org.tw/article/678049
  fetched: 2026-11-14
  quote: 目前已蒐集台灣全海域超過100個測站的檢測資料，分析出微生物、真核生物和魚類等三大生物類群的種類組成，建立「全海域基礎生態調查環境DNA」資料集，在共用平台發布。
