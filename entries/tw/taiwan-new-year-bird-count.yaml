summary: Citizen science project monitoring wintering birds in Taiwan and surrounding
  islands since 2014; its 2022 report, the ninth, records 1,032 participants counting
  368,724 birds of 325 species in 172 circles.
facts:
- claim: A citizen science project that has monitored the wintering birds of Taiwan
    and surrounding islands since 2014.
  url: https://nybc.tw/pub/publication/619
  fetched: 2026-11-14
  quote: It is a citizen science project which monitor wintering avifauna of Taiwan
    and surrounding islands since 2014.
- claim: Its 2018 report describes volunteer teams choosing a consecutive 24 hours
    within a 23-day survey period centred on 1 January to count birds in sample circles
    of three-kilometre radius.
  url: https://nybc.tw/pub/publication/619
  fetched: 2026-11-14
  quote: a volunteer team chose a consecutive 24 hours to count the birds within a
    circle sample area which radius is three kilometers.
- claim: In the 2018 count, 1,296 volunteers recorded 334 bird species and 303,426
    individuals in 172 sample circles.
  url: https://nybc.tw/pub/publication/619
  fetched: 2026-11-14
  quote: The 1,296 volunteers recorded 334 bird species from 303,426 individuals within
    172 circle samples.
- claim: Its 2018 report says the datasets would be opened in the Environment Protection
    Administration's open database and shared with Wetlands International's International
    Waterbird Census, and that the project would continue.
  url: https://nybc.tw/pub/publication/619
  fetched: 2026-11-14
  quote: they will be opened in the database of open data in the Environment Protection
    Administration and shared with the International Waterbird Census of Wetland International.
    This project will keep conducting
- claim: Its 2018 report names the hosts as the Chinese Wild Bird Federation, the
    Wild Bird Society of Taipei, the Kaohsiung Wild Bird Society and the Taiwan Endemic
    Species Research Institute.
  url: https://nybc.tw/pub/publication/619
  fetched: 2026-11-14
  quote: NYBC Taiwan is hosted by Chinese Wild Bird Federation (CWBF), Wild Bird Society
    of Taipei (WBST), Kaohsiung Wild Bird Society (KWBS) and Taiwan Endemic Species
    Research Institute (TESRI).
- claim: Its 2022 report, the ninth, records that 1,032 participants counted 368,724
    birds of 325 species in 172 sample circles between 18 December 2021 and 9 January
    2022.
  url: https://nybc.tw/en/publication/taiwan-new-year-bird-count-2022-annual-report
  fetched: 2026-11-14
  quote: During the survey, 1,032 participants recorded 368,724 individuals from 325
    species in 172 sample circles.
- claim: Its 2022 report says its data were shared with Wetlands International for
    use in the Asian Waterbird Census.
  url: https://nybc.tw/en/publication/taiwan-new-year-bird-count-2022-annual-report
  fetched: 2026-11-14
  quote: The data is also shared with Wetlands International for use in the Asian
    Waterbird Census.
- claim: Its 2022 report names the organisers as the Taiwan Wild Bird Federation,
    the Wild Bird Society of Taipei, the Kaohsiung Wild Bird Society and the Taiwan
    Endemic Species Research Institute.
  url: https://nybc.tw/en/publication/taiwan-new-year-bird-count-2022-annual-report
  fetched: 2026-11-14
  quote: The Taiwan NYBC is organized by the Taiwan Wild Bird Federation (TWBF), the
    Wild Bird Society of Taipei (WBST), the Kaohsiung Wild Bird Society (KWBS) and
    the Taiwan Endemic Species Research Institute (TESRI).
- claim: The site lists a 2024 annual report.
  url: https://nybc.tw/en/publication/taiwan-new-year-bird-count-2022-annual-report
  fetched: 2026-11-14
  quote: Taiwan New Year Bird Count 2024 Annual Report
