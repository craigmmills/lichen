facts:
- claim: An incorporated association (社團法人) founded in 1973.
  url: https://www.forest.gov.tw/file/203349
  fetched: 2026-11-15
  quote: 成立於 1973 年的社團法人台北市野鳥學會（以下簡稱台北鳥會）近 50 年來致力於大臺
- claim: Executing unit of a 2025 Forestry and Nature Conservation Agency project
    whose report is dated 30 January 2026 and published on the agency's site.
  url: https://www.forest.gov.tw/file/203349
  fetched: 2026-11-15
  quote: 執行單位：社團法人台北市野鳥學會
- claim: The project's 2025 objectives included expanding and updating the barn swallow
    breeding map and establishing a long-term monitoring database.
  url: https://www.forest.gov.tw/file/203349
  fetched: 2026-11-15
  quote: 與更新 114 年度「家燕繁殖地圖網」 ，建立長期監測資料庫，資料收集包含返巢時
- claim: The report describes a 2024 citizen science survey of barn swallow breeding
    sites.
  url: https://www.forest.gov.tw/file/203349
  fetched: 2026-11-15
  quote: 針對家燕繁殖地點進行公民科學調查，分析回巢時間與民眾
- claim: Co-organised the Taiwan New Year Bird Count with the Chinese Wild Bird Federation,
    the Kaohsiung Wild Bird Society and the Endemic Species Research Institute, according
    to the count's 2017 report.
  url: https://nybc.tw/pub/publication/589
  fetched: 2026-11-15
  quote: 與社團法人台北市野鳥學會、社團法人高雄市野鳥學會,以及行政院農業委員會特有生物研究保育中心共同籌辦與推動
