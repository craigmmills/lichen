summary: Infrared camera monitoring in Taiwan's national forests, run by the Forestry and Nature Conservation
  Agency, with 387 long-term points reported in May 2024 and a stated plan to greatly increase coverage.
facts:
- claim: FANCA reported in May 2024 that it had installed infrared automatic cameras in national forests
    since September 2015 and had 387 long-term monitoring points.
  url: https://www.forest.gov.tw/en/news/0073612
  fetched: 2026-11-12
  quote: Currently, there are 387 sampling points carrying out long-term monitoring to observe the changes
    in the populations of medium- to large-sized wild mammals.
- claim: Rangers of FANCA's branches set up the sampling points and download the data.
  url: https://www.forest.gov.tw/en/news/0073612
  fetched: 2026-11-12
  quote: Sampling point setting and data downloading for this long-term wildlife monitoring system are
    all carried out by the forest rangers of the FANCA’s various branches.
- claim: FANCA said in 2024 that camera points would be greatly increased to cover Taiwan's low-elevation
    mountains and plains.
  url: https://www.forest.gov.tw/en/news/0073612
  fetched: 2026-11-12
  quote: long-term monitoring of wildlife can be expanded from national forest areas to include all of
    Taiwan’s low-elevation mountains and plains.
