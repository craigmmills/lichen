summary: Closed assessment run by the Greenland Institute of Natural Resources and
  DCE, compiling baseline data for South Greenland mining and producing a 10 by 10
  metre Sentinel-2 vegetation map with five types, published in 2023.
facts:
- claim: Compiles existing spatial baseline information on geology, environmental
    chemistry, biodiversity, human use and heritage values of South Greenland.
  url: https://dce.au.dk/udgivelser/vr/nr-451-500/abstracts/no-482-south-greenland-regional-environmental-baseline-assessment-for-mining-activities
  fetched: 2026-11-15
  quote: The RBA for South Greenland compiles existing spatial baseline information
    on geology, environmental chemistry, biodiversity, human use, and heritage values
    of South Greenland.
- claim: The existing information was supplemented with a vegetation mapping study
    and new sampling and chemical analysis of environmental samples.
  url: https://dce.au.dk/udgivelser/vr/nr-451-500/abstracts/no-482-south-greenland-regional-environmental-baseline-assessment-for-mining-activities
  fetched: 2026-11-15
  quote: The existing information has been supplemented with a vegetation mapping
    study and additional sampling and chemical analysis of environmental samples.
- claim: The project made an updated 10 by 10 metre vegetation map of South Greenland
    with five vegetation types.
  url: https://dce.au.dk/udgivelser/vr/nr-451-500/abstracts/no-482-south-greenland-regional-environmental-baseline-assessment-for-mining-activities
  fetched: 2026-11-15
  quote: An updated vegetation map (scale 10x10 m) of South Greenland with 5 vegetation
    types (copse, dwarf shrub heath, lichen-rich shrub heath, grassland, and fen)
    was made.
- claim: The report describes the processing steps that turned Sentinel-2 satellite
    images into the vegetation map.
  url: http://dce2.au.dk/pub/SR482.pdf
  fetched: 2026-11-15
  quote: Diagram showing the processing steps of transforming Sentinel-2 satellite
    images into a vegetation map.
- claim: The full data are published in NatureMap and in a project webGIS.
  url: https://dce.au.dk/udgivelser/vr/nr-451-500/abstracts/no-482-south-greenland-regional-environmental-baseline-assessment-for-mining-activities
  fetched: 2026-11-15
  quote: The full data are given in NatureMap.gl and an integrated project-specific
    webGIS (rba.eamra.gl).
- claim: The project was funded by the Environmental Agency for Mineral Resource Activities
    (EAMRA).
  url: http://dce2.au.dk/pub/SR482.pdf
  fetched: 2026-11-15
  quote: The project was funded by EAMRA.
- claim: DCE published the report as Scientific Report No. 482 in 2023.
  url: https://dce.au.dk/udgivelser/vr/nr-451-500/abstracts/no-482-south-greenland-regional-environmental-baseline-assessment-for-mining-activities
  fetched: 2026-11-15
  quote: (Eds). 2023. South Greenland - Regional environmental baseline assessment
    for mining activities. Aarhus University, DCE – Danish Centre for Environment
    and Energy, 201 pp. Scientific Report No. 482
