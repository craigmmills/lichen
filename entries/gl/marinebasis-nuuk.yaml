summary: Long-term marine monitoring programme in Nuup Kangerlua, begun in 2005 and
  run by the Greenland Institute of Natural Resources, with data used by Arctic Council
  working groups and funding from DANCEA and Danish ministries.
facts:
- claim: The long-term marine monitoring programme in Nuup Kangerlua began in 2005,
    with some earlier time series going back to the 1950s.
  url: https://gcrc.gl/research-projects/greenland-ecosystem-monitoring-marinebasis-nuuk/
  fetched: 2026-11-14
  quote: The long-term marine monitoring program was initiated in 2005 with some preexisting
    time series going back to the 1950s.
- claim: The MarineBasis programme's parameters include species composition of phytoplankton
    and zooplankton, macroalgal growth and, at Nuuk, counts of marine mammals and
    seabirds.
  url: https://gcrc.gl/research-projects/greenland-ecosystem-monitoring-marinebasis-nuuk/
  fetched: 2026-11-14
  quote: species composition of phytoplankton and zooplankton, macroalgal growth and
    the counting of marine mammals and seabirds (Nuuk)
- claim: Data from the programme are used by Arctic Council working groups including
    CBMP, AMAP and CAFF.
  url: https://gcrc.gl/research-projects/greenland-ecosystem-monitoring-marinebasis-nuuk/
  fetched: 2026-11-14
  quote: Data from the program is used by several international work groups under
    the Arctic Council such as CBMP, AMAP and CAFF.
- claim: Is funded by DANCEA, the Danish Ministry of Energy, Utilities and Climate
    and the Ministry of Environment and Food of Denmark.
  url: https://gcrc.gl/research-projects/greenland-ecosystem-monitoring-marinebasis-nuuk/
  fetched: 2026-11-14
  quote: MarineBasis Nuuk is funded by DANCEA, Danish Ministry of Energy, Utilities
