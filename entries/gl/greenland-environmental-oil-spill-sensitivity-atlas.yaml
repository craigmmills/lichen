summary: Active atlas dataset showing wildlife, fishing, hunting and archaeological
  sites sensitive to oil spills, with coast classified in roughly 50 km segments,
  built by Aarhus University's Department of Ecoscience; newest parts published in
  2022.
facts:
- claim: The atlas gives an overview of wildlife, human resource use (fishing and
    hunting) and archaeological sites that are particularly sensitive to oil spills.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: The atlas provides an overview of such aspects as the occurrence of wildlife,
    human resource use (fishing and hunting) and archaeological sites that are particularly
    sensitive to oil spills.
- claim: Its information comes from scientific studies and from interviews with local
    fishers and hunters in almost all settlements within the mapped region.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: The information derives from numerous scientific studies and from local knowledge
    achieved from interviews with local fishermen and hunters in almost all settlements
    within the mapped region.
- claim: The coast is divided into segments of about 50 km, each classified by its
    overall sensitivity to marine oil spills.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: The coast is divided into segments of app. 50 km length, and each segment
    is classified according to its overall sensitivity to marine oil spills.
- claim: The newest parts, for Northeast and Southeast Greenland, were published as
    DCE scientific reports in 2022.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: 'No. 495: Environmental Oil Spill Sensitivity Atlas for Northeast Greenland
    (71º-81.5º N)'
- claim: The atlas was developed by a number of Greenlandic and Danish institutions
    headed by the National Environmental Research Institute.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: The atlas is developed collaboratively by a number of Greenlandic and Danish
    institutions headed by the National Environmental Research Institute.
- claim: It is financed by the Greenland Home Rule Bureau of Minerals and Petroleum
    and by the Danish Ministry of Environment through Dancea.
  url: https://ecos.au.dk/en/researchconsultancy/themes/oil-and-environment-in-greenland/oil-spill-sensitivity-atlas
  fetched: 2026-11-15
  quote: The atlas is financed by the Greenland Home Rule Bureau of Minerals and Petroleum
    and The Danish Ministry of Environment, Danish Cooperation for Environment in
    the Arctic (Dancea).
