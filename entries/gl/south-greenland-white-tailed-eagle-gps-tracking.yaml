summary: Active project run by the Greenland Institute of Natural Resources, fitting solar-powered
  GPS transmitters to white-tailed eagle chicks in South Greenland; per Arctic Hub, the DNA
  diet study ends in 2026 while movement tracking continues.
facts:
- claim: The institute's front page says researchers are looking for eagle nests in South
    Greenland where chicks are fitted with small GPS transmitters, so the eagles' movements
    can be followed over several years.
  url: https://natur.gl/
  fetched: 2026-11-15
  quote: I Sydgrønland leder forskerne efter ørnereder, hvor ungerne får monteret små GPS-sendere.
    De gør det muligt at følge ørnenes bevægelser gennem flere år og undersøge hvordan de
    bruger området.
- claim: Arctic Hub reported on 17 May 2026 that the researchers attached small solar-powered
    GPS transmitters to each chick they reached in the nests during the previous summer.
  url: https://arctichub.gl/white-tailed-eagles-with-backpacks-put-researchers-on-the-right-track/
  fetched: 2026-11-15
  quote: they attached small solar-powered GPS transmitters to each chick
- claim: Arctic Hub reports that samples from the chicks' beaks, talons and droppings are
    analysed for DNA traces of prey, which are compared with a database to find what the chicks
    ate.
  url: https://arctichub.gl/white-tailed-eagles-with-backpacks-put-researchers-on-the-right-track/
  fetched: 2026-11-15
  quote: They identify DNA traces from prey animals and compare them with a database to determine
    what the chicks have eaten.
- claim: Arctic Hub reports that the diet study ends in 2026 and the movement study continues
    as new chicks are fitted with GPS backpacks.
  url: https://arctichub.gl/white-tailed-eagles-with-backpacks-put-researchers-on-the-right-track/
  fetched: 2026-11-15
  quote: The study of the eagles’ diet will conclude in 2026, while the movement study will
    continue as new chicks are equipped with GPS backpacks.
- claim: Arctic Hub lists the Aage V. Jensen Foundation, the Greenland Research Council, the
    Swiss Polar Institute and others as supporters of the project.
  url: https://arctichub.gl/white-tailed-eagles-with-backpacks-put-researchers-on-the-right-track/
  fetched: 2026-11-15
  quote: The project is supported by the Aage V. Jensen Foundation, the Greenland Research
    Council, the Swiss Polar Institute
