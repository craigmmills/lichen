summary: Research project run by the Greenland Institute of Natural Resources, which
  fitted GPS collars to 49 muskoxen in late 2025 to compare their landscape use with
  reindeer, with Copenhagen Zoo and Aarhus University as partners.
facts:
- claim: The Greenland Institute of Natural Resources is behind a new research project
    in which it fitted GPS collars to 49 muskoxen across the Sisimiut–Kangerlussuaq
    hunting area in late October and early November 2025.
  url: https://natur.gl/year/2026/groenlands-naturinstitut-saetter-gps-halsbaand-paa-49-moskusokser/
  fetched: 2026-11-14
  quote: Grønlands Naturinstitut står bag et nyt forskningsprojekt, hvor instituttet
    i slutningen af oktober og starten af november 2025 satte GPS-halsbånd på 49 moskusokser
    i hele Sisimuit–Kangerlussuaq-jagtområdet.
- claim: The researchers will also map plant composition in the area and assess grazing
    pressure.
  url: https://natur.gl/year/2026/groenlands-naturinstitut-saetter-gps-halsbaand-paa-49-moskusokser/
  fetched: 2026-11-14
  quote: Udover dyrenes bevægelser vil forskerne også kortlægge plantesammensætningen
    i området og vurdere græsningstrykket.
- claim: The institute fitted GPS collars to 40 reindeer in the same area in winter
    2024, so the two species' use of the landscape can be compared.
  url: https://natur.gl/year/2026/groenlands-naturinstitut-saetter-gps-halsbaand-paa-49-moskusokser/
  fetched: 2026-11-14
  quote: I vinteren 2024 satte Grønlands Naturinstitut GPS-halsbånd på 40 rensdyr
    i området.
