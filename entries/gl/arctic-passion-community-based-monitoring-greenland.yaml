summary: A project led by Malene Simon that plans to co-create a marine climate and noise
  monitoring service with four north-west Greenland communities; sensors were reported deployed
  with local hunters in January 2022.
facts:
- claim: Plans to co-create with four communities in north-west Greenland a service to monitor
    the marine climate and noisescape in coastal zones.
  url: https://arcticpassion.eu/wp4/ps7/
  fetched: 2026-11-12
  quote: We will co-create with the communities of Qaanaaq, Savissivik, Siorapaluk and Qerqertat
    in NW Greenland, a service to monitor the marine climate and noisescape in coastal zones.
- claim: Plans to equip and maintain two to four sites with sound recording and oceanographic
    sensors to address a lack of baseline data on marine mammals and marine conditions.
  url: https://arcticpassion.eu/wp4/ps7/
  fetched: 2026-11-12
  quote: To address a lack of baseline data on the presence of marine mammals and on the marine
    climate and noisescape of Arctic marine waters we will equip and maintain 2-4 sites
- claim: The team deployed sensors for monitoring marine noise, mammals and conditions in
    cooperation with local hunters, reported in January 2022.
  url: https://arcticpassion.eu/wp4/ps7/
  fetched: 2026-11-12
  quote: The work package 4 team has deployed sensors for monitoring marine noise, mammals
    and conditions in Greenland, in cooperation with local hunters.
