summary: A programme run by the Greenland Institute of Natural Resources since 2015, recording seafloor
  photos and video down to 1,600 m, with imagery feeding projects that aim to apply AI identification.
facts:
- claim: Carried out by the Greenland Institute of Natural Resources since 2015, with photos and video
    recorded as deep as 1,600 m.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: including collection and analysis of photos and GoPro video footage recorded as deep as 1,600
    m
- claim: Uses a towed camera system with a video camera, lights, scaling lasers and an echo sounder, deployed
    since 2017.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: It has been successfully deployed since 2017.
- claim: Its image and video data feed the BlueCea, POMP and SES projects, which aim to apply AI identification
    to almost ten years of imagery.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: Image and video data from the GINR benthic monitoring program contributes to the BlueCea, POMP,
    and SES projects.
- claim: A four-year project funded in 2023 aims to consolidate and expand the programme for mapping and
    monitoring seafloor communities.
  url: https://gcrc.gl/year/2023/project-funding-breathes-new-life-into-monitoring-greenlands-seafloor/
  fetched: 2026-11-12
  quote: This four-year initiative aims to consolidate and expand the program for mapping and monitoring
    seafloor communities in Greenland.
