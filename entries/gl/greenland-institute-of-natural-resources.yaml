facts:
- claim: Conducts research into Arctic ecosystems, monitors living resources and the environment in Greenland,
    and advises the Government of Greenland.
  url: https://natur.gl/about-us/naturinstituttet/?lang=en
  fetched: 2026-11-12
  quote: The Greenland Institute of Natural Resources conducts research into Arctic ecosystems, monitors
    the living resources and the environment in Greenland and advises the Government of Greenland
- claim: Its 2013–17 strategy describes its statutory tasks and funding through the Finance Act.
  url: https://natur.gl/wp-content/uploads/2019/08/GN_strategi_2013_17_DK.pdf
  fetched: 2026-11-12
  quote: Ifølge Lov om Grønlands Naturinstitut er det instituttets opgaver
- claim: Has carried out a benthic monitoring programme since 2015, the only large-scale survey of the
    region's seafloor.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: Since 2015, a benthic monitoring program carried out by the Greenland Institute of Natural Resources
    (GINR) has provided the only large-scale, comprehensive survey in this region
- claim: Its researchers co-authored a 2025 paper demonstrating a YOLO V5 model trained on Greenlandic
    seafloor images; the paper says deep-learning models can match or, by certain criteria, outperform
    a human annotator.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: The dataset was then exported in a YOLO (You Only Look Once) format and used to train a YOLO
    V5 large object detection model, and object detection predictions were applied to frames from seafloor
    footage.
