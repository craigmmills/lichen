summary: Active project to install what it describes as the first permanent Arctic
  underwater acoustic station for marine mammals and noise; a 23 April 2024 press
  release says it was live, recording all year, run by the Greenland Institute of
  Natural Resources.
facts:
- claim: The project set out to install a hydrophone array in Disko Bay as the first
    permanent Arctic underwater acoustic monitoring station for marine mammals and
    man-made noise, recording all year round.
  url: https://carlsbergfondet.dk/en/what-we-have-funded/cf20-0485/
  fetched: 2026-11-15
  quote: The aim of our project is to install a hydrophone array in Disko Bay, Greenland,
    for establishing the first permanent Arctic underwater acoustic monitoring station
    for marine mammals and anthropogenic noise
- claim: The data are to be used to describe an ecological regime shift and the effects
    of human disturbance on marine mammals in the Arctic.
  url: https://carlsbergfondet.dk/en/what-we-have-funded/cf20-0485/
  fetched: 2026-11-15
  quote: The data will be used to describe a commencing ecological regime shift and
    the effects of anthropogenic disturbance on marine mammals in the Arctic.
- claim: A Visit Greenland press release of 23 April 2024 says the hydrophone station
    in Disko Bay was live for listening.
  url: https://traveltrade.visitgreenland.com/latest-news/dive-deep-listen-live-to-underwater-sounds-of-disko-bay/
  fetched: 2026-11-15
  quote: A new underwater hydrophone station in Disko Bay, Greenland is live for listening
- claim: The press release of 23 April 2024 says the station records 24 hours a day
    all year, and the sound data are streamed and stored to describe changes in the
    marine mammal species in the bay and the extent of man-made noise.
  url: https://traveltrade.visitgreenland.com/latest-news/dive-deep-listen-live-to-underwater-sounds-of-disko-bay/
  fetched: 2026-11-15
  quote: Sound data is streamed and stored to describe changes in the composition
    of marine mammal species in the bay and the extent of man-made noise.
- claim: The press release lists the Crown Prince Frederik's and Crown Princess Mary's
    Foundation, the Carlsberg Foundation, the Aage V. Jensen Charity Foundation and
    Hotel Disko Island as supporters.
  url: https://traveltrade.visitgreenland.com/latest-news/dive-deep-listen-live-to-underwater-sounds-of-disko-bay/
  fetched: 2026-11-15
  quote: The project is supported by Crown Prince Frederik’s and Crown Princess Mary’s
    Foundation, Carlsberg Foundation, Aage V. Jensen Charity Foundation and Hotel
    Disko Island.
