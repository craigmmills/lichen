summary: A project funded by the European Commission in which, per a January 2017 account, local resource
  councils chose what to monitor and community observations were stored in the public PISUNA-net web application.
facts:
- claim: A January 2017 account describes Local Resource Councils of hunters, fishers and others choosing
    what to monitor; pilot communities monitored mammals, fish and birds as well as sea ice.
  url: https://www.iucn.org/news/marine-and-polar/201701/pisuna-community-based-monitoring-management
  fetched: 2026-11-12
  quote: Monitoring by the PISUNA pilot communities primarily focused on terrestrial and marine mammals,
    fish, and birds, but also included abiotic factors such as sea ice cover.
- claim: A January 2017 account says community observations were stored in PISUNA-net, a public, searchable
    web application.
  url: https://www.iucn.org/news/marine-and-polar/201701/pisuna-community-based-monitoring-management
  fetched: 2026-11-12
  quote: The observations made by the local communities are stored in a web-based application - PISUNA-net
    – where they are publically available and can be searched.
