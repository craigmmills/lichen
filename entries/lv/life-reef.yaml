summary: Closed Baltic Sea project, led by the Nature Conservation Agency, that ran from September 2020
  to August 2025 with 4,007,105 euros to map and study protected sandbank and reef habitats.
facts:
- claim: The project set out to map and study EU protected marine habitats 1110 sandbanks and 1170 reefs
    across about 4,116 square kilometres of the Baltic Sea and assess their biodiversity and ecological
    state.
  url: https://lhei.lv/juras-aizsargajamo-biotopu-izpete-un-nepieciesama-aizsardzibas-stavokla-noteiksana-latvijas-ekskluzivaja-ekonomiskaja-zona-eez-life-reef/
  fetched: 2026-11-09
  quote: kartēšana un izpēte aptuveni 4116 km2 plašā Baltijas jūras akvatorijā, novērtēta to bioloģiskā
    daudzveidība, ekoloģiskais stāvoklis
- claim: LHEI's tasks included underwater video observation of protected marine habitats, mapping, and
    improving monitoring methodology for underwater habitats, fish and bird populations.
  url: https://lhei.lv/juras-aizsargajamo-biotopu-izpete-un-nepieciesama-aizsardzibas-stavokla-noteiksana-latvijas-ekskluzivaja-ekonomiskaja-zona-eez-life-reef/
