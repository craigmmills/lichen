summary: State information system, run by the Nature Conservation Agency, that stores Latvian biodiversity
  data on protected areas, species and habitats, used for permitting, planning, status assessments and
  reporting.
facts:
- claim: Holds information on protected nature territories, micro-reserves, protected species and habitats,
    and biodiversity monitoring data.
  url: https://daba.gov.lv/en/nature-data-management-system-ozols
  fetched: 2026-11-09
  quote: biodiversity monitoring data and other data that are actual in nature protection.
- claim: The LIFE-IP LatViaNature project page says the system is a state information system where Latvia's
    biodiversity data are stored, used for permitting, planning, status assessments and reporting.
  url: https://latvianature.daba.gov.lv/en/?p=3060
  fetched: 2026-11-09
  quote: The data are used in various areas such as permitting, control, planning, species and habitat
    status assessments, reporting and elsewhere.
- claim: Holds information on specially protected nature areas, protected species and habitats, management
    measures, tourism infrastructure in protected areas and biodiversity monitoring data.
  url: https://www.daba.gov.lv/lv
  fetched: 2026-11-09
  quote: Šajā sistēmā tiek uzkrāta informācija par īpaši aizsargājamām dabas teritorijām, īpaši aizsargājamām
    sugām un biotopiem, apsaimniekošanas pasākumiem, tūrisma infrastruktūru īpaši aizsargājamās dabas
    teritorijās, bioloģiskās daudzveidības monitoringa dati u.c.
