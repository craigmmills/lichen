summary: Field station run by the University of Latvia Institute of Biology, between
  Lake Pape and the Baltic Sea, which has monitored and ringed migrating birds and
  bats since 1967.
facts:
- claim: Has monitored and trapped and ringed migrating birds, including nocturnal
    migrants, and bats since 1967, with a Heligoland trap and a bird watching tower.
  url: https://lubi.lu.lv/eng/laboratories/ornithology
  fetched: 2026-11-12
  quote: Since 1967 monitoring of migrating birds and mass-scale trapping and ringing
    of migrating birds, also nocturnal migrating birds (especially owls) and bats
    have been conducted.
- claim: Lies between Lake Pape and the Baltic Sea, about 300 km south-west of Riga.
  url: https://lubi.lu.lv/eng/laboratories/ornithology
  fetched: 2026-11-12
  quote: The Pape Ornithological Field Station is located between Lake Pape and the
    Baltic Sea, about 300 km SW from Riga.
- claim: The University of Latvia names it as one of the Institute of Biology's research
    bases.
  url: https://www.lu.lv/en/about-us/structure/institutes/ul-institute-of-biology/
  fetched: 2026-11-09
  quote: 'The Institute has a number of research bases: Engure Ornithological Research
    Centre, Pape Ornithological Station and the National Long-Term Environmental Studies
    Network Mazsalaca Station'
