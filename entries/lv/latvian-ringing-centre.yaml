facts:
- claim: Manages all ringing material accumulated in Latvia since 1925, about 1.7
    million birds ringed, and organises bird ringing.
  url: https://lubi.lu.lv/en/departments/latvian-ringing-centre/
  fetched: 2026-11-12
  quote: It manages all of the ringing material accumulated in Latvia since 1925 (about
    1.7 million birds ringed, 40 000 random recoveries of Latvian ringed birds and
    6000 recoveries of birds ringed abroad), organises bird ringing, and supports
    research projects using rings.
- claim: Is a member of EURING.
  url: https://lubi.lu.lv/en/departments/latvian-ringing-centre/
  fetched: 2026-11-12
  quote: The Latvian Ringing Centre is a member of EURING (The European Union for
