status: active
countries:
- lv
summary: Volunteer based counts run by the Latvian Ornithological Society since 2005
  and funded by the Nature Conservation Agency, with volunteers submitting counts
  from 44 routes in 2025.
facts:
- claim: A 2018 talk by Ainārs Auniņš describes the counts as organised by the Latvian
    Ornithological Society, volunteer based and started in 2005.
  url: https://www.lu.lv/fileadmin/user_upload/LU.LV/Apaksvietnes/Konferences/Comm_ForestBirds_Trends_LV_AuninsA_20181205.pdf
  fetched: 2026-11-12
  quote: Organised by the Latvian Ornithological society • Volunteer based • Started
    in 2005
- claim: The same talk says the counts are part of the biodiversity monitoring programme
    and funded by the Nature Conservation Agency, with 40 to 50 routes counted each
    year.
  url: https://www.lu.lv/fileadmin/user_upload/LU.LV/Apaksvietnes/Konferences/Comm_ForestBirds_Trends_LV_AuninsA_20181205.pdf
  fetched: 2026-11-12
  quote: Biodiversity monitoring programme – Funded by the Nature Conservation Agency
    • 40 – 50 routes counted annually
- claim: The 2018 talk lists annual population indices and trends for more than 100
    species, a farmland bird index and a forest bird index, with trend analysis using
    TRIM.
  url: https://www.lu.lv/fileadmin/user_upload/LU.LV/Apaksvietnes/Konferences/Comm_ForestBirds_Trends_LV_AuninsA_20181205.pdf
  fetched: 2026-11-12
  quote: Annual Farmland Bird Index and Forest bird index
- claim: The 2025 final report on daily bird monitoring, published by the Nature Conservation
    Agency, says it began in 2005 as the Latvian Ornithological Society's breeding
    bird counts.
  url: https://www.daba.gov.lv/lv/media/25253/download
  fetched: 2026-11-12
  quote: Dienas putnu monitorings uzsākts 2005. gadā kā Latvijas Ornitoloģijas biedrības
    Ligzdojošo
- claim: Volunteers submitted counts from 44 routes in 2025.
  url: https://www.daba.gov.lv/lv/media/25253/download
  fetched: 2026-11-12
  quote: Dienas putnu uzskaitēm 2025. gadā brīvprātīgie iesniedza datus par uzskaitēm
    44 maršrutos.
