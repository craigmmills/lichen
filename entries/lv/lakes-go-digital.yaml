facts:
- claim: Is to develop and deploy six autonomous smart buoys with optical sensors
    for continuous water quality monitoring, with a server, data analysis system and
    dashboard.
  url: https://lhei.lv/en/?p=14486
  fetched: 2026-11-12
  quote: The project will develop and deploy six autonomous smart buoys with optical
    sensors for continuous water quality monitoring .
- claim: Is to build a framework combining smart buoy data, ecological assessments
    and remote sensing in process-based modelling of the lakes' ecosystem services.
  url: https://lhei.lv/en/?p=14486
  fetched: 2026-11-12
  quote: A methodological framework will be developed, integrating smart buoy data,
    ecological assessments, and remote sensing into process-based modeling.
- claim: Runs from 1 March 2025 to 28 February 2027 with a budget of 702,584 euros.
  url: https://lhei.lv/en/?p=14486
