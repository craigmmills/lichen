summary: Project begun in 2025 and run by Mercator Ocean International, whose first
  phase produced a Cocos Island dashboard and whose second phase, to December 2026,
  is to plan an ocean prediction service centre.
facts:
- claim: Mercator Ocean says the project was kicked off in 2025 by Mercator Ocean
    International and the European Commission's DG INTPA, and its first milestone
    was a dashboard to help monitor and manage the marine environment around Cocos
    Island National Park.
  url: https://www.mercator-ocean.eu/news-en/ocean-prediction-for-costa-rica-cocos-islands-dashboard-launched/
  fetched: '2026-11-12'
  quote: A digital dashboard to help monitor and manage the marine environment around
    Cocos Island National Park, first unveiled at the United Nations Ocean Conference
    (UNOC).
- claim: The dashboard has three panels, for primary production, waves and currents,
    and pelagic species.
  url: https://www.mercator-ocean.eu/news-en/ocean-prediction-for-costa-rica-cocos-islands-dashboard-launched/
  fetched: '2026-11-12'
  quote: 'The Marine Monitoring Dashboard has three integrated control panels by theme:
    primary production, waves and currents, and pelagic species .'
- claim: The page says the first phase, January to June 2025, was carried out with
    experts from the Cocos Marine Conservation Area.
  url: https://www.mercator-ocean.eu/news-en/ocean-prediction-for-costa-rica-cocos-islands-dashboard-launched/
  fetched: '2026-11-12'
  quote: This effort was carried out in close collaboration with experts from the
    Cocos Marine Conservation Area (ACMC)
- claim: The second phase runs until December 2026 and is to produce a diagnosis and
    action plan for a Costa Rican ocean prediction service centre.
  url: https://www.mercator-ocean.eu/news-en/ocean-prediction-for-costa-rica-cocos-islands-dashboard-launched/
  fetched: '2026-11-12'
  quote: the project now moves into its second phase, which will run until December
    2026
