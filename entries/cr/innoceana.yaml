summary: Local marine conservation non-profit, per Earth.Org, that measures water
  quality at georeferenced points and makes seabed maps with BIIGLE software around
  Isla del Caño.
facts:
- claim: Earth.Org describes Innoceana as a local marine conservation non-profit that
    started projects around Isla del Caño.
  url: https://earth.org/exploring-costa-ricas-trailblazing-efforts-to-save-coral-reefs
  fetched: '2026-11-12'
  quote: All these prompted Innoceana , a local marine conservation non-profit, to
    initiate marine conservation projects in the area.
- claim: Earth.Org reports that Innoceana measures visibility, turbidity and water
    quality at georeferenced points, and monitors the coral substrate layer, making
    seabed maps with BIIGLE software.
  url: https://earth.org/exploring-costa-ricas-trailblazing-efforts-to-save-coral-reefs
  fetched: '2026-11-12'
  quote: Additionally, Innoceana monitors the coral substrate layer, categorizing
    substrates to evaluate coral stress levels. Using BIIGLE software , they create
    seabed maps for long-term analysis.
- claim: The Rufford Foundation's page on its 2020 INMOLO grant says Innoceana NGO
    would inventory marine invertebrates at Caño Island and Marino Ballena National
    Park.
  url: https://www.rufford.org/projects/laura-rose-vanopdenbosch/inmolo-invertebrate-monitoring-and-localization-in-and-around-ca%C3%B1o-island-and-marino-ballena-national-park-costa-rica/
  fetched: '2026-11-12'
  quote: With INMOLO project, Innoceana NGO – whose aim is to protect oceans through
    innovation and education – will inventory marine invertebrates
