summary: Protected area established in 1975 covering over 45,000 hectares, where specialists
  have collected terrestrial mammal monitoring data since 2012 and developed a national
  monitoring protocol in 2022.
facts:
- claim: The HAC for Nature and People says Corcovado and SINAC specialists (spelled
    SINCAC in this passage) have collected terrestrial mammal monitoring data since
    2012 using footprints, excrement and camera traps.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: Since 2012, Corcovado and SINCAC specialists have collected extensive monitoring
    data on terrestrial mammals using footprints, excrement, and camera traps.
- claim: The page says they developed a national protocol for monitoring non-flying
    terrestrial mammals in 2022.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: In 2022, they developed a national protocol for monitoring non-flying terrestrial
    mammals, with the goal of standardizing data collection and analysis across protected
    areas.
- claim: The park was established in 1975 and protects more than 45,000 hectares.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: Established in 1975, Corcovado National Park protects more than 45,000 hectares
    of rainforest, mangroves, and coastal ecosystems
