summary: Camera-trap project in Guanacaste, reported in 2020 as aiming to install 24 camera
  sets in five protected areas, with students planning, but not yet using, AI to build a jaguar
  database.
facts:
- claim: Voz de Guanacaste (29 September 2020) reports the project's goal of installing 24
    sets of camera equipment in five protected areas in the province.
  url: https://vozdeguanacaste.com/en/?p=73853
  fetched: '2026-11-15'
  quote: The project goal is to install 24 sets of camera equipment in five protected areas
    in the province.
- claim: The same report says the cameras will record forest fauna for nine months to create
    a database of Guanacaste species.
  url: https://vozdeguanacaste.com/en/?p=73853
  fetched: '2026-11-15'
  quote: For nine months, the cameras will record the forest fauna to create a database of
    Guanacaste species.
- claim: In a Tico Times column of 27 December 2024 its founder writes that he sends his jaguar
    videos to the keeper of a database of Guanacaste jaguars identified by spot pattern.
  url: https://ticotimes.net/2024/12/27/secret-lives-of-costa-rican-jaguars-revealed-through-trail-camera-network
  fetched: '2026-11-15'
  quote: I’ve been invited to send my jaguar videos to the keeper of the database
- claim: In a Tico Times column of 8 December 2025 its founder writes that students plan to
    use AI to build a database of jaguars recorded on the project's camera traps and to search
    acoustic recordings for species; this is a plan, not yet in use.
  url: https://ticotimes.net/2025/12/08/how-ai-is-changing-wildlife-research-in-costa-rica
  fetched: '2026-11-15'
  quote: First, the plan is for students to use AI to create a database of the jaguars that
    we’ve been recording with the camera traps.
