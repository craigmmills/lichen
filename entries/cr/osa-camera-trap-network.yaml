summary: Community wildlife monitoring network built by Osa Conservation, whose 2023 page reported 30
  members and plans to join Talamancas camera trap projects as the AMISTOSA Camera Trap Network.
facts:
- claim: Osa Conservation describes it as a community wildlife monitoring network of landowners, research
    groups, protected area managers, ecotourism providers and local communities.
  url: https://osaconservation.org/2023/03/01/conservation-technology-transforming-how-we-monitor-and-protect-tropical-forests/
  fetched: '2026-11-08'
  quote: a community wildlife monitoring network made up of a diverse group of stakeholders who unite
    together to execute region-wide monitoring
- claim: In 2023 the page gave it 30 members, who installed more than 222 cameras across the Osa region
    in 2018.
  url: https://osaconservation.org/2023/03/01/conservation-technology-transforming-how-we-monitor-and-protect-tropical-forests/
  fetched: '2026-11-08'
  quote: The network expanded to its current 30 members, who obtained more than 222 cameras that were
    then installed across the Osa region in 2018
- claim: The page says it was joining camera trap projects in the Talamancas to become the AMISTOSA Camera
    Trap Network.
  url: https://osaconservation.org/2023/03/01/conservation-technology-transforming-how-we-monitor-and-protect-tropical-forests/
  fetched: '2026-11-08'
  quote: The OCTN is growing by uniting forces with organizations who are executing camera trap projects
    in the Talamancas, to become the AMISTOSA Camera Trap Network
