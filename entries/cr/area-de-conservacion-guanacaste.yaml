summary: Costa Rican protected area hosting over ten long-term scientific projects,
  with a research programme envisaged in 1986 and listed camera trap, acoustic, reef
  and satellite fire monitoring.
facts:
- claim: Its research programme page says a research programme was seen as needed
    from 1986 to bridge the protected area's administration and the scientific world.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: desde 1986 se visualizo la necesidad de contar con un Programa de Investigación
    (PI) que tendiera un puente entre la administración del área protegida y el mundo
    científico
- claim: The page says the programme takes part directly in monitoring of corals and
    marine fish, and of currents and red tides.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: las actividades de monitoreo de los corales y peces marinos, el monitoreo
    y seguimiento de las corrientes marinas y mareas rojas
- claim: The page says the area hosts more than ten long-term scientific projects,
    including turtle monitoring and insect inventories.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: hay en el ACG más de 10 proyectos científicos de largo plazo en desarrollo,
    que van desde ecología de ecosistemas acuáticos al monitoreo de tortugas
- claim: The site lists a participatory environmental monitoring project with camera
    traps.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: Monitoreo Ambiental Participativo con cámaras trampa
- claim: The site lists work on acoustic indices applied to biodiversity monitoring
    in a tropical dry forest of the area.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: Índice Acústicos Aplicados al Monitoreo de la Biodiversidad en un Bosque
    Tropical Seco del ACG
- claim: The site lists biodiversity monitoring with autonomous reef monitoring structures.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: Monitoreo de biodiversidad con "Estructuras Autónomas de Monitoreo de Arrecifes"
- claim: The site lists a news item on building capacity in satellite monitoring of
    forest fires.
  url: https://www.acguanacaste.ac.cr/noticias/12-investigacion
  fetched: '2026-11-12'
  quote: ACG fortalece capacidades en monitoreo satelital de incendios forestales
