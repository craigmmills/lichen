summary: Pilot begun in 2020 between Costa Rica and Estonia, funded by the Environmental
  Investment Centre, in which Timbeter's AI measurement was reported in 2022 as a
  way to fight illegal logging.
facts:
- claim: La República reported in February 2022 that measuring with AI instead of
    traditional methods would let Costa Rica better fight illegal logging and monitor
    the forestry sector.
  url: https://www.larepublica.net/noticia/inteligencia-artificial-se-convertira-en-aliado-para-combatir-tala-ilegal-de-madera-en-costa-rica
  fetched: '2026-11-12'
  quote: Realizar mediciones utilizando la inteligencia artificial, en lugar de métodos
    tradicionales, permitiría a Costa Rica combatir de mejor manera la tala ilegal
    y monitorear más a detalle el sector forestal en el país.
- claim: The article says a pilot project begun in 2020 between Costa Rica and Estonia
    aims to make digital timber management easier.
  url: https://www.larepublica.net/noticia/inteligencia-artificial-se-convertira-en-aliado-para-combatir-tala-ilegal-de-madera-en-costa-rica
  fetched: '2026-11-12'
  quote: un proyecto piloto, que inició en 2020 entre Costa Rica y Estonia, pretende
    facilitar la gestión digital de la madera en el país
- claim: The article says Timbeter's technology would ease measuring logs in the field,
    on trucks, at sawmills and in containers, and documenting custody of the timber
    with images.
  url: https://www.larepublica.net/noticia/inteligencia-artificial-se-convertira-en-aliado-para-combatir-tala-ilegal-de-madera-en-costa-rica
  fetched: '2026-11-12'
  quote: se facilitaría la medición de trozas en campo, camiones, aserradero y contenedores,
    así como la documentación con imágenes de la custodia de la madera
