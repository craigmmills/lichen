summary: Association that began work in Talamanca, Costa Rica, and says it has monitored
  stream fish and macroinvertebrates since 2000; UNDP says it was founded in 1983.
facts:
- claim: Says that since 2000 it has monitored fish and benthic macroinvertebrates
    in streams, complemented by a visual index of habitat quality.
  url: https://anaicostarica.org/stream-bio-monitoring.html
  fetched: '2026-11-12'
  quote: Since 2000 ANAI has monitored fish and benthic macroinvertebrates (insects,
    crustaceans and other organisms inhabiting the substrate of streams), complemented
    by a simple visual index of habitat quality.
- claim: Its overview describes it as an association that began work in the Talamanca
    region of Costa Rica.
  url: https://anaicostarica.org/overview.html
  fetched: '2026-11-12'
  quote: After a decade of practical investigation, learning and preparation, ANAI’s
    team set up the association with the mission to make tangible contributions to
    nature conservation
- claim: UNDP reports results of the participatory river biomonitoring ANAI carried
    out in the Sixaola basin in 2023, with the OET-GEF-UNDP Connecting Communities
    and Ecosystems project.
  url: https://www.undp.org/es/node/463056
  fetched: '2026-11-12'
  quote: Estos son parte de los resultados del biomonitoreo participativo de ríos
    realizado por la Asociación ANAI en la Cuenca del Sixaola en el 2023
- claim: UNDP says ANAI was founded in 1983 and started its River Biomonitoring Programme
    in 2000 for the La Amistad Caribe area of Costa Rica and Panama.
  url: https://www.undp.org/es/node/463056
  fetched: '2026-11-12'
  quote: La Asociación ANAI fue fundada en 1983 y en el 2000 arrancó su Programa de
    Biomonitoreo de Ríos para promover la conservación de los ríos y cuencas de la
    zona de La Amistad Caribe de Costa Rica y Panamá.
