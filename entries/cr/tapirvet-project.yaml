summary: A September 2025 Rufford page naming its director describes plans for national health
  surveillance of Baird’s tapirs in Costa Rica with communities, SINAC and national laboratories.
facts:
- claim: The Rufford Foundation's September 2025 page, which names TapirVet's director, describes
    a project called Connecting Tapir Health and Human Action for Human-Tapir Coexistence
    in Costa Rica that will establish a national health surveillance programme for Baird's
    tapirs.
  url: https://www.rufford.org/projects/jorge-rojas/connecting-tapir-health-and-human-action-for-human-tapir-coexistence-in-costa-rica/
  fetched: '2026-11-12'
  quote: This project will establish a national health surveillance program for Baird’s tapirs
    (Tapirus bairdii) in Costa Rica to support their long-term conservation.
- claim: The page shows telemetry used for tapir tracking and monitoring in training workshops
    directed by the TapirVet Project's director.
  url: https://www.rufford.org/projects/jorge-rojas/connecting-tapir-health-and-human-action-for-human-tapir-coexistence-in-costa-rica/
  fetched: '2026-11-12'
  quote: Practice of the use of telemetry for tapir tracking and monitoring during training
    workshops for tapir medical interventions directed by Dr. Jorge Rojas-Jiménez (TapirVet
    Project Director).
- claim: The project described on the Rufford page plans to work with local communities, SINAC
    and national laboratories to monitor tapir health and expand monitoring in key regions.
  url: https://www.rufford.org/projects/jorge-rojas/connecting-tapir-health-and-human-action-for-human-tapir-coexistence-in-costa-rica/
  fetched: '2026-11-12'
  quote: Through collaboration with local communities, SINAC, and national laboratories, we
    will monitor tapir health, train wildlife biologists, veterinarians, and community leaders
    on medical interventions, and expand tapir monitoring in key regions.
