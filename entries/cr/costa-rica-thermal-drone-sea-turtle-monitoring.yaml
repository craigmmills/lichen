summary: Project in Costa Rica, reported by Auckland Zoo in March 2026, using thermal
  drones and AI models to record sea turtle abundance, sex ratios and behaviour, with
  expansion planned for the 2025/2026 nesting season.
facts:
- claim: Auckland Zoo (29 March 2026) says scientists in Costa Rica are using thermal
    drones and emerging AI tools to study sea turtles.
  url: https://www.aucklandzoo.co.nz/news/innovative-drone-project-takes-flight-to-protect-costa-ricas-sea-turtles
  fetched: '2026-11-15'
  quote: Scientists in Costa Rica are taking sea turtle conservation to new heights
    (literally!) by using thermal drones and emerging AI tools to study some of the
    world’s most spectacular marine wildlife.
- claim: The team carried out twice-weekly drone surveys over several months, recording
    turtle abundance, sex ratios and behaviour.
  url: https://www.aucklandzoo.co.nz/news/innovative-drone-project-takes-flight-to-protect-costa-ricas-sea-turtles
  fetched: '2026-11-15'
  quote: Over several months, the team carried out twice-weekly drone surveys along
    pre-programmed routes, capturing detailed ecological information.
- claim: The page says DELT's AI models identified turtles in drone footage and mapped
    high-use areas.
  url: https://www.aucklandzoo.co.nz/news/innovative-drone-project-takes-flight-to-protect-costa-ricas-sea-turtles
  fetched: '2026-11-15'
  quote: DELT’s evolving AI models successfully identified turtles in drone footage
    and mapped high-use areas
- claim: The team plans to expand the project into the 2025/2026 nesting season.
