summary: Twice-yearly bird counts in the eight interurban biological corridors of
  the Greater Metropolitan Area, recorded in eBird; a TEVU biologist reported 11,976
  birds in the April 2026 count.
facts:
- claim: Delfino reports that the eight interurban biological corridors in the Greater
    Metropolitan Area lead urban biodiversity monitoring through bird counts held
    twice a year, in April and December.
  url: https://delfino.cr/2026/05/corredores-biologicos-interurbanos-monitorean-biodiversidad-en-la-gran-area-metropolitana
  fetched: '2026-11-12'
  quote: Ocho corredores biológicos interurbanos en la Gran Área Metropolitana lideran
    el monitoreo de la biodiversidad urbana mediante conteos de aves que se realizan
    dos veces al año, en abril y diciembre
- claim: The April count involved about 80 ornithologists and more than 600 observers
    on 56 routes.
  url: https://delfino.cr/2026/05/corredores-biologicos-interurbanos-monitorean-biodiversidad-en-la-gran-area-metropolitana
  fetched: '2026-11-12'
  quote: participaron aproximadamente 80 expertos ornitólogos y más de 600 observadores
    distribuidos en 56 rutas
- claim: Each bird is recorded in the eBird app, used for monitoring in all eight
    corridors, so results can be consolidated nationally.
  url: https://delfino.cr/2026/05/conteo-de-aves-registro-183-especies-en-el-corredor-biologico-interurbano-cubujuqui
  fetched: '2026-11-12'
  quote: cada ave que se encuentra se va registrando en la aplicación eBird, utilizada
    para el monitoreo en los ocho corredores biológicos interurbanos
- claim: A biologist of the TEVU project reported that the April 2026 count recorded
    11,976 birds of 329 species.
  url: https://delfino.cr/2026/05/conteo-de-aves-registro-183-especies-en-el-corredor-biologico-interurbano-cubujuqui
  fetched: '2026-11-12'
  quote: el conteo de corredores biológicos interurbanos efectuado en abril registró
    un total de 11.976 aves de 329 especies
