summary: Study reported by Delfino in October 2020, in which UCR scientists and SINAC
  monitored sharks and rays with underwater cameras over four years, described as
  the country's first broad study using this method.
facts:
- claim: Delfino reported in October 2020 that UCR scientists, with SINAC, had monitored
    rays and sharks with underwater cameras over the previous four years, the first
    broad study in the country with this method.
  url: https://delfino.cr/2020/10/investigacion-permite-conocer-detalles-de-tiburones-y-rayas-que-habitan-en-el-pacifico-costarricense
  fetched: '2026-11-12'
  quote: En los últimos cuatro años, científicos de la Universidad de Costa Rica (UCR)
    , con la colaboración del Sistema Nacional de Áreas de Conservación (SINAC) del
    Ministerio del Ambiente y Energía (MINAE) , han monitoreado rayas y tiburones
    con cámaras submarinas.
- claim: The study covered protected areas including Isla del Coco National Park,
    Isla del Caño and the Islas Murciélago, and unprotected areas exposed to fishing.
  url: https://delfino.cr/2020/10/investigacion-permite-conocer-detalles-de-tiburones-y-rayas-que-habitan-en-el-pacifico-costarricense
  fetched: '2026-11-12'
  quote: En el estudio se monitorearon áreas protegidas, entre estas el Parque Nacional
    Isla del Coco, la Isla del Caño y las Islas Murciélago, y áreas no protegidas,
    expuestas a actividades de pesca.
