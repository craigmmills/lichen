facts:
- claim: The Guanacaste Dry Forest Conservation Fund says Luis Fonseca López has studied the
    sea turtles of ACG for more than a decade and that his monitoring project is integral
    to understanding population trends.
  url: https://www.gdfcf.org/node/341
  fetched: '2026-11-12'
  quote: His sea turtle monitoring project is integral to understanding population trends
    over time and in designing management and conservation actions
- claim: The page says the research has been extended to predation by jaguars on nesting sea
    turtles.
  url: https://www.gdfcf.org/node/341
  fetched: '2026-11-12'
  quote: Fonseca has also expanded his research focus to cover the prey/predator phenomenon
    between nesting sea turtles and ACG's jaguar
- claim: The page lists a 2022 report on monitoring jaguars that prey on sea turtles at Nancite
