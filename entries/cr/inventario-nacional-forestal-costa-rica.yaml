summary: SINAC-led national forest inventory begun in 2013, reported in 2016 as the
  first forest carbon stock calculation by this route and as input to REDD monitoring,
  with a second inventory planned for 2020.
facts:
- claim: La Nación reported in January 2016 that the national forest inventory was
    led by SINAC and financed by the CCAD-GIZ regional REDD programme.
  url: https://www.nacion.com/ciencia/medio-ambiente/bosques-de-costa-rica-guardan-2-950-millones-de-toneladas-de-carbono/2XNCSVPQUBAZDOPHQ6AIZ2EVE4/story/
  fetched: '2026-11-12'
  quote: Este es uno de los resultados del Inventario Nacional Forestal (INF), iniciativa
    liderada por el Sistema Nacional de Áreas de Conservación (Sinac) y financiada
    por el Programa Regional REDD /CCAD-GIZ.
- claim: In the January 2016 article, the environment minister said the inventory
    provided input for establishing the baseline of the REDD monitoring, reporting
    and verification mechanism.
  url: https://www.nacion.com/ciencia/medio-ambiente/bosques-de-costa-rica-guardan-2-950-millones-de-toneladas-de-carbono/2XNCSVPQUBAZDOPHQ6AIZ2EVE4/story/
  fetched: '2026-11-12'
  quote: Este inventario se convierte en insumo para establecer la línea base del
    mecanismo de monitoreo, reporte y verificación en el marco del Programa REDD
- claim: The January 2016 article said this was the first calculation of forest carbon
    stocks through the national forest inventory.
  url: https://www.nacion.com/ciencia/medio-ambiente/bosques-de-costa-rica-guardan-2-950-millones-de-toneladas-de-carbono/2XNCSVPQUBAZDOPHQ6AIZ2EVE4/story/
  fetched: '2026-11-12'
  quote: Por primera vez se realiza el cálculo a través del Inventario Nacional Forestal
- claim: SIREFOR says the inventory began in 2013 with forest type mapping, with field
    work in 2013 and 2014.
  url: https://www.sirefor.go.cr/
  fetched: '2026-11-12'
  quote: Se inicio en el año 2013 con la elaboración de la cartografía de tipos de
    bosque.La implementación en campo ocurre entre el 2013 y el 2014.
- claim: A SIREFOR news item said Costa Rica planned a second national forest inventory
    in 2020, for continuous monitoring of land use and cover change.
  url: https://www.sirefor.go.cr/
  fetched: '2026-11-12'
  quote: Costa Rica programa realizar un nuevo evento de Inventario Forestal Nacional
    y otros usos y coberturas de la tierra en el año 2020.
