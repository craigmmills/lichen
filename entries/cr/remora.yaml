    traceability across Costa Rica, and gives its site as remoraxyz.com.
  url: https://fishwise.org/effort/remora/
  fetched: '2026-11-08'
  quote: Remora is developing technology, education and marketing to ensure traceability is
    implemented within catches across Costa Rica.
