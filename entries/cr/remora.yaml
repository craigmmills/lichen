facts:
- claim: Schmidt Marine lists Remora, of San José, Costa Rica, among its current partners,
    developing the Smart Scale for fisheries data collection and transparency.
  url: https://schmidtmarine.org/sustainable-fisheries/
  fetched: '2026-11-08'
  quote: Developing the Smart Scale to increase data collection and transparency to fisheries
    worldwide.
- claim: Schmidt Marine says it is piloting the technology on the Osa Peninsula with Osa Conservation.
  url: https://schmidtmarine.org/sustainable-fisheries/
  fetched: '2026-11-08'
  quote: In partnership with Osa Conservation, they are piloting their technology on the Osa
    Peninsula.
