summary: A foundation that, per La República (2018), monitored the waters around the
  island by satellite from January 2012 to June 2017, and per Delfino (2024) cooperates
  at about US$500,000 a year.
facts:
- claim: La República (August 2018) reports that FAICO monitored the Special Economic
    Zone and the Área de Conservación Marina around the island by satellite from January
    2012 to June 2017, detecting foreign-flagged purse seiners, longliners and deep-sea
    trawlers.
  url: https://www.larepublica.net/noticia/pesca-industrial-extranjera-amenaza-isla-del-coco
  fetched: '2026-11-12'
  quote: Faico hizo un monitoreo satelital de la Zona Económica Especial y el Área
    de Conservación Marina (ACMC) de la isla entre enero de 2012 y junio del año anterior
- claim: The same article says the ACMC and FAICO drew up a five-year prevention,
    protection and control plan.
  url: https://www.larepublica.net/noticia/pesca-industrial-extranjera-amenaza-isla-del-coco
  fetched: '2026-11-12'
  quote: ACMC y Faico elaboraron un plan de prevención, protección y control a cinco
    años
- claim: Delfino (May 2024), on its 30th anniversary, reports FAICO's cooperation
    at about US$500,000 a year and that it continues to develop and carry out projects
    for the park.
  url: https://delfino.cr/2024/05/fundacion-amigos-de-la-isla-del-coco-cumple-30-anos
  fetched: '2026-11-12'
  quote: La cooperación de Faico a la fecha se estima en 500,000 de dólares anuales.
- claim: FAICO says 65% of the infrastructure used by rangers, volunteers and researchers
    in the park came from projects it promoted.
  url: https://delfino.cr/2024/05/fundacion-amigos-de-la-isla-del-coco-cumple-30-anos
  fetched: '2026-11-12'
  quote: Faico destacó que el 65% de la infraestructura utilizada por guardaparques,
    voluntarios e investigadores en el parque nacional, es resultado de proyectos
    promovidos por la fundación con diferentes aliados.
