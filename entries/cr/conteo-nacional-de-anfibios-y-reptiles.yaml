summary: National survey of amphibians and reptiles; Delfino reports over 5,000 counted
  on the night of 31 May 2025 in its second edition, along routes in five regions.
facts:
- claim: Delfino reports that more than 5,000 amphibians and reptiles were counted
    in the Second National Count on the night of 31 May 2025.
  url: https://delfino.cr/2025/07/mas-de-5000-anfibios-y-reptiles-fueron-registrados-en-segundo-conteo-nacional
  fetched: '2026-11-12'
  quote: Costa Rica contabilizó más de 5000 individuos de anfibios y reptiles durante
    el Segundo Conteo Nacional de Anfibios y Reptiles, realizado la noche del 31 de
    mayo de 2025.
- claim: The count used night-time visual and acoustic observation, without handling
    the animals, along routes in five regions.
  url: https://delfino.cr/2025/07/mas-de-5000-anfibios-y-reptiles-fueron-registrados-en-segundo-conteo-nacional
  fetched: '2026-11-12'
  quote: La metodología consistió en observaciones nocturnas sin ningún tipo de manipulación
    directa de los animales , privilegiando el registro visual y auditivo para garantizar
    su bienestar.
- claim: The organisers say the collaboration of more than 65 institutions, including
    SINAC, built a database for biological monitoring of the species.
  url: https://delfino.cr/2025/07/mas-de-5000-anfibios-y-reptiles-fueron-registrados-en-segundo-conteo-nacional
  fetched: '2026-11-12'
  quote: Según los organizadores, esta articulación permitió consolidar una base de
    datos valiosa para el monitoreo biológico de las especies y el diseño de estrategias
    de conservación.
