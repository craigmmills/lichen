summary: French and Costa Rican collaboration, led by NatureXpairs with SINAC, in
  which an October 2025 mission shared GeoNature knowledge, with expected integration
  of Corcovado's mammal data into the national PRONAMEC platform.
facts:
- claim: The HAC for Nature and People describes an October 2025 mission led by NatureXpairs
    with SINAC and supported by the French ecological transition ministry, the French
    Biodiversity Office and the HAC secretariat.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: Led by NatureXpairs in collaboration with Costa Rica's National System of
    Conservation Areas (SINAC) and supported by the French Ministry of Ecological
    Transition, the French Biodiversity Office (OFB), and the HAC N&P Secretariat
- claim: During the October 2025 mission, French experts shared knowledge of GeoNature,
    an open-source platform for biodiversity data management.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: French experts from Parc national des Écrins and OFB are sharing their knowledge
    of GeoNature, a French open-source platform for biodiversity data management
- claim: The page says Corcovado and SINAC specialists (spelled SINCAC in this passage)
    have collected terrestrial mammal monitoring data since 2012 using footprints,
    excrement and camera traps, and developed a national protocol in 2022.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: Since 2012, Corcovado and SINCAC specialists have collected extensive monitoring
    data on terrestrial mammals using footprints, excrement, and camera traps.
- claim: Expected outcomes include full integration of Corcovado's data into the national
    PRONAMEC platform.
  url: https://hacfornatureandpeople.org/?p=5788
  fetched: '2026-11-12'
  quote: Expected outcomes of this collaboration include the full integration of Corcovado's
    data into the national PRONAMEC platform
