facts:
- claim: The GEF lists the project with a GEF grant of 2,644,358 US dollars, approved
    for implementation on 11 March 2015 and closed on 30 May 2022.
  url: https://www.thegef.org/projects-operations/projects/5381
  fetched: 2026-11-14
  quote: Project Closed 30 May 2022
- claim: UNDP lists the project as completed.
  url: https://www.undp.org/pacific/projects/nauru-ridge-reef-project
  fetched: 2026-11-14
  quote: Completed
- claim: UNDP says the project was designed to increase knowledge for better management
    of natural resources and ecosystem services for the whole island of Nauru.
  url: https://www.undp.org/pacific/projects/nauru-ridge-reef-project
  fetched: 2026-11-14
  quote: increase knowledge for better management of natural resources and ecosystem
    services for the entire Island of Nauru
- claim: The project's mid-term review, on UNDP's evaluation site, says the project
    supported marine biodiversity and health surveys.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-14
  quote: supported marine biodiversity and health surveys
- claim: The mid-term review reports an island-wide marine health survey as completed.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-14
  quote: Island wide marine health survey completed
- claim: The mid-term review reports GIS training and a household mapping survey as
    completed for all five project districts.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-14
  quote: GIS training completed and household mapping survey completed for all 5
- claim: The mid-term review names the Environment Division of the Department of Commerce,
    Industry and Environment as implementing partner.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-14
  quote: 'Implementing Partner: Environment Division, Department of Commerce, Industry
    &'
- claim: The mid-term review names the Fisheries Department as lead implementing partner
    for the marine biodiversity component.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-14
  quote: The Fisheries Department is the lead implementing partner for Component 1.
