summary: Nauru's statutory fisheries authority, set up by a 1997 Act with a Board
  of Directors, which a 2018 mid-term review reported was leading marine biodiversity
  conservation work in the R2R Nauru project.
facts:
- claim: Nauru's Nauru Fisheries and Marine Resources Authority Act 1997, published
    on FAOLEX, establishes the authority.
  url: https://faolex.fao.org/docs/pdf/nau28254.pdf
  fetched: 2026-11-15
  quote: 3. (1) The Nauru Fisheries and Marine Resources Authority is hereby established.
- claim: The Act provides for a Board of Directors that manages the affairs and exercises
    the powers of the authority.
  url: https://faolex.fao.org/docs/pdf/nau28254.pdf
  fetched: 2026-11-15
  quote: functions, manage the affairs and exercise the powers of the Authority.
- claim: Nauru's 2025 Framework for Climate Change Adaptation and Disaster Risk Reduction
    II (RONAdapt II) lists NFMRA as the Nauru Fisheries and Marine Resources Authority.
  url: https://unfccc.int/sites/default/files/resource/NAP_Nauru_2026.pdf
  fetched: 2026-11-15
  quote: NFMRA Nauru Fisheries and Marine Resources Authority
- claim: The 2018 mid-term review of the R2R Nauru project, on UNDP's evaluation site,
    says NFMRA was taking the lead on Component 1, the conservation of marine biodiversity.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-15
  quote: MTR noted that the implementation of Component 1 which NFMRA is taking lead
    is progressing
- claim: The review names Component 1 as the conservation of marine biodiversity.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-15
  quote: 'Component 1: Conservation of marine biodiversity'
- claim: The review says that, with no LMMA Officer in post, the component relied
    on Fisheries Department staff to help with community consultations and surveys.
  url: https://erc.undp.org/evaluation/documents/download/12406
  fetched: 2026-11-15
  quote: the actions are reliant on Fisheries Department personnel to assist with
    the activities such as the community consultations and the surveys
