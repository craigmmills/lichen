summary: FAO-built project using artificial intelligence and satellite data to map cocoa production areas
  and assess effects on forests, as part of the EU-funded Sustainable Cocoa Programme.
facts:
- claim: FAO says the project uses artificial intelligence and satellite data to identify cocoa production
    areas and assess effects on forest ecosystems.
  url: https://www.fao.org/cameroun/news/detail/fao-supports-the-government-of-cameroon-in-using-ai-and-satellite-imagery-to-produce-cocoa-map-under-the-sustainable-cocoa-programme/en
  fetched: 2026-11-08
  quote: The project Cartography of cocoa in Cameroon and characterization of its impact on forests leverages
    artificial intelligence and satellite data to identify production areas and assess the effects of
    cocoa cultivation on forest ecosystems.
- claim: FAO says the national cocoa mapping is part of the EU Sustainable Cocoa Programme, funded by
    the European Union and implemented by technical partners including FAO.
  url: https://www.fao.org/cameroun/news/detail/fao-supports-the-government-of-cameroon-in-using-ai-and-satellite-imagery-to-produce-cocoa-map-under-the-sustainable-cocoa-programme/en
  fetched: 2026-11-08
  quote: This initiative is part of the EU Sustainable Cocoa Programme (SCP), funded by the European Union
    and implemented by technical partners such as the Food and Agriculture Organization of the United
    Nations (FAO).
- claim: FAO's SEPAL news says COCAFORI aims to produce a forest and land cover map, evaluate cocoa's
    impact on deforestation since 2010 and develop a deforestation risk map.
  url: https://www.fao.org/in-action/sepal/news-and-events/news/detail/mapping-the-path-to-sustainable-cocoa--fao-and-eu-launch-the-cartography-of-cocoa-and-forest-impacts-project-in-cameroon-(cocafori)/en
  fetched: 2026-11-08
  quote: Furthermore, the project seeks to evaluate the impact of cocoa on deforestation since 2010
- claim: FAO organised a training workshop in Ebolowa in July 2025 on AI tools for natural resource management,
    including SEPAL and Google Earth Engine.
  url: https://www.fao.org/cameroun/news/detail/fao-supports-the-government-of-cameroon-in-using-ai-and-satellite-imagery-to-produce-cocoa-map-under-the-sustainable-cocoa-programme/en
  fetched: 2026-11-08
  quote: FAO organized a workshop on 16 to 18 July 2025 in Ebolowa, bringing together 50 participants
    made up of technical experts, ministerial representatives, and institutional partners
