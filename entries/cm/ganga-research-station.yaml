summary: A research station established in January 2016 in Mbam and Djerem National Park,
  built by Ekwoge Abwe, where rotating local teams run monthly transect surveys and monitor
  termite mounds and feeding sites.
facts:
- claim: The station was established in January 2016 in Mbam and Djerem National Park as part
    of a PhD project at Drexel University.
  url: https://cameroonbiodiversity.org/who-we-are/
  fetched: '2026-11-12'
  quote: Ganga Research Station is located in Mbam & Djerem National Park (MDNP) in Cameroon.
    Dr. Ekwoge Abwe established the station in January 2016 as part of a PhD dissertation
    project at Drexel University
- claim: Rotating teams of local biomonitors, eco-guards and senior biologists manage the
    station year-round and run monthly transect surveys, monitoring of termite mounds and
    feeding sites, and reconnaissance surveys.
  url: https://cameroonbiodiversity.org/who-we-are/
  fetched: '2026-11-12'
  quote: These teams conduct a variety of biomonitoring activities, including monthly transect
    surveys, regular monitoring of high-activity areas such as termite mounds and feeding
    sites, and reconnaissance surveys.
- claim: The site belongs to the Cameroon Biodiversity Protection Program.
