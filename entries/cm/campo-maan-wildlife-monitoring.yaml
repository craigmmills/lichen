facts:
- claim: FEDEC says AWF is its implementing agency on five programmes in Campo Ma'an
    National Park, which include monitoring the dynamics of flagship wildlife species
    and ecological research and monitoring.
  url: https://fedec.cm/en/campo-maan-national-park/
  fetched: '2026-11-12'
  quote: FEDEC works in partnership with African Wildlife Foundation, which is its
    implementing agency on five main programs
- claim: One of the programmes is monitoring of the dynamics of flagship wildlife
    species.
  url: https://fedec.cm/en/campo-maan-national-park/
  fetched: '2026-11-12'
  quote: Monitoring of the dynamics of flagship wildlife species
- claim: AWF says camera traps and spatial monitoring tools support community efforts
    in Campo Ma'an, with early results showing many juveniles among observed gorillas.
  url: https://www.awf.org/news/world-gorilla-day-protecting-africas-gentle-giants-people-and-planet
  fetched: '2026-11-12'
  quote: Camera traps and spatial monitoring tools further enhance these community
    efforts. Early results from Campo Ma’an show that a significant proportion of
    the observed gorilla population are juveniles
