facts:
- claim: Describes itself as a legally registered Cameroonian non-profit.
  url: https://www.korup-conservation.org/about-krcs/who-we-are/
  fetched: 2026-11-12
  quote: KRCS is a legally registered Cameroonian non-profit
- claim: Its community-based wildlife monitoring uses camera trapping, acoustic recording
    units and line transects.
  url: https://www.korup-conservation.org/our-work/research-and-monitoringg/
  fetched: 2026-11-12
  quote: trapping, Acoustic Recording Units (ARUs), and line transects to collect
    data and understand wildlife population dynamics
- claim: Its monitoring page says acoustic sensors can detect gunshots and elephant
    vocalisations.
  url: https://www.korup-conservation.org/our-work/research-and-monitoringg/
  fetched: 2026-11-12
  quote: Acoustic sensors can detect various sounds, including gunshots and elephant
    vocalizations, providing insights into gun-hunting and elephant behaviour.
- claim: Trains community members who become field staff in SMART, acoustic recording
    units, camera traps, GPS and GIS.
  url: https://www.korup-conservation.org/our-work/research-and-monitoringg/
  fetched: 2026-11-12
  quote: Regular training for community members who become KRCS field staff on the
    use of SMART, ARUs, Camera traps, Global Positioning System (GPS) and Geographic
    Information System (GIS) technologies
- claim: In May 2025 renewed its agreement with PSMNR-SWR to implement community-based
    wildlife monitoring around Korup National Park.
  url: https://www.korup-conservation.org/news/a-new-chapter-in-community-based-wildlife-monitoring/
  fetched: 2026-11-12
  quote: The renewed agreement between KRCS and PSMNR-SWR will implement collaborative
    management and ecological activities around Korup National Park
