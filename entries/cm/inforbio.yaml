- claim: In the Lobéké landscape, community biomonitoring ran fourteen joint field
    missions between November 2024 and December 2025 and mapped more than 175 km of
    elephant trails.
  url: https://www.fao.org/cameroun/news/detail/inforbio-in-cameroon--intact-forests-for-biodiversity--climate--and-community-health/en
  fetched: 2026-11-12
  quote: initial community biomonitoring activities enabled fourteen joint field missions
    to be conducted between November 2024 and December 2025
- claim: The 2026 to 2030 strategy for Lobéké plans monthly community biomonitoring
    combining community observations, camera traps and acoustic recording units.
  url: https://www.fao.org/cameroun/news/detail/inforbio-in-cameroon--intact-forests-for-biodiversity--climate--and-community-health/en
  fetched: 2026-11-12
  quote: This mechanism will combine community observations, camera traps, acoustic
    recording units, and field data collection
