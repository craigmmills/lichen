summary: WWF-run project, funded by the International Climate Initiative, linking
  deforestation monitoring, biodiversity and public health; in Lobéké, community missions
  from November 2024 to December 2025 mapped over 175 km of elephant trails.
facts:
- claim: Aims to integrate deforestation monitoring, biodiversity conservation and
    public health.
  url: https://www.fao.org/cameroun/news/detail/inforbio-in-cameroon--intact-forests-for-biodiversity--climate--and-community-health/en
  fetched: 2026-11-12
  quote: aims to integrate deforestation monitoring, biodiversity conservation, and
