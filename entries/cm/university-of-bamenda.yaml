summary: A university where JRS says a January 2025 workshop trained participants in iNaturalist and DNA
  barcoding, and which JRS names as a planned partner of the Gashaka Gumti/Tchabal Mbabo project.
facts:
- claim: JRS says a January 2025 pre-conference workshop at the university trained participants to use
    iNaturalist to record edible and poisonous mushrooms.
  url: https://jrsbiodiversity.org/cameroons-university-of-bamenda-hosts-biodiversity-data-training-for-early-career-scientists/
  fetched: 2026-11-08
  quote: A pre-conference workshop focused on using the iNaturalist mobile app to document and share edible
    and poisonous mushrooms information to communities in Cameroon.
- claim: The January 2025 training included DNA barcoding methods for fungi, plants, insects and animals.
  url: https://jrsbiodiversity.org/cameroons-university-of-bamenda-hosts-biodiversity-data-training-for-early-career-scientists/
  fetched: 2026-11-08
  quote: Other training themes included methods and skills of DNA barcoding for students and early career
    researchers
- claim: JRS names the university as a planned research partner of the Gashaka Gumti/Tchabal Mbabo project
    and says it runs a conservation science course.
  url: https://jrsbiodiversity.org/grants/ani_catuc/
  fetched: 2026-11-08
  quote: University of Bamenda which runs a Conservation Science course for graduates and undergraduates
- claim: A 2022 paper on Landsat NDVI-based vegetation degradation in the Southern Bui Plateau has Reeves
    Meli Fokeng of the Department of Geography and Planning, University of Bamenda as its first author,
    according to OpenAlex.
  url: https://api.openalex.org/works/W4225401911?select=id,title,publication_year,authorships
  fetched: 2026-11-08
  quote: Landsat NDVI-based vegetation degradation dynamics and its response to rainfall variability and
    anthropogenic stressors in Southern Bui Plateau, Cameroon
- claim: A 2026 paper mapping land degradation and mining expansion in Colomine with random forest classification
    and Sentinel-2 imagery has Fon Alain Zoum of the University of Bamenda as its first author.
  url: https://api.openalex.org/works/W7221722342?select=id,title,publication_year,authorships
  fetched: 2026-11-08
  quote: Mapping Land Degradation and Mining Expansion in Colomine, Cameroon Using Random Forest Classification
    and Multi-Temporal Sentinel-2 Imagery
