summary: Cameroonian non-profit conservation association that trains community members
  in SMART tools for biomonitoring and studied pangolins using camera traps in Deng-Deng
  National Park from 2018.
facts:
- claim: Describes itself as a Cameroonian non-governmental, non-profit organisation,
    legalised as a local conservation association headquartered in Bangem.
  url: https://freeco-as.org/
  fetched: 2026-11-12
  quote: FReECo is legalized by the Ministry of Territorial Administration as a local
    conservation association headquartered in Bangem
- claim: Trains local community members in SMART tools for biomonitoring and surveillance.
  url: https://freeco-as.org/
  fetched: 2026-11-12
  quote: FReECo provides training to local community members in using SMART tools
    for biomonitoring and surveillance
- claim: A project aims to recover installed camera traps and monitor field assistants'
    use of SMART for biomonitoring.
  url: https://freeco-as.org/
  fetched: 2026-11-12
  quote: The project aims to recover installed camera traps, monitor field assistants’
    use of SMART for biomonitoring, and provide refresher training to local guides
- claim: Studied pangolins in Deng-Deng National Park from 2018 with camera traps,
    and with Rufford and MBZ support worked with local field guides and ecoguards
    on biomonitoring and threat suppression.
  url: https://freeco-as.org/supporting-biomonitoring-and-anthropogenic-threat/
  fetched: 2026-11-12
  quote: with support from the Rufford Foundation and co-funding from MBZ, we worked
    with trained local field guides with good local ecological knowledge
