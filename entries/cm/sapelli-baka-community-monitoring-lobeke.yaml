summary: Project run by UCL's Extreme Citizen Science group, whose app maps resources
  and reports poaching; Mongabay reports 24 people around Lobéké have received training
  since 2021.
facts:
- claim: Mongabay reports that 24 people in six villages around Lobéké National Park
    have been trained to use the app since 2021, and that their data go to the park's
    conservation department.
  url: https://news.mongabay.com/2025/06/in-cameroon-forest-mapping-app-helps-baka-protect-biodiversity-and-way-of-life/
  fetched: 2026-11-12
  quote: Since the Sapelli app was introduced to the Baka in 2021, 24 people have
    been trained to use it in six villages around Lobéké National Park.
- claim: Mongabay reports the app is used to map forest resources, flag human-wildlife
    conflict and report poaching.
  url: https://news.mongabay.com/2025/06/in-cameroon-forest-mapping-app-helps-baka-protect-biodiversity-and-way-of-life/
  fetched: 2026-11-12
  quote: The app allows the Baka to map nontimber forest products (NTFPs), flag human-wildlife
    conflict, and combat poaching.
- claim: Mongabay says the app was introduced as part of a project by UCL's Extreme
    Citizen Science (ExCiteS) research group, funded by the European Research Council
    and WWF.
  url: https://news.mongabay.com/2025/06/in-cameroon-forest-mapping-app-helps-baka-protect-biodiversity-and-way-of-life/
  fetched: 2026-11-12
  quote: as part of a project by the Extreme Citizen Science (ExCiteS) research group
    at University College London, U.K., funded by the European Research Council (ERC)
    and WWF
