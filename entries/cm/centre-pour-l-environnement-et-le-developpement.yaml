summary: Yaoundé organisation founded in 1994, working on environmental justice and forest community rights
  in Central Africa, whose site lists maps including a Dir district deforestation map for January 2023
  to June 2025.
facts:
- claim: Says it was founded in Yaoundé in 1994 and works for environmental justice and the rights of
    local and indigenous forest communities in Central Africa.
  url: http://www.cedcameroun.org/
  fetched: 2026-11-08
  quote: Créé en 1994 à Yaoundé, le CED agit pour la justice environnementale et les droits des communautés
    locales et autochtones des forêts d’Afrique centrale.
- claim: Its site lists maps it has produced, including a deforestation map of Dir district between January
    2023 and June 2025 and land cover maps of Batouri for 2015, 2020 and 2025.
  url: http://www.cedcameroun.org/
