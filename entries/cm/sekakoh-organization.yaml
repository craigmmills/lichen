facts:
- claim: The Global Rewilding Alliance says its trained teams and community monitors run patrols and camera
    trapping to deter deforestation and poaching.
  url: https://globalrewilding.earth/sekakoh-collaboration-towards-a-wilder-cameroon/
  fetched: 2026-11-08
  quote: Trained teams and community monitors conduct regular patrols, boundary demarcation, and camera-trapping
    to deter deforestation and poaching.
- claim: The Global Rewilding Alliance says that in the Ebo landscape it installs forest-watch apps and
    equips ten community monitors to report threats in real time.
  url: https://globalrewilding.earth/sekakoh-collaboration-towards-a-wilder-cameroon/
  fetched: 2026-11-08
  quote: Sekakoh maps deforestation drivers (illegal logging and bushmeat hunting), installs local forest‑watch
    apps, and equips ten community monitors to report threats in real time.
