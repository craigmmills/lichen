- claim: The record gives the sampling periods and methods.
  url: https://api.gbif.org/v1/dataset/2225c924-6e4b-4aa2-83bc-1b98356f668d
  fetched: 2026-11-08
  quote: Sampling was conducted from April to December 2024 and from November 2025 to January
    2026. The collection methods used included Malaise traps, yellow pan traps, pitfall traps,
    and sweep nets.
