summary: Research institute launched in 2015 by Smith and IITA at IITA in Yaoundé, with a
  GIS and remote-sensing laboratory and a molecular genetics laboratory, partnered with UCLA.
facts:
- claim: A UCLA Institute of the Environment and Sustainability article dated 2015 says Smith
    and IITA launched the institute at IITA in Yaoundé.
  url: https://www.ioes.ucla.edu/news/ucla-partners-new-congo-basin-institute-game-changer-environmental-protection
  fetched: 2026-11-08
  quote: On June 20, Smith and the International Institute of Tropical Agriculture (IITA)
    launched the Congo Basin Institute .
- claim: The article says the launch added a GIS and remote-sensing laboratory and a molecular
    genetics laboratory to the IITA campus.
  url: https://www.ioes.ucla.edu/news/ucla-partners-new-congo-basin-institute-game-changer-environmental-protection
  fetched: 2026-11-08
  quote: the launch event marked the addition of a GIS (geographic information systems) and
    remote-sensing laboratory, and a molecular genetics laboratory
- claim: The 2015 article named biodiversity loss among the challenges the institute would
    address.
  url: https://www.ioes.ucla.edu/news/ucla-partners-new-congo-basin-institute-game-changer-environmental-protection
  fetched: 2026-11-08
  quote: The Congo Basin Institute at IITA will provide a one-of-a-kind center to address
    the challenges of food and water security, climate change, biodiversity loss
