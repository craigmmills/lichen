summary: Cameroon's forests and wildlife ministry, which builds the interactive forest atlas, partners
  with the African Wildlife Foundation on ecological monitoring training and equipment, and has regulatory
  authority in parks such as Faro.
facts:
- claim: Cameroon Tribune reports a MINFOF communiqué giving the area covered by Cameroon's protected
    areas.
  url: https://cameroon-tribune.cm/article.html/65059/fr.html/details_2
  fetched: 2026-11-08
  quote: En ce qui concerne les aires protégées , le communiqué du Minfof rappelle que ces surfaces couvrent
    une superficie de
- claim: The forest atlas map service says its data are produced by MINFOF and WRI.
  url: https://gis.forest-atlas.org/server/rest/services/cmr/conservation_forestier_fr/MapServer/layers
  fetched: 2026-11-08
  quote: Ce jeu de données est produit par le MINFOF et WRI
- claim: An African Wildlife Foundation article says AWF's ecological monitoring team worked alongside
    MINFOF to count hippos in Faro National Park in May and June 2026.
  url: https://www.awf.org/news/faro-national-park-records-its-highest-hippo-count-more-decade
  fetched: 2026-11-08
  quote: Between May 25 and June 3, 2026, AWF's ecological monitoring team, working alongside Cameroon's
    Ministry of Forestry and Wildlife (MINFOF), recorded 1,017 hippopotamuses across 26 viable pools in
    Faro National Park.
- claim: The same article describes MINFOF's regulatory authority and field presence in the park.
  url: https://www.awf.org/news/faro-national-park-records-its-highest-hippo-count-more-decade
  fetched: 2026-11-08
  quote: brought together MINFOF's regulatory authority and field presence with AWF's ecological monitoring
    capacity
- claim: An AWF article from 2018 says the Dja Conservation Service manages the Dja Faunal Reserve on
    behalf of the ministry.
  url: https://www.awf.org/blog/tackling-conservation-threats-cameroons-biodiversity
  fetched: 2026-11-08
  quote: the Dja Conservation Service, which manages the protected area on behalf of Cameroon ’s Ministry
    of Forest and Fauna
- claim: An AWF blog post says AWF has partnered with the ministry, providing training and equipment in
    ecological monitoring in Dja and in Faro, Bouba N'Djida and Campo Ma'an National Parks.
  url: https://www.awf.org/blog/cameroon%E2%80%99s-vanishing-great-apes
  fetched: 2026-11-08
  quote: In Cameroon, AWF has been partnering with the Ministry of Forests and Wildlife for quite a few
    years, providing training and equipment in ecological monitoring in Dja as well as in Faro, Bouba
    N’Djida and Campo Ma’an National Parks.
- claim: AWF's review of its 2025 work in Cameroon, which it says strengthened collaboration with MINFOF,
    says eco-guards in the Dja landscape were trained in ecological monitoring and equipped with drones
    and camera traps.
  url: https://www.awf.org/news/cameroons-living-landscapes-where-communities-and-nature-shape-future-together
  fetched: 2026-11-08
  quote: Eco-guards received training in judicial procedures and ecological monitoring and were equipped
    with drones and camera traps.
