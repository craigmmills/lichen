summary: Project aiming to use passive acoustic monitoring for continuous data on
  chimpanzee habitat use and human disturbance, with planned training for rangers,
  managers and wildlife school lecturers.
facts:
- claim: Aims to use passive acoustic monitoring to obtain continuous data on chimpanzee
    occupancy, habitat use and human disturbance, complementing camera trapping, direct
    observations and habitat assessments.
  url: https://www.rufford.org/projects/serge-alexis-kamgang/innovative-conservation-technologies-to-assess-habitat-use-and-threats-to-chimpanzees-in-ecotone-landscape-cameroon/
  fetched: 2026-11-12
  quote: the project introduces Passive Acoustic Monitoring (PAM) as an innovative,
    non-invasive method to obtain continuous data on chimpanzee occupancy, habitat
    use, and human-generated disturbances
- claim: Plans training for park rangers, conservation managers and Garoua Wildlife
    School lecturers in bioacoustics, remote sensing and wildlife monitoring tools.
  url: https://www.rufford.org/projects/serge-alexis-kamgang/innovative-conservation-technologies-to-assess-habitat-use-and-threats-to-chimpanzees-in-ecotone-landscape-cameroon/
  fetched: 2026-11-12
  quote: Training workshops will equip park rangers, conservation managers, and lecturers
    from the Garoua Wildlife School with practical skills in bioacoustics, remote
    sensing, and advanced wildlife monitoring tools.
- claim: Listed under 24 November 2025, with a progress report of May 2026.
