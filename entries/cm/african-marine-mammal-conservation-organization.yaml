summary: Cameroonian organisation whose authors compared three methods for detecting manatees in Lake
  Ossa in a 2023 paper, recommending passive acoustics, and which was implementation partner in a 2019
  to 2020 Salvinia control project.
facts:
- claim: Synchronicity Earth calls it African Marine Conservation Organization (AMCO) and says its strategies
    include applied research and monitoring in coastal, freshwater and littoral Cameroon; the paper names
    it African Marine Mammal Conservation Organization.
  url: https://synchronicityearth.org/?p=20694
  fetched: 2026-11-08
  quote: AMCO’s team have been implementing four strategies including applied research and monitoring,
    integrated management, awareness and capacity building
- claim: Synchronicity Earth says there was no manatee monitoring data in Cameroon before it began surveying
    manatee presence in Lake Ossa.
  url: https://synchronicityearth.org/?p=20694
  fetched: 2026-11-08
  quote: Before AMCO began surveying manatee presence in Lake Ossa, there was no monitoring data on manatees
    in Cameroon.
- claim: A 2023 paper with authors affiliated to the organisation compared visual scans, 360° sonar and
    passive acoustic monitoring for detecting manatees in Lake Ossa, and recommended passive acoustics.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2022.1032464
  fetched: 2026-11-08
  quote: We recommend using passive acoustics to enhance African manatee detections in future surveys.
- claim: The IUCN Save Our Species country brief names it as implementation partner of a 2019 to 2020
    project to control Salvinia molesta in Lake Ossa.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Cameroon-V5.pdf
  fetched: 2026-11-08
  quote: partner African Marine Mammal Conservation Organisation
- claim: An AWF article says the work of AMCO's site coordinator includes field monitoring.
  url: https://www.awf.org/news/fear-sea-cyndi-karel-ngnahs-journey-protect-cameroons-marine-ecosystems
  fetched: 2026-11-08
  quote: At AMCO, Cyndi’s work moves between community meetings, field monitoring, education, and the
    sea itself.
- claim: The site coordinator says she leads field monitoring of marine biodiversity.
  url: https://www.awf.org/news/fear-sea-cyndi-karel-ngnahs-journey-protect-cameroons-marine-ecosystems
  fetched: 2026-11-08
  quote: “As a certified Scuba Diver, I lead field monitoring of marine biodiversity and the species beneath,”
    she says.
