summary: National park established in 2005, where a 2023 report described eco-guards,
  local people and a WWF employee monitoring wildlife through constant presence and
  camera traps.
facts:
- claim: Global Voices reported in 2023 a biomonitoring team of six eco-guards, five
    local people and a WWF employee, using constant human presence and camera traps.
  url: https://globalvoices.org/2023/09/01/innovative-monitoring-system-deters-poachers-but-cameroons-boumba-bek-national-park-still-exposed-to-human-pressure/
  fetched: 2026-11-12
  quote: Biomonitoring is a system of constant human presence and the use of camera
    traps to monitor wildlife dynamics.
- claim: The Permanent Presence Biomonitoring System at the watchtower began in 2017
    and was extended in 2021 to 25 to 30 days a month.
  url: https://globalvoices.org/2023/09/01/innovative-monitoring-system-deters-poachers-but-cameroons-boumba-bek-national-park-still-exposed-to-human-pressure/
  fetched: 2026-11-12
  quote: An innovative system began in 2017 and was upgraded in 2021 from two weeks
    to 25–30 days a month
- claim: The park was established in 2005; its conservator in 2023 was Georges K.
    Azangue, an official of the Ministry of Forestry and Wildlife.
  url: https://globalvoices.org/2023/09/01/innovative-monitoring-system-deters-poachers-but-cameroons-boumba-bek-national-park-still-exposed-to-human-pressure/
  fetched: 2026-11-12
  quote: Georges K. Azangue, an official in the Ministry of Forestry and Wildlife
    and Boumba Bek Conservator
