facts:
- claim: A team from MINFOF and WCS placed GPS collars on seven lions in Bouba Ndjidda
    National Park in 2024, bringing the number collared to ten.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/23373/Cameroon%E2%80%99s-Bouba-Ndjidda-National-Park-Is-a-Beacon-of-Hope-for-the-Lion-in-Central-Africa-.aspx
  fetched: '2026-11-15'
  quote: has placed GPS collars on seven of the big cats in Cameroon’s Bouba Ndjidda
    National Park; this brings the number of collared lions to ten.
- claim: In August 2024, WCS reported receiving lion locations from the collars four
    times a day by satellite to help prioritise patrols.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/23373/Cameroon%E2%80%99s-Bouba-Ndjidda-National-Park-Is-a-Beacon-of-Hope-for-the-Lion-in-Central-Africa-.aspx
  fetched: '2026-11-15'
  quote: We receive lion locations four times a day, from the collars via satellite
    directly to our laptops
- claim: Three of the ten lions were collared earlier in 2024 by the NGO Biodiversity,
    Environment and Sustainable Development.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/23373/Cameroon%E2%80%99s-Bouba-Ndjidda-National-Park-Is-a-Beacon-of-Hope-for-the-Lion-in-Central-Africa-.aspx
  fetched: '2026-11-15'
  quote: including three collared earlier this year by an excellent local NGO, Biodiversity,
    Environment and Sustainable Development.
