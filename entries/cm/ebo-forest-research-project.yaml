summary: A research project in Ebo Forest, run by San Diego Zoo Wildlife Alliance and led
  by Ekwoge Abwe, which monitored mammals from research stations and, per a May 2020 article,
  installed 12 trail cameras in 2010.
facts:
- claim: In its first ten years the project monitored defined areas from forest research stations
    to study the diversity and abundance of mammal species.
  url: https://sandiegozoowildlifealliance.org/story-hub/zoonooz/revealing-treasures
  fetched: '2026-11-12'
  quote: This allowed us to observe monkey groups regularly, inventory the bird life, and
    monitor a series of defined areas to study the diversity and abundance of mammal species.
- claim: A May 2020 article says 12 trail cameras were installed in 2010 and were managed
    by project staff and the Gorilla Guardian Clubs; 20 newer cameras had been bought to try
    to identify individual gorillas.
  url: https://sandiegozoowildlifealliance.org/story-hub/zoonooz/revealing-treasures
  fetched: '2026-11-12'
  quote: The cameras are managed by our staff and the Gorilla Guardian Clubs, resulting in
    the local communities being fully on board with the forest monitoring.
- claim: In May 2020, the project reported collaborating since 2002 with the National Herbarium
    of Cameroon and Kew on the forest's rare plants.
  url: https://sandiegozoowildlifealliance.org/story-hub/zoonooz/revealing-treasures
  fetched: '2026-11-12'
  quote: Since 2002, we have been collaborating with the National Herbarium of Cameroon and
    Royal Botanic Gardens in Kew, England
