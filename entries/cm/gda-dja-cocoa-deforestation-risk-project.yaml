facts:
- claim: Global Forest Watch says GDA will focus on the Dja Biosphere Reserve to reduce deforestation
    linked to the cocoa supply chain.
  url: https://www.globalforestwatch.org/blog/users-in-action/2026-global-nature-watch-small-grants-fund-recipients/
  fetched: 2026-11-08
  quote: will focus on the Dja Biosphere Reserve, a UNESCO World Heritage Site recognized for its exceptional
    biodiversity, to reduce legal and illegal deforestation linked to the cocoa supply chain around the
    reserve.
- claim: GDA will train cocoa cooperative managers and forest rangers to geolocate cocoa plantations.
  url: https://www.globalforestwatch.org/blog/users-in-action/2026-global-nature-watch-small-grants-fund-recipients/
  fetched: 2026-11-08
  quote: They will train cocoa cooperative managers and forest rangers to geolocate cocoa plantations
    and identify producers that have high deforestation risk.
