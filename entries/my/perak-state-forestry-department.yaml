summary: State forestry department that worked with the Department of Fisheries on
  mangrove conservation in South Trong Forest Reserve, where 6,400 seedlings were
  reported planted in July 2023, and has completed a 2026-2035 forest management plan.
facts:
- claim: Collaborated with Malaysia's Department of Fisheries on a mangrove conservation
    programme in South Trong Forest Reserve, Taiping. In July 2023, Ipoh Echo reported
    that 6,400 mangrove seedlings had been planted.
  url: https://ipohecho.com.my/?p=53907
  fetched: '2026-11-17'
  quote: The program, named “Conservation of Mangrove Swamps as Fish Breeding Habitats
    in the South Trong Forest Reserve,” is organized by the Department of Fisheries
    Malaysia (DOF) in collaboration with the Perak State Forestry Department.
- claim: Has completed the Perak State Forest Management Plan 2026-2035 for the state's
    forests.
  url: https://www.ipohecho.com.my/?p=82555
