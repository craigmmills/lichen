summary: Johor state body founded in 1992 under a 1989 enactment to safeguard wildlife,
  plants and scenery in state national parks, including Endau-Rompin, Pulau Kukup
  and Tanjung Piai.
facts:
- claim: Founded on 1 January 1992 under Section 3 of the Johor National Park Enactment
    of 1989, to preserve and safeguard wildlife, plant life and scenic interests in
    the state's national parks.
  url: https://www.johornationalparks.gov.my
  fetched: '2026-11-17'
  quote: In accordance with Section 3 of the Johor National Park Enactment of 1989,
    the Johor National Park Corporation was founded on January 1, 1992.
- claim: The corporation's homepage traces its history to the 1933 proclamation of
    the 1,014-square-kilometre Endau-Rompin wildlife reserve and lists Endau-Rompin,
    Pulau Kukup and Tanjung Piai among its parks.
  url: https://www.johornationalparks.gov.my
  fetched: '2026-11-17'
  quote: It further began the chronological history of the establishment of the Johor
    National Park Corporation.
