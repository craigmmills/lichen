summary: Seventeen Penan communities proclaimed the Penan Peace Park, about 1,630
  square kilometres in Sarawak, in 2009, and a 2026 Mongabay report says a 2024 timber
  concession overlaps the Upper Baram park they hoped to co-manage.
facts:
- claim: 17 Penan communities proclaimed the Penan Peace Park as a rainforest reserve
    on their native lands in Sarawak in November 2009, and the Sarawak state government
    had licensed the area to a logging company.
  url: https://www.culturalsurvival.org/node/9574
  fetched: '2026-11-17'
  quote: a new rainforest reserve proclaimed by indigenous Penan communities on their
    native lands in the Malaysian state of Sarawak
- claim: A 2009 report described the proclaimed park as covering about 1,630 square
    kilometres around the Gunung Murud Kecil range, between Pulong Tau National Park
    and Indonesia's Kayan Mentarang National Park.
  url: https://news.mongabay.com/2009/11/rainforest-tribe-declares-peace-park-to-defend-lands-from-logging-in-sarawak
  fetched: '2026-11-17'
  quote: includes 1630 square kilometers (163,000 hectares) around the Gunung Murud
    Kecil mountain range
- claim: A 2026 Mongabay report says the Upper Baram conservation park that communities
    hoped to co-manage has been overlapped by a 170,000-hectare timber concession
    granted in 2024, and that the Sarawak forest department withdrew the larger Baram
    Peace Park project.
  url: https://news.mongabay.com/2026/09/logging-still-threatens-bornean-forest-once-envisioned-as-an-indigenous-led-peace-park/
  fetched: '2026-11-17'
  quote: The Sarawak forest department eventually decided to withdraw the larger Baram
    Peace Park project
