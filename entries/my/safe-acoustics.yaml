summary: Acoustic monitoring project at the SAFE site, built by Imperial College London, Universiti
  Malaysia Sabah, the South East Asia Rainforest Research Partnership and Sarab Sethi, with
  nearly 15 devices deployed since 2018, reported in 2021.
facts:
- claim: In 2021, Options, The Edge reported that nearly 15 devices had been deployed across
    the SAFE site since 2018.
  url: https://www.optionstheedge.com/node/2401
  fetched: 2026-11-03
  quote: nearly 15 devices have been deployed across the site since 2018
- claim: A related Zenodo dataset pairs bird and herpetofauna point counts with audio recordings
    from the SAFE landscape.
  url: https://zenodo.org/record/3265711
  fetched: 2026-11-03
  quote: Associated with each point count is an audio recording file, so (theoretically) this
    could be used as a training dataset for automated bioacoustic studies.
