summary: Registered Malaysian entity representing the Wildlife Conservation Society, working
  mainly in southern Peninsular Malaysia and Sarawak since 2007 in Endau-Rompin, supporting
  patrols and biological monitoring and named among collaborators in the 2016–2018 National
  Tiger Survey.
facts:
- claim: A vacancy on its site covers managing patrol and threat data in SMART and camera
    trap databases.
  url: https://malaysia.wcs.org/Vacancies/Senior-Counter-Wildlife-Trafficking-Officer.aspx
  fetched: 2026-11-03
  quote: Manage all Endau-Rompin Landscape’s patrol and threat data using the Spatial Monitoring
    and Reporting Tool (SMART) database, camera trap database, and other relevant databases
- claim: Registered as an independent legal entity and the Malaysian representative of the
    Wildlife Conservation Society.
  url: https://programs.wcs.org/malaysia/About-Us.aspx
  quote: WCS Malaysia (Wildlife Conservation And Science (Malaysia) Bhd) was registered as
    an independent legal entity and is the Malaysian Representative of the New York based
    Wildlife Conservation Society.
  fetched: 2026-11-03
- claim: Operates mainly in southern Peninsular Malaysia and Sarawak.
  url: https://programs.wcs.org/malaysia/About-Us.aspx
  quote: WCS Malaysia operates primarily in two locations in Malaysia; Southern Peninsular
    Malaysia (Johor and Pahang) and the state of Sarawak.
  fetched: 2026-11-03
- claim: Its main activities include helping the Malaysian government conduct biological monitoring
    of tigers, elephants, orangutans, sharks, rays and coral reefs.
  url: https://programs.wcs.org/malaysia/About-Us.aspx
  quote: main activities revolve around helping the Malaysian government on conducting biological
    monitoring and supporting protection efforts of tigers, elephants, orangutans as well
    as sharks, rays and coral reefs
  fetched: 2026-11-03
- claim: Began work in the Endau-Rompin Landscape in 2007.
  url: https://malaysia.wcs.org/Wildlife/Tiger.aspx
  fetched: 2026-11-03
  quote: WCS commenced work in the Endau-Rompin Landscape in 2007 in the state of Johor under
    the Johor Wildlife Conservation Project
- claim: Supports patrols through training and logistics.
  url: https://malaysia.wcs.org/Wildlife/Tiger.aspx
  fetched: 2026-11-03
  quote: WCS supports these patrols by providing training as well as logistic and technical
    support for the patrols.
- claim: The national tiger survey page names WCS Malaysia among collaborators in the first
    National Tiger Survey, with survey work in 2016–2018.
  url: https://harimau.gov.my/malayantiger/
  fetched: 2026-11-03
  quote: PERHILITAN, World Wide Fund (WWF) Malaysia, the Wildlife Conservation Society (WCS)
    Malaysia and Pertubuhan Pelindung Alam Malaysia.
