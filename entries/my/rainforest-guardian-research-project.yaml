summary: Project launched in November 2021 over a 30 square kilometre protected area, using solar-powered
  Guardian devices with Huawei's cloud and AI to detect chainsaws and vehicles; five were deployed in
  Sarawak by then.
facts:
- claim: Launched in November 2021 over a protected area of 30 square kilometres.
  url: https://www.huawei.com/en/tech4all/stories/nature-guardian-malaysia
  fetched: 2026-11-03
  quote: Launched in November 2021, the project covers a protected area of 30km 2 .
- claim: Uses solar-powered Guardian devices with Huawei's cloud and AI to detect chainsaws and vehicles
    in real time.
  url: https://www.huawei.com/en/tech4all/stories/nature-guardian-malaysia
  fetched: 2026-11-03
  quote: It uses RFCx's solar-powered Guardian devices in conjunction with Huawei's cloud and AI technologies
    to detect the sounds of illegal logging, including chainsaws and vehicles, in real time.
- claim: Solar-powered devices collect sound data that is sent to the cloud and analysed by AI.
  url: https://www.huawei.com/my/news/2021/leveraging-the-power-of-technology-to-protect-sarawak-flora-and-fauna
  fetched: 2026-11-03
  quote: The project involves the use of solar-powered devices equipped with microphones and antennas
    that collect sound data which then transmit the data through wireless networks to the cloud, where
    it is analyzed by Artificial Intelligence (AI)-powered analytics.
- claim: Five Guardians had been deployed in Sarawak by November 2021.
  url: https://www.huawei.com/my/news/2021/leveraging-the-power-of-technology-to-protect-sarawak-flora-and-fauna
  fetched: 2026-11-03
  quote: To date, five Guardians have been deployed in Sarawak’s rainforests.
- claim: A Malaysian research institute article reports 874,256 recordings across five sites in Similajau.
  url: https://www.seri.my/post/ai-solutions-for-malaysian-forest-conservation
  fetched: 2026-11-03
  quote: Across five sites in Similajau National Park and Similajau Forest Reserve, a total of 874,256
    recordings were obtained using RFCx's system
