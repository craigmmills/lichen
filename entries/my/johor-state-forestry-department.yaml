facts:
- claim: Partner with TH Plantations and the Global Environment Centre in a project
    to restore and protect 4,300 hectares in the northeast of Gunung Arong Forest
    Reserve. The reserve includes about 1,500 hectares of peat swamp forest or peatland.
  url: https://gec.org.my/reference-project/recovery-project-in-gunung-arong-forest-reserve-johor/
  fetched: '2026-11-17'
  quote: TH Plantations Berhad (THP) and GEC in collaboration with Johor State Forestry
    Department form a partnership to restore and protect 4,300 ha in the northeast
    portion of Gunung Arong Forest Reserve (GAFR).
- claim: In October 2025, Johor's health and environment committee chairman said over
    RM3 million had been allocated to the department to protect the state's natural
    reserves.
