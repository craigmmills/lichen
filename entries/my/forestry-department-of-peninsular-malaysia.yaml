summary: A forestry department that uses the FMRS satellite system to detect forest reserve
  changes, with an official reporting about 250 encroachment cases detected in 2024, and builds
  e-PESISIR.
facts:
- claim: Uses the Forest Monitoring using Remote Sensing system to detect changes in permanent
    forest reserves in the peninsula, a minister said in 2024.
  url: https://www.malaymail.com/news/malaysia/2024/03/03/nik-nazmi-digital-innovation-usage-to-be-further-enhanced-for-wildlife-conservation/121141
  fetched: 2026-11-03
  quote: has utilised technology such as the Forest Monitoring using Remote Sensing (FMRS)
    system to detect any changes that occur in permanent forest reserves in the peninsula
- claim: The minister said in April 2026 that AI use strengthened its collaboration with the
    Malaysian Space Agency on satellite forest monitoring.
  url: https://www.thestar.com.my/news/nation/2026/04/03/facing-forestry-challenges-with-technology
  fetched: 2026-11-03
  quote: the use of AI also strengthened the collaboration between the Peninsular Malaysia
    Forestry Department (JPSM) and the Malaysian Space Agency (MYSA)
- claim: Planters International says the department convened the AFAM Implementation Follow-Up
    Meeting held on 31 January 2024.
  url: https://www.planters.life/news/digital-forest-jpsm-planters-afam-system-implementation
  quote: convened by the Forestry Department of Peninsular Malaysia (JPSM)
  fetched: 2026-11-03
- claim: A statement recorded in parliament in November 2025 says its teams monitor forest
    cover through daily satellite images.
  url: https://parlimen.gov.my/files/hindex/pdf/DR-12112025.pdf
  fetched: 2026-11-03
  quote: Dengan kekerapan cerapan imej satelit harian, pasukan JPSM sentiasa memantau kawasan
    liputan hutan
- claim: The same statement says it was upgrading the e-Geospatial Perhutanan system to add
    AI features and high-frequency satellite images.
  url: https://parlimen.gov.my/files/hindex/pdf/DR-12112025.pdf
  fetched: 2026-11-03
  quote: JPSM juga sedang melaksanakan menaik taraf sistem e -Geospatial Perhutanan termasuk
    menambah ciri -ciri kecerdasan buatan (AI)
