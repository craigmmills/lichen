  quote: which is protecting and restoring 83,381 ha of tropical rainforest in the Tongod and Kinabatangan
    district
  fetched: 2026-11-03
- claim: Biodiversity monitoring is described as a key component of its conservation priority.
  url: https://www.searrp.org/2023/02/06/kuamut-rainforest-conservation-project-biodiversity-data-management-and-analysis-workshop/
  quote: among its top priorities is biodiversity conservation, of which biodiversity monitoring is a
    key component
  fetched: 2026-11-03
- claim: Protects and restores 83,381 hectares of tropical forest in Sabah.
