summary: Group of Orang Asli from two villages that The Star reported in 2020 as patrolling
  for open burning and early forest fire signs, within a Gamuda Parks programme that
  had reforested 14 hectares of peat.
facts:
- claim: In 2020, The Star described Orang Asli from Kampung Bukit Cheeding and Kampung
    Pulau Kempas as having formed the group to patrol for open burning and detect
    early signs of forest fires.
  url: https://www.thestar.com.my/news/nation/2020/03/10/community-enrichment-for-the-temuan-people
  fetched: '2026-11-17'
  quote: Sahabat Kuala Langat Utara, a community of orang asli who patrols the area
    for open burning, was formed among orang asli from two villages namely Kampung
    Bukit Cheeding and Kampung Pulau Kempas.
- claim: By March 2020, the Gamuda Parks programme that included the group had reforested
    14 hectares of degraded peat in Kuala Langat Forest Reserve and established an
    indigenous nursery at Pulau Kempas.
  url: https://www.thestar.com.my/news/nation/2020/03/10/community-enrichment-for-the-temuan-people
  fetched: '2026-11-17'
  quote: the program under Gamuda Parks has reforested 14 hectares of degraded peat
    areas in Kuala Langat Forest Reserve.
