summary: Community-led cooperative in Lower Kinabatangan that manages ecolodges and
  supports forest restoration, with sources dating its founding to 1995 (Pulitzer
  Center) or 2003 (UN Tourism).
facts:
- claim: A community-led cooperative that works to protect and restore Lower Kinabatangan
    ecosystems, according to its tour partner's page.
  url: https://stickyricetravel.com/kopel
  fetched: '2026-11-17'
  quote: KOPEL is a community-led cooperative working to protect and restore the ecosystems
    of the Lower Kinabatangan
- claim: The cooperative manages community-run ecolodges and supports forest restoration
    on the ground.
  url: https://stickyricetravel.com/kopel
  fetched: '2026-11-17'
  quote: the cooperative manages community-run ecolodges, delivers environmental education
    programmes, supports forest restoration
- claim: UN Tourism dates the formation of KOPEL by the Batu Puteh village tourism
    associations to 2003. The associations grew out of a local effort to conserve
    traditional culture and help protect the remaining forest.
  url: https://tourism-villages.unwto.org/en/villages/kampung-batu-puteh/
  fetched: '2026-11-17'
  quote: the village tourism associations joined forces to establish the Community
    Cooperative (co-op) KOPEL Bhd in 2003.
- claim: A page from Forests for People mentions oxbow lake restoration projects that
    KOPEL was able to obtain from government agencies.
  url: https://digital.tudor-rose.co.uk/forests-for-people/files/assets/basic-html/page-207.html
  fetched: '2026-11-17'
  quote: ox-bow lake restoration projects that KOPEL has been
- claim: The Pulitzer Center reported in 2021 that local reforestation teams had planted
    and nurtured roughly 350 hectares around Batu Puteh since 1999, including plots
    to connect protected forests and fill gaps caused by fires or logging. It dates
    KOPEL's founding to 1995, while UN Tourism gives 2003.
  url: https://pulitzercenter.org/node/23969
  fetched: '2026-11-17'
  quote: local reforestation teams have planted and nurtured roughly 350 hectares
    of forest in the Batu Puteh region
