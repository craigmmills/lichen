facts:
- claim: Listed by Sabah's Environment Protection Department among other government
    departments and agencies with sectoral environmental responsibilities, under the
    Parks Enactment 1984, to preserve areas of outstanding natural value.
  url: https://epd.sabah.gov.my/v3/explore/environmental-management-in-sabah/
  fetched: '2026-11-12'
  quote: To preserve areas in Sabah that contain outstanding natural values as a heritage
    for the benefit of the people, now and in the future.
- claim: Reef Check Malaysia says the Tun Mustapha Park Reef Check survey of October
    2025 was jointly organised and conducted by Reef Check Malaysia, WWF-Malaysia
    and Sabah Parks.
  url: https://reefcheck.org.my/kota-kinabalu-mantanani-island-october-december-2025/
  fetched: '2026-11-12'
  quote: jointly organised and conducted by RCM, WWF-Malaysia, and Sabah Parks
- claim: Reef Check Malaysia says it completed surveys of Tunku Abdul Rahman Park
    with Sabah Parks in November 2025, finding that live coral cover had not recovered
    from the 2024 mass bleaching.
  url: https://reefcheck.org.my/kota-kinabalu-mantanani-island-october-december-2025/
  fetched: '2026-11-12'
  quote: 'November: Completion of Tunku Abdul Rahman Park surveys by RCM and Sabah
