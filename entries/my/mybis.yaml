summary: A Malaysian biodiversity repository database, run by the Malaysia Biodiversity Centre, that aims
  to be a one-stop source and the national node of the CBD information exchange network, with information
  abstracted from books, journals, checklists and specimen databases.
facts:
- claim: Aims to be a one-stop repository database giving access to information on biodiversity studies
    and management in Malaysia.
  url: https://www.mybis.gov.my/art/15
  fetched: 2026-11-03
  quote: To be a one-stop repository database system, which provides and facilitates access to information
    on biodiversity studies and management in Malaysia.
- claim: Acts as a national node of the CBD information exchange network.
  url: https://www.mybis.gov.my/art/15
  fetched: 2026-11-03
  quote: with the CBD website (www.cbd.int) as its central node, and MyBIS as national nodes of the network
- claim: Intended as a single repository for biodiversity information in Malaysia.
  url: https://www.mybis.gov.my/one/mybis/index.php
  quote: MyBIS to be a one-stop repository for biodiversity information in Malaysia.
  fetched: 2026-11-03
- claim: Provides a Malaysian national node in the Convention on Biological Diversity information exchange
    network.
  url: https://www.mybis.gov.my/one/mybis/index.php
  quote: MyBIS provides the information exchange platform of the Convention on Biological Diversity.
  fetched: 2026-11-03
- claim: Aims to be a one-stop repository for biodiversity information in Malaysia and serves as the national
    node of the CBD clearing-house network.
  url: https://www.mybis.gov.my/one/mybis/index-v6.php
  fetched: 2026-11-03
  quote: MyBIS to be a one-stop repository for biodiversity information in Malaysia.
- claim: Its information is abstracted from books, journals, expert checklists and specimen databases.
  url: https://www.mybis.gov.my/one/mybis/index-v6.php
  fetched: 2026-11-03
  quote: Biodiversity information deposited in this website are abstracted from published books, journals,
    expert checklists and specimen databases.
- claim: The site footer names the Malaysia Biodiversity Centre.
  url: https://www.mybis.gov.my/one/mybis/index-v6.php
  fetched: 2026-11-03
  quote: Malaysia Biodiversity Information System (MyBIS) by Malaysia Biodiversity Centre (MBC)
