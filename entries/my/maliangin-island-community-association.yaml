summary: Island community association which, in a report reposted in 2016, was reviving
  pandanus weaving to reduce fishing pressure, on an island that was a pilot site
  for the proposed Tun Mustapha Park.
facts:
- claim: A report reposted in 2016 said the island community was trying to protect
    its traditional fishing grounds and the association was reviving pandanus weaving
    as an alternative livelihood to reduce pressure on fisheries.
  url: https://mamengstories.blogspot.com/2016/10/star2-in-these-islands-villagers-dive.html
  fetched: '2026-11-17'
  quote: the small community there has not only been trying to protect its traditional
    fishing grounds. The Maliangin Island Community Association (Mica) has also been
    renewing the island’s traditional craft
- claim: Maliangin island was one of two pilot sites set up to show the benefits of
    protecting marine areas in the proposed Tun Mustapha Park.
  url: https://mamengstories.blogspot.com/2016/10/star2-in-these-islands-villagers-dive.html
  fetched: '2026-11-17'
  quote: Two pilot sites – on the island of Maliangin and the village of Berungus
    – were set up to show the benefits of protecting marine areas.
