summary: Non-profit research group that ceased operations at the end of 2022, which used camera
  traps and launched a K9 tracking pilot in 2017, according to Panthera.
facts:
- claim: A Universiti Malaysia Terengganu page calls Rimba a non-profit research group and
    says its researchers were deploying 200 camera traps for a study running until September
    2014.
  url: https://ibtpl.umt.edu.my/harimau-selamanya/
  fetched: 2026-11-03
  quote: his non-profit research group known as Rimba
- claim: Ceased operations at the end of 2022.
  url: https://rimba.ngo/
  quote: Due to financial limitations we have ceased operations as of end-2022
  fetched: 2026-11-03
- claim: Its biologists used camera traps to estimate black panther numbers, as Panthera reports.
  url: https://panthera.org/blog-post/tracking-black-panthers-malaysia
  quote: Rimba biologists rigged the cameras to detect individual panthers’ spots
  fetched: 2026-11-03
- claim: Panthera says Rimba launched a K9 tracking pilot in 2017.
  url: https://panthera.org/blog-post/meet-phiri-conservation-dog-protecting-wild-cats-malaysia-0
  quote: a groundbreaking initiative launched in 2017 by Rimba, the predecessor of the project
    to Panthera Malaysia
  fetched: 2026-11-03
- claim: Its Project Pteropus ran from 2011 to 2022 and focused on the conservation ecology
    of flying foxes and other Old World fruit bats.
  url: https://rimba.ngo/project-pteropus/
  fetched: 2026-11-03
  quote: Project Pteropus is Malaysia’s only project focused on the conservation ecology of
    flying foxes
- claim: The Project Pteropus page invites the public to contribute flying fox sightings.
  url: https://rimba.ngo/project-pteropus/
  fetched: 2026-11-03
  quote: You can really help us by being a citizen scientist, because every sighting counts!
