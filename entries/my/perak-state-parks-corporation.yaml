summary: State parks body whose rangers record patrols with SMART Mobile, funded by
  Yayasan Sime Darby, which says it has invested over RM6 million in Royal Belum since
  2017.
facts:
- claim: Royal Belum State Park already used SMART, and PSPC rangers now record patrol
    data with SMART Mobile.
  url: https://www.yayasansimedarby.com/ysd-and-perak-state-parks-corporation-strengthen-royal-belum-conservation-through-technology-and
  fetched: 2026-11-09
  quote: building on the park’s existing use of the Spatial Monitoring and Reporting
    Tool (SMART)
- claim: SMART Mobile lets rangers record patrol routes, wildlife signs and signs
    of illegal activity.
  url: https://www.yayasansimedarby.com/ysd-and-perak-state-parks-corporation-strengthen-royal-belum-conservation-through-technology-and
  fetched: 2026-11-09
  quote: enabling rangers to systematically record observations and patrol data, including
    patrol routes, wildlife signs and indicators of illegal activities
- claim: Yayasan Sime Darby and PSPC announced a fourth collaboration phase introducing
    real-time surveillance camera traps to improve monitoring and enforcement.
  url: https://yayasansimedarby.com/ysd-advances-pspcs-conservation-efforts-high-tech-offensive-against-poaching-royal-belum
  fetched: 2026-11-09
  quote: The introduction of real-time surveillance camera traps is to boost PSPC’s
    ability in monitoring and taking enforcement actions against illegal activities
- claim: Yayasan Sime Darby says it has invested more than RM6 million in PSPC's work
    in Royal Belum since 2017.
  url: https://www.yayasansimedarby.com/ysd-and-perak-state-parks-corporation-strengthen-royal-belum-conservation-through-technology-and
  fetched: 2026-11-09
  quote: Since 2017, YSD has invested more than RM6 million to support PSPC’s long-term
    conservation efforts in RBSP
- claim: Kosmo reports that the corporation's enforcement unit holds 12 SMART Mobile
    devices and that SMART was introduced in 2018.
  url: https://www.kosmo.com.my/2026/09/08/teknologi-mudahkan-renjer-rekod-jejak-haiwan/
  fetched: 2026-11-09
  quote: sebanyak 12 unit peranti SMART Mobile kini dimiliki Unit Penguatkuasaan Taman
    Negeri Perak
