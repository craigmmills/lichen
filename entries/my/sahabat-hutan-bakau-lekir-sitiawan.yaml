    help from the Global Environment Centre, to rehabilitate and conserve nearby mangrove
    areas.
  url: https://gec.org.my/?p=4025
  fetched: '2026-11-17'
  quote: Abdullah Ayob and the villagers of Kampung Sungai Tiram have established
    Pertubuhan Sahabat Hutan Bakau Lekir Sitiawan or Friends of the Mangrove Forest
    in October 2014.
- claim: Was listed alongside the Perak State Forestry Department as a partner in
    the completed 2019–2023 Sungai Limau, Lekir mangrove rehabilitation project.
