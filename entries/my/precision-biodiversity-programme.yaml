summary: A closed five-year pilot run by the Academy of Sciences Malaysia, funded with RM7 million from
  1 January 2022 in Pasoh Forest Reserve, that used AI and IoT to capture data and planned AI species
  identification from 2023.
facts:
- claim: A pilot described as five years long, with RM7 million in development funding, starting on 1
    January 2022 in Pasoh Forest Reserve; the pages say it ended in 2025.
  url: https://www.akademisains.gov.my/ar22/precision-biodiversity-digitalisation-iot-programme/
  fetched: 2026-11-03
  quote: granted a development fund of RM7 million under the 12 th Malaysia Plan Rolling Plan (12 th MP),
    commencing on 1 January 2022 in the Pasoh Forest Reserve, Negeri Sembilan.
- claim: Planned to develop an AI-based species identification function from 2023.
  url: https://www.akademisains.gov.my/ar22/precision-biodiversity-digitalisation-iot-programme/
  fetched: 2026-11-03
  quote: In 2023, the team will start data integration exercise with existing databases, data curation,
    and developing AI-based species identification function.
- claim: MyBIS reported in November 2025 that the pilot used automatic systems for monitoring and trend
    analysis of flora and fauna data.
  url: https://www.mybis.gov.my/art/951
  fetched: 2026-11-03
  quote: Program ini memperkenalkan pendekatan baharu dalam pengumpulan data menggunakan sistem automatik
- claim: The 2022 annual report describes a five-year pilot granted RM7 million under the 12th Malaysia
    Plan Rolling Plan, commencing on 1 January 2022 in Pasoh Forest Reserve; it also says the programme
    ends in 2025.
