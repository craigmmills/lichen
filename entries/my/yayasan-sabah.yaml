summary: Statutory body established in 1966 that manages Danum Valley Conservation
  Area day to day, and says it manages Maliau Basin, working with research partners
  on biodiversity surveys and citizen science.
facts:
- claim: A statutory body established in 1966.
  url: https://danumvalley.my/management/
  fetched: 2026-11-09
  quote: Yayasan Sabah (YS), a statutory body established in 1966
- claim: Manages Danum Valley Conservation Area day to day, under the direction of
    a management committee.
  url: https://danumvalley.my/management/
  fetched: 2026-11-09
  quote: The Management Committee provide direction and technical oversight to Yayasan
    Sabah's day-to-day management of each conservation area
- claim: Through its Conservation and Environmental Management Division, works with
    research partners on biodiversity surveys, citizen science and ecological studies.
  url: https://maliaubasin.org/research/
  fetched: 2026-11-09
  quote: Together, we conduct biodiversity surveys, citizen science programs, ecological
    studies, and policy-driven research
- claim: Says it manages Maliau Basin with conservation tools and monitoring systems.
  url: https://maliaubasin.org/research/
  fetched: 2026-11-09
  quote: Innovation extends to how we manage the area – through smart conservation
    tools, monitoring systems, and sustainable infrastructure
- claim: The division is based at the Yayasan Sabah Complex in Kota Kinabalu.
  url: https://danumvalley.my/management/
  fetched: 2026-11-09
  quote: Conservation and Environmental Management Division, Yayasan Sabah Complex,
    12th Floor, Tun Mustapha Tower, 88817 Kota Kinabalu, Sabah
