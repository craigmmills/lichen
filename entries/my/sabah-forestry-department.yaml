summary: Sandakan-based state department that builds iForSabah and partners with the Malaysian
  Space Agency, reporting about 48.6% of Sabah as gazetted forest reserve (2021) and mapping
  forest cover every two years since 2010, per a ministry statement.
facts:
- claim: Registered as a GBIF publisher, with one published dataset in the API record.
  url: https://api.gbif.org/v1/organization?country=MY&limit=100
  fetched: 2026-11-03
  quote: Sabah Forestry Department
- claim: A minister said it developed iForSabah with the Malaysian Space Agency, to detect
    changes in Sabah's forest reserves.
  url: https://www.malaymail.com/news/malaysia/2024/03/03/nik-nazmi-digital-innovation-usage-to-be-further-enhanced-for-wildlife-conservation/121141
  fetched: 2026-11-03
  quote: the Sabah Forestry Department, in collaboration with the Malaysian Space Agency (MYSA),
    has developed the iForSabah system
- claim: Its forest-reserve summary, which discusses 2021, reports 3,574,468 hectares of gazetted
    forest reserve, about 48.6% of Sabah.
  url: https://forest.sabah.gov.my/
  quote: The extent of gazetted Forest Reserve is maintained at 3,574,468 hectares which constitutes
    about 48.6% of Sabah’s total landmass.
  fetched: 2026-11-03
- claim: Based on Labuk Road.
  url: https://forest.sabah.gov.my/
  quote: SABAH FORESTRY DEPARTMENT, MILE 6, LABUK ROAD,
  fetched: 2026-11-03
- claim: Its forest-reserve summary, referring to 2021, reports 333 gazetted reserves covering
    about 48.6% of Sabah.
  url: https://forest.sabah.gov.my/
  fetched: 2026-11-03
  quote: There are a total of 333 gazetted forest reserves in Sabah that are classified under
    seven (7) functional classes.
- claim: Its address is in Sandakan.
  url: https://forest.sabah.gov.my/
  fetched: 2026-11-03
  quote: 90000 SANDAKAN SABAH
- claim: Registered as a publisher with GBIF, through its Forest Research Centre.
  url: https://api.gbif.org/v1/organization?country=MY&limit=100
  fetched: 2026-11-03
  quote: The Forest Research Centre (FRC) is the Research and Development (R&D) division of
    the Sabah Forestry Department (SFD).
- claim: A department page lists camera traps among four wildlife monitoring methods in the
    Ulu Kalumpang-Wullersdorf project area for 2016–2019.
  url: https://forest.sabah.gov.my/ulukalumpang/Monitoring.html
  fetched: '2026-11-03'
  quote: 'There are four (04) methods used for wildlife monitoring in Ulu Kalumpang-Wullersdorf
    Sustainable Forest Management (UKW SFM) Project area:'
- claim: In May 2023, Malay Mail quoted a science ministry statement that space technology
    had helped the department map and update forest cover every two years since 2010.
  url: https://www.malaymail.com/news/malaysia/2023/05/26/science-ministry-mysa-sabah-forestry-dept-ink-mou-to-use-space-tech-to-manage-forest-resources/71107
  fetched: '2026-11-03'
  quote: mapping and updating forest cover accurately and regularly every two years since
    2010
