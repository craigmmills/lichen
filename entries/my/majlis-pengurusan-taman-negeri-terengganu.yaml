summary: Terengganu state parks body that says it monitors protected areas in real
  time with drones, 20 camera traps, CCTV, GIS and SMART, and partners with research
  and conservation groups.
facts:
- claim: Says it uses drones, 20 camera traps, CCTV, GIS and the SMART application
    to monitor protected areas in real time.
  url: https://www.trdi.my/index.php/mptn-perkukuh-usaha-pemuliharaan-biodiversiti
  fetched: 2026-11-09
  quote: MPTN memanfaatkan teknologi moden seperti dron, 20 unit kamera perangkap,
    kamera litar tertutup (CCTV), Sistem Maklumat Geografi (GIS) dan aplikasi SMART
    bagi memperkukuh pemantauan kawasan perlindungan secara masa nyata
- claim: The Kenyir Rangers, 80 rangers from 16 agencies, use SMART with technical
    support from Panthera Malaysia and Nature Based Solutions Sdn. Bhd.
  url: https://www.trdi.my/index.php/mptn-perkukuh-usaha-pemuliharaan-biodiversiti
  fetched: 2026-11-09
  quote: turut menggunakan aplikasi SMART (Spatial Monitoring and Reporting Tool)
    dengan sokongan teknikal Panthera Malaysia dan Nature Based Solutions Sdn. Bhd.
- claim: Its research collaborations cover wildlife studies, bioacoustic technology
    and coral reef health monitoring at Pulau Bidong and Pulau Rhu.
  url: https://www.trdi.my/index.php/mptn-perkukuh-usaha-pemuliharaan-biodiversiti
  fetched: 2026-11-09
  quote: Kerjasama itu meliputi kajian hidupan liar, penggunaan teknologi bioakustik
    serta pemantauan kesihatan terumbu karang di Pulau Bidong dan Pulau Rhu
