summary: The Suluk community established and governs a locally managed marine area
  in the Kinabatangan River estuary, where fishers have recorded catches using Open
  Data Kit.
facts:
- claim: The Suluk people of Mumiang established and govern a locally managed marine
    area in the Kinabatangan River estuary.
  url: https://www.iccaconsortium.org/?p=33888
  fetched: '2026-11-17'
  quote: establishing and governing a locally managed marine area in the Kinabatangan
    River estuary
- claim: Its coastal territory of life is about 300 km2 of mangrove-rich estuary,
    inside what is now Malaysia's largest wetland of international importance.
  url: https://www.iccaconsortium.org/?p=33888
  fetched: '2026-11-17'
  quote: The Mumiang’s coastal territory of life comprises 300 km² of mangrove-rich
    estuary inherited from their ancestors.
- claim: A fisheries governance protocol was launched in late 2021 through a ritual
    led by the village Imam.
  url: https://www.iccaconsortium.org/?p=33888
  fetched: '2026-11-17'
  quote: This process led to the development of a fisheries governance protocol, launched
    in late 2021
- claim: Fishers have used Open Data Kit on mobile devices to record catches. The
    data was intended to inform management of the marine area once the sites reopened.
  url: https://www.iccaconsortium.org/?p=33888
  fetched: '2026-11-17'
  quote: Once the sites reopen, the collected data will be used for the ongoing management
    of the LMMA.
