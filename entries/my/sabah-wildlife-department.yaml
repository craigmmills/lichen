summary: Kota Kinabalu-based department running Danau Girang Field Centre, which The Star
  reported in November 2024 launched a wildlife crime plan titled ten-year, with dates 2024
  to 2035.
facts:
- claim: In November 2024, The Star reported the launch by the department of a plan titled
    “10-Year Action Plan to Combat Sabah Wildlife Crime”, giving its dates as 2024 to 2035.
  url: https://www.thestar.com.my/news/nation/2024/11/02/sabah-govt-develops-10-year-plan-to-fight-wildlife-crimes
  fetched: 2026-11-03
  quote: The 10-Year Action Plan to Combat Sabah Wildlife Crime from 2024 to 2035 was launched
    by the Sabah Wildlife Department
- claim: The plan is meant to guide the department in protecting the state's wildlife resources.
  url: https://www.thestar.com.my/news/nation/2024/11/02/sabah-govt-develops-10-year-plan-to-fight-wildlife-crimes
  fetched: 2026-11-03
  quote: the key objective of the plan is to guide the Sabah Wildlife Department in protecting
    wildlife resources in the state
- claim: Based at Wisma MUIS, Kota Kinabalu.
  url: https://wildlife.sabah.gov.my/
  quote: 88100 Kota Kinabalu, Sabah, Malaysia
  fetched: 2026-11-03
- claim: The Danau Girang Field Centre says it is managed by the department and Cardiff University.
  url: https://prev.danaugirang.com.my/dgfc/
  fetched: 2026-11-03
  quote: Danau Girang Field Centre is a collaborative research and training facility managed
    by the Sabah Wildlife Department and Cardiff University.
- claim: Hutan says it operates under a memorandum of understanding with the department.
  url: https://hutan.earth/about-hutan
  fetched: 2026-11-03
  quote: Operating under a Memorandum of Understanding with the Sabah Wildlife Department
- claim: On 4 April 2019, Orangutan Appeal UK reported that the department announced an eighteen-month
    population survey of orangutans and elephants.
  url: https://orangutan-appeal.org.uk/news/sabah-announces-new-wildlife-survey
  fetched: '2026-11-03'
  quote: Sabah Wildlife Department announce launch of population survey on Sabah's orangutans
    and elephants.
