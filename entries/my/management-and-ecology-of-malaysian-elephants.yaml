summary: University of Nottingham Malaysia programme, established in 2011 with PERHILITAN,
  first sponsored by Yayasan Sime Darby with RM3.36 million from January 2012, now developing
  an elephant early warning prototype using bioacoustics and cameras.
facts:
- claim: Yayasan Sime Darby first sponsored the project in January 2012, with RM3.36 million
    until December 2016.
  url: https://www.nottingham.edu.my/NewsEvents/News/2017/Yayasan-Sime-Darby-extends-sponsorship-for-the-Management-and-Ecology-of-Malaysian-Elephants.aspx
  fetched: 2026-11-03
  quote: YSD first sponsored the MEME project in January 2012, committing RM3.36 million until
    December 2016.
- claim: A collaboration between the University of Nottingham Malaysia and PERHILITAN.
  url: https://www.meme-elephants.org/who-we-are
  quote: MEME is a collaboration between University of Nottingham Malaysia and Department
    of Wildlife and National Parks of Peninsular Malaysia (PERHILITAN).
  fetched: 2026-11-03
- claim: Aims to use science to develop an evidence-based approach to elephant conservation
    in Peninsular Malaysia.
  url: https://www.meme-elephants.org/who-we-are
  quote: MEME’s general aim is to use science to develop an evidence-based approach to the
    conservation of Asian elephants in Peninsular Malaysia.
  fetched: 2026-11-03
- claim: Established in 2011 as a programme of the University of Nottingham Malaysia.
  url: https://www.nottingham.edu.my/Research/Research-impact-stories/Creating-a-harmonious-co-existence-between-humans-and-the-Malaysian-elephant.aspx
  fetched: 2026-11-03
  quote: The Management and Ecology of Malaysian Elephants (MEME) project is one of our pioneering
    sustainability programmes, established in 2011.
- claim: Developing an elephant early warning prototype using bioacoustics and cameras.
  url: https://ace-coalition.com/our-research/
  fetched: 2026-11-03
  quote: is developing an elephant early warning detection system prototype using elephant
    bioacoustics and camera (both sounds and visual) to detect elephant presences in the plantation
