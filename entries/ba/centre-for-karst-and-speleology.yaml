    out to create a network of volunteer bat monitors whose data are collated into
    national and international databases.
  url: https://cepf.net/grants/grantee-projects/protection-bats-neretva-river-catchment-area
  fetched: 2026-11-13
  quote: Create a network of volunteer bat monitors to provide accurate data on the
    occurrence and activity of bat species that will be collated into national and
    international databases.
- claim: The project's final report to CEPF says it developed a software solution
    for winter bat monitoring and for monitoring their sites.
