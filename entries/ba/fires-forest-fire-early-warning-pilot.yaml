summary: Pilot that, according to People in Need, gave Jablanica and Konjic their
  first thermal-camera drones for wildfire detection, after a November 2023 announcement
  of smoke detectors linked to a cloud system.
facts:
- claim: People in Need says Jablanica and Konjic received their first drones for
    early detection and suppression of wildfires through the F.I.R.E.S. pilot, and
    that it introduced the technology.
  url: https://www.peopleinneed.net/life-saving-innovation-drones-enable-rapid-detection-of-forest-fires-in-bosnia-and-herzegovina-12552gp
  fetched: 2026-11-13
  quote: We introduced new technology that will transform how emergency services respond
    to fire.
- claim: The drones carry high-resolution thermal cameras for detecting fire and for
    post-fire monitoring.
  url: https://www.peopleinneed.net/life-saving-innovation-drones-enable-rapid-detection-of-forest-fires-in-bosnia-and-herzegovina-12552gp
  fetched: 2026-11-13
  quote: The drones, equipped with high-resolution thermal cameras, enable rapid detection
    of fire
- claim: In November 2023, People in Need announced a pilot in Jablanica that would
    implement an early warning system using smoke detectors connected to a cloud system.
  url: https://westernbalkans.peopleinneed.net/en/innovative-wildfire-early-warning-system-pilot-project-launched-in-jablanica-10839gp
  fetched: 2026-11-13
  quote: The early warning system operates using an intricate network of smoke detectors,
    connected to a cloud system
- claim: People in Need says the project is financially supported by the Ministry
    of Foreign Affairs of the Czech Republic and the Municipality of Jablanica.
  url: https://www.peopleinneed.net/life-saving-innovation-drones-enable-rapid-detection-of-forest-fires-in-bosnia-and-herzegovina-12552gp
