summary: Permanent secretariat with three departments through which, Burkina24 reported on 30 December
  2025, the environment ministry had begun preparing the seventh national biodiversity report.
facts:
- claim: Burkina24 reported on 30 December 2025 that the environment ministry had begun preparing the
    seventh national biodiversity report and first Nagoya Protocol report through SP/CNDD.
  url: https://burkina24.com/2025/12/30/le-burkina-faso-sactive-pour-lelaboration-des-rapports-nationaux-sur-la-diversite-biologique-et-le-protocole-de-nagoya-sur-lapa/
  fetched: 2026-11-09
  quote: le ministère de l’environnement, de l’eau et de l’assainissement, a, à travers le Secrétariat
    permanent du Conseil national de développement durable (SP/CNDD), entamé le processus d’élaboration
    des deux rapports.
- claim: The workshop on 30 December 2025 was a step in preparing the seventh national report on biological
    diversity.
  url: https://burkina24.com/2025/12/30/le-burkina-faso-sactive-pour-lelaboration-des-rapports-nationaux-sur-la-diversite-biologique-et-le-protocole-de-nagoya-sur-lapa/
  fetched: 2026-11-09
  quote: constitue une étape clé du processus d’élaboration du 7 e rapport national sur la diversité biologique
- claim: The National Council for Sustainable Development is a body under the technical supervision of
    the environment ministry (MEEA).
  url: https://onedd-burkina.info/cadre-institutionnel
  fetched: 2026-11-09
  quote: Le Conseil national pour le développement durable(CNDD) est une structure de mission placée sous
    la tutelle technique du Ministère en charge de l’environnement (MEEA)
- claim: The permanent secretariat has a technical coordination and three departments.
  url: https://onedd-burkina.info/cadre-institutionnel
  fetched: 2026-11-09
  quote: le SP/CNDD comprend une Coordination Technique et trois départements
- claim: One of its departments is the national observatory of sustainable development.
  url: https://onedd-burkina.info/cadre-institutionnel
  fetched: 2026-11-09
  quote: l'Observatoire national du Développement Durable (ONDD)
- claim: One of its departments coordinates international conventions.
  url: https://onedd-burkina.info/cadre-institutionnel
  fetched: 2026-11-09
  quote: le Département de la coordination des conventions internationales (DCCI)
- claim: The national environment observatory supports it in monitoring and evaluation under the UN conventions
    on desertification, climate change and biological diversity.
  url: https://onedd-burkina.info/cadre-institutionnel
  fetched: 2026-11-09
  quote: l’ONEDD apporte un appui direct au SP-CNDD, notamment pour assurer le suivi – évaluation dans
    le cadre des conventions des Nations unies sur la Lutte contre la désertification (LCD), le Changement
    climatique (CC) et la Diversité biologique (DB)
