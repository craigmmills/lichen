summary: Body created by decree 2008-171 of 16 April 2008, seated in Ouagadougou under the protected areas
  minister's technical supervision, with a mission including sustainable management of state and local
  authority forests.
facts:
- claim: Decree 2008-171 of 16 April 2008 created the Office National des Aires Protégées (OFINAP).
  url: https://faolex.fao.org/docs/pdf/bkf83826.pdf
  fetched: 2026-11-09
  quote: Il e st créé un Office National des Aires Protégées en abrégé (OFINAP).
- claim: The decree places it under the technical supervision of the minister responsible for protected
    areas and sets its seat in Ouagadougou.
  url: https://faolex.fao.org/docs/pdf/bkf83826.pdf
  fetched: 2026-11-09
  quote: Il est placé sous la tutelle technique du Ministre en charge des aires protégées et sous la tutelle
    financière du Ministre en charge des finances et du budget. Son siège est à Ouagadougou.
- claim: Its mission under the decree includes the sustainable management of the forests of the state
    and local authorities.
  url: https://faolex.fao.org/docs/pdf/bkf83826.pdf
  fetched: 2026-11-09
  quote: assurer la gestion durable des forêts de l’Etat et des Collectivités territoriales
