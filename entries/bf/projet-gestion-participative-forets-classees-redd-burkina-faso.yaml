summary: REDD+ project covering 12 classified forests according to a September 2020 brief, financed by
  the Forest Investment Program, using Sentinel imagery, testing drones and georeferencing 33,000 planted
  trees.
facts:
- claim: The September 2020 brief says the project covers 12 classified forests and is financed by the
    Forest Investment Program.
  url: https://www.cif.org/sites/cif_enc/files/knowledge-documents/dime_brief-overview_french.pdf
  fetched: 2026-11-09
  quote: Le projet porte sur 12 forêts classées et est financé par le Fonds d’investissement forestier
- claim: The project used imagery from the European Space Agency's Sentinel satellites to map vegetation
    cover in some of Burkina Faso's classified forests.
  url: https://www.cif.org/sites/cif_enc/files/knowledge-documents/dime_brief-overview_french.pdf
  fetched: 2026-11-09
  quote: le projet a utilisé les images de la flotte de satellites Sentinel de l’Agence spatiale européenne
    (ASE) pour cartographier le couvert végétal dans certaines forêts classées du Burkina Faso.
- claim: The project also tested drones for mapping forests.
  url: https://www.cif.org/sites/cif_enc/files/knowledge-documents/dime_brief-overview_french.pdf
  fetched: 2026-11-09
  quote: Le projet a aussi lancé une initiative d’essai des drones pour la cartographie précise des forêts.
- claim: Local teams used ESRI Survey123 to georeference 33,000 planted trees, then ESRI Collector nine
    months later to record their condition.
  url: https://www.cif.org/sites/cif_enc/files/knowledge-documents/dime_brief-overview_french.pdf
  fetched: 2026-11-09
  quote: les équipes locales ont pu utiliser l’outil d’enquête ESRI Survey123 pour le géoréférencement
    de 33 000 arbres plantés
