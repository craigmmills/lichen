summary: Institute that says it partnered with OMVS on remote-sensing monitoring of invasive aquatic plants
  in the Senegal River valley, supported SP/CNDD's land occupation platform, and has belonged to the Group
  on Earth Observations since July 2017.
facts:
- claim: Says the OMVS partnered with it to set up a remote-sensing and GIS system to assess and monitor
    the vegetation cover and biomass of invasive aquatic plants, notably Typha, in the Senegal River valley.
  url: https://isestel.org/
  fetched: 2026-11-09
  quote: mettre en place un système technologique basée sur la télédétection et les SIG afin d’évaluer
    et suivre la couverture végétale et la biomasse des plantes aquatiques envahissantes, notamment le
    Typha, dans la vallée du fleuve Sénégal
- claim: Says a baseline study was made, a geospatial platform developed and six experts trained for that
    work.
  url: https://isestel.org/
  fetched: 2026-11-09
  quote: Une étude d’état des lieux a été faite, une plateforme géospatiale développée et six experts
    formés pour poursuivre la mission.
- claim: Says it was associated with SP/CNDD as a partner of SERVIR West Africa to set up an information
    and monitoring platform on land occupation in Burkina Faso's communes.
  url: https://isestel.org/
  fetched: 2026-11-09
  quote: L’ISESTEL a été associé au SP/CNDD comme partenaire du programme SERVIR-WA pour la mise en place
    d’une plateforme d’information et de suivi de l’occupation physique
- claim: Says it has been a member organisation of the Group on Earth Observations since July 2017.
  url: https://isestel.org/
  fetched: 2026-11-09
  quote: Depuis Juillet 2017, l’ISESTEL a été admis dans cette structure
