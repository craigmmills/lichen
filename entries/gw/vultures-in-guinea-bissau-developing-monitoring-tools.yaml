facts:
- claim: The project aimed to develop monitoring methods adapted to the country, gather
    baseline data on the abundance and distribution of all vulture species across
    Guinea-Bissau, and train local staff in monitoring techniques.
  url: https://www.rufford.org/projects/mohamed-faza-henriques-bald%C3%A9/vultures-in-guinea-bissau-developing-monitoring-tools-assessing-conservation-status-and-raising-awareness-concerning-their-provision-of-ecosystem-services/
  fetched: 2026-11-13
  quote: With this project we aim to develop adapted methodologies for monitoring
    in the country, assess the status of populations by gathering baseline data on
    the abundance and distribution of all vulture species throughout Guinea-Bissau
- claim: The final report says that after field tests a new monitoring method for
    vultures in the country was established.
  url: https://media.rufford.org/media/project_reports/18298-1%20Final%20Report.pdf
  fetched: 2026-11-13
  quote: After several field tests, a new adapted methodology for monitoring of vultures
    in the country was established.
- claim: The final report says all vulture species in the country were included in
    a nationwide census that also covered the Bijagós archipelago.
  url: https://media.rufford.org/media/project_reports/18298-1%20Final%20Report.pdf
  fetched: 2026-11-13
  quote: All species of vultures in the country were included in a nationwide census,
    which also included the Bijagós archipelago.
