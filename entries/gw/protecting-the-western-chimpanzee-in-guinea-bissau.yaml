summary: Born Free-supported project, reported in January 2018 as led by Maria Joana
  Ferreira da Silva, developing a country-scale primate conservation strategy using
  modelling, surveys and DNA analysis, and monitoring the primate meat trade.
facts:
- claim: Born Free's January 2018 news item says a project led by Maria Joana Ferreira
    da Silva, a postdoctoral fellow associated with Cardiff University and CIBIO,
    is developing a country-scale conservation management strategy for western chimpanzees
    and other primates in Guinea-Bissau, with Born Free's support.
  url: https://bornfree.org.uk/news/chimpanzees-in-guinea-bissau
  fetched: 2026-11-15
  quote: is leading a project to develop a country-scale conservation management strategy
    of western chimpanzees and other primates in Guinea-Bissau
- claim: The January 2018 item says ecological niche-based modelling, field surveys
    of selected areas and DNA analysis to identify primate species, genetic diversity,
    population structure and demographic history were partly or entirely complete
    in the project's first stage.
  url: https://bornfree.org.uk/news/chimpanzees-in-guinea-bissau
  fetched: 2026-11-15
  quote: notably ecological niche-based modelling, field surveys of selected areas,
    and DNA analysis to identify primate species
- claim: The January 2018 item says the project was monitoring the primate meat trade,
    with 543 tissue samples collected from six restaurants near Cufada Lagoons Natural
    Park over fifteen months.
  url: https://bornfree.org.uk/news/chimpanzees-in-guinea-bissau
  fetched: 2026-11-15
  quote: The project also monitors the primate meat trade in Guinea-Bissau.
