summary: Mandated to manage Guinea-Bissau’s biodiversity and protected areas, it uses
  Global Mangrove Watch; reports describe GPS-based turtle monitoring in 2021 and
  ad-hoc mangrove monitoring in 2022.
facts:
- claim: Guinea-Bissau's 2019 forest reference emission level submission says the
    national protected area network (SNAP) is managed by IBAP.
  url: https://redd.unfccc.int/media/2019_submission_frel_guinea-bissau.pdf
  fetched: 2026-11-12
  quote: network (SNAP), which is now managed by IBAP and guided by its updated strategic
    plan (2014-2020)2. It
- claim: InforMEA lists the director general of the institute as Guinea-Bissau's primary
    national focal point for the Convention on Biological Diversity.
  url: https://www.informea.org/en/countries/gw/party-contacts-hub
  fetched: 2026-11-12
  quote: Institute for Biodiversity and Protected Areas
- claim: Mongabay reported in 2021 that IBAP employs local young men with GPS devices
    to count sea turtle nests on Poilão Island and follow the movements of adult turtles,
    and that IBAP has counted nests methodically since 2007.
  url: https://news.mongabay.com/2021/11/technology-and-tradition-team-up-to-watch-over-a-sacred-islands-sea-turtles/
  fetched: 2026-11-12
  quote: IBAP employs local young men with GPS trackers to monitor the number of nests
    on the island as well as the movements of adult turtles once they leave Poilão.
- claim: In a 2022 interview on Wetlands International's site, IBAP's José Eliseu
    Benante said IBAP used park guards to monitor threats to and changes in mangroves
    in national parks, but could only monitor mangroves on an ad-hoc basis.
  url: https://www.wetlands.org/blog/taking-rapid-action-on-disturbance-alerts/
  fetched: 2026-11-12
  quote: For mangroves, we can’t even do regular monitoring. Here, we do only ad-hoc
    monitoring.
