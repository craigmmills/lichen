facts:
- claim: The AGRIS record of the 2022 paper says it develops a procedure based on
    machine learning models and Sentinel-2 images that detects cashew orchards automatically.
  url: https://agris.fao.org/search/en/records/65de513b63b8185d9ca833e9
  fetched: 2026-11-15
  quote: procedure based on machine learning models and Sentinel-2 images, automatically
    detecting cashew orchards with a dice coefficient of 82.54%
- claim: The record says the case study was designed for Cantanhez National Park and
    is a step towards operational monitoring in the region.
  url: https://agris.fao.org/search/en/records/65de513b63b8185d9ca833e9
  fetched: 2026-11-15
  quote: the work is a stepping stone towards wall-to-wall operational monitoring
    in the region
- claim: The 2022 paper's abstract says Guinea-Bissau's forests and woodlands were
    progressively being replaced by cashew orchards and that there were then no systematic
    or automated means of objectively monitoring and reporting the situation.
  url: https://agris.fao.org/search/en/records/65de513b63b8185d9ca833e9
