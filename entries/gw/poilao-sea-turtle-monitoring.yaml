summary: Active project run by IBAP in which, Mongabay reported in 2021, local staff count nests on Poilão
  and follow adult turtles, with 45 females satellite-tagged between 2018 and 2020 with ISPA.
facts:
- claim: Mongabay reported in 2021 that IBAP employs local young men to count nests on Poilão and to follow
    the movements of adult turtles after they leave the island.
  url: https://news.mongabay.com/2021/11/technology-and-tradition-team-up-to-watch-over-a-sacred-islands-sea-turtles/
  fetched: 2026-11-12
  quote: IBAP employs local young men with GPS trackers to monitor the number of nests on the island as
    well as the movements of adult turtles once they leave Poilão.
- claim: Between 2018 and 2020 researchers from IBAP and Portugal's ISPA University Institute satellite-tagged
    45 female turtles, according to Mongabay.
  url: https://news.mongabay.com/2021/11/technology-and-tradition-team-up-to-watch-over-a-sacred-islands-sea-turtles/
  fetched: 2026-11-12
  quote: Between 2018 and 2020, researchers from IBAP and Portugal’s ISPA University Institute satellite-tagged
    a total of 45 female turtles .
