summary: Rufford-funded turtle conservation project (grant £9,989) that planned community
  monitoring at a Cacheu nesting beach; a November 2018 update reports 142 green turtle
  nests found across seven beaches from August to October 2018.
facts:
- claim: The Rufford project page, dated 27 June 2018, says the project would start
    a participatory monitoring and protection programme at a key sea turtle nesting
    beach in the Cacheu region.
  url: https://www.rufford.org/projects/ana-rita-caldas-patricio/impacts-of-climate-change-on-west-african-green-turtles-and-marine-turtle-conservation-in-guinea-bissau/
  fetched: 2026-11-13
  quote: start a participatory monitoring and protection program at a key sea turtle
    nesting beach, located at northwest of mainland Guinea-Bissau, in the region of
    Cacheu
- claim: The page says the project would also support the ongoing monitoring and protection
    of the main nesting beaches in the Bijagós Archipelago.
  url: https://www.rufford.org/projects/ana-rita-caldas-patricio/impacts-of-climate-change-on-west-african-green-turtles-and-marine-turtle-conservation-in-guinea-bissau/
  fetched: 2026-11-13
  quote: We will also continue to provide support for the ongoing monitoring and protection
    of the major nesting beaches at the Bijagós Archipelago, Guinea-Bissau.
- claim: A November 2018 project update hosted by Rufford, the month of an update
    the project page lists, says a turtle team of local collaborators in the Varela
    region monitored nesting at seven beaches from August to October 2018 and identified
    142 green turtle nests.
  url: https://media.rufford.org/media/project_reports/25625-B%20November%202018.pdf
  fetched: 2026-11-13
  quote: From August to October 2018 the turtle team at Varela region, composed of
    28 collaborators and two field coordinators from the local communities has monitored
    the nesting activities of sea turtles at seven beaches
- claim: The project's final evaluation report, a Rufford Foundation form under the
    same project title, records a grant of £9,989.
  url: https://media.rufford.org/media/project_reports/25625-B%20Final%20Evaluation%20Report.pdf
  fetched: 2026-11-13
  quote: Grant Amount £9989
- claim: The final report says the project was meant to start a long-term patrolling
    and monitoring project in the region.
  url: https://media.rufford.org/media/project_reports/25625-B%20Final%20Evaluation%20Report.pdf
  fetched: 2026-11-13
  quote: This should be the start of a long -term patrolling/monitoring project
