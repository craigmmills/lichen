summary: Opened consultation on the 2026-2030 biodiversity programme, will coordinate the National Forest
  Inventory, and began drafting a decision establishing the Protected Natural Areas Administration in
  January 2026.
facts:
- claim: The Ministry of Environment opened public consultation on the draft Programme on biological diversity
    for 2026 to 2030.
  url: https://particip.gov.md/index.php/ro/document/stages/anunt-privind-initierea-elaborari-programului-privind-biodiversitatea-pentru-anii-2024-2030/12538
  fetched: 2026-11-12
  quote: ANUNŢĂ PUBLICUL INTERESAT despre lansarea procesului de consultări publice a proiectului Programului
    privind diversitatea biologică pentru anii 2026–2030
- claim: The draft programme is tied to the Kunming-Montreal Global Biodiversity Framework 2022 to 2030.
  url: https://particip.gov.md/index.php/ro/document/stages/anunt-privind-initierea-elaborari-programului-privind-biodiversitatea-pentru-anii-2024-2030/12538
  fetched: 2026-11-12
  quote: Programul este corelat cu Cadrul global pentru biodiversitate Kunming–Montreal 2022–2030
- claim: The ministry's address is bd. Ștefan cel Mare și Sfânt 162, Chișinău.
  url: https://particip.gov.md/index.php/ro/document/stages/anunt-privind-initierea-elaborari-programului-privind-biodiversitatea-pentru-anii-2024-2030/12538
  fetched: 2026-11-12
  quote: Ministerului Mediului, or. Chișinău, bd. Ștefan cel Mare și Sfânt, 162
- claim: The Ministry of Environment is to coordinate implementation of the National Forest Inventory.
  url: https://gov.md/ro/comunicate-de-presa/primul-inventar-forestier-din-istoria-tarii-republica-moldova-incepe-procesul
  fetched: 2026-11-12
  quote: Ministerul Mediului va coordona implementarea Inventarului Forestier Național
- claim: In January 2026 the ministry began drafting a government decision to set up a public institution,
    the Protected Natural Areas Administration.
  url: https://particip.gov.md/index.php/ru/document/stages/anunt-privind-initierea-elaborarii-proiectului-de-hotarare-a-guvernului-cu-privire-la-constituirea/15927
  fetched: 2026-11-12
  quote: Ministerul Mediului inițiază, începând cu data 22.01.2026 procesul de elaborare a proiectului
    de Hotărâre a Guvernului cu privire la constituirea, organizarea și funcționarea Instituției Publice
    Administrația Arii Naturale Protejate
