summary: Proposed state-funded public institution, under a draft decision with the Ministry of Environment
  as founder, planned to monitor biodiversity, manage geospatial data and run territorial units for several
  national parks and reserves.
facts:
- claim: The draft decision sets up the institution as a public-law legal person funded from the state
    budget, with the Ministry of Environment as founder.
  url: https://particip.gov.md/index.php/ru/document/stages/anunt-privind-initierea-elaborarii-proiectului-de-hotarare-a-guvernului-cu-privire-la-constituirea/15927
  fetched: 2026-11-12
  quote: persoană juridică de drept public, instituție bugetară finanțată din bugetul de stat, în care
    Ministerul Mediului exercită, în numele statului, calitatea de fondator.
- claim: Its planned tasks include monitoring the state of biodiversity and managing geospatial data.
  url: https://particip.gov.md/index.php/ru/document/stages/anunt-privind-initierea-elaborarii-proiectului-de-hotarare-a-guvernului-cu-privire-la-constituirea/15927
  fetched: 2026-11-12
  quote: monitorizarea stării biodiversității, gestionarea datelor geospațiale
- claim: It is to have territorial units managing the Orhei and Nistrul de Jos national parks, the Prutul
    de Jos Biosphere Reserve and the Plaiul Fagului, Codrii and Pădurea Domnească reserves.
  url: https://particip.gov.md/index.php/ru/document/stages/anunt-privind-initierea-elaborarii-proiectului-de-hotarare-a-guvernului-cu-privire-la-constituirea/15927
  fetched: 2026-11-12
  quote: Structura instituției va include subdiviziuni teritoriale responsabile de gestionarea parcurilor
    naționale „Orhei” și „Nistrul de Jos”
