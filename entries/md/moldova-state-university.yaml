facts:
- claim: The National Botanical Garden Institute "Alexandru Ciubotaru" is a part of
    Moldova State University.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: National Botanical Garden Institute (USM-GBNI)
- claim: The announcement for a Red Book species-assessment project seminar on 23
    January 2026 names the university, through its Institute of Zoology and National
    Botanical Garden, and the Life Sciences section of the Academy of Sciences as
    organisers. It identifies the National Environmental Fund as the project funder.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Program%20seminar%20informativ_ASM_23%20ianuarie%202026.pdf
  fetched: 2026-11-15
  quote: Universitatea de Stat din Moldova
- claim: The programme for that seminar schedules the director of the university's
    National Botanical Garden to present the current state and vulnerability of plant
    and fungi species in Moldova.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Program%20seminar%20informativ_ASM_23%20ianuarie%202026.pdf
  fetched: 2026-11-15
  quote: Starea actuală și vulnerabilitatea speciilor de plante și fungi pe teritoriul
    Republicii
- claim: The National Botanical Garden Institute is a Moldovan partner in MONFORGENDIV,
    a 2024 to 2026 Romania-Moldova project on forest monitoring methods coordinated
    by INCDS Marin Drăcea of Romania. Its specialists received forest monitoring training
    in the project's 2024 stage.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: Training of ICAS and USM-GBNI specialists in forest monitoring activities.
