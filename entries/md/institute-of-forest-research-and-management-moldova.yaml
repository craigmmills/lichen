summary: State enterprise that the government says will carry out the technical work of the National Forest
  Inventory, and which JICA says received forest monitoring equipment and satellite image training in
  2023.
facts:
- claim: The EU LIFE database lists it as a state enterprise taking part in LIFE RENATA.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE23-PRE-EL-LIFE-RENATA-101148675/roadmap-for-the-alignment-of-emerald-network-establishment-and-management-to-natura-2000-standards-in-moldova
  fetched: 2026-11-12
  quote: INTREPRINDEREA DE STAT INSTITUTUL DE CERCETARI SI AMENAJARI SILVICE
- claim: The government says the technical work of the National Forest Inventory will be carried out by
    the institute.
  url: https://gov.md/ro/comunicate-de-presa/primul-inventar-forestier-din-istoria-tarii-republica-moldova-incepe-procesul
  fetched: 2026-11-12
  quote: iar lucrările tehnice vor fi realizate prin Institutul de Cercetări și Amenajări Silvice
- claim: JICA says it donated a workstation and a laptop to ICAS in February 2023 for forest monitoring.
  url: https://www.jica.go.jp/english/overseas/moldova/information/topics/2022/230331.html
  fetched: 2026-11-12
  quote: JICA donated critical equipment such as high-spec workstation and a laptop to ICAS in February
    to help create an enabling work environment for a better forest monitoring.
- claim: In JICA's March 2023 training, staff of Moldsilva and ICAS learned to download satellite images
    and land use images showing changes in forest areas.
  url: https://www.jica.go.jp/english/overseas/moldova/information/topics/2022/230331.html
  fetched: 2026-11-12
  quote: the specialists of the two institutions learned how to download the satellite images by developing
    programming codes in Java, and how to download land use images which allows visualizing changes in
    forest areas.
- claim: Moldova's Sixth National Report to the CBD (2019) says ICAS monitors defoliation and discoloration
    of trees.
  url: https://madrm.gov.md/sites/default/files/Documente%20atasate%20Advance%20Pagines/Raport%20VI%20cu%20privire%20la%20diversificarea%20biologica%20ENG%20Web%20final.pdf
  fetched: 2026-11-12
  quote: Institute of Forest Research and Management (ICAS) monitors the defoliation and discoloration
- claim: The same report says the Map of Moldova's Forests was developed by the institute.
  url: https://madrm.gov.md/sites/default/files/Documente%20atasate%20Advance%20Pagines/Raport%20VI%20cu%20privire%20la%20diversificarea%20biologica%20ENG%20Web%20final.pdf
