summary: Closed project, 1 February 2024 to 31 May 2026, coordinated by Lever Development Consultants
  S.A., with objectives to update the national Emerald Network database and develop monitoring and reporting
  tools.
facts:
- claim: One objective is to update the national Emerald Network database for managing and monitoring
    the network.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE23-PRE-EL-LIFE-RENATA-101148675/roadmap-for-the-alignment-of-emerald-network-establishment-and-management-to-natura-2000-standards-in-moldova
  fetched: 2026-11-12
  quote: Updating the national Emerald Network database and encouraging its use for informed collaborative
    decision-making, sharing and analysing data and for managing, monitoring and improving the Emerald
    Network
- claim: Another objective is to develop monitoring and reporting tools.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE23-PRE-EL-LIFE-RENATA-101148675/roadmap-for-the-alignment-of-emerald-network-establishment-and-management-to-natura-2000-standards-in-moldova
  fetched: 2026-11-12
  quote: Developing user-friendly technical guidelines, action plans and monitoring and reporting tools
- claim: The project's dates are 1 February 2024 to 31 May 2026.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE23-PRE-EL-LIFE-RENATA-101148675/roadmap-for-the-alignment-of-emerald-network-establishment-and-management-to-natura-2000-standards-in-moldova
  fetched: 2026-11-12
  quote: 'Start Date: 01/02/2024'
- claim: EKBY says the project is expected to provide monitoring and reporting methods and tools, a knowledge
    repository and a GIS database to record and map Moldova's Emerald sites.
  url: https://ekby.gr/en/our-actions/conservation-management/life-renata/
  fetched: 2026-11-12
  quote: a GIS database to record and map the sites of the EMERALD network in Moldova.
- claim: EKBY names the coordinator as Lever Development Consultants S.A.
  url: https://ekby.gr/en/our-actions/conservation-management/life-renata/
  fetched: 2026-11-12
  quote: The project is coordinated by Lever Development Consultants S.A.
