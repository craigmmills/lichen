id: red-book-moldova-fourth-edition-species-assessment
kind: project
name: Assessment of species status for the fourth edition of the Red Book of the Republic
  of Moldova
also_known_as:
- Evaluarea stării speciilor de plante, fungi și animale, elaborarea listei speciilor
  cu statut de raritate și a algoritmului de prezentare a acestora în ediţia a IV-a
  a Cărţii Roşii a Republicii Moldova
scope: md
ai_label: conservation-tech
realms:
- land
- freshwater
countries:
- md
status: active
runner: unknown
summary: Funded by the National Environmental Fund, this active project assesses plant,
  fungi and animal species for rare-species listing in the Red Book’s fourth edition,
  with two seminar programmes.
facts:
- claim: The project assesses the status of plant, fungi and animal species and draws
    up the list of species with rarity status for the fourth edition of the Red Book,
    and is funded by the National Environmental Fund.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Program%20seminar%20informativ_ASM_23%20ianuarie%202026.pdf
  fetched: 2026-11-15
  quote: finanțat din Fondul Național pentru Mediu
- claim: The project seminar programme for 23 January 2026 at the Academy of Sciences
    schedules presentations on the current state and vulnerability of animal species,
    and of plant and fungi species, in Moldova.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Program%20seminar%20informativ_ASM_23%20ianuarie%202026.pdf
  fetched: 2026-11-15
  quote: Starea actuală și vulnerabilitatea speciilor de animale pe teritoriul Republicii
    Moldova.
- claim: The project seminar programme for 10 October 2025 at the Plaiul Fagului reserve
    schedules presentations on Red Book insect species, bats, rare birds and fish
    species with rarity status.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Anunt%20seminar_Plaiul%20Fagului_10%20octombrie%202025.pdf
  fetched: 2026-11-15
  quote: Starea actuală a speciilor rare de păsări din Republica Moldova
- claim: The October 2025 seminar announcement names Moldova State University, through
    its Institute of Zoology and National Botanical Garden, as organiser.
  url: https://zoology.usm.md/sites/default/files/inline-files/Proiect%20Cartea%20Rosie_Anunt%20seminar_Plaiul%20Fagului_10%20octombrie%202025.pdf
  fetched: 2026-11-15
  quote: 'Organizator: Universitatea de Stat din Moldova'
