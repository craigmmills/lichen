summary: Czech-funded cooperation project with UNDP, Arnika and Biotica Moldova which, UNDP said in November
  2024, had contributed to better management of three protected areas, each given a drone and a small
  boat for monitoring.
facts:
- claim: UNDP said in November 2024 that the project had contributed to improved management of three protected
    areas.
  url: https://www.undp.org/moldova/press-releases/moldova-strengthens-its-local-volunteers-rangers-network-and-protected-area-management-czech-and-undp-support
  fetched: 2026-11-12
  quote: The project has contributed to improved management of three protected areas (Lower Nistru National
    Park, Orhei National Park and Codrii Nature Reserve).
- claim: Each of the three protected areas received a drone and a small boat to help monitoring.
  url: https://www.undp.org/moldova/press-releases/moldova-strengthens-its-local-volunteers-rangers-network-and-protected-area-management-czech-and-undp-support
  fetched: 2026-11-12
  quote: Each beneficiary protected area (Orhei, Lower Nistru and Codrii) received a drone and a small
    boat to help monitoring the protected areas.
- claim: The volunteer rangers' training covered protected area management and the use of drones, among
    other topics.
  url: https://www.undp.org/moldova/press-releases/moldova-strengthens-its-local-volunteers-rangers-network-and-protected-area-management-czech-and-undp-support
  fetched: 2026-11-12
  quote: improving their knowledge about protected areas‘ management, excessive tourism, use of drones,
    forest management, river revitalisation etc.
