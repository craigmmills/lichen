summary: Closed 2015 to 2018 project, budgeted at 998,904 US dollars, funded by the
  GEF and run by Moldova's environment ministry and Moldsilva, which carried out a
  red list species inventory in two districts and trained 29 officers.
facts:
- claim: The GEF lists its executing agencies as the Ministry of Environment, the
    Moldsilva Agency and the Ministry of Regional Development and Construction.
  url: https://www.thegef.org/projects-operations/projects/5355
  fetched: 2026-11-15
  quote: Ministry of Environment (MoE); Agency Moldsilva; Ministry of Regional Development
    and Construction (MRDC)
- claim: UNDP lists the project as closed, running from 2015 to 2018 with a budget
    of 998,904 US dollars.
  url: https://www.undp.org/node/102806
  fetched: 2026-11-15
  quote: 'Budget: 998,904 USD'
- claim: A red list species inventory was carried out in Soroca and Stefan Voda districts,
    producing passports for the species and their habitats with location data.
  url: https://www.undp.org/node/102806
  fetched: 2026-11-15
  quote: The red list species inventory was performed in Soroca and Stefan Voda districts
- claim: One of its expected results was a monitoring system to track change in biodiversity-important
    areas.
  url: https://www.undp.org/node/102806
  fetched: 2026-11-15
  quote: Monitoring system in place to track change in biodiversity-important areas
- claim: 29 central and local officers were trained, including in biodiversity data
    collection and monitoring.
  url: https://www.undp.org/node/102806
  fetched: 2026-11-15
  quote: biodiversity data collection and monitoring
