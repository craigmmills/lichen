summary: Angola's environment ministry, which supervises INBAC; its minister coordinated a 3 November
  2026 commission meeting that recommended doubling the Giant Sable Antelope sanctuary to 80 square kilometres.
facts:
- claim: The decree approving INBAC's statute describes INBAC as a body supervised by the Ministry of
    Environment.
  url: https://lex.ao/docs/presidente-da-republica/2024/decreto-presidencial-n-o-175-24-de-24-de-julho/
  fetched: 2026-11-08
  quote: Reconhecendo que o Instituto Nacional da Biodiversidade e Áreas de Conservação é um órgão superintendido
    pelo Ministério do Ambiente
- claim: The minister of environment coordinated the fifth executive committee meeting of the National
    Commission for Climate Change and Biodiversity (CNACB) in November 2026.
  url: https://www.minamb.gov.ao/
  fetched: 2026-11-08
  quote: realizou hoje, 03 de Novembro de 2026, em Luanda a sua 5.ª Reunião do Comité Executivo, coordenada
    pela Ministra do Ambiente, Ana Paula de Carvalho Pereira.
- claim: At that meeting the commission recommended enlarging the Giant Sable Antelope sanctuary from
    40 to 80 square kilometres.
  url: https://www.minamb.gov.ao/
  fetched: 2026-11-08
  quote: Na biodiversidade, a Comissão recomendou o alargamento do Santuário da Palanca Negra Gigante
    de 40 km² para 80 km².
- claim: Its portal names Ana Paula Chantre Luna de Carvalho Pereira as minister.
  url: https://minamb.gov.ao/home
  fetched: '2026-11-08'
  quote: MINISTRO(A) ANA PAULA CHANTRE LUNA DE CARVALHO PEREIRA
- claim: Says the minister coordinated the fifth executive committee meeting of the national commission
    for climate change and biodiversity (CNACB) on 3 November 2026.
  url: https://minamb.gov.ao/home
  fetched: '2026-11-08'
  quote: A Comissão Nacional para as Alterações Climáticas e Biodiversidade (CNACB) realizou hoje, 03
    de Novembro de 2026, em Luanda a sua 5.ª Reunião do Comité Executivo, coordenada pela Ministra do
    Ambiente
- claim: Says the commission recommended doubling the Giant Sable Antelope Sanctuary from 40 to 80 square
    kilometres.
  url: https://minamb.gov.ao/home
  fetched: '2026-11-08'
  quote: Na biodiversidade, a Comissão recomendou o alargamento do Santuário da Palanca Negra Gigante
    de 40 km² para 80 km²
