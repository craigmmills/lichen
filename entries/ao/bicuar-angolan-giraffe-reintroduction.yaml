status: active
summary: Reintroduction project in Bicuar National Park that has completed its first
  phase, bringing a founder population of 12 Angolan giraffe from Namibia, all fitted
  with solar-powered GPS satellite trackers; the Giraffe Conservation Foundation built
  it.
facts:
- claim: All 12 giraffe released were fitted with solar-powered GPS satellite trackers
    so GCF and INBAC field teams can monitor their movements, home ranges and habitat
    use.
  url: https://giraffeconservation.org/historic-conservation-initiative-to-restore-angolan-giraffe-to-angolas-bicuar-national-park/
  fetched: 2026-11-12
  quote: All 12 individuals were fitted with solar-powered GPS satellite tracking
    devices to allow the GCF and INBAC field teams to remotely monitor their movement
    patterns, home range establishment, and habitat use
- claim: The release completed the first operational phase, bringing a founder population
    of 12 Angolan giraffe from Namibia.
  url: https://giraffeconservation.org/historic-conservation-initiative-to-restore-angolan-giraffe-to-angolas-bicuar-national-park/
  fetched: 2026-11-12
  quote: Today’s release marks the successful completion of the first operational
    phase, bringing a founder population of 12 Angolan giraffe from Namibia to Bicuar
    National Park.
- claim: Habitat suitability and translocation feasibility assessments were carried
    out jointly by GCF and INBAC in 2025.
  url: https://giraffeconservation.org/historic-conservation-initiative-to-restore-angolan-giraffe-to-angolas-bicuar-national-park/
  fetched: 2026-11-12
  quote: Following rigorous habitat suitability and translocation feasibility assessments
    conducted jointly by GCF and INBAC in 2025
