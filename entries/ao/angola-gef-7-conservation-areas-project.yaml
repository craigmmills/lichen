summary: Project led by Conservation International and run by INBAC, funded by the Global Environment
  Facility, launched in March 2025 and covering Luengue-Luiana and Iona national parks.
facts:
- claim: Conservation International says the project was launched in March 2025 by the Secretary of State
    of Environment.
  url: https://www.conservation.org/gef/news/launch-of-angola-gef-7-project
  fetched: 2026-11-08
  quote: In March, the Secretary of State of Environment, His Excellency Yuri Valter de Sousa Santos,
    launched the Global Environment Facility (GEF)-funded project
- claim: It covers Luengue-Luiana National Park in the KAZA transfrontier conservation area and Iona National
    Park in the Iona-Skeleton Coast transfrontier area.
  url: https://www.conservation.org/gef/news/launch-of-angola-gef-7-project
  fetched: 2026-11-08
  quote: Luengue-Luiana National Park in the Kavango-Zambezi (KAZA) TFCA and Iona National Park in the
    Iona-Skeleton Coast TFCA
- claim: Conservation International lists among the planned support improving park surveillance infrastructure
    and equipping parks with modern monitoring equipment.
  url: https://www.conservation.org/gef/news/launch-of-angola-gef-7-project
  fetched: 2026-11-08
  quote: Improving Park surveillance infrastructure and equipping parks with modern monitoring equipment.
