  quote: a fundação tem feito o mapeamento das zonas onde os pangolins são encontrados e onde há tráfico
- claim: RTP reports that more than 50 pangolins have been rescued since 2024.
  url: https://www.rtp.pt/noticias/mundo/ex-cacadores-tornam-se-guardioes-da-floresta-e-ajudam-a-salvar-pangolins-em-angola_n1752675
