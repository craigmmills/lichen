  quote: O projeto está a ser desenvolvido pela Fundação Cuerama, que ganhou o mesmo nome da aldeia do
    Cuanza Sul onde está instalada
- claim: RTP reports that the foundation has been mapping the areas where pangolins are found and where
    there is trafficking.
