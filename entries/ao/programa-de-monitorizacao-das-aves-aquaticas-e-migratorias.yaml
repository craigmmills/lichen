facts:
- claim: INBAC says the waterbird and migratory bird monitoring programme is one of
    its regular activities, studying distribution, habitat change and population trends.
  url: https://inbac.gov.ao/Site/noticiais/95
  fetched: 2026-11-12
  quote: O programa de monitorização das aves aquáticas e migratórias faz parte das
    atividades regulares do INBAC e visa estudar a distribuição dessas aves no território
    Angolano
- claim: INBAC says the programme's data will be used to prepare the International
    Waterbird Census report for Angola.
  url: https://inbac.gov.ao/Site/noticiais/95
  fetched: 2026-11-12
  quote: Elaboração do Relatório do Censo Internacional de Aves Aquáticas (IWC) –
    contabilizando a população de aves aquáticas em Angola
- claim: INBAC reports an estimated total of 43,224 birds in a coastal census at sites
    in Namibe, Luanda and Bengo, but the same page gives a conflicting count of more
    than 200,000 birds at Baía dos Tigres alone.
  url: https://www.inbac.gov.ao/Site/noticiais/142
  fetched: 2026-11-12
  quote: O Censo de Aves Aquáticas Migratórias realizado de 17 a 25 deste mês na zona
    costeira do País, registou números animadores, com um total estimado de cerca
    de 43.224 aves contadas.
