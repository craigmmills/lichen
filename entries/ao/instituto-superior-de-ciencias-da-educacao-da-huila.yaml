  database of Huíla's woody species.
facts:
- claim: Its organic statute, approved by Presidential Decree 305/21, defines it as
    a legal person under public law with the nature of a public institute.
  url: https://lex.ao/docs/presidente-da-republica/2021/decreto-presidencial-n-o-305-21-de-16-de-dezembro/
  fetched: 2026-11-15
  quote: é uma pessoa colectiva de direito público com a natureza de Instituto Público
    e classificado como estabelecimento público
- claim: The statute places its seat in the city of Lubango, Huíla province.
  url: https://lex.ao/docs/presidente-da-republica/2021/decreto-presidencial-n-o-305-21-de-16-de-dezembro/
  fetched: 2026-11-15
  quote: tem a sua sede na Cidade do Lubango, Província da Huíla
- claim: The 2021 database report for the vegetation-plot database of Huíla's woody
    species names ISCED-Huíla as the database owner.
  url: https://zenodo.org/records/5225485/files/VCS_article_68916.pdf
