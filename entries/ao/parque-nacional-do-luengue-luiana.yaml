summary: National park where Peace Parks Foundation reported training 15 rangers and
  two advisors in SMART and CyberTracker in 2018, and where the Ministry reports 25
  animal collars with remote monitoring planned.
facts:
- claim: Peace Parks Foundation reported in July 2018 that it had trained 15 of the
    park's field rangers and two technical advisors in SMART, including CyberTracker
    on mobile devices for patrol data collection.
  url: https://www.peaceparks.org/smart-training-for-clever-conservation-management/
  fetched: 2026-11-12
  quote: The rangers, as well as two technical advisors, were trained in using SMART
    - which includes the use of CyberTracker running on mobile devices to collect
    data while on patrol.
- claim: In its July 2018 training report, Peace Parks said field rangers' data helped
    monitor wildlife movement and poaching activity in the area.
  url: https://www.peaceparks.org/smart-training-for-clever-conservation-management/
  fetched: 2026-11-12
  quote: The collated data obtained from rangers in the field assists with monitoring
    the movement of wildlife and poaching activity in the area.
- claim: The Ministry of Environment reports 25 collars fitted to elephants, giraffes,
    buffalo, zebras and some carnivores in the park, with remote monitoring planned
    from an operations room in Luanda.
  url: https://minamb.gov.ao/web/noticias/ministerio-do-ambiente-realiza-operacao-de-monitoramento-da-vida-selvagem-no-parque-nacional-do-luengue-luiana
  fetched: 2026-11-12
  quote: Foram colocadas 25 coleiras em elefantes, girafas, búfalos, zebras e alguns
    carnívoros, com o objectivo de aprimorar o monitoramento dessas espécies em seu
    habitat natural.
