  quote: Cidade do Kilamba, Quarteirão Mini Lukene, Edifício Q11
- claim: Publishes a camera-trap dataset from a survey of large and medium mammals that it carried out
    in Quiçama National Park in 2017.
  url: https://api.gbif.org/v1/organization/7ba6190f-1fcd-4092-9b58-3c166e093127/publishedDataset?limit=10
  fetched: 2026-11-08
  quote: This is a camera trap dataset from a large and medium sized mammal survey carried out by the
    National Institute for Biodiversity and Conservation Areas of Angola (INBAC)
- claim: Publishes a bird dataset for Quiçama National Park gathered during the same 2017 mammal survey
    with the RWCP Angolan team.
  url: https://api.gbif.org/v1/organization/7ba6190f-1fcd-4092-9b58-3c166e093127/publishedDataset?limit=10
  fetched: 2026-11-08
  quote: The present dataset is a result of collateral data gathered during a mammal survey conducted
    by INBAC and RWCP Angolan team between June and September 2017.
