summary: Public institution under Angola's Ministry of Environment, set up in 2011, that manages the national
  protected areas network, monitors wildlife and publishes 2017 Quiçama National Park datasets.
facts:
- claim: Its statute sets its purpose as drafting and carrying out sustainable biodiversity management
    policy and the National Environmental Conservation System.
  url: https://lex.ao/docs/presidente-da-republica/2024/decreto-presidencial-n-o-175-24-de-24-de-julho/
  fetched: 2026-11-08
  quote: O INBAC tem como objecto assegurar a elaboração e a execução da política de gestão sustentável
    da biodiversidade e do Sistema Nacional de Conservação do Ambiente.
- claim: Its statute gives it the task of monitoring wild fauna and flora and ecosystems.
  url: https://lex.ao/docs/presidente-da-republica/2024/decreto-presidencial-n-o-175-24-de-24-de-julho/
  fetched: 2026-11-08
  quote: r)- Assegurar serviços de monitorização e manuseamento das espécies da fauna e flora selvagem
    e dos ecossistemas;
- claim: Its statute gives it the annual national report on the state of Angola's biodiversity.
  url: https://lex.ao/docs/presidente-da-republica/2024/decreto-presidencial-n-o-175-24-de-24-de-julho/
  fetched: 2026-11-08
  quote: s)- Elaborar e apresentar o relatório nacional anual sobre o Estado da Biodiversidade de Angola;
- claim: Its statute sets up a department for monitoring wild fauna and flora.
  url: https://lex.ao/docs/presidente-da-republica/2024/decreto-presidencial-n-o-175-24-de-24-de-julho/
  fetched: 2026-11-08
  quote: d)- Departamento de Monitoria da Fauna e Flora Selvagem.
- claim: Its site lists a March 2024 migratory bird monitoring event for the red-footed falcon in Huambo,
    and news of a migratory waterbird count and monitoring programme in Namibe.
  url: https://inbac.gov.ao/
  fetched: 2026-11-08
  quote: Monitorização das Aves Migratórias (Falcão de Pés Vermelhos)
- claim: Its site gives an address in Kilamba, Luanda.
  url: https://inbac.gov.ao/
  fetched: 2026-11-08
  quote: INBAC | Angola - Luanda, cidade do Kilamba, Avenida Paiva Domingos da Silva nº 11
- claim: Its GBIF publisher record describes it as a public institution within Angola's Ministry of Environment.
  url: https://api.gbif.org/v1/organization/7ba6190f-1fcd-4092-9b58-3c166e093127
  fetched: '2026-11-08'
  quote: The National Institute for Biodiversity and Protected Areas (INBAC) is a public institution within
    the Ministry of Environment of the Republic of Angola
- claim: Its GBIF publisher record says it was set up in 2011 to coordinate national biodiversity conservation
    policy and manage the national protected areas network.
  url: https://api.gbif.org/v1/organization/7ba6190f-1fcd-4092-9b58-3c166e093127
  fetched: '2026-11-08'
  quote: to ensure the implementation and coordination of the National Biodiversity Conservation Policies
    and the Management of the National Protected Areas Network
- claim: Its site lists a news item on a migratory waterbird count and monitoring programme in Namibe.
  url: https://inbac.gov.ao/
  fetched: '2026-11-08'
  quote: Namibe acolhe Programa de Contagem e Monitorização de Aves Aquáticas Migratórias
- claim: Peace Parks Foundation calls it the Angolan Government's conservation agency.
  url: https://www.peaceparks.org/creating-space-angola-and-a-new-future-for-the-largest-elephant-population-in-the-world/
  fetched: '2026-11-08'
  quote: The Angolan Government, through its conservation agency INBAC, is taking concrete steps to strengthen
    protection, governance and community benefits in Luengue-Luiana
- claim: Its duties include carrying out biodiversity conservation policy and managing the national protected
    areas network.
  url: https://api.gbif.org/v1/organization/7ba6190f-1fcd-4092-9b58-3c166e093127
  fetched: 2026-11-08
  quote: To execute policies and strategies in the domain of biodiversity conservation and management
