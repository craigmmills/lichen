summary: Forest elephant project led by Fundação Kissama, with BIOPOLIS reporting US$1.2 million from
  the Elephant Crisis Fund for expansion from three to eight provinces where they may persist.
facts:
- claim: Fundação Kissama's site says the project aims to improve scientific knowledge of forest elephants,
    promote their protection and reduce conflict with local communities.
  url: https://fundacaokissama.co.ao/
  fetched: 2026-11-08
  quote: O objectivo primordial é de contribuir para a conservação dos elefantes-da-floresta em Angola,
    melhorando o conhecimento científico
- claim: BIOPOLIS says the Elephant Crisis Fund's US$1.2 million will let the project expand from three
    provinces to all eight where forest elephants may persist, and that CIBIO contributes expertise in
    biodiversity monitoring, wildlife ecology and conservation genetics.
  url: https://www.biopolis.pt/en/news-and-events/angola-portugal-partnership-strengthens-protection-of-the-country-s-last-forest-elephants/
  fetched: 2026-11-08
  quote: CIBIO contributes scientific expertise, particularly in biodiversity monitoring, wildlife ecology
    and conservation genetics
