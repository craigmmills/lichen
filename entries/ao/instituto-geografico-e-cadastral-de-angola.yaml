summary: Government body overseen by the Ministry of Public Works and Territorial Planning, acting as
  national mapping and cadastre authority and developing the National Geographic Information System, based
  in Luanda.
facts:
- claim: Its statute, approved by Presidential Decree 115/21, sets its purpose as regulating and carrying
    out the government's geographic and cadastral policy nationally.
  url: https://lex.ao/docs/presidente-da-republica/2021/decreto-presidencial-n-o-115-21-de-04-de-maio/
  fetched: 2026-11-08
  quote: O Instituto Geográfico e Cadastral de Angola tem como objecto assegurar a regulamentação e execução
    da política do Executivo, nos domínios geográfico e cadastral a nível nacional.
- claim: Its geographic information department is charged with coordinating and developing the National
    Geographic Information System.
  url: https://lex.ao/docs/presidente-da-republica/2021/decreto-presidencial-n-o-115-21-de-04-de-maio/
  fetched: 2026-11-08
  quote: e)- Assegurar a coordenação e o desenvolvimento do Sistema Nacional de Informação Geográfica
    no País;
- claim: The statute places its seat in Luanda.
  url: https://lex.ao/docs/presidente-da-republica/2021/decreto-presidencial-n-o-115-21-de-04-de-maio/
  fetched: 2026-11-08
  quote: O IGCA tem a sua sede em Luanda, e desenvolve a sua actividade em todo o território nacional
- claim: Acts as the National Mapping and Cadastre Authority and develops and coordinates the National
    Geographic Information System.
  url: https://www.igca.gov.ao
  fetched: 2026-11-08
  quote: tem como objetivo exercer a função de Autoridade Nacional de Cartografia e Cadastro, desenvolver
    e coordenar o Sistema Nacional de Informação Geográfica
