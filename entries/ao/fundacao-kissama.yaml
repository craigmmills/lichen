summary: Foundation working with World Land Trust and others on Angolan conservation, including forest
  elephant distribution work from 2019, Projecto Nzau, and Morro do Moco forest conservation since 2022.
facts:
- claim: World Land Trust says it became the implementing institution for the Giant Sable Conservation
    Project's scientific research and environmental education in 2010.
  url: https://www.worldlandtrust.org/partner/fundacao-kissama/
  fetched: 2026-11-08
  quote: Fundação Kissama has a long history with the Giant Sable Conservation Project, becoming the implementing
    institution of the project’s scientific research and environmental education actions in 2010.
- claim: World Land Trust says it began a project in 2019 in Bengo and Cuanza-Norte to determine where
    forest elephants are distributed.
  url: https://www.worldlandtrust.org/partner/fundacao-kissama/
  fetched: 2026-11-08
  quote: Fundação Kissama began a new project in 2019, focused on the provinces of Bengo and Cuanza-Norte,
    that will aim to determine the geographic distribution zones of Forest Elephants.
- claim: Its site says Projecto Nzau has been developed since 2019 by the foundation with the Ministry
    of Environment, through the biodiversity institute, and the Angolan armed forces; it prints the institute
    acronym as INBC.
  url: https://fundacaokissama.co.ao/
  fetched: 2026-11-08
  quote: O Projecto tem vindo a ser desenvolvido desde 2019, pela Fundação Kissama em parceria com o Ministério
    do Ambiente
- claim: Its site says that since 2022 it has worked on the Morro do Moco Afromontane forest conservation
    project, with tree planting and fire protection, supported by World Land Trust.
  url: https://fundacaokissama.co.ao/
  fetched: 2026-11-08
  quote: A Fundação Kissama desde 2022 tem trabalhado para a implementação do Projecto com apoio da World
    Land Trust.
