- claim: The Wadden Sea Flyway Initiative's 2020 census report says the 2020 count
    in Angola was coordinated by Bioconserv.
  url: https://flyway.waddensea-worldheritage.org/sites/default/files/2022-06/2020_Flyway%20census%20report.pdf
