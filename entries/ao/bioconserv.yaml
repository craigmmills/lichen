summary: Angolan NGO working mainly with wetland birds, which coordinated Angola's
  2020 waterbird count and, per EcoAngola, helped identify over 30 sites important
  to migratory birds; it drew up a management plan for Ilhéu dos Pássaros, awaiting
  approval in October 2020.
facts:
