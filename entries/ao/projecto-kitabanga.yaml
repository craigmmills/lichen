facts:
- claim: Fundação Kissama's site says the project has existed since 2003 and is carried out by the biology
    department of the Faculty of Sciences at Agostinho Neto University.
  url: https://fundacaokissama.co.ao/
  fetched: 2026-11-08
  quote: existe desde 2003 e é implementado pelo Departamento de Biologia da Faculdade de Ciências da
    Universidade Agostinho Neto
- claim: World Land Trust says it works directly on 104 km of coast, about 6% of Angola's coastline, from
    17 bases in six of the seven coastal provinces.
  url: https://www.worldlandtrust.org/partner/fundacao-kissama/
  fetched: 2026-11-08
  quote: It currently has an area of direct action covering 104 km, or approximately 6% of Angola’s coastline
    in 17 bases covering 6 out of the 7 coastal provinces.
- claim: Fundação Kissama's site says university staff, students and local community members take part
    in its research, conservation and environmental education.
  url: https://fundacaokissama.co.ao/
  fetched: 2026-11-08
  quote: O projecto conta com a participação de docentes e estudantes universitários, bem como com o envolvimento
    de membros das comunidades locais onde tem vindo a exercer as suas actividades de investigação, conservação
    e educação ambiental.
