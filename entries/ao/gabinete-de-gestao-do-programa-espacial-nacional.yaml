summary: Office established in 2013 under MINTTICS to manage the National Space Programme, launching Observa+
  in June 2026, with ANGEO-1 launch attendance reported by Space in Africa.
facts:
- claim: Space in Africa reports that senior GGPEN officials were in the Angolan delegation at the launch
    of the ANGEO-1 satellite project at Airbus Defence and Space in Toulouse.
  url: https://spaceinafrica.com/2026/03/16/minister-mario-oliveira-presides-over-kick-off-of-angeo-1-satellite-development-in-france/
  fetched: 2026-11-08
  quote: The high-level delegation included senior officials from the Gabinete de Gestão do Programa Espacial
    Nacional (GGPEN)
- claim: Space in Africa describes ANGEO-1, whose development and construction began in March 2026, as
    the country’s first satellite dedicated specifically to Earth observation.
  url: https://spaceinafrica.com/2026/03/16/minister-mario-oliveira-presides-over-kick-off-of-angeo-1-satellite-development-in-france/
  fetched: 2026-11-08
  quote: As the country’s first satellite dedicated specifically to Earth observation
- claim: Set up in 2013 to manage and follow the development of the National Space Programme.
  url: https://ggpen.gov.ao
  fetched: 2026-11-08
  quote: O Gabinete de Gestão do Programa Espacial Nacional (GGPEN) foi criado, em 2013, para gerir e
    acompanhar o desenvolvimento do Programa Espacial Nacional.
- claim: Overseen by the Ministry of Telecommunications, Information Technology and Social Communication
    (MINTTICS).
  url: https://ggpen.gov.ao
  fetched: 2026-11-08
  quote: Superintendido pelo Ministério das Telecomunicações, Tecnologias de Informação e Comunicação
    Social (MINTTICS)
- claim: Says it offers satellite solutions and space applications using high-resolution satellite imagery
    with artificial intelligence.
  url: https://ggpen.gov.ao
  fetched: 2026-11-08
  quote: Soluções via satélite e desenvolvimento de aplicações espaciais com o uso de imagens de satélite
    de alta resolução com recurso a inteligência artificial.
- claim: Its office is in the Clássicos de Talatona administrative complex, Luanda.
  url: https://ggpen.gov.ao
  fetched: 2026-11-08
  quote: Complexo Administrativo Clássicos de Talatona
- claim: With MINTTICS, Airbus and the Luanda provincial government, it launched Observa+ in June 2026,
    a container with Earth observation data and territorial analysis tools that the page says could support
    decisions in areas including the environment and natural resource management.
  url: https://ggpen.gov.ao/solucoes/observa
  fetched: 2026-11-08
  quote: disponibilizando dados geoespaciais que poderão apoiar a tomada de decisões em áreas como agricultura,
    ambiente, ordenamento do território, gestão de recursos naturais
