  url: https://www.acadir.org
  fetched: 2026-11-08
  quote: The Association for the Conservation of the Environment and Integrated Rural Development (ACADIR
    - Associação de Conservação do Ambiente e Desenvolvimento Integrado Rural ) is the first and only
    locally-led NGO
- claim: Recruits and trains resource monitors and rangers from the community.
  url: https://www.acadir.org/natural-resource-management
  fetched: 2026-11-08
  quote: To help protect wildlife populations, ACADIR recruits and trains resource monitors and rangers
    from the community.
- claim: Its monitors and rangers are trained in wildlife data collection, the use of technology and wildlife
    movement tracking.
  url: https://www.acadir.org/natural-resource-management
  fetched: 2026-11-08
  quote: The monitors and rangers receive training in wildlife data collection, the use of technology,
