facts:
- claim: In October 2024, the national park administration for the Schleswig-Holstein
    Wadden Sea, seated in Tönning, was one of six departments of the state enterprise
    LKN.SH in Husum.
  url: https://www.schleswig-holstein.de/DE/landesregierung/ministerien-behoerden/LKN/Presse/Pressemeldungen/2024/bester_nationalpark
  fetched: '2026-11-17'
  quote: Die Nationalparkverwaltung ist einer von sechs Geschäftsbereichen des in
    Husum ansässigen Landesbetriebs für Küstenschutz, Nationalpark und Meeresschutz
    (LKN.SH).
- claim: An October 2024 release describes the Schleswig-Holstein Wadden Sea National
    Park, founded in 1985, as covering 4,380 square kilometres and forming part of
    the UNESCO World Heritage Wadden Sea; Michael Kruse then led its administration.
  url: https://www.schleswig-holstein.de/DE/landesregierung/ministerien-behoerden/LKN/Presse/Pressemeldungen/2024/bester_nationalpark
  fetched: '2026-11-17'
  quote: Mit einer Fläche von 4.380 Quadratkilometern ist das schleswig-holsteinische
    Wattenmeer der größte Nationalpark Mitteleuropas.
