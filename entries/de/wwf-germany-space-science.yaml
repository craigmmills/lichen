facts:
- claim: Describes its work as applying geospatial technologies to conservation of
    ecosystems worldwide.
  url: https://space-science.wwf.de/
  fetched: 2026-11-22
  quote: We apply state-of-the-art geo-spatial technologies to drive conservation
    of ecosystems worldwide.
- claim: Its remote sensing work covers vegetation, coral reef, seagrass and mangrove
    mapping and deforestation detection.
  url: https://space-science.wwf.de/expertise/
  fetched: 2026-11-22
  quote: classification for vegetation mapping as well as underwater habitats (coral
    reef and seagrass), mangrove mapping and detection of deforestation and degradation.
- claim: Its projects page reports that WWF Germany collected airborne LiDAR data
    to create a national forest carbon map for the Democratic Republic of Congo.
  url: https://space-science.wwf.de/projects/
  fetched: 2026-11-22
  quote: WWF-Germany collected more than 400,000 hectares of airborne LiDAR data to
    sample the largest forest area in central Africa, creating a national-scale forest
    carbon map at 1 ha resolution for the Democratic Republic of Congo
- claim: Its projects page reports that WWF Germany supports land cover monitoring
    in the Kavango-Zambezi Transboundary Conservation Area.
  url: https://space-science.wwf.de/projects/
  fetched: 2026-11-22
  quote: WWF-Germany is supporting land cover monitoring in the Kavango-Zambezi Transboundary
    Conservation Area
