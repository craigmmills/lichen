summary: Foundation founded by Hamburg in 2010 for Lower Elbe biodiversity and the
  tidal Elbe's ecological state, which had a stone barrier removed at Wrauster Bogen
  and fully financed bank protection lowering at five places at Juelssand.
facts:
- claim: Founded in 2010 by Hamburg, it works for biodiversity of the Lower Elbe and
    the ecological state of the tidal Elbe.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/themen/naturschutz/stiftung-elbe-171688
  fetched: '2026-11-17'
  quote: Die im Jahr 2010 von der Freien und Hansestadt Hamburg gegründete Stiftung
    Lebensraum Elbe setzt sich umfassend für die biologische Vielfalt der Unterelbe
    ein.
- claim: Had a stone barrier removed from a tidal creek at the Wrauster Bogen so that
    fish could return to the Elbe.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/themen/naturschutz/stiftung-elbe-171688
  fetched: '2026-11-17'
  quote: Die Stiftung Lebensraum Elbe ließ diese Barriere entfernen
- claim: Fully financed a project that lowered bank protection at five places at Juelssand
    so that water could reach the hinterland again.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/themen/naturschutz/stiftung-elbe-171688
  fetched: '2026-11-17'
  quote: Bei Juelssand wurden sie an fünf Stellen abgesenkt – das Wasser kann wieder
    das Hinterland erreichen.
