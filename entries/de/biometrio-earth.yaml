summary: Saarbrücken company that reported on biodiversity in nature-based projects from camera
  trap, audio and satellite data using AI. A co-founder's page says it decided not to continue
  the business.
facts:
- claim: A co-founder says it used AI and machine learning pipelines to identify animals recorded
    by field sensors.
  url: https://erickpam.dedyn.io/projects.html
  quote: We utilised artificial intelligence (AI) and machine learning (ML) processing pipelines
    to identify the animals captured by sensor installed in the field.
  fetched: '2026-10-31'
- claim: A co-founder says the company decided not to continue the business because of financial
    challenges. An October 2025 University of Freiburg release still names it as a partner
    in AI National Park.
  url: https://erickpam.dedyn.io/projects.html
  quote: Due to financial challenges, biometrio.earth decided not to continue with the business.
  fetched: '2026-10-31'
