summary: Biodiversity portal and social network for nature observers that went online in February
  2008 as a digital field book, with the NABU federal association as a strategic partner since
  2016.
facts:
- claim: Went online in February 2008 as a digital field book.
  url: https://nabu-naturgucker.de/wp-content/uploads/2024/04/NaturGarten_Intensiv-Citizen_Science_beim_Artenschutz_im_Siedlungsraum-240302-Wirth.pdf
  quote: im Februar 2008 als „digitales Feldbuch“ naturgucker.de
  fetched: '2026-10-31'
- claim: A talk lists an AI identification tool for insects.
  url: https://nabu-naturgucker.de/wp-content/uploads/2024/04/NaturGarten_Intensiv-Citizen_Science_beim_Artenschutz_im_Siedlungsraum-240302-Wirth.pdf
  quote: KI-Bestimmungswerkzeug für Insekten
  fetched: '2026-10-31'
- claim: Runs a reporting portal for observations of animals, plants and fungi from around
    the world.
  url: https://nabu-naturgucker.de/
  fetched: '2026-10-31'
  quote: Auf unserem Meldeportal können Beobachtungen, Bilder und Videos von Tieren, Pflanzen
    und Pilzen aus der ganzen Welt dokumentiert werden
- claim: Says it has passed 400, 000 active users.
  url: https://nabu-naturgucker.de/
  fetched: '2026-10-31'
  quote: Über 400.000 Aktive
- claim: Listed as a citizen science project on the mit:forschen! platform.
  url: https://www.mitforschen.org/index.php/projekt/nabunaturgucker
  fetched: '2026-10-31'
  quote: NABU|naturgucker | mit:forschen!
- claim: A non-profit cooperative that runs a reporting portal for nature observations.
  url: https://nabu-naturgucker.de/wp-content/uploads/2026/07/PM-260723-Deutschlands_groesste_Online-Community_fuer_Naturbegeisterte_waechst_weiter.pdf
  fetched: '2026-10-31'
  quote: Mit dem Meldeportal für Naturbeobachtungen, der NABU|naturgucker-Akademie und zahlreichen
    Mitmachaktionen hat die gemeinnützige Genossenschaft
- claim: More than 350,000 people were active by July 2026.
  url: https://nabu-naturgucker.de/wp-content/uploads/2026/07/PM-260723-Deutschlands_groesste_Online-Community_fuer_Naturbegeisterte_waechst_weiter.pdf
  fetched: '2026-10-31'
  quote: Inzwischen sind über 350 000 Menschen aktiv.
- claim: The portal began in February 2008 as naturgucker.de.
  url: https://nabu-naturgucker.de/wp-content/uploads/2025/01/PM_Meilenstein_NABUnaturgucker-250000-Aktive.pdf
  fetched: '2026-10-31'
  quote: Angefangen hat das Meldeportal am 7. Februar 2008 als naturgucker.de.
