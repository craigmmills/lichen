summary: Open-source, modular model built by the University of Stuttgart and WildCap
  that re-identifies known individual animals in real time from coat patterns, tested
  on six datasets.
facts:
- claim: Re-identifies individual wild animals in real time from their unique coat
    pattern, provided they are already in its reference database.
  url: https://idw-online.de/de/news873198
  fetched: '2026-11-07'
  quote: Auf diese Weise können wir neu beobachtete Tiere in Bruchteilen von Sekunden
    identifizieren, vorausgesetzt sie sind in der Referenzdatenbank gespeichert
- claim: Open source and modular, so rangers or research groups can build it into
    their own drones, camera traps, airships or other monitoring devices.
  url: https://idw-online.de/de/news873198
  fetched: '2026-11-07'
  quote: Das KI-Instrument ist open-source verfügbar und modular aufgebaut.
- claim: Tested on six datasets, including new zebra images from drones in Mpala,
    Kenya, and jaguar images from foundation camera traps in Ecuador; the page names
