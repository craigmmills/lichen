summary: Association whose Naturschutzstation Malchow, per the Berlin environment
  senate, cares for the Falkenberger Rieselfelder reserve, where it has run a grazing
  project since 1998, and which operates two environmental education centres.
facts:
- claim: The Berlin environment senate names the Naturschutzstation Malchow as the
    body that cares for the Falkenberger Rieselfelder nature reserve.
  url: https://www.berlin.de/sen/uvk/natur-und-gruen/naturschutz/schutzgebiete/pflege-und-entwicklung/
  fetched: '2026-11-17'
  quote: So erfolgt die Pflege des NSG Falkenberger Rieselfelder durch die Naturschutzstation
    Malchow
- claim: Has run a grazing project in the Falkenberger Rieselfelder nature reserve
    since 1998 to keep the typical sewage-field structures.
  url: https://www.berlin.de/sen/uvk/natur-und-gruen/naturschutz/schutzgebiete/pflege-und-entwicklung/
  fetched: '2026-11-17'
  quote: Im NSG Falkenberger Rieselfelder wird seit 1998 ein Beweidungsprojekt von
    der Naturschutzstation Malchow durchgeführt.
- claim: Two environmental education centres, the Naturhof in Malchow and the Naturschutzzentrum
    Schleipfuhl, operate under the association.
  url: https://www.naturschutz-malchow.de/
  fetched: '2026-11-17'
  quote: Unter dem Dach des Vereins Naturschutz Berlin-Malchow e.V. haben sich zwei
    Umweltbildungs-Einrichtungen entwickelt
