summary: BiodivKI project developing an analysis portal for monitoring data from citizen science
  and sensors.
facts:
- claim: Named by Projektträger Jülich among the nine BiodivKI consortia.
  url: https://www.ptj.de/veroeffentlichungen/aktuelles/kuenstliche-itelligenz-fuer-die-artenvielfalt-gefoerderte-forschungsprojekte-starten
  quote: AI4WildLIVE entwickelt ein Analyseportal für Monitoringdaten aus Citizen Science
    und Sensorik.
  fetched: '2026-10-31'
- claim: Combines AI with citizen science on camera trap data.
  url: https://www.feda.bio/de/forschung/biodivki/ai4wildlive/
  fetched: '2026-10-31'
  quote: Das WildLIVE-Portal kombiniert künstliche Intelligenz mit Bürgerwissenschaft, um
    die Biodiversitätsforschung durch automatisierte Analyse von Kamerafallen-Daten voranzutreiben
- claim: Plans a public portal that archives and analyses video, audio and geodata from biodiversity
    monitoring, with citizen science, tied to Senckenberg's research data infrastructure.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Im Projekt AI4WildLIVE sollen große Datenmengen aus unterschiedlichen Biodiversitäts-Monitorings
    zusammengeführt, archiviert und öffentlich zugänglich gemacht werden.
- claim: Listed with a funding period of 1 November 2023 to the end of October 2024 under
    the BiodivKI funding measure.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Projektlaufzeit 01.11.2023 bis 31.10.2024
