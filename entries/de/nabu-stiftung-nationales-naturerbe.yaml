facts:
- claim: An undated NABU overview says the foundation buys valuable conservation land
    across Germany and reports over 16,200 hectares in its care.
  url: https://www.nabu.de/wir-ueber-uns/organisation/stiftung-nationales-naturerbe/index.html
  fetched: '2026-11-17'
  quote: Schon über 16.200 Hektar Natur befinden sich in der Obhut der NABU-Stiftung.
- claim: Names projects including the 1,930-hectare former opencast mine at Grünhaus
    in Niederlausitz, Wittwesee in the Stechlin-Ruppiner Land and Heerter See near
    Salzgitter.
  url: https://www.nabu.de/wir-ueber-uns/organisation/stiftung-nationales-naturerbe/index.html
  fetched: '2026-11-17'
  quote: Bedeutende Naturschutzprojekte der Stiftung sind das 1.930 Hektar große,
    ehemalige Tagebaugebiet Grünhaus in der Niederlausitz
- claim: Says about 27,400 hectares in over 450 protected areas are in its care across
    Germany, with more than 1,000 hectares of forest wilderness bought in the Südharz
    in 2025.
  url: https://naturerbe.nabu.de/
  fetched: '2026-11-17'
  quote: Rund 27.400 Hektar in bundesweit über 450 Schutzgebieten sind in Obhut der
    NABU-Stiftung Nationales Naturerbe.
