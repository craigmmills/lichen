facts:
- claim: Its protected-area documentation has recorded and analysed all available data on
    protected areas in Lower Saxony centrally for more than 25 years, and publishes them in
    print, maps and online.
  url: https://www.nlwkn.niedersachsen.de/naturschutz/schutzgebiete/-43802.html
  fetched: '2026-11-07'
  quote: In der Schutzgebietsdokumentation im NLWKN werden seit mehr als 25 Jahren systematisch
    alle verfügbaren Daten und Informationen zu Schutzgebieten und -objekten in Niedersachsen
    landesweit zentral erfasst und ausgewertet
- claim: Gives its address in Hannover.
  url: https://www.nlwkn.niedersachsen.de/naturschutz/schutzgebiete/-43802.html
  fetched: '2026-11-07'
  quote: D-30453 Hannover
- claim: Its nature stations look after and develop their protected areas.
  url: https://www.nlwkn.niedersachsen.de/naturschutzstationen/naturschutzstationen-als-aussenstellen-des-nlwkn-46116.html
  fetched: '2026-11-07'
  quote: Die Naturschutzstationen gewährleisten eine sehr erfolgreiche Betreuung und Entwicklung
    der jeweiligen Schutzgebiete.
- claim: Names six nature stations, at Dümmer, Ems, Fehntjer Tief, Unterelbe, Wendland-Drawehn
    and Wümme, in regions with large nature reserves.
  url: https://www.nlwkn.niedersachsen.de/naturschutzstationen/naturschutzstationen-als-aussenstellen-des-nlwkn-46116.html
