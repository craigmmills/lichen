summary: BiodivKI project using acoustic sensors to recognise species.
facts:
- claim: Named by Projektträger Jülich among the nine BiodivKI consortia.
  url: https://www.ptj.de/veroeffentlichungen/aktuelles/kuenstliche-itelligenz-fuer-die-artenvielfalt-gefoerderte-forschungsprojekte-starten
  quote: BioIntAkt arbeitet mit akustischen Sensoren zur Erkennung von Arten.
  fetched: '2026-10-31'
- claim: Aims to build an intelligent sensor system using AI.
  url: https://www.feda.bio/de/forschung/biodivki/biointakt/
  fetched: '2026-10-31'
  quote: Ziel ist es, ein intelligentes Sensorsystem zu entwickeln, welches mittels Methoden
    der künstlichen Intelligenz autonom und selbstlernend die taxonomische Einordnung und
    Zählung von Insektenarten
- claim: Develops a sensor system that uses AI to count and classify insects from the sounds
    they make.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Im Projekt BioIntAkt soll ein intelligentes Sensor-Systems entwickelt werden, welches
    mittels KI autonom die Zählung und taxonomische Einordnung von Insekten anhand ihrer erzeugten
    Geräusche vornehmen kann.
- claim: Listed with a funding period of 1 November 2023 to the end of October 2024 under
    the BiodivKI funding measure.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Projektlaufzeit 01.11.2023 bis 31.10.2024
