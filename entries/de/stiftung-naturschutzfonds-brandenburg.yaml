facts:
- claim: The Naturwacht rangers work in 15 Nationale Naturlandschaften of Brandenburg
    (one national park, three biosphere reserves, eleven nature parks) on about 9,750
    square kilometres, carrying out nature and species protection measures.
  url: https://www.naturschutzfonds.de/ueber-uns/naturwacht
  fetched: '2026-11-17'
  quote: Sie setzen in 15 Nationalen Naturlandschaften – einem Nationalpark, drei
    Biosphärenreservaten und elf Naturparken – zahlreiche Natur- und Artenschutzmaßnahmen
    um und kontrollieren deren Erfolg.
- claim: The Naturwacht has worked under the foundation's roof since 1997.
  url: https://www.naturschutzfonds.de/ueber-uns/naturwacht
  fetched: '2026-11-17'
  quote: Seit 1997 arbeitet die Naturwacht unter dem Dach der Stiftung NaturSchutzFonds
    Brandenburg.
- claim: The Naturwacht has been given the care of the habitats-directive (FFH) areas
    in the large protected areas.
  url: https://www.naturschutzfonds.de/ueber-uns/naturwacht
  fetched: '2026-11-17'
  quote: Der Naturwacht wurde für die FFH-Gebiete in den Großschutzgebieten die Betreuung
    übertragen.
- claim: The Naturwacht is testing automated analysis of bat ultrasound recordings
    from listening boxes.
  url: https://www.naturschutzfonds.de/ueber-uns/naturwacht
  fetched: '2026-11-17'
  quote: Die Naturwacht testet aktuell die Erfassung des Fledermaus-Artenbestandes
