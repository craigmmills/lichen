summary: Hamburg institute presenting the city's nine-station water quality monitoring network,
  and, per Hamburg's environment senator, bringing sensor and measurement expertise to SIMON.
facts:
- claim: Its pages present the Hamburg water quality monitoring network, with nine measuring
    stations on the Elbe and the Alster, Bille, Wandse, Ammersbek and Tarpenbek.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/hu/umweltuntersuchungen/wasseruntersuchungen/wgmn-startseite-160582
  fetched: '2026-11-07'
  quote: In Hamburg gibt es zur Zeit neun Messstationen an der Elbe und den Nebengewässern
    Alster, Bille, Wandse, Ammersbek und Tarpenbek.
- claim: The stations record oxygen, pH, conductivity, turbidity and temperature automatically
    and continuously.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/hu/umweltuntersuchungen/wasseruntersuchungen/wgmn-startseite-160582
  fetched: '2026-11-07'
  quote: werden die chemisch-physikalischen Messgrößen Sauerstoffgehalt, pH-Wert, Leitfähigkeit,
    Trübung und Temperatur automatisch und kontinuierlich rund um die Uhr erfasst.
- claim: Five stations also run a biological early warning system for toxic substances.
  url: https://www.hamburg.de/politik-und-verwaltung/behoerden/bukea/hu/umweltuntersuchungen/wasseruntersuchungen/wgmn-startseite-160582
  fetched: '2026-11-07'
  quote: wird darüber hinaus ein Biologisches Frühwarnsystem betrieben, das giftige Wasserinhaltsstoffe
    aufspüren kann.
- claim: Hamburg's environment senator says it brings long expertise in sensor technology
    and measurement programmes to SIMON.
  url: https://www.hafen-hamburg.de/en/press1/news/launch-of-the-simon-research-project/
  fetched: '2026-11-07'
  quote: the Institute for Hygiene and Environment, with its many years of expertise in developing
    modern sensor technology and measurement programmes, is making an important contribution
    to the success of the project
