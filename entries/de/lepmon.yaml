summary: BiodivKI project from 2023 to 2027 developing an automated recorder for nocturnal
  insects (ARNI) that photographs moths at night, with AI to identify them, for use across
  Germany.
facts:
- claim: Develops an automated recorder that attracts and photographs nocturnal insects, with
    AI identifying the moths.
  url: https://lepmon.de/en
  quote: To this end, we are developing an automated recorder for nocturnal insects (ARNI),
    which attracts and photographs the animals at night.
  fetched: '2026-10-31'
- claim: Aims at a practical system for automated nationwide monitoring of nocturnal insects.
  url: https://www.feda.bio/de/forschung/biodivki/biodivki-lepmon/
  fetched: '2026-10-31'
  quote: Ziel des Projektes ist es, ein praxistaugliches System für ein bundesweites, automatisiertes
    Monitoring nachtaktiver Insekten zu entwickeln
- claim: Develops nationwide automated monitoring of nocturnal insects with automatic camera
    traps.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Im Projekt LEPMON wird ein bundesweites, automatisiertes Monitoring nachtaktiver
    Insekten auf der Basis von automatischen Kamerafallen entwickelt.
- claim: Listed with a funding period of 1 November 2023 to the end of October 2024 under
    the BiodivKI funding measure.
  url: https://www.fona.de/medien/pdf/PSB_FONA_BiodivKI_final.pdf
  fetched: '2026-10-31'
  quote: Projektlaufzeit 01.11.2023 bis 31.10.2024
- claim: Aims to build a practical system for nationwide automated monitoring of nocturnal
    insects.
  url: https://inf-cv.uni-jena.de/home/research/lepmon/
  fetched: '2026-10-31'
  quote: The aim of the project is to develop a practical system for nationwide, automated
    monitoring of nocturnal insects in order to reliably document population changes.
- claim: Image data from the ARNI camera systems are analysed with AI.
  url: https://www.uni-marburg.de/de/aktuelles/news/2026/citizen-science-macht-nachtfalter-sichtbar
  fetched: '2026-10-31'
  quote: Die so gewonnenen Bilddaten werden mithilfe künstlicher Intelligenz ausgewertet und
    kontinuierlich verbessert.
- claim: The LIB sub-project provides data management and the web portal.
  url: https://leibniz-lib.de/en/research/projects/lepmon.html
  fetched: '2026-10-31'
  quote: develops the infrastructure for data management, provides the web portal
- claim: Runs from 2023 to 2027, according to the Computer Vision Group Jena.
  url: https://inf-cv.uni-jena.de/home/research/lepmon/
  fetched: '2026-10-31'
  quote: 'Time period: 2023 to 2027'
