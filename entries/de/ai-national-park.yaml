summary: Monitoring system with camera traps, audio loggers and climate loggers, supported
  by AI, being installed in 13 German national parks and two wilderness areas from 2025 to
  2027.
facts:
- claim: Installed in 13 German national parks and two wilderness areas since summer 2025.
  url: https://nachrichten.idw-online.de/2025/10/16/the-ai-national-park-project-digital-innovations-for-environmental-protection-and-nature-conservation
  quote: has been installed in 13 German national parks and two wilderness areas since summer
    2025
  fetched: '2026-10-31'
- claim: AI systems evaluate data automatically, identifying species and human disturbances.
  url: https://nachrichten.idw-online.de/2025/10/16/the-ai-national-park-project-digital-innovations-for-environmental-protection-and-nature-conservation
  quote: Their task is to automatically evaluate large amounts of data, identify species and
    human disturbances
  fetched: '2026-10-31'
- claim: Installed since summer 2025 in 13 national parks and two wilderness areas.
  url: https://uni-freiburg.de/projekt-ki-nationalpark-digitale-innovationen-fuer-umwelt-und-naturschutz/
  fetched: '2026-10-31'
  quote: seit Sommer 2025 im Rahmen des Projekt „KI-Nationalpark“ in 13 deutschen Nationalparken
    und zwei Wildnisgebieten installiert
- claim: Measurement sites use wildlife cameras and audio recorders.
  url: https://uni-freiburg.de/projekt-ki-nationalpark-digitale-innovationen-fuer-umwelt-und-naturschutz/
  fetched: '2026-10-31'
  quote: hier erfassen Wildtierkamera und Audiorekorder Daten zur Artenvielfalt und Umweltveränderungen
- claim: The environment ministry funds it with 1.8 million euros.
  url: https://uni-freiburg.de/projekt-ki-nationalpark-digitale-innovationen-fuer-umwelt-und-naturschutz/
  fetched: '2026-10-31'
  quote: in der Förderlinie „KI-Leuchttürme“ mit 1,8 Millionen Euro
- claim: Runs from 2025 to 2027 in 13 national parks and two wilderness areas.
  url: https://www.nationalpark-harz.de/de/aktuelles/2025/2025_12_08_KI%20Nationalpark/?js=false&page-style=schwarz
  fetched: '2026-10-31'
  quote: Das Projekt „KI-Nationalpark" läuft von 2025 bis 2027 in 13 Nationalparken und 2
    Wildnisgebieten in ganz Deutschland.
