summary: Research on animal tags with on-board AI, a camera and satellite communication,
  developed by Leibniz-IZW and Fraunhofer IIS and tested on vultures at Tierpark Berlin
  and in Namibia as an early warning of ecological change.
facts:
- claim: The tags will carry sensor-based AI, a camera, energy-efficient electronics
    and satellite communication.
  url: https://idw-online.de/en/news801156
  quote: The tags will be equipped with sensor-based artificial intelligence (AI),
    a camera, energy-efficient electronics and satellite-based communication technology.
  fetched: '2026-10-31'
- claim: Fraunhofer IIS says it joined with the Leibniz-IZW in the initiative to build
    a high-tech early warning system.
  url: https://www.iis.fraunhofer.de/de/ff/kom/satkom/satellite_iot/gaia-initiative.html
  fetched: '2026-10-31'
  quote: haben wir uns mit dem Leibniz-Institut für Zoo- und Wildtierforschung (IZW)
    in der GAIA-Initiative zusammengeschlossen.
- claim: GAIA-MISSION develops and launches two CubeSats to collect data from tagged
    animals.
  url: https://www.iis.fraunhofer.de/de/ff/kom/satkom/satellite_iot/gaia-initiative.html
  fetched: '2026-10-31'
  quote: Im Projekt GAIA-MISSION entwickeln und starten wir zwei CubeSats zur satellitengestützten
    Erfassung von IoT-Daten besenderter Tiere.
