facts:
- claim: The draft CBD country profile says the State Academy of Sciences carried out the NBSAP update;
    the profile dates the update to 2012.
  url: https://www.cbd.int/countries/profile/?country=kp
  fetched: 2026-11-12
  quote: Notably, the update of the NBSAP was carried out by the State Academy of Sciences (SAOS).
- claim: An HSF Korea article dated 11 April 2024 names the State Academy of Science among the bodies
    that research bird reserves and survey waterbirds in winter and on migration.
  url: https://korea.hss.de/en/news/biodiversitaet-in-der-dvr-korea-die-bedeutung-der-umwandlung-regionaler-biodiversitaet-fuer-globale-klimaschutzmassnahmen-news11226/
  fetched: 2026-11-12
  quote: Actors like the DPR Korean Ministry of Land and Environment Protection (MoLEP), the National
    Conservation Union of Korea and the State Academy of Science engage in research to support the DPRK
    in establishing bird reserves, conducting surveys of waterbirds during winter and migration
