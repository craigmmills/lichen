summary: National NGO and IUCN member since January 1963, which in 2014 agreed with the Pūkorokoro Miranda
  Naturalists' Trust to hold shorebird surveys along the West Sea coast from 2015.
facts:
- claim: IUCN lists it in the National NGO membership category.
  url: https://iucn.org/node/33956
  fetched: 2026-11-12
  quote: National NGO
- claim: IUCN lists it as a member since January 1963.
  url: https://iucn.org/node/33956
  fetched: 2026-11-12
  quote: Jan, 1963
- claim: A 2015 survey report says NCUK and the Pūkorokoro Miranda Naturalists' Trust signed an agreement
    in Pyongyang in 2014 for a series of shorebird surveys along the West Sea coast starting in 2015.
  url: https://shorebirds.org.nz/?p=2563
  fetched: 2026-11-12
  quote: In 2014 a joint agreement was signed in Pyongyang between the Nature Conservation Union of Korea
    (NCUK) and (PMNT) to expand on this work with a series of shorebird surveys along the West Sea coast
    starting in 2015.
- claim: The report says three PMNT members joined NCUK staff for a three-day survey in May 2015, at sites
    NCUK selected.
  url: https://shorebirds.org.nz/?p=2563
  fetched: 2026-11-12
  quote: From 5-7 May 2015 three members from PMNT joined NCUK staff to complete a three-day survey timed
    to make use of high spring tides.
- claim: An HSF Korea article dated 11 April 2024 names it, as the National Conservation Union of Korea,
    among the bodies that research bird reserves and survey waterbirds in winter and on migration.
  url: https://korea.hss.de/en/news/biodiversitaet-in-der-dvr-korea-die-bedeutung-der-umwandlung-regionaler-biodiversitaet-fuer-globale-klimaschutzmassnahmen-news11226/
  fetched: 2026-11-12
  quote: Actors like the DPR Korean Ministry of Land and Environment Protection (MoLEP), the National
    Conservation Union of Korea and the State Academy of Science engage in research to support the DPRK
    in establishing bird reserves, conducting surveys of waterbirds during winter and migration
