summary: Closed joint survey, run by the Nature Conservation Union of Korea and the Pūkorokoro Miranda
  Naturalists' Trust, that counted 20,635 shorebirds of 31 species at three sites on 5-7 May 2015.
facts:
- claim: The report says 20,635 shorebirds of 31 species were counted at three sites, two of them identified
    as internationally important.
  url: https://shorebirds.org.nz/?p=2563
  fetched: 2026-11-12
  quote: A total of 20,635 shorebirds were recorded at three sites, two of which were identified as being
    internationally important.
- claim: The survey was completed on 5-7 May 2015.
  url: https://shorebirds.org.nz/?p=2563
  fetched: 2026-11-12
  quote: From 5-7 May 2015 three members from PMNT joined NCUK staff to complete a three-day survey timed
    to make use of high spring tides.
