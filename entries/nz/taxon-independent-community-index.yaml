  url: https://www.wilderlab.co
  fetched: 2026-11-07
  quote: Innovations like our Taxon-Independent Community Index (TICI) turn complex DNA data into meaningful
    measures of freshwater health.
- claim: Callaghan Innovation describes TICI as giving a health rating for an entire ecosystem from eDNA
    data.
  url: https://www.callaghaninnovation.govt.nz/stories/dna-detectives
