summary: Free desktop classifier for acoustic recordings, built by DOC and Weka Research, that classifies
  about 80 species and involves work on machine learning training data.
facts:
- claim: A free desktop classifier for acoustic recordings that classifies about 80 species, with work
    on machine learning training data.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: Development of a free to use desktop classifier ‘Kaytoo’ for processing acoustic recordings.
    Kaytoo is able to classify approximately 80 species.
- claim: Classifies about 80 species from acoustic recordings, with work on machine learning training
    data.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/our-work/science-and-innovation/
  fetched: 2026-11-07
  quote: Kaytoo is able to classify approximately 80 species. Work has also included improvements to training
    data for machine learning related to acoustic recordings.
