summary: Kiwi conservation group whose monitoring plan calls for acoustic Kiwi Listening
  Blitzes every five years; its first, in 2016, detected kiwi calls at 31 of 48 sites
  surveyed.
facts:
- claim: In February 2020, Kiwi Coast Trust said its monitoring plan called for a
    Kiwi Listening Blitz using acoustic monitoring devices every five years.
  url: https://kiwicoast.org.nz/kiwi-coast-news/second-kiwi-listening-blitz-underway/
  fetched: 2026-11-13
  quote: In accordance with it’s overall monitoring plan Kiwi Coast Trust carries
    out a ‘Kiwi Listening Blitz’ using acoustic monitoring devices or Kiwi Listening
    Devices (KLDs) every five years.
- claim: The first blitz, completed in 2016, detected kiwi calls at 31 of 48 sites
    surveyed.
  url: https://kiwicoast.org.nz/kiwi-coast-news/second-kiwi-listening-blitz-underway/
  fetched: 2026-11-13
  quote: Results from the first blitz detected kiwi calls at 31 of the 48 sites surveyed
    (~65%) with a mean calls per hour rate of 0.57.
- claim: In February 2024, its crew joined a Whakatāne team to survey the kiwi population
    of Moturoa Island, locating 52 kiwi in eight days.
  url: https://kiwicoast.org.nz/kiwi-coast-news/moturoa-island-kiwi-survey/
  fetched: 2026-11-13
  quote: However, the teams successfully located 52 kiwi in just eight days.
