summary: A project run by Wildlife.ai with DOC as partner, using citizen science via Zooniverse
  and machine learning to classify baited underwater video from the Tapuae Marine Reserve.
facts:
- claim: DOC rangers take baited underwater videos inside and outside the Tapuae Marine Reserve
    to monitor fish populations.
  url: https://toifoundation.org.nz/story/wildlife-ai/
  fetched: 2026-11-07
  quote: Department of Conservation (DOC) rangers take Baited Underwater Videos (BUV) inside
    and outside the reserve to monitor fish populations.
- claim: Classification of the footage is streamlined through citizen science and machine
    learning in Wildlife.ai's Spyfish Aotearoa project.
  url: https://toifoundation.org.nz/story/wildlife-ai/
  fetched: 2026-11-07
  quote: The Wild about AI programme helps to streamline the classification process through
    citizen science and machine learning in their Spyfish Aotearoa project.
- claim: DOC said in May 2021 that volunteers watched 10-second clips from its marine reserve
    surveys and identified and counted species.
  url: https://www.doc.govt.nz/news/media-releases/2021-media-releases/citizen-scientists-train-artificial-intelligence-for-healthy-oceans/
  fetched: 2026-11-07
  quote: Within the Spyfish website, volunteers watch 10-second video clips to identify and
    count the species they see.
- claim: DOC said in 2021 that it was being used to train artificial intelligence software
    to identify and count species.
  url: https://www.doc.govt.nz/news/media-releases/2021-media-releases/citizen-scientists-train-artificial-intelligence-for-healthy-oceans/
  fetched: 2026-11-07
  quote: Spyfish Aotearoa is also being used to train artificial intelligence software.
