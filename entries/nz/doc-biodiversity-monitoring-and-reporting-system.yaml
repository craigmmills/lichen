summary: A DOC-built and DOC-run programme giving consistent biodiversity information
  across public conservation lands, with Tier 1 sampling since late 2011 at locations
  8 km apart, partnering with the Ministry for the Environment.
facts:
- claim: Provides DOC and others with consistent information about biodiversity across
    public conservation lands.
  url: https://dxcprod.doc.govt.nz/monitoringreporting
  fetched: 2026-11-09
  quote: The Biodiversity Monitoring and Reporting System provides DOC and others
    with consistent, comprehensive information about biodiversity across public conservation
    lands, and potentially across New Zealand.
- claim: Tier 1 sampling, started in late 2011, assesses selected native species and
    pests at locations 8 km apart, except where a site falls in a river or lake.
  url: https://dxcprod.doc.govt.nz/monitoringreporting
  fetched: 2026-11-09
  quote: The sampling programme, which started in late 2011, involves the regular
    assessment of a selection of native species and pests at locations 8 km apart
    and spaced evenly across the landscape
- claim: Tier 1 sampling is part of a collaborative research programme on rapid biodiversity
    assessment with DNA techniques.
  url: https://dxcprod.doc.govt.nz/monitoringreporting
  fetched: 2026-11-09
  quote: The Tier 1 sampling programme is part of a collaborative research programme
    investigating rapid biodiversity assessment using DNA techniques
