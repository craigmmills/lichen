summary: Formed on 1 July 2025 by the merger of NIWA and GNS Science, it lists AI, machine
  learning and data science among its purposes, and ecosystem stewardship too.
facts:
- claim: Formed when NIWA merged with GNS Science on 1 July 2025.
  url: https://niwa.co.nz/news/going-easy-scallops
  fetched: 2026-11-07
  quote: On 1 July 2025, NIWA merged with GNS Science to become Earth Sciences New Zealand
    .
- claim: A May 2022 NIWA article described fisheries scientist James Williams working with
    University of Canterbury experts on non-invasive scallop surveys, using underwater images
    to design detection algorithms.
  url: https://niwa.co.nz/news/going-easy-scallops
  fetched: 2026-11-07
  quote: The images were then used by data scientists in designing algorithms to detect the
    scallops.
- claim: Formed on 1 July 2025 by the merger of GNS Science and NIWA.
  url: https://earthsciences.nz/about-us
  fetched: 2026-11-07
  quote: On 1 July 2025, GNS Science and NIWA – both internationally recognised research organisations
    – merged to create Earth Sciences New Zealand.
- claim: Lists the stewardship of ecosystems and biodiversity among its purposes.
  url: https://earthsciences.nz/about-us
  fetched: 2026-11-07
  quote: enhance the stewardship of ecosystems and biodiversity
- claim: Lists advanced technology, AI, machine learning and data science among its purposes,
    for resilience and risk management.
  url: https://earthsciences.nz/about-us
  fetched: 2026-11-07
  quote: enhance resilience and risk management through advanced technology, AI, machine learning
    and data science
- claim: In a UK Research and Innovation-funded trial, its researchers and Plymouth Marine
    Laboratory mapped suspended sediment and phytoplankton from 60-metre Sentinel-2 imagery
    in four New Zealand coastal test areas between 2016 and 2025.
  url: https://earthsciences.nz/news/new-approach-to-monitor-our-coasts-via-uk-satellite-collaboration
  fetched: 2026-11-07
  quote: Working with the Plymouth Marine Laboratory, the team of researchers have trialled
    60-m resolution satellite imagery to get a better picture of these events
- claim: GBIF lists it as a publisher with an address in Auckland.
  url: https://api.gbif.org/v1/organization/c58ac019-b413-4613-8772-39e57acbeb8e
  fetched: 2026-11-07
  quote: '"address":["82 Wyndham Street, Auckland Central","Private Bag 99940 Newmarket"]'
- claim: In 2022, before the merger, NIWA analysed nearly 20 years of satellite images for
    a DOC report on suspended sediment in coastal waters.
  url: https://www.doc.govt.nz/news/media-releases/2022-media-releases/satellites-reveal-nzs-coastal-health/
  fetched: 2026-11-07
  quote: In a new report commissioned by DOC, NIWA analysed satellite images to measure changes
    in suspended sediment
- claim: Established on 1 July 2025 by the merger of GNS Science and NIWA.
  url: https://earthsciences.nz/
  fetched: 2026-11-07
  quote: Established 1 July 2025 by the merger of GNS Science and NIWA, and incorporating
    the scientific expertise and research services provided by both organisations.
- claim: Says its science supports the management of fisheries stocks through ecosystem-based
    tools, advice and methods.
  url: https://earthsciences.nz/science/oceans/wild-fisheries
  fetched: 2026-11-07
  quote: Our science supports international and New Zealand management of fisheries stocks,
    to better understand the sustainability of key fisheries species.
- claim: Its researchers, with Yokohama National University, analysed a subset of Auckland
    Council's long-term estuary monitoring data.
  url: https://earthsciences.nz/news/tiny-creatures-living-in-our-estuaries-are-having-a-big-impact-on-eco-system-health
  fetched: 2026-11-07
  quote: The project team included researchers from Earth Sciences New Zealand and Yokohama
    National University in Japan. Working together, they analysed a subset of Auckland Council’s
    monitoring data
