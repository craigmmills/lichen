summary: An active DOC-run programme that in July 2024 was reported to allocate $1 million a year to predator-free
  tools and to have funded 15 projects since 2017.
facts:
- claim: DOC reported in July 2024 that the programme allocated $1 million a year to new tools for predator-free
    projects and had funded 15 projects since 2017, including lures, toxins, traps and predator detection
    devices.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: Since 2017, 15 projects have been funded including new lures, toxins, traps and predator detection
    devices.
- claim: In July 2024, a DOC manager said Tools to Market supported the development of tools and technology
    for Predator Free 2050.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: DOC Landscape Threats Science Manager Clayson Howell says ‘Tools to Market’ supports innovation
    to develop the tools and technology to help achieve Predator Free 2050.
- claim: The DOC AI CAM and PredaCAM were two of five projects selected in its 2022 round.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: These projects were two of five selected for support in the Tools to Market 2022 procurement
    round.
