summary: A company whose AI self-resetting trap targets predators and whose OWL camera recognises
  species, with long-range thermal detection systems in development.
facts:
- claim: Developed an AI self-resetting trap that activates only when it detects a target
    predator.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: An AI self-resetting trap only activates when it detects a target predator. It does
    not trigger on native species, pets or other animals. This trap was developed by Critter
    Solutions.
- claim: Makes the OWL AI camera, a trail camera with onboard species recognition.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: AI equipped trail cameras with onboard species recognition and remote communication
    capabilities, for real-time species detection at landscape scale.
- claim: Developing long-range thermal detection systems for predator surveillance.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: Developing long-range thermal detection systems for surveillance of predators.
