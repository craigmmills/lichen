summary: Wellington kiwi project, led by Paul Ward, whose founder says it uses acoustic monitors
  with AI helping to analyse results, alongside tracking tunnels, trail cameras and DNA to
  identify stoats.
facts:
- claim: In September 2026, The Spinoff reported that the final monitoring transmitters had
    been removed from the 250 kiwi released around Wellington.
  url: https://thespinoff.co.nz/society/06-09-2026/it-was-10-years-of-work-all-in-one-moment-wellingtons-kiwi-are-now-truly-free-range
  fetched: 2026-11-13
  quote: 'The Capital Kiwi Project has just marked a major milestone: the final monitoring
    transmitters have been removed from the 250 kiwi released in the hills around Wellington.'
- claim: Its founder says it monitors the kiwi population with acoustic monitors, with AI
    helping to analyse the results.
  url: https://thespinoff.co.nz/society/06-09-2026/it-was-10-years-of-work-all-in-one-moment-wellingtons-kiwi-are-now-truly-free-range
  fetched: 2026-11-13
  quote: We also do population monitoring with acoustic monitors, to listen for kiwi calls.
    AI helps to analyse the results.
- claim: It continues stoat monitoring with tracking tunnels and trail cameras.
  url: https://thespinoff.co.nz/society/06-09-2026/it-was-10-years-of-work-all-in-one-moment-wellingtons-kiwi-are-now-truly-free-range
  fetched: 2026-11-13
  quote: We’re continuing with tracking tunnels and trail cameras to look for stoats.
- claim: When it catches stoats it uses DNA to tell residents from invaders.
  url: https://thespinoff.co.nz/society/06-09-2026/it-was-10-years-of-work-all-in-one-moment-wellingtons-kiwi-are-now-truly-free-range
  fetched: 2026-11-13
  quote: When we do catch stoats, we use DNA to find out if it’s a resident stoat or an invader.
