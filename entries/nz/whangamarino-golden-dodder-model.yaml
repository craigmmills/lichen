summary: A trial model built by Fabian Döweler recognises golden dodder in Whangamarino wetland
  satellite images; DOC was able to request six specific images, including near-infrared wavelengths.
facts:
- claim: A trial project used machine learning to develop a model that recognises golden dodder
    in satellite images of the Whangamarino wetland.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/satellite-trial-puts-focus-on-pest-plant/
  fetched: 2026-11-07
  quote: the trial project, undertaken by specialist contractor Fabian Döweler (Bushcraft
    Analytics), has used machine learning to develop a computer model able to recognise golden
    dodder within satellite images of the wetland.
- claim: DOC said it was able to request six specific satellite images of Whangamarino from
    vendors to support the work.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/satellite-trial-puts-focus-on-pest-plant/
  fetched: 2026-11-07
  quote: DOC was able to request six specific satellite images of Whangamarino from various
    vendors to support the work.
- claim: The images include near-infrared wavelengths.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/satellite-trial-puts-focus-on-pest-plant/
  fetched: 2026-11-07
  quote: including near-infrared (NIR) wavelengths, which are particularly useful in identifying
    golden dodder from other wetland vegetation.
