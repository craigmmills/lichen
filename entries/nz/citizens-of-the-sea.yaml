facts:
- claim: Brings seafarers and scientists together to collect biodiversity and environmental
    observations from remote waters.
  url: https://www.citizensofthesea.org/
  fetched: 2026-11-07
  quote: Citizens of the Sea brings seafarers and scientists together to collect biodiversity
    and environmental observations from remote, under-sampled waters.
- claim: Says it is sending 24 citizen scientist crews across the Southwest Pacific to collect
    eDNA in 2026.
  url: https://www.citizensofthesea.org/
  fetched: 2026-11-07
  quote: This year we’re sending off 24 Citizen Scientist crews across the Southwest Pacific
- claim: Began as a partnership between Cawthron Institute and New Zealand Geographic and
    is now an independent charitable trust.
  url: https://www.citizensofthesea.org/
  fetched: 2026-11-07
  quote: Citizens of the Sea began as a partnership between Cawthron Institute and New Zealand
    Geographic. Today it is an independent charitable trust that still benefits from the input
    of its founding partners.
- claim: Says 27 vessels in its 2024 Pacific Rally sampled eDNA from around 1.5 million km²
    using a TorpeDNA sampler, with samples analysed at the Cawthron Institute.
  url: https://www.citizensofthesea.org/news/citizen-sailors-map-pacific-biodiversity
  fetched: 2026-11-07
  quote: During the 2024 Pacific Rally, 27 vessels sampled eDNA from around 1.5 million km²
- claim: Says the 728 surface samples were taken to the Cawthron Institute for laboratory
    analysis.
  url: https://www.citizensofthesea.org/news/citizen-sailors-map-pacific-biodiversity
  fetched: 2026-11-07
  quote: This generated 728 surface samples that were transported, chilled, to the Cawthron
    Institute in Aotearoa New Zealand for laboratory analysis
