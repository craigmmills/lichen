facts:
- claim: Its network of 500 cameras produces about 380,000 images a year, and AI cameras were
    due to begin field trials to detect reinvaders, as of July 2024.
  url: https://www.pfw.org.nz/resources/news/new-technology-boosting-predator-free-fight/
  fetched: 2026-11-07
  quote: AI cameras are also due to begin field trials. These will simplify the time consuming
    task of trawling through the 380,000-odd images produced annually by the network of 500
    cameras to detect any re-invaders and identify animals.
- claim: Trialling PredaCAM at Mount Victoria, according to DOC in 2024.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
