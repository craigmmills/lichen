summary: An open source non-profit building DOC AI cameras and partnering with DOC; its manager
  reports AI predator identification, and DOC reported camera use on Motutapu in July 2024.
facts:
- claim: Developed the DOC AI camera used by the Department of Conservation to detect predators.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: Smart tools like the DOC AI camera help us quickly detect predators. The camera was
    developed by the Cacophony Project.
- claim: Its camera uploads recordings to cloud servers where AI identifies invasive predators
    and notifies users in real time, according to its programme manager in a DOC release.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: This automatically uploads recordings to Cacophony’s cloud servers where AI automatically
    identifies all invasive predators and then notifies users in real-time.
- claim: Developing a high interaction rate trap paired with the DOC AI camera, under DOC's
    Predator Free 2050 science programme.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/goal-tactics-and-new-technology/tools-to-market
  fetched: 2026-11-07
  quote: High interaction rate trap (HIRT) and DOC AI cam improvements (Cacophony Project
    Ltd)
- claim: Describes itself as a non-profit, open source organisation developing hardware, software
    and analysis tools.
  url: https://www.cacophony.org.nz
  fetched: 2026-11-07
  quote: We are a non-profit, open source organisation using open source tools to develop
    hardware, software and analysis solutions.
- claim: Asks volunteers to annotate recordings on its Monitoring Platform to help train its
    machine learning models.
  url: https://www.cacophony.org.nz/about
  fetched: 2026-11-07
  quote: Another great way to help is by annotating recordings on Monitoring Platform to help
    train our machine learning models.
- claim: DOC said in July 2024 that two DOC AI CAM cameras were in use in the incursion response
    on Motutapu.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: Two DOC AI CAM cameras are being used in the incursion response underway on pest
    free Motutapu in the Hauraki Gulf after a rat was spotted
