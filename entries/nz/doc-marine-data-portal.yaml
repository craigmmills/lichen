facts:
- claim: In December 2021 DOC made public more than 300 marine data layers and an
    interactive map tool to visualise, analyse and download them.
  url: https://insidegovernment.co.nz/doc-mapping-opens-portal-into-marine-life/
  fetched: 2026-11-09
  quote: The Department of Conservation (DOC) has made public more than 300 marine
    data layers and an interactive map tool to visualise, analyse, and download them,
    it announced today.
- claim: The layers include distribution models for species such as sharks and rays,
    corals and sponges, and fish.
  url: https://insidegovernment.co.nz/doc-mapping-opens-portal-into-marine-life/
  fetched: 2026-11-09
  quote: The data layers include distribution models for species such as sharks and
    rays, corals and sponges, and popular fish such as snapper and reef fish.
- claim: New Zealand's seventh national report to the Convention on Biological Diversity
    lists it among data platforms.
