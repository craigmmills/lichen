status: active
summary: A pilot run by DOC with One New Zealand, with first sensors installed in early April 2026 in
  three national parks and around 50 smart sensors planned, plus trials of smart traps and trail cameras.
facts:
- claim: In April 2026, DOC said the pilot would install around 50 smart sensors in toilets, huts and
    wastewater systems and would trial smart traps and trail cameras for remote pest monitoring.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/remote-tech-begins-a-new-era-for-conservation/
  fetched: 2026-11-07
  quote: The pilot will also trial the use of smart traps and trail cameras, to remotely control and monitor
    pests.
- claim: The first sensors were installed in early April 2026 in Mt Aspiring, Fiordland and Tongariro
    National Parks.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/remote-tech-begins-a-new-era-for-conservation/
  fetched: 2026-11-07
  quote: The first sensors of the pilot programme were installed in early April, with rollout focused
    on high-use and logistically complex sites across the Mt Aspiring, Fiordland, and Tongariro National
    Parks.
