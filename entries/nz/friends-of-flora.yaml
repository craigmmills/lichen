facts:
- claim: Between 2010 and 2016 the community group Friends of Flora Inc., in partnership
    with the Department of Conservation, translocated 44 roroa to the Flora Stream
    area, and volunteers tracked each by radio-telemetry for two to eight years.
  url: https://predatorfreenz.org/?p=9656
  fetched: 2026-11-15
  quote: Each kiwi was fitted with a VHF transmitter and, for the next 2-8 years,
    volunteers monitored their locations by radio-telemetry.
- claim: The monitoring ended in May 2018, when the transmitters were removed.
  url: https://predatorfreenz.org/?p=9656
  fetched: 2026-11-15
  quote: Monitoring continued until May 2018
- claim: Fieldwork was done by Friends of Flora volunteers with two part-time contracted
    ecologists.
