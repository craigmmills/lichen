summary: DOC-run programme, funded by Meridian Energy, that says it develops new technology for kākāpō,
  including smart transmitters on every bird and long-range data loggers sending data by satellite.
facts:
- claim: Says it develops and uses new technology to manage kākāpō.
  url: https://www.doc.govt.nz/our-work/kakapo-recovery/what-we-do/technology/
  fetched: 2026-11-07
  quote: We develop and use new technology to manage kākāpō.
- claim: Every kākāpō wears a smart transmitter that reports position, survival and battery.
  url: https://www.doc.govt.nz/our-work/kakapo-recovery/what-we-do/technology/
  fetched: 2026-11-07
  quote: Every kākāpō wears a smart transmitter that sends out a radio signal.
- claim: Long-range data loggers pick up transmitter signals and send the data by satellite.
  url: https://www.doc.govt.nz/our-work/kakapo-recovery/what-we-do/technology/
  fetched: 2026-11-07
  quote: They record the information and send it to us via satellites.
