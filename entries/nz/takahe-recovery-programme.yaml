summary: A DOC-run programme in which many adult takahē wear smart transmitters, and
  a GPS-equipped aircraft, the Sky Ranger, flies a grid over the mountains logging
  each bird's location and state.
facts:
- claim: Many adult takahē wear smart transmitters whose radio signals show each bird's
    location and state.
  url: https://www.doc.govt.nz/our-work/takahe-recovery-programme/helping-takahe/takahe-research/
  fetched: 2026-11-12
  quote: Many of the adult birds wear small smart transmitters. These transmitters
    send out radio signals that show the bird's location.
- claim: An aircraft fitted with a GPS receiver, the Sky Ranger, flies a grid over
    the mountains and logs the location and state of each bird.
  url: https://www.doc.govt.nz/our-work/takahe-recovery-programme/helping-takahe/takahe-research/
  fetched: 2026-11-12
  quote: The plane flies a grid pattern over the mountains, which logs the location
    and state of each bird.
- claim: Works with other DOC species programmes and international suppliers to develop
    and test new transmitters.
  url: https://www.doc.govt.nz/our-work/takahe-recovery-programme/helping-takahe/takahe-research/
  fetched: 2026-11-12
  quote: We’re working with other DOC species programmes and international suppliers
    to develop and test new transmitters to get better data faster.
