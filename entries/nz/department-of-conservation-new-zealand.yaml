- claim: Leads New Zealand's national biodiversity strategy and action plan and reports on
    progress towards it.
  url: https://www.doc.govt.nz/about-us/international-agreements/ecosystems/convention-on-biological-diversity/
  fetched: 2026-11-07
  quote: DOC leads the development of New Zealand’s national biodiversity strategy and action
    plan, and reports on New Zealand’s progress towards it.
- claim: Says the National Parks Act 1980 and the Conservation Act 1987 guide its work.
  url: https://www.doc.govt.nz/about-us/our-role/
  fetched: 2026-11-07
  quote: The Conservation Act 1987, National Parks Act 1980 and other key legislation guide
    DOC's work.
- claim: DOC reported in May 2021 that it conducted annual monitoring surveys with baited
    cameras in marine reserves.
  url: https://www.doc.govt.nz/news/media-releases/2021-media-releases/citizen-scientists-train-artificial-intelligence-for-healthy-oceans/
  fetched: 2026-11-07
  quote: The underwater footage on Spyfish Aotearoa is from monitoring surveys that DOC conducts
    in marine reserves each year.
- claim: A 2026 trial for DOC used machine learning on high-resolution satellite images to
    find golden dodder in the Whangamarino wetland.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/satellite-trial-puts-focus-on-pest-plant/
  fetched: 2026-11-07
  quote: has used machine learning to develop a computer model able to recognise golden dodder
    within satellite images of the wetland.
- claim: In July 2024, DOC said its Tools to Market programme allocated $1 million annually
    to develop tools for predator-free projects, including AI predator detection cameras.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: the DOC programme allocates $1 million annually to support the development of new
    tools for use in predator-free projects.
- claim: In 2026, DOC said it and the Ministry for Primary Industries were funding the development
    of remote sensing methods for New Zealand forests using deep learning.
  ai_type: deep-learning
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/kakapo-early-beneficiary-of-high-tech-deep-learning/
  fetched: 2026-11-07
  quote: The technology uses deep learning to synthesise multiple layers of complex information
    and turn it into simple, usable data on forests.
- claim: In March 2026 an AI-equipped trail camera in DOC's biosecurity network detected a
    rat on Ulva Island.
  url: https://www.doc.govt.nz/news/media-releases/2026-media-releases/rat-detections-on-predator-free-island-highlights-importance-of-biosecurity-network/
  fetched: 2026-11-07
  quote: A further rat was then detected by an AI-equipped trail camera located toward the
    eastern end of Ulva Island on Friday, 13 March.
- claim: Describes its role as managing New Zealand's natural and cultural heritage.
  url: https://www.doc.govt.nz/about-us/our-role/
  fetched: 2026-11-07
  quote: How we manage New Zealand's natural and cultural heritage, legislation we work with,
    our history and corporate publications.
- claim: Enforces laws that protect New Zealand's biodiversity.
  url: https://www.doc.govt.nz/about-us/our-role/
  fetched: 2026-11-07
  quote: DOC enforces laws that protect New Zealand's biodiversity and historic heritage,
    as well as the Taupō Trout Fishery.
