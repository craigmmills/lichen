summary: New Zealand's government conservation agency, which runs the Tools to Market programme,
  funds ASG Technologies, partners with Wildlife AI, and in 2026 trialled machine learning
  on satellite images to find golden dodder.
facts:
- claim: Leads the development of New Zealand's national biodiversity strategy and action
    plan, and reports on New Zealand's progress towards it.
  url: https://doc.govt.nz/about-us/international-agreements/convention-on-biological-diversity
  fetched: 2026-11-07
  quote: DOC leads the development of New Zealand’s national biodiversity strategy and action
    plan, and reports on New Zealand’s progress towards it.
- claim: Enforces laws that protect New Zealand's biodiversity and historic heritage.
  url: https://doc.govt.nz/about-us/our-role
  fetched: 2026-11-07
  quote: DOC enforces laws that protect New Zealand's biodiversity and historic heritage,
    as well as the Taupō Trout Fishery.
- claim: In July 2024, DOC said its Tools to Market programme allocated $1 million annually
    to developing new tools for predator-free projects.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: the DOC programme allocates $1 million annually to support the development of new
    tools for use in predator-free projects
- claim: GBIF describes it as the New Zealand government agency charged with conserving natural
    and historic heritage, at Conservation House in Wellington.
  url: https://api.gbif.org/v1/organization/1bfac9af-cc42-4b4f-9d9c-1b456dd804d3
  fetched: 2026-11-07
  quote: The Department of Conservation (DOC) is the NZ government agency charged with conserving
    New Zealand's natural and historic heritage.
- claim: Its GBIF record gives an address in Wellington.
  url: https://api.gbif.org/v1/organization/1bfac9af-cc42-4b4f-9d9c-1b456dd804d3
