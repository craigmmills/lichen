facts:
- claim: A programme of work to measure and monitor national carbon stocks in New Zealand's forests and
    soils, as described by Interpine in 2015.
  url: https://interpine.nz/lucas-national-pre-1990-forest-inventory-survey-2015-2/
  fetched: 2026-11-07
  quote: The New Zealand Land Use and Carbon Analysis System (known as the LUCAS project) is a programme
    of work to measure and monitor the national level carbon stocks of New Zealand’s forests and soils.
- claim: As described in August 2015, its planted forest carbon monitoring used permanent plots on a national
    4 km grid; natural forests had been inventoried on an 8 km grid.
  url: https://interpine.nz/lucas-national-pre-1990-forest-inventory-survey-2015-2/
  fetched: 2026-11-07
  quote: Sample points are located on a 4km grid across the country.
