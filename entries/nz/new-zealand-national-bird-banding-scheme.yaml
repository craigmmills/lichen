  url: https://www.doc.govt.nz/our-work/bird-banding
  fetched: 2026-11-09
  quote: The National Bird Banding Office manages New Zealand’s bird banding programme.
    It trains and certifies banders, supplies bands and equipment, and maintains the
    national database of bird banding records.
- claim: Over 1.4 million birds of 241 species have been banded in New Zealand since
    1947.
  url: https://www.doc.govt.nz/our-work/bird-banding/why-band-birds/
  fetched: 2026-11-09
  quote: Since the first banding schemes started in 1947, over 1.4 million birds from
    241 different species have been banded throughout New Zealand.
- claim: Its data are kept at DOC's National Banding Office in Wellington and made
    available to researchers.
  url: https://www.doc.govt.nz/our-work/bird-banding/why-band-birds/
  fetched: 2026-11-09
  quote: All data collected for this scheme are kept at the National Banding Office,
    Department of Conservation, Wellington and are made available to researchers and
    ornithologists.
