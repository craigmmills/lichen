summary: Crown-owned charitable company established in 2016 that funded the rat AI model behind
  PredaCAM, and is closed, with its work absorbed into DOC following the 2025/26 budget decision.
facts:
- claim: A Crown-owned charitable company established in 2016 that co-funded large-scale predator
    elimination projects and worked with companies on technical solutions for predator control,
    according to the New Zealand Conservation Authority.
  url: https://www.doc.govt.nz/about-us/statutory-and-advisory-bodies/nz-conservation-authority/submissions/submission-on-predator-free-2050/
  fetched: 2026-11-07
  quote: Predator Free 2050 Ltd (PF2050 Ltd), a Crown-owned, charitable company, was established
    in 2016
- claim: A Budget announcement on 22 May 2025 said it was being disestablished, with its functions
    to be handed to the Department of Conservation, according to the New Zealand Conservation
    Authority.
  url: https://www.doc.govt.nz/about-us/statutory-and-advisory-bodies/nz-conservation-authority/submissions/submission-on-predator-free-2050/
  fetched: 2026-11-07
  quote: a Budget announcement less than three weeks later on 22 May 2025 that Predator Free
    2050 Ltd was being disestablished with its functions to be handed to the Department of
    Conservation by August.
- claim: Funded the rat AI model behind ASG Technologies' PredaCAM, which DOC said in 2024
    was still being trialled.
  url: https://www.doc.govt.nz/news/media-releases/2024-media-releases/new-ai-predator-detection-tools-available/
  fetched: 2026-11-07
  quote: Predator Free 2050 Ltd funded the rat AI model, which is still being trialled.
- claim: DOC says the Government decided in the 2025/26 budget to close the Crown-owned company.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/our-work/predator-free-2050-strategic-documents/
  fetched: 2026-11-07
  quote: In the 2025/26 budget, the Government decided to close the crown-owned company Predator
    Free 2050 Ltd.
- claim: DOC says the company's work is now absorbed into DOC, the lead government agency
    for Predator Free 2050.
  url: https://www.doc.govt.nz/nature/pests-and-threats/predator-free-2050/our-work/predator-free-2050-strategic-documents/
  fetched: 2026-11-07
  quote: The company's work is now absorbed into DOC’s existing activities as part of its
    role as the lead government agency for the programme.
