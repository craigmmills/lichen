summary: Nature reserve monitoring wildlife at night with camera traps, which a Turkmen embassy item says
  recorded a caracal and a sand cat; a 2024 assessment calls it Turkmenistan's largest reserve.
facts:
- claim: A Turkmen embassy news item says the reserve's wildlife is observed and monitored at night with
    camera traps that local specialists received from the Environmental Protection Service of the then
    Ministry of Agriculture and Environment Protection.
  url: https://uae.tmembassy.gov.tm/news/58263
  fetched: 2026-11-12
  quote: The Kaplankyr State Nature Reserve’s diverse array of wildlife is now being closely observed
    and monitored at night thanks to camera traps local specialists have received
- claim: The same item says the camera traps recorded a caracal and a sand cat.
  url: https://uae.tmembassy.gov.tm/news/58263
  fetched: 2026-11-12
  quote: Camera traps also captured an image of a sand cat
- claim: A 2024 assessment says it remains the largest reserve in Turkmenistan.
  url: https://largelandscapes.org/wp-content/uploads/Assessment-of-Wildlife-and-Protected-Areas-of-Turkmenistan-2024.pdf
  fetched: 2026-11-12
  quote: It remains the largest reserve in Turkmenistan
- claim: UNDP says the reserve received World Heritage status in September 2023.
  url: https://www.undp.org/turkmenistan/press-releases/undp-and-partners-organized-workshop-biodiversity-conservation-and-effective-management-pas
  fetched: 2026-11-12
  quote: using the example of the Kaplankyr State Nature Reserve, as well as about changes in its functioning
    and reporting regime following the receiving this status in September 2023
