summary: A Turkmen state nature reserve that, per an April 2025 official item, reported
  a single brown bear sighting at hearings, and per Turkmenportal supplied Red Book
  plant and bat information for the 2025 Chronicle of Nature.
facts:
- claim: An April 2025 official news item says the heads of the scientific departments
    of nine state nature reserves presented their scientific, practical and inspection
    work on the study and protection of nature at the yearly hearings on the results
    for 2024.
  url: https://turkmenistan.gov.tm/index.php/en/post/94159/hearings-chronicles-nature-were-held-ashgabat
  fetched: 2026-11-15
  quote: The heads of scientific departments of nine state nature reserves operating
    in the country, representing all types of ecological landscapes, presented scientific,
    practical and inspection work on the study and protection of nature
- claim: The same item says the collected information, the Chronicle of Nature, describes
    the state of rare flora and fauna and the discovery of new species for the protected
    landscapes during the reporting year.
  url: https://turkmenistan.gov.tm/index.php/en/post/94159/hearings-chronicles-nature-were-held-ashgabat
  fetched: 2026-11-15
  quote: contains a description of the state of rare flora and fauna, rare natural
    and weather phenomena, facts of discovery of new species for protected landscapes
    during the reporting year
- claim: The same item says the report of Charyar Tagiev of the Sunt-Hasardag reserve
    included the observation of a single brown bear.
  url: https://turkmenistan.gov.tm/index.php/en/post/94159/hearings-chronicles-nature-were-held-ashgabat
  fetched: 2026-11-15
  quote: Charyar Tagiev's (Sunt-Hasardag state reserve) report included a report on
    the observation of a single brown bear
- claim: Turkmenportal, citing the website of the Ministry of Environmental Protection,
    says that for the 2025 Chronicle of Nature the reserve supplied information on
    the distribution of plants in the Red Book of Turkmenistan and on its study of
    bats.
  url: https://turkmenportal.com/ru/news/100332-v-turkmenistane-uchenye-obsudili-rabotu-provedennuyu-v-zapovednikah-strany-v-2025-godu
  fetched: 2026-11-15
  quote: Из Сюнт-Хасардагского государственного природного заповедника была предоставлена
    ценная информация о распространении и развитии растений, занесенных в Красную
    книгу Туркменистана, а также о работе по изучению летучих мышей
