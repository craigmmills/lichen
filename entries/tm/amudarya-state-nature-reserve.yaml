summary: Official reports describe its April 2025 reptile census, intended to feed
  a specialised database and yearly Chronicle of Nature, and participation in January
  2022 waterfowl counts.
facts:
- claim: An April 2025 official news item says scientists of the Amyderya State Nature
    Reserve of the Ministry of Environmental Protection carried out the traditional
    April census of reptiles on one of the regular routes.
  url: https://turkmenistan.gov.tm/en/post/94390/monitoring-population-rare-reptile-species-was-carried-out-amyderya-nature-reserve
  fetched: 2026-11-15
  quote: Scientists from the Amyderya State Nature Reserve of the Ministry of Environmental
    Protection of Turkmenistan conducted a traditional April census of reptiles on
    one of the regular routes.
- claim: The same item says the collected information will go into a specialised database
    used for further conservation measures.
  url: https://turkmenistan.gov.tm/en/post/94390/monitoring-population-rare-reptile-species-was-carried-out-amyderya-nature-reserve
  fetched: 2026-11-15
  quote: The collected information will replenish a specialized database used to take
    further conservation measures.
- claim: The same item says work is under way on photo and video material from camera
    traps, raids, expeditions and inspections.
  url: https://turkmenistan.gov.tm/en/post/94390/monitoring-population-rare-reptile-species-was-carried-out-amyderya-nature-reserve
  fetched: 2026-11-15
  quote: Work is underway with the accumulated photo and video material obtained from
    «camera traps», during raids, working expeditions and inspections.
- claim: The same item says monitoring is carried out under the programme for studying
    and observing flora and fauna, and feeds a yearly package of data on the reserve's
    environment and biodiversity, the Chronicle of Nature.
  url: https://turkmenistan.gov.tm/en/post/94390/monitoring-population-rare-reptile-species-was-carried-out-amyderya-nature-reserve
  fetched: 2026-11-15
  quote: Monitoring of objects of the world of living nature is carried out within
    the framework of the program for studying and observing flora and fauna
- claim: A February 2022 official news item says the January counts of wintering waterfowl
    were carried out by the Khazar, Kaplankyr and Amudarya nature reserves on the
    instructions of the then Ministry of Agriculture and Environmental Protection.
  url: https://turkmenistan.gov.tm/en/post/60751/wetlands-ecosystems-preserve-biodiversity
  fetched: 2026-11-15
  quote: These counts were carried out by the forces of the Khazar, Kaplankyr and
    Amudarya nature reserves on the instructions of the Ministry of Agriculture and
    Environmental Protection of Turkmenistan.
