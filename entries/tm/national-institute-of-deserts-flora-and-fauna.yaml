summary: Research institute under the environment ministry whose studies, a 2017 article says, underpin
  a national concept for monitoring desertification, using remote methods, GIS and aerospace imagery.
facts:
- claim: The CBD focal point list names a specialist of the Laboratory of Biodiversity of the National
    Institute of Deserts, Flora and Fauna, under the Ministry of Environmental Protection, at 15 Bitarap
    Turkmenistan Street, Ashgabat.
  url: https://www.cbd.int/kb/record/focalPoint/7453?Country=tm
  fetched: 2026-11-12
  quote: National Institute of Deserts, Flora and Fauna
- claim: A 2017 article on the Turkmen government's news site says the institute's long studies became
    the basis for the concept of national monitoring of types of desertification, including degradation
    of vegetation.
  url: https://turkmenistan.gov.tm/en/post/8552/national-system-of-desertification-monitoring
  fetched: 2026-11-12
  quote: Long scientific studies of National Institute of Desert, Flora and Fauna become the basis for
    the development of the concept of national monitoring of different types of desertification like degradation
    of vegetation
- claim: The same article says remote methods, GIS and aerospace imagery are widely used in this monitoring
    research, and that maps of environmental conditions have been made.
  url: https://turkmenistan.gov.tm/en/post/8552/national-system-of-desertification-monitoring
  fetched: 2026-11-12
  quote: Distant methods, GIS technologies and aerospace footages are widely used in monitoring researches.
- claim: In 2017 the institute was part of the State Committee for Natural Protection and Land Resources.
  url: https://turkmenistan.gov.tm/en/post/8552/national-system-of-desertification-monitoring
  fetched: 2026-11-12
  quote: National Institute of Desert, Flora and Fauna of the State Committee for Natural Protection and
    Land Resources
- claim: A November 2025 article on the same site says specialists of the institute, "of the Ministry
    of environmental protection", assessed herbaceous vegetation, saxaul shoots and the effects of human
    and natural processes on Garagum desert ecosystems in the Aral Sea region.
  url: https://turkmenistan.gov.tm/en/post/100572/scientists-desert-institute-conducted-geobotanical-research-turkmen-aral-sea-region
  fetched: 2026-11-12
  quote: Specialists from the National institute of deserts, flora, and fauna of the Ministry of environmental
    protection of Turkmenistan conducted geobotanical research in the Aral sea region of Turkmenistan.
