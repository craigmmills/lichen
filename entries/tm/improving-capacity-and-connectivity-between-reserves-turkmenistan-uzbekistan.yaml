summary: Closed CEPF-funded project improving Koytendag and Surkhan management, with
  the Center for Large Landscape Conservation reporting SMART introduction in Koytendag
  and training for 20 more rangers in Uzbekistan.
facts:
- claim: CEPF lists the project's grantee as Climate Conservation dba Center for Large
    Landscape Conservation and its dates as May 2023 to February 2025.
  url: https://www.cepf.net/grants/grantee-projects/improving-capacity-and-connectivity-between-reserves-turkmenistan-and
  fetched: 2026-11-14
  quote: May 2023 – Feb 2025
- claim: CEPF says the project aimed to improve management of the contiguous Koytendag
    (Turkmenistan) and Surkhan (Uzbekistan) state nature reserves and to propose the
    Kugitang Mountains as a UNESCO World Heritage Site.
  url: https://www.cepf.net/grants/grantee-projects/improving-capacity-and-connectivity-between-reserves-turkmenistan-and
  fetched: 2026-11-14
  quote: Improve the management of the geographically contiguous Koytendag State Nature
    Reserve in Turkmenistan and the Surkhan State Nature Reserve in Uzbekistan
- claim: The Center for Large Landscape Conservation says a major focus of the work
    was improving wildlife monitoring with SMART, introduced in Koytendag and later
    adopted across Turkmenistan's protected area system, and that 20 more rangers
    were trained in Uzbekistan.
  url: https://largelandscapes.org/news/turkmenistan-and-uzbekistan/
  fetched: 2026-11-14
  quote: A major focus of the project was improving wildlife monitoring using the
    SMART (Spatial Monitoring and Reporting Tool) system.
- claim: The same page says biodiversity surveys across both reserves found relatively
    stable lynx and markhor populations.
  url: https://largelandscapes.org/news/turkmenistan-and-uzbekistan/
  fetched: 2026-11-14
  quote: Biodiversity surveys conducted across both reserves confirmed relatively
    stable populations of lynx and markhor.
