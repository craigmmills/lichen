summary: Turkmen environment ministry in which Conservation X Labs says SMART was implemented, and which
  worked with UNDP in 2025 on updating the national biodiversity strategy and action plan and its targets.
facts:
- claim: On 24 December 2025, UNDP reported an introductory seminar in Turkmenistan under its GEF-funded
    global programme to update NBSAPs and prepare 7th National Reports to the CBD, implemented in partnership
    with the ministry.
  url: https://www.undp.org/turkmenistan/press-releases/seminar-updating-national-biodiversity-strategy-and-action-plan-held-turkmenistan-undp-support
  fetched: 2026-11-12
  quote: implemented in partnership with the Ministry of Environmental Protection of Turkmenistan
- claim: UNDP and the ministry concluded regional consultations on updating Turkmenistan's NBSAP, including
    the national biodiversity targets (8 October 2025).
  url: https://www.undp.org/turkmenistan/press-releases/turkmenistan-and-undp-conclude-regional-consultations-updating-national-biodiversity-strategy-and-action-plan
