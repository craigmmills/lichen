summary: Academy of Sciences centre whose GIS Laboratory was creating a multi-level pasture monitoring
  system in October 2023, using a spectral library of 27 dominant plant species.
facts:
- claim: An October 2023 article on the Turkmen government news site says the centre's GIS Laboratory
    is creating a multi-level monitoring system for pastures around Lake Altyn Asyr and the Caspian Lowland.
  url: https://www.turkmenistan.gov.tm/en/post/76849/turkmen-scientists-are-creating-spectral-library-pasture-vegetation
  fetched: 2026-11-12
  quote: One of the scientific developments of the Geographical Information Systems Laboratory at the
    Center for Technologies of the Academy of Sciences of Turkmenistan is related to the creation of a
    multi-level monitoring system for pastures
- claim: The article says characteristics of 27 dominant pasture plant species were combined into a spectral
    library, used to decode some hyperspectral satellite images.
  url: https://www.turkmenistan.gov.tm/en/post/76849/turkmen-scientists-are-creating-spectral-library-pasture-vegetation
  fetched: 2026-11-12
  quote: According to the data of the spectral library, some hyperspectral satellite images were decoded
- claim: An expert of the Technology Center of the Academy of Sciences took part in the January 2024 Caspian
    waterbird count expedition.
  url: https://turkmenistan.gov.tm/en/post/79600/ornithological-expedition-conducts-bird-count-turkmen-sector-caspian-sea
