summary: Nature reserve whose ornithologists joined the January 2024 Caspian wintering bird count expedition,
  which was to survey 33 sites under the Ramsar Convention.
facts:
- claim: A January 2024 article on the Turkmen government news site says the international expedition
    counting wintering birds in the Turkmen sector of the Caspian Sea included ornithologists of the Hazar
    State Nature Reserve.
  url: https://turkmenistan.gov.tm/en/post/79600/ornithological-expedition-conducts-bird-count-turkmen-sector-caspian-sea
  fetched: 2026-11-12
  quote: ornithologists of the Hazar State Nature Reserve
- claim: The expedition was to survey 33 sites; the article says these bird counts are held every January
    under the Ramsar Convention.
  url: https://turkmenistan.gov.tm/en/post/79600/ornithological-expedition-conducts-bird-count-turkmen-sector-caspian-sea
  fetched: 2026-11-12
  quote: Bird counts in this area are conducted annually in January under the auspices of the Ramsar Convention
- claim: The Caspian Environmental Information Centre portal says more than 33,000 greater flamingos were
    recorded in the reserve in Turkmenistan's 2026 winter waterbird census, which involved staff of state
    nature reserves.
  url: https://tehranconvention.org/en/node/1777
  fetched: 2026-11-12
  quote: This year, more than 33,000 individuals were recorded within the Hazar State Nature Reserve
