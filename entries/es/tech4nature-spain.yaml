summary: The Spanish part of the IUCN and Huawei Tech4Nature partnership, monitoring eagles,
  bats and climbers in Sant Llorenç del Munt i l'Obac and visitors and wetlands in Sierra
  Nevada with cameras, recorders and AI.
facts:
- claim: In Sierra Nevada, camera traps and acoustic recorders are paired with AI that tells
    hikers from wildlife.
  url: https://iucn.org/story/202509/tech-meets-nature-how-spains-parks-are-using-ai-protect-raptors-bats-and-mountain
  quote: camera traps and acoustic recorders are being paired with AI that can tell the difference
    between hikers and wildlife
  fetched: '2026-10-31'
- claim: The first phase began in 2021; Phase II runs from 2023 to 2026.
  url: https://iucn.org/story/202509/tech-meets-nature-how-spains-parks-are-using-ai-protect-raptors-bats-and-mountain
  quote: Now, in Phase II (2023–2026), the experiment is expanding in collaboration with the
    Forest Science and Technology Centre of Catalonia (CTFC)
  fetched: '2026-10-31'
- claim: A cross-sectoral partnership set up under Tech4Nature in Spain.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: '2026-10-31'
  quote: partnership established in the framework of the Tech4Nature initiative in Spain.
- claim: The monitoring system tracks species behaviour, visitor mobility and risk detection.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: '2026-10-31'
  quote: The experimental monitoring system consists of a set of parameters to track the behaviour
    of the species, visitor mobility practices, and risk detection.
- claim: Phase II in Sant Llorenç tests light sensors, acoustic recorders and AI-powered camera
    traps.
  url: https://tech4nature.iucngreenlist.org/countries/spain/
  fetched: '2026-10-31'
  quote: Phase II is testing a suite of light sensors, acoustic recorders, and AI-powered
    camera-traps
- claim: In Sierra Nevada AI is being trained to distinguish people from wildlife.
  url: https://tech4nature.iucngreenlist.org/countries/spain/
  fetched: '2026-10-31'
  quote: AI is being trained to distinguish people from wildlife, track movement patterns,
    and even detect illegal camping.
- claim: Sant Llorenç was selected in 2021.
  url: https://parcs.diba.cat/es/web/conservacio-de-la-biodiversitat/tech4nature
  fetched: '2026-10-31'
  quote: El Parque Natural de Sant Llorenç del Munt i l'Obac fue seleccionado, en 2021, para
    formar parte de Tech4Nature
