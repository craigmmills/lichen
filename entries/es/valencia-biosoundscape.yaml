summary: Project that monitored bird activity in València's Turia Garden and the Devesa of
  l'Albufera with acoustic recorders and AI, and built a public platform of species and biodiversity
  indicators.
facts:
- claim: Combines AI, acoustic monitoring and IoT to analyse urban biodiversity.
  url: https://valenciainnovationcapital.com/proyecto/biosoundscape/?lang=en
  quote: an innovative initiative that combines artificial intelligence, acoustic monitoring
    and IoT technologies to analyse urban biodiversity
  fetched: '2026-10-31'
- claim: Carried out over 18 months, from December 2024 to June 2026.
  url: https://valenciainnovationcapital.com/proyecto/biosoundscape/?lang=en
  quote: The project was carried out over an 18-month period, from December 2024 to June 2026
  fetched: '2026-10-31'
- claim: Detects bird species through BirdNET.
  url: https://valenciainnovationcapital.com/proyecto/biosoundscape/?lang=en
  quote: the system detects bird species through BirdNET, the bird classification tool developed
    by Cornell University
  fetched: '2026-10-31'
- claim: Deployed passive acoustic monitoring devices at eight locations in the Turia Garden
    and the Devesa of Albufera.
  url: https://www.iteam.upv.es/valencia-and-iteam-advance-urban-biodiversity-monitoring-through-artificial-intelligence/
