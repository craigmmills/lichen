summary: Spanish scientific infrastructure that runs a multi-platform marine observation and
  forecasting system in the western Mediterranean, with open data through a certified repository.
facts:
- claim: A Unique Scientific and Technical Infrastructure created in 2007 and joined by CSIC
    in 2020, according to EuroGOOS.
  url: https://eurogoos.eu/member/balearic-islands-coastal-observing-and-forecasting-system-socib/
  quote: created by the Ministry of Education and Science and the Autonomous Community of
    the Balearic Islands in 2007, and joined by the Spanish National Research Council (CSIC,
    for its acronym in Spanish) in 2020
  fetched: '2026-10-31'
- claim: Gives open access to its data through a certified repository.
  url: https://eurogoos.eu/member/balearic-islands-coastal-observing-and-forecasting-system-socib/
  quote: provides access to the data (Open Data, Open Science) through the SOCIB Data R epository
  fetched: '2026-10-31'
- claim: Managed by a consortium financed equally by the state and the Balearic government,
    in Palma de Mallorca.
  url: https://www.ciencia.gob.es/en/Organismos-y-Centros/ICTS/CienciasMar/SOCIB.html
  fetched: '2026-10-31'
  quote: SOCIB is managed by a consortium financed equally by the General Administration of
    the State and the Government of the Autonomous Community of the Balearic Islands. Located
    in Palma de Mallorca
- claim: A network dedicated to marine observation, processing, modelling and dissemination
    of information on the marine environment.
  url: https://www.ciencia.gob.es/en/Organismos-y-Centros/ICTS/CienciasMar/SOCIB.html
  fetched: '2026-10-31'
  quote: SOCIB is made up of a network of facilities and equipment dedicated to marine observation
