summary: Regional government whose website describes the protected areas network (RENA)
  covering 8% of Navarra, and which approved a management plan for the Montes de la
  Valdorba conservation area on 22 November 2023.
facts:
- claim: Its website describes the Navarra protected areas network (RENA), covering
    8% of the territory.
  url: https://www.navarra.es/es/medio-ambiente/espacios-naturales-protegidos
  fetched: '2026-11-17'
  quote: La Red de espacios protegidos de Navarra (RENA) supone el 8% del territorio
    de la Comunidad Foral.
- claim: On 22 November 2023, the Government approved the management plan for the
    Montes de la Valdorba special area of conservation, which includes the Monte de
    Olleta and Monte del Conde nature reserves.
  url: https://www.navarra.es/es/-/nota-prensa/el-gobierno-de-navarra-aprueba-el-nuevo-plan-de-gestion-de-los-espacios-protegidos-en-la-zona-de-los-montes-de-la-valdorba
  fetched: '2026-11-17'
  quote: El Gobierno de Navarra ha aprobado, en su sesión de hoy, el nuevo Plan de
    Gestión de la Zona Especial de Conservación (ZEC) “Montes de la Valdorba”, que
    incluye en su interior las reservas naturales “Monte de Olleta” y “Monte del Conde”.
