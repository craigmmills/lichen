  url: https://butterfly-monitoring.net/bms-schemes
  fetched: '2026-10-31'
  quote: These are Zerynthia Association , the BMS coordinated by the Society for the Conservation
    and Study of Butterflies in Spain ( SOCEME ), the Catalan Butterfly Monitoring Scheme
    (CBMS , which also coordinates monitoring for Andorra), and the Urban Butterfly Monitoring
    Scheme (UBMS ).
- claim: Runs monitoring programmes.
