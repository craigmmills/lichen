  quote: La Red Cambera es una asociación sin ánimo de lucro e independiente que trabaja
    desde el año 2010 en Cantabria en la conservación del medio natural.
- claim: The October 2019 page describes its stewardship of the Camesa river surroundings
    in Brañosera (Palencia) and Valdeolea (Cantabria), under a 2014 agreement with
    the Confederación Hidrográfica del Duero.
