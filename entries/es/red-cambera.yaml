facts:
- claim: An October 2019 ministry page describes Red Cambera as a non-profit association
    working since 2010 on conservation of the natural environment in Cantabria.
  url: https://www.miteco.gob.es/es/ceneam/recursos/quien-es-quien/red-cambera.aspx
