summary: Project funded by Spain's science ministry to set up a permanent, intelligent system
  for real-time ecological monitoring of the deep Mediterranean, centred on the OBSEA-DEEP
  observatory at 400 metres off the Catalan margin.
facts:
- claim: Aims at a permanent, intelligent system for real-time monitoring of the deep Mediterranean.
  url: https://cirs.udg.edu/?p=2679
  quote: aims to establish a permanent, intelligent system for real-time ecological and technological
    monitoring in the deep Mediterranean Sea
  fetched: '2026-10-31'
- claim: OBSEA-DEEP will be deployed at 400 metres depth.
  url: https://cirs.udg.edu/?p=2679
  quote: The observatory will be deployed at 400 metres depth on the upper slope of the Catalan
    margin
  fetched: '2026-10-31'
- claim: Will install a smart observatory at 350 metres between Blanes and Palamós.
  url: https://www.icm.csic.es/es/noticia/arranca-smart-me-un-innovador-proyecto-para-promover-la-recuperacion-de-los-fondos-marinos
  fetched: '2026-10-31'
  quote: instalará un observatorio inteligente de aguas profundas a 350 metros de profundidad
    entre Blanes y Palamós
- claim: Validated innovations include AI image recognition.
  url: https://www.icm.csic.es/es/noticia/arranca-smart-me-un-innovador-proyecto-para-promover-la-recuperacion-de-los-fondos-marinos
  fetched: '2026-10-31'
  quote: reconocimiento de imágenes con IA
