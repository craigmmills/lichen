summary: Spain's national space agency, based in Seville. With the European Space Agency it
  launched a national call for Earth observation applications after the wildfires that affected
  Spain's land and ecosystems.
facts:
- claim: The Council of Ministers chose Seville as the seat of the agency.
  url: https://digital.gob.es/comunicacion/notas-prensa/secretaria-digitalizacion-e-inteligencia-artificial/2022/12/decision-sede-agencias
  quote: El Consejo de Ministros ha adoptado la decisión de que Sevilla sea la sede de la
    futura Agencia Espacial Española
  fetched: '2026-10-31'
- claim: Launching, with ESA's InCubed programme, a national call for Earth observation applications,
    according to ESA's Φ-lab.
  url: https://philab.esa.int/leadership-and-technology-aee-boosts-spains-resilience-against-wildfires/
  quote: AEE is launching a pioneering national call for the development of innovative Earth
    Observation applications
  fetched: '2026-10-31'
- claim: Its purpose is the use of space for the benefit of Spanish society and the coordination
    of space activities and policies.
  url: https://www.ciencia.gob.es/Ministerio/Mision-y-organizacion/Entidades-Adscritas/AEE.html
  fetched: '2026-10-31'
  quote: El objeto propio de la AEE es la utilización del espacio en beneficio, conocimiento
    y seguridad de la sociedad española
- claim: With ESA InCubed it backs eight Spanish Earth observation projects on the full fire
    management cycle, with a budget of 5.93 million euros.
  url: https://www.aee.gob.es/ca/Noticias/2026/septiembre/aee-esa-incubed.html
  fetched: '2026-10-31'
  quote: Con un presupuesto global movilizado de 5,93 millones de euros
