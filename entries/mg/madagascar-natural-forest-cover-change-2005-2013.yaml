    et son extension, projet FAPE3
- claim: It used Landsat 5, 7 and 8 images.
  url: https://www.pnae.mg/deforestation.html
  fetched: 2026-11-08
  quote: Les données satellitaires utilisées dans le cadre de ce travail proviennent des satellites LANDSAT5,
    LANDSAT 7 et LANDSAT8
- claim: Its method used the Random Forest algorithm.
