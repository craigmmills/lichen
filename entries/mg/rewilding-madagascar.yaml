summary: A research programme led by Sheila Holmes at SLU, funded by the Swedish Research
  Council, whose study used cameras and acoustic recorders at five eastern rainforest
  sites and tested LifePlan classification models on bird audio at one.
facts:
- claim: SLU says the study is part of the research programme Rewilding Madagascar,
    led by Sheila Holmes at SLU's Department of Wildlife, Fish and Environmental Studies.
  url: https://www.slu.se/en/news/2026/08/photos-show-how-species-are-returning-to-reforestation-areas-in-madagascar/
  fetched: 2026-11-15
  quote: The study is part of the larger research programme Rewilding Madagascar,
    led by Sheila Holmes at the Department of Wildlife, Fish and Environmental Studies
    at SLU in Umeå.
- claim: The study deployed motion-triggered cameras and acoustic recorders at five
    sites in Madagascar's eastern rainforest.
  url: https://www.slu.se/en/news/2026/08/photos-show-how-species-are-returning-to-reforestation-areas-in-madagascar/
  fetched: 2026-11-15
  quote: Motion-triggered cameras and acoustic recording devices were deployed at
    five sites in the eastern rainforest region of Madagascar.
- claim: The researchers tested classification models from the LifePlan project to
    detect seed-dispersing birds in the audio at one site.
  url: https://www.slu.se/en/news/2026/08/photos-show-how-species-are-returning-to-reforestation-areas-in-madagascar/
  fetched: 2026-11-15
  quote: The researchers also tested classification models developed within the LifePlan
    project to detect seed-dispersing birds in the audio recordings at one site.
- claim: The lead author of the study is a PhD student at the University of Antananarivo.
  url: https://www.slu.se/en/news/2026/08/photos-show-how-species-are-returning-to-reforestation-areas-in-madagascar/
  fetched: 2026-11-15
