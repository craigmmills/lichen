summary: A field station in Kirindy Forest near Morondava studying eight sympatric
  lemur species, where a researcher reports that a mouse lemur population monitored
  over many years collapsed.
facts:
- claim: The German Primate Center's Behavioral Ecology and Sociobiology Unit has
    operated the field station in Kirindy Forest near Morondava since 1993.
  url: https://lemurconservationnetwork.org/researcher/german-primate-center/
  fetched: 2026-11-12
  quote: The Behavioral Ecology and Sociobiology Unit of the German Primate Center
    has been operating a field station in Kirindy Forest/CNFEREF near Morondava since
    1993.
- claim: Studies the behaviour, ecology and biodiversity of lemurs and other vertebrates
    at its Madagascar study site, covering eight sympatric lemur species.
  url: https://lemurconservationnetwork.org/researcher/german-primate-center/
  fetched: 2026-11-12
  quote: We study the behavior, ecology and biodiversity of lemurs, but also of other
    vertebrates at our study site in Madagascar.
- claim: A Leibniz Institute for the Analysis of Biodiversity Change researcher says
    a mouse lemur population regularly captured in long-term studies in the Kirindy
    forest, where the station is, collapsed, with the last animal caught in 2019.
  url: https://leibniz-lib.de/en/news/27052025-interview-livia-schaeffler.html
  fetched: 2026-11-12
  quote: In the Kirindy forest, where the DPZ's research station is located, a population
    that had been regularly captured as part of long-term studies collapsed within
    a relatively short period of time.
- claim: Berlin's zoos say the station serves as a base for research projects on the
    population size and distribution of lemur species.
  url: https://www.aquarium-berlin.de/en/species-conservation/worldwide/kirindy
  fetched: 2026-11-12
  quote: The station functions as a base for a variety of research projects, i.e.
    on the population size and distribution of various lemur species.
