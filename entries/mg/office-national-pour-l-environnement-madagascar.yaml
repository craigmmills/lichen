summary: Madagascar's environmental office, created in 1990, which manages the environmental information
  system and publishes the Tableau de Bord Environnemental, an indicator-based tool for monitoring the
  state of the environment.
facts:
- claim: Created in 1990 and governed by decree 2008-600 of 23 June 2008; it describes itself as a national
    actor on the environment.
  url: http://www.pnae.mg/
  fetched: 2026-11-08
  quote: Créé en 1990, l’Office National pour l’Environnement (ONE) est régi par le décret n° 2008-600
    du 23 juin 2008.
- claim: Its core mission includes steering the national environmental assessment system.
  url: http://www.pnae.mg/
  fetched: 2026-11-08
  quote: notamment par le pilotage du système national d’évaluation environnementale
- claim: Publishes the Tableau de Bord Environnemental, national and regional, a tool for monitoring the
    state of the environment through indicators whose themes include biodiversity, soil and vegetation
    cover, the coast and inland waters.
  url: https://www.pnae.mg/tbe/intro.html
  fetched: 2026-11-08
  quote: Le TBE est un outil de suivi de l'état de l'environnement et de son évolution pour une meilleure
    prise de décisions à tous les niveaux
- claim: Its deforestation page reports a study of natural forest cover change in Madagascar for 2005,
    2010 and 2013, carried out by a consortium of WCS, ONE, MNP and Etc Terra.
  url: https://www.pnae.mg/deforestation.html
  fetched: 2026-11-08
  quote: Les travaux ont été menés par le consortium WCS, ONE, MNP et ETC
- claim: Its site gives an address in Analakely, Antananarivo.
  url: https://www.pnae.mg/deforestation.html
  fetched: 2026-11-08
  quote: Immeuble IFANOMEZANTSOA II, Escalier Ranavalona I, Analakely Antananarivo - Madagascar
