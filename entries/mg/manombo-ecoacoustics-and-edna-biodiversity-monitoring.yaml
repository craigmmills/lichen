summary: Project, announced in May 2023, planning to combine acoustic and eDNA data to set a biodiversity
  baseline and monitor 100 species in Manombo, run by Rainforest Connection with NatureMetrics.
facts:
- claim: NatureMetrics announced in May 2023 that RFCx was partnering with NatureMetrics to combine acoustic
    and eDNA data to survey animal species in Manombo.
  url: https://www.naturemetrics.com/news/ecoacoustics-edna-bring-new-biodiversity-monitoring-to-manombo-reserve-madagascar
  fetched: 2026-11-08
  quote: RFCx is excited to be partnering with NatureMetrics to combine acoustic and eDNA data to comprehensively
    survey animal species in Manombo.
- claim: The project planned an initial survey to set a biodiversity baseline and to monitor 100 species,
    including the James' sportive lemur.
  url: https://www.naturemetrics.com/news/ecoacoustics-edna-bring-new-biodiversity-monitoring-to-manombo-reserve-madagascar
  fetched: 2026-11-08
  quote: We’ll be monitoring 100 species in the area, with a focus on endangered species like the James’
    sportive lemur
- claim: The study is part of Health In Harmony's Rainforest Exchange project.
  url: https://www.naturemetrics.com/news/ecoacoustics-edna-bring-new-biodiversity-monitoring-to-manombo-reserve-madagascar
  fetched: 2026-11-08
  quote: This study is part of Health In Harmony’s larger Rainforest Exchange project
