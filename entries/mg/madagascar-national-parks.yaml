  fetched: 2026-11-08
  quote: Madagascar National Parks manages 27 National Parks spread throughout the Malagasy territory.
- claim: WCS Madagascar says that after a WCS pilot, SMART was adopted by Madagascar National Parks and
    the environment ministry as the national law enforcement monitoring tool.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
