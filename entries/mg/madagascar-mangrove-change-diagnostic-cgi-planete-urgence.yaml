facts:
- claim: Planète Urgence asked CGI to quantify mangrove change in Madagascar from
    satellite observations; CGI did the work pro bono.
  url: https://www.cgi.com/en/article/esg/cgi-and-planete-urgence-partner-restore-vulnerable-mangroves-madagascar
  fetched: 2026-11-12
  quote: Planète Urgence asked us to quantify changes based on satellite observations,
    analyze vulnerabilities, and provide results.
- claim: CEOS-VEG generates land cover maps from satellite images with machine learning
    algorithms and highlights mangrove loss or gain.
  url: https://www.cgi.com/en/article/esg/cgi-and-planete-urgence-partner-restore-vulnerable-mangroves-madagascar
  fetched: 2026-11-12
  quote: CEOS-VEG first generates maps using satellite images and machine learning
    algorithms to classify land coverage by mangroves, savannahs, agricultural plots,
    forests, and buildings.
- claim: CGI reports an average annual mangrove deforestation rate of 16% from 2010
    to 2022 in north-western Madagascar.
  url: https://www.cgi.com/en/article/esg/cgi-and-planete-urgence-partner-restore-vulnerable-mangroves-madagascar
  fetched: 2026-11-12
  quote: our solution revealed an average annual mangrove deforestation rate of 16%
    from 2010–2022 in northwestern Madagascar
- claim: CGI says it has also started satellite surveillance of tapia in Madagascar.
