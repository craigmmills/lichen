summary: A project studying and protecting young whale sharks off Nosy Be since 2016, with
  photo-identification recording 546 sharks by the end of the 2025 season and twenty acoustic
  receiver stations in use that season.
facts:
- claim: Has studied and protected the young whale sharks that gather off Nosy Be since 2016.
  url: https://marinemegafauna.org/whale-sharks/madagascar-research-project
  fetched: 2026-11-12
  quote: Young whale sharks aggregate off Nosy Be from about September to December, and the
    Madagascar Whale Shark Project has studied and protected them since 2016.
- claim: Photo-identification had recorded 546 whale sharks off Nosy Be by the end of the
    2025 season.
  url: https://marinemegafauna.org/whale-sharks/madagascar-research-project
  fetched: 2026-11-12
  quote: Photo-identification had recorded 546 whale sharks off Nosy Be by the end of the
    2025 season
- claim: A network of underwater acoustic receivers, twenty stations in the 2025 season, detects
    tagged sharks around Nosy Be around the clock.
  url: https://marinemegafauna.org/whale-sharks/madagascar-research-project
  fetched: 2026-11-12
  quote: now covered by a network of underwater acoustic receivers (twenty stations as of
    the 2025 season) that detect tagged sharks around the clock
- claim: Nine new Ocean Ambassadors join its programme for the 2026 season, combining outreach
    with data collection on the impacts of tourism.
  url: https://marinemegafauna.org/whale-sharks/madagascar-research-project
  fetched: 2026-11-12
  quote: For the 2026 season, nine new Ocean Ambassadors from Nosy Be communities and partner
    projects are joining the Madagascar Whale Shark Project’s program.
