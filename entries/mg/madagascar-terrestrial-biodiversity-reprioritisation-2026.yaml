summary: Closed workshop in late March 2026 where 70 participants, including 50 scientists, completed
  the first full re-prioritisation of Madagascar's terrestrial biodiversity since 1995, producing a consensus
  map of about 18 million hectares.
facts:
- claim: In late March 2026, 70 participants, including 50 scientists across seven taxonomic groups, completed
    the first full re-prioritisation of Madagascar's terrestrial biodiversity since 1995.
  url: https://www.rainforesttrust.org/our-impact/rainforest-news/70-experts-redraw-madagascars-terrestrial-conservation-map-for-the-first-time-in-31-years/
  fetched: 2026-11-08
  quote: In late March 2026, 70 participants, including 50 scientists across seven taxonomic groups, 70%
    of them Malagasy, completed the country’s first full scientific re-prioritization of terrestrial biodiversity
    since 1995.
- claim: The result is a consensus map of about 18 million hectares of priority land.
  url: https://www.rainforesttrust.org/our-impact/rainforest-news/70-experts-redraw-madagascars-terrestrial-conservation-map-for-the-first-time-in-31-years/
  fetched: 2026-11-08
  quote: The result is a consensus map covering roughly 18 million hectares of priority land, about a
    third of the country
- claim: Steven Goodman, of the Field Museum and Association Vahatra, is named as one of the principal
    workshop organisers.
  url: https://www.rainforesttrust.org/our-impact/rainforest-news/70-experts-redraw-madagascars-terrestrial-conservation-map-for-the-first-time-in-31-years/
  fetched: 2026-11-08
  quote: said Dr. Steven Goodman, MacArthur Field Biologist at Chicago’s Field Museum of Natural History
    and Association Vahatra, one of the principal workshop organizers and an author of the workshop report
