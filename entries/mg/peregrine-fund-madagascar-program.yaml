summary: A programme combining community investment, species monitoring, habitat restoration
  and protected area management, which reported in September 2025 that it managed
  four protected areas and, over the preceding year, monitored 26 waterbird species.
facts:
- claim: The Peregrine Fund says its Madagascar Program combines community investment,
    species monitoring, habitat restoration, protected area management and mentoring.
  url: https://peregrinefund.org/news/year-conservation-success-madagascar
  fetched: 2026-11-15
  quote: Our Madagascar Program is one of The Peregrine Fund’s largest and most impactful
    initiatives, combining community investment, species monitoring, habitat restoration,
    management of protected areas
- claim: In the year to September 2025 its team monitored 26 waterbird species, counting
    nearly 4,000 individuals.
  url: https://peregrinefund.org/news/year-conservation-success-madagascar
  fetched: 2026-11-15
  quote: This year, our team monitored 26 species of waterbirds, counting nearly 4,000
    individuals.
- claim: In its September 2025 account, the team also reported monitoring 11 Malagasy
    Harriers and banding 12 Madagascar Fish-eagles.
  url: https://peregrinefund.org/news/year-conservation-success-madagascar
  fetched: 2026-11-15
  quote: The team also monitored 11 Endangered Malagasy Harriers and banded 12 Critically
    Endangered Madagascar Fish-eagles
- claim: 'In September 2025, the programme reported managing four protected areas:
    Tsimembo-Manambolomaty Complex, Mandrozo, Bemanevika and Mahimborondro.'
  url: https://peregrinefund.org/news/year-conservation-success-madagascar
  fetched: 2026-11-15
  quote: 'The program also manages four protected areas in Madagascar: Tsimembo-Manambolomaty
    Complex, Mandrozo, Bemanevika, and Mahimborondro.'
- claim: The environment ministry renewed its management contracts in the year to
