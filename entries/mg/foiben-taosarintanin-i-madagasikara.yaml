summary: National geographic and hydrographic institute in Antananarivo, which a 2011 UN-GGIM report says
  a 2010 decree charged with building a reference geographic and hydrographic data infrastructure; its
  current status is unknown.
facts:
- claim: Named in its 2011 UN-GGIM country report as the national geographic and hydrographic institute,
    with an address in Antananarivo.
  url: https://ggim.un.org/country-reports/documents/Madagascar-2011-country-report.pdf
  fetched: 2026-11-08
  quote: (INSTITUT GEOGRAPHIQUE ET HYDROGRAPHIQUE NATIONAL)
- claim: The 2011 report says a 2010 decree charged FTM with equipping the national territory and its
    maritime zones with a reference geographic and hydrographic data infrastructure.
  url: https://ggim.un.org/country-reports/documents/Madagascar-2011-country-report.pdf
  fetched: 2026-11-08
  quote: Le FTM est chargé d’équiper le territoire national et de ses zones maritimes d’une infrastructure
    de données géographiques et hydrographiques de référence dénommée INDGH
- claim: The 2011 report gives its status as a public administrative body under the ministry for land-use
    planning.
  url: https://ggim.un.org/country-reports/documents/Madagascar-2011-country-report.pdf
  fetched: 2026-11-08
  quote: placé sous la tutelle technique du Ministère en charge de l’Aménagement du territoire.
