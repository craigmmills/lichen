summary: A non-profit association with a whale-watching code of conduct, reported
  in January 2023 to have used camera-equipped CATS tags since 2018 and studied humpback
  whale mother and calf pairs for seven years with research partners.
facts:
- claim: In January 2023, Newsmada reported that Cétamada's scientific team had deployed
    camera-equipped CATS tags since 2018 to study interactions between humpback whale
    mothers and calves.
  url: https://newsmada.com/?p=12078
  fetched: 2026-11-12
  quote: Depuis 2018, l’équipe scientifique de Cétamada a déployé des balises équipées
    de caméra (balises CATS) afin d’étudier les interactions sociales entre la mère
    et le baleineau.
- claim: In January 2023, Newsmada reported that Cétamada had studied humpback whale
    mother and calf pairs for seven years with NeuroPSI of Université Paris-Saclay
    and the University of Antananarivo.
  url: https://newsmada.com/?p=12078
  fetched: 2026-11-12
  quote: Cétamada, en partenariat avec le laboratoire NeuroPSI de l’Université de
    Paris Saclay France et l’Université d’Antananarivo, mène depuis sept ans des études
    sur les couples mère-baleineau
- claim: Described as a non-profit association that set up a code of conduct for whale-watching
    operators.
  url: https://www.carenews.com/fr/news/3293-mercredi-en-images-avec-cetamada-meler-vacances-et-preservation-des-baleines
  fetched: 2026-11-12
  quote: code de bonne conduite mis en place par l'association à but non lucratif
    Cetamada
- claim: Opened the exhibition "Observer sans déranger" on Madagascar's marine fauna
    with Ravinala Airports on 9 September 2026.
  url: https://newsmada.com/?p=194836
  fetched: 2026-11-12
  quote: Ravinala Airports et l’association Cétamada ont inauguré hier, à l’aéroport
    international d’Antananarivo, l’exposition « Observer sans déranger ».
