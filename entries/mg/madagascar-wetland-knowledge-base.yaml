summary: A planned national geospatial platform for Madagascar's 21 Ramsar sites,
  announced with JRS support in January 2024, to be designed and populated by a Wildfowl
  & Wetlands Trust team.
facts:
- claim: JRS announced support in January 2024 for Wildfowl & Wetlands Trust work
    to address gaps in national data and biodiversity information for Madagascar's
    21 Ramsar sites.
  url: https://jrsbiodiversity.org/wwt_madagascar/
  fetched: 2026-11-12
  quote: to address gaps in the national data and biodiversity information infrastructure
    for its 21 Ramsar sites
- claim: Its priorities include monitoring change and management effectiveness across
    wetland sites.
  url: https://jrsbiodiversity.org/wwt_madagascar/
  fetched: 2026-11-12
  quote: Project priorities will focus on improving knowledge in wetland sites, monitoring
    change and management effectiveness across sites
- claim: The team, led by Mark Grindley and Harison Andriambelo, is to design and
    populate a national Wetland Knowledge Base, described as a geospatial platform
    for storage, analysis, presentation and reporting.
  url: https://jrsbiodiversity.org/wwt_madagascar/
  fetched: 2026-11-12
  quote: a foundational national Wetland Knowledge Base (WKB) – a geospatial platform
    for storage, analysis, presentation and reporting tools
