summary: An organisation founded in 2015, working mainly around Ankarafantsika National
  Park to improve satellite and drone fire detection, with a CEPF-funded 2020 to 2022
  fire and forest monitoring grant.
facts:
- claim: World Land Trust describes Planet Madagascar Association as working mainly
    in and around Ankarafantsika National Park, founded in 2015 alongside Planet Madagascar
    Canada.
  url: https://www.worldlandtrust.org/partner/planet-madagascar/
  fetched: 2026-11-12
  quote: PMA’s project activities are based mainly in and around Ankarafantsika National
    Park, in the northwest of the country.
- claim: IUCN Save Our Species says Planet Madagascar is working to improve fire detection
    through satellite data and drones in Ankarafantsika National Park, in a 2025 to
    2027 project it implements.
  url: https://iucnsos.org/?p=8252
  fetched: 2026-11-12
  quote: Planet Madagascar is working to improve fire detection (through satellite
    data and drones) and management practices
- claim: The same project lists drone and camera-trap monitoring of forest and lemurs
    among its activities.
  url: https://iucnsos.org/?p=8252
  fetched: 2026-11-12
  quote: Introduce innovative forest and lemur monitoring techniques, such as drones
    and camera traps.
- claim: CEPF lists Planet Madagascar as grantee of a 2020 to 2022 project on fire
    management and forest monitoring in Ankarafantsika, piloting technology to monitor
    and report human activities.
  url: https://www.cepf.net/grants/grantee-projects/managing-fires-and-monitoring-forests-ankarafantsika-national-park
  fetched: 2026-11-12
  quote: piloting technology to monitor, report and mitigate anthropogenic activities
