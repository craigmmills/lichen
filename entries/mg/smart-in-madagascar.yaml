facts:
- claim: WCS began SMART training in Madagascar in 2013 through a USAID-funded programme, focused on nine
    high-risk terrestrial protected areas.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
  fetched: 2026-11-08
  quote: In 2013 through a USAID-funded program, WCS initiated training on the use of the Spatial Monitoring
    And Reporting Tool ( SMART ) throughout Madagascar, with a focus on nine high-risk terrestrial protected
    areas
- claim: Madagascar adopted SMART at national level in 2016.
  url: https://madagascar.wcs.org/Initiatives/Conservation-Science/Quick-facts-on-SMART-in-Madagascar.aspx
  fetched: 2026-11-08
  quote: Madagascar adopted SMART at national level in 2016
- claim: SMART is implemented in many terrestrial and marine protected areas in Madagascar.
  url: https://madagascar.wcs.org/Initiatives/Conservation-Science/Quick-facts-on-SMART-in-Madagascar.aspx
  fetched: 2026-11-08
  quote: SMART is implemented in numerous terrestrial and marine protected areas in Madagascar
- claim: WCS says 200 SMART users, mainly park and community forest patrollers, have been trained since
    2013.
  url: https://madagascar.wcs.org/Initiatives/Conservation-Science/Quick-facts-on-SMART-in-Madagascar.aspx
  fetched: 2026-11-08
  quote: SMART users, mainly park and community forest patrollers, including 78 community association
    members, 90 park agents, and 12 Focal Points, have been trained since 2013.
