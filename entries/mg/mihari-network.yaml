summary: Independent Malagasy civil society network created in 2012, grouping over 300 LMMAs, with an
  online national database and, WIOMSA reports, a portal launched in May 2025.
facts:
- claim: Describes itself as the only network of locally managed marine areas in Madagascar.
  url: https://mihari-network.org/en/
  fetched: 2026-11-08
  quote: MIHARI is the only network of locally managed marine areas (LMMA) in Madagascar
- claim: Created in 2012, it groups more than 300 LMMA units along Madagascar's coast, and became an independent
    Malagasy civil society organisation in 2020.
  url: https://mihari-network.org/elementor-4475/
  fetched: 2026-11-08
  quote: Le réseau a franchi une étape déterminante en 2020 en accédant à son indépendance et à son autonomie
    en tant qu’organisation de la société civile malagasy
- claim: Runs an online national database of LMMAs in Madagascar that partner organisations add to.
  url: https://mihari-network.org/base-de-donnees/
  fetched: 2026-11-08
  quote: Ceci est un nouvel outil qui vous permet d’alimenter la base de données nationale sur les LMMA
    à Madagascar.
- claim: WIOMSA reported that MIHARI launched Madagascar's LMMA Portal in May 2025 to centralise data
    on LMMAs.
  url: https://wiomsa.org/wiompan/2025/06/23/mihari-strengthens-marine-governance-in-madagascar-with-the-launch-of-the-lmma-portal/
  fetched: 2026-11-08
  quote: In May 2025, the MIHARI Network organized a national coordination meeting marked by the official
    launch of Madagascar’s LMMA Portal.
