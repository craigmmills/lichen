summary: Established in 2000, this free Madagascar biodiversity data tool, built and run by WCS, says
  its work supported selecting four million hectares of new terrestrial protected areas.
facts:
- claim: WCS Madagascar describes REBIOMA as a web-based tool developed by WCS to promote the use of biodiversity
    data in conservation and spatial planning.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
  fetched: 2026-11-08
  quote: is a web-based tool developed by WCS that aims to promote the use of biodiversity data in conservation
    and spatial planning, including in climate change analyses.
- claim: Established in 2000, it centralises biodiversity data in Madagascar and gives free access to
    it.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
  fetched: 2026-11-08
  quote: It is an initiative that centralizes biodiversity data in Madagascar and allows a wide range
    of users to freely access and analyze that data
- claim: A Taxonomy Review Board reviews every database record.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
  fetched: 2026-11-08
  quote: Working with the specially created Taxonomy Review Board (TRB), which reviews every database
    record
- claim: WCS Madagascar says REBIOMA is leading the planning of a marine protected area network.
  url: https://madagascar.wcs.org/Initiatives/Biodiversity-and-Conservation-Science.aspx
  fetched: 2026-11-08
  quote: Rebioma is now leading the planning of a marine protected area network
- claim: Says it has promoted the use of biodiversity data and tools in systematic conservation planning
    since 2002.
  url: https://api.gbif.org/v1/organization/a3789606-e6b8-4b4a-b058-44804d448633
  fetched: 2026-11-08
  quote: has worked to promote the use of biodiversity data and tools in systematic conservation planning
    since 2002
- claim: Says the REBIOMA data portal is a core part of its work.
  url: https://api.gbif.org/v1/organization/a3789606-e6b8-4b4a-b058-44804d448633
  fetched: 2026-11-08
  quote: The REBIOMA data portal (http://data.rebioma.net) is a core component
- claim: Says its work supported the selection of four million hectares of new land protected areas.
  url: https://api.gbif.org/v1/organization/a3789606-e6b8-4b4a-b058-44804d448633
  fetched: 2026-11-08
  quote: REBIOMA's work has directly supported the selection of four million hectares of new terrestrial
    protected areas
