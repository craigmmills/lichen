- claim: Zoos keeping Malagasy species are asked to help describe vocal repertoires
    so that species can be identified automatically.
  url: https://stiftung-artenschutz.de/en_US/projects/ecosounds-madagaskar/
  fetched: 2026-11-12
  quote: This will facilitate automatic computerised identification, as for many species
