  quote: Sadabe became a non-governmental organization (NGO) registered with the government
    of Madagascar in June 2009.
- claim: Its research page, updated in March 2011, reported monitoring the same diademed
    sifaka groups at Tsinjoarivo from 2004 through that time.
  url: https://sadabe.org/activities_research.html
  fetched: 2026-11-12
  quote: From 2004 through the present, we continue to monitor these same groups
- claim: IUCN reports that Sadabe is building corridors for diademed sifaka populations
    in Tsinjoarivo-Ambalaomby, combining habitat restoration with species monitoring,
    as one of 14 SOS Lemurs Phase II medium grants.
  url: https://iucn.org/node/46496
  fetched: 2026-11-12
  quote: Sadabe is building corridors to connect diademed sifaka populations while
