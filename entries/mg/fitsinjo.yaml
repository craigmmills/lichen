summary: Independent fisheries observatory for Madagascar and the Indian Ocean that monitors fishing vessels
  using satellite data, remote sensing and coastal communities, partnering with Blue Ventures, Global
  Fishing Watch and Skylight.
facts:
- claim: Describes itself as an independent observatory for fisheries in Madagascar and the Indian Ocean.
  url: https://fitsinjo.mg/en/
  fetched: 2026-11-08
  quote: An independent observatory for fisheries in Madagascar and the Indian Ocean
- claim: Monitors vessels fishing in Madagascar's waters using satellite data, remote sensing and a network
    of coastal communities.
  url: https://fitsinjo.mg/en/
  fetched: 2026-11-08
  quote: Drawing on satellite data, remote sensing, and a network of engaged coastal communities throughout
    Madagascar, we monitor vessels fishing in our territorial waters.
- claim: Blue Ventures' launch release described it as based in Antananarivo and said it would analyse
    information with support from Global Fishing Watch and Skylight.
  url: https://blueventures.org/civil-society-organisations-launch-new-industrial-fishing-observatory-to-tackle-illegal-unreported-and-unregulated-fishing-in-madagascar/
  fetched: 2026-11-08
  quote: The new observatory will collect, research and analyse information with support from Global Fishing
    Watch and Skylight to give decision-makers access to vessel monitoring data
