facts:
- claim: Runs from 2025 to 2027 and aims to give the first accurate range-wide population
    estimate of the Alaotran gentle lemur using drone-mounted thermal sensors and
    AI analysis.
  url: https://www.iucnsos.org/?p=8269
  fetched: 2026-11-12
  quote: It will generate the first accurate, range-wide population estimate of the
    lemur using drone-mounted thermal sensors and AI analysis, building local capacity
    to carry out ongoing monitoring.
- claim: Trained local staff are to run quarterly thermal drone surveys across the
    Alaotra marsh with a validated protocol and AI.
  url: https://www.iucnsos.org/?p=8269
