facts:
- claim: Through the Ministry of Climate Change, DEPC plays a key role in the management, protection and
    conservation of Vanuatu's natural environment, according to JNCC.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: the Department of Environmental Protection and Conservation (DEPC) through the Ministry of Climate
    Change plays a key role in the management, protection and conservation of Vanuatu’s natural environment
- claim: Supporting the registration and monitoring of Community Conservation Areas at national level
    is a key remit of DEPC, according to JNCC.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: A key remit of the DEPC is to support the registration and monitoring of CCA initiatives at a
    national level.
- claim: The Director of DEPC chairs the Biodiversity Advisory Council, which decides bioprospecting permit
    applications.
  url: https://depc.gov.vu/index.php/biodiversity-conservation/research
  fetched: 2026-11-12
  quote: The Biodiversity Advisory Council is made up of the Chairperson of the Biodiversity Advisory
    Council which is the Director of DEPC
- claim: Its Port Vila office is at the Ministry of Climate Change Adaptation compound in Nambatu.
  url: https://depc.gov.vu/index.php/biodiversity-conservation/research
