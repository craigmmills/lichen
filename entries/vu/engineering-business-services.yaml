summary: An in-country developer that worked with OCPP and DEPC during 2023 to 2026,
  providing user training and testing for a departmental data management system launched
  in January 2026.
facts:
- claim: JNCC's Vanuatu page says the Ocean Country Partnership Programme worked with
    DEPC and the in-country developers EBS between 2023 and 2026 to develop a data
    management system for all DEPC divisions.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-14
  quote: Between 2023 and 2026 OCPP worked with the DEPC and in-country developers,
    Engineering Business Services (EBS) to develop a data management system for use
    across all divisions within the Department.
- claim: The same page says EBS ran several rounds of user training and testing with
    DEPC staff, and the system was launched in January 2026.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-14
  quote: EBS performed several iterations of user training and testing for all DEPC
    staff, adapting the design according to feedback.
- claim: The page says that through work with EBS, data collected by CCA rangers through
    the app feeds directly into the DEPC data management system.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-14
  quote: Through collaboration with EBS and their work on the data management system,
    the data collected by CCA rangers via the app feeds directly into the DEPC data
    management system
- claim: A 2025 news item from Vanuatu's Department of Communications and Digital
    Transformation gives its full name as Engineering Business Services Limited.
  url: https://digital.gov.vu/index.php/media-files/news/dcdt-and-ebs-partner-to-build-vanuatus-digital-id-system-2025
  fetched: 2026-11-14
  quote: Engineering Business Services Limited (EBS)
