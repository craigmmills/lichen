- claim: The same page says land cover data for VBoS's land accounts was proposed
    to build on the work VBoS had done in partnership with Radiant Earth.
  url: https://www.unsiap.or.jp/event/2024-04-15-GIS.html
  fetched: 2026-11-15
  quote: For Land cover data, it is proposed to build on the work that VBoS has done
    in partnership with Radiant Earth, subject to review of the sources, methods and
    code.
