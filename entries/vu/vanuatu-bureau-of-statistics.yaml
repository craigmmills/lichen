  coral reef health maps, with models validated on field data.
facts:
- claim: Its project page says the Vanuatu Data Science Driving Innovation in Climate
    Change and Natural Disasters project is led by the Vanuatu Bureau of Statistics
    and was launched in 2024.
  url: https://vbos.gov.vu/index.php/en/data-publications/disaster-climate-project
  fetched: 2026-11-15
  quote: The Vanuatu Data Science Driving Innovation in Climate Change and Natural
    Disasters project is a pioneering initiative led by the Vanuatu Bureau of Statistics
    (VBoS).
- claim: The page says satellite imagery is processed through Digital Earth Pacific
    to generate annual maps, among them land use and land cover and coral reef health.
  url: https://vbos.gov.vu/index.php/en/data-publications/disaster-climate-project
  fetched: 2026-11-15
  quote: Satellite imagery processed via Digital Earth Pacific to generate annual
