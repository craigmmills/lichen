- claim: A UN SIAP page on an April 2024 training in machine learning and GIS for
    land cover estimation at VBoS says the land cover work VBoS had done in partnership
    with Radiant Earth uses the Forest Inventory, supplied by the Department of Forestry,
    as a ground truth dataset.
  url: https://www.unsiap.or.jp/event/2024-04-15-GIS.html
  fetched: 2026-11-15
  quote: This utilises the Forest Inventory as a ground truth dataset, which was made
