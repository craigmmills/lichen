summary: Biodiversity data system with an interactive map and monitoring repository, built by Engineering
  Business Services and DEPC on Nocobase, reported live across all DEPC divisions as of January 2026.
facts:
- claim: Between 2023 and 2026 the Ocean Country Partnership Programme worked with DEPC and the in-country
    developer Engineering Business Services to develop the system.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: Between 2023 and 2026 OCPP worked with the DEPC and in-country developers, Engineering Business
    Services (EBS) to develop a data management system for use across all divisions within the Department.
- claim: It includes an interactive map and a biodiversity monitoring data repository using standardised
    taxonomy lists and metadata templates.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: biodiversity monitoring data repository using standardised taxonomy lists and metadata templates
- claim: It was built with the open-source Nocobase software and is hosted on the Vanuatu Government network.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: The data system was built using open source Nocobase software and is hosted on the Vanuatu Government
    network.
- claim: As of January 2026 the system is live and in use across all DEPC divisions.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: As of January 2026, the data management system is live and is in use across all division of the
    DEPC.
- claim: Data collected by Community Conservation Area rangers through the ranger app feed directly into
    the system.
  url: https://jncc.gov.uk/our-work/vanuatu
  fetched: 2026-11-12
  quote: the data collected by CCA rangers via the app feeds directly into the DEPC data management system
