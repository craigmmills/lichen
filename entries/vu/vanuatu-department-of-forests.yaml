summary: Regulator of Vanuatu's forestry sector that collects forest resource information, advises on
  conservation and protected areas, and publishes the National Herbarium's 17,920 specimen records on
  GBIF.
facts:
- claim: The department has the regulatory and administrative responsibility for managing Vanuatu's forestry
    sector and collects information about forest resources.
  url: https://forestry.gov.vu/
  fetched: 2026-11-12
  quote: It collects information about forest resources, conducts forest research and facilitates the
    development of commercial plantations and agro-forestry systems.
- claim: It advises on forest conservation, protected areas and national parks.
  url: https://forestry.gov.vu/
  fetched: 2026-11-12
  quote: It provides advice on forest conservation, protected areas and National Parks.
- claim: A news item dated 11 July 2019 on the department's site, sourced from the Daily Post, said the
    department would lead that year's National Forest Inventory with REDD+ financial support.
  url: https://forestry.gov.vu/index.php/news-feed/44-next-national-forestry-inventory-soon
  fetched: 2026-11-12
  quote: The DOF will be taking lead in the NFI with financial support from REDD+.
- claim: It publishes on GBIF the specimen list of the Vanuatu National Herbarium, 17,920 records, where
    all plant collections made in the country have to be stored.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=9f683375-03db-465d-a930-ce7f05b612e6&limit=20
  fetched: 2026-11-12
  quote: All the plants collection made in the country have to be stored in this herbarium.
- claim: Its office is on Airport Road, Port Vila.
  url: https://forestry.gov.vu/
  fetched: 2026-11-12
  quote: Airport Road
