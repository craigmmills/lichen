summary: Created in Port Vila in 1986 and run by the Department of Forests, with 17,920
  published specimen records and a requirement to store all plant collections made
  in Vanuatu.
facts:
- claim: A Department of Forests news item describes the herbarium as a unit of the
    Department of Forestry that established a new Flora of Vanuatu database and website.
  url: https://forestry.gov.vu/index.php/news-feed/46-vanuatu-national-herbarium-new-flora-of-vanuatu
  fetched: 2026-11-14
  quote: The Vanuatu National Herbarium, a unit of the Department of Forestry, is
    pleased to announce the establishment of a new Flora of Vanuatu database and website.
- claim: The news item says herbarium staff are now adding new data to the database.
  url: https://forestry.gov.vu/index.php/news-feed/46-vanuatu-national-herbarium-new-flora-of-vanuatu
  fetched: 2026-11-14
  quote: they are now actively adding new data to it for the first time in several
    years
- claim: The Department of Forests' botany page says the herbarium was created in
    Port Vila in 1986.
  url: https://forestry.gov.vu/index.php/forestry-sections/botany
  fetched: 2026-11-14
  quote: The Vanuatu national herbarium was created in Port Vila in 1986 with the
    following objectives
- claim: Its GBIF dataset says all plant collections made in the country have to be
    stored in the herbarium, and lists 17,920 specimen records published by the Department
    of Forests.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=9f683375-03db-465d-a930-ce7f05b612e6&limit=20
  fetched: 2026-11-14
  quote: All the plants collection made in the country have to be stored in this herbarium.
- claim: Its website gives its address at the Department of Forests, Airport Road,
    Port Vila.
  url: https://pvnh.net
  fetched: 2026-11-14
  quote: Airport Road
