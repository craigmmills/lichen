summary: Forest monitoring system designed and developed during 2019 to 2021 and still
  in final design and approval as of February 2022, with a satellite monitoring system,
  a Forest Information System, a central dashboard, and tracking of cyclone and wind
  damage.
facts:
- claim: Vanuatu's forest reference level report to the UNFCCC says the National Forest
    Monitoring System was designed and developed during 2019 and 2021 and was still
    in its final stages of design and approval as of February 2022.
  url: https://redd.unfccc.int/media/national_unfccc_frl_vanuatu_final.pdf
  fetched: 2026-11-14
  quote: 'An operational National Forest Monitoring System has been designed and developed
    during 2019 and

    2021, which is currently (as of February 2022) in its final stages of design and
    approval.'
- claim: The report says its Satellite Land Monitoring System is linked to a web-based
    Forest Information System.
  url: https://redd.unfccc.int/media/national_unfccc_frl_vanuatu_final.pdf
  fetched: 2026-11-14
  quote: is linked to a web-based Forest Information System
- claim: The report says the NFMS Dashboard is the system's central monitoring and
    reporting platform.
  url: https://redd.unfccc.int/media/national_unfccc_frl_vanuatu_final.pdf
  fetched: 2026-11-14
  quote: The NFMS Dashboard is the central monitoring and reporting platform of the
    system.
- claim: The report says forest damage from cyclones and strong winds has been tracked
    by the NFMS.
  url: https://redd.unfccc.int/media/national_unfccc_frl_vanuatu_final.pdf
  fetched: 2026-11-14
  quote: cyclones or strong winds have been tracked by Vanuatu’s National Forest Monitoring
    System (NFMS)
