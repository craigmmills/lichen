website: https://pvnh.net
summary: Specimen database and interactive checklist of Vanuatu's vascular flora,
  built on Symbiota to replace a PlantNote database, with over 17,000 herbarium records
  and 1,000 photos migrated and sensitive data such as rare species locations hidden.
facts:
- claim: A Department of Forests news item says the herbarium established the new
    Flora of Vanuatu database and website, replacing an older database based on PlantNote.
  url: https://forestry.gov.vu/index.php/news-feed/46-vanuatu-national-herbarium-new-flora-of-vanuatu
  fetched: 2026-11-14
  quote: This replaces an older database, based on the PlantNote application.
- claim: The news item says it uses the Symbiota platform and makes plant data public
    while hiding sensitive data such as locations of rare species.
  url: https://forestry.gov.vu/index.php/news-feed/46-vanuatu-national-herbarium-new-flora-of-vanuatu
  fetched: 2026-11-14
  quote: Plant data is available to the public through this website (but sensitive
    data, such as locations of rare species, are hidden)
- claim: Over 17,000 herbarium records were migrated into it, with 1,000 plant photos.
  url: https://forestry.gov.vu/index.php/news-feed/46-vanuatu-national-herbarium-new-flora-of-vanuatu
  fetched: 2026-11-14
  quote: Over 17,000 herbarium records were migrated, along with 1,000 photos of plants
    (all with specimen records).
- claim: The site presents a specimen database for the herbarium and an interactive
    checklist of Vanuatu's vascular flora.
  url: https://pvnh.net
  fetched: 2026-11-14
  quote: 'Vanuatu’s Plant List : An interactive checklist of Vanuatu’s vascular flora'
