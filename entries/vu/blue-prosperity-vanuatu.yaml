summary: According to Blue Prosperity's 2023 review, this initiative jointly assessed
  reefs and marine life across Vanuatu's six provinces and held a workshop on the
  draft Marine Spatial Plan.
facts:
- claim: The Blue Prosperity site's 2023 review says Vanuatu signed a memorandum of
    understanding with the Waitt Institute and established a Blue Prosperity initiative,
    committing to sustainable management of all its ocean and full protection of 30%
    of it.
  url: https://www.blueprosperity.org/post/2023-blue-prosperity
  fetched: 2026-11-14
  quote: Vanuatu affirmed and Fiji reaffirmed their commitment to 100% sustainable
    ocean management and full protection of 30% of their ocean by signing MOUs with
    the Waitt Institute and establishing Blue Prosperity initiatives.
- claim: The same 2023 review says Blue Prosperity Vanuatu, government ministries,
    partners, communities, CRIOBE and Scripps Institution of Oceanography conducted
    the largest nationwide assessment of coral reefs and marine life in Vanuatu's
    waters, across all six provinces.
  url: https://www.blueprosperity.org/post/2023-blue-prosperity
  fetched: 2026-11-14
  quote: Blue Prosperity Vanuatu, Government Ministries, partners, communities, CRIOBE,
    and Scripps Institution of Oceanography conducted the largest nationwide assessment
    of coral reefs and marine life across Vanuatu’s waters, spanning all 6 provinces.
- claim: The page says Blue Prosperity Vanuatu held a workshop in 2023 for government
    officials and stakeholders to review the draft Marine Spatial Plan.
  url: https://www.blueprosperity.org/post/2023-blue-prosperity
  fetched: 2026-11-14
  quote: Blue Prosperity Vanuatu held a workshop to convene government officials and
    other key stakeholders to review and discuss the draft Marine Spatial Plan.
