facts:
- claim: Uses a multilayer perceptron model to estimate cover of bare ground, photosynthetic
    and non-photosynthetic vegetation from surface reflectance.
  url: https://researchdata.edu.au/seasonal-fractional-cover-australia-coverage/2029700
  quote: A multilayer perceptron (MLP) model is used to estimate percentage cover
    in three fractions – bare ground, photosynthetic vegetation (PV) and non-photosynthetic
    vegetation (NPV) from surface reflectance
  fetched: '2026-11-08'
- claim: The model was trained with Tensorflow on Landsat surface reflectance and
    about 4,000 field observations.
  url: https://researchdata.edu.au/seasonal-fractional-cover-australia-coverage/2029700
