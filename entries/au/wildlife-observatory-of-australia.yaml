summary: National platform that stores and analyses camera trap images with AI species classifiers,
  developed at the University of Queensland with QCIF, ARDC and TERN.
facts:
- claim: Developed by University of Queensland researchers and analyses millions of images.
  url: https://news.uq.edu.au/2026-06-ai-rescue-australian-wildlife-research-drowning-data
  fetched: '2026-10-31'
  quote: Developed by researchers at The University of Queensland, the Wildlife Observatory
    of Australia (WildObs) can quickly analyse millions of images taken by hidden wildlife
    cameras
- claim: Hosts classifiers from WildObs-QCIF plus Google's SpeciesNet and others.
  url: https://news.uq.edu.au/2026-06-ai-rescue-australian-wildlife-research-drowning-data
  fetched: '2026-10-31'
  quote: It hosts image classifiers developed by the WildObs-QCIF team along with Google's
    SpeciesNet
- claim: A co-investment partnership between UQ, ARDC, QCIF and TERN.
