summary: Tasmanian Aboriginal body whose statutory functions under the Aboriginal
  Lands Act 1995 include managing Aboriginal land sustainably, and which established
  palawa Enterprises to oversee the wukalina Walk tourism venture.
facts:
- claim: Under the Aboriginal Lands Act 1995 its functions include to use and sustainably
    manage Aboriginal land and its natural resources and to exercise the powers of
    owner of Aboriginal land in Tasmania.
  url: https://www.legislation.tas.gov.au/view/whole/html/inforce/current/act-1995-098
  fetched: '2026-11-17'
  quote: to use and sustainably manage Aboriginal land and its natural resources for
    the benefit of all Aboriginal persons; (b) to exercise, for the benefit of all
    Aboriginal persons, the Council's powers as owner of Aboriginal land
- claim: Established palawa Enterprises to oversee the wukalina Walk tourism venture
    within wukalina (Mt William National Park).
  url: https://www.wukalinawalk.com.au/about-us
  fetched: '2026-11-17'
  quote: palawa Enterprises Pty Ltd (pET) was established by the Aboriginal Land Council
    of Tasmania (ALCT) to oversee the operation of wukalina Walk tourism venture within
    wukalina (Mt William National Park)
