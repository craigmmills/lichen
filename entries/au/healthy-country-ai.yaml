facts:
- claim: A $2.6 million Indigenous-led program for land and sea managers in remote
    northern Australia.
  url: https://nailsma.org.au/projects/healthy-country-ai
  fetched: '2026-10-31'
  quote: A new, $2.6 Million, Indigenous-led program which aims to mobilise the latest
    digital technology for land and sea managers working in remote regions of northern
    Australia.
- claim: Enables rangers to learn and use AI and digital skills to monitor the health
    of their country.
  url: https://nailsma.org.au/projects/healthy-country-ai
  fetched: '2026-10-31'
  quote: This initiative enables local Indigenous rangers to work with scientists
    and technology specialists to learn and use new inclusive AI and digital skills
    to monitor the health of their country.
