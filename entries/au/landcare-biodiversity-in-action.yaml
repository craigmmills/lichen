summary: Active programme of 11 projects on biodiversity monitoring, species protection,
  soil health and Indigenous-led knowledge, run by Landcare Australia, with three-year
  grants from September 2025 funded through the Natural Heritage Trust.
facts:
- claim: The 11 projects cover biodiversity monitoring, threatened species protection,
    soil health, invasive species management and Indigenous-led knowledge integration.
  url: https://landcareaustralia.org.au/landcare-agriculture/biodiversity-grant-projects/
  quote: Together, these 11 projects will deliver innovative, producer-led approaches
    to biodiversity monitoring, threatened species protection, soil health improvement,
    invasive species management, and Indigenous-led knowledge integration.
  fetched: '2026-11-08'
- claim: Grants run for three years from September 2025.
  url: https://landcareaustralia.org.au/landcare-agriculture/biodiversity-grant-projects/
  quote: The Biodiversity in Action grants will be delivered over a 3-year period
    beginning in September 2025.
