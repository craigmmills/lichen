- claim: Projects use biodiversity assessment tools supported by drones and mobile
    apps.
  url: https://landcareaustralia.org.au/landcare-agriculture/biodiversity-grant-projects/
  quote: Use of biodiversity assessment tools (vegetation surveys, soil testing, habitat
    mapping) supported by digital technologies like drones and mobile apps.
  fetched: '2026-11-08'
- claim: Funded by the Australian Government through the Natural Heritage Trust.
