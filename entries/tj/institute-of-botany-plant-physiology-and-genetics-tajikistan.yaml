summary: Tajik academy institute with a herbarium fund created in 1941, which publishes its herbarium
  records through GBIF and said in January 2022 it would host the national GBIF node.
facts:
- claim: Its herbarium fund was created in 1941 and is described by the institute as a specialised botanical
    museum in Tajikistan.
  url: https://ibfgr.tj/en/herbarium-fund/
  fetched: 2026-11-09
  quote: is created in 1941 and is a unique specialized botanical museum in Tajikistan
- claim: Publishes the BRAHMS records of its herbarium fund as an occurrence dataset through GBIF.
  url: https://api.gbif.org/v1/organization/d5566dfc-6db4-4e85-9683-a5b2970513a0/publishedDataset
  fetched: 2026-11-09
  quote: '"title":"The Herbarium Fund of the Institute of Botany, Plant Physiology and Genetics at the
    Tajikistan National Academy of Sciences - BRAHMS records"'
- claim: Organised a GBIF training workshop on starting biodiversity data publication for Tajikistan in
    September 2022, under GBIF's Capacity Enhancement Support Programme.
  url: https://ibfgr.tj/en/seminar-training-gbif-september-26-28-2022/news/
  fetched: 2026-11-09
  quote: The event was organized by the Institute of Botany, Plant Physiology and Genetics, National Academy
    of Sciences of Tajikistan the in the framework of the Capacity Enhancement Support Programme (CESP
    2022-001)
- claim: Said in January 2022 that it would host Tajikistan's new GBIF node.
  url: https://ibfgr.tj/en/tajikistan-joins-gbif/news/
  fetched: 2026-11-09
  quote: which will host the new node responsible for coordinating national-scale GBIF activities
- claim: In November 2022, the institute reported taking part, with research institutions in Ukraine,
    Belarus, Armenia and Uzbekistan, in the international Biodata project on biodiversity data, in cooperation
    with the NGO Zan va Zamin.
  url: https://ibfgr.tj/en/seminar-analysis-of-the-results-of-ethnobotanical-research/news/
  fetched: 2026-11-09
  quote: participate in the implementation of the international project “Biodata” for the presentation
    of data related to biological diversity at the international level
- claim: Its address is 27 Karamova Street, Dushanbe.
  url: https://ibfgr.tj/en/
  fetched: 2026-11-09
  quote: 734017, Dushanbe, Karamova street, 27
