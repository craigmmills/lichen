summary: A closed CEPF-funded project run by Plateau Perspectives in the Yaghnob valley,
  which included camera-trap wildlife surveys and training of rangers and community
  members to continue long-term monitoring.
facts:
- claim: Plateau Perspectives says the CEPF-supported project aimed to strengthen
    conservation and community wellbeing in the Yaghnob valley, including capacity
    building in wildlife monitoring.
  url: https://www.plateauperspectives.org/en/project/yaghnob-national-park/
  fetched: 2026-11-12
  quote: The CEPF-supported project “Strengthening co-management in Yaghnob National
    Park, Tajikistan” aimed to strengthen conservation and community wellbeing
- claim: Its activities included camera-trap wildlife surveys and training park rangers
    and community members to continue long-term monitoring.
  url: https://www.plateauperspectives.org/en/project/yaghnob-national-park/
  fetched: 2026-11-12
  quote: Project activities included wildlife surveys using camera traps—documenting
    snow leopard, lynx, ibex, bears, and many other mammals as well as birds—while
    building the skills of park rangers and community members to continue long-term
    monitoring.
- claim: CEPF's safeguard social assessment for grant 114017 names Plateau Perspectives
    as grantee and plans camera-trap research by park staff and local community members.
  url: https://www.cepf.net/resources/documents/safeguard-social-assessment-165
  fetched: 2026-11-12
  quote: research, in particular with the use of camera traps by park staff and local
    community
