summary: OSCE reports SMART training in December 2024 and 20 smartphones supplied
  in April 2025; a 2021 project update reported SMART's introduction in Tajik National
  Park.
facts:
- claim: The OSCE says it ran a three-day SMART training from 21 to 23 December 2024
    for about 24 participants from five protected areas, including Pamir National
    Park, Ramit, Tigrovaya Balka, Zorkul and Shirkent.
  url: https://www.osce.org/programme-office-in-dushanbe/584357
  fetched: 2026-11-12
  quote: 'from five protected areas: Pamir National Park, Ramit Biosphere Reserve,
    Tigrovaya Balka State Nature Reserve, Zorkul State Nature Reserve, and Shirkent
    Natural Historical Park'
- claim: The OSCE says it handed 20 smartphones equipped with SMART to the State Institution
    of Specially Protected Natural Areas on 9 April 2025.
  url: https://www.osce.org/programme-office-in-dushanbe/589245
  fetched: 2026-11-12
  quote: handed over 20 smartphones equipped with the SMART (Spatial Monitoring and
    Reporting Tool) system to the State Institution of Specially Protected Natural
    Areas under the Committee for Environmental Protection.
- claim: A June 2021 GEF-UNDP snow leopard project update on globalsnowleopard.org
    reported that SMART patrolling had been introduced in the Sangvor and Lakhsh sections
    of Tajik National Park. It said more than 80 people were trained with support
    from NextGIS and described the introduction as the first in Tajikistan's history.
  url: https://globalsnowleopard.org/tajikistan_gefproject_update/
  fetched: 2026-11-12
  quote: At present, this is the only system of thematic control and monitoring in
    protected areas; and the relevant works on introducing the smart patrol system
    are carried out for the first time in the history of Tajikistan.
