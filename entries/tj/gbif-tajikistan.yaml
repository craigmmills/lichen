- claim: The Institute of Botany, Plant Physiology and Genetics said in January 2022, when Tajikistan
    joined GBIF, that it would host the new national node.
  url: https://ibfgr.tj/en/tajikistan-joins-gbif/news/
  fetched: 2026-11-09
