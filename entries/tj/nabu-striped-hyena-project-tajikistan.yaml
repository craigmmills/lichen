  quote: starteten der NABU und die Zoologische Gesellschaft für Arten- und Populationsschutz
    ein Artenschutzprojekt
- claim: In spring 2024 two striped hyenas were recorded by different camera traps,
    the basis for the project.
  url: https://www.nabu.de/wir-ueber-uns/aktionen-und-projekte/besser-als-ihr-ruf-die-streifenhyaene
  fetched: 2026-11-13
  quote: Im Frühjahr 2024 konnten gleich zwei Streifenhyänen von unterschiedlichen
    Kamerafallen erfasst werden.
- claim: Camera traps collect information on the distribution and population size
    of the striped hyenas in southern Tajikistan.
  url: https://www.nabu.de/wir-ueber-uns/aktionen-und-projekte/besser-als-ihr-ruf-die-streifenhyaene
