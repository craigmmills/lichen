summary: Species project for the striped hyena in Tajikistan, started by NABU and
  a zoological conservation society after two hyenas were recorded on camera traps
  in spring 2024, which now gather distribution and population data in the south.
facts:
- claim: NABU and the Zoological Society for the Conservation of Species and Populations
    started a species project for the striped hyena in Tajikistan.
  url: https://www.nabu.de/wir-ueber-uns/aktionen-und-projekte/besser-als-ihr-ruf-die-streifenhyaene
