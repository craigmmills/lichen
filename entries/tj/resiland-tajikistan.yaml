summary: World Bank-funded restoration project, 2022 to 2027, run by the Committee for Environmental Protection,
  using camera traps and drones against poaching and hosting the national forest inventory.
facts:
- claim: CAREC's project note gives the project period as 11 November 2022 to 30 September 2027.
  url: https://carececo.org/news/resiland/140125/resiland_tj_09_01_2025_c.pdf
  fetched: 2026-11-08
  quote: 'Окончание проекта: 30 сентября 2027г.'
- claim: CAREC reports that camera traps and drones were introduced in protected areas to combat poaching
    and monitor rare species such as the Bukhara deer.
  url: https://carececo.org/en/main/news/novye-tekhnologii-vovlechenie-mestnogo-naseleniya-podderzhka-nauki-kak-tadzhikistan-vosstanavlivaet-/
  fetched: 2026-11-08
  quote: Modern wildlife monitoring technologies, including camera traps and drones, were introduced to
    combat poaching and monitor rare species such as the Bukhara deer.
- claim: Management plans were completed for four protected areas, including the Tajik National Park,
    Yagnob National Nature Park, Tigrovaya Balka Reserve and Zorkul Reserve.
  url: https://carececo.org/en/main/news/novye-tekhnologii-vovlechenie-mestnogo-naseleniya-podderzhka-nauki-kak-tadzhikistan-vosstanavlivaet-/
  fetched: 2026-11-08
  quote: Management plans have been completed for four protected areas
- claim: The national forest inventory is carried out within this project.
  url: https://carececo.org/en/main/news/ekspertnoe-mnenie-natsionalnaya-inventarizatsiya-lesov-tadzhikistana-vyzovy-tekhnologii-i-strategich/
  fetched: 2026-11-08
  quote: This project is being implemented within the framework of the World Bank program “Tajikistan
    Resilient Landscape Restoration Project”
