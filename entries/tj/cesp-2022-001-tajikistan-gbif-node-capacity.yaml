summary: GBIF-funded project led by Samariddin Barotov to build data publication and node
  management capacity in Tajikistan, including a September 2022 training workshop attended
  by teachers from four institutions.
facts:
- claim: The project aimed to build capacity at the Tajik node in data publication and GBIF
    node management.
  url: https://ibfgr.tj/en/seminar-training-gbif-september-26-28-2022/news/
  fetched: 2026-11-09
  quote: The aim of the project is capacity development at the Tajik node on data publication
    and GBIF node management routines
- claim: Held a training workshop, "Kick starting the biodiversity data publication process
    for Tajikistan", in the Varzob region on 26 to 28 September 2022, attended by teachers
    from four Tajik institutions.
  url: https://ibfgr.tj/en/seminar-training-gbif-september-26-28-2022/news/
  fetched: 2026-11-09
  quote: a training workshop “Kick starting the biodiversity data publication process for
    Tajikistan” was held at the SAROB
- claim: Mentors and specialists from the University of Oslo and the GBIF node manager for
    Uzbekistan took part in the workshop.
  url: https://ibfgr.tj/en/seminar-training-gbif-september-26-28-2022/news/
  fetched: 2026-11-09
  quote: Mentors and specialists in the field creation data base, data management, scientific
    research from University of Oslo
