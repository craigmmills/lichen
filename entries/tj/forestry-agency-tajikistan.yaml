summary: Tajik agency whose deputy director announced a satellite and field-based national forest inventory
  on 15 July 2026, and which reportedly returned 43,082.5 hectares to the state forest fund.
facts:
- claim: The Times of Central Asia reports that the Forestry Agency's deputy director announced a national
    forest inventory using satellite images and field inspections on 15 July 2026.
  url: https://timesca.com/tajikistan-turns-to-satellites-to-discover-how-much-forest-it-has-left/
  fetched: 2026-11-08
  quote: On July 15, Deputy Forestry Agency Director Davlatali Sharifzoda announced a national inventory
    using satellite images and field inspections.
- claim: In July 2026, The Times of Central Asia reported that the agency said 43,082.5 hectares had been
    returned to the state forest fund.
  url: https://timesca.com/tajikistan-turns-to-satellites-to-discover-how-much-forest-it-has-left/
