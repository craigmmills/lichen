summary: A Tajik national NGO and IUCN member since May 2017, which CAMCA says worked
  on migratory mammal conservation from 2021 to 2025 and tested thermal drone surveys
  in Beshai Palangon reserve.
facts:
- claim: IUCN's members directory lists it as a National NGO, member since May 2017,
    with Tajikistan as its statutory state.
  url: https://iucn.org/node/34988?language=en
  fetched: 2026-11-12
  quote: 'Membership category: National NGO'
- claim: CAMCA says that from 2021 to 2025 the foundation worked through the CAMCA
    project on the conservation of migratory mammals such as Bukhara deer.
  url: https://camcaproject.org/using-drones-to-support-bukhara-deer-conservation-in-tajikistan/
  fetched: 2026-11-12
  quote: From 2021 to 2025, the Tajikistan Nature Foundation (TNF) through the CAMCA
    project, worked to strengthen the conservation of key migratory mammal species
    like Bukhara deer
- claim: CAMCA says the foundation and National Academy of Sciences specialists tested
    thermal drone surveys in Beshai Palangon State Nature Reserve for the first time.
  url: https://camcaproject.org/using-drones-to-support-bukhara-deer-conservation-in-tajikistan/
  fetched: 2026-11-12
  quote: TNF and specialists from the National Academy of Sciences of Tajikistan tested
    drone surveys with thermal imaging in Beshai Palangon State Nature Reserve for
    the first time.
- claim: CAMCA's partner page says it strengthens community-based NGOs and small businesses
    that manage the conservancies.
  url: https://camcaproject.org/partners/tnf/
  fetched: 2026-11-12
  quote: The Tajikistan Nature Foundation works towards strengthening skills, resources,
    and capacity of community-based NGOs and small businesses, which manage the conservancies
