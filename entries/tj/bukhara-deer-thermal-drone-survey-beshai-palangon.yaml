summary: A thermal drone survey of Bukhara deer in a Tajik reserve, run by Tajikistan
  Nature Foundation, with pilot flights in February 2025 and a full count of 12 flights
  in September 2025, reported by CAMCA.
facts:
- claim: CAMCA reports pilot flights in February 2025 by TNF and the ERA group testing
    thermal and RGB imaging in the reserve.
  url: https://camcaproject.org/using-drones-to-support-bukhara-deer-conservation-in-tajikistan/
  fetched: 2026-11-12
  quote: At the end of February 2025, TNF and the ERA group conducted pilot flights
    in Beshai Palangon State Nature Reserve
- claim: The full count took place from 9 to 13 September 2025, with 12 flights of
    thermal drones at night and in the early morning.
  url: https://camcaproject.org/using-drones-to-support-bukhara-deer-conservation-in-tajikistan/
  fetched: 2026-11-12
  quote: The second stage, which was the full population count, took place from 9
    to 13 September 2025, during the rut season.
- claim: CAMCA says TNF plans to keep using the method for Bukhara deer population
    estimates under the 1health4nature project.
  url: https://camcaproject.org/using-drones-to-support-bukhara-deer-conservation-in-tajikistan/
  fetched: 2026-11-12
  quote: TNF plans to finalize the methodology, ensure its applicability and reliability,
    and continue using it in the coming years for the Bukhara deer population estimation
