summary: Environmental atlas of Tajikistan, presented nationally in Dushanbe on 2
  September 2025, combining long-term monitoring data with satellite remote sensing
  on water, land, forests and biodiversity, built by UNEP and offered in print and
  a geoportal.
facts:
- claim: CAREC says the atlas was presented nationally in Dushanbe on 2 September
    2025.
  url: https://carececo.org/en/main/news/atlas-izmeneniy-okruzhayushchey-sredy-respubliki-tadzhikistan-moshchnyy-analiticheskiy-instrument/
  fetched: 2026-11-15
  quote: at the national presentation of the Atlas in Dushanbe on 2 September 2025.
- claim: The atlas was developed within a project on data and information for environmental
    monitoring in Central Asia. In September 2025, CAREC said the Committee for Environmental
    Protection was implementing the project with the CAREC Country Office in Tajikistan
    and UNEP, with financial support from the Government of the Russian Federation.
  url: https://carececo.org/en/main/news/atlas-izmeneniy-okruzhayushchey-sredy-respubliki-tadzhikistan-moshchnyy-analiticheskiy-instrument/
  fetched: 2026-11-15
  quote: This project is implemented by the Committee for Environmental Protection
    under the Government of the Republic of Tajikistan, in cooperation with the CAREC
    Country Office in Tajikistan and the United Nations Environment Programme (UNEP)
- claim: The atlas combines long-term monitoring data with satellite remote sensing.
  url: https://carececo.org/en/main/news/atlas-izmeneniy-okruzhayushchey-sredy-respubliki-tadzhikistan-moshchnyy-analiticheskiy-instrument/
  fetched: 2026-11-15
  quote: The combination of long-term monitoring data and the latest satellite remote
    sensing technologies
- claim: It covers water and land resources, forests and biodiversity.
  url: https://carececo.org/en/main/news/atlas-izmeneniy-okruzhayushchey-sredy-respubliki-tadzhikistan-moshchnyy-analiticheskiy-instrument/
  fetched: 2026-11-15
  quote: The Atlas provides extensive information on the state of water and land resources,
    forests, biodiversity, and processes driven by climate change.
- claim: The CAREC Country Office director said the atlas will be available in print
    and through a public geoportal.
  url: https://carececo.org/en/main/news/atlas-izmeneniy-okruzhayushchey-sredy-respubliki-tadzhikistan-moshchnyy-analiticheskiy-instrument/
  fetched: 2026-11-15
  quote: it will be available not only in print but also through a special Geoportal,
    accessible to the wider public.
- claim: The UN in Tajikistan says UNEP produced the atlas with the Institute of Geography
    of the Russian Academy of Sciences and Lomonosov Moscow State University's Faculty
    of Geography, with national experts coordinated by the Committee for Environmental
    Protection.
  url: https://tajikistan.un.org/en/node/300896
  fetched: 2026-11-15
  quote: The Atlas of Environmental Change for Tajikistan was produced by UNEP in
    collaboration with the Institute of Geography of the Russian Academy of Sciences
    and the Faculty of Geography at Lomonosov Moscow State University
- claim: The UN in Tajikistan says the atlas draws on six decades of national and
    satellite data and is offered in print and through an interactive geoportal with
    open access to environmental data.
  url: https://tajikistan.un.org/en/node/300896
  fetched: 2026-11-15
  quote: The Atlas is available in print and through an interactive Geoportal, which
    provides open access to up-to-date, science-based environmental data.
