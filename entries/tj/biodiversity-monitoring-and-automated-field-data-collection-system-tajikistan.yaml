summary: A UNDP-linked biodiversity data collection system for Tajikistan's National
  Biodiversity and Biosafety Centre, which NextGIS says it began building in 2020,
  based on NextGIS Collector and field-tested in 2021.
facts:
- claim: NextGIS says it began building the system in 2020 for the National Biodiversity
    and Biosafety Centre under a UNDP project.
  url: https://nextgis.com/blog/undp_tajikistan/
  fetched: 2026-11-12
  quote: In 2020, we started working on the creation and integration of a “ Biodiversity
    monitoring and automated field data collection System ” for National biodiversity
    and biosafety center (NBBC) of Tajikistan Republic.
- claim: It says field tests took place in Tajikistan's protected areas in the second
    half of 2021.
  url: https://nextgis.com/blog/undp_tajikistan/
  fetched: 2026-11-12
  quote: In the second half of 2021, field tests were conducted in the territories
    of protected areas of Tajikistan
- claim: It says the system is based on NextGIS Collector, from user forms to a database
    on a web GIS server and mobile recording.
  url: https://nextgis.com/blog/undp_tajikistan/
  fetched: 2026-11-12
  quote: The monitoring system itself is based on our technology NextGIS Collector
- claim: More than 30 rangers and researchers were trained at the final workshop and
    tested data collection in the Ramit State Nature Reserve.
  url: https://nextgis.com/blog/undp_tajikistan/
  fetched: 2026-11-12
  quote: During the final workshop, more than 30 rangers and researchers from various
    protected areas and institutes of Tajikistan attended a full course
