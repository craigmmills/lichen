summary: Centre under the Committee for Environmental Protection that coordinates Tajikistan's obligations
  under the CBD, hosts its clearing-house mechanism, and is named as partner on two GEF-funded projects.
facts:
- claim: The CBD Secretariat lists the head of the National Biodiversity and Biosafety Center as Tajikistan's
    CBD primary national focal point.
  url: https://www.cbd.int/countries/nfp?country=tj
  fetched: 2026-11-08
  quote: CBD Primary NFP
- claim: The CBD Secretariat gives the Centre's address as 47 Shevchenko Street, Dushanbe.
  url: https://www.cbd.int/countries/nfp?country=tj
  fetched: 2026-11-08
  quote: 47 Shevchenko str.
- claim: GSLEP names the Centre as executing partner of the GEF-funded Pamir Alay and Tien Shan snow leopard
    project, 2016 to 2021.
  url: https://globalsnowleopard.org/gef-undp-projects/tajikistan-pamir-alay-tien-shan/
  fetched: 2026-11-08
  quote: National Biodiversity and Biosafety Centre
- claim: The Centre's site hosts the biodiversity clearing-house mechanism for the Convention on Biological
    Diversity.
  url: http://www.biodiv.tj/
  fetched: 2026-11-08
  quote: Механизм посредничества по Биоразнообразию
- claim: The site has sections on monitoring and on the snow leopard, and a database section covering
    fauna, flora, protected areas and the Red Book.
  url: http://www.biodiv.tj/
  fetched: 2026-11-08
  quote: База данных
- claim: The CBD country profile says the centre was created to coordinate Tajikistan's obligations under
    the Convention on Biological Diversity.
  url: https://www.cbd.int/countries/profile?country=tj
  fetched: 2026-11-09
  quote: was created to coordinate activities aimed at fulfilling the obligations and requirements of
    the Republic of Tajikistan, in regard to the UN Convention on Biological Diversity
- claim: The CBD country profile lists among its responsibilities preparing national reports on biodiversity
    for the CBD Conference of the Parties and monitoring implementation of the national biodiversity strategy
    and action plan.
  url: https://www.cbd.int/countries/profile?country=tj
  fetched: 2026-11-09
  quote: creating a database and monitoring the NBSAP implementation process, developing national reports
    on the status and use of biodiversity for submission to the CBD Conference of Parties
- claim: The CBD country profile lists among its main activities creating a data bank on flora, fauna,
    ecosystems and landscapes.
  url: https://www.cbd.int/countries/profile?country=tj
  fetched: 2026-11-09
  quote: creating a data bank on the diversity of flora and fauna, ecosystems and landscapes
- claim: The CBD lists the centre's head, Olimjon Yatimov, as Tajikistan's primary national focal point
    for the Convention.
  url: https://www.cbd.int/countries/nfp?country=tj
  fetched: 2026-11-09
  quote: Mr. Olimjon Yatimov Head National Biodiversity and Biosafety Center Committee for Environmental
    Protection under the Government of the Republic of Tajikistan 47 Shevchenko str. 734025 Dushanbe Tajikistan
    CBD Primary NFP
- claim: UNDP names the centre as implementing partner of a GEF-funded project, running from 2023 to 2028,
    on arid ecosystem biodiversity and sustainable land management in the lower Amu Darya basin of Khatlon
    region.
  url: https://www.undp.org/tajikistan/projects/conservation-and-sustainable-management-high-value-arid-ecosystems-lower-amu-darya-basin-sin-project
  fetched: 2026-11-09
  quote: IMPLEMENTING PARTNER TJK-Ntl Biodiver&Biosafety Ctr
