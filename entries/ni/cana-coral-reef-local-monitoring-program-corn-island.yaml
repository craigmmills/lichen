summary: Project from 2010 aiming to set up long-term community-involved ecological
  monitoring for the Corn Islands Marine Reserve; preliminary surveys chose sites
  and a baseline, and photo monitoring was stopped for the moment.
facts:
- claim: The March 2010 project page says its aim was to establish a long-term ecological
    monitoring programme involving the local community, in support of the Corn Islands
    Marine Reserve.
  url: https://www.rufford.org/projects/rodrigo-villate/educating-people-for-a-local-monitoring-program-of-the-cana-coral-reef-ecosystem-at-the-corn-island-nicaragua/
  fetched: 2026-11-14
  quote: Our objective is to strengthen the consolidation of the Corn Islands Marine
    Reserve by using an environmental education and training program, for the establishment
    of a long term ecological monitoring program that involves directly the local
    community.
- claim: The November 2010 update says preliminary surveys were done to choose monitoring
    sites and establish a biological baseline.
  url: https://media.rufford.org/media/project_reports/69.09.09%20November%202010.pdf
  fetched: 2026-11-14
  quote: Preliminary surveys for choosing the monitoring sites and establishing a
    biological base  line were done
- claim: The update says the photo monitoring programme was stopped for the moment.
  url: https://media.rufford.org/media/project_reports/69.09.09%20November%202010.pdf
  fetched: 2026-11-14
  quote: For the moment we stopped with the photo monitoring program
