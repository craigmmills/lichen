summary: A WCS-run hawksbill turtle nest monitoring project in the Pearl Cays, which
  reported over 20 nests excavated in the 2015 hatching season, with success rates
  of 46 to 93%, and school visits.
facts:
- claim: An April 2015 WCS post says the first hawksbill nest of the 2015 season was
    reported in the Pearl Cays and that its intensive monitoring season would start
    in June, with trips to the cays to collect data on early nesters.
  url: https://honduras.wcs.org/Noticias/articleType/ArchiveView/month/4/year/2015.aspx
  fetched: 2026-11-15
  quote: Our intensive monitoring season will start in June, but we will be making
    trips out to the cays to collect data on these early nesters.
- claim: An August 2015 WCS post says more than 20 nests had been excavated in the
    Pearl Cays that hatching season, with nest success rates between 46 and 93%.
  url: https://honduras.wcs.org/Noticias/articleType/ArchiveView/month/8/year/2015.aspx
  fetched: 2026-11-15
  quote: We have so far excavated over 20 nests, with nest success rates between 46-93%.
- claim: The same archive names a Hawksbill Project Coordinator and Field Supervisor
    visiting schools in Pearl Lagoon and Haulover.
  url: https://honduras.wcs.org/Noticias/articleType/ArchiveView/month/8/year/2015.aspx
  fetched: 2026-11-15
  quote: The Hawksbill Project Coordinator Laura Irvine and Hawksbill Project Field
    Supervisor William McCoy
