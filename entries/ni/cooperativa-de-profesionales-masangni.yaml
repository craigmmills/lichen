  quote: Masangni will purchase necessary equipment and materials, and provide training
    to CFE staff in data collection and analysis.
- claim: The final report's budget includes salaries for Masangni staff, and the report
    marks the tree, mammal and bird, and threat monitoring objectives as fully achieved.
