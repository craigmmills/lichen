- claim: The Rufford project page says Masangni would buy equipment and train community
    forest enterprise staff in data collection and analysis, and support the setting
    up and sampling of permanent forest monitoring plots and mammal and bird transects.
  url: https://rufford.org/projects/valbert-martinez-salgado/establishing-ecological-monitoring-systems-to-support-sustainable-management-of-indigenous-community-forests-in-nicaraguas-north-atlantic-autonomous-region
