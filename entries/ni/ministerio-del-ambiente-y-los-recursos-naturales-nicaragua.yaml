summary: Nicaragua's environment ministry administers protected areas under Law 290, according to a MARENA
  resolution, builds SNMRV and began community monitoring through ENDE-REDD+.
facts:
- claim: A 2021 MARENA resolution published in March 2022 cites Law 290 as giving MARENA the administration
    of the National System of Protected Areas.
  url: https://faolex.fao.org/docs/pdf/nic208992.pdf
  fetched: 2026-11-12
  quote: 'Que la Ley No.290, Ley de Organización, Competencia

    y Procedimientos del Poder Ejecutivo en su artículo 28,

    inciso d), corresponde al Ministerio del Ambiente y los

    Recursos Naturales (MARENA), la administración del

    Sistema Nacional de Áreas Protegidas del país'
- claim: The resolution quotes Decree 01-2007, article 5, describing MARENA as the governing, regulatory
    and directing body for administering SINAP.
  url: https://faolex.fao.org/docs/pdf/nic208992.pdf
  fetched: 2026-11-12
  quote: es el ente rector, normativo y directivo de la administración
- claim: A MARENA workshop record on community monitoring describes work begun by MARENA through its ENDE-REDD+
    programme.
  url: https://www.marena.gob.ni/Enderedd/wp-content/uploads/2020/11/Experiencias-monitoreo-comunitario-sesion-RiCzoMya_Gda.pdf
  fetched: 2026-11-12
  quote: Que el MARENA a través del Programa ENDE -REDD+ inició en el año
- claim: Nicaragua's CBD clearing-house presentation describes implementation of a biodiversity monitoring
    system in the RBB and a designed web register for species monitoring validated against GBIF.
  url: https://www.cbd.int/doc/meetings/chm/chm-rw-2013-la/other/chm-rw-2013-la-item-05-ni-es.pdf
