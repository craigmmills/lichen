summary: A sea turtle nesting monitoring programme, begun in 2008 with fourteen rangers,
  which a May 2016 report says marked 133 turtles with metal or PIT tags on three
  beaches from 2013 to 2015.
facts:
- claim: The May 2016 technical report says the programme's aim includes providing
    essential data for the protection of these migratory species, on nesting beaches
    in and around the La Flor and Chacocente wildlife refuges.
  url: https://pasopacifico.org/wp-content/uploads/2019/09/Informe-Tortugas-Marinas.pdf
  fetched: 2026-11-15
  quote: Paso del Istmo, proporcionando datos
- claim: The May 2016 report says monitoring covered January to December each year
    in 2013 to 2015, except at Playa Escondida in 2013, where it began in June. Night
    monitoring recorded nest data, metal tagging and recaptures.
  url: https://pasopacifico.org/wp-content/uploads/2019/09/Informe-Tortugas-Marinas.pdf
  fetched: 2026-11-15
  quote: Se monitorea de Enero a Diciembre
- claim: The report says 133 turtles were marked with metal tags or PIT tags on three
    nesting beaches in 2013 to 2015.
  url: https://pasopacifico.org/wp-content/uploads/2019/09/Informe-Tortugas-Marinas.pdf
  fetched: 2026-11-15
  quote: Un total de 133 tortugas se han marcado con placas y/o Pits en tres playas
    de anidación
- claim: The report says the programme began in 2008 on the southern Pacific coast,
    with a group of fourteen rangers.
