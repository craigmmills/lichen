facts:
- claim: Describes itself as an international non-profit conserving the wildlife and ecosystems of the
    Sahara and adjacent Sahelian grasslands.
  url: https://saharaconservation.org/tag/dama-gazelle/page/2/
  fetched: '2026-11-08'
  quote: Sahara Conservation is an international non-profit organization dedicated to conserving the wildlife
    and ecosystems of the Sahara Desert and adjacent Sahelian grasslands for the benefit of nature and
    people.
- claim: Says two field missions in Niger's Termit massif in 2025 produced updated data on Saharan biodiversity.
  url: https://saharaconservation.org/news/together-for-the-sahara-and-the-sahel-2025-highlights/
  fetched: '2026-11-08'
  quote: In 2025, two field missions in the Termit massif, in Niger, yielded updated data on Saharan biodiversity
    in this key landscape.
- claim: Says it made the first formal addax population estimate in 2007 in the area that became the Termit
    Massif Reserve.
  url: https://saharaconservation.org/addax/
  fetched: '2026-11-08'
  quote: We conducted the first formal population estimate in 2007 in what was going to be the Termit
    Massif Reserve
