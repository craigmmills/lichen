summary: Giraffe monitoring in the Gadabedji reserve, where a 2020 report to the Rufford
  Foundation describes ecoguards using CyberTracker on smartphones and travelling
  about 804 km on surveys in June 2020.
facts:
- claim: A 2020 monitoring report filed with the Rufford Foundation says two local
    community ecoguards were recruited by the Giraffe Conservation Foundation to monitor
    the translocated giraffe, alongside four ecoguards recruited by the Niger Fauna
    Corridors Project.
  url: https://media.rufford.org/media/project_reports/27641-1_Monitoring_Report_June_2020.pdf
  fetched: '2026-11-12'
  quote: monitoring of the giraffe alongside four (4) ecoguards recruited by the Niger
    Fauna Corridors Project.
- claim: The report presents monthly giraffe monitoring data collected by the ecoguards.
  url: https://media.rufford.org/media/project_reports/27641-1_Monitoring_Report_June_2020.pdf
  fetched: '2026-11-12'
  quote: This report presents the key monthly giraffe monitoring data collected by
    the ecoguards in June 2020.
- claim: The report lists CyberTracker installed on rugged smartphones among the ecoguards'
    equipment, and says survey tracks were recorded with it.
  url: https://media.rufford.org/media/project_reports/27641-1_Monitoring_Report_June_2020.pdf
  fetched: '2026-11-12'
  quote: Two (2) Cybertracker installed on a rough smartphone (Crosscall Trekker M1).
- claim: The report says the ecoguards travelled about 804 km on monitoring surveys
    in June 2020.
  url: https://media.rufford.org/media/project_reports/27641-1_Monitoring_Report_June_2020.pdf
  fetched: '2026-11-12'
  quote: In June 2020, the GBR ecoguards travelled approximately 804 km during the
    monitoring surveys
