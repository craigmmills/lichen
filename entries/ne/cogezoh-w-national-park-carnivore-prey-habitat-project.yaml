summary: Closed 2020 to 2022 project in W National Park, run by COGEZOH, that set
  up an informant early warning system and a conflict database; IUCN's brief describes
  it as reducing human-wildlife conflict.
facts:
- claim: IUCN's 2025 Niger country brief dates the project 2020 to 2022 and names
    COGEZOH as implementation partner, with lion, cheetah, hyena and leopard as target
    species.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: 3.2 Project to secure the habitat of large carnivores’ prey in the W National
    Park
- claim: The brief says the project set up an early warning system of local informants
    equipped with data collection tools to monitor and report potential conflicts.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: a network of local informants equipped with data collection tools to monitor
