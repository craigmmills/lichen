status: closed
summary: Closed 2018 to 2020 Giraffe Conservation Foundation project whose training
  and four giraffe translocations were reported in IUCN's 2025 brief, alongside a
  reserve population of 15.
facts:
- claim: IUCN's 2025 Niger country brief dates the project 2018 to 2020 and names
    the Giraffe Conservation Foundation as implementation partner, in the Gadabedji
    Biosphere Reserve.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: in support of the Niger National Strategy (2018 – 2020)
- claim: The brief says giraffe populations in the Giraffe Zone and the Gadabedji
    Biosphere Reserve were monitored continuously with new and more precise monitoring
    techniques.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: Continuous monitoring
- claim: The brief says rangers and eco-guards were trained in monitoring, data entry
    and analysis, in 25 training events.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: training was provided to rangers and eco-guards in monitoring, data entry,
    and analysis
- claim: The brief says four giraffe were translocated to the Gadabedji Biosphere
    Reserve, which then held 15 giraffe including three calves.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: the reserve now hosts 15 giraffes, including
