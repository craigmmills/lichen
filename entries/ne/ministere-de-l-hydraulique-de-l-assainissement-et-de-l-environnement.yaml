summary: Niamey-based ministry whose 2023 decree covers protected areas, forest infrastructure, water
  management and desertification, and whose statistical yearbook reports wildlife indicators such as giraffes
  protected and patrols in protected areas.
facts:
- claim: Its mission includes drawing up and carrying out national policy on the environment, water and
    sanitation.
  url: https://hydraulique.gouv.ne/?page_id=157
  fetched: '2026-11-08'
  quote: Le Ministère de l’Environnement, de l’Hydraulique et de l’Assainissement (MEH/A) ayant pour mission
    entre autres, l’élaboration et la mise en œuvre de la politique nationale en matière d’Environnement,
    d’Eau et d’Assainissement
- claim: Its site lists wildlife indicators, among them the number of giraffes protected, the total area
    of protected areas and the area of Ramsar sites.
  url: https://hydraulique.gouv.ne/?page_id=157
