    the Saharan biome and establish faunal migration corridors.
  url: https://thegef.org/projects-operations/projects/3760
  fetched: 2026-11-13
  quote: To expand Niger's managed protected area (PA) system within the Saharan biome
    by demonstrating effective approaches to PA management and establishing faunal
    migration corridors.
- claim: The GEF page lists the project as completed, with UNDP as implementing agency
    and the then environment ministry (MELD) and its General Directorate for the Environment,
    Water and Forestry (DGEEF) as executing agencies.
  url: https://thegef.org/projects-operations/projects/3760
