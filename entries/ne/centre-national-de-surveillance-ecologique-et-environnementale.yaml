summary: Niger environment ministry body, created by decree in 2007, that carries out long-term ecological
  monitoring through nine observatories and collects vegetation data across the country each year.
facts:
- claim: Its GBIF publisher record says it has a national environmental monitoring system of nine ecological
    monitoring observatories, collecting vegetation data each year across the country.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: Le Centre National de Surveillance Ecologique et Environnementale dispose d'un dispositif National
    de Surveillance Environnementale (DNSEE) composé de 9 observatoire de suivi écologique
- claim: The same record says its data feed national indicators and reporting to the environment conventions
    on biodiversity, desertification and climate change.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: Il alimente les indicateurs nationaux et des conventions sur l'environnement sur la Biodiversitén,
    la lutte contre la désertification et le changement climatique.
- claim: The record was created in 2018 and gives its address as Niger's environment ministry in Niamey.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: '"address":["Ministère de l''Environnement du Niger; Niamey-Niger"]'
- claim: Placed under the ministry in charge of the environment and created by decree in 2007 to build
    on the ROSELT long-term ecological observatory programme.
  url: https://cnsee-niger.org/
  fetched: '2026-11-08'
  quote: Le CNSEE est une structure placée sous la tutelle du Ministère en charge de l’environnement et
    créé par Décret n°2007-376/PRN/ME/LCD du 06 septembre 2007 dans le but de capitaliser les acquis du
    programme ROSELT
- claim: Its main mission is long-term ecological and environmental monitoring, by collecting, processing
    and sharing biophysical, geospatial and socio-economic information across the whole country.
  url: https://cnsee-niger.org/
  fetched: '2026-11-08'
  quote: la principale mission est la surveillance écologique et environnementale à long terme, à travers
    la collecte, le traitement et la diffusion des informations biophysiques, géo-spatiales et socioéconomiques
    pertinentes sur l’ensemble du territoire national
- claim: Through its network of observatories it follows indicators of desertification, biodiversity and
    climate change, with Niger's universities and projects.
  url: https://cnsee-niger.org/
  fetched: '2026-11-08'
  quote: Le CNSEE à travers son réseau d’Observatoires, assure un suivi à moyen et long terme des indicateurs
    de la désertification, de la biodiversité et des changements/variabilités climatiques, en partenariat
    avec les universités du Niger et les projets.
- claim: Monitors land degradation with remote sensing and GIS, following the land degradation neutrality
    approach.
  url: https://cnsee-niger.org/
  fetched: '2026-11-08'
  quote: Ce suivi est réalisé à travers les outils de Télédétection et de Système d’Information Géographique
    (SIG) suivant l’approche NDT.
- claim: Its site says it has a wildlife monitoring set-up at its observatories and land restoration sites,
    using the apparent typo CNESS for CNSEE.
  url: https://cnsee-niger.org/
  fetched: '2026-11-08'
  quote: dispose d’un dispositif de suivi de la faune à l’échelle des observatoires tout comme à l’échelle
    des sites de récupération des terres dégradées
- claim: GBIF's publisher record describes a national environmental monitoring set-up of nine ecological
    observatories that collect vegetation data across the country each year.
