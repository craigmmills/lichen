summary: Nigerien NGO created by decree in 2000 and an IUCN member since August 2025,
  which trained and supervised a network of 40 local informants from 2017.
facts:
- claim: IUCN's member directory describes it as a Nigerien NGO created by decree
    in 2000 that works to conserve biodiversity and preserve wetlands.
  url: https://iucn.org/our-union/members/iucn-members/contribution-la-gestion-des-zones-humides
  fetched: '2026-11-12'
  quote: is a Nigerien organisation that works extensively to conserve biodiversity
    and preserve wetlands
- claim: IUCN lists it as a national NGO member since August 2025, with Niger as its
    statutory state.
  url: https://iucn.org/our-union/members/iucn-members/contribution-la-gestion-des-zones-humides
  fetched: '2026-11-12'
  quote: National NGO
- claim: IUCN's 2025 Niger country brief says its giraffe project set up a population
    monitoring system using photo-monitoring and photo albums for identification.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: the project implemented a population monitoring system, utilising photo-monitoring
    to track giraffe
- claim: The same brief says its W National Park project created a database to track
    human-wildlife conflict trends and established an early warning network of local
    informants equipped with data collection tools.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: the project created a database to track HWC
- claim: IUCN France says that from 2017, with support from the Small-Scale Initiatives
    Programme (PPI) among others, it trained and supervised a network of 40 local
    informants who report wildlife incursions into villages and illegal activities
    in Park W.
  url: https://uicn.fr/cogezoh/
  fetched: '2026-11-12'
  quote: a network of 40 local informants equipped with means of communication and
    transport
- claim: The same page says the network's information helped protected area managers
    stop and dismantle poaching networks.
  url: https://uicn.fr/cogezoh/
  fetched: '2026-11-12'
  quote: The work of this network was highly appreciated by the protected area managers
    who were able to stop and dismantle poaching networks and wild meat traffickers.
