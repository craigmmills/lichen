summary: Niger-led programme started in April 2022, financed by AFD and FFEM grants totalling 8 million
  euros, which FFEM said would use weekly Sentinel-2 images to identify new deforestation to the nearest
  hectare.
facts:
- claim: In September 2022, FFEM described the project as led by Niger and supported by AFD and FFEM.
  url: https://www.ffem.fr/en/actualites/niger-satellites-are-helping-fight-deforestation
  fetched: '2026-11-08'
  quote: like the Sahel Wood Energy project, led by Niger and supported by the Agence française de développement
    (AFD) and the French Facility for Global Environment (FFEM)
- claim: In September 2022, FFEM said Niger's forestry administration would be able to compare weekly
    Sentinel-2 images to identify new deforestation to the nearest hectare; the page calls it the Nigerian
    administration in error.
  url: https://www.ffem.fr/en/actualites/niger-satellites-are-helping-fight-deforestation
  fetched: '2026-11-08'
  quote: By comparing the images taken each week by these satellites, the Nigerian forestry administration
    will be able to identify to the nearest hectare any new areas impacted by deforestation.
- claim: In September 2022, FFEM said the data would be made public through a web platform.
  url: https://www.ffem.fr/en/actualites/niger-satellites-are-helping-fight-deforestation
  fetched: '2026-11-08'
  quote: The data collected will be made available to the general public via a web platform.
- claim: FFEM says the programme started in April 2022 and is financed by AFD and FFEM grants totalling
    8 million euros.
  url: https://www.ffem.fr/en/actualites/niger-satellites-are-helping-fight-deforestation
  fetched: '2026-11-08'
  quote: The programme officially started in April 2022, and is financed through a number of AFD and FFEM
    grants totalling €8 million.
