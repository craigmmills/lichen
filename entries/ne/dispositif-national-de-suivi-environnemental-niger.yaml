summary: Niger's national environmental monitoring set-up, formed from the ROSELT observatory network
  created in October 2000, made up of nine observatories covering most of the country's ecological diversity.
facts:
- claim: ROSELT Niger, the long-term ecological observatory network, was created in October 2000, and
    the national monitoring set-up (DNSE) was formed from it.
  url: https://cnsee-niger.org/index.php/direction-nation/
  fetched: '2026-11-08'
  quote: Le Réseau d’Observatoires de Surveillance Écologique à Long Terme du Niger (ROSELT Niger) a été
    créé en octobre 2000 sur la base des acquis de ROSELT régional/OSS (ROSELT, 2009).
- claim: Made up of nine observatories placed to cover most of the country's ecological and agro-ecological
    diversity.
  url: https://cnsee-niger.org/index.php/direction-nation/
  fetched: '2026-11-08'
  quote: Il est constitué de neuf observatoires répartis de manière à prendre en compte l’essentiel de
    la diversité écologique et agro écologique qui caractérise le pays.
- claim: Three observatories carried the OSS label from 1994 and six more were added in 2003.
  url: https://cnsee-niger.org/index.php/direction-nation/
  fetched: '2026-11-08'
  quote: ont été complétés en 2003 par six (6) autres (Falmey-Gaya, Maradi-Mayahi-Dakoro, Tamou, Azawak,
    Diffa, Zinder)
