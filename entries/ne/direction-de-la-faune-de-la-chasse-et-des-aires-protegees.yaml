summary: Directorate of Niger's environment ministry that holds data on wildlife species, protected areas
  and threatened species, and published a 2015 dry-season mammal census of W National Park on GBIF.
facts:
- claim: Its GBIF publisher record describes it as a directorate of Niger's environment ministry.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: La Direction de la Faune de la Chasse et des Aires Protégées est une direction du Ministère de
    l'Environnement du Niger.
- claim: The same record says it holds data mainly on Niger's wildlife species and their status, with
    data on protected areas and threatened species.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: Elle héberge des données essentiellement sur les espèces fauniques du Niger ainsi que leur état.
- claim: GBIF lists it as a data publisher in Niger.
  url: https://api.gbif.org/v1/organization?country=NE&limit=50
  fetched: '2026-11-08'
  quote: '"title":"Direction de la Faune de la Chasse et des Aires Protégées"'
- claim: A directorate of Niger's environment ministry that holds data on Niger's wildlife species, protected
    areas and threatened species.
  url: https://api.gbif.org/v1/organization/c3a0f40d-360a-4bb2-bd24-7d628fefa8d7
  fetched: '2026-11-08'
  quote: La Direction de la Faune de la Chasse et des Aires Protégées est une direction du Ministère de
    l'Environnement du Niger. Elle héberge des données essentiellement sur les espèces fauniques du Niger
    ainsi que leur état.
- claim: GBIF lists its address in Niamey.
  url: https://api.gbif.org/v1/organization/c3a0f40d-360a-4bb2-bd24-7d628fefa8d7
  fetched: '2026-11-08'
  quote: '"city":"Niamey","province":"Niamey","country":"NE"'
- claim: Published on GBIF a census of mammals in W National Park, made by line transects in the 2015
    dry season.
  url: https://api.gbif.org/v1/organization/c3a0f40d-360a-4bb2-bd24-7d628fefa8d7/publishedDataset
  fetched: '2026-11-08'
  quote: A census of pedestrian mammals was conduct during the dry season of 2015 in the W National Park
    using line transects
- claim: The environment ministry's 2019-2023 statistical yearbook gives DFC/AP as the source of its table
    of giraffes protected each year, which counts 1,148 in Tillabéri in 2023, and of its table of patrols
    in protected areas.
  url: https://hydraulique.gouv.ne/wp-content/uploads/2025/07/ANNUAIRE-2019-2023-MHAE-VF.pdf
  fetched: '2026-11-08'
  quote: 'Tableau 147: Nombre des girafes protégées et conservées'
- claim: A directorate of Niger's Ministry of the Environment that holds data mainly on the country's
    wild animal species and their status.
  url: https://api.gbif.org/v1/organization/c3a0f40d-360a-4bb2-bd24-7d628fefa8d7
  fetched: 2026-11-08
  quote: La Direction de la Faune de la Chasse et des Aires Protégées est une direction du Ministère de
    l'Environnement du Niger.
- claim: Its GBIF publisher record says it holds general data on wildlife and protected areas, and on
    threatened and extinct wild animal species.
  url: https://api.gbif.org/v1/organization/c3a0f40d-360a-4bb2-bd24-7d628fefa8d7
  fetched: 2026-11-08
  quote: elle dispose en plus des données générales sur la faune sauvage et les aires protégées, des informations
    sur les espèces fauniques menacées
