id: cogezoh-west-african-giraffe-monitoring-harikanassou-koure
kind: project
name: Support for the conservation of the last populations of West African giraffe
  in Harikanassou and Kouré
scope: ne
ai_label: conservation-tech
realms:
- land
countries:
- ne
status: closed
summary: Closed 2021 to 2023 project run by COGEZOH using photo-identification monitoring,
  which counted giraffe rising from 194 in 2021 to 335 in 2023, according to IUCN's
  2025 brief.
facts:
- claim: IUCN's 2025 Niger country brief dates the project 2021 to 2023 and names
    COGEZOH as implementation partner.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: habitat in the rural communities of Harikanassou and Kouré (2021 – 2023)
- claim: The brief says the project set up a population monitoring system using photo-monitoring
    and photo albums for identification.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: the project implemented a population monitoring system, utilising photo-monitoring
    to track giraffe
- claim: The brief reports that photo-identification monitoring counted giraffe numbers
    rising from 194 in 2021 to 335 in 2023, and that 418 giraffe-related incidents
    were recorded over 22 months.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: giraffe numbers increased from 194 in 2021 to 335 in 2023
- claim: The brief describes the project's outcomes as achieved.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: The project achieved several key outcomes
