summary: Niger's national mapping institute, re-created by decree in March 2023 as a public administrative
  body, which sells maps and satellite images and uses optical and radar imagery for deforestation monitoring.
facts:
- claim: Its mission is to set up and develop the topographic and cartographic equipment of the national
    territory.
  url: https://www.ignn.net/mission-de-lignn.html
  fetched: '2026-11-08'
  quote: L’Institut Géographique National du Niger (IGN.N) a pour missions la mise en place et le développement
    de l’équipement topographique et cartographique du territoire national.
- claim: Created in 1991 and re-created by decree in March 2023 as a public administrative body, placed
    under the technical oversight of the Ministry of Urban Planning and Housing.
  url: https://ignn.net/mot-du-directeur-general.html
  fetched: '2026-11-08'
  quote: Il a été placé par le Décret N°2023-293/PRN/MU/L du 31 Mars 2023 sous la tutelle technique du
    Ministère de l’Urbanisme et du Logement.
- claim: Acts as the national centre for cartographic and topographic documentation and sells maps, aerial
    photographs and satellite images of the national territory.
  url: https://www.ignn.net/mission-de-lignn.html
  fetched: '2026-11-08'
  quote: Commercialiser les cartes et plans, les photographies aériennes, les images satellites et les
    autres documentations géographiques intéressant le territoire national.
- claim: Lists remote sensing among its fields of competence.
  url: https://www.ignn.net/mission-de-lignn.html
  fetched: '2026-11-08'
  quote: Télédétection
- claim: Says its remote sensing team uses optical and radar imagery, including Sentinel images, to make
    maps and tools for forest issues such as deforestation monitoring and other land-use change.
  url: https://ignn.net/la-teledetection-et-technique-spacialestts.html
  fetched: '2026-11-08'
  quote: À partir des dernières innovations en matière d’imagerie optique et radar (images Sentinel),
    l’équipe produit des cartes et outils facilitant la compréhension des enjeux liés à la forêt comme
    le suivi de la déforestation et autres changements d’usage des terres.
- claim: Its address is in Niamey.
  url: https://www.ignn.net/mission-de-lignn.html
  fetched: '2026-11-08'
  quote: NIAMEY - NIGER
