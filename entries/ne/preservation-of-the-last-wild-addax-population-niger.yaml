status: closed
summary: Closed 2020 to 2022 Noé project in Termit and Tin-Toumma reserve that IUCN's
  2025 brief reports introduced camel-based monitoring, identified addax sub-groups
  and suffered weather-related drone failures.
facts:
- claim: IUCN's 2025 Niger country brief dates the project 2020 to 2022 and names
    Noé as implementation partner, in the National Nature Reserve of Termit and Tin-Toumma.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: 3.1 Preservation of the last wild population of addax in the world (2020
    – 2022)
- claim: The brief says community-based monitoring was introduced, with local agents
    using camels for surveillance and data collection.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: Community-based monitoring was introduced, where local agents used
- claim: The brief says the project identified up to four sub-groups of addax in Niger,
    with precise locations for three, and deployed seven local agents in Niger and
    up to four in Chad.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: The project successfully identified up to four sub-groups of addaxes
- claim: The brief says drones failed in extreme weather and aerial surveys were cancelled
    because of COVID-19 and security risks.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: Technical failures with drones caused by extreme weather conditions
