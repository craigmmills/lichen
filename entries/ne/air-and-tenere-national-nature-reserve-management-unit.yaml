summary: Management unit of the Aïr and Ténéré reserve that IUCN's 2025 brief says
  had limited monitoring capacity, though all 17 agents were trained in SMART; it
  uses the SMART tool.
facts:
- claim: IUCN's 2025 Niger country brief names the reserve's Protected Area Management
    Unit and says it had limited capacity and resources for monitoring and enforcement.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: The Protected Area Management Unit (PAMU)
- claim: The brief says all 17 of its agents were trained in SMART monitoring techniques
    and equipped to enhance their surveillance capabilities.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: training all 17 PAMU agents in SMART monitoring techniques
- claim: The brief says community guards occasionally joined the unit on surveillance
    missions.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: Park Management Unit (PAMU) on surveillance missions
- claim: Sahara Conservation's Niger report for the fourth quarter of 2025 names the
    management unit of the Aïr and Ténéré reserve (RNNAT) among those taking part
    in its activities.
  url: https://saharaconservation.org/wp-content/uploads/2026/04/SCF_2025_RAPPORT-TRIMESTRIEL_NIGER_T4_VF2.pdf
