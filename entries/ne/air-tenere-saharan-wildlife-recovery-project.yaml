id: air-tenere-saharan-wildlife-recovery-project
kind: project
name: Reversing the decline of threatened Saharan wildlife in the Aïr and Ténéré National
  Nature Reserve
scope: ne
ai_label: conservation-tech
realms:
- land
countries:
- ne
status: closed
summary: Closed 2021 to 2024 project in the Aïr and Ténéré reserve, run by Sahara
  Conservation, which trained 17 agents in SMART, deployed 40 camera traps and reported
  17 patrols covering over 8,500 km.
facts:
- claim: IUCN's 2025 Niger country brief dates the project 2021 to 2024 and names
    Sahara Conservation Fund as implementation partner.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: Nature Reserve (2021 – 2024)
- claim: The brief says the project trained all 17 agents of the reserve's Protected
    Area Management Unit in SMART monitoring techniques.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: training all 17 PAMU agents in SMART monitoring techniques
- claim: The brief says 40 camera traps were deployed for systematic wildlife monitoring,
    especially in known Dama gazelle areas, and identified 20 to 30 Dama gazelles.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: The deployment of 40 camera traps provided valuable data on wildlife
- claim: The brief reports 17 patrols covering over 8,500 km during the project.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: A total of 17 patrols covering over 8,500 km were completed
- claim: The brief says a no-cost extension let the team continue through the first
    half of 2024.
  url: https://iucnsos.org/wp-content/uploads/2021/03/Country-Brief_Niger-V5.pdf
  fetched: '2026-11-12'
  quote: allowed the team to continue its efforts through the first semester of
