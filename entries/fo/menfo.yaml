status: active
runner: unknown
summary: Metadata catalogue for Faroese nature and environment data, established on
  1 January 2025 according to its registration guide, which asks organisations to
  document archived and recent data and plans a map display.
facts:
- claim: Its registration guide, issued in Umhvørvisstovan's name, gives it as established
    on 1 January 2025.
  url: https://www.us.fo/wp-content/uploads/2025/12/Metadata-vegleiding-1.4.pdf
  fetched: 2026-11-14
  quote: 'Umhvørvisstovan The Metadatabase of Environment and Nature in the Faroe
    Islands (MENFO) FO: Metadátugrunnurin Established 01.01.2025'
- claim: Established to outline and harness knowledge on the nature and environment
    of the Faroe Islands, with a vision of a one-stop source of freely available metadata.
  url: https://www.us.fo/wp-content/uploads/2025/12/Metadata-vegleiding-1.4.pdf
  fetched: 2026-11-14
  quote: was established to outline and harness established knowledge on the nature
    and the environment of the Faroe Islands. MENFO envisions a one-stop solution
    for the scientific community, policymakers and the public for freely available
    metadata
- claim: Asks all Faroese organisations and other interested parties to document archived
    and recent data.
  url: https://www.us.fo/wp-content/uploads/2025/12/Metadata-vegleiding-1.4.pdf
  fetched: 2026-11-14
  quote: all Faroese organisations and other interested parties are encouraged to
    document both archived and recent data
- claim: Its metadata fields are mainly adopted from the GBIF metadata profile, supplemented
    by a Faroese biodiversity group metadata workshop hosted at Umhvørvisstovan in
    April 2024.
  url: https://www.us.fo/wp-content/uploads/2025/12/Metadata-vegleiding-1.4.pdf
  fetched: 2026-11-14
  quote: supplemented with information agreed upon in the Faroese biodiversity group
    metadata workshop hosted at Umhvørvisstovan in April 2024.
- claim: The guide plans to show metadata with geographical positions on a map.
  url: https://www.us.fo/wp-content/uploads/2025/12/Metadata-vegleiding-1.4.pdf
  fetched: 2026-11-14
  quote: The vision is to combine metadata with the geographical position(s) to be
    displayed on a map.
