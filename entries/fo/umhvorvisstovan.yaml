  quote: Umhvørvisstovan er stovnur undir Umhvørvismálaráðnum.
- claim: Its 2023 annual report lists environmental and nature protection and environmental research among
    its fields.
  url: https://www.us.fo/wp-content/uploads/2024/12/Umhvorvisstovan-arsfragreidingin-2023.pdf
