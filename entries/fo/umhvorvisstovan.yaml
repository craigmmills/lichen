    maps, image maps and sea charts.
  url: https://www.us.fo/wp-content/uploads/2024/12/Umhvorvisstovan-arsfragreidingin-2023.pdf
  fetched: 2026-11-12
  quote: Deildin ger og viðlíkaheldur topografisk kort, myndakort og sjókort.
