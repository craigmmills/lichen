summary: Its marine research programme committee awarded DKK 14 million to four projects in 2021 from
  Danish government funds; it also funded BlueCea, which aims at AI-based seafloor imagery identification.
facts:
- claim: The programme committee of its Marine Research in the North Atlantic Ocean programme awarded
    DKK 14 million to four projects in 2021, from funds allocated by the Danish government.
  url: https://gransking.fo/en/resources/news/funding-awarded-to-4-new-marine-research-projects
  fetched: 2026-11-12
  quote: The Programme Committee for the Marine Research in the North Atlantic Ocean Programme has awarded
    14 M DKK to 4 projects.
- claim: The programme aims to strengthen cooperation between Greenland, the Faroe Islands and Denmark
    on marine research in the North Atlantic.
  url: https://gransking.fo/en/resources/news/funding-awarded-to-4-new-marine-research-projects
  fetched: 2026-11-12
  quote: The Programme aim is to strengthen the cooperation between Greenland, Faroe Islands and Denmark
    on marine research in the North Atlantic Ocean.
- claim: The 2021 funding announcement lists TOPLINK, on marine top predators as ecosystem indicators
    in the central North Atlantic, among the funded projects.
  url: https://gransking.fo/en/resources/news/funding-awarded-to-4-new-marine-research-projects
  fetched: 2026-11-12
  quote: TOPLINK - Marine top predators as ecosystem indicators in the central North Atlantic
- claim: Funded the BlueCea project, which draws on Greenland Institute of Natural Resources seafloor
    imagery and aims to apply AI identification to it.
  url: https://tos.org/oceanography/article/the-potential-of-low-tech-tools-and-artificial-intelligence-for-monitoring-blue-carbon-in-greenlands-deep-sea
  fetched: 2026-11-12
  quote: This work has been funded by Granskingarráðið for the BlueCea project (grant number 8014)
- claim: Its office is at Bryggjubakki 12, Tórshavn.
  url: https://gransking.fo/en/resources/news/funding-awarded-to-4-new-marine-research-projects
