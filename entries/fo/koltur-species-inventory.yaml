summary: Closed Tjóðsavnið project that inventoried Koltur's plants, birds and invertebrates from 2019
  to 2024, recording 519 species as a baseline for monitoring, backed by a DKK 2 million three-year grant.
facts:
- claim: Tjóðsavnið conducted an inventory of Koltur's plant, bird and invertebrate diversity as a first
    step towards a planned nature reserve, to enable long-term monitoring of ecological change.
  url: https://www.tjodsavnid.fo/nature-of-koltur
  fetched: 2026-11-12
  quote: As a first step towards that goal, Tjóðsavnið is conducting an inventory of life on the island
    by recording the plant, bird, and invertebrate diversity.
- claim: The 2019 to 2024 inventory recorded 519 species, set out in a 2025 paper as a baseline for future
    monitoring.
  url: https://ojs.setur.fo/index.php/frit/article/view/905
  fetched: 2026-11-12
  quote: The inventory focussed on terrestrial species of birds, plants and invertebrates and resulted
    in a total of 519 species recorded from the island since 2019.
- claim: The museum received a three-year grant of DKK 2 million from the Danish Aage V. Jensens Fonde
    for the research, after pilot work began in 2019.
  url: https://www.tjodsavnid.fo/news-in-english/funding-received-for-nature-research-in-koltur
  fetched: 2026-11-12
  quote: The grant of 2 mio. DKK is from the Danish Aage V. Jensens Fonde.
