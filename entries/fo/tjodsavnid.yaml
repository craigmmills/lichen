summary: Faroe Islands National Museum, established in 2018 by merging the culture and natural history
  museums, which publishes eight GBIF datasets and leads a 2025 paper on a 2019 to 2024 Koltur species
  inventory.
facts:
- claim: Established in 2018 by merging the national museums of culture and natural history, with departments
    including plants, terrestrial animals and marine animals.
  url: https://trap.fo/en/culture/tjodsavnid/
  fetched: 2026-11-12
  quote: Tjóðsavnið (The National Museum) was established in 2018 by merging the country’s national museums
    of culture and natural history .
- claim: Its cultural history predecessor was established as a public institution by an act of the Løgting
    in 1952.
  url: https://trap.fo/en/culture/tjodsavnid/
  fetched: 2026-11-12
  quote: Føroya Fornminnissavn (Faroe Islands Museum of Cultural History) was established as a public
    institution by a Løgting Act in 1952.
- claim: A March 2026 presentation by its staff on puffin counts on Mykines cites the museum's 2025 report
    on Ramsar counts and surveys, with counts shown from 2011 to 2025.
  url: https://www.us.fo/wp-content/uploads/2026/03/Framloga-Janus-Tjodsavnid-2026.pdf
  fetched: 2026-11-12
  quote: Aldará, J., & Hansen, L. J. (2025). Ramsarteljingar og -kanningar 2025 (No. 2025–2). Tjóðsavnið.
- claim: Visit Faroe Islands says the biologists in charge of the annual research reported to Ramsar for
    the Faroese Ramsar sites are part of the museum.
  url: https://visitfaroeislands.com/en/sustainability/news/to-expand-the-commitments-for-the-ramsar-annotated-islands-it-will-be-important-to-work-more-closely
  fetched: 2026-11-12
  quote: The biologists in charge are part of the Tjodsavnid, the National Museum of the Faroe Islands.
- claim: Its staff lead a 2025 paper on a 2019 to 2024 species inventory of the island of Koltur, set
    as a baseline for long-term monitoring of the island's terrestrial ecosystem.
  url: https://ojs.setur.fo/index.php/frit/article/view/905
  fetched: 2026-11-12
  quote: A species inventory was conducted on the island of Koltur (Faroe Islands) between 2019 and 2024,
    serving as a baseline for future monitoring of the terrestrial ecosystem of the island.
- claim: Its English news page reports that freshwater monitoring, from lake samples collected in 2025,
    added at least seven new non-biting midge records to the Faroese checklist.
  url: https://www.tjodsavnid.fo/news-in-english/tag/insects
  fetched: 2026-11-12
  quote: Freshwater monitoring has added several new records of non-biting midges (Chironomidae) to the
    Faroese checklist.
- claim: Its GBIF datasets include a sampling-event dataset of invertebrates from about 70 stream locations
    across the Faroe Islands, 2007 to 2010.
  url: https://api.gbif.org/v1/organization/a8a6a199-031f-4d9e-b912-6c5e25b054b8/publishedDataset?limit=20&fields=title
  fetched: 2026-11-12
  quote: Fieldwork was carried out on 75 sampling days and comprised a total of 228 sampling events distributed
    across approximately 70 stream locations throughout the Faroe Islands.
- claim: Publishes eight datasets through GBIF of terrestrial and marine flora and fauna.
  url: https://api.gbif.org/v1/organization/a8a6a199-031f-4d9e-b912-6c5e25b054b8
  fetched: 2026-11-12
  quote: '"numPublishedDatasets":8'
