summary: Faroese ornithology association that invited public participation in Global
  Big Day in May 2023 and organised a research evening in Perlan after establishing
  the Kenneth Williamson bird fund.
facts:
- claim: In May 2023, KVF described it as the Faroese Ornithology Association and
    reported that it invited the public to take part in that year's Global Big Day.
  url: https://kvf.fo/node/156970
  fetched: 2026-11-15
  quote: Føroya Fuglafrøðifelag, the Faroese Ornithology Association, invites members
    of the public to take part in Global Big Day, an annual celebration of birds.
- claim: Taking part means registering with eBird and entering details such as species
    and location into the app.
  url: https://kvf.fo/node/156970
  fetched: 2026-11-15
  quote: To take part, register with eBird , spend a few minutes observing a bird,
    then enter details such as species and location into the app.
- claim: A University of the Faroe Islands event page says the association organised
    a research evening in Perlan in Tórshavn and had set up the Kenneth Williamson
    bird fund earlier that year.
  url: https://www.setur.fo/fo/setrid/tiltoek/fuglagransking-i-perluni
  fetched: 2026-11-15
  quote: Føroya Fuglafrøðifelag skipar fyri granskingarkvøldi í Perluni í Havn hóskvøldið
    9. september klokkan 19. Fyrr í ár setti felagið á stovn Kenneth Williamson-fuglagrunnin.
- claim: The same page says that with support from Tórshavn municipality it had been
    possible to invite several young researchers to the Faroes to study bird life.
  url: https://www.setur.fo/fo/setrid/tiltoek/fuglagransking-i-perluni
  fetched: 2026-11-15
  quote: Við stuðuli frá Tórshavnar Kommunu hevur verið gjørligt at boðið fleiri ungum
    granskarum til Føroya at granska í okkara spennandi fuglalívi
- claim: The evening's programme included a pilot study on the potential use of unmanned
    aerial vehicles for seabird monitoring in the Faroes.
  url: https://www.setur.fo/fo/setrid/tiltoek/fuglagransking-i-perluni
  fetched: 2026-11-15
  quote: '"The potential use of Unmanned Aerial Vehicles for seabird monitoring in
    the Faroes – a pilot study"'
