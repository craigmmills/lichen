summary: Active regular freshwater monitoring scheme run by Tjóðsavnið, using chironomid
  pupal exuviae collection, which gave at least seven new Faroese species records
  from lakes sampled in 2025.
facts:
- claim: Tjóðsavnið says it conducts ecological monitoring on land and in freshwater,
    and that collecting chironomid pupal exuviae is one of its routine freshwater
    monitoring methods.
  url: https://www.tjodsavnid.fo/news-in-english/chirope
  fetched: 2026-11-15
  quote: Tjóðsavnið is conducting ecological monitoring on land and in freshwater.
    One of the routine monitoring methods for freshwater habitats is the collection
    of Chironomid pupal exuviae.
- claim: Pupal exuviae collected from lakes in 2025 gave at least seven new species
    records for the Faroese fauna.
  url: https://www.tjodsavnid.fo/news-in-english/chirope
  fetched: 2026-11-15
  quote: At least seven new species records for the Faroese fauna have been made based
    on pupal exuviae collected from lakes in 2025 alone.
- claim: The page calls it Tjóðsavnið's regular freshwater monitoring scheme and says
    the Faroese chironomid list has grown to well beyond 100 species.
  url: https://www.tjodsavnid.fo/news-in-english/chirope
  fetched: 2026-11-15
  quote: Together with the seven recent new records made during Tjóðsvanið’s regular
    freshwater monitoring scheme, the Chironomid list for the Faroes grew to well
    beyond 100 species.
