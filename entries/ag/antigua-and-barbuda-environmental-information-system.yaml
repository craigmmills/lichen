summary: National environmental information system reported in November 2021, built by Mona GeoInformatics
  Institute and Design + Environment Inc., GEF-funded and implemented through the Department of Environment,
  with visualisation of indicator status for monitoring and reporting.
facts:
- claim: In November 2021, The Gleaner reported the establishment of a national environmental information
    system developed by Mona GeoInformatics Institute with Design + Environment Inc. to help the government
    monitor its environment.
  url: https://past.jamaica-gleaner.com/article/news/20211102/mona-geoinformatics-launches-antigua-and-barbudas-environmental-information
  fetched: 2026-11-12
  quote: The Government of Antigua and Barbuda is now better equipped to monitor its environment through
    the establishment of a national environmental information system (EIS), which was developed by Jamaica’s
    Mona GeoInformatics Institute (MGI) in partnership with Design + Environment (DE) Inc.
- claim: The 2021 article says the system includes visualisation of the status of environmental indicators
    for monitoring and reporting.
  url: https://past.jamaica-gleaner.com/article/news/20211102/mona-geoinformatics-launches-antigua-and-barbudas-environmental-information
  fetched: 2026-11-12
  quote: it also includes visualisation of the status of environmental indicators, to improve compliance
    by producing and sharing evidence-based information for monitoring and reporting.
- claim: It was funded by the GEF and implemented through the Department of Environment.
  url: https://past.jamaica-gleaner.com/article/news/20211102/mona-geoinformatics-launches-antigua-and-barbudas-environmental-information
  fetched: 2026-11-12
  quote: The EIS was developed through funding from the Global Environment Facility (GEF) and implemented
    through the Department of Environment, Ministry of Health and the Environment of the Government of
    Antigua and Barbuda.
