summary: Statutory corporation, self-described as self-sustaining and not-for-profit, whose Environment
  Unit covers Nelson's Dockyard National Park and which conducted the 2020 mangrove wetland surveys with
  the Department of Environment.
facts:
- claim: The NPA says it is established as a statutory corporation and is self-sustaining and not-for-profit.
  url: https://www.nationalparksantigua.com/?p=2185
  fetched: 2026-11-12
  quote: The National Parks Authority is a unique heritage and environmental protection management organization
    that is established as a Statutory Corporation.
- claim: Its Environment Unit was set up in August 2011 and covers the marine and terrestrial areas of
    Nelson's Dockyard National Park.
  url: https://www.nationalparksantigua.com/environment/
  fetched: 2026-11-12
  quote: The work of the NPA-EU covers the marine and terrestrial Nelson Dockyard National Park (NDNP).
- claim: The NPA conducted the 2020 mangrove wetland surveys of Nelson's Dockyard National Park in partnership
    with the Department of Environment.
  url: https://www.nationalparksantigua.com/wp-content/uploads/2023/12/2020-NDNP-Mangrove-Survey-Report.pdf
  fetched: 2026-11-12
  quote: This study was conducted by the National Parks Authority through partnership with the Antigua
    & Barbuda Department of Environment.
