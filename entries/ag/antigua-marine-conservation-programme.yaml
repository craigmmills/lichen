summary: Sea turtle nesting monitoring programme, run and built by the Environmental
  Awareness Group, which a 2024 presentation says launched in 2021 and counted 43
  nests in 2022 and 66 in 2023.
facts:
- claim: An EAG presentation to the 2024 WIDECAST meeting says the programme launched
    in 2021 and that 2022 was the first year of a consistent nest monitoring protocol
    on 10 beaches.
  url: https://widecast.org/What/AnnualMeeting/2024/Presentations/Garcia%20-%20Threats%20in%20Antigua.pdf
  fetched: 2026-11-13
  quote: 2022 was the first year of a consistent nest monitoring protocol on 10 beaches
- claim: The presentation lists monitoring 11 beaches during the July to November
    seasons and tagging turtles.
  url: https://widecast.org/What/AnnualMeeting/2024/Presentations/Garcia%20-%20Threats%20in%20Antigua.pdf
  fetched: 2026-11-13
  quote: Monitoring 11 beaches during July- November seasons
- claim: The presentation's review of nesting seasons gives 43 nests in 2022 and 66
    in 2023.
  url: https://widecast.org/What/AnnualMeeting/2024/Presentations/Garcia%20-%20Threats%20in%20Antigua.pdf
  fetched: 2026-11-13
  quote: Total Nests 43 66
- claim: The State of the World's Sea Turtles grants page for 2022 says the EAG is
    monitoring nesting beaches on 10 beaches in Antigua to estimate nesting turtles
    and set a baseline for population trends.
  url: https://seaturtlestatus.org/swot-grantees/environmental-awareness-group-antigua-2022
  fetched: 2026-11-13
  quote: The Environmental Awareness Group (EAG) is conducting ongoing sea turtle
    nesting beach monitoring efforts on 10 beaches throughout Antigua to create an
    accurate estimate of nesting turtles
