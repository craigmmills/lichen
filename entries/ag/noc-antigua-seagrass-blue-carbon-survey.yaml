facts:
- claim: NOC scientists ran acoustic survey and sediment coring campaigns on Antigua to study the health,
    extent and carbon capture of seagrass.
  url: https://projects.noc.ac.uk/cme-programme/node/62
  fetched: 2026-11-12
  quote: A team of NOC scientists are currently on the island of Antigua conducting an acoustic survey
    and sediment coring field campaigns that will improve the understanding of the health, extent and
    importance of seagrass in capturing carbon.
- claim: The work is meant to give the first quantitative assessment of the blue carbon potential of Antigua's
    seagrass meadows.
