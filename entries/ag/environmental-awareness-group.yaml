summary: Antigua and Barbuda's oldest environmental NGO, founded in 1989, which in 2023 surveyed Antiguan
  racers on four offshore islands, where CEPF reports a fall from about 1,200 in 2016 to about 400.
facts:
- claim: Antigua News describes the EAG as Antigua and Barbuda's oldest environmental NGO, founded in
    1989.
  url: https://antigua.news/2025/09/30/eag-welcomes-new-executive-director-to-lead-next-phase-of-conservation-in-antigua-and-barbuda/
  fetched: 2026-11-12
  quote: The Environmental Awareness Group (EAG), Antigua and Barbuda’s oldest and most prominent environmental
    NGO, has appointed Dr. Mareba M. Scott as its new Executive Director.
- claim: In a story originally published in its 2023 Impact Report, CEPF said the EAG and partners were
    conducting regular wildlife monitoring and biosecurity checks on the four islands where Antiguan racers
    lived.
  url: https://www.cepf.net/stories/managing-threats-facing-the-antiguan-racer
  fetched: 2026-11-12
  quote: The Environmental Awareness Group (EAG) and partners are conducting regular wildlife monitoring
    and biosecurity checks on the four islands where racers are present.
- claim: CEPF reports a 2023 field survey showing the racer population falling from about 1,200 in 2016
    to about 400 in 2023.
  url: https://www.cepf.net/stories/managing-threats-facing-the-antiguan-racer
  fetched: 2026-11-12
  quote: a 2023 field survey showed racer populations plummeting by two-thirds, from roughly 1,200 individuals
    found in 2016 to only 400 individuals in 2023.
- claim: Its Offshore Island Conservation Program surveyed racer snakes on four offshore islands in 2023.
  url: https://antigua.news/2023/12/30/eag-is-concerned-about-the-racer-snake-population-at-green-island/
  fetched: 2026-11-12
  quote: The Offshore Island Conservation Program by the EAG recently undertook a survey of racer snakes
    inhabiting four offshore islands.
- claim: CEPF's 2025 Caribbean portfolio overview lists a 50,000 dollar grant to the EAG for Preserving
    the Antiguan Racer, April 2025 to August 2026.
  url: https://www.cepf.net/resources/documents/annual-portfolio-overview-caribbean-2025
  fetched: 2026-11-12
  quote: 5 116488 Environmental Awareness Group Inc. Preserving the Antiguan Racer 3 Apr-25 Aug-26 $50,000
- claim: BirdsCaribbean reports that the EAG's Wadadli Warblers Bird Club took part in the Caribbean Waterbird
    Census for the second year in 2022, covering eight wetland sites on Antigua.
  url: https://birdscaribbean.org/?p=16271
  fetched: 2026-11-12
  quote: 2022 was the Environmental Awareness Group (EAG) Wadadli Warblers Bird Club’s second year of
    participating in the CWC. This year they covered eight wetland sites across Antigua!
