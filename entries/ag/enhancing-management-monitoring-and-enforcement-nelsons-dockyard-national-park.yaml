summary: Closed project led by the National Parks Authority, funded by BIOPAMA with
  a 84,700 euro grant from June 2021 to May 2022, planning a patrol and survey vessel
  to support marine monitoring.
facts:
- claim: The description of the June 2021 to May 2022 project planned procurement
    of a marine vessel to enable park patrols and marine biodiversity surveys.
  url: https://www.nationalparksantigua.com/projects/biopama-project
  fetched: 2026-11-13
  quote: The project will facilitate the procurement of a marine vessel to enhance
    the capacity of the Nelson’s Dockyard National Park to conduct patrols, execute
    marine biodiversity surveys
- claim: The project description said the NPA would begin marine monitoring once the
    vessel was operational, with initial training for park wardens.
  url: https://www.nationalparksantigua.com/projects/biopama-project
  fetched: 2026-11-13
  quote: Once the operationalization of the vessel, is completed the NPA will immediately
    commence marine monitoring activities.
- claim: The page gives the 2018 Advanced METT Plus assessment of the park as the
    diagnostic tool behind the project.
  url: https://www.nationalparksantigua.com/projects/biopama-project
  fetched: 2026-11-13
  quote: 'Advanced METT Plus: Nelson’s Dockyard National Park, Antigua (2018).'
- claim: BIOPAMA's project sheet lists it as a Small Technical Grant of 84,700 euros
    running from June 2021 to May 2022.
  url: https://action.biopama.org/wp-content/uploads/2021/06/STG_573_Infofiche.pdf
  fetched: 2026-11-13
  quote: Small Technical Grant | 84, 700.00 €
- claim: The project sheet for June 2021 to May 2022 said the NPA had added a marine
    ecologist and planned a comprehensive marine and coastal monitoring programme
    that the boat would support.
  url: https://action.biopama.org/wp-content/uploads/2021/06/STG_573_Infofiche.pdf
  fetched: 2026-11-13
  quote: will embark on developing and implementing a comprehensive marine
