facts:
- claim: Mammoth Geospatial says it worked with UNDP and CEPA in 2025 and 2026 to
    develop and roll out a forest monitoring system for environmental monitoring across
    the country.
  url: https://mammothgeospatial.com/projects/undp_cepa/
  fetched: 2026-11-13
  quote: Mammoth worked with the United Nations Development Programme (UNDP) and Papua
    New Guinea's Conservation and Environment Protection Authority (CEPA) to develop
    and roll out a forest monitoring system
- claim: The system links satellite monitoring, spatial analysis, case management
    and field verification, so forest disturbance alerts can be tracked through to
    verification in the field.
  url: https://mammothgeospatial.com/projects/undp_cepa/
  fetched: 2026-11-13
  quote: Forest disturbance alerts can be identified, investigated and tracked through
    to verification in the field.
- claim: It combines a Django case management platform, QGIS, satellite imagery and
    alerts, and drone mapping.
  url: https://mammothgeospatial.com/projects/undp_cepa/
  fetched: 2026-11-13
  quote: The system combines a Django-based case management platform with QGIS for
    spatial analysis, satellite imagery and forest disturbance alerts, and drone mapping
    for on-the-ground verification.
- claim: The page says the system is now running as part of PNG's forest monitoring
    work.
  url: https://mammothgeospatial.com/projects/undp_cepa/
  fetched: 2026-11-13
  quote: The system is now running as part of PNG's forest monitoring work
