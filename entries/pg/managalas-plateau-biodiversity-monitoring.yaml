summary: Active community monitoring on the Managalas Plateau, reported in June 2026,
  where local team leaders and Landscape Alliance scientists use camera traps, acoustic
  devices and eDNA, with camera traps producing about 1.5 terabytes per grid monthly.
facts:
- claim: Forests News reported in June 2026 that mapping the Managalas Plateau's biodiversity
    is the current task of its 152 clans, the local NGO Managalas Conservation Foundation
    and EU-funded partners Landscape Alliance.
  url: https://www.forestsnews.org/160930/whats-in-a-rainforest-mapping-png-biodiversity
  fetched: 2026-11-13
  quote: This is the current task of Managalas’ 152 clans, local NGO Managalas Conservation
    Foundation (MCF) and EU-funded partners Landscape Alliance.
- claim: Local Biodiversity Team Leaders work with Landscape Alliance scientists to
    set up camera traps and acoustic monitoring devices.
  url: https://www.forestsnews.org/160930/whats-in-a-rainforest-mapping-png-biodiversity
  fetched: 2026-11-13
  quote: a group of freshly minted Biodiversity Team Leaders — local young people
    trained to track the Plateau’s flora and fauna — are working with scientists from
    the Landscape Alliance to set up camera traps and acoustic monitoring devices.
- claim: The methods range from traditional ecological knowledge to eDNA.
  url: https://www.forestsnews.org/160930/whats-in-a-rainforest-mapping-png-biodiversity
  fetched: 2026-11-13
  quote: diverse methods ranging from traditional ecological knowledge to eDNA.
- claim: Camera traps produce about 1.5 terabytes of data per grid per month.
  url: https://www.forestsnews.org/160930/whats-in-a-rainforest-mapping-png-biodiversity
  fetched: 2026-11-13
  quote: 1.5 terabytes per grid per month
- claim: Biodiversity Team Leaders say WildMon, a conservation technology nonprofit,
    trained them to set up the audio and camera-trap devices.
  url: https://www.forestsnews.org/162273/papua-new-guinea-biodiversity-monitoring-managalas
  fetched: 2026-11-13
  quote: The training was provided by WildMon , a nonprofit conservation technology
    organization specializing in biodiversity monitoring.
