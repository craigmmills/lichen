status: active
summary: A wildlife management programme working with four Indigenous communities
  in the Bismarck Forest Corridor, run by the Wildlife Conservation Society, which
  reports installing 48 camera traps at Kwiop in June 2021.
facts:
- claim: Works with four Indigenous communities in the Bismarck Forest Corridor; field
    activities are coordinated by the Wildlife Conservation Society with CEPA.
  url: https://www.fao.org/in-action/swm-programme/where-we-work/papua-new-guinea/en
  fetched: 2026-11-15
  quote: Field activities are coordinated by the Wildlife Conservation Society in
    collaboration with the national Conservation and Environment Protection Authority
    (CEPA).
- claim: Disease indicators have been added to the community ranger patrolling form.
  url: https://www.fao.org/in-action/swm-programme/where-we-work/papua-new-guinea/en
  fetched: 2026-11-15
  quote: Zoonotic and other disease indicators have been added to the community ranger
    patrolling form to flag early signs of outbreaks.
- claim: WCS Papua New Guinea says 48 camera traps were installed in June 2021 at
    Kwiop, Jiwaka Province, to monitor wildlife in the Mt Goplom conservation area,
    as part of the SWM Programme.
  url: https://programs.wcs.org/png/About-Us/News/articleType/ArticleView/articleId/16928/First-camera-trap-videos-of-Dwarf-Cassowaries-in-Mt-Goplom-Conservation-Area-along-the-Bismarck-forest-corridor-ecosystem.aspx
  fetched: 2026-11-15
  quote: In June 2021, 48 camera traps were installed at Kwiop, Jiwaka Province, deep
    in the Papua New Guinea highlands. The aim was to monitor wildlife in the newly
    declared Mt. Goplom conservation area
