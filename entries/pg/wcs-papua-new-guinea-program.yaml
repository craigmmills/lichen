  url: https://png.wcs.org/About-Us.aspx
  fetched: 2026-11-12
  quote: Today, WCS Papua New Guinea program (WCS PNG) employs more than 60 staff
    based at four offices around the country.
- claim: It undertakes rapid biodiversity surveys of suspected biodiversity hotspots
    such as the Hindenburg Wall and Manus and Mussau Islands.
  url: https://png.wcs.org/Initiatives/Mangrove-Rehabilitation-and-Protection.aspx
  fetched: 2026-11-12
  quote: Undertaking rapid biodiversity surveys to quantify the biodiversity of suspected
    biodiversity hotspots (such as the Hindenburg Wall, Manus and Mussau Islands)
