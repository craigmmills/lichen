website: https://pngreddplus.org/?p=300
summary: An operational national forest monitoring and MRV system, led by the PNG Forest Authority, using
  Collect Earth and TerraPNG, with a 2017 web portal and a planned prototype deforestation alert system.
facts:
- claim: Described as an operational national forest monitoring and MRV system, with point sampling and
    wall-to-wall mapping using Collect Earth and TerraPNG, tools hosted by the PNG Forest Authority and
    the Climate Change and Development Authority.
  url: https://pngreddplus.org/?p=300
  fetched: 2026-11-09
  quote: PNG established a robust domestic MRV system, which contains in-country verification using two
    different methods (point sampling and wall-to-wall mapping) with tools (Collect Earth and TerraPNG)
    hosted by different government organizations
- claim: Its Climate Change and Forest Monitoring Web-Portal was released in 2017 to share forest and
    land use information.
  url: https://pngreddplus.org/?p=300
  fetched: 2026-11-09
  quote: PNG established and officially released PNG Climate Change and Forest Monitoring Web-Portal (
    http://png-nfms.org/portal/ ) in 2017 by Prime Minister to disseminate forest and land use information
- claim: The government decided to develop a prototype deforestation alerts and monitoring system with
    FAO assistance, as part of the monitoring function of the system.
  url: https://pngreddplus.org/?p=3002
  fetched: 2026-11-09
  quote: the GoPNG decided to develop prototype PNG Deforestation Alerts and Monitoring System using the
    latest technologies with FAO assistance
- claim: The alert system was asked for to monitor possible deforestation in protected areas, REDD+ project
    areas and logging constraint areas monthly or weekly.
  url: https://pngreddplus.org/?p=3002
  fetched: 2026-11-09
  quote: the needs to monitor the potential deforestation areas in the national protected areas, REDD+
    project areas and logging constraints areas more frequently such as monthly or even weekly have been
    raised by the stakeholders
- claim: The Green Climate Fund, approving a REDD+ results-based payment to Papua New Guinea in July 2025,
    says the country advanced a national forest monitoring system tailored to its forest ecosystems.
  url: https://www.greenclimate.fund/project/fp273
  fetched: 2026-11-09
  quote: advancing a national forest monitoring system tailored to its diverse forest ecosystems
