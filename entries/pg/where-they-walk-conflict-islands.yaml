  quote: Over the past six months, our dedicated ranger team has been conducting monthly
    surveys to gather crucial data on the walking sharks of the Conflict Islands.
- claim: Surveys record length, girth, sex and weight, take identification photographs
    and collect fin clips and blood samples.
  url: https://conservationnation.org/tracking-the-walking-sharks-a-6-month-milestone/
  fetched: 2026-11-13
  quote: Walking shark surveys involve measuring the total length, girth, sex organs,
