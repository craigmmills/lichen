  url: https://conservationnation.org/tracking-the-walking-sharks-a-6-month-milestone/
  fetched: 2026-11-13
  quote: While in the field, the ranger team uses the EarthRanger app to collect all
    data, allowing them to work paperlessly.
- claim: The project is a collaboration between The Walking Shark Project and CICI
    to gather baseline data on the Milne Bay walking shark.
  url: https://conservationnation.org/walk-this-way/
