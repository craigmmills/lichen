facts:
- claim: Azercosmos said in March 2025 that it had carried out a forest monitoring programme in Papua
    New Guinea in collaboration with the Commonwealth of Nations.
  url: https://azercosmos.az/media-center/news/azercosmos-has-completed-monitoring-of-the-forests-in-papua-new-guinea
  fetched: 2026-11-09
  quote: Azercosmos, in collaboration with The Commonwealth of Nations , has carried out a forest monitoring
    program in Papua New Guinea.
- claim: The study estimated that about 79% of the country is covered by forest.
  url: https://azercosmos.az/media-center/news/azercosmos-has-completed-monitoring-of-the-forests-in-papua-new-guinea
  fetched: 2026-11-09
  quote: The study determined that approximately 79% of the country’s territory is covered by forests.
- claim: An AI-based platform for forest monitoring from satellite imagery was announced as expected to
    launch in the following months; no page read shows it launched.
  url: https://azercosmos.az/media-center/news/azercosmos-has-completed-monitoring-of-the-forests-in-papua-new-guinea
  fetched: 2026-11-09
  quote: One of the latest solutions introduced within the program is the development of an AI-based platform
    . This platform will conduct forest monitoring using satellite imagery , enabling the timely identification
    of risks. The platform is expected to be launched in the coming months.
