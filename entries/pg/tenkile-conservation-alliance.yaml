summary: A not-for-profit based at Lumi, Sandaun Province, working to save tree kangaroos in the Torricelli
  Mountains, which trained 112 staff in Cybertracker and SMART under a BIOPAMA grant and plans app-based
  ranger monitoring.
facts:
- claim: Describes itself as a not-for-profit working to save tree kangaroos and the biodiversity of the
    Torricelli Mountain Range.
  url: https://tenkile.com/special-projects/
  fetched: 2026-11-09
  quote: The Tenkile Conservation Alliance is a not-for-profit working to save tree kangaroos, the biodiversity
    of the Torricelli Mountain Range, and the people who call it home.
- claim: Its base is at Lumi in Sandaun Province.
  url: https://tenkile.com/special-projects/
  fetched: 2026-11-09
  quote: TCA Base — Lumi
- claim: Its Rainforest Trust project, running since May 2024, aims to strengthen monitoring through the
    Protected Area Monitoring app, camera trapping, ranger training and village mapping.
  url: https://tenkile.com/special-projects/
  fetched: 2026-11-09
  quote: Strengthen monitoring and management — the PAM app, camera trapping, ranger training, village
    mapping, land-use planning and governance.
- claim: Its Perth Zoo-funded Rokrok Meri's project plans to train women rangers to record frogs on the
    Protected Area Monitoring app.
  url: https://tenkile.com/special-projects/
  fetched: 2026-11-09
  quote: Eighty-six women will join the 86 male rangers, recording frogs on the Protected Area Monitoring
    app.
- claim: Under a completed BIOPAMA grant it trained all 112 staff in Cybertracker and SMART and began
    building an online data portal.
  url: https://tenkile.com/special-projects/
  fetched: 2026-11-09
  quote: trained all 112 staff in Cybertracker and SMART; began building the ‘Mother Nature’ online data
    portal with a volunteer developer in the USA
- claim: Describes itself as a not-for-profit working to save tree kangaroos, the biodiversity of the
    Torricelli Mountain Range and the people who live there.
  url: https://tenkile.com/
  fetched: 2026-11-09
  quote: The Tenkile Conservation Alliance is a not-for-profit working to save tree kangaroos, the biodiversity
    of the Torricelli Mountain Range, and the people who call it home.
- claim: Asks donors to sponsor the local rangers who patrol and monitor the Torricelli Range.
  url: https://tenkile.com/
  fetched: 2026-11-09
  quote: Support the local rangers who patrol and monitor the Torricelli Range.
- claim: Raises funds for smartphones and tools that put conservation data in rangers' hands.
  url: https://tenkile.com/
  fetched: 2026-11-09
  quote: Smartphones and tools that put conservation data in rangers' hands.
