summary: A non-profit biological research and conservation organisation in Madang that uses paraecologists
  and parataxonomists, publishes eight GBIF datasets, and lists the Darwin Initiative, Rainforest Trust
  and National Geographic Society among its supporters.
facts:
- claim: Describes itself as a biological research and conservation non-profit organisation in Papua New
    Guinea.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: The New Guinea Binatang Research Centre is a biological research and conservation non-profit
    organization in Papua New Guinea.
- claim: Says documenting the biodiversity of Papua New Guinea through research is one of its main activities.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: Doing research and documenting the research findings of biodiversity in Papua New Guinea is one
    of the major activities that we are doing here at our Centre at New Guinea Binatang Research Centre.
- claim: Has research and conservation sites including Kau Wildlife Conservation Area, Wanang Conservation
    Area, Mt Wilhelm, Yawan, Ohu and Baitata.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: These research and conservation sites are Kau Wildlife Conservation Area, Wanang Conservation
    Area, Mt Wilhelm Research and Conservation Area, Yawan Research and Conservation Area, Ohu and Baitata
    Research Areas.
- claim: Its paraecologists and locally trained parataxonomists do field collections and sort specimens,
    in zoology and botany sections.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: Each section comprises of paraecologists, and locally trained para-taxonomists that actively
    participating in the biological research and conservation by doing field collections, classifying
    and sorting specimens into their respective family groups.
- claim: Its address is Nagada Harbor, North Coast Road, Madang.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: Nagada Harbor, North Coast Road, Madang, Papua New Guinea
- claim: GBIF's registry lists it as a publisher with eight published datasets, mostly on plant and insect
    interactions, associated with a GBIF-funded project, BID-PA2020-007-INS.
  url: https://api.gbif.org/v1/organization/da74804c-5f33-4261-a877-a3b30d2ee383
  fetched: 2026-11-09
  quote: 'Project identifier: BID-PA2020-007-INS'
- claim: Has research and conservation sites in Papua New Guinea, including the Kau Wildlife Conservation
    Area, Wanang Conservation Area and Mt Wilhelm Research and Conservation Area.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: The organization has several research and conservation sites within PNG. These research and conservation
    sites are Kau Wildlife Conservation Area, Wanang Conservation Area, Mt Wilhelm Research and Conservation
    Area
- claim: Its paraecologists and locally trained parataxonomists do field collections and sort specimens.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: Each section comprises of paraecologists, and locally trained para-taxonomists that actively
    participating in the biological research and conservation by doing field collections
- claim: Publishes on GBIF eight datasets, among them one on larval Lepidoptera sampled across eight lowland
    rainforest sites, each with a floristic survey and quantitative surveys in 50 plots.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=da74804c-5f33-4261-a877-a3b30d2ee383&limit=10
  fetched: 2026-11-09
  quote: Each site hosted a floristic survey in a 535 km area and quantitative surveys in 50 plots, 20x20m
    each.
- claim: The EU-FCCB Scholarship Programme, funded by the European Union and implemented by Expertise
    France, is coordinated through the centre.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: Funded by the European Union under the EU-FCCB Programme, implemented by Expertise France, and
    coordinated through the New Guinea Binatang Research Center.
- claim: Lists granting agencies that have supported the centre, research projects based there or its
    paraecologists, among them the Darwin Initiative, Rainforest Trust and National Geographic Society.
  url: http://www.ngbinatang.com/
  fetched: 2026-11-09
  quote: We thank the following granting agencies for supporting our Center, research projects based at
    the Center, or activities of paraecologists
