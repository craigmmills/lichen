summary: A free, open-source mobile data collection app built by UNDP Papua New Guinea for monitoring
  ecosystems, used by trained Kokoda Track rangers in 2022 and in beta that August.
facts:
- claim: A free, open-source mobile data collection app for managing and monitoring ecosystems across
    Papua New Guinea, developed by UNDP Papua New Guinea.
  url: https://www.undp.org/node/356661
  fetched: 2026-11-09
  quote: The Lukim Gather mobile data collection application enhances the use of data in the management
    and monitoring of ecosystems across Papua New Guinea. It is freely accessible and open source, and
    has been developed by UNDP Papua New Guinea.
- claim: In 2022 Kokoda Track rangers were trained to use it and mapped plants, lakes and tree species
    along the track.
  url: https://www.undp.org/node/356661
  fetched: 2026-11-09
  quote: the rangers undertook a field exercise in which they mapped plants, lakes, tree species and the
    condition of some of the infrastructure along the Track
- claim: Was in beta in August 2022.
  url: https://www.undp.org/node/356661
  fetched: 2026-11-09
  quote: Lukim Gather is in beta stage of development and is currently available on Google Play.
