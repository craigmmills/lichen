facts:
- claim: A not-for-profit NGO working on the protection and sustainable management of Papua New Guinea's
    biodiversity through knowledge generation, environmental education and community-led conservation.
  url: https://www.pikubionet.org.pg/
  fetched: 2026-11-09
  quote: The Piku Biodiversity Network Inc. is a not for profit, Non- Government Organization that approaches
    the protection and sustainable management of PNG’s biodiversity through knowledge generation, environmental
    education and community-led conservation.
- claim: Gives a postal address in Port Moresby.
  url: https://www.pikubionet.org.pg/
  fetched: 2026-11-09
  quote: P.O Box 804 Vision City, Port Moresby
- claim: Works with fishers in the Kikori River Delta to monitor catch per unit effort, collecting data
    on sawfish and rhino ray bycatch, which a March 2025 post says is used to understand population trends.
  url: https://www.pikubionet.org.pg/2025/03/24/community-conservation-action-of-sawfish-and-rhino-rays-in-the-kikori-delta-papua-new-guinea/
  fetched: 2026-11-09
  quote: PBN collaborates with fishers to monitor catch-per-unit-effort (CPUE) , collecting vital data
    on the frequency and circumstances of sawfish and rhino ray bycatch. This information is crucial for
    understanding population trends
- claim: Launched the Community Engagement for the Conservation of Sawfish and Rhino Rays Project, which
    includes a Sawfish Safe Release Programme.
  url: https://www.pikubionet.org.pg/2025/03/24/community-conservation-action-of-sawfish-and-rhino-rays-in-the-kikori-delta-papua-new-guinea/
  fetched: 2026-11-09
  quote: PBN has launched the Community Engagement for the Conservation of Sawfish and Rhino Rays Project
    . A cornerstone of this initiative is the Sawfish Safe Release Programme
