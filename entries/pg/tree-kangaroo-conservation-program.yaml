summary: A partnership between Woodland Park Zoo's programme and TKCP-PNG, begun in 1996, which supports
  rangers' ecological monitoring and mapping in the YUS Conservation Area, Morobe Province.
facts:
- claim: The programme is the partnership between Woodland Park Zoo's TKCP and TKCP-PNG.
  url: https://treekangaroo.org/program/
  fetched: 2026-11-09
  quote: The Tree Kangaroo Conservation Program (TKCP) is the partnership between the Woodland Park Zoo’s
    TKCP and TKCP-PNG.
- claim: TKCP-PNG is an independent non-governmental organisation registered in Papua New Guinea.
  url: https://treekangaroo.org/program/
  fetched: 2026-11-09
  quote: TKCP-PNG is an independent non-governmental organization registered in Papua New Guinea.
- claim: Began in 1996 as a research study on the status of the endangered Matschie's tree kangaroo, and
    works with local communities to establish and manage the YUS Conservation Area in Morobe Province.
  url: https://treekangaroo.org/program/
  fetched: 2026-11-09
  quote: TKCP works with local communities to establish and manage the YUS Conservation Area (YUS CA),
    named for the Yopno, Uruwa, and Som rivers, in Morobe Province.
- claim: Conservation Area Rangers conduct patrols and ecological monitoring in the YUS Conservation Area,
    and Mapping Officers map its core protected areas.
  url: https://treekangaroo.org/program/
  fetched: 2026-11-09
  quote: Conservation Area Rangers conduct patrols and ecological monitoring, and check for violations
    within the YUS CA. Core protected areas are mapped by Mapping Officers.
- claim: Rangers spend seven days a month on patrol recording the presence or absence of threatened priority
    animal species, and report to TKCP; TKCP says it continues to build their capacity for ecological
    monitoring.
  url: https://treekangaroo.org/managingyus/
  fetched: 2026-11-09
  quote: TKCP continues to strengthen the capacity of the YUS Rangers to conduct ecological monitoring
- claim: Runs a monitoring and evaluation framework to track whether the objectives of the YUS Landscape
    Plan are being met.
  url: https://treekangaroo.org/operating/
  fetched: 2026-11-09
  quote: TKCP’s monitoring and evaluation framework provides an essential feedback loop enabling TKCP
    to understand whether, and how, objectives in the YUS Landscape Plan are being met.
- claim: With the National Geographic Society, has studied tree kangaroo behaviour with Crittercam cameras
    attached to the animals by small collars.
  url: https://treekangaroo.org/applyingresearch/
  fetched: 2026-11-09
  quote: In collaboration with the National Geographic Society, TKCP has conducted ground-breaking research
    on tree kangaroo behavior through the use of National Geographic Crittercams ©.
