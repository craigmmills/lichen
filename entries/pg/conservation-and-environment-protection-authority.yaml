summary: Papua New Guinea's conservation authority, which launched workshops with UNDP in June 2026 to
  review the national biodiversity strategy and validate the 7th National Report, and identified the Lukim
  Gather app in 2022.
facts:
- claim: With UNDP, launched in June 2026 a nationwide series of workshops on the National Biodiversity
    Strategy and Action Plan and the validation of Papua New Guinea's 7th National Report.
  url: https://www.undp.org/papua-new-guinea/news/undp-and-cepa-launches-nationwide-biodiversity-consultations-port-moresby
  fetched: 2026-11-09
  quote: UNDP and the Conservation and Environment Protection Authority (CEPA) have officially launched
    a nationwide series of workshops in Port Moresby to support consultations on the National Biodiversity
    Strategy and Action Plan (NBSAP) and the validation of Papua New Guinea’s 7th National Report.
- claim: The review is meant to align the country's biodiversity goals with the Kunming-Montreal Global
    Biodiversity Framework.
  url: https://www.undp.org/papua-new-guinea/news/undp-and-cepa-launches-nationwide-biodiversity-consultations-port-moresby
  fetched: 2026-11-09
  quote: The current review seeks to align the country’s biodiversity goals with the Kunming-Montreal
    Global Biodiversity Framework
- claim: A 2022 UNDP story says CEPA identified UNDP's Lukim Gather app to support the ecological restoration
    work of Kokoda Track rangers.
  url: https://www.undp.org/node/356661
  fetched: 2026-11-09
  quote: CEPA have identified UNDP's Lukim Gather mobile app - one of the tools under the Natural Resource
    Management Hub (NRM Hub) - to further enhance the ranger’s ability to achieve this goal
