summary: FZS Ukraine project that reports SMART adoption by specialists in 14 partner protected areas
  and two parks, with acoustic monitoring across Polissia and camera traps in Chornobylskyi Biosphere
  Reserve.
facts:
- claim: FZS Ukraine says specialists in 14 partner protected areas, and two other parks, have adopted
    the SMART tool.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: The SMART tool has been adopted by specialists working in 14 protected areas that are FZS partners
    and two other parks that use the tool voluntarily.
- claim: It says acoustic monitoring of birds, small mammals and bush crickets has been carried out across
    all Polissia protected areas.
  url: https://ukraine.fzs.org/en/area/drevliansky/
  fetched: 2026-11-03
  quote: Furthermore, acoustic monitoring has been conducted across all Polissia protected areas, used
    to detect and study populations of birds, small mammals, and bush crickets.
- claim: It has installed camera traps across the Chornobylskyi Biosphere Reserve to monitor large mammals
    and other wildlife.
  url: https://ukraine.fzs.org/en/area/chornobylskyi/
  fetched: 2026-11-03
  quote: The installation of camera traps across the reserve to monitor the presence of large mammals
    and other wildlife, allowing us to better understand species distribution and population trends.
