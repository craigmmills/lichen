summary: Nature reserve of 42,291 hectares in four blocks that has run annual winter
  mammal counts since 2013, began camera-trap lynx monitoring with WWF-Ukraine, and
  was named by UNDP as a camera-trap recipient in May 2026.
facts:
- claim: In the 2020–2024 monitoring stage, working with WWF-Ukraine, it began monitoring
    lynx with camera traps on the Somyne and Perebrody blocks.
  url: https://bioweb.lnu.edu.ua/wp-content/uploads/2026/02/11-1.pdf
  fetched: 2026-11-09
  quote: У рамках співпраці з WWF-Україна розпочато моніторинг рисі за допомого фотопасток
    на масивах Сомине та Переброди.
- claim: In 2022–2024 its lynx monitoring combined a sightings database described
    as using the 'Darvin Core Standard', camera traps, telemetry and diet and genetic
    samples.
  url: https://bioweb.lnu.edu.ua/wp-content/uploads/2026/02/11-1.pdf
  fetched: 2026-11-09
  quote: Застосування комплексного моніторингу рисі, який включає ведення бази даних
    спостережень (Darvin Core Standard), використання фотопасток, телеметричних досліджень,
    збір трофічного та генетичного матеріалу.
- claim: The reserve covers 42,291 hectares in four blocks.
  url: https://bioweb.lnu.edu.ua/wp-content/uploads/2026/02/11-1.pdf
  fetched: 2026-11-09
  quote: Заповідник має площу 42 291 га
- claim: Has run annual synchronised winter mammal counts since 2013, with 40 to 50
    counters at once.
  url: https://bioweb.lnu.edu.ua/wp-content/uploads/2026/02/11-1.pdf
  fetched: 2026-11-09
  quote: З 2013 р. і до сьогодні запроваджено щорічні синхронні зимові обліки ссавців
    (одночасно 40–50 обліковців), у т. ч. рисі.
- claim: UNDP named it among ten Polissia protected areas that received 198 camera
    traps from a GEF-funded project in May 2026.
  url: https://www.undp.org/uk/node/583811
  fetched: 2026-11-09
  quote: Зокрема, Поліський природний заповідник, Рівненський природний заповідник
