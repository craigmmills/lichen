  quote: це офіційний веб-ресурс і мобільний додаток Міндовкілля, завдяки якому кожен зможе дізнатись
    достовірну інформацію про стан повітря, води, ґрунту та інші довкіллєві дані.
- claim: In 2023 it published official information on the environmental consequences of the Kakhovka dam
