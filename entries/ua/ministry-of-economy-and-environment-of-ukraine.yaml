summary: Ukrainian ministry, renamed by the Cabinet in July 2026, which announced the government's
  biodiversity strategy to 2035 with 23 strategic goals and mentions remote sensing for environmental
  monitoring under the Finland UFEM project.
facts:
- claim: On 17 July 2026 the Cabinet of Ministers transformed the Ministry of Economy, Environment
    and Agriculture into the Ministry of Economy and Environment of Ukraine.
  url: https://www.kmu.gov.ua/en/news/uriad-pereimenuvav-ministerstvo-ekonomiky-dovkillia-ta-silskoho-hospodarstva-ukrainy-ta-vidnovyv-minahropolityky
  fetched: 2026-11-03
  quote: The Cabinet of Ministers of Ukraine has transformed the Ministry of Economy, Environment
    and Agriculture of Ukraine to the Ministry of Economy and Environment of Ukraine. The
    corresponding resolution was adopted at the Government meeting on July 17, 2026.
- claim: In July 2025 the Ministry of Environmental Protection and Natural Resources was abolished
    and the Ministry of Economy, Environment and Agriculture was made its legal successor.
  url: https://www.kmu.gov.ua/en/news/minekonomiky-staie-ministerstvom-ekonomiky-dovkillia-ta-silskoho-hospodarstva
  fetched: 2026-11-03
  quote: The same resolution abolishes the Ministry of Agrarian Policy and Food and the Ministry
    of Environmental Protection and Natural Resources, designating the Ministry of Economy,
    Environment and Agriculture as their legal successor.
- claim: The State Agency for Forest Resources, the State Agency for Water Resources, the
    State Environmental Inspectorate and the State Service for Geodesy, Cartography and Cadastre
    were placed under coordination through its minister in 2025.
  url: https://www.kmu.gov.ua/en/news/minekonomiky-staie-ministerstvom-ekonomiky-dovkillia-ta-silskoho-hospodarstva
  fetched: 2026-11-03
  quote: the following bodies will be coordinated through the Minister of Economy, Environment
    and Agriculture
- claim: The Government adopted the Strategy for the Conservation of Biological Diversity
    of Ukraine until 2035 on 10 June 2026, announced by the ministry.
  url: https://www.kmu.gov.ua/en/news/skhvaleno-stratehiiu-zberezhennia-biolohichnoho-riznomanittia-do-2035-roku-minekonomiky
  fetched: 2026-11-03
  quote: The Government adopted the relevant order approving the Strategy for the Conservation
    of Biological Diversity of Ukraine until 2035 and the operational action plan for its
    implementation in 2026–2028 at a meeting on 10 June.
- claim: UNDP says the strategy sets 23 strategic goals aligned with the Kunming-Montreal
    Global Biodiversity Framework.
  url: https://www.undp.org/ukraine/press-releases/government-ukraine-approves-biodiversity-conservation-strategy-until-2035
  fetched: 2026-11-03
  quote: The strategy approved on 10 June 2026 sets out 23 strategic goals aligned with the
    Kunming-Montreal Global Biodiversity Framework
- claim: In December 2020 the former Ministry of Environmental Protection and Natural Resources
    said it was building a nature reserve fund cadastre and had digitised ten national parks.
  url: https://www.kmu.gov.ua/news/6-prirodnih-zapovidnikiv-ta-nacionalnij-prirodnij-park-gomilshanski-lisi-bude-peredano-pid-upravlinnya-mindovkillya
  fetched: 2026-11-03
  quote: Також ми працюємо над створенням кадастру природно-заповідного фонду. На сьогоднішні
    вже оцифровано 10 нацпарків
- claim: Says the UFEM project with Finland includes developing remote sensing as an additional
    tool for environmental monitoring.
  url: https://me.gov.ua/News/Print/928b2a7e-41d4-47fe-a720-20448d9fd691?lang=uk-UA
  fetched: 2026-11-03
  quote: Окремий напрям роботи передбачає розвиток використання дистанційного зондування Землі
    як додаткового інструменту екологічного моніторингу.
- claim: Its own site names it the Ministry of Economy and Environment of Ukraine.
  url: https://me.gov.ua/News/Print/928b2a7e-41d4-47fe-a720-20448d9fd691?lang=uk-UA
  fetched: 2026-11-03
  quote: Міністерство економіки та довкілля України -> Новини
- claim: The ministry's site lists environmental policy and protected areas and biodiversity
    among its areas of work.
  url: https://me.gov.ua/News/Detail/c0afe66c-7fb6-4896-99a1-c20f99612103?lang=uk-UA&title=Riznomanittia
  fetched: 2026-11-03
  quote: Природоохоронні території та біорізноманіття
- claim: The government approved the Biodiversity Conservation Strategy of Ukraine to 2035
    and an operational plan for 2026 to 2028 on 10 June 2026.
  url: https://me.gov.ua/News/Detail/c0afe66c-7fb6-4896-99a1-c20f99612103?lang=uk-UA&title=Riznomanittia
  fetched: 2026-11-03
  quote: Уряд прийняв на засіданні 10 червня 2026 року.
- claim: The strategy is aimed at the global goals of the Kunming-Montreal Global Biodiversity
    Framework and contains 23 strategic tasks matching its 2030 targets.
  url: https://me.gov.ua/News/Detail/c0afe66c-7fb6-4896-99a1-c20f99612103?lang=uk-UA&title=Riznomanittia
  fetched: 2026-11-03
  quote: Стратегія містить 23 стратегічні завдання зі збереження біорізноманіття, які відповідають
    стратегічним цілям Куньмінсько‑Монреальської рамкової програми з біорізноманіття до 2030
    року
- claim: The strategy was developed with support from the UNDP-GEF project on early action
    for the Global Biodiversity Framework.
  url: https://me.gov.ua/News/Detail/c0afe66c-7fb6-4896-99a1-c20f99612103?lang=uk-UA&title=Riznomanittia
  fetched: 2026-11-03
  quote: Стратегію збереження біорізноманіття України було розроблено за підтримки проєкту
    ПРООН-ГЕФ «Підтримка ранніх заходів щодо Глобальної рамкової програми збереження біорізноманіття».
