id: national-forest-inventory-of-ukraine
kind: programme
name: National Forest Inventory of Ukraine
also_known_as:
- Національна інвентаризація лісів
- НІЛ
scope: ua
ai_label: data-infrastructure
realms:
- land
techniques:
- remote-sensing
countries:
- ua
status: active
website: https://nfi.lisproekt.gov.ua/
summary: Planned five-year inventory on about 22,000 plots, run by Ukrderzhlisproekt, with over 7,000
  plots surveyed in 2021 to 2025 and a satellite-based inventory introduced in 2023.
facts:
- claim: Planned as a five-year cycle on about 22,000 inventory plots on a regular 5 by 5 km grid.
  url: https://nfi.lisproekt.gov.ua/
  fetched: 2026-11-03
  quote: яка мала впроваджуватися протягом 5-річного циклу на близько 22. 000 інвентаризаційних ділянок
    з регулярною мережею 5*5 км.
- claim: The war has made the inventory harder; about 4,100 sample plots had been surveyed.
  url: https://nfi.lisproekt.gov.ua/
  fetched: 2026-11-03
  quote: З того часу було обстежено лише близько 4100 пробних ділянок у лісах.
- claim: In 2023 a remote-sensing-based inventory was introduced, using available plot data to calibrate
    satellite information.
  url: https://nfi.lisproekt.gov.ua/
  fetched: 2026-11-03
  quote: у 2023 році було впроваджено інвентаризацію лісів на основі дистанційного зондування Землі (ДЗЗ-інвентаризація)
    , а наявні дані з обстежених інвентаризаційних ділянок були використані для калібрування інформації
    з супутникових знімків.
- claim: The State Forest Agency is the body that organises the national forest inventory.
  url: https://jurliga.ligazakon.net/news/245920_uryad-rozshiriv-povnovazhennya-derzhlsagentstva-u-sfer-kontrolyu-ta-auditu
  fetched: 2026-11-03
  quote: Агентство визначено органом, який здійснює моніторинг лісів та організовує проведення їх національної
    інвентаризації.
- claim: The inventory work is carried out by the National Forest Inventory Centre of Ukrderzhlisproekt.
  url: https://forest.gov.ua/news/natsionalna-inventaryzatsiia-lisiv-tryvaie-popry-vyklyky-shyrokomasshtabnoi-viiny
  fetched: 2026-11-03
  quote: Роботи з НІЛ виконує Центр національної інвентаризації лісів ВО «Укрдержліспроект».
- claim: More than 7,000 inventory plots were surveyed between 2021 and 2025.
  url: https://forest.gov.ua/news/natsionalna-inventaryzatsiia-lisiv-tryvaie-popry-vyklyky-shyrokomasshtabnoi-viiny
  fetched: 2026-11-03
  quote: У період з 2021 по 2025 роки обстежено понад 7 тис. інвентаризаційних ділянок
- claim: A remote-sensing based inventory was introduced in 2023.
  url: https://forest.gov.ua/news/natsionalna-inventaryzatsiia-lisiv-tryvaie-popry-vyklyky-shyrokomasshtabnoi-viiny
  fetched: 2026-11-03
  quote: у 2023 році було впроваджено інвентаризацію лісів на основі дистанційного зондування Землі (ДЗЗ-інвентаризацію)
