id: promoting-sustainable-livestock-management-and-ecosystem-conservation-in-northern-ukraine
kind: project
name: Promoting sustainable livestock management and ecosystem conservation in northern Ukraine
also_known_as:
- Сприяння сталому тваринництву та збереженню екосистем на півночі України
scope: ua
ai_label: conservation-tech
realms:
- land
- freshwater
countries:
- ua
status: active
summary: UNDP-run, GEF-funded project for 2022 to 2026 that in May 2026 handed 198 camera traps to protected
  areas to collect data on 17 peatland-linked species.
facts:
- claim: In May 2026 UNDP handed 198 camera traps and related equipment to protected areas under this
    project, with GEF funding.
  url: https://www.undp.org/uk/node/583811
  fetched: 2026-11-03
  quote: Програма розвитку ООН (ПРООН) передала 198 фотопасток та супутнє обладнання установам природно-заповідного
    фонду у межах проєкту « Сприяння сталому тваринництву та збереженню екосистем на півночі України »
    за фінансової підтримки Глобального екологічного фонду (GEF).
- claim: The equipment is for systematic data on 17 species of fauna and flora linked to peatland ecosystems
    in northern Ukraine.
  url: https://www.undp.org/uk/node/583811
  fetched: 2026-11-03
  quote: Надане обладнання сприятиме систематичному збору даних про представників 17 видів фауни та флори,
    пов’язаних із торфовищними екосистемами ландшафту на півночі України.
- claim: Runs from 2022 to 2026.
  url: https://www.undp.org/uk/node/583811
  fetched: 2026-11-03
  quote: реалізовується протягом 2022-2026 років.
- claim: UNDP had earlier given Ukrainian protected areas drones for environmental observation and weather
    stations.
  url: https://www.undp.org/uk/node/583811
  fetched: 2026-11-03
  quote: раніше було надано дрони для спостереження за станом довкілля, фотокамери, офісне обладнання,
    а також — метеостанції.
- claim: UNDP in Ukraine provided 198 camera traps and related equipment to Nature Reserve Fund institutions
    as part of the project, which is funded by the GEF.
  url: https://www.undp.org/ukraine/press-releases/ten-environment-protection-institutions-polissia-obtain-198-camera-traps-undp-and-gef
  fetched: 2026-11-03
  quote: The United Nations Development Programme (UNDP) in Ukraine has provided 198 camera traps and
    related equipment to institutions of the Nature Reserve Fund
- claim: The camera traps were intended to support systematic data collection on species associated with
    peatland ecosystems in northern Ukraine.
  url: https://www.undp.org/ukraine/press-releases/ten-environment-protection-institutions-polissia-obtain-198-camera-traps-undp-and-gef
  fetched: 2026-11-03
  quote: The camera traps will support systematic data collection on species associated with peatland
    ecosystems in northern Ukraine
- claim: Implementation period 2022 to 2026, with GEF funding and guidance from the global FOLUR programme.
  url: https://www.undp.org/ukraine/press-releases/ten-environment-protection-institutions-polissia-obtain-198-camera-traps-undp-and-gef
  fetched: 2026-11-03
  quote: Its implementation period is 2022–2026.
- claim: UNDP previously supplied drones for environmental monitoring to Ukrainian environmental institutions.
  url: https://www.undp.org/ukraine/press-releases/ten-environment-protection-institutions-polissia-obtain-198-camera-traps-undp-and-gef
  fetched: 2026-11-03
  quote: previously, drones for environmental monitoring, office equipment, as well as weather stations
    were also supplied
