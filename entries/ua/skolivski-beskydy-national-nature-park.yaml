summary: National park where, a park official told FZS Ukraine, bat monitoring began in 2015
  with about 20 species identified, using FZS-supplied batcorders under a SMART protocol.
facts:
- claim: A park official told FZS Ukraine that bat monitoring began in the park in 2015 and
    about 20 species have been identified.
  url: https://ukraine.fzs.org/en/bat-monitoring-in-the-skolivski-beskydy-national-park/
  fetched: 2026-11-03
  quote: Bat monitoring started in the Park in 2015. During this period, we have monitored
    the entire territory of the national park, identified 2 stationary areas where we have
    been monitoring for the last 2 years.
- claim: The main tools are batcorders, acoustic recorders given to the park by FZS.
  url: https://ukraine.fzs.org/en/bat-monitoring-in-the-skolivski-beskydy-national-park/
  fetched: 2026-11-03
  quote: The main tools for monitoring bats are batcoders – acoustic devices for monitoring
    bats. This is an expensive equipment that was given to us by the FZT.
- claim: The park uses a SMART protocol for installing, checking and removing the batcorders.
  url: https://ukraine.fzs.org/en/bat-monitoring-in-the-skolivski-beskydy-national-park/
  fetched: 2026-11-03
  quote: There is also a separate SMART protocol for installing, checking, and removing the
    batcoder to maximize the automation of data entry.
