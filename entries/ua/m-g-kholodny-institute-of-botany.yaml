summary: Ukrainian botany institute holding a National Herbarium of over 2 million specimens
  and publishing the Ukrainian Grassland Database to GBIF, with staff co-authoring recent
  plant studies.
facts:
- claim: Its GBIF record lists seven research departments, three laboratories, a herbarium
    and a group of practical informatics.
  url: https://api.gbif.org/v1/organization/5f5b96f6-73a7-475d-87ac-c968053f6dfe
  fetched: 2026-11-03
  quote: The Institute of Botany consists of 7 research departments, 3 Laboratories, Herbarium,
    Group of practical informatics, Scientific Library, and Editorial and Publishing Department.
- claim: Tetiana Dziuba of the institute is a co-author of a 2025 Nature Plants paper, Learning
    the syntax of plant assemblages.
  url: https://api.openalex.org/works/W4415101811
  fetched: 2026-11-03
  quote: Learning the syntax of plant assemblages
- claim: Anna Kuzemko of the institute led a 2024 study of plant cover on the bed of the former
    Kakhovka Reservoir.
  url: https://api.openalex.org/works/W4393903073
  fetched: 2026-11-03
  quote: 'Reach the bottom: plant cover of the former Kakhovka Reservoir, Ukraine'
- claim: Houses the National Herbarium of over 2 million specimens and culture collections
    of mushrooms and microalgae.
  url: https://www.botany.kiev.ua/index_eng.htm
  fetched: 2026-11-03
  quote: the National Herbarium (KW) (over 2 million specimens of vascular, non-vascular plants
    and fungi
- claim: Its GBIF record says it is the main implementing organisation of the Space Biology
    programme within Ukraine's National Space Program.
  url: https://api.gbif.org/v1/organization/5f5b96f6-73a7-475d-87ac-c968053f6dfe
  fetched: 2026-11-03
  quote: The Institute is also the main implementing organization in the “Space Biology” program
- claim: Publishes to GBIF records from the Ukrainian Grassland Database, relevés by 66 authors
    from 1932 to 2019 in almost all administrative regions of Ukraine.
  url: https://api.gbif.org/v1/dataset/07a5ec6c-e271-4d6a-865c-7f9a6b484514
  fetched: 2026-11-03
  quote: The releves are made in almost all administrative regions of Ukraine.
- claim: Its published datasets include the distribution of the green algae family Tetrasporaceae
    in Ukraine.
  url: https://api.gbif.org/v1/organization/5f5b96f6-73a7-475d-87ac-c968053f6dfe/publishedDataset?limit=40
  fetched: 2026-11-03
  quote: Distribution of Tetrasporaceae (Chlorophyta) in Ukraine
