summary: Frankfurt Zoological Society programme running biodiversity monitoring with 13 protected areas
  in Ukraine, using SMART since February 2021, camera traps and acoustic receivers, and supporting Chornobyl
  Biosphere Reserve.
facts:
- claim: FZS implements biodiversity monitoring systems and works with 13 protected areas.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: We are already working with 13 protected areas in several areas of biodiversity monitoring.
- claim: Has implemented SMART for protected areas in the Ukrainian Carpathians since February 2021.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: One of the monitoring tools that we have been implementing since February 2021 is the Spatial
    Monitoring and Reporting Tool (SMART) program, which we have adapted for protected areas in the Ukrainian
    Carpathians.
- claim: Studies large mammals with camera traps together with partner protected areas.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: we are conducting research on large mammals including ungulates (hooved animals such as bison,
    deer, and boar) and large carnivores using camera traps
- claim: Uses acoustic receivers for bird monitoring under the Pan-European Common Bird Monitoring Scheme,
    which Ukraine joined in 2023.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: We use acoustic receiver devices to monitor birds, with equipment fine-tuned to the particularities
    of bird singing.
- claim: FZS supports the Chornobyl Biosphere Reserve with monitoring equipment and is introducing SMART
    there; camera traps and acoustic monitoring have been used across the reserve.
  url: https://wildpolesia.org/chornobyl-radiation-and-ecological-biosphere-reserve/
  fetched: 2026-11-03
  quote: we are introducing the SMART monitoring system to help improve data collection and make the conservation
    process more efficient
