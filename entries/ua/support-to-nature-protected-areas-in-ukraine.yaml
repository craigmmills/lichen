summary: Closed 2016 to 2022 project, run by the environment ministry with a KfW-financed grant of up
  to 14 million euros, to support a protected-area cadastre.
facts:
- claim: BMZ provided a grant of up to 14 million euros, financed by KfW Development Bank.
  url: https://snpa.in.ua/en/pro-proekt/
  fetched: 2026-11-03
  quote: The German Government, through the Federal Ministry for Economic Cooperation and Development
    (BMZ), has provided a grant of up to 14 million EUR
- claim: The Ministry of Ecology and Natural Resources of Ukraine had overall responsibility for implementation
    and execution of the 2016–2022 project.
  url: https://snpa.in.ua/en/pro-proekt/
  fetched: 2026-11-03
  quote: The Ministry of Ecology and Natural Resources (MENR) of Ukraine assumes overall responsibility
    for the implementation and execution of the project.
- claim: Final kick-off on 17 May 2016.
  url: https://snpa.in.ua/en/pro-proekt/
  fetched: 2026-11-03
  quote: the final kick-off was on 17 th May 2016
- claim: The 2016–2022 project aimed to support a protected-area cadastre for Ukraine, starting with an
    automated state cadastre system intended to use remote sensing to help delineate protected-area boundaries.
  url: https://snpa.in.ua/en/english-diyalnist-proektu/diyalnist-proektu-1/
  fetched: 2026-11-03
  quote: The first step of this component will be the development of a so-called “Automated System of
    State Cadastre for Protected Areas” which will allow for the use of remote sensing methods to assist
    with the boundary delineation of protected areas.
