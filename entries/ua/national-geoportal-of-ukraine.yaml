summary: Geospatial data portal whose prototype at nsdi.gov.ua was in trial operation in August 2021,
  offering search and free access to datasets from several national bodies and 92 local authorities.
facts:
- claim: In August 2021 the prototype at nsdi.gov.ua was in trial operation and provided search and free
    access to geospatial datasets.
  url: https://www.kmu.gov.ua/news/derzhgeokadastr-pracyuye-nad-rozbudovoyu-nacionalnoyi-infrastrukturi-geoprostorovih-danih-nigd
  fetched: 2026-11-03
  quote: Геопортал надає можливість простого пошуку та вільного доступу користувачів до наборів геопросторових
    даних, оприлюднених відповідно до законодавства.
- claim: In August 2021 it held data sets from the Research Institute of Geodesy and Cartography, the
    State Water Agency, Ukravtodor, the regional development ministry, the State Space Agency and 92 local
    authorities.
  url: https://www.kmu.gov.ua/news/derzhgeokadastr-pracyuye-nad-rozbudovoyu-nacionalnoyi-infrastrukturi-geoprostorovih-danih-nigd
