facts:
- claim: Its own news reports a golden jackal recorded visually, by tracks and on a camera
    trap in the reserve.
  url: https://zapovidnyk.org.ua/
  fetched: 2026-11-03
  quote: До цього вид був відмічений візуально, за слідами та на фотопастку.
- claim: In a May fire update, reserve staff reported continuous monitoring along the Prypiat
    and Uzh rivers to detect possible open fires.
  url: https://zapovidnyk.org.ua/
  fetched: 2026-11-03
  quote: Фахівці Чорнобильського заповідника здійснюють постійний моніторинг ситуації вздовж
    річок Прип’ять та Уж з метою оперативного виявлення можливих відкритих осередків вогню.
- claim: The reserve is credited as author of a 2021 paper on low-resource fauna research
    with camera traps.
  url: https://api.openalex.org/works/W3197239246
  fetched: 2026-11-03
  quote: The experience of low-resource fauna research by using camera traps
- claim: Reserve staff wrote a 2024 paper assessing geospatial data collection tools for wildlife
    monitoring in the reserve.
  url: https://api.openalex.org/works/W4394923971
  fetched: 2026-11-03
  quote: Geospatial applications as an integral component of wildlife monitoring in the Chor-nobyl
    Radiation and Ecological Biosphere Reserve
