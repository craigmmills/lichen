summary: Programme described as FZS’s largest in Europe, reporting work strengthening 21 Polissia and
  Carpathian protected areas, using SMART on over 350 smartphones, camera traps and acoustic receivers.
facts:
- claim: Says it works to strengthen 21 protected areas in Polissia and the Carpathians.
  url: https://ukraine.fzs.org/en/
  fetched: 2026-11-03
  quote: today we are working to strengthen 21 protected areas, focusing on the unique ecosystems of Polissia
    and the Carpathians
- claim: Calls itself FZS's largest programme in Europe.
  url: https://ukraine.fzs.org/en/
  fetched: 2026-11-03
  quote: Today, this is the largest programme of FZS in Europe
- claim: Has implemented SMART since February 2021, adapted for protected areas in the Ukrainian Carpathians;
    specialists in 14 partner protected areas and two other parks use it, on more than 350 smartphones.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: The SMART tool has been adopted by specialists working in 14 protected areas that are FZS partners
    and two other parks that use the tool voluntarily.
- claim: Runs camera-trap research on ungulates and large carnivores with partner protected areas.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: Together with specialists in partner protected areas, we are conducting research on large mammals
    including ungulates (hooved animals such as bison, deer, and boar) and large carnivores using camera
    traps.
- claim: Monitors bats and birds with acoustic receivers whose recordings are then analysed and verified
    by experts.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: We monitor with the help of special acoustic receiver devices. Receivers are programmed using
    a smartphone app and autonomously record sound files, which are subsequently analyzed and verified
    by experts.
- claim: GBIF lists Frankfurt Zoological Society - Ukraine as a data publisher in Ukraine.
