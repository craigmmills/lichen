id: support-to-ukraine-in-environmental-damage-assessment-and-biodiversity-monitoring
kind: project
name: Support to Ukraine in the assessment of environmental damages and development of water
  quality and terrestrial biodiversity monitoring
also_known_as:
- Ukraine Finland Environmental Monitoring
- UFEM
- Support to Ukraine in the assessment of environmental damages and development of water quality
  and terrestrial biodiversity monitoring
scope: ua
ai_label: data-infrastructure
realms:
- land
- freshwater
techniques:
- remote-sensing
countries:
- ua
status: active
summary: Ongoing 2024 to 2028 cooperation between the Finnish Environment Institute and Ukraine's
  environment ministry on water quality, terrestrial biodiversity and remote sensing monitoring,
  funded by Finland's foreign ministry.
facts:
- claim: Finland's IATI record describes it as cooperation between the Finnish Environment
    Institute and the Ukrainian environment ministry to strengthen environmental monitoring
    and environmental information.
  url: https://d-portal.org/q.json?from=act&aid=FI-3-2025-2025250517
  fetched: 2026-11-03
  quote: The cooperation between the Finnish Environment Institute and the Ministry for Environmental
    Protection and Natural Resources strengthens the capacity of Ukrainian authorities in
    environmental monitoring and the availability of environmental information in Ukraine.
- claim: It has three sub-areas, monitoring of water quality and of terrestrial ecosystems,
    and remote sensing.
  url: https://d-portal.org/q.json?from=act&aid=FI-3-2025-2025250517
  fetched: 2026-11-03
  quote: 'The project consists of three sub-areas: monitoring of water quality and terrestrial
    ecosystems, and remote sensing.'
- claim: Reported by the Ministry for Foreign Affairs of Finland, with spending of 208,212
    euros recorded on this 2025 activity.
  url: https://d-portal.org/q.json?from=act&aid=FI-3-2025-2025250517
  fetched: 2026-11-03
  quote: '"spend_eur":208212'
- claim: Syke gives its duration as 2024 to 2028 and its status as ongoing.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: 'Duration: 2024 - 2028'
- claim: Expected results include remote sensing introduced as a supporting tool for terrestrial
    biodiversity and surface water quality monitoring.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: Remote sensing introduced and initiated as a supporting tool for terrestrial biodiversity
    monitoring and surface water quality monitoring.
- claim: Syke names Tea Törnroos as project manager.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: Project management Tea Törnroos (Syke)
- claim: Aims to improve the environmental information capacities of Ukraine's environment
    and water administration, including assessing war damage to surface waters and terrestrial
    biodiversity.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: The improved information production capacities will also give rise to detecting and
    assessing war damages on natural resources and the environment, namely on surface waters
    and terrestrial biodiversity.
- claim: Ran a training on using Sentinel-2 satellite images for environmental monitoring
    in QGIS.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: A two-day online training on “Use of Sentinel-2 satellite images for environmental
    monitoring using QGIS”.
- claim: Ukrainian partners are the Ministry of Economy and Environment and the State Agency
    for Water Resources.
  url: https://www.syke.fi/en/projects/ufem
  fetched: 2026-11-03
  quote: Ministry of Economy and Environment of Ukraine; State Agency for Water Resources
    of Ukraine
