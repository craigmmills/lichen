summary: University department at Igor Sikorsky Kyiv Polytechnic Institute planning machine
  learning applications for satellite forest monitoring within FutureFOR and listing a land
  cover change digital twin project.
facts:
- claim: Says that with machine learning and artificial intelligence it will create applications
    for satellite monitoring of forests in Ukraine and Europe within FutureFOR.
  url: https://mmda.ipt.kpi.ua/?p=8494
  fetched: 2026-11-03
  quote: Thanks to machine learning and artificial intelligence, we will create innovative
    applications for satellite monitoring of forests, in particular in Ukraine and Europe.
- claim: Its session on 13 March 2025 with Nataliia Kussul was advertised to cover machine
    learning and deep learning for land use management and Earth System Digital Twins.
  url: https://mmda.ipt.kpi.ua/?p=9128
  fetched: 2026-11-03
  quote: In this session, we will explore the current challenges and opportunities of applying
    machine learning and deep learning to land use management.
  ai_type: deep-learning
- claim: The 13 March 2025 session announcement said Nataliia Kussul would introduce the Ukrainian-Swiss
    Land Use Change Digital Twin project, aimed at monitoring land use changes.
  url: https://mmda.ipt.kpi.ua/?p=9128
  fetched: 2026-11-03
  quote: Prof. Kussul will introduce the main objectives of the Ukrainian-Swiss “Land Use
    Change Digital Twin” project, which aims to create a digital twin to monitor land use
    changes in response to climate challenges and socio-economic transformations.
  ai_type: digital-twins
- claim: A 2024 monograph presents the department's research on ecological and economic analysis
