facts:
- claim: Rewilding Ukraine is a conservation NGO registered in Odesa in 2017.
  url: https://rewilding-danube-delta.com/who-we-are/
  fetched: 2026-11-17
  quote: Rewilding Ukraine is a conservation NGO, registered in Odessa, Ukraine in
    2017
- claim: The team announced plans to restore ploughed parts of the Tarutino Steppe
    in the north of the Danube region. The site describes the steppe as one of the
    region's few largely untouched steppe areas.
  url: https://rewilding-danube-delta.com/danube-delta-and-areas/
  fetched: 2026-11-17
  quote: We plan to restore ploughed steppe areas and reintroduce the red deer, kulan
    and demoiselle cranes here.
- claim: By May 2021, Rewilding Ukraine and its partners had begun restoring the Tarutino
    Steppe reserve with Ukrainian government and EU support. Illegal ploughing affected
    about 1,300 hectares in 2016.
  url: https://rewildingeurope.com/news/rewilding-ukrainian-steppe/
  fetched: 2026-11-17
  quote: have started work to actively restore and accelerate the recovery of this
    precious habitat
- claim: Rewilding Ukraine is one of the partners in the Danube Delta rewilding project.
    The project reports that the Kartal and Kugurluy lakes were reconnected, 500 hectares
    of marshland were reflooded, and 10 dams were removed along the Kogilnik River.
  url: https://rewildingeurope.com/rew-project/danube-delta-rewilding-area/
  fetched: 2026-11-17
  quote: The Kartal and Kugurluy lakes in Ukraine were reconnected by culverts, with
    500 hectares of marshland reflooded, and 10 dams were removed along the Kogilnik
    River to improve habitat connectivity and flow.
