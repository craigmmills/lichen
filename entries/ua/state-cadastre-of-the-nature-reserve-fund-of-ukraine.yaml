id: state-cadastre-of-the-nature-reserve-fund-of-ukraine
kind: dataset
name: State Cadastre of Territories and Objects of the Nature Reserve Fund of Ukraine
also_known_as:
- Державний кадастр територій та об’єктів природно-заповідного фонду
- Кадастр ПЗФ
scope: ua
ai_label: data-infrastructure
realms:
- land
- freshwater
countries:
- ua
status: active
summary: Cadastre of nature reserve fund territories built and run by the environment ministry; it covered
  88% of them at its 2021 launch, and public access was restricted in 2024.
facts:
- claim: The environment minister presented the open electronic cadastre, hosted on the EcoSystem portal,
    in September 2021.
  url: https://www.kmu.gov.ua/news/mindovkillya-zapustilo-vidkritii-elektronnii-derzhavnii-kadastr-teritorii-ta-obyektiv-prirodno-zapovidnogo-fondu
  fetched: 2026-11-03
  quote: презентував новий інструмент - відкритий електронний державний кадастр територій та об’єктів
    природно-заповідного фонду. Він розміщений на вебпорталі
- claim: At launch it held data on 88% of the territories of the nature reserve fund.
  url: https://www.kmu.gov.ua/news/mindovkillya-zapustilo-vidkritii-elektronnii-derzhavnii-kadastr-teritorii-ta-obyektiv-prirodno-zapovidnogo-fondu
  fetched: 2026-11-03
  quote: Кадастр вже містить дані про 88% територій
- claim: In March 2024 the ministry said public access to the cadastre on EcoSystem was restricted for
    national security reasons, while park and reserve staff kept entering data.
  url: https://www.kmu.gov.ua/news/v-ukraini-tryvaie-robota-nad-napovnenniam-kadastru-pryrodno-zapovidnoho-fondu
  fetched: 2026-11-03
  quote: З міркувань національної безпеки та відповідно до діючих вимог законодавства, наразі доступ до
    публічної частини Кадастру на національній онлайн платформі ЕкоСистема обмежений.
