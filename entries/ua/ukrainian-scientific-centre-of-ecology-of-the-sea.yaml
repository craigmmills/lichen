summary: Environment ministry's main institution for marine environmental research, per its
  GBIF record, founded in 1992 and accredited as the Black Sea OBIS node in 2016.
facts:
- claim: Its GBIF record describes it as the main institution of the environment ministry
    for marine environmental research, founded in 1992.
  url: https://api.gbif.org/v1/organization/b9a1023a-e508-4168-a837-fa0781820a8b
  fetched: 2026-11-03
  quote: It is the main institution of the Ministry of Ecology and Natural Resources of Ukraine
    in the field of marine environmental researches.
- claim: Since 1993 it has been the Black Sea Commission's International Regional Activity
    Center for Pollution Monitoring and Assessment.
  url: https://api.gbif.org/v1/organization/b9a1023a-e508-4168-a837-fa0781820a8b
  fetched: 2026-11-03
  quote: From 1993 UkrSCES is the International Regional Activity Center for Pollution Monitoring
    and Assessment (RAC PMA) of the Black Sea Commission.
- claim: Designated an IODE associate data unit in 2014 and accredited as the Black Sea OBIS
    node in 2016.
  url: https://api.gbif.org/v1/organization/b9a1023a-e508-4168-a837-fa0781820a8b
  fetched: 2026-11-03
  quote: From February 2016, UkrSCES is accredited as the Black Sea OBIS node.
- claim: Gives its address as 89 Frantsuzsky Boulevard, Odesa.
  url: https://api.gbif.org/v1/organization/b9a1023a-e508-4168-a837-fa0781820a8b
  fetched: 2026-11-03
  quote: 89 Frantsuzsky Blvd.
- claim: Staff affiliated with it co-wrote a 2019 paper on pelagic biodiversity monitoring
    of the Black Sea by eDNA metabarcoding.
  url: https://api.openalex.org/works/W2998417268
  fetched: 2026-11-03
  quote: 'Holistic pelagic biodiversity monitoring of the Black Sea via eDNA metabarcoding
    approach: From bacteria to marine mammals'
- claim: Publishes GBIF National Monitoring Studies datasets for individual survey years,
    including mesozooplankton studies from 2001 and 2003–2010.
  url: https://api.gbif.org/v1/organization/b9a1023a-e508-4168-a837-fa0781820a8b/publishedDataset?limit=40
  fetched: 2026-11-03
  quote: National Monitoring Studies 2010, (Mesozooplankton)
