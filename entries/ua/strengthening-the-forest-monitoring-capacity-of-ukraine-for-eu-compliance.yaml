summary: Czech-funded project to strengthen Ukraine's forest monitoring with remote sensing, which funded
  a remote sensing forest monitoring laboratory at NULES, opened on 22 July 2025.
facts:
- claim: Carried out with financial support from the Czech Development Agency under a memorandum between
    the Forest Management Institute (Czech Republic), the State Forest Resources Agency, Ukrderzhlisproekt,
    the Vysotsky forestry research institute and NULES.
  url: https://nubip.edu.ua/en/node/158001
  fetched: 2026-11-03
  quote: This project is carried out with the financial support of the Czech Development Agency
- claim: Aims to strengthen Ukraine's capacity to monitor forests with remote sensing, including improving
    methods for producing forest maps from satellite data.
  url: https://nubip.edu.ua/en/node/158001
  fetched: 2026-11-03
  quote: Improving methodologies for producing forest maps from satellite data
- claim: The project funded the Laboratory for Remote Sensing Forest Monitoring at NULES's Department
    of Forest Mensuration and Forest Management, opened on 22 July 2025.
  url: https://nubip.edu.ua/en/node/158001
  fetched: 2026-11-03
  quote: the Laboratory for Remote Sensing Forest Monitoring was established at the Department of Forest
    Mensuration and Forest Management
- claim: Names Marek Mlčoušek, branch director of the Forest Management Institute, as project manager.
  url: https://nubip.edu.ua/en/node/158001
  fetched: 2026-11-03
  quote: Marek Mlčoušek (Branch Director of the Forest Management Institute, Project Manager)
- claim: Carried out with financial support from the Czech Development Agency under a memorandum between
    Czech and Ukrainian partners.
  url: https://nubip.edu.ua/czechaid-project
  fetched: 2026-11-03
  quote: This project is carried out with the financial support of the Czech Development Agency
- claim: Aims to strengthen Ukraine's capacity to monitor forests with remote sensing.
  url: https://nubip.edu.ua/czechaid-project
  fetched: 2026-11-03
  quote: The project aims at strengthening the capacity of Ukraine to monitoring forests using remote
    sensing (RS) technologies.
- claim: The project funded a Laboratory for Remote Sensing Forest Monitoring at NUBiP's Department of
    Forest Mensuration and Forest Management, inaugurated on 22 July 2025.
  url: https://nubip.edu.ua/czechaid-project
  fetched: 2026-11-03
  quote: The laboratory was inaugurated on July 22, 2025
