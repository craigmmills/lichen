summary: Volunteer-supported crowdsourcing platform for biodiversity data, with records from field observations,
  text mining and museums; its site returned a database error when fetched on 3 November 2026.
facts:
- claim: Its GBIF publisher record describes it as a web project and application documenting biodiversity,
    launched in cooperation with the Institute of Zoology of the National Academy of Sciences.
  url: https://api.gbif.org/v1/organization/89c61752-4bcd-48ce-b63a-0c36793020b6
  fetched: 2026-11-03
  quote: Ukrainian Biodiversity Information Network (UkrBIN) is a web project and application documenting
    biodiversity.
- claim: Besides field observations, a large part of its records come from text mining of scientific publications
    and from natural history museums.
  url: https://api.gbif.org/v1/organization/89c61752-4bcd-48ce-b63a-0c36793020b6
  fetched: 2026-11-03
  quote: Besides the field observations, a significant part of records is derived from the text mining
    of scientific publications and from the natural history museums.
- claim: Its community crowdsources the identification of submitted photo observations.
