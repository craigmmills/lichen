summary: Ukrainian team of Frankfurt Zoological Society, working since 2001, reporting efforts
  to strengthen 21 protected areas, with SMART on over 350 smartphones, camera traps and acoustic
  monitoring.
facts:
- claim: Describes itself as the Ukrainian team of the Frankfurt Zoological Society, working
    since 2001 and now strengthening 21 protected areas in Polissia and the Carpathians.
  url: https://ukraine.fzs.org/en/
  fetched: 2026-11-03
  quote: today we are working to strengthen 21 protected areas, focusing on the unique ecosystems
    of Polissia and the Carpathians.
- claim: Its office is in Lviv.
  url: https://ukraine.fzs.org/en/contact/
  fetched: 2026-11-03
  quote: 'Office address: 1/3, Koliivshchyny sq. 79008 Lviv, Ukraine'
- claim: Has implemented the SMART tool, adapted for protected areas in the Ukrainian Carpathians,
    since February 2021, with the app installed on more than 350 smartphones.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: One of the monitoring tools that we have been implementing since February 2021 is
    the Spatial Monitoring and Reporting Tool (SMART) program, which we have adapted for protected
    areas in the Ukrainian Carpathians.
- claim: Conducts camera-trap research on large mammals with partner protected areas, and
    says the research enabled monitoring of the Eurasian lynx for the first time in Ukraine.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: Together with specialists in partner protected areas, we are conducting research
    on large mammals including ungulates (hooved animals such as bison, deer, and boar) and
    large carnivores using camera traps.
- claim: Monitors bats with acoustic receivers whose recordings are then analysed and verified
    by experts.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: We monitor with the help of special acoustic receiver devices. Receivers are programmed
    using a smartphone app and autonomously record sound files, which are subsequently analyzed
    and verified by experts.
- claim: Says Ukraine joined the Pan-European Common Bird Monitoring Scheme in 2023.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: In 2023, Ukraine joined the Pan-European Common Bird Monitoring Scheme, which is
    coordinated by the European Bird Census Council.
- claim: Uses acoustic receivers to monitor birds.
  url: https://ukraine.fzs.org/en/project/biodiversity-monitoring/
  fetched: 2026-11-03
  quote: We use acoustic receiver devices to monitor birds, with equipment fine-tuned to the
    particularities of bird singing.
- claim: The Ukrainian team of the Frankfurt Zoological Society, whose work in Ukraine began
    in 2001.
  url: https://ukraine.fzs.org/en/
  fetched: 2026-11-03
  quote: We are the Ukrainian team of the Frankfurt Zoological Society
- claim: Says it is working to strengthen 21 protected areas, focused on Polissia and the
    Carpathians.
  url: https://ukraine.fzs.org/en/
  fetched: 2026-11-03
  quote: today we are working to strengthen 21 protected areas, focusing on the unique ecosystems
    of Polissia and the Carpathians
- claim: Its GBIF record says it conducts biodiversity monitoring and protected area management.
  url: https://api.gbif.org/v1/organization/93ee624c-1c8b-4f74-8797-1b72f0a9f9a1
  fetched: 2026-11-03
  quote: we conduct biodiversity monitoring and protected area management
- claim: Publishes to GBIF a dataset of rare plant and animal species in the Ukrainian Carpathians,
    compiled within the Support for Nature Protected Areas project.
  url: https://api.gbif.org/v1/dataset/df412fe0-487c-4cbf-a4c1-3f54f8fb5e7f
  fetched: 2026-11-03
  quote: The dataset contains information on the distribution of plant and animal species
    listed in the Red Data Book of Ukraine
