facts:
- claim: Inspectors of its Nature Protection Service and staff of its Scientific Research
    Department installed 20 camera traps across the park.
  url: https://karpatskyi-park.in.ua/?p=4141
  fetched: 2026-11-09
  quote: inspectors of the Nature Protection Service and employees of the Scientific
    Research Department have installed 20 camera traps throughout the territory of
    the Park.
- claim: In winter 2021-2022 park staff built a GIS project of the park, overlaid
    a monitoring grid and chose camera-trap locations.
  url: https://karpatskyi-park.in.ua/?p=4141
  fetched: 2026-11-09
  quote: creation of a GIS project on the Park’s area, overlaying a monitoring grid,
    and determining the number and potential locations for photo traps
- claim: The camera traps are meant to map the distribution of wolves, bears and lynx
    in the Carpathians.
  url: https://karpatskyi-park.in.ua/?p=4141
  fetched: 2026-11-09
  quote: These photo traps will be able to give a complete picture of the distribution
    of large carnivorous mammals such as, wolves, bears, and lynxes in the Carpathians.
