summary: Fire monitoring centre in Kyiv that NULES and partners decided in 2012 to establish,
  and whose October 2024 bulletin reported September 2024 fires and mapped burned land cover.
facts:
- claim: In 2012 NULES, with the Global Fire Monitoring Center and the UNECE/FAO Team of Specialists
    on Forest Fire, and funding from the Council of Europe, decided to establish the centre.
  url: https://nubip.edu.ua/en/node/147103
  fetched: 2026-11-03
  quote: In 2012 the National University of Life and Environmental Sciences of Ukraine, Institute
    of Forestry and Park Management, in cooperation with the Global Fire Monitoring Center
    (GFMC) and the UNECE/FAO Team of Specialists on Forest Fire, financially supported by
    the Council of Europe
- claim: Its October 2024 information bulletin reports fires in Ukrainian ecosystems, agricultural
    land and cities during September 2024.
  url: https://nubip.edu.ua/sites/default/files/u184/no09_2024_reefmc_fm_bulletin_september_eng.pdf
  fetched: 2026-11-03
  quote: (in ecosystems, agricultural lands and in cities 2)
- claim: The October 2024 bulletin maps burned land cover within fire perimeters using the
    Copernicus Dynamic Land Cover map and analyses fires in Emerald Network sites.
  url: https://nubip.edu.ua/sites/default/files/u184/no09_2024_reefmc_fm_bulletin_september_eng.pdf
  fetched: 2026-11-03
  quote: Distribution of burned land cover types within fire perimeters were mapped using
    the Copernicus Dynamic Land Cover map at 100 m res olution for 2019
- claim: Its October 2024 bulletin gives its address as Dniprovska Naberezhna Street 7A, Kyiv.
  url: https://nubip.edu.ua/sites/default/files/u184/no09_2024_reefmc_fm_bulletin_september_eng.pdf
  fetched: 2026-11-03
  quote: 'Address: Kyiv, 03041, Dniprovska Naberezhna St. 7А, office 104.'
