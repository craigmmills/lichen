summary: Interdepartmental ornithological station set up in 1985 at two Ukrainian academic
  institutions, coordinating regional bird monitoring and publishing field observation datasets
  through GBIF.
facts:
- claim: An interdepartmental organisation based on the Schmalhausen Institute of Zoology
    and Bohdan Khmelnytsky Melitopol State Pedagogical University, set up in 1985.
  url: https://api.gbif.org/v1/organization/2e31dce2-123d-4c3b-8773-8f5e050cc22c
  fetched: 2026-11-03
  quote: It is an interdepartmental organization on the basis of the I.I. Schmalhausen Institute
    of Zoology and Bohdan Khmelnitsky Melitopol State Pedagogical University.
- claim: Coordinates the programme of regional ornithological monitoring.
  url: https://api.gbif.org/v1/organization/2e31dce2-123d-4c3b-8773-8f5e050cc22c
  fetched: 2026-11-03
  quote: An important activity of the Azov-Black Sea Ornithological Station is also the coordination
    of activities within the programme of regional ornithological monitoring (ROM).
- claim: Publishes datasets of field observations and monitoring programmes through GBIF.
  url: https://api.gbif.org/v1/organization/2e31dce2-123d-4c3b-8773-8f5e050cc22c
  fetched: 2026-11-03
  quote: In frames of GBIF-related activities, the main focus of the Ornithological Station
    is the publishing the dataset with results of field observations and monitoring programmes.
