facts:
- claim: The government defined the agency as the body that monitors forests and organises
    the national forest inventory.
  url: https://jurliga.ligazakon.net/news/245920_uryad-rozshiriv-povnovazhennya-derzhlsagentstva-u-sfer-kontrolyu-ta-auditu
  fetched: 2026-11-03
  quote: Зокрема, Агентство визначено органом, який здійснює моніторинг лісів та організовує
    проведення їх національної інвентаризації.
- claim: Its own site names it the State Agency for Forest Resources of Ukraine.
  url: https://forest.gov.ua/
  fetched: 2026-11-03
  quote: Головна | Державне агентство лісових ресурсів України
- claim: Since 2025 it has been coordinated through the minister responsible for the economy
    and the environment.
  url: https://www.kmu.gov.ua/en/news/minekonomiky-staie-ministerstvom-ekonomiky-dovkillia-ta-silskoho-hospodarstva
  fetched: 2026-11-03
  quote: State Agency for Forest Resources of Ukraine
- claim: In December 2020 the government decided to transfer six nature reserves and a national
    nature park from the agency’s management to the environment ministry.
  url: https://www.kmu.gov.ua/news/6-prirodnih-zapovidnikiv-ta-nacionalnij-prirodnij-park-gomilshanski-lisi-bude-peredano-pid-upravlinnya-mindovkillya
  fetched: 2026-11-03
  quote: Уряд прийняв рішення про передачу шести природних заповідників та національного природного
    парку «Гомільшанські ліси» із сфери управління Держлісагенства до Міндовкілля.
- claim: The agency's head says the National Forest Inventory continues under martial law.
  url: https://forest.gov.ua/news/natsionalna-inventaryzatsiia-lisiv-tryvaie-popry-vyklyky-shyrokomasshtabnoi-viiny
  fetched: 2026-11-03
  quote: І навіть в умовах воєнного стану ця робота не зупиняється. Про це повідомив голова
    Держлісагентства Віктор Смаль.
- claim: In 2023 an inventory based on Earth remote sensing was introduced as a temporary
    alternative to field work, with support from international partners.
  url: https://forest.gov.ua/news/natsionalna-inventaryzatsiia-lisiv-tryvaie-popry-vyklyky-shyrokomasshtabnoi-viiny
  fetched: 2026-11-03
  quote: у 2023 році було впроваджено інвентаризацію лісів на основі дистанційного зондування
