summary: Database of protected steppe species, kept by volunteers, which at the stage described held 13,678
  species records and about 5,400 steppe plots drawn from satellite images.
facts:
- claim: Described as a database of records of steppe species protected by the Red Data Book of Ukraine,
    regional lists and international conventions.
  url: https://uncg.org.ua/kadastr-stepovogo-bioriznomanittya/
  fetched: 2026-11-03
  quote: Степовий кадастр – база даних відомостей про знахідки степових видів флори та фауни, що охороняються
    на території України Червоною книгою України, регіональними охоронними списками та міжнародними конвенціями.
- claim: The page says it is kept by a group of volunteers and is neither a project nor a state programme.
  url: https://uncg.org.ua/kadastr-stepovogo-bioriznomanittya/
  fetched: 2026-11-03
  quote: Степовий кадастр – це не проект і не державна програма. Він ведеться групою ентузіастів винятково
    на громадських засадах.
- claim: At the stage described, it held 13,678 species records and about 5,400 steppe plots drawn from
    satellite images.
  url: https://uncg.org.ua/kadastr-stepovogo-bioriznomanittya/
  fetched: 2026-11-03
  quote: На даному етапі зібрано 13678 згадок про знаходження видів, ще близько 6000 згадок опрацьовуються.
    Знайдено та намальовано по космічних знімках біля 5400 діялнок степу
