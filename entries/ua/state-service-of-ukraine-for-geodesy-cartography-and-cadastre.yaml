  quote: Держгеокадастр працює над розбудовою національної інфраструктури геопросторових даних
    (НІГД)
- claim: By its order of 28 January 2021 it named the state enterprise Research Institute
    of Geodesy and Cartography as administrator of the national geoportal.
  url: https://www.kmu.gov.ua/news/derzhgeokadastr-pracyuye-nad-rozbudovoyu-nacionalnoyi-infrastrukturi-geoprostorovih-danih-nigd
