  quote: State Service of Ukraine for Geodesy, Cartography, and Cadastre
- claim: In August 2021 it said it was working on building the national spatial data infrastructure.
  url: https://www.kmu.gov.ua/news/derzhgeokadastr-pracyuye-nad-rozbudovoyu-nacionalnoyi-infrastrukturi-geoprostorovih-danih-nigd
