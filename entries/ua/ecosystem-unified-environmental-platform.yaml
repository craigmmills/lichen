summary: National automated environmental information and analysis system, launched in test mode in May
  2021, integrated with Diia and holding 66 open environmental data registers by October 2021.
facts:
- claim: The Cabinet of Ministers adopted a resolution on the platform, which the environment ministry
    had launched in test mode in May 2021.
  url: https://www.kmu.gov.ua/news/v-ukrayini-pracyuye-yedinij-ekologichnij-veb-portal-ekosistema
  fetched: 2026-11-03
  quote: Цим рішенням врегульовується питання функціонування єдиної екологічної платформи, яку Міндовкілля
    в тестовому режимі запустило ще в травні 2021 року.
- claim: Defined as the national automated environmental information and analysis system, integrated with
    the Diia portal.
  url: https://www.kmu.gov.ua/news/v-ukrayini-pracyuye-yedinij-ekologichnij-veb-portal-ekosistema
  fetched: 2026-11-03
  quote: Цей документ визначає «ЕкоСистему» як загальнодержавну екологічну автоматизовану інформаційно-аналітичну
    систему, інтегровану з порталом «Дія»
- claim: In October 2021 it held 66 registers of open environmental data and integrated the State Cadastre
    of Territories and Objects of the Nature Reserve Fund.
  url: https://www.kmu.gov.ua/news/v-ukrayini-pracyuye-yedinij-ekologichnij-veb-portal-ekosistema
  fetched: 2026-11-03
  quote: '66 реєстрів відкритих екологічних даних, 3 інтегровані інформаційні ресурси: Державний кадастр
    територій та об’єктів природно-заповідного фонду'
