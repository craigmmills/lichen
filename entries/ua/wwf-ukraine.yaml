- claim: An official member of the WWF-CEE network since its foundation in 2020, with a team
    in Kyiv and Lviv.
  url: https://www.wwfcee.org/our-offices/ukraine
  fetched: 2026-11-03
  quote: WWF-Ukraine has been an official member of the WWF-CEE network since its foundation
    in 2020
- claim: Its projects are mainly in the Carpathians, Polissya and the Danube Delta.
  url: https://www.wwfcee.org/our-offices/ukraine
  fetched: 2026-11-03
  quote: WWF-Ukraine conservation projects are mainly concentrated in the Carpathians , Polissya
    and the Danube Delta .
- claim: From 2017 to 2022 it provided a camera-trap network in protected areas, forestry
    and hunting farms to monitor rare large carnivores, and trained staff in scientific monitoring
    methods.
  url: https://www.wwfcee.org/our-offices/ukraine
  fetched: 2026-11-03
  quote: '2017-2022 Large Carnivores: WWF-Ukraine provides a photo traps network on the territory
    of protected areas, forestry, and hunting farms (Carpathians, Polissya) for monitoring
    rare large carnivores'
