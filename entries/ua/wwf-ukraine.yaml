summary: A WWF-CEE conservation organisation working in the Carpathians, Polissya and Danube
  Delta, collaborating with Uzhanskyi National Nature Park on lynx camera-trap monitoring
  and using Sensing Clues.
facts:
- claim: Its Rare Species team and Uzhanskyi National Nature Park scientists run lynx monitoring,
    synchronised with the transboundary Eastern Carpathians biosphere reserve and supported
    by the LECA project.
  url: https://wwf.ua/?20589341%2Funikalnyi-monitorynh-rozkryv-realnu-chyselnist-ridkisnoho-khyzhyaka-v-uzhanskomu-natsparku=
  fetched: 2026-11-03
  quote: Над проєктом працюють експерти команди “Рідкісні види” Всесвітнього фонду природи
    WWF-Україна та науковці Ужанського національного природного парку .
- claim: Camera traps were set at 30 locations in Uzhanskyi National Nature Park, and seven
    individual lynx were identified from coat patterns in the photographs.
  url: https://wwf.ua/?20589341%2Funikalnyi-monitorynh-rozkryv-realnu-chyselnist-ridkisnoho-khyzhyaka-v-uzhanskomu-natsparku=
  fetched: 2026-11-03
  quote: Для спостережень на території Ужанського НПП встановили фотопастки на 30 локаціях
- claim: Since 2019 it has passed 74 monitoring devices and accessories to 9 conservation
    and 3 forestry institutions.
  url: https://specials.wwf.ua/lynx
  fetched: 2026-11-03
  quote: Загалом, з 2019 року 74 засоби стеження та необхідні аксесуари до них передали до
    9 природоохоронних та 3 лісогосподарських установ.
- claim: Says it collected lynx records from 650 locations and more than 500 institutions
    to map lynx distribution in Ukraine.
  url: https://specials.wwf.ua/lynx
  fetched: 2026-11-03
  quote: зібрати та проаналізувати дані знахідок рисі у 650 локаціях та з понад 500 установ
    Карпат і Полісся, щоб створити актуальну карту поширення рисі в Україні
- claim: Sensing Clues quotes a WWF Ukraine wildlife project officer on data synchronisation
    from field partners.
  url: https://sensingclues.org/solutionpartners
  fetched: 2026-11-03
  quote: Roman, Project Officer Wildlife, WWF, Ukraine
- claim: Commissioned a review of the use of geographic information systems and artificial
    intelligence to protect high conservation value forests in Ukraine, within the Smartwood
    (BBB UI) Build Back Better Ukraine Initiative project.
  url: https://www.belosvyat.com.ua/wp-content/uploads/2024/10/gis-and-ai-for-protecting-high-conservation-value-forests-of-ukraine.pdf
  fetched: 2026-11-03
  quote: Публікацію підготовлено експертами на замовлення Всесвітнього фонду природи WWF-Україна
    в межах проєкту “Smartwood (BBB UI) Build Back Better Ukraine Initiative”.
- claim: WWF's international site hosts WWF-Ukraine's pages.
  url: https://wwf.panda.org/ru/ukraine/
  fetched: 2026-11-03
  quote: WWF-Україна | WWF-Ukraine
