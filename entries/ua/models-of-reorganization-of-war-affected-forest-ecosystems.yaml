summary: Active project funded by the National Research Foundation of Ukraine that
  uses drones, LiDAR and simulation to study war-affected forests remotely because
  of landmines, and produced a GBIF flora dataset.
facts:
- claim: Funded by the National Research Foundation of Ukraine under grant 2025.07/0272.
  url: https://api.gbif.org/v1/dataset/0511fd17-93e6-4510-b38c-d8553427649c
  fetched: 2026-11-09
  quote: This research (data collection) was funded by the National Research Foundation
    of Ukraine (grant No. 2025.07/0272, “Models of reorganization of war-affected
    forest ecosystems”).
- claim: Combines drone stereophotogrammetry of post-fire vegetation, LiDAR assessment
    of forest structure and simulation of forest development.
  url: https://api.gbif.org/v1/dataset/0511fd17-93e6-4510-b38c-d8553427649c
  fetched: 2026-11-09
  quote: 'The research combines three components: analysis of post-fire vegetation
    dynamics using UAV-based stereophotogrammetry, assessment of forest structure
    with LiDAR, and simulation of forest development using a dynamics model.'
- claim: Relies on remote methods because of landmine contamination, using drone surveys,
    digital transects and 3D point clouds.
  url: https://api.gbif.org/v1/dataset/0511fd17-93e6-4510-b38c-d8553427649c
  fetched: 2026-11-09
  quote: The project relies exclusively on remote methods due to safety constraints,
    using UAV surveys, digital transects, and 3D point clouds to map vegetation and
    analyse under-canopy conditions without field presence.
- claim: Its data collection produced a GBIF dataset on the flora of war-affected
    pine forests in Izium Forestry, Kharkiv oblast.
  url: https://api.gbif.org/v1/dataset/0511fd17-93e6-4510-b38c-d8553427649c
  fetched: 2026-11-09
  quote: Flora of the war-affected pine forests of the Izium Forestry (Kharkiv Oblast,
    Ukraine)
