facts:
- claim: Its GBIF record calls it the principal organisation for zoological sciences in Ukraine,
    holding a large collection of animals.
  url: https://api.gbif.org/v1/organization/f43d0d02-84e6-468e-8832-a0906a10b4e9
  fetched: 2026-11-03
  quote: The Schmalhausen Institute of Zoology of the National Academy of Sciences of Ukraine
    is the principal organization for zoological sciences in Ukraine and in Eastern Europe.
- claim: Its researchers led a 2023 paper modelling the distribution of the chytrid fungus
    with special reference to Ukraine.
  url: https://api.openalex.org/works/W4378222393
  fetched: 2026-11-03
  quote: Modeling the Distribution of the Chytrid Fungus Batrachochytrium dendrobatidis with
    Special Reference to Ukraine
- claim: A researcher affiliated with it led a 2023 validation of the F-POD, a fully automated
    cetacean monitoring system.
  url: https://api.openalex.org/works/W4388775445
  fetched: 2026-11-03
  quote: Validation of the F-POD\u2014A fully automated cetacean monitoring system
