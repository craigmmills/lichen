facts:
- claim: The Luhansk Nature Reserve is part of the National Academy of Sciences of
    Ukraine. After the full-scale invasion began, the reserve relocated and its staff
    continued analysing earlier observations and materials outside the Luhansk region.
    In March 2026, the director reported that part of the reserve remained occupied.
  url: https://www.nas.gov.ua/en/media_about_us/yak-pracyuye-luganskiy-prirodniy-zapovidnik-pid-chas-viyni--v-intervyu-yogo-direktorki-larisi-borovik
  fetched: 2026-11-17
  quote: In the interview, Larisa Borovyk also draws attention to the fact that part
    of the reserve's territories is currently under occupation, and reliable information
    about the state of ecosystems is limited.
- claim: The natural complexes of its Stanytsia Luhanska branch are described from
    pre-war studies.
  url: https://www.nas.gov.ua/en/media_about_us/yak-pracyuye-luganskiy-prirodniy-zapovidnik-pid-chas-viyni--v-intervyu-yogo-direktorki-larisi-borovik
