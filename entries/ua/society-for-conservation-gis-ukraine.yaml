summary: Society helping Ukrainian institutions, parks and communities use GIS since 2012,
  with work on damage monitoring, drone surveys, an open protected areas cadastre and, in
  2020, preparation for GBIF accession.
facts:
- claim: Describes itself as the Ukrainian society for conservation GIS, helping Ukrainian
    institutions, national parks and communities use GIS since 2012.
  url: https://scgis.org.ua/ua/about/
  fetched: 2026-11-03
  quote: Society for Conservation GIS Ukraine (SCGIS Ukraine) – це Українське Товариство Природоохоронних
    ГІС.
- claim: Runs the annual seminar "GIS and Protected Areas".
  url: https://scgis.org.ua/ua/about/
  fetched: 2026-11-03
  quote: Важливим і найпершим нашим проєктом є щорічний семінар “ ГІС та заповідні території
    ” для фахівців та новачків у використанні ГІС.
- claim: Its 2025 report says it continued monitoring damage to landscapes in Kharkiv region
    with two communities, Kharkiv University and the region's national parks.
  url: https://scgis.org.ua/ua/report/2025-report/
  fetched: 2026-11-03
  quote: Продовжено моніторингу шкоди ландшафтам Харківської області у співпраці з Роганською
    та Краснокутською громадою та Харківським університетом, та національними парками Харківської
    області
- claim: Its 2025 report lists open environmental data updated with remote sensing on protected
    areas in Kharkiv, Donetsk and Luhansk regions, and data on fires, forest clear-cuts and
    biodiversity.
  url: https://scgis.org.ua/ua/report/2025-report/
  fetched: 2026-11-03
  quote: 'Відкриті екологічні дані : оновлення даних про стан ПЗФ засобами дистанційного зондування
    в межах Харківської, Донецької та Луганської областей'
- claim: A news post says SCGIS Ukraine and another NGO met specialists of the State Environmental
    Inspectorate of the Polissya District to review findings from Sentinel satellite monitoring
    and GIS analysis of possible environmental violations in Zhytomyr and Rivne regions.
  url: https://scgis.org.ua/news/satellite-data-and-gis-the-next-stage-of-interaction-with-public-organizations-to-detect-and-prevent-environmental-violations/
  fetched: 2026-11-03
  quote: During the meeting, preliminary analytical conclusions of experts obtained from the
    results of the application of satellite monitoring tools (Sentinel data of the Copernicus
    program) and geographic information systems were considered.
- claim: Surveys areas of environmental importance with drones, producing high-resolution
    photo plans and terrain models, and has used them to assess nesting bird colonies in wetlands.
  url: https://scgis.org.ua/projects/drones/
  fetched: 2026-11-03
  quote: To compensate for this gap, we began work on surveying areas of environmental importance
    using unmanned aerial vehicles (UAVs).
- claim: Its project pages describe a crowdsourced open cadastre of Ukraine's protected areas,
    with boundaries being digitised into OpenStreetMap and an alpha online service for access
    and validation.
  url: https://scgis.org.ua/projects/cadastre/
  fetched: 2026-11-03
  quote: Alpha-version of the online service for the rapid data access and validation has
    been launched and available from WebApp
- claim: A project page written in March 2020 says it was preparing for Ukraine's accession
    to GBIF and helping Ukrainian research institutions publish data.
  url: https://scgis.org.ua/projects/gbif/
  fetched: 2026-11-03
  quote: SCGIS Ukraine is working to prepare for Ukraine's official accession to the GBIF.
    But we are already raising awareness of GBIF and open data on biodiversity, as well as
    assisting Ukrainian research institutions in publishing data.
