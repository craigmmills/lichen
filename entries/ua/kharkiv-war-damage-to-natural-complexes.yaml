summary: SCGIS Ukraine reports its closed project ran from December 2022 to December 2023, mapping Kharkiv
  war damage through Sentinel-2 and Planet images and recording over 61,000 craters.
facts:
- claim: SCGIS Ukraine says the project was launched in December 2022 within the Initiative for the Development
    of Environmental Policy and Advocacy in Ukraine, implemented by the International Renaissance Foundation
    with Swedish financial support, and was completed by December 2023.
  url: https://scgis.org.ua/news/pro%d1%94kt-fiksacziya-shkodi-zavdano%d1%97-prirodnim-kompleksam-harkivsko%d1%97-oblasti-vnaslidok-vijni-zaversheno/
  fetched: 2026-11-03
  quote: We would like to remind you that the project was launched in December 2022 within the framework
    of the Initiative for the Development of Environmental Policy and Advocacy in Ukraine, which is implemented
    by the International Renaissance Foundation with the financial support of Sweden.
- claim: The main method was visual reading of Sentinel-2 and Planet images of the areas fought over between
    February and October 2022.
  url: https://scgis.org.ua/news/pro%d1%94kt-fiksacziya-shkodi-zavdano%d1%97-prirodnim-kompleksam-harkivsko%d1%97-oblasti-vnaslidok-vijni-zaversheno/
  fetched: 2026-11-03
  quote: The main method of work was the visual decoding of Sentinel-2 and Planet images of the territory
    of the areas where the fighting took place during February-October 2022.
- claim: The geodatabase records more than 61,000 craters from shells, mines and rockets.
  url: https://scgis.org.ua/news/pro%d1%94kt-fiksacziya-shkodi-zavdano%d1%97-prirodnim-kompleksam-harkivsko%d1%97-oblasti-vnaslidok-vijni-zaversheno/
  fetched: 2026-11-03
  quote: The basis of the base was the fixation of craters formed as a result of the impact of shells,
    mines, and rockets. Their number exceeds 61,000 pieces.
