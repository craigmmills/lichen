summary: Central executive body for state space activity policy that, Mind reported in 2021,
  would track illegal logging and mining by satellite imagery with the environment ministry.
facts:
- claim: The government's geoportal page listed its data sets among those on the national
    geoportal in August 2021.
  url: https://www.kmu.gov.ua/news/derzhgeokadastr-pracyuye-nad-rozbudovoyu-nacionalnoyi-infrastrukturi-geoprostorovih-danih-nigd
  fetched: 2026-11-03
  quote: Станом на серпень 2021 року на геопорталі доступні актуальні набори геопросторових
    даних НДІГК, Держводагентства, Укравтодору, Мінрегіону та ДКА
- claim: Ukrinform reported in 2022 that the Sich-2-30 Earth remote sensing satellite, designed
    at the Yuzhnoye State Design Office to monitor land, vegetation, forest and water resources,
    was launched.
  url: https://www.ukrinform.net/rubric-society/3384579-ukraines-sich230-satellite-launched-into-orbit.html
  fetched: 2026-11-03
  quote: Sich-2-30 spacecraft was designed at the Pivdenne (Yuzhnoye) State Design Office,
    Dnipro City, to monitor the use of land, vegetation, forest, water resources and to eliminate
    the consequences of natural disasters.
- claim: Mind reported in February 2021, citing the agency, that illegal logging, mining,
    dumps and building on water shores would be tracked with satellite imagery under its cooperation
    with the environment ministry.
  url: https://mind.ua/news/20222245-v-ukrayini-ekologichni-zlochini-vidstezhuvatimut-za-dopomogoyu-suputnikovih-znimkiv-derzhkosmos
  fetched: 2026-11-03
  quote: Незаконні вирубки лісу, видобуток корисних копалин, стихійні сміттєзвалища, а також
    забудови узбережжя водойм будуть відслідковуватися за допомогою
- claim: Mind reported in 2021 that the National Centre for Control and Testing of Space Facilities
    was working on methods for environment inspectors to use satellite images, so the data
    would stand in court.
  url: https://mind.ua/news/20222245-v-ukrayini-ekologichni-zlochini-vidstezhuvatimut-za-dopomogoyu-suputnikovih-znimkiv-derzhkosmos
  fetched: 2026-11-03
  quote: Повідомляється, що Національний центр управління та випробувань космічних засобів
    працює над методиками використання знімків у діяльності інспекторів Міндовкілля
- claim: CEOS lists the State Space Agency of Ukraine as a member agency from Ukraine since
    1993, with Oleg Fedorov as principal and Natalya Kussul as contact.
  url: https://ceos.org/about-ceos/agencies/
  fetched: 2026-11-03
  quote: State Space Agency of Ukraine (SSAU) Ukraine 1993 P - Oleg Fedorov C - Natalya Kussul
- claim: The Belgian Platform on Earth Observation lists the agency's primary missions as
    developing state space policy and organising space activities in Ukraine.
  url: https://eo.belspo.be/en/stereo-in-action/organisations/state-space-agency-ukraine
  fetched: 2026-11-03
  quote: Organization and development of space activities in Ukraine and under its jurisdiction
    abroad
