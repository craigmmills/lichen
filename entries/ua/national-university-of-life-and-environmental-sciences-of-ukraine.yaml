facts:
- claim: Its Department of Forest Mensuration and Forest Management hosts the Laboratory for
    Remote Sensing Forest Monitoring, inaugurated on 22 July 2025.
  url: https://nubip.edu.ua/en/node/158001
  fetched: 2026-11-03
  quote: The laboratory was inaugurated on July 22, 2025 during the International Workshop
    on the Implementation of the Best Practices on Forest Monitoring in Ukraine using Remote
    Sensing Technologies.
- claim: NULES authors published a 2021 paper on predictive mapping of natural forest regeneration
