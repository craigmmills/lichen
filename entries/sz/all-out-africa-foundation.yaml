- claim: It lists savannah research and monitoring and in-shore marine research and
    monitoring among its charitable services.
  url: https://www.alloutafrica.org/about-us.html
  fetched: 2026-11-14
  quote: 'Wildlife research: Savannah research & monitoring, in-shore marine research
