summary: Statutory body managing Eswatini's parks and reserves, SNPAS lead partner
  and restoration project executing agency, with a 2018 review recording SMART patrolling
  pilots in its parks.
facts:
- claim: The National Trust Commission Act, 1972, as held on FAOLEX, establishes the
    Swaziland National Trust Commission as a body corporate.
  url: https://faolex.fao.org/docs/pdf/swa34195.pdf
  fetched: 2026-11-15
  quote: There is established a body to be known as the "Swaziland National Trust
- claim: Under the Act the Commission controls, manages and maintains parks and reserves.
  url: https://faolex.fao.org/docs/pdf/swa34195.pdf
  fetched: 2026-11-15
  quote: the Commission shall control, manage and maintain parks and reserves for
    the objects
- claim: UNFCCC's technical assessment of Eswatini's 2024 forest reference level names
    the Eswatini National Trust Commission, with the Ministry of Tourism and Environmental
    Affairs, the Ministry of Agriculture and the University of Eswatini, as having
    generated remote sensing products used for the activity data.
  url: https://unfccc.int/sites/default/files/resource/tar2024_SWZ.pdf
  fetched: 2026-11-15
  quote: remote sensing products generated by the Ministry of Tourism and Environmental
    Affairs, the Ministry of Agriculture, the University of Eswatini and the Eswatini
    National Trust Commission.
- claim: In May 2021, UNDP called the Commission the lead partner in implementing
    SNPAS and reported that it had led development of the strategic guidelines on
    other effective conservation measures (OECMs).
  url: https://www.undp.org/eswatini/news/biodiversity-and-ecosystems-conservation-framework-eswatini-launched
  fetched: 2026-11-15
  quote: Eswatini National Trust Commission (ENTC), the lead partner in the implementation
    of SNPAS, for successfully leading the processes of developing the historic strategic
    guidelines of the OECMs.
- claim: GEF lists it as an executing agency of the GEF-7 project on ecosystem restoration
    in the Mbuluzi River Basin, approved for implementation in March 2023.
  url: https://www.thegef.org/projects-operations/projects/10695
  fetched: 2026-11-15
  quote: Eswatini National Trust Commission (ENTC), Min of Agriculture, Ministry of
    Tinkhundla Administration and Development
- claim: The SNPAS project's 2018 midterm review listed an equipped GIS lab in the
    Commission (then SNTC) among the project's results.
  url: https://erc.undp.org/evaluation/documents/download/12273
  fetched: 2026-11-15
  quote: GIS lab in SNTC equipped
- claim: The SNPAS project's 2018 midterm review recorded pilot introduction of the
    SMART patrolling system and equipment in national parks managed by the Commission.
  url: https://erc.undp.org/evaluation/documents/download/12273
  fetched: 2026-11-15
  quote: introduction of the SMART patrolling system and equipment in SNTC -managed
    national parks
- claim: The CBD Secretariat's focal points page gives its address in Lobamba, Eswatini.
  url: https://www.cbd.int/countries/nfp?country=sz
  fetched: 2026-11-15
  quote: Eswatini National Trust Commission (ENTC) P.O. Box 100 H107 Lobamba Eswatini
