id: strengthening-the-national-protected-areas-system-eswatini
kind: project
name: Strengthening the National Protected Areas System of Swaziland (SNPAS)
also_known_as:
- SNPAS
- GEF 5065
scope: sz
ai_label: conservation-tech
realms:
- land
countries:
- sz
status: closed
summary: Closed GEF-funded project, run by the Eswatini National Trust Commission
  from 2015 to 2021, which UNDP says raised protected area coverage from 3.9% to 5.5%
  and developed a GIS-based biodiversity information system.
facts:
- claim: GEF lists the project as aiming to expand, manage and develop the country's
    protected area network.
  url: https://www.thegef.org/projects-operations/projects/5065
  fetched: 2026-11-15
  quote: To effectively expand, manage and develop Swaziland’s protected area network
    in order to adequately protect the biodiversity and landscapes of the country.
- claim: UNDP says the six-year project ran from 2015 to 2021.
  url: https://www.undp.org/eswatini/stories/communities-thrive-through-protected-land-eswatini
  fetched: 2026-11-15
  quote: This six-year initiative implemented between 2015-2021
- claim: UNDP says the project developed a GIS-based Biodiversity Information System
    and trained over 20 community and private sector groups in drone use, ecotourism
    marketing and financial management.
  url: https://www.undp.org/eswatini/stories/communities-thrive-through-protected-land-eswatini
  fetched: 2026-11-15
  quote: from developing a GIS-based Biodiversity Information System to training over
    20 community and private sector groups in drone use
- claim: UNDP says GEF funded it with USD 6 million and the Eswatini National Trust
    Commission implemented it with UNDP technical support, and that it expanded protected
    area coverage from 3.9% to 5.5%.
  url: https://www.undp.org/eswatini/stories/communities-thrive-through-protected-land-eswatini
  fetched: 2026-11-15
  quote: The Global Environment Facility (GEF) funded the project to the tune of USD6
    million, and it was implemented by the Eswatini National Trust Commission (ENTC)
    through technical support from UNDP.
- claim: The project's 2018 midterm review listed an updated and improved biodiversity
    database and a GIS-based portal among its results, but said the portal could not
    yet be activated because administration rights had not been transferred.
  url: https://erc.undp.org/evaluation/documents/download/12273
  fetched: 2026-11-15
  quote: 'portal cannot be activated as admin rights

    have not yet been transferred'
- claim: GEF lists the project as completed.
  url: https://www.thegef.org/projects-operations/projects/5065
  fetched: 2026-11-15
  quote: Status Completed
- claim: GEF lists the Swaziland Environment Agency (SEA) as executing agency.
  url: https://www.thegef.org/projects-operations/projects/5065
  fetched: 2026-11-15
  quote: Swaziland Environment Agency (SEA)
