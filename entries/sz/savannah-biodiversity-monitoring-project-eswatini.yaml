summary: A project run by All Out Africa Foundation, ongoing since 2013, with seasonal
  surveys of birds, mammals and vegetation on long-term grids in three Eswatini reserves,
  also recording climate, fire and management interventions.
facts:
- claim: Seasonal biodiversity surveys are run on long-term monitoring grids in Mbuluzi
    Game Reserve, Hlane Royal National Park and Mlawula Nature Reserve to determine
    long-term changes in biodiversity and savannah structure.
  url: https://www.alloutafrica.org/savannah-conservation.html
  fetched: 2026-11-14
  quote: we conduct seasonal biodiversity surveys within long term monitoring grids
    in Mbuluzi Game Reserve, Hlane Royal National Park and Mlawula Nature Reserve
    to determine long term changes in biodiversity & savannah structure and the drivers
    of this change.
- claim: The surveys cover birds, small mammals, large mammals, trees, shrubs and
    grasses.
  url: https://www.alloutafrica.org/savannah-conservation.html
  fetched: 2026-11-14
  quote: We survey birds, small mammals (rodents, shrews & bats), large mammals (ungulates
    & predators), trees, shrubs and grasses.
- claim: The project also records climate, disturbances such as fire, and management
    interventions.
  url: https://www.alloutafrica.org/savannah-conservation.html
  fetched: 2026-11-14
  quote: We record climate and disturbances (e.g. fire) as well as management interventions
    (clearing & culling) to record long-term change.
- claim: The project has been on-going since 2013.
  url: https://www.alloutafrica.org/savannah-conservation.html
  fetched: 2026-11-14
  quote: This project has been on-going since 2013.
