summary: Government forestry department that, the Coalition for Rainforest Nations reported in February
  2025, has built in-house data capacity since 2023, leading to a first Forest Reference Level submitted
  to the UNFCCC in January 2024.
facts:
- claim: In February 2025, the Coalition for Rainforest Nations reported that the forestry department
    had worked under its guidance since 2023 to build in-house capacity to collect data and prepare estimates
    for UNFCCC reporting.
  url: https://www.rainforestcoalition.org/country-news/eswatinis-first-results-for-slowing-deforestation-due-from-un/
  fetched: 2026-11-12
  quote: Since 2023, the forestry department of Eswatini has been working under the guidance of CfRN to
    build in-house capacity to collect data and prepare estimations for reporting under the United Nations
    Framework Convention on Climate Change (UNFCCC) and the Paris Agreement.
- claim: The work led to Eswatini's first Forest Reference Level, covering all the country's forests for
    2000 to 2020, submitted to the UNFCCC in January 2024, according to the Coalition.
  url: https://www.rainforestcoalition.org/country-news/eswatinis-first-results-for-slowing-deforestation-due-from-un/
  fetched: 2026-11-12
  quote: This work resulted in the submission of Eswatini’s first forest baselines, called a Forest Reference
    level (FRL) to the UNFCCC in January 2024, using the period 2000-2020.
