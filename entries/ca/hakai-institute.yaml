summary: Division of the Tula Foundation that has mapped kelp on British Columbia's Central
  Coast for about a decade. It developed the public KelpExplorer map and Kelp-O-Matic, a machine
  learning tool for classifying drone imagery of kelp.
facts:
- claim: Has mapped surface canopy kelps on the Central Coast for about a decade.
  url: https://hakai.org/kelp-mapping-guidebook/
  fetched: '2026-10-31'
  quote: The Hakai Institute has been mapping these surface canopy-forming kelps on the Central
    Coast of British Columbia for about a decade
- claim: Runs the Pacific eDNA Coastal Observatory project, a collaborative census of seagrass
    fish.
  url: https://hakai.org/highlights-from-the-nearshore/
  fetched: '2026-10-31'
  quote: This Pacific eDNA Coastal Observatory (PECO) project is a collaborative census of
    the fish diversity found in seagrass meadows
- claim: Conducts long-term research on the British Columbia coastal margin.
  url: https://tula.org/divisions/hakai-institute
  fetched: '2026-10-31'
  quote: The Hakai Institute conducts long-term scientific research at remote locations on
    the coastal margin of British Columbia, Canada.
- claim: Makes specialised applications and tools for the coastal margin.
  url: https://tula.org/divisions/hakai-institute
  fetched: '2026-10-31'
  quote: Hakai creates many specialized applications and tools
- claim: Monitors biodiversity through eDNA sampling.
  url: https://hakai.org/science/science-axes/biodiversity-genomics
  fetched: '2026-10-31'
  quote: thereby monitoring biodiversity today across a broad spectrum
- claim: Located on Calvert Island, British Columbia.
