facts:
- claim: Its homepage describes whale entanglement in fixed-gear fishing as the problem
    it addresses.
  url: https://ashored.ca/
  fetched: 2026-11-22
  quote: 83 percent of the North Atlantic Right Whale population show scars from fishing
    gear entanglements
- claim: Was named as the lead of the ROC Fishing System Project, which planned to
    develop gear that coils fishing line on the seafloor.
  url: https://oceansupercluster.ca/project/canadas-ocean-supercluster-announces-1-4m-roc-fishing-system-project/
  fetched: 2026-11-22
  quote: Led by Ashored Inc., with NL-based partner eSonar Inc., the ROC Fishing System
    Project team will work together to take a traditional vertical fishing line connected
    to lobster and crab traps and coil it on the seafloor in a contained unit with
    a recovery buoy.
- claim: The project is described as aimed at protecting marine species at risk from
