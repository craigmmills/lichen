summary: A community-based, collaborative programme using cameras for medium and large
  animals and sound recorders for soundscapes, run by the Northwest Territories environment
  department with several partners.
facts:
- claim: Cameras photograph medium and large animals and sound recorders record the
    soundscape at set times.
  url: https://www.gov.nt.ca/ecc/en/services/biodiversity/biodiversity-monitoring-program
  fetched: 2026-11-08
  quote: Cameras take photos when a large to medium sized animal walks in front of
    it, while the sound recorders record the soundscape at pre-programmed times and
    dates.
- claim: Described as community-based and collaborative, with partners including the
    Canadian Wildlife Service, Parks Canada, Indigenous governments and several universities.
