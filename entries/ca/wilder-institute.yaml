summary: An organisation whose 2025 annual report describes monitoring habitat for
  a butterfly its genome analysis showed to be a separate species, and which fitted
  translocated fishers with transmitters.
facts:
- claim: Its 2025 annual report says it is monitoring habitat for the curiously isolated
    hairstreak, a butterfly its genome analysis showed to be a separate species.
  url: https://gratitudereport.calgaryzoo.com/
  fetched: 2026-11-08
  quote: We’re monitoring habitat, managing invasive species, and beginning to bring
    individuals into human care so we can learn more and support future population
    growth.
- claim: Fitted fishers translocated from Alberta to Washington state with transmitters
    and collected data on their condition before release.
  url: https://wilderinstitute.org/program/fisher-program/
  fetched: 2026-11-08
  quote: the veterinary team conducted health exams and fitted them with transmitters,
    and researchers collected physical and behavioural data to understand how individual
    characteristics impacted post-release survival
- claim: The fisher programme page reports a motion-sensor camera recording a female
    moving wild-born kits in 2021.
  url: https://wilderinstitute.org/program/fisher-program/
  fetched: 2026-11-08
  quote: In April 2021, a female fisher was captured on a motion-sensor camera moving
    four kits from her den in the North Cascades
