  quote: The Society for the Protection of Birds and Nature is a non-governmental
    organization whose purpose is to protect and conserve the birds and nature of
    Cyprus.
- claim: Active since 1988, it works through education, research, monitoring and lobbying
    in northern Cyprus.
  url: https://kuskor.org/about-us
  fetched: 2026-11-12
  quote: The Society for the Protection of Birds and Nature (KUŞKOR), has been active
    since 1988, and strives to protect birds and their habitats in North Cyprus through
    education, research, monitoring and lobbying.
- claim: Its volunteers took part with BirdLife Cyprus in the January 2025 survey
    of 72 wetland sites.
  url: https://birdlifecyprus.org/how-we-count-waterbirds-in-cyprus/
  fetched: 2026-11-12
  quote: During 17-20 January 2025, our dedicated team of 36 volunteers from BirdLife
    Cyprus and our partners at KUŞKOR surveyed 72 wetland sites across the island.
