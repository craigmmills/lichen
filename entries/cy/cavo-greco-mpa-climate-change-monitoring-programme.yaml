facts:
- claim: The MPA4Change site said in March 2025 that AP Marine was implementing monitoring
    protocols at Cavo Greco MPA, Cyprus, as the next phase of the MPA4Change programme.
  url: https://mpa4change.interreg-euro-med.eu/2025/03/14/monitoring-programme-at-cavo-greco/
  fetched: '2026-11-15'
  quote: AP Marine is undertaking the next phase of the MPA4Change programme with
    the implementation of robust monitoring protocols at Cavo Greco MPA, Cyprus.
- claim: In March 2025, the MPA4Change site reported deployment of water temperature
    loggers for continuous data on thermal variability at Cavo Greco MPA.
  url: https://mpa4change.interreg-euro-med.eu/2025/03/14/monitoring-programme-at-cavo-greco/
  fetched: '2026-11-15'
  quote: The deployment of water temperature loggers facilitates continuous data acquisition
    on thermal variability
- claim: In March 2025, the site reported standardised fish census surveys of key
    indicator species at Cavo Greco MPA.
  url: https://mpa4change.interreg-euro-med.eu/2025/03/14/monitoring-programme-at-cavo-greco/
  fetched: '2026-11-15'
  quote: standardized fish census surveys are conducted using statistically rigorous
    sampling techniques to assess the abundance and diversity of key indicator species
