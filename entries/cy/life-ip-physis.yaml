summary: Integrated project led by the Department of Environment, running July 2019 to October 2029 with
  a budget of about 17 million euros, aiming to provide a geospatial database and web GIS tool for Natura
  2000.
facts:
- claim: Aims to provide a geospatially oriented database system and a web-based GIS tool for the Natura
    2000 network.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-IPE-CY-000006/managing-the-natura-2000-network-in-cyprus-and-shaping-a-sustainable-future
  fetched: 2026-11-08
  quote: provide a geospatially-oriented database system for the Natura 2000 network and a web-based GIS
    tool for governmental, professional, expert and public use
- claim: Complementary actions were planned to include surveillance for invasive alien species and studies
    of targeted species, with completion scheduled by December 2022.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-IPE-CY-000006/managing-the-natura-2000-network-in-cyprus-and-shaping-a-sustainable-future
  fetched: 2026-11-08
  quote: involve habitat restoration, surveillance for Invasive Alien Species, and studies on the ecology
    and conservation status of targeted species
- claim: Runs from July 2019 to October 2029 with a total eligible budget of about 17 million euros.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-IPE-CY-000006/managing-the-natura-2000-network-in-cyprus-and-shaping-a-sustainable-future
  fetched: 2026-11-08
  quote: 'Start Date: 10/07/2019 End Date: 31/10/2029 Total Eligible Budget: 16,996,979 €'
