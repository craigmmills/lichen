summary: Closed project led by BirdLife Cyprus and funded by the MAVA Foundation;
  its first phase, 2017 to 2020, found turtles and elasmobranchs bear the heaviest
  toll from fishing operations.
facts:
- claim: BirdLife Cyprus says the partners used GFCM protocols, trained onboard observers
    and fishers' self-reported data to study the distribution of priority species
    and how bycatch affects them.
  url: https://birdlifecyprus.org/cyprus-bycatch-project/
  fetched: '2026-11-12'
  quote: and using trained onboard observers and data self-reported by fishermen ,
    project partners carr ied out research at sea to understand the spatiotemporal
    distribution of priority species and how these are affected by bycatch.
- claim: The first phase, coordinated by BirdLife International, ran from 2017 to
    2020 with BirdLife Cyprus, Enalia Physis, the Society for the Protection of Turtles
    and the University of Exeter.
  url: https://birdlifecyprus.org/cyprus-bycatch-project/
  fetched: '2026-11-12'
  quote: Coordinated by BirdLife International, BirdLife Cyprus, Enalia Physis Environmental
    Research Centre, the Society for the Protection of Turtles and the University
    of Exeter embarked on a three-year journey (2017 – 2020)
- claim: The data showed turtles and elasmobranchs take the heaviest toll from fishing
    operations.
  url: https://birdlifecyprus.org/cyprus-bycatch-project/
  fetched: '2026-11-12'
  quote: The data gathered showed that turtles and elasmobranch species are the ones
    taking the heaviest toll from fishing operations
- claim: As part of the project, BirdLife Cyprus and Enalia Physis ran a seven-day
    seabird survey at sea using the European Seabirds at Sea field method.
  url: https://birdlifecyprus.org/sailing-for-science/
  fetched: '2026-11-12'
  quote: Our on-board observers were trained and ready to adopt the field methodology
    of ‘European Seabirds at Sea’ (ESAS).
