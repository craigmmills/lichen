summary: Closed project led by GeoImaging that aimed to move forest cover mapping
  to satellite-based monitoring, developing a 3D forest information platform and a
  Saittas fire deforestation case study using 2001 and 2014 data.
facts:
- claim: EOmag says the project aimed to move forest cover mapping from aerial imagery
    and airborne laser scanning to a standalone satellite-based monitoring capacity.
  url: https://eomag.eu/forsat-a-satellite-processing-platform-for-high-resolution-forest-assessment/
  fetched: '2026-11-12'
  quote: The aim of project was to raise the current technological level of aerial
    imagery in combination with airborne laser scanning for forest cover mapping applications
    to a standalone satellite based monitoring capacity.
- claim: FORSAT was developed as a 3D forest information platform with units for 3D
    surface comparison for change detection.
  url: https://eomag.eu/forsat-a-satellite-processing-platform-for-high-resolution-forest-assessment/
  fetched: '2026-11-12'
  quote: FORSAT was developed as a 3D forest information platform and includes units
    for geometric and radiometric processing of satellite imagery and 2D/3D information
    extraction as well as 3D surface comparison for change detection.
- claim: A case study assessed deforestation from forest fire in Saittas, Cyprus,
    from satellite data of 2001 and 2014.
  url: https://eomag.eu/forsat-a-satellite-processing-platform-for-high-resolution-forest-assessment/
  fetched: '2026-11-12'
  quote: Identification and assessment of deforestation caused by forest fire in Saittas,
    Cyprus and based on VHR satellite data of 2001 and 2014 using FORSAT
