summary: Initiative reported launched in June 2026, bringing together ERATOSTHENES
  and Cyta around a station receiving satellite data in near real time, with wildfire,
  marine and coastal monitoring uses stated.
facts:
- claim: ERATOSTHENES's knowledge hub reported in June 2026 the launch of EarthView
    Cyprus, bringing together the ERATOSTHENES Centre of Excellence and Cyta.
  url: https://ecoehub.eratosthenes.org.cy/knowledge-hub/training-material/earthview-cyprus-a-new-space-based-platform-transforming-satellite-data-into-real-world-solutions/
  fetched: '2026-11-15'
  quote: The project brings together the ERATOSTHENES Centre of Excellence and Cyta
    in a partnership focused on strengthening Cyprus’ Earth Observation capabilities
- claim: At its centre is a Satellite Data Acquisition Station capable of receiving
    and processing satellite data in near real time from the Cyta satellite station
    in Pera Orinis.
  url: https://ecoehub.eratosthenes.org.cy/knowledge-hub/training-material/earthview-cyprus-a-new-space-based-platform-transforming-satellite-data-into-real-world-solutions/
  fetched: '2026-11-15'
  quote: At the heart of EarthView Cyprus is the Satellite Data Acquisition Station
    (sDAS), an advanced infrastructure capable of receiving and processing satellite
    data in near real time from the Cyta satellite station in Pera Orinis.
- claim: The page says the initiative will enable applications including wildfire
    monitoring and environmental protection.
  url: https://ecoehub.eratosthenes.org.cy/knowledge-hub/training-material/earthview-cyprus-a-new-space-based-platform-transforming-satellite-data-into-real-world-solutions/
  fetched: '2026-11-15'
  quote: EarthView Cyprus will enable applications in wildfire monitoring, drought
    assessment, agricultural management, maritime surveillance, climate analysis,
    disaster response, and environmental protection.
- claim: The page says Cyprus can use the data to support monitoring of marine environments
    and coastal changes.
  url: https://ecoehub.eratosthenes.org.cy/knowledge-hub/training-material/earthview-cyprus-a-new-space-based-platform-transforming-satellite-data-into-real-world-solutions/
  fetched: '2026-11-15'
  quote: Cyprus can use Earth Observation data to support monitoring of marine environments,
    coastal changes, pollution risks, and offshore activities.
