summary: Non-profit nature conservation organisation in Cyprus that runs and built a bird trapping surveillance
  programme with the RSPB, ongoing since 2002, and holds data on bird distributions and habitats.
facts:
- claim: Developed and runs a systematic surveillance programme on illegal bird trapping with the RSPB,
    ongoing since 2002.
  url: https://birdlifecyprus.org/surveillance-programme
  fetched: 2026-11-08
  quote: A systematic, continuous surveillance programme regarding illegal bird trapping in Cyprus was
    developed and implemented by BirdLife Cyprus and the RSPB (BirdLife in the UK) in consultation with
    the competent authorities, and has been ongoing since 2002.
- claim: Says the programme gives it the longest record of field data on bird trapping on the island.
  url: https://birdlifecyprus.org/surveillance-programme
  fetched: 2026-11-08
  quote: BirdLife Cyprus has the longest record of field data
- claim: Its staff include a Monitoring and Research Coordinator and a Monitoring and Recording Officer.
  url: https://birdlifecyprus.org/our-team/
  fetched: 2026-11-08
  quote: Christina Ieronymidou Monitoring and Research Coordinator
- claim: Says its president contributes to its core funding through the Tasso Leventis Conservation Foundation.
  url: https://birdlifecyprus.org/our-team/
  fetched: 2026-11-08
  quote: Mr. Leventis contributes to our office core funding, as well as to other projects such as the
    Barn Owl and Swift project through the Tasso Leventis Conservation Foundation.
- claim: Describes itself as a non-governmental, non-profit nature conservation organisation in Cyprus
    working through monitoring, conservation and education.
  url: http://www.birdlifecyprus.org/
  fetched: 2026-11-08
  quote: Our mission is to protect the wild birds of Cyprus, their habitats, and wider biodiversity, through
    monitoring, conservation and education actions
- claim: Holds data on bird distributions, populations, abundance and habitats.
  url: https://birdlifecyprus.org/monitoring-birds/
  fetched: 2026-11-08
  quote: BirdLife Cyprus holds data on bird distributions, populations, abundance and habitats that are
    of value for conservation management
- claim: Undertakes surveys, with survey forms for common land-birds, nocturnal birds, waterbird counts,
    Rollers and raptor migration.
  url: https://birdlifecyprus.org/monitoring-birds/
  fetched: 2026-11-08
  quote: BirdLife Cyprus undertakes many surveys where appropriate inferences can only be drawn from analyses
    that take account of the survey and sampling design.
- claim: Custodian of the Important Bird Areas inventory for Cyprus.
  url: https://birdlifecyprus.org/monitoring-birds/
  fetched: 2026-11-08
  quote: BirdLife Cyprus is also custodian of the Important Bird Areas (IBA) inventory for Cyprus
- claim: Shares its data with other users under the conditions of its data provision and access policy.
  url: https://birdlifecyprus.org/monitoring-birds/
  fetched: 2026-11-08
  quote: BirdLife Cyprus is committed to data sharing, making research data accessible and available to
    other users in the interests of effective conservation.
