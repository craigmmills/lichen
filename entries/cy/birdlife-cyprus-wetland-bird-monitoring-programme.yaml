summary: Wetland bird programme run by BirdLife Cyprus since 1982, now monthly monitoring,
  feeding the International Waterbird Census; in January 2025, 36 volunteers surveyed
  72 sites and counted 21,592 waterbirds.
facts:
- claim: BirdLife Cyprus has managed the programme since 1982, when Cyprus first gave
    data to the International Waterbird Census; it now consists of monthly monitoring
    at selected wetlands.
  url: https://birdlifecyprus.org/monitoring-birds/waterbird-counts/
  fetched: 2026-11-12
  quote: BirdLife Cyprus has managed a programme to monitor wetland birds, since 1982,
    when Cyprus first contributed data to the International Waterbird Census.
- claim: Its data contribute to the International Waterbird Census held each January.
  url: https://birdlifecyprus.org/monitoring-birds/waterbird-counts/
  fetched: 2026-11-12
  quote: The data collected by this programme contribute to the worldwide International
    Waterbird Census, which takes place in mid-January each year
- claim: In January 2025, 36 volunteers from BirdLife Cyprus and KUŞKOR surveyed 72
    wetland sites and counted 21,592 waterbirds of 72 species.
  url: https://birdlifecyprus.org/how-we-count-waterbirds-in-cyprus/
  fetched: 2026-11-12
  quote: During 17-20 January 2025, our dedicated team of 36 volunteers from BirdLife
    Cyprus and our partners at KUŞKOR surveyed 72 wetland sites across the island.
- claim: The International Waterbird Census coordinator list names Christina Ieronymidou
    of BirdLife Cyprus for Cyprus.
  url: https://iwc.wetlands.org/index.php/coordinators/
