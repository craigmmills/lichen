  quote: Preparation of the Cyprus Biodiversity Strategy Frederick University
- claim: In November 2022, the university said it coordinated BIOMON, an EU-funded
    project aiming to develop AI methods to monitor birdlife in rural areas of high
    ecological importance in Cyprus with acoustic sensors.
  url: https://frederick.ac.cy/en/latest-news/134-frederick-university-coordinates-the-biomon-research-project
