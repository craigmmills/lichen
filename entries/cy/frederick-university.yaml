  of the Cyprus Biodiversity Strategy.
facts:
- claim: The university's page on its Nature Conservation Unit lists the unit among
    its research units and says the unit focuses on the study, monitoring and conservation
    of the flora, fauna and habitats of Cyprus.
  url: https://frederick.ac.cy/nature-conservation-unit
  fetched: '2026-11-15'
  quote: More specifically, the Unit focuses on the study, monitoring and conservation
    of the flora, fauna and habitats of Cyprus and the management of ecologically
    important areas of the island.
- claim: The page lists Frederick University as lead of the 2020 State of Environment
    Report, funded by the Department of Environment.
  url: https://frederick.ac.cy/nature-conservation-unit
