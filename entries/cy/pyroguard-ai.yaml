    over the preceding two years using artificial intelligence.
  url: https://en.sigmalive.com/pyroguard-ai-identifies-dozens-of-fires-within-seconds/
  fetched: 2026-11-08
  quote: The PyroGuard AI system has detected dozens of fires across Cyprus over the past two years, highlighting
    the growing role artificial intelligence can play in the early detection and response to wildfires.
- claim: In August 2026, Sigmalive reported a network of 65 autonomous stations across Cyprus, with plans
    for more than 100 by the end of 2026.
  url: https://en.sigmalive.com/pyroguard-ai-identifies-dozens-of-fires-within-seconds/
