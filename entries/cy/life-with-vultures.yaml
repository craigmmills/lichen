summary: Four-year project, 2019 to 2023, against the main threats to Griffon Vultures
  in Cyprus, coordinated by BirdLife Cyprus, with a EUR 1,375,861 budget, 60% co-funded
  by the EU LIFE programme.
facts:
- claim: A four-year project, 2019 to 2023, against the main threats to the Griffon
    Vulture in Cyprus, with BirdLife Cyprus as coordinating beneficiary.
  url: https://birdlifecyprus.org/projects/life-with-vultures/
  fetched: 2026-11-12
  quote: In this four-year endeavor (2019-2023), BirdLife Cyprus (coordinating beneficiary),
    the Game and Fauna Service, Terra Cypria – The Cyprus Conservation Foundation
    and the Vulture Conservation Foundation have joined forces
- claim: The 2019–2023 project had a budget of EUR 1,375,861, 60% co-funded by the
    EU LIFE programme.
  url: https://birdlifecyprus.org/projects/life-with-vultures/
  fetched: 2026-11-12
  quote: The project has a €1,375,861 budget and is co-funded (60%) by the EU’s LIFE
    programme .
- claim: The project site shows the movements of Griffon Vultures tagged with GPS
    transmitters, used to monitor the birds' well-being and find foraging areas and
    dangerous power lines.
  url: https://lifewithvultures.eu/the-griffon-vulture/movements-of-the-griffon-vulture-in-cyprus/
  fetched: 2026-11-12
  quote: Click on the maps below to follow the movements of some of the GPS-tagged
    Griffon Vultures in Cyprus.
