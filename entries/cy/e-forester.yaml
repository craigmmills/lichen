summary: EU-funded Cyprus, Italy and Poland collaboration, launched on 18 November 2024 and led by Space
  Systems Solutions, to develop an autonomous robotic vehicle for monitoring forests using robotics and
  AI.
facts:
- claim: Aims at forest monitoring and conservation through robotics and AI, and launched with a ceremony
    at the Cyprus Space Exploration Organisation Space Centre on 18 November 2024.
  url: https://www.cbn.com.cy/article/2024/11/19/806647/e-forester-project-kicks-off/
  fetched: 2026-11-08
  quote: The e-FORESTER project, an innovative initiative aimed at revolutionising forest monitoring and
    conservation through advanced robotics and AI, has officially launched with a kick-off ceremony held
    at the Cyprus Space Exploration Organisation (CSEO) Space Centre.
- claim: An EU-funded collaboration between Cyprus, Italy and Poland to develop an autonomous robotic
    vehicle to monitor forest ecosystems.
  url: https://www.cbn.com.cy/article/2024/11/19/806647/e-forester-project-kicks-off/
  fetched: 2026-11-08
  quote: This is an EU-funded project and a collaboration between Cyprus, Italy and Poland to develop
    an autonomous robotic vehicle that will monitor forest ecosystems
- claim: The press release says its monitoring is meant to help detect and manage invasive species.
  url: https://www.cbn.com.cy/article/2024/11/19/806647/e-forester-project-kicks-off/
  fetched: 2026-11-08
  quote: The project's monitoring capabilities also help detect and manage invasive species that threaten
    Cyprus's unique ecosystems.
- claim: S3 describes it as a Horizon Europe project developing an autonomous rover to monitor forest
    ecosystems.
  url: https://spacesystems.solutions/
  fetched: 2026-11-08
  quote: This innovative Horizon Europe project, a collaboration between Cyprus, Italy, and Poland, develops
    an autonomous robotic rover to monitor forest ecosystems
