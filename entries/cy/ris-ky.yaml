summary: Project launched in April 2017 on invasive alien species impacts in the Sovereign
  Base Areas, funded by the Darwin Initiative, with a Darwin Plus successor scheduled until
  March 2021.
facts:
- claim: Launched in April 2017, it ran for two years on the impacts of invasive alien species
    in the Sovereign Base Areas, funded by the Darwin Initiative.
  url: https://ris-ky.info/index.php/home
  fetched: 2026-11-12
  quote: The project Researching Invasive Species of Kýpros (RIS-Ký) was launched in April
    2017 and ran for two years looking at the impacts of invasive alien species in a variety
    of habitats (terrestrial, freshwater and marine).
- claim: The page announced that RIS-Ký would continue as part of the Darwin Plus project
    on Lake Akrotiri, which started in 2019 and was scheduled to run until March 2021.
  url: https://ris-ky.info/index.php/home
  fetched: 2026-11-12
  quote: RIS-Ký will continue to run as part of the new Darwin Plus project Addressing drivers
    of ecological change in Lake Akrotiri SBA, Cyprus . This project started in 2019 and will
    run until March 2021.
- claim: The 2019–2021 Darwin Plus successor project planned to use high-resolution WorldView
    imagery to make a baseline vegetation map for monitoring change on the Akrotiri peninsula.
  url: https://ris-ky.info/index.php/home
  fetched: 2026-11-12
  quote: We will use high resolution (50cm-4m) multi-spectral (8 bands in the 400nm–1040nm
    range) WorldView imagery to establish a baseline vegetation map, suitable for future monitoring
    of hydro-ecological change.
- claim: Its site describes Pollinator Monitoring Scheme - Kýpros as a recording scheme intended
    to collect data on numbers of flower-visiting insects.
  url: https://ris-ky.info/index.php/home
  fetched: 2026-11-12
  quote: Pollinator Monitoring Scheme - Kýpros is a recording scheme that will collect data
    on numbers of flower-visiting insects.
