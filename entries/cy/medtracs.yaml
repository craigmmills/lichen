summary: Established in 2022, the NGO began satellite tracking of two turtles nesting
  at Lara Bay, one green and one loggerhead, according to Politis (29 July 2026).
facts:
- claim: Cyprus Mail (December 2023) describes MedTRACS as a new NGO established in
    2022, implementing the Cyprus Turtle Conservation and Research Programme for the
    Department of Fisheries and Marine Research.
  url: https://cyprus-mail.com/2023/12/10/dedicating-their-life-to-turtle-conservation
  fetched: '2026-11-12'
  quote: MedTRACS is a new NGO established in 2022 but the people working in it have
    years – decades – of experience in marine turtle biology and conservation.
- claim: The same article says it implements the programme for the Department of Fisheries
    and Marine Research, the authority responsible.
  url: https://cyprus-mail.com/2023/12/10/dedicating-their-life-to-turtle-conservation
  fetched: '2026-11-12'
  quote: MedTRACS is currently implementing the Cyprus Turtle Conservation and Research
    Programme for the Department of Fisheries and Marine Research, the authority responsible
    for the project.
- claim: Politis (29 July 2026) reports that MedTRACS, responsible for the national
    Sea Turtle Protection and Monitoring Programme, began satellite tracking of Cyprus's
    sea turtles with Sea Turtle Conservancy.
  url: https://en.politis.com.cy/news/environment/1022677/researchers-track-cyprus-sea-turtles-across-mediterranean
  fetched: '2026-11-12'
  quote: MedTRACS (Mediterranean Turtle Research and Conservation Society), the organisation
    responsible for implementing Cyprus' national Sea Turtle Protection and Monitoring
    Programme, has begun using satellite telemetry to track the journeys of the island's
    sea turtles
- claim: The transmitters were fitted in June to one green and one loggerhead turtle
    nesting at Lara Bay, the first time on females nesting there.
  url: https://en.politis.com.cy/news/environment/1022677/researchers-track-cyprus-sea-turtles-across-mediterranean
  fetched: '2026-11-12'
  quote: this is the first time satellite transmitters have been fitted to female
    turtles nesting at Lara Bay
