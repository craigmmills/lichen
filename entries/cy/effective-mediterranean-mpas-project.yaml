summary: Horizon Europe project running from June 2023 to May 2027 to build guidance for managing Mediterranean
  blue natural capital, planning a digital twin tool and a Cape Greco sensor pilot.
facts:
- claim: Aims to build a scientific knowledge base and practical guidance for ecosystem-based management
    of the protection and restoration of the EU's Mediterranean blue natural capital.
  url: https://www.cmmi.blue/effective/
  fetched: '2026-11-08'
  quote: The EFFECTIVE main objective is to develop a comprehensive scientific knowledge base and practical
    guidance
- claim: Plans a digital twin tool for data visualisation and aggregation, for data exploration, research,
    participation and citizen science.
  url: https://www.cmmi.blue/effective/
  fetched: '2026-11-08'
  quote: To implement an innovative digital data visualization and aggregation tool in the form of a Digital
    Twin for enabling data exploration, research, participation and citizen science.
- claim: The Cape Greco pilot is to collect environmental data with sensors, used to characterise adjacent
    ecosystems and to train the project's ecological and predictive models.
  url: https://www.cmmi.blue/effective/
  fetched: '2026-11-08'
  quote: Such data will be used to characterise the environmental conditions of the adjacent ecosystems
    but also, to train the ecological/predictive models and algorithms of the proposed work.
- claim: Runs from 1 June 2023 to 31 May 2027 and is funded by the EU under Horizon Europe, grant 101112752.
  url: https://www.cmmi.blue/effective/
  fetched: '2026-11-08'
  quote: 'Funded by the European Union under the Horizon Europe Program, Grant No: 101112752.'
