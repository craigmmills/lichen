  url: https://en.herpatlas.cy/
  fetched: 2026-11-12
  quote: The Cyprus Atlas of Reptiles and Amphibians is the first attempt to collect
    and organize all existing data of the Cypriot herpetofauna.
- claim: Its data come from books, recording projects, Cypriot databases, volunteers,
    the public and social media.
  url: https://en.herpatlas.cy/
  fetched: 2026-11-12
  quote: The data of the Atlas has been collected from a variety of sources, including
    books, localities from reptile recording projects, existing Cypriot databases,
    information granted by volunteers and the general public as well as from social
    media.
