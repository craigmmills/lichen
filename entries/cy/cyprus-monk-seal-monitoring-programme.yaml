facts:
- claim: Cyprus Mail (21 March 2025) reports that since 2011 the programme has mapped and
    monitored all caves used by the species, with cameras installed in them.
  url: https://cyprus-mail.com/2025/03/21/cyprus-rare-monk-seals-make-a-comeback
  fetched: '2026-11-12'
  quote: Since 2011, the programme has mapped and monitored all caves used by the species
    for rest and reproduction. Cameras installed in these locations provide crucial insights.
- claim: Under the programme a national database tracks seal activity with information from
    fishers, the public and maritime professionals.
  url: https://cyprus-mail.com/2025/03/21/cyprus-rare-monk-seals-make-a-comeback
  fetched: '2026-11-12'
  quote: Under the monitoring programme, a national database has been established to track
    seal activity with information gathered from fishermen, the public and maritime professionals.
- claim: The article names Charalambos Nicolaou as head of the ministry's monk seal monitoring
    programme.
  url: https://cyprus-mail.com/2025/03/21/cyprus-rare-monk-seals-make-a-comeback
