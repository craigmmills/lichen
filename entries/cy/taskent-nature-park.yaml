summary: Nature park described by a minister in 2023 as a non-profit charitable institution,
  reported to have a Karpaz donkey protocol and host the Cyprus Marine Life Centre's
  turtle work.
facts:
- claim: In August 2023, Kıbrıs Postası reported minister Fikri Ataoğlu saying the
    Nature Park operated as a non-profit charitable institution for the public good.
  url: https://kibrispostasi.com/c140-DAILY_NEWS/n485174-ataoglu-taskent-nature-park-assumes-a-significant-mission-for-nature-environment-and-wildlife
  fetched: '2026-11-15'
  quote: Ataoğlu reminded that the Nature Park operates as a non-profit charitable
    institution for the public good.
- claim: The August 2023 report said the Nature Park had recently signed a protocol
    with the Environmental Protection Department on the wild donkeys of Karpaz, marking
    the start of scientific work on them.
  url: https://kibrispostasi.com/c140-DAILY_NEWS/n485174-ataoglu-taskent-nature-park-assumes-a-significant-mission-for-nature-environment-and-wildlife
  fetched: '2026-11-15'
  quote: the recent signing of a protocol between the Nature Park and the Environmental
    Protection Department concerning wild donkeys in Karpaz, which marked the beginning
    of scientific endeavors in this regard
- claim: BRTK reported in 2022 the minister saying the sea turtle protection project
    is carried out by the Cyprus Marine Life Centre, operating under the Taşkent Nature
    Park.
  url: https://arsiv2022.brtk.net/karpaz-and-karsiyaka-sea-turtles-project/?lang=en
  fetched: '2026-11-15'
  quote: the Protection of Sea Turtles Project which is being carried out by the Cyprus
    Marine Life Centre operating under the Taşkent Nature Park
- claim: The May 2022 BRTK report described planned monitoring and protection work
    on the Karpaz Peninsula sea turtles with international volunteers.
  url: https://arsiv2022.brtk.net/karpaz-and-karsiyaka-sea-turtles-project/?lang=en
  fetched: '2026-11-15'
  quote: the monitoring and protection work for the Karpaz Peninsula Sea Turtles which
    will be carried out with the participation of tens of international volunteers
- claim: A 2025 article on the Karpaz Bird Ringing Station in the Adıyaman University
    Journal of Science says the study was supported by the Cyprus Wildlife Research
    Institute, Taşkent Nature Park.
  url: https://dergipark.org.tr/en/pub/adyujsci/issue/91117/1633920
  fetched: '2026-11-15'
  quote: This study was supported by the Cyprus Wildlife Research Institute, Taşkent
    Nature Park.
