summary: Volunteer scheme run by BirdLife Cyprus, piloted in 2006, covering 70 to 100 one-kilometre squares,
  whose data supported 2013 Article 12 reporting and the Farmland Bird Index.
facts:
- claim: Began in 2006 as a pilot in which volunteers monitor randomly selected plots twice a year in
    the breeding season.
  url: https://birdlifecyprus.org/monitoring-birds/common-land-birds-in-cyprus/
  fetched: 2026-11-08
  quote: Since 2006, a pilot Common Birds Monitoring Scheme (CBMS) has collected information from volunteers
    who monitor randomly selected plots
- claim: Covers 70 to 100 one-kilometre squares across major habitats, including forests, scrub and farmland.
  url: https://birdlifecyprus.org/monitoring-birds/common-land-birds-in-cyprus/
  fetched: 2026-11-08
  quote: it now covers a representative sample of 70–100 1 km squares across the various major habitats
    across the island, including forests and different types of scrub and farmland
- claim: Collects data used to estimate bird densities in different habitats, and provided most of the
    data needed for Article 12 reporting at the end of 2013 and for the Farmland Bird Index for Cyprus.
  url: https://birdlifecyprus.org/monitoring-birds/common-land-birds-in-cyprus/
  fetched: 2026-11-08
  quote: This programme collects data used to estimate bird densities in different habitats
