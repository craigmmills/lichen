summary: Northern Cyprus turtle protection group that worked with EMU-SAGEM in summer 2025 to attach satellite
  transmitters to two released loggerhead turtles, one of which had been tagged before.
facts:
- claim: Carried out a study with EMU-SAGEM in summer 2025 in which satellite transmitters were attached
    to two loggerhead turtles released from the shores of northern Cyprus.
  url: https://news.emu.edu.tr/?p=6470
  fetched: 2026-11-08
  quote: Satellite transmitters were attached to two Caretta caretta turtles released into the sea from
    the shores of Northern Cyprus, allowing researchers to track their migration routes and feeding areas
    across the Mediterranean.
- claim: A member of its team found that a turtle due for a tracker had been tagged before.
