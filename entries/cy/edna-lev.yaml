summary: Project running December 2024 to November 2027 with 200,000 euros, aiming to compare coastal
  eDNA biodiversity assessments in Cyprus and Israel and establish a bioinvasion early warning system.
facts:
- claim: Aims to perform, compare and optimise biodiversity assessments in coastal benthic and pelagic
    communities in Cyprus and Israel.
  url: https://www.cmmi.blue/edna-lev/
  fetched: '2026-11-08'
  quote: The eDNALEV project aims to perform, compare, and optimize biodiversity assessments in coastal
    benthic and pelagic communities in Cyprus and Israel
- claim: eDNA is to be analysed seasonally from water, sediment and plankton samples in Cyprus and Israel.
  url: https://www.cmmi.blue/edna-lev/
  fetched: '2026-11-08'
  quote: eDNA will be analyzed seasonally from water, sediment, and plankton samples in pristine and impacted
    coastal sites in Cyprus and Israel
- claim: The results are to be used for regional biodiversity assessment protocols and an early warning
    system for bioinvasions.
  url: https://www.cmmi.blue/edna-lev/
