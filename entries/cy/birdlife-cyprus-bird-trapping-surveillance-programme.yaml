summary: Ongoing programme run by BirdLife Cyprus and built with the RSPB, visiting random 1 km² squares
  by day to detect mist netting across Larnaca and Famagusta.
facts:
- claim: Follows a Bird Trapping Monitoring Protocol developed by BirdLife Cyprus and the RSPB in consultation
    with the Cyprus Game and Fauna Service and the British Sovereign Base Area Police.
  url: https://birdlifecyprus.org/surveillance-programme
  fetched: 2026-11-08
  quote: The surveillance programme follows a ‘Bird Trapping Monitoring Protocol’ that was developed by
    BirdLife Cyprus and the RSPB, in consultation with the Cyprus Game & Fauna Service and the British
    Sovereign Base Area (SBA) Police at the start of the programme.
- claim: Monitoring visits a random selection of 1 km² sample squares in daytime, focusing on mist netting.
  url: https://birdlifecyprus.org/surveillance-programme
  fetched: 2026-11-08
  quote: The monitoring is undertaken by visiting a random selection of sample squares (1 km 2 ) during
    daytime hours, with a focus on detecting mist netting activity
- claim: Covers the Larnaca and Famagusta districts, including the Eastern Dhekelia Sovereign Base Area.
  url: https://birdlifecyprus.org/surveillance-programme
  fetched: 2026-11-08
  quote: The survey area covers the Larnaca and Famagusta districts, hotspots for bird trapping, including
    the Eastern Dhekelia Sovereign Base Area (SBA).
