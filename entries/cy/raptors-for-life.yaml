  quote: The Raptors for LIFE project, which is scheduled to officially begin in October
    2026 with 60% co-financing from the EU LIFE programme , is being implemented by
    BirdLife Cyprus as lead partner
- claim: Its listed actions include tagging and monitoring birds with GPS transmitters.
  url: https://en.politis.com.cy/news/environment/1025829/new-initiative-to-protect-cyprus-birds-of-prey
