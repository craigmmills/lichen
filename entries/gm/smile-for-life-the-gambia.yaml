summary: Describes itself as a community-based turtle conservation non-profit registered in 2011 and reports
  no nests or tracks at monitored sites from 1 June to 11 September 2022.
facts:
- claim: Describes itself as a community-based, non-governmental, non-profit organisation registered in
    2011, working on marine turtle conservation in The Gambia.
  url: https://www.my-gambia.com/mymagazine/the-concerning-report-for-last-two-turtle-nesting-seasons/
  fetched: 2026-11-12
  quote: Smile for Life is a community-based organisation registered in 2011. It is a non-profit, non-political,
    non-religious, non-governmental organisation with the mission to generate knowledge on the importance
    of marine turtle conservation
- claim: Says it monitored the nesting sites day and night from 1 June to 11 September 2022 and found
    no nests or tracks.
  url: https://www.my-gambia.com/mymagazine/the-concerning-report-for-last-two-turtle-nesting-seasons/
  fetched: 2026-11-12
  quote: This year starting from the 1st of June to the 11th of September 2022, we started monitoring
    the sites day and night. Not a single nest was found, nor was any turtle's track along the beaches
    or coastal communities seen.
- claim: Says it recorded two nests in Kartong and three in Sanyang in 2021, against a usual 30 to 50
    nests a year relocated to its hatchery.
  url: https://www.my-gambia.com/mymagazine/the-concerning-report-for-last-two-turtle-nesting-seasons/
  fetched: 2026-11-12
  quote: In a year, we normally record a minimum of 30-50 nest nests being relocated to the hatchery.
    Last year, we recorded two nests in Kartong and three in Sanyang.
- claim: In October 2022, My Gambia described it as based in Sanyang village, Kombo South, and running
    a bycatch programme with Sanyang fishermen.
  url: https://www.my-gambia.com/mymagazine/smile-for-life/
  fetched: 2026-11-12
  quote: Smile For Life The Gambia, based in Sanyang village Kombo South District is running a bycatch
    program with the fishermen of Sanyang.
- claim: The Point reports that the GEF 6 Land/Seascape Planning and Ecosystems Restoration Project under
    the National Environment Agency gave it conservation materials worth D257,000 in April 2024.
  url: https://thepoint.gm/africa/gambia/national-news/gef-6-project-assists-smile-for-life-with-over-d200000-materials
  fetched: 2026-11-12
  quote: GEF (6) Land/Seascape Planning and Ecosystems Restoration Project under the National Environment
    Agency (NEA) on Wednesday 3rd April 2024 assisted Smile for Life Organisation - The Gambia with conservation
    materials worth D257, 000.00.
- claim: In October 2020, Daily Sabah reported that Turkey's aid agency TIKA had built two turtle hatcheries
    for the group in Sanyang.
  url: https://dailysabah.com/turkey/turkeys-aid-agency-helps-turtle-conservation-in-gambia/news
  fetched: 2026-11-12
  quote: TIKA has built two standard hatcheries for us,
links:
