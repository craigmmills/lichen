summary: Department run by the environment ministry, with a mandate over eight reserves and national parks
  and 14 community-based conservation areas, according to the CBD country profile.
facts:
- claim: The CBD lists Kawsu Jammeh of the department as The Gambia's CBD primary, clearing-house, SBSTTA
    and protected-areas national focal point.
  url: https://www.cbd.int/kb/record/focalPoint/7435?Country=gm
  fetched: 2026-11-12
  quote: Mr. Kawsu Jammeh Department of Parks & Wildlife Management c/o Ministry of Environment, Climate
    Change and Natural Resources GIEPA House, Kairaba Avenue Banjul Gambia CBD Primary NFP, CHM NFP, SBSTTA
    NFP, Protected Areas NFP
- claim: The CBD country profile says eight reserves and national parks and 14 community-based conservation
    areas are under the department's mandate.
  url: https://www.cbd.int/countries/profile/?country=gm
  fetched: 2026-11-12
  quote: Eight of these Protected Areas are reserves and national parks while 14 are community based conservation
    areas under the mandate of the Department of Parks and Wildlife (DPWM).
- claim: The ministry says the department, named so in 1994, is accountable for the management, administration
    and development of the Gambia's seven protected areas.
  url: https://meccnar.gov.gm/node/181
  fetched: 2026-11-12
  quote: The name of the Department was changed in 1994 to the Department of Parks & Wildlife Management
    to reflect its widening role into wildlife management as well as conservation. As well as being accountable
    for the management, administration and development of the Gambia's seven Protected Areas,
- claim: The Standard reported in January 2017 that the department had begun a national waterbird census.
  url: https://standard.gm/parks-wildlife-begins-national-water-bird-census
  fetched: 2026-11-12
  quote: Parks & Wildlife Begins National Water Bird Census
- claim: The Gambia chapter of the 2023 East Atlantic Flyway national census reports lists department
    staff from its headquarters and parks among the observers.
  url: https://www.waddensea-worldheritage.org/sites/default/files/2024_Flyway%20national%20census%202023%20reports_2.pdf
  fetched: 2026-11-12
  quote: Sainabou Jallow (DPWM HQ), Nuha Jammeh
