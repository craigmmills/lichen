summary: Government forestry body in The Gambia, run by the environment ministry, which FAO reported in
  July 2025 was leading preparation of the next national forest inventory with FAO support.
facts:
- claim: The ministry describes it as the government institution in charge of forestry administration
    and the sustainable management, use and protection of forest resources in The Gambia, excluding private
    natural forests and plantations.
  url: https://meccnar.gov.gm/forestry
  fetched: 2026-11-12
  quote: The Department of Forestry is the responsible government institution under the purview of the
    Ministry of Environment, Climate Change and Natural Resources (MECCNAR) in charge of forestry administration
- claim: In July 2025, FAO reported that the department was leading preparation of the next national forest
    inventory, with FAO support.
  url: https://www.fao.org/in-action/openforis/news-and-events/news/news-detail/gambia-s-national-forest-inventory-goes-digital-and-more-precise-with-open-foris-solutions/en
  fetched: 2026-11-12
  quote: Led by the Gambia's Department of Forestry and supported by the Food and Agriculture Organization
    of the United Nations (FAO), the country is preparing for the next National Forest Inventory (NFI)
- claim: The CBD country profile says 66 forest reserves covering 34,029 hectares are managed by the department.
  url: https://www.cbd.int/countries/profile/?country=gm
  fetched: 2026-11-12
  quote: There are 66 forest reserves covering a total of 34,029 hectares managed by the Department of
    Forestry.
- claim: In July 2025, The Point reported that the department had held a five-day GIS mapping training
    for technical staff and environmental stakeholders on GIS and remote sensing for natural resource
    monitoring, through the MRV Pilot project.
  url: https://thepoint.gm/africa/gambia/national-news/forestry-dept-trains-technical-environmental-experts-on-gis-mapping
  fetched: 2026-11-12
  quote: the objective of the GIS Mapping training is to build the capacity of the Forestry and other
    environmental stakeholders in the use and application of Geographical Information Systems and Remote
    Sensing technologies to monitor the status of the country's natural resource sector.
