summary: Reported by The Point in December 2021 as nearing completion, the project
  collected River Gambia biodiversity data and, according to GREAT’s director, involved
  school students in citizen science.
facts:
- claim: The Point reported in December 2021 that GREAT, an institute, was spearheading
    the environmental monitoring project GEMS and that the project was coming to an
    end in December 2021.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: Gaining Research Experience in Africa for Tomorrow (GREAT), an institute
    that is spearheading an environmental monitoring project dubbed- The Gambia Environmental
    Monitoring Systems (GEMS)
- claim: The Point says GEMS collected environmental and biodiversity data along the
    River Gambia.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: GEMS collect environmental and biodiversity data along The River Gambia to
    support research, conservation, record, monitor climate data.
- claim: GREAT's director told The Point the data collected covered aquatic, terrestrial
    and mangrove ecosystems and biodiversity.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: Ms Maiyai explained that the data collected are aquatic, terrestrial, mangrove
    ecosystems, and biodiversity.
- claim: GREAT's director told The Point that data collection would continue after
    the project's funding ended in December 2021.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: Though the funding for the GEMS project will end December but the data collection
    will still continue
- claim: GREAT's director said the project had created a citizen science programme
    collecting data in six regions along the River Gambia.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: they’ve created the first citizens science program in The Gambia, which she
    said, is getting people to participate in collecting scientific data along the
    six (6) regions across The River Gambia.
- claim: GREAT's director said the citizen scientists were high school students.
  url: https://thepoint.gm/africa/gambia/national-news/gems-project-to-phase-out-in-december
  fetched: 2026-11-15
  quote: These citizen scientists, she added, were high school students.
