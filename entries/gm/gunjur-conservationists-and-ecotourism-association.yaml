summary: A community organisation formed by 2021 to unite Gunjur's local conservation
  groups; in August 2026 its Turtle Committee head reported over 50 volunteers, and
  members found the first green turtle nest of the 2026 season.
facts:
- claim: Gunjur Online described it in January 2021 as a newly formed community based
    organisation bringing local environmental and conservationist groups in Gunjur
    under one umbrella.
  url: https://www.gunjuronline.com/post/red-star-company-gives-tech-assistance-to-gunjur-conservation-and-ecotourism-association
  fetched: 2026-11-13
  quote: GUNJUR CONSERVATIONIST AND ECOTOURISM ASSOCIATION (CETAG) is a newly formed
    community based organisation that aims o bring all local environmental and conservationist
    groups in Gunjur under one umbrella.
- claim: In August 2026 the head of its Turtle Committee told The Point it has more
    than 50 volunteers in conservation work, including turtle monitoring and beach
    patrols.
  url: https://thepoint.gm/africa/gambia/headlines/conservationists-others-push-to-end-gunjurs-ghost-net-waste-crisis
  fetched: 2026-11-13
  quote: He said CETAG has more than 50 volunteers involved in conservation activities,
    including turtle monitoring and beach patrols.
- claim: Gunjur Online reported that its members found the first green turtle nest
    of the 2026 season on a routine patrol on 23 July, and that the site was placed
    under close monitoring.
  url: https://www.gunjuronline.com/post/a403c2d3
  fetched: 2026-11-13
  quote: The nest, laid by a Green Turtle, was discovered during a routine patrol
    by members of the Gunjur Conservationists and Eco-Tourism Association (CETAG)
    on Thursday, 23 July.
- claim: Columbia University's undergraduate global engagement programme lists it
    as the partner NGO for a summer 2024 project that built a monitoring spreadsheet
    for its turtle hatchery.
  url: https://global.undergrad.columbia.edu/node/5403
  fetched: 2026-11-13
  quote: Students partners with CETAG to create monitoring spreadsheet organizational
    tool for their turtle hatchery.
