summary: Forest inventory being prepared in 2025, led by the Department of Forestry with FAO, using satellite
  imagery, Collect Earth Online and Open Foris tools; field deployment had not yet begun in July 2025.
facts:
- claim: In July 2025, FAO said the inventory being prepared built on the 2008 to 2010 forest assessment,
    with a streamlined design using satellite imagery and digital tools.
  url: https://www.fao.org/in-action/openforis/news-and-events/news/news-detail/gambia-s-national-forest-inventory-goes-digital-and-more-precise-with-open-foris-solutions/en
  fetched: 2026-11-12
  quote: This inventory builds on the previous forest assessment conducted fifteen years ago (2008-2010)
    but introduces a streamlined design that maintains comparability while introducing efficiency through
    satellite imagery and digital solutions.
- claim: In July 2025, FAO reported that technicians had used Collect Earth Online to pre-identify forest
    and non-forest areas before field work.
  url: https://www.fao.org/in-action/openforis/news-and-events/news/news-detail/gambia-s-national-forest-inventory-goes-digital-and-more-precise-with-open-foris-solutions/en
  fetched: 2026-11-12
  quote: Before heading to the field, technicians used CEO to pre-identify forest and non-forest areas,
    helping to optimize sampling and reduce operational costs.
- claim: In July 2025, FAO reported that field teams were preparing to collect and submit data with the
    Arena Mobile app, part of Open Foris; field deployment had not yet begun.
  url: https://www.fao.org/in-action/openforis/news-and-events/news/news-detail/gambia-s-national-forest-inventory-goes-digital-and-more-precise-with-open-foris-solutions/en
  fetched: 2026-11-12
  quote: using the Arena Mobile app, part of the Open Foris suite of solutions, to collect, validate,
    and submit forest data digitally and in real time
