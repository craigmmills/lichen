summary: A GEF-funded project run by the Department of Parks and Wildlife Management
  to conserve coastal, marine and wetland biodiversity, closed on 1 September 2008;
  a 2009 official said its second phase would expand the marine species monitoring
  system.
facts:
- claim: The GEF describes the project's goal as conserving and sustainably managing
    globally significant biodiversity in coastal, marine and wetland ecosystems in
    The Gambia, with identified sites named as Tambi, Bao Bolong and Niumi wetlands
    on the page.
  url: https://thegef.org/projects-operations/projects/1067
  fetched: 2026-11-13
  quote: Identified sites are the Tambi, Bao Bolong and Niumi wetlands, The goal of
    the project is to conserve and sustainably manage globally significant biodiversity
    in coastal, marine and wetland ecosystems in Gambia.
- claim: The GEF lists it as completed, closed on 1 September 2008.
  url: https://thegef.org/projects-operations/projects/1067
  fetched: 2026-11-13
  quote: Project Closed 01 Sep 2008
- claim: In 2009 the deputy director of DPWM said the second phase aimed to expand
    the marine species monitoring system achieved under ICAM.
