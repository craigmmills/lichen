id: gef-6-land-seascape-planning-and-restoration-project-gambia
kind: project
name: Landscape Planning and Restoration to Improve Ecosystem Services, and Livelihoods,
  Expand and Effectively Manage Protected Areas (GEF-6 Land/Seascape project, The
  Gambia)
also_known_as:
- GEF-6 Land/Seascape Planning and Ecosystem Restoration Project
- GEF 9772
scope: gm
ai_label: conservation-tech
realms:
- land
- ocean
countries:
- gm
status: active
summary: An active GEF-funded project run by the National Environment Agency, approved
  in March 2020, which in July 2026 handed surveillance equipment, including binoculars,
  cameras and telescopes, to 35 trained officers for monitoring Indigenous and Community
  Conserved Areas.
facts:
- claim: The GEF describes its objective as conserving ecosystem services in productive
    and protected land and seascapes through improved land use and marine spatial
    planning in The Gambia.
  url: https://www.thegef.org/projects-operations/projects/9772
  fetched: 2026-11-13
  quote: Ecosystem services in productive and protected land/seascapes conserved by
    improved land use and marine spatial planning policies and land/seascape level
    management in Gambia.
- claim: The GEF page records approval for implementation on 28 March 2020.
  url: https://www.thegef.org/projects-operations/projects/9772
  fetched: 2026-11-13
  quote: Project Approved for Implementation 28 Mar 2020
- claim: In July 2026 the project's surveillance equipment was handed to 35 trained
    surveillance officers to enhance monitoring and law enforcement in Indigenous
    and Community Conserved Areas.
  url: https://thepoint.gm/africa/gambia/headlines/nea-receives-d5-8m-surveillance-items-to-boost-community-conservation
  fetched: 2026-11-13
  quote: A total of 35 trained surveillance officers received motorcycles, uniforms
    and field gear to enhance monitoring and law enforcement in Indigenous and Community
    Conserved Areas, ICCAs.
- claim: The items included binoculars, digital cameras, telescopes and field guidebooks
    on birds, trees and mammals.
  url: https://thepoint.gm/africa/gambia/headlines/nea-receives-d5-8m-surveillance-items-to-boost-community-conservation
  fetched: 2026-11-13
  quote: 10 binoculars, 4 digital cameras and telescopes, 23 field guidebooks on birds,
    trees and mammals
- claim: The environment minister said the equipment would improve patrols, data collection
    and response to illegal activities.
  url: https://thepoint.gm/africa/gambia/headlines/nea-receives-d5-8m-surveillance-items-to-boost-community-conservation
  fetched: 2026-11-13
  quote: The Minister noted that the motorcycles and monitoring equipment will improve
    patrols, data collection and response to illegal activities.
