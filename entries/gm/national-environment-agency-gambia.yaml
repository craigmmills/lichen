facts:
- claim: The environment ministry names it as one of the line agencies and departments
    that support the ministry.
  url: https://meccnar.gov.gm/mandate
  fetched: 2026-11-13
  quote: MECCNAR is supported by line agencies and departments which includes the
    Department of Forestry(DOF) the Department of Parks and Wildlife(DPWM) and the
    National Environment Agency(NEA).
- claim: The Point reported in July 2026 that the GEF-6 project it implements gave
    35 trained surveillance officers motorcycles and field gear to enhance monitoring
    and law enforcement in Indigenous and Community Conserved Areas.
  url: https://thepoint.gm/africa/gambia/headlines/nea-receives-d5-8m-surveillance-items-to-boost-community-conservation
  fetched: 2026-11-13
  quote: A total of 35 trained surveillance officers received motorcycles, uniforms
    and field gear to enhance monitoring and law enforcement in Indigenous and Community
    Conserved Areas, ICCAs.
- claim: The GEF lists NEA as executing agency of project 9772, calling it National
    Environment Authority rather than National Environment Agency.
  url: https://www.thegef.org/projects-operations/projects/9772
  fetched: 2026-11-13
  quote: National Environment Authority (NEA)
- claim: A 2019 UN Statistics Division workshop report says an NEA officer presented
    his office's work on Geographic Information Systems.
  url: https://unstats.un.org/unsd/envstats/meetings/2019-Gambia/documents/Final%20report.pdf
  fetched: 2026-11-13
  quote: Mr. Lamin Jawneh of the NEA presented on h is office’s work on Geographic  Information
- claim: That 2019 presentation lists the GIS and Environmental Information System
    unit's tasks, including updating land use and land cover maps.
  url: https://unstats.un.org/unsd/envstats/meetings/2019-Gambia/documents/Tech%20training%201.1%20NEA%20GIS%20work%20in%20Gambia.pdf
  fetched: 2026-11-13
  quote: To update current land use /land cover maps.
