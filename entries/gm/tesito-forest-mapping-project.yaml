summary: According to Dodo, this active project aims to map forests interactively
  in Gambia, Senegal and Guinea-Bissau, with Gambian officials learning GRASS GIS
  and receiving QGIS training in 2025.
facts:
- claim: Dodo says the project aims to enhance forest conservation in Gambia, Senegal
    and Guinea-Bissau by developing an interactive forest map.
  url: https://dodo.org/en/gambia-tesito/
  fetched: 2026-11-13
  quote: Dodo’s Tesito project, funded by the Ministry for Foreign Affairs, aims to
    enhance forest conservation in Gambia, Senegal and Guinea-Bissau through developing
    an interactive forest map.
- claim: For the 2023–2026 project, Dodo says all planned activities are implemented
    with its local partner NGO Freedom from Hunger Campaign.
  url: https://dodo.org/en/gambia-tesito/
  fetched: 2026-11-13
  quote: All planned activities are implemented in cooperation with Dodo’s local partner
    NGO Freedom from Hunger Campaign.
- claim: For the 2021–2022 project, Dodo said one main goal was to train officials,
    NGOs and community representatives to use the forest monitoring tool, with the
    aim of providing an interactive map of all forest areas in Gambia.
  url: https://dodo.org/en/gambia-tesito/
  fetched: 2026-11-13
  quote: One of the main goals is to train local environmental officials, NGOs and
    community representatives to use the forest monitoring tool, with the aim of providing
    an interactive map covering all forest areas in Gambia to enhance forest protection.
- claim: Dodo says the forest mapping and monitoring method was originally developed
    for Madagascar by the Finnish Association for Nature Conservation.
  url: https://dodo.org/en/gambia-tesito/
  fetched: 2026-11-13
  quote: apply the forest mapping and monitoring method, that was originally developed
    for Madagascar by FANC (The Finnish Association for Nature Conservation)
- claim: Dodo says participants from the Gambian Forestry Department are learning
    to prepare data for segmentation in GRASS GIS and apply forest monitoring methods.
  url: https://dodo.org/en/gambia-tesito/
  fetched: 2026-11-13
  quote: Participants from Forestry Department of Gambia are learning to prepare data
    for segmentation using GRASS GIS, explore global datasets for forest monitoring,
    apply forest monitoring methods and improve mapping workflows
- claim: In a March 2026 report on the project's annual network meeting, Dodo says
    the principal of Kafuta Forest School presented its interactive forest map.
  url: https://dodo.org/en/2026/03/29/tesitos-network-meeting-building-collaboration-for-forest-protection/
  fetched: 2026-11-13
  quote: A central part of the meeting was the presentation of Tesito’s interactive
    forest map.
- claim: In 2025 Manondroala Madagascar trained Gambian officials online in QGIS for
    forest monitoring, including tree-cover change and forest-loss layers and satellite
    fire alerts.
  url: https://dodo.org/en/2025/11/24/manondroalas-2025-gis-and-remote-sensing-training/
  fetched: 2026-11-13
  quote: Participants worked through the core steps of importing and organizing spatial
    data, visualizing tree-cover change and forest-loss layers, interpreting satellite-based
    fire alerts
