summary: A Beirut university that was grantee of a CEPF-funded 2018-2021 botanical
  project ($111,990.72), which gathered population data on 16 target plant species,
  and that led a project creating a DNA marker reference library, according to Jouzour
  Loubnan.
facts:
- claim: CEPF's final report on the 2018-2021 grant "Conserving and valorizing the
    Unique Botanical Heritage of Lebanon" (CEPF-108497, $111,990.72) names Université
    Saint-Joseph as the grantee.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2532
  fetched: 2026-11-15
  quote: 'Grant Number:  CEPF-108497'
- claim: The report says information on the population size and status of 16 target
    species in different protected areas was gathered and analysed.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2532
  fetched: 2026-11-15
  quote: Information regarding the population size and status of 16 target species
    in different protected areas were gathered and analyzed.
- claim: The field data recorded the number of individuals, mature and juvenile plants
    and the share flowering and fruiting in each population.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2532
  fetched: 2026-11-15
  quote: This information targeted the number of individual in each population, the
    number of mature and juvenile individuals
- claim: Jouzour Loubnan says a project led by Saint Joseph University of Beirut,
    with Jouzour Loubnan members and the Smithsonian, created the first reference
    library of standard DNA markers for mammals and plants of the eastern Mediterranean
    region.
  url: https://jouzourloubnan.org/our-science-articles/2021/1/16/species-identification-through-dna-barcodes
  fetched: 2026-11-15
  quote: we created the first reference library of standard DNA markers for mammals
    and plants in the EMR
