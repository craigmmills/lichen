  a Ministry of Environment and UNOPS agreement signed on 13 May 2025.
facts:
- claim: The UN in Lebanon says the Ministry of Environment and UNOPS signed an agreement under the project
    on 13 May 2025, to help Lebanon manage forest fire risks and fold them into forest landscape management.
  url: https://lebanon.un.org/en/294599-unops-support-lebanon%E2%80%99s-ministry-environment-reducing-wildfire-risks-and-improving-forest
  fetched: 2026-11-09
  quote: The Ministry of Environment (MoE) in Lebanon and UNOPS signed today an agreement under the “
    Community-based Wildfire Risk Management in Lebanon’s Vulnerable Landscapes ” project
- claim: Financed by a US$3.48 million GEF grant, approved in October 2024 and administered by the World
    Bank.
  url: https://lebanon.un.org/en/294599-unops-support-lebanon%E2%80%99s-ministry-environment-reducing-wildfire-risks-and-improving-forest
  fetched: 2026-11-09
  quote: The project, financed by a US$3.48 million grant from the Global Environment Facility (GEF) and
    approved in October 2024, is administered by the World Bank.
- claim: Includes technical assistance for biodiversity assessments and forest and wildfire management
    plans, and equipment and communication systems for early warning.
  url: https://lebanon.un.org/en/294599-unops-support-lebanon%E2%80%99s-ministry-environment-reducing-wildfire-risks-and-improving-forest
  fetched: 2026-11-09
  quote: technical assistance will be provided to conduct biodiversity assessments, develop forest and
    wildfire management plans, and support sustainable forest practices
