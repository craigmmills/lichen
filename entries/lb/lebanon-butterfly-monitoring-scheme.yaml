summary: A butterfly monitoring programme run by the Society for the Protection of Nature
  in Lebanon, founded in 2018 by Husein Zorkot, using fixed-route transect counts by students
  and volunteers, with results to be published in an atlas.
facts:
- claim: The scheme was founded in the early summer of 2018 by Husein Zorkot.
  url: https://butterflies.spnl.org/lbms/
  fetched: 2026-11-15
  quote: The Lebanon Butterfly Monitoring Scheme (LBMS) was founded in the early summer of
    2018 by Husein Zorkot.
- claim: The page describes it as the first butterfly monitoring programme in Lebanon, intended
    to run long-term biomonitoring of butterflies and other insects in all nature reserves
    and hima locations.
  url: https://butterflies.spnl.org/lbms/
  fetched: 2026-11-15
  quote: The LBMS is the first butterfly monitoring program in the country that will conduct
    long-term biomonitoring studies, monitor butterflies and other insects in all nature reserves
    and hima locations
- claim: Its method is fixed-route transect butterfly counts, with recording forms and field
    instructions for students and volunteers.
  url: https://butterflies.spnl.org/lbms/
  fetched: 2026-11-15
  quote: Fixed-Route Transect Butterfly Counts
- claim: The page says annual results are to be published on the site as part of the Atlas
    of Lebanese Butterflies.
  url: https://butterflies.spnl.org/lbms/
  fetched: 2026-11-15
  quote: Annual results of biomonitoring studies will be published regularly on this website,
    as part of the Atlas of Lebanese Butterflies
- claim: The Atlas of Lebanese Butterflies page, the scheme's main publication, says numerous
    monitoring stations covering all biomes and habitats are in place around Lebanon.
  url: https://butterflies.spnl.org/atlas/
  fetched: 2026-11-15
  quote: Numerous monitoring stations representing all biomes and habitats are now in place
    around Lebanon
