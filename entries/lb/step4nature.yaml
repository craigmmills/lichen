summary: Project run by UNDP and funded by the Italian Agency for Development Cooperation,
  credited in a 2026 paper with contributing to field surveys for the 2023-2024 mammal
  survey across 17 Lebanese nature reserves.
facts:
- claim: A 2026 paper credits the project with contributing to the field surveys of
    the first nationwide mammal survey of Lebanon's nature reserves.
  url: https://www.cambridge.org/core/journals/environmental-conservation/article/protected-areas-habitat-integrity-and-terrestrial-mammal-biodiversity-in-lebanon/2BA511EF5D0F1849914FFB1B7AD27682
  fetched: 2026-11-12
  quote: We acknowledge the United Nations Development Programme (UNDP) ‘STEPping
    up Nature Reserves Capacity – STEP4Nature’ project implemented in coordination
    with the Ministry of Environment of Lebanon for contributing to the field surveys.
- claim: The mammal survey ran in 2023–2024 across 17 nature reserves, using camera
    traps and line transects; both methods were implemented in 10 reserves, with only
    line transects in the others.
  url: https://www.cambridge.org/core/journals/environmental-conservation/article/protected-areas-habitat-integrity-and-terrestrial-mammal-biodiversity-in-lebanon/2BA511EF5D0F1849914FFB1B7AD27682
  fetched: 2026-11-12
  quote: As a result, full implementation of both methodologies was possible in 10
    NRs, whereas in others only line transect surveys were conducted; Nmairieh NR
    could not be surveyed at all.
- claim: Under the project the Ministry of Environment and UNDP launched the Survey
    of Protected Areas in Lebanon in March 2023, mapping 98 protected sites.
  url: https://www.lbcgroup.tv/news/variety/692397/lebanon-hosts-98-protected-areas-representing-more-than-20-of-its-area/en
  fetched: 2026-11-12
  quote: Lebanon's Ministry of Environment, in cooperation with the United Nations
    Development Programme (UNDP), launched the "Survey of Protected Areas in Lebanon,"
    presenting, for the first time, the number and area of protected areas in Lebanon
    in addition to maps defining 98 protected sites
