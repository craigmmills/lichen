summary: EU-funded programme launched in February 2022 and run over 45 months by four Lebanese organisations,
  combining biodiversity monitoring with agriculture, education and policy work, and reported by SPNL
  as formally concluded.
facts:
- claim: Launched in February 2022, funded by the European Union and carried out over 45 months by a consortium
    of four Lebanese organisations.
  url: https://www.spnl.org/bioconnect-programme-concludes-leaving-a-lasting-legacy-for-biodiversity-conservation-in-lebanon/
  fetched: '2026-11-09'
  quote: Launched in February 2022 and funded by the European Union, BioConnect was a 45-month conservation
    programme implemented by a consortium of four Lebanese organizations
- claim: Combined scientific biodiversity monitoring with sustainable agriculture, environmental education,
    ecotourism, adaptation and policy work.
  url: https://www.spnl.org/bioconnect-programme-concludes-leaving-a-lasting-legacy-for-biodiversity-conservation-in-lebanon/
  fetched: '2026-11-09'
  quote: The programme combined scientific biodiversity monitoring, sustainable agriculture, environmental
    education, ecotourism development, climate change adaptation, and policy advocacy
- claim: SPNL says it strengthened biodiversity monitoring across several regions of Lebanon.
  url: https://www.spnl.org/bioconnect-programme-concludes-leaving-a-lasting-legacy-for-biodiversity-conservation-in-lebanon/
  fetched: '2026-11-09'
  quote: BioConnect strengthened biodiversity monitoring across multiple regions of Lebanon
- claim: A 2025 overview says the National Council for Scientific Research of Lebanon would present findings
    from identifying and mapping potential OECM and protected-area sites, and that ACS planned to map
    ecological corridors into a geodatabase using GIS modelling.
  url: https://www.spnl.org/wp-content/uploads/2025/04/BioConnect-overview-2025.pdf
  fetched: '2026-11-09'
  quote: a standardized geodatabase will be created to develop detailed maps of ecological corridors.
- claim: SPNL reports that the programme has formally concluded.
  url: https://www.spnl.org/bioconnect-programme-concludes-leaving-a-lasting-legacy-for-biodiversity-conservation-in-lebanon/
  fetched: '2026-11-09'
  quote: Although BioConnect has formally concluded
