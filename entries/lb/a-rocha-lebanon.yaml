summary: Founded in Lebanon in 1996 and based at Meksé Nature Park, it reports biodiversity research and
  monitoring; MAVA lists it among funding recipients between 1994 and 2022.
facts:
- claim: Says its research since 1996 has included short and long-term projects and an ongoing monitoring
    programme in the West Bekaa.
  url: https://lebanon.arocha.org/home/conservation-2/previous-project-scientific-studies/
  fetched: 2026-11-09
  quote: Research has been conducted in the form of preliminary studies, short- and long-term projects
    and an ongoing monitoring program.
- claim: Lists a 2023 survey for the endangered Hula painted frog among its studies.
  url: https://lebanon.arocha.org/home/conservation-2/previous-project-scientific-studies/
  fetched: 2026-11-09
  quote: a survey to recover the presence of the endangered species Hula painted frog (spring 2023)
- claim: Says it surveyed birdlife and general biodiversity with SPNL at about 40 sites across Lebanon
    between 2005 and 2008 to identify Important Bird Areas.
  url: https://lebanon.arocha.org/home/conservation-2/previous-project-scientific-studies/
  fetched: 2026-11-09
  quote: Together A Rocha and SPNL surveyed birdlife and general biodiversity at approximately 40 sites
    around the country between 2005 and 2008
- claim: Founded in Lebanon in 1996.
  url: https://lebanon.arocha.org/home/about-us/
  fetched: '2026-11-09'
  quote: In Lebanon, A Rocha was founded in 1996 through the efforts of Chris and Susana Naylor and British
    theologian John Stott.
- claim: Its contact page gives its address as Meksé Nature Park in the West Bekaa.
  url: https://lebanon.arocha.org/home/get-involved/contact-us/
  fetched: '2026-11-09'
  quote: Meksé Nature Park – West Bekaa
- claim: Members of the support committees formed at the Important Bird Areas were trained in bird identification
