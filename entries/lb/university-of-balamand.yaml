facts:
- claim: Its Institute of the Environment lists a 2013–2014 project whose objective was to produce fire
    management maps for the FireWise website application in Lebanon.
  url: https://www.balamand.edu.lb/IOE/OurProjects/Details/Pages/LNR/AdvancingForest.aspx
  fetched: 2026-11-09
  quote: Produce fire management maps for use in a website application (FireWise) which can be employed
    by various stakeholders for improved forest fire management in Lebanon.
