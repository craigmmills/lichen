summary: NatureMetrics describes a reforestation programme established in 2011 with USAID funding and
  a partnered pilot survey detecting 63 vertebrate taxa; GBIF records habitat monitoring and published
  occurrence datasets.
facts:
- claim: GBIF's publisher record says its research and development unit produces baseline assessments
    and monitors species occurrences in restored habitats.
  url: https://api.gbif.org/v1/organization?country=LB&limit=20
  fetched: 2026-11-09
  quote: LRI contributes to this mission through its Research and Development (R&D) unit, which generates
    critical baseline assessments and monitors species occurrences
- claim: GBIF's publisher record gives an address in Jdeideh, Lebanon.
  url: https://api.gbif.org/v1/organization?country=LB&limit=20
  fetched: 2026-11-09
  quote: '"city":"Jdeideh","country":"LB"'
- claim: A NatureMetrics case study says a pilot aquatic eDNA survey with LRI detected 63 vertebrate taxa
    from 20 water samples, and that LRI plans to scale eDNA monitoring across Lebanon.
  url: https://www.naturemetrics.com/case-study/lebanon-reforestation-initiative
  fetched: 2026-11-09
  quote: A pilot aquatic eDNA survey of 20 samples detected 63 vertebrate taxa, including a Near Threatened
    salamander. Following its success, LRI now plans to scale eDNA monitoring across Lebanon.
- claim: The same case study says LRI was set up in 2011, implemented by the US Forest Service and funded
    by USAID.
  url: https://www.naturemetrics.com/case-study/lebanon-reforestation-initiative
  fetched: 2026-11-09
  quote: Set up in 2011, implemented by the US Forest Service and funded by USAID
- claim: Touch, a Lebanese mobile operator, says LRI's 2024 fire prevention campaign promoted the Fire
    Patrol App, which incorporates the University of Balamand's Fire Lab early warning index.
  url: https://touch.com.lb/en/corporate-sustainability/10/1024?page=0
  fetched: 2026-11-09
  quote: A significant feature of this year’s campaign is the promotion of the Fire Patrol App, that incorporates
    the Fire Lab early warning index developed by the University of Balamand (UOB) to predict fire risk
    on local level with 1 week ahead.
