summary: Lebanese NGO registered in May 2019 for bird and habitat conservation, whose
  specialists participated in the 2023–2024 nationwide mammal survey of Lebanon’s
  nature reserves.
facts:
- claim: Registered as an NGO in May 2019, for the conservation of birds and their
    habitats.
  url: https://osme.org/2022/02/a-future-for-birds-in-lebanon/
  fetched: 2026-11-12
  quote: In May 2019 the association was registered as an official NGO, dedicated
    to the conservation of birds and their habitats through education, awareness,
    advocacy, outreach activities and stewardship.
- claim: With Lebanon Birdwatching Tours it set up a bird migration observation point
    in Horsh Ehden Nature Reserve in autumn 2020, then ran the month-long Ehden Raptor
    Count in autumn 2021 with a Global Greengrants Fund grant.
  url: https://osme.org/2022/02/a-future-for-birds-in-lebanon/
  fetched: 2026-11-12
  quote: ABCL was able to secure a fund from Global Greengrants Fund and launched
    in the fall of 2021, the Ehden Raptor Count that lasted a full month.
- claim: Its specialists took part, with IndyACT, the University of Balamand and Istituto
    Oikos, in the first nationwide mammal survey of Lebanon's nature reserves in 2023-2024,
    using camera traps and line transects.
  url: https://www.cambridge.org/core/journals/environmental-conservation/article/protected-areas-habitat-integrity-and-terrestrial-mammal-biodiversity-in-lebanon/2BA511EF5D0F1849914FFB1B7AD27682
  fetched: 2026-11-12
  quote: This work was made possible thanks to the collaboration of several key specialists
    within JV IndyACT (The League of Independent Activists) in association with the
    Association for Bird Conservation in Lebanon (ABCL), the University of Balamand
    (UOB) and Istituto Oikos ETS.
- claim: In June 2021, ABCL was conducting a national population count of the globally
    vulnerable Syrian serin using point counts, funded by the Trevor Poyser Species
    Conservation Fund.
  url: https://www.spnl.org/breeding-survey-of-the-syrian-serin-in-lebanon/
  fetched: 2026-11-12
  quote: This is the first time a national count-study of the Globally Vulnerable
    Syrian Serin, according to the IUCN Red List, has been undertaken in Lebanon.
