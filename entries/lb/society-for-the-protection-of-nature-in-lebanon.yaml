facts:
- claim: Ran bird monitoring field surveys across Lebanon between January and February 2025, using transects
    and point counts at reserves, riverbanks, estuaries and Hima sites.
  url: https://www.spnl.org/bridging-science-and-conservation-a-month-of-bird-monitoring-success/
  fetched: 2026-11-09
  quote: One of the core activities undertaken this month was bird monitoring across multiple ecological
    zones, including natural reserves, riverbanks, estuaries, and designated Hima sites.
- claim: Its bird monitor submitted 33 reports to eBird during these field visits.
  url: https://www.spnl.org/bridging-science-and-conservation-a-month-of-bird-monitoring-success/
