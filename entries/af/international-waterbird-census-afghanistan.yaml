summary: An active counting programme in which Afghanistan rejoined the International
  Waterbird Census in January 2026, with counts at six sites along the Kabul River
  and Amu Darya floodplains recording wintering waterbirds and habitat conditions.
facts:
- claim: Wetlands International says Afghanistan rejoined the International Waterbird
    Census counts in January 2026.
  url: https://www.wetlands.org/?p=14332
  fetched: 2026-11-13
  quote: In January 2026, for the first time in decades, Afghanistan rejoined the
    IWC counts.
- claim: In January 2026, the counts covered six sites along the Kabul River and the
    Amu Darya floodplains and recorded wintering waterbirds and habitat conditions.
  url: https://www.wetlands.org/?p=14332
  fetched: 2026-11-13
  quote: Surveying six sites along the Kabul River and the Amu Darya floodplains,
    they recorded wintering waterbirds, habitat conditions, and spoke with local communities
    about environmental changes.
- claim: Wetlands International says the Waterbird Fund, which it manages, supported
    counts in Afghanistan among other countries in 2026.
  url: https://www.wetlands.org/?p=14332
  fetched: 2026-11-13
  quote: These contributions helped enable counts not only in Afghanistan but also
    in countries such as Burundi, Ethiopia, Kenya, Indonesia, Rwanda and Turkmenistan.
- claim: An article by the chief executive of Organization Rewild says its team surveyed
    six key wetlands in January 2026.
  url: https://www.wetlands.org/?p=14250
  fetched: 2026-11-13
  quote: my team from Organization Rewild (OR) surveyed six key wetlands
