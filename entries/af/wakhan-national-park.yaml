facts:
- claim: In May 2026, AtlasPress reported that the park's head gave counts of 77 Marco Polo sheep and
    28 animals described by the page as Nubian ibex from surveys that year.
  url: https://atlaspress.news/en/?p=12868
  fetched: 2026-11-12
  quote: Mohammad Asif Amiri, head of Wakhan National Park, stated that based on recent surveys, only
    77 Marco Polo sheep and 28 Nubian ibex were observed in various parts of the park this year.
- claim: In May 2026, local officials reported a decline of more than 38 percent in the reported Marco
    Polo sheep and ibex counts compared with the previous year.
  url: https://atlaspress.news/en/?p=12868
  fetched: 2026-11-12
  quote: the number of Nubian ibex and Marco Polo sheep in Wakhan National Park has decreased by more
    than 38 percent compared to last year
- claim: UNDP's 2021 review of the snow leopard project includes a June 2020 camera-trap image from the
    park.
