summary: Afghan statistics body that, according to Pajhwok, used remote sensing and satellite imagery
  to report about 1.6 million hectares of forest, 2.54 percent of land area, for solar year 1404.
facts:
- claim: Pajhwok Afghan News reports that NSIA identified the country's forest cover for the 1404 solar
    year using remote sensing and satellite imagery.
  url: https://pajhwok.com/?p=723447
  fetched: 2026-11-12
  quote: In a statement, the NSIA said it identified the country’s forest cover in the 1404 solar year
    using remote sensing technology and satellite imagery.
- claim: The statement gave about 1.6 million hectares of forest, 2.54 percent of the land area, from
    satellite mapping data.
  url: https://pajhwok.com/?p=723447
  fetched: 2026-11-12
  quote: It added that satellite mapping data indicated that Afghanistan had around 1.6 million hectares
    of forest land in 1404, accounting for 2.54 percent of the country’s total land area.
- claim: The statement gave forest areas by province, with Nuristan largest.
  url: https://pajhwok.com/?p=723447
  fetched: 2026-11-12
  quote: It noted that Nuristan province had the largest forest area in the country, with 274,000 hectares
