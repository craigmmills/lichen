summary: Collaborative satellite monitoring network publishing open annual land cover and
  land use maps for Colombia from 1985 to 2024, coordinated by Fundación Gaia Amazonas.
facts:
- claim: Collection 3.0 covers annual maps from 1985 to 2024.
  url: https://www.elpais.com.co/colombia/colombia-perdio-568-millones-de-hectareas-de-bosques-en-40-anos-revelan-nuevos-mapas-satelitales-2401.html
  quote: un conjunto de mapas anuales que documentan la evolución de la cobertura y el uso
    del suelo en el país entre 1985 y 2024
  fetched: '2026-10-31'
- claim: Collection 3.0 has 40 maps of land cover and land use from 1985 to 2024.
  url: https://gaiaamazonas.org/noticias-y-comunicados/nueva-coleccion-3-0-mapbiomas-colombia/
  fetched: '2026-10-31'
  quote: lanzó la Colección 3.0 que reúne 40 mapas con información sobre cobertura y uso de
    suelo en el país desde 1985 hasta 2024
- claim: Gaia Amazonas says the maps are made with cloud processing and artificial intelligence.
  url: https://gaiaamazonas.org/redes-y-alianzas/
  fetched: '2026-10-31'
  quote: con procesamiento en la nube y utilizando tecnologías de inteligencia artificial
- claim: The network is made up of universities, CIAT and Fundación AVINA, coordinated by
    Gaia Amazonas.
  url: https://gaiaamazonas.org/noticias-y-comunicados/nueva-coleccion-3-0-mapbiomas-colombia/
  fetched: '2026-10-31'
  quote: una red colaborativa de monitoreo satelital integrada por la Universidad Nacional,
    la Universidad del Rosario, la Universidad Javeriana, el CIAT, la Fundación AVINA, y con
    la coordinación de la Fundación Gaia Amazonas
