facts:
- claim: Regional environmental authority of Boyacá whose 2024–2027 action plan describes
    13 protected areas in SIRAP-Corpoboyacá, 9 regional and 4 national, covering 155,091.9
    hectares. Delimitation of páramo complexes in its jurisdiction began in 2012.
  url: https://www.corpoboyaca.gov.co/cms/wp-content/uploads/2025/03/Plan-de-accion-2024-2027.pdf
  fetched: '2026-11-17'
  quote: 9 son regionales y 4 son nacionales, con una extensión de 155.091,9 hectáreas
- claim: Its páramo page reports 7 complexes covering 517,052 hectares in its jurisdiction,
    prioritised for conservation in recent years, with delimitation beginning in 2012.
  url: https://www.corpoboyaca.gov.co/sirap/areas-protegidas/paramos/
  fetched: '2026-11-17'
  quote: desde el año 2012 se inició su delimitación con el objetivo de fortalecer
    su preservación y uso sostenible
