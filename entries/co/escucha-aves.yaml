summary: AI acoustic bird monitoring network led by local communities, which began with 193
  recorders at nine sites in Colombia and plans 600 recorders across Colombia, Peru and Bolivia.
  Led by the National Audubon Society.
facts:
- claim: Launched with 193 recorders across nine sites in Colombia.
  url: https://www.audubon.org/news/escucha-aves-ai-conservation-and-communities
  quote: With 193 recorders distributed across nine sites in Colombia, Escucha Aves launched
    the implementation of its AI-powered acoustic monitoring network led by local communities.
  fetched: '2026-10-31'
- claim: Audubon describes the project as local communities using recorders and AI to monitor
    birds.
  url: https://www.audubon.org/news/chorus-our-ai-ecoacoustic-processing-technology-begins-supporting-locally-led-bird
  fetched: '2026-10-31'
  quote: a project in which local communities and organizations use autonomous audio recorders
    and artificial intelligence (AI) to monitor birds
- claim: El Espectador, in a piece marked institutional information, reports 193 recorders
    at nine points in Colombia.
  url: https://www.elespectador.com/ambiente/bibo/escucha-aves-ia-a-favor-de-la-conservacion-y-las-comunidades/
  fetched: '2026-10-31'
  quote: Con 193 grabadoras distribuidas en nueve puntos de Colombia
- claim: Recordings are processed with bioacoustic foundation models.
  url: https://www.audubon.org/news/chorus-our-ai-ecoacoustic-processing-technology-begins-supporting-locally-led-bird
  fetched: '2026-10-31'
  quote: processed using bioacoustic foundation models such as BirdNET, Perch, and BirdSET
  ai_type: foundation-models
- claim: Audubon reports 193 recorders at nine points in Colombia and that it will go to Peru
    and Bolivia.
  url: https://www.audubon.org/es/noticias/escucha-aves-ia-favor-de-la-conservacion-y-las-comunidades
  fetched: '2026-10-31'
  quote: Con 193 grabadoras distribuidas en nueve puntos de Colombia
- claim: Audubon describes it as training communities and local organisations in acoustic
    monitoring and then using AI tools.
  url: https://www.audubon.org/es/noticias/escucha-aves-ia-favor-de-la-conservacion-y-las-comunidades
  fetched: '2026-10-31'
  quote: posteriormente utilizamos herramientas de IA para identificar
