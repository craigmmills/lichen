  quote: mayor procesamiento digital de imágenes satelitales y ocho algoritmos que
    permiten la identificación de las áreas deforestadas en el país
  fetched: '2026-10-31'
- claim: Issues early deforestation alerts.
  url: https://visionamazonia.minambiente.gov.co/content/uploads/2023/04/SMByC_Resumen-ejecutivo.pdf
