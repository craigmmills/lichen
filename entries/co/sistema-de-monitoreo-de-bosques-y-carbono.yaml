summary: Colombia's official national forest monitoring system, run by IDEAM. It processes
  satellite images with eight algorithms to identify deforested areas and issues early
  deforestation alerts.
facts:
- claim: Uses digital processing of satellite images and eight algorithms to identify
    deforested areas.
