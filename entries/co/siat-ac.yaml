summary: Network of institutions that agree common objectives for managing environmental
  information on the Colombian Amazon. A SINCHI procurement document sets out a planned
  chatbot and a geospatial AI agent for it.
facts:
- claim: Described by SINCHI as a process in which institutions agree common objectives
    on environmental information for the Colombian Amazon.
  url: https://en.sinchi.org.co:443/servicios
  quote: SIAT-AC is a process in which a set of actors (institutions) establish agreements,
    with common objectives about environmental information management of the Colombian
    Amazon
  fetched: '2026-10-31'
- claim: A SINCHI procurement document specifies a geospatial AI agent for the system.
  url: https://www.sinchi.org.co/files/EstudiosPreviosCPPlataformaMoSCAL_v1.1-1.pdf
  quote: incorporación de capacidades de inteligencia artificial geoespacial y analítica
    avanzada
  fetched: '2026-10-31'
- claim: Describes itself as the window for managing and sharing environmental information
    on the Colombian Amazon, with an open data portal.
  url: https://sinchi.org.co/sistema-de-informacion-ambiental-territorial-de-la-amazonia-colombiana-siat-ac
  fetched: '2026-10-31'
  quote: Es la ventana de gestión y difusión de la información ambiental para la Amazonia
