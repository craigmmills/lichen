summary: Colombia's national mapping agency. It runs the Observatorio de la Tierra y el Territorio,
  says it has built AI software to detect illegal mining in protected areas, and is technical
  secretariat of the Colombian Space Commission.
facts:
- claim: Planet describes IGAC as the government body responsible for Colombia's geographic
    and cartographic data.
  url: https://investors.planet.com/news/news-details/2025/Planet-Expands-Multi-Year-Contract-with-Instituto-Geogrfico-Agustn-Codazzi-IGAC-Providing-Satellite-Data-and-AI-Powered-Analytics-Feeds-Across-Colombia/default.aspx
  quote: IGAC is the governmental entity in Colombia responsible for generating, managing,
    and disseminating geographic and cartographic data.
  fetched: '2026-10-31'
