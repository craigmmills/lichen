summary: Programme that IGAC says gives Colombia access to synthetic aperture radar
  data and builds processing skills for deforestation monitoring and territorial mapping,
  with NASA and others as partners.
facts:
- claim: IGAC says the programme gives Colombia access to synthetic aperture radar
    data and builds training in processing it, for deforestation monitoring and territorial
    mapping.
  url: https://www.igac.gov.co/noticias/geointeligencia-en-accion-el-observatorio-de-la-tierra-y-el-territorio-motor-de-la-inteligencia-territorial-de-colombia
  fetched: 2026-11-08
  quote: fundamentales para el monitoreo de la deforestación y el mapeo territorial
- claim: IGAC highlights the programme when describing plans to add radar and LiDAR
    to its Observatorio de la Tierra y el Territorio for cloudy regions such as the
    Amazon and Pacific.
  url: https://www.igac.gov.co/noticias/geointeligencia-en-accion-el-observatorio-de-la-tierra-y-el-territorio-motor-de-la-inteligencia-territorial-de-colombia
  fetched: 2026-11-08
  quote: En este contexto se destaca el Programa SAR Colombia
