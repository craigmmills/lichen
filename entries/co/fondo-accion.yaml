summary: Colombian national fund for the environment and children, accredited to the Green
  Climate Fund. It is the national partner of Conserva Aves, which is piloting passive acoustic
  monitoring in new reserves.
facts:
- claim: The Green Climate Fund describes it as a national entity promoting the preservation
    and management of Colombia's natural resources.
  url: https://www.greenclimate.fund/ae/fondo-accion
  quote: is a national entity aiming to promote activities that preserve, protect and manage
    natural and biological resources of Colombia
  fetched: '2026-10-31'
- claim: Audubon names it as the national partner of Conserva Aves.
  url: https://www.audubon.org/es/noticias/sonidos-que-importan-como-el-monitoreo-acustico-pasivo-transforma-la-ciencia-y-beneficia
  quote: coordinador iniciativa Conserva Aves de Fondo Acción, organización que en Colombia
    es el socio nacional de la iniciativa
  fetched: '2026-10-31'
- claim: Says it administers the Tropical Forest Conservation Agreement between Colombia and
    the United States.
  url: https://fondoaccion.org/que-hacemos/
  fetched: '2026-10-31'
  quote: Nos convertimos en el administrador del Acuerdo para la Conservación de Bosques Tropicales
