summary: Colombia's national camera-trap network, made up of the 33 regional environmental
  authorities, the Instituto Humboldt and Conservation International. Images are classified
  on Wildlife Insights.
facts:
- claim: Images are processed on Wildlife Insights, which classifies species with AI.
  url: https://abceconomia.co/2026/08/05/mineros-red-otus-camaras-trampa-jaguar-danta-bajo-cauca/
  quote: El procesamiento de las miles de imágenes se realiza mediante la plataforma Wildlife
    Insights
  fetched: '2026-10-31'
- claim: El Espectador says the network was built with the 33 regional corporations and Conservación
    Internacional.
  url: https://www.elespectador.com/la-red-zoocial/lanzamiento-de-otus-la-red-nacional-de-camaras-de-fauna-como-funciona/
  fetched: '2026-10-31'
  quote: El proyecto se construyó en colaboración con las 33 Corporaciones Autónomas Regionales
    de Desarrollo Sostenible y Conservación Internacional
- claim: El País reports 1,800 cameras covering a million hectares.
  url: https://www.elpais.com.co/valle/camaras-trampa-captan-mas-de-339-especies-en-colombia-valle-del-cauca-destaca-con-mas-de-20000-imagenes-2731.html
  fetched: '2026-10-31'
  quote: cuenta actualmente con 1.800 cámaras instaladas, que han permitido cubrir un millón
    de hectáreas
- claim: El País reports more than 140,000 records and 339 species.
  url: https://www.elpais.com.co/valle/camaras-trampa-captan-mas-de-339-especies-en-colombia-valle-del-cauca-destaca-con-mas-de-20000-imagenes-2731.html
  fetched: '2026-10-31'
  quote: Más de 140.000 registros de fauna silvestre y 339 especies identificadas
- claim: ABC Economía gives a lower count of more than 1,300 cameras, and says it began in
    2024 with 397.
  url: https://abceconomia.co/2026/08/05/mineros-red-otus-camaras-trampa-jaguar-danta-bajo-cauca/
  fetched: '2026-10-31'
  quote: La Red OTUS comenzó sus operaciones en 2024 con un total de 397 cámaras. Actualmente,
    el proyecto supera los 1.300 dispositivos
- claim: The Instituto Humboldt says the initiative is led by itself, Conservación Internacional
    Colombia and the regional corporations through Asocars, with support from Wildlife Insights
    and Google.
  url: https://www.humboldt.org.co/noticias/colombia-consolida-red-de-camaras-trampa-para-conservar-la-biodiversidad
  fetched: '2026-10-31'
  quote: con el apoyo de Wildlife Insights y Google, unieron esfuerzos para crear una nueva
    red
- claim: The Instituto Humboldt director says all images are processed by Wildlife Insights
    and become public records through SiB Colombia.
  url: https://www.humboldt.org.co/noticias/colombia-consolida-red-de-camaras-trampa-para-conservar-la-biodiversidad
  fetched: '2026-10-31'
  quote: Todas las imágenes de cámaras trampa son procesadas por Wildlife Insights
- claim: Conservación Internacional Colombia says 33 regional corporations, itself and the
    Instituto Humboldt are part of the network, and that images are processed with AI through
    Wildlife Insights.
  url: https://www.conservation.org.co/Noticias/lista-de-noticias/cvc-fortalece-la-red-otus-con-la-instalaci%C3%B3n-de-200-c%C3%A1maras-trampa-para-monitorear-la-fauna-del-valle
  fetched: '2026-10-31'
  quote: procesa las imágenes con Inteligencia Artificial a través de la plataforma Wildlife
    Insights
- claim: The Universidad de los Andes register of public-sector algorithms lists OTUS as an
    AI system, in execution, with the regional corporations as the public body.
  url: https://algoritmos.uniandes.edu.co/otus/
  fetched: '2026-10-31'
  quote: OTUS es un sistema diseñado para fortalecer el monitoreo de la biodiversidad
