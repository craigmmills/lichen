summary: Regional environmental corporation of the Orinoquia that, with USAID's Riqueza
  Natural programme, started a route in 2018 to seek protected status for a morichal;
  its GBIF dataset holds 2017 and 2018 monitoring records.
facts:
- claim: In November 2018, Red Prensa Verde reported that Corporinoquia and USAID's
    Riqueza Natural programme had started a route to seek protected status for a morichal
    in Paz de Ariporo.
  url: https://redprensaverde.org/?p=10070
  fetched: 2026-11-08
  quote: Corporinoquia y el programa Riqueza Natural iniciaron la ruta para la conservación
    de un ‘baldío’ en la sabana inundable del Casanare.
- claim: In November 2018, the alliance was considering a designation such as a Distrito
    Regional de Manejo Integrado, or complementary conservation strategies without
    declaring a protected area.
  url: https://redprensaverde.org/?p=10070
  fetched: 2026-11-08
  quote: con quien conformó una alianza para declarar el área protegida posiblemente
    en una categoría similar a la región de Cinaruco
- claim: Its GBIF dataset holds records from monitoring in 2017 and 2018, including
    camera trapping in regional protected areas such as the DRMI Mata de la Urama.
  url: https://api.gbif.org/v1/dataset/b56d3f3d-6f30-4a85-a0bc-29d01d2e7c8c
  fetched: 2026-11-08
  quote: Los registros son producto de jornadas de monitoreo llevadas a cabo entre
    los años 2017 y 2018
- claim: GBIF lists it as a publisher under this name.
  url: https://api.gbif.org/v1/organization/66739018-f8c3-4902-96d5-82c0aec31d6a
