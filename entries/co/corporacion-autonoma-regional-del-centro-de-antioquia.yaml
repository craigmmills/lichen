facts:
- claim: Regional environmental authority whose jurisdiction was reported in December
    2017 to contain 213,337 hectares of protected areas across 10 integrated management
    districts, 3 regional protective forest reserves and 1 regional natural park.
    The report says it participated in managing the El Sapo and Hoyo Grande wetland
    complex.
