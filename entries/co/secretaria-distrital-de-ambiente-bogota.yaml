summary: Bogotá's environment authority. Its biodiversity monitoring group works in 19 protected
  areas with camera traps, and it publishes records to iNaturalist and SiB Colombia.
facts:
- claim: Its monitoring group works in 19 protected areas of the city.
  url: https://bogota.gov.co/mi-ciudad/ambiente/bogota-protege-y-vigila-la-flora-y-fauna-con-tecnologia-de-punta
  quote: El Grupo de Monitoreo de la Biodiversidad de la Secretaría de Ambiente realiza este
    ejercicio en 19 áreas protegidas de la ciudad
  fetched: '2026-10-31'
- claim: Publishes its records on iNaturalist and SiB Colombia.
  url: https://bogota.gov.co/mi-ciudad/ambiente/bogota-protege-y-vigila-la-flora-y-fauna-con-tecnologia-de-punta
  quote: ya que la Secretaría de Ambiente es socia publicadora
  fetched: '2026-10-31'
- claim: Uses satellite images, drones and open data to monitor vegetation cover.
  url: https://impactotic.co/smartcityexpo/desafios-ambientales-en-bogota-tecnologia-para-el-cambio/
  quote: mediante el uso de imágenes satelitales, drones y datos abiertos, para asegurar el
    monitoreo continuo de las coberturas vegetales
  fetched: '2026-10-31'
- claim: Bogotá's site reports 35 acoustic monitoring devices installed with the Instituto
    Humboldt.
  url: https://bogota.gov.co/mi-ciudad/ambiente/bogota-avanza-monitoreo-acustico-de-biodiversidad-de-areas-protegidas
