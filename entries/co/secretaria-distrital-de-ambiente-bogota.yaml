  quote: en articulación con el Instituto Alexander von Humboldt han instalado 35 equipos
    de monitoreo acústico
- claim: Describes biodiversity monitoring as observing, recording and analysing biodiversity
    to assess its state.
  url: http://www.ambientebogota.gov.co/nosotros/gestion-ambiental/conservacion-de-la-biodiversidad
  quote: Proceso de observación, registro y análisis de la biodiversidad para evaluar su estado
  fetched: '2026-10-31'
- claim: Runs the Bogotá Environmental Observatory of data and indicators.
  url: https://oab.ambientebogota.gov.co/
  quote: Observatorio Ambiental de Bogotá » Datos e indicadores para medir la calidad del
    ambiente en Bogotá
