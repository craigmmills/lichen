- claim: In February 2019, Red Prensa Verde reported that the corporation supplied
    cameras and other equipment, which had produced 7,000 records and identified 30
    bears.
  url: https://redprensaverde.org/?p=10505
  fetched: 2026-11-08
  quote: La Corporación aporta las cámaras, los binoculares y demás equipos, con los
    que se han logrado 7.000 registros que han permitido individualizar 30 osos con
    patrón de manchas.
- claim: In February 2019, Red Prensa Verde reported that the monitoring groups were
    small farmers settled in the department's regional natural reserves.
  url: https://redprensaverde.org/?p=10505
