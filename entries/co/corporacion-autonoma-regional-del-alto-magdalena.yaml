- claim: In February 2019, Red Prensa Verde reported that its community monitoring
    strategy began in 2012 and involved 209 people working mainly with camera traps.
  url: https://redprensaverde.org/?p=10505
  fetched: 2026-11-08
  quote: Actualmente son 209 personas las que desarrollan dichas actividades bajo
