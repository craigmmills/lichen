summary: Project run by EAD with Dendra Co. to assess natural terrestrial habitats; in August 2024 EAD
  said it covered 11,000 hectares over more than six months.
facts:
- claim: EAD says it partnered with Dendra Co. on a programme to assess the state of natural terrestrial
    habitats across the emirate.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: the Agency has partnered with Dendra Co. to execute a comprehensive programme aimed at assessing
    the state of natural terrestrial habitats across the emirate of Abu Dhabi.
- claim: EAD describes Dendra Co. as specialising in environmental consultancy studies using artificial
    intelligence methods and drone-mounted smart sensors.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: Dendra Co. which specialises in conducting environmental consultancy studies using artificial
    intelligence methodologies and data collection programmes via smart sensors provided to drones.
- claim: In August 2024, EAD said the programme covered 11,000 hectares over more than six months as a
    representative survey of vegetation cover most vulnerable to human uses and climate change.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: More than six months of continuous work enabled us to comprehensively cover a total area of 11,000
    hectares
- claim: A geographic database platform was developed to hold the project's information.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: a smart geographic database platform was developed to document all project information.
