summary: Assessment of Abu Dhabi's terrestrial and marine ecosystems, built by EAD
  with IUCN and Provita as partners, announced 16 May 2023, finding twelve ecosystems
  threatened, two of them critically endangered.
facts:
- claim: EAD completed the assessment of Abu Dhabi's terrestrial and marine ecosystems,
    part of its Abu Dhabi Assessment Project, announced 16 May 2023.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-enhances-efforts-to-protect-ecosystems-and-habitats-with-abudhabi-red-list-of-ecosystems-assessment/
  fetched: 2026-11-15
  quote: The Abu Dhabi Red List of Ecosystems, part of EAD’s Abu Dhabi Assessment
    Project, is the first such assessment of ecosystems in the region.
- claim: Twelve ecosystems were assessed as threatened, two of them critically endangered,
    five endangered and five vulnerable.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-enhances-efforts-to-protect-ecosystems-and-habitats-with-abudhabi-red-list-of-ecosystems-assessment/
  fetched: 2026-11-15
  quote: Terrestrial and marine ecosystems were assessed; 12 were assigned ‘Threatened’
    status; two were assessed as ‘Critically Endangered’; five ‘Endangered’; and five
    were assessed as ‘Vulnerable’.
