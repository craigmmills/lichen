summary: EAD aerial survey of marine species running since 2004, which reported in
  June 2025 covering over 8,000 square kilometres and estimated over 3,500 dugongs
  in 2024.
facts:
- claim: EAD has carried out aerial assessments of marine species since 2004, and
    says it is the only body in the Middle East running long-term systematic monitoring
    of marine species through regular surveys.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-aerial-survey-covering-8000-km2-of-marine-habitat/
  fetched: 2026-11-15
  quote: EAD is the only entity in the Middle East conducting long-term, systematic
    monitoring of marine species through regular surveys. Since 2004, it has been
    carrying out comprehensive aerial assessments
- claim: The survey reported in June 2025 covered more than 8,000 square kilometres
    and focused on dugongs and sea turtles, also recording dolphins, whales, sharks,
    rays and birds.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-aerial-survey-covering-8000-km2-of-marine-habitat/
  fetched: 2026-11-15
  quote: The survey focused on tracking the population, distribution, movement patterns
    and seasonal migrations of dugongs and sea turtles. It also included the monitoring
    of dolphins, whales, sharks, rays and birds.
- claim: Estimated the dugong population at over 3,500 individuals in 2024.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-aerial-survey-covering-8000-km2-of-marine-habitat/
  fetched: 2026-11-15
  quote: with the dugong population estimated at over 3,500 individuals in 2024
