summary: Completed 2023 EAD survey of coastal sites and nearby islands in Abu Dhabi,
  recording 127 breeding Osprey pairs at more than 40 locations, intended to help
  assess population trends.
facts:
- claim: In 2023 EAD surveyed all coastal sites and nearby islands of Abu Dhabi to
    monitor the breeding population of the Osprey, recording 127 breeding pairs at
    more than 40 locations.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Osprey-Breeding
  fetched: 2026-11-15
  quote: the survey to monitor Osprey breeding was the most comprehensive ever conducted
    in the UAE, with 127 breeding pairs recorded across more than 40 coastal and island
    locations.
- claim: EAD says the survey and regular monitoring of the breeding population will
    let it assess trends in Osprey numbers.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Osprey-Breeding
