summary: Sediment survey off Abu Dhabi aboard Jaywun, which Khalifa University in December 2024 called
  the first comprehensive modern one, led by EAD and Khalifa University scientists and begun during the
  December 2023 expedition.
facts:
- claim: In December 2024, Khalifa University said scientists and marine researchers from EAD and Khalifa
    University had led the first comprehensive modern sediment survey off Abu Dhabi aboard Jaywun, exploring
    climate change effects on the Gulf’s marine ecosystem.
  url: https://www.ku.ac.ae/environment-agency-abu-dhabi-and-khalifa-university-collaborate-on-comprehensive-coastal-seabed-survey-aboard-marine-research-vessel-jaywun
  fetched: 2026-11-08
  quote: have led the first comprehensive modern sediment survey off the coast of Abu Dhabi, on board
    the region's most advanced marine research vessel Jaywun, to explore the effects of climate change
    on the Arabian Gulf's distinctive marine ecosystem.
- claim: The project began during the December 2023 expedition under an agreement between EAD, OceanX,
    Bayanat and M42.
  url: https://www.ku.ac.ae/environment-agency-abu-dhabi-and-khalifa-university-collaborate-on-comprehensive-coastal-seabed-survey-aboard-marine-research-vessel-jaywun
  fetched: 2026-11-08
  quote: The project was initially launched as part of the expedition under the multilateral agreement
    between EAD, OceanX, Bayanat, and M42, aboard the Ocean Explorer across the UAE in December 2023.
