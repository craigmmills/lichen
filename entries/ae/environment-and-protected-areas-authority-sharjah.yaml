summary: Managed Sir Bu Nair and monitored turtles with EMEG from 2010 per a 2019
  report, tagged five hawksbills, surveyed ospreys and announced a 2025 seabird debris
  study.
facts:
- claim: Named as the management authority for Sir Bu Nair Island Reserve in a September
    2019 site report to the CMS IOSEA marine turtle memorandum.
  url: https://www.cms.int/iosea-turtles/sites/default/files/document/cms_iosea_mos8_inf.9.1.f_site-network-updates-sir-bu-na%27air_e.pdf
  fetched: 2026-11-12
  quote: Environment and Protected Area Authority in Sharjah
- claim: A September 2019 site report says it had carried out turtle monitoring on
    Sir Bu Nair with the Emirates Marine Environmental Group since 2010.
  url: https://www.cms.int/iosea-turtles/sites/default/files/document/cms_iosea_mos8_inf.9.1.f_site-network-updates-sir-bu-na%27air_e.pdf
  fetched: 2026-11-12
  quote: Turtle monitoring has been carried out by the EPAA, in partnership with EMEG
    since 2010.
- claim: With Emirates Nature-WWF and EMEG, satellite tagged five female hawksbill
    turtles.
  url: https://www.cms.int/iosea-turtles/sites/default/files/document/cms_iosea_mos8_inf.9.1.f_site-network-updates-sir-bu-na%27air_e.pdf
  fetched: 2026-11-12
  quote: EPAA/EMEG/EWS-WWF satellite tagged five female hawksbill turtles for three
    years.
- claim: Reported in August 2024 that it conducted regular surveys of osprey breeding
    populations at coastal sites and on Sir Bu Nair.
  url: https://www.albawaba.com/business/pr/epaa-roll-out-artificial-nests-project-1580198
  fetched: 2026-11-12
  quote: The EPAA conducts regular surveys across the Emirate of Sharjah to monitor
    the breeding populations of this bird in all coastal sites, beaches, and the Sir
    Bu Nair Island Reserve.
- claim: In 2024 launched artificial osprey nests, which its chairperson said will
    be connected to surveillance cameras for monitoring.
  url: https://www.albawaba.com/business/pr/epaa-roll-out-artificial-nests-project-1580198
  fetched: 2026-11-12
  quote: these nests will be connected to surveillance cameras to facilitate the monitoring
    and tracking of osprey numbers, their flight patterns, movements, behavior, and
    diet.
- claim: In 2025 announced a study, done under the Sharjah Strandings Response Programme
    and published in Marine Pollution Bulletin, monitoring marine debris, microplastic
    and oil ingestion by seabirds.
  url: https://sharjah24.ae/en/Articles/2025/06/03/kmr17
  fetched: 2026-11-12
  quote: Conducted as part of the Sharjah Strandings Response Programme, the study
    was recently published in the scientific journal Marine Pollution Bulletin
