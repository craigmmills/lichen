summary: Authority established under Law No. 11 of 2024 that manages eight Dubai nature
  reserves, conducts wildlife and habitat research, and in 2026 partnered with IUCN's
  West Asia office on an integrated reserve plan.
facts:
- claim: Established under Law No. 11 of 2024 for the management of nature reserves
    in Dubai.
  url: https://gulfnews.com/uae/environment/what-dubais-new-nature-reserve-plan-means-for-residents-and-wildlife-1.500667183
  fetched: 2026-11-12
  quote: The initiative forms part of DECCA’s ongoing work since its establishment
    under Law No. 11 of 2024 for the management of nature reserves in Dubai.
- claim: Manages eight reserves, including Hatta Mountain Reserve, Ras Al Khor Wildlife
    Sanctuary, Jebel Ali Wildlife Sanctuary and Dubai Desert Conservation Reserve.
  url: https://gulfnews.com/uae/environment/what-dubais-new-nature-reserve-plan-means-for-residents-and-wildlife-1.500667183
  fetched: 2026-11-12
  quote: The eight reserves managed by DECCA are Hatta Mountain Reserve, Al Marmoom
    Desert Conservation Reserve, Ghaf Nazwa Conservation Reserve, Jebel Nazwa Conservation
    Reserve, Ras Al Khor Wildlife Sanctuary
- claim: Conducts research and scientific studies to monitor wildlife and assess habitat
    conditions.
  url: https://focus.hidubai.com/al-wohoosh-desert-reserve-highlights-dubais-rich-biodiversity-beyond-size/
  fetched: 2026-11-12
  quote: The authority also conducts research and scientific studies to monitor wildlife,
    assess habitat conditions and guide conservation plans.
- claim: In 2026 partnered with IUCN's Regional Office for West Asia on an integrated
    plan for Dubai's nature reserve network.
  url: https://gulfnews.com/uae/environment/what-dubais-new-nature-reserve-plan-means-for-residents-and-wildlife-1.500667183
  fetched: 2026-11-12
  quote: has partnered with the International Union for Conservation of Nature, Regional
    Office for West Asia (IUCN ROWA), to develop and implement an integrated plan
    for Dubai’s nature reserve network.
