summary: Regional hub established in 2009, according to EAD, which said in February 2020 that an extended
  agreement would continue its UAE operations for four more years.
facts:
- claim: In February 2020, EAD said the office was established in the UAE capital in 2009 and was the
    Convention’s only regional hub outside Bonn.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Donor-Agreement-CMS
  fetched: 2026-11-08
  quote: Established in the United Arab Emirates' capital in 2009, CMS Office — Abu Dhabi is the only
    regional hub for the Convention outside its headquarters in Bonn, Germany.
- claim: In February 2020, EAD said the office was home to the Raptors MOU and the Dugong MOU.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Donor-Agreement-CMS
  fetched: 2026-11-08
  quote: CMS Office — Abu Dhabi is home to two CMS international agreements
- claim: EAD lists the development of scientific tools to study dugongs and seagrass habitats among the
    achievements of the CMS-EAD partnership, as of February 2020.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Donor-Agreement-CMS
  fetched: 2026-11-08
  quote: Among the achievements are the successful development of scientific tools to better study dugongs
    and seagrass habitats
- claim: In February 2020 EAD said the extended agreement kept the office's UAE operations going for another
    four years. No later page was read, so whether it still runs is not confirmed.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Donor-Agreement-CMS
  fetched: 2026-11-08
  quote: With the extension of the partnership agreement, CMS Office — Abu Dhabi will continue its UAE
    operations for another four years.
