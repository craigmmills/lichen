    to 193 nests in 2022, with a 72 per cent hatching success
- claim: EAD says it has researched, monitored and protected marine turtles in Abu
    Dhabi since 1999.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-records-green-turtle-nest-for-first-time-in-the-emirate/
