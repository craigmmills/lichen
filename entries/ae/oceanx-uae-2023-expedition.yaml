  quote: November 2023 - December 2023 United Arab Emirates (UAE) 2023
- claim: OceanX says the expedition used eDNA for fisheries assessment and surveyed seafloor, habitats
    and biodiversity across UAE waters.
  url: https://www.oceanx.org/missions/united-arab-emirates-uae-2023
  fetched: 2026-11-08
  quote: The expedition leveraged eDNA for improved fisheries assessment and expanded seafloor, habitat,
    and biodiversity surveys across UAE waters, aiding in MPA establishment and sustainable fisheries
    management.
- claim: Megafauna were surveyed with ship-based observations, aerial transects, hydrophones and eDNA
    sampling.
  url: https://www.oceanx.org/missions/united-arab-emirates-uae-2023
  fetched: 2026-11-08
  quote: Using ship-based observations, aerial transects, hydrophones, and pioneering eDNA sampling, researchers
    documented whales, dolphins, and sharks across UAE waters.
