summary: A turtle rehabilitation project run by Jumeirah and led by Barbara Lang-Lenton, which
  has returned over 2,000 sea turtles to the sea and, as reported in 2024, fits some with
  satellite trackers.
facts:
- claim: One of its goals is to research turtle movements through the region and beyond with
    a satellite tracking initiative.
  url: https://www.jumeirah.com/en/stay/dubai/jumeirah-beach-hotel/experiences/turtle-rehabilitation-at-jumeirah
  fetched: 2026-11-12
  quote: Understand the success of rehabilitation and to research turtle movements throughout
    the region and beyond via a satellite tracking initiative
- claim: Has returned more than 2,000 sea turtles to the sea over nearly twenty years.
  url: https://www.jumeirah.com/en/stay/dubai/jumeirah-beach-hotel/experiences/turtle-rehabilitation-at-jumeirah
  fetched: 2026-11-12
  quote: has been carefully supporting the recovery of sea turtles for nearly twenty years,
    with more than 2,000 returned to their ocean home.
- claim: The National reported in 2024 that some released turtles are fitted with satellite
    trackers, and one travelled 8,300 km to Thailand.
  url: https://www.thenationalnews.com/lifestyle/2024/06/21/jumeirah-dubai-turtle-rehabilitation-project
  fetched: 2026-11-12
  quote: Some turtles are fitted with satellite trackers to monitor their movements and well-being.
- claim: Works with Dubai's Wildlife Protection Office, with veterinary support from the Dubai
    Falcon Clinic and laboratory analysis by the Central Veterinary Research Laboratory.
  url: https://www.jumeirah.com/en/stay/dubai/jumeirah-beach-hotel/experiences/turtle-rehabilitation-at-jumeirah
  fetched: 2026-11-12
  quote: working closely with Dubai’s Wildlife Protection Office to ensure the highest standards
    of care.
