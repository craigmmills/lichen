summary: Multi-year EAD survey of the emirate's marine waters, announced 8 July 2026,
  with fieldwork from 2023 to 2025 assessing 1,088 locations, of which 334 confirmed
  oyster bed.
facts:
- claim: EAD completed a multi-year oyster bed mapping survey across the emirate's
    marine waters, announced on 8 July 2026.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-oyster-bed-mapping-survey-across-emirates-marine-waters/
  fetched: 2026-11-15
  quote: Environment Agency - Abu Dhabi (EAD) has completed a landmark multi-year
    oyster bed mapping survey, delivering the most comprehensive scientific understanding
    to date of oyster bed distribution across the emirate’s marine waters.
- claim: Survey design was set in 2022 and fieldwork ran from 2023 to the end of 2025.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-oyster-bed-mapping-survey-across-emirates-marine-waters/
  fetched: 2026-11-15
  quote: With survey design established in 2022 and fieldwork carried out from 2023
    to the end of 2025
- claim: Drew on the 2021 deep-water survey, historical pearl diver maps, hawksbill
    turtle tracking data, oyster rehabilitation sites and local knowledge.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-oyster-bed-mapping-survey-across-emirates-marine-waters/
  fetched: 2026-11-15
  quote: Hawksbill turtle tracking data, as these endangered turtles are known to
    congregate around oyster beds, making them a natural indicator of habitat presence
- claim: Assessed 1,088 locations, of which 334 confirmed oyster bed, covering about
    3,314 square kilometres.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-completes-oyster-bed-mapping-survey-across-emirates-marine-waters/
  fetched: 2026-11-15
  quote: EAD assessed 1,088 locations across Abu Dhabi’s waters, of which 334 confirmed
    the presence of oyster bed.
