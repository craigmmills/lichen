summary: EAD programme monitoring terrestrial and marine birds at Al Wathba Wetland
  Reserve since 2002, using satellite tracking of greater flamingos since 2005.
facts:
- claim: EAD has monitored terrestrial and marine bird species at Al Wathba Wetland
    Reserve since 2002.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-the-yas-seaworld-research-rescue-center-rehabilitates-and-releases-10-greater-flamingos-back-to-al-wathba-wetland-reserve/
  fetched: 2026-11-15
  quote: The EAD has been monitoring both terrestrial and marine bird species at Al
    Wathba Wetland Reserve since 2002.
- claim: Since 2005 EAD has used satellite-tracking devices to follow the movements
    and migration of greater flamingos from the reserve.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-the-yas-seaworld-research-rescue-center-rehabilitates-and-releases-10-greater-flamingos-back-to-al-wathba-wetland-reserve/
  fetched: 2026-11-15
  quote: Since 2005, the EAD has been using advanced satellite-tracking devices to
    monitor the movement and migration patterns of the greater flamingos from the
    reserve to northern areas during the summer.
- claim: EAD rangers monitored greater flamingos across the reserve's wetlands during
    the February 2024 hailstorm.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-the-yas-seaworld-research-rescue-center-rehabilitates-and-releases-10-greater-flamingos-back-to-al-wathba-wetland-reserve/
  fetched: 2026-11-15
  quote: The agency's rangers in the reserve were monitoring the greater flamingo
    population across the reserve’s wetlands from the storm’s early hours.
