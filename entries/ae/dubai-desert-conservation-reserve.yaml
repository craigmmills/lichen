summary: Reserve run by the Dubai Environment and Climate Change Authority, which
  with Biosphere Expeditions completed its ninth annual wildlife survey in January
  2020, with camera traps capturing over 6,000 images across 14 points.
facts:
- claim: With Biosphere Expeditions, completed its ninth consecutive annual wildlife
    survey in January 2020.
  url: https://blog.biosphere-expeditions.org/2020/01/31/arabia-roundup-of-2020-expedition/
  fetched: 2026-11-12
  quote: Biosphere Expeditions and the Dubai Desert Conservation Reserve completed
    their 9th consecutive annual survey this January.
- claim: Citizen scientists and DDCR staff surveyed Arabian oryx, Arabian gazelle
    and sand gazelle across the 227 square kilometre reserve.
  url: https://blog.biosphere-expeditions.org/2020/01/31/arabia-roundup-of-2020-expedition/
  fetched: 2026-11-12
  quote: three Dubai Desert Conservation Reserve (DDCR) staff surveyed the Arabian
    oryx, Arabian gazelle and Sand gazelle populations across the entire 227 sqkm
    reserve.
- claim: Camera traps set across the reserve captured over 6,000 images at 14 points
    during the 2020 survey week.
  url: https://blog.biosphere-expeditions.org/2020/01/31/arabia-roundup-of-2020-expedition/
  fetched: 2026-11-12
  quote: Camera traps were set throughout the reserve, with over 6,000 images captured
    at 14 points during the week.
