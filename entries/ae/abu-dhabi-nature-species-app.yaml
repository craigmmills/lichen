summary: Smartphone app and website launched in October 2022 at GITEX, built and run
  by EAD, for learning about Abu Dhabi's wildlife and reporting sightings, with a
  database of over 4,000 species and habitats.
facts:
- claim: Launched in October 2022 at GITEX as a smartphone app and website for learning
    about Abu Dhabi's wildlife and reporting sightings to EAD.
  url: https://www.mediaoffice.abudhabi/en/environment/new-app-to-track-sightings-of-species-launched-by-environment-agency-abu-dhabi/
  fetched: 2026-11-15
  quote: Today sees the launch of a new smartphone App and website designed to help
    people learn more about Abu Dhabi’s wildlife and report sightings to the Environment
    Agency – Abu Dhabi (EAD) .
- claim: Its citizen science feature takes users' photographs or videos with GPS locations,
    which EAD's experts review before adding new species or habitats to their database.
  url: https://www.mediaoffice.abudhabi/en/environment/new-app-to-track-sightings-of-species-launched-by-environment-agency-abu-dhabi/
  fetched: 2026-11-15
  quote: Using the exact GPS location of the observation, the EAD's team of experts
    will review each submission and add any new species or habitats to their database.
- claim: The database covers over 4,000 species of birds, mammals, reptiles, fish,
    plants and habitats, with sightings in the emirate.
  url: https://www.mediaoffice.abudhabi/en/environment/new-app-to-track-sightings-of-species-launched-by-environment-agency-abu-dhabi/
  fetched: 2026-11-15
  quote: People can also search the App's extensive database and learn more about
    over 4,000 species of birds, mammals, reptiles, fish, plants and habitats that
    EAD has already identified.
