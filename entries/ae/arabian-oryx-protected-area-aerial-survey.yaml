status: closed
summary: Closed EAD aerial count of oryx, sand gazelle and other species in the Arabian
  Oryx Protected Area, which reported in June 2021 a 22% oryx increase, with the herd
  at 946.
facts:
- claim: An EAD team counted Arabian oryx, sand gazelle and other species from the
    air across the Arabian Oryx Protected Area; the second comprehensive survey followed
    the first in March 2017.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-records-increase-in-the-number-of-arabian-oryx/
  fetched: 2026-11-15
  quote: A specialist team from EAD conducted an aerial survey study to count the
    number of Arabian Oryx, Sand Gazelle and other species within the borders of the
    largest natural reserve in the UAE, which spans an area of 6,000 square kilometers.
- claim: The survey carried out the previous November, reported in June 2021, found
    a 22% increase in oryx in the protected area, with the herd at 946.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-records-increase-in-the-number-of-arabian-oryx/
  fetched: 2026-11-15
  quote: The aerial survey for the Arabian Oryx Protected Area, carried out by the
    Environment Agency – Abu Dhabi (EAD) last November, revealed a 22% increase in
    the number of Oryx in the Protected Area
- claim: The survey also aimed to add information on the age and sex composition of
    the herd.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-records-increase-in-the-number-of-arabian-oryx/
  fetched: 2026-11-15
  quote: The survey also aims to increase the available information on the age and
    sex composition of the Arabian Oryx herd.
