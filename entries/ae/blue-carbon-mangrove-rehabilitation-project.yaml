summary: Project whose second phase planted more than 35,000 mangrove seeds by drone in the Mirfa lagoon
  with Distant Imagery, following a 2020 pilot that planted about a hectare.
facts:
- claim: The second phase planted more than 35,000 mangrove seeds in the Mirfa lagoon by drone, in partnership
    with Distant Imagery.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-engie-complete-phaseII-of-the-mangrove-rehabilitation-project/
  fetched: 2026-11-08
  quote: in partnership with Distant Imagery. Using highly innovative drone planting technology, more
    than 35,000 mangrove seeds were planted in the Mirfa lagoon in Abu Dhabi.
- claim: The 2020 pilot planted about a hectare of coastline by drone, and the seeds were monitored monthly
    for a year.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-engie-complete-phaseII-of-the-mangrove-rehabilitation-project/
  fetched: 2026-11-08
  quote: The mangrove seeds were then monitored monthly for growth over a year.
- claim: Drones were used to assess site conditions and geo-map the site.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-engie-complete-phaseII-of-the-mangrove-rehabilitation-project/
  fetched: 2026-11-08
  quote: They assisted in evaluating the above-ground environmental conditions, spatial arrangements,
    and ability to geo-map the site.
