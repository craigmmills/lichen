summary: Programme run by EAD, begun in November 2023, aiming to tag 100,000 native trees; EAD said in
  April 2024 it had tagged over 17,000 in the first three months.
facts:
- claim: EAD said in April 2024 that it aims to tag 100,000 native trees, including Ghaf, Samar and Sidr.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Tree-Tagging-Programme-2024
  fetched: 2026-11-08
  quote: The Agency aims to tag 100,000 native trees as part of the program, encompassing Ghaf, Samar,
    and Sidr trees
- claim: EAD said it had tagged over 17,000 trees in the first three months after the programme began
    in November 2023.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Tree-Tagging-Programme-2024
  fetched: 2026-11-08
  quote: Within the initial three months since the program's initiation in November 2023, EAD successfully
    tagged over 17,000 trees.
- claim: EAD said in April 2024 that field data would be collected with geographic data collection applications
    designed to transfer them to its environmental database.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Tree-Tagging-Programme-2024
  fetched: 2026-11-08
  quote: These applications are designed to facilitate the direct transfer of field data to the Environmental
    Agency - Abu Dhabi's (EAD) environmental database
