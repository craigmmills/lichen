summary: Mohamed bin Zayed fund project that aims to survey the gecko's UAE range,
  model its distribution and sequence its genome, after a 2022 expedition found it
  in five locations.
facts:
- claim: Aims to survey the gecko's range in the UAE, develop a species distribution
    model, and sequence and assemble its genome.
  url: https://www.speciesconservation.org/small-grant/emirati-leaf-toed-gecko/27924
  fetched: 2026-11-12
  quote: Specific goals include conducting comprehensive surveys of its distribution
    range in the UAE, developing a detailed species distribution model, sequencing
    and assembling the genome of A. caudivolvulus, analyzing genomic variability,
    and drafting conservation strategies.
- claim: A 2022 expedition found the geckos in five locations.
  url: https://www.speciesconservation.org/small-grant/emirati-leaf-toed-gecko/27924
  fetched: 2026-11-12
  quote: a 2022 expedition found the geckos in five locations despite heavy development
    in the area.
- claim: The grant page names Salvador Carranza of the Institute of Evolutionary Biology
    (CSIC-UPF), Barcelona, as the grant contact.
