summary: Project in which EAD and M42 partner to sequence genomes of important native plants at the Plant
  Genetic Resource Centre; 12 more species were chosen after the ghaf tree.
facts:
- claim: EAD formed a strategic partnership with M42 to sequence the genomes of important native species
    at its Plant Genetic Resource Centre.
  url: https://www.mediaoffice.abudhabi/ar/environment/environment-agency-abu-dhabi-partners-with-m42-to-conduct-plant-genome-sequencing-to-safeguard-native-species/
  fetched: 2026-11-08
  quote: أبرمت هيئة البيئة – أبوظبي شراكة استراتيجية مع شركة M42 ، الرائدة في مجال الصحة المدعومة بالتكنولوجيا
    المتقدمة والذكاء الاصطناعي وعلم الجينوم، لتنفيذ مشروع تسلسل الجينوم لأنواع محلية مهمة في مركز المصادر
    الوراثية النباتية التابع للهيئة
- claim: After sequencing the ghaf tree, 12 more plant species were chosen for sequencing.
  url: https://www.mediaoffice.abudhabi/ar/environment/environment-agency-abu-dhabi-partners-with-m42-to-conduct-plant-genome-sequencing-to-safeguard-native-species/
  fetched: 2026-11-08
  quote: وبعد النجاح في تسلسل وتحليل الحمض النووي لشجرة الغاف، الشجرة الوطنية الإماراتية، اُختِيرَ 12
    نوعاً نباتياً إضافياً لإجراء عمليات التسلسل
- claim: EAD says the project will form a genetic library to support research, conservation and innovation.
