summary: Digital platform, built by the Environment Agency Abu Dhabi and funded by
  Dolphin Energy, that consolidates restoration data from 19 active projects across
  Abu Dhabi using field surveys, satellite imagery and partner-reported data.
facts:
- claim: A digital platform launched by EAD to monitor, coordinate and advance mangrove
    restoration across Abu Dhabi.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-launches-mangrove-observatory-to-advance-mangrove-restoration-efforts/
  fetched: 2026-11-12
  quote: has launched the ADMI Mangrove Observatory, a digital platform developed
    to monitor, coordinate and advance mangrove restoration efforts across the emirate.
- claim: Consolidates restoration data from 19 active projects, drawing on field surveys,
    satellite imagery and partner-reported data.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-launches-mangrove-observatory-to-advance-mangrove-restoration-efforts/
  fetched: 2026-11-12
  quote: Drawing on field surveys, satellite imagery and partner-reported data, it
    provides up-to-date insights into restoration progress, growth rates and project
    performance across more than 1,775 hectares of restored habitat.
