summary: Closed study that NYU Abu Dhabi said in January 2026 was the first of its kind on both Emirati
  coasts, using CBASS to test hundreds of field coral colonies for heat tolerance.
facts:
- claim: In January 2026, NYU Abu Dhabi said the team had completed a first-of-its-kind study of reefs
    on both coasts of the Emirates measuring how corals cope with extreme heat.
  url: https://nyuad.nyu.edu/en/news/latest-news/science-and-technology/2026/january/nyuad-researchers-conduct-testing-identify-heat-resistant-corals.html
  fetched: 2026-11-08
  quote: has completed a first-of-its-kind study on reefs across both coasts of the Emirates to measure
    how corals cope with extreme heat.
- claim: Researchers used the Coral Bleaching Automated Stress System (CBASS) to test hundreds of coral
    colonies in the field.
  url: https://nyuad.nyu.edu/en/news/latest-news/science-and-technology/2026/january/nyuad-researchers-conduct-testing-identify-heat-resistant-corals.html
  fetched: 2026-11-08
  quote: Using a pioneering tool known as the Coral Bleaching Automated Stress System (CBASS), researchers
    "stress tested" hundreds of coral colonies directly in the field.
