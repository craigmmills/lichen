summary: Robot built by IFHC and Khalifa University of Science and Technology that,
  according to the Abu Dhabi Media Office, uses AI to recognise houbara behaviour
  in real time, shown at ADIHEX 2024.
facts:
- claim: Designed by IFHC and students at Khalifa University of Science and Technology;
    the Abu Dhabi Media Office says it uses AI to recognise houbara behaviour in real
    time.
  url: https://www.mediaoffice.abudhabi/en/environment/international-fund-for-houbara-conservation-and-khalifa-university-showcases-houbara-robot-at-abu-dhabi-international-hunting-and-equestrian-exhibition-2024/
  fetched: 2026-11-15
  quote: Designed in the form of a female houbara, its advanced AI features recognise
    houbara behaviour in real time and simulate such behaviour for communication and
    social interaction with live houbara.
- claim: Its sensors and cameras collect and broadcast data and images by satellite,
    to add to knowledge of the bird and help assess habitat suitability and vegetation
    cover.
  url: https://www.mediaoffice.abudhabi/en/environment/international-fund-for-houbara-conservation-and-khalifa-university-showcases-houbara-robot-at-abu-dhabi-international-hunting-and-equestrian-exhibition-2024/
  fetched: 2026-11-15
  quote: Sensors and cameras on the robot collect and broadcast data and images using
    satellites to increase knowledge of the bird and contribute to assessing habitat
    suitability and vegetation cover around the world.
- claim: Shown at the IFHC pavilion at ADIHEX 2024.
  url: https://www.mediaoffice.abudhabi/en/environment/international-fund-for-houbara-conservation-and-khalifa-university-showcases-houbara-robot-at-abu-dhabi-international-hunting-and-equestrian-exhibition-2024/
  fetched: 2026-11-15
  quote: The International Fund for Houbara Conservation (IFHC) and Khalifa University
    have showcased the Houbara Robot, Hubot, at the Abu Dhabi International Hunting
    and Equestrian Exhibition (ADIHEX) 2024
