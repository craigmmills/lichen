summary: Run by Emirates Nature-WWF with EAD and the Marine Research Foundation, this
  was one of two initiatives Emirates Nature-WWF says satellite tagged 126 turtles
  over 10 years.
facts:
- claim: Emirates Nature-WWF says that with EAD it undertook two flagship initiatives
    over 10 years to gather scientific information on the green turtle and the hawksbill
    turtle.
  url: https://emiratesnaturewwf.ae/page/conserving-marine-turtles-in-the-gulf
  fetched: 2026-11-15
  quote: In partnership with the Environment Agency – Abu Dhabi (EAD), we undertook
    two flagship marine conservation initiatives over 10 years to gather scientific
    information and improve our understanding of two enigmatic species native to the
    gulf – the Green Turtle and the Hawksbill Turtle.
- claim: Emirates Nature-WWF says it satellite tagged 126 turtles across these initiatives
    and collected data on migration routes, nesting sites, feeding grounds and behaviour.
  url: https://emiratesnaturewwf.ae/page/conserving-marine-turtles-in-the-gulf
  fetched: 2026-11-15
  quote: We satellite tagged 126 turtles, collected data around their migration routes,
    nesting sites, feeding grounds and behaviour; and developed a robust regional
    baseline of the ecological and conservational needs of turtles.
- claim: In May 2019, Gulf News reported that Emirates Nature-WWF, EAD and the Marine
    Research Foundation released results of research on the Gulf Green Turtle Conservation
    Project to mark World Turtle Day.
  url: https://gulfnews.com/uae/results-of-uae-turtle-tracking-project-revealed-1.64110370
  fetched: 2026-11-15
  quote: Emirates Nature-WWF and its partners Environment Agency-Abu Dhabi (EAD) and
    the Marine Research Foundation (MRF) revealed the results of their ongoing research
    on the Gulf Green Turtle Conservation Project.
