facts:
- claim: EAD has run a wildlife assessment and monitoring programme since 2011 and
    monitors the Arabian tahr with remote infra-red camera traps on Jabal Hafit.
  url: https://www.ead.gov.ae/en/Discover-Our-Biodiversity/Mammals/Arabian-Tahr
  fetched: 2026-11-15
  quote: EAD has been running a wildlife and assessment monitoring programme since
    2011. We monitor the Arabian Tahr through a system of remote infra-red camera
    traps on Jabal Hafit.
- claim: EAD recorded an Arabian caracal on Jabal Hafit National Park in 2019, the
    first since 1984.
  url: https://www.ead.gov.ae/en/Discover-Our-Biodiversity/Mammals/Arabian-Caracal
  fetched: 2026-11-15
  quote: In 2019, EAD recorded a sighting of the Arabian Caracal, last seen in 1984,
    on Jabal Hafit National Park, part of the Sheikh Zayed Protected Areas Network.
