summary: Abu Dhabi environment agency that runs the Enviro-portal and a global environmental data initiative,
  and launched an AI-based state of environment portal in November 2025.
facts:
- claim: Partnered with Dendra Co. on a programme assessing the state of natural terrestrial habitats
    across the emirate of Abu Dhabi.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: the Agency has partnered with Dendra Co. to execute a comprehensive programme aimed at assessing
    the state of natural terrestrial habitats across the emirate of Abu Dhabi
- claim: The Abu Dhabi Media Office says EAD established six marine reserves within the Sheikh Zayed Protected
    Areas Network to control fishing.
  url: https://www.mediaoffice.abudhabi/en/environment/hamdan-bin-zayed-visits-environment-agency-abu-dhabi-and-praises-its-efforts-to-enhance-abu-dhabis-global-leadership-in-fisheries-sustainability/
  fetched: 2026-11-08
  quote: establishing six marine reserves within the Sheikh Zayed Protected Areas Network to oversee and
    control fishing practices
- claim: Launched an AI-based portal for monitoring the state of the environment (ADSOEP) at COP30 in
    November 2025.
  url: https://www.mediaoffice.abudhabi/ar/environment/environment-agency-abu-dhabi-launches-abu-dhabi-state-of-environment-portal-utilising-ai-to-power-environmental-monitoring-and-reporting/
  fetched: 2026-11-08
  quote: أطلقت هيئة البيئة – أبوظبي البوابة الإلكترونية لرصد حالة البيئة باستخدام تقنيات الذكاء الاصطناعي
    (ADSOEP)
- claim: Says it regulates and enforces Abu Dhabi's environmental laws to protect biodiversity.
  url: https://www.ead.gov.ae/en/About-Us
  fetched: 2026-11-08
  quote: EAD regulates and enforces Abu Dhabi's environmental laws to protect biodiversity and preserve
    the quality of life for a sustainable future.
- claim: Lists setting up the Sheikh Zayed Protected Areas Network among its achievements.
  url: https://www.ead.gov.ae/en/About-Us
  fetched: 2026-11-08
  quote: Our proudest achievements include setting up the Sheikh Zayed Protected Areas Network
- claim: Says its Enviro-portal gives the public data on the distribution of flora, fauna, marine habitats
    and protected areas in the emirate.
  url: https://www.ead.gov.ae/en/About-Us/What-We-Do/Monitor-and-Manage
  fetched: 2026-11-08
  quote: Our Enviro-portal gives the public access to the latest environmental data and information on
    the geographic distribution of flora, fauna, marine habitats and protected areas in the Emirate of
    Abu Dhabi.
- claim: In August 2024 announced an AI-based research programme with Dendra Co. to assess natural terrestrial
    habitats across the emirate.
  url: https://www.ead.gov.ae/en/Media-Centre/News/Largest-AIbased-Research-Programme-to-Monitor
  fetched: 2026-11-08
  quote: the Agency has partnered with Dendra Co. to execute a comprehensive programme aimed at assessing
    the state of natural terrestrial habitats across the emirate of Abu Dhabi.
- claim: Says it built the research vessel Jaywun, equipped for surveys including deepwater habitat mapping,
    megafauna and invasive species surveys, with underwater drones, seabed acoustics and DNA analysis.
  url: https://www.ead.gov.ae/en/Research-Hub/Jaywun
  fetched: 2026-11-08
  quote: we built the most advanced marine scientific research vessel in the Middle East.
- claim: Lists DNA analysis among the vessel's research features.
  url: https://www.ead.gov.ae/en/Research-Hub/Jaywun
  fetched: 2026-11-08
  quote: Seabed Mapping and Acoustics Towed Video DNA Analysis
- claim: Said in 2023 that it began satellite tracking of Hawksbill and Green turtles in 1998.
  url: https://www.ead.gov.ae/en/Media-Centre/News/2023-Innovative-Solutions
  fetched: 2026-11-08
  quote: in 1998 the Agency began using remote satellite tracking devices to monitor Hawksbill and Green
    turtles
- claim: Said in 2023 that it used satellite technology to monitor migratory birds from 2005 and GSM tracking
    of Arabian Oryx from 2007.
  url: https://www.ead.gov.ae/en/Media-Centre/News/2023-Innovative-Solutions
  fetched: 2026-11-08
  quote: in 2005 EAD used satellite technology to monitor migratory birds and in 2007, the Agency introduced
    GSM technology to monitor and track the Arabian Oryx in the Um Al-Zumoul Reserve.
- claim: Said in 2023 that it aims to use AI across all aspects of its work, and that AI analytics can
    be applied to its 25-year archive of environmental data.
  url: https://www.ead.gov.ae/en/Media-Centre/News/2023-Innovative-Solutions
  fetched: 2026-11-08
  quote: EAD works according to a specific methodology, as part of its ambitious goals to use AI technologies
    across all aspects of its work
