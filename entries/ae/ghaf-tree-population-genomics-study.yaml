summary: First UAE population genomics study of Ghaf trees, run by EAD with ICBA specialists,
  announced 28 November 2025, using whole-genome re-sequencing and producing an interactive
  genomic map.
facts:
- claim: EAD and ICBA completed the first population genomics study of the Ghaf tree
    in the UAE, announced 28 November 2025.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-international-center-for-biosaline-agriculture-complete-uaes-1st-ghaf-tree-population-genomics-study/
  fetched: 2026-11-15
  quote: have completed the first-ever population genomics study of the Ghaf tree
    (Prosopis cineraria) in the country
- claim: Conducted by specialists at EAD's Plant Genetic Resources Centre and ICBA,
    evaluating whole-genome re-sequencing of Ghaf populations from across the UAE.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-international-center-for-biosaline-agriculture-complete-uaes-1st-ghaf-tree-population-genomics-study/
  fetched: 2026-11-15
  quote: The study, conducted by specialists at the Plant Genetic Resources Centre
    of the Environment Agency - Abu Dhabi and the International Center for Biosaline
    Agriculture, aimed to evaluate the whole-genome re-sequencing of Ghaf population
    collected from across the UAE.
- claim: The project developed digital tools with an interactive genomic map of genetic
    variation among the populations studied.
  url: https://www.mediaoffice.abudhabi/en/environment/environment-agency-abu-dhabi-and-international-center-for-biosaline-agriculture-complete-uaes-1st-ghaf-tree-population-genomics-study/
  fetched: 2026-11-15
  quote: Digital tools were also developed as part of this project, integrated with
    an interactive genomic map that illustrates the relationship between genetic variations
    among the Ghaf populations documented in the study.
