summary: First threat-status assessment of the emirate's terrestrial and marine species, launched
  by EAD in September 2021 with Provita and the IUCN Species Survival Commission, assessing
  244 species and placing 74 in threat categories.
facts:
- claim: EAD launched the first Abu Dhabi Red List of Wildlife Species, an assessment of the
    threat status of the emirate's terrestrial and marine species, in September 2021.
  url: https://www.mediaoffice.abudhabi/en/environment/the-environment-agency-abu-dhabi-launches-abu-dhabi-red-list-of-wildlife-species-report/
  fetched: 2026-11-15
  quote: The Environment Agency - Abu Dhabi (EAD) recently launched the first ever Abu Dhabi
    Red List of Wildlife Species , (AD-RLS) which is an assessment of the threat status of
    the emirate’s terrestrial and marine species.
- claim: 244 species were assessed and 74 placed in threat categories.
  url: https://www.mediaoffice.abudhabi/en/environment/the-environment-agency-abu-dhabi-launches-abu-dhabi-red-list-of-wildlife-species-report/
  fetched: 2026-11-15
  quote: Out of the 244 species assessed, 74 are under different threat categories, such as
    critically endangered, endangered, and vulnerable.
- claim: The assessments were made by EAD scientists with support from the IUCN Species Survival
    Commission and Provita.
  url: https://www.mediaoffice.abudhabi/en/environment/the-environment-agency-abu-dhabi-launches-abu-dhabi-red-list-of-wildlife-species-report/
  fetched: 2026-11-15
  quote: assessments were undertaken by a team of scientists from the Agency’s Terrestrial
    and Marine Biodiversity Sector, with support from IUCNs Species Survival Commission (SSC)
    and Provita.
