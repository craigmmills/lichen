summary: Project listed among Ocean Institute Projects, running from May 2025 to May
  2027, using eDNA metabarcoding of filtered seawater to characterise mobile marine
  vertebrates in UAE coastal waters.
facts:
- claim: Aims to characterise the mobile marine vertebrate fauna of UAE coastal waters
    using eDNA metabarcoding as a non-invasive monitoring tool.
  url: https://www.sorbonne.ae/projects/e-dna-based-monitoring-of-marine-fish-and-mammals-in-abu-dhabi
  fetched: 2026-11-15
  quote: This project aims to characterise the biodiversity of mobile marine vertebrate
    fauna — bony fish, cartilaginous fish, marine mammals… — in the coastal waters
    of the United Arab Emirates, using environmental DNA (eDNA) metabarcoding as a
    non-invasive monitoring tool.
- claim: Samples are taken by filtering 30 litres of sub-surface seawater along transects
    from small vessels, then analysed by metabarcoding.
  url: https://www.sorbonne.ae/projects/e-dna-based-monitoring-of-marine-fish-and-mammals-in-abu-dhabi
  fetched: 2026-11-15
  quote: Sampling is carried out at sea on small vessels, by filtering 30 litres of
    sub-surface seawater along linear transects at slow speed (2–5 knots).
- claim: Listed among Ocean Institute Projects, running from 1 May 2025 to 1 May 2027.
  url: https://www.sorbonne.ae/projects/e-dna-based-monitoring-of-marine-fish-and-mammals-in-abu-dhabi
  fetched: 2026-11-15
  quote: 01 May 2025 - 01 May 2027
- claim: A reference DNA barcode database of local species is envisaged.
  url: https://www.sorbonne.ae/projects/e-dna-based-monitoring-of-marine-fish-and-mammals-in-abu-dhabi
  fetched: 2026-11-15
  quote: Additionally, the construction of a reference DNA barcode database of local
    species is envisaged to improve the taxonomic identification of eDNA sequences.
