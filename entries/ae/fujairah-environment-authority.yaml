summary: Local government agency set up in 2018 that manages Fujairah's reserves including
  Wadi Wurayah, using volunteers and camera traps, and reportedly co-funded with Mashreq
  camera traps that recorded Arabian wildcats.
facts:
- claim: A local government agency set up by Emiri Decree No. 1 of 2018 to manage
    environmental affairs and the terrestrial and marine reserves of Fujairah.
  url: https://greatplacetowork.me/certified-organization/fujairah-environment-authority/
  fetched: 2026-11-12
  quote: The Environment Authority is a local government agency that was established
    by Emiri Decree No. (1) of 2018 issued on September 5, 2018
- claim: Manages Wadi Wurayah, the first protected mountain area in the UAE.
  url: https://www.emaratalyoum.com/life/four-sides/2024-09-07-1.1880524
  fetched: 2026-11-12
  quote: وادي الوريعة - أول منطقة جبلية محمية في الدولة - والذي تديره هيئة الفجيرة
    للبيئة
- claim: Its terrestrial biodiversity team works with volunteers and uses camera traps
    to record animals and birds in remote mountain areas; it presented owl monitoring
    in Wadi Wurayah at the 2025 World Conservation Congress.
  url: https://gulfnews.com/uae/environment/fujairah-highlights-biodiversity-achievements-at-abu-dhabis-world-conservation-congress-1.500302322
  fetched: 2026-11-12
  quote: The team works with local volunteers and uses camera traps to capture images
    of animals and birds in remote mountain areas.
- claim: The National reports that it co-funded, with Mashreq, the Emirates Nature-WWF
    camera traps in Wadi Wurayah that recorded Arabian wildcats.
  url: https://www.thenationalnews.com/news/uae/2026/06/06/elusive-arabian-wildcats-caught-on-camera-for-first-time-in-decade/
  fetched: 2026-11-12
  quote: Camera traps installed through an Emirates Nature-WWF initiative funded by
    Mashreq and Fujairah Environment Authority captured two individuals over two years.
