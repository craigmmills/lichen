id: electronic-timber-resource-management-system-georgia
kind: programme
name: Electronic Timber Resource Management System
also_known_as:
- მერქნული რესურსების მართვის ელექტრონული სისტემა
scope: ge
ai_label: conservation-tech
realms:
- land
countries:
- ge
status: active
summary: Active system for timber resource management, run by the National Forestry
  Agency; a ministerial order of 19 August 2026 approved its operating rules and repealed
  a 2014 instruction.
facts:
- claim: A ministerial order, No. 2-366 of 19 August 2026, approves the rules for
    operating the electronic timber resource management system and repeals a 2014
    instruction for it.
  url: https://legali.ge/law/6970718/
  fetched: 2026-11-12
  quote: 1. დამტკიცდეს თანდართული ,,მერქნული რესურსების მართვის ელექტრონული სისტემის
    წარმოების წესი“.
- claim: The National Forestry Agency's Forest Use Management Division prepares proposals
    for developing the electronic timber resource management system and helps its
    users.
  url: https://forestry.gov.ge/En/DepartmentDetails/28
  fetched: 2026-11-12
  quote: g) preparing proposals for the development of an electronic system of timber
    resource management, as well as for the development and/or amendment of new software
    modules;
- claim: The Department of Environmental Supervision, which reports cases of illegal
    logging and timber transport, links to the system from its site.
  url: https://des.gov.ge/En/
  fetched: 2026-11-12
  quote: Electronic Timber Resource Management System
- claim: An EU4Environment report on Georgia notes that an electronic system exists
    for timber resource management.
  url: https://www.eu4environment.org/app/uploads/2025/11/Admin-capacity-report-Georgia-final.pdf
  fetched: 2026-11-12
  quote: electronic system for timber resource management, fishing, but for pollution
    there is no electronic system,
