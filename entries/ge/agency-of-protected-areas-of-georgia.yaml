summary: Public-law agency for Georgia's protected areas, reported by CBW to have launched SMART Survey,
  a biodiversity monitoring module, with bear monitoring planned as a pilot in Machakhela National Park.
facts:
- claim: CBW reports that the agency launched SMART Survey, a biodiversity monitoring module of its SMART
    patrolling system, with bear monitoring planned for a pilot in Machakhela National Park.
  url: https://www.cbw.ge/economy/protected-areas-agency-launches-implementation-of-smart-survey-a-new-function-of-the-smart-patrolling-monitoring-system
  fetched: 2026-11-09
  quote: Protected Areas Agency Launches Implementation of SMART Survey, a New Function of the SMART Patrolling
    Monitoring System
- claim: CBW reports that bear monitoring will be piloted with SMART Survey in Machakhela National Park.
  url: https://www.cbw.ge/economy/protected-areas-agency-launches-implementation-of-smart-survey-a-new-function-of-the-smart-patrolling-monitoring-system
  fetched: 2026-11-09
  quote: The pilot location for the project has been identified as Machakhela National Park , where, at
    the initial stage, bear monitoring will be piloted using SMART Survey.
- claim: Names itself the Agency of Protected Areas, a legal entity of public law (სსიპ).
  url: https://apa.gov.ge/en/
