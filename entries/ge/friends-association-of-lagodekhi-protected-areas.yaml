summary: Non-governmental organisation that was grantee of two completed Small Grants
  Programme projects in 2014 and 2015 at Lagodekhi, one covering biodiversity and
  poacher monitoring with online maps.
facts:
- claim: An EU page dated 3 November 2016 named the NGO Friends of Lagodekhi Protected
    Areas in partnership with the protected area administration for fencing a dendrological
    park.
  url: https://www.eeas.europa.eu/node/13965_en
  fetched: 2026-11-12
  quote: NGO “Friends of Lagodekhi Protected areas” in partnershio with the administration
    of Lagodekhi Protected Areas
- claim: Was grantee of a Small Grants Programme project to develop a protection and
    research monitoring programme for Lagodekhi Protected Areas, which ran from July
    2014 to February 2015 and was satisfactorily completed.
  url: https://www.sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=22219&view=projectdetail
  fetched: 2026-11-12
  quote: Support Biodiversity conservation of Lagodekhi Protected Areas through Development
    of Protection and Research - Monitoring Program
- claim: The project set out to introduce biodiversity and poacher monitoring with
    hot spots, mapping, interactive maps and online monitoring.
  url: https://www.sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=22219&view=projectdetail
  fetched: 2026-11-12
  quote: introduction of modern system of monitoring biodiversity and poachers through
    introduction of "hot spots", mapping, preparation and sharing of interactive maps
    and online monitoring
- claim: Was grantee of the Small Grants Programme project at Lagodekhi and the Ninigori
    community, which ran from February to September 2014 and was satisfactorily completed;
    the page names the association, community and protected area administration as
    implementers.
  url: https://www.sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=20827&view=projectdetail
  fetched: 2026-11-12
  quote: 'There are 3 entities involved in project implementation: Ninigori community,
    administration of Lagodekhi protected areas and our organization.'
