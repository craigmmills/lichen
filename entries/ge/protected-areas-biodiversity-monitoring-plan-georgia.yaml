id: protected-areas-biodiversity-monitoring-plan-georgia
kind: programme
name: Biodiversity monitoring plan for Georgia's protected areas, 2020 to 2029
scope: ge
ai_label: conservation-tech
realms:
- land
- freshwater
countries:
- ge
status: active
summary: Biodiversity monitoring plan for 2020 to 2029, built by the environment ministry
  and run by the Agency of Protected Areas, reported in July 2026 to cover 11 protected
  areas.
facts:
- claim: In July 2026, the agency said its standardised biodiversity monitoring system
    had provided systematic data collection and analysis across protected areas for
    five years.
  url: https://www.apa.gov.ge/En/Media/InnerNews?newsId=71
  fetched: 2026-11-12
  quote: The standardized biodiversity monitoring system has provided systematic data
    collection and analysis across protected areas for five years now.
- claim: In July 2026, the agency reported research and monitoring under the plan
    in 11 protected areas on selected key indicators, including rare and vulnerable
    species.
  url: https://www.apa.gov.ge/En/Media/InnerNews?newsId=71
  fetched: 2026-11-12
  quote: As part of the monitoring plan, biodiversity research and monitoring are
    ongoing across 11 protected areas
- claim: The 10-year plan for 2020 to 2029 was updated, with revised priority indicators
    and new protected areas added.
  url: https://www.apa.gov.ge/En/Media/InnerNews?newsId=71
  fetched: 2026-11-12
  quote: Based on this five-year experience, the 10-year plan for 2020–2029 was updated
- claim: UNDP said in March 2022 that the plan was developed by the environment ministry
    through its Agency of Protected Areas and its Biodiversity and Forestry Department,
    and that the monitoring covers twelve protected areas through 2030.
  url: https://www.undp.org/georgia/press-releases/biodiversity-monitoring-helps-protect-endangered-species-georgia
  fetched: 2026-11-12
  quote: It is aligned with a 10-year biodiversity monitoring plan, developed by Georgia’s
    Ministry of Environmental Protection and Agriculture through its Agency of Protected
    Areas and the Biodiversity and Forestry Department.
- claim: In March 2022, UNDP reported regular observation of species including the
    East Caucasian tur, bezoar goat, chamois, red deer, vultures and brown trout,
    alongside other animals and plants, in the twelve largest protected areas.
  url: https://www.undp.org/georgia/press-releases/biodiversity-monitoring-helps-protect-endangered-species-georgia
  fetched: 2026-11-12
  quote: are under regular observation in Georgia’s twelve largest protected areas
