summary: Agency reporting up to 200 seawater and seabed samples from Gonio to Anaklia
  in October 2021, running an EU-funded Black Sea project planning AI-based forecasting.
facts:
- claim: In October 2021, the agency reported that its specialists had taken up to
    200 seawater and seabed samples in the Gonio to Anaklia waters.
  url: https://nea.gov.ge/En/News/72
  fetched: 2026-11-12
  quote: Up to 200 samples of sea water and seabed were taken by the National Environmental
    Agency specialists using modern standards, specialized equipment.
- claim: The studies measure physical, chemical and biological parameters, including
    planktonic and seabed organisms.
  url: https://nea.gov.ge/En/News/72
  fetched: 2026-11-12
  quote: Studies determine the physical, chemical and biological parameters of the
    sea, as well as the qualitative and quantitative parameters of planktonic and
    seabed organisms.
- claim: In January 2026, it reported implementing the Black Sea Smart Marine Environmental
    Outcomes System project with Turkish and Romanian partners and EU funding, with
    planned use of AI-based forecasting and autonomous surface vehicles.
  url: https://nea.gov.ge/En/News/2363
  fetched: 2026-11-12
  quote: This innovative environmental monitoring project is designed to improve the
    ecology and sustainability of the Black Sea by utilizing cutting-edge, AI-based
    forecasting technologies
