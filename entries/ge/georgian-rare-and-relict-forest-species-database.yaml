status: closed
summary: Closed, SRCA-run and Rustaveli-funded project studying 18 rare and relict forest
  species, whose leader reports creating a database in Georgian and English and compiling
  distribution maps.
facts:
- claim: The SRCA reports the project created an electronic database of rare and relict plants
    of Georgia's forest ecosystems.
  url: https://srca.gov.ge/en/news/26712
  fetched: 2026-11-12
  quote: The goal of the research was to study rare and relict plants distributed in the country's
    forest ecosystems and create an electronic database about them.
- claim: The project studied 18 rare and relict species.
  url: https://srca.gov.ge/en/news/26712
  fetched: 2026-11-12
  quote: Within the framework of the project, 18 rare and relict species were studied
- claim: Its leader says the team inventoried the species, built a database in Georgian and
    English and compiled distribution maps.
  url: https://srca.gov.ge/en/news/26712
  fetched: 2026-11-12
  quote: We have conducted an inventory of such species and created a database in Georgian
    and English. In addition, distribution maps have been compiled
- claim: The SRCA's news item of 23 October 2025 reports the project's summary event and says
    the database will be put on Global Forest Watch.
  url: https://srca.gov.ge/en/news/26712
  fetched: 2026-11-12
  quote: The database will soon be available on the international platform — Global Forest
    Watch.
- claim: An Austrian Forest Research Center genomics laboratory head took part as part of
    an international partnership.
  url: https://srca.gov.ge/en/news/26712
  fetched: 2026-11-12
  quote: As part of the international partnership, Dr. Berthold Heinze, head of the Genomics
    Laboratory at the Austrian Forest Research Center, was involved in the project.
