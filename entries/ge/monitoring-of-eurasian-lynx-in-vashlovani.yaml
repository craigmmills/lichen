summary: A closed NACRES monitoring report, following a February 2022 agreement with
  the Caucasus Nature Fund, which identified 11 lynx from camera traps and estimated
  9 to 14 in Vashlovani protected areas.
facts:
- claim: The report was prepared by NACRES.
  url: https://www.nacres.org/files/pdf/Species/Lynx%20population%20assessment_English_2023.pdf
  fetched: 2026-11-15
  quote: 'Prepared by: NACRES – Centre for Biodiversity Conservation and Research'
- claim: The monitoring followed an agreement between the Caucasus Nature Fund and
    NACRES of 7 February 2022.
  url: https://www.nacres.org/files/pdf/Species/Lynx%20population%20assessment_English_2023.pdf
  fetched: 2026-11-15
  quote: between CNF and NACRES on the 7 th February, 2022 for conducting the Eurasian
    lynx monitoring
- claim: During the second field visit, which began on 25 March 2022, the team collected
    103,755 images from 74 operational cameras.
  url: https://www.nacres.org/files/pdf/Species/Lynx%20population%20assessment_English_2023.pdf
  fetched: 2026-11-15
  quote: We collected a total of 103,755 images (449 GB) from 74 operational cameras
- claim: From the 2022 camera trap data, the team identified 11 lynx across the Vashlovani
    and Chachuna study areas.
  url: https://www.nacres.org/files/pdf/Species/Lynx%20population%20assessment_English_2023.pdf
  fetched: 2026-11-15
  quote: Based on the camera trap data we identified 11 individuals in study area.
- claim: The report estimates 9 to 14 lynx in Vashlovani protected areas from the
    2022 census.
  url: https://www.nacres.org/files/pdf/Species/Lynx%20population%20assessment_English_2023.pdf
  fetched: 2026-11-15
  quote: We have 9-14 individuals in Vashlovani PA with density of 2.25 - 3.52 per
    100 km2.
