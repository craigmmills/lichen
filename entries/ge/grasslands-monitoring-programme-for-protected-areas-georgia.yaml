summary: An active programme commissioned by the Caucasus Nature Fund to set a grassland
  baseline, with the Kazbegi assessment planned to produce a habitat distribution
  map and a pasture biodiversity database.
facts:
- claim: The Grasslands Monitoring Programme for Protected Areas was commissioned
    by the Caucasus Nature Fund to establish a baseline for understanding and managing
    grassland ecosystems.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: The Grasslands Monitoring Programme for Protected Areas, commissioned by
    CNF aims to establish a baseline in order to better understand and manage these
    ecosystems.
- claim: NACRES says it has carried out conservation research and monitoring of grasslands
    across Georgia for 15 years.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: NACRES has been carrying out conservation research and monitoring of these
    significant ecosystems throughout Georgia over the last 15 years.
- claim: Earlier years covered Borjomi, Javakheti, Vashlovani, Lagodekhi and Algeti
    national parks.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: This year, monitoring will take place in Kazbegi National Park, while previous
    years have seen evaluations of Borjomi, Javakheti, Vashlovani, Lagodekhi and Algeti
    National Parks.
- claim: The Kazbegi assessment is to produce a distribution map of grassland habitats
    and a database of pasture biodiversity, fodder quantity and ecological status.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: a data base that will include pastures biodiversity, fodder quantity and
    ecological status
- claim: The data are to be used by the Agency of Protected Areas, protected area
    managers and researchers.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: The data collected by the monitoring project will be used by the APA, PA
    managers, and on-the-ground researchers.
- claim: The project page gives its status as active.
  url: https://www.nacres.org/projects/1/_en/
  fetched: 2026-11-15
  quote: 'Project status: Active'
