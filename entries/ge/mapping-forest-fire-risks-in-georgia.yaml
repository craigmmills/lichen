summary: An active NACRES project, funded by the US Forest Service, aiming to create
  a forest fire risk model, piloted in Borjomi National Park from 2021 and since expanded
  to three other protected areas.
facts:
- claim: The project aims to create a forest fire risk model.
  url: https://www.nacres.org/projects/3/
  fetched: 2026-11-15
  quote: The goal is to create a forest fire risk model which would provide all of
    the necessary information needed to make critical decisions regarding future wildfires.
- claim: The work was piloted in Borjomi National Park from 2021 and expanded to Algeti
    National Park, Vashlovani Protected Area and Tusheti Protected Area.
  url: https://www.nacres.org/projects/3/
  fetched: 2026-11-15
  quote: Beginning in 2021, the program heads piloted their work in Borjomi National
    Park
- claim: The team identifies sources of fire fuel and their density in each region.
  url: https://www.nacres.org/projects/3/
  fetched: 2026-11-15
  quote: The team is identifying sources of fire fuel (fallen branches, leaf litter,
    tree needles) and its density in each region
- claim: The project page gives its status as active.
  url: https://www.nacres.org/projects/3/
  fetched: 2026-11-15
  quote: 'Project status: Active'
