facts:
- claim: NACRES' Conservation Research Programme Team conducted the first radiotelemetry
    study of East Caucasian tur in Lagodekhi Nature Reserve.
  url: https://www.nacres.org/home/2/_en/
  fetched: 2026-11-15
  quote: conducted the very first radiotelemetry study of East Caucasian tur (Capra
    cylindricornis) in Lagodekhi Nature Reserve
- claim: The first tur was captured and fitted with a GPS satellite collar on 12 March
    2019.
  url: https://www.nacres.org/home/2/_en/
  fetched: 2026-11-15
  quote: a young male tur that was named Khareba was captured and successfully equipped
    with a GPS satellite collar
- claim: The team followed the tagged animals' movements, receiving up to six locations
    a day until June 2022.
  url: https://www.nacres.org/home/2/_en/
  fetched: 2026-11-15
  quote: receiving up to six location per day till June 2022
- claim: The home ranges and daily distances are used to estimate the tur population
    in Lagodekhi through the double observer field technique.
  url: https://www.nacres.org/home/2/_en/
  fetched: 2026-11-15
  quote: estimating the East Caucasian tur population numbers in Lagodekhi Nature
    Reserve through the double observer field technique
- claim: The study was financially supported by the Caucasus Nature Fund, the Transboundary
    Joint Secretariat and the WWF Caucasus Programme Office.
  url: https://www.nacres.org/home/2/_en/
