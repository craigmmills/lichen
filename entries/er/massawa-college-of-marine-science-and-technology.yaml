summary: Public Eritrean Massawa college created in 2006 which a 2019 national report
  says established reef monitoring sites, surveyed bleaching and jointly conducted
  preliminary surveys with the marine resources ministry.
facts:
- claim: The International Association of Universities' database lists the College
    of Marine Sciences and Technology (COMSAT) in Massawa, Eritrea, as created in
    2006.
  url: https://whed.net/institutions/IAU-003016
  fetched: 2026-11-13
  quote: Created 2006.
- claim: The same database gives its institution funding as public.
  url: https://whed.net/institutions/IAU-003016
  fetched: 2026-11-13
  quote: Institution Funding Public
- claim: The same database lists marine biology and marine science and oceanography
    among its fields of study.
  url: https://whed.net/institutions/IAU-003016
  fetched: 2026-11-13
  quote: 'Fields of study: Aquaculture, Biotechnology, Fishery, Marine Biology, Marine
    Engineering, Marine Science and Oceanography'
- claim: Eritrea's sixth national report to the Convention on Biological Diversity
    (2019) says the college established monitoring sites in four reefs around Massawa
    and one reef in the Dahlak Archipelago.
  url: https://www.cbd.int/doc/nr/nr-06/er-nr-06-en.pdf
  fetched: 2026-11-13
  quote: Massawa College of Marine Science and Technology established monitoring sites
    in four reefs
- claim: Eritrea's 2019 sixth national report to the Convention on Biological Diversity
    reported that the college conducted coral bleaching surveys during the summer
    months.
  url: https://www.cbd.int/doc/nr/nr-06/er-nr-06-en.pdf
  fetched: 2026-11-13
  quote: COMSAT conducts survey of coral bleaching during the summer months
- claim: The same report says the Ministry of Marine Resources and the college conducted
    preliminary coral reef surveys in the last three years before the report.
  url: https://www.cbd.int/doc/nr/nr-06/er-nr-06-en.pdf
  fetched: 2026-11-13
  quote: In the last three years, the MoMR and COMSAT conducted preliminary surveys
- claim: Eritrea's updated National Biodiversity Strategy and Action Plan for 2026
    to 2030, as hosted on FAOLEX, refers to surveys conducted by the Ministry of Marine
    Resources and the Massawa College of Marine Science and Technology.
  url: https://faolex.fao.org/docs/pdf/eri243394.pdf
  fetched: 2026-11-13
