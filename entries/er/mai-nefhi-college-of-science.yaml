summary: Eritrean college which, with the Ministry of Marine Resources, is assessing
  coral reefs and has started a coral monitoring programme, using line transect surveys
  to measure bleached coral, according to the 2026 to 2030 biodiversity strategy.
facts:
- claim: Eritrea's updated National Biodiversity Strategy and Action Plan for 2026
    to 2030, as hosted on FAOLEX, says the Ministry of Marine Resources, in collaboration
    with the college, is assessing coral reefs.
  url: https://faolex.fao.org/docs/pdf/eri243394.pdf
  fetched: 2026-11-13
  quote: MoMR in col laboration with Mai Nefhi College of Science is assessing the
    extent of coral
- claim: The same document says the team used line transect surveys to quantify the
    percentage of bleached coral.
  url: https://faolex.fao.org/docs/pdf/eri243394.pdf
