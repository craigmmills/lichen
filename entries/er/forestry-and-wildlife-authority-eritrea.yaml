summary: An active Eritrean authority reported in 2022 to monitor wildlife every three months, and credited
  in 2019 with research that led to the 2016 rediscovery of the Eritrea side-neck turtle.
facts:
- claim: A 2022 UNDP terminal evaluation reported that the authority conducted wildlife monitoring every
    three months.
  url: https://erc.undp.org/evaluation/documents/download/21867
  fetched: 2026-11-12
  quote: The Forestry and Wildlife Authority conducts wildlife monitoring every three months.
- claim: A 2024 news report says the authority reviewed its 2024 activities, including seedlings planted
    and the condition of reserved lands.
  url: https://capitalethiopia.com/2024/09/11/eritrea-meeting-on-implementation-of-development-programs/
  fetched: 2026-11-12
  quote: The Forestry and Wildlife Authority held a meeting on 9 September to review the implementation
    of 2024 activities and discuss development programs for 2025.
- claim: Re:wild reported in 2019 that research between the authority and the University of California,
    Berkeley led to the rediscovery of the Eritrea side-neck turtle in 2016.
  url: https://www.rewild.org/blog/eritrean-gazelles-once-lost-and-now-found-in-their-namesake-country
  fetched: 2026-11-12
  quote: In 2016, the ongoing research between Eritrea’s forestry and wildlife authority and the University
    of California, Berkeley, led to the rediscovery of the Eritrea Side-Neck Turtle
