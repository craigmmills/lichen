summary: Public water body for La Réunion that, as contracting authority, tendered
  and awarded river and reef monitoring contracts in 2021 to 2024, and reports a 2024
  reef campaign at 18 stations.
facts:
- claim: The EU tender notice of March 2021 gives the Office de l'eau Réunion, as
    contracting authority, the type regional or local agency or office.
  url: https://ted.europa.eu/en/notice/137711-2021/pdf
  fetched: 2026-11-15
  quote: Regional or local agency/office
- claim: The BOAMP award notice of January 2024 gives its legal form as a body governed
    by public law, controlled by a local authority.
  url: https://www.boamp.fr/telechargements/FILES/PDF/2024/01/24-7855.pdf
  fetched: 2026-11-15
  quote: Organisme de droit public, contrôlé par une autorité locale
- claim: In January 2024 it awarded the contract for the 2024 monitoring of hard-substrate
    benthos on the outer slopes of La Réunion's reefs to GIE MAREX.
  url: https://www.boamp.fr/telechargements/FILES/PDF/2024/01/24-7855.pdf
  fetched: 2026-11-15
  quote: durs sur les pentes externes des récifs du littoral réunionnais au titre
    du réseau de contrôle de
- claim: The EU contract award notice of August 2023 gives its postal address as 33
    impasse Henri Guillaumet, Bois de Nèfles, Saint-Paul, La Réunion.
  url: https://ted.europa.eu/en/notice/508704-2023/pdf
  fetched: 2026-11-15
  quote: 'Postal address: 33 impasse Henri Guillaumet, Bois de Nèfles'
- claim: In 2023 it awarded contracts for the monitoring of fish and macrocrustaceans
    and of diatoms in the rivers of La Réunion, including data banking and analysis.
  url: https://ted.europa.eu/en/notice/508704-2023/pdf
  fetched: 2026-11-15
  quote: suivi des elements biologiques des rivieres du bassin reunion
- claim: Its 2021 tender was for the monitoring of benthic macroinvertebrates in the
    rivers of the Réunion basin, covering field sampling, identification, data banking
    and analysis.
  url: https://ted.europa.eu/en/notice/137711-2021/pdf
  fetched: 2026-11-15
  quote: Suivi des macroinvertébrés benthiques des rivières du bassin Réunion
- claim: Its December 2024 newsletter says the state of the four reef water bodies
    is assessed through monitoring at 18 stations, in a campaign run in 2024.
  url: https://eaureunion.fr/fileadmin/user_upload/Chroniques/2024/24.12.06_CHRONIQUES_de_L_EAU_144.pdf
  fetched: 2026-11-15
  quote: est évalué via le suivi de 18 stations
- claim: The newsletter is published by the Office de l'eau Réunion.
  url: https://eaureunion.fr/fileadmin/user_upload/Chroniques/2024/24.12.06_CHRONIQUES_de_L_EAU_144.pdf
