summary: Botanical conservatory in Saint-Leu, La Réunion, with association status;
  a July 2025 opinion covers its accreditation for La Réunion, Mayotte and the Îles
  Éparses and says it is to join the Lobelia data system.
facts:
- claim: The CNPN's July 2025 opinion says the Conservatoire botanique national de
    Mascarin has the status of an association.
  url: https://www.avis-biodiversite.developpement-durable.gouv.fr/IMG/pdf/2025-16-avis_cnpn_projet_arrete_prorogation_agrement_cbn_mascarin-3.pdf
  fetched: 2026-11-15
  quote: Le CBN de Mascarin est de statut associatif.
- claim: The same opinion says its accreditation covers La Réunion, Mayotte and the
    Îles Éparses, and gives a favourable opinion on extending it to 31 December 2026.
  url: https://www.avis-biodiversite.developpement-durable.gouv.fr/IMG/pdf/2025-16-avis_cnpn_projet_arrete_prorogation_agrement_cbn_mascarin-3.pdf
  fetched: 2026-11-15
  quote: composé de la région de la Réunion, du département de Mayotte, et des Îles
    Éparses
- claim: The same opinion says it is to join Lobelia, a data information system shared
    among botanical conservatories.
  url: https://www.avis-biodiversite.developpement-durable.gouv.fr/IMG/pdf/2025-16-avis_cnpn_projet_arrete_prorogation_agrement_cbn_mascarin-3.pdf
  fetched: 2026-11-15
  quote: du CBN de Mascarin au projet Lobelia
- claim: The national action plan for plant species on the brink of extinction in
    La Réunion (2021 to 2030) cites Mascarine Cadetiana III as a work of the CBN-CPIE
    Mascarin, Saint-Leu (Réunion), and counts known wild populations from it.
  url: https://www.reunion.developpement-durable.gouv.fr/IMG/pdf/pna_1_especes-vegetales-bord-extinction-reunion.pdf
  fetched: 2026-11-15
  quote: Mascarine-Cadetiana (CBN-CPIE Mascarin [Picot F. (coord. principal)] 2016).
- claim: The plan lists the conservatory in Saint-Leu, La Réunion.
  url: https://www.reunion.developpement-durable.gouv.fr/IMG/pdf/pna_1_especes-vegetales-bord-extinction-reunion.pdf
  fetched: 2026-11-15
  quote: l’Environnement de Mascarin, Saint-Leu (Réunion).
- claim: The 2021–2030 plan includes processing field data and storing them in Mascarine
    Cadetiana as a planned step.
  url: https://www.reunion.developpement-durable.gouv.fr/IMG/pdf/pna_1_especes-vegetales-bord-extinction-reunion.pdf
  fetched: 2026-11-15
  quote: traitement des données de terrain et capitalisation dans Mascarine Cadetiana.
