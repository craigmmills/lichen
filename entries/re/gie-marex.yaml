summary: Saint-Leu company that won the January 2024 contract to monitor hard-substrate
  benthos on the outer reef slopes of La Réunion, and is credited with photographs
  in a December 2024 Office de l'eau newsletter.
facts:
- claim: The BOAMP award notice of January 2024 names GIE MAREX as the winner of the
    contract for monitoring hard-substrate benthos in the marine environment.
  url: https://www.boamp.fr/telechargements/FILES/PDF/2024/01/24-7855.pdf
  fetched: 2026-11-15
  quote: 'Nom officiel : GIE MAREX'
- claim: The contract covers the 2024 monitoring of hard-substrate benthos on the
    outer slopes of La Réunion's reefs under the surveillance control network (RCS).
  url: https://www.boamp.fr/telechargements/FILES/PDF/2024/01/24-7855.pdf
  fetched: 2026-11-15
  quote: SUIVI DU BENTHOS DE SUBSTRATS DURS EN MILIEU MARIN
- claim: The same notice gives its town as Saint-Leu, La Réunion.
  url: https://www.boamp.fr/telechargements/FILES/PDF/2024/01/24-7855.pdf
  fetched: 2026-11-15
  quote: 'Ville : SAINT-LEU'
- claim: The Office de l'eau Réunion's December 2024 newsletter on the 2024 reef monitoring
    credits photographs to MAREX.
  url: https://eaureunion.fr/fileadmin/user_upload/Chroniques/2024/24.12.06_CHRONIQUES_de_L_EAU_144.pdf
