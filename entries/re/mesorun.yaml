summary: Closed project, run by Vie Océane, that aimed to inventory fauna of the mesophotic
  zone around La Réunion, with 50,000 euros for 14 months under the first LIFE4BEST
  call.
facts:
- claim: In September 2020, MesoRun aimed to make a non-exhaustive faunal inventory
    of the mesophotic zone at selected sites around La Réunion.
  url: https://iucn.org/fr/news/protected-areas/202009/plongee-dans-les-ecosystemes-coralliens-mesophotiques-ecm
  fetched: 2026-11-14
  quote: le projet MesoRun vise à réaliser un inventaire faunistique non exhaustif
    en zone mésophotique sur certains sites de l’île
- claim: Three dives took place in August 2020 on the island's western slopes at 85
    and 90 metres.
  url: https://iucn.org/fr/news/protected-areas/202009/plongee-dans-les-ecosystemes-coralliens-mesophotiques-ecm
  fetched: 2026-11-14
  quote: Trois plongées ont déjà eu lieu en aout 2020 sur les pentes Ouest de La Réunion,
    à 85 et 90 mètres de profondeur.
- claim: The September 2020 article said all data collected by the project would be
    banked in public databases with open, shared access.
  url: https://iucn.org/fr/news/protected-areas/202009/plongee-dans-les-ecosystemes-coralliens-mesophotiques-ecm
  fetched: 2026-11-14
  quote: L’ensemble des données collectées par le projet sera bancarisé au sein de
    bases de données publiques garantissant un accès ouvert et partagé.
- claim: The project had 50,000 euros for 14 months and was one of 18 projects selected
    in May 2020 under the first LIFE4BEST call.
  url: https://iucn.org/fr/news/protected-areas/202009/plongee-dans-les-ecosystemes-coralliens-mesophotiques-ecm
  fetched: 2026-11-14
  quote: Doté d’un financement de 50,000 € pour une durée de 14 mois, le projet MesoRun
    est l’un des 18 projets sélectionnés en mai 2020 suite au premier appel à propositions
    LIFE4BEST.
