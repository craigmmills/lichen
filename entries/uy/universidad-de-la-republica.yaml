summary: Uruguay's main higher education and research institution, by its own description, whose researchers
  took part in bat call identification, DNA barcoding, participatory monitoring and environmental DNA
  work.
facts:
- claim: Mongabay reported in October 2018 that a team led by Universidad de la República biologist Germán
    Botto had built a machine learning algorithm to identify bat species from their calls.
  url: https://news.mongabay.com/2018/10/decoding-the-language-of-bats-key-for-their-conservation/
  fetched: 2026-11-08
  quote: says team leader biologist Germán Botto of the Universidad de la República de Uruguay
- claim: Mauricio Bonifacino of its Facultad de Agronomía shared responsibility for the Usina de códigos
    de barra de la vida–Uruguay DNA barcoding project.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/nuevos-conjuntos-datos-adn-fortalecen-conocimiento-sobre-biodiversidad
  fetched: 2026-11-08
  quote: con la responsabilidad compartida con Mauricio Bonifacino de la Facultad de Agronomía, Udelar
- claim: Its teachers and graduates worked with JULANA on the Paso Centurión participatory wildlife monitoring.
  url: https://journal.szu.org.uy/index.php/Bol_SZU/article/download/23/16/47
  fetched: 2026-11-08
  quote: desarrollado por la Asociación Civil JULANA, en conjunto con docentes y egresados de la Universidad
    de la República
- claim: Researchers of its Facultad de Ciencias marine science laboratory took part with IIBCE in Uruguay's
    first environmental DNA study of beach biodiversity.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/exploramos-biodiversidad-invisible-playas-uruguayas-traves-del-adn-ambiental
  fetched: 2026-11-08
  quote: Un equipo del Instituto de Investigaciones Biológicas Clemente Estable (IIBCE) y la Facultad
    de Ciencias (Universidad de la República)
- claim: An open dataset of grassland vegetation surveys across Uruguay from 2001 to 2009 says the data
    were gathered in projects of the university.
  url: https://api.gbif.org/v1/dataset/3ff25f75-662f-4069-b201-a0ce809b64a5
  fetched: 2026-11-08
  quote: La información fue obtenida mediante censos fitosociológicos, en el marco de proyectos de la
    Universidad de la República.
- claim: Describes itself as the main institution of higher education and research in Uruguay.
  url: https://udelar.edu.uy
  fetched: 2026-11-08
  quote: La Universidad de la República (Udelar) es la principal institución de educación superior e investigación
    del Uruguay.
- claim: Describes itself as an autonomous, co-governed body established in the Constitution of the Republic.
  url: https://udelar.edu.uy
  fetched: 2026-11-08
  quote: Somos un ente autónomo cogobernado consagrado como tal en la Constitución de la República.
- claim: The GBIF publisher record of its Centro Universitario Regional del Este says the centre's research
    groups conduct long-term ecological studies and produce datasets across ecosystems in eastern Uruguay.
  url: https://api.gbif.org/v1/organization/9240c810-0769-4bb4-a37d-835409e23a4a
  fetched: 2026-11-08
  quote: Through its coastal-marine, terrestrial, and freshwater research groups, CURE conducts long-term
    ecological studies
