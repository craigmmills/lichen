summary: NGO working to restore people's emotional bond with nature, which says it has run camera-trap
  mammal surveys in the Sierras de Rocha since 2015 and in Río Negro since 2023.
facts:
- claim: Its GBIF publisher record says it has run continuous camera-trap mammal surveys in the Sierras
    de Rocha since 2015, on its own properties and those of neighbours.
