facts:
- claim: Describes itself as a collaborative project that aims to improve knowledge of Uruguay's biodiversity
    by making open data available.
  url: https://biodiversidata.org/
  fetched: 2026-11-08
  quote: Biodiversidata es un proyecto colaborativo que busca mejorar el conocimiento sobre la biodiversidad
    en el Uruguay a través de la disponibilización de datos abiertos
- claim: Says it helps collect, standardise and publish biodiversity data derived from scientific research.
  url: https://biodiversidata.org/
  fetched: 2026-11-08
  quote: Biodiversidata facilita la recopilación, estandarización y publicación de datos de biodiversidad
    derivados de la investigación científica.
- claim: Its GBIF publisher record describes it as the Uruguayan Consortium of Biodiversity Data, a collaborative
    research community.
  url: https://api.gbif.org/v1/node/a3ceb6dd-0a65-4f30-a385-30f6937c2096/organization?limit=100
  fetched: 2026-11-08
  quote: Biodiversidata (the Uruguayan Consortium of Biodiversity Data) is a collaborative research community
    with the aim of improving Uruguay’s biodiversity knowledge.
- claim: GBIF's registry lists nine datasets published by Biodiversidata.
  url: https://api.gbif.org/v1/node/a3ceb6dd-0a65-4f30-a385-30f6937c2096/organization?limit=100
