  quote: '"address":["Montevideo"],"city":"Montevideo","country":"UY","numPublishedDatasets":9'
- claim: Its GBIF publisher record says its plan is to collect data on vertebrate, invertebrate and plant
    species and make the data available free and open.
  url: https://api.gbif.org/v1/organization/862f7ec3-3134-4dce-ab5a-03c81f54bd72
  fetched: 2026-11-08
  quote: The plan is to collect the maximum possible amount of data from vertebrate, invertebrate and
    plant species, use it to collaborative generate global impact scientific research and make the data
    available free and open.
- claim: A 2020 comment in its GBIF publisher record says it had an occurrence dataset of vertebrates
    from Uruguay combining different types of sources.
  url: https://api.gbif.org/v1/organization/862f7ec3-3134-4dce-ab5a-03c81f54bd72
  fetched: 2026-11-08
  quote: Today we have an occurrence data dataset of vertebrates from Uruguay that combines different
