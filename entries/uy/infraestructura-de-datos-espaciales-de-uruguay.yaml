facts:
- claim: The geoportal was implemented by IDE and AGESIC to publish the Uruguayan state's official geographic
    information as open data.
  url: https://www.gub.uy/infraestructura-datos-espaciales/comunicacion/noticias/lanzamiento-del-geoportal-ide
  fetched: 2026-11-08
  quote: El Geoportal fue implementado por la IDE y AGESIC.
- claim: A September 2019 announcement said the geoportal offered satellite imagery covering the country
    under a contract for updates every six months.
  url: https://www.gub.uy/infraestructura-datos-espaciales/comunicacion/noticias/lanzamiento-del-geoportal-ide
  fetched: 2026-11-08
  quote: En el geoportal también están disponibles para consulta imágenes satelitales de toda la cobertura
    nacional con un contrato de actualización semestral.
- claim: The September 2019 announcement said public bodies could ask IDE for high-resolution imagery
    to follow sudden events such as an environmental disaster.
  url: https://www.gub.uy/infraestructura-datos-espaciales/comunicacion/noticias/lanzamiento-del-geoportal-ide
