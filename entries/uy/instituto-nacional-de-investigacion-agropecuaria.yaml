summary: Agricultural research institute that co-funded the Usina de códigos de barra de la vida–Uruguay
  project, publishes systematic bird observations from 2021 onwards, and had technicians trained in Google
  Earth Engine in 2019.
facts:
- claim: Co-funded, with ANII's Fondo María Viñas, the Usina de códigos de barra de la vida–Uruguay project.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/nuevos-conjuntos-datos-adn-fortalecen-conocimiento-sobre-biodiversidad
  fetched: 2026-11-08
  quote: financiado por el Fondo María Viñas de la ANII e INIA
- claim: Its technicians were among those trained in Google Earth Engine for forest mapping and monitoring
    under the REDD+ programme in 2019.
  url: https://www.gub.uy/ministerio-ganaderia-agricultura-pesca/comunicacion/noticias/se-realizo-entrenamiento-google-earth-engine-para-mapeo-monitoreo-forestal
  fetched: 2026-11-08
  quote: se realizó una capacitación a técnicos de distintas unidades del Mvotma, MGAP, INIA y UDELAR
    en la plataforma Google Earth Engine (GEE)
- claim: Its GBIF publisher record says biodiversity is surveyed in different plant communities and groups
    of fauna across its research projects.
  url: https://api.gbif.org/v1/organization/8e20fef2-e445-4985-99f3-fbd80f8c591a
  fetched: 2026-11-08
  quote: Across various research projects, biodiversity is surveyed in different plant communities and
    different taxonomic groups of fauna.
- claim: Its GBIF dataset holds systematic bird observations made at sites across Uruguay from 2021 onwards.
  url: https://api.gbif.org/v1/organization/8e20fef2-e445-4985-99f3-fbd80f8c591a/publishedDataset
  fetched: 2026-11-08
  quote: La base de datos reúne registros sistemáticos de observaciones de aves realizadas en distintos
    sitios de Uruguay a partir del año 2021.
- claim: GBIF's registry gives its address as Av. Italia 6201, Montevideo.
  url: https://api.gbif.org/v1/organization/8e20fef2-e445-4985-99f3-fbd80f8c591a
  fetched: 2026-11-08
  quote: Av. Italia 6201, Montevideo; Parque de Innovación LATU, Edificio Los Guayabos
