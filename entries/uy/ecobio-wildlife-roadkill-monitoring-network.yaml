id: ecobio-wildlife-roadkill-monitoring-network
kind: programme
name: ECOBIO Uruguay wildlife roadkill monitoring network
scope: uy
ai_label: conservation-tech
realms:
- land
countries:
- uy
status: unknown
summary: Reportedly strengthened from 2015, this roadkill monitoring network uses
  an Epicollect5-based app and has recorded thousands of vertebrates, mainly mammals;
  a 2026 paper compiled 4,388 records from 2016–2024.
facts:
- claim: ECOBIO Uruguay's Rufford project page says that in 2015 it started a line
    of research on road ecology and began strengthening a network for wildlife roadkill
    monitoring.
  url: https://www.rufford.org/projects/hugo-ignacio-coiti%C3%B1o-banquero/monitoring-of-mitigation-measures-implemented-in-uruguay-to-reduce-the-impacts-of-the-roads-on-the-populations-of-medium-and-large-mammals/
  fetched: '2026-11-12'
  quote: we began strengthening the network for wildlife roadkill monitoring
- claim: The page says a mobile phone application was then created to collect the
    information.
  url: https://www.rufford.org/projects/hugo-ignacio-coiti%C3%B1o-banquero/monitoring-of-mitigation-measures-implemented-in-uruguay-to-reduce-the-impacts-of-the-roads-on-the-populations-of-medium-and-large-mammals/
  fetched: '2026-11-12'
  quote: Subsequently, a mobile phone application was created that allowed information
    to be collected easily and quickly.
- claim: The page says thousands of vertebrates killed on roads, mainly mammals, have
    been recorded through the network and the application.
  url: https://www.rufford.org/projects/hugo-ignacio-coiti%C3%B1o-banquero/monitoring-of-mitigation-measures-implemented-in-uruguay-to-reduce-the-impacts-of-the-roads-on-the-populations-of-medium-and-large-mammals/
  fetched: '2026-11-12'
  quote: through this network and the application, thousands of vertebrates killed
    on roads have been recorded, mainly mammals
- claim: The page says wildlife crossing signs were installed at three high-mortality
    sites in Rocha in December 2019, with the Ministry of Transport and Public Works.
  url: https://www.rufford.org/projects/hugo-ignacio-coiti%C3%B1o-banquero/monitoring-of-mitigation-measures-implemented-in-uruguay-to-reduce-the-impacts-of-the-roads-on-the-populations-of-medium-and-large-mammals/
  fetched: '2026-11-12'
  quote: In December 2019, the first mitigation measures were installed in three high
    mortality sites in the department of Rocha.
- claim: The Latin America and Caribbean Transportation Ecology Network says ECOBIO's
    records since 2015 were collected through a citizen science project using ECOrutas,
    an app based on Epicollect5.
  url: https://latinamericatransportationecology.org/news/primeras-medidas-de-mitigacion-fueron-concretadas-en-tres-sitios-de-alta-mortalidad-de-fauna-silvestre-en-el-uruguay/
  fetched: '2026-11-12'
  quote: a citizen science project was launched using ECOrutas, an Epicollect5 based
    app
- claim: A 2026 paper in Ecosistemas compiled 4,388 georeferenced roadkill records
    from 2016 to 2024 from citizen science and from ECOBIO Uruguay.
  url: https://revistaecosistemas.net/index.php/ecosistemas/article/download/3120/2108/19407
  fetched: '2026-11-12'
  quote: Se recopilaron un total de 4388 registros georreferenciados entre 2016 y
    2024
