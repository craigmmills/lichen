facts:
- claim: Idealist lists it as a non-profit organisation in La Paloma, Rocha, created
    in 2000.
  url: https://www.idealist.org/es/ong/f6bcc9862d2549a78380c1f26ac37b8b-conservacion-de-cetaceos-y-oceanos-costeros-la-paloma
  fetched: '2026-11-12'
  quote: La Organización para la Conservación de Cetáceos/ OCC se crea en el año 2000
- claim: The same listing says its research includes zooplankton characterisation,
    water quality, aerial and boat-based photo-identification, and underwater acoustic
    recordings.
  url: https://www.idealist.org/es/ong/f6bcc9862d2549a78380c1f26ac37b8b-conservacion-de-cetaceos-y-oceanos-costeros-la-paloma
  fetched: '2026-11-12'
  quote: foto-identificación aérea y embarcada, y registros acústicos submarinos
- claim: Its 2014 Rufford project page says it would continue to reinforce the Cetacean
    Stranding Network in Uruguay, using a phone application to submit whale information
    online.
  url: https://www.rufford.org/projects/rodrigo-garcia-pingaro/strengthening-strategies-and-actions-for-the-management-and-conservation-of-the-whales-and-dolphins-sanctuary-uruguay/
  fetched: '2026-11-12'
  quote: The project will continue to reinforce the Cetacean Stranding Network in
    Uruguay
- claim: The same page says it would continue its photo-identification catalogue of
    individual right whales and mapping of cetacean sounds.
  url: https://www.rufford.org/projects/rodrigo-garcia-pingaro/strengthening-strategies-and-actions-for-the-management-and-conservation-of-the-whales-and-dolphins-sanctuary-uruguay/
  fetched: '2026-11-12'
  quote: the Catalog of individuals (Id-photo) to determine the population dynamics
    of right whales; mapping the acoustic sounds of cetaceans
- claim: The page's project video is titled for the OCC right whale sighting network.
  url: https://www.rufford.org/projects/rodrigo-garcia-pingaro/strengthening-strategies-and-actions-for-the-management-and-conservation-of-the-whales-and-dolphins-sanctuary-uruguay/
