summary: Project that plans to establish a baseline of human-made sound and noise on Fildes
  Peninsula, King George Island, and explore effects on local biological communities; led
  by Lucía Ziegler.
facts:
- claim: The project page says it plans to establish a baseline of the spatial and temporal
    extent of human-made sounds and associated noise levels on the Fildes Peninsula, King
    George Island, with a view to an acoustic monitoring system on the island.
  url: https://iau.gub.uy/elaboracion-de-un-mapa-sonoro-de-la-isla-rey-jorge-hacia-la-utilizacion-del-monitoreo-del-paisaje-acustico-como-un-indicador-ambiental-en-la-antartida/
  fetched: 2026-11-08
  quote: este proyecto plantea enfocarse en realizar una línea de base de la extensión espacial
    y temporal de los sonidos de origen antrópico y los niveles de ruido asociados en la Península
    Fildes (isla Rey Jorge), con proyección a un sistema de monitoreo acústico en esta isla
    antártica.
- claim: A second aim is to explore the possible effect of noise from human activity on local
    biological communities.
  url: https://iau.gub.uy/elaboracion-de-un-mapa-sonoro-de-la-isla-rey-jorge-hacia-la-utilizacion-del-monitoreo-del-paisaje-acustico-como-un-indicador-ambiental-en-la-antartida/
  fetched: 2026-11-08
  quote: Un segundo objetivo se enfoca en explorar el potencial efecto del ruido generado
    por las actividades humanas en las comunidades biológicas locales.
- claim: The project page names the Centro Universitario Regional del Este (CURE) as the institution.
  url: https://iau.gub.uy/elaboracion-de-un-mapa-sonoro-de-la-isla-rey-jorge-hacia-la-utilizacion-del-monitoreo-del-paisaje-acustico-como-un-indicador-ambiental-en-la-antartida/
