summary: Research institute whose biodiversity and genetics department was involved in Santa Lucía wetland
  monitoring from 2023 and led a DNA barcoding project publishing three open datasets.
facts:
- claim: A May 2025 page reports that researchers of its Department of Biodiversity and Genetics had monitored
    Santa Lucía wetland wildlife with camera traps and genetic tools since 2023, with Intendencia de Montevideo
    park rangers.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/monitoreo-mamiferos-nativos-area-protegida-humedales-santa-lucia
  fetched: 2026-11-08
  quote: llevan adelante un proyecto de investigación en el que monitorean fauna con cámaras trampa y
    herramientas genéticas en los Humedales del Santa Lucía
- claim: The DNA barcoding project led from its Department of Biodiversity and Genetics published three
    DNA datasets in open-access repositories.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/nuevos-conjuntos-datos-adn-fortalecen-conocimiento-sobre-biodiversidad
  fetched: 2026-11-08
  quote: El proyecto, que acaba de concluir, fue liderado por Mariana Cosse del Dpto. de Biodiversidad
    y Genética IIBCE
- claim: A team from IIBCE and the Facultad de Ciencias of the Universidad de la República carried out
    the first study in Uruguay using environmental DNA to explore the biodiversity of sandy beaches in
    the Río de la Plata estuary.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/exploramos-biodiversidad-invisible-playas-uruguayas-traves-del-adn-ambiental
  fetched: 2026-11-08
  quote: realizó el primer estudio en Uruguay que utiliza ADN ambiental (eDNA) para explorar la biodiversidad
    de las playas arenosas del estuario del Río de la Plata
