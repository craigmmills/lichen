  quote: Flora Uruguaya Online (FUO) is a national floristics initiative led by the Departamento de Biología
    Vegetal, Facultad de Agronomía (FAGRO), Universidad de la República (UdelaR), Uruguay, and built as
    a collaborative effort across five herbarium collections
- claim: The same record says it joins specimen data from the collections with citizen-science records
    from NaturalistaUY/iNaturalist.
