facts:
- claim: Its GBIF publisher record describes it as a national floristics initiative led by the Departamento
    de Biología Vegetal of the Facultad de Agronomía, built across five herbarium collections.
  url: https://api.gbif.org/v1/node/a3ceb6dd-0a65-4f30-a385-30f6937c2096/organization?limit=100
