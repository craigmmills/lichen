  quote: Flora Uruguaya Online – Catálogo de la flora vascular del Uruguay
- claim: Its GBIF publisher record says it is a national floristics initiative built as a collaborative
    effort across five herbarium collections.
  url: https://api.gbif.org/v1/organization/d4fa28ea-7857-4b9b-9f44-f90318cdb583
