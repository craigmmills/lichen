summary: Ongoing binational project built and run by Instituto Pró-Carnívoros, planning camera
  trapping at at least 108 sites to estimate carnivore occupancy and activity, with results
  for authorities and farmers.
facts:
- claim: Pró-Carnívoros's page lists the project as in progress and says it will use camera
    trapping at at least 108 sites to estimate occupancy and activity for each carnivore species.
  url: https://procarnivoros.org.br/en/projeto/effects-of-human-disturbance-on-occupancy-and-activity-patterns-of-carnivora-mammalia-species-in-the-uruguayan-savannah/
  fetched: '2026-11-12'
  quote: By using camera trapping, a non-invasive method of collecting data, we will sample
    at least 108 sites in the ecoregion
- claim: The page says the study is binational and its results will go to government environment
    bodies and farmers in Brazil and Uruguay.
  url: https://procarnivoros.org.br/en/projeto/effects-of-human-disturbance-on-occupancy-and-activity-patterns-of-carnivora-mammalia-species-in-the-uruguayan-savannah/
  fetched: '2026-11-12'
  quote: The results of this bi-national study will support management actions
- claim: The page names Flávia Tirelli as project coordinator and technical responsible (Rufford),
