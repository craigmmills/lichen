summary: Ministry-led coastal lagoon programme which, in June 2022, reported seasonal
  monitoring of Laguna Garzón since November 2017 and records of potentially toxic
  cyanobacteria, with no observed blooms.
facts:
- claim: In June 2022, the ministry said Laguna Garzón had been monitored each season
    since November 2017 through the programme, which it coordinated.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/programa-monitoreo-interinstitucional-laguna-garzon
  fetched: '2026-11-12'
  quote: Desde noviembre 2017, en esta laguna se realiza un monitoreo estacional a
    través del Programa de Monitoreo Interinstitucional de las Lagunas Costeras del
    Uruguay, coordinado por el Ministerio de Ambiente.
- claim: The ministry says the programme monitors the lagoon and two tributaries chosen
    to represent land uses in the basin.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/programa-monitoreo-interinstitucional-laguna-garzon
  fetched: '2026-11-12'
  quote: Se monitorean el cuerpo de agua de la laguna y dos tributarios (Arroyo Garzón
    y Arroyo Anastasio)
- claim: In June 2022, the ministry reported records of potentially toxic cyanobacteria
    in Laguna Garzón, but no observed blooms, citing a 2021 report.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/programa-monitoreo-interinstitucional-laguna-garzon
  fetched: '2026-11-12'
  quote: si bien se han registrado cianobacterias, muchas de las cuales pertenecen
    a especies potencialmente tóxicas
