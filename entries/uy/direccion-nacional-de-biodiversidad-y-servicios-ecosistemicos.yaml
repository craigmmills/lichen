facts:
- claim: Its remit is protected areas and the control of species and biodiversity.
  url: https://www.gub.uy/ministerio-ambiente/institucional/estructura-del-organismo/direccion-nacional-biodiversidad-servicios-ecosistemicos
  fetched: 2026-11-08
  quote: La conservación como reducto a proteger (Áreas protegidas) y el Control de especies y la biodiversidad.
- claim: One of its tasks is consolidating the national system of protected areas and other area-based
    conservation measures.
  url: https://www.gub.uy/ministerio-ambiente/institucional/estructura-del-organismo/direccion-nacional-biodiversidad-servicios-ecosistemicos
  fetched: 2026-11-08
  quote: consolidando el sistema nacional de áreas protegidas y otras medidas de conservación basadas
    en áreas
- claim: Its wildlife task includes developing monitoring systems with key indicators.
  url: https://www.gub.uy/ministerio-ambiente/institucional/estructura-del-organismo/direccion-nacional-biodiversidad-servicios-ecosistemicos
  fetched: 2026-11-08
  quote: el desarrollo de sistemas de monitoreo con indicadores claves para su gestión
- claim: Says it develops and implements the policy of conservation and sustainable use of biodiversity
    and ecosystem services, on land and at sea.
