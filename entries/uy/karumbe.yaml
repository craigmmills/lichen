summary: Sea turtle NGO on the Uruguayan coast, founded in 1999, whose centre Mongabay reported in 2022
  had supplied information for over 100 scientific studies.
facts:
- claim: Mongabay reported in April 2022 that the Karumbé centre rescued and rehabilitated turtles and
    gathered information used in more than 100 scientific studies.
  url: https://es.mongabay.com/2022/04/la-hazana-de-rescatar-a-600-tortugas-marinas-en-uruguay/
  fetched: 2026-11-08
  quote: El Centro Karumbé se ocupa de su rescate y recuperación, y también levanta información con la
    que ya se han publicado más de 100 investigaciones científicas.
- claim: Mongabay describes it as an NGO founded in 1999 and a reference centre for the study and conservation
    of sea turtles on the Uruguayan coast.
  url: https://es.mongabay.com/2022/04/la-hazana-de-rescatar-a-600-tortugas-marinas-en-uruguay/
  fetched: 2026-11-08
  quote: Esta ONG fundada en 1999 se ha convertido en centro de referencia para el estudio, la investigación,
    l a rehabilitación y la conservación de las especies de tortugas marinas
- claim: Its scientific coordinator told Mongabay in April 2022 that the stranding trend observed on the
    coast was rising.
  url: https://es.mongabay.com/2022/04/la-hazana-de-rescatar-a-600-tortugas-marinas-en-uruguay/
  fetched: 2026-11-08
  quote: la tendencia de varamientos que observamos en nuestras costas es al alza
- claim: Says it has worked since 1999, notably collecting systematic data on the biology and ecology
    of sea turtles.
  url: https://api.gbif.org/v1/node/a3ceb6dd-0a65-4f30-a385-30f6937c2096/organization?limit=100
  fetched: 2026-11-08
  quote: Realiza sus trabajos desde el año 1999 destacándose la colecta de datos de forma sistematizada
    de aspectos biológicos y ecológicos de las tortugas marinas.
- claim: GBIF's registry gives its address in La Coronilla, Rocha.
  url: https://api.gbif.org/v1/node/a3ceb6dd-0a65-4f30-a385-30f6937c2096/organization?limit=100
  fetched: 2026-11-08
  quote: '"address":["Leopoldo Fernandez Tuñon"],"city":"La Coronilla","province":"Rocha","country":"UY"'
