summary: Marine fauna stranding network, described in a November 2020 article as coordinated
  by Coendú, the Facultad de Ciencias and SOCOBIOMA, with cases reportable through
  the Epicollect5 app.
facts:
- claim: A Montevideo Portal article of 6 November 2020 says the marine fauna stranding
    network handles cases of sea lions, elephant seals, dolphins, whales and other
    species seen alive or dead on the coast.
  url: https://www.montevideo.com.uy/Ciencia-y-Tecnologia/Organizaciones-dicen-que-ya-existe-app-de-varamientos-como-la-de-Observatorio-Ambiental-uc769851
  fetched: 2026-11-15
  quote: La red de varamientos de fauna marina trabaja en ese sentido, para casos
    en los que se avista un lobo o elefante marino, un delfín o una ballena
- claim: The article says the work is coordinated by Coendú, the Facultad de Ciencias
    of the Universidad de la República and SOCOBIOMA.
  url: https://www.montevideo.com.uy/Ciencia-y-Tecnologia/Organizaciones-dicen-que-ya-existe-app-de-varamientos-como-la-de-Observatorio-Ambiental-uc769851
  fetched: 2026-11-15
  quote: El trabajo es coordinado por la organización Coendú (Conservación de Especies
    Nativas del Uruguay), la Facultad de Ciencias de la Universidad de la República
    y la Sociedad para la Conservación de la Biodiversidad de Maldonado (SOCOBIOMA).
- claim: The November 2020 article says cases could be reported by adding the Varamientos
    Uruguay programme in the Epicollect5 app.
  url: https://www.montevideo.com.uy/Ciencia-y-Tecnologia/Organizaciones-dicen-que-ya-existe-app-de-varamientos-como-la-de-Observatorio-Ambiental-uc769851
  fetched: 2026-11-15
  quote: En la aplicación Epicollect5 se agrega el programa Varamientos Uruguay y
    se puede reportar estos casos.
