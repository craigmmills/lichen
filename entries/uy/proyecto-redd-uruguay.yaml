summary: Project through which MGAP and the then environment ministry worked in 2019 on designing a National
  Forest Monitoring System, and which organised Google Earth Engine training.
facts:
- claim: In 2019 the MGAP and the then environment ministry (Mvotma) were working through REDD+ on the
    design of a National Forest Monitoring System.
  url: https://www.gub.uy/ministerio-ganaderia-agricultura-pesca/comunicacion/noticias/se-realizo-entrenamiento-google-earth-engine-para-mapeo-monitoreo-forestal
  fetched: 2026-11-08
  quote: a través de Redd+, el MGAP y el Mvotma trabajan en el diseño de un Sistema Nacional de Monitoreo
    Forestal
- claim: In March 2019 the project organised Google Earth Engine training for forest mapping and monitoring,
    funded by the World Bank under an agreement with SilvaCarbon.
  url: https://www.gub.uy/ministerio-ganaderia-agricultura-pesca/comunicacion/noticias/se-realizo-entrenamiento-google-earth-engine-para-mapeo-monitoreo-forestal
  fetched: 2026-11-08
  quote: La actividad fue organizada por el Proyecto REDD+ y financiada por el Banco Mundial en el marco
    de un acuerdo con SilvaCarbon
- claim: A 2020 REDD+ research publication on the MGAP site covers monitoring of invasive alien species
    in Uruguay's native forest by remote sensing.
  url: https://www.gub.uy/ministerio-ganaderia-agricultura-pesca/comunicacion/publicaciones/monitoreo-especies-exoticas-invasoras-del-bosque-nativo-uruguay-mediante
