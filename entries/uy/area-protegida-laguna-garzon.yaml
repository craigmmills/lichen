facts:
- claim: The Ministry of Environment says periodic monitoring of mammals, waterbirds
    and invasive alien species has been carried out in the Laguna Garzón protected
    area since 2020.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/monitoreo-fauna-area-protegida-laguna-garzon
