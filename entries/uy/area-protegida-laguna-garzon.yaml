  quote: En esta nota presentamos información referente a los monitoreos periódicos
    que desde 2020 se vienen realizando en el Área de Manejo de Hábitat y/o Especies
    Laguna Garzón
- claim: The protected area's management keeps at least three periodic fauna monitoring
    schemes; the mammal monitoring has identified at least 12 species.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/monitoreo-fauna-area-protegida-laguna-garzon
  fetched: 2026-11-13
  quote: Desde la gestión del área protegida y siguiendo los lineamientos del plan
    de manejo se mantienen al menos tres monitoreos periódicos de fauna.
- claim: Methods include samples, photographs, counts, roadkill detection and camera
    traps, supported by iNaturalist, eBird, Epicollect and Survey123.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/monitoreo-fauna-area-protegida-laguna-garzon
