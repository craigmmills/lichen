  quote: Los datos para este proyecto se obtendrán a partir de avistamientos de cetáceos registrados
    a bordo de plataformas de oportunidad, es decir, de embarcaciones que navegan en aguas
    antárticas.
- claim: The project page says it will use an ensemble approach combining species distribution
    modelling methods to study cetacean distribution in relation to environmental variables
    in the Southern Ocean.
  url: https://iau.gub.uy/distribucion-ecologia-y-abundancia-de-cetaceos-en-el-oceano-austral/
  fetched: 2026-11-08
