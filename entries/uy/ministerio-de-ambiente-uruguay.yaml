summary: Uruguay's environment ministry, whose National Biodiversity Strategy sets 23 targets, including
  a target to build an open-access biodiversity information system by 2030.
facts:
- claim: The ministry's National Biodiversity Strategy reflects Uruguay's commitments under the Convention
    on Biological Diversity and sets 23 national targets.
  url: https://www.gub.uy/ministerio-ambiente/politicas-y-gestion/es-estrategia-nacional-biodiversidad
  fetched: 2026-11-08
  quote: Refleja nuestros compromisos ante el Convenio de Diversidad Biológica de las Naciones Unidas,
    y tiene 23 metas nacionales
- claim: The strategy's targets are set out against each target of the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://www.gub.uy/ministerio-ambiente/politicas-y-gestion/es-estrategia-nacional-biodiversidad
  fetched: 2026-11-08
  quote: Meta del Marco Mundial de Biodiversidad de Kunming Montreal Meta Nacional
- claim: National target 21 is to build, by 2030 and with the National Environmental Observatory, an open-access
    biodiversity information system.
  url: https://www.gub.uy/ministerio-ambiente/politicas-y-gestion/es-estrategia-nacional-biodiversidad
  fetched: 2026-11-08
  quote: en coordinación con el Observatorio Ambiental Nacional y otros repositorios institucionales,
    un sistema de información sobre biodiversidad de acceso abierto
- claim: A Ministry of Education and Culture news item calls the national biodiversity information system,
    Uruguay's GBIF node, a platform of the Ministerio de Ambiente.
  url: https://www.gub.uy/ministerio-educacion-cultura/comunicacion/noticias/nuevos-conjuntos-datos-adn-fortalecen-conocimiento-sobre-biodiversidad
  fetched: 2026-11-08
  quote: Sistema de Información sobre la Biodiversidad de Uruguay (SIB Uruguay, Nodo GBIF) , plataforma
    del Ministerio de Ambiente
- claim: A January 2024 ministry page reports periodic monitoring of mammals, waterbirds and invasive
    species at Laguna Garzón since 2020, led by park rangers using camera traps, tissue and faecal samples,
    counts and field observation.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/monitoreo-fauna-area-protegida-laguna-garzon
  fetched: 2026-11-08
  quote: La responsabilidad de esta tarea está en manos del equipo de guardaparques
- claim: The January 2024 Laguna Garzón page says monitoring used iNaturalist, eBird, Epicollect and a
    platform it calls “MiSurvey123”.
  url: https://www.gub.uy/ministerio-ambiente/comunicacion/noticias/monitoreo-fauna-area-protegida-laguna-garzon
  fetched: 2026-11-08
  quote: se apoya en el uso de plataformas digitales de ciencia ciudadana como Inaturalist, eBird, Epicollect
    y MiSurvey123
- claim: Its site lists biodiversity and ecosystem services among its policy and management areas.
  url: https://www.gub.uy/ministerio-ambiente/
  fetched: 2026-11-08
  quote: Biodiversidad y servicios ecosistémicos
- claim: Its site invites the public to take part in a consultation on the proposed strategic plan for
    the National System of Protected Areas (SNAP).
  url: https://www.gub.uy/ministerio-ambiente/
  fetched: 2026-11-08
  quote: Consulta Pública Propuesta Plan Estratégico SNAP Participá hasta el 20/11.
- claim: Its site links to information on the protected areas in the National System of Protected Areas.
  url: https://www.gub.uy/ministerio-ambiente/
  fetched: 2026-11-08
  quote: Sistema Nacional de Áreas Protegidas Información sobre las áreas protegidas de Uruguay integradas
    al Sistema Nacional
- claim: Its site gives its office as Juncal 1385, Montevideo.
  url: https://www.gub.uy/ministerio-ambiente/
  fetched: 2026-11-08
  quote: 6 de noviembre 2026 en la sede Juncal 1385, Montevideo.
