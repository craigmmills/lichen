summary: Fiji's fisheries ministry. It runs an offshore electronic monitoring system with
  cameras on vessels and the Catch Accountancy System.
facts:
- claim: Says its Electronic Monitoring System will give more accurate data on fishing in
    Fiji's waters.
  url: https://www.fbcnews.com.fj/news/fiji-boosts-offshore-fisheries-monitoring/
  fetched: '2026-10-31'
  quote: The Ministry of Fisheries says the Electronic Monitoring System will improve transparency
    and provide more accurate data on fishing activities in Fiji’s waters.
- claim: Has rolled out the Catch Accountancy System, a web platform covering the supply chain
    from catch to export.
  url: https://pina.com.fj/2026/04/28/fiji-moves-to-cash-in-on-blue-gold-as-minister-bainivalu-unveils-fisheries-shake-up/
  fetched: '2026-10-31'
  quote: The Ministry of Fisheries have successfully rolled out the Catch Accountancy System
    (CAS).
- claim: Traseable Solutions names it on the Boarding and Inspection Tool.
  url: https://www.traseable.com/projects
  fetched: '2026-10-31'
  quote: Driven by the IMCS Network and Fiji's Ministry of Fisheries and Forestry, Traseable
    Solutions developed the Boarding and Inspection Tool (BaIT)
- claim: Is partnering with UN-SPIDER on space-based technology for coastal fisheries.
  url: https://www.fbcnews.com.fj/news/fiji-explores-new-technology-for-safer-fisheries/
  fetched: '2026-10-31'
  quote: The Ministry of Fisheries is partnering with the United Nations Platform for Space-based
    Information for Disaster Management and Emergency Response
- claim: Fishing vessels are being fitted with cameras and sensors that feed a national surveillance
    centre.
  url: https://www.fbcnews.com.fj/news/fiji-fisheries-sector-enters-new-digital-era/
  fetched: '2026-10-31'
  quote: Fishing vessels are being equipped with onboard cameras and sensors, feeding real-time
    data into the National Fisheries Surveillance and Operations Centre
- claim: Listed in the government directory with an acting Permanent Secretary.
  url: https://directory.digital.gov.fj/directory/organisation?orgId=26
  fetched: '2026-10-31'
  quote: Saimone Tauvoli (Acting) Permanent Secretary for Ministry of Fisheries
- claim: FBC News names one minister for fisheries and forestry.
  url: https://www.fbcnews.com.fj/news/fiji-fisheries-sector-enters-new-digital-era/
  fetched: '2026-10-31'
  quote: Minister for Fisheries and Forestry Alitia Bainivalu
