summary: Fiji programme of the Wildlife Conservation Society, based in Suva. Its marine scientists
  use MERMAID to store Fiji's reef monitoring and bleaching data.
facts:
- claim: Address in Suva.
  url: https://fiji.wcs.org/About-Us.aspx
  fetched: '2026-10-31'
  quote: 6 Clarke Street, Building 2, Suva Fiji
- claim: Field tested MERMAID and uses it to store local reef monitoring data.
  url: https://fiji.wcs.org/Blog/articleType/ArticleView/articleId/12824/MERMAID-A-new-tool-to-protect-coral-reefs.aspx
  fetched: '2026-10-31'
  quote: Marine scientists of WCS in Fiji have field tested and are now using MERMAID
- claim: Entered 2019 coral bleaching data into MERMAID and produced a factsheet for decision
    makers.
  url: https://fiji.wcs.org/Blog/articleType/ArticleView/articleId/12824/MERMAID-A-new-tool-to-protect-coral-reefs.aspx
  fetched: '2026-10-31'
  quote: entering coral bleaching data into MERMAID to document and follow mild coral bleaching
    in Fiji in 2019
- claim: Gives its office in Suva.
  url: https://fiji.wcs.org/Who-we-are/Staff-Profiles.aspx
  fetched: '2026-10-31'
  quote: 6 Clarke Street, Building 2, Suva Fiji
- claim: AIMS says WCS Fiji used resort-based marine biologists to collect and enter field
    data into ReefCloud during lockdowns.
  url: https://aims.gov.au/about/aims-impact/democratising-reef-monitoring-data-cloud
  fetched: '2026-10-31'
  quote: ReefCloud ’s automated analysis reduces training time so the Maldives Marine Research
    Institute (MMRI) and Wildlife Conservation Society Fiji (WCS) overcame COVID-19 lockdowns
    using resort-based marine biologists to collect and enter field data into ReefCloud.
- claim: Eco magazine says AIMS worked with it to test and fine-tune ReefCloud.
  url: https://ecomagazine.com/in-depth/ai-tool-makes-coral-reef-monitoring-fast-easy-and-collaborative/
  fetched: '2026-10-31'
  quote: AIMS worked closely with Palau International Coral Reef Center, Wildlife Conservation
    Society Fiji, the University of South Pacific, and the Maldive Marine Research Institute
    to test and fine-tune the platform.
- claim: Took part in a working group that developed a satellite method linking catchment
    land use to coastal water clarity.
  url: https://fiji.wcs.org/Initiatives/Applied-Research.aspx
  fetched: '2026-10-31'
  quote: A technique was developed to use freely available satellite data to assess the connection
    between land-uses in catchments and water clarity in coastal waters.
- claim: Named national technical facilitator of the Coral Reef Rescue project in Fiji.
  url: https://coralreefrescue.iwlearn.net/countries/fiji
  fetched: '2026-10-31'
  quote: National Technical Facilitator Wildlife Conservation Society (WCS)
- claim: ICRI lists WCS Fiji among the collaborators that developed ReefCloud, a machine learning
    tool for reef images.
  url: https://icriforum.org/reef-cloud-launched-open-access-coral-reef-monitoring-tool/
  fetched: '2026-10-31'
  quote: ReefCloud was developed by the Australian Institute of Marine Science (AIMS) in collaboration
    with the Palau International Coral Reef Center (PICRC), Wildlife Conservation Society
    (WCS) Fiji
- claim: Its 2019 annual report says reef data were stored in MERMAID.
  url: https://fiji.wcs.org/Portals/82/2019%20Annual%20Report%20Wildlife%20Conservation%20Society%20Fiji%20.pdf?ver=2020-01-14-041805-030
  fetched: '2026-10-31'
  quote: All data have been entered and stored in WCS’s online MERMAID platform
- claim: Its site gives a Suva address.
  url: https://fiji.wcs.org/
  fetched: '2026-10-31'
  quote: 6 Clarke Street, Building 2, Suva Fiji
