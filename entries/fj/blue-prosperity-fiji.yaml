summary: Fijian Government programme with the Waitt Institute on marine spatial planning,
  blue economy and fisheries. It ran Fiji's first nationwide marine survey in 2023.
facts:
- claim: A programme of five years or more, led by the Fijian Government.
  url: https://www.waittinstitute.org/post/fiji-ocean
  fetched: '2026-10-31'
  quote: This 5+ year Blue Prosperity program will be led by the Fijian Government
- claim: Islands Business, in paid content, calls its expedition Fiji's first nationwide marine
    survey.
  url: https://islandsbusiness.com/2023/science-and-data-for-ocean-prosperity/
  fetched: '2026-10-31'
  quote: It is Fiji’s first nationwide marine survey
- claim: Fiji and the Waitt Institute formalised a partnership on 30% ocean protection and
    ocean management.
  url: https://www.waittinstitute.org/post/fiji-ocean
  fetched: '2026-10-31'
  quote: The Republic of Fiji has formalized a partnership with the Waitt Institute to implement
    30% protection of Fiji’s waters from 0-200 nautical miles
- claim: The expedition covered 272 dive sites.
  url: https://www.fiji.gov.fj/mutual-effort-paves-the-way-for-sustainable-ocean-management/
  fetched: '2026-10-31'
  quote: meticulously exploring 272 dive sites and gathering invaluable scientific data.
- claim: Data cover reef health, fish, invertebrates and water quality.
  url: https://www.fiji.gov.fj/mutual-effort-paves-the-way-for-sustainable-ocean-management/
  fetched: '2026-10-31'
  quote: This data, encompassing assessments of coral reef health, fish populations, invertebrates,
    and water quality, serves as the cornerstone for Fiji’s baseline knowledge of its marine
    ecosystems.
- claim: Its site describes the partnership.
  url: https://www.blueprosperityfiji.org/
  fetched: '2026-10-31'
  quote: Blue Prosperity Fiji is a partnership between the Government of Fiji and the Waitt
    Institute
- claim: It carried out the largest coral reef survey in Fiji's history.
  url: https://www.blueprosperityfiji.org/expedition
  fetched: '2026-10-31'
  quote: carried out the largest coral reef survey in the nation’s history
