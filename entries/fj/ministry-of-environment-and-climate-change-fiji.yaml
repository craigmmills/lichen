summary: Fiji's environment ministry. It launched the National Biodiversity Strategy and Action
  Plan 2026 to 2030 and leads Fiji's Seventh National Report to the Convention on Biological
  Diversity.
facts:
- claim: Launched three national biodiversity instruments in 2026, including the National
    Biodiversity Strategy and Action Plan 2026 to 2030.
  url: https://fijionenews.com.fj/fiji-unveils-major-biodiversity-policies/
  fetched: '2026-10-31'
  quote: The newly introduced frameworks include the National Biodiversity Strategy and Action
    Plan (2026–2030)
- claim: Leads consultations on Fiji's Seventh National Report to the Convention on Biological
    Diversity.
  url: https://fijionenews.com.fj/biodiversity-report-consultations-begin-in-central-division/
  fetched: '2026-10-31'
  quote: Led by the Ministry of Environment and Climate Change, the consultation brought together
    representatives from government agencies
- claim: Has a Memorandum of Understanding with the Global Ocean Accounts Partnership for
    technical support on ocean and plastics accounts.
  url: https://goap-website.pages.dev/publications/ocean-accounts-for-fiji-a-focus-on-mangroves
  fetched: '2026-10-31'
  quote: A Memorandum of Understanding has been established with the Ministry of Environment
    and Climate Change
- claim: A GIS officer at the ministry first identified earthworks in newly released Moana
    LiDAR data.
  url: https://pina.com.fj/2026/04/01/hidden-archaeological-landscapes-discovered-in-fiji-through-moana-data-services-lidar-technology/
  fetched: '2026-10-31'
  quote: Leo Vanualailai, a GIS officer with the Ministry of Environment
- claim: InforMEA gives its office at Bali Tower, Toorak Road, Suva.
  url: https://informea.org/en/content/contact-person/ministry-environment-and-climate-change-6
  fetched: '2026-10-31'
  quote: Levels 1 § 2, Bali Tower, 318 Toorak Road
- claim: The Coral Reef Rescue site names it as the focal ministry for Fiji.
  url: https://coralreefrescue.iwlearn.net/countries/fiji
  fetched: '2026-10-31'
  quote: Focal National Government Ministry Ministry of Environment and Climate Change
- claim: Launched outreach consultations for Fiji's Seventh National Report to the Convention
    on Biological Diversity.
  url: https://mecc.gov.fj/central-division-consultations-begin-for-fijis-seventh-national-biodiversity-report/
  fetched: '2026-10-31'
  quote: launched the Central Division Outreach Consultations for Fiji’s Seventh National
    Report (7NR) to the Convention on Biological Diversity
- claim: The national report measures progress under the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://mecc.gov.fj/central-division-consultations-begin-for-fijis-seventh-national-biodiversity-report/
  fetched: '2026-10-31'
  quote: The report measures progress towards national biodiversity targets under the Kunming-Montreal
    Global Biodiversity Framework
- claim: Cabinet approved the Fiji National Biodiversity Strategy and Action Plan 2026-2030,
    which the ministry is taking forward.
  url: https://mecc.gov.fj/fiji-advances-biodiversity-action-through-biodev2030-workshop/
