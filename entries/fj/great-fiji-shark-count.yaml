summary: A national citizen science count of sharks by Fijian dive operators and their guests.
  From 2012 to 2016, 39 operators recorded 146,304 shark observations from 30,668 dives at
  592 sites.
facts:
- claim: From 2012 to 2016, 39 Fijian dive operators conducted the count with eOceans.
  url: https://www.marineecologyfiji.com/community-driven-shark-monitoring-for-informed-decision-making-a-case-study-from-fiji/
  quote: Between 2012 and 2016, 39 Fijian dive operators, in collaboration with eOceans, conducted
    the Great Fiji Shark Count to document sharks on their dives.
  fetched: '2026-10-31'
- claim: The published analysis used 146,304 shark observations from 30,668 dives at 592 sites.
  url: https://www.marineecologyfiji.com/community-driven-shark-monitoring-for-informed-decision-making-a-case-study-from-fiji/
  quote: Using 146 304 shark observations from 30 668 dives, we document spatial and temporal
    patterns of 11 shark species at 592 sites.
  fetched: '2026-10-31'
- claim: Open to visitors and locals, and collects data from observers around Fiji on sharks,
    rays and turtles.
  url: https://www.fijimarinas.com/the-great-fiji-shark-count/
  quote: we can collect data from hundreds of observers around Fiji
  fetched: '2026-10-31'
