facts:
- claim: Developed initially in 2017 and upgraded in 2021 through the Forestry Information Management
    System.
  url: https://www.fao.org/gfoi/country-led-planning/fiji/en
  fetched: '2026-10-31'
  quote: developed initially in 2017 and upgraded in 2021 to include stronger integration and
    reporting functions through the Forestry Information Management System (FIMS)
- claim: Supports forest inventories, forest cover change analysis, emissions estimation and
    UNFCCC reporting.
  url: https://www.fao.org/gfoi/country-led-planning/fiji/en
  fetched: '2026-10-31'
  quote: The system supports national forest inventories, forest cover change analysis, emissions
    estimation
- claim: The University of Hamburg says Fiji was establishing a reference level, a monitoring
    system and a forest database.
  url: https://www.biologie.uni-hamburg.de/forschung/weltforstwirtschaft/projekte-aktiv-weltw/03-projekt-fiji.html
  fetched: '2026-10-31'
  quote: the country is establishing a forest reference level (FRL), a national forest monitoring
    system (MFMS) and a functional national forest database
- claim: GIZ says Fiji has produced a reference level and a monitoring system.
  url: https://www.giz.de/en/projects/reed-forest-conservation-pacific-islands-states-ii
