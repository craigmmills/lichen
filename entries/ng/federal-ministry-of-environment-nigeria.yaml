summary: Active ministry whose forestry department sets biodiversity and wildlife policy and
  runs periodic forest surveys, and which in February 2026 was reported validating Nigeria's
  7th national report to the Convention on Biological Diversity.
facts:
- claim: Its forestry department formulates biodiversity conservation and wildlife management
    policy.
  url: https://environment.gov.ng/forestry/
  fetched: '2026-11-03'
  quote: Formulating Biodiversity Conservation and wildlife management policies as well as
    providing leadership for their implementation
- claim: Its forestry department carries out periodic forest resource surveys for the country.
  url: https://environment.gov.ng/forestry/
  fetched: '2026-11-03'
  quote: Undertaking periodic forest resources assessment survey for the country.
- claim: Voice of Nigeria reported in February 2026 that Nigeria had begun validating its
    7th National Report to the Convention on Biological Diversity, and that the minister said
    the government was committed to the Kunming-Montreal framework.
  url: https://von.gov.ng/nigeria-validates-7th-national-biodiversity-report/
  fetched: '2026-11-03'
  quote: the government remains committed to implementing the Kunming-Montreal Global Biodiversity
    Framework
- claim: Gives its address as Utako, Abuja.
  url: https://environment.gov.ng/forestry/
  fetched: '2026-11-03'
  quote: 'Contact: Federal Ministry of Environment, Plot 393/394, Augustus Aikhomo Way, Utako-
    Abuja'
- claim: Its stated work includes restoring ecosystems and preserving biodiversity.
  url: http://environment.gov.ng/forestry/
  fetched: 2026-11-03
  quote: Restoring and maintaining the ecosystem, ecological process and preserve biodiversity.
- claim: Lists the Forestry Research Institute of Nigeria, the Great Green Wall Agency and
    the National Park Services among its agencies.
  url: https://environment.gov.ng/agencies/
  fetched: 2026-11-03
  quote: Great Green Wall Agency
- claim: Its headquarters is at Mabushi, Abuja.
  url: https://environment.gov.ng/contact/
  fetched: 2026-11-03
  quote: Federal Ministry of Environment Headquarters 3FH3+WC8, Mabushi 900108, Abuja
- claim: The minister of state addressed a 2024 workshop validating national biodiversity
    targets and indicators, for aligning Nigeria's National Biodiversity Strategy and Action
    Plan with the Kunming-Montreal Global Biodiversity Framework.
  url: https://environment.gov.ng/2024/07/25/address-by-honourable-minister-of-state-for-environment-dr-iziaq-adekunle-salako-at-the-validation-workshop-on-the-national-biodiversity-targets-and-indicators-for-the-early-action-support-project-t/
  fetched: 2026-11-03
  quote: NBSAP must be rapidly aligned and validated with the new goals and targets of the
    Kunming-Montreal Global Biodiversity Framework.
- claim: Its Survey and Mapping unit states a mission of monitoring environmental change with
    remote sensing, GIS and field surveys.
  url: https://environment.gov.ng/survey-and-mapping/
  fetched: 2026-11-03
  quote: Environmental monitoring- Monitoring changes in the environment over time through
    the use of remote sensing, GIS technology and field surveys
- claim: States its role as environmental protection, natural resources conservation and sustainable
    development.
  url: https://environment.gov.ng/mandate/
  fetched: 2026-11-03
  quote: The Federal Ministry of Environment works to ensure environmental protection, natural
    resources conservation and sustainable development.
- claim: Voice of Nigeria reported the validation of Nigeria's seventh national report to
    the Convention on Biological Diversity in February 2026, with the minister represented
    by the ministry's Deputy Director of Forestry.
  url: https://von.gov.ng/nigeria-validates-7th-national-biodiversity-report/
  fetched: 2026-11-03
  quote: Represented by the Deputy Director of Forestry in the Ministry, Mr Tijani Ahmed
