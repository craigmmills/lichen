summary: Federal body established by decree in 1991 to protect and manage vegetation and wildlife
  in seven national parks covering about 20,156 square kilometres, which has published Kainji
  Lake bird records on GBIF.
facts:
- claim: Established by decree in 1991 with five national parks.
  url: https://nigeriaparkservice.gov.ng
  fetched: '2026-11-03'
  quote: The National Park Service of Nigeria was established by Decree 36 in 1991 with five
    national parks.
- claim: Gives its headquarters address in Garki, Abuja.
  url: https://nigeriaparkservice.gov.ng
  fetched: '2026-11-03'
  quote: Umaru Musa Yar’adua Expressway
- claim: A press report quotes the conservator general saying the service added high-tech
    equipment to anti-poaching work.
  url: https://gazettengr.com/national-park-service-acquired-three-forest-reserves-in-2024-official/
  fetched: '2026-11-03'
  quote: Mr Goni said the service had enhanced its anti-poaching efforts through the deployment
    of high-tech equipment such as drones, SMARTS, PowerChute, and GSM technology.
- claim: Established by decree in 1991; its statutory role is to preserve, protect and manage
    vegetation and wild animals in the national parks.
  url: https://nigeriaparkservice.gov.ng/about-us/
  fetched: 2026-11-03
  quote: To preserve, enhance, protect and manage vegetation and wild animals in the National
    Parks;
