summary: Research institute headquartered at Ibadan that runs the IITA Forest Center, and
  reported in June 2019 that its 1000-hectare campus supported about 270 bird species.
facts:
- claim: A CGIAR page names the Forest Center as IITA's.
  url: https://cgiar.org/news-events/news/celebrating-a-conservation-legend-iita-forest-center-honors-a-p-leventis
  fetched: '2026-11-03'
  quote: IITA Forest Center honors A.P. Leventis
- claim: In June 2019, IITA reported that its 1000-hectare Ibadan campus supported about 270
    bird species.
  url: https://iita.org/news-item/biodiversity-focus-iita-ibadan-campus-is-a-hotspot-for-bird-conservation/
  fetched: 2026-11-03
  quote: By supporting about 270 different species of birds, the 1000-ha IITA Campus in Ibadan
    remains one of Nigeria’s hotspots for bird conservation.
- claim: In February 2021, announced a project on bird and forest conservation in south-western
    Nigeria.
  url: https://iita.org/news-item/iita-forest-center-kicks-off-a-new-project-to-promote-bird-and-forest-conservation/
  fetched: '2026-11-03'
  quote: IITA has commenced a project titled “Enhancing bird and forest conservation at the
    interface of agriculture and urbanization in south-western Nigeria”
- claim: Page says the IITA Forest Reserve at Ibadan supports over 450 plant species and 272
    birds.
  url: https://iita.org/news-item/iita-forest-center-kicks-off-a-new-project-to-promote-bird-and-forest-conservation/
  fetched: '2026-11-03'
  quote: The forest supports over 450 plant species, 272 birds, 236 butterflies, 48 mammals,
    and 28 reptiles.
- claim: A reference on its site names IITA headquarters at Ibadan.
  url: https://iita.org/news-item/iita-forest-center-kicks-off-a-new-project-to-promote-bird-and-forest-conservation/
  fetched: '2026-11-03'
  quote: IITA-HQ, Ibadan
