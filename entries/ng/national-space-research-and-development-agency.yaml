summary: Space agency established in 1999, based in Abuja, that lists NigeriaSat-1, NigeriaSat-X
  and NigeriaSat-2, holds satellite data over Nigeria under its Act, and said in November
  2025 it had authorisation to launch four new satellites.
facts:
- claim: Lists its launched Earth observation satellites as NigeriaSat-1, NigeriaSat-X and
    NigeriaSat-2.
  url: https://ceos.org/document_management/Working_Groups/WGCapD/Meetings/WGCapD-9-2020/WGCapD9_6.4_AfricaSpotlight_Adepoju_NASRDA_v1.pdf
  fetched: '2026-11-03'
  quote: 'Satellites Launched:  NigeriaSat-1 (2003),  NigeriaSat-X (2011),  NigeriaSat -2
    (2011)'
- claim: Lists a National Satellite Atlas of Nigeria from NigeriaSat-1 among its work.
  url: https://ceos.org/document_management/Working_Groups/WGCapD/Meetings/WGCapD-9-2020/WGCapD9_6.4_AfricaSpotlight_Adepoju_NASRDA_v1.pdf
  fetched: '2026-11-03'
  quote: Completion of National Satellite Atlas of Nigeria from NigeriaSat-1
- claim: Said in November 2025 that it had authorisation to launch four new satellites, including
    for environmental monitoring.
  url: https://central.nasrda.gov.ng/?p=4859
  fetched: '2026-11-03'
  quote: the authorization to launch four new Satellites to boost communication, environmental
    monitoring, and national security
- claim: Pluboard reports that under a 2025 agreement it will provide imagery and monitoring
    to the agriculture ministry.
  url: https://pluboard.com/2025/11/27/trade/nigeria-eudr-compliance-strategy
  fetched: '2026-11-03'
  quote: NASRDA will provide satellite imagery, real-time monitoring, and technical expertise,
    while the agriculture ministry leads farmer engagement and national rollout.
- claim: Its headquarters are in Abuja.
  url: https://central.nasrda.gov.ng/?p=4859
  fetched: '2026-11-03'
  quote: at the Agency’s headquarters in Abuja
- claim: Under its Act it is the repository of all satellite data over Nigeria's territory.
  url: https://nasrda.gov.ng/mandate/
  fetched: 2026-11-03
  quote: Be the repository of all satellite data over Nigeria’s territory
- claim: Its Director General said the agency is working to use its satellites on climate
    change, including monitoring deforestation and desertification.
  url: https://central.nasrda.gov.ng/nasrda-uk-organization-forge-partnership-to-tackle-climate-change-using-space-technology/
  fetched: 2026-11-03
  quote: with applications ranging from monitoring deforestation and desertification to tracking
    weather patterns, flooding, and other environmental risks
- claim: Hosted the 10th AfriGEO Symposium in Abuja in collaboration with the Defence Space
    Administration.
  url: https://central.nasrda.gov.ng/afrigeo-symposium-holds-pre-opening-workshop-on-capacity-development/
  fetched: 2026-11-03
  quote: The 10th AfriGEO Symposium is being hosted by the National Space Research and Development
    Agency (NASRDA), in collaboration with the Defence Space Administration (DSA)
- claim: Its address is the Obasanjo Space Centre, Abuja.
  url: https://nasrda.gov.ng/departments/
  fetched: 2026-11-03
  quote: P.M.B. 437, Garki, Abuja, Nigeria
- claim: Established in May 1999 to pursue the development and application of space science
    and technology.
  url: https://www.nasrda.gov.ng/projects/
  fetched: 2026-11-03
  quote: was established in May 1999 with a board objective to pursue the development and
    application of space science technology
- claim: Gives its address in Garki, Abuja.
  url: https://www.nasrda.gov.ng/projects/
  fetched: 2026-11-03
  quote: P.M.B. 437, Garki, Abuja, Nigeria
