summary: Non-governmental conservation body founded in 1980 and registered as a charitable
  trust in 1982, which takes part in the International Waterbird Census, reports camera trap
  and bird monitoring, and is linked as a BirdLife partner.
facts:
- claim: Founded in 1980 and registered as a charitable trust in 1982.
  url: https://ncfnigeria.org/wp-content/uploads/2026/07/2025-Impact-Report.pdf
  fetched: '2026-11-03'
  quote: The Foundation was founded in 1980 by the late Chief S.L Edu and registered as a
    Charitable T rust in 1982.
- claim: Coordinates and takes part in the International Waterbird Census; the 2025 census
    covered 19 sites.
  url: https://ncfnigeria.org/wp-content/uploads/2026/07/2025-Impact-Report.pdf
  fetched: '2026-11-03'
  quote: 'T otal sites surveyed: 19 sites'
- claim: In August 2023, rangers in Omo Forest Reserve had installed motion cameras in the
    most protected parts of the forest.
  url: https://www.africanews.com/2023/08/17/nigeria-turns-to-former-poachers-to-save-key-forest/
  fetched: '2026-11-03'
  quote: The rangers have installed motion-detecting cameras on trees in the most protected
    parts of the forest to capture footage of animals and poachers.
- claim: In August 2023, NCF was reported to hire the Omo rangers.
  url: https://www.africanews.com/2023/08/17/nigeria-turns-to-former-poachers-to-save-key-forest/
  fetched: '2026-11-03'
  quote: which hires the rangers and acts as the government’s conservation partner
- claim: Its 2025 report says a reserve continued weekly bird monitoring.
  url: https://ncfnigeria.org/wp-content/uploads/2026/07/2025-Impact-Report.pdf
  fetched: '2026-11-03'
  quote: The reserve also continued weekly bird monitoring and biodiversity data collection
    activities
- claim: Calls itself the leading NGO for nature conservation and sustainable development
    in Nigeria, established in 1980.
  url: https://ncfnigeria.org/
  fetched: 2026-11-03
  quote: The Nigerian Conservation Foundation (NCF) is the premier Non Governmental Organisation
    (NGO) dedicated to nature conservation and sustainable development in Nigeria. Established
    in 1980
- claim: Its national secretariat is at the Lekki Conservation Centre in Lagos.
  url: https://api.gbif.org/v1/dataset/ddb362fd-38cf-4bac-b7a2-19c614fcfae9
  fetched: 2026-11-03
  quote: NCF has it National Secretariat located at the Lekki Conservation Centre in Lagos
    Nigeria
- claim: Says the Important Bird Areas it inventoried are regularly monitored, with results
    posted to BirdLife's World Birds Database.
  url: https://ncfnigeria.org/species/
  fetched: 2026-11-03
  quote: These IBAs are regularly monitored and the results are posted in the World Birds
    Database maintained by BirdLife International.
- claim: Takes part in the International Waterbird Census.
  url: https://ncfnigeria.org/international-waterbird-census-60-through-the-eyes-of-the-bird/
  fetched: 2026-11-03
  quote: For several years, NCF has been participating in the international waterbird census.
- claim: A camera trap in the Iko Esai community forest, Cross River State, recorded a forest
    elephant on 22 May 2025; NCF credits the image to itself.
  url: https://ncfnigeria.org/elephants-return-to-iko-esai-a-decade-long-wait-ends-in-cross-rivers-community-forests/
  fetched: 2026-11-03
  quote: 'Camera trap showing the forest elephant. Credit: Nigerian Conservation Foundation'
- claim: Its bird dataset on GBIF held 2,475 records collected between 1993 and 2018.
  url: https://api.gbif.org/v1/dataset/ddb362fd-38cf-4bac-b7a2-19c614fcfae9
  fetched: 2026-11-03
  quote: The dataset presently holds 2475 records of birds collected between 1993-2018
- claim: Biological monitoring is among its activities at Becheve Nature Reserve.
  url: https://ncfnigeria.org/forest-green-recovery-nigeria/
  fetched: 2026-11-03
  quote: Our activities include community engagement and mobilisation which often involve
    women and climate change, environmental education, biological monitoring, and active afforestation.
- claim: Says it is conducting satellite tagging and population surveys of vultures.
  url: https://ncfnigeria.org/nigerias-vultures-on-the-brink-ncf-calls-for-urgent-action-to-halt-illegal-killing-and-trade/
  fetched: 2026-11-03
  quote: NCF is also conducting satellite tagging, population surveys, conservation education,
    and community engagement
- claim: Invites applications for the Chief S.L. Edu Memorial Ph.D. Research Grant, sponsored
    by Chevron Nigeria Limited.
  url: https://ncfnigeria.org/chief-s-l-edu-ph-d-research-grant-call-2026/
  fetched: 2026-11-03
  quote: The Nigerian Conservation Foundation (NCF) invites applications from qualified Nigerians
    for the 2026 Edition of the Chief S.L. Edu Memorial Ph.D. Research Grant, sponsored by
    Chevron Nigeria Limited (CNL).
- claim: Established in 1980 and registered in 1982 as a charitable trust.
  url: https://ncfnigeria.org/
  fetched: 2026-11-03
  quote: Established in 1980, the Foundation was registered in 1982 as a Charitable Trust
- claim: Says it is conducting satellite tagging and population surveys for vultures.
  url: https://ncfnigeria.org/nigerias-vultures-on-the-brink-ncf-calls-for-urgent-action-to-halt-illegal-killing-and-trade/
  fetched: 2026-11-03
  quote: NCF is also conducting satellite tagging, population surveys, conservation education,
    and community engagement to map threats and build local support for vulture protection.
- claim: GBIF lists a bird dataset it published, drawn from its conservation activities.
  url: https://api.gbif.org/v1/organization/c876454b-cb70-41e3-b3bd-c411bb9e797e/publishedDataset?limit=10
  fetched: 2026-11-03
  quote: The sources of NCF Bird data, are basically from it conservation activities across
    Nigeria
- claim: Describes itself as an NGO dedicated to nature conservation and sustainable development
    in Nigeria, established in 1980.
  url: https://ncfnigeria.org/ncf-in-brief/
  fetched: '2026-11-03'
  quote: Established in 1980, the Foundation was registered in 1982 as a Charitable Trust
- claim: A camera trap in the community forest of Iko Esai, Cross River State, recorded a
    forest elephant on 22 May 2025.
  url: https://ncfnigeria.org/elephants-return-to-iko-esai-a-decade-long-wait-ends-in-cross-rivers-community-forests/
  fetched: '2026-11-03'
  quote: On the 22nd of May 2025, a camera trap placed deep within the community forest of
    Iko Esai, Cross River State, captured a remarkable image.
- claim: Launched a three-year community forest project with NABU across eight communities
    in 2023.
  url: https://ncfnigeria.org/elephants-return-to-iko-esai-a-decade-long-wait-ends-in-cross-rivers-community-forests/
  fetched: '2026-11-03'
  quote: In 2023, NCF and NABU launched a three-year Community Forest Management and Livelihood
    Improvement Project across eight buffer communities
- claim: In its World Biodiversity Day 2026 article, reported recent forest elephant sightings
    at Omo Forest Reserve through ongoing monitoring.
  url: https://ncfnigeria.org/world-biodiversity-day-2026-when-advocacy-meets-conservation/
  fetched: '2026-11-03'
  quote: forest elephants were recently sighted through ongoing monitoring activities
- claim: IITA describes it as the BirdLife International Partner in Nigeria.
  url: https://iita.org/fr/news-item/emerald-forest-reserve-designated-global-key-biodiversity-area-kba-following-iita-forest-center-led-scientific-assessments/
  fetched: '2026-11-03'
  quote: The BirdLife International Partner in Nigeria, the Nigerian Conservation Foundation
    (NCF)
- claim: Published a GBIF dataset of 153 bird records collected in 2018 and 2019.
  url: https://api.gbif.org/v1/dataset/26e549a9-07f7-48b1-a289-7f7f08cc6377
  fetched: '2026-11-03'
  quote: The dataset presently holds 153 records of birds collected between 2018-2019
- claim: Says it has managed the 1,000-hectare Finima Nature Park project since 2011.
  url: https://ncfnigeria.org/our-centers/
  quote: NCF has been managing the 1000 hectares project since 2011.
  fetched: '2026-11-17'
