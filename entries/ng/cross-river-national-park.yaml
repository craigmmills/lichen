summary: Active national park where, in a July 2021 interview, the Conservator-General
  said drones had not been deployed and the park used cyber trackers, camera traps,
  GPS and rangers.
facts:
- claim: In a July 2021 interview about the Okwangwo division, the Conservator-General
    said drones had not been deployed to Okwangwo or Cross River and that they were
    using cyber trackers, camera traps, GPS and rangers.
  url: https://1619education.org/stories/national-park-service-working-protect-okwangwo-division-and-other-parks
  fetched: '2026-11-09'
  quote: But for now, we have not deployed drones to Okwangwo or Cross River. We are
    still making do with cyber trackers, camera traps, the GPS and to some extent,
    the Rangers.
- claim: The July 2021 interview described rangers recording human and animal activity
    on patrol.
  url: https://1619education.org/stories/national-park-service-working-protect-okwangwo-division-and-other-parks
  fetched: '2026-11-09'
  quote: They move, camp from one place to the other continuously recording human
    and animal activities.
- claim: The Nigerian Tribune reported in January 2024 that NCF and the Wilder Institute
    donated equipment to the park, the Cross River Forestry Commission and the University
    of Calabar.
  url: https://tribuneonlineng.com/ncf-wilder-institute-donate-equipment-worth-over-n8m-to-national-park-others/
  fetched: '2026-11-09'
  quote: has donated some equipment to the Cross River National Park, Cross River
    Forestry Commission, and the University of Calabar.
