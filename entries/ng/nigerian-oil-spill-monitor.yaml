summary: Platform for managing and sharing oil spill data, built on paper Joint Investigation Visit records,
  run by NOSDRA and built by Stakeholder Democracy Network, with a warning that company data can be incomplete.
facts:
- claim: Describes itself as a platform for managing and sharing oil spill data.
  url: https://sdn4nigeria.github.io/monitoring-platform/about
  fetched: '2026-11-03'
  quote: This site is a platform for managing, visualizing, and sharing data about oil spills and the
    oil industry across Nigeria.
- claim: UN-SPIDER lists it as a webmap with archive and near-real-time coverage of Nigeria.
  url: https://un-spider.org/fr/node/11304
  fetched: '2026-11-03'
  quote: 'Temporal coverage: Archive, Near-real time'
- claim: Based on the paper records of Joint Investigation Visits and kept up to date by NOSDRA.
  url: https://nosdra.oilspillmonitor.ng/data.html
  fetched: 2026-11-03
  quote: It is kept up to date by NOSDRA.
- claim: The site warns that data from oil companies and others can be incomplete.
  url: https://nosdra.oilspillmonitor.ng/data.html
  fetched: 2026-11-03
  quote: Data submitted by oil companies and others can also be incomplete, for example missing geolocation
    data.
