summary: Programme run by the Wildlife Conservation Society, supporting SMART-based
  ranger patrols in Okwangwo Division, Cross River National Park, and monitoring Cross
  River gorillas mainly through these patrols.
facts:
- claim: Supports SMART-based ranger patrols in the Okwangwo Division of Cross River
    National Park.
  url: https://programs.wcs.org/nigeria/Wild-Places/Cross-River-NP-Okwangwo.aspx
  fetched: 2026-11-03
  quote: WCS supports SMART-based ranger patrols in Okwangwo to provide more effective
    protection of gorillas, chimpanzees and elephants.
- claim: Monitors Cross River gorillas mainly through SMART-based ranger patrols.
  url: https://programs.wcs.org/nigeria/Wild-Places/Cross-River-NP-Okwangwo.aspx
  fetched: 2026-11-03
  quote: Monitoring of the critically endangered Cross River gorilla is an important
    aspect of our work which we do mainly through SMART-based ranger patrols.
- claim: The site gives an address in Calabar.
  url: https://nigeria.wcs.org/Initiatives/SMART.aspx
  fetched: 2026-11-03
  quote: GPO Box 796, Calabar, Nigeria
- claim: Co-manages Yankari under an MoU signed with the Bauchi State Government in
    2014.
  url: https://nigeria.wcs.org/Wild-Places/Yankari-Game-Reserve.aspx
  quote: In 2014 WCS signed an MoU with Bauchi State Government for the co-management
    of Yankari.
  fetched: '2026-11-17'
