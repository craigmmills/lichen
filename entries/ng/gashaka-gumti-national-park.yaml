- claim: In 2021 the Federal Ministry of Environment received anti-poaching equipment
    for the park from ANI, including SMART CyberTracker devices.
  url: https://www.tarabafacts.com.ng/2021/02/fg-receives-n75m-worth-materials-to.html?m=1
