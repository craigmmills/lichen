summary: Active park in Adamawa and Taraba states, described in 2022 as Nigeria's
  largest, run by the National Park Service and ANI, with planned monitoring using
  ranger patrol data, satellite imagery and camera traps.
facts:
- claim: Described in ANI's 2022 report as Nigeria's largest national park, in Adamawa
    and Taraba states.
  url: https://archive2020-24.pfbc-cbfp.org/files/docs/news/4-2023/ANI%20Annual%20report%20FY%202022%20-%20Bringing%20Nature%20back%20to%20life%20%28comp%29.pdf
  fetched: '2026-11-09'
  quote: GGNP is Nigeria’s largest national park
- claim: ANI's 2022 report says the park's monitoring data will include ranger patrol
    data collected on handheld Android devices.
  url: https://archive2020-24.pfbc-cbfp.org/files/docs/news/4-2023/ANI%20Annual%20report%20FY%202022%20-%20Bringing%20Nature%20back%20to%20life%20%28comp%29.pdf
  fetched: '2026-11-09'
  quote: will collect data on handheld Android devices
- claim: ANI’s 2022 report lists satellite imagery and photos from 100 camera traps
    yet to be deployed among the planned monitoring data sources for the park.
  url: https://archive2020-24.pfbc-cbfp.org/files/docs/news/4-2023/ANI%20Annual%20report%20FY%202022%20-%20Bringing%20Nature%20back%20to%20life%20%28comp%29.pdf
  fetched: '2026-11-09'
