  monitoring data; run by NASRDA.
facts:
- claim: States its mission as research and applications of remote sensing and GIS for managing
    natural and human resources.
  url: https://ncrs.gov.ng/about
  fetched: 2026-11-03
  quote: Advancing knowledge through research and applications of Remote Sensing, GIS and
    related technologies for the identification, inventory, development and management of
    natural and human resources.
- claim: Its services page says establishment of the centre in Jos with a satellite ground
    receiving station in Kerang, Plateau State, was approved in 1998.
  url: https://ncrs.gov.ng/services
  fetched: 2026-11-03
  quote: with a Satellite Ground Receiving Station in Kerang, Plateau State
- claim: Its corporate office is in Jos East.
  url: https://ncrs.gov.ng/about
  fetched: 2026-11-03
  quote: 'Address: Corporate Office: Rizek Village along Fobor Road Jos East LGA'
- claim: Mandated to promote local inventories of natural resources and provide data for environmental
    monitoring and management.
  url: https://www.nasrda.gov.ng/national-center-for-remote-sensing/
  fetched: 2026-11-03
  quote: To promote and sponsor local development of inventory of natural resources (e.g.
    solid minerals, petroleum, forestry etc.) and provide data for environmental monitoring
    and management.
- claim: The page says approval was given in 1998 for a centre with permanent headquarters
    in Jos and a satellite ground receiving station at Kerang.
  url: https://www.nasrda.gov.ng/national-center-for-remote-sensing/
