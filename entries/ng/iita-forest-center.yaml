summary: Forest programme run by IITA, set up in 2015 to manage the Ibadan campus forest,
  which ran quarterly bird surveys with APLORI and has Leventis funding.
facts:
- claim: CGIAR says Leventis supported bird monitoring and surveys.
  url: https://cgiar.org/news-events/news/celebrating-a-conservation-legend-iita-forest-center-honors-a-p-leventis
  fetched: '2026-11-03'
  quote: His unwavering support, particularly for bird monitoring and surveys in southwest
    Nigeria
- claim: In February 2021, IITA announced a one-year project, with an option of a two-year
    extension, focused on bird monitoring, forest restoration, environmental education and
    research.
  url: https://iita.org/news-item/iita-forest-center-kicks-off-a-new-project-to-promote-bird-and-forest-conservation/
  fetched: 2026-11-03
  quote: The new project focuses on bird monitoring, forest restoration, environmental education,
    and strengthening outreaches, research collaboration, and students.
- claim: Set up in 2015 to manage forest resources on the IITA Ibadan campus.
  url: https://data.iita.org/dataset/biodiversity-checklists-of-the-iita-forest-center
  fetched: '2026-11-03'
  quote: The IITA Forest Unit was set up 1 January 2015 to succeed the five-year Forest Project.
- claim: Ran quarterly bird monitoring surveys at Emerald Forest Reserve over several years,
    with APLORI.
  url: https://iita.org/fr/news-item/emerald-forest-reserve-designated-global-key-biodiversity-area-kba-following-iita-forest-center-led-scientific-assessments/
  fetched: '2026-11-03'
  quote: Bird monitoring surveys conducted quarterly over several years by the IITA Forest
    Center scientists, in collaboration with the A. P. Leventis Ornithological Research Institute
- claim: A project announced in February 2021 focused on bird monitoring and forest restoration.
  url: https://iita.org/news-item/iita-forest-center-kicks-off-a-new-project-to-promote-bird-and-forest-conservation/
  fetched: '2026-11-03'
  quote: The new project focuses on bird monitoring, forest restoration, environmental education,
    and strengthening outreaches
- claim: In April 2021, IITA reported that its Forest Center, Nigerian Breweries and the Ogun
    State Ministry of Forestry were undertaking a 10-year project to reforest the Olokemeji
    Forest Reserve.
  url: https://iita.org/news-item/iita-partners-with-nigerian-breweries-for-olokemeji-reforestation/
  quote: The IITA Forest Center , the Nigerian Breweries, and the Ogun State Ministry of Forestry
    are undertaking a 10-year project to reforest the Olokemeji Forest Reserve in Ogun State.
  fetched: '2026-11-17'
