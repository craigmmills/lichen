  in 2021.
facts:
- claim: Supports SMART-based ranger patrols in Okwangwo.
  url: https://nigeria.wcs.org/wild-places/cross-river-np-okwangwo.aspx
  fetched: '2026-11-03'
  quote: WCS supports SMART-based ranger patrols in Okwangwo to provide more effective protection of gorillas,
    chimpanzees and elephants.
- claim: Monitors Cross River gorillas mainly through these patrols.
  url: https://nigeria.wcs.org/wild-places/cross-river-np-okwangwo.aspx
  fetched: '2026-11-03'
  quote: Monitoring of the critically endangered Cross River gorilla is an important aspect of our work
    which we do mainly through SMART-based ranger patrols.
