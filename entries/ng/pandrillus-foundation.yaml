- claim: Pandrillus invited Fauna & Flora International to join the Afi Mountain conservation
    effort in 1998. The Wildlife Conservation Society and Nigerian Conservation Foundation
    also joined Pandrillus and the Cross River State Forestry Commission to devise
    a plan for the mountain. The state created the roughly 100 km² Afi Mountain Wildlife
    Sanctuary in May 2000.
