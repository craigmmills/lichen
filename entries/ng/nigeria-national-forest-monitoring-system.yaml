summary: Forest monitoring programme that FAO's GFOI page describes as partly developed, with a satellite
  land monitoring system and a forest inventory, built by the Nigeria REDD+ Programme with UN-REDD support.
facts:
- claim: FAO's GFOI page says the system is partly developed and has a satellite land monitoring system
    and a forest inventory.
  url: https://www.fao.org/gfoi/country-led-planning/nigeria/en
  fetched: '2026-11-03'
  quote: Nigeria has a partially developed and still evolving National Forest Monitoring System (NFMS),
    largely shaped by REDD+ readiness efforts.
- claim: Core components named by the GFOI page.
  url: https://www.fao.org/gfoi/country-led-planning/nigeria/en
  fetched: '2026-11-03'
  quote: Core technical components exist, including a Satellite Land Monitoring System, a National Forest
    (Carbon) Inventory
- claim: At a GFOI workshop in Abuja, stakeholders agreed Nigeria must move from project-based efforts
    to an institutionalised system.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/nigeria-focuses-on-institutionalizing-its-forest-monitoring/en
  fetched: '2026-11-03'
  quote: Nigeria must move from fragmented, project based efforts to a coherent, institutionalized and
    nationally owned NFMS
- claim: UN-REDD supported the development of an action plan for the system in 2016.
  url: https://www.un-redd.org/partner-countries/africa/nigeria
  fetched: 2026-11-03
  quote: In 2016, the UN-REDD Programme supported the development of an NFMS Action Plan
- claim: UN-REDD says a forest monitoring system with a GIS laboratory has been established in Cross River
    State.
  url: https://www.un-redd.org/partner-countries/africa/nigeria
  fetched: 2026-11-03
  quote: In CRS, a robust forest monitoring system has been established with a functional GIS laboratory
    and facilities.
- claim: UN-REDD says 80 sample plots were established in 62 local communities in Cross River State to
    estimate carbon stocks and emission factors.
  url: https://www.un-redd.org/partner-countries/africa/nigeria
  fetched: 2026-11-03
  quote: In total, 80 sample plots have been established in 62 local communities to estimate carbon stocks
    and emission factors
