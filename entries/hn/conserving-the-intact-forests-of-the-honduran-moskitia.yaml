summary: A full-size GEF-8 project in Honduras approved on 22 October 2024 to improve
  conservation of Moskitia ecosystems, with IUCN's design request planning acoustic
  monitoring and remote sensing for fire detection.
facts:
- claim: The GEF lists it as a full-size GEF-8 project in Honduras, approved for implementation
    on 22 October 2024.
  url: https://www.thegef.org/projects-operations/projects/11276
  fetched: 2026-11-12
  quote: Project Approved for Implementation 22 Oct 2024
- claim: Its aim is improved and consolidated conservation of the critical ecosystems
    in the Honduran Moskitia.
  url: https://www.thegef.org/projects-operations/projects/11276
  fetched: 2026-11-12
  quote: Improved and consolidated conservation of the critical ecosystems in the
    Honduran Moskitia through strengthened governance
- claim: IUCN's request for proposals for the project's design names acoustic monitoring
    of wildlife and chainsaws and remote sensing for fire detection among the technologies
    to be used; this is a plan, not a deployment shown.
