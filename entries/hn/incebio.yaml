summary: Foundation whose Apu Pauni project researches and conserves macaws in Honduras,
  with a GBIF record reporting Miskito community patrols cut nest looting by 80 per
  cent.
facts:
- claim: Its GBIF publisher record describes the Apu Pauni project as research and
    conservation of macaws in the forests of Honduras.
  url: https://api.gbif.org/v1/organization/45a973b1-fc47-492c-889d-8bed9945d078
  fetched: '2026-11-12'
  quote: para realizar investigación y conservación de los guacamayos en las selvas
    de Honduras
- claim: The same record says the project has involved Miskito communities in patrols
    that cut macaw nest looting by 80 per cent.
  url: https://api.gbif.org/v1/organization/45a973b1-fc47-492c-889d-8bed9945d078
  fetched: '2026-11-12'
  quote: Se ha logrado involucrar comunidades indígenas Miskitos para el patrullaje
    y reducir en 80% los saqueos de nidos de los guacamayos.
- claim: A conference abstract in a volume first published in November 2025, co-authored
    by INCEBIO researchers, gives the Apu Pauni project’s priorities as searching
    for nests, recording their exact location and evaluating chicks clinically during
    the breeding season.
  url: https://comfaunalatam.org/wp-content/uploads/2026/01/Libro-de-resumenes-XVI-CIMFAUNA-31dic2025.pdf
  fetched: '2026-11-12'
  quote: 'Se plantearon como objetivos prioritarios: la búsqueda de nidos, su ubicación
    espacial exacta, evaluación clínica de los polluelos'
- claim: Its GBIF record gives an address in Tegucigalpa.
  url: https://api.gbif.org/v1/organization/45a973b1-fc47-492c-889d-8bed9945d078
  fetched: '2026-11-12'
