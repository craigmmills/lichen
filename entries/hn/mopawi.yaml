summary: A non-profit working with Indigenous and mestizo peoples of the Mosquitia,
  which IUCN says helped develop territorial monitoring plans and trained Indigenous
  monitors in technological tools through VOCES.
facts:
- claim: IUCN's member page describes MOPAWI as a non-profit civil society association
    working with the Indigenous and mestizo peoples of the Mosquitia in north-east
    Honduras.
  url: https://iucn.org/our-union/members/iucn-members/agencia-para-el-desarrollo-de-la-mosquitia?language=fr
  fetched: 2026-11-12
  quote: MOPAWI es una asociación de la sociedad civil, sin fines de lucro, dedicada
    a la misión con los pueblos indígenas y mestizos de la Mosquitia en el noreste
    de Honduras
- claim: IUCN says that as an implementing partner of its VOCES project, MOPAWI has
    helped draw up territorial monitoring plans and protocols and trained Indigenous
    monitors in technological tools for recording and storing information.
  url: https://iucn.org/es/articulo/202506/monitoreo-territorial-una-herramienta-para-la-defensa-de-los-derechos-de-los
  fetched: 2026-11-12
  quote: han facilitado la formulación de planes y protocolos de monitoreo
- claim: The same article says the implementing partners trained Indigenous monitors
    to use technological tools that record and store information.
  url: https://iucn.org/es/articulo/202506/monitoreo-territorial-una-herramienta-para-la-defensa-de-los-derechos-de-los
  fetched: 2026-11-12
  quote: También han capacitado a los monitores indígenas en el uso de herramientas
    tecnológicas que permiten el registro y almacenamiento eficiente de la información.
