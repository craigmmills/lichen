facts:
- claim: Says sea turtles in Cayos Cochinos have been studied since 1998 under the
    Honduras Coral Reef Fund's management as part of a research and conservation programme.
  url: https://www.cayoscochinos.org/marineconservation
  fetched: 2026-11-12
  quote: Since 1998, sea turtles in Cayos Cochinos have been studied under the management
    of the Honduras Coral Reef Fund (HCRF) as part of a Research and Conservation
    Program.
- claim: Its turtle monitoring protocol records morphometrics, nesting behaviour and
    the characteristics of nesting beaches, with tagging under the WIDECAST Sea Turtle
    Tagging Programme.
  url: https://www.cayoscochinos.org/marineconservation
  fetched: 2026-11-12
  quote: The protocol involves recording turtle data, such as morphometric characteristics,
    nesting behavior, and biophysical characteristics of nesting beaches.
- claim: Runs a coral restoration project with nurseries holding over 500 Acropora
    cervicornis fragments, whose volunteers monitor fragments and collect data.
  url: https://www.cayoscochinos.org/marineconservation
  fetched: 2026-11-12
  quote: Volunteers assist in activities such as cleaning structures, monitoring and
    maintaining fragments, and collecting data.
- claim: MAR Fund names the Fundación Hondureña para la Protección y Conservación
    de los Cayos Cochinos as a co-manager of a coastal protected area in northern
    Honduras.
