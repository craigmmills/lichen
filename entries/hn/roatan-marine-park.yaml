summary: A community-based non-profit conserving Roatán's protected marine area, which uses SMART for
  patrols, monitors spawning sites, offers a public reporting app, and in 2026 began mapping sargassum.
facts:
- claim: The Coral Reef Alliance says that with training and access to SMART, its local partners Roatan
    Marine Park and the Bay Islands Conservation Association have improved their patrolling programmes.
  url: https://coral.org/blog/how-technology-can-tackle-illegal-fishing-in-the-western-caribbean/
  fetched: 2026-11-09
  quote: By providing training and access to the tool, our local partners like the Roatan Marine Park
    (RMP) and the Bay Islands Conservation Association have improved their patrolling programs
- claim: The same article describes SMART as letting patrol rangers track activities and record observations
    in one data system.
  url: https://coral.org/blog/how-technology-can-tackle-illegal-fishing-in-the-western-caribbean/
  fetched: 2026-11-09
  quote: SMART improves the management of marine protected areas by allowing patrol rangers to track activities
    and record observations in one simple data system.
- claim: Describes itself as a community-based non-profit dedicated to conserving Roatán's protected marine
    and coastal area.
  url: https://www.roatanmarinepark.org/
  fetched: '2026-11-09'
  quote: We are a community based, nonprofit organization dedicated to the conservation of Roatan’s protected
    marine and coastal area
- claim: Gives its address as West End, Roatán, Honduras.
  url: https://www.roatanmarinepark.org/
  fetched: '2026-11-09'
  quote: West End, Roatán, Honduras
- claim: Its research team monitored two fish spawning aggregation sites on Roatán.
  url: https://www.roatanmarinepark.org/research
  fetched: '2026-11-09'
  quote: the RMP research team monitored two FSA sites on the island of Roatan
- claim: Runs a multi-year programme on three grouper and snapper spawning sites around Roatán.
  url: https://www.roatanmarinepark.org/spawningaggregations
  fetched: '2026-11-09'
  quote: The RMP has a multi-year program focusing on three different spawning sites for grouper and snapper
    around the island of Roatan.
- claim: Offers an app, RMP iPatrol, through which members of the public report to help protect the island's
    natural resources.
  url: https://www.roatanmarinepark.org/
  fetched: '2026-11-09'
  quote: By using this app, you become our eyes and ears and help us towards the protection or our precious
    natural resources and ecosystems
- claim: Says it has worked with SECORE International to set up Roatán's first predictive coral spawning
    calendar.
  url: https://www.roatanmarinepark.org/
  fetched: '2026-11-09'
  quote: we have worked alongside SECORE to establish Roatan’s first-ever predictive coral spawning calendar
- claim: In 2026 its rangers began mapping sargassum arriving on Roatán's coasts, with a goal of 1,500
    hectares of coastal water a month; it says it is working towards an early-warning system for local
    authorities.
  url: https://www.roatanmarinepark.org/post/decoding-the-tide-how-we-re-mapping-roatan-s-changing-sargassum-surge
  fetched: '2026-11-09'
  quote: 'Our rangers set an ambitious goal: map 1,500 hectares of coastal water every single month .'
- claim: Says it joined the University of St Andrews, ILILI, WSORC, RIMS and FINS to start Honduras's
    first baseline for marine mammals using citizen science.
  url: https://www.roatanmarinepark.org/post/the-power-of-collaboration-citizen-science-filling-gaps-of-information-on-marine-mammals-in-roatan
  fetched: '2026-11-09'
  quote: the RMP has joined forces with St. Andrews University , ILILI , WSORC , RIMS and FINS to start
    the country’s first baseline for Marine Mammals using citizens science.
