summary: A private non-profit founded in 1990 with chapters on Utila, Roatán and Guanaja, which monitors
  reefs, seagrass, mangroves and water quality and tracks stony coral tissue loss disease to decide where
  to treat.
facts:
- claim: Monitors new dive sites around Roatan to find where stony coral tissue loss disease has reached
    the reef, and uses this to decide where to treat.
  url: https://www.bicainc.org/bica-roatan-sctld
  fetched: 2026-11-09
  quote: we continue to monitor new dive sites to determine where SCTLD has started to impact the reef.
    This informs where we apply treatments to prevent new areas from becoming infected.
- claim: Tags large treated corals and revisits sites to monitor whether the treatment works.
  url: https://www.bicainc.org/bica-roatan-sctld
  fetched: 2026-11-09
  quote: we place numbered tags on large corals (>50cm wide) that have lesions and we continue to revisit
    the site to monitor the effectiveness of the treatment
- claim: Describes itself as a private non-profit organised in chapters on Utila, Roatan and Guanaja,
    and more recently in Tampa, Florida.
  url: https://www.bicainc.org/bica-roatan-sctld
  fetched: 2026-11-09
  quote: The Bay Islands Conservation Association (BICA) is a private, non-profit, To operate organization
    that has been divided into three chapters strategically located in each of the Islands, Utila, Roatan,
    and Guanaja
- claim: The Coral Reef Alliance says that with training and access to the SMART patrol tool, BICA and
    Roatan Marine Park have improved their patrolling programmes.
  url: https://coral.org/blog/how-technology-can-tackle-illegal-fishing-in-the-western-caribbean/
  fetched: 2026-11-09
  quote: our local partners like the Roatan Marine Park (RMP) and the Bay Islands Conservation Association
    have improved their patrolling programs
- claim: Founded in 1990, it describes itself as working with communities, governments and international
    partners to protect the ecosystems of Utila, Roatán and Guanaja.
  url: https://www.bicainc.org/about-us
  fetched: '2026-11-09'
  quote: Founded in 1990, BICA is the leading conservation nonprofit in Honduras’ Bay Islands.
- claim: Organised as chapters on Utila, Roatán and Guanaja, with a 501(c)(3) in Tampa, Florida, for donations.
  url: https://www.bicainc.org/
  fetched: '2026-11-09'
  quote: divided into three chapters strategically located in each of the Islands, Utila, Roatan, and
    Guanaja, and more recently in Tampa, FL, an established 501c3 to facilitate donations by interested
    parties.
- claim: Gives the address of its Guanaja office as Armadores, Guanaja, Bay Islands, Honduras.
  url: https://www.bicainc.org/ocean-protectors-guanaja-application
  fetched: '2026-11-09'
  quote: Armadores, Guanaja, Bay Islands, Honduras
- claim: Runs regular reef surveys and benthic cover assessments across Utila, Roatán and Guanaja to track
    coral health, bleaching and fish populations.
  url: https://www.bicainc.org/
  fetched: '2026-11-09'
  quote: Across Utila, Roatan and Guanaja, we conduct regular reef surveys and benthic cover assessments
    to track coral health, bleaching events, and fish populations.
- claim: Tracks the health of seagrass beds and mangroves on the three islands.
  url: https://www.bicainc.org/
  fetched: '2026-11-09'
  quote: In Utila, Roatan and Guanaja, we track the health of seagrass beds and mangrove ecosystems
- claim: Monitors water quality on all three islands.
  url: https://www.bicainc.org/
  fetched: '2026-11-09'
  quote: On all three islands, our teams monitor water quality to assess pollution levels and their impacts
    on coastal ecosystems and human health.
- claim: Leads sea turtle beach patrols and nest protection on Utila.
  url: https://www.bicainc.org/
  fetched: '2026-11-09'
  quote: On Utila, BICA leads beach patrols, nest protection, and hatchling releases
- claim: Its Roatán chapter says it has set up a marine water quality monitoring programme.
  url: https://www.bicainc.org/bica-roatan-research-monitoring
  fetched: '2026-11-09'
  quote: we have established a marine water quality monitoring program to assess the state of our marine
    environments
- claim: Its Utila chapter monitors stony coral tissue loss disease at 10 sites around the island.
  url: https://www.bicainc.org/bica-utila-research
  fetched: '2026-11-09'
  quote: As of now we monitor the disease in 10 sites across the whole island.
