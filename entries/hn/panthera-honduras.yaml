summary: Panthera's Honduras programme, active since 2009, which used camera traps to document
  jaguars and now focuses on ranger teams and SMART patrols, reporting a fall in poaching
  in some areas.
facts:
- claim: Panthera has worked in Honduras since 2009 and was among the first to document jaguars
    with camera traps in Pico Bonito, Jeannette Kawas and Cusuco national parks.
  url: https://panthera.org/panthera-honduras
  fetched: 2026-11-12
  quote: Panthera has worked in Honduras since 2009 and is one of the first organizations
    to document the presence of a J aguar using camera traps
- claim: Its current focus includes strengthening ranger teams and implementing SMART patrols
    in key areas.
  url: https://panthera.org/panthera-honduras
  fetched: 2026-11-12
  quote: Today, our focus is on strengthening park ranger teams throughout the corridor, on-site
    security actions, and implementing SMART patrols in key areas.
- claim: Says that through SMART and acoustic monitoring it has documented a fall in poaching
    in some areas of Honduras.
  url: https://panthera.org/panthera-honduras
  fetched: 2026-11-12
  quote: Through SMART and acoustic monitoring , we have documented a reduction in poaching
    activity in some areas of Honduras.
