summary: A Honduran body whose creation, according to a 2020 report to SIRGAS, merged the national geographic
  institute and cadastre directorate, with functions that include coordinating the country's cartographic
  and geodetic system.
facts:
- claim: A 2020 report on geodesy in Honduras to SIRGAS says the creation of the Instituto de la Propiedad
    merged the Instituto Geográfico Nacional and the cadastre directorate into the Dirección General de
    Catastro y Geografía.
  url: https://www.sirgas.org/fileadmin/docs/Boletines/Bol25/09_Geodesia%20en%20Honduras_2020.pdf
  fetched: 2026-11-09
  quote: Con la creación del IP se fusiono el IGN y DEC para formar la Dirección General de Catastro y
    Geografía (DGCG)
- claim: The same report lists among its functions coordinating and developing the country's cartographic
    and geodetic system.
  url: https://www.sirgas.org/fileadmin/docs/Boletines/Bol25/09_Geodesia%20en%20Honduras_2020.pdf
  fetched: 2026-11-09
  quote: Coordinar y desarrollar el Sistema Cartográfico y Geodésico del país.
- claim: The report says the directorate has been called only the Dirección General de Registros since
    2016.
  url: https://www.sirgas.org/fileadmin/docs/Boletines/Bol25/09_Geodesia%20en%20Honduras_2020.pdf
  fetched: 2026-11-09
  quote: A partir del 2016 pasó a llamárse solamente Dirección General de Registros
- claim: The 2020 report lists SINIGH, the national geographic information system, as a planned subsystem
    of the national property administration system.
  url: https://www.sirgas.org/fileadmin/docs/Boletines/Bol25/09_Geodesia%20en%20Honduras_2020.pdf
  fetched: 2026-11-09
  quote: El Sistema Nacional de Información Geográfica de Honduras (SINIGH)
