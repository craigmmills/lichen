summary: A national body that, according to a November 2024 Pew article, was charged by a 2018 agreement
  with knowledge management of environmental resources and was reviewing national mangrove and seagrass
  monitoring methods.
facts:
- claim: A Pew article of November 2024 says a 2018 agreement charges the body with national actions on
    knowledge management of environmental resources.
  url: https://www.pew.org/es/research-and-analysis/articles/2024/11/25/along-honduras-coasts-a-key-to-conservation-success
  fetched: 2026-11-09
  quote: La Mesa Nacional de Monitoreo Biológico, a la que se le encomienda mediante un acuerdo de 2018
    la realización de acciones a nivel nacional para la gestión del conocimiento sobre los recursos medioambientales.
- claim: The same article says the body was reviewing proposals to set national methods for monitoring
    mangroves and seagrass for the first time.
  url: https://www.pew.org/es/research-and-analysis/articles/2024/11/25/along-honduras-coasts-a-key-to-conservation-success
  fetched: 2026-11-09
  quote: La Mesa de Monitoreo Biológico está examinando al mismo tiempo propuestas para determinar por
    primera vez metodologías nacionales de monitoreo de manglares y pastos marinos.
- claim: The article says the body and the national wetlands technical committee were both deactivated
    and reactivated in recent years.
  url: https://www.pew.org/es/research-and-analysis/articles/2024/11/25/along-honduras-coasts-a-key-to-conservation-success
  fetched: 2026-11-09
  quote: ambos fueron desactivados y reactivados en los últimos años
- claim: Government forestry, biodiversity and climate change departments met with NGOs and academics
    at the body's October 2024 meeting in La Ceiba.
  url: https://www.pew.org/es/research-and-analysis/articles/2024/11/25/along-honduras-coasts-a-key-to-conservation-success
  fetched: 2026-11-09
  quote: se reúnen en octubre de 2024 en el encuentro de la Mesa Nacional de Monitoreo Biológico de Honduras
    en La Ceiba
