summary: An EU-funded project that, according to a February 2026 WCS article, has supported conservation
  in La Moskitia, including community camera trapping, track identification and SMART threat recording,
  with WCS and ICF as partners.
facts:
- claim: A WCS article of February 2026 says the EU-funded Five Great Forests of Mesoamerica project has
    supported conservation actions in La Moskitia, Honduras.
  url: https://programs.wcs.org/5greatforests/en-us/News/ID/25854/La-Moskitia-Patrols-restoration-and-cacao-to-protect-Mesoamericas-most-threatened-forest
  fetched: 2026-11-09
  quote: 'With the support of the project Five Great Forests of Mesoamerica: a regional initiative for
    climate, biodiversity, and people , funded by the European Union, Honduras has strengthened conservation
    actions in la Moskitia'
- claim: Community biological monitoring groups install and review camera traps, identify wildlife tracks
    and record threats using SMART.
  url: https://programs.wcs.org/5greatforests/en-us/News/ID/25854/La-Moskitia-Patrols-restoration-and-cacao-to-protect-Mesoamericas-most-threatened-forest
  fetched: 2026-11-09
  quote: community biological monitoring groups install and review camera traps, identify wildlife tracks,
    protect nests, and record threats using the SMART (Spatial Monitoring and Reporting Tool)
- claim: Indigenous organisations DIUNAT and BAKINASTA work in coordination with WCS and ICF on the strategies
    described.
  url: https://programs.wcs.org/5greatforests/en-us/News/ID/25854/La-Moskitia-Patrols-restoration-and-cacao-to-protect-Mesoamericas-most-threatened-forest
  fetched: 2026-11-09
  quote: Indigenous organizations such as DIUNAT and BAKINASTA, in coordination with WCS, the Forest Conservation
    Institute (ICF), and community technicians, are promoting integrated strategies
