summary: A non-profit working on sharks and rays in Honduras through research, education
  and collaboration, including a citizen-science project on eagle rays in the Bay
  Islands.
facts:
- claim: Describes its mission as connecting and empowering coastal communities to
    conserve sharks, rays and their ecosystems through research, education and collaboration.
  url: https://www.ilili.org/about-us
  fetched: 2026-11-12
  quote: To connect and empower coastal communities to conserve sharks, rays, and
    their ecosystems through research, education, and collaboration.
- claim: Its about page tags it as a non-profit.
  url: https://www.ilili.org/about-us
  fetched: 2026-11-12
  quote: sharks, rays, non profit
- claim: Runs a citizen-science project asking dive professionals to share sightings
    to gather data on the abundance and seasonality of eagle rays in the Bay Islands.
  url: https://www.ilili.org/
  fetched: 2026-11-12
  quote: Join our latest citizen science project to gather crucial data on the abundance
    and seasonality of eagle rays in the Bay Islands!
- claim: Its research covers fisheries management, the effectiveness of marine protected
    areas and the shark and ray trade.
  url: https://www.ilili.org/
  fetched: 2026-11-12
  quote: We focus on key areas such as fisheries management, the effectiveness of
    Marine Protected Areas, and the impact of the shark and ray trade.
- claim: The Save Our Seas Foundation lists a project funded in 2026, affiliated to
    ilili and led by Alpha Sevilla, testing the collection of sharks' anal fins as
    a monitoring tool for incidental catches in La Moskitia.
  url: https://saveourseas.com/project/filling-data-gaps-with-fisher-contributed-secondary-fins-in-honduras/
  fetched: 2026-11-12
  quote: Alpha is evaluating the feasibility of collecting secondary fins as a monitoring
    tool to generate crucial data about incidental captures
- claim: In December 2022, Roatan Marine Park named ILILI among the partners with
    which it started Honduras's first marine mammal baseline using citizen science.
  url: https://www.roatanmarinepark.org/post/the-power-of-collaboration-citizen-science-filling-gaps-of-information-on-marine-mammals-in-roatan
  fetched: 2026-11-12
  quote: the RMP has joined forces with St. Andrews University , ILILI , WSORC , RIMS
    and FINS to start the country’s first baseline for Marine Mammals using citizens
    science.
