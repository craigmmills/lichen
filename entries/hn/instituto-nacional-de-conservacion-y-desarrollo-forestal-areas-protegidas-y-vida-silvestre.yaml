summary: Honduras's forest and protected areas institute, which by law must keep the national forest and
  biodiversity inventories updated and runs the forest monitoring information system and SMART-FIRE.
facts:
- claim: Honduran law requires ICF to keep the national forest inventory and the national biodiversity
    inventory up to date.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: debe mantener actualizado el inventario forestal nacional y el inventario nacional de la biodiversidad
- claim: Its 2019 agreement says the national forest monitoring system is ICF's responsibility, supported
    by other institutions with related mandates.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: el Sistema Nacional de Monitoreo de Bosque, aunque es una responsabilidad del ICF, debe ser apoyado
    por las demás instituciones
- claim: A UNDP Honduras article of October 2023 quotes ICF's director saying ICF is now the administrator
    and implementer of SMART-FIRE.
  url: https://www.undp.org/es/node/423061
  fetched: 2026-11-09
  quote: ICF es ahora el administrador e implementador de esta herramienta
- claim: The Bay Islands Conservation Association says it has had a co-management agreement with the institute
    since 1994 to jointly manage the marine and terrestrial protected areas of the Bay Islands.
  url: https://www.bicainc.org/bica-roatan-research-monitoring
  fetched: '2026-11-09'
  quote: Since 1994, BICA has entered into a co-management agreement with the Institute of Forestry Conservation
    and Wildlife (ICF) to jointly manage the marine and terrestrial protected areas in the Bay Islands
    of Honduras.
- claim: MarAlliance lists the institute among its partners.
  url: https://maralliance.org/partners/instituto-de-conservacion-forestal-icf/
  fetched: '2026-11-09'
  quote: Instituto de Conservación Forestal (ICF)
