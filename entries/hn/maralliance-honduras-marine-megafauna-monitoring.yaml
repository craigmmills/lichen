summary: A MarAlliance-run project reporting Honduras's first North Coast shark and ray study, seventeen
  fishers trained in standard monitoring methods and a 2017 Bay Islands baseline survey.
facts:
- claim: MarAlliance says it is conducting the first study of sharks and rays on the North Coast of Honduras,
    to create management tools for protected areas.
  url: https://maralliance.org/fishermen-and-science-new-allies-for-the-conservation-of-sharks-and-rays-in-honduras/
  fetched: '2026-11-09'
  quote: we are conducting the first study of sharks and rays in the North Coast of Honduras, in order
    to create tools for administration and management in protected areas
- claim: Fishers were trained in standard monitoring methods for sharks and rays, including scientific
    longline, baited remote underwater video (BRUVs) and transects.
  url: https://maralliance.org/fishermen-and-science-new-allies-for-the-conservation-of-sharks-and-rays-in-honduras/
  fetched: '2026-11-09'
  quote: standardized scientific methodologies for monitoring sharks and rays were shared, such as scientific
    longline, Baited remote underwater video (BRUVs) and aquatic transects
- claim: Seventeen fishers were trained and took part in collecting marine megafauna data on the northern
    coast.
  url: https://maralliance.org/fishermen-and-science-new-allies-for-the-conservation-of-sharks-and-rays-in-honduras/
  fetched: '2026-11-09'
  quote: 17 fishermen were trained in shark and ray monitoring techniques and actively participated in
    collecting marine megafauna data on the northern coast of Honduras
- claim: MarAlliance's Honduras page says it completed a baseline survey of large marine wildlife across
    the Bay Islands in 2017.
  url: https://maralliance.org/honduras/
  fetched: '2026-11-09'
  quote: Completed the baseline for large marine wildlife throughout the Bay Islands in 2017.
