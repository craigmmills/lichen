summary: A citizen-science project in which divers and snorkellers submit photos of
  spotted eagle rays, identifiable by their markings, to study movements and seasonality
  around the Bay Islands and Mesoamerican Reef.
facts:
- claim: Divers and snorkellers submit images of spotted eagle rays, whose markings
    allow individuals to be identified, to help study their movements and seasonality
    around the Bay Islands and the Mesoamerican Reef.
  url: https://www.ilili.org/citizen-science
  fetched: 2026-11-12
  quote: The images can help us understand the movements of eagle rays and seasonality
    around the Bay Islands and regionally in the Mesoamerican Reef.
- claim: ilili says it developed this as one of two citizen-science projects, in collaboration
    with Roatan Marine Park.
  url: https://www.ilili.org/citizen-science
