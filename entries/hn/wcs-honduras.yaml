summary: Programme run by the Wildlife Conservation Society that, in October 2025,
  reported installing 14 camera traps and six acoustic recorders in Montecristo National
  Park with the Biodiverse Landscapes Fund, and has begun supporting reef monitoring.
facts:
- claim: Its about page says the programme's mission is to conserve the forests of
    La Moskitia through science, conservation and law enforcement actions, and to
    strengthen the livelihoods of indigenous and rural communities.
  url: https://honduras.wcs.org/About-Us/WCS-Honduras.aspx
  fetched: '2026-11-15'
  quote: The program's mission is to conserve La Moskitia forests of Honduras through
    science, conservation and law enforcement actions
- claim: A WCS Honduras news item of October 2025 says the Biodiverse Landscapes Fund
    and WCS installed 14 camera traps and six acoustic recorders in Montecristo National
    Park to strengthen biological monitoring in the Trifinio sub-landscape.
  url: https://honduras.wcs.org/Noticias/ID/25529.aspx
  fetched: '2026-11-15'
  quote: el Fondo de Paisajes Biodiversos (BLF) y Wildlife Conservation Society (WCS)
    instalaron recientemente 14 cámaras trampa y seis grabadoras acústicas (ARUs)
    en el Parque Nacional Montecristo, Honduras.
- claim: The same item says the installation aims to update the record of wild fauna
    in the trinational core zone, identifying medium and large mammals and birds with
    video and sound.
  url: https://honduras.wcs.org/Noticias/ID/25529.aspx
  fetched: '2026-11-15'
  quote: tiene como objetivo actualizar el registro de fauna silvestre de la zona
    núcleo trinacional
- claim: Its projects page says WCS in Honduras has begun work to support the monitoring
    of reefs, fish, sharks and rays.
  url: https://honduras.wcs.org/Proyectos.aspx
  fetched: '2026-11-15'
  quote: ha iniciado trabajos para apoyar el monitoreo de arrecifes, peces, tiburones
    y rayas.
