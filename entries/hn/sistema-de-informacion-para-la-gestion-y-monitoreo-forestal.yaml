summary: ICF's official forest sector information platform, made so by Acuerdo 002-2019, which monitors
  forest cover and draws on other ICF systems including SIRMA, the national forest inventory and an ODK
  collector.
facts:
- claim: Made the official platform of ICF and the State of Honduras for forest sector information, including
    monitoring the state of the country's forests, by ICF Acuerdo 002-2019.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: incluyendo aspectos relevantes, como los son el monitoreo del estado de los bosques del país
- claim: Coordinates three processes, the first being the state and dynamics of forest cover, gains and
    losses.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: El estado y la dinámica de cobertura (ganancias y pérdidas)
- claim: Draws on other ICF platforms, including the national forest information system, the forest spatial
    data infrastructure, the timber traceability system SIRMA, the national forest inventory and an ODK
    open data collector.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: Sistema Informático para Rastreabilidad de la Madera (SIRMA), Inventario Nacional Forestal (INF),
    Colector de Datos Abiertos (ODK por sus siglas en inglés)
- claim: Its technical unit is the Forest Monitoring Unit of ICF's Centro de Información y Patrimonio
    Forestal.
  url: https://redd.unfccc.int/files/publicacion_gaceta__-_002-2019_icf_-_sigmof.pdf
  fetched: 2026-11-09
  quote: Recaerá en la Unidad de Monitoreo Forestal del Centro de Información y Patrimonio Forestal (CIPF)
