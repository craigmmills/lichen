summary: Satellite-based habitat maps of Majuro atoll's shallow waters, showing reefs, seagrass and sand,
  visually interpreted from Quickbird II imagery collected 2004 to 2006 and built by NOAA.
facts:
- claim: NCCOS says the maps were created from satellite images and show coral reefs, seagrass, sand,
    reef flats and other features of the atoll's shallow waters.
  url: https://coastalscience.noaa.gov/products/benthic-habitat-mapping-majuro-republic-marshall-islands/
  fetched: 2026-11-12
  quote: The maps were created from satellite images and depict coral reefs, seagrass, sand, reef flats,
    and other ecosystem features in the shallow waters of the atoll.
- claim: NCCOS describes benthic maps as foundational tools for monitoring and conservation.
  url: https://coastalscience.noaa.gov/products/benthic-habitat-mapping-majuro-republic-marshall-islands/
  fetched: 2026-11-12
  quote: Benthic maps are foundational tools for monitoring, conservation, development planning, stock
    assessments and other management actions.
- claim: NCCOS's project page says habitats were visually interpreted from Quickbird II satellite imagery
    collected between 2004 and 2006, and the maps are available through the NOAA Benthic Map Viewer.
  url: https://coastalscience.noaa.gov/?p=22966
  fetched: 2026-11-12
  quote: Benthic habitats were visually interpreted from Digital Globe’s Quickbird II (QB2) commercial
    satellite imagery collected between 2004 and 2006.
