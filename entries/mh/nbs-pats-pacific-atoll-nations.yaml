summary: Research project on nature-based solutions in a Pacific atoll nation, funded
  by the Environmental Restoration and Conservation Agency, with NIES researchers
  surveying Majuro Atoll in July 2026 to identify priority coral conservation areas
  in the lagoon.
facts:
- claim: NIES describes NbS-PATS as a research project on nature-based solutions in
    a Pacific atoll nation in which NIES researchers take part, with field surveys
    at Majuro Atoll.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: Through AP-PLAT, we introduce a research project on NbS in a Pacific atoll
    nation (NbS-PATS) in which NIES researchers are participating
- claim: One of the team's objectives is to identify priority conservation areas for
    corals in the Majuro lagoon.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: To identify priority conservation areas for corals in the lagoon
- claim: The report describes the project's monitoring of ecosystems and seafloor
    sediments.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: In this article, we will provide an overview of the monitoring of ecosystems
    and seafloor sediments.
- claim: The team also runs surveys and analyses using instrument measurements, satellite
    observations and numerical simulations.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: our research team is simultaneously conducting surveys and analyses that
    utilize continuous measurements using instruments, satellite observations, and
    numerical simulations
- claim: The survey period given for the Majuro field work is July 2026.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: Survey Period July 2026
- claim: The field survey is carried out under a permit from the RMI Environmental
    Protection Authority.
  url: https://ap-plat.nies.go.jp/news/activities/2026/20260728.html
  fetched: 2026-11-13
  quote: The field survey is being conducted under a permit issued by Republic of
    the Marshall Islands Environmental Protection Authority
