summary: National protected areas system created by the PAN Act 2015, run by MIMRA, with monitoring eligible
  for funding and a $25,000 award reported in February 2026 for Bokanbotin.
facts:
- claim: The PAN Act 2015 established a national system of protected areas, a PAN Office and a sustainable
    funding mechanism.
  url: https://rmimimra.com/about-us/rmipan
  fetched: 2026-11-12
  quote: the Protected Areas Network (PAN) Act 2015 was enacted to establish a national system of protected
    areas, a PAN Office to implement the PAN Act, and a sustainable funding mechanism to support the network
    of protected sites.
- claim: Monitoring of protected areas is among the focal areas eligible for PAN Office funding or technical
    support.
  url: https://rmimimra.com/about-us/rmipan
  fetched: 2026-11-12
  quote: (a) Protected areas - the creation, monitoring, management, or enforcement of marine and terrestrial
    protected areas;
- claim: MIMRA's page says the PAN (Amendment) Act 2018 placed PAN oversight with the MIMRA Board, and
    lists PAN Office staff with a MIMRA contact address.
  url: https://rmimimra.com/about-us/rmipan
  fetched: 2026-11-12
  quote: The PAN (Amendment) Act 2018 was enacted to allow PAN oversight by the MIMRA Board as the PAN
    Board
- claim: In February 2026, the Marshall Islands Journal reported that MIMRA’s PAN office activated a $25,000
    PAN Fund Award for the Bokanbotin MPA, the seventh Reimaanlok site to receive PAN funding.
  url: https://marshallislandsjournal.com/mimra-supports-local-conservation/
  fetched: 2026-11-12
  quote: Bokanbotin MPA is now the seventh Reimaanlok site to receive PAN funding.
