facts:
- claim: Says it was incorporated on 16 November 2004.
  url: https://atollconservation.org/about-mics
  fetched: 2026-11-12
  quote: The Marshall Islands Conservation Society was incorporated on 16 November 2004.
- claim: Lists a Coral Reef Monitoring Officer among its staff.
  url: https://atollconservation.org/about-mics
  fetched: 2026-11-12
  quote: Coral Reef Monitoring Officer
- claim: In July 2025, the Marshall Islands Journal reported that MICS had launched a coral heat-tolerance
    testing initiative and established two coral nurseries.
  url: https://marshallislandsjournal.com/working-for-coral-survival/
  fetched: 2026-11-12
  quote: The Marshall Islands Conservation Society (MICS) has launched a coral heat-tolerance testing
    initiative and established two coral nurseries as part of the efforts to support reef restoration
    in the Marshall Islands.
- claim: In June 2025, Island Times reported that TNC was collaborating with MICS to protect reef refugia
    in Majuro.
  url: https://islandtimes.org/tnc-partners-with-mics-to-protect-resilient-reefs-in-majuro-2/
  fetched: 2026-11-12
  quote: is collaborating with the Marshall Islands Conservation Society (MICS) to help protect coral
    reefs that are more resilient to climate change, called reef refugia.
- claim: Its overview lists "Coral Reef Monitoring - UOG Bloomberg" under "In 2026", and "coral Resilience
    Project - TNC CORDAP" among projects it implements or assists.
  url: https://www.atollconservation.org/overview
  fetched: 2026-11-12
  quote: Coral Reef Monitoring - UOG Bloomberg
