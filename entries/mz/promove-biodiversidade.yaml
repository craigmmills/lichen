summary: A closed biodiversity programme managed by BIOFUND under a 13 million euro
  EU agreement signed in 2018, which paid for radio and remote monitoring technology
  in Gilé National Park.
facts:
- claim: BIOFUND managed and monitored the programme; implementing partners held grants
    from BIOFUND.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: O programa é gerido e monitorado pela BIOFUND
- claim: The EU signed a financing agreement of 13 million euros with the Government
    of Mozambique in 2018; BIOFUND's agreement was extended to October 2026.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: A União Europeia celebrou Acordo de Financiamento com o Governo de Moçambique
    através do Gabinete do Ordenador Nacional (GON), em 2018, no valor de 13 milhões
    de Euros.
- claim: In Gilé National Park it paid for a radio system and remote monitoring technology
    that improve control of illegal activity and ecological monitoring.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: a instalação de um sistema de radiocomunicação e tecnologia de monitoria
    remota, permitem maior eficiência no controlo das actividades ilegais e monitoria
    ecológica.
- claim: Its research plans included monitoring coral reefs and mangroves in the Primeiras
    e Segundas islands, continuing surveys previously funded by the Blue Action Fund.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: monitoria dos recifes de coral e dos mangais, dando continuidade aos levantamentos
    anteriormente financiados pelo BAF ( blue action fund)
