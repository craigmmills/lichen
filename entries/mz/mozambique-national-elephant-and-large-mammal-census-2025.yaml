summary: Closed national survey, run by CEAGRE under ANAC's leadership and funded
  by BIOFUND, whose results presented on 24 July 2026 estimate 22,718 elephants, against
  9,114 in the 2018 census.
facts:
- claim: The census was conducted between September and November 2025 with financial
    support from BIOFUND and technical support from IUCN.
  url: https://www.biofund.org.mz/en/?p=39530
  fetched: 2026-11-13
  quote: The census was conducted between September and November 2025, with financial
    support from the Foundation for the Conservation of Biodiversity ( BIOFUND )
- claim: The survey was conducted by CEAGRE in partnership with BassAir Aviation,
    under ANAC's leadership.
  url: https://www.biofund.org.mz/en/?p=39530
  fetched: 2026-11-13
  quote: The survey was conducted by the Centre for Agriculture and Natural Resource
    Management Studies (CEAGRE), in partnership with BassAir Aviation and under the
    leadership of ANAC.
- claim: It produced data on abundance, distribution, population trends, mortality
    and threats.
  url: https://www.biofund.org.mz/en/?p=39530
  fetched: 2026-11-13
  quote: The census provided data on their abundance, distribution, population trends,
    mortality levels and the main threats to their conservation.
- claim: On 23 July 2026, ANAC announced a seminar to disseminate the results on 24
    July 2026.
  url: https://www.biofund.org.mz/en/?p=39530
  fetched: 2026-11-13
  quote: will hold the Seminar to Disseminate the Results of the 2025 National Elephant
    and Large Mammal Census on 24 July 2026.
- claim: The results, presented on 24 July 2026, estimate Mozambique's elephant population
    at 22,718, against 9,114 in the 2018 census.
  url: https://www.biofund.org.mz/en/mozambique-estimates-22718-elephants-and-records-signs-of-wildlife-recovery/
  fetched: 2026-11-13
  quote: Mozambique’s elephant population is now estimated at 22,718 individuals,
    more than double the 9,114 elephants recorded during the previous national census
    in 2018.
