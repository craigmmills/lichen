summary: Covering 453,200 hectares including a buffer zone, this Mozambican national
  park is run by ANAC in partnership with FFS-IGF and uses radio and remote monitoring
  technology.
facts:
- claim: Gilé National Park covers 453,200 hectares, including a 167,100-hectare buffer
    zone. ANAC manages it through a park administration in partnership with FFS-IGF,
    under a technical and financial assistance agreement signed in September 2018.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: A área está sob a gestão da ANAC através da uma estrutura de Administração
    estabelecida no Parque em parceria com a Fundação Internacional para Gestão da
    Fauna (FFS-IGF)
- claim: A radio system and remote monitoring technology installed in the park improve
    control of illegal activity and ecological monitoring.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: a instalação de um sistema de radiocomunicação e tecnologia de monitoria
    remota, permitem maior eficiência no controlo das actividades ilegais e monitoria
    ecológica.
- claim: Raised from national reserve to national park in 2020.
  url: https://www.biofund.org.mz/projects/programa-promove-biodiversidade-2/
  fetched: 2026-11-12
  quote: Inicialmente estabelecida como Reserva Nacional a 23 de Abril de 1932, ascendeu
    à categoria de Parque Nacional em 2020.
