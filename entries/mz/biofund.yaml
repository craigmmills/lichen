summary: Private, non-profit Mozambican environmental fund created in December 2011 for biodiversity conservation,
  which signed a five-year, USD 16 million agreement with Sida in 2022 and runs and built a conservation
  areas platform.
facts:
- claim: Describes itself as a private, non-profit Mozambican environmental fund that manages financial
    resources exclusively for biodiversity conservation in Mozambique.
  url: https://www.biofund.org.mz/en/about-us/what-is-biofund/
  fetched: 2026-11-08
  quote: The BIOFUND – Foundation for the Conservation of Biodiversity is an Environmental Fund, a private
    Mozambican institution, non-profit, with public utility status, which mobilizes, allocates, and manages
    financial resources exclusively for the conservation of biodiversity in Mozambique.
- claim: Gives its address in Maputo.
  url: https://www.biofund.org.mz/en/about-us/what-is-biofund/
  fetched: 2026-11-08
  quote: Bairro Polana Cimento A, Maputo - Mozambique
- claim: Signed a five-year agreement with Sida on 25 November 2022 to finance a Biodiversity Conservation
    Program running from 2023 to 2027 with a budget of USD 16 million.
  url: https://www.biofund.org.mz/en/projects/biodiversity-conservation-program/
  fetched: 2026-11-08
  quote: The Foundation for the Conservation of Biodiversity (BIOFUND) and the Swedish International Development
    Cooperation Agency (SIDA) signed a five-year agreement to finance the Biodiversity Conservation Program
    in Mozambique, on November 25, 2022.
- claim: A private non-profit Mozambican environmental fund that raises, applies and manages money solely
    for biodiversity conservation in Mozambique.
  url: https://www.biofund.org.mz/sobre-nos/oque-e-a-biofund/
  fetched: '2026-11-08'
  quote: A BIOFUND – Fundação para a Conservação da Biodiversidade é um Fundo Ambiental, uma instituição
    moçambicana privada, sem fins lucrativos, com estatuto de utilidade pública, que mobiliza, aplica
    e gere recursos financeiros em benefício exclusivo da conservação da biodiversidade em Moçambique.
- claim: Formally created in December 2011.
  url: https://www.biofund.org.mz/sobre-nos/oque-e-a-biofund/
  fetched: '2026-11-08'
  quote: Com a criação formal da BIOFUND em Dezembro de 2011
- claim: Its site lists a platform on conservation areas.
  url: https://www.biofund.org.mz/
  fetched: '2026-11-08'
  quote: Plataforma sobre as Áreas de Conservação
- claim: Peace Parks Foundation says Biofund supports Limpopo, Banhine and Maputo national parks.
