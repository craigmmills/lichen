summary: Two-yearly aerial census run by four national parks with Peace Parks Foundation
  and ANAC support, combining fixed-wing and helicopter transect surveys; October
  2023 was the first full census in all four.
facts:
- claim: In October 2023 Maputo, Zinave, Banhine and Limpopo National Parks conducted
    an aerial census to determine their wildlife populations, the first full park
    census in all four.
  url: https://www.peaceparkstv.com/?p=9114
  fetched: 2026-11-15
  quote: This was the first time a full park census was conducted in all four of the
    parks.
- claim: The census combines a fixed-wing survey with a helicopter survey along predetermined
    transect lines.
  url: https://www.peaceparkstv.com/?p=9114
  fetched: 2026-11-15
  quote: The aerial census essentially uses two methods
- claim: The census is conducted every two years with support from Peace Parks Foundation
    and ANAC.
  url: https://www.peaceparkstv.com/?p=9114
  fetched: 2026-11-15
  quote: The aerial census is conducted biennially, with support from the Peace Parks
    Foundation (PPF) and Mozambique’s National Administration for Conservation Areas
    (ANAC).
