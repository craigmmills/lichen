summary: Programme developed by WCS Mozambique with government partners from February
  2019, conducting a national KBA assessment by 2020 and Red List assessments for
  67 endemic or near-endemic species.
facts:
- claim: The programme started in February 2019 through a WCS Mozambique partnership
    with the Ministry of Land and Environment's National Directorate of Environment,
    with SPEED+ support, to assess Red List data and map Key Biodiversity Areas.
  url: https://mozambique.wcs.org/Initiatives/Key-Biodiversity-Areas-KBAs.aspx
  fetched: 2026-11-13
  quote: The Key Biodiversity Areas and Red Lists Program in Mozambique started in
    February 2019, when WCS- Mozambique (as one of the government’s main conservation
    partners, and with support from SPEED +, a USAID project) established a partnership
- claim: Its first phase, concluded in 2020, carried out a national KBA assessment
    under the 2016 Global Standard across many biological groups.
  url: https://mozambique.wcs.org/Initiatives/Key-Biodiversity-Areas-KBAs.aspx
  fetched: 2026-11-13
  quote: The first phase of the project, concluded in 2020, was one of the first initiatives
    worldwide to conduct a comprehensive national KBA assessment
- claim: The project carried out Red List assessments for 67 species found only, or
    nearly only, in Mozambique.
  url: https://mozambique.wcs.org/Initiatives/Key-Biodiversity-Areas-KBAs.aspx
  fetched: 2026-11-13
  quote: The project also conducted Red List assessments for 67 species found only,
    or nearly only, in Mozambique
