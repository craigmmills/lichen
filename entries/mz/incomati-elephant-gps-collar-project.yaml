summary: Project that fitted GPS collars on three male elephants in the Incomati Conservation
  Area in September 2024, described by BIOFUND as part of a one-year effort to monitor
  elephant movements in real time.
facts:
- claim: At the end of September 2024 GPS collars were fitted on three male elephants
    in the Incomati Conservation Area in Moamba District.
  url: https://www.biofund.org.mz/en/for-wildlife-and-communities-gps-collars-reduce-human-elephant-conflicts-in-incomati/
  fetched: 2026-11-15
  quote: At the end of September 2024, the Incomati Conservation Area in Moamba District
    was the stage for an important wildlife conservation and protection activity,
    with the fitting of GPS collars on three male elephants
- claim: In October 2024, BIOFUND described the collaring initiative as part of a
    one-year project seeking to monitor elephant movements using GPS collars and real-time
    movement data.
  url: https://www.biofund.org.mz/en/for-wildlife-and-communities-gps-collars-reduce-human-elephant-conflicts-in-incomati/
  fetched: 2026-11-15
  quote: This one-year project seeks to monitor elephant movements using advanced
    technology, such as GPS collars.
