summary: Public-law body overseen by the agriculture minister that finances environmental, forest, biodiversity
  and land programmes, runs the FNDS MRV unit, and as of November 2019 had a geoportal publishing forest
  inventory and emissions data.
facts:
- claim: Its Monitoring, Reporting and Verification (MRV) unit sits within its project management area,
    in the monitoring and evaluation division.
  url: http://www.fnds.gov.mz/mrv/
  fetched: 2026-11-08
  quote: A Unidade de Monitoria, Relatório e Verificação (MRV) faz parte do pelouro de gestão de projectos
    do Fundo Nacional de Desenvolvimento Sustentável, dentro da divisão de monitoria e avaliação
- claim: The 2021 national forest monitoring system document lists, as of November 2019, an FNDS geoportal
    publishing national forest inventory data, Collect Earth data, deforested area and CO2 emissions.
  url: https://redd.unfccc.int/uploads/4993_4c49bb3a4a06_nfms_document_mozambique_ver1_en_final.pdf
  fetched: 2026-11-08
  quote: NFI data, Collect Earth
- claim: A public-law body with administrative and financial autonomy, overseen by the minister responsible
    for agriculture and rural development.
  url: https://www.fnds.gov.mz/index.php/pt/home
  fetched: '2026-11-08'
  quote: O FNDS é uma pessoa colectiva de direito público, com personalidade e capacidade jurídica, dotado
    de autonomia administrativa, financeira e patrimonial
- claim: Finances programmes in environmental management, sustainable forest management, biodiversity
    conservation and land administration.
  url: https://www.fnds.gov.mz/index.php/pt/home
  fetched: '2026-11-08'
  quote: Financiar programas de gestão ambiental, adaptação e mitigação das mudanças climáticas, gestão
