id: sistema-de-informacao-de-biodiversidade-de-mocambique
kind: dataset
name: Sistema de Informação de Biodiversidade de Moçambique
also_known_as:
- SIBMOZ
- Mozambican Biodiversity Information System
scope: mz
ai_label: data-infrastructure
countries:
