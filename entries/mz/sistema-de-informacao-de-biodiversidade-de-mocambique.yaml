status: active
summary: Biodiversity information portal, described by DAI as the country's first, built and run by WCS
  with USAID and UNEP-WCMC funding, launched in 2022 and holding the national ecosystem map.
facts:
- claim: DAI's write-up for the USAID SPEED programme calls it the country's first biodiversity information
    portal.
  url: https://www.dai.com/uploads/Mozambique%20SPEED%20-%20biodiversity%20portal%20writeup-%20branded.pdf
  fetched: 2026-11-08
  quote: Mozambique launched the country’s first information portal, the Mozambican Biodiversity Information
    System (SIBMOZ).
- claim: It is meant to hold all validated biodiversity information for Mozambique.
  url: https://www.dai.com/uploads/Mozambique%20SPEED%20-%20biodiversity%20portal%20writeup-%20branded.pdf
  fetched: 2026-11-08
  quote: SIBMOZ will hold all the validated biodiversity information for Mozambique
- claim: Its launch in 2022 was attended by the Deputy Minister of Land and Environment and the USAID
    Mozambique Mission Director.
  url: https://www.dai.com/uploads/Mozambique%20SPEED%20-%20biodiversity%20portal%20writeup-%20branded.pdf
  fetched: 2026-11-08
  quote: Fernando Bemane de Sousa, the Deputy/Vice Minister of Land and Environment and USAID Mozambique
    Mission Director, Helen Pataki, attended the launch of SIBMOZ in 2022.
- claim: WCS says the national map of ecosystem types is available on SIBMOZ, which it calls the official
    government portal.
  url: https://mozambique.wcs.org/About-Us/News/ID/22905/The-Ministry-of-Land-and-Environment-launches-Mozambiques-historical-vegetation-map-and-red-List-of-Ecosystem-assessment.aspx
  fetched: 2026-11-08
  quote: The map of ecosystem types is available on Mozambique's Biodiversity Information System (SIBMOZ),
    the official government portal
