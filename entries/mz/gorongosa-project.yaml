summary: US-based non-profit with a 20-year agreement to co-manage Gorongosa National Park, which monitors
  wildlife with trail cameras, aerial counts and acoustic recorders, and runs WildCam Gorongosa.
facts:
- claim: Its wildlife monitoring includes a grid of trail cameras, biennial aerial counts by helicopter
    and acoustic recorders.
  url: https://gorongosa.org/ecological-monitoring-2/
  fetched: 2026-11-08
  quote: Our general wildlife monitoring systems include an extensive grid of trail cameras, biennial
    aerial counts by helicopter, and several acoustic recorders that together enable the monitoring of
    large mammals, bats, birds, and insects.
- claim: A grid of 60 trail cameras is permanently set up, with 47 active at the time described; the data
    are processed through WildCam Gorongosa.
  url: https://gorongosa.org/ecological-monitoring-2/
  fetched: 2026-11-08
  quote: An extensive grid of 60 trail cameras is permanently set up to record wildlife distribution and
    activities (47 cameras are active at present). The data are being processed through the Wildcam Gorongosa
    program.
- claim: Tracks fires daily with NASA's FIRMS and assesses deforestation on Mount Gorongosa with high-resolution
    satellite imagery.
  url: https://gorongosa.org/ecological-monitoring-2/
  fetched: 2026-11-08
  quote: more detailed assessment of deforestation on Mt. Gorongosa using high-resolution satellite imagery
- claim: Its monitoring serves a long-term agreement between the Carr Foundation and the Mozambican government
    on co-managing Gorongosa.
  url: https://gorongosa.org/ecological-monitoring-2/
  fetched: 2026-11-08
  quote: Ecological Monitoring contributes to the mission of the Long-term Agreement between the Carr
    Foundation and the Mozambican government regarding the co-management of Gorongosa.
- claim: Describes itself as a US-based non-profit that has a 20-year agreement with the Government of
    Mozambique to co-manage Gorongosa National Park.
  url: https://gorongosa.org/partners-and-donors/
  fetched: '2026-11-08'
  quote: The management and conservation of Gorongosa National Park is a joint effort between the Government
    of Mozambique and The Gorongosa Restoration Project, a US-based non-profit. They have signed a 20-year
    agreement to co-manage the Park
- claim: Runs seven science programmes through its own staff and external researchers, including ecological
    monitoring.
  url: https://gorongosa.org/science/
  fetched: '2026-11-08'
  quote: This is implemented through seven major science programs that are inter-linked and mutually supporting.
    The Programs are realized through GP's own staff in partnership with a wide range of external researchers
    and institutions.
- claim: Lists ecological monitoring among its science programmes.
  url: https://gorongosa.org/science/
  fetched: '2026-11-08'
  quote: Long-term biological monitoring is essential to document properties of species and ecosystems
    over time.
- claim: Its spatial data management programme does data engineering, analysis and map production.
  url: https://gorongosa.org/science/
  fetched: '2026-11-08'
  quote: We perform data engineering and data analysis, followed by visualization and map production.
- claim: The E.O. Wilson Biodiversity Laboratory in Chitengo is the hub through which its science programmes
    are delivered.
  url: https://gorongosa.org/science/
  fetched: '2026-11-08'
  quote: the E.O. Wilson Biodiversity Laboratory in Chitengo has been the physical facility and central
    hub through which the different programs of Science are being delivered
- claim: Keeps an interactive biodiversity database of species occurrences in the park.
  url: https://gorongosa.org/science/
  fetched: '2026-11-08'
  quote: We have an interactive database that is constantly being updated. You can access it at the Science
    Center to learn about species occurrences
- claim: ANAC gives the 2008 public-private partnership for the park as one between the Government and
    the Carr Foundation.
  url: https://www.anac.gov.mz/en/parques/gorongosa/
  fetched: '2026-11-08'
  quote: In 2008, a 20-year public-private partnership for managing the Park was established between the
    Government and the Carr Foundation
