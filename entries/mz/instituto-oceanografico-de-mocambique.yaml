summary: Described by the Bazaruto Center for Scientific Studies as Mozambique's oceanographic
  institute under MIMAIP and national marine research body, it partnered with WCS
  on BRUVS monitoring in December 2025.
facts:
- claim: The Bazaruto Center for Scientific Studies describes InOM as the oceanographic
    institute under MIMAIP and the national body for marine and coastal research.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-13
  quote: InOM – Instituto Oceanográfico de Moçambique, the Oceanographic Institute
    under Mozambique’s Ministry of the Sea, Inland Waters and Fisheries (MIMAIP),
    serving as the national body for marine and coastal research – government of Mozambique.
- claim: In December 2025 InOM, in partnership with WCS Mozambique, carried out its
    third BRUVS shark and ray monitoring campaign in Chidenguele and Chizavane.
  url: https://mozambique.wcs.org/About-Us/News/ID/25786.aspx
  fetched: 2026-11-13
  quote: O Instituto Oceanográfico de Moçambique (InOM), em parceria com a Wildlife
    Conservation Society (WCS) Moçambique, realizou entre os dias 1 e 8 de Dezembro
    de 2025, a terceira campanha de monitoria de tubarões e raias
- claim: InOM and WCS have run regular BRUVS monitoring campaigns along the Mozambican
    coast since 2018.
  url: https://mozambique.wcs.org/About-Us/News/ID/25786.aspx
  fetched: 2026-11-13
  quote: Desde 2018, o InOM e a WCS têm vindo a realizar campanhas regulares de monitoria
    com recurso aos BRUVs ao longo da costa moçambicana
- claim: An InOM technician took part, with WCS and the Marine Megafauna Association,
    in a Global FinPrint BRUVS survey of sharks and rays in Bazaruto Archipelago National
    Park.
  url: https://mozambique.wcs.org/About-Us/News/ID/23400.aspx
  fetched: 2026-11-13
  quote: is carrying out a survey as part of an initiative called Global FinPrint,
    which brings together researchers and collaborators from all over the world to
    study sharks, rays and other marine species on coral reefs using BRUVS in the
    Bazaruto Archipelago National Park.
