summary: Eduardo Mondlane University museum created in 1913, with insect, fish and bird collections, a
  DNA biobank, GBIF datasets, and a reported role in a marine resources survey of about 2,700 km of coast.
facts:
- claim: Part of Eduardo Mondlane University and created in 1913, it is described as the oldest museum
    in Mozambique.
  url: https://api.gbif.org/v1/organization/5e1f6688-3fda-49f1-89e3-f4e895a02f8f
  fetched: 2026-11-08
  quote: It is the oldest museum in Mozambique and the only one of its kind in the country. It was created
    in 1913
- claim: Its record says its entomological collection is the largest and oldest insect collection in Mozambique.
  url: https://api.gbif.org/v1/organization/5e1f6688-3fda-49f1-89e3-f4e895a02f8f
  fetched: 2026-11-08
  quote: The Entomological collection of the Museum of Natural History is the largest and oldest collection
    of insects in Mozambique, containing specimens of almost all orders that occur in the country.
- claim: It publishes a GBIF dataset of its wet collection of marine fish from the Mozambican coast, collected
    between 1950 and 2017.
  url: https://api.gbif.org/v1/organization/5e1f6688-3fda-49f1-89e3-f4e895a02f8f/publishedDataset
  fetched: 2026-11-08
  quote: This dataset comprises the wet collection of marine fish from the Mozambican coast
- claim: Its bird collection dataset lists 3,823 specimens in 446 species.
  url: https://api.gbif.org/v1/organization/5e1f6688-3fda-49f1-89e3-f4e895a02f8f/publishedDataset
  fetched: 2026-11-08
  quote: Foram arrolados nesta base de dados 3823 espécimes subdivididos em 30 ordens, 194 géneros e 446
    espécies.
- claim: Its biobank runs DNA extraction and PCR on samples of insects, fish, buffalo dung, sharks and
    rays.
  url: https://mhnm.uem.mz/index.php/biobanco/
  fetched: 2026-11-08
  quote: Executar técnicas de extração e PCR ( insectos, peixes, fezes de Búfalo, Tubarões e Raias);
- claim: Its research lines include DNA barcoding of insects and of marine and freshwater fish, and fish
    distribution.
  url: https://mhnm.uem.mz/index.php/linhas-de-investigacao/
  fetched: 2026-11-08
  quote: Barcoding de insectos Barcoding de peixes marinhos e de água doce e distribuição
- claim: Its website names it the Museu de História Natural de Maputo.
  url: http://mhnm.uem.mz/
  fetched: 2026-11-08
  quote: Bem-vindo ao Museu de História Natural de Maputo
- claim: In September 2026 it reported that its scientists are part of the international team on a survey
    and assessment of marine resources along about 2,700 km of the Mozambican coast.
  url: https://mhnm.uem.mz/index.php/2026/09/11/mapeando-os-gigantes-do-oceano-de-mocambique-um-levantamento-nacional-das-baleias-jubarte/
  fetched: 2026-11-08
  quote: cientistas do Museu de História Natural da Universidade Eduardo Mondlane (UEM) integram a equipa
    científica internacional que participa neste levantamento e avaliação do recursos marinhos ao longo
    de um pouco mais de 2.700 km da costa moçambicana
