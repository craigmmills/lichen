summary: Satellite-tagging survey in Bazaruto Archipelago National Park, reported in October 2024 by the
  Mail & Guardian, in which twelve dugongs, seven male and five female, were fitted with tracking tags.
facts:
- claim: In October 2024, the Mail & Guardian reported the launch of a satellite-tagging survey in Bazaruto
    Archipelago National Park to track dugong movements.
  url: https://mg.co.za/news/africa/2024-10-19-why-mozambique-is-tracking-dugong-movements-with-satellite-technology/
  fetched: 2026-11-08
  quote: Mozambique has launched an extensive survey using rare satellite tagging technology in Bazaruto
    Archipelago National Park in a bid to track dugong movements and safeguard their habitat.
- claim: Seven male and five female dugongs were fitted with tracking tags.
  url: https://mg.co.za/news/africa/2024-10-19-why-mozambique-is-tracking-dugong-movements-with-satellite-technology/
  fetched: 2026-11-08
  quote: The tracking project saw seven male and five female dugongs fitted with specialised tracking
    tags.
