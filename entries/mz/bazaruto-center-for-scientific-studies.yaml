summary: A registered research centre on Benguerra Island that describes itself as
  Africa's first permanent ocean observatory, using moorings, sensors and remote sensing,
  and says all validated data are publicly available.
facts:
- claim: Describes itself as the first permanent ocean observatory in Africa and the
    Western Indian Ocean, based in Bazaruto Archipelago National Park and dedicated
    to long-term monitoring of marine and coastal ecosystems.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: Based in the Bazaruto Archipelago National Park (BANP), BCSS is dedicated
    to the long-term monitoring of marine and coastal ecosystems through multi-ecosystem
    time-series research.
- claim: Observations use moorings, floating devices, weather stations, hydroacoustic
    receivers, water sampling, biosampling, remote sensing and multi-parameter sensors.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: Observations occur continuously and on a monthly basis via moorings, floating
    devices, weather stations, hydroacoustic receivers, water sampling, biosampling,
    remote sensing, and multi-parameter sensors.
- claim: Says all validated data are made publicly available through an open-access
    online platform.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: All validated data are made publicly available through an open-access online
    platform
- claim: Operates under the BCSS Foundation, recognised by the Government of Mozambique,
    and is a registered research centre.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: BCSS operates under the BCSS Foundation (Fundação Centro de Estudos Científicos
    do Bazaruto), officially recognized by the Government of Mozambique.
- claim: The UN commitment record lists it as a non-governmental organisation with
    headquarters on Benguerra Island.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: Benguerra Island, Mozambique
- claim: Funded through a partnership with the Kisawa resort, which with BCSS commits
    to raise at least 400,000 US dollars a year for the observatory.
  url: https://sdgs.un.org/partnerships/ocean-intelligence-action-bcss-time-series-platform-heart-wio
  fetched: 2026-11-12
  quote: via unique Resort 2 Research Partnership between BCSS and Kisawa, both entities
    are committed to raising at least $400,000 of annual revenue
