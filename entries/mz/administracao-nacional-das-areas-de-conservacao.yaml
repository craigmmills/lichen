summary: Mozambican state institution created in 2011 to coordinate the National System of
  Conservation Areas, administering parks, reserves and hunting areas, and described by Peace
  Parks Foundation as the country's conservation authority.
facts:
- claim: Its stated mission is to coordinate and develop the National System of the Conservation
    Areas.
  url: https://www.anac.gov.mz/en/anac/
  fetched: 2026-11-08
  quote: To coordinate and develop the National System of the Conservation Areas and assure
    the sustainable and participatory use of biodiversity.
- claim: Has a Planning and Monitoring Department and a CITES Unit.
  url: https://www.anac.gov.mz/en/anac/
  fetched: 2026-11-08
  quote: Planning and Monitoring Department
- claim: Gives its address in Maputo.
  url: https://www.anac.gov.mz/
  fetched: 2026-11-08
  quote: Rua da Resistência, nº 1746/1747 8º andar
- claim: Was created in 2011, in the same policy step as BIOFUND, according to BIOFUND.
  url: https://www.biofund.org.mz/en/about-us/what-is-biofund/
  fetched: 2026-11-08
  quote: These two Policy objectives were realized in 2011 with the creation of the National
    Administration of Conservation Areas (ANAC) and the Foundation for the Conservation of
    Biodiversity (BIOFUND).
- claim: Founded in 2011 as a state institution responsible for biodiversity conservation
    and ecotourism in Mozambique.
  url: https://www.anac.gov.mz/anac/
  fetched: '2026-11-08'
  quote: Fundada em 2011, a Administração Nacional das Áreas de Conservação (ANAC) é uma instituição
    do Estado responsável pela conservação da biodiversidade e o desenvolvimento sustentável
    do ecoturismo no país.
- claim: Created to administer parks and reserves, official hunting areas, game farms and
    other conservation areas placed under it.
  url: https://www.anac.gov.mz/anac/
  fetched: '2026-11-08'
  quote: A ANAC é uma instituição do Governo que foi criada com o objetivo de administrar
    os Parques e Reservas, Coutadas Oficiais, Fazendas do Bravio e demais Áreas de Conservação
- claim: Has a planning and monitoring department.
  url: https://www.anac.gov.mz/anac/
  fetched: '2026-11-08'
  quote: Departamento de Planificação e Monitoria
- claim: Address in Maputo.
  url: https://www.anac.gov.mz/en/parques/gorongosa/
  fetched: '2026-11-08'
  quote: Avenida 10 de Novembro, nº 40, Praceta 1196
- claim: Peace Parks Foundation describes ANAC as the conservation authority in Mozambique
    and says it partners closely with it on Limpopo, Banhine, Zinave and Maputo national parks.
  url: https://www.peaceparks.org/about/donors-and-partners/
  fetched: '2026-11-08'
  quote: ANAC is the conservation authority in Mozambique. We partner closely with them to
    protect and develop Limpopo, Banhine and Zinave National Parks
