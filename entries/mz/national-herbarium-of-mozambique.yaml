facts:
- claim: Founded in 1967, it holds the country's largest reference collection of dried plant specimens,
    over 70,000 accessions focused on Mozambique's wild plants.
  url: https://api.gbif.org/v1/organization/7d77970a-28ba-43e3-9dc8-de37db3e1894
  fetched: 2026-11-08
  quote: houses the country’s largest reference collection of dried, pressed plant specimens, currently
    comprising over 70.000 accessions, focusing on the wild plant diversity of Mozambique.
- claim: Its record says it contributes to conservation planning by mapping species distributions, assessing
    conservation status and identifying plant hotspots.
  url: https://api.gbif.org/v1/organization/7d77970a-28ba-43e3-9dc8-de37db3e1894
  fetched: 2026-11-08
  quote: the herbarium provides considerable inputs into conservation planning through mapping species’
    distributions, assessing their conservation status and identifying plant “hotspots”.
- claim: It publishes through GBIF a dataset titled Mozambique Endemic and Near-Endemic Red Listed Plant
    Species.
