summary: Garowe-based centre set up in late 2019 to collect and disseminate Puntland land and water data,
  handed to Somalia's Government in December 2021 and publishing a roughly 219 km² Jibagalle land cover
  assessment in May 2026.
facts:
- claim: The centre says it was set up in late 2019 to collect, process, analyse and disseminate data
    on Puntland's land and water resources.
  url: https://imcpuntland.so/about/
  fetched: 2026-11-12
  quote: established in late 2019 to serve as a centre for the collecting, processing, analysis, and dissemination
    of vital data related to land and water resources in Puntland, Somalia
- claim: Its data collection covers land use, land cover and land degradation, among other topics.
  url: https://imcpuntland.so/about/
  fetched: 2026-11-12
  quote: particularly focused on land use, land cover, Land degradation, Soil and Suitability and water
    resource management
- claim: Its office is on Ministries Road in Garowe.
  url: https://imcpuntland.so/about/
  fetched: 2026-11-12
  quote: Ministries Road, Near to WFP Head Quater, Garowe – Puntland
- claim: FAO says the EU and FAO handed the centre over to the Government of Somalia on 6 December 2021,
    as part of the EU-funded Integrated Land and Water Resources Management project.
  url: https://www.fao.org/emergencies/resources-repository/news/detail/eu-and-fao-handover-a-new-water-and-land-information-management-centre/en
  fetched: 2026-11-12
  quote: officially handed over the new Information Management Centre (IMC) to the Government of Somalia
- claim: In May 2026 it published a land cover assessment of about 219 km² around Jibagalle, using GIS,
    remote sensing and FAO's LCCS3 classification, covering land degradation and vegetation dynamics.
  url: https://imcpuntland.so/2026/05/14/imc-puntland-launches-jibagalle-land-cover-assessment-and-mapping-report/
  fetched: 2026-11-12
  quote: a comprehensive assessment of land cover, land use, and environmental degradation within the
    Jibagalle area using advanced Geographic Information Systems (GIS), Remote Sensing technologies
