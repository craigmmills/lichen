summary: Programme FAO says it set up from 2002 as a platform on Somalia's water and land resources, with
  its tools and services handed to the Puntland centre as a first step towards national ownership.
facts:
- claim: FAO says it set up a platform for managing and developing Somalia's water and land resources
    through the SWALIM project from 2002, providing information on the scope, extent, quality and quantity
    of those resources across the country (page of December 2021).
  url: https://www.fao.org/emergencies/resources-repository/news/detail/eu-and-fao-handover-a-new-water-and-land-information-management-centre/en
  fetched: 2026-11-12
  quote: FAO established a secure platform for the management and development of Somalia’s WAL resources
    managed through the Somalia Water and Land Information Management (SWALIM) project since 2002.
- claim: FAO describes the handover of information management tools, products and services from SWALIM
    to the Puntland IMC as a first step towards national ownership of the SWALIM programme.
  url: https://www.fao.org/emergencies/resources-repository/news/detail/eu-and-fao-handover-a-new-water-and-land-information-management-centre/en
  fetched: 2026-11-12
  quote: a first step in the planned phased transition towards national ownership of the SWALIM programme
