summary: Somali government ministry in Mogadishu that lists wildlife and biodiversity conservation among
  its services, and which UNDP said in February 2026 would lead a six-year nationwide biodiversity programme.
facts:
- claim: The ministry lists wildlife and biodiversity conservation among its services, covering Somalia's
    terrestrial and marine ecosystems.
  url: https://moecc.gov.so/
  fetched: 2026-11-12
  quote: We advance the conservation and sustainable management of Somalia's terrestrial and marine ecosystems
    through science-based biodiversity conservation
- claim: The ministry's address is in Mogadishu.
  url: https://moecc.gov.so/
  fetched: 2026-11-12
  quote: 'Address: Abdiaziz District, Lansertt, Mogadishu, Somalia'
- claim: The ministry lists a Global Biodiversity Framework Early Action Support (GBF-EAS) project among
    those it implements with development partners.
  url: https://moecc.gov.so/
  fetched: 2026-11-12
  quote: Global Biodiversity Framework Early Action Support (GBF-EAS)
- claim: In February 2026, UNDP said the six-year Somalia biodiversity programme would be implemented
    nationwide under the ministry’s leadership, with UNDP as implementing partner.
  url: https://www.undp.org/somalia/press-releases/somalia-launches-national-biodiversity-conservation-programme
  fetched: 2026-11-12
  quote: The six-year Somalia biodiversity programme will be implemented nationwide under the leadership
    of the Ministry of Environment and Climate Change, with UNDP as the implementing partner.
