id: somalia-biodiversity-conservation-and-ecosystem-restoration-project
kind: project
name: Conserving Terrestrial and Marine Biodiversity and Restoring Ecosystem Services
  in Globally Relevant and Vulnerable Sites in Somalia
also_known_as:
- Biodiversity Conservation and Ecosystem Restoration Project
- Somalia biodiversity programme
scope: so
ai_label: conservation-tech
realms:
- land
- ocean
countries:
- so
status: active
website: https://moecc.gov.so/projects/biodiversity-conservation-and-ecosystem-restoration-project/
summary: An ongoing US$18.9 million project (April 2026 to March 2032) covering 11
  proposed protected areas, led by the environment ministry with UNDP and GEF, with
  a planned biodiversity data platform including GIS.
facts:
- claim: The ministry's project page gives a start date of April 2026, an end date
    of March 2032 and the status ongoing.
  url: https://moecc.gov.so/projects/biodiversity-conservation-and-ecosystem-restoration-project/
  fetched: 2026-11-15
  quote: 'Project Start Date: April 2026'
- claim: Its third component lists strengthening biodiversity monitoring and data
    collection among its key activities.
  url: https://moecc.gov.so/projects/biodiversity-conservation-and-ecosystem-restoration-project/
  fetched: 2026-11-15
  quote: Strengthening biodiversity monitoring and data collection.
- claim: The same component lists development of a national biodiversity knowledge-management
    platform and GIS system.
  url: https://moecc.gov.so/projects/biodiversity-conservation-and-ecosystem-restoration-project/
  fetched: 2026-11-15
  quote: Development of a national biodiversity knowledge-management platform and
    GIS system.
- claim: The project covers 11 proposed terrestrial and marine protected areas, with
    biodiversity monitoring and management-effectiveness assessments among the activities
    of its second component.
  url: https://moecc.gov.so/projects/biodiversity-conservation-and-ecosystem-restoration-project/
  fetched: 2026-11-15
  quote: Biodiversity monitoring and management-effectiveness assessments.
- claim: An August 2026 assignment notice on the ministry's site says the project's
    agreement requires the ministry to hire an expert firm to establish a biodiversity
    data management platform, including GIS, covering all 11 sites. The notice describes
    the platform as planned.
  url: https://moecc.gov.so/establishment-of-a-national-biodiversity-data-management-knowledge-management-and-gis-platform-covering-all-11-project-sites/
  fetched: 2026-11-15
  quote: The LOA requires MoECC to hire an expert firm to establish the data management
    platform covering all 11 sites.
- claim: UNDP says the US$18.9 million project was launched by the Federal Government
    of Somalia with UNDP and the GEF.
  url: https://www.undp.org/somalia/press-releases/somalia-launches-national-biodiversity-conservation-programme
  fetched: 2026-11-15
  quote: The Federal Government of Somalia, in partnership with the United Nations
    Development Programme (UNDP) and the Global Environment Facility (GEF), launched
    a US$18.9 million project
