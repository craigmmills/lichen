summary: Long-term programme tracking common birds in Andorra with volunteer ornithologists
  since 2011, supplying data to European bird censuses, with 25 transects operating
  in the 2025 breeding period.
facts:
- claim: Andorra Recerca + Innovació's project page describes SOCA as a long-term
    tracking programme of Andorran bird fauna run with volunteer ornithologists.
  url: https://ari.ad/en/projects/soca-tracking-birds-common-andorra
  fetched: 2026-11-15
  quote: Long term tracking program of Andorran bird fauna ; a project made possible
    thanks to the participation of volunteer ornithologists.
- claim: Its objectives include obtaining data over time on the populations of common
    birds in Andorra.
  url: https://ari.ad/en/projects/soca-tracking-birds-common-andorra
  fetched: 2026-11-15
  quote: Obtain data over time on the populations of common birds in the Principality
    of Andorra.
- claim: Its objectives include contributing Andorran data to the European Bird Census
    Council, coordinator of the Pan European Common Bird Census Scheme.
  url: https://ari.ad/en/projects/soca-tracking-birds-common-andorra
  fetched: 2026-11-15
  quote: Contribute with Andorran data to the European Bird Census Council
- claim: The project page gives a start date in 2011.
  url: https://ari.ad/en/projects/soca-tracking-birds-common-andorra
  fetched: 2026-11-15
  quote: 'Start date: 12/01/2011'
- claim: The report for winter 2024-25 and the 2025 breeding season says 25 transects
    were in operation during the 2025 breeding period.
  url: https://ari.ad/images/projectes/soca/Mem%C3%B2ria%20SOCA%20hivern%202024-25%20i%20nidificants%202025.pdf
  fetched: 2026-11-15
  quote: Durant el període de nidificació de 2025 han estat en funcionament 25 transsectes
- claim: The EBBA2 atlas lists SOCA, attributed to the Institut d'Estudis Andorrans,
