  quote: Dispositiu interdisciplinar de recerca a llarg termini que pretén estudiar la dinàmica espacial
    i temporal dels ecosistemes de muntanya.
- claim: Its study area in Andorra is the Estanyó valley in the Vall de Sorteny Natural Park.
  url: https://ari.ad/projectes/observatori-sentinel
  fetched: '2026-11-12'
