summary: A 2021 checklist of Andorran flora with conservation status and regulation
  for each species, covering 1,604 taxa, 309 of them in a threat category, run by
  Andorra Recerca + Innovació.
facts:
- claim: The 2021 Andorran Flora Master List brings together the checklist and the
    conservation status and regulation of each species, with 1,604 taxa, 309 in a
    threat category.
  url: https://ari.ad/en/projects/endangered-flora-andorra
  fetched: 2026-11-13
  quote: It currently consists of 1.604 different taxa, 309 of which are in some threat
    category (CR, EN or VU) and 54 in the Data Deficient (DD) category.
- claim: The Red List of Andorran flora follows IUCN criteria and categories at regional
    and national level.
  url: https://ari.ad/en/projects/endangered-flora-andorra
  fetched: 2026-11-13
  quote: The classification by degree of threat of the flora species on the red list
    of the flora of Andorra follows the IUCN criteria and categories at regional and
    national level (IUCN, 2012).
