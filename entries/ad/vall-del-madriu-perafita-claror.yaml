  a new conservation plan.
facts:
- claim: The valley's Management Commission promotes and hosts monitoring and research projects each year
    on how its ecosystems, flora and fauna change.
  url: https://www.madriu-perafita-claror.ad/en/?p=45277
  fetched: '2026-11-12'
  quote: Year after year, the Management Commission promotes and hosts monitoring and research projects
- claim: Keeps biological indicator monitoring programmes to detect changes in biodiversity, though its
    general species and habitat monitoring has been suspended since 2024 pending a new conservation plan.
  url: https://www.madriu-perafita-claror.ad/en/?p=45277
  fetched: '2026-11-12'
  quote: the VMPC maintains biological indicator monitoring programmes that make it possible to detect
    changes in biodiversity year after year
- claim: General monitoring of species and habitats has been temporarily suspended since 2024.
  url: https://www.madriu-perafita-claror.ad/en/?p=45277
  fetched: '2026-11-12'
  quote: This general monitoring of species and habitats of particular relevance has been temporarily
    suspended since 2024.
- claim: Its visitor centre is at Borda Gabriel in Escaldes-Engordany.
  url: https://www.madriu-perafita-claror.ad/en/?p=45277
