summary: Programme monitoring vegetation in two Andorran and fourteen wider Pyrenean
  snowbeds yearly with one method since 2011, using temperature loggers and, from
  2017, open top warming chambers.
facts:
- claim: Since 2011 the vegetation of two snowbeds in Andorra and fourteen across
    the Pyrenees has been monitored every year with the same method.
  url: https://www.ari.ad/en/projects/following-snowdrift-vegetation
  fetched: 2026-11-15
  quote: Since 2011, the vegetation of two snowbeds in Andorra and a set of fourteen
    in all the Pyrenees have been monitored annually, applying the same methodology.
- claim: Each plot has a temperature data logger giving the date of snow melt.
  url: https://www.ari.ad/en/projects/following-snowdrift-vegetation
  fetched: 2026-11-15
  quote: In addition, in each plot there is a temperature data logger that allows
    us to know precisely the date of the snow melting.
- claim: Open top chambers simulating about 2 degrees of warming were installed in
    several snowbeds in 2017.
  url: https://www.ari.ad/en/projects/following-snowdrift-vegetation
  fetched: 2026-11-15
  quote: In 2017, a specific study of simulation of warm-up using Open Top Chambers
    (OTC) was started in various snowbeds
- claim: The page says the project is funded by the Interreg-POCTEFA programme and
    the Government of Andorra's Department of Higher Education, Research and Study
    Grants.
  url: https://www.ari.ad/en/projects/following-snowdrift-vegetation
  fetched: 2026-11-15
  quote: This project is funded by the Interreg-POCTEFA program and the Department
    of Higher Education, Research and Study Grants
