summary: Private foundation of the public sphere, created by Law 11/2021 from three earlier bodies, that
  represents Andorra in GBIF and was reported in July 2026 to be leading a pilot testing AI, 3D scanning
  and drones for forest inventories.
facts:
- claim: Describes itself as a private foundation of the public sphere whose mission is to generate knowledge
    and develop innovative solutions.
  url: https://ari.ad/
  fetched: '2026-11-12'
  quote: Andorra Recerca Innovació (AR+I) és una fundació privada de l’àmbit públic que té com a missió
    generar coneixement i desenvolupar solucions innovadores
- claim: Its address is in Sant Julià de Lòria, Andorra.
  url: https://ari.ad/
  fetched: '2026-11-12'
  quote: AD600 Sant Julià de Lòria
- claim: Law 11/2021 created it on the basis of three earlier bodies, including the Institut d'Estudis
    Andorrans, which were wound up.
  url: https://www.consellgeneral.ad/ca/activitat-parlamentaria/lleis-aprovades/llei-11-2021-del-13-de-maig-de-creacio-de-la-fundacio-privada-del-sector-public-andorra-recerca-i-innovacio/at_download/PDF
  fetched: '2026-11-12'
  quote: Aquesta nova entitat es construirà sobre la base de tres de les institucions esmentades
- claim: Took over from the Institut d'Estudis Andorrans' snow and mountain centre as Andorra's representative
    in GBIF and contributes the country's biodiversity data.
  url: https://ari.ad/en/projects/gbif
  fetched: '2026-11-12'
  quote: Currently, Andorra Research + Innovation has taken over and continues to participate with the
    contribution of data on the country’s biodiversity.
- claim: In July 2026, Alto, an Andorran news site, reported that AR+I was leading a pilot in the POCTEFA-funded
    BOSPIR-3D project to test artificial intelligence, 3D scanning and drones for high-mountain forest
    inventories.
  url: https://www.alto.ad/environment/2026/07/andorra-3d-scanning-drones-mountain-forests
  fetched: '2026-11-12'
  quote: Andorra Recerca + Innovació (AR+I) is leading a pilot study in the European BOSPIR-3D project,
    testing artificial intelligence, short-range 3D scanning, and other digital tools to improve forest
    inventories in high-mountain areas.
