summary: Former Liechtenstein environment office, closed on 1 August 2026 when its name was replaced in
  law by two offices, and which held main responsibility for many measures in the 2024 draft action plan.
facts:
- claim: The draft action plan cites the office as author of Liechtenstein's fifth national report on
    implementing the Convention on Biological Diversity.
  url: https://regierung.li/files/attachments/aktionsplan-biodiversitaet-konsultationsentwurf.pdf
  fetched: 2026-11-12
  quote: 18 Amt für Umwelt (2014), 5. Nationaler Bericht zur Umsetzung des Übereinkommens über die Biologische
    Vielfalt
- claim: The 2024 draft action plan named the office as holding main responsibility for a large number
    of its measures.
  url: https://regierung.li/files/attachments/aktionsplan-biodiversitaet-konsultationsentwurf.pdf
  fetched: 2026-11-12
  quote: Für eine grosse Anzahl der im Aktionsplan aufgeführten Massnahmen steht das Amt für Umwelt
- claim: Liechtenstein’s 2017 national report to the CMS COP12, with the National Office of Environment
    as contact, reported that a monitoring system for invasive alien species had been in place since 2013.
  url: https://cms.int/huemul/sites/default/files/document/cms_cop12_nr_lie_e_0.pdf
  fetched: 2026-11-12
  quote: Since 2013 we have a monitoring system for invasive alien species.
- claim: An ordinance of July 2026 replaces the name "Amt für Umwelt" in laws with "Amt für Umweltschutz"
    or "Amt für Wald, Natur und Landwirtschaft".
  url: https://www.gesetze.li/chrono/pdf/2026223000
  fetched: 2026-11-12
  quote: 2) In folgenden Gesetzen ist die Bezeichnung "Amt für Umwelt" durch
- claim: The government's organisation ordinance lists the Amt für Umweltschutz and the Amt für Wald,
    Natur und Landwirtschaft from 1 August 2026.
  url: https://www.gesetze.li/chrono/pdf/2026222000
  fetched: 2026-11-12
  quote: 2a. Amt für Wald, Natur und Landwirtschaft
- claim: The change entered into force on 1 August 2026.
  url: https://www.gesetze.li/chrono/pdf/2026222000
  fetched: 2026-11-12
  quote: Diese Verordnung tritt am 1. August 2026 in Kraft.
