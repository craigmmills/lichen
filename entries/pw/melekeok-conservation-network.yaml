summary: Conservation network supported through a 2021 MOU signed by Melekeok State's
  governor with the Coral Reef Research Foundation for staff training and a planned
  ForestGEO resurvey.
facts:
- claim: Island Times reported in December 2021 that the network and the Coral Reef
    Research Foundation signed an MOU, with USDA Forest Service funding, to train
    MCN staff in forest monitoring and carry out a resurvey of the ForestGEO monitoring
    plot.
  url: https://islandtimes.org/melekeok-conservation-network-partners-to-monitor-babeldaob-global-forest-plot/
  fetched: 2026-11-14
  quote: to support capacity building among MCN staff in forest monitoring techniques,
    as well as conduct the resurvey field work within the ForestGEO monitoring plot
- claim: The December 2021 article said the MOU would support the network to conduct
    forest monitoring within the reserve.
  url: https://islandtimes.org/melekeok-conservation-network-partners-to-monitor-babeldaob-global-forest-plot/
  fetched: 2026-11-14
  quote: The MOU will support the MCN to conduct the forest monitoring efforts within
    the reserve
- claim: The MOU was signed by the Governor of Melekeok State.
  url: https://islandtimes.org/melekeok-conservation-network-partners-to-monitor-babeldaob-global-forest-plot/
  fetched: 2026-11-14
  quote: Governor Henaro Polloi signs the MOU with Coral Reef Research Foundation
    to support capacity building among MCN staff
- claim: The article names Melekeok State as working to achieve the network's management
    goals with its partners.
  url: https://islandtimes.org/melekeok-conservation-network-partners-to-monitor-babeldaob-global-forest-plot/
  fetched: 2026-11-14
  quote: The Coral Reef Research Foundation, USDA Forest Service, and Melekeok State
    look forward to a continued partnership through this MOU to help achieve the management
    goals of the Melekeok Conservation Network.
