facts:
- claim: CRRF says it is a US 501(c)(3) non-profit corporation and a chartered Palauan non-profit organisation.
  url: https://coralreefpalau.org/
  fetched: 2026-11-12
  quote: CRRF is both a 501(c)(3) non-profit corporation in the U.S. and a chartered Palauan non-profit
    organization.
- claim: Its address is in Koror, Palau.
  url: https://coralreefpalau.org/
  fetched: 2026-11-12
  quote: Box 1765, Koror, PW 96940, PALAU
- claim: Its research programmes include monitoring short- to long-term environmental and climate change.
  url: https://coralreefpalau.org/
  fetched: 2026-11-12
  quote: 3) monitoring with respect to short to long-term environmental and climate changes
- claim: It hosts an online data archive with Palau water temperatures and a marine invertebrate and algae
    specimen database.
  url: https://coralreefpalau.org/
  fetched: 2026-11-12
  quote: We have an online data archive that hosts easily accessible information on water temperatures
    of Palau, a marine invertebrate and algae specimen database
- claim: CRRF has made a mangrove habitat map of Palau with height classes, using aerial and satellite
    photos and 2021 airborne LiDAR.
  url: https://coralreefpalau.org/terrestrial-environments/
  fetched: 2026-11-12
  quote: Coral Reef Research Foundation, in its focus on marine habitat mapping, has completed a new mangrove
    habitat map for Palau that also includes mangrove height classification
- claim: Its wildfire mapping on Babeldaob moved from GPS field data to online satellite imagery from
    2016 and was extended to Guam, the Northern Mariana Islands and Yap.
  url: https://coralreefpalau.org/terrestrial-environments/
  fetched: 2026-11-12
  quote: Beginning in 2016, online satellite imagery resources became available to the program and allowed
    for improved efficiency and coverage of wildfire mapping.
