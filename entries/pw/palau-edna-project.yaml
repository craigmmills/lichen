summary: A project building a long-term ecological monitoring protocol for the Palau National Marine Sanctuary,
  collecting eDNA at 32 sites since 2021 and, the team says, developing a machine-learning identification
  model.
facts:
- claim: The project is establishing a long-term ecological monitoring protocol for the Palau National
    Marine Sanctuary.
  url: https://oceansolutions.stanford.edu/our-work/palau-edna-project
  fetched: 2026-11-12
  quote: Establishing a long-term ecological monitoring protocol for the Palau National Marine Sanctuary.
- claim: Since 2021, with PICRC and the Palauan Government, the team has run several expeditions a year
    to collect eDNA at 32 sites.
  url: https://oceansolutions.stanford.edu/our-work/palau-edna-project
  fetched: 2026-11-12
  quote: Since 2021, in partnership with the Palau International Coral Reef Center and the Palauan Government,
    the team has embarked on several expeditions each year to collect eDNA samples at 32 sites
- claim: The team says it is developing a machine-learning model to improve eDNA identification, and that
    the next phase will set up a molecular lab at PICRC.
  url: https://oceansolutions.stanford.edu/our-work/palau-edna-project
  fetched: 2026-11-12
  quote: The team is also developing a machine-learning model to sharpen eDNA identification and improve
    accuracy.
