facts:
- claim: CRRF is undertaking a Marine Habitat Mapping Project to delineate all habitats
    between the shoreline and 100 metres deep, and mangroves were among the first
    habitats completed.
  url: https://coralreefpalau.org/projects/mangroves/
  fetched: 2026-11-15
  quote: These online mapping products are a part of the larger Marine Habitat Mapping
    Project CRRF is undertaking to delineate all the habitats between the shoreline
    and 100 meters deep
- claim: CRRF derived mangrove habitat from a LiDAR ground elevation model.
  url: https://coralreefpalau.org/projects/mangroves/
  fetched: 2026-11-15
  quote: CRRF used a ground elevation model to derive mangrove habitat from LiDAR
    (Light Detection And Ranging) data
- claim: Ground truthing used drone surveys, boat and foot observation and aerial
    imagery.
  url: https://coralreefpalau.org/projects/mangroves/
  fetched: 2026-11-15
  quote: Techniques included drone surveys, shoreline observation via boat, observation
    of landlocked stands by foot
- claim: The data can be viewed online and requested through PALARIS; the mangrove
    mapping was supported by the US Department of the Interior's Office of Insular
    Affairs and the US Forest Service.
  url: https://coralreefpalau.org/projects/mangroves/
  fetched: 2026-11-15
  quote: This mangrove mapping summary for Palau was supported by the Office of Insular
    Affairs, Department of Interior with further support from the US Forest Service.
