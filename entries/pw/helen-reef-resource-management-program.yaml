summary: Programme established in 2000 by the Hatohobei people and partners, overseen
  by the Helen Reef Management Board, which developed monitoring of marine resources
  and ecological and socio-economic outcomes.
facts:
- claim: The Reef Resilience Network says the Hatohobei people and their partners
    established the programme in 2000, overseen by the Helen Reef Management Board.
  url: https://reefresilience.org/case-studies/palau-management-effectiveness/
  fetched: 2026-11-14
  quote: In 2000, the Hatohobei people and their partners established the Helen Reef
    Resource Management Program (HRRMP)
- claim: The programme developed a monitoring initiative to track changes in marine
    resources over time.
  url: https://reefresilience.org/case-studies/palau-management-effectiveness/
  fetched: 2026-11-14
  quote: a monitoring initiative to track changes in marine resources over time
- claim: Monitoring protocols and review periods were set up over time to track ecological
    and socio-economic outcomes.
  url: https://reefresilience.org/case-studies/palau-management-effectiveness/
  fetched: 2026-11-14
  quote: Monitoring protocols and review periods were set up over time to track progress
    and help determine if their ecological and socio-economic outcomes were being
    achieved.
- claim: The case study says the programme is now run by a team including a Program
    Manager, Deputy Program Manager, Administrative Assistant and Conservation Officers.
  url: https://reefresilience.org/case-studies/palau-management-effectiveness/
  fetched: 2026-11-14
  quote: the program is now run by a dedicated team, including a Program Manager,
    Deputy Program Manager, Administrative Assistant, and Conservation Officers
