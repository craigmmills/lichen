summary: Active project with Rob Chancia as principal investigator, taking surface
  elevation table measurements at 30 Babeldaob locations and running a web application
  that turns iPhone LiDAR scans into elevation change estimates.
facts:
- claim: In October 2025 and April 2026 the project took surface elevation table measurements
    at 30 locations across Babeldaob, with fieldwork alongside Richard Mackenzie of
    Palau's Office of Climate Change.
  url: https://www.rit.edu/dirs/research/new-tool-monitor-resilience-mangroves-sea-level-rise
  fetched: 2026-11-15
  quote: While in Palau, we obtained surface elevation table (SET) measurements at
    30 SET locations across the island of Babeldaob.
- claim: The project runs a web application that takes iPhone LiDAR scans, builds
    digital elevation models and calculates surface elevation change at each site.
  url: https://www.rit.edu/dirs/research/new-tool-monitor-resilience-mangroves-sea-level-rise
  fetched: 2026-11-15
  quote: We continued to improve our scan processing and data storage web application
- claim: A workshop at PICRC in 2026 introduced the web application to 8 forest rangers
    from Palau's Protected Area Network.
  url: https://www.rit.edu/dirs/research/new-tool-monitor-resilience-mangroves-sea-level-rise
  fetched: 2026-11-15
  quote: We also put on a half-day workshop hosted at the Palau International Coral
    Reef Center to kick off use of our web application.
