summary: Nonprofit partner described by Seacology in 2019 as monitoring Ngerkeklau
  plants, dugongs and birds; IUCN says it delivered 8,000 sea cucumbers to 49 participants.
facts:
- claim: In its May 2019 update, Seacology called the Ebiil Society its nonprofit
    partner and said it continued to monitor native plant plots and dugong and bird
    populations on Ngerkeklau Island.
  url: https://seacology.org/?p=13761
  fetched: 2026-11-14
  quote: Our nonprofit partner, the Ebiil Society, continues to monitor native plant
    plots as well as dugong and bird populations, and to conduct environmental education
    programs.
- claim: Seacology's January 2018 update says trail maps for visitors to Ngerkeklau
    Island were made using geospatial mapping.
  url: https://seacology.org/?p=13761
  fetched: 2026-11-14
  quote: Trail maps for visitors were created using geospatial mapping.
- claim: IUCN (2025) says the society raised and delivered 8,000 sea cucumbers to
    49 participants under IUCN Oceania's Kiwa Initiative.
  url: https://iucn.org/story/202503/ann-singeo-hero-ocean-leads-women-sea-change
  fetched: 2026-11-14
  quote: By raising and delivering 8,000 sandfish and grayfish sea cucumbers to 49
    participants—22 of whom were female fishermen—Ebiil Society has also made considerable
    progress in reseeding sea cucumbers.
- claim: CEPF lists Ebiil Society Inc as the grantee of a 2012 to 2013 research grant
    of $17,200 to identify endangered species of the northern region of Ngerchelong.
  url: https://www.cepf.net/grants/grantee-projects/camp-ebiil-cultivating-knowledge-palaus-flora-and-fauna
  fetched: 2026-11-14
  quote: 'Grantee Name: Ebiil Society Inc'
