summary: Non-profit museum governed by a board of trustees since 1973, which houses
  the National Bird Monitoring Program and has distributed the annual State of Palau's
  Birds report, the 12th edition in April 2023.
facts:
- claim: Wikipedia says the museum's administrative structure became a non-profit
    organisation governed by a board of trustees in 1973.
  url: https://en.wikipedia.org/wiki/Belau_National_Museum
  fetched: 2026-11-14
  quote: In 1973 the museum's administrative structure changed to a non-profit organisation
    governed by a board of trustees.
- claim: Island Times (May 2025) reports recent surveys by the museum and the Palau
    Conservation Society confirming large flocks of shorebirds at Belualasmau.
  url: https://islandtimes.org/preserving-belualasmau/
  fetched: 2026-11-14
  quote: Recent surveys by the Belau National Museum, Palau Conservation Society,
    and the eBird global database continue to confirm the presence of large flocks
    of shorebirds at Belualasmau
- claim: The museum distributed its 2021 State of Palau's Birds report, the 12th in
    the annual series, in April 2023.
  url: https://islandtimes.org/bnm-distributes-latest-state-of-palaus-bird-report/
  fetched: 2026-11-14
  quote: Belau National Museum (BNM) has distributed their latest report titled 2021
