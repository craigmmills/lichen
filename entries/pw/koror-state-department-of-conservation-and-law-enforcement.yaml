  imagery.
facts:
- claim: Koror State's page lists survey and monitoring of terrestrial and marine
    ecosystems among the department's key responsibilities, with the Rock Islands
    Southern Lagoon Management Plan.
  url: https://www.kororstategov.com/cle.html
  fetched: 2026-11-14
  quote: Develop and implement the Rock Islands Southern Lagoon Management Plan; develop
    sound environmental programs; survey and monitoring of terrestrial and marine
    ecosystem
- claim: Island Conservation (June 2026) says the Ulong Island monitoring work was
    led by Koror State Government's Department of Conservation and Law Enforcement
    with Palau-based field teams, Island Conservation, Scripps and other partners.
  url: https://www.islandconservation.org/?p=12740
  fetched: 2026-11-14
  quote: This work was led by Koror State Government, Department of Conservation and
    Law Enforcement, Palau ‑ based field teams, Island Conservation, Scripps Institution
    of Oceanography, and IOCC partners.
- claim: The study produced over 30,000 hours of acoustic recordings and more than
    11 terabytes of seafloor imagery, now publicly available.
  url: https://www.islandconservation.org/?p=12740
