facts:
- claim: CRRF publishes a three-month forecast for Jellyfish Lake based on the lake's
    conditions, the jellyfish population and weather forecasts.
  url: https://coralreefpalau.org/research/marine-lakes/jellyfish-lake-conditions-and-forecast/
  fetched: 2026-11-15
  quote: CRRF provides a forecast of what to expect in the next 3 months in Jellyfish
    Lake, based on current conditions of the lake, jellyfish population and weather
    forecasts.
- claim: The page reports conditions from monthly or quarterly monitoring, with jellyfish
    counted by visual surveys or net hauls; the latest monitoring date shown is 13
    October 2026.
  url: https://coralreefpalau.org/research/marine-lakes/jellyfish-lake-conditions-and-forecast/
  fetched: 2026-11-15
  quote: This page reports current conditions in Jellyfish Lake based on monthly or
    quarterly monitoring.
