summary: Proposed SeaKeepers project, with an expected time frame of October to December
  2026, planning ship-based visual and acoustic surveys of cetaceans in the sanctuary
  and building local monitoring expertise.
facts:
- claim: SeaKeepers lists an expected time frame of October to December 2026, while
    its Mission section still describes a proposed expedition in February to April
    or October to November 2024.
  url: https://www.seakeepers.org/?p=44818
  fetched: 2026-11-15
  quote: October - December 2026
- claim: The project aims to run ship-based visual and acoustic line transect surveys
    and to increase local expertise in cetacean monitoring.
  url: https://www.seakeepers.org/?p=44818
  fetched: 2026-11-15
  quote: The aim of this project is to conduct ship-based visual and acoustic line
    transect surveys, catalyzing scientific partnerships through affiliation with
    the South Pacific Whale Research Consortium.
- claim: It plans to use genetic, acoustic and photographic matching to assess cetaceans
    in the sanctuary.
  url: https://www.seakeepers.org/?p=44818
  fetched: 2026-11-15
  quote: The project will utilize genetic, acoustic, and photographic matching to
    assess the abundance, distribution, and cultural connectivity of cetaceans in
    the Palau National Marine Sanctuary.
- claim: Photo-identification is to be compared with regional catalogues through Happywhale.
  url: https://www.seakeepers.org/?p=44818
  fetched: 2026-11-15
  quote: Photo identification will be compared to regional databases and catalogues
    for key species through Happywhale.
