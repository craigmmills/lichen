status: closed
summary: Closed GEF-funded project, run by PICRC and the environment ministry, that
  UNDP reported in June 2025 had concluded after four years and $1.8 million, including
  cetacean monitoring that observed 465 cetaceans of 10 species.
facts:
- claim: UNDP reported in June 2025 that the project had concluded after four years
    and $1.8 million of support for fisheries management, enforcement and surveillance,
    and research and outreach.
  url: https://www.undp.org/pacific/press-releases/project-supporting-palau-national-marine-sanctuary-ends-successfully
  fetched: 2026-11-15
  quote: has successfully concluded after four years and $1.8 million in support of
    fisheries management, enforcement & surveillance, and research and outreach efforts.
- claim: Through the project PICRC worked with Whaleology on cetacean monitoring in
    the sanctuary, observing 465 cetaceans of 10 species.
  url: https://www.undp.org/pacific/press-releases/project-supporting-palau-national-marine-sanctuary-ends-successfully
  fetched: 2026-11-15
  quote: aimed at enhancing local expertise in cetacean monitoring within the PNMS.
    The fieldwork yielded valuable data, with a total of 465 cetaceans observed across
    10 species
- claim: A UNDP story gives the project's full name, as the project under which the
    PNMS science and monitoring strategy workshop was funded.
  url: https://www.undp.org/pacific/stories/new-strategy-highlights-scientific-priorities-palau-national-marine-sanctuary
  fetched: 2026-11-15
  quote: under the project, Strengthening the Palau National Marine Sanctuary for
    the Conservation and Management of Global Marine Biodiversity and Sustainable
    Fisheries.
