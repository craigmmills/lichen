summary: Active Island Conservation project, in partnership with SPREP, with baseline
  surveys of birds, crabs and vegetation and seabird nest surveys reported in September
  2026; Island Conservation says the UK FCDO and New Zealand's foreign ministry fund
  it.
facts:
- claim: Island Conservation wrote in August 2025 that it was preparing to launch
    the project in late 2025 in partnership with the Sonsorol State Government and
    the island councils.
  url: https://www.islandconservation.org/restoring-sonsorol-a-community-led-conservation-effort-in-palau/
  fetched: 2026-11-15
  quote: In partnership with the elected Sonsorol State Government and the councils
    of each island, Island Conservation is preparing to launch a transformative project
    in late 2025.
- claim: In September 2026, monitoring lead Linden Brown described gathering baseline
    ecological data on birds, crabs, vegetation and other native species on the Sonsorol
    islands.
  url: https://www.islandconservation.org/?p=13054
  fetched: 2026-11-15
  quote: As the monitoring lead for this project, my main role is to gather baseline
    ecological data on the bi rds, crabs, vegetation , and other native species which
    inhabit the islands of Sonsorol .
- claim: In September 2026, Linden Brown described the team conducting seabird nest
    surveys on Sonsorol.
  url: https://www.islandconservation.org/?p=13054
  fetched: 2026-11-15
  quote: while we’re conducting nest surveys on the island
- claim: Island Conservation says the project is funded by the UK FCDO and New Zealand's
    Ministry of Foreign Affairs and Trade.
  url: https://www.islandconservation.org/restoring-sonsorol-a-community-led-conservation-effort-in-palau/
  fetched: 2026-11-15
  quote: This project is made possible through funding from UK FCDO (Foreign Commonwealth
    Development Office) and New Zealand’s Ministry of Foreign Affairs and Trade (NZMFAT)
