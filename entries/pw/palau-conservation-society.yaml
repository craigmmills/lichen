summary: Community-based organisation in Koror, established in June 1994 as Palau's
  first environmental NGO, which publishes the Palau Invasives marine species dataset
  on GBIF and had nine staff in October 2025.
facts:
- claim: Describes itself on its GBIF publisher record as a community-based organisation
    that implements conservation activities through partnerships.
  url: https://api.gbif.org/v1/organization/80210c19-5aa9-44bb-b231-c757687ce566
  fetched: 2026-11-14
  quote: We are a community-based organization that implements conservation activities
    through partnerships.
- claim: Its GBIF publisher record gives an address in Koror, Palau.
  url: https://api.gbif.org/v1/organization/80210c19-5aa9-44bb-b231-c757687ce566
  fetched: 2026-11-14
  quote: '"city":"Koror","country":"PW"'
- claim: Publishes the Palau Invasives occurrence dataset on GBIF, on Palau marine
    invasive species, under a GBIF BID-supported project.
  url: https://api.gbif.org/v1/organization/80210c19-5aa9-44bb-b231-c757687ce566/publishedDataset
  fetched: 2026-11-14
  quote: Palau marine invasive species information in the GBIF website are from publications
    provided during the in-country workshop.
- claim: Island Times (May 2025) reports recent shorebird surveys at Belualasmau by
    the society and the Belau National Museum.
  url: https://islandtimes.org/preserving-belualasmau/
  fetched: 2026-11-14
  quote: Recent surveys by the Belau National Museum, Palau Conservation Society,
    and the eBird global database continue to confirm the presence of large flocks
    of shorebirds at Belualasmau
- claim: Island Times says the society was established in June 1994 as Palau's first
    environmental non-governmental organisation.
  url: https://islandtimes.org/palau-conservation-society-marks-three-decades-of-environmental-leadership/
  fetched: 2026-11-14
  quote: Established in June 1994 by ten founders during a period of rapid development,
    PCS emerged as Palau’s first environmental non-governmental organization.
- claim: Island Times reported in October 2025 that the society operated four core
    programmes with nine staff and an annual operating budget above $700,000.
  url: https://islandtimes.org/palau-conservation-society-marks-three-decades-of-environmental-leadership/
  fetched: 2026-11-14
  quote: It now operates four core programs — Administration, Policy and Planning,
    Conservation Protected Area, and Communications and Outreach — with nine staff
    members and an annual operating budget exceeding $700,000.
