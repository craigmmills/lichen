facts:
- claim: PI-CASC announced in August 2024 an award of about $240,000 for restoring
    monthly monitoring of the lake, a forecast tool for managers and an invasive species
    strategy.
  url: https://pi-casc.soest.hawaii.edu/news/usgs-pi-casc-project-to-develop-advanced-monitoring-tools-for-unique-jellyfish-lake-in-palau
  fetched: 2026-11-15
  quote: The award, approximately $240,000, will support a three-prong approach in
    restoring monthly monitoring of the lake, devising a forecast tool for natural
    resource managers, and developing a strategy plan to combat invasive threats to
    the jellyfish.
- claim: In August 2024, PI-CASC said the project would create a Conditions Assessment
    and Forecast tool for Koror State managers.
  url: https://pi-casc.soest.hawaii.edu/news/usgs-pi-casc-project-to-develop-advanced-monitoring-tools-for-unique-jellyfish-lake-in-palau
  fetched: 2026-11-15
  quote: The project will create a Conditions Assessment and Forecast tool that is
    intended to inform the Koror State managers of the physical status of the lake
- claim: The project is listed among PI-CASC's research projects.
