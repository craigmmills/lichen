summary: Completed NOAA mapping with PICRC in Palau in 2025 collected 752 eDNA samples
  across three expeditions and preceding transit; data will go to Palau’s government
  and PICRC.
facts:
- claim: From July to October 2025 NOAA Ocean Exploration ran three mapping expeditions
    in Palau's deep waters, working with PICRC and focusing on the Palau National
    Marine Sanctuary.
  url: https://oceanexplorer.noaa.gov/?p=18558
  fetched: 2026-11-15
  quote: From July through October 2025, NOAA Ocean Exploration conducted a series
    of three exploratory mapping expeditions aboard NOAA Ship Okeanos Explorer focused
    on the deep waters of Palau.
- claim: Across the three mapping expeditions and the preceding transit to Palau,
    752 eDNA samples were collected on behalf of PICRC.
  url: https://oceanexplorer.noaa.gov/?p=18558
  fetched: 2026-11-15
  quote: a total of 752 eDNA samples collected on behalf of PICRC
- claim: The third expedition carried a marine mammal observation team that collected
    sightings data in the sanctuary.
  url: https://oceanexplorer.noaa.gov/?p=18558
  fetched: 2026-11-15
  quote: the expedition provided the opportunity for visual observers to collect sightings
    data in some of the least-surveyed waters of the PNMS
- claim: The page marks the project as completed and says the data will be shared
    with the Palauan government and PICRC.
  url: https://oceanexplorer.noaa.gov/?p=18558
  fetched: 2026-11-15
  quote: All data collected during the expeditions will be shared with the Palauan
    government and PICRC
