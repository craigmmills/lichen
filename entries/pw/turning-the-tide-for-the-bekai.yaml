summary: Closed Rufford Foundation project, dated 21 September 2015, under Robert
  Davis, that planned radio-tracking, genetic studies and remote cameras to assess
  Micronesian Megapode population, predation risk and sea level rise effects in Palau.
facts:
- claim: The project planned radio-tracking, genetic studies of inter-island movement
    and remote cameras to monitor rat predation on megapode nests and chicks.
  url: https://www.rufford.org/projects/robert-davis/turning-the-tide-for-the-bekai-identifying-refugee-from-climate-induced-sea-level-rise-for-the-palau-megapode/
  fetched: 2026-11-15
  quote: we will undertake radio-tracking to determine important feeding habitat,
    genetic studies on inter-island movement and use remote cameras to monitor rat
    predation impacts on nests and chicks
- claim: The project set out to assess the population size, ecology, dispersal and
    predation risk of the Micronesian Megapode in Palau and model the effect of sea
    level rise.
  url: https://www.rufford.org/projects/robert-davis/turning-the-tide-for-the-bekai-identifying-refugee-from-climate-induced-sea-level-rise-for-the-palau-megapode/
  fetched: 2026-11-15
  quote: We will assess population size, ecology, dispersal capacity and predation
    risk of the Micronesian Megapode in Palau and model the impacts of sea level rise
    on future viability.
- claim: The Rufford Foundation lists the project under Robert Davis, dated 21 September
    2015, in the Rock Islands. Its title says 'Identifying Refugee', while the description
    says the aim is to identify refugia from climate change.
  url: https://www.rufford.org/projects/robert-davis/turning-the-tide-for-the-bekai-identifying-refugee-from-climate-induced-sea-level-rise-for-the-palau-megapode/
  fetched: 2026-11-15
  quote: The primary outcome will be to identify refugia from climate change and understand
    the ability of megapodes to adapt to these future challenges.
- claim: The page lists a final report for the project.
