summary: A programme run by The Peregrine Fund whose biologists, per a July 2013 release,
  were monitoring the remaining wild hawks in Los Haitises National Park and banded
  and radio-tagged a chick; current status is unknown.
facts:
- claim: A July 2013 Peregrine Fund news release said its biologists were monitoring
    the remaining wild Ridgway's Hawk population in Los Haitises National Park, alongside
    assisted dispersal.
  url: https://peregrinefund.org/news-release/critically-endangered-ridgways-hawk-fledges-nest-peregrine-fund-recovery-project
  fetched: 2026-11-12
  quote: In addition to the assisted dispersal efforts, Peregrine Fund biologists
    are monitoring the remaining wild population of Ridgway’s Hawks in Los Haitises
    National Park.
- claim: The July 2013 release said biologists fitted a chick with an identification
    band and a radio transmitter on July 2 to monitor it.
  url: https://peregrinefund.org/news-release/critically-endangered-ridgways-hawk-fledges-nest-peregrine-fund-recovery-project
  fetched: 2026-11-12
  quote: biologists fitted the chick with an identification band and radio transmitter
    to aid them in monitoring the young bird.
