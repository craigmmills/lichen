summary: Non-profit created in 2016 in Cap Cana that monitors coral reef health twice
  a year and coral disease three times a year, and began a one-year manatee drone
  project in 2023.
facts:
- claim: A non-profit organisation created in 2016, based in Cap Cana.
  url: https://www.fundacioncapcana.org/programas/programa-de-monitoreo-de-salud-arrecifal-y-de-enfermedades-de-coral
  fetched: 2026-11-12
  quote: Organización sin fines de lucro creada en el año 2016
- claim: Its address is in the Distrito de Sostenibilidad, Caletón, Cap Cana.
  url: https://www.fundacioncapcana.org/programas/programa-de-monitoreo-de-salud-arrecifal-y-de-enfermedades-de-coral
  fetched: 2026-11-12
  quote: Contacto Distrito de Sostenibilidad, Caleton, Cap Cana, Rep. Dominicana.
- claim: Monitors coral reef health in the central zone of the Santuario Marino Arrecifes
    del Sureste twice a year under the sanctuary's annual operating plan, recording
    fish biomass, benthic cover and densities of coral recruits, urchins and other
    invertebrates.
  url: https://www.fundacioncapcana.org/programas/programa-de-monitoreo-de-salud-arrecifal-y-de-enfermedades-de-coral
  fetched: 2026-11-12
  quote: Nuestro programa de monitoreo se enfoca en la Zona Centro del SAMAR
- claim: Monitors coral disease prevalence and bleaching three times a year nationally
    with the other members of the Red Arrecifal Dominicana's disease commission.
  url: https://www.fundacioncapcana.org/programas/programa-de-monitoreo-de-salud-arrecifal-y-de-enfermedades-de-coral
  fetched: 2026-11-12
  quote: Este monitoreo se realiza tres veces al año a nivel nacional en conjunto
    con las demás organizaciones pertenecientes a la Comisión de Enfermedades de la
    Red Arrecifal Dominicana
- claim: In 2023 it began a one-year drone monitoring project, mentored by FUNDEMAR,
    recording manatee sightings, numbers, positions and behaviour in the waters of
    Marina Cap Cana and the Cap Cana coast.
  url: https://www.fundacioncapcana.org/programas/programa-de-registro-de-avistamientos-de-manaties
  fetched: 2026-11-12
  quote: iniciamos en 2023 un proyecto de investigación científica con duración de
    un año para monitorear con drones la agrupación de manatíes
