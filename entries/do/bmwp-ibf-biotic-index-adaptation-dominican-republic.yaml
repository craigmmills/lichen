summary: Project adapting the BMWP and Family Biotic Index to monitor freshwater quality in the Dominican
  Republic, with a GBIF dataset of macroinvertebrates from Cordillera Central rivers, funded by MESCyT.
facts:
- claim: The project adapts the Biological Monitoring Working Party and Family Biotic Index for the Dominican
    Republic for use in monitoring the biological quality of fresh waters.
  url: https://api.gbif.org/v1/organization/e0f5c405-4f17-426d-a06e-688e31f60d05/publishedDataset
  fetched: 2026-11-09
  quote: Índice Biótico de Familias (IBF) para la República Dominicana y su uso como herramienta de monitoreo
    de la calidad biológica de los cuerpos de agua dulce
- claim: The GBIF dataset contains partial project records of aquatic macroinvertebrates collected in
    mountain rivers and streams in several catchments of the Cordillera Central, municipality of Constanza,
    La Vega province.
  url: https://api.gbif.org/v1/organization/e0f5c405-4f17-426d-a06e-688e31f60d05/publishedDataset
  fetched: 2026-11-09
  quote: Este conjunto de datos contiene registros de macroinvertebrados acuáticos recolectados en ríos
    y arroyos de montaña en varias cuencas
