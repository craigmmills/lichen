- claim: A museum ornithologist has surveyed birds in the main urban parks of Santo Domingo since 2013.
  url: https://mnhn.gov.do/ciencia/investigacion-cientifica
  fetched: 2026-11-09
  quote: Desde el año 2013 me encuentro haciendo reconocimientos de las aves en los principales parques
    urbanos de la ciudad de Santo Domingo.
