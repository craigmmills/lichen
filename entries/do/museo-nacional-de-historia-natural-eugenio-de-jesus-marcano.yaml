summary: Autonomous natural history museum attached to the environment ministry, holding 160,000 zoological
  specimens, with six GBIF datasets, and partnering with Grupo Jaragua and Durrell.
facts:
- claim: An autonomous institution with its own legal and budgetary status, attached to the Ministry of
    Environment and Natural Resources under Law 64-00.
  url: https://mnhn.gob.do/
  fetched: 2026-11-09
  quote: Es una institución autónoma con personería jurídica y presupuestaria independiente, adscrita
    al Ministerio de Medio Ambiente y Recursos Naturales mediante la Ley General Ambiental 64-00.
- claim: The museum states its address at the Plaza de la Cultura Juan Pablo Duarte, Santo Domingo.
  url: https://mnhn.gob.do/
  fetched: 2026-11-09
  quote: Plaza de la Cultura Juan Pablo Duarte, Calle César Nicolás Penson, Santo Domingo, República Dominicana.
- claim: Its Department of Research and Conservation carries out studies on the taxonomy, ecology and
    conservation status of species and ecosystems.
  url: https://mnhn.gov.do/ciencia/investigacion-cientifica
  fetched: 2026-11-09
  quote: el Museo realiza simultáneamente diferentes investigaciones sobre taxonomía, ecología y estado
    de conservación de especies y ecosistemas. Los estudios están a cargo del Departamento de Investigación
    y Conservación
- claim: A study of threatened amphibians in the Sierra de Bahoruco uses recordings of their calls, transect
    counts and microhabitat surveys.
  url: https://mnhn.gov.do/ciencia/investigacion-cientifica
  fetched: 2026-11-09
  quote: Nuestro trabajo se vale de grabaciones del canto de las especies de anfibios, conteos mediante
    transectos, caracterización de microhábitats e identificación de amenazas.
- claim: Its reference collections hold 160,000 zoological specimens.
  url: https://mnhn.gob.do/
  fetched: 2026-11-09
  quote: alcanzan el número de 160,000 especímenes correspondientes a diferentes grupos zoológicos
- claim: An autonomous state institution attached to the Ministerio de Medio Ambiente y Recursos Naturales
