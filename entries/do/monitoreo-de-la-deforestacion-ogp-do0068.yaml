- claim: A milestone of the commitment is to acquire and use satellite imagery and artificial intelligence
    to identify deforestation patterns in real time, due June 2027.
  url: https://www.opengovpartnership.org/es/members/dominican-republic/commitments/DO0068/
  fetched: 2026-11-08
  quote: Adquirir y utilizar imágenes satelitales e inteligencia artificial (y otras herramientas tecnológicas)
    para identificar patrones de deforestación en tiempo real.
- claim: Another milestone is to open public access to the SIGIR reforestation information platform, with
    geospatial information on reforested and deforested areas.
  url: https://www.opengovpartnership.org/es/members/dominican-republic/commitments/DO0068/
