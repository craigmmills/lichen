summary: Dominican environment ministry that launched a 30x30 protected-area strategy in 2023, held eight
  workshops in 2025 to update the National Biodiversity Strategy, and partners with UNDP.
facts:
- claim: The Presidency reported on 9 October 2023 that the ministry launched "República Dominicana 30x30",
    a strategy to conserve and manage 30% of land and sea under protected areas and other protection mechanisms,
    in line with the Global Biodiversity Framework.
  url: https://presidencia.gob.do/noticias/ministerio-medio-ambiente-anuncia-plan-para-aumentar-territorio-bajo-areas-protegidas-y
  fetched: 2026-11-08
  quote: conservar y gestionar el 30 % de la superficie terrestre y marítima bajo la categoría de áreas
    protegidas y otros mecanismos de protección, conforme al Marco Global para la Biodiversidad
- claim: A UNDP page of 14 October 2025 says the ministry, with UNDP, held eight workshops to update the
    National Biodiversity Strategy in line with the Kunming-Montreal Global Biodiversity Framework.
  url: https://www.undp.org/es/node/549916
  fetched: 2026-11-08
  quote: Esta actualización se realiza en línea con el Marco Global de Biodiversidad de Kunming-Montreal
- claim: The ministry's 2025-2026 balance, published by the Presidency, says five protected-area management
    plans were approved, strengthening the National System of Protected Areas.
  url: https://presidencia.gob.do/noticias/medio-ambiente-presenta-balance-2025-2026-con-reforestacion-record-y-reduccion-de-67-en
  fetched: 2026-11-08
  quote: se aprobaron cinco planes de manejo para áreas protegidas y once adicionales se encuentran en
    proceso, robusteciendo el Sistema Nacional de Áreas Protegidas
- claim: The same balance says park rangers were given equipment and technology tools for field surveillance
    and monitoring.
  url: https://presidencia.gob.do/noticias/medio-ambiente-presenta-balance-2025-2026-con-reforestacion-record-y-reduccion-de-67-en
  fetched: 2026-11-08
  quote: junto con equipamiento y herramientas tecnológicas para la vigilancia y el monitoreo en campo
- claim: The same balance says the country received USD 4.18 million from the World Bank's Forest Carbon
    Partnership Facility for about 840,000 tonnes of CO2 equivalent reduced through its REDD+ programme.
  url: https://presidencia.gob.do/noticias/medio-ambiente-presenta-balance-2025-2026-con-reforestacion-record-y-reduccion-de-67-en
  fetched: 2026-11-08
  quote: el país recibió por primera vez, USD 4.18 millones del Fondo Cooperativo para el Carbono de los
    Bosques del Banco Mundial
