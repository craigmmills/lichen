summary: An active project run and built by FUNDEMAR, partnered with the environment
  ministry, that began in June 2023 using drones to photograph manatees; identification
  was manual, with matching software only a planned partnership.
facts:
- claim: Diario Libre reports that FUNDEMAR began a manatee photo-identification project
    in the second week of June 2023.
  url: https://www.diariolibre.com/planeta/medioambiente/2023/07/20/un-proyecto-para-identificar-manaties-republica-dominicana/2408120
  fetched: 2026-11-12
  quote: en la segunda semana de junio de 2023 se inició un proyecto de foto identificación
    de manatíes por parte de Fundemar.
- claim: In July 2023, the project was flying drones to photograph each animal's tail,
    back and face, and recording population density, behaviour and habitat conditions.
  url: https://www.diariolibre.com/planeta/medioambiente/2023/07/20/un-proyecto-para-identificar-manaties-republica-dominicana/2408120
  fetched: 2026-11-12
  quote: El proyecto consiste en hacer vuelos con drones de última generación para
    tomar fotos de la cola, lomo y cara de cada animal
- claim: Identification was manual in 2023, with FUNDEMAR working on partnerships
    to develop matching software, an announced plan.
  url: https://www.diariolibre.com/planeta/medioambiente/2023/07/20/un-proyecto-para-identificar-manaties-republica-dominicana/2408120
  fetched: 2026-11-12
  quote: pero estamos trabajando en alianzas para desarrollar ese software.
