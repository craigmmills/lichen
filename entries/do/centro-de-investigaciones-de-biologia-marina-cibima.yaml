summary: A university marine research institute founded in 1962 and run by UASD, with
  coral disease, humpback whale and manatee projects, and partnerships with the Red
  Arrecifal Dominicana and Monitorea.
facts:
- claim: UASD describes CIBIMA-IBC as a university scientific research institute founded
    in 1962.
  url: https://uasd.edu.do/facultad-ciencias/institutos/investigacion-de-biologia-marina-cibima/
  fetched: 2026-11-15
  quote: El Centro de Investigaciones de Biología Marina Idelisa Bonelly de Calventi
    (CIBIMA-IBC) es un instituto universitario de investigaciones científicas fundado
    en 1962
- claim: Its projects include a coral disease monitoring project at La Caobita (Azua)
    and Andrés (Boca Chica) under the national coral disease monitoring plan.
  url: https://uasd.edu.do/facultad-ciencias/institutos/investigacion-de-biologia-marina-cibima/
  fetched: 2026-11-15
  quote: 'Plan Nacional de monitoreo de enfermedades de corales: Proyecto de monitoreo
    de enfermedades de corales en arrecifes la Caobita, Azua y Andrés, Boca chica.'
- claim: Its projects include a humpback whale catalogue.
  url: https://uasd.edu.do/facultad-ciencias/institutos/investigacion-de-biologia-marina-cibima/
  fetched: 2026-11-15
  quote: Catálogo de Ballenas Jorobadas CIBIMA-IBC.
- claim: Its projects include an assessment of the manatee population in the marine
    mammal sanctuary in Puerto Plata, with additional funds from Fondo MARENA.
  url: https://uasd.edu.do/facultad-ciencias/institutos/investigacion-de-biologia-marina-cibima/
  fetched: 2026-11-15
  quote: Evaluación del Estado Actual de la Población de Trichechus manatus, en el
    Santuario de Mamíferos Marinos, Puerto Plata.
- claim: UASD says the institute has taken part in assessment, monitoring and research
    with the Dominican Navy, FUNDEMAR, the environment ministry and other bodies.
  url: https://uasd.edu.do/facultad-ciencias/institutos/investigacion-de-biologia-marina-cibima/
  fetched: 2026-11-15
  quote: monitoreo e investigación con la Armada Dominicana, FUNDEMAR, ANANAR, Red
    Interuniversitaria del Sargazo, ASONAHORES, Ministerio de Medio Ambiente
- claim: The UASD repository record of the coral disease project (2026, sponsored
    by FONDOCYT) says CIBIMA monitors the reefs at Playa Caobita (Azua) and San Andrés
    (Boca Chica), as a member of the Red Arrecifal Dominicana, with quarterly monitoring
    planned at three stations per site.
  url: https://repositoriovip.uasd.edu.do/items/d56e5aad-3f29-4ef4-b986-32bc5d9745f6/full
  fetched: 2026-11-15
  quote: El CIBIMA IBC-UASD monitorea los arrecifes en las localidades de Playa Caobita,
    Azua y San Andrés, Boca Chica.
- claim: GBIF's publisher record gives its address at the Ciudad Universitaria in
