summary: Dominican non-profit incorporated in 1989 that monitors turtle nests, juveniles and rock iguanas,
  fitted 18 satellite transmitters between 2008 and 2019, and uses iNaturalist.
facts:
- claim: Its 2022 summary of its work lists monitoring of nests on the main beaches.
  url: https://grupojaragua.org.do/documents/GJ_QueHacemos2022.pdf
  fetched: 2026-11-08
  quote: Monitoreo de nidos en las principales playas
- claim: The same summary lists monitoring of juvenile populations.
  url: https://grupojaragua.org.do/documents/GJ_QueHacemos2022.pdf
  fetched: 2026-11-08
  quote: Monitoreo de poblaciones juveniles en el
- claim: Its 2022 summary lists fitting satellite transmitters in 2009–2010 and 2017–2018.
  url: https://grupojaragua.org.do/documents/GJ_QueHacemos2022.pdf
  fetched: 2026-11-08
  quote: Colocación de transmisores satelitales
- claim: A non-profit NGO of the Dominican Republic, legally incorporated in 1989.
  url: https://www.grupojaragua.org.do/inicio/sobre/
  fetched: 2026-11-09
  quote: organización no gubernamental sin fines de lucro de la República Dominicana, incorporada legalmente
    en 1989
- claim: Since 1997 it has run standardised censuses of juvenile hawksbill and green turtles with fishers
    in Jaragua National Park.
  url: https://www.grupojaragua.org.do/nuestro-trabajo/especies/tm/
  fetched: 2026-11-09
  quote: Desde 1997 junto a pescadores del campamento de Trudillé, en el Parque Nacional Jaragua, empezamos
    a hacer censos estadarizados de juveniles de tortugas carey y verde.
- claim: Since 2006, with rangers it has trained in Jaragua and Cotubanamá national parks, it has tried
    to count and follow turtle nests on beaches.
  url: https://www.grupojaragua.org.do/nuestro-trabajo/especies/tm/
  fetched: 2026-11-09
  quote: Desde 2006, apoyándonos en los guardaparques de los parques nacionales Jaragua y Cotubanamá en
    Isla Saona, a los cuales hemos entrenado, tratamos de contabilizar los nidos puestos en playa y de
    darles seguimiento.
- claim: Between 2008 and 2019 it fitted 18 satellite transmitters to hawksbill and green turtles in the
    Dominican Republic.
  url: https://www.grupojaragua.org.do/nuestro-trabajo/especies/tm/
  fetched: 2026-11-09
  quote: Entre 2008 y 2019, hemos colocado 18 transmisores satelitales en tortugas carey y verde de la
    República Dominicana.
- claim: The transmitter it fitted to a nesting hawksbill in 2018 uses the Argos satellite constellation
    to report the turtle's position.
  url: https://www.grupojaragua.org.do/telemetria/
  fetched: 2026-11-09
  quote: El transmisor colocado utiliza los satélites de la constelación Argos para calcular la posición
    de la tortuga
- claim: Since 2004 it has worked with local and international collaborators to study, monitor and protect
    rock iguanas, their nests and critical habitats.
  url: https://www.grupojaragua.org.do/nuestro-trabajo/especies/iguanas/
  fetched: 2026-11-09
  quote: Desde 2004, trabajamos con colaboradores locales e internacionales para estudiar, monitorear
    y proteger las iguanas, sus nidos y sus hábitats críticos.
- claim: In its GBIF publisher registration it said it holds camera-trap data for two endemic mammals
    of Hispaniola.
  url: https://api.gbif.org/v1/node/62869b60-d122-4125-bdbf-47d14cc0a0bf/organization
  fetched: 2026-11-09
  quote: We have camera trap data for two endemic mammals of Hispaniola.
