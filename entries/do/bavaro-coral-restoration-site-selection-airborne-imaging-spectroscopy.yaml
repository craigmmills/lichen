summary: A closed study, built by Steve Schill, that used airborne imaging spectroscopy to
  pick coral outplant sites in Bávaro; it reports over 76 per cent of 1,722 fragments survived
  after 11 months.
facts:
- claim: The study used imaging spectroscopy from the Global Airborne Observatory to identify
    coral outplant sites in Bávaro.
  url: https://www.conservationgateway.org/collections/ocean/site-selection-coral-reef-restoration-airborne-imaging-spectroscopy/
  fetched: 2026-11-12
  quote: Outplant sites for a community-based, citizen science outplant event in Bávaro, Dominican
    Republic, were identified using expert-defined criteria applied to a suitability model
    from data layers derived from airborne imagery.
- claim: It reports that 1,722 Acropora cervicornis fragments were outplanted in November
    2019 and over 76 per cent survived after 11 months.
  url: https://www.conservationgateway.org/collections/ocean/site-selection-coral-reef-restoration-airborne-imaging-spectroscopy/
  fetched: 2026-11-12
  quote: By October 2020 (11 months after outplanting), survivorship remained above 76%.
- claim: It says an online tool was developed to enable replication.
  url: https://www.conservationgateway.org/collections/ocean/site-selection-coral-reef-restoration-airborne-imaging-spectroscopy/
  fetched: 2026-11-12
  quote: An online tool was developed to enable replication and facilitate future selection
    of coral restoration sites.
