summary: A closed programme, built by FUNDEMAR and launched in 2023 with French government
  funding of half a million euros, which Acento reported found over 70 per cent of
  64 assessed reefs had under 10 per cent live coral.
facts:
- claim: In July 2025, Acento reported that the programme found more than 70 per cent
    of 64 reefs assessed had under 10 per cent live coral cover, and also assessed
    seagrass and mangrove cover.
  url: https://acento.com.do/ecologia/fundemar-estado-de-los-corales-pastos-marinos-y-manglares-demanda-acciones-para-su-preservacion-9528300.html
  fetched: 2026-11-12
  quote: reveló que más del 70 % de los 64 arrecifes evaluados presenta menos de un
    10 % de cobertura de coral vivo.
- claim: Acento reports the programme was launched in 2023 by the Government of France
    through its embassy in Santo Domingo, with half a million euros.
  url: https://acento.com.do/ecologia/fundemar-estado-de-los-corales-pastos-marinos-y-manglares-demanda-acciones-para-su-preservacion-9528300.html
  fetched: 2026-11-12
  quote: un programa impulsado en 2023 por el Gobierno de Francia a través de su embajada
    en Santo Domingo, con un financiamiento de medio millón de euros.
- claim: OpenAlex lists a 2025 paper describing Monitorea as a roadmap for monitoring
    mangroves, seagrasses and coral reefs and its first implementation, with Rita
    Sellares Blasco of FUNDEMAR as first author.
  url: https://api.openalex.org/works/W4408817449?select=id,display_name,publication_year,authorships
  fetched: 2026-11-12
  quote: 'MONITOREA: A roadmap for monitoring mangroves, seagrasses, and coral reefs
    and its first implementation in the Dominican Republic'
