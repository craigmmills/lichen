- claim: The 2024–2025 report says there were 22 cameras on nests and 20 on artificial
    nest boxes at Loma del Toro.
  url: https://www.birdscaribbean.org/wp-content/uploads/2026/02/Final-report-Grupo-Jaragua-24-25-21107J-summary-for-ABC-REV.pdf
