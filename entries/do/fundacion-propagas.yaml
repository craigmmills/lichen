- claim: Acento reports that the foundation, Reef Check República Dominicana and the
    Smithsonian Environmental Research Center presented the report on coral reef resilience
    in the Dominican Republic 2025.
  url: https://acento.com.do/ecologia/cientificos-advierten-que-futuro-de-los-arrecifes-depende-de-acciones-actuales-9629752.html
  fetched: 2026-11-12
  quote: presentaron “La resiliencia de los arrecifes de coral en República Dominicana
    2025”.
