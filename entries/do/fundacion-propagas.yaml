    Fundación Propagas with Reef Check República Dominicana has set biodiversity baselines.
  url: https://acento.com.do/ecologia/cientificos-advierten-que-futuro-de-los-arrecifes-depende-de-acciones-actuales-9629752.html
  fetched: 2026-11-12
  quote: el monitoreo científico continuo iniciado en 2015 por la Fundación Propagas
    junto a Reef Check República Dominicana ha permitido establecer líneas base de
