summary: Closed scientific expeditions to a marine mammal sanctuary, led by the Dominican
  environment ministry; February and March 2026 findings were presented in April 2026,
  with 644 humpback whale sightings over three days reported on Navidad Bank.
facts:
- claim: El Inmobiliario reports that the ministry led the Navidad 2026 expedition
    to study humpback whales on the Navidad Bank, recording 644 sightings over three
    days.
  url: https://inmobiliario.do/en/dominican-republic-leads-historic-research-on-humpback-whales-in-navidad-bank/
  fetched: 2026-11-12
  quote: led the Christmas 2026 scientific expedition, considered the most ambitious
    to date to study humpback whales (Megaptera novaeangliae) in the Christmas Bank
- claim: El Inmobiliario reports that the expedition used passive acoustic monitoring
    with long-range hydrophones to record male song.
  url: https://inmobiliario.do/en/dominican-republic-leads-historic-research-on-humpback-whales-in-navidad-bank/
  fetched: 2026-11-12
  quote: The research included Passive Acoustic Monitoring (PAM), using long-range
    hydrophones
- claim: Fondo MARENA says the expeditions are part of the Caribbean Engagement –
    Dominican Republic Intervention project, sponsored by Blue Nature Alliance, implemented
    by the ministry and managed technically and financially by Fondo MARENA.
  url: https://fondomarena.gob.do/index.php/noticias/item/570-hallazgos-cientificos-fortalecen-la-gestion-del-santuario-de-mamiferos-marinos
  fetched: 2026-11-12
  quote: patrocinado por Blue Nature Alliance, implementado por el Ministerio de Medio
    Ambiente y Recursos Naturales y gestionado técnica y financieramente por Fondo
    MARENA
- claim: Findings of the February and March 2026 expeditions were presented in April
    2026 by the director of the Caribbean Cetacean Society.
  url: https://fondomarena.gob.do/index.php/noticias/item/570-hallazgos-cientificos-fortalecen-la-gestion-del-santuario-de-mamiferos-marinos
  fetched: 2026-11-12
  quote: presentó los principales hallazgos de las expediciones realizadas entre los
    meses de febrero y marzo
