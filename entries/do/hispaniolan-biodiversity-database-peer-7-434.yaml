summary: A closed project led by Yolanda León that compiled Hispaniolan checklists and created
  two iNaturalist projects reported to hold over 3,000 and over 50,000 observations.
facts:
- claim: The PEER page says the project would combine citizen-science and collection records
    into a Hispaniolan species checklist and occurrence database focused on the Jaragua-Bahoruco-Enriquillo
    Biosphere Reserve.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_189105
  fetched: 2026-11-12
  quote: This project will create a step-by-step protocol for combining these rich datasets
    into a Hispaniolan species checklist and occurrence database
- claim: The page says the project aimed to enrich amphibian occurrence data through acoustic
    monitoring.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_189105
  fetched: 2026-11-12
  quote: The goal of this project is to enrich amphibian data occurrence datasets through
    acoustic monitoring
- claim: Its final summary says two iNaturalist projects it created hold over 3,000 and over
    50,000 observations, the larger being Atlas Viviente RD.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_189105
  fetched: 2026-11-12
  quote: Two iNaturalist projects created by the project already gather over 3000 for project
    Reserva de Biosfera Jaragua-Bahoruco-Enriquillo
- claim: The final summary says the team compiled Hispaniolan checklists for amphibians, reptiles
    and vascular plants, an endangered species checklist for the Dominican Republic, and the
    National Red List of Threatened Species of the Dominican Republic.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_189105
  fetched: 2026-11-12
  quote: the project team successfully compiled the first biodiversity taxa checklists for
    Hispaniola
