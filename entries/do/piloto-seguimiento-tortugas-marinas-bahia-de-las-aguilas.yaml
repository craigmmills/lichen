status: active
summary: Active national sea turtle tracking pilot at Bahía de las Águilas, built
  by the environment ministry, using EarthRanger to follow patrols, nesting and strandings
  in real time; three female leatherbacks were recorded.
facts:
- claim: Diario Libre reports that the ministry started the first national sea turtle
    tracking pilot at Bahía de las Águilas with new identification and monitoring
    tools.
  url: https://www.diariolibre.com/amp/planeta/medioambiente/2026/06/16/bahia-de-las-aguilas-y-el-seguimiento-de-tortugas-marinas/3569222
  fetched: 2026-11-12
  quote: El Ministerio de Medio Ambiente puso en marcha en Bahía de las Águilas el
    primer piloto nacional para el seguimiento de tortugas marinas mediante nuevas
    herramientas de identificación y monitoreo
- claim: The pilot uses EarthRanger to record and follow in real time night patrols,
    nesting, strandings and other wildlife incidents.
  url: https://www.diariolibre.com/amp/planeta/medioambiente/2026/06/16/bahia-de-las-aguilas-y-el-seguimiento-de-tortugas-marinas/3569222
  fetched: 2026-11-12
  quote: la implementación de EarthRanger , una plataforma digital que permite registrar
    y dar seguimiento en tiempo real a los patrullajes nocturnos, anidamientos, varamientos
- claim: Ministry technicians recorded three female leatherback turtles during the
    field days.
  url: https://www.diariolibre.com/amp/planeta/medioambiente/2026/06/16/bahia-de-las-aguilas-y-el-seguimiento-de-tortugas-marinas/3569222
  fetched: 2026-11-12
  quote: Durante las jornadas de campo, técnicos del ministerio registraron tres hembras
    de tortuga tinglar (Dermochelys coriacea).
