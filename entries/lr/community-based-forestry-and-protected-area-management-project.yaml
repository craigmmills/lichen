summary: A Sweden-funded UNDP and FAO project using SMART for biodiversity monitoring,
  which UNDP reported in March 2025 had equipped the Forestry Development Authority,
  with eighty eco-guards patrolling.
facts:
- claim: UNDP describes it as a joint project of UNDP and FAO, funded by Sweden and
    implemented in partnership with the Forestry Development Authority.
  url: https://www.undp.org/node/511401
  fetched: 2026-11-15
  quote: The Community-Based Forestry and Protected Area Management project is a joint
    project of UNDP and FAO, funded by Sweden and implemented in partnership with
    the Forestry Development Authority (FDA).
- claim: A March 2025 UNDP article says the project aimed to boost rangers' and officers'
    capacity in biodiversity monitoring and wildlife conservation using the SMART
    data collection method.
  url: https://www.undp.org/node/511401
  fetched: 2026-11-15
  quote: promoting biodiversity monitoring, forest maintenance, and wildlife conservation
    using the SMART data collection method.
- claim: In March 2025, UNDP reported that eighty eco-guards were conducting monitoring
    patrols led by FDA rangers in Gola National Park and Foya Proposed Protected Area.
  url: https://www.undp.org/node/511401
  fetched: 2026-11-15
  quote: conducting monitoring patrols led by FDA rangers in the Gola National Park
    and Foya Proposed Protected Area.
- claim: A March 2025 UNDP article says the project had provided GPS units, tablets,
    cameras, remote sensing technologies and carbon monitoring tools a year earlier,
    which the FDA was using to monitor more than 30 cluster forest communities.
  url: https://www.undp.org/node/511401
  fetched: 2026-11-15
  quote: remote sensing technologies, and carbon monitoring tools the FDA uses to
    monitor more than 30 cluster forest communities.
