summary: A non-profit Liberian organisation associated with Liberia's first specialised
  sea turtle study, conducted from April 2000 to April 2001 and followed by a Borgor
  Point pilot.
facts:
- claim: An August 2000 Rufford project page describes SAMFU as a non-profit, non-governmental
    organisation in Liberia, through which Monsignor Robert Tikpor was working.
  url: https://www.rufford.org/projects/monsignor-robert-tikpor/the-liberia-sea-turtle-project/
  fetched: 2026-11-15
  quote: Working through the SAMFU Foundation, a non profit, non governmental organisation
    in Liberia
- claim: An August 2000 Rufford project page says the Foundation was working to identify
    forests, biologically diverse areas and endangered species.
  url: https://www.rufford.org/projects/monsignor-robert-tikpor/the-liberia-sea-turtle-project/
  fetched: 2026-11-15
  quote: The Foundation is working to identify forests and biologically diverse areas
    and endangered species
- claim: The Liberia Sea Turtle Project, carried out through SAMFU, was the first
    specialised study on sea turtles in Liberia.
  url: https://www.rufford.org/projects/monsignor-robert-tikpor/the-liberia-sea-turtle-project/
  fetched: 2026-11-15
  quote: This was the first specialised study on sea turtles in Liberia.
- claim: A July 2002 project report on the Rufford Foundation's site says the first
    specialised sea turtle study in Liberia ran from April 2000 to April 2001.
  url: https://media.rufford.org/media/project_reports/07.01.00%20July%202002.pdf
  fetched: 2026-11-15
  quote: The survey, which lasted from April 2000 to April 2001, was the first specialised
    study on sea turtles
- claim: An October 2002 project update says the Save My Future Foundation's Liberia
    Sea Turtle Project was working with residents at Borgor Point, under the Borgor
    Point Sea Turtle Pilot Research, Monitoring and Conservation Project launched
    in May 2002.
  url: https://media.rufford.org/media/project_reports/42.10.02%20October%202002.pdf
  fetched: 2026-11-15
  quote: Future Foundation ‘Liberia Sea Turtle Project’ is working with residents
    of the community
- claim: The same update says turtle guards hired at Borgor Point had recorded three
    sea turtle species since May 2002.
  url: https://media.rufford.org/media/project_reports/42.10.02%20October%202002.pdf
  fetched: 2026-11-15
  quote: Since May 2002, they have recorded three species of sea turtles
- claim: A later Rufford grantee report names the Save My Future (SAMFU) Foundation
    as a planned collaborator, with the Environmental Protection Agency, on education
    workshops for law enforcement officers.
  url: https://media.rufford.org/media/project_reports/15801-2%20Final%20Report.doc
  fetched: 2026-11-15
  quote: in collaboration with the Environmental Protection Agency and the Save My
    Future (SAMFU) Foundation.
