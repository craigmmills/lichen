summary: Launched in Lofa County in June 2018 with Forest Carbon Partnership Facility funding and FDA
  implementation, Liberia's first national forest inventory used digitised Open Foris data collection.
facts:
- claim: The first national forest inventory was launched on 4 June 2018 in Lofa County, funded by the
    Forest Carbon Partnership Facility and implemented by the FDA.
  url: https://www.fao.org/haltingdeforestation/news/detail/Liberia-launches-its-first-National-Forest-Inventory/en
  fetched: 2026-11-12
  quote: Funded by the Forest Carbon Partnership Facility, the NFI is implemented by the Liberian Forestry
    Development Authority (FDA).
- claim: Data collection was fully digitised using the Open Foris toolkit.
  url: https://www.fao.org/haltingdeforestation/news/detail/Liberia-launches-its-first-National-Forest-Inventory/en
  fetched: 2026-11-12
  quote: For the first time in the country, the data collection for the NFI was fully digitised thanks
    to the use of the Open Foris toolkit.
- claim: In 2018, FAO said the inventory was expected to produce the first national estimates of forest
    resources in Liberia.
  url: https://www.fao.org/haltingdeforestation/news/detail/Liberia-launches-its-first-National-Forest-Inventory/en
  fetched: 2026-11-12
  quote: will be the first time national estimates of forest resources are produced
