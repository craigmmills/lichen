summary: Self-described as Liberia's oldest conservation organisation, it uses SMART,
  and the RSPB reports its community ecoguards record wildlife signs and share data
  by smartphone, while a September 2025 report describes its ecoguard training workshop.
facts:
- claim: Describes itself, on Rainforest Trust's partner page, as Liberia's oldest
    conservation organisation and a not-for-profit, non-governmental organisation.
  url: https://www.rainforesttrust.org/get-involved/rainforest-trust-partners/society-for-the-conservation-of-nature-of-liberia/
  fetched: 2026-11-13
  quote: We are a not-for-profit and non-governmental organization.
- claim: The RSPB says its Community Ecoguards, under SCNL's community livelihood
    programme, record signs of wildlife and share the data through smartphones using
    SMART.
  url: https://web-cdn.rspb.org.uk/helping-nature/what-we-do/protecting-species-and-habitats/international/gola-rainforest/conservation-at-a-flyway-scale-liberias-gola-rainforest
  fetched: 2026-11-13
  quote: This vital data is captured and shared through smartphones using the SMART
    system (Spatial Monitoring and Reporting Tool).
- claim: The RSPB page shows an SCNL research technician setting up a camera trap
    with a community ecoguard.
  url: https://web-cdn.rspb.org.uk/helping-nature/what-we-do/protecting-species-and-habitats/international/gola-rainforest/conservation-at-a-flyway-scale-liberias-gola-rainforest
  fetched: 2026-11-13
  quote: Research Technician at SCNL (left) and Community Ecoguard Lassana Yamah (right)
    practice setting up a camera trap
- claim: A September 2025 Rufford field report says SCNL ran a capacity-building workshop
    for community ecoguards and rangers in the Foya Proposed Protected Area, covering
    monitoring techniques and data collection tools.
  url: https://media.rufford.org/media/project_reports/47948-1_Rufford_Foya_ecoguard_training_Field_Report.pdf
  fetched: 2026-11-13
  quote: Nature of Liberia (SCNL) conducted a practical capacity -building workshop
    for community
