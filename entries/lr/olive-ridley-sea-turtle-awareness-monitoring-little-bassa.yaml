summary: A US$2,750 grant awarded in October 2012 by the Mohamed bin Zayed Species
  Conservation Fund, planning daily beach monitoring and training of local monitors
  to record sea turtle tracks and nests in Liberia.
facts:
- claim: The grant of US$2,750 was awarded on 24 October 2012 for a project in Liberia.
  url: https://www.speciesconservation.org/small-grant/olive-ridley-sea-turtle/4294
  fetched: 2026-11-15
  quote: 'Awarded Date : October 24, 2012'
- claim: The 2012 grant page gives an objective to monitor beaches daily by counting,
    marking and recording the locations of all sea turtles and nests seen along the
    target coast.
  url: https://www.speciesconservation.org/small-grant/olive-ridley-sea-turtle/4294
  fetched: 2026-11-15
  quote: to monitor beaches on a daily basis through counting, marking and recording
    the locations of all sea turtles and nests seen along the coast of targeted area
- claim: The 2012 grant page planned training for local monitors to record sea turtle
    tracks and nests, identify species and monitor nests until hatching.
  url: https://www.speciesconservation.org/small-grant/olive-ridley-sea-turtle/4294
  fetched: 2026-11-15
  quote: Local monitor will be able to record sea turtle tracks, their nests and to
    identify the type of species as well as monitoring the nests till the hatchlings
    are out into the ocean.
- claim: The grant page lists Trokon Saykpa and Sea Turtle Watch of Liberia, Little
    Bassa, Grand Bassa.
