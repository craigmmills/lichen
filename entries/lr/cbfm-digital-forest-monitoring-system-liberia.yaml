summary: Active Swedish-funded cloud-based system, reported by UNDP, for real-time
  forest monitoring in Liberia, with a ranger incident-reporting app and web dashboard,
  and a August 2025 training of eleven FDA staff to scale it.
facts:
- claim: UNDP says the Joint CBFM Project, funded by Sweden, launched a cloud-based
    digital solution for real-time forest monitoring across Liberia.
  url: https://www.undp.org/liberia/press-releases/digital-innovation-boosts-forest-monitoring-swedens-support
  fetched: 2026-11-13
  quote: a new cloud-based digital solution has been launched to enable real-time
    forest monitoring across the country.
- claim: Its mobile app lets rangers report incidents with geolocation tags, photos,
    voice and text, and a web dashboard aggregates and validates the data.
  url: https://www.undp.org/liberia/press-releases/digital-innovation-boosts-forest-monitoring-swedens-support
  fetched: 2026-11-13
  quote: the mobile application, which allows rangers to report incidents instantly
    using geolocation tagging, photo documentation, voice recordings, and text input
- claim: In August 2025, eleven FDA staff took a two-day training of trainers workshop
    to build national capacity for scaling the system.
  url: https://www.undp.org/liberia/press-releases/digital-innovation-boosts-forest-monitoring-swedens-support
  fetched: 2026-11-13
  quote: eleven FDA staff participated in a two-day Training of Trainers (ToT) workshop
    aimed at building national capacity for scaling the system.
