summary: A USAID-funded permanent sample plot project in Liberian forests, planned
  for September 2022 to October 2024, whose database holds 5,403 occurrence records
  of 308 species from 20 sites.
facts:
- claim: The project's database covers plant data from Gola Forest National Park,
    Wonegizi-Wologizi Forest, Sapo National Park, Grebro-Krahn National Park and their
    buffer zones in Liberia, with a timeline planned for September 2022 to October
    2024.
  url: https://api.gbif.org/v1/dataset/doi/10.15468/nj4bge
  fetched: 2026-11-15
  quote: The timeline for this database was planned for September 2022 to October
    2024.
- claim: It was implemented by the Reptile and Amphibian Program Sierra Leone with
    USAID funding through Tetra Tech and West Africa Biodiversity and Low Emission
    Development, under project number WABiLED-G-003-RAP-SL.
  url: https://api.gbif.org/v1/dataset/doi/10.15468/nj4bge
  fetched: 2026-11-15
  quote: This project was funded by USAID through Tetra Tech/West Africa Biodiversity
    and Low Emission Development and implemented by Reptile and Amphibian Program
    Sierra Leone (RAP-SL)
- claim: All plots followed the Forest Plots methodology, with trees of 10 cm diameter
    and above measured and tagged in the permanent plots.
  url: https://api.gbif.org/v1/dataset/doi/10.15468/nj4bge
  fetched: 2026-11-15
  quote: All plots, followed Forest Plots methodology (www.forestplots.net).
- claim: The database holds 5,403 occurrence records of 308 species from 20 sites.
  url: https://api.gbif.org/v1/dataset/doi/10.15468/nj4bge
  fetched: 2026-11-15
  quote: In all, a total of 5403 occurrence records are presented in this database
- claim: Specimens were deposited at the Forestry Training Institute herbarium in
    Tubmanburg, Liberia.
  url: https://api.gbif.org/v1/dataset/doi/10.15468/nj4bge
  fetched: 2026-11-15
  quote: All collected specimens were deposited at the newly FTI herbarium in Tubmanburg,
    Liberia.
