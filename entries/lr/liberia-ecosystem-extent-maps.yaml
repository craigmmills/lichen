summary: A set of ecosystem maps built by Conservation International and NASA from
  satellite data and field surveys, which a March 2021 article reports Liberia's government
  used to analyse ecosystem change over time.
facts:
- claim: A March 2021 article reports that, in partnership with Conservation International
    and NASA, the government of Liberia had mapped the country's ecosystems and analysed
    how they had changed over time.
  url: https://www.conservation.org/blog/new-nasa-maps-will-help-liberia-chart-course-for-a-sustainable-future
  fetched: 2026-11-15
  quote: In partnership with Conservation International and NASA, the government of
    Liberia recently mapped the country’s diverse ecosystems — from lush forests to
    coastal mangroves — and analyzed how they have changed over time.
- claim: The maps were made from NASA Earth-observing satellite data and Conservation
    International field surveys.
  url: https://www.conservation.org/blog/new-nasa-maps-will-help-liberia-chart-course-for-a-sustainable-future
  fetched: 2026-11-15
  quote: They were created using remote-sensing data generated by NASA’s fleet of
    Earth-observing satellites and field surveys from Conservation International scientists
    on the ground.
- claim: The article is dated 17 March 2021.
  url: https://www.conservation.org/blog/new-nasa-maps-will-help-liberia-chart-course-for-a-sustainable-future
  fetched: 2026-11-15
