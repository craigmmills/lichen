summary: Veterinary school in Basseterre whose conservation medicine centre researches sea turtles, birds,
  marine mammals, corals, fish and introduced species, and which reported a USD 55,000 US Fish and Wildlife
  Service grant in December 2018.
facts:
- claim: WIDECAST's St Kitts and Nevis page gives the school's address at Main Street, Basseterre, St
    Kitts.
  url: https://www.widecast.org/who-we-are/widecast-ccs/st-kitts-nevis/
  fetched: 2026-11-12
  quote: c/o Ross University School of
- claim: The school's Center for Conservation Medicine and Ecosystem Health says its research concentrates
    on sea turtles, shorebirds and seabirds, marine mammals, corals and fish, as well as introduced species.
  url: https://veterinary.rossu.edu/research/research-center/center-for-conservation-medicine-and-ecosystem-health
  fetched: 2026-11-12
  quote: Our conservation veterinary medicine research concentrates on sea turtles, nesting shorebirds/seabirds,
    marine mammals, corals, and fish populations as well as feral donkeys, free-roaming dogs, African
    green monkeys and small Indian mongooses.
- claim: A December 2018 Ross Vet news item reported that the school had secured a USD 55,000 grant from
    the US Fish and Wildlife Service for conservation work in the Narrows Marine Managed Area.
  url: https://veterinary.rossu.edu/news/rossvet-wins-grant-to-strengthen-conservation-work
  fetched: 2026-11-12
  quote: The fish, wildlife and environmental conservation work on the Narrows Marine Managed Area on
    St. Kitts & Nevis will continue thanks to a grant of USD$55, 000 secured by Ross University School
    of Veterinary Medicine (Ross Vet) from the US Fish and Wildlife Service.
