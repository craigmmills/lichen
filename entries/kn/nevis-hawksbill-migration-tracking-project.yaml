summary: Study of hawksbill turtles nesting on Nevis, begun in August 2006 according to the Sea Turtle
  Conservancy; a 2026 press release says over 20 years it has satellite-tracked more than 30 turtles.
facts:
- claim: The Sea Turtle Conservancy says it began the project in August 2006 with the Four Seasons Resort
    Nevis and the Nevis Turtle Group to study the migration of hawksbill turtles nesting on Nevis.
  url: https://conserveturtles.org/?p=2948
  fetched: 2026-11-12
  quote: In August 2006, the Sea Turtle Conservancy, the Four Seasons Resort Nevis and the Nevis Turtle
    Group began an inaugural sea turtle research and conservation project to study the migration patterns
    of “critically endangered” hawksbill sea turtles
- claim: A 2026 Four Seasons Resort Nevis press release says the partnership has tracked more than 30
    sea turtles nesting on Nevis with satellite telemetry over 20 years.
  url: https://press.fourseasons.com/nevis/hotel-news/2026/sea-turtle-conservation
  fetched: 2026-11-12
  quote: Over the past 20 years, the partnership has tracked more than 30 sea turtles nesting on Nevis,
    using satellite telemetry to follow their post‑nesting migrations across the Caribbean.
