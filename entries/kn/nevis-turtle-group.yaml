summary: Non-profit in Gingerland, Nevis, that began night patrols and turtle tagging
  in 2003, reportedly monitored over 150 sea turtles by 2011, and builds the Nevis
  hawksbill migration tracking project.
facts:
- claim: A July 2011 Carib Journal article described the Nevis Turtle Group as a non-profit
    organisation working with local schools and the Four Seasons Resort to protect
    turtles and study their movements.
  url: https://www.caribjournal.com/?p=4459
  fetched: 2026-11-13
  quote: has grown into the Nevis Turtle Group, a non-profit organization that works
    with local schools and the nearby Four Seasons Resort to protect the turtles and
    study their unusual movements.
- claim: Carib Journal reported in July 2011 that the group had monitored more than
    150 sea turtles since 2003.
  url: https://www.caribjournal.com/?p=4459
  fetched: 2026-11-13
  quote: Lemuel Pemberton’s Nevis Turtle Group has monitored more than 150 sea turtles
    since 2003.
- claim: A Rufford Foundation project page says the group began night patrols and
    tagging of sea turtles on the two main nesting beaches of Nevis in 2003.
  url: https://rufford.org/projects/emile-pemberton/nevis-sea-turtle-conservation-project
  fetched: 2026-11-13
  quote: In 2003 a group of four volunteers started doing the night patrols and the
    tagging of sea turtles on the two main nesting beaches on Nevis.
- claim: The WIDECAST page for St Kitts and Nevis lists the Nevis Turtle Group at
    Gingerland, Nevis.
  url: https://www.widecast.org/who-we-are/widecast-ccs/st-kitts-nevis/
  fetched: 2026-11-13
  quote: Gingerland, Nevis
- claim: A 2026 Four Seasons Resort Nevis press release says the resort has worked
    with the Sea Turtle Conservancy and the Nevis Turtle Group since 2006 on research,
    satellite tracking and conservation of hawksbill, green and leatherback turtles.
  url: https://press.fourseasons.com/nevis/hotel-news/2026/sea-turtle-conservation
  fetched: 2026-11-13
  quote: Four Seasons Resort Nevis has worked hand in hand with the Sea Turtle Conservancy,
    as well as the Nevis Turtle Group, to support groundbreaking research, satellite
    tracking, education, and on‑the‑ground conservation efforts
