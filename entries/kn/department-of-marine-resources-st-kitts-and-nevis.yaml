summary: Government body responsible for the Marine Management Area declared in 2016
  and federal waters under the 2016 Act, reported to have led marine inventory work
  for a UNDP-GEF project and to run the 2018 marine ecological assessment.
facts:
- claim: The department's site says the Marine Management Area declared on 18 August
    2016 was designated to be managed by the Department of Marine Resources, the body
    with jurisdiction over federal waters under the Fisheries, Aquaculture and Marine
    Resources Act 2016.
  url: https://dmrskn.com/tag/ocean/
  fetched: 2026-11-13
  quote: to be managed by the Department of Marine Resources as the entity with jurisdiction
    of the Federal Waters of St. Kitts and Nevis as indicated in the Fisheries, Aquaculture
    and Marine Resources Act (FAMRA) 2016.
- claim: A November 2017 post on the department's site quotes its Marine Management
    Area and Habitat Monitoring Officer.
  url: https://dmrskn.com/tag/ocean/
  fetched: 2026-11-13
  quote: I am the Marine Management Area (MMA) and Habitat Monitoring Officer at the
    Department of Marine Resources (DMR) in St. Kitts and Nevis (SKN).
- claim: SKNIS reported in July 2018 that underwater video surveys of the Marine Management
    Area were carried out by the Department of Environment and the Department of Marine
    Resources with the UNDP and GEF Conserving Biodiversity Project.
  url: https://www.sknis.gov.kn/2018/07/09/first-phase-of-marine-ecological-assessment-completed-in-st-kitts-nevis
  fetched: 2026-11-13
  quote: Underwater video surveys were carried out by the Department of Environment
    (DoE) and the Department of Marine Resources (DMR) in collaboration with United
    Nations Development Programme (UNDP) and the Global Environment Facility (GEF)
    Conserving Biodiversity Project.
- claim: The terminal evaluation of the UNDP-GEF protected areas project in St Kitts
    and Nevis says the department led the project's marine inventory work.
  url: https://erc.undp.org/evaluation/documents/download/18150
  fetched: 2026-11-13
  quote: DMR led the work in the marine inventory.
- claim: SKNIS reported in January 2023 that the department received underwater cameras
    and depth gauges from Japan, which an official said would let staff check on the
    health of marine habitats.
  url: https://sknis.gov.kn/?p=73639
  fetched: 2026-11-13
  quote: the staff to check on the health and development of a given marine habitat.”
