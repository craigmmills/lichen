facts:
- claim: SKNIS reported in May 2020 that the buoy was first deployed in April 2018 at Paradise Reef, Sandy
    Point, with technical support from NOAA and the Environmental Mooring Institute.
  url: https://www.sknis.gov.kn/2020/05/29/government-agencies-collaborate-to-redeploy-coral-reef-early-warning-systems-buoy
  fetched: 2026-11-12
  quote: The CREWS Buoy was originally deployed in April 2018 at Paradise Reef, Sandy Point with technical
    support not only from local agencies but also experts from the National Oceanic and Administrative
    Administration (NOAA), Environmental Mooring Institute (EMI).
- claim: In May 2020, a Department of Environment conservation officer said the buoy measured marine data
    such as sea temperature, salinity and algae content, to help predict coral bleaching.
  url: https://www.sknis.gov.kn/2020/05/29/government-agencies-collaborate-to-redeploy-coral-reef-early-warning-systems-buoy
  fetched: 2026-11-12
  quote: but also marine data such as sea temperature, salinity and algae content. This will allow us
    to better understand the biological mechanisms in the area, as well as to better predict coral bleaching
    over time,” said Ms. Jeffers.
