summary: Under BioTA, The Nature Conservancy collaborated with the St Kitts and Nevis
  Maritime Administration in 2010–2012 on marine zoning using Marxan, producing a
  draft Marine Spatial Plan.
facts:
- claim: The Marxan site says that from 2010 to 2012 TNC collaborated with the St
    Kitts and Nevis Maritime Administration on a marine zoning exercise under the
    BioTA project that resulted in a draft Marine Spatial Plan.
  url: https://marxansolutions.org/community/marine-spatial-planning-in-st-kitts-and-nevis/
  fetched: 2026-11-13
  quote: From 2010-2012, TNC collaborated with the St. Kitts and Nevis (SKN) Maritime
    Administration to conduct a marine zoning exercise that resulted in the drafting
    of a Marine Spatial Plan for St. Kitts and Nevis (SKN)
- claim: The page says TNC led additional data collection, including mapping benthic
    habitats and surveying local fishers.
  url: https://marxansolutions.org/community/marine-spatial-planning-in-st-kitts-and-nevis/
  fetched: 2026-11-13
  quote: TNC brought in technical expertise to carry out spatial data evaluation and
    management and led additional data collection efforts including building datasets
    from expert knowledge, mapping benthic habitats, and surveying local fishers.
- claim: The page says the data were used in a Marxan with Zones analysis and other
    decision-support tools to support zoning design.
  url: https://marxansolutions.org/community/marine-spatial-planning-in-st-kitts-and-nevis/
  fetched: 2026-11-13
  quote: These data were used in a Marxan with Zones analysis and other decision-support
    tools to support zoning design, which were vetted through a series of stakeholder
    meetings and workshops.
