summary: NGO registered in 2021 that began a coral nursery pilot in June 2022, partners
  with Reef Check, hosted a 2022 EcoDiver course certifying ten divers, and in April
  2025 was reported to be implementing a PROCARIBE+ community project.
facts:
- claim: Reef Check's news item by its St Kitts and Nevis coordinator describes C.A.R.E.
    SKN as an NGO registered in 2021 that began with a coral nursery pilot in June
    2022.
  url: https://www.reefcheck.org/st-kitts-nevis-launches-summer-reef-check-program/
  fetched: 2026-11-13
  quote: a newly registered NGO (2021) that started operations with a coral nursery
    pilot project in June 2022.
- claim: The same item says the Reef Check course builds a local team of citizen scientists
    who help C.A.R.E. SKN with data collection.
  url: https://www.reefcheck.org/st-kitts-nevis-launches-summer-reef-check-program/
  fetched: 2026-11-13
  quote: builds up a local team of “Reef Warriors” from the citizen scientists helping
    C.A.R.E. SKN with data collection.
- claim: The item says the 2022 course certified ten Reef Check EcoDivers and completed
    a survey at the end of the class.
  url: https://www.reefcheck.org/st-kitts-nevis-launches-summer-reef-check-program/
  fetched: 2026-11-13
  quote: We successfully certified 10 new Reef Check EcoDivers in substrate, invertebrates
    and fish. We were also able to complete a survey at the end of the class.
- claim: The December 2022 item says the class was held that August at C.A.R.E. SKN
    at Oualie, Nevis.
  url: https://www.reefcheck.org/st-kitts-nevis-launches-summer-reef-check-program/
  fetched: 2026-11-13
  quote: came to C.A.R.E. SKN at Oualie, Nevis in the Caribbean to start their Reef
    Check EcoDiver course.
- claim: The GEF Small Grants Programme said in April 2025 that CARE SKN was implementing
    one of three PROCARIBE+ community projects in St Kitts and Nevis, which will include
    Reef Check EcoDiver training for fishers and a week of reef surveys.
  url: https://sgp.undp.org/resources-155/our-stories/787-strengthening-ocean-conservation-and-sustainable-development-in-st-kitts-nevis.html
  fetched: 2026-11-13
  quote: The project will also facilitate Reef Check EcoDiver training certification
    for the local fishers and a week of intensive reef surveys to enhance local marine
    conservation efforts.
