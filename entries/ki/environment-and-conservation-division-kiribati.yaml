summary: Kiribati government division within MELAD, which runs it, with reported work
  in 2022 and 2023 on turtle tagging, seagrass and mangrove monitoring, and littering
  enforcement, and the executing role for GEF project 5130.
facts:
- claim: UNDP reports that in September and October 2022 Environment and Conservation
    Division officers on Nonouti tagged turtles, delineated seagrass beds and monitored
    mangroves planted by communities.
  url: https://adaptation-undp.org/resources/news-article/nonouti-ldcf-continues-support-environmental-sustainability-and-food-security
  fetched: 2026-11-13
  quote: The activities included building coastal beach brush, planting coastal areas,
    tagging turtles, delineating seagrass beds, selecting and planting mangroves on
    Nounouti with the cooperation of communities, and lastly monitoring mangroves
    planted by communities
- claim: The division's news page says a team working on village resource management
    plans also carried out environmental data recording, including seagrass demarcation
    and mapping of environmentally significant features of three villages.
  url: https://environment.melad.gov.ki/news/
  fetched: 2026-11-13
  quote: Mapping of environment significant features of the three targeted villages
    were also conducted.
- claim: The GEF lists the division, within MELAD, as executing agency of GEF project
    5130 on information management and compliance monitoring.
  url: https://www.thegef.org/projects-operations/projects/5130
  fetched: 2026-11-13
  quote: Environment and Conservation Division (ECD), Ministry of Environment, Land,
    and Agricultural Development (MELAD)
- claim: The division's news page says its Licensing, Compliance and Prosecution Section
    enforced the littering provision of the Environment Act 2021 in 2023.
  url: https://environment.melad.gov.ki/news/
  fetched: 2026-11-13
  quote: The Licensing, Compliance and Prosecution Section of ECD facilitated this
    activity
