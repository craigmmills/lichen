summary: A unit of the Kiribati environment ministry, run by it, which a 2013 CEPF report says led on-the-ground
  activities, including bird and rat monitoring on Kiritimati, with staff trained in bird surveys.
facts:
- claim: A 2013 CEPF final project report names the Wildlife Conservation Unit as part of the Ministry
    of Environment, Land and Agricultural Development, Government of Kiribati, and says it led on-the-ground
    activities.
  url: https://cepf.net/resources/final-project-report/final-project-report-1668
  fetched: 2026-11-12
  quote: Lead on the ground activities and actions
- claim: The same report says rat monitoring on Kiritimati was being carried out together with the bird
    monitoring surveys, and that WCU staff had been trained in bird surveys.
  url: https://cepf.net/resources/final-project-report/final-project-report-1668
  fetched: 2026-11-12
  quote: now being carried out in conjunction with the bird monitoring surveys.
- claim: A CEPF report on the Phoenix Islands biosecurity plan lists the unit as the Wildlife Conservation
    Unit of MELAD at Kiritimati.
  url: https://www.cepf.net/sites/default/files/final-report-sg50155.pdf
  fetched: 2026-11-12
  quote: WCU Wildlife Conservation Unit, MELAD, Kiritimati
- claim: The ministry's home page lists Wildlife Conservation among the sections of its Environment and
    Conservation work.
  url: https://www.melad.gov.ki
  fetched: 2026-11-12
  quote: Wildlife Conservation
