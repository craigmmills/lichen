summary: A closed project, 15 September 2020 to 14 March 2023, led by MELAD and funded
  by BIOPAMA, which planned patrol and monitoring equipment for seabird sites; the
  grant figure differs between sources.
facts:
- claim: BIOPAMA's information sheet gives the project's duration as 15 September
    2020 to 14 March 2023 and a medium grant of EUR 398,544.27.
  url: https://action.biopama.org/wp-content/uploads/2021/05/BIOPAMA-InfoFiche-MG-P-175.pdf
  fetched: 2026-11-15
  quote: 15.09.2020 – 14.03.2023
- claim: BIOPAMA's sheet described plans to provide equipment and tools for patrolling,
    protection and monitoring of seabird breeding and nesting sites.
  url: https://action.biopama.org/wp-content/uploads/2021/05/BIOPAMA-InfoFiche-MG-P-175.pdf
  fetched: 2026-11-15
  quote: patrolling, protection and monitoring of
- claim: The sheet said planned monitoring vehicles and equipment would enable regular
    monitoring of the protected areas.
  url: https://action.biopama.org/wp-content/uploads/2021/05/BIOPAMA-InfoFiche-MG-P-175.pdf
  fetched: 2026-11-15
  quote: will enable the conduction of regular and efficient monitoring activities
- claim: MELAD's own project page gives the grant as a conditional grant of EUR 378,617,
    which differs from the figure on BIOPAMA's sheet.
  url: https://www.melad.gov.ki/index.php?Itemid=529&id=118&option=com_quix&view=page
  fetched: 2026-11-15
  quote: with a conditional grant of EU378,617
