summary: An active turtle monitoring and tagging project run by the Biodiversity and
  Conservation Unit, funded by SPREP, with monitoring ongoing in Tarawa, North Tarawa
  and Kiritimati according to MELAD.
facts:
- claim: MELAD's page says turtle monitoring is ongoing in Tarawa and North Tarawa,
    including Kiritimati.
  url: https://melad.gov.ki/index.php?Itemid=384&id=48&option=com_quix&view=page
  fetched: 2026-11-15
  quote: Turtle monitoring is ongoing in Tarawa and North Tarawa, including Kiritimati
    Island.
- claim: Local counterparts were selected to carry out monitoring and turtle tagging
    where possible in North Tarawa.
  url: https://melad.gov.ki/index.php?Itemid=384&id=48&option=com_quix&view=page
  fetched: 2026-11-15
  quote: Local counterparts were selected to undertake monitoring and turtle tagging
    (where possible) in the areas (North Tarawa).
- claim: MELAD's ECD project page describes turtle monitoring as part of a regional
    programme funded by SPREP, with turtle tagging and training of ECD officials in
    turtle monitoring.
  url: https://www.melad.gov.ki/index.php?Itemid=395&id=59&option=com_quix&view=page
  fetched: 2026-11-15
  quote: The activities conducted in this program is tagging of turtles and training
    of ECD Officials on how to carry out turtle monitoring.
