summary: A unit run by the Environment and Conservation Division that, per MELAD's
  page, handles the Convention on Biological Diversity, World Heritage and Ramsar
  Conventions, and implements turtle monitoring and mangrove mapping projects.
facts:
- claim: MELAD's page says the unit handles the Convention on Biological Diversity
    and its protocols, the World Heritage Convention and the Ramsar Convention.
  url: https://melad.gov.ki/index.php?Itemid=384&id=48&option=com_quix&view=page
  fetched: 2026-11-15
  quote: The Unit is also handling the Convention on Biological Diversity (CBD) and
    its Protocols, World Heritage Convention, and the Ramsar Convention
- claim: The page lists a Marine Turtle Monitoring Project among the projects the
    unit implements, with monitoring ongoing in Tarawa, North Tarawa and Kiritimati.
  url: https://melad.gov.ki/index.php?Itemid=384&id=48&option=com_quix&view=page
  fetched: 2026-11-15
  quote: Turtle monitoring is ongoing in Tarawa and North Tarawa, including Kiritimati
    Island.
- claim: A mangrove project it implements includes updating mangrove data and mapping
    mangrove areas on targeted islands.
  url: https://melad.gov.ki/index.php?Itemid=384&id=48&option=com_quix&view=page
  fetched: 2026-11-15
  quote: Update mangrove data and demarcation of areas covered with mangrove forests
    on maps of targeted islands.
