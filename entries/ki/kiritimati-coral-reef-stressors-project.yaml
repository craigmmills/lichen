summary: A Mitacs-listed project that plans to use underwater acoustic and imagery surveys to measure
  coral, fish and habitat change on Kiritimati in the four years after a bleaching event, and to test
  acoustics for assessing reef health.
facts:
- claim: The Mitacs project page says the project will use underwater surveys and videos with acoustic
    and imagery methods to quantify changes in coral and fish communities and reef habitat on Kiritimati
    in the four years after a bleaching event.
  url: https://www.mitacs.ca/fr-ca/nos-projets/the-influence-of-local-and-global-stressors-on-coral-reef-ecosystems/
  fetched: 2026-11-12
  quote: We will use underwater surveys and videos, along with novel acoustic and imagery methods, to
    quantify how coral and fish communities, as well as the structure of the reef habitat itself, have
    changed in the four years following the event.
- claim: The page says the project will examine whether underwater acoustics can be used to assess reef
    health.
  url: https://www.mitacs.ca/fr-ca/nos-projets/the-influence-of-local-and-global-stressors-on-coral-reef-ecosystems/
  fetched: 2026-11-12
  quote: We will also examine if underwater acoustics can be used to assess reef health.
