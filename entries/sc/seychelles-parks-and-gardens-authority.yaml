summary: Body responsible for Seychelles' marine and terrestrial national parks and gardens, using EarthRanger
  and, as of August 2026, an expanded network of AI-assisted cameras in Sainte Anne Marine National Park.
facts:
- claim: Its Research Section says its work provides evidence to protect the national parks, gardens and
    protected areas of Seychelles.
  url: https://spga.gov.sc/conservation-research
  fetched: 2026-11-09
  quote: Our work provides the scientific evidence needed to protect the country’s national parks, gardens
    and protected areas
- claim: Its research covers coral reef monitoring, including reef health and coral cover.
  url: https://spga.gov.sc/conservation-research
  fetched: 2026-11-09
  quote: Coral reefs – monitoring reef health, coral cover and the effects of rising sea temperatures
    and other pressures
- claim: In December 2025 it extended its sea turtle nest temperature monitoring programme to the Ste
    Anne and Curieuse Marine National Parks, with temperature loggers installed on nesting beaches.
  url: https://www.spga.gov.sc/news/2025-12/spga-expands-scientific-monitoring-protect-hawksbill-turtle-populations
  fetched: 2026-11-09
  quote: has expanded its sea turtle nest temperature monitoring programme to the Ste Anne and Curieuse
    Marine National Parks
- claim: In September 2026 it ran a week-long monitoring training for mangrove, reef and seagrass corridors
    under the GEF-UNDP Ridge to Reef project.
  url: https://spga.gov.sc/news/2026-09/building-local-capacity-monitor-seychelles-coastal-ecosystems
  fetched: 2026-11-09
  quote: has concluded a week-long Scientific and Socio-Economic Monitoring Capacity-Building Training
    for Mangrove, Reef and Seagrass Corridors, delivered under the GOD- GEF-UNDP Ridge to Reef (R2R) Project
- claim: In August 2026 it expanded its network of AI-assisted cameras in Sainte Anne Marine National
    Park to monitor nesting sea turtles and detect incidents.
  url: https://spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: 'The expansion adds new AI assisted cameras at three key sites: two on Ste. Anne Island and one
    on Moyenne Island.'
- claim: Responsible for the marine and terrestrial national parks and gardens of Seychelles.
  url: https://www.spga.gov.sc/about-us
  fetched: 2026-11-09
  quote: Seychelles Parks and Gardens Authority (SPGA), is responsible for the marine and terrestrial
    National Parks and Gardens of Seychelles.
- claim: Says it has expanded its network of AI-assisted cameras across Sainte Anne Marine National Park,
    adding three to three already active across its parks.
  url: https://www.spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: 'The expansion adds new AI assisted cameras at three key sites: two on Ste. Anne Island and one
    on Moyenne Island. These join three specialised AI cameras already active across SPGA''s parks'
- claim: Says the cameras use AI to tell an animal from a person or moving vegetation and send detections
    in real time to its EarthRanger platform; the detection is powered by Wildlife Protection Solutions.
  url: https://www.spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: The cameras use artificial intelligence to distinguish between an animal, a person, and vegetation
    moving in the wind, filtering out false alarms so that real events are flagged immediately.
- claim: Opened an EarthRanger Operations Centre at its Marine Operations base in Perseverance in December
    2024.
  url: https://www.spga.gov.sc/news/2024-12/earthranger-operations-centre-goes-live
  fetched: 2026-11-09
  quote: The EarthRanger Operations Centre, situated at the SPGA Marine Operations base in Perseverance,
    was officially opened by Minister Flavien Joubert and CEO Allen Cedras on Monday, December 23rd.
- claim: Its Research Section monitors reef health, coral cover and the effects of rising sea temperatures.
  url: https://www.spga.gov.sc/conservation-research
  fetched: 2026-11-09
  quote: Coral reefs – monitoring reef health, coral cover and the effects of rising sea temperatures
    and other pressures
- claim: Was formerly the Seychelles National Parks Authority (SNPA).
  url: https://www.spga.gov.sc/news/2025-04/spga-and-university-seychelles-ibc-unite-climate-resilience-and-ecosystem
  fetched: 2026-11-09
  quote: SPGA (formerly SNPA)
