summary: Public trust established by the Seychelles government in 1979, now managing Aldabra and the Vallée
  de Mai, with Aldabra monitoring including a marine programme launched in 2013.
facts:
- claim: Established in 1979 as a public trust by presidential decree to manage and conserve Aldabra.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-09
  quote: In 1979 the Seychelles Islands Foundation (SIF) was established as a public trust by presidential
    decree and was mandated to manage and conserve Aldabra.
- claim: Its site says Aldabra has a long-term monitoring programme covering plant phenology, landbirds,
    seabirds, giant tortoises, marine ecosystem health, turtle nesting and coconut crabs.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-09
  quote: There is a well-established long-term monitoring programme on Aldabra which covers many aspects
    of the atoll’s biodiversity and natural processes.
- claim: A marine monitoring programme for Aldabra's coral and fish communities was launched in 2013.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-09
  quote: In 2013 the marine monitoring programme was launched to assess and monitor the state of the coral
    and fish communities of Aldabra
- claim: Seychelles Nation reports that a 2025 study with SIF and the University of Pisa gave the first
    survey of marine megafauna in Aldabra's lagoon using uncrewed aerial vehicles.
  url: https://nation.sc/articles/27118/aldabra-atoll-uses-uav-surveys-to-inform-marine-megafauna-monitoring-and-conservation-planning
  fetched: 2026-11-09
  quote: It was conducted in collaboration with the Seychelles Islands Foundation (SIF) and the University
    of Pisa.
- claim: Non-profit charitable organisation established as a public trust by the government of Seychelles
    in 1979, which manages and protects Aldabra Atoll and the Vallée de Mai.
  url: https://sif.sc/about
  fetched: 2026-11-09
  quote: The Seychelles Islands Foundation (SIF) is a non-profit charitable organisation that was established
    as a public trust by the government of Seychelles in 1979. SIF manages and protects the UNESCO World
    Heritage Sites of Aldabra Atoll and the Vallée de Mai
- claim: Its 2021 annual report names the Aldabra Reef Monitoring Programme.
  url: https://www.sif.sc/sites/default/files/downloads/SIF%20Annual%20Report%202021%20-%20Final_1.pdf
  fetched: 2026-11-09
  quote: The Aldabra Reef Monitoring Programme
- claim: Its 2021 annual report says it set up a new ant monitoring programme.
  url: https://www.sif.sc/sites/default/files/downloads/SIF%20Annual%20Report%202021%20-%20Final_1.pdf
  fetched: 2026-11-09
  quote: SIF has implemented a new ant monitoring
- claim: An SPGA page says Dr Anna Koester of SIF leads marine monitoring activities at Aldabra Atoll.
  url: https://www.spga.gov.sc/news/2026-09/building-local-capacity-monitor-seychelles-coastal-ecosystems
  fetched: 2026-11-09
  quote: long-term marine monitoring at Aldabra Atoll, where she also leads marine monitoring activities
