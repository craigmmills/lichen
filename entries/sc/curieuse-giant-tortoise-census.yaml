summary: Annual Aldabra giant tortoise census on Curieuse Island, run by the Seychelles
  Parks and Gardens Authority, which reported 16 tortoises measured, sexed and tagged
  by 25 February 2026, with data held in EarthRanger.
facts:
- claim: The annual giant Aldabra tortoise census on Curieuse Island is organised
    by the Seychelles Parks and Gardens Authority with conservation partners and research
    teams; a team took part on 28 February 2026.
  url: https://nation.sc/articles/29655/hsi-team-joins-annual-giant-aldabra-tortoise-census-on-curieuse-island
  fetched: 2026-11-15
  quote: Organised by the Seychelles Parks and Gardens Authority (SPGA) in collaboration
    with conservation partners and research teams, the census plays a vital role in
    monitoring and safeguarding one of Seychelles’ most iconic species
- claim: SPGA's 25 February 2026 report says 16 tortoises had been recorded so far,
    each measured, sexed and tagged, with the data captured in its EarthRanger platform
    for long-term monitoring.
  url: https://spga.gov.sc/news/2026-02/aldabra-giant-tortoise-census-absa-bank-seychelles
  fetched: 2026-11-15
  quote: Each was carefully measured, their sex identified and tagged. To support
    our long-term monitoring the data was also captured within our EarthRanger platform.
