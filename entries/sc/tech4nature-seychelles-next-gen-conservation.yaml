summary: Seychelles part of the Huawei and IUCN Tech4Nature initiative, run by Nature Seychelles, using
  NEST to transmit turtle nest data over LoRa and DREAM diver sensors for reef restoration.
facts:
- claim: Part of the global Tech4Nature initiative of Huawei and IUCN.
  url: https://natureseychelles.org/what-we-do/tech-4-nature-2/
  fetched: 2026-11-09
  quote: This project is part of a global initiative by Huawei and IUCN called Tech4Nature
- claim: NEST monitors and transmits environmental data from hawksbill turtle nests over a LoRa network
    to a database.
  url: https://natureseychelles.org/what-we-do/tech-4-nature-2/
  fetched: 2026-11-09
  quote: NEST monitors and transmits Hawksbill turtle nest environmental data (temperature, humidity,
    and oxygen).
- claim: DREAM is an automated sensor platform worn by divers that records sea water conditions for the
    coral reef restoration project.
  url: https://natureseychelles.org/what-we-do/tech-4-nature-2/
  fetched: 2026-11-09
  quote: DREAM is a self-contained, fully automated sensor platform for the monitoring of sea water parameters
    for Nature Seychelles’ coral reef restoration project.
