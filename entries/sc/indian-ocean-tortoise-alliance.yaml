summary: Seychelles-based non-profit working on Aldabra giant tortoise research, monitoring
  and translocations, funded by CEPF for a November 2023 to September 2026 project
  to eradicate black rats from Curieuse Island.
facts:
- claim: IUCN's member page describes it as a Seychelles-based non-profit that, with
    its partners, carries out field research, population monitoring, translocations
    and capacity building for Aldabra giant tortoises.
  url: https://iucn.org/node/44898
  fetched: 2026-11-15
  quote: Together with its partners, IOTA carries out field research, population monitoring,
    translocations, capacity building, and public engagement.
- claim: IUCN lists it as a National NGO member since September 2025, with Seychelles
    as its statutory state.
  url: https://iucn.org/node/44898
  fetched: 2026-11-15
  quote: The Indian Ocean Tortoise Alliance (IOTA) is a Seychelles-based non-profit
    organization
- claim: CEPF lists a November 2023–September 2026 grant project of IOTA whose objective
    was to eradicate black rats from Curieuse Island using self-resetting traps, camera
    traps, a detector dog and a thermal imaging drone, with monitoring and permanent
    biosecurity.
  url: https://www.cepf.net/grants/grantee-projects/eradication-black-rats-curieuse-island-seychelles
  fetched: 2026-11-15
  quote: using an array of self-resetting traps, camera traps, a detector dog and
    thermal imaging drone in a dynamic rat-free mainland island approach, with associated
    monitoring, permanent biosecurity
