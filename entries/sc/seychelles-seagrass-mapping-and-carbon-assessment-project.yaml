summary: Closed 2020 to 2022 project, led by the University of Oxford and funded by the Pew Charitable
  Trusts, that planned to map seagrass using satellite imagery and field data and estimate stored carbon.
facts:
- claim: Seychelles Nation reported in December 2021 that researchers had collected countrywide satellite
    images to show where seagrass grows, with field data collected to check them.
  url: https://nation.sc/articles/11847/seychelles-seagrass-and-carbon-mapping-project
  fetched: 2026-11-09
  quote: In the first phase of the project, researchers collected countrywide satellite images of the
    ocean. These images show the presence of seagrass, along with other ocean habitats, such as coral
    reefs.
- claim: SPGA lists the project's duration as 2020 to 2022.
  url: https://spga.gov.sc/projects
  fetched: 2026-11-09
  quote: Duration 2020 – 2022
- claim: In December 2021, the project aimed to identify locations, quantify areas and determine the density
    and growth of each seagrass species.
  url: https://nation.sc/articles/11847/seychelles-seagrass-and-carbon-mapping-project
  fetched: 2026-11-09
  quote: The project which aims at identifying locations, quantifying areas and determining the density
    and growth of each species of seagrass
- claim: The 2020 to 2022 project aimed to map seagrass beds and collect cores to calculate the carbon
    they store.
  url: https://www.spga.gov.sc/projects
  fetched: 2026-11-09
  quote: Map the distribution of seagrass beds and to collect coring samples which will be used to calculate
    the amount of carbon stored in our seagrass meadows.
- claim: The project planned to draw on satellite remote sensing and field collections to fill data gaps
    on seagrass distribution, extent and soil carbon.
  url: https://www.spga.gov.sc/projects
  fetched: 2026-11-09
  quote: by drawing on advances in satellite remote sensing and field collections
- claim: SPGA lists its duration as 2020 to 2022.
  url: https://www.spga.gov.sc/projects
  fetched: 2026-11-09
  quote: Duration 2020 – 2022
