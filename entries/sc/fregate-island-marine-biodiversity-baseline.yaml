summary: Closed project run by the James Michel Blue Economy Research Institute, planned
  for 2019 to 2020, to set up long-term coral reef monitoring at Fregate Island using
  GIF methods and Coralive.org spatial monitoring technology.
facts:
- claim: The January 2019 to December 2020 project aimed to assess coral reef assemblages
    and trends by establishing a long-term marine monitoring programme on Fregate
    Island.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-12
  quote: This project aims to collect data for an initial assessment of the coral
    reef assemblage and associated marine species, and assess trends over time by
    establishing a long-term marine monitoring program on Fregate Island.
- claim: Planned to collect data with the standard marine monitoring methods used
    by GIF, augmented with spatial monitoring technology from Coralive.org.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-12
  quote: The data will be collected through standardized marine monitoring scientific
    methodologies currently employed by GIF, and can be used to compare findings with
    other granitic islands. The marine monitoring will be augmented with novel spatial
    monitoring technologies provided by Coralive.org.
- claim: The 2019–2020 project listed Fregate Island Private, the Green Islands Foundation
    and Coralive as partners.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-12
  quote: 'Partners: Fregate Island Private, Green Islands Foundation (GIF), Coralive.'
