facts:
- claim: The GBIF record says the dataset compiles vegetation plot surveys of 73 sites on
    Mahé and Silhouette in mesic, ravine and swampy forest stands.
  url: https://api.gbif.org/v1/dataset/4fc42f17-eaeb-4296-949d-34b8414eb1c1
  fetched: 2026-11-15
  quote: At this stage, the dataset contains the survey of 73 sites, on the islands of Mahé
    and Silhouette, in mesic, ravine, or swampy forest stands
- claim: Its stated purpose is to describe the vegetation of Seychelles and evaluate ecosystems
    for a Red List of Ecosystems.
  url: https://api.gbif.org/v1/dataset/4fc42f17-eaeb-4296-949d-34b8414eb1c1
  fetched: 2026-11-15
  quote: Describe the vegetation of Seychelles and be able to evaluate ecosystems for a Red
    List of Ecosystems, to better guide conservation priorities.
- claim: The record says its compilation and publication on GBIF were funded through a two-year
    GBIF project led by the Plant Conservation Action group and the Seychelles National Herbarium.
  url: https://api.gbif.org/v1/dataset/4fc42f17-eaeb-4296-949d-34b8414eb1c1
  fetched: 2026-11-15
  quote: The compilation and publication on GBIF was made possible thanks to a GBIF funding
