summary: Closed 2020 to 2022 study run by the Island Biodiversity and Conservation
  Centre and funded by the European Commission, aiming to improve knowledge of hawksbill
  turtle origins and movements in the Western Indian Ocean.
facts:
- claim: The 2020–2022 study aimed to improve knowledge of hawksbill turtle origins
    and movements at sea in the Western Indian Ocean.
  url: https://spga.gov.sc/projects
  fetched: 2026-11-12
  quote: Improve knowledge on the origin and spatial dynamics (i.e. movements at sea)
    of Hawksbill Turtle populations in the Western Indian Ocean.
- claim: Promoted joint research on the turtles' genetic identity and migration routes.
  url: https://spga.gov.sc/projects
  fetched: 2026-11-12
  quote: By promoting joint research on biology (genetic identity) and ecology (migration
    routes), the project aims to assess the distribution and the connectivity of Hawksbill
    Turtle’s populations and their habitats.
- claim: Its main implementing parties were the University of Seychelles' IBC, CEDTM
    and KELONIA-RMR.
  url: https://spga.gov.sc/projects
  fetched: 2026-11-12
  quote: Main Implementing Parties The University of Seychelles, Island Biodiversity
    Conservation Centre (IBC), Centre d’Étude et de Découverte des Tortues Marines
    (CEDTM), KELONIA-RMR.
- claim: Its donors were the European Commission, the French Ministry of Overseas
    Territories and the Regional Council of Réunion.
  url: https://spga.gov.sc/projects
  fetched: 2026-11-12
  quote: Donor European Commission, the French Ministry of Overseas Territories and
    the Regional Council of Reunion Island
