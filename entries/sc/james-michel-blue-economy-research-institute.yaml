summary: University of Seychelles institute formed in 2015, listed by CEPF as grantee for a June 2023
  to June 2026 ocean observation and marine monitoring project in five marine protected areas around Mahé.
facts:
- claim: CEPF lists it as grantee for a June 2023 to June 2026 project to develop an ocean observation
    and marine monitoring framework in five marine protected areas around Mahé.
  url: https://www.cepf.net/grants/grantee-projects/building-capacity-seychelles-advance-marine-monitoring-and-ecosystem
  fetched: 2026-11-09
  quote: Develop an ocean observation and marine monitoring and ecosystem management framework in five
    marine protected areas around the coasts of Mahe - Seychelles.
- claim: Formed by the University of Seychelles in 2015.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/
  fetched: 2026-11-09
  quote: In 2015, the Blue Economy Research Institute (BERI) was formed by UniSey.
- claim: Lists a January 2019 to December 2020 project that aimed to establish long-term marine monitoring
    of the coral reef on Fregate Island.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-09
  quote: assess trends over time by establishing a long-term marine monitoring program on Fregate Island
- claim: Its research page lists BERI-UniSey as a key partner in aquatic ecosystem monitoring and environmental
    database work for the Ridge to Reef project, dated October 2020 to January 2025.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-09
  quote: BERI-UniSey is a key partner in project activities related to aquatic ecosystem monitoring and
    the consolidation, management and sharing of environmental information supported by the development
    of a database.
- claim: Lists a July 2023 to June 2026 project that aimed to expand marine monitoring within and next
    to five inner-island marine protected areas.
  url: https://unisey.ac.sc/beri/research/
  fetched: 2026-11-09
  quote: The aim of this project is to expand marine monitoring initiatives and capacity in Seychelles
    to improve our understanding of the status and distribution of the marine life, the coral reefs and
    the threatened species within and adjacent to five of Seychelles’ inner island MPAs
