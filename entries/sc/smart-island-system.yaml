summary: 'Programme run by Nature Seychelles in which two locally co-designed devices were used: NEST,
  recording turtle nest conditions in 2023-24, and DREAM, which collected seawater data on dives in January
  2024.'
facts:
- claim: Two devices, NEST and DREAM, were co-designed and co-produced in Seychelles for the initiative.
  url: https://natureseychelles.org/?p=13747
  fetched: 2026-11-09
  quote: two devices have been co-designed and co-produced entirely in Seychelles, named NEST (Nest Electronic
    Surveillance of Turtles) and DREAM (Diver Reef Evaluation Assisted Monitoring)
- claim: NEST was in use during the 2023-24 hawksbill turtle nesting season and records nest temperature,
    humidity and oxygen.
  url: https://natureseychelles.org/?p=13747
  fetched: 2026-11-09
  quote: NEST is being used during the 2023-24 Hawksbill turtle nesting season. The device automatically
    monitors and transmits turtle nest environmental data, including temperature, humidity, and oxygen.
- claim: In January 2024, DREAM was deployed by Reef Rescuers in the coral reef restoration project on
    Cousin and Praslin and collected seawater data during dives.
  url: https://natureseychelles.org/?p=13747
  fetched: 2026-11-09
  quote: Currently deployed by the Reef Rescuers in the coral reef restoration project on Cousin and Praslin
    Islands, DREAM autonomously collects data during dives while attached to a diver’s air tank.
