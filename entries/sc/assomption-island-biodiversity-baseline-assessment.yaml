summary: Closed set of biodiversity assessments of Assomption Island, run by the Seychelles
  Islands Foundation, which a drone survey of 21 zones (1,792 hectares, over 39,000
  images) mapped invasive plants, chiefly sisal.
facts:
- claim: Between March and April 2026 an Aldabra-based ranger led a drone survey of
    Assomption Island as part of SIF's biodiversity assessments, to map invasive plants,
    chiefly sisal.
  url: https://nation.sc/articles/31478/ranger-led-drone-survey-maps-assomptions-invasive-plants
  fetched: 2026-11-15
  quote: led a comprehensive drone survey of Assomption Island as part of the Seychelles
    Islands Foundation’s (SIF’s) ongoing biodiversity assessments
- claim: The drone survey covered 21 zones and captured more than 39,000 aerial images
    over 1,792 hectares.
  url: https://nation.sc/articles/31478/ranger-led-drone-survey-maps-assomptions-invasive-plants
  fetched: 2026-11-15
  quote: capturing more than 39,000 high-resolution aerial images covering 1,792 hectares
- claim: SIF commissioned the assessments between December 2025 and May 2026 to set
    baselines for the island's terrestrial and marine ecosystems, in an article credited
    to SIF.
  url: https://nation.sc/articles/31572/taking-stock-of-nature-assomptions-biodiversity-baseline-assessment
  fetched: 2026-11-15
  quote: Between December 2025 and May 2026, the Seychelles Islands Foundation (SIF)
    commissioned a series of independent biodiversity assessments on Assomption Island
    to establish scientific baselines across its terrestrial and marine ecosystems.
- claim: The assessments covered giant tortoises, landbirds, ants, butterflies, marine
    turtles, invasive plants and coastal and shallow marine habitats, and mapped about
    53 hectares of seabed.
  url: https://nation.sc/articles/31572/taking-stock-of-nature-assomptions-biodiversity-baseline-assessment
  fetched: 2026-11-15
  quote: approximately 53 hectares of seabed were mapped
