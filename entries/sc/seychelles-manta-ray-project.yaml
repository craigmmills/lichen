summary: Project partnered by the Island Conservation Society, Save Our Seas Foundation
  and Manta Trust, which a February 2022 update described as monitoring reef manta
  spatial ecology and population dynamics in the outer islands.
facts:
- claim: The February 2022 conservation update described monitoring reef manta spatial
    ecology and population dynamics in the outer islands.
  url: https://www.alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022/
  fetched: 2026-11-12
  quote: MONITORING THE SPATIAL ECOLOGY AND POPULATION DYNAMICS OF THE REEF MANTA
    (MOBULA ALFREDI) IN THE OUTER ISLANDS
- claim: In February 2022, the update described Save Our Seas Foundation maintaining
    an acoustic array at D'Arros and partnering in the project with ICS and the Manta
    Trust.
  url: https://www.alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022/
  fetched: 2026-11-12
  quote: there is an existing acoustic array at D’Arros island in the north of the
    Amirante chain which is being maintained and monitored by Save Our Seas Foundation,
    another partner of the Seychelles Manta Ray Project with ICS and the Manta Trust.
- claim: In 2021 adding 20 mantas to the Alphonse acoustic network was approved, to
    monitor their spatial ecology and residence times.
  url: https://www.alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022/
  fetched: 2026-11-12
  quote: 2021 also saw the approval of adding 20 mantas to the Alphonse acoustic network
    to monitor their spatial ecology and resident times around the atolls
