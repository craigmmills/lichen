summary: Programme run by the Seychelles Islands Foundation monitoring Aldabra's climate,
  plants, birds, tortoises, turtles, coconut crabs and marine ecosystems, with turtle
  monitoring since the 1960s and reef monitoring launched in 2013.
facts:
- claim: The programme covers climatic variables, plant phenology, landbird abundance
    and nesting, seabird surveys, giant tortoise population dynamics, marine ecosystem
    health, turtle nesting and coconut crab abundance.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-12
  quote: The programme includes regular monitoring of climatic variables, plant phenology
    (fruiting and flowering), landbird abundance and nesting, seabird surveys and
    nest success, Giant Tortoise population dynamics, marine ecosystem health, turtle
    nesting success and survival, and Coconut Crab abundance.
- claim: Green and hawksbill turtles have been monitored since the 1960s, with satellite
    transmitters used in recent years to track female green turtles.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-12
  quote: Green and Hawksbill Turtles have been routinely monitored since the 1960s.
- claim: A long-term marine monitoring programme of coral reef habitat and fish communities
    was launched in 2013.
  url: https://www.sif.sc/node/12
  fetched: 2026-11-12
  quote: In 2013 a new long-term marine monitoring programme was launched to assess
    and monitor the state of the coral reef habitat and fish communities of Aldabra.
