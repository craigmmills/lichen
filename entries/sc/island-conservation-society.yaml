summary: Not-for-profit registered in April 2000, monitoring seabirds, turtles and marine ecosystems on
  Aride and Alphonse, which opened its sixth conservation centre on Astove in May 2023.
facts:
- claim: Registered as a not-for-profit organisation on 10 April 2000.
  url: https://nation.sc/articles/17908/adverts
  fetched: 2026-11-09
  quote: ICS was registered as a not-for-profit organisation on April 10, 2000.
- claim: In May 2023 it opened its sixth conservation centre, on Astove in the Aldabra Group.
  url: https://nation.sc/articles/17908/adverts
  fetched: 2026-11-09
  quote: has extended its conservation presence in the Aldabra Group of islands of Seychelles through
    the opening of its 6th Conservation Centre on Astove
- claim: In May 2023, ICS said the new Astove centre would facilitate the annual sooty tern census on
    Cosmoledo, during which other seabirds would also be monitored.
  url: https://nation.sc/articles/17908/adverts
  fetched: 2026-11-09
  quote: During the census, other seabirds will be monitored including the only breeding population of
    brown boobies (Fou kapisen) in Seychelles
- claim: Registered as a not-for-profit organisation in April 2000.
  url: http://www.islandconservationseychelles.com/
  fetched: 2026-11-09
  quote: ICS registered as a not-for-profit organisation on the 10th of April 2000.
- claim: Gives its address as Pointe Larue, Mahé, Seychelles.
  url: http://www.islandconservationseychelles.com/
  fetched: 2026-11-09
  quote: Island Conservation Society, Pointe Larue, Mahe, Seychelles
- claim: Has run a conservation centre on Aride since 2003, where its monitoring covers seabirds, endemic
    land birds, turtles and the marine ecosystem.
  url: https://www.islandconservationseychelles.com/aride.html
  fetched: 2026-11-09
  quote: ICS has operated a conservation centre on Aride since 2003. Monitoring work focuses on seabirds,
    endemic land birds, turtles, restoration of natural vegetation and the marine ecosystem.
- claim: Its GBIF publisher record, endorsed in 2026, says it runs conservation centres on five islands.
  url: https://api.gbif.org/v1/organization?country=SC&limit=50
  fetched: 2026-11-09
  quote: ICS today runs conservation centres on five islands across Seychelles
- claim: Has kept a conservation centre on Alphonse since 2007, with scientists and rangers monitoring
    seabirds, sea turtles, marine ecosystems and native habitats.
  url: https://www.islandconservationseychelles.com/news.html
  fetched: 2026-11-09
  quote: ICS has maintained a permanent conservation centre on Alphonse since 2007, with scientists and
    rangers monitoring seabirds, sea turtles, marine ecosystems and native habitats.
- claim: Has monitored Red-footed Boobies on Alphonse since 2007, and its team counted roosting birds
    at 63 plots on St François.
  url: https://www.islandconservationseychelles.com/news.html
  fetched: 2026-11-09
  quote: The Island Conservation Society (ICS) has been monitoring this species on Alphonse since 2007
- claim: Its news page reports that it has teamed up with a shark scientist affiliated with the University
    of Western Australia to fit satellite tags to sharks around Alphonse.
  url: https://www.islandconservationseychelles.com/news.html
  fetched: 2026-11-09
  quote: ICS has teamed up with Dr Nico Fassbender, a shark science specialist affiliated with the University
    of Western Australia, to deploy advanced satellite tags on four shark species in the waters around
    Alphonse.
- claim: Used camera traps, with baiting and searches, to find and remove feral cats on Alphonse in 2026.
  url: https://www.islandconservationseychelles.com/news.html
  fetched: 2026-11-09
  quote: targeted baiting, camera traps and island-wide searches were used to locate and remove cats
