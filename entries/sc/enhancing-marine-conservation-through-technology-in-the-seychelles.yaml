status: active
summary: Active SPGA-led project, under a 2025 agreement with the CBD Secretariat, expanding AI cameras
  that detect nesting turtles and send detections to EarthRanger, plus ranger training for species monitoring
  and invasive species mapping.
facts:
- claim: SPGA says the cameras use AI to tell an animal from a person or vegetation moving in the wind,
    and send detections in real time to its EarthRanger platform.
  url: https://spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: The cameras use artificial intelligence to distinguish between an animal, a person, and vegetation
    moving in the wind, filtering out false alarms so that real events are flagged immediately.
- claim: The camera expansion is part of an initiative under a 2025 agreement between SPGA and the CBD
    Secretariat.
  url: https://spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: The camera expansion forms part of a broader initiative under an Agreement signed in 2025 between
    SPGA the Secretariat of the Convention on Biological Diversity (SCBD)
- claim: The cameras detect turtles coming ashore to nest, giving data for ongoing monitoring.
  url: https://spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: the cameras allow the authority to detect when wildlife such as turtles come ashore to nest,
    providing valuable data to support ongoing monitoring
- claim: Forms part of an agreement signed in 2025 between SPGA and the Secretariat of the Convention
    on Biological Diversity, aimed at supporting the Kunming-Montreal Global Biodiversity Framework.
  url: https://www.spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: The camera expansion forms part of a broader initiative under an Agreement signed in 2025 between
    SPGA the Secretariat of the Convention on Biological Diversity (SCBD), titled " Enhancing Marine Conservation
    through Technology in the Seychelles ."
- claim: Covers AI cameras and the development of ranger training for species monitoring and invasive
    species mapping.
  url: https://www.spga.gov.sc/news/2026-08/spga-expands-ai-camera-network-across-sainte-anne-mnp
  fetched: 2026-11-09
  quote: Beyond the AI cameras, the project also covers development of the ranger trainings for species
    monitoring and invasive species mapping.
