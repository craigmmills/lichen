  quote: Using a combination of acoustic methods and visual boat-based surveys, we aim to
    improve our knowledge about the abundance, behaviour and critical habitat of blue whales
    and other cetaceans in Seychelles
- claim: Plans to train students from Seychelles in fieldwork and data analysis.
  url: https://saveourseas.com/project/the-importance-of-seychelles-for-blue-whales-and-other-whales-and-dolphins/
  fetched: 2026-11-12
