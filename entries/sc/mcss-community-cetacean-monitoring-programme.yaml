    monitoring programme to produce baseline data for conservation management.
  url: https://www.mcss.sc/cetaceans-project
  fetched: 2026-11-12
  quote: MCSS, supported by SeyCCAT's BGF9 , is implementing a community-based cetacean
    monitoring programme to generate the baseline data needed to support long-term
    conservation management.
- claim: Aims to document which species are present, where they are most often seen,
    and whether populations are resident or migratory.
  url: https://www.mcss.sc/cetaceans-project
  fetched: 2026-11-12
  quote: The project aims to document which species are present in Seychelles waters,
    where they are most frequently observed, and whether populations are resident
    or migratory.
- claim: Includes a citizen science scheme in which the public send photographs of
    whale and dolphin sightings to build a national dataset.
  url: https://www.mcss.sc/cetaceans-project
  fetched: 2026-11-12
  quote: A key component of this research is a citizen science initiative that invites
    members of the public to contribute photographs of whale and dolphin sightings.
