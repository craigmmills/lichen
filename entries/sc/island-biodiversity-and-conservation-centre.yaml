summary: Joint venture of the University of Seychelles and an NGO, launched in 2016, with turtle and seabird
  monitoring projects and two CEPF-funded projects; SPGA says a 2025 agreement is supported by a $280,000
  CEPF grant.
facts:
- claim: An SPGA page says IBC and SPGA ran a sea turtle monitoring programme from 2013 to 2018 and a
    satellite-tracking study of hawksbill turtles in 2021.
  url: https://www.spga.gov.sc/news/2025-04/spga-and-university-seychelles-ibc-unite-climate-resilience-and-ecosystem
  fetched: 2026-11-09
  quote: This MoU builds on over 10 years of joint efforts between IBC-UniSey and SPGA (formerly SNPA),
    including a pioneering sea turtle monitoring program (2013–2018) and a 2021 satellite-tracking study
    of Hawksbill Turtles.
- claim: An SPGA page says the 2025 agreement with SPGA on Sainte Anne Marine National Park is supported
    by a $280,000 grant from CEPF.
  url: https://www.spga.gov.sc/news/2025-04/spga-and-university-seychelles-ibc-unite-climate-resilience-and-ecosystem
  fetched: 2026-11-09
  quote: Supported by a $280,000 grant from the Critical Ecosystem Partnership Fund (CEPF)
- claim: A joint venture between the University of Seychelles and the NGO Island Biodiversity Conservation,
    launched by the Minister for Environment in January 2016.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/
  fetched: 2026-11-09
  quote: The center is a joint venture between UniSey and IBC, an NGO associated to the University of
    Seychelles formed on 15/12/2014. Launched by Minister for Environment on 26.01.16.
- claim: Lists among its projects the surveillance and monitoring of marine turtle and seabird populations
    on Ste Anne from 2013 to 2017.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/conservation-projects/
  fetched: 2026-11-09
  quote: Surveillance and monitoring of marine turtle and seabird populations on Ste Anne (2013-2017)
- claim: Lists biodiversity monitoring on Grande Soeur and Petite Soeur among its projects.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/conservation-projects/
  fetched: 2026-11-09
  quote: Nature conservation activities and biodiversity monitoring on Grande Soeur and Petite Soeur
- claim: Past projects include monitoring of endangered species, habitat mapping, movement tracking and
    genetics of marine turtles, and seabird colony censuses and tracking with the Island Conservation
    Society and others.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/
  fetched: 2026-11-09
  quote: movement tracking and genetics of marine turtles on Ste Anne Island and Mahé
- claim: Implemented two projects funded by the Critical Ecosystem Partnership Fund, from 2017 to 2020
    and 2021 to 2022.
  url: https://unisey.ac.sc/island-biodiversity-and-conservation/
  fetched: 2026-11-09
  quote: Implemented two CEPF funded projects
