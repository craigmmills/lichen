summary: Drone survey run by the Seychelles Islands Foundation, reported in May 2024
  as the first lagoon-wide survey around Aldabra to image dugongs, with images showing
  19 dugongs by that report.
facts:
- claim: In May 2024, Inside Seychelles reported that the Seychelles Islands Foundation
    was using drones for the first lagoon-wide survey around Aldabra to capture images
    of dugongs.
  url: https://www.insideseychelles.com/?p=15180
  fetched: 2026-11-12
  quote: The Seychelles Islands Foundation (SIF) is using drones to take the first-ever
    lagoon-wide survey of the waters to capture images of dugongs, even the little
    ones!
- claim: By the May 2024 report, images showed 19 dugongs, including a group described
    as having six individuals and two juveniles.
  url: https://www.insideseychelles.com/?p=15180
