summary: Closed project led by Rachel Bristol and funded by SeyCCAT, which planned to satellite-tag
  juvenile sooty terns over two years and shared the resulting maps with the Seychelles Marine
  Spatial Plan team.
facts:
- claim: Aimed to tag juvenile sooty terns and track their departure and flight patterns by
    satellite telemetry over two years.
  url: https://seyccat.org/?p=2739
  fetched: 2026-11-12
  quote: The project aimed to fill this knowledge gap by tagging juvenile sooty terns and
    using satellite telemetry to track their departure and flight patterns over two years.
- claim: Shared the spatial data and flight and dispersion maps with the Seychelles Marine
    Spatial Plan team.
  url: https://seyccat.org/?p=2739
  fetched: 2026-11-12
  quote: The project team shared these findings, including the spatial data downloaded every
    two weeks and the generated flight and dispersion maps, with the SMSP team
- claim: SeyCCAT's project database lists the project with an amount of SCR 903,600.
  url: https://seyccat.org/?p=2739
  fetched: 2026-11-12
  quote: SCR 903,600.00
- claim: Seychelles Nation reported in June 2020 that the project, led by Rachel Bristol with
    Bird Island Eco-Lodge, Chris Feare and Christine Larose, tracks juvenile sooty terns from
    the Bird Island colony.
  url: https://nation.sc/articles/5095/satellite-tracking-of-juvenile-sooty-terns-from-bird-island
  fetched: 2026-11-12
  quote: A current project, led by Rachel Bristol in collaboration with Bird Island Eco-Lodge
    Seychelles, Professor Chris Feare, and Christine Larose, is tracking the feeding habitats
    of juvenile Sooty Terns from the Bird Island colony
