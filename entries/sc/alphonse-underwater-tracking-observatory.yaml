summary: Acoustic receiver network around the Alphonse Group, planned in September
  2021 to become permanent and monitor more species, with fifteen milkfish tagged
  by February 2022.
facts:
- claim: In September 2021 it was decided that the giant trevally acoustic telemetry
    array should monitor more species and become a permanent fixture around the Alphonse
    Group.
  url: https://alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022
  fetched: 2026-11-12
  quote: the number of species being recorded on the array should be extended and
    the array will become a permanent fixture around the Alphonse Group
- claim: The receiver network is named the Alphonse Underwater Tracking Observatory,
    to be maintained and managed by the Alphonse Foundation with guest conservation
    contributions.
  url: https://alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022
  fetched: 2026-11-12
  quote: The network of acoustic receivers will be called the Alphonse Underwater
    Tracking Observatory (AUTO) which will be maintained and managed by the Alphonse
    Foundation, utilising guest conservation contributions.
- claim: By February 2022, fifteen milkfish had been tagged with acoustic transmitters
    for monitoring on the AUTO array.
  url: https://alphonse-island.com/our-journal/alphonse-foundation-conservation-highlights-2021-2022
  fetched: 2026-11-12
  quote: all 15 milkfish have been tagged with acoustic transmitters
