- claim: Its site lists a planned April 2023 to April 2026 project targeting annual biodiversity inventories
    in 15 rivers including eDNA sampling.
  url: https://www.gaeaseychelles.sc/projects/developing-a-freshwater-biodiversity-information-system-for-long-term-conservation-and-management-in-the-seychelles/
  fetched: 2026-11-09
  quote: Component 2 targets baseline surveys and annual biodiversity inventories of fish, micro and macro
    invertebrates in 15 rivers including the collection of genetic materials through eDNA.
- claim: Gives its address as the Centre for Environment and Education, Anse Royale, Seychelles.
  url: https://www.gaeaseychelles.sc/
  fetched: 2026-11-09
  quote: Centre for Environment and Education Anse Royale, Seychelles
- claim: Received a JRS Biodiversity Foundation grant for a three-year river project covering freshwater
    biodiversity data collection and the development of monitoring programmes.
  url: https://www.gaeaseychelles.sc/2023/08/30/gaea-seychelles-new-river-project/
  fetched: 2026-11-09
  quote: 'The ‘JRS River Project’ will focus on four main components: Freshwater Biodiversity data collection,
    the development of monitoring programmes, capacity building, and civic engagement'
- claim: The April 2023 to April 2026 project planned to contribute freshwater data to the Seychelles
    Holistic Biodiversity Database and to GBIF.
  url: https://www.gaeaseychelles.sc/projects/developing-a-freshwater-biodiversity-information-system-for-long-term-conservation-and-management-in-the-seychelles/
  fetched: 2026-11-09
  quote: The first component contributes aquatic data to the ‘Seychelles’ Holistic Biodiversity Database
    on species and ecosystems’ (Bio database) and the Global Biodiversity Information Facility (GBIF).
