summary: Annual Seychelles Paradise Flycatcher census on Curieuse Island, run by the
  Seychelles Parks and Gardens Authority, which used recorded calls to attract birds
  and documented sixteen in July 2024.
facts:
- claim: In July 2024 SPGA's research team carried out the annual Seychelles Paradise
    Flycatcher census on Curieuse Island.
  url: https://www.spga.gov.sc/news/2024-07/paradise-flycatcher-yellow-crazy-ants-census-2024
  fetched: 2026-11-15
  quote: In July 2024, our Research Team carried out the annual Seychelles Paradise
    Flycatcher Census on Curieuse Island.
- claim: The team used audio recordings of the bird's calls to attract individuals
    and recorded their demographics and activity; sixteen birds were documented in
    2024.
  url: https://www.spga.gov.sc/news/2024-07/paradise-flycatcher-yellow-crazy-ants-census-2024
  fetched: 2026-11-15
  quote: the team used audio recordings of the Flycatcher’s calls to attract individuals
    from the surrounding habitats
- claim: In the same week the team ran a yellow crazy ant survey on Curieuse along
    50-metre transects.
  url: https://www.spga.gov.sc/news/2024-07/paradise-flycatcher-yellow-crazy-ants-census-2024
  fetched: 2026-11-15
  quote: During the same week, the team also conducted the Yellow Crazy Ant Survey
    on Curieuse.
