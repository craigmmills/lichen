summary: Active offline wetland monitoring app in English and Creole, rolled out by Nature
  Seychelles in May 2026 with the environment ministry, built by Jessica Nasica, with tiered
  dashboards, species mapping and single-click AI reporting.
facts:
- claim: Nature Seychelles rolled out WETSAPP, the Wetland Evaluation and Tracking Seychelles
    app, in May 2026, in partnership with the environment ministry.
  url: https://natureseychelles.org/news/latest-news/from-tech-consumers-to-tech-drivers-nature-seychelles-launches-wetsapp-on-idb-day/
  fetched: 2026-11-12
  quote: has rolled out WETSAPP – the Wetland Evaluation and Tracking Seychelles app.
- claim: Users record field data on wetland biodiversity, wetland health and wetland threats,
    offline, in English and Creole.
  url: https://natureseychelles.org/news/latest-news/from-tech-consumers-to-tech-drivers-nature-seychelles-launches-wetsapp-on-idb-day/
  fetched: 2026-11-12
  quote: 'Users can instantly record field data across three vital areas: Wetland Biodiversity,
    Wetland Health, and Wetland Threats.'
- claim: User tiers unlock interactive dashboards, species mapping and single-click AI reporting
    tools.
  url: https://natureseychelles.org/news/latest-news/from-tech-consumers-to-tech-drivers-nature-seychelles-launches-wetsapp-on-idb-day/
  fetched: 2026-11-12
  quote: Different user tiers unlock interactive dashboards, species mapping, and single-click
    AI reporting tools to accelerate environmental management.
- claim: The ministry expects the app to support a broader national wetland inventory under
    the Ramsar Convention.
  url: https://natureseychelles.org/news/latest-news/from-tech-consumers-to-tech-drivers-nature-seychelles-launches-wetsapp-on-idb-day/
  fetched: 2026-11-12
  quote: This technology will assist the ministry in conducting inventories in our wetlands
