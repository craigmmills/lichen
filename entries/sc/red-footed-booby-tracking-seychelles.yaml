summary: Closed GPS tracking study led by the Island Conservation Society and funded
  by SeyCCAT, in which devices on 54 red-footed boobies were all recovered, giving
  110 foraging tracks.
facts:
- claim: GPS tracking devices were deployed on 54 red-footed boobies, all recovered,
    giving 110 foraging tracks.
  url: https://seyccat.org/?p=2745
  fetched: 2026-11-12
  quote: To track the movements of these seabirds, GPS tracking devices were deployed
    on 54 red-footed boobies. All tags were successfully recovered, and 110 foraging
    tracks were identified
- claim: The Island Conservation Society worked with Université de la Réunion, ZSL
    and IBC/UniSey on the study.
  url: https://seyccat.org/?p=2745
  fetched: 2026-11-12
  quote: This is why the Island Conservation Society (ICS) teamed up with Université
    de la Réunion (UR), the Zoological Society of London (ZSL) and the Island Biodiversity
    and Conservation Centre (IBC/UniSey)
- claim: Tracking seabirds at sea can help inform the designation of marine protected
    areas.
  url: https://seyccat.org/?p=2745
  fetched: 2026-11-12
  quote: understanding their movements at sea by tracking them can help inform the
    designation of marine protected areas.
