summary: Project led by Rahayu Sukmaria Sukri and funded by the Korea Forest Service; in October
  2019 IBER said it was setting national forest inventory and baseline data for an MRV framework,
  using field survey and remote sensing.
facts:
- claim: In October 2019, IBER said the project focused on establishing forest inventory and
    baseline data on a national scale for an MRV framework.
  url: https://iber.ubd.edu.bn/?p=2084
  fetched: 2026-11-12
  quote: It focuses on establishing forest inventory and baseline data on a national scale
    for Measuring, Reporting and Verification (MRV) framework
- claim: Its 2018 to 2019 work estimated forest carbon through field survey and remote sensing.
  url: https://iber.ubd.edu.bn/?p=2084
  fetched: 2026-11-12
  quote: In the period of 2018-2019, the main components of the research involved estimating
    forest Carbon through i) field survey; ii) remote sensing.
- claim: Remote sensing with image segmentation was used to classify forest cover types in
    Brunei.
  url: https://iber.ubd.edu.bn/?p=2084
  fetched: 2026-11-12
  quote: Meanwhile remote sensing has been used to identify forest cover in Brunei Darussalam.
    Using an Image-segmentation method after the pretreatments of image, MDF, grassland, PSF,
    city, watershed, and bare land were classified
