summary: Active browser workspace combining LiDAR, drone, satellite and terrain data for Forest Andulau,
  with a CanopeAI assistant that queries the data, built by IADA at Universiti Brunei Darussalam and supported
  by a British Council grant.
facts:
- claim: Brings LiDAR, drone, satellite and terrain data for Forest Andulau into one browser workspace
    with the CanopeAI assistant in each view.
  url: https://iada.ubd.edu.bn/research/projects/forest-monitoring-dashboards/
  fetched: 2026-11-12
  quote: Forest Monitoring Dashboards brings every forest dataset for Forest Andulau, Brunei, into one
    browser workspace, with the CanopeAI assistant built into each view.
- claim: Includes a satellite time-series of the Telisai-Lumut corridor from 2018 to 2022 across 14 dates
    with land-cover masks.
  url: https://iada.ubd.edu.bn/research/projects/forest-monitoring-dashboards/
  fetched: 2026-11-12
  quote: For the longer view, a satellite time-series covers the Telisai-Lumut corridor from 2018 to 2022
    across 14 dates, each paired with land-cover masks.
- claim: CanopeAI runs queries against the underlying data and replies in plain language.
  url: https://iada.ubd.edu.bn/research/projects/forest-monitoring-dashboards/
  fetched: 2026-11-12
  quote: CanopeAI is a data-aware AI assistant available on every dashboard. Rather than answering from
    generic knowledge, it runs queries against the underlying data and replies in plain language
- claim: Lists a supporting grant from the British Council's UK-ASEAN Institutional Links Early Career
    Researchers Scheme, 2022 to 2023, for digital mapping of invasive Acacia mangium.
  url: https://iada.ubd.edu.bn/research/projects/forest-monitoring-dashboards/
  fetched: 2026-11-12
  quote: 2022-2023, British Council under the UK-ASEAN Institutional Links Early Career Researchers Scheme
    (£49,993.00) and UBD matched fund (£10,000)
