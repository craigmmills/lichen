summary: Camera-trap survey of mammals in Ulu Temburong National Park which, in March 2021, IBER said
  had run over three years with support from UBD, Panthera and the Robertson Foundation.
facts:
- claim: In March 2021, IBER said the team had surveyed mammal diversity with camera traps in the area
    for over three years, with support from UBD (IBER FIC Block Grant), Panthera and the Robertson Foundation.
  url: https://iber.ubd.edu.bn/first-photographic-evidence-of-the-elusive-bay-cat-from-ulu-temburong-national-park/
  fetched: 2026-11-12
  quote: For over three years, the team with support from UBD (IBER FIC Block Grant), Panthera and the
    Robertson Foundation, have been surveying the mammal diversity with camera trapping in the area.
- claim: The March 2021 report named Dr Salwa Khalid (IBER UBD), Prof Ulmar Grafe (FOS UBD) and Dr Andrew
    Hearn (Oxford University) as the research group.
  url: https://iber.ubd.edu.bn/first-photographic-evidence-of-the-elusive-bay-cat-from-ulu-temburong-national-park/
  fetched: 2026-11-12
  quote: The research group consists of Dr Salwa Khalid (IBER UBD), Prof Ulmar Grafe (FOS UBD) and Dr
    Andrew Hearn (Oxford University).
