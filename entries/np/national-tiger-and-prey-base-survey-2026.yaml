summary: A closed survey run by two government departments, with NTNC, WWF Nepal and ZSL as partners,
  that the Himalayan Times reports used about 1,100 camera traps in three lowland landscapes from December
  2025 to July 2026.
facts:
- claim: The Himalayan Times reports that about 1,100 camera traps were deployed across three lowland
    landscapes.
  url: https://thehimalayantimes.com/nepal/nepals-tiger-population-climbs-to-429-nearly-quadrupling-since-2010
  fetched: 2026-11-08
  quote: Researchers deployed around 1,100 camera traps across the Chitwan-Parsa, Banke-Bardiya and Shuklaphanta-Laljhadi
    landscapes
- claim: The survey ran from December 2025 to July 2026 and its findings were unveiled by the Ministry
    of Forests and Environment.
  url: https://thehimalayantimes.com/nepal/nepals-tiger-population-climbs-to-429-nearly-quadrupling-since-2010
  fetched: 2026-11-08
  quote: The Ministry of Forests and Environment unveiled the findings of the National Tiger and Prey
    Base Survey 2026 in Kathmandu.
