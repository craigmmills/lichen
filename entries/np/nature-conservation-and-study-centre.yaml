summary: An organisation that runs the Himalayan Pollinator Patrol and said in February 2024 that it had
  started community-led conservation initiatives in central and eastern Nepal training forest user groups
  in camera-trap monitoring of mammals.
facts:
- claim: In a February 10, 2024 post, it said it had started community-led conservation initiatives in
    central and eastern Nepal that train forest user groups to use camera traps to monitor mammals in
    their forests.
  url: https://ncsc.org.np/
  fetched: 2026-11-08
  quote: These projects follow a standard activity model – an initial meeting with forest user groups
    followed by a technical training in the use of camera traps to monitor mammals in their forest.
- claim: Its October 12, 2024 post reports a symposium held on October 4, 2024 presenting camera-trapping
    results from Deuri, Gaighat.
  url: https://ncsc.org.np/
  fetched: 2026-11-08
  quote: A symposium was held on October 4th to unveil the captivating results of a camera trapping initiative
    in Deuri, Gaighat.
