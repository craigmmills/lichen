- claim: Established in 1982 by a Legislative Act as an autonomous, not-for-profit organisation mandated
    to work on nature conservation in Nepal.
  url: https://ntnc.org.np/about-us
  fetched: 2026-11-08
  quote: The National Trust for Nature Conservation (NTNC), established in 1982 by a Legislative Act,
    is an autonomous and not-for-profit organization mandated to work in the field of nature conservation
    in Nepal.
- claim: Set up the Nepal Conservation Research and Training Center in 1989 to carry out biological research
    and monitoring of flora and fauna in Nepal's lowland protected areas.
  url: https://www.ntnc.org.np/
  fetched: 2026-11-08
  quote: the Trust established the Nepal Conservation Research and Training Center (NCRTC) to conduct
    biological research and monitoring of flora and fauna in the lowland (Terai) protected areas of Nepal.
- claim: Its Shuklaphanta Conservation Program exists to monitor and research the natural resources of
    Shuklaphanta National Park, where NTNC has carried out wildlife research and monitoring since 1999.
