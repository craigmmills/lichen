summary: An autonomous, not-for-profit body established by Legislative Act in 1982 that runs the Gaurishankar
  Conservation Area Project and, with funding support, carried out camera-trap work covering 1,695 grids
  in the Chure Region in 2016 to 2018.
facts:
- claim: NTNC carried out a faunal diversity assessment of the Chure Region in 2016–2018 with financial
    support from the President Chure Terai Madhes Conservation Development Board.
  url: https://ntnc.org.np/publication/report-faunal-diversity-chure-region-nepal
  fetched: 2026-11-08
  quote: National Trust for Nature Conservation carried out the faunal diversity assessment in Chure Region
    under the financial support of President Chure Terai Madhes Conservation Development Board.
- claim: The camera-trap study covered 1,695 grids with 28,051 camera-trap nights.
  url: https://ntnc.org.np/publication/report-faunal-diversity-chure-region-nepal
  fetched: 2026-11-08
  quote: Camera trap study was conducted in 1695 grids covering the entire Chure Region with total camera
    trap effort of 28,051 nights.
- claim: Tencent says it hosted a workshop with NTNC and Shan Shui Conservation Center to introduce its
