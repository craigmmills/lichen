summary: Run by NCSC with Mohamed bin Zayed fund support, this active project reportedly
  confirmed Chinese pangolins in Khotang community forests through six months of camera
  trapping ending January 2026.
facts:
- claim: The grant page reports six months of camera trapping, ending in January 2026,
    that confirmed Chinese pangolins in Khotang's community forests, with 13 camera
    traps monitored by trained local people.
  url: https://www.speciesconservation.org/small-grant/chinese-pangolin/33181
  fetched: 2026-11-13
  quote: 13 camera traps were deployed and monitored by trained local community members,
    successfully recording the pangolin along with 15 other mammalian species.
- claim: The project trained 26 members of seven community forest user groups in wildlife
    monitoring in January 2025.
  url: https://www.speciesconservation.org/small-grant/chinese-pangolin/33181
  fetched: 2026-11-13
  quote: 'Wildlife monitoring training for 7 Community Forest User Groups completed:
    A one-day training program was conducted on January 13, 2025'
- claim: The page says the project is moving toward long-term planning with local
    community forest user groups.
  url: https://www.speciesconservation.org/small-grant/chinese-pangolin/33181
  fetched: 2026-11-13
  quote: 'Next Steps: We are now moving toward long-term planning with local community
    forest user groups of endangered wildlife in Jalapa, Khotang, focused on pangolins.'
- claim: NCSC’s project page says it would provide camera traps and obtain permits,
    while community forest user groups would facilitate deployment and decide further
    activities.
  url: https://ncsc.org.np/implementing-evidence-based-conservation-measures-to-protect-chinese-pangolin-in-khotang-eastern-nepal/
  fetched: 2026-11-13
  quote: NCSC will provide the camera traps and will obtain necessary permits, while
    the community forest user groups will facilitate the camera trap deployment and
    decide further activities.
