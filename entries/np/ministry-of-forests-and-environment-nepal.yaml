- claim: The ministry unveiled the findings of the National Tiger and Prey Base Survey 2026,
    according to The Himalayan Times.
  url: https://thehimalayantimes.com/nepal/nepals-tiger-population-climbs-to-429-nearly-quadrupling-since-2010
  fetched: 2026-11-08
  quote: The Ministry of Forests and Environment unveiled the findings of the National Tiger
    and Prey Base Survey 2026 in Kathmandu.
