summary: Gharial conservation project run by Himalayan Nature, using telemetry and
  video monitoring of nesting sites, which identified the Rapti as Nepal's most critical
  habitat; the next phase plans direct action.
facts:
- claim: The project's team used telemetry of wild and released gharials and video-based
    monitoring of nesting sites.
  url: https://himalayannature.org/works/projects/himalayan-gharial-project/
  fetched: 2026-11-15
  quote: Our team used a range of research techniques, including telemetry (tracking)
    of both wild gharial and gharial released from captivity, video-based monitoring
    of nesting sites
- claim: The work identified the Rapti River as Nepal's most critical gharial habitat.
  url: https://himalayannature.org/works/projects/himalayan-gharial-project/
  fetched: 2026-11-15
  quote: we identified the Rapti River as Nepal’s most critical gharial habitat
- claim: The next phase focuses on direct conservation action and national capacity
    for gharial research.
  url: https://himalayannature.org/works/projects/himalayan-gharial-project/
  fetched: 2026-11-15
  quote: Our next phase focuses on direct conservation action to support the long-term
    recovery of wild gharial populations.
