summary: A closed census run in March and April 2021 that put Nepal's one-horned rhino
  population at 752; DNPWC was reported in September 2026 to be considering genetic
  sampling or camera traps next.
facts:
- claim: NTNC reported that the National Rhino Count 2021 put Nepal's one-horned rhino
    population at 752.
  url: https://www.ntnc.org.np/news/752-one-horned-rhinos-nepal-determined-national-rhino-count-2021
  fetched: '2026-11-12'
  quote: The National Rhino Count 2021 has updated Nepal's latest one-horned rhinoceros
    population to 752 individuals.
- claim: The census ran from 22 March to 10 April 2021 across the Chitwan-Parsa complex,
    Bardia and Shuklaphanta.
  url: https://www.ntnc.org.np/news/752-one-horned-rhinos-nepal-determined-national-rhino-count-2021
  fetched: '2026-11-12'
  quote: Over the past three weeks (March 22 to April 10), Nepal undertook its national
    rhino count to determine the existing population of its one-horned rhinos
- claim: NTNC describes the method as survey teams on elephants sweeping habitat block
    by block, identifying each rhino by sex, age and features and recording data in
    a standard format.
  url: https://www.ntnc.org.np/news/752-one-horned-rhinos-nepal-determined-national-rhino-count-2021
  fetched: '2026-11-12'
  quote: Direct capture method was used for the counting, with survey teams and enumerators
    on elephant backs moving parallelly from one block to another sweeping potential
    rhino habitats.
- claim: The Kathmandu Post reported in September 2026 that DNPWC is considering genetic
    sampling, camera traps or both for the next census, with a protocol and pilot
    studies first.
  url: https://kathmandupost.com/national/2026/09/23/nepal-s-rhino-census-is-getting-a-scientific-makeover
  fetched: '2026-11-12'
  quote: The Department of National Parks and Wildlife Conservation is considering
    genetic sampling, camera traps or a combination of the two for the next census.
