summary: Satellite-based fire detection system built by ICIMOD, reported by UN-SPIDER
  in July 2018 to use MODIS data and text alerts within 20 minutes of detection.
facts:
- claim: UN-SPIDER reports that SERVIR-Hindu Kush Himalaya at ICIMOD worked with Nepal's
    Department of Forests to develop a satellite-based forest fire detection and monitoring
    system.
  url: https://un-spider.org/es/node/11356
  fetched: 2026-11-13
  quote: has been working in close collaboration with the Department of Forests of
    Nepal to develop a satellite-based forest fire detection and monitoring system.
- claim: UN-SPIDER’s July 2018 story says the system used MODIS data from NASA’s Terra
    and Aqua satellites.
  url: https://un-spider.org/es/node/11356
  fetched: 2026-11-13
  quote: The forest fire detection and monitoring system uses satellite data from
    the Moderate Resolution Imaging Spectroradiometer (MODIS) aboard NASA's Terra
    and Aqua satellites
- claim: UN-SPIDER’s July 2018 story says the system alerted subscribers in the affected
    area by text message within 20 minutes of detection.
  url: https://un-spider.org/es/node/11356
  fetched: 2026-11-13
  quote: the system alerts subscribers in the affected area via text message within
    20 minutes of the initial detection
