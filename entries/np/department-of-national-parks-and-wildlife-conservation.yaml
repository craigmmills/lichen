summary: A government department publishing a protected area coverage database and tiger telemetry manual;
  The Himalayan Times reports it jointly conducted the 2026 tiger and prey survey.
facts:
- claim: Onlinekhabar reports the department's figures for visitors to Nepal's conservation areas and
    names its Director General.
  url: https://english.onlinekhabar.com/60-per-cent-of-total-foreign-tourists-visit-nepals-national-parks-conservation-and-reserve-areas.html
  fetched: 2026-11-08
  quote: According to the Department of National Parks and Wildlife Conservation, a total of 1.097 million
    domestic and foreign tourists visited conservation areas in fiscal year 2081/82.
- claim: The Himalayan Times reports that the department and the Department of Forests and Soil Conservation
    conducted the National Tiger and Prey Base Survey 2026.
  url: https://thehimalayantimes.com/nepal/nepals-tiger-population-climbs-to-429-nearly-quadrupling-since-2010
  fetched: 2026-11-08
  quote: The survey, conducted between December 2025 and July 2026 by the Department of National Parks
    and Wildlife Conservation and the Department of Forests and Soil Conservation, was supported by NTNC,
    WWF Nepal and ZSL Nepal.
- claim: Its site lists the offices under the department, starting with the Gaurishankar Conservation
    Area office and including national park offices such as Chitwan.
  url: https://dnpwc.gov.np/
  fetched: 2026-11-08
  quote: विभाग अन्तर्गतका कार्यालयहरु गौरीशंकर संरक्षण क्षेत्र कार्यालय
- claim: Its site carries a press release on the National Tiger Survey 2025.
  url: https://dnpwc.gov.np/
  fetched: 2026-11-08
  quote: National Tiger Survey 2025 Press Release
- claim: Its site offers an area coverage database of all protected areas.
