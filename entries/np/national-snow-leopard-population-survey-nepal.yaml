summary: A closed survey led by two government departments with NTNC as partner, published in April 2025,
  estimating Nepal’s snow leopard population at 397, according to NTNC.
facts:
- claim: NTNC reports that the survey, published in April 2025, estimated Nepal's snow leopard population
    at 397.
  url: https://ntnc.org.np/first-comprehensive-report-snow-leopard-population-nepal
  fetched: 2026-11-08
  quote: 'Nepal''s latest national snow leopard population has been estimated at 397 (95% CI: 331.11-475.60),
    with a mean density of 1.56 individuals per 100 km 2 .'
- claim: Survey data were collected from nine study regions across seven protected areas and two areas
    outside them.
  url: https://ntnc.org.np/first-comprehensive-report-snow-leopard-population-nepal
  fetched: 2026-11-08
  quote: population survey data of snow leopards were collected from 9 study regions across the Nepalese
    snow leopard habitat constituting 7 protected areas
