summary: A programme built and run by Red Panda Network, which Mongabay reports has recruited about 128
  guardians, 44 of them monitoring red pandas in the Panchthar–Ilam–Taplejung Corridor.
facts:
- claim: Mongabay reports the programme has recruited about 128 guardians, 44 of whom monitor red pandas
    in the Panchthar–Ilam–Taplejung Corridor.
  url: https://news.mongabay.com/short-article/2025/08/nepals-forest-guardians-monitor-the-elusive-red-panda/
  fetched: 2026-11-08
  quote: it has now recruited about 128, mostly from underprivileged and economically marginalized groups
    from local communities.
- claim: Mongabay reports that sightings, GPS mapping, camera-trap footage and patrol logs are compiled
    to guide conservation strategies.
  url: https://news.mongabay.com/short-article/2025/08/nepals-forest-guardians-monitor-the-elusive-red-panda/
  fetched: 2026-11-08
  quote: These sightings, together with GPS mapping, camera trap footage and patrol logs from all seasons,
    are regularly compiled to guide conservation strategies.
