summary: A centre founded by Dibesh Karmacharya that Dialogue Earth reports profiled aquatic biodiversity
  in four rivers using eDNA.
facts:
- claim: Dialogue Earth reports the centre profiled aquatic biodiversity in four rivers with eDNA and
    built Nepal's first fish DNA reference database.
  url: https://dialogue.earth/en/nature/environmental-dna-could-unlock-biodiversity-conservation-in-the-himalayas/
  fetched: 2026-11-08
  quote: The group has painstakingly profiled aquatic biodiversity in Trishuli, Karnali, Gandaki, and
    Mahakali rivers using eDNA, developing extensive datasets to monitor the long-term health of the river
    systems – building the country’s first fish DNA reference database in the process.
- claim: Dialogue Earth names genetic scientist Dibesh Karmacharya as its founder.
  url: https://dialogue.earth/en/nature/environmental-dna-could-unlock-biodiversity-conservation-in-the-himalayas/
  fetched: 2026-11-08
