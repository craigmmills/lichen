summary: A national park that reportedly set up 50 camera traps and 64 CCTV cameras
  by October 2020, and in 2019 began using a smart patrol mobile app to record rhinos
  after GPS collars stopped working.
facts:
- claim: The Kathmandu Post reported in October 2020 that the park had set up 50 camera
    traps to observe the movement of wild animals and study their behaviour, according
    to its information officer.
  url: https://kathmandupost.com/province-no-5/2020/10/22/bardia-national-park-counts-on-technology-to-protect-its-wildlife
  fetched: '2026-11-12'
  quote: the park has also set up 50 camera traps to observe the movement of wild
    animals and study their behaviours, according to Thapa.
- claim: The article says 64 CCTV cameras were installed at crucial locations to track
    the movement of people and wild animals.
  url: https://kathmandupost.com/province-no-5/2020/10/22/bardia-national-park-counts-on-technology-to-protect-its-wildlife
  fetched: '2026-11-12'
  quote: there are 64 CCTV cameras installed at crucial locations to track the movement
    of people as well as wild animals.
- claim: The article says real-time patrolling was going on in the park.
  url: https://kathmandupost.com/province-no-5/2020/10/22/bardia-national-park-counts-on-technology-to-protect-its-wildlife
  fetched: '2026-11-12'
  quote: realtime smart patrolling has also been going on in Bardia Park to minimise
    potential threats to wildlife.
- claim: The Kathmandu Post reported in August 2019 that the park had started using
    a mobile app, named smart patrol, to record information and photographs of one-horned
    rhinos, after satellite-GPS collars stopped working.
  url: https://kathmandupost.com/province-no-5/2019/08/17/bardiya-national-park-takes-aid-of-mobile-app-for-rhino-conservation
  fetched: '2026-11-12'
  quote: Bardiya National Park has started using a mobile app for the conservation
    of one-horned rhinos.
- claim: The 2019 article says the park had earlier used satellite-GPS collars on
    rhinos in the Babai valley.
  url: https://kathmandupost.com/province-no-5/2019/08/17/bardiya-national-park-takes-aid-of-mobile-app-for-rhino-conservation
  fetched: '2026-11-12'
  quote: In the past, the park used the satellite-GPS collar on the rhinos in the
    Babai valley to enhance the monitoring of the endangered animals.
