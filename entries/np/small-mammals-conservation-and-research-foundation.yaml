summary: A Kathmandu non-profit working on biodiversity research and conservation, focused on small mammals
  since 2009, that says it is preparing a camera trap occurrence database for Asia with the University
  of Queensland.
facts:
- claim: A non-profit, non-governmental organisation based in Kathmandu, working on research and conservation
    of biodiversity in Nepal, with a focus on small mammals, since 2009.
  url: https://api.gbif.org/v1/organization/58ff88f6-8a7e-41a3-a5fb-8a277f5203e7
  fetched: 2026-11-08
  quote: is a non-profit making, non-governmental organization based in Kathmandu, Nepal. It is dedicated
    to the conservation and research of biodiversity in Nepal with particular reference diversity and
    conservation of small mammals since 2009.
- claim: Registered with the District Administration Office and the Social Welfare Council in Nepal, according
    to its GBIF publisher record.
  url: https://api.gbif.org/v1/organization/58ff88f6-8a7e-41a3-a5fb-8a277f5203e7
  fetched: 2026-11-08
  quote: SMCRF is registered at District Administration Office (903/065/066) and Social Welfare Council
    (29919)
- claim: Its GBIF record says it is preparing and sharing a camera trap occurrence database for Asia,
    with more than 500,000 observations of more than 300 vertebrate species, with the University of Queensland.
  url: https://api.gbif.org/v1/organization/58ff88f6-8a7e-41a3-a5fb-8a277f5203e7
  fetched: 2026-11-08
  quote: At present, SMCRF is conducting BIFA6_005- Preparation and sharing of camera traps occurrence
    database in Asia, including >500,000 observations of >300 vertebrate species from >200 sites in collaboration
    with the University of Queensland, Australia.
- claim: Its website lists a Nepal Bat Call Library among its resources.
  url: https://smcrf.org/
  fetched: 2026-11-08
  quote: Nepal Bat Call Library
- claim: Says it monitors small mammals through quarterly bat watching and small mammal hikes.
  url: https://smcrf.org/
  fetched: 2026-11-08
  quote: We regularly monitor small mammals through our periodic events- quarterly bat watching and small
    mammal hiking.
