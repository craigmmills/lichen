  quote: The year-long study, conducted between February 2024 and early 2025 in Doti,
    Dadeldhura, Baitadi and Darchula, documented 22 species of mammals.
- claim: Researchers used automatic camera traps and occupancy surveys.
  url: https://kathmandupost.com/national/2026/05/07/leopard-rescues-highlight-rising-human-wildlife-conflict-in-nepal-s-far-west
