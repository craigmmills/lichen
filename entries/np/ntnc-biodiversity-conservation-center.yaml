facts:
- claim: NTNC's home page says that in 1989 the Trust set up the Nepal Conservation
    Research and Training Center to conduct biological research and monitoring of
    flora and fauna in the Terai protected areas.
  url: https://ntnc.org.np
  fetched: '2026-11-12'
  quote: the Trust established the Nepal Conservation Research and Training Center
    (NCRTC) to conduct biological research and monitoring of flora and fauna in the
    lowland (Terai) protected areas of Nepal.
- claim: NTNC's home page lists the Biodiversity Conservation Center (BCC) and says
    Koshi operations were managed from its Sauraha office until 2021.
  url: https://ntnc.org.np
  fetched: '2026-11-12'
  quote: Prior to that, the Trust's Koshi-related operations were managed from its
    Biodiversity Conservation Center (NTNC-BCC) office in Sauraha, Chitwan.
- claim: The Kathmandu Post reported in August 2017 that the chief of NTNC Sauraha
    said 32 cameras had been installed at 16 locations along the Tikauli corridor
    to monitor wildlife and human activity.
  url: https://kathmandupost.com/miscellaneous/2017/08/10/ntnc-installs-cameras-at-tikauli-to-study-wildlife
  fetched: '2026-11-12'
  quote: Thirty-two cameras have been installed at 16 locations between Bharatpur
    Metropolitan City and Ratnanagar Municipality, Pokharel added.
