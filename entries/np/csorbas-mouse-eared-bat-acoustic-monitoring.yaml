facts:
- claim: The project planned to study the bat's foraging habitat with passive acoustic
    monitoring using AudioMoths, active acoustic monitoring and capture.
  url: https://www.rufford.org/projects/sanjeev-baniya/acoustic-survey-and-monitoring-to-lay-the-foundation-for-conservation-of-the-endemic-csorbas-mouse-eared-bat-myotis-csorbai-in-nepal/
  fetched: 2026-11-13
  quote: We aim to study its foraging habitat through passive acoustic monitoring
    (Audiomoths), active acoustic monitoring (Wildlife acoustic Echometer touch 2
    pro) and bat capture (mist netting, harp trapping).
- claim: It aimed to build a call library of the species and its co-inhabitants.
  url: https://www.rufford.org/projects/sanjeev-baniya/acoustic-survey-and-monitoring-to-lay-the-foundation-for-conservation-of-the-endemic-csorbas-mouse-eared-bat-myotis-csorbai-in-nepal/
  fetched: 2026-11-13
  quote: call curvature of the study species and its co-inhabitants, and thus develop
    a call library.
- claim: The February 2023 final evaluation report describes roost and acoustic surveys
    in peak winter, late winter and spring.
  url: https://media.rufford.org/media/project_reports/29622-1_Final_Evaluation_Report.pdf
  fetched: 2026-11-13
  quote: 'By phases, first phase = peak winter, second phase = late winter

