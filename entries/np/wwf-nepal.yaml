facts:
- claim: WWF-Singapore's September 2012 release reports WWF-organised training for park rangers
    and army personnel to operate UAVs in two national parks in Nepal.
  url: https://www.wwf.sg/?p=3028
  fetched: 2026-11-08
  quote: park rangers and army personnel learn how to operate unmanned aerial vehicles (UAVs)
    in two national parks in a training program organized by WWF.
- claim: The release says WWF has been active in Nepal since the 1960s and gives www.wwfnepal.org
    as its site.
  url: https://www.wwf.sg/?p=3028
  fetched: 2026-11-08
  quote: Learn more at www.wwfnepal.org
- claim: WWF Nepal's home page lists the launch of a National MRV Portal in September 2026
    as its newest news item.
  url: https://www.wwfnepal.org
  fetched: 2026-11-08
  quote: National MRV Portal Launched to Strengthen Nepal’s Climate Transparency
- claim: WWF began a rhino programme in Chitwan in 1967; the WWF Nepal office was formally
    established in 1993.
  url: https://www.wwfnepal.org/our_work_/about_us2/
  fetched: 2026-11-08
  quote: Our roots in Nepal extend back to 1967, when WWF first launched a rhino conservation
    program in Chitwan. However the WWF Nepal office was formally established only in 1993.
- claim: Supports the Government of Nepal in conserving and managing six focal species within
    Nepal's protected areas and outside them in WWF's priority landscapes.
  url: https://www.wwfnepal.org/our_work_/wildlife/
  fetched: 2026-11-08
  quote: WWF Nepal supports the Government of Nepal in the conservation and management of
    these focal species within Nepal's Protected Areas, and outside protected areas in WWF's
    priority landscapes.
- claim: Its priority initiatives include monitoring of the focal species and finding and
    adapting technologies that support species management.
  url: https://www.wwfnepal.org/our_work_/wildlife/
  fetched: 2026-11-08
  quote: Priority initiatives include monitoring of focal species to ascertain their status
    and performance in their habitats based on robust monitoring protocols
- claim: OpenAlex lists a paper on drone monitoring of gharial and mugger populations in Chitwan
    National Park.
  url: https://api.openalex.org/works/W4413383806?select=id,display_name,authorships
  fetched: 2026-11-08
  quote: Drone monitoring of the largest gharial and mugger populations in the East Rapti
    River, Chitwan National Park
- claim: OpenAlex gives the paper's first author, Gokarna Jung Thapa, a WWF Nepal affiliation.
  url: https://api.openalex.org/works/W4413383806?select=id,display_name,authorships
  fetched: 2026-11-08
  quote: WWF Nepal, Kathmandu, Nepal
