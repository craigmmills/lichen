summary: A Nepal-registered charity with a field centre north of Koshi Tappu Wildlife
  Reserve, formerly hosting the Asian Waterbird Census and reportedly recording 22
  dolphins with partners in 2025.
facts:
- claim: Its site says it is a charity registered with the Government of Nepal and
    gives a Kathmandu address.
  url: https://www.himalayannature.org/page/water-bird-count
  fetched: '2026-11-12'
  quote: A Registered Charity (No. 818/056/57) with Government of Nepal.
- claim: It says it has a permanent field centre, the Kosi Bird Observatory, on four
    hectares north of Koshi Tappu Wildlife Reserve, for the study of biodiversity
    and bird migration.
  url: https://himalayannature.org/works/projects/organizing-nepals-first-bird-observatory-and-education-center-kosi-bird-observatory-and-field-study-center/
  fetched: '2026-11-12'
  quote: Himalayan Nature has a permanent field centre known as "Kosi Bird Observatory
    (KBO)" which bears a full four hectare of land at a site just north of Koshi Tappu
    Wildlife Reserve, for the study of biodiversity and bird migration.
- claim: It says it previously hosted the Asian Waterbird Census in Nepal and that
    NOU took over its coordination roles from 2025.
  url: https://www.himalayannature.org/page/water-bird-count
  fetched: '2026-11-12'
  quote: Previously, Himalayan Nature used to host the annual event in Nepal
- claim: A 2025 Rufford project update reports river dolphin surveys on the Koshi
    River by Himalayan Nature with Koshi Tappu Wildlife Reserve and NTNC, combining
    boat and shore surveys that recorded 22 dolphins.
  url: https://media.rufford.org/media/project_reports/Laba_KC_44815-2-Mid-Term_Update_Report-2025.pdf
  fetched: '2026-11-12'
  quote: Combining the results from both survey approaches, a total of 22 river dolphins
    were recorded
- claim: The update names Himalayan Nature working in collaboration with Koshi Tappu
    Wildlife Reserve and NTNC.
  url: https://media.rufford.org/media/project_reports/Laba_KC_44815-2-Mid-Term_Update_Report-2025.pdf
  fetched: '2026-11-12'
  quote: Himalayan Nature in collaboration with Koshi Tappu Wildlife Reserve (KTWR)
    , National Trust for Nature
