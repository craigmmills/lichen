summary: A closed project, led by Gokarna Jung Thapa and funded by WWF UK, that surveyed a
  73 km stretch of the East Rapti River by drone in early 2024, with an analyst counting 323
  crocodiles.
facts:
- claim: Surveyed a 73 km river stretch with a fixed-wing drone during the species' basking
    period in January and February 2024.
  url: https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0330350&type=printable
  fetched: 2026-11-08
  quote: Using a Wingtra Tail-Sitter Vertical Take-Off and Landing fixed-wing drone, we surveyed
    a 73-km river stretch during the species' basking period.
- claim: An experienced image analyst counted 323 crocodiles, 205 gharials and 118 muggers,
    from the drone images.
  url: https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0330350&type=printable
  fetched: 2026-11-08
  quote: An experienced image analyst identified and counted 323 crocodiles (205 gharials
    and 118 muggers) from the images.
- claim: ConservationDrones describes the study as showing drones are a cost-effective way
    to monitor these species in Chitwan's rivers.
  url: https://conservationdrones.org/2025/10/01/eyes-in-the-sky-drone-monitoring-of-the-largest-gharial-and-mugger-populations-in-the-east-rapti-river-chitwan-national-park/
  fetched: 2026-11-08
  quote: The current study led by Gokarna Thapa shows that drones are a cost-effective tool
    to monitor these species in rivers within Chitwan National Park.
