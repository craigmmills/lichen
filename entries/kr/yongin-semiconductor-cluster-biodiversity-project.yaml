summary: A project run by SK hynix that records biodiversity change around the Yongin cluster through
  citizen science, uses AI based on Microsoft Azure, and has seven main tasks.
facts:
- claim: A July 2024 report says SK hynix was running citizen science programmes with schools and communities
    near the cluster.
  url: https://www.smarttoday.co.kr/ko-kr/articles/53935
  fetched: '2026-11-02'
  quote: 회사는 용인 반도체 클러스터 인근에서 지역 초·중·고등학교 및 커뮤니티를 대상으로 시민과학 프로그램을 운영하며, 생물 데이터 수집 및 축적을 수행하고 있다.
- claim: SK hynix defines it as recording biodiversity change around the cluster through citizen science.
  url: https://news.skhynix.co.kr/ecosee-program-for-biodiversity/
  fetched: '2026-11-02'
  quote: SK하이닉스가 시민과학을 통해 용인 반도체 클러스터 조성 전후의 생물다양성 변화를 투명하게 기록하고자 하는 활동.
- claim: AI based on Microsoft Azure is used.
  url: https://news.skhynix.co.kr/ai-challenge-for-biodiversity/
  fetched: '2026-11-02'
  quote: MS 클라우드 애저(Azure) 기반 AI가 활용됨
- claim: Has seven main tasks, including the ECOSEE programme and an observation app.
  url: https://news.skhynix.co.kr/ecosee-program-for-biodiversity/
  fetched: '2026-11-02'
  quote: 생물다양성 프로젝트는 ▲안성천 ECOSEE 프로그램 ▲생태계서비스 연구 ▲하천(河川) 환경 정비 ▲생태계 관찰 APP 구축 및 활용
