id: eco-ai
kind: model
name: Eco.AI
scope: kr
ai_label: ai
status: active
summary: Camera-trap image classifier built by the National Institute of Ecology and
  Sphere AX, with a KAIST team improving the algorithm; in March 2025 it sorted seven
  categories, was used first for goral research, and a public release was planned.
facts:
- claim: 'A March 2025 report says Eco.AI classifies seven categories: goral, wild
    boar, deer, other, people, vehicles and empty files.'
  url: https://www.dailyvet.co.kr/?p=240384
  fetched: '2026-11-02'
  quote: 현재 산양, 멧돼지, 사슴류, 기타, 사람, 자동차, 빈파일 7종에 대한 자동 분류를 할 수 있다.
- claim: The March 2025 report says Eco.AI was being used first for research on endangered
    goral.
  url: https://www.dailyvet.co.kr/?p=240384
  fetched: '2026-11-02'
  quote: 특히, 멸종위기 1급 야생동물이자 천연기념물인 산양 연구에 우선적으로 활용 중이다.
- claim: The March 2025 report says public release was planned.
  url: https://www.dailyvet.co.kr/?p=240384
  fetched: '2026-11-02'
  quote: 향후 대국민에게도 공개해 누구나 쉽게 활용할 수 있도록 할 방침이다.
- claim: Rests on a deep learning algorithm first developed by Sphere AX.
  url: https://www.dailyvet.co.kr/?p=240384
  fetched: '2026-11-02'
  quote: 기존 스피어AX에서 개발한 딥러닝 알고리즘의 성능을 고도화하는 데 주도적인 역할을 했다.
  ai_type: deep-learning
- claim: Analyses large numbers of camera-trap photographs to identify species and
    arranges the data for researchers.
  url: https://www.nie.re.kr/nie/bbs/BMSR00029/view.do?boardId=695965811&menuNo=200098
  fetched: '2026-11-02'
  quote: Eco.AI는 인공지능(AI) 기술을 활용하여 무인센서카메라로 촬영된 대량의 사진 자료를 자동으로 분석하여 야생동물의 종을 판별하고
    데이터를 정리해 연구자에게 제공한다.
- claim: 'A March 2025 report said the system could sort seven categories: goral,
    wild boar, deer, other, people, vehicles and empty files.'
  url: https://v.daum.net/v/YyDpp0XDg9
  fetched: '2026-11-02'
  quote: 멸종위기 포유류 연구에 활용하기 위해 개발된 이 시스템은 현재 산양, 멧돼지, 사슴류, 기타, 사람, 자동차, 빈파일 등 7종에 대해
    자동 분류가 가능하다.
- claim: A March 2025 report said the system was being used for goral research.
  url: https://v.daum.net/v/YyDpp0XDg9
  fetched: '2026-11-02'
  quote: 현재 멸종위기 1급 야생동물이자 천연기념물인 산양 연구에 활용 중이다.
- claim: In March 2025, the institute planned a web service for agencies and researchers
    and later public release.
  url: https://www.nie.re.kr/nie/bbs/BMSR00029/view.do?boardId=695965811&menuNo=200098
  fetched: '2026-11-02'
  quote: 현재 Eco.AI는 누리집 서비스를 통해 유관기관 및 연구자들의 활용도를 높이기 위한 계획에 있으며, 향후 대국민에게 공개해 보다
    쉽게 접근하고 활용할 수 있도록 할 계획이다.
- claim: Uses deep learning algorithms developed by Sphere AX and improved by a KAIST
    team.
  url: https://www.nie.re.kr/nie/bbs/BMSR00029/view.do?boardId=695965811&menuNo=200098
  fetched: '2026-11-02'
  quote: 카이스트 전기및전자공학부 김창익 교수 연구팀은 기존 스피어AX에서 개발한 딥러닝 알고리즘의 성능을 고도화하는 데 주도적인 역할을 했다.
  ai_type: deep-learning
- claim: Classifies seven categories.
  url: https://www.nie.re.kr/nie/bbs/BMSR00029/view.do?boardId=695965811&menuNo=200098
  fetched: '2026-11-02'
  quote: 현재 산양, 멧돼지, 사슴류, 기타, 사람, 자동차, 빈파일 등 7종에 대해 자동 분류가 가능하다.
- claim: The work used a deep learning algorithm.
  url: https://www.nie.re.kr/nie/bbs/BMSR00029/view.do?boardId=695965811&menuNo=200098
  fetched: '2026-11-02'
  quote: 딥러닝 알고리즘의 성능을 고도화
  ai_type: deep-learning
- claim: Analyses large volumes of unmanned sensor camera photographs to identify
    species and organises the data for researchers.
  url: https://www.dailyvet.co.kr/print?id=240384
  fetched: 2026-11-02
  quote: Eco.AI는 인공지능(AI) 기술을 활용하여 무인센서카메라로 촬영된 대량의 사진 자료를 자동으로 분석하여 야생동물의 종을 판별하고
    데이터를 정리해 연구자에게 제공한다.
- claim: In March 2025 it could sort seven categories and was being used first for
    goral research.
  url: https://www.dailyvet.co.kr/print?id=240384
  fetched: 2026-11-02
  quote: 이 시스템은 멸종위기 포유류 연구에 활용하기 위해 개발됐으며, 현재 산양, 멧돼지, 사슴류, 기타, 사람, 자동차, 빈파일 7종에
    대한 자동 분류를 할 수 있다. 특히, 멸종위기 1급 야생동물이자 천연기념물인 산양 연구에 우선적으로 활용 중이다.
- claim: The institute said in March 2025 that it planned to open the system to the
    public later.
  url: https://www.dailyvet.co.kr/print?id=240384
  fetched: 2026-11-02
  quote: 향후 대국민에게도 공개해 누구나 쉽게 활용할 수 있도록 할 방침이다.
- claim: A KAIST team led by Kim Chang-ik improved a deep learning algorithm first
    developed by Sphere AX.
  ai_type: deep-learning
  url: https://www.dailyvet.co.kr/print?id=240384
  fetched: 2026-11-02
  quote: 카이스트 김창익 교수 연구팀은 기존 스피어AX에서 개발한 딥러닝 알고리즘의 성능을 고도화하는 데 주도적인 역할을 했다.
