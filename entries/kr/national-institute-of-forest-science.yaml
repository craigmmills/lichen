  fetched: '2026-11-02'
  quote: 이에 따라 국립산림과학원은 위성 데이터를 스스로 분석하고 실시간으로 문제를 해결하는 ‘지능형 농림위성 운영 체계’ 구축을 본격화하고 있다.
- claim: An August 2025 report said it had developed AI to classify main Korean tree species
