- claim: In October 2026, the service said introducing Bandal Lens AI would enable automatic
    identification of 17 mammal species in national-park camera-trap footage at over 90% accuracy.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 이번 시스템 도입으로 전국 국립공원 내 무인센서카메라 영상에서 반달가슴곰, 산양, 여우 등 포유류 17종을 90% 이상의 정확도로 자동 동정할 수
    있게 됨.
- claim: EcoBank lists it among related sites.
