  fetched: '2026-11-02'
  quote: 기후에너지환경부 국립공원공단 자원보전처 보전정책부
- claim: Its October 2026 announcement says video analysis work averages about 4.7 million
    items a year.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014
