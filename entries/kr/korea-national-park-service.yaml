summary: Park agency under the ministry that builds Bandal Lens AI, which it said in October
  2026 would identify 17 mammal species in camera-trap footage at over 90% accuracy.
facts:
- claim: A KDI summary of its October 2026 announcement lists it under the ministry and gives
    the source as its conservation policy unit.
