  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 국립공원공단은 ’26.10.13.(화) 인공지능(AI) 자동 동정 영상 분석 시스템(반달렌즈 AI)을 개발하고 이를 현장에 적용할 계획을 발표하였다.
