summary: Korean ministry that designates species under the Integrated Wildlife Management
  System; its Nature and Ecology Policy Division has a deputy director listed as CBD primary
  national focal point.
facts:
- claim: Its minister wrote the Republic of Korea's message for the International Day for
    Biological Diversity 2026, naming the 5th national biodiversity strategy and action plan.
  url: https://www.cbd.int/idb/statements/idb2026-rok.pdf
  fetched: '2026-11-02'
  quote: Biodiversity Strategy and Action Plan (2024 –2028), we are advancing ecosystem restoration
- claim: Its office is in the Government Complex-Sejong.
  url: https://www.cbd.int/idb/statements/idb2026-rok.pdf
  fetched: '2026-11-02'
  quote: 'Building #6, Government Complex-Sejong, 11 Doum 6-ro, Sejong Special Self-Governing
    City 30103, Republic of Korea'
- claim: Korea's statement to the Eighth GEF Assembly says the ministry was set up by the
    new government.
  url: https://www.thegef.org/sites/default/files/documents/2026-06/Korea_Statement_ENG.pdf
  fetched: '2026-11-02'
  quote: we established the Ministry of Climate, Energy and Environment
- claim: Its website carries its Korean name.
  url: https://www.mcee.go.kr
  fetched: '2026-11-02'
  quote: 기후에너지환경부
- claim: The CBD focal point list gives a deputy director in its Nature and Ecology Policy
    Division as primary national focal point and focal point for protected areas.
  url: https://www.cbd.int/countries/nfp?country=kr
  fetched: '2026-11-02'
  quote: CBD Primary NFP, CHM NFP, SBSTTA NFP, Traditional Knowledge NFP, Protected Areas
    NFP, Resource Mobilization FP
