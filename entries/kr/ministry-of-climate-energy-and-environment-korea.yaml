  url: https://www.cbd.int/countries/nfp?country=kr
  fetched: '2026-11-02'
  quote: Nature and Ecology Policy Division
- claim: Designates the legally managed species covered by Korea's Integrated Wildlife Management
    System.
  url: https://www.kbr.go.kr/eng/index.do
  fetched: '2026-11-02'
  quote: Integrated Wildlife Management System A permit and reporting platform for exports/imports
