facts:
- claim: Set up in 2007 as a non-profit foundation to protect Jeju's Gotjawal; its
    2026 announcement reports that it has bought and permanently conserves 115.7 ha
    of private Gotjawal land in Jocheon, Gujwa, Hangyeong, Seongsan and Andeok, aiming
    for 165 ha by 2030.
  url: https://jejutrust.net/media/?bmode=view&idx=169707282
  fetched: '2026-11-17'
  quote: 재단은 2007년 제주의 자연자산인 곶자왈을 도민 스스로의 힘으로 지켜나가기 위해 설립된 비영리 재단법인으로, 지금까지 144억 5천만
    원을 투입해 제주시 조천읍, 구좌읍, 한경면 및 서귀포시 성산읍, 안덕면 일대의 사유지 곶자왈 115.7ha(35만평)을 매입해 영구 보전
    중이다.
