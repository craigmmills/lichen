summary: Museum that runs NARIS, the Korean Biodiversity Information Facility and a natural
  history research information system, and acts as GBIF's Korean secretariat; GBIF lists 244
  published datasets for it.
facts:
- claim: Korea's CBD clearing house says it maintains NARIS, hosts KBIF and operates the Korean
    Biodiversity Consortium.
  url: https://www.cbd-chm.go.kr/eng/content/view.do?contentKey=286&menuKey=1086
  fetched: '2026-11-02'
  quote: The NSM is tasked with maintaining the Korea Natural History Research Information
    System (NARIS). It also leads the collection, conservation and management of information
    about Korea’s biodiversity, hosts the Korean Biodiversity Information Facility and operates
    the Korean Biodiversity Consortium.
- claim: GBIF lists 244 published datasets for it.
  url: https://api.gbif.org/v1/organization/eb07eeb0-3db9-11d9-8439-b8a03c50a862
  fetched: '2026-11-02'
  quote: '"numPublishedDatasets":244'
