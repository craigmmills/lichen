- claim: A science ministry release says the museum, as GBIF's Korean secretariat, supports
    the collection, standardisation and sharing of biodiversity data.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=284020
  fetched: 2026-11-02
  quote: 국립중앙과학관은 GBIF 한국사무국(KBIF)으로서 생물다양성 데이터의 체계적 수집·표준화·공유·확대를 지원 중임.
- claim: The science ministry announced the 2026 GBIF Asia node meeting and regional symposium
    at the museum on 8 and 9 July 2026.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=284020
  fetched: 2026-11-02
  quote: 과학기술정보통신부는 ’26.7.8.(수)부터 7.9.(목)까지 국립중앙과학관에서 「2026 GBIF 아시아 노드 회의 및 아시아 지역 국제 심포지엄」을
    개최한다.
