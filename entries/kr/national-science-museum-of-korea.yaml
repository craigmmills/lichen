  url: https://www.cbd-chm.go.kr/eng/content/view.do;jsessionid=E661405CE732EC136873B64EAB73896B?contentKey=286&menuKey=1086
  fetched: '2026-11-02'
  quote: It also leads the collection, conservation and management of information about Korea’s
    biodiversity, hosts the Korean Biodiversity Information Facility and operates the Korean
