website: https://www.mbris.kr/en/obis/about
summary: System run by the National Marine Biodiversity Institute of Korea, whose spatial service opened
  fully in December 2021, offering 425,396 quality-checked records covering 8,860 registered species.
facts:
- claim: Marine biodiversity data collected by OBIS Korea are managed using MABIK’s MBRIS system.
  url: https://www.mbris.kr/en/obis/about
  fetched: '2026-11-02'
  quote: these resources and information have been meticulously collected and managed using the MBRIS
    system of the National Marine Biodiversity Institute of Korea (MABIK).
- claim: When the spatial information service opened fully in December 2021, it offered 425,396 quality-checked
    records for 8,860 species registered in MBRIS, plus OBIS data for Korean waters.
  url: https://m.dailian.co.kr/news/view/1060200
  fetched: 2026-11-02
  quote: 해양생물 공간정보시스템은 MBRIS에 등록된 해양생물자원 채집정보 중 품질검증을 거친 8860종에 대한 공간정보 42만5396건과 한반도 주변 해역의 OBIS(전 세계
    해양생물의 다양성 및 지리정보를 제공하는 시스템) 데이터(1만774종, 52만134건)를 제공하고 있다.
- claim: A December 2021 report says sea turtle movement data were offered to researchers through an Open
    API.
  url: https://m.dailian.co.kr/news/view/1060200
  fetched: 2026-11-02
  quote: 바다거북 이동경로의 경우 국내외 연구자들이 활용할 수 있도록 Open API(응용프로그램을 작성할 수 있게 하는 공개된 인터페이스)를 개발해 서비스하고 있다.
- claim: The institute's home page links to MBRIS.
  url: https://www.mabik.re.kr/
  fetched: 2026-11-02
  quote: MBRIS 해양생명자원 통합정보시스템
