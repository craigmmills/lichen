summary: Company running Yongin biodiversity work that held the September 2022 AI Challenge
  and June 2024 forum, aiming, it says, to apply AI to about 60,000 Korean species.
facts:
- claim: A 2024 report says it held a forum on using AI for biodiversity and aims to apply
    AI to data on about 60,000 Korean species.
  url: https://www.smarttoday.co.kr/ko-kr/articles/53935
  fetched: '2026-11-02'
  quote: 국내에 서식하는 6만여 종의 생물에 대한 빅데이터에 AI 기술을 접목하여 종을 인식하고 판별함으로써 생태계 모니터링 및 관련 연구 활성화에 기여하고자
    한다고 설명했다.
- claim: In September 2022 it announced an AI biodiversity data analysis and ideas contest.
  url: https://news.skhynix.co.kr/?p=14432
  fetched: '2026-11-02'
  quote: AI(인공지능)를 활용한 ‘생물다양성 데이터 분석 및 아이디어 제안 경연(AI Challenge for Biodiversity)’을 개최한다고 밝혔다.
- claim: Held the Next Shift Biodiversity Forum in June 2024 on using AI for biodiversity
    conservation.
  url: https://news.skhynix.co.kr/post/next-shift-biodiversity-forum
  fetched: '2026-11-02'
  quote: ‘넥스트 쉬프트 생물다양성 포럼(Next Shift Biodiversity Forum)’ 을 열고, 민·관·학 관계자들과 함께 생물다양성 보전에
    AI 기술을 활용하는 방안을 논의했다고 1일 밝혔다.
- claim: Says it aims to apply AI to data on about 60,000 domestic species to recognise and
    identify them.
  url: https://news.skhynix.co.kr/post/next-shift-biodiversity-forum
  fetched: '2026-11-02'
  quote: 국내에 서식하는 6만여 종의 생물에 대한 빅데이터에 AI 기술을 접목하여 종을 인식하고 판별함으로써 생태계 모니터링 및 관련 연구 활성화에 기여하고자
    한다고 설명했다.
- claim: A January 2023 report says it held the AI Challenge for Biodiversity in September
    2022 and awarded prizes for AI analyses and conservation ideas.
  url: https://news.skhynix.co.kr/ai-challenge-for-biodiversity/
  fetched: '2026-11-02'
  quote: SK하이닉스는 AI 기술과 아이디어를 활용해 생물다양성 보전과 기후변화 대응을 위한 ‘생물다양성 경연’을 개최했다.
