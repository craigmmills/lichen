summary: The National Institute of Ecology’s centre had released or translocated 14
  endangered species since 2018 by October 2022, using transmitters and radio or satellite
  tracking for mammals and birds.
facts:
- claim: The institute's October 2022 newsletter says the centre had released or translocated
    14 endangered species since opening in 2018 and was tracking individuals afterwards
    to study their adaptation and movement.
  url: https://www.nie.re.kr/nie/bbs/BMSR00055/view.do?boardId=695962725&menuNo=200137
  fetched: '2026-11-12'
  quote: 방사·이식 후 개체 모니터링(추적)을 하면서 환경 적응 및 이동을 연구 하고 있습니다.
- claim: The October 2022 newsletter says released mammals and birds were monitored
    for movement and environmental adaptation using implanted or attached transmitters
    and radio or satellite tracking.
  url: https://www.nie.re.kr/nie/bbs/BMSR00055/view.do?boardId=695962725&menuNo=200137
  fetched: '2026-11-12'
  quote: 포유류와 조류는 조금 더 큰 발신기를 몸에 삽입하거나 부착하여 무선혹은 위성 추적으로 이동과 환경 적응을 모니터링하고 있습니다.
- claim: The October 2022 newsletter says the centre was carrying out restoration
    research on seven taxonomic groups.
  url: https://www.nie.re.kr/nie/bbs/BMSR00055/view.do?boardId=695962725&menuNo=200137
  fetched: '2026-11-12'
  quote: 멸종위기종복원센터는 7개 분류군(포유류, 조류, 어류, 양서·파충류, 곤충류, 무척추동물류, 식물류) 의 복원 연구를 수행하고 있으며
- claim: Its stated address is in Yeongyang, North Gyeongsang.
