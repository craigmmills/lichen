  fetched: '2026-11-02'
  quote: Serves as the National Biodiversity Center, develops Korea’s National Biodiversity
    Strategy and Action Plans (NBSAPs), monitors and reviews the implementation of the country’s
    NBSAPs, prepares the country’s national report
- claim: Its Biodiversity Research and Cooperation Division plans national implementation
