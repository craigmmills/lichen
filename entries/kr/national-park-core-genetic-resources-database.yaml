  quote: 공개되는 자료는 총 1만3555점으로, 생물의 혈액·잎·조직 등 유전정보 분석에 활용되는 생체시료 6939점, 생명체의 전체 유전정보가
    담긴 유전체(DNA) 3873점, 생물의 종류와 특징을 확인할 수 있는 염기서열 2743개이다.
