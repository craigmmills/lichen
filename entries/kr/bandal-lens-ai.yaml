- claim: In October 2026, the park service said Bandal Lens AI could identify 17 mammal species in national
    park camera-trap imagery at over 90% accuracy and announced plans for field application.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
