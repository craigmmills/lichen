  quote: 전국 국립공원 내 무인센서카메라 영상에서 반달가슴곰, 산양, 여우 등 포유류 17종을 90% 이상의 정확도로 자동 동정할 수 있게 됨.
- claim: Expected to cut analysis of 100,000 images from 208 days to 8 hours.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 기존 10만 건당 208일이 소요되던 영상 분석시간을 8시간으로 단축하여
