id: bandal-lens-ai
kind: model
name: Bandal Lens AI
scope: kr
ai_label: ai
status: active
summary: A model built by the Korea National Park Service, announced in October 2026 as able to identify
  17 mammal species in camera-trap footage at over 90% accuracy, with field use and public release planned.
facts:
- claim: An October 2026 announcement says the developed system is planned for field application and will
    identify 17 mammal species, including Asiatic black bear, goral and fox, with accuracy of at least
    90% in national park camera-trap videos.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014
  fetched: '2026-11-02'
  quote: 전국 국립공원 내 무인센서카메라 영상에서 반달가슴곰, 산양, 여우 등 포유류 17종을 90% 이상의 정확도로 자동 동정할 수 있게 됨.
- claim: Expected to cut analysis of 100,000 videos from 208 days to 8 hours.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014
  fetched: '2026-11-02'
  quote: 기존 10만 건당 208일이 소요되던 영상 분석시간을 8시간으로 단축하여
- claim: Release of the model on Hugging Face and GitHub is planned, not done.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014
  fetched: '2026-11-02'
  quote: 시스템 고도화 및 인공지능 모델 공개(Hugging Face, GitHub)를 통해 연구기관·단체와의 공동 활용도 확대할 예정임.
- claim: KIOST plans to spend 20.8 billion won of its own money on the centre by 2029.
  url: https://www.heraldk.com/article/2026060918385573321
  fetched: '2026-11-02'
  quote: KIOST는 2029년까지 자체 재원 208억원을 투입해 부산 본원 부지 내에 ‘해양과학AI연구센터’를 구축할 계획이다.
- claim: Its stated work includes digital twin simulation.
  url: https://www.heraldk.com/article/2026060918385573321
  fetched: '2026-11-02'
  quote: 해양재난 대응과 기후예측, 디지털 트윈 기반 시뮬레이션 등 국가 현안 해결의 핵심 허브 역할을 수행한다.
  ai_type: digital-twins
- claim: The service announced on 13 October 2026 that it had developed the system and planned to apply
    it in the field.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 국립공원공단은 ’26.10.13.(화) 인공지능(AI) 자동 동정 영상 분석 시스템(반달렌즈 AI)을 개발하고 이를 현장에 적용할 계획을 발표하였다.
- claim: Stated accuracy is over 90% for 17 mammal species.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 포유류 17종을 90% 이상의 정확도로 자동 동정할 수 있게 됨.
- claim: The service expects analysis of 100,000 clips to fall from 208 days to 8 hours.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 기존 10만 건당 208일이 소요되던 영상 분석시간을 8시간으로 단축하여 업무 효율성이 대폭 향상될 것으로 기대함.
- claim: The service plans to release the model on Hugging Face and GitHub.
  url: https://eiec.kdi.re.kr/policy/materialView.do?num=288014&pg=&pp=20&topic=O
  fetched: '2026-11-02'
  quote: 시스템 고도화 및 인공지능 모델 공개(Hugging Face, GitHub)를 통해 연구기관·단체와의 공동 활용도 확대할 예정임.
