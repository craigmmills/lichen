summary: Programme run by the National Institute of Ecology, with a disclosed period
  of March 2014 to December 2025, observing community dynamics, phenology and carbon
  uptake in major ecosystems to analyse climate change impacts.
facts:
- claim: The programme observed biological community dynamics, phenological change
    and carbon uptake in major ecosystems over the long term to analyse climate change
    impacts; its disclosed project period ran from March 2014 to December 2025.
  url: https://www.nie.re.kr/nie/bbs/BMSR00025/view.do?boardId=695967470&menuNo=200064
  fetched: '2026-11-09'
  quote: 국가 장기생태연구는 주요 생태계에서 생물군집 동태, 생물계절 변화, 탄소흡수 특성을 장기적으로 관측하여 기후변화 영향을 분석하고 있다.
- claim: Its 2025 report describes vegetation, insect, bird and plant phenology monitoring.
  url: https://www.nie.re.kr/nie/bbs/BMSR00025/view.do?boardId=695967470&menuNo=200064
  fetched: '2026-11-09'
  quote: 또한 식생·곤충·조류·식물계절 모니터링을 통해 기후변화에 따른 생태계 변화 신호가 일부 확인되었다.
- claim: The National Institute of Ecology published a data book compiling survey
    data from eight long-term ecological sites across forest, freshwater, brackish
    and suburban ecosystems.
  url: https://www.nie.re.kr/nie/bbs/BMSR00071/view.do?boardId=695962865&menuNo=200299
  fetched: '2026-11-09'
  quote: 국립생태원은 산림, 담수, 기수, 준도시 등 생태계 유형별로 국내 8개 장기생태지소 조사자료를 정리한 '국가 장기생태연구 결과 데이터북'을
    발간하였습니다.
- claim: The institute's 2025 project disclosure lists a basic plan in 2022 and site
    selection in 2023 for a national ecological observation network for the climate
    crisis.
