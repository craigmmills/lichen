summary: Environment ministry institute, opened in 2021 for island and coastal biological
  resources, which a August 2025 report says has confirmed a list of 22,084 native
  species on Korea's islands.
facts:
- claim: An August 2025 Newsis report says the institute, under the environment ministry,
    has confirmed a list of 22,084 native species living on Korea's islands through
    its island native species survey programme.
  url: https://www.newsis.com/view/NISX20250806_0003280477
  fetched: '2026-11-12'
  quote: 환경부 산하 국립호남권생물자원관은 그동안 ‘섬 지역 자생생물 조사·확보·발굴 연구사업’을 통해 우리나라 섬에 서식하는 자생생물 목록
    총 2만 2084종을 확인했다고 6일 밝혔다.
- claim: The same report says it opened in 2021 as the country's only research institute
    for island and coastal biological resources.
  url: https://www.newsis.com/view/NISX20250806_0003280477
  fetched: '2026-11-12'
  quote: 국내 유일의 섬·연안 생물자원 전문 연구기관으로 지난 2021년 개관한 국립호남권생물자원관은
- claim: Its 2026 work report to the ministry lists research on changes in island
    and coastal species distribution, and surveillance of the arrival of subtropical
    species.
