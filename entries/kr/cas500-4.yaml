summary: A satellite launched on 7 July 2026 for forest management and monitoring of forest cover change,
  with full agriculture and forestry observation due to begin in 2027.
facts:
- claim: Launched on 7 July 2026, with data intended for forest management and monitoring changes in forest
    cover.
  url: https://www.korea.net/NewsFocus/Sci-Tech/view?articleId=295590
  fetched: '2026-11-02'
  quote: This provides data for agriculture and forest management, monitoring changes in forest cover,
    responding to disasters like wildfires
- claim: The July 2026 report says full-fledged agriculture and forestry observation will begin in 2027,
    following a four-month initial operational phase.
  url: https://www.korea.net/NewsFocus/Sci-Tech/view?articleId=295590
  fetched: '2026-11-02'
  quote: the satellite will begin full-fledged observation of agriculture and forestry next year
- claim: Five spectral bands include red edge and near infrared.
  url: https://www.mt.co.kr/tech/2026/10/01/2026100112591051781
  fetched: '2026-11-02'
  quote: 적색 경계, 근적외선 등 5개 분광 밴드가 탑재됐다.
- claim: Launched on 7 July 2026.
  url: https://www.korea.net/NewsFocus/Sci-Tech/view?articleId=295590&koreanId=295577
  fetched: '2026-11-02'
  quote: said the CAS500-4 (Compact Advanced Satellite 500) was launched on July 7
- claim: The Forest Satellite is designed to cover the Korean Peninsula every three days; the launch report
    says full observation will begin in 2027.
  url: https://eng-nifos.forest.go.kr/kfsweb/kfi/kfs/cms/cmsView.do?cmsId=FC_003736&mn=UEFR_04_06_03_06
  fetched: '2026-11-02'
  quote: The Forest Satellite (CAS500-4) covers the entire Korean Peninsula every three days
