summary: Bird ringing centre of the National Park Research Institute, reported in
  2017 to run year-round surveys from Heuksando and Taean, and said in 2015 to have
  ringed about 50,000 birds in ten years.
facts:
- claim: A 2017 OhmyNews article says it conducted year-round bird ringing surveys
    in Korea, with the National Institute of Biological Resources coordinating ringing,
    including making and distributing rings.
  url: https://m.ohmynews.com/NWS_Web/Mobile/at_pg.aspx?CNTN_CD=A0002320251
  fetched: '2026-11-09'
  quote: 우리나라에서 상시 조류가락지부착조사를 진행하는 기관은 국립공원연구원 철새연구센터다. 총괄운영기관은 국립생물자원관으로 국내 조류가락지
    제작 및 배포 등을 담당한다.
- claim: The 2017 article placed its main site on Heuksando and a branch at Taean.
  url: https://m.ohmynews.com/NWS_Web/Mobile/at_pg.aspx?CNTN_CD=A0002320251
  fetched: '2026-11-09'
  quote: 그래서 국립공원관리공단 철새연구센터 본원이 흑산도에 있고 태안에 분원이 설치되었다.
- claim: A 2015 Korea National Park Service release says the centre had ringed about
    50,000 birds over the previous ten years.
  url: https://www.newswire.co.kr/newsRead.php?no=790714
  fetched: '2026-11-09'
  quote: 국립공원관리공단 철새연구센터는 지난 10년간 조류 약 5만 개체에 가락지를 부착하고 있다.
