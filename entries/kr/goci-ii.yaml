    the observation performance of Cheollian 1.
- claim: KARI says it can monitor the ocean carbon cycle and marine environment.
  url: https://www.kari.re.kr//eng/contents/174
  fetched: '2026-11-02'
  quote: GOCI-II can monitor the ocean's carbon cycle as well as the marine environment such as red tide/green
