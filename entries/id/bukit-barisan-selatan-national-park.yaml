  quote: WCS Indonesia supports the national park in monitoring wildlife populations
    using camera traps, covering a total area of 492 km².
- claim: WCS Indonesia says it supports patrols using SMART, with training for the
    park's forest police staff.
  url: https://indonesia.wcs.org/Wild-Places/Bukit-Barisan.aspx
  fetched: '2026-11-09'
  quote: patrols using the Spatial Monitoring and Reporting Tool (SMART) method, including
    mentoring and training for national park forest police staff
- claim: WCS Indonesia says it helped the park office set up and manage the Way Canguk
    Research Station in 1995, and that the station still operates.
  url: https://indonesia.wcs.org/Wild-Places/Bukit-Barisan.aspx
