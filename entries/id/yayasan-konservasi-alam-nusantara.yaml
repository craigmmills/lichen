summary: Indonesian conservation foundation that developed FishFace, which uses smartphone
  cameras and AI to identify fish species and record catch data, with the Swedish company
  Refind.
facts:
- claim: Obtained a grant from Google Foundation Australia in 2017 to test AI fish identification.
  url: https://www.nature.org/en-us/what-we-do/our-insights/perspectives/fishface-for-sustainable-fisheries-management/
  fetched: '2026-10-31'
  quote: In 2017, YKAN obtained a grant from Google Foundation Australia to test this out.
- claim: A science-based non-profit in Indonesia since 2014.
  url: https://www.ykan.or.id/id/publikasi/artikel/siaran-pers/goic-perkuat-konservasi-laut-indonesia/
  fetched: '2026-10-31'
  quote: Yayasan Konservasi Alam Nusantara (YKAN) adalah organisasi nirlaba berbasis ilmiah
    yang hadir di Indonesia sejak 2014.
- claim: Monitors wildlife in a concession with camera traps and bioacoustic recorders.
  url: https://www.ykan.or.id/id/publikasi/artikel/perspektif/biodiversitas-di-area-hutan-produksi/
  fetched: '2026-10-31'
  quote: Pemantauan ini menggunakan camera trap dan alat bioakustik.
- claim: Flew drones over Berau in October 2025 to monitor turtle habitat, with East Kalimantan's
    marine office, under the SOMACORE programme.
  url: https://www.ykan.or.id/en/publications/articles/perspectives/innovation-in-turtle-monitoring-using-technology/
  quote: From October 17 to 29, 2025, a new approach took flight over the coastal skies of
    Berau.
  fetched: '2026-10-31'
- claim: Its research agreement with BRIN on rare wildlife includes camera traps and bioacoustics,
    according to its executive director.
  url: https://www.ykan.or.id/id/publikasi/artikel/siaran-pers/brin-kerja-sama-riset-satwa-langka-dengan-ykan/
  quote: seperti penggunaan kamera jebak dan bioakustik
  fetched: '2026-10-31'
- claim: Its director said the BRIN collaboration would trial environmental DNA to measure
    the quality of tropical rainforest.
  url: https://www.ykan.or.id/id/publikasi/artikel/siaran-pers/brin-kerja-sama-riset-satwa-langka-dengan-ykan/
  quote: akan mengujicobakan environmental-DNA (e-DNA) untuk mengukur kualitas lingkungan
    sebuah hutan hujan tropis
  fetched: '2026-10-31'
- claim: The Nature Conservancy's contact page gives its office in South Jakarta.
