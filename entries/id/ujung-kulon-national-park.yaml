summary: A national park run by the forestry ministry, which reported camera traps
  recording a Javan rhino mother and calf in January 2026 and planned technology-based
  population monitoring.
facts:
- claim: A ministry press release on the park’s site says a monitoring team recorded
    a Javan rhino mother and calf with camera traps on 29 January 2026.
  url: https://tnujungkulon.ksdae.kehutanan.go.id/berita/detail/338
  fetched: '2026-11-09'
  quote: Berdasarkan hasil pemantauan lapangan menggunakan kamera jebak (camera trap),
    Tim Monitoring dan Evakuasi Operasi Merah Putih Translokasi Badak Jawa berhasil
    merekam keberadaan seekor induk Badak Jawa bersama anaknya di Taman Nasional Ujung
    Kulon.
- claim: In February 2026, the ministry said it would keep monitoring the whole rhino
    population through the park office, including technology-based monitoring.
  url: https://tnujungkulon.ksdae.kehutanan.go.id/berita/detail/338
  fetched: '2026-11-09'
  quote: Kementerian Kehutanan melalui Balai Taman Nasional Ujung Kulon akan terus
    melakukan pemantauan intensif terhadap induk dan anakan Badak Jawa tersebut, serta
    seluruh populasi Badak Jawa di kawasan.
- claim: Its site gives the office address in Labuan, Pandeglang, Banten.
  url: https://tnujungkulon.ksdae.kehutanan.go.id/berita/detail/338
  fetched: '2026-11-09'
