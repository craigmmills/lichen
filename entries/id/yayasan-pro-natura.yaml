    forest and secondary forest planted after the 1997 fires, with mangrove and small
    rivers.
  url: https://www.mongabay.co.id/2023/08/31/hutan-lindung-sungai-wain-habitatnya-kucing-liar-dilindungi/
  fetched: '2026-11-17'
  quote: Hutan tersebut memiliki dua jenis wilayah, yaitu hutan primer yang merupakan
    hutan asli dan hutan sekunder atau hutan buatan yang dibangun pascakebakaran besar
    tahun 1997 di Balikpapan.
