summary: A proposed revival of the Kewang Laut and sasi tradition by residents of
  Negeri Liang, Central Maluku, which in 2026 a Saniri Negeri Liang deputy head described
  as supervising sasi laut and acting against bombs and poison.
facts:
- claim: Residents of Negeri Liang, Salahutu, Central Maluku, took the initiative
    to revive the Kewang Laut and the sasi tradition to protect coastal ecosystems.
  url: http://mongabay.co.id/2026/10/23/masyarakat-negeri-liang-jaga-laut-lewat-kewang-sasi/
  fetched: '2026-11-17'
  quote: Masyarakat Negeri Liang, Kecamatan Salahutu, Kabupaten Maluku Tengah, Maluku,
    berinisiatif menghidupkan kembali Kewang Laut dan tradisi sasi untuk menjaga ekosistem
    pesisir.
- claim: In 2026 the deputy head of the Saniri Negeri Liang described the Kewang Laut
    role as supervising sasi laut, inspecting fishing gear and acting against violations
    such as bombs and poison.
  url: http://mongabay.co.id/2026/10/23/masyarakat-negeri-liang-jaga-laut-lewat-kewang-sasi/
  fetched: '2026-11-17'
  quote: “Jadi, Kewang Laut berfungsi mengawasi pelaksanaan sasi laut, memeriksa alat
    tangkap dan menindak pelanggaran, termasuk penggunaan bom, bius dan alat tangkap
    yang merusak lingkungan,” kata Abdul Ahmad Lessy, Wakil Ketua Saniri Negeri Liang.
