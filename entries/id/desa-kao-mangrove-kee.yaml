summary: Village whose 400 hectares of mangrove forest the North Halmahera government
  designated an essential ecosystem area, then the only one in Maluku and North Maluku,
  per an August 2020 report.
facts:
- claim: An August 2020 report says the North Halmahera government designated 400
    hectares of Kao’s mangrove forest as an essential ecosystem area, then the only
    one in Maluku and North Maluku.
  url: https://www.mongabay.co.id/2020/08/29/pertama-di-maluku-dan-malut-kawasan-ekosistem-esensial-untuk-konservasi-biota-mangrove-tanjung-boleu/
  fetched: '2026-11-17'
  quote: Usaha konservasi itu diapresiasi oleh Pemerintah Kabupaten Halmahera Utara
    dengan menetapkan kawasan hutan mangrove Desa Kao menjadi (KEE) seluas 400 hektar.
- claim: The August 2020 report says a collaboration forum for managing the area had
    18 members and 19 partner organisations, chaired by the village head.
  url: https://www.mongabay.co.id/2020/08/29/pertama-di-maluku-dan-malut-kawasan-ekosistem-esensial-untuk-konservasi-biota-mangrove-tanjung-boleu/
  fetched: '2026-11-17'
  quote: Forum Kolaborasi Pengelolaan KEE itu total berisi 18 anggota dan 19 mitra
    organisasi, dengan kepala Desa Kao sebagai ketua forum.
