summary: A company founded by Yayasan BOS on 21 April 2009 to manage forest for rehabilitated
  orangutans, holding a restoration permit; a 2025 article says it manages 86,593
  hectares in East Kalimantan.
facts:
- claim: Manages the Kehje Sewen forest in Kutai Timur and Kutai Kartanegara districts,
    East Kalimantan, under an ecosystem restoration permit (IUPHHK-RE) from the Ministry
    of Forestry, according to a 2013 Mongabay Indonesia article.
  url: https://mongabay.co.id/2013/11/29/rumitnya-pelepasliaran-orangutan-bukan-sekedar-rehabilitasi-belaka/
  fetched: '2026-11-17'
  quote: Hutan Kehje Sewen dikelola oleh PT Restorasi Habitat Orangutan Indonesia
    (RHOI) yang telah mendapatkan Izin Usaha Pemanfaatan Hasil Hutan Kayu – Restorasi
    Ekosistem (IUPHHK-RE) dari Kementerian Kehutanan.
- claim: Was founded by Yayasan BOS on 21 April 2009 with the sole aim of managing
    forest sustainably for rehabilitated orangutans from Samboja Lestari.
  url: https://mongabay.co.id/2013/11/29/rumitnya-pelepasliaran-orangutan-bukan-sekedar-rehabilitasi-belaka/
  fetched: '2026-11-17'
  quote: RHOI adalah perusahaan yang didirikan oleh Yayasan BOS pada 21 April 2009
    dengan tujuan tunggal untuk dapat mengelola kawasan hutan secara lestari bagi
    orangutan rehabilitan dari Samboja Lestari.
- claim: A 2025 article says it manages 86,593 hectares of forest in Kutai Timur and
    Kutai Kartanegara, East Kalimantan, since 18 August 2010.
  url: https://mongabay.co.id/2025/06/14/kearifan-masyarakat-adat-wehea-jaga-alam-dan-lindungi-orangutan/
  fetched: '2026-11-17'
  quote: PT RHOI, merupakan perusahaan yang didirikan BOSF untuk mengelola hutan seluas
    86.593 hektar, di Kutai Timur dan Kutai Kartanegara, Kalimantan Timur, sejak 18
    Agustus 2010.
