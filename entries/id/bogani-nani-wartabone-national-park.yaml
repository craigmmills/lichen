summary: National park run by the forestry directorate; WCS Indonesia says its collaboration
  since 2001 includes SMART-supported patrols, camera traps for anoa and babirusa,
  and five maleo nesting sites managed jointly with the park office and communities.
facts:
- claim: WCS Indonesia says its collaboration with the government in the park since
    2001 includes regular patrols supported by SMART.
  url: https://indonesia.wcs.org/en-us/Wild-Places/Bogani-Nani-Wartabone-National-Park.aspx
  fetched: '2026-11-09'
  quote: This collaboration includes the implementation of regular patrols supported
    by the Spatial Monitoring and Reporting Tool (SMART), enabling more effective
    monitoring and protection of critical habitats.
- claim: WCS Indonesia says five maleo nesting sites in the park are managed jointly
    by the National Park Office, WCS Indonesia and local communities.
  url: https://indonesia.wcs.org/en-us/Wild-Places/Bogani-Nani-Wartabone-National-Park.aspx
  fetched: '2026-11-09'
  quote: five maleo nesting sites are currently managed through a collaborative approach
    involving the National Park Office, WCS Indonesia, and local communities from
    surrounding buffer zone villages.
- claim: WCS Indonesia says the programme deploys camera traps across large monitoring
    areas for anoa and babirusa.
  url: https://indonesia.wcs.org/en-us/Wild-Places/Bogani-Nani-Wartabone-National-Park.aspx
  fetched: '2026-11-09'
  quote: Through the deployment of camera traps across extensive monitoring areas,
    the program supports data-driven conservation for key species such as anoa and
    babirusa.
