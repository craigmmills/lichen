facts:
- claim: Was granted an ecosystem restoration licence, to protect and restore degraded
    forest near Bukit Tigapuluh in Sumatra; it was set up by WWF, Frankfurt Zoological
    Society, The Orangutan Project and Rainforest Trust.
  url: https://news.mongabay.com/2015/08/after-long-battle-big-swath-of-sumatran-rainforest-wins-protection/
  fetched: '2026-11-17'
  quote: Indonesia granted the license to PT Alam Bukit Tigapuluh, a for-profit company
    established by a coalition of environmental organizations, including World Wildlife
    Fund (WWF), Frankfurt Zoological Society (FZS), The Orangutan Project, and Rainforest
    Trust
- claim: The licence lets the company protect and restore forests degraded by encroachment
    and logging.
  url: https://news.mongabay.com/2015/08/after-long-battle-big-swath-of-sumatran-rainforest-wins-protection/
  fetched: '2026-11-17'
  quote: The license allows the company to pursue activities that protect and restore
    forests that have been degraded by encroachment and logging.
