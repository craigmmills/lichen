summary: Indonesia's national research and innovation agency. Its head says it works with
  the Ministry of Forestry on hotspot detection and will update this with AI; its researchers
  use LiDAR drones on mangroves.
facts:
- claim: Lists its address in Jakarta.
  url: https://brin.go.id/
  fetched: '2026-10-31'
  quote: Gedung B.J. Habibie, Jl. M.H. Thamrin No. 8
- claim: Its head said in 2026 that it already does hotspot detection with the Ministry of
    Forestry and will update it with AI.
  url: https://setneg.go.id/baca/index/presiden_prabowo_putuskan_bentuk_bpgmn_perkuat_pencegahan_karhutla_dari_desa
  fetched: '2026-10-31'
  quote: sekarang ini kita akan terus perbarui dengan AI yang semakin canggih untuk bisa mengantisipasi
    kebakaran hutan lebih dini lagi
- claim: VOI reports BRIN uses LiDAR drones on mangroves and wants to combine LiDAR with satellite
    images and AI.
  url: https://voi.id/en/amp/485550
  fetched: '2026-10-31'
  quote: BRIN wants to combine LiDAR data with satellite images and Artificial Intelligence
    (AI)
- claim: CloudComputing.id reports the head of its electronics and informatics organisation
    setting out in August 2022 its plans for AI on genomes, including a platform for RNA and
    DNA data.
  url: https://www.cloudcomputing.id/berita/brin-dorong-peningkatan-kolaborasi-ai-biodiversitas
  fetched: '2026-10-31'
  quote: tiga rencana pengembangan AI untuk genom, diantaranya pengembangan tools bioinformatic
    untuk genom, platform repositori dan analisis data RNA dan DNA
- claim: Wikipedia says the Indonesian Institute of Sciences and three other agencies fused
    into BRIN.
  url: https://en.wikipedia.org/wiki/Indonesian_Institute_of_Sciences
  fetched: '2026-10-31'
  quote: All of those agencies fused into the newly formed National Research and Innovation
    Agency
- claim: Researcher Yuliana Susilowati studied Semarang mangroves using AI with Sentinel-2
    and Landsat 8 imagery.
  url: https://rri.co.id/info-kementerian/1843458/brin-ungkap-penurunan-mangrove-di-pesisir-semarang
  fetched: '2026-10-31'
  quote: penelitian menggunakan kecerdasan buatan (AI) dan citra satelit Sentinel 2 serta
    Landsat 8
- claim: The Biodiversitas Nusantara portal says Indonesia takes part in GBIF through BRIN
    as national node.
  url: https://www.gbif.co.id/tentang
  fetched: '2026-10-31'
  quote: Indonesia sendiri merupakan salah satu negara partisipan GBIF melalui BRIN (Badan
    Riset dan Inovasi Nasional) sebagai node nasional.
- claim: Its site gives an address in Central Jakarta.
  url: https://brin.go.id/news/115756/monmang-aplikasi-berbasis-ai-untuk-memantau-hutan-mangrove
  fetched: '2026-10-31'
  quote: 'Alamat: Gedung B.J. Habibie, Jl. M.H. Thamrin No. 8,'
- claim: Its Geoinformatics Research Centre met BIG in August 2026 on linking GEOMIMO and
    Piksel.
  url: https://piksel.big.go.id/blog/
  fetched: '2026-10-31'
  quote: Pusat Riset Geoinformatika, Badan Riset dan Inovasi Nasional (BRIN)
- claim: Worked with YKAN from September 2024 on wildlife monitoring in a production forest
    concession using camera traps and bioacoustic recorders.
  url: https://www.ykan.or.id/id/publikasi/artikel/perspektif/biodiversitas-di-area-hutan-produksi/
  fetched: '2026-10-31'
  quote: Pada September 2024, bekerja sama dengan Badan Riset dan Inovasi Nasional (BRIN),
    YKAN bersama mitra dan masyarakat memulai kegiatan pemantauan tersebut.
- claim: Wikipedia says a 2021 decree made it the sole national research agency, absorbing
    LIPI and others.
  url: https://en.wikipedia.org/wiki/National_Research_and_Innovation_Agency
  fetched: '2026-10-31'
  quote: effectively established BRIN as the sole national research agency
- claim: Wikipedia says LIPI was dissolved on 1 September 2021 and turned into four research
    organisations of BRIN.
  url: https://en.wikipedia.org/wiki/Indonesian_Institute_of_Sciences
  fetched: '2026-10-31'
  quote: LIPI finally dissolved as independent agency and was transformed into four Technical
    Implementing Organizations of BRIN
- claim: GBIF lists butterfly records from across Indonesia among the datasets of its former
    Research Center for Biology.
  url: https://api.gbif.org/v1/organization/07acecfd-5994-47a7-bd1b-ccdbf534973b/publishedDataset?limit=30
  fetched: '2026-10-31'
  quote: Butterfly observation records based on photographs taken by butterfly enthusiasts
    in Indonesia
- claim: Its Life and Environment Research Organisation gives an address at Cibinong.
  url: https://brin.go.id/orhl/pusat-riset-biosistematika-dan-evolusi/page/pusat-riset-biosistematika-dan-evolusi
  fetched: '2026-10-31'
  quote: Jl. Raya Bogor KM. 46, Cibinong 16911
- claim: Uses LiDAR and multispectral drones on mangrove forests and summarises the data in
    a mangrove biodiversity index.
  url: https://voi.id/en/amp/485550
  quote: All data collected will be summarized in the form of mangrove biodiversity index
    (BI) to show the status of biodiversity.
  fetched: '2026-10-31'
