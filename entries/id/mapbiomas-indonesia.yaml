summary: Civil society network mapping Indonesian land cover change year by year. Collection
  1.0 covered 2000 to 2019; its fire product uses deep learning.
facts:
- claim: Released Collection 1.0 of land cover dynamics for 2000 to 2019 in November 2021.
  url: https://indonesia.mapbiomas.org/en/about
  fetched: '2026-10-31'
  quote: MapBiomas Indonesia released Collection 1.0 showing land cover dynamics in Indonesia
    from 2000–2019 on 10 November 2021.
- claim: Its fire methodology applies deep learning using a deep neural network.
  url: https://auriga.or.id/resource/reference/metodologi-fire-koleksi-2.pdf
  fetched: '2026-10-31'
  quote: visual menggunakan Deep Neural Network (DNN).
  ai_type: deep-learning
- claim: Calls itself an Indonesian civil society network formed to encourage land cover transparency.
  url: https://indonesia.mapbiomas.org/en/about
  fetched: '2026-10-31'
  quote: MapBiomas Indonesia is an Indonesian civil society network formed in an effort to
    encourage land cover transparency
- claim: Released Collection 2.0 in October 2023, with 11 land cover classes for 2000 to 2022.
  url: https://indonesia.mapbiomas.org/en/about
  fetched: '2026-10-31'
  quote: Collection 2.0, which contains year-on-year changes for 11 land cover classes in
    Indonesia over the 2000–2022 period, was released on 23 October 2023.
- claim: Its fire method uses machine learning on Google Earth Engine and a Deep Neural Network
    for visual pattern recognition.
  url: https://auriga.or.id/resource/reference/metodologi-fire-koleksi-2.pdf
  fetched: '2026-10-31'
  quote: penerapan deep learning untuk pengenalan pola visual menggunakan Deep Neural Network
    (DNN)
  ai_type: deep-learning
- claim: All maps are pixel-by-pixel classifications of Landsat imagery using machine learning
    on Google Earth Engine.
  url: https://landy.mapbiomas.id/id/atbd
  fetched: '2026-10-31'
  quote: Setiap prosesnya menggunakan algoritma machine learning berbasis cloud ( cloud processing
    ) pada platform Google Earth Engine .
- claim: Maps 13 land cover classes from 1990 to 2024.
  url: https://landy.mapbiomas.id/id/faq
  fetched: '2026-10-31'
  quote: Mapbiomas Indonesia saat ini telah selesai memetakan 13 kelas tutupan lahan pada
    rentang 1990 – 2024 di Indonesia.
- claim: Uses supervised classification on Landsat mosaics.
  url: https://landy.mapbiomas.id/id/atbd
  fetched: '2026-10-31'
  quote: Klasifikasi terbimbing ( supervised classification ) dilakukan terhadap mosaik Landsat
  ai_type: ml-supervised
- claim: Its fire initiative maps burned area with a deep learning approach.
  url: https://indonesia.mapbiomas.org/id
  fetched: '2026-10-31'
  quote: pendekatan deep learning terhadap citra satelit
  ai_type: deep-learning
