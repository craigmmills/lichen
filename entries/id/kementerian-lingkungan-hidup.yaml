- claim: Worked in a consortium with Bappenas, BRIN, GIZ and the Ministry of Forestry on three
    books on the status of Indonesian biodiversity.
  url: https://kemenlh.go.id/news/detail/status-kehati-indonesia-diluncurkan-klhbplh-bappenas-dorong-tata-kelola-berkelanjutan
