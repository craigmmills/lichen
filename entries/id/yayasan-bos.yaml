facts:
- claim: Founded PT RHOI in 2009 to manage forest for rehabilitated orangutans; a
    2013 article names the forest it manages as Kehje Sewen in East Kalimantan.
  url: https://mongabay.co.id/2013/11/29/rumitnya-pelepasliaran-orangutan-bukan-sekedar-rehabilitasi-belaka/
  fetched: '2026-11-17'
  quote: RHOI adalah perusahaan yang didirikan oleh Yayasan BOS pada 21 April 2009
    dengan tujuan tunggal untuk dapat mengelola kawasan hutan secara lestari bagi
    orangutan rehabilitan dari Samboja Lestari.
- claim: A 2025 Mongabay Indonesia item says the foundation released orangutans into
    the Kehje Sewen forest on 22 April 2025 and that the forest's capacity for releases
    has reached its maximum.
  url: https://mongabay.co.id/video/pulang-ke-rimba-masa-depan-orangutan-kalimantan-di-kehje-sewen/
  fetched: '2026-11-17'
  quote: Jamartin Sihite, CEO BOSF, mengungkapkan bahwa kapasitas Hutan Kehje Sewen
    untuk pelepasliaran telah mencapai batas maksimum.
