facts:
- claim: Its village's village forest working area is 995 hectares in Kepahiang district,
    Bengkulu, set by a 2010 forestry ministry decree; a 2011 village regulation created
    the LPHD.
  url: https://mongabay.co.id/2017/08/31/depati-junjung-hutan-desa-yang-potensinya-menjanjikan/
  fetched: '2026-11-17'
  quote: 'Ada Keputusan Menteri Kehutanan Nomor: SK.667/Menhut-II/2010 tentang Penetapan
    Kawasan Sebagai Areal Kerja HD Taba Panjang seluas 995 hektare di Kabupaten Kepahiang,
    Provinsi Bengkulu.'
- claim: A 2017 article reports that after management rights were granted, the LPHD
    coordinated planting of about 67,000 trees; its head said tree felling had stopped.
  url: https://mongabay.co.id/2017/08/31/depati-junjung-hutan-desa-yang-potensinya-menjanjikan/
