  url: https://burung.org/en/about-us/
  fetched: '2026-11-17'
  quote: The Birdlife Indonesia Association, or Burung Indonesia, is an Indonesian
    legal organization which was founded on 15 th July 2002 in the purpose of conserving
    Indonesian wild birds and their habitats.
- claim: With BirdLife International and RSPB it founded Yayasan Konservasi Ekosistem
    Hutan Indonesia (Yakehi) so that a company could hold the Hutan Harapan concession;
    PT REKI holds the licences for 52,170 hectares in South Sumatra and 46,385 hectares
    in Jambi.
