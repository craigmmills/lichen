  though another source reports 314.
facts:
- claim: The President handed over its customary forest recognition letter in December
    2016 for 313 hectares in Bulukumba district.
  url: https://setkab.go.id/?p=105159
  fetched: '2026-11-17'
  quote: Hutan Adat Ammatoa Kajang (313 Ha) Kabupaten Bulukumba Provinsi Sulawesi
