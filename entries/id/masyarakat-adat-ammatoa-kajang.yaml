- claim: Green Network reports that the Bulukumba government recognised and protected
    the community’s rights from 2015 and the forestry ministry recognised 314 hectares
    in 2016; the presidential handover page lists 313 hectares.
  url: https://greennetwork.id/kabar/bagaimana-suku-kajang-mengelola-dan-melestarikan-hutan-dengan-kearifan-lokal
