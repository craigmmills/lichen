summary: An association that describes its work as protecting wildlife through forest
  conservation, and that co-manages the 2,546.9 hectare Dulan reserve in Central Kalimantan
  and reports a 306.5 hectare Pararawen reserve.
facts:
- claim: Co-manages the 2,546.9 hectare Dulan reserve in Central Kalimantan with ANUA
    and the local communities; the forest was secured by compensating local landowners
    in 2019.
  url: https://kalaweit.org/?p=857
  fetched: '2026-11-17'
  quote: It was then established as a community-protected forest , and is co-managed
    by Kalaweit and ANUA and the local communities.
- claim: Reports that its Pararawen reserve borders its camp and covers 306.5 hectares
    of secondary forest.
  url: https://kalaweit.org/?p=857
  fetched: '2026-11-17'
  quote: It borders our Pararawen camp, and covers 306,5 hectares.
- claim: Describes itself as an association that, through forest conservation, works
    to protect wildlife.
  url: https://kalaweit.org/?p=27
  fetched: '2026-11-17'
  quote: Through its forest conservation efforts, the association works to protect
    wildlife and allows local populations to live in a preserved natural environment.
