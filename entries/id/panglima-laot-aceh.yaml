summary: A customary sea institution in Aceh that leads customary fishing practice,
  including setting fishing grounds and mooring, settling disputes, and applying customary
  sea law on area limits, closed days and conservation.
facts:
- claim: After independence its task became leading customary practice in sea fishing,
    including setting fishing grounds, boat moorings and settling disputes.
  url: https://mongabay.co.id/2019/06/27/melihat-masa-depan-panglima-laot-di-aceh/
  fetched: '2026-11-17'
  quote: Pada masa setelah kemerdekaan diraih, tugas dan peran Panglima Laot beralih
    sebagai pemimpin adat dan mengatur kebiasaan yang berlaku dibidang penangkapan
    ikan di laut, termasuk mengatur wilayah penangkapan, penambatan perahu dan penyelesaian
    konflik.
- claim: Aceh's customary sea law covers area limits, closed fishing days and environmental
    conservation.
  url: https://mongabay.co.id/2019/06/27/melihat-masa-depan-panglima-laot-di-aceh/
  fetched: '2026-11-17'
  quote: Hukum adat laot Aceh mengatur berbagai hal terkait aktivitas di sektor kelautan.
    Mulai dari penerapan batasan wilayah, hari pantang melaut, pelestarian lingkungan,
    pelaksanaan ritual, relasi sosial dan ketentuan lain.
