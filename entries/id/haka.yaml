summary: Community group in Aceh that uses Global Forest Watch alerts and the Forest Watcher
  app to monitor deforestation in the Leuser Ecosystem.
facts:
- claim: Global Forest Watch describes it as a community group in Aceh using Forest Watcher.
  url: https://www.globalforestwatch.org/blog/people/video-patrol-the-leuser-ecosystem-with-forest-defenders-at-haka/
  fetched: '2026-10-31'
  quote: A community group in Aceh, Indonesia uses Forest Watcher to monitor deforestation
- claim: WRI calls it a local partner of Global Forest Watch.
  url: https://www.wri.org/insights/global-forest-watch-glad-alerts-help-protect-sumatras-leuser-rainforest-ecosystem
  fetched: '2026-10-31'
  quote: Global Forest Watch works with local partner HAkA to protect this distinctive area
- claim: A 2025 presentation hosted by GFOI R&D describes it as a grassroots NGO that uses
    alerts to coordinate field investigations.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_06_LPS/Presentation4.pdf
  fetched: '2026-10-31'
  quote: HAkA, a grassroots NGO based in Indonesia use alerts on GFW to coordinate field investigations
    on deforestation
- claim: Will use near-real-time alerts in the Tamiang and Jambo Aye river basins after Cyclone
    Senyar.
  url: https://www.globalforestwatch.org/blog/users-in-action/2026-global-nature-watch-small-grants-fund-recipients/
  fetched: '2026-10-31'
  quote: the Tamiang and Jambo Aye river basins
- claim: Monitors forest cover across the Leuser Ecosystem and Aceh with satellite imagery,
    drones and field checks.
  url: https://haka.or.id/
  fetched: '2026-10-31'
  quote: HAkA terus memantau perubahan tutupan hutan di seluruh Kawasan Ekosistem Leuser dan
    Aceh menggunakan citra satelit, drones dan cek lapangan.
- claim: Won the 2026 Whitley Gold Award to monitor vulnerable watersheds with geospatial
    technologies.
  url: https://haka.or.id/en/farwiza-farhan-and-haka-win-the-2026-whitley-gold-award/
  fetched: '2026-10-31'
  quote: Farwiza and her team will monitor vulnerable watersheds in Aceh through advanced
    geospatial technologies
