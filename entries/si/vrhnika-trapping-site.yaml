summary: Ornithological station founded in 1987, run by the Slovenian Bird Ringing
  Centre, with annual ringing from mid-July to October’s end and a barn swallow study
  begun in 1987.
facts:
- claim: The Slovenian Bird Ringing Centre says the Vrhnika Trapping Site was founded
    in 1987 as an ornithological station to monitor bird migration regularly, with
    ringing every year during migration from mid-July to the end of October.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: '2026-11-13'
  quote: Thus, in 1987, the Vrhnika Trapping Site was founded, where every year, particularly
    during migration (from mid-July to the end of October), bird ringing has been
    carried out on a regular basis.
- claim: The centre says it began an in-depth study of the barn swallow when the site
    began operating in 1987, and joined the EURING Swallow Project in 1997.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: '2026-11-13'
  quote: When the Vrhnika Trapping Site began operating in 1987, we embarked on an
    in-depth study of the Barn Swallow
