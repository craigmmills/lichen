summary: Active national programme, set up in its current form in 2020 and built by the Slovenian Forestry
  Institute, whose data monitor forest state and change nationally, regionally and in international reports.
facts:
- claim: Set up in its current form in Slovenia in 2020, developed within the department that carries
    out the public forestry service.
  url: http://www.gozdis.si/nacionalna-gozdna-inventura-in-monitoring-gozdov/
  fetched: 2026-11-08
  quote: Med njimi je največji poudarek namenjen nacionalni gozdni inventuri (NGI), ki je bila v Sloveniji
    v sedanji obliki vzpostavljena leta 2020.
- claim: Its data are used to monitor the state of and changes in forests at national and regional level,
    and in international reports.
  url: http://www.gozdis.si/nacionalna-gozdna-inventura-in-monitoring-gozdov/
  fetched: 2026-11-08
  quote: Podatki NGI služijo za spremljanje stanja in sprememb gozdov na nacionalni in regionalni ravni.
    Uporabljeni so v različnih mednarodnih poročilih.
- claim: The national forest inventory was set up in Slovenia in its current form in 2020.
