summary: Slovenian surveying authority that signed a January 2026 public administration agreement with
  Planet Labs, citing forest monitoring as one use.
facts:
- claim: Signed a strategic agreement for the whole public administration with Planet Labs Germany GmbH
    in January 2026.
  url: https://www.gov.si/novice/2026-01-28-gurs-sklenil-strateski-sporazum-s-podjetjem-planet-za-uporabo-satelitskih-podatkov-v-javni-upravi/
  fetched: '2026-11-08'
  quote: Geodetska uprava Republike Slovenije (GURS) je januarja 2026 sklenila strateški sporazum na ravni
    celotne javne uprave s podjetjem Planet Labs Germany GmbH
- claim: Says the satellite data will be a basis for studies including forest monitoring and tracking
    changes in the built and natural environment.
  url: https://www.gov.si/novice/2026-01-28-gurs-sklenil-strateski-sporazum-s-podjetjem-planet-za-uporabo-satelitskih-podatkov-v-javni-upravi/
  fetched: '2026-11-08'
  quote: med drugim za spremljanje gozdov in kmetijstva, trajnostno prostorsko in urbano načrtovanje,
    spremljanje sprememb v grajenem in naravnem okolju
- claim: Has begun developing a digital twin of Slovenia under the SLO4D initiative.
  url: https://www.gov.si/novice/2026-01-28-gurs-sklenil-strateski-sporazum-s-podjetjem-planet-za-uporabo-satelitskih-podatkov-v-javni-upravi/
  fetched: '2026-11-08'
  quote: v digitalnem dvojčku Slovenije, ki ga je GURS začel razvijati v okviru pobude SLO4D
- claim: Presented its key tasks and the role of geodetic data in spatial planning to a delegation from
    Kosovo in October 2026.
  url: http://www.gu.gov.si/
  fetched: 2026-11-08
  quote: predstavila svoje ključne naloge in vlogo geodetskih podatkov pri prostorskem načrtovanju
