summary: LIFE project led by Notranjska Regional Park to improve conservation of intermittent
  Lake Cerknica, with water level and temperature sensors installed at eight priority
  areas in August 2024.
facts:
- claim: The project page says the project aims to improve the conservation status
    of the intermittent Lake Cerknica.
  url: https://notranjski-park.si/en/latest/news/life-trsca-establishment-of-continuous-water-level-measurements-for-monitoring-the-drying-up-of-various-lake-parts
  fetched: '2026-11-15'
  quote: With LIFE TRŠCA we will improve the conservation status of the intermittent
    Lake Cerknica.
- claim: In August 2024 automatic water level (pressure) and water temperature sensors
    were installed at eight priority areas, chosen with Notranjska Park.
  url: https://notranjski-park.si/en/latest/news/life-trsca-establishment-of-continuous-water-level-measurements-for-monitoring-the-drying-up-of-various-lake-parts
  fetched: '2026-11-15'
  quote: we installed automatic water level (pressure) sensors and water temperature
    sensors
- claim: The measurements are meant to give insight into water level dynamics around
    reed beds and lake basins and the local habitat types, and will continue until
    at least the end of 2029.
  url: https://notranjski-park.si/en/latest/news/life-trsca-establishment-of-continuous-water-level-measurements-for-monitoring-the-drying-up-of-various-lake-parts
