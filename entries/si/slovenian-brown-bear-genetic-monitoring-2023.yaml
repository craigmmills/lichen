  quote: Vse omenjeno je opravil Zavod za gozdove Slovenije (ZGS) v sodelovanju s
    prostovoljci.
- claim: The news says 2,863 samples were collected, 2,856 of them from bear scats.
  url: https://www.gov.si/novice/2026-03-12-porocilo-monitoringa-o-oceni-stevilcnosti-rjavega-medveda-v-sloveniji-v-letu-2023/
  fetched: '2026-11-13'
  quote: Zbranih je bilo 2863 vzorcev, od tega 2856 vzorcev iz iztrebkov medveda
- claim: The news gives the minimum autumn population for 2023 as 737 bears (695 to
    797).
  url: https://www.gov.si/novice/2026-03-12-porocilo-monitoringa-o-oceni-stevilcnosti-rjavega-medveda-v-sloveniji-v-letu-2023/
  fetched: '2026-11-13'
  quote: Najmanjša letna (jesenska) številčnost za leto 2023 znaša 737 oziroma 695–797
    medvedov.
- claim: The news says Slovenia's bear monitoring system repeats genetic abundance
    estimates every eight years, with yearly estimates from mortality data and counts
    at counting sites.
