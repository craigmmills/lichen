summary: Genetic estimate of Slovenia's brown bear numbers from 2,863 samples collected
  in 2023, reported by the ministry as a minimum autumn population of 737 bears, run
  by the Slovenia Forest Service.
facts:
- claim: The ministry's news says samples were collected in 2023 and selected in January
    2024 by the Slovenia Forest Service with volunteers, and that the Forest Service
    prepared the final report in 2025.
