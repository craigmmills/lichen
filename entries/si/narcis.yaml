summary: Slovenian species information system, built in the LIFE NarcIS project and run by the environment
  agency, holding almost 21,000 of an estimated 37,000 or more recorded species in October 2026.
facts:
- claim: Pages on the animal, plant and fungus species recorded in Slovenia are now fully open in NarcIS;
    other content is for registered users, and registration is free.
  url: https://www.gov.si/novice/2026-10-19-poznavanja-in-varstvo-narave-v-sloveniji-za-vse/
  fetched: '2026-11-08'
  quote: V informacijskem sistemu za naravo v Sloveniji – NarcIS so odslej v celoti dostopne strani o
    v Sloveniji zabeleženih vrstah živali, rastlin in gliv in del vsebin varstva narave.
- claim: In October 2026, held almost 21,000 of the at least 37,000 species estimated to have been recorded
    in Slovenia.
  url: https://www.gov.si/novice/2026-10-19-poznavanja-in-varstvo-narave-v-sloveniji-za-vse/
  fetched: '2026-11-08'
  quote: v sistemu jih je trenutno že skoraj 21 tisoč
- claim: The species search gives access to records of species finds, with distribution maps and conservation
    status on each species card.
  url: https://www.gov.si/novice/2026-10-19-poznavanja-in-varstvo-narave-v-sloveniji-za-vse/
  fetched: '2026-11-08'
  quote: Prek Iskalnika vrst lahko dostopate do podatkov o najdbah vrst, ki so že vključene v NarcIS.
- claim: Was developed in the LIFE NarcIS project.
  url: https://www.gov.si/novice/2026-10-19-poznavanja-in-varstvo-narave-v-sloveniji-za-vse/
  fetched: '2026-11-08'
  quote: NarcIS je bil razvit v projektu LIFE NarcIS
