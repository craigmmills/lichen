summary: Park authority that monitors cave water, microclimate, flora, fauna and ozone,
  and says most of its research now aims at continuous monitoring of the park.
facts:
- claim: Monitors regularly the quality and quantity of water in the cave, the cave
    microclimate, surface flora and fauna, cave fauna, cracks in the cave and doline
    walls, and ground-level ozone.
  url: https://www.park-skocjanske-jame.si/en/read/parks-management/projects-and-research-activities
  fetched: 2026-11-12
  quote: 'For this purpose, different factors are monitored regularly: quality and
    quantity of water in the cave, microclimate in the cave, flora and fauna on the
    surface, cave fauna'
- claim: Says most of its research activity is now aimed at setting up continuous
    monitoring of the park.
  url: https://www.park-skocjanske-jame.si/en/read/parks-management/projects-and-research-activities
  fetched: 2026-11-12
  quote: the majority of activity is now oriented towards the establishment of continuous
    monitoring
- claim: Was the applicant for the 2005 to 2007 Interreg project Underground Reka
    River Monitoring, which aimed to establish continuous monitoring of water flowing
    from the Reka River into the Karst aquifer.
  url: https://www.park-skocjanske-jame.si/en/read/parks-management/projects-and-research-activities
  fetched: 2026-11-12
  quote: 'Title : Establishment of monitoring of the Reka River''s subterranean course;
    acronym: URM ( Underground Reka River Monitoring )'
