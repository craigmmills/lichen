facts:
- claim: Functions within the Slovenian Museum of Natural History, in its Vertebrate Department.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: 2026-11-12
  quote: currently functioning as the Slovenian Bird Ringing Center (SCOP) within the Museum's
    Vertebrate Department
- claim: Rings more than 100,000 birds a year.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: 2026-11-12
  quote: presently we ring more than 100,000 of them per year
- claim: The Vrhnika Trapping Site, founded in 1987, carries out regular ringing each year,
    particularly during migration.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: 2026-11-12
  quote: in 1987, the Vrhnika Trapping Site was founded, where every year, particularly during
    migration (from mid-July to the end of October), bird ringing has been carried out on
    a regular basis.
- claim: Ringing in Slovenia has relied largely on volunteer associates; 55 people acquired
    a ringing permit in 2010.
  url: https://www.pms-lj.si/en/birds/slovenian-bird-ringing-center/
  fetched: 2026-11-12
  quote: In 2010, 55 persons acquired the bird ringing permit.
