summary: Based at the Tular Cave Laboratory in Kranj, the society reports a Proteus
  eDNA study published in March 2017 after sampling 56 karst sites.
facts:
- claim: The society says the Tular Cave Laboratory and partners developed a molecular
    genetic tool to detect Proteus environmental DNA by filtering groundwater samples,
    with findings published in March 2017.
  url: https://tular.si/index.php/conservation
  fetched: '2026-11-15'
  quote: Tular Cave Laboratory (Society for Cave Biology) & partners developed a research
    tool to overcome the critical problem when determining Proteus occurrence
- claim: The society says the study published in March 2017 sampled and analysed 56
    karst springs, wells or caves in Slovenia, Bosnia and Herzegovina and Montenegro.
  url: https://tular.si/index.php/conservation
  fetched: '2026-11-15'
  quote: 56 karst springs, wells or caves in Slovenia, Bosnia & Herzegovina and Montenegro
    were sampled and analysed
