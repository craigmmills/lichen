  fetched: 2026-11-12
  quote: An information system called "INVAZIVKE" was developed and set up in 2017
    within the project.
- claim: Designated experts for each taxonomic group are informed once a day and asked
    to verify the identification.
  url: https://www.gozdis.si/f/docs/posterji/Poster_Zidaretal2023_CitizenScience-ForestProtection.pdf
  fetched: 2026-11-12
  quote: Once per day the designated taxonomic group experts are then informed and
    asked to verify the determination.
