summary: Slovenia's public nature conservation body, which manages biodiversity databases, monitors conservation
  status, and says it has carried out over thirty internationally or European-funded projects in ten years.
facts:
- claim: Carries out the public nature conservation service and the tasks set by the Nature Conservation
    Act, as well as a range of projects.
  url: https://zrsvn-varstvonarave.si/
  fetched: '2026-11-08'
  quote: Zavod RS za varstvo narave poleg javne službe ohranjanja narave in nalog določenih z Zakonom
    o ohranjanju narave, izvaja tudi vrsto projektov
- claim: Says it has carried out more than thirty projects in the last ten years with international and
    European funding such as LIFE.
  url: https://zrsvn-varstvonarave.si/
  fetched: '2026-11-08'
  quote: V zadnjih desetih letih smo uspešno izvedli več kot trideset projektov sofinanciranih iz različnih
    mednarodnih finančnih mehanizmov
- claim: Its site links to a species reporting service and to the nature conservation atlas.
  url: https://zrsvn-varstvonarave.si/
  fetched: '2026-11-08'
  quote: SPOROČI VRSTO NARAVOVARSTVENI ATLAS
- claim: Was the financial source of a 2019 to 2020 ZRC SAZU project mapping landscape structures important
    for biodiversity with remote sensing.
  url: https://iaps.zrc-sazu.si/en/programi-in-projekti/feasibility-study-and-mapping-of-vegetative-landscape-structures-important-for
  fetched: '2026-11-08'
  quote: Financial Source Institute of the Republic of Slovenia for Nature Conservation
- claim: Its tasks under the nature protection law include collecting data on plant and animal species,
    their habitats and ecosystems, in cooperation with implementers of public works in natural resources
    management.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: collection of data on plant and animal species, their habitats and ecosystems
- claim: Its tasks include managing databases on natural features and biodiversity components.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: management of databases concerning natural riches and biodiversity components
- claim: Its tasks include monitoring the state of nature conservation and biodiversity.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: monitoring of the state of nature preservation, biodiversity and the state of natural riches
- claim: Its tasks include managing protected areas established by the state, where the protection act
    provides for it.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: management of protected areas established by the state (if so stipulated in the protection act)
- claim: Says it is Slovenia's professional body for implementing the CITES convention.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: The IRSNC is a professional body of the Republic of Slovenia for the implementation of the CITES
    international convention
- claim: Its address is Tobačna ulica 5, Ljubljana.
  url: https://zrsvn-varstvonarave.si/vocation-and-tasks/
  fetched: 2026-11-08
  quote: Tobacna ulica 5
