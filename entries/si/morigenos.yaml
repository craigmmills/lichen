facts:
- claim: Has systematically collected data on bottlenose dolphins in the northern Adriatic and Slovenian
    waters since 2002.
  url: https://www.morigenos.org/monitoring-of-dolphins-in-slovenian-waters-for-the-period-2025-2026/
  fetched: '2026-11-08'
  quote: Since 2002, Morigenos – Slovenian Marine Mammal Society has been systematically collecting data
    on this species
- claim: Runs a project from March 2025 to November 2026, funded under the European Maritime, Fisheries
    and Aquaculture Fund, to estimate the number of bottlenose dolphins regularly present in Slovenian
    waters by photo-identification.
  url: https://www.morigenos.org/monitoring-of-dolphins-in-slovenian-waters-for-the-period-2025-2026/
  fetched: '2026-11-08'
  quote: Estimation of the number of bottlenose dolphins regularly present in Slovenian waters using photo-identification
    methods;
- claim: Contributed data to the development of a deep learning model for cetacean identification, published
    in Methods in Ecology and Evolution in 2023.
