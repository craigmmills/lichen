summary: Slovenian fisheries institute that prepared the 2021 Natura 2000 report on
  the Italian barbel for the environment ministry, using its sampling data and citing
  its BIOS biological database.
facts:
- claim: A ministry call says the Government of Slovenia appoints the founder's representatives
    to the institute's council, one each on the proposal of three ministries.
  url: https://www.gov.si/zbirke/javne-objave/javni-poziv-za-izbiro-kandidatov-za-predstavnike-ustanovitelja-v-svetu-zavoda-za-ribistvo-slovenije/
  fetched: '2026-11-15'
  quote: Predstavnike ustanovitelja v svet Zavoda za ribištvo Slovenije imenuje Vlada
    Republike Slovenije za mandatno obdobje štirih let.
- claim: The 2021 Natura 2000 report on the Italian barbel (Barbus plebejus) was prepared
    by the institute under a contract with the Ministry of the Environment and Spatial
    Planning.
  url: https://natura2000.gov.si/fileadmin/user_upload/Natura_2000_Grba_2021.pdf
  fetched: '2026-11-15'
  quote: osnovi pogodbe št. 2550-21-330009 , ki je bila sklenjena med Ministrstvom
    za okolje in prostor
- claim: The report names the institute as the other party to that contract.
  url: https://natura2000.gov.si/fileadmin/user_upload/Natura_2000_Grba_2021.pdf
  fetched: '2026-11-15'
  quote: Republike Slovenije in Zavodom za ribištvo Slovenije.
- claim: The 2021 report's analysis included all available institute sampling data
    within the individual biogeographical regions and Natura 2000 areas.
  url: https://natura2000.gov.si/fileadmin/user_upload/Natura_2000_Grba_2021.pdf
  fetched: '2026-11-15'
  quote: V analizo smo vključili vse razpoložljive podatke vzorčenj Zavoda za ribištvo
    Slovenije
- claim: The report cites BIOS, the institute's biological database.
  url: https://natura2000.gov.si/fileadmin/user_upload/Natura_2000_Grba_2021.pdf
  fetched: '2026-11-15'
  quote: ZZRS, 2021. BIOS - Biološka zbirka podatkov Zavoda za ribištvo Slovenije.
