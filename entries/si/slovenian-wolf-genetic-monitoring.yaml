summary: Wolf monitoring commissioned by the Ministry of Natural Resources and Spatial
  Planning collected 811 non-invasive genetic samples in 2024–2025 and estimated population
  size using capture-mark-recapture.
facts:
- claim: The 2024-2025 season was the sixth round of wolf monitoring in Slovenia since
    2010, commissioned by the Ministry of Natural Resources and Spatial Planning.
  url: https://www.gov.si/novice/2026-03-12-porocilo-o-spremljanju-stanja-ohranjenosti-volka-v-sloveniji-v-letih-2024-in-2025/
  fetched: 2026-11-12
  quote: Gre za šesto izvedbo monitoringa volka na območju Slovenije od leta 2010,
    ki ga je naročilo Ministrstvo za naravne vire in prostor.
- claim: In the 2024–2025 season, non-invasive genetic sampling collected 811 samples,
    most of them scats.
  url: https://www.gov.si/novice/2026-03-12-porocilo-o-spremljanju-stanja-ohranjenosti-volka-v-sloveniji-v-letih-2024-in-2025/
  fetched: 2026-11-12
  quote: Z neinvazivnim genetskim vzorčenjem je bilo zbranih 811 vzorcev, od tega
    674 vzorcev iztrebkov, 127 vzorcev urina in 10 vzorcev sline.
- claim: For the 2024–2025 season, the size of the Slovenian part of the wolf population
    was estimated by capture-mark-recapture from genetic results, and pack numbers
    from relatedness between individuals.
  url: https://www.gov.si/novice/2026-03-12-porocilo-o-spremljanju-stanja-ohranjenosti-volka-v-sloveniji-v-letih-2024-in-2025/
  fetched: 2026-11-12
  quote: Na podlagi rezultatov genetskih analiz je bila s pomočjo znanstvene metode
    ulova, označevanja in ponovnega ulova ocenjena velikost slovenskega dela populacije
    volkov
- claim: The 2022-2023 round was carried out by the Slovenia Forest Service under
    a contract with the ministry.
  url: https://www.gov.si/assets/ministrstva/MNVP/Dokumenti/Narava/Velike-zveri/Spremljanje_stanja_volka_2022_23.pdf
  fetched: 2026-11-12
