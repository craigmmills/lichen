summary: Project that plans to use environmental DNA to assess marine fauna in the northern Adriatic and
  to develop individual-level marine mammal identification, with a first sampling device prototype tested
  in Piran in June 2024.
facts:
- claim: Will use environmental DNA to assess the diversity of marine fauna in the northern Adriatic and
    provide data for guidelines on using eDNA in marine biodiversity monitoring.
  url: https://www.ita-slo.eu/sl/novice-in-dogodki/novice/uvodni-sestanek-projekta-seainsights
  fetched: '2026-11-08'
  quote: V projektu SeaInsights bodo z uporabo okoljske DNK (eDNA) ocenili raznolikost morske favne severnega
    Jadrana
- claim: Will develop and test tools for identifying marine mammals at individual level from eDNA.
  url: https://www.ita-slo.eu/sl/novice-in-dogodki/novice/uvodni-sestanek-projekta-seainsights
  fetched: '2026-11-08'
  quote: Razvili in testirali bodo inovativna orodja za identifikacijo morskih sesalcev na individualni
    ravni s pomočjo eDNA.
- claim: In June 2024 partners tested the first prototype of a device for sampling eDNA from water in
    Piran.
  url: https://www.ita-slo.eu/sl/novice-in-dogodki/novice/prvi-preizkus-naprave-za-vzorcenje-edna-iz-vode
  fetched: '2026-11-08'
  quote: V mesecu juniju so projektni partnerji Morigenos, DBC in Shoreline v Piranu preizkusili prvi
    prototip naprave za vzorčenje eDNA iz vode.
