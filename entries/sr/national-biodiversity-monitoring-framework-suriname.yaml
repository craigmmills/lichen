facts:
- claim: The Ministry of Oil, Gas and Environment, with UNDP, held a validation workshop
    for the framework and its monitoring system on 9 June 2026.
  url: https://gov.sr/suriname-zet-volgende-stap-naar-nationaal-biodiversiteitsmonitoringssysteem/
  fetched: 2026-11-12
  quote: Het Ministerie van Olie, Gas en Milieu (OGM) heeft in samenwerking met het
    United Nations Development Programme (UNDP) op 9 juni 2026 een validatieworkshop
    gehouden voor het Nationaal Biodiversiteits Monitoring Framework en het bijbehorende
    Monitoringsysteem.
- claim: The draft framework includes a tiered monitoring system, a Pressure-State-Response
    model and a three-layer data management system.
  url: https://gov.sr/suriname-zet-volgende-stap-naar-nationaal-biodiversiteitsmonitoringssysteem/
  fetched: 2026-11-12
  quote: Verder is gekozen voor een drielaags databeheersysteem, waardoor gevoelige
    informatie en traditionele kennis beter beschermd kunnen worden.
- claim: First steps towards implementing a national biodiversity monitoring system
    can follow once the monitoring system is validated.
  url: https://gov.sr/suriname-zet-volgende-stap-naar-nationaal-biodiversiteitsmonitoringssysteem/
  fetched: 2026-11-12
  quote: Na validatie van het monitoringsysteem zullen eerste stappen genomen kunnen
    worden gezet richting de implementatie van een nationaal biodiversiteitsmonitoringssysteem
    in Suriname.
