    System and says its transition to replace LogPro was in progress, aiming to improve
    monitoring of timber harvesting and trade.
  url: https://www.timbertradeportal.com/en/news/3/improved-timber-production-control-in-suriname
  fetched: 2026-11-12
  quote: The Sustainable Forestry Information System Suriname (SFISS) is part of the
    National Forest Monitoring System (NFMS) and will replace the present log tracking
    system (LogPro)
- claim: In June 2020, the Timber Trade Portal reported that all timber harvesting
    operations had been approved and monitored under SFISS since mid-2019.
  url: https://www.timbertradeportal.com/en/news/3/improved-timber-production-control-in-suriname
