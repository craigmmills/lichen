summary: The WWF Guianas office, established in Suriname in 1999, which a 2019 presentation says manages
  a nesting beach monitoring and enforcement programme with government agencies and which funded the 2026-2035
  sea turtle plan.
facts:
- claim: A 2019 WWF Guianas presentation says WWF manages a long-term nesting beach monitoring and enforcement
    programme with government agencies, from February to July.
  url: https://www.widecast.org/What/AnnualMeeting/2019/2019%20Van%20Lavieren,%20WWF%20Guianas%20Sea%20Turtle%20Programme%20in%20Suriname.pdf
  fetched: 2026-11-08
  quote: WWF manages a long-term nesting beach monitoring and enforcement (beach patrolling) program together
    with relevant government agencies
- claim: The same presentation lists data collected on nests, false crawls, dead turtles, threats, illegal
    practices and beach erosion.
  url: https://www.widecast.org/What/AnnualMeeting/2019/2019%20Van%20Lavieren,%20WWF%20Guianas%20Sea%20Turtle%20Programme%20in%20Suriname.pdf
  fetched: 2026-11-08
  quote: Data collection on nests, false crawls, dead turtles, threats, illegal practices, beach erosion
- claim: Suriname's Sea Turtle Recovery Action Plan 2026-2035 was made possible through funding from WWF-Guianas.
  url: https://www.widecast.org/Resources/Docs/STRAP_Suriname_2026.pdf
  fetched: 2026-11-08
  quote: Suriname’s Sea Turtle Recovery Action Plan was made possible through funding provided by WWF-Guianas
- claim: The plan records the establishment of a WWF-Guianas office in Suriname in 1999.
  url: https://www.widecast.org/Resources/Docs/STRAP_Suriname_2026.pdf
  fetched: 2026-11-08
  quote: sea turtle conservation efforts, including the establishment of a WWF-Guianas office in Suriname
    in 1999.
