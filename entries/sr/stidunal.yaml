facts:
- claim: A March 2023 report said Stidunal coordinated monitoring in Galibi, including
    mapping jaguars and monitoring sea turtles with SMART in WWF-Guianas projects;
    it called the foundation Stichting Duurzame Natuurbehoud Alusiaka.
  url: https://www.waterkant.net/suriname/2023/03/01/opening-educatiecentra-braamspunt-en-galibi-en-zonne-energie-voorziening-te-galibi/
  fetched: 2026-11-13
  quote: De monitoringsactiviteiten zorgen voor werkgelegenheid in Galibi en worden
    gecoördineerd door de lokale Stichting Duurzame Natuurbehoud Alusiaka (Stidunal).
- claim: From March to mid-June 2023, game wardens and trained community data collectors
    of Stidunal recorded nests, species, poaching and hatchlings on the nesting beaches.
  url: https://abcsuriname.com/nogsteeds-zorgen-over-toekomst-zeeschildpadden-in-suriname/
  fetched: 2026-11-13
  quote: Van maart t/m half juni 2023 is door jachtopzieners en getrainde gemeenschaps-
    dataverzamelaars van Stidunal bijgehouden hoeveel nesten er zijn
- claim: In the 2023 season, the Galibi foundation worked with the Nature Conservation
    Division on sea turtle monitoring supported by WWF-Guianas.
