    protocol.
- claim: The Nature Conservation Division, with support from WWF-Guianas, analysed
    the legacy dataset using Wildlife Insights tools.
  url: https://www.wildlifeinsights.org/stories/long-term-monitoring-baselines-provide-insights-protect-against-emerging-threats-suriname
  fetched: 2026-11-12
