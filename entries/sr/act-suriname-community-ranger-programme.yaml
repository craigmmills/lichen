summary: Run by ACT, this programme reportedly helped train over 60 rangers since 2007 and establish seven
  posts in Suriname, according to ACT in June 2025.
facts:
- claim: In June 2025, ACT reported helping train more than 60 community rangers since 2007 and establishing
    seven ranger posts in Suriname.
  url: https://www.amazonteam.org/amazon-rangers-suriname/
  fetched: 2026-11-08
  quote: Since 2007, ACT has helped train more than 60 community rangers and established seven ranger
    posts across the country.
- claim: ACT trains rangers to support scientific monitoring, from water quality testing to tracking wildlife
    such as the jaguar.
  url: https://www.amazonteam.org/amazon-rangers-suriname/
  fetched: 2026-11-08
  quote: To meet these challenges, ACT trains rangers to support scientific monitoring and environmental
    research— from testing water quality to tracking wildlife like the jaguar, a key indicator species.
- claim: ACT works with community rangers to set up camera traps for biological monitoring near the southern
    border of Suriname with Brazil.
  url: https://www.amazonteam.org/amazon-rangers-suriname/
  fetched: 2026-11-08
  quote: The Amazon Conservation Team works alongside community rangers work to set up camera traps for
    biological monitoring near the Southern border of Brazil and Suriname.
- claim: In 2015 ACT Suriname and Utrecht University set camera traps along forest transects near Kwamalasamutu
    to study wildlife distribution, with Indigenous Park Guards.
  url: https://www.amazonteam.org/?p=347
  fetched: 2026-11-08
  quote: they will set up camera traps along the cleared, straight paths in order to gather data on the
    types and quantities of wildlife in different areas.
