facts:
- claim: Describes itself as a Surinamese organisation dedicated to nature conservation that works with
    Indigenous people and local communities.
  url: https://www.wildlifepeople.org/en/over-ons/
  fetched: 2026-11-08
  quote: Wildlife & People Suriname (WPS) is a Surinamese organization dedicated to nature conservation.
    We work closely with Indigenous people and local communities (IPLCs)
- claim: Says its projects focus on protecting and monitoring wildlife and building communities' capacity
    to monitor wildlife and habitats.
  url: https://www.wildlifepeople.org/en/over-ons/
  fetched: 2026-11-08
  quote: Our projects focus on protecting and monitoring (endangered) wildlife and nature, strengthening
    communities' capacity to monitor wildlife and their habitats
- claim: Its community monitoring team is being trained to install, maintain and collect data from camera
    traps and bioacoustic recorders, in a pilot in Alalapadu and the Kwinti region.
  url: https://www.wildlifepeople.org/en/impact/veldmonitoring/
  fetched: 2026-11-08
