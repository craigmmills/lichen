summary: An active programme in which the Ministry of Land Policy and Forest Management
  took part in SMART follow-up training on 5 to 10 April 2025, after earlier training
  in 2022 and a March 2024 memorandum of understanding.
facts:
- claim: The Ministry of Land Policy and Forest Management took part in follow-up
    training on SMART from 5 to 10 April 2025.
  url: https://gov.sr/capaciteitsversterking-in-smart-monitoring-training-voor-datagedreven-natuurbeheer-succesvol-afgerond/
  fetched: 2026-11-13
  quote: deelgenomen aan een intensieve follow-up training over het gebruik van de
    Spatial Monitoring and Reporting Tool (SMART).
- claim: The training followed earlier capacity building in 2022 and is tied to a
    memorandum of understanding signed in March 2024 for implementing SMART in Suriname.
  url: https://gov.sr/capaciteitsversterking-in-smart-monitoring-training-voor-datagedreven-natuurbeheer-succesvol-afgerond/
  fetched: 2026-11-13
  quote: De training was een vervolg op eerdere capaciteitsopbouw in 2022 en sluit
    aan bij het in maart 2024 ondertekende Memorandum of Understanding (MoU) voor
    de implementatie van SMART in Suriname.
- claim: Participants, including game wardens, learned to collect field data with
    SMART on mobile phones, with field training in Peperpot Nature Park.
  url: https://gov.sr/capaciteitsversterking-in-smart-monitoring-training-voor-datagedreven-natuurbeheer-succesvol-afgerond/
  fetched: 2026-11-13
  quote: In de daaropvolgende dagen leerden de deelnemers om met behulp van SMART
    mobiele telefoons gegevens te verzamelen in het veld.
