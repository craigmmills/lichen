summary: An independent environmental authority established under the Environmental Framework Act, proclaimed
  on 26 July 2024 following the NIMOS transition, with environmental enforcement tasks and data management
  aims.
facts:
- claim: A 2025 NMA vacancy states that the authority was established for all of Suriname under article
    3 of the Environmental Framework Act as an independent administrative body with legal personality.
  url: https://gov.sr/wp-content/uploads/2025/01/Vacature-Manager-Databeheer.pdf
  fetched: 2026-11-08
  quote: zelfstandig bestuursorgaan met rechtspersoonlijkheid.
- claim: Its data management sub-directorate aims to collect, manage, analyse and make available environmental
    information for Surinamese society, especially policymakers.
  url: https://gov.sr/wp-content/uploads/2025/01/Vacature-Manager-Databeheer.pdf
  fetched: 2026-11-08
  quote: en beschikbaar stellen van milieu -informatie t.b.v. de Surinaamse gemeenschap, in het
- claim: A 2025 vacancy for its data manager includes managing geographic data on land use, biodiversity
    and pollution sources.
  url: https://gov.sr/wp-content/uploads/2025/01/Vacature-Manager-Databeheer.pdf
  fetched: 2026-11-08
  quote: landgebruik, biodiversiteit, en vervuilingsbronnen.
- claim: The 2025 vacancy gives its address as Zinniastraat 33-35.
  url: https://gov.sr/wp-content/uploads/2025/01/Vacature-Manager-Databeheer.pdf
  fetched: 2026-11-08
  quote: 'Adres: Zinniastraat 33-35'
- claim: Set up under article 2 of the Environmental Framework Act, which merged NIMOS into the NMA and
    charged it with carrying out the act.
  url: https://www.nmasuriname.org/about-us
  fetched: 2026-11-08
  quote: Hierin is vastgelegd dat het NIMOS opgaat in de NMA en dat dit orgaan belast is met de uitvoering
    van de bepalingen in de wet.
- claim: Its tasks include supervising and enforcing environmental law and advising on the natural and
    human environment.
  url: https://www.nmasuriname.org/about-us
  fetched: 2026-11-08
  quote: Toezicht en handhaving van milieuwetgeving · Advies en informatie-uitwisseling over het natuurlijk
    en menselijk milieu
- claim: Officially proclaimed on 26 July 2024, completing the transition from NIMOS.
  url: https://www.nmasuriname.org/about-us
  fetched: 2026-11-08
  quote: '26 juli 2024: Officiële proclamatie van de Nationale Milieu Autoriteit (NMA), waarmee de formele
    overgang van NIMOS naar NMA plaatsvond.'
