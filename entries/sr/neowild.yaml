summary: A Paramaribo-based NGO founded in January 2019 that researches human impacts on biodiversity,
  especially large cats, and monitors mammals and amphibians at sites including Brownsberg and Kabalebo.
facts:
- claim: GBIF lists NeoWild with an address in Paramaribo, Suriname.
  url: https://api.gbif.org/v1/organization/41b097fd-180c-4836-baa3-db959436aee6
  fetched: 2026-11-08
  quote: '"address":["Acetyleen straat #3"],"city":"Paramaribo","province":"Paramaribo","country":"SR"'
- claim: Its GBIF publisher record says it researches the impact of human activities on biodiversity,
    with a focus on threats to large cats and the impacts of mining, logging, hunting and eco-tourism
    on mammal and amphibian communities.
  url: https://api.gbif.org/v1/organization/41b097fd-180c-4836-baa3-db959436aee6
  fetched: 2026-11-08
  quote: Present focus is on threats to large cats, impacts of mining, logging, hunting and eco-tourism
    on mammal and amphibian communities
- claim: Its staff service camera traps in the field.
  url: https://www.neowild.org
  fetched: 2026-11-08
  quote: exhausted after hiking for 5 hours and servicing our camera traps
- claim: In June 2021, said it had monitored mammals, including the jaguar, at Brownsberg Nature Park
    for many years.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: NeoWild is al vele jaren bezig met het monitoren van zoogdieren, waaronder de jaguar, te Brownsberg
    Natuur Park.
- claim: Lists a news item on monitoring amphibians and threatened mammals in an undisturbed rainforest
    area under a contribution agreement with TotalEnergies EP Suriname.
  url: https://www.neowild.org
  fetched: 2026-11-08
  quote: 'Monitoring amphibians and threatened mammals in an undisturbed rainforest area: Contribution
    agreement with TotalEnergies EP Suriname B.V.'
- claim: GBIF lists one dataset published by NeoWild.
  url: https://api.gbif.org/v1/organization/41b097fd-180c-4836-baa3-db959436aee6
  fetched: 2026-11-08
  quote: '"numPublishedDatasets":1'
- claim: In 2021 signed a cooperation agreement with WWF-Guianas, Anton de Kom University of Suriname
    and Amazon Conservation Team Suriname for a jaguar protection and monitoring project.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: WWF-Guianas, Anton de Kom Universiteit, Amazon Conservation Team Suriname en Institute for Neotropical
    Wildlife and Environmental Studies (NeoWild) hebben een samenwerkingsovereenkomst getekend voor het
    jaguar beschermings- en monitoringsproject.
- claim: Began work around Kabalebo Nature Resort in 2021 with financial support from IUCN Netherlands.
  url: https://www.neowild.org/news/monitoring-amphibians-and-threatened-mammals-in-an-undisturbed-rainforest-area-contribution-agreement-with-totalenergies-ep-suriname-b-v-auto-draft/
  fetched: 2026-11-08
  quote: We started working in the area of Kabalebo Nature Resort in 2021 with the financial support of
    IUCN Netherlands.
- claim: In 2024 decided to extend its Kabalebo monitoring to all mammal species with a threatened status
    on the IUCN Red List, under a contribution agreement with TotalEnergies EP Suriname B.V.
  url: https://www.neowild.org/news/monitoring-amphibians-and-threatened-mammals-in-an-undisturbed-rainforest-area-contribution-agreement-with-totalenergies-ep-suriname-b-v-auto-draft/
  fetched: 2026-11-08
  quote: Therefore, we decided to extend our monitoring in the area to all species of mammals with a “Threatened”
    status on the IUCN Red List.
- claim: Its current projects include monitoring of large terrestrial mammals at Brownsberg Nature Park
    and status surveys of jaguars and pumas.
  url: https://www.neowild.org/activities/
  fetched: 2026-11-08
  quote: Current projects include the monitoring of large terrestrial mammals at Brownsberg Nature Park,
    status surveys of jaguars and pumas and the impact of eco-tourism on amphibians.
- claim: Calls its work that of an NGO.
  url: http://www.neowild.org
  fetched: 2026-11-08
  quote: brengen wij de bijzondere natuur van Suriname en ons werk als NGO dichter bij jullie
- claim: Founded in January 2019 by Paul Ouboter and a group of colleagues.
  url: https://www.neowild.org/about/
  fetched: 2026-11-08
  quote: NeoWild was established by him and a group of colleagues in January 2019.
