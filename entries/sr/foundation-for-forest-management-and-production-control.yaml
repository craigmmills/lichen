- claim: UNDP reports that SBB and CELOS ran an October 2025 workshop to improve the National Mangrove
    Monitoring System, and presented its data collection methods, covering carbon stock, deforestation
    rates and carbon emissions.
  url: https://www.undp.org/suriname/press-releases/sbb-workshop-enhance-understanding-national-mangrove-monitoring-system
  fetched: 2026-11-08
  quote: SBB and CELOS presented the current data collection methods used for the Mangrove Monitoring
    System, including parameters such as carbon stock, deforestation rates, and carbon emissions.
- claim: UNDP reports that SBB's chairman encouraged participants to use the existing mangrove monitoring
    data platforms Gonini and Kopi.
  url: https://www.undp.org/suriname/press-releases/sbb-workshop-enhance-understanding-national-mangrove-monitoring-system
