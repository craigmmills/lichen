summary: A division of Suriname's forest service, run by the land policy and forest ministry, which monitors
  and enforces on sea turtle nesting beaches and had 17 staff trained in bird monitoring in 2026.
facts:
- claim: Suriname's Sea Turtle Recovery Action Plan 2026-2035 says monitoring and enforcement on nesting
    beaches are carried out by the Nature Conservation Division.
  url: https://www.widecast.org/Resources/Docs/STRAP_Suriname_2026.pdf
  fetched: 2026-11-08
  quote: green turtles and monitoring and enforcement on nesting beaches are carried out by the Nature
    Conservation
- claim: UNDP reports that 17 of its staff were trained in bird identification, counting and monitoring
    under the Mangrove+ project in 2026.
  url: https://www.undp.org/suriname/news/handover-ceremony-strengthens-biodiversity-monitoring-under-mangrove-project
  fetched: 2026-11-08
  quote: The initiative strengthened the technical capacities of 17 staff members from the Nature Conservation
    Division (NCD) of the Ministry of Land Policy and Forest Management (GBB).
- claim: UNDP names it as the Forest Service-Nature Conservation Division (LBB/NB) of the Ministry of
    Land and Forest Management.
  url: https://www.undp.org/suriname/press-releases/sbb-workshop-enhance-understanding-national-mangrove-monitoring-system
