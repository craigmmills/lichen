summary: Two-year jaguar protection and monitoring project, reported in June 2021 as agreed by WWF-Guianas,
  Anton de Kom University, ACT Suriname and NeoWild, covering forest, savannah and coastal areas.
facts:
- claim: In June 2021, NeoWild reported that WWF-Guianas, Anton de Kom University, ACT Suriname and NeoWild
    had signed an agreement for the jaguar protection and monitoring project.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: WWF-Guianas, Anton de Kom Universiteit, Amazon Conservation Team Suriname en Institute for Neotropical
    Wildlife and Environmental Studies (NeoWild) hebben een samenwerkingsovereenkomst getekend voor het
    jaguar beschermings- en monitoringsproject.
- claim: The June 2021 report described camera-trap studies of jaguar habitats and estimates of prey numbers
    in several areas.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: Om een beter beeld te krijgen van de situatie wordt onder meer met cameravallen onderzocht wat
    de exacte leefgebieden van de jaguar zijn. Ook worden de aantallen prooidieren in diverse gebieden
    geschat.
- claim: The June 2021 report described monitoring in forest, savannah and coastal areas and gave the
    project a two-year term.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: Het monitoringsproject wordt uitgevoerd in bos-, savanne- en kustgebieden. Het project heeft
    een looptijd van twee jaar.
- claim: The June 2021 report named Gwendolyn Landburg, then acting head of the National Zoological Collection
    of Suriname/Environmental Research Centre, as project coordinator.
  url: https://www.neowild.org/news/beschermings-en-monitoringsproject-voor-jaguars-ondertekend-bij-wwf-guianas/
  fetched: 2026-11-08
  quote: Gwendolyn Landburg, waarnemend hoofd van de Nationale Zoölogische Collectie van Suriname/Centrum
    voor Milieu Onderzoek (NZCSCMO) en tevens project coördinator van dit project
