summary: Surinamese foundation whose rangers collect monitoring data in southern Suriname
  and elsewhere, and which signed a memorandum of understanding with the Ministry
  of Natural Resources, reported on a government page that gives no year.
facts:
- claim: The Ministry of Natural Resources, through its water directorate, and the
    Stichting Amazon Conservation Team Guianas (ACT-G) signed a memorandum of understanding,
    signed on Friday 14 November according to the government page, which gives no
    year.
  url: https://gov.sr/nh-en-act-g-tekenen-mou-voor-versterkte-samenwerking-in-duurzaam-waterbeheer/
  fetched: 2026-11-15
  quote: Het Ministerie van Natuurlijke Hulpbronnen (NH), via het directoraat Water,
    en de Stichting Amazon Conservation Team Guianas (ACT-G) hebben een Memorandum
    of Understanding (MoU) ondertekend.
- claim: The government page says rangers in ACT-G's Amazon Conservation Rangers programme
    collect data in the Matawai area, southern Suriname and along border posts.
  url: https://gov.sr/nh-en-act-g-tekenen-mou-voor-versterkte-samenwerking-in-duurzaam-waterbeheer/
  fetched: 2026-11-15
  quote: De samenwerking sluit aan op het Amazon Conservation Rangers-programma van
    ACT-G, waarin rangers data verzamelen in onder meer het Matawai-gebied, Zuid-Suriname
    en langs grensposten.
- claim: Says it trains villagers to monitor their own territories and assess the
    condition of ecosystems.
  url: https://guianas.amazonteam.org/onze-programmass/natuur-bosbeheer/
  fetched: 2026-11-15
  quote: Wij leiden daarom dorpelingen op om zelf hun leefgebieden te monitoren en
    de conditie van de ecosystemen te beoordelen en te helpen bewaken.
- claim: Says its rangers check water quality and inventory important plant and animal
    species.
  url: https://guianas.amazonteam.org/onze-programmass/natuur-bosbeheer/
  fetched: 2026-11-15
  quote: De rangers controleren o.a. de waterkwaliteit en inventariseren belangrijke
    plant- en diersoorten.
- claim: Says its rangers are trained to use GPS, drones, computers and applications
    such as Mapeo.
  url: https://guianas.amazonteam.org/onze-programmass/natuur-bosbeheer/
  fetched: 2026-11-15
  quote: Onze rangers worden getraind in veldvaardigheden zoals het gebruik van (bosbouw)instrumenten,
    waaronder gps, kompas, clinometers, drones, computers en applicaties zoals Mapeo.
- claim: The Suriname Conservation Foundation lists a community monitoring project
    in the Sipaliwini Nature Reserve and the buffer zone of the Central Suriname Nature
    Reserve as carried out by ACT Guianas.
  url: https://www.scf.sr/projecten-in-uitvoer/
  fetched: 2026-11-15
  quote: Het initiatief wordt uitgevoerd door ACT Guianas en heeft als doel de lokale
    gemeenschappen nauwer te betrekken bij de bescherming van deze belangrijke natuurgebieden.
- claim: In May 2026 the Suriname Conservation Foundation reported a monitoring visit
    to that project that looked at field patrols, data collection and the rangers'
    role.
  url: https://www.scf.sr/scf-voert-monitoringsbezoek-uit-in-matawai-gebied-ter-versterking-van-gemeenschapsmonitoring/
  fetched: 2026-11-15
  quote: Hierbij is specifiek gekeken naar veldpatrouilles, dataverzameling en de
    rol van rangers in het signaleren van ontwikkelingen binnen het gebied.
