summary: Jaguar population study run by NeoWild, agreed with IUCN Netherlands in February 2021 and funded
  by Stout Groep from 2023; NeoWild reported 60 camera traps in May 2024.
facts:
- claim: NeoWild signed an agreement with IUCN Netherlands on 5 February 2021 to study the jaguar population
    at Kabalebo Nature Resort.
  url: https://www.neowild.org/news/neowild-signed-agreement-with-iucn-netherlands-to-study-jaguar-population-at-kabalebo/
  fetched: 2026-11-08
  quote: On February 5th, 2021, NeoWild signed an agreement with IUCN Netherlands to study the population
    characteristics of the jaguar population at the Kabalebo Nature Resort area.
- claim: NeoWild reported in May 2024 that the IUCN Netherlands-funded phase ended in December 2022 and
    the study continued from 2023 with Stout Groep funding.
  url: https://www.neowild.org/news/continuation-of-the-study-on-the-ecology-of-the-jaguar-at-kabalebo-nature-resort-now-supported-by-stout-groep/
  fetched: 2026-11-08
  quote: This project ended in December 2022. From 2023 onward the project is continued with the financial
    support from the Stout Groep.
- claim: In May 2024, NeoWild reported that Stout Groep volunteers assisted with servicing the study’s
    60 camera traps.
  url: https://www.neowild.org/news/continuation-of-the-study-on-the-ecology-of-the-jaguar-at-kabalebo-nature-resort-now-supported-by-stout-groep/
  fetched: 2026-11-08
  quote: deploying volunteers that assist with camera trap servicing of the 60 camera traps in the area
