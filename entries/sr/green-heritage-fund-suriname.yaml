summary: Organisation whose Dolphin Program, begun by volunteers, has collected data on Guiana dolphins
  in the Suriname River estuary since 2005; it also lists long-term turtle and shorebird monitoring.
facts:
- claim: Its Dolphin Program began as a community monitoring programme by its volunteers, and has collected
    basic data on the wild Guiana dolphin population in the Suriname River estuary since 2005.
  url: https://greenfundsuriname.org/programs/dolphin-program
  fetched: 2026-11-08
  quote: The research is conducted in the Suriname River Estuary between Leonsberg and Braamspunt where
    since 2005 basic data was collected on the wild Sotalia guianensis dolphin population.
- claim: The programme states its aim as protecting the wild dolphin population through a community monitoring
    programme that informs decisions about the estuary.
  url: https://greenfundsuriname.org/programs/dolphin-program
  fetched: 2026-11-08
  quote: The protection of the wild dolphin population through establishment and maintenance of a sound
    community monitoring program
- claim: OBIS-SEAMAP publishes a dataset that includes its small boat surveys of the Guiana dolphin in
    the Suriname River.
  url: https://seamap.env.duke.edu/dataset/2124/html
  fetched: 2026-11-08
  quote: (1) Small boat-based surveys by Green Heritage Fund Suriname in order to study the Guiana dolphin
    (Sotalia guianensis) in the Suriname River; and
- claim: Its Dolphin Program began as a community monitoring programme run by its volunteers.
  url: https://greenfundsuriname.org/programs/dolphin-program/
  fetched: 2026-11-08
  quote: The Dolphin Program started out as a community monitoring program by a group of volunteers of
    the Green Heritage Fund Suriname on almost every Sunday.
- claim: The programme has collected data on the wild Sotalia guianensis dolphin population of the Suriname
    River estuary since 2005.
  url: https://greenfundsuriname.org/programs/dolphin-program/
  fetched: 2026-11-08
  quote: The research is conducted in the Suriname River Estuary between Leonsberg and Braamspunt where
    since 2005 basic data was collected on the wild Sotalia guianensis dolphin population.
- claim: Its GBIF publisher record says it runs long-term monitoring programmes for marine megafauna,
    sea turtles, shorebirds and Xenarthra species.
  url: https://api.gbif.org/v1/organization/946a1586-b643-481a-8e5c-607cfa4e11b7
  fetched: 2026-11-08
  quote: GHFS generates and manages primary biodiversity data through long-term monitoring programs, including
    marine megafauna (e.g., Guiana dolphins and manatees), sea turtles, shorebirds, and Xenarthra species
- claim: Its GBIF publisher record says it contributes data to conservation assessments and management
