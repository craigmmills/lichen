summary: Scientific collaboration mapping land cover and land use change since 1985, run by the Mulokot
  Foundation; it reports more than 166,000 hectares of forest lost in 40 years.
facts:
- claim: Describes itself as a scientific collaboration between several institutions that maps and monitors
    land cover and land use change across the country.
  url: https://suriname.mapbiomas.org/
  fetched: 2026-11-08
  quote: MapBiomas Suriname is een wetenschappelijk samenwerkingsverband tussen meerdere instellingen,
    gericht op het in kaart brengen en monitoren van veranderingen in landbedekking en landgebruik in
    het hele land.
- claim: Its news page reports the launch of its online platform and first land use map collection, with
    more than 166,000 hectares of forest lost in 40 years and mining up by more than 850%.
  url: https://suriname.mapbiomas.org/
  fetched: 2026-11-08
  quote: 'MapBiomas Suriname gelanceerd: ruim 166.000 hectare bos verdwenen in 40 jaar, mijnbouw met meer
    dan 850% gegroeid'
- claim: Its land cover series maps changes in Suriname's territory since 1985.
  url: https://suriname.mapbiomas.org/
  fetched: 2026-11-08
  quote: die de veranderingen in het grondgebied van Suriname sinds 1985 in kaart brengt
- claim: Its data are available for public, open and free use, with attribution.
  url: https://suriname.mapbiomas.org/
  fetched: 2026-11-08
  quote: MapBiomas-gegevens zijn beschikbaar voor openbaar, open en gratis gebruik, mits de bron wordt
    vermeld.
