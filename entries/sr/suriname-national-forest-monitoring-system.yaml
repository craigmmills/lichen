summary: A national system with near real time and satellite land monitoring, supported by an EU and AFD
  project, whose October 2025 presentation reported 212 inventory plots, including 17 mangrove plots.
facts:
- claim: The SBB presentation lists Near Real Time Monitoring among the parts of the system.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: 'NRTM: Near Real Time'
- claim: The SBB presentation lists the Satellite Land Monitoring System among the parts of the system.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: 'SLMS: Satellite Land'
- claim: The presentation says the system has the support of an EU and AFD project.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: With support of EU /AFD project
- claim: The October 2025 presentation reports 212 plots in the national forest inventory database, including
    17 mangrove plots.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: '- 212 inventory plots'
- claim: The October 2025 presentation describes a systematic sampling method with about 26,193 points.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: ~ 26,193 sample points
- claim: The presentation gives the Gonini geoportal and the KOPI statistical portal as where its data
    are made available.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: Gonini Geoportal KOPI Statistical Portal
- claim: The presentation lists forest carbon mapping based on remote sensing among future priorities.
  url: https://gfoi-rd.gfz.de/fileadmin/gfoird/documents/2025_10_JointComponent/Presentation7.pdf
  fetched: 2026-11-08
  quote: Forest carbon mapping based
