- claim: Says ANAP renewed in December 2025 its five-year management delegation contract with HNT and
    Société Audubon Haïti for Grand Bois National Park.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: In December 2025, the Agence Nationale des Aires Protégées (ANAP) officially renewed its five‑year
    management delegation contract with Haiti National Trust (HNT) and our sister foundation, S ociété
    Audubon Haïti (SAH) , for the continued stewardship of Grand Bois National Park.
- claim: Says its restoration programme in Grand Bois is grounded in science and long-term monitoring.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: HNT/SAH has implemented a large‑scale ecological restoration program grounded in science and
    long‑term monitoring.
- claim: Says its forest rangers patrol the park daily and monitor wildlife.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: They monitor wildlife, respond to storm damage, and engage residents in environmental stewardship.
- claim: Says its team conducted an aerial census of the American flamingo in Haiti in February 2024.
  url: https://haititrust.org/haiti-national-trust-shines-at-24th-international-conference-of-birdscaribbean/
