summary: Haitian national protected areas agency that, per the Haiti National Trust, renewed in December
  2025 a five-year management delegation contract for Grand Bois National Park, and which UNEP supported
  in 2016 on management plan methodology.
facts:
- claim: The Haiti National Trust reports that ANAP renewed in December 2025 its five-year management
    delegation contract for Grand Bois National Park.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: In December 2025, the Agence Nationale des Aires Protégées (ANAP) officially renewed its five‑year
    management delegation contract with Haiti National Trust (HNT) and our sister foundation, S ociété
    Audubon Haïti (SAH) , for the continued stewardship of Grand Bois National Park.
- claim: The Jardin Botanique des Cayes' GBIF record names ANAP as the National Agency for Protected Areas,
    with which it signed an MOU for research in protected areas.
  url: https://api.gbif.org/v1/organization?country=HT&limit=50
  fetched: 2026-11-12
  quote: A MOU between ANAP ( National Agency for Protected Area) and JBC was signed and JBC has to do
    research in Protected areas in Haiti.
- claim: The UN Biodiversity Lab says UNEP supported the agency in 2016 in developing a government-owned
    methodology for protected area management plans, informed by ground and aerial spatial data.
  url: https://unbiodiversitylab.org/en/haiti-uses-spatial-data-and-aerial-imagery-to-monitor-protected-areas-2/
  fetched: 2026-11-12
  quote: In 2016, UNEP supported the National Agency for Protected Areas in the development of a Government-owned
    methodology for the development of protected areas management plans.
- claim: The same page says spatial data from ground and aerial sources informed these management plans.
  url: https://unbiodiversitylab.org/en/haiti-uses-spatial-data-and-aerial-imagery-to-monitor-protected-areas-2/
  fetched: 2026-11-12
  quote: Spatial data was used to inform these management plans, by using a combination of ground and
    aerial data.
