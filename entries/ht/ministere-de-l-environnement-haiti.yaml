summary: Haiti's environment ministry, whose Director of Biodiversity is the CBD primary national focal
  point, and which organised with UNDP a November 2025 mapping training and March 2026 workshops to update
  the biodiversity strategy.
facts:
- claim: InforMEA lists the ministry's Director of Biodiversity as the CBD primary national focal point.
  url: https://www.informea.org/fr/countries/ht/party-contacts-hub
  fetched: 2026-11-12
  quote: CBD Primary NFP
- claim: UNDP reports a five-day training in November 2025, organised with the ministry and coordinated
    by CNIGS, on mapping the targets of the national biodiversity strategy, under a GEF-funded programme
    to update the strategy and prepare the 7th national report.
  url: https://www.undp.org/fr/node/558676
  fetched: 2026-11-12
  quote: cette initiative vise à renforcer les capacités nationales en matière de spatialisation des cibles
    de la Stratégie et Plan d’Action National pour la Biodiversité.
- claim: UNDP reports workshops in four cities in March 2026, organised with the ministry under the GEF-8
    Umbrella programme, to update the NBSAP and prepare the 7th national report.
  url: https://www.undp.org/fr/node/575216
  fetched: 2026-11-12
  quote: Organisée par le Programme des Nations Unies pour le développement (PNUD), en collaboration avec
    le ministère de l’Environnement, cette initiative s’inscrit dans le cadre du programme GEF-8 Umbrella
