summary: Active Haitian nonprofit funded by New England Aquarium, BIOPAMA and National
  Fish and Wildlife Foundation, reporting co-management of Baraderes-Cayemite MPA
  and 22 confirmed marine megafauna species there.
facts:
- claim: Its 2024 conference paper gives its address at Dupuy 1, Petite Riviere de
    Nippes, Haiti.
  url: https://proceedings.gcfi.org/wp-content/uploads/2026/02/77-GCFI-PDF-3.pdf
  fetched: 2026-11-13
  quote: Haiti Ocean Project, Dupuy 1, Petite Riviere de Nippes, Haiti
- claim: BIOPAMA names the implementing organisation of its Baraderes/Cayemite grant
    as Fondation Haiti Ocean Project.
  url: https://action.biopama.org/?p=1747
  fetched: 2026-11-13
  quote: Fondation Haiti Ocean Project
- claim: Florida International University's Tropical Conservation Institute calls
    it a local nonprofit and its partner in work with artisanal fishers in south-west
    Haiti that collects genetic and demographic data on oceanic whitetip sharks.
  url: https://tci.fiu.edu/conservation-programs/whitetip-shark/index.html
  fetched: 2026-11-13
  quote: In partnership with local nonprofit Haiti Ocean Project, we have developed
    a relationship with artisanal fishers from the communities of SW Haiti.
- claim: The paper says it has been a co-manager of the Baraderes-Cayemite MPA with
    the Haitian government since 2019.
  url: https://proceedings.gcfi.org/wp-content/uploads/2026/02/77-GCFI-PDF-3.pdf
  fetched: 2026-11-13
  quote: Haiti Ocean Project has been a co-manager of the Baraderes-Cayemite MPA with
    the Haitian government since 2019.
- claim: The paper says it has confirmed 22 marine megafauna species in the MPA.
  url: https://proceedings.gcfi.org/wp-content/uploads/2026/02/77-GCFI-PDF-3.pdf
  fetched: 2026-11-13
  quote: MPA, Haiti Ocean Project has confirmed 22 marine megafau
- claim: The paper says its field work and data collection supported the 2024 designation
    of the Golfe de la Gonâve as an Area of Interest for marine mammal conservation.
  url: https://proceedings.gcfi.org/wp-content/uploads/2026/02/77-GCFI-PDF-3.pdf
  fetched: 2026-11-13
  quote: the field work and data collection of Haiti Ocean Project
- claim: The paper reports a hawksbill from Petit Trou de Nippes as the first satellite-tagged
    sea turtle in Haiti's history.
  url: https://proceedings.gcfi.org/wp-content/uploads/2026/02/77-GCFI-PDF-3.pdf
  fetched: 2026-11-13
  quote: Hawksbill from Petit Trou de Nippes became first satellite tagged sea turtle
    in Haiti history
- claim: Its BIOPAMA project, dated June 2021 to June 2022, was to train local fishers
    as part of a monitoring network of high-priority species (marine mammals, sharks,
    sea turtles, stingrays).
  url: https://action.biopama.org/?p=1747
  fetched: 2026-11-13
  quote: June 30, 2021 – June 29, 2022
- claim: The New England Aquarium says it launched a marine ecosystem monitoring network
    with local fishers in 2017, with support in part from the aquarium's Marine Conservation
    Action Fund.
  url: https://neaq.org/?p=9496
  fetched: 2026-11-13
  quote: In 2017, with support in part from MCAF the Haiti Ocean Project (HOP) launched
    a marine ecosystem monitoring network in collaboration with local fishers to gather
    data on top level species in the Canal de la Gonave, Haiti.
