summary: Park of 370 hectares in the Massif de la Hotte, run by the Haiti National Trust, with patches
  of primary forest and endemic species and daily patrols by rangers recruited locally.
facts:
- claim: The Haiti National Trust describes the park as lying in the Massif de la Hotte, with patches
    of primary forest and endemic species.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: Nestled in the Massif de la Hotte, it shelters patches of primary forest with rare and endemic
    species found nowhere else on Earth
- claim: HNT's profile gives the park's area as 370 hectares.
  url: https://haititrust.org/wp-content/uploads/2024/09/HNT-Profile-2024-FR_compressed.pdf
  fetched: 2026-11-12
  quote: 370 hectares
- claim: HNT says rangers recruited from local communities patrol the park daily and monitor wildlife.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: Our forest rangers, recruited from local communities, patrol the park daily to prevent illegal
    tree cutting, grazing, and resource extraction.
