summary: Haitian foundation, called a sister foundation by the Haiti National Trust, which co-holds the
  Grand Bois management delegation renewed in December 2025 and runs a restoration programme there with
  long-term monitoring.
facts:
- claim: The Haiti National Trust calls SAH its sister foundation and co-holder of the Grand Bois management
    delegation renewed by ANAP in December 2025.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: In December 2025, the Agence Nationale des Aires Protégées (ANAP) officially renewed its five‑year
    management delegation contract with Haiti National Trust (HNT) and our sister foundation, S ociété
    Audubon Haïti (SAH) , for the continued stewardship of Grand Bois National Park.
- claim: HNT says HNT and SAH run a restoration programme in Grand Bois grounded in science and long-term
    monitoring.
  url: https://haititrust.org/?p=17428
  fetched: 2026-11-12
  quote: HNT/SAH has implemented a large‑scale ecological restoration program grounded in science and
    long‑term monitoring.
