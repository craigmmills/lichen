summary: Online platform launched by the Ministry of the Environment through ONEV on 25 March 2021, described
  by HaitiLibre as intended to collect environmental data to assess, inform and monitor Haiti's environment.
facts:
- claim: In March 2021, HaitiLibre described SIE-Haïti as an online platform intended to collect environmental
    data in Haiti to assess, inform and monitor the country’s environment.
  url: https://www.haitilibre.com/en/news-33340-haiti-grande-premiere-launch-of-the-environmental-information-platform.html
  fetched: 2026-11-12
  quote: Recall the SIEHaïti is an online platform intended to collect data on the environment in Haiti,
    in order to assess, inform and monitor the state of the environment of the country.
- claim: The Ministry of the Environment launched the platform through ONEV on 25 March 2021.
  url: https://www.haitilibre.com/en/news-33340-haiti-grande-premiere-launch-of-the-environmental-information-platform.html
  fetched: 2026-11-12
  quote: On Thursday March 25, the Ministry of the Environment through the National Environment and Vulnerability
    Observatory (ONEV) officially launched the Haitian Environmental Information System (SIEHaïti) platform.
