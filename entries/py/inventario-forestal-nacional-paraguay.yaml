summary: Active national forest inventory, run by the national forest institute, that
  UN-REDD Paraguay lists as a programme activity; La Nación reported a first cycle
  in 2014 to 2016 and results presented in April 2026.
facts:
- claim: A UN-REDD Paraguay leaflet says developing the national forest inventory
    is one of the activities of the UN-REDD programme in Paraguay.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/py/Triptico-Inventario-Forestal-Nacional.pdf
  fetched: 2026-11-14
  quote: contempladas en el Programa ONU REDD+ es el desarrollo del Inventario Forestal
- claim: The leaflet says the inventory provides data on forest structure and floristic
    composition and on fauna.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/py/Triptico-Inventario-Forestal-Nacional.pdf
  fetched: 2026-11-14
  quote: el IFN ofrece datos sobre la estructura y composición florística de los bosques,
- claim: La Nación reported in October 2025 that the first cycle ran from 2014 to
    2016.
  url: https://www.lanacion.com.py/pais/2025/10/20/avanza-en-caazapa-la-elaboracion-del-inventario-forestal-nacional/
  fetched: 2026-11-14
  quote: El primero se llevó a cabo entre 2014 y 2016, con la medición de un total
    de 328 parcelas
- claim: La Nación reported in October 2025 that INFONA was implementing the third
    cycle.
  url: https://www.lanacion.com.py/pais/2025/10/20/avanza-en-caazapa-la-elaboracion-del-inventario-forestal-nacional/
  fetched: 2026-11-14
  quote: Actualmente, el Infona se encuentra en la implementación del tercer ciclo
    de IFN.
- claim: La Nación reported in April 2026 that INFONA presented the results of the
    2026 inventory, which collects information on forests through field measurement
    and continuous monitoring.
  url: https://www.lanacion.com.py/pais/2026/04/23/inventario-forestal-nacional-2026-infona-evidencia-rol-de-los-bosques-en-paraguay/
  fetched: 2026-11-14
  quote: El Inventario Forestal Nacional (IFN) recopila, analiza y reporta información
    sobre los bosques paraguayos , a través de mediciones en campo, datos científicos
    y monitoreo continuo.
