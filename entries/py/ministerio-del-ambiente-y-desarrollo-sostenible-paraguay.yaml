summary: Paraguay's environment ministry, which in June 2026 was reported to have driven SMART training
  for Chaco park rangers with WWF-Paraguay and UNDP support, and which leads the 2025 to 2030 biodiversity
  strategy.
facts:
- claim: In June 2026, UNDP reported that MADES drove a series of SMART training sessions for Chaco park
    rangers, with support from WWF-Paraguay and UNDP Paraguay.
  url: https://www.undp.org/es/node/588676
  fetched: 2026-11-12
  quote: La iniciativa fue impulsada por el Ministerio del Ambiente y Desarrollo Sostenible (MADES), con
    el apoyo de WWF-Paraguay y el Programa de las Naciones Unidas para el Desarrollo (PNUD) Paraguay.
- claim: The training aimed to strengthen use of SMART to improve monitoring and management of the protected
    wild areas.
  url: https://www.undp.org/es/node/588676
  fetched: 2026-11-12
  quote: una herramienta clave para mejorar el monitoreo, la gestión y el manejo de las Áreas Silvestres
