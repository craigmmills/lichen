summary: Forest monitoring programme run by the agrarian sciences faculty and funded
  by Missouri Botanical Garden; La Nación reported in June 2021 that 43 plots in three
  ecoregions held tagged, georeferenced trees, with 19,787 trees analysed from 40
  plots measured since 2001.
facts:
- claim: La Nación reported on 30 June 2021 that the FCA-UNA network collected forest
    data across Paraguay, with historical figures going back 20 years.
  url: https://www.lanacion.com.py/pais/2021/06/30/estudio-revela-datos-de-monitoreo-permanente-de-bosques-del-paraguay/
  fetched: 2026-11-15
  quote: La plataforma recolecta datos de las masas boscosas de todo el país con cifras
    históricas de hace 20 años.
- claim: 'The June 2021 article reported 43 plots installed and measured in three
    of Paraguay''s five ecoregions: 25 in BAAPA, nine in the Humid Chaco and nine
    in the Dry Chaco.'
  url: https://www.lanacion.com.py/pais/2021/06/30/estudio-revela-datos-de-monitoreo-permanente-de-bosques-del-paraguay/
  fetched: 2026-11-15
  quote: se instalaron y midieron 43 PPMB, en 3 de las 5 ecorregiones presentes en
    el país
- claim: The June 2021 article says all censused trees had numbered metal identification
    tags and were georeferenced using X and Y coordinates.
  url: https://www.lanacion.com.py/pais/2021/06/30/estudio-revela-datos-de-monitoreo-permanente-de-bosques-del-paraguay/
  fetched: 2026-11-15
  quote: Todos los individuos censados tienen una chapa de identificación de metal
    numerada y están georreferenciados
- claim: The article, dated 30 June 2021, reports an analysis of 19,787 trees with
    diameter at breast height of at least 10 cm, recorded in 40 of the 43 plots measured
    since 2001.
  url: https://www.lanacion.com.py/pais/2021/06/30/estudio-revela-datos-de-monitoreo-permanente-de-bosques-del-paraguay/
  fetched: 2026-11-15
  quote: Un análisis de los datos de los 19.787 individuos con DAP ≥ 10 cm, registrados
    en 40 de las 43 Parcelas Permanentes de Monitoreo de la Biodiversidad
