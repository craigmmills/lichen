facts:
- claim: La Nación reported on 31 August 2025 that an interdisciplinary team was researching
    soundscapes at Reserva Natural Tapyta in Caazapá to strengthen biodiversity conservation.
  url: https://www.lanacion.com.py/gran-diario-domingo/2025/08/31/que-nos-dicen-los-sapos-y-las-ranas-al-croar/
  fetched: 2026-11-15
  quote: se encuentra realizando una investigación en la Reserva Natural Tapyta, departamento
    de Caazapá
- claim: In August 2025, the team reported completing field data collection, with
    more than 200 sites sampled and 20 TB of recordings.
  url: https://www.lanacion.com.py/gran-diario-domingo/2025/08/31/que-nos-dicen-los-sapos-y-las-ranas-al-croar/
  fetched: 2026-11-15
  quote: colecta de datos en campo (grabaciones), más de 200 sitios muestreados y
    20 TB de grabaciones
- claim: In August 2025, the team said recordings were being labelled by manual species
    identification to train a classification algorithm for subsequent automatic analysis.
  url: https://www.lanacion.com.py/gran-diario-domingo/2025/08/31/que-nos-dicen-los-sapos-y-las-ranas-al-croar/
  fetched: 2026-11-15
  quote: para el entrenamiento del algoritmo de clasificación
  ai_type: ml-supervised
- claim: The coordinator says automatic detection and classification methods are needed
    because the recorders produce huge amounts of data.
  url: https://www.lanacion.com.py/gran-diario-domingo/2025/08/31/que-nos-dicen-los-sapos-y-las-ranas-al-croar/
  fetched: 2026-11-15
  quote: por lo cual el uso de metodologías de detección y clasificación automática
    es necesario
- claim: In August 2025, the team reported using 20 Wildlife Acoustics Song Meter
    Micro 2 passive automatic recorders.
  url: https://www.lanacion.com.py/gran-diario-domingo/2025/08/31/que-nos-dicen-los-sapos-y-las-ranas-al-croar/
  fetched: 2026-11-15
  quote: de la empresa Wildlife Acoustics, modelo Song Meter Micro 2
