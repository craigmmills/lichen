summary: With partner Fundación Moisés Bertoni, began camera-trap research on northern
  Chaco big cats and ranches in May 2012; named executing agency for the ÑANDE CHACO
  jaguar project.
facts:
- claim: Its article of 27 July 2012 says WCS Paraguay, with FDSC and Fundación Moisés
    Bertoni, began a pilot project in May 2012 in the northern Chaco using camera-trap
    monitoring to understand conflict between big cats and cattle ranches.
  url: https://paraguay.wcs.org/en-us/About-Us/Latest-news/articleType/ArticleView/articleId/756/Using-camera-traps-to-monitor-big-cats-populations-in-the-Paraguayan-Chaco.aspx
  fetched: 2026-11-14
  quote: Assessments and monitoring of big cats with camera-traps seek to find new
    strategies to reduce conflicts between felines and livestock producers in the
    Northern Paraguayan Chaco.
- claim: The article of 27 July 2012 says the project also aimed to generate information
    on the abundance and relative distribution of big cats and the abundance of their
    prey.
  url: https://paraguay.wcs.org/en-us/About-Us/Latest-news/articleType/ArticleView/articleId/756/Using-camera-traps-to-monitor-big-cats-populations-in-the-Paraguayan-Chaco.aspx
  fetched: 2026-11-14
  quote: The project also aims to generate information about abundance and relative
    distribution of big cats in the area, as well as the abundance of their natural
    prey.
- claim: Its home page describes WCS, the Asociación para la Conservación de la Vida
    Silvestre, as a global organisation founded in 1895 dedicated to conserving wildlife
    and landscapes.
  url: https://paraguay.wcs.org
  fetched: 2026-11-14
  quote: Asociación para la Conservación de la Vida Silvestre (WCS) es una organización
    mundial fundada en 1895
- claim: Its staff page says a field data analyst joined the staff in July 2024 to
    support the biodiversity monitoring plans in its areas of work in the Paraguayan
    Chaco.
  url: https://paraguay.wcs.org/en-us/About-Us/WCS-Paraguay-staff.aspx
  fetched: 2026-11-14
  quote: A partir de julio del 2024 pasó a ser parte del staff, desde donde acompaña
    la implementación de los planes de monitoreo de biodiversidad en las áreas de
    acción de WCS Paraguay en el Chaco Paraguayo.
- claim: The staff page says its jaguar programme coordinator has worked with WCS
    since 2011 on jaguar camera-trapping research in the Paraguayan Chaco.
  url: https://paraguay.wcs.org/en-us/About-Us/WCS-Paraguay-staff.aspx
  fetched: 2026-11-14
  quote: She has been working with WCS since 2011 on the design, implementation and
    systematization of jaguar (Panthera onca) camera trappingresearch in the Paraguayan
    Chaco
- claim: Conservation International's GEF page names it as executing agency of the
    ÑANDE CHACO jaguar project, approved on 30 June 2024.
  url: https://www.conservation.org/gef/project/conserving-the-paraguayan-chaco-for-the-benefit-of-jaguars-and-for-people-nande-chaco
  fetched: 2026-11-14
  quote: 'Executing Agency: Wildlife Conservation Society - Paraguay'
