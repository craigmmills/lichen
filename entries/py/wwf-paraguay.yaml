facts:
- claim: Última Hora reported in February 2020 that WWF Paraguay's GIS laboratory began monitoring Eastern
    Region forests in the year the Zero Deforestation law took effect.
  url: https://www.ultimahora.com/bosque-atlantico-deforestacion-se-acentuo-los-ultimos-anos-acciones-reales-del-estado-n2871960.html
  fetched: 2026-11-12
  quote: El Laboratorio de Sistemas de Información Geográfica (SIG) de WWF Paraguay comenzó a monitorear
    los bosques de la Región Oriental en el mismo año de implementación de la Ley de Deforestación Cero.
- claim: The article says WWF has recorded systematic forest loss in protected areas through satellite
    monitoring.
  url: https://www.ultimahora.com/bosque-atlantico-deforestacion-se-acentuo-los-ultimos-anos-acciones-reales-del-estado-n2871960.html
