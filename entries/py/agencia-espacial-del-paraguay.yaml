summary: Paraguayan space agency which, per a JICA completion report, provides space
  systems and satellite data, supplied forest-fire information by satellite as of
  August 2025, and cooperated on GuaraniSat-1, released from the ISS in 2021.
facts:
- claim: JICA's project completion report describes AEP as the agency that provides
    space systems and satellite data.
  url: https://openjicareport.jica.go.jp/pdf/1000057711_01.pdf
  fetched: 2026-11-15
  quote: AEP is the agency to provide space systems and satellite data.
- claim: The completion report describes the AEP team providing forest-fire information
    through satellite monitoring as of August 2025.
  url: https://openjicareport.jica.go.jp/pdf/1000057711_01.pdf
  fetched: 2026-11-15
  quote: AEP Team provides information of forest fires through monitoring with satellite
- claim: The report says Paraguay's first small satellite, GuaraniSat-1, was released
    from the ISS in 2021 through cooperation among AEP, JAXA and Kyutech.
  url: https://openjicareport.jica.go.jp/pdf/1000057711_01.pdf
  fetched: 2026-11-15
  quote: releasing their first small satellite, GuaraniSat-1 from JEM, ISS in 2021
    by cooperation among AEP , JAXA
- claim: The document is a project completion report, with a final meeting on 12 September
