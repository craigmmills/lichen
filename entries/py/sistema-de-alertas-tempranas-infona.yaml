summary: Active early warning system for illegal land-use change in native forests,
  built and run by the national forest institute, launched in November 2023; La Nación
  reported its reports rose 47% between 2023 and 2024.
facts:
- claim: Agencia IP reported on 24 November 2023 that INFONA had officially launched
    the early warning system, which uses satellite imagery processed by algorithms
    to give near real-time information.
  url: https://www.ip.gov.py/ip/infona-implementa-sistema-de-alerta-temprana-para-detectar-deforestacion-ilegal/
  fetched: 2026-11-14
  quote: El Instituto Forestal Nacional (Infona) lanzó oficialmente el Sistema de
    Alertas Tempranas por cambios de uso de la tierra ilegal en bosques nativos, que
    utiliza imágenes satelitales
- claim: Alert reports are generated at INFONA's head office and sent weekly to its
    regional offices.
  url: https://www.ip.gov.py/ip/infona-implementa-sistema-de-alerta-temprana-para-detectar-deforestacion-ilegal/
  fetched: 2026-11-14
  quote: Los reportes de alertas tempranas son generados en la central del Infona
    y remitidos semanalmente a las diferentes oficinas regionales del país
- claim: La Nación reported in February 2026 that the system's reports rose by 47%
    between 2023 and 2024.
  url: https://www.lanacion.com.py/negocios/2026/02/19/infona-nuevo-dato-forestal-sera-clave-para-apertura-a-mercados-exigentes/
