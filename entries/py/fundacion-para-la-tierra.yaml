  quote: Fundación Para La Tierra was founded in 2010 by Karina Atkinson and Jeni
    Oborn with the support of Paul Smith.
- claim: Describes itself as the only year-round scientific research station in Paraguay.
  url: https://paralatierra.org/
  fetched: 2026-11-14
  quote: The only year-round scientific research station in Paraguay
- claim: Runs long-term research projects on the flora and fauna of the Ñeembucú wetlands.
  url: https://paralatierra.org/
  fetched: 2026-11-14
  quote: Long-term research projects on the flora and fauna of the wetlands increase
    our knowledge about these incredible habitats
