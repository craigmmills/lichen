summary: Paraguayan non-profit created in 1988 for conservation and sustainable development, with camera-trap
  records of jaguars and breeding in Mbaracayú forest reserve reported by La Nación in December 2021.
facts:
- claim: La Nación describes it as a Paraguayan non-profit created in 1988 that works for nature conservation
    and sustainable development.
  url: https://www.lanacion.com.py/pais/2025/06/27/34-anos-protegiendo-vida-el-bosque-mbaracayu-refugio-de-biodiversidad-cultura-y-esperanza/
  fetched: 2026-11-12
  quote: La Fundación Moisés Bertoni, creada en 1988, es una organización paraguaya sin fines de lucro
    que trabaja por la conservación de la naturaleza y el desarrollo sostenible.
- claim: It administers the Reserva Natural del Bosque Mbaracayú.
  url: https://www.lanacion.com.py/pais/2025/06/27/34-anos-protegiendo-vida-el-bosque-mbaracayu-refugio-de-biodiversidad-cultura-y-esperanza/
  fetched: 2026-11-12
  quote: La reserva , administrada por la FMB, es uno de los últimos remanentes continuos del Bosque Atlántico
    del Alto Paraná en la región oriental de Paraguay.
- claim: La Nación reported in December 2021 that camera-trap monitoring in the reserve had recorded jaguars
    and their breeding.
  url: https://www.lanacion.com.py/pais/2021/12/25/reserva-del-mbaracayu-mujer-guardaparque-marca-la-diferencia-en-un-ambiente-de-hombres/
  fetched: 2026-11-12
  quote: Mediante monitoreos con cámaras trampa, registros recientes evidencian la existencia y reproducción
    de ejemplares de jaguarete.
