summary: Monaco polar biology department created in 2010 with CNRS-IPHC, which per
  a 2019 flyer follows penguins since 1998 using electronic monitoring and sensors,
  and says it also develops AI-based tools for its field databases.
facts:
- claim: A 2019 flyer on the Centre Scientifique de Monaco's site says the department
    was created in 2010 between the CSM and CNRS-IPHC.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: Ce Département a été créé en 2010 entre le CSM et le CNRS-
- claim: The flyer says more than 17,000 penguins have been followed continuously
    since 1998.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: Plus de 1 7.000 manchots sont suivis en continu
- claim: The flyer says the department studies penguin behaviour and population trends
    through electronic monitoring of nearly 17,000 individuals.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: suivi électronique de près de 1 7.000 individus
- claim: The flyer lists automatic identification and weighing systems, robots and
    HD cameras among the technologies developed and used to observe the species.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: d’identification et de pesée automatiques, robots et
- claim: The flyer lists miniaturised on-board sensors (GPS, Argos, TDR) for following
    penguins at sea.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: (GPS, Argos, TDR ...) pour suivre les manchots pendant
- claim: The flyer says the department also develops tools based on computing and
    algorithmic technologies (AI) to manage and analyse its field databases; it names
    no method.
  url: https://www.centrescientifique.mc/uploads/documents/fr_Flyer%20BioPol_FR.pdf
  fetched: 2026-11-13
  quote: les technologies informatiques et algorithmiques (IA).
- claim: A 2024 paper indexed in OpenAlex gives the department as an affiliation of
