summary: Baited underwater video study in Larvotto marine reserve recorded 332 fish in January 2024 against
  123 in July 2023, with planned coverage of habitats 40 to 50 metres deep.
facts:
- claim: Blue Abacus's baited remote underwater video systems were deployed in Monaco to film, count and
    analyse fish and other species.
  url: https://monacolife.net/documenting-the-med-new-sea-life-monitoring-system-deployed-in-monaco-waters
  fetched: 2026-11-12
  quote: Their camera system uses baited remote underwater video systems (BRUVS) to film, count and analyse
    populations of fish and other marine species, and it is being deployed here in one of the first experiments
    to cover the Mediterranean.
- claim: The cameras were to visit the deepest habitats of the reserve, between 40 and 50 metres.
  url: https://www.monaco-tribune.com/2023/02/des-cameras-sous-marine-telecommandes-deployees-au-larvotto-grace-a-la-fondation-prince-albert-ii/
  fetched: 2026-11-12
  quote: Ces caméras dernier cri, permettront de visiter les habitats les plus profonds de la réserve
    marine du Larvotto, tels que les fonds sableux ou rocheux situés entre 40 et 50 mètres de profondeur.
- claim: The study ran in two campaigns, summer 2023 and winter 2024, recording 332 fish in January 2024
    against 123 in July 2023.
  url: https://www.hellomonaco.com/news/latest-news/new-study-highlights-the-crucial-role-of-the-larvotto-marine-protected-area/
  fetched: 2026-11-12
  quote: The study was conducted over two campaigns, in summer 2023 and winter 2024. In January 2024,
    researchers recorded 332 individual fish in the Larvotto MPA, nearly three times more than the 123
    fish observed in July 2023.
