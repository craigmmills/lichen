summary: Citizen science scheme in Monaco asking sea users to report turtle and marine
  mammal sightings via the OBSenMER platform and app, with over 120 observations recorded
  in 2019 to 2020, per a 2021 release.
facts:
- claim: A June 2021 press release from the Institut océanographique announced a sea-user
    meeting for 8 June at the initiative of the Monaco government and the Institut.
  url: https://www.oceano.org/wp-content/uploads/2021/06/CP-En-mer-tous-observateurs-2eme-edition.pdf
  fetched: 2026-11-13
  quote: A l’initiative du Gouvernement princier et de l’Institut océanographique
- claim: The release says the scheme aims to get sea users to report any sighting
    of turtles and marine mammals, as citizen science.
  url: https://www.oceano.org/wp-content/uploads/2021/06/CP-En-mer-tous-observateurs-2eme-edition.pdf
  fetched: 2026-11-13
  quote: S’inscrivant dans  une démarche de sciences participatives
- claim: The release says more than 120 observations were recorded between 2019 and
    2020, including 119 loggerhead and 7 green turtles.
  url: https://www.oceano.org/wp-content/uploads/2021/06/CP-En-mer-tous-observateurs-2eme-edition.pdf
