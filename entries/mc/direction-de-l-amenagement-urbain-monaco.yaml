summary: Monaco government department that monitors compliance with the ordinances
  protecting plant species under the Tree Code, with state staff recording all trees
  in public and private areas and mapping the data on a Geographic Information System.
facts:
- claim: A Monaco government page says the Department of Urban Amenities monitors
    compliance with the sovereign ordinances, in particular those protecting plant
    species under the Tree Code.
  url: https://transition-energetique.gouv.mc/en/News/International-Day-for-Biological-Diversity
  fetched: 2026-11-15
  quote: Thus, on a daily basis, the Department of Urban Amenities monitors compliance
    with Sovereign Ordinances
- claim: The page says that to this end state staff record all the trees in the territory,
    in public and private areas.
  url: https://transition-energetique.gouv.mc/en/News/International-Day-for-Biological-Diversity
  fetched: 2026-11-15
  quote: State operatives are responsible for recording all the trees present on the
    territory, in both public and private areas.
- claim: The page says all the data are mapped on the Geographic Information System,
    and some can be consulted on the "Your Monaco" website.
  url: https://transition-energetique.gouv.mc/en/News/International-Day-for-Biological-Diversity
  fetched: 2026-11-15
  quote: All the data are mapped on the Geographic Information System (GIS).
- claim: The government's official directory gives the department's address in Monaco.
  url: https://cloud.gouv.mc/webweb/AnnuOff.nsf/(ListCh)/F75A7586F2D0F5B2C12567BD002D0D73!OpenDocument
