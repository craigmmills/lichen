- claim: It runs a juvenile fish monitoring programme to identify nursery habitats.
  url: https://www.monaco-tribune.com/2025/06/50-ans-de-lampn-cest-important-de-reguler-les-activites-humaines/
  fetched: 2026-11-12
  quote: L’AMPN a également développé un programme de suivi des juvéniles pour identifier les habitats
    de nourricerie essentiels à la reproduction.
- claim: It uses a hyperspectral camera to study marine biodiversity without taking samples.
  url: https://www.monaco-tribune.com/2025/06/50-ans-de-lampn-cest-important-de-reguler-les-activites-humaines/
  fetched: 2026-11-12
  quote: L’association utilise notamment une caméra hyperspectrale, technologie révolutionnaire qui permet
    d’étudier la biodiversité marine sans prélever d’échantillons.
- claim: It uses baited remote underwater video systems to complete fish inventories in hard-to-reach
    habitats.
  url: https://www.monaco-tribune.com/2025/06/50-ans-de-lampn-cest-important-de-reguler-les-activites-humaines/
  fetched: 2026-11-12
  quote: L’association a également innové avec la technologie BRUVS (Baited Remote Underwater Video Systems),
    un système de caméras sous-marines appâtées qui complète les inventaires de peuplements de poissons
