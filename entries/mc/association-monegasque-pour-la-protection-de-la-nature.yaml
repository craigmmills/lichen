  quote: Le 22 octobre 1975, l’Association Monégasque pour la Protection de la Nature (AMPN) voit le jour
    sous la présidence d’Eugène Debernardi
- claim: It has been the official manager of Monaco's two marine protected areas since 2018.
  url: https://www.monaco-tribune.com/2022/08/ampn-prendre-soin-des-aires-marines-protegees-de-monaco/
  fetched: 2026-11-12
  quote: Gestionnaire officielle des deux aires marines protégées depuis 2018, l’AMPN travaille en étroite
    collaboration le Gouvernement Princier
