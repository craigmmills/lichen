summary: Monaco marine area created in 2018 by the AMPN with Prince Albert II of Monaco
  Foundation and government support, managed yearly by a school class, whose pupils
  collected biodiversity data in 2024–2025 using environmental DNA, BRUVS and FAST
  counts.
facts:
- claim: Monaco Tribune reports that the Aire Marine Éducative de Monaco was created
    in 2018 by the AMPN with the support of the Prince Albert II of Monaco Foundation
    and the government.
  url: https://www.monaco-tribune.com/2025/06/mieux-connaitre-pour-mieux-proteger-les-eleves-de-lame-en-mission-dans-le-sanctuaire-pelagos/
  fetched: 2026-11-15
  quote: créée en 2018 par l’Association Monégasque pour la Protection de la Nature
    (AMPN) avec le soutien de la Fondation Prince Albert II et du Gouvernement Princier
- claim: The article says the area lies between the Rainier III sea wall of Port Hercule
    and the entrance to Fontvieille port, and is managed each year by a class of Monaco
    schoolchildren.
  url: https://www.monaco-tribune.com/2025/06/mieux-connaitre-pour-mieux-proteger-les-eleves-de-lame-en-mission-dans-le-sanctuaire-pelagos/
  fetched: 2026-11-15
  quote: cette zone est gérée chaque année par une classe de 7e de la Principauté
- claim: The June 2025 article says pupils used environmental DNA analysis, BRUVS
    camera observation and FAST fish counts to collect biodiversity data on the area
    during the 2024–2025 school year.
  url: https://www.monaco-tribune.com/2025/06/mieux-connaitre-pour-mieux-proteger-les-eleves-de-lame-en-mission-dans-le-sanctuaire-pelagos/
  fetched: 2026-11-15
  quote: Analyse de l’ADN environnemental, observation de la faune marine via les
    caméras BRUVS (Baited Remote Underwater Video System), recensement des poissons
    selon la méthode FAST (Fish Assemblage Sampling Technique)
