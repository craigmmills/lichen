summary: Body headquartered in Tehran, overseeing protected areas according to Wikipedia;
  IMNA reported October 2024 plans for AI systems to manage and protect natural areas.
facts:
- claim: The Convention on Biological Diversity lists its primary national focal point for
    Iran at the Department of Environment.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: '2026-11-03'
  quote: Department of Environment (DOE) Pardisan Eco-Park, Shahid Hemmat Highway
- claim: The CBD protected areas focal point for Iran sits in the Department of Environment's
    Habitats and Protected Areas Bureau.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: '2026-11-03'
  quote: Deputy for Habitats and Protected Areas Bureau Department of Environment
- claim: IMNA reported in October 2024 that the department announced plans to use artificial
    intelligence systems in managing and protecting natural areas; this is a plan, not a deployment.
  url: https://en.imna.ir/news/803214/
  fetched: '2026-11-03'
  quote: The Department of Environment (DOE) has announced plans to enhance the management
    and protection of natural areas across Iran by implementing artificial intelligence systems.
- claim: IMNA reported that about a quarter of protected areas were then monitored with traditional
    visual systems.
  url: https://en.imna.ir/news/803214/
  fetched: '2026-11-03'
  quote: Currently, approximately 25 percent of protected areas are monitored using traditional
    visual systems.
- claim: Mehr News reported in October 2025 that the department's Office of the National Museum
    of Natural History and Genetic Resources took part in moving responsibility for the Convention
    on Biological Diversity to the department.
  url: https://www.mehrnews.com/news/6623306/
  fetched: '2026-11-03'
  quote: مشارکت در انتقال مرجعیت کنوانسیون تنوع زیستی به سازمان حفاظت محیط زیست
- claim: In February 2021, Taadol quoted Davoud Mirshekar, then director-general of the marine
    ecosystems and coasts office, saying the department monitored Persian Gulf and Sea of
    Oman coral reefs annually.
  url: https://www.taadolnewspaper.ir/fa/news/175745/
  fetched: '2026-11-03'
  quote: آبسنگ‌های مرجانی خلیج فارس و دریای عمان یکی از برنامه‌های مهم سازمان محیط زیست است
    که هر ساله آنها را پایش می‌کنیم.
- claim: Mehr News reported in February 2026 that its Bushehr provincial office ran the first
    gazelle census on Khargu island, using drones to monitor the population.
  url: https://www.mehrnews.com/news/6750201/
  fetched: '2026-11-03'
  quote: در این پروژه، از پهپادهای پیشرفته برای پایش دقیق جمعیت آهوان و ثبت رفتارهای آن‌ها
    در نقاط مختلف جزیره استفاده شد.
- claim: The Department of Environment holds Iran's primary national focal point for the Convention
    on Biological Diversity, held by its Deputy for Natural Environment and Biodiversity.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: 2026-11-03
  quote: Deputy for Natural Environment and Biodiversity Department of Environment (DOE) Pardisan
    Eco-Park, Shahid Hemmat Highway P.O. Box 14155-7383 Tehran Iran (Islamic Republic of)
    CBD Primary NFP
- claim: Its Habitats and Protected Areas Bureau holds Iran's protected areas focal point
    for the Convention on Biological Diversity.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: 2026-11-03
  quote: Deputy for Habitats and Protected Areas Bureau Department of Environment P.O. Box
    14155-7383 Pardisan Eco-Park, Shahid Hemmat Highway Tehran Iran (Islamic Republic of)
    Protected Areas NFP
- claim: AvayeBoom says Shidvar Island has been managed and protected by the Department of
    Environment as a wildlife refuge since 1975.
  url: https://avayeboom.com/en/10780/
  fetched: 2026-11-03
  quote: Shidvar has been managed and protected by the Department of Environment since 1975
    as a wildlife refuge.
- claim: AvayeBoom says it worked with the Department in 2025 to revise the national by-law
    on hunting waterbirds and waders, which the Department adopted.
  url: https://avayeboom.com/en/12281/
  fetched: 2026-11-03
  quote: In early 2025, the AvayeBoom Bird Conservation Society partnered with the Department
    of Environment of Iran (DOE) to revise the national by-law governing the hunting of waterbirds
    and waders.
- claim: The CBD lists the Department of Environment's Deputy for Natural Environment and
    Biodiversity as Iran's primary national focal point.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: 2026-11-03
  quote: Department of Environment (DOE)
- claim: The CBD lists the Department of Environment's Habitats and Protected Areas Bureau
    as Iran's protected areas focal point.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: 2026-11-03
  quote: Deputy for Habitats and Protected Areas Bureau
- claim: Wikipedia says the department oversees the designation and management of Iran's protected
    areas.
  url: https://en.wikipedia.org/wiki/Department_of_Environment_%28Iran%29
  fetched: 2026-11-03
  quote: The department also oversees the designation and management of Iran’s protected areas,
    including national parks , wildlife refuges , and natural monuments
- claim: The CBD gives the department's address at Pardisan Eco-Park, Tehran.
  url: https://www.cbd.int/countries/nfp?country=ir
  fetched: 2026-11-03
  quote: Pardisan Eco-Park, Shahid Hemmat Highway
- claim: Wikipedia gives its website as doe.ir and its headquarters as Tehran.
  url: https://en.wikipedia.org/wiki/Department_of_Environment_%28Iran%29
  fetched: 2026-11-03
  quote: Website doe .ir
