summary: Centre run by the Department of Environment, reportedly opened in November 2025, where Omid Hajati
  said environmental data were centralised for intended AI decision support and warnings.
facts:
- claim: Mehr News reported in November 2025 that the centre opened in the presence of DOE head Shina
    Ansari and the head of the Armed Forces Geographical Organization.
  url: https://www.mehrnews.com/news/6673163/
  fetched: '2026-11-03'
  quote: آئین افتتاح و بهره‌برداری مرکز پایش هوشمند محیط زیست با حضور شینا انصاری معاون رئیس جمهور و رئیس
    سازمان حفاظت محیط زیست
- claim: Omid Hajati, DOE deputy for management development, legal and parliamentary affairs, said all
    the data needed for environmental protection had been centralised, and that the aim was AI-based decision
    support and warnings on issues including environmental destruction.
  url: https://www.mehrnews.com/news/6673163/
  fetched: '2026-11-03'
  quote: تمامی داده‌های مورد نیاز حفاظت از محیط زیست به صورت یک جا متمرکز شده و یکپارچگی داده‌ها اولین
    قدم برای ارائه تحلیل دقیق، علمی و هوشمندانه برای رفع مشکلات محیط زیستی
- claim: He said the Armed Forces Geographical Organization had provided facilities free of charge before
    a memorandum was signed.
  url: https://www.mehrnews.com/news/6673163/
  fetched: '2026-11-03'
  quote: سازمان جغرافیایی قبل از امضای تفاهم‌نامه به طور رایگان امکاناتی را در اختیار سازمان حفاظت محیط
    زیست قرار دادند
