summary: Saving Cranes reports it formed in 1998 and about 200 duck trappers had joined
  through local trust funds by 2000, and the ICCA Consortium cited its literature
  in 2007.
facts:
- claim: Saving Cranes says the Mazandaran Crane Conservation Association was formed
    in 1998 and by 2000 included around 200 duck trappers who joined by investing
    in local trust funds.
  url: https://savingcranes.org/?p=1400
  fetched: '2026-11-17'
  quote: In 1998 a small crane conservation group, the Mazandaran Crane Conservation
    Association (MCCA), was formed in Iran
- claim: In 2016, the International Crane Foundation reported that local trapper associations
    had registered as cooperatives and kept a safe environment for the crane in their
    traditional damgahs, designated No Shooting Areas and a Ramsar Site.
  url: https://savingcranes.org/?p=1400
  fetched: '2026-11-17'
  quote: The local trapper associations (now officially registered as local cooperatives)
    create a safe environment for the crane within their traditional damgahs
- claim: The 2007 ICCA Consortium database entry lists the head of the Ezbaran Trappers
    Cooperative as a contact for the damgah ICCA and cites literature produced by
    the Mazandaran Crane Conservation Association.
  url: https://www.iccaconsortium.org/wp-content/uploads/2015/08/db-iran-damgah-wetland-en.pdf
  fetched: '2026-11-17'
  quote: literature produced by MCCA (Mazandaran Crane Conservation Association)
