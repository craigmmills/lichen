summary: EcoIran reports 120 camera traps for Persian leopards and prey were handed to the Department
  of Environment in August–September 2025 under a joint 2017 WWF–department decision.
facts:
- claim: EcoIran reports that 120 camera traps for monitoring and protecting the Persian leopard and its
    prey in the Iranian Caucasus were handed to the Department of Environment.
  url: https://ecoiran.com/fa/tiny/news-104067
  fetched: '2026-11-03'
  quote: 120 دستگاه دوربین تله‌ای به منظور پایش و حفاظت از پلنگ ایرانی و طعمه‌های آن در محدوده قفقاز ایران
    به سازمان حفاظت محیط‌زیست تحویل داده شد.
- claim: The cameras were provided for under a 2017 decision of a joint meeting between WWF and the department's
    Deputy for Natural Environment and Biodiversity.
  url: https://ecoiran.com/fa/tiny/news-104067
  fetched: '2026-11-03'
  quote: این دوربین‌ها بر اساس مصوبه نشست مشترک نمایندگان صندوق جهانی حیات وحش (WWF) با معاونت محیط‌زیست
    طبیعی و تنوع زیستی سازمان در سال ۲۰۱۷ برای استفاده در محدوده قفقاز ایران در نظر گرفته شده بود.
- claim: They were delivered in Shahrivar 1404 (August to September 2025) after five years of follow-up.
  url: https://ecoiran.com/fa/tiny/news-104067
  fetched: '2026-11-03'
  quote: این دوربین‌ها در شهریورماه ۱۴۰۴ به ایران تحویل داده شد.
