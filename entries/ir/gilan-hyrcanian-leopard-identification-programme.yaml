  spot patterns in new and older images.
facts:
- claim: Began on 21 Ordibehesht 1405 in Amlash county with camera traps, as part
    of a plan to monitor the leopards of the province's Hyrcanian forests.
  url: https://www.mehrnews.com/news/6827418/
  fetched: '2026-11-09'
  quote: این برنامه در قالب طرح پایش پلنگ‌های جنگل‌های هیرکانی استان و با استفاده
    از دوربین‌های تله‌ای در زیستگاه‌های مناسب این گونه در شهرستان املش آغاز شده است.
- claim: Individual leopards are to be told apart by comparing the spot patterns in
    new and older photographs and videos.
  url: https://www.mehrnews.com/news/6827418/
  fetched: '2026-11-09'
  quote: با مقایسه این تصاویر و تحلیل الگوی خال‌های روی بدن پلنگ‌ها که در هر فرد منحصر
    به فرد است، امکان شناسایی و تفکیک افراد مختلف این گونه فراهم خواهد شد.
