facts:
- claim: In 2019, the ICCA Consortium reported that Cenesta’s initiative would help
    UniCamel and UniNomad strengthen their organisations and engage in self-strengthening
    in their territories of life.
  url: https://www.iccaconsortium.org/2019/10/15/securing-territories-of-life-in-iran-an-initiative-in-memory-of-our-past-president-dr-m-taghi-farvar/
  fetched: 2026-11-17
  quote: The initiative will assist UniNomad and UniCamel to meet regularly and solidify
    their organization, identity and action.
- claim: Dr M. Taghi Farvar supported UniCamel in the territories of life of the mobile
    indigenous peoples of Iran.
  url: https://www.iccaconsortium.org/2019/10/15/securing-territories-of-life-in-iran-an-initiative-in-memory-of-our-past-president-dr-m-taghi-farvar/
