facts:
- claim: Launched as a project in 2013 and upgraded to a non-profit foundation; works in multiple
    reserves in Iran.
  url: https://future4leopards.org/our-team/
  fetched: '2026-11-03'
  quote: the Project “Future4Leopards” was launched in 2013, then upgraded to Future4Leopards
    Foundation as a non-profit organization (registration number 42141)
- claim: Says satellite GPS collars and camera traps are its two main field tools, used by
    its crew.
  url: https://future4leopards.org/research-tools/
  fetched: '2026-11-03'
  quote: Satellite GPS collars and heat-in-motion sensing camera traps are our two main tools
    for doing this and are in widespread use by the Foundation crew.
- claim: Says its field researchers conduct studies year round and that it applies genetic
    analysis to leopards.
  url: https://future4leopards.org/research-tools/
  fetched: '2026-11-03'
  quote: in the Foundation we apply advanced genetic analysis to investigate the leopards’
    diversity and health at multiple scales
- claim: Says its field researchers run studies year round on leopards, their prey and habitat.
  url: https://future4leopards.org/research-tools/
  fetched: 2026-11-03
  quote: Our field researchers conduct studies year round to gain insight into the Persian
    leopard’s habitat, its wild prey species, and the cats themselves.
- claim: Says it began as a project in 2013, became a registered non-profit foundation, and
    works in several reserves in Iran.
  url: https://future4leopards.org/about-foundation/
  fetched: 2026-11-03
  quote: Currently, the Foundation is pursuing its pragmatic conservation goals within multiple
    reserves in Iran.
