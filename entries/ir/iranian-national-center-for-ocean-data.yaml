summary: Programme established in 1995 as Iran's national node of the IODE programme, run
  by the national oceanography institute, managing oceanographic data from cruises, coastal
  monitoring, remote sensing and modelling, accredited in 2017.
facts:
- claim: Describes itself as Iran's national reference for collecting, managing, preserving
    and giving access to oceanographic and marine data and metadata.
  url: https://inio.ac.ir/en/centers/incod
  fetched: 2026-11-03
  quote: The national reference for the collection, management, preservation, and accessibility
    of oceanographic and marine data and metadata in Iran.
- claim: Was established in 1995 and designated Iran's national node of the International
    Oceanographic Data and Information Exchange (IODE) programme.
  url: https://inio.ac.ir/en/centers/incod
  fetched: 2026-11-03
  quote: In 1995, the Oceanographic Data Center was established at the Iranian National Center
    for Oceanography and was designated as the national node of the International Oceanographic
    Data and Information Exchange (IODE) programme.
- claim: Manages data from research activities, cruises, coastal monitoring, remote sensing
    and ocean modelling.
  url: https://inio.ac.ir/en/centers/incod
  fetched: 2026-11-03
  quote: The center collects and manages data generated from research activities, oceanographic
    cruises, coastal monitoring, remote sensing, and ocean modelling.
- claim: Accredited under the IODE Quality Management Framework in 2017.
  url: https://inio.ac.ir/en/centers/incod
  fetched: 2026-11-03
  quote: Accreditation under the IODE Quality Management Framework (QMF).
