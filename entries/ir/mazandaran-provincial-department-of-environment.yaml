summary: Provincial environment office whose protection unit commander reported a
  wildfire in Miankaleh wildlife sanctuary in August 2020, and whose director said
  in September 2022 that over 90 percent of area approvals were implemented.
facts:
- claim: In August 2020, a commander of the Mazandaran environment department’s protection
    unit reported a wildfire in the Miankaleh wildlife sanctuary, which covered about
    68,000 hectares.
  url: https://www.tehrantimes.com/news/451366/
  fetched: '2026-11-17'
  quote: Raging wildfire burnt about 340 hectares of the Miankaleh wildlife sanctuary
    in northern Mazandaran province on Sunday, commander of the protection unit at
    the provincial department of environment has stated.
- claim: In September 2022, the Mazandaran environment director said more than 90
    percent of the approvals for the province’s environmental areas, especially those
    concerning restoration of the Miankaleh wetland, had been implemented.
  url: https://www.tehrantimes.com/news/477123/
  fetched: '2026-11-17'
  quote: Director General of Mazandaran DOE, Ataollah Kavian, said that over 90 percent
    of the approvals of the environmental areas of this province and especially the
    restoration of the Miankaleh wetland have been implemented.
