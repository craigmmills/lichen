summary: Body responsible, per Wikipedia, for Iran's forests, rangelands and watersheds; Tehran
  Times reported in June 2023 that its head said the Khayyam satellite was used against land
  grabbing and forest clearing.
facts:
- claim: Tehran Times reported in June 2023 that its head, Abbas-Ali Nobakht, said the Khayyam
    satellite was being used against land grabbing and forest clearing.
  url: https://www.tehrantimes.com/news/485945/
  fetched: '2026-11-03'
  quote: The domestically produced "Khayyam" satellite is being used for dealing with land
    grabbing and clearing of forests, Abbas-Ali Nobakht, the head of Forests, Range, and Watershed
    Management Organization, has said.
- claim: Tehran Times reported in June 2023 that Reza Bayani, an official of the organisation,
    had said the previous year that Khayyam monitored forests and could record a wildfire
    if it occurred during the satellite’s pass.
  url: https://www.tehrantimes.com/news/485945/
  fetched: '2026-11-03'
  quote: Reza Bayani, an official with the Organization, said last year that the "Khayyam"
    satellite is monitoring forest areas and can immediately track wildfires.
- claim: Wikipedia says it is responsible for the protection and management of Iran's forests,
    rangelands and watersheds, and was formerly named the Forests, Range and Watershed Management
    Organization.
  url: https://en.wikipedia.org/wiki/Natural_Resources_and_Watershed_Management_Organization
  fetched: 2026-11-03
  quote: 'Natural Resources and Watershed Management Organization (Former name: Forests, Range
    and Watershed Management Organization ) is an Iranian government organisation established
    in 2002.'
- claim: Wikipedia says it is the authority responsible for combating deforestation.
  url: https://en.wikipedia.org/wiki/Natural_Resources_and_Watershed_Management_Organization
  fetched: 2026-11-03
  quote: It is the authority responsible for combating against deforestation .
