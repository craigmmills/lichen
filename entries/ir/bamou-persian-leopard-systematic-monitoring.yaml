facts:
- claim: In January 2018, the project aimed to re-estimate Persian leopard abundance
    in Bamou after ten years and define a continuous systematic monitoring plan.
  url: https://www.rufford.org/projects/niloufar-raeesi-chahartaghi/toward-establishment-of-a-systematic-monitoring-of-the-persian-leopard-in-bamou-national-park-and-capacity-building-among-the-parks-rangers-and-local-volunteers/
  fetched: '2026-11-09'
  quote: We aim to re-estimate the Persian leopard abundance after 10 years using
    a participatory approach and define a continuous systematic monitoring plan for
    the species in Bamou.
- claim: In January 2018, the project planned to train the park's rangers and local
    people in camera trapping for ongoing monitoring of the leopard and its prey.
  url: https://www.rufford.org/projects/niloufar-raeesi-chahartaghi/toward-establishment-of-a-systematic-monitoring-of-the-persian-leopard-in-bamou-national-park-and-capacity-building-among-the-parks-rangers-and-local-volunteers/
  fetched: '2026-11-09'
  quote: We aim to train and empower these groups in terms of camera trapping and
    partnership in field activities for an ongoing systematic monitoring of Persian
    leopard and its prey.
- claim: The January 2018 page says Iran's first Persian leopard population estimate
    using camera traps was made in Bamou almost ten years earlier.
  url: https://www.rufford.org/projects/niloufar-raeesi-chahartaghi/toward-establishment-of-a-systematic-monitoring-of-the-persian-leopard-in-bamou-national-park-and-capacity-building-among-the-parks-rangers-and-local-volunteers/
  fetched: '2026-11-09'
  quote: Persian leopard population has been estimated in BNP as the first population
    estimation by camera traps in Iran almost 10 years ago.
