summary: Website built by AvayeBoom with the Isfahan Department of Environment, launched on World Wetlands
  Day 2023, holding Gavkhouni International Wetland biodiversity checklists for birds, reptiles and mammals.
facts:
- claim: The website development project began in June 2022 and was completed in 2023; the website launched
    on World Wetlands Day in 2023.
  url: https://avayeboom.com/en/gavkhouni-wetland-biodiversity-website-project-2/
  fetched: 2026-11-03
  quote: The project was successfully completed in 2023 and can be visited at Gavkhouni Wetland Website
- claim: Brings existing information on the wetland's biodiversity into one platform to make data easier
    to reach.
  url: https://avayeboom.com/en/gavkhouni-wetland-biodiversity-website-project-2/
  fetched: 2026-11-03
  quote: The primary goal of this initiative was to consolidate existing information on the biodiversity
    of the Gavkhouni Wetland into a single platform, thereby facilitating data access and encouraging
    research.
- claim: Holds biodiversity checklists for species groups and a data center.
  url: https://avayeboom.com/en/gavkhouni-wetland-biodiversity-website-project-2/
  fetched: 2026-11-03
  quote: The website features extensive biodiversity checklists and detailed information on various species
    groups, including birds, reptiles, and mammals.
- claim: AvayeBoom, with the Isfahan Department of Environment, launched the project in June 2022 to design
    and build a biodiversity website for the Gavkhouni International Wetland.
  url: https://avayeboom.com/en/gavkhuni-wetland-biodiversity-website-project/
  fetched: '2026-11-03'
  quote: The AvayeBoom Bird Conservation Society, in collaboration with the Isfahan Department of Environment,
    launched a project in June 2022 to design and build a comprehensive biodiversity website for the Gavkhouni
    International Wetland.
- claim: Completed in 2023 and open to visitors.
  url: https://avayeboom.com/en/gavkhuni-wetland-biodiversity-website-project/
