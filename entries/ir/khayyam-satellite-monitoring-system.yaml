summary: A satellite monitoring system that Tasnim reports can detect illegal construction, forest grabbing
  and resource destruction, with Khayyam imagery also supplying part of the Land Management Single Window's
  land-monitoring subsystem.
facts:
- claim: Tasnim reports that the Khayyam-based monitoring system can detect illegal construction in protected
    areas, forest grabbing and destruction of natural resources.
  url: https://www.tasnimnews.ir/fa/news/1404/10/30/3497225/%D9%BE%D8%A7%DB%8C%D8%B4-%D8%AC%D9%86%DA%AF%D9%84-%D8%AE%D9%88%D8%A7%D8%B1%DB%8C-%D9%88-%D8%B2%D9%85%DB%8C%D9%86-%D8%AE%D9%88%D8%A7%D8%B1%DB%8C-%D8%A7%D8%B2-%D8%A7%D8%B1%D8%AA%D9%81%D8%A7%D8%B9-500-%DA%A9%DB%8C%D9%84%D9%88%D9%85%D8%AA%D8%B1%DB%8C-%D8%A8%D8%A7-%D9%85%D8%A7%D9%87%D9%88%D8%A7%D8%B1%D9%87-%D8%AE%DB%8C%D8%A7%D9%85
  fetched: 2026-11-03
  quote: سامانه پایش مبتنی بر ماهواره خیام قادر است ساخت‌وسازهای غیرمجاز در مناطق حفاظت‌شده، جنگل‌خواری،
    تخریب منابع طبیعی
- claim: Tasnim reports that a mission operations group uses the satellite's images and image-processing
    algorithms to watch for suspicious change continuously.
  url: https://www.tasnimnews.ir/fa/news/1404/10/30/3497225/%D9%BE%D8%A7%DB%8C%D8%B4-%D8%AC%D9%86%DA%AF%D9%84-%D8%AE%D9%88%D8%A7%D8%B1%DB%8C-%D9%88-%D8%B2%D9%85%DB%8C%D9%86-%D8%AE%D9%88%D8%A7%D8%B1%DB%8C-%D8%A7%D8%B2-%D8%A7%D8%B1%D8%AA%D9%81%D8%A7%D8%B9-500-%DA%A9%DB%8C%D9%84%D9%88%D9%85%D8%AA%D8%B1%DB%8C-%D8%A8%D8%A7-%D9%85%D8%A7%D9%87%D9%88%D8%A7%D8%B1%D9%87-%D8%AE%DB%8C%D8%A7%D9%85
  fetched: 2026-11-03
  quote: گروه بهره‌برداری مأموریت با استفاده از تصاویر دریافتی این ماهواره و الگوریتم‌های پیشرفته پردازش
    تصویر، تغییرات مشکوک و تخلفات احتمالی را به‌صورت مستمر رصد می‌کند.
- claim: Tasnim reports that researchers at the Iranian Space Research Center are developing new algorithms
    to identify the type and causes of change from Khayyam images.
