  quote: پژوهشگران پژوهشگاه فضایی ایران در حال توسعه الگوریتم‌های جدیدی هستند
- claim: Tasnim reports that the Khayyam satellite supplies part of the imagery for the land-monitoring
    subsystem of the Land Management Single Window.
