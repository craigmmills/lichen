facts:
- claim: In a 2020 letter, the union described itself as a tribal federation and national
    platform whose members were registered Councils of Elders and Sustainable Livelihood
    Funds of nomadic pastoralists. It listed its secretariat in Tehran.
  url: https://rangelandsgateway.org/sites/default/files/iyrp/letters/organizations/Uninomad%20Second%20Letter%20to%20IYRP.pdf
  fetched: 2026-11-17
  quote: tribal federation and an effective national platform which its members are
- claim: In 2019, the ICCA Consortium reported that Cenesta’s initiative aimed to
    help UniNomad and UniCamel strengthen themselves in their territories of life.
  url: https://www.iccaconsortium.org/2019/10/15/securing-territories-of-life-in-iran-an-initiative-in-memory-of-our-past-president-dr-m-taghi-farvar/
  fetched: 2026-11-17
  quote: The initiative will assist UniNomad and UniCamel to meet regularly and solidify
    their organization, identity and action.
