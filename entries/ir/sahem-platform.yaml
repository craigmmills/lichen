summary: An active platform built by Tiznegar and used by the Forests, Range and Watershed Management
  Organization, which Digiato reports offers fire risk prediction and burned-area mapping and monitored
  140 million hectares in 2024.
facts:
- claim: Digiato reports that the platform offers fire risk prediction, burned-area detection and mapping.
  url: https://digiato.com/tech/tiznegar-startup-that-cares-about-earth
  fetched: 2026-11-03
  quote: ازجمله پیش‌بینی مناطق احتمالی وقوع آتش‌سوزی، شناسایی مناطق دچار حریق و محاسبه مناطق سوخته‌شده
    در سامانه سهم
- claim: Digiato reported in 2024, citing Tiznegar's chief executive, that the Natural Resources Organization
    had been a customer since Mehr 1402 and that Sahem monitored 140 million hectares of natural resource
    land.
  url: https://digiato.com/tech/tiznegar-startup-that-cares-about-earth
  fetched: 2026-11-03
  quote: از مهر ۱۴۰۲ سازمان منابع طبیعی مشتری این خدمات شده و ۱۴۰ میلیون هکتار از عرصه منابع طبیعی کشور
    به‌وسیله سامانه سهم پایش می‌شود.
- claim: Digiato reports that Sahem also monitors wetlands, dams and water bodies daily and detects land-use
    change and forest destruction.
  url: https://digiato.com/tech/tiznegar-startup-that-cares-about-earth
  fetched: 2026-11-03
  quote: پالایش روزانه تالاب‌ها، سدها و منابع آبی کشور، شناسایی آلودگی‌های نفتی و شناسایی تغییر کاربری
    و تخریب جنگل‌ها نیز در سامانه سهم انجام می‌شود.
- claim: IUS News, citing Mehr, announced that the Smart Satellite Observation System, developed by researchers
    at knowledge-based companies with support from the presidential Vice-Presidency for Science and Technology,
    would enter operation and process satellite images with AI to monitor environmental phenomena across
    Iran; it does not name Tiznegar.
