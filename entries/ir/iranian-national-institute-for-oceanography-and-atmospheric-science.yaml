  quote: Cnidarian of the Iranian parts of the Persian Gulf and the Gulf of Oman
- claim: Describes itself as Iran's specialised institution for marine and atmospheric studies,
    covering research, technology and monitoring.
  url: https://inio.ac.ir/en/about
  fetched: 2026-11-03
  quote: The Iranian National Institute for Oceanography and Atmospheric Science serves as
    the specialized institution for marine and atmospheric studies in the country
- claim: Began as the National Center for Oceanography in 1992 and took its present name in
    2013.
  url: https://inio.ac.ir/en/about
  fetched: 2026-11-03
  quote: Considering the profound connection between atmospheric and marine systems and the
    necessity for their integrated study, the National Institute for Oceanography was upgraded
    to the "Iranian National Institute for Oceanography and Atmospheric Science" in 2013.
- claim: Says its Caspian Sea research uses remote sensing to monitor sea surface temperature,
    chlorophyll and other environmental indicators, alongside studies of phytoplankton and
    benthic communities.
  url: https://inio.ac.ir/en/news/715
  fetched: 2026-11-03
  quote: the use of remote sensing capabilities to monitor changes in water surface temperature,
    chlorophyll and other environmental indicators
- claim: Announced three training courses for September 2026 on ocean data, artificial intelligence
    in atmospheric and ocean modelling, and ERA5 reanalysis data.
  url: https://inio.ac.ir/en/news/720
  fetched: 2026-11-03
  quote: will hold three specialized and practical courses in ocean data, artificial intelligence,
    and environmental data analysis from September 5 to 14, 2026
- claim: Its GBIF publisher record gives an address in Tehran.
  url: https://api.gbif.org/v1/organization/cd9be75a-6884-4655-a827-07036f8472d4
  fetched: 2026-11-03
  quote: '"address":["No.3, Etemad Zadeh St., Fatemi Ave"],"city":"Tehran"'
- claim: Publishes on GBIF under the title Iranian National Institute for Oceanography and
    Atmospheric Sciences (PEGO-OBIS node).
  url: https://api.gbif.org/v1/organization/cd9be75a-6884-4655-a827-07036f8472d4
  fetched: 2026-11-03
  quote: Iranian National Institute for Oceanography and Atmospheric Sciences (PEGO-OBIS node)
- claim: Says its long-term monitoring of the Persian Gulf, Gulf of Oman and Caspian coasts
    uses research cruises with field sampling, coastal and offshore stations, drones and satellite
    remote sensing.
  url: https://inio.ac.ir/en/news/709
  fetched: '2026-11-03'
  quote: These monitoring are carried out by various methods, including specialized sea patrols
    with field sampling, a network of coastal and offshore stations, data validation and long-term
    monitoring, using drone technology to collect environmental data and satellite remote
    sensing
- claim: Its Vice President of Technology says national marine monitoring of Iran is one of
    the institute's most important missions.
  url: https://inio.ac.ir/en/news/709
  fetched: '2026-11-03'
  quote: Dr. Saeed Najafi, in an interview with Mana reporter, emphasized that one of the
    most important missions of the National Research Institute of Oceanography and Atmospheric
    Sciences is the national marine monitoring of Iran
- claim: Its GBIF publisher record says it was established in 1992 as the Iranian National
    Center for Oceanography and was renamed in 2010 and 2013.
