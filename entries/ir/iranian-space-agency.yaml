summary: Iranian agency that UN-SPIDER lists as national focal point for space research and
  remote sensing, with Khayyam reported in July 2023 to have started land use monitoring,
  and Pars 2 only planned.
facts:
- claim: In July 2023, Iran Daily reported the agency’s spokesman saying Khayyam had started
    remote sensing to monitor and map land use changes.
  url: https://newspaper.irandaily.ir/7334/2/3332
  fetched: '2026-11-03'
  quote: The spokesman for the Iranian Space Agency (ISA) said the country’s Khayyam satellite
    has started remote sensing for monitoring and mapping land use changes.
- claim: In that July 2023 report, spokesman Hossein Daliriyan said the agency was ready to
    offer data to other state bodies, including for environmental monitoring and soil erosion.
  url: https://newspaper.irandaily.ir/7334/2/3332
  fetched: '2026-11-03'
  quote: We are ready to offer the necessary data to other Iranian state agencies and help
    them solve problems in various fields, including environmental monitoring, water resources,
    soil erosion and land subsidence
- claim: In October 2014, UN-SPIDER reported that then ISA deputy head Hamid Fazeli announced
    plans to send three remote sensing satellites into space to observe Earth and detect natural
    disasters.
  url: https://un-spider.org/fr/node/9274
  fetched: '2026-11-03'
  quote: the Deputy Head of the Iranian Space Agency (ISA) Hamid Fazeli issued a statement
    about the launch of three remote sensing satellites.
- claim: Aaj English TV reported in June 2026 that Iran planned to launch Pars 2, a domestically
    built Earth observation satellite that Iranian media say is designed for imaging, remote
    sensing and environmental monitoring; a plan, not a launch.
  url: https://english.aaj.tv/news/330460402
  fetched: '2026-11-03'
  quote: The domestically built Earth-observation satellite is designed for imaging, remote
    sensing and environmental monitoring, according to Iranian media.
- claim: UN-SPIDER says ISA is the national focal point for space research and remote sensing
    in Iran.
  url: https://un-spider.org/network/regional-support-offices/iranian-space-agency-isa
  fetched: 2026-11-03
  quote: ISA is the national focal point for all space research and activities in Iran, as
    well as remote sensing and telemedicine.
- claim: UN-SPIDER says the regional support office hosted by ISA has run projects including
    forest fire detection.
  url: https://un-spider.org/network/regional-support-offices/iranian-space-agency-isa
  fetched: 2026-11-03
  quote: especially in drought monitoring and forecasting, earthquake damage assessment and
    fault movement and also forest fire detection
- claim: UN-SPIDER gives its website as www.isa.ir.
  url: https://un-spider.org/network/regional-support-offices/iranian-space-agency-isa
  fetched: 2026-11-03
  quote: 'Website: http://www.isa.ir'
