summary: Run by Iran's Department of Environment, the census began in 1967; a 1393
  report described 1.7–2 million birds counted annually and planned coverage of 30
  provinces.
facts:
- claim: The 13 Dey 1393 report says Iran began counting migratory waterbirds in 1346
    (1967), in step with Asian, European and African countries.
  url: https://jamejamonline.ir/fa/news/755095/%D8%B2%D9%85%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B4%D9%85%D8%A7%D8%B1%D8%B4-%D9%BE%D8%B1%D9%86%D8%AF%DA%AF%D8%A7%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D8%B1
  fetched: '2026-11-09'
  quote: در ایران سرشماری پرندگان مهاجر از سال 1346 همزمان و هماهنگ با کشورهای آسیایی،
    اروپایی و آفریقایی انجام شد.
- claim: The 13 Dey 1393 report said the winter census was to cover 30 provinces that
    year.
  url: https://jamejamonline.ir/fa/news/755095/%D8%B2%D9%85%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B4%D9%85%D8%A7%D8%B1%D8%B4-%D9%BE%D8%B1%D9%86%D8%AF%DA%AF%D8%A7%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D8%B1
  fetched: '2026-11-09'
  quote: امسال نیز در 30 استان کشورمان سرشماری پرندگان مهاجر آبزی و کنار آبزی انجام
    می‌شود
- claim: The 13 Dey 1393 report named Hamid Amini, then deputy head of the Department
    of Environment's wildlife office, as national coordinator.
  url: https://jamejamonline.ir/fa/news/755095/%D8%B2%D9%85%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B4%D9%85%D8%A7%D8%B1%D8%B4-%D9%BE%D8%B1%D9%86%D8%AF%DA%AF%D8%A7%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D8%B1
  fetched: '2026-11-09'
  quote: در کشورمان حمید امینی، معاون دفتر حیات وحش سازمان حفاظت محیط زیست به عنوان
    هماهنگ‌کننده ملی سرشماری زمستانه پرندگان آبزی و کنار آبزی انتخاب شده است
- claim: The 13 Dey 1393 report said between 1.7 and 2 million migratory birds were
    counted in Iran each year, based on the preceding decades' records.
  url: https://jamejamonline.ir/fa/news/755095/%D8%B2%D9%85%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B4%D9%85%D8%A7%D8%B1%D8%B4-%D9%BE%D8%B1%D9%86%D8%AF%DA%AF%D8%A7%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D8%B1
  fetched: '2026-11-09'
  quote: بین یک میلیون و700 هزار تا دو میلیون پرنده مهاجر هر سال در کشورمان سرشماری
    می‌شود.
- claim: Countries pass their census data to Wetlands International.
  url: https://jamejamonline.ir/fa/news/755095/%D8%B2%D9%85%D8%A7%D9%86%DB%8C-%D8%A8%D8%B1%D8%A7%DB%8C-%D8%B4%D9%85%D8%A7%D8%B1%D8%B4-%D9%BE%D8%B1%D9%86%D8%AF%DA%AF%D8%A7%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D8%B1
  fetched: '2026-11-09'
  quote: کشورهای مختلف بعد از سرشماری پرندگان مهاجر اطلاعات به دست آمده را در اختیار
    موسسه بین‌المللی ‌ ‌ Wetlands International ‌ قرار می‌دهند.
