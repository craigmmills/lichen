summary: Plan reportedly drafted by the Department of Environment in August 2019, covering forests and
  rangelands and aiming to monitor indicator wildlife with modern methods and technologies.
facts:
- claim: Mehr News reported in August 2019 that the DOE had drafted the national biodiversity monitoring
    plan, citing Article 38 of the Sixth Development Plan law.
  url: https://www.mehrnews.com/news/4701687/
  fetched: '2026-11-03'
  quote: سازمان حفاظت محیط زیست بر اساس بند الف ذیل ماده ۲ و مفاد ماده ۳۸ قانون برنامه ششم توسعه که بر
    ضرورت پایش اجزای تنوع زیستی کشور تاکید دارند، طرح پایش تنوع زیستی کشور را تدوین کرده است.
- claim: Its goals include monitoring indicator wildlife species with up-to-date methods and new technologies.
  url: https://www.mehrnews.com/news/4701687/
  fetched: '2026-11-03'
  quote: «پایش گونه‌های شاخص حیات‌وحش با روش‌های روزآمد و فناوری‌های نوین»
- claim: Its goals also include monitoring forest ecosystems such as the Hyrcanian, Zagros and mangrove
    forests, and rangeland ecosystems.
  url: https://www.mehrnews.com/news/4701687/
  fetched: '2026-11-03'
  quote: «پایش زیست‌بوم‌های جنگلی (هیرکانی، زاگرسی، حرا و...) در کشور»، «پایش زیست بوم‌های مرتعی کشور»
