summary: In August 2025, the former head said the base had set up three local bases
  and a national base in Tehran and asked visitors for GPS tracker data.
facts:
- claim: In August 2025, Iran Daily interviewed Mehran Maqsoudi, former head of the
    Lut Desert World Heritage Base, who played the main role in the site’s UNESCO
    registration.
  url: https://newspaper.irandaily.ir/7912/5/17577
  fetched: '2026-11-17'
  quote: Mehran Maqsoudi, former head of the Lut Desert World Heritage Base and the
    main player behind Lut’s UNESCO registration.
- claim: The former head said local bases were set up in South Khorasan, Kerman and
    Sistan and Baluchestan, and a national base in Tehran.
  url: https://newspaper.irandaily.ir/7912/5/17577
  fetched: '2026-11-17'
  quote: 'We set up three local bases: one in South Khorasan, one in Kerman, and one
    in Sistan and Baluchestan. We also set up a national base in Tehran.'
- claim: The former head said that when the base started, everyone entering the Lut
    had to be identified. The base asked visitors to use GPS trackers and send the
    data by satellite internet or upload it after returning.
  url: https://newspaper.irandaily.ir/7912/5/17577
  fetched: '2026-11-17'
  quote: We asked them to hook up GPS trackers, and either transmit their data by
    satellite internet or upload it when they got back.
