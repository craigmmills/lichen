summary: Iran's mapping organisation, which Asriran, citing ISNA in October 2024, associated
  with a Sentinel-1 subsidence map and spatial data archives dating to the 1950s.
facts:
- claim: In October 2024, Asriran, citing ISNA, quoted mapping organisation head Ali Javidaneh
    saying it had built a national subsidence rate map by processing Sentinel-1 images.
  url: https://www.asriran.com/fa/amp/news/1002683
  fetched: '2026-11-03'
  quote: تهیه نقشه جامع نرخ فرونشست کشور با بهره‌گیری از پردازش تصویر ماهواره سنتینل ۱ از
    دیگر اقدامات ما است
- claim: The same report says it mapped dust from satellite images in the Iranian year 1401
    (2022 to 2023).
  url: https://www.asriran.com/fa/amp/news/1002683
  fetched: '2026-11-03'
  quote: با استفاده از تصاویر ماهواره‌ای نقشه پایش ریزگرد را در سال ۱۴۰۱ تهیه کردیم
- claim: The same report says it holds an archive of spatial data going back to the 1950s
    (the 1330s in the Iranian calendar).
  url: https://www.asriran.com/fa/amp/news/1002683
  fetched: '2026-11-03'
  quote: تهیه آرشیو غنی از داده‌های مکانی از دهه ۳۰ شمسی
