    a pilot wildlife census by drone, among the first such sites in Iran.
  url: https://softexport.ir/1385/%D8%A7%D8%B5%D9%81%D9%87%D8%A7%D9%86-%D8%B3%D8%B1%D8%B4%D9%85%D8%A7%D8%B1%DB%8C-%D8%AD%DB%8C%D8%A7%D8%AA-%D9%88%D8%AD%D8%B4-%D8%B1%D8%A7-%D8%A8%D8%A7-%D9%BE%D9%87%D9%BE%D8%A7%D8%AF-%D8%AF%D8%B1-%DA%A9/
  fetched: 2026-11-03
  quote: پارک ملی کلاه قاضی به عنوان یکی از نخستین مناطق کشور، نخستین سرشماری حیات وحش با استفاده از پهپاد
    را تجربه کرد.
- claim: A Department of Environment wildlife official said the data would be analysed with AI and aerial
    image assessment to estimate populations more precisely.
