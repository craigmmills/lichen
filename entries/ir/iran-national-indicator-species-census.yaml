summary: Nationwide census of indicator wildlife announced in October 2025, run by the Department of Environment,
  with one pilot area per province to be counted using drones and night-vision cameras.
facts:
- claim: In October 2025, DOE deputy Hamid Zohrabi announced a nationwide census to monitor indicator
    wildlife populations, distribution and trends, including in areas managed by the department.
  url: https://www.khabarfoori.com/%D8%A8%D8%AE%D8%B4-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-158/3173741-%D8%A2%D8%BA%D8%A7%D8%B2-%D8%B3%D8%B1%D8%B4%D9%85%D8%A7%D8%B1%DB%8C-%D8%B3%D8%B1%D8%A7%D8%B3%D8%B1%DB%8C-%D8%AD%DB%8C%D8%A7%D8%AA-%D9%88%D8%AD%D8%B4-%D8%AF%D8%B1-%DA%A9%D8%B4%D9%88%D8%B1
  fetched: '2026-11-03'
  quote: به‌منظور دستیابی به داده‌های دقیق و قابل استناد از وضعیت جمعیت گونه‌های شاخص حیات‌ وحش، طرح سراسری
    سرشماری این گونه‌ها در سراسر کشور آغاز شد.
- claim: He described the programme as one of the main pillars of the country's biodiversity monitoring
    system.
  url: https://www.khabarfoori.com/%D8%A8%D8%AE%D8%B4-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-158/3173741-%D8%A2%D8%BA%D8%A7%D8%B2-%D8%B3%D8%B1%D8%B4%D9%85%D8%A7%D8%B1%DB%8C-%D8%B3%D8%B1%D8%A7%D8%B3%D8%B1%DB%8C-%D8%AD%DB%8C%D8%A7%D8%AA-%D9%88%D8%AD%D8%B4-%D8%AF%D8%B1-%DA%A9%D8%B4%D9%88%D8%B1
  fetched: '2026-11-03'
  quote: این برنامه یکی از ارکان اصلی نظام پایش تنوع زیستی کشور به‌شمار می‌آید و نقشی کلیدی در تصمیم‌سازی‌های
    مدیریتی دارد.
- claim: For the first time, one pilot area in each province was to be counted with new equipment including
    research drones and night-vision cameras, to compare with traditional methods.
  url: https://www.khabarfoori.com/%D8%A8%D8%AE%D8%B4-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-158/3173741-%D8%A2%D8%BA%D8%A7%D8%B2-%D8%B3%D8%B1%D8%B4%D9%85%D8%A7%D8%B1%DB%8C-%D8%B3%D8%B1%D8%A7%D8%B3%D8%B1%DB%8C-%D8%AD%DB%8C%D8%A7%D8%AA-%D9%88%D8%AD%D8%B4-%D8%AF%D8%B1-%DA%A9%D8%B4%D9%88%D8%B1
  fetched: '2026-11-03'
  quote: در هر استان یک منطقه به‌عنوان پایلوت انتخاب شده است تا سرشماری در آن با بهره‌گیری از تجهیزات
    نوین از جمله پهپادهای تحقیقاتی، دوربین‌های دید در شب و سایر ابزارهای روز انجام گیرد.
