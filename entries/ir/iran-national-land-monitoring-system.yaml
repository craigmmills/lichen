summary: Subsystem of the Single Window for Land Management, whose image processing used AI according
  to Mehr News in September 2023, when officials still sought priority Khayyam images.
facts:
- claim: In September 2023, Mehr News, citing the Information Technology Organization of Iran, described
    the national land monitoring system as a subsystem of the Single Window for Land Management.
  url: https://www.mehrnews.com/news/5887688/
  fetched: '2026-11-03'
  quote: در جلسه سامانه پایش اراضی کشور که یکی از زیرسامانه‌های «پنجره واحد مدیریت زمین» است
- claim: In that report, Maziar Mobasheri said the Single Window system used AI-based methods to build
    its image processing core and drew on knowledge-based companies for processing and storage services;
    officials were still seeking the first priority Khayyam images.
  url: https://www.mehrnews.com/news/5887688/
  fetched: '2026-11-03'
  quote: سامانه پنجره واحد مدیریت زمین در ایجاد هسته پردازشگر تصاویر از روش‌های مبتنی بر هوش مصنوعی، تأمین
    خدمات پردازشی و ذخیره سازی از ظرفیت شرکت‌های دانش بنیان بهره می‌برد.
- claim: The September 2023 report described a workflow in which reports from the image processing core
    would pass to the land platform, which would notify land protection bodies of suspected cases.
  url: https://www.mehrnews.com/news/5887688/
  fetched: '2026-11-03'
  quote: گزارش آماده شده از هسته پردازشگر به پلتفرم زمین ارسال و موارد مشکوک به دستگاه‌های متولی حفاظت
    از اراضی از طریق همین پلتفرم اعلام می‌شود
