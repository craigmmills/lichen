  quote: در زیرسامانه پایش اراضی، با دریافت تصاویر ماهواره‌ای و هسته پردازشگر ما با هوش مصنوعی، تغییرات
    کاربری اراضی در بازه‌های زمانی مختلف شناسایی و به یگان‌های حفاظت دستگاه‌های متولی
