summary: An active programme run by the Information Technology Organization and the Forests, Range and
  Watershed Management Organization, whose subsystem uses satellite images and AI, with Tasnim reporting
  39,064 violations identified so far.
facts:
- claim: Tasnim reports that its land-monitoring subsystem uses satellite images and AI to detect land-use
    change and refers cases to the protection units of the Natural Resources Organization, the Department
    of Environment and the Land Affairs Organization.
