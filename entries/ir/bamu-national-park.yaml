  quote: 'رئیس پارک ملی بمو شیراز، گفت: با بهره‌گیری از دوربین‌های دید در شب دو گروه
    از شکارچیان متخلف شرور در پارک ملی بمو شیراز شناسایی و دستگیر شدند.'
- claim: In 2024 Tasnim reported that Bamu National Park was 15 km from Shiraz, covered
    48,000 hectares and had been protected for about 50 years. It classified the park
    among the sites in Fars province covered by the four-category protection system.
