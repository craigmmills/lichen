summary: Run by INIOAS for five years from 1400, with the National Environment Fund as employer, this
  project plans cruise-based data collection and results for the Department of Environment.
facts:
- claim: INIOAS is to collect oceanographic and environmental data in the Persian Gulf and Gulf of Oman
    for five years through research cruises on the Persian Gulf Explorer vessel.
  url: https://inio.ac.ir/specialresearch
  fetched: '2026-11-03'
  quote: مقرر گردیده است پژوهشگاه ملی اقیانوس شناسی و علوم جوی به مدت 5 سال با برگزاری گشت های دریایی
    با استفاده از شناور کاوشگر خلیج فارس به جمع آوری اطلاعات اقیانوس شناسی و محیط زیستی خلیج فارس و دریای
    عمان بپردازد
- claim: The contract names INIOAS as implementer and the National Environment Fund as employer.
  url: https://inio.ac.ir/specialresearch
  fetched: '2026-11-03'
  quote: بین پژوهشگاه ملی اقیانوس شناسی و علوم جوی (بعنوان مجری) و صندوق ملی محیط زیست (بعنوان کارفرما)
- claim: Began in the Iranian year 1400; its first cruise (PGE2102) took place in summer.
  url: https://inio.ac.ir/specialresearch
  fetched: '2026-11-03'
  quote: در این طرح که از سال 1400 آغاز شده است و تا کنون بر اساس برنامه زمانبندی اولین گشت دریایی آن
    در فصل تابستان برگزار شده است (PGE2102)
- claim: Its goals include observing marine mammals, assessing plankton and benthic plants and animals,
    and validating satellite data.
  url: https://inio.ac.ir/specialresearch
  fetched: '2026-11-03'
  quote: رصد پستانداران دریایی، ارزیابی گیاهان و جانوارن شناورزی و کفزی دریایی و صحت سنجی داده های ماهواره
    ای
- claim: The data and results are to be given to the Department of Environment.
  url: https://inio.ac.ir/specialresearch
  fetched: '2026-11-03'
  quote: مقرر است داده ها و نتایج به دست آمده از این برنامه پایشی در اختیار سازمان حفاظت محیط زیست قرار
    داده شود
