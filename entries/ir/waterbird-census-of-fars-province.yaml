facts:
- claim: In 2022 the Fars Province Department of Environment entrusted AvayeBoom with the census.
  url: https://avayeboom.com/en/fars-middle-winter-bird-census/
  fetched: '2026-11-03'
  quote: In 2022, the DOE of Fars Province entrusted the AvayeBoom Bird Conservation Society with conducting
    the waterbird and shorebird census to ensure accurate data for wetland management decisions.
- claim: The 2022 census followed the Wetlands International waterbird census standards across 13 sites.
  url: https://avayeboom.com/en/fars-middle-winter-bird-census/
  fetched: '2026-11-03'
  quote: The census, following the standards of the Wetlands International waterbird census program, covered
    13 sites over an area of 179,340.4 hectares
- claim: The 2022 census recorded 20,027 birds of 76 species in January and February.
  url: https://avayeboom.com/en/fars-middle-winter-bird-census/
  fetched: '2026-11-03'
  quote: Conducted in January and February, the census recorded a total of 20,027 birds from 76 species.
