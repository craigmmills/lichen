summary: A non-profit NGO for wildlife conservation in Iran and the Middle East, reported
  by Mehr in December 2019 to have monitored marine mammal populations with the Department
  of Environment over five years.
facts:
- claim: Mehr News reported in December 2019 that the DOE's marine deputy, its Bushehr provincial
    office and the society had monitored and estimated marine mammal populations over the
    previous five years, and that this led to Deyr-Nakhiloo National Park being chosen as
    an important marine mammal area.
  url: https://www.mehrnews.com/news/4809907/
  fetched: '2026-11-03'
  quote: بر اساس پایش‌های صورت گرفته بوسیله معاونت محیط زیست دریایی و تالاب‌ها، اداره کل حفاظت
    محیط زیست استان بوشهر و انجمن مذکور، در زمینه شناسایی و برآورد جمعیت پستانداران دریایی
    در پنج سال گذشته
- claim: The same report says the society was starting a project in Bushehr province as the
    first marine monitoring and continuing research on the humpback dolphin, with Nouri Petrochemical's
    interest.
  url: https://www.mehrnews.com/news/4809907/
  fetched: '2026-11-03'
  quote: انجمن مردم نهاد طرح سرزمین، با معرفی و رهنمودهای تخصصی معاونت محیط زیست دریایی و
    تالاب‌ها و اداره کل حفاظت محیط زیست استان بوشهر و علاقمندی پتروشیمی نوری پروژه‌ای را با
    هدف حفاظت از گونه حیات وحش در این استان به عنوان اولین پایش دریایی و پژوهش مستمر بر روی
    گونه دلفین آغاز می‌کند.
- claim: The CBD describes it as a non-profit NGO for the conservation of wildlife and biodiversity
    in Iran and the Middle East, and gives its website.
  url: https://www.cbd.int/2010/country?country=ir
  fetched: 2026-11-03
  quote: Plan for the Land society is a non-governmental non-profitable organization for the
    conservation of wildlife and biodiversity in Iran and in the Middle East
- claim: The Arabian Sea Whale Network's 2024 newsletter says its researchers are consolidating
    data collected through their citizen science network in southern Iran since 2010.
  url: https://arabianseawhalenetwork.org/wp-content/uploads/2024/07/ASWN-Newsletter_2024.pdf
  fetched: 2026-11-03
  quote: consolidating the data collected through their extensive citizen science network
    in the south of Iran
- claim: The same newsletter says the citizen science network reported strandings of whales,
    a dugong, porpoises and dolphins in the past year.
  url: https://arabianseawhalenetwork.org/wp-content/uploads/2024/07/ASWN-Newsletter_2024.pdf
  fetched: 2026-11-03
  quote: In the past year, the citizen science network has shared reports of strandings of
    four baleen whales
