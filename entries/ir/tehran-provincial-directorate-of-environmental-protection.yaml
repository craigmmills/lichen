facts:
- claim: Ran the 1404 (2025-26) census of indicator species in most areas it manages
    on the Department of Environment's instruction, and in Kavir protected area in
    summer.
  url: https://snn.ir/fa/news/1370649/
  fetched: '2026-11-09'
  quote: این سرشماری در پی ابلاغ سازمان حفاظت محیط زیست و در بازه زمانی ۲۹ آبان تا
    ۲۴ دی ماه ۱۴۰۴ در اغلب مناطق تحت مدیریت استان و همچنین در تاریخ اول مردادماه ۱۴۰۴
    در منطقه حفاظت شده کویر ورامین انجام شد.
- claim: Its director-general said the census was a field programme with experts,
    field staff and environmental volunteers in the areas the province manages.
  url: https://snn.ir/fa/news/1370649/
  fetched: '2026-11-09'
  quote: این آمار حاصل اجرای یک برنامه دقیق میدانی با مشارکت کارشناسان، مأموران اجرایی
    و همیاران محیط زیست در مناطق تحت مدیریت استان است.
- claim: The 1404 count of indicator herbivores in the province totalled 28,540.
  url: https://snn.ir/fa/news/1370649/
  fetched: '2026-11-09'
  quote: مجموع علفخواران شاخص استان تهران در سال ۱۴۰۴ به ۲۸ هزار و ۵۴۰ رأس رسیده است
- claim: The 1404 results show about a 6% rise on 1403.
  url: https://snn.ir/fa/news/1370649/
  fetched: '2026-11-09'
  quote: مقایسه نتایج سرشماری سال ۱۴۰۴ با سال ۱۴۰۳ نشان دهنده افزایش حدود شش درصدی
    جمعیت کلی گونه‌های شاخص در مناطق تحت مدیریت استان تهران است.
