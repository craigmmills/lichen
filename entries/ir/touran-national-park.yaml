summary: Camera traps recorded male and female Persian leopards at a water point;
  reported spot-pattern analysis across the park and protected complex identified
  at least 12 adults and one cub.
facts:
- claim: Camera traps in the park recorded a male and a female Persian leopard at
    a water point.
  url: https://www.kojaro.com/news/311095-persian-leopard-family-touran-national-park/
  fetched: '2026-11-09'
  quote: دوربین‌های تله‌ای مستقر در پارک ملی توران واقع در شهرستان شاهرود استان سمنان،
    تصاویری کم‌نظیر از حضور یک خانواده پلنگ ایرانی را به ثبت رساندند.
- claim: The image was recorded with the Sustainable Green Heritage Institute, rangers
    and the park's administration.
  url: https://www.kojaro.com/news/311095-persian-leopard-family-touran-national-park/
  fetched: '2026-11-09'
  quote: این تصویر با مشارکت موسسه میراث سبز پایدار و با همراهی محیط‌بانان و اداره
    پارک ملی توران به ثبت رسیده است.
- claim: The deputy for natural environment of Semnan's environment directorate described
    targeted monitoring and continuous tracking of the leopard population.
  url: https://www.kojaro.com/news/311095-persian-leopard-family-touran-national-park/
  fetched: '2026-11-09'
  quote: زارع‌خورمیزی با اشاره به اجرای پایش هدفمند و رصد مستمر وضعیت جمعیتی این گربه‌سان
    افزود
- claim: In the 20 Bahman 1403 report, spot-pattern analysis of camera-trap images
    from the park and protected complex identified at least 12 adult Persian leopards
    and one cub, the first time all recorded leopards there were individually catalogued.
  url: https://www.etemadonline.com/%D8%A8%D8%AE%D8%B4-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9%DB%8C-23/698652-%D9%82%D9%84%D8%A7%D8%AF%D9%87-%D9%BE%D9%84%D9%86%DA%AF-%D9%BE%D8%A7%D8%B1%DA%A9-%D8%AA%D9%88%D8%B1%D8%A7%D9%86
