summary: A project run by the University of Stuttgart's Institute of Geodesy that monitors Lake Urmia
  from space using altimetry, imagery and GRACE, and looks at the restoration programme after 2014.
facts:
- claim: The institute says the project monitors the lake from space, using multi-mission altimetry for
    water level, satellite imagery for surface water extent and GRACE for water storage change.
  url: https://www.gis.uni-stuttgart.de/en/research/projects/urmia/
  fetched: '2026-11-03'
  quote: In this project, we monitor the state of the lake using spaceborne approach. We utilize multi-mission
    satellite altimetry to extract water level, satellite imagery to estimate the surface water extent,
    and water storage change from the Gravity Recovery and Climate Experiment (GRACE).
- claim: It also looks at the role of the Urmia Lake Restoration Program, mainly after 2014.
  url: https://www.gis.uni-stuttgart.de/en/research/projects/urmia/
