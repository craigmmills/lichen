summary: With UNDP Small Grants Programme support, local organisations formed this
  committee to coordinate Naghadeh wetland restoration, which expanded to 1,500 to
  1,600 hectares and involved seven communities.
facts:
- claim: With the support of the UNDP Small Grants Programme in Iran, a network of
    local organisations set up the committee to manage the stakeholders in reviving
    the Naghadeh wetlands.
  url: https://sgp.undp.org/resources-155/our-stories/346-revitalizing-ramsar-wetlands-in-the-nagahdeh-plain-near-lake-urmia-iran.html
  fetched: '2026-11-17'
  quote: the organizations established the Central Committee for Revitalizing the
    Naghadeh Wetlands to manage an increasingly complex web of stakeholders
- claim: The revitalisation efforts grew to cover 1,500 to 1,600 hectares of the Sirongoli,
    Hasanlou and Dorna wetlands, with seven communities of nearly 600 active members
    involved.
  url: https://sgp.undp.org/resources-155/our-stories/346-revitalizing-ramsar-wetlands-in-the-nagahdeh-plain-near-lake-urmia-iran.html
  fetched: '2026-11-17'
  quote: wetland revitalization efforts grew to cover a total of 1,500 to 1,600 hectares
    in the region, targeting the closely linked Sirongoli, Hasanlou and Dorna wetlands
