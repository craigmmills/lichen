facts:
- claim: In December 2013, the provincial environment director told Tasnim that 80
    rangers protected seven areas covering 290,000 hectares in Kohgiluyeh and Boyer-Ahmad.
  url: https://tasnimnews.ir/230086
  fetched: '2026-11-17'
  quote: 'مدیرکل محیط زیست کهگیلویه و بویراحمد گفت: 80 محیط بان از 7 منطقه حفاظت شده
    با وسعت 290 هزار هکتار در این استان حفاظت می کنند.'
- claim: In August 2019, the provincial environment director said 73 rangers protected
    312,466 hectares of protected areas in Kohgiluyeh and Boyer-Ahmad.
  url: https://tasnimnews.ir/2067883
  fetched: '2026-11-17'
  quote: این استان دارای 312 هزار و 466 هکتار مناطق حفاظت شده تحت پوشش محیط زیست بوده
    که تنها توسط 73 محیط بان حفاظت و صیانت می‌شوند.
