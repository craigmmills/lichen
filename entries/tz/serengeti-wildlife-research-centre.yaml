- claim: Its page lists a project using GPS technology to follow elephant movements
    and human-elephant conflict along the Mwiba, Makao and Maswa boundaries.
  url: https://www.tawiri.or.tz/serengeti-wildlife-research-center/
  fetched: 2026-11-09
  quote: Application of GPS technology in understanding seasonal movement, drivers
    to human elephant conflicts and suggesting mitigations along Mwiba, Makao Open
    Area and Maswa Game Reserve boundaries.
- claim: Its page lists a long-term ecological study of lions in Serengeti National
    Park among its research projects.
  url: https://www.tawiri.or.tz/serengeti-wildlife-research-center/
