summary: Consortium of universities, research institutions and NGOs, set up in 2007, hosted
  by COSTECH, acting as Tanzania's GBIF node with associate status and 23 published datasets.
facts:
- claim: Says it is a consortium of universities, research institutions and NGOs giving open
    access to Tanzania's biodiversity data, set up on 30 August 2007.
  url: https://tanbif.costech.or.tz/pages/about-us
  fetched: 2026-11-08
  quote: Established on 30th August 2007, the Tanzania Biodiversity Information Facility (TanBIF)
    is a consortium of biodiversity universities, research institutions and non-governmental
    organisations of the United Republic of Tanzania
- claim: Says it is hosted and coordinated by COSTECH and is the national node of GBIF.
  url: https://tanbif.costech.or.tz/pages/about-us
  fetched: 2026-11-08
  quote: Hosted and coordinated by the Tanzania Commission for Science and Technology (COSTECH),
    TanBIF is the national node of the Global Biodiversity Information Facility.
- claim: Says the consortium built the national biodiversity data portal in 2008, now based
    on Atlas of Living Australia technology.
  url: https://tanbif.costech.or.tz/pages/about-us
  fetched: 2026-11-08
  quote: The Consortium developed the national biodiversity data infrastructure (TanBIF Portal)
    in 2008 to meet biodiversity stakeholders’ data and information needs.
- claim: Says the portal was developed by DIT in collaboration with COSTECH.
  url: https://tanbif.costech.or.tz/pages/about-us
  fetched: 2026-11-08
  quote: This portal is developed by DIT in collaboration with COSTECH
- claim: The GBIF registry lists it as Tanzania's node, with associate participant status.
