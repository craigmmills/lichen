facts:
- claim: Established in 2006 by MUSE in partnership with TANAPA, building on research in the Udzungwa
    Mountains that began in the 1990s.
  url: https://macco.or.tz/
  fetched: 2026-11-08
  quote: MUSE establishes the Udzungwa Ecological Monitoring Centre (UEMC) in partnership with TANAPA,
    building on a long-term research initiative started in the Udzungwa Mountains in the 1990s.
- claim: MACCO's field station, used by scientists, students, conservation partners and tourists.
  url: https://macco.or.tz/research-facilities/
  fetched: 2026-11-08
  quote: Udzungwa Ecological Monitoring Centre – UEMC is our field station in the Udzungwa and serves
    as a hub for scientists, students, conservation partners and tourists
- claim: Its laboratory supports ecological monitoring and research, including sample analysis and data
    processing; the page gives conflicting inauguration dates of August 2025 and September.
  url: https://macco.or.tz/research-facilities/
  fetched: 2026-11-08
  quote: So the laboratory strengthens our capacity for ecological monitoring and research, providing
    a professional environment for sample analysis, data processing, and scientific training.
