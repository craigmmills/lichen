summary: Programme monitoring the Serengeti cheetah population through staff fieldwork
  and visitor citizen science, with monthly surveys, photo identification by spot
  patterns and scat samples for genetic diversity.
facts:
- claim: The Ngorongoro Conservation Area Authority's research page says the project
    monitors the Serengeti cheetah population through staff fieldwork and citizen
    science from visitors.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-09
  quote: The ongoing Serengeti Cheetah Project has continued to monitor the cheetah
    population in the Serengeti ecosystem through fieldwork by project staffs as well
    as citizen science based information gathered from visitors to the area.
- claim: The same page says monthly surveys locate cheetahs in the plains and Ndutu
    region, and that individuals were identified from photographs by their spot patterns
    or with matching software.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-09
  quote: Individual cheetahs were identified directly from photographs using their
    distinctive spot patterns or matching software on a computer.
- claim: Scat samples were collected to monitor genetic diversity.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-09
  quote: Apart from taking photos, scat samples were collected to monitor genetic
    diversity and establish paternity of individuals.
