summary: Online biodiversity tool built by COSTECH with JRS funding, which JRS says held plant information
  only before about 150,000 animal records were uploaded under a 2014 grant.
facts:
- claim: JRS says COSTECH produced the online BIMT with earlier JRS support, and that it then held plant
    information only.
  url: https://jrsbiodiversity.org/grants/costech/
  fetched: 2026-11-08
  quote: COSTECH began working on improving accessible biodiversity information with previous support
    from JRS, by producing the online Tanzania Biodiversity Information Management Tool (BIMT) . This
    database currently only includes plant information
- claim: JRS reports that about 150,000 records on priority animal groups were gathered and uploaded to
    the BIMT under the 2014 grant.
  url: https://jrsbiodiversity.org/grants/costech/
  fetched: 2026-11-08
  quote: Approximately 150,000 records on priority animal groups have been gathered, standardized, and
    uploaded to BIMT website .
