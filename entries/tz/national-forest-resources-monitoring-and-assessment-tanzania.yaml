summary: Tanzania's first comprehensive national forest inventory according to FAO,
  with a second round planned in 2022 to measure change, and used by TAFORI to monitor
  its permanent sample plots.
facts:
- claim: FAO describes NAFORMA as the first comprehensive national forest inventory
    of Tanzania.
  url: https://www.fao.org/geospatial/events/events-detail/Sampling-Design-Options-for-the-new-National-Forest-Resources-Monitoring-and-Assessment-of-Tanzania-%28NAFORMA-II%29/en
  fetched: 2026-11-13
  quote: The first-ever comprehensive National Forest Inventory (NFI) in Tanzania,
    popularly known as National Forestry Resources Monitoring and Assessment (NAFORMA;
    to be called NAFORMA I in this report)
- claim: In April 2022, FAO reported that TFS and stakeholders planned NAFORMA II
    to measure changes since NAFORMA I, with better integration of ground and remote
    sensing information identified as a needed improvement.
  url: https://www.fao.org/geospatial/events/events-detail/Sampling-Design-Options-for-the-new-National-Forest-Resources-Monitoring-and-Assessment-of-Tanzania-%28NAFORMA-II%29/en
  fetched: 2026-11-13
  quote: Following NAFORMA I, TFS and stakeholders plan to conduct a second assessment
    (NAFORMA II) that will assess the current forest status and hence determine changes
    since NAFORMA I.
- claim: A virtual consultation on NAFORMA II sampling designs was held on 5 April
    2022 by FAO and Luke with TFS.
  url: https://www.fao.org/geospatial/events/events-detail/Sampling-Design-Options-for-the-new-National-Forest-Resources-Monitoring-and-Assessment-of-Tanzania-%28NAFORMA-II%29/en
  fetched: 2026-11-13
  quote: was organized by the Food and Agriculture Organization of the United Nations,
    Natural Resources Institute Finland (Luke) in collaboration with Tanzania Forest
    Services (TFS) Agency), on 5 th of April 2022.
- claim: TAFORI's forest resource assessment programme monitors permanent sample plots
    established by NAFORMA.
  url: https://tafori.or.tz/forest-resource-assessment/
  fetched: 2026-11-13
  quote: Monitor PSPs established by NAFORMA in various representative vegetation
    types including trees outside forests;
