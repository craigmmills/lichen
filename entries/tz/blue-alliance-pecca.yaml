summary: An organisation that the UN MPTF Office says manages the North Pemba Channel Conservation
  Area, about 27,000 hectares of reef, mangrove and seagrass, where rangers monitor crown-of-thorns
  starfish and protect turtle nests.
facts:
- claim: The UN MPTF Office says Blue Alliance PECCA manages the North Pemba Channel Conservation
    Area, about 27,000 hectares of coral reef, mangrove and seagrass.
  url: https://mptf.undp.org/news/women-frontlines-marine-ecosystem-protection-zanzibar
  fetched: 2026-11-08
  quote: the Northern Pemba Channel Conservation Area which Blue Alliance PECCA is managing,
    encompasses approximately 27,000 hectares of highly biodiverse coral reefs, mangroves,
    and seagrass beds.
- claim: The same page says its rangers monitor crown-of-thorns starfish and protect sea turtle
    nests.
  url: https://mptf.undp.org/news/women-frontlines-marine-ecosystem-protection-zanzibar
  fetched: 2026-11-08
  quote: In addition to the daily patrols, the Blue Alliance rangers are involved in monitoring
    Crown of Thorns Starfish, protecting sea turtle nests, and raising public awareness.
