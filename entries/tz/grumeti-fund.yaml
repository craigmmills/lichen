summary: A non-profit working with Tanzania’s government in the western Serengeti, reporting
  two aerial surveys, 30 elephants tracked with GPS collars and EarthRanger adoption in 2017.
facts:
- claim: Says its research and monitoring team collects data on climate, vegetation, wildlife
    populations and key species in the western Serengeti.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: The R esearch and Monitoring (RM) team collects data on climate, vegetation, wildlife
    populations, and key species in the western Serengeti.
- claim: Says it runs two regular aerial surveys, one estimating resident wildlife populations
    and one monitoring riparian habitats, nesting birds and invasive plants.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: The Grumeti Fund regularly conducts two Aerial Surveys – the Aerial Game Survey,
    which estimates resident wildlife populations, and the Riparian Survey, which monitors
    key riparian habitats
- claim: Says its team tracks elephants with GPS collars together with RISE.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: Together with RISE, the Research and Monitoring team tracks elephants with GPS collars
    to analyze their movements and behaviors.
- claim: A non-profit working with the Tanzanian government to conserve wildlife, restore
    ecosystems and support communities in the western Serengeti.
  url: https://grumetifund.org/
  fetched: 2026-11-08
  quote: WE ARE a non-profit organization working alongside the Tanzanian government to help
    conserve wildlife, restore ecosystems, and support neighboring communities in the western
    Serengeti.
- claim: Runs two aerial surveys, the Aerial Game Survey of resident wildlife and the Riparian
    Survey of riparian habitats, nesting birds and invasive plants.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: The Grumeti Fund regularly conducts two Aerial Surveys – the Aerial Game Survey,
    which estimates resident wildlife populations, and the Riparian Survey
- claim: Tracks elephants with GPS collars; the page reports 30 elephants tracked.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: the Research and Monitoring team tracks elephants with GPS collars to analyze their
    movements and behaviors
- claim: Says it adopted EarthRanger in 2017 to collect real-time data across the concession.
  url: https://grumetifund.org/anti-poaching-and-wildlife-protection/
  fetched: 2026-11-08
  quote: In 2017, the Grumeti Fund integrated the EarthRanger system to collect real-time
    data across the concession.
- claim: EarthRanger's partner page says the Grumeti Fund worked closely with it on developing
    the system.
  url: https://www.earthranger.com/partners
  fetched: 2026-11-08
  quote: Grumeti Fund is a thought-leader in conservation operations and has worked very closely
    with EarthRanger to help develop nearly all aspects of the solution.
- claim: Address given as the western corridor of the Serengeti, Mara Region, Tanzania.
  url: https://grumetifund.org/research-and-monitoring/
  fetched: 2026-11-08
  quote: Western corridor of the Serengeti, Mara Region, Tanzania
