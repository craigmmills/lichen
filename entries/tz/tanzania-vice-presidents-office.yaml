facts:
- claim: Its Minister of State for Union and Environment presented the National Biodiversity
    Strategy and Action Plan to the parliamentary committee on water and environment in August
    2026.
  url: https://dailynews.co.tz/?p=155883
  fetched: 2026-11-08
  quote: The Minister of State in the Vice President’s Office (Union and Environment), Mr
    Hamad Yussuf Masauni, said this while presenting a report to the Parliamentary Standing
    Committee on Water and Environment on the National Biodiversity Strategy and Action Plan,
    on Tuesday.
- claim: The National Biodiversity Strategy covers 2025 to 2030.
  url: https://dailynews.co.tz/?p=155883
  fetched: 2026-11-08
  quote: The National Biodiversity Strategy (2025–2030) was developed through a participatory
    process involving sectoral ministries, government and non-government institutions, as
    well as community groups.
