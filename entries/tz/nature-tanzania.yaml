summary: Membership conservation NGO in Tanzania that uses birds as indicators of
  ecosystem health, monitors Key Biodiversity Areas, and describes itself as a BirdLife
  International partner.
facts:
- claim: Describes itself as a membership conservation NGO in Tanzania that uses birds
    as indicators of ecosystem health.
  url: https://naturetanzania.or.tz/
  fetched: 2026-11-13
  quote: We are a membership conservation NGO in Tanzania and uses birds as indicators
    of ecosystem health and as a tool for nature conservation.
- claim: Its project list includes community-based monitoring of Grey Crowned Cranes
    in the Kagera wetlands.
  url: https://naturetanzania.or.tz/what-we-do/
  fetched: 2026-11-13
  quote: Community-based monitoring of Grey Crowned Cranes in Kagera wetlands
- claim: It says it works through the identification, protection, management and monitoring
    of Key Biodiversity Areas.
  url: https://naturetanzania.or.tz/our-pillars/
  fetched: 2026-11-13
  quote: This is achieved through identification, protection, management and monitoring
    of Key Biodiversity Areas (KBA)
- claim: It says the Ministry of Natural Resources and Tourism, through TAWIRI, organises
    the International Waterbird Census, and that Nature Tanzania has brought members
    and volunteers to it since January 2023.
  url: https://naturetanzania.or.tz/2024/02/01/scientists-uncover-new-pathways-in-cancer-cells/
  fetched: 2026-11-13
  quote: Nature Tanzania has been supporting these important events since January
    2023 by bringing its members and volunteers to participate.
- claim: Its office is on EAC Road, AICC Kilimanjaro Wing, Arusha.
  url: https://naturetanzania.or.tz/2024/02/01/scientists-uncover-new-pathways-in-cancer-cells/
  fetched: 2026-11-13
  quote: 'Office: EAC Road, AICC – Kilimanjaro Wing, 4th Floor, Office No. 431, Arusha.'
- claim: It describes itself as a BirdLife International partner in Tanzania.
  url: https://naturetanzania.or.tz/2024/02/01/scientists-uncover-new-pathways-in-cancer-cells/
  fetched: 2026-11-13
  quote: As a BirdLife International partner in Tanzania, we are using birds as indicator
    of ecosystem health and a tool for nature conservation.
