summary: Conservation and wildlife management authority which Esri's 2021 blog said managed
  22 national parks, had a GIS unit established in 2012, and had configured Survey123 forms
  for ecological monitoring.
facts:
- claim: Esri’s 2021 conservation summit blog reported that TANAPA then managed 22 national
    parks covering 104,661 square kilometres.
  url: https://www.esri.com/en-us/industries/blog/articles/2021-esri-conservation-summit-blog-series-tanzania-national-parks-tanapa
  fetched: 2026-11-08
  quote: Currently, TANAPA manages 22 national parks covering an area of 104,661 square kilometers
    across various ecosystems and landforms including savanna, forest, mountains, and wetlands.
- claim: Esri’s 2021 blog said TANAPA’s GIS unit was established in 2012 and was led from
    its headquarters in Arusha.
  url: https://www.esri.com/en-us/industries/blog/articles/2021-esri-conservation-summit-blog-series-tanzania-national-parks-tanapa
  fetched: 2026-11-08
  quote: Each zone is supported by one GIS officer reporting to Mbilinyi, who leads the unit
    in the TANAPA headquarters in Arusha, Tanzania.
- claim: Esri’s 2021 blog reported that TANAPA had configured Survey123 forms for ecological
    monitoring and research on wildlife and vegetation.
  url: https://www.esri.com/en-us/industries/blog/articles/2021-esri-conservation-summit-blog-series-tanzania-national-parks-tanapa
  fetched: 2026-11-08
  quote: For more detailed field surveys, TANAPA has configured Survey123 forms to support
    ecological monitoring and research on wildlife and vegetation dynamics.
- claim: Its own site calls it a conservation and wildlife management authority.
  url: https://www.tanzaniaparks.go.tz
  fetched: 2026-11-08
  quote: An award winning conservation and wildlife management authority.
- claim: Describes itself as a conservation and wildlife management authority for Tanzania's
    national parks.
  url: https://www.tanzaniaparks.go.tz/
  fetched: 2026-11-08
  quote: An award winning conservation and wildlife management authority.
