summary: A coastal network training community catch monitors and biodiversity teams, conducting
  snorkel reef surveys using four methods, with 46 staff in four teams in 2023.
facts:
- claim: Collects ecological information from each community carrying out management activities,
    to measure the impact on ecosystem health.
  url: https://mwambao.or.tz/ecological-monitoring/
  fetched: 2026-11-08
  quote: Mwambao collects ecological information from each community implementing management
    activities to ensure we are able to measure the impact we are having on ecosystem health
    and resilience.
- claim: Trains teams of community catch monitors and in-water biodiversity monitoring teams.
  url: https://mwambao.or.tz/ecological-monitoring/
  fetched: 2026-11-08
  quote: We train teams of community catch monitors as well as in-water biodiversity monitoring
    team.
- claim: Coral reef surveys by snorkelling use four methods covering fish counts, benthic
    cover, macro-invertebrates and sea urchins.
  url: https://mwambao.or.tz/ecological-monitoring/
  fetched: 2026-11-08
  quote: Coral reef surveys are all conducted by snorkelling. Four survey methodologies are
    used to measure ecosystem health, including fish counts, benthic cover, macro-invertebrates
    and sea urchins.
- claim: Had 46 staff in 2023 in four teams in Pangani, Tanga, Pemba and Unguja.
  url: https://mwambao.or.tz/team/
  fetched: 2026-11-08
  quote: In 2023 we have 46 staff based in 4 different teams located in Pangani and Tanga
    city on mainland Tanzania, and Pemba and Unguja Islands, Zanzibar.
