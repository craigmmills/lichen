summary: Established in 1980 to conduct, coordinate and oversee wildlife research, it publishes
  aerial survey reports and, Development Seed says, collaborated on AI-assisted counting after
  aerial surveys.
facts:
- claim: Says it was set up by Act of Parliament with the mandate to conduct, coordinate and
    oversee wildlife research in Tanzania, and was renamed from the Serengeti Wildlife Research
    Institute in 1999.
  url: https://tawiri.or.tz
  fetched: 2026-11-08
  quote: The name SWRI was changed to TAWIRI in 1999 by the Act of Parliament No. 10 (CAP
    260 RE 2002) to give it a broader meaning and mandate on wildlife research throughout
    the country.
- claim: Says its core functions include coordinating and managing all wildlife research in
    the country.
  url: https://tawiri.or.tz
  fetched: 2026-11-08
  quote: In accordance with its mandate, the core functions of TAWIRI include coordination
    and management of all wildlife research in the country.
- claim: Says its headquarters are at Njiro, Arusha, with five research centres.
  url: https://tawiri.or.tz
  fetched: 2026-11-08
  quote: The headquarters of the institute is located at Njiro, Arusha, and comprises five
    research centers in various locations
- claim: Publishes aerial wildlife survey reports, such as its 2022 dry-season census of the
    Saadani-Wami-Mbiki ecosystem.
  url: https://www.tawiri.or.tz/wp-content/uploads/2024/04/Saadan-Wami-Mbiki_Final.pdf
  fetched: 2026-11-08
  quote: 'Citation: TAWIRI (2023) Aerial Wildlife Survey of Large Animals and Human Activities
    in the Saadani-Wami-Mbiki Ecosystem, Dry Season 2022.'
- claim: Development Seed says it and TAWIRI developed an AI-assisted method for spotting
    and counting wildlife, human activities and livestock after aerial surveys, with TAWIRI
    providing expert annotators in Arusha.
  url: https://developmentseed.org/blog/2021-02-18-ai-mapping-risks-to-wildlife-in-tanzania
  fetched: 2026-11-08
  quote: To address this Development Seed and the Tanzania Wildlife Research Institute (TAWIRI),
    developed an AI-assisted methodology that significantly increases the speed of spotting
    and counting wildlife, human activities, and livestock after aerial surveys
- claim: TAWIRI-affiliated researchers co-authored a 2019 paper comparing deep learning and
    citizen science for counting wildlife in aerial survey images.
  url: https://api.openalex.org/works?filter=authorships.institutions.country_code:TZ,concepts.id:C119857082,concepts.id:C18903297,from_publication_date:2019-01-01&per-page=50&sort=cited_by_count:desc&select=id,display_name,publication_year,authorships
  fetched: 2026-11-08
  quote: '"display_name": "A comparison of deep learning and citizen science techniques for
    counting wildlife in aerial survey images"'
  ai_type: deep-learning
- claim: Established by Act of Parliament No. 4 of 1980 with the mandate to conduct, coordinate
    and oversee wildlife research in Tanzania; renamed from the Serengeti Wildlife Research
    Institute in 1999.
  url: https://www.tawiri.or.tz/
  fetched: 2026-11-08
  quote: the Institute was established by Act of Parliament of the United Republic of Tanzania
    No. 4 of 1980, with the mandate to conduct, coordinate, and oversee wildlife research
    in the United Republic of Tanzania.
- claim: Headquartered at Njiro, Arusha, with five research centres and five research stations.
  url: https://www.tawiri.or.tz/
  fetched: 2026-11-08
  quote: The headquarters of the institute is located at Njiro, Arusha, and comprises five
    research centers in various locations
- claim: Its Conservation Information and Monitoring Section conducts wildlife censuses and
    resource assessments within and adjacent to protected areas.
  url: https://www.tawiri.or.tz/conservation_information_and_monitoring/
  fetched: 2026-11-08
  quote: Conducting wildlife censuses and resource assessments within and adjacent to protected
    areas,
- claim: The same section offers consultation and training in remote sensing, GIS, databases
