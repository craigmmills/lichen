summary: Programme of Panthera, which says it set up a Tanzanian country office in
  2025, using SMART for patrol tracking and holding a July 2025 agreement with TAWA
  covering monitoring in two game reserves.
facts:
- claim: Panthera says it established an official country entity and office in Tanzania
    in 2025.
  url: https://panthera.org/blog-post/aardwolves-servals-year-panthera-tanzania-our-newest-country-program
  fetched: 2026-11-13
  quote: In 2025, Panthera established an official country entity and office in Tanzania
- claim: Panthera reports that in 2024, before establishing its Tanzania country entity,
    it partnered with TAWA and TAWIRI on the first survey of large carnivores, prey
    and human impacts across more than 25,000 square kilometres of western Tanzania.
  url: https://panthera.org/blog-post/aardwolves-servals-year-panthera-tanzania-our-newest-country-program
  fetched: 2026-11-13
  quote: In 2024, we partnered with TAWA and the Tanzania Wildlife Research Institute
    (TAWIRI) to carry out the first-ever survey of large carnivores, their prey and
    human impacts across the landscape
- claim: A management support agreement with TAWA signed in July 2025 covers law enforcement
    and monitoring in the Ugalla and Luganzo-Tongwe game reserves.
  url: https://panthera.org/blog-post/aardwolves-servals-year-panthera-tanzania-our-newest-country-program
  fetched: 2026-11-13
  quote: That initial work led to a formal management support agreement with TAWA,
    signed in July 2025, for management support (including law enforcement and monitoring)
    in Ugalla and Luganzo-Tongwe Game Reserves
- claim: It uses SMART in western Tanzania to coordinate patrol coverage and track
    effort, and runs operations control rooms for live patrol tracking.
  url: https://panthera.org/blog-post/aardwolves-servals-year-panthera-tanzania-our-newest-country-program
  fetched: 2026-11-13
  quote: The OCRs are used for live patrol tracking and for joint TAWA-Panthera SMART
    patrol briefings and debriefings
