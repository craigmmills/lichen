summary: A centre launched at Sokoine University of Agriculture in January 2016, which SUA
  says will manage the national system for measuring, reporting and verifying forest carbon.
facts:
- claim: NIBIO says Tanzania launched the centre at Sokoine University of Agriculture in Morogoro
    in January 2016.
  url: https://nibio.no/en/projects/ncmc-national-carbon-monitoring-center-for-tanzania
  fetched: 2026-11-08
  quote: In January 2016, Tanzania launched a national carbon monitoring centre (NCMC) at
    Sokoine University of Agriculture in Morogoro.
- claim: SUA describes it as the institution that will manage the national system for measuring,
    reporting and verifying carbon in forest ecosystems.
  url: https://suanet.ac.tz/project/establishing-national-carbon-monitoring-centre-tanzania-ncmc
  fetched: 2026-11-08
  quote: The NCMC is the institution that will manage an effective national system of measuring,
    reporting and verification (MRV) of carbon in forest ecosystems for the United Nations
    Framework Convention on Climate Change (UNFCCC)
- claim: A March 2017 news item on NIBIO’s page says it teamed up with NCMC to establish the
    Tanzanian National Forest Monitoring System.
  url: https://nibio.no/en/projects/ncmc-national-carbon-monitoring-center-for-tanzania
  fetched: 2026-11-08
  quote: NIBIO teams up with Tanzanian National Carbon Monitoring Center (NCMC) to establish
    the Tanzanian National Forest Monitoring System.
