status: closed
summary: Closed JRS-funded project, 2017 to 2020 with $284,400, to set up standardised bee
  monitoring starting in Arusha Region; JRS reported 1,252 specimens of 135 species from 37
  landscapes.
facts:
- claim: JRS gave the College of African Wildlife Management, Mweka, $284,400 for the project,
    with funding dates of 1 October 2017 to 30 September 2020.
  url: https://jrsbiodiversity.org/grants/cawmm-2017/
  fetched: 2026-11-09
  quote: $284,400
- claim: The project aimed to develop and run a standardised monitoring programme for bee
    collection, starting in the Arusha Region.
  url: https://jrsbiodiversity.org/grants/cawmm-2017/
  fetched: 2026-11-09
  quote: Development and implementation of a standardized monitoring program for bee collection.
- claim: Project data were to be shared through a Mweka database, GBIF and the Tanzanian Biodiversity
    Information Management Tool.
  url: https://jrsbiodiversity.org/grants/cawmm-2017/
  fetched: 2026-11-09
  quote: Share project data openly via a Mweka-based database, as well as via the Global Biodiversity
    Information Facility (GBIF) and the Tanzanian Biodiversity Information Management Tool
    (BIMT).
- claim: JRS reported 1,252 bee specimens of 135 species collected from 37 landscapes in the
    Arusha and Kilimanjaro regions, with 50 to be identified by morphometrics and barcoding.
  url: https://jrsbiodiversity.org/grants/cawmm-2017/
  fetched: 2026-11-09
  quote: Of these specimens, 50 samples will have morphometric and bar-code taxonomic identification
    analysis performed.
