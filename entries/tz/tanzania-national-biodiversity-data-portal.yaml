  for 2019 to 2022.
facts:
- claim: The TanBIF site names the portal as the Tanzania National Biodiversity Data
    Portal and says it is based on Atlas of Living Australia technologies.
  url: https://tanbif.costech.or.tz/pages/about-us
  fetched: 2026-11-09
  quote: Revolution in information technologies let into the Atlas of Living Australia
    (ALA) Technologies based TanBIF portal.
- claim: The JRS Biodiversity Foundation gave the Dar es Salaam Institute of Technology
    a grant of $240,000 from 2019 to 2022 to develop a national biodiversity data
    portal based on ALA open-source software.
  url: https://jrsbiodiversity.org/grants/ditatlas/
  fetched: 2026-11-09
  quote: Development of a National Biodiversity Data Portal (NBDP) based on ALA Open
    Source Software
- claim: The JRS grant page set the aim of developing the Atlas of Living Tanzania
    as a hub for biodiversity data from various sources, starting with pollinator
    data.
  url: https://jrsbiodiversity.org/grants/ditatlas/
  fetched: 2026-11-09
  quote: Develop the Atlas of Living Tanzania (ALT), a biodiversity web portal to
    serve as a hub for biodiversity data from various sources.
