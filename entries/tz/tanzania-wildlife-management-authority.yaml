summary: Authority set up by ministerial order in 2014 to conserve and sustainably use wildlife
  resources in protected areas, which provided aircraft and staff for a 2022 aerial census.
facts:
- claim: A 2023 TAWIRI aerial survey report says TAWA was set up by ministerial order in 2014
    to conserve and use wildlife resources in game reserves, game controlled areas and open
    areas.
  url: https://www.tawiri.or.tz/wp-content/uploads/2024/04/Saadan-Wami-Mbiki_Final.pdf
  fetched: 2026-11-08
  quote: Tanzania Wildlife Management Authority (TAWA) was established by Ministerial order
    in 2014 to sustainably conserve and utilise wildlife resources in Game Reserves, Game
    Controlled Areas and Open Areas.
- claim: The same report thanks TAWA and TANAPA for providing aircraft, personnel and logistics
    for the 2022 Saadani-Wami-Mbiki aerial census.
  url: https://www.tawiri.or.tz/wp-content/uploads/2024/04/Saadan-Wami-Mbiki_Final.pdf
  fetched: 2026-11-08
  quote: The provision of aircraft, personnel, and logistical support from these entities
    played a central role in the successful execution of this census.
- claim: The Grumeti Fund's partner page gives TAWA's mission as conserving and sustainably
    using wildlife resources in protected areas.
  url: https://grumetifund.org/our-partners/
  fetched: 2026-11-08
  quote: Tanzania Wildlife Management Authority’s mission is to conserve and sustainably utilize
    wildlife resources in protected areas.
- claim: Its mission is to conserve and sustainably use wildlife resources in protected areas.
  url: https://www.tawa.go.tz
  fetched: 2026-11-08
  quote: TAWA's mission is to conserve and sustainably utilize wildlife resources in protected
    areas.
- claim: An announcement dated 10 September 2026 invites applications for investment in tourism
    facilities and services in areas it manages.
  url: https://www.tawa.go.tz
  fetched: 2026-11-08
  quote: IN AREAS MANAGED BY TANZANIA WILDLIFE MANAGEMENT AUTHORITY (TAWA)
