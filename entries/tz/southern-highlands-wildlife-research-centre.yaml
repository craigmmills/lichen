facts:
- claim: TAWIRI's page says the centre was established in 2024 under TAWIRI to coordinate
    and strengthen wildlife research in the Southern Highlands.
  url: https://www.tawiri.or.tz/southern-highlands-wildlife-research-centre/
  fetched: 2026-11-13
  quote: The Southern Highlands Wildlife Research Centre (SHWRC) was established in
    2024 under the Tanzania Wildlife Research Institute (TAWIRI) to coordinate and
    strengthen wildlife research in the Southern Highlands of Tanzania.
- claim: Its headquarters is at Kihesa Kilolo in Iringa Region.
  url: https://www.tawiri.or.tz/southern-highlands-wildlife-research-centre/
  fetched: 2026-11-13
  quote: The headquarters of SHWRC is located at Kihesa Kilolo in Iringa Region
- claim: It implements an adaptive conservation programme for the Kihansi spray toad,
    including rigorous scientific monitoring.
  url: https://www.tawiri.or.tz/southern-highlands-wildlife-research-centre/
  fetched: 2026-11-13
  quote: implements an adaptive conservation program for the Kihansi Spray Toad (Nectophrynoides
    asperginis).
- claim: In experimental reintroduction trials, 700 toads have been released into
    the restored Upper Kihansi wetlands and 100 into the Lululutonya wetland, with
    long-term monitoring of survival, reproduction and habitat performance ongoing.
  url: https://www.tawiri.or.tz/southern-highlands-wildlife-research-centre/
  fetched: 2026-11-13
  quote: with long-term ecological monitoring ongoing to assess survival, reproduction,
    and habitat performance.
- claim: The page names Dr Bukombe John Kija as centre director.
  url: https://www.tawiri.or.tz/southern-highlands-wildlife-research-centre/
  fetched: 2026-11-13
  quote: Dr. Bukombe John Kija CENTRE DIRECTOR
