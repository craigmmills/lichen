  from photographs.
facts:
- claim: A wildlife management body under the Tanzanian government that manages the Ngorongoro
    Conservation Area.
  url: https://www.ncaa.go.tz
  fetched: 2026-11-08
  quote: The Ngorongoro Conservation Area Authority (NCAA) is a well-established wildlife
    management entity under the Tanzanian government, dedicated to managing the Ngorongoro
    Conservation Area
- claim: Gives its address as P.O. Box 1, Ngorongoro Crater, Arusha.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-08
  quote: P.O. Box 1, Ngorongoro Crater Arusha, Tanzania
- claim: Says it has identified key areas for research for monitoring purposes in the conservation
    area.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-08
  quote: NCAA has identified key areas to conduct research for monitoring purposes and sustainability
    of the area.
- claim: Its research and monitoring page lists lion research conducted by the Ngorongoro
    Lion Project (KopeLion).
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-08
  quote: Lion population and human lion conflict mitigation; Conducted by the Ngorongoro Lion
    Project – Kopelion .
- claim: The same page lists cheetah monitoring by the Serengeti Cheetah Project, which identifies
    individuals from photographs by spot pattern or matching software.
  url: https://www.ncaa.go.tz/research-and-monitoring/
  fetched: 2026-11-08
  quote: Individual cheetahs were identified directly from photographs using their distinctive
    spot patterns or matching software on a computer.
