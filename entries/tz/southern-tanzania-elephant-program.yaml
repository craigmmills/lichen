  url: https://www.stzelephants.or.tz/
  fetched: 2026-11-08
  quote: STEP is a Tanzanian non-profit founded in 2014.
- claim: Its research and monitoring projects cover human-elephant conflict, the impact of
    corridor restoration, and how elephants recover from poaching.
  url: https://www.stzelephants.or.tz/
  fetched: 2026-11-08
  quote: Our research and monitoring projects include understanding the drivers of and solutions
    to human-elephant conflict, assessing the impact of corridor restoration, and studying
    how elephants are affected by and recover from poaching.
