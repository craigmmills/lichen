summary: A programme run by the Wildlife Conservation Society that uses the SMART
  tool, supports law enforcement monitoring in Ruaha-Katavi, and says wild dog surveys
  begun in 2021 continue.
facts:
- claim: In the Ruaha-Katavi landscape WCS says it supports enhanced law enforcement
    monitoring using the SMART approach.
  url: https://tanzania.wcs.org/Landscapes/Greater-Ruaha-Katavi.aspx
  fetched: 2026-11-15
  quote: enhanced law enforcement monitoring (using the SMART approach
- claim: It began field survey work on African wild dogs across the landscape in 2021,
    and says the work continues.
  url: https://tanzania.wcs.org/Landscapes/Greater-Ruaha-Katavi.aspx
  fetched: 2026-11-15
  quote: In 2021, we initiated field survey work to gather much needed insight into
    the species’ distribution, numbers and behavior across the landscape.
- claim: WCS says it funded the first landscape-level systematic aerial survey in
    2018 and repeated it in 2021.
  url: https://tanzania.wcs.org/Landscapes/Greater-Ruaha-Katavi.aspx
  fetched: 2026-11-15
  quote: WCS also funded the first landscape-level systematic aerial survey in 2018
    and repeated this in 2021
