summary: Bird atlas data for Tanzania, which Neil Baker wrote in 2019 had been collected with
  Liz Baker since 1980, used for maps showing record numbers per species.
facts:
- claim: Neil Baker wrote in 2019 that he and Liz Baker had collected bird atlas data for
    Tanzania since 1980 and entered it into databases since the late 1980s.
  url: https://a-rocha-kenya.github.io/KenyaBirdsNet/Messages/20190823-re-kenyabirdsnet-kenya-bird-map-data.html
  fetched: 2026-11-09
  quote: Liz and I have been collecting bird atlas data for Tanzania since 1980, entering
    it into databases since the late 80s
- claim: He wrote that he prepares square, seasonality and geo-referenced maps from the data,
    showing record numbers for each species.
  url: https://a-rocha-kenya.github.io/KenyaBirdsNet/Messages/20190823-re-kenyabirdsnet-kenya-bird-map-data.html
  fetched: 2026-11-09
  quote: I can then prepare square / seasonality maps and geo-referenced maps and I make a
    point of always showing how many records we have for each species.
- claim: Anadolu Agency described the Tanzania Bird Atlas Project as collecting data on bird
    populations and their habitats for conservation.
  url: https://aa.com.tr/en/africa/tanzania-battling-to-save-endangered-bird-species/3286385
  fetched: 2026-11-09
  quote: The Tanzania Bird Atlas Project, for instance, collects data on bird populations
    and their habitats, providing crucial information for conservation efforts.
- claim: Its site carries a copyright line in the names of Liz and Neil Baker from 1985 to
    2026.
  url: http://tanzaniabirdatlas.net
  fetched: 2026-11-09
  quote: copyright © 1985-2026 Liz and Neil Baker
