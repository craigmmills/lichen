  for Allen Coral Atlas mapping.
facts:
- claim: Blue Resources Trust has carried out annual reef monitoring in and around
    Kayankerni Marine Sanctuary since 2016, funded by the Tokyo Cement Group.
  url: https://kayankerni.org/?p=747
  fetched: 2026-11-12
  quote: Since 2016 the Blue Resources Trust (BRT) has been engaged in annual reef
    monitoring of coral reefs in and around Kayankerni Marine Sanctuary with the financial
    support of the Tokyo Cement Group.
- claim: The work collects long-term data on coral health and fish populations.
  url: https://kayankerni.org/?p=747
  fetched: 2026-11-12
  quote: A main focus has been collecting long term data on coral health and fish
    populations to understand changes over time
- claim: Blue Resources Trust has made GIS maps of the area's reefs and supported
    mapping of Kayankerni reef as a pilot under the Allen Coral Atlas.
  url: https://kayankerni.org/?p=747
  fetched: 2026-11-12
  quote: BRT has also developed detailed GIS based maps of the coral reefs of the
    area and supported the mapping of Kayankerni reef as a pilot project under the
    Allen Coral Atlas.
