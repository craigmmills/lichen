summary: Sri Lankan NGO first formed in 1894 as the Ceylon Game Protection Society,
  reported as the first NGO there incorporated by Act of Parliament and partner of
  LOLC Holdings in leopard monitoring.
facts:
- claim: The Morning says it was first formed in 1894 as the Ceylon Game Protection
    Society.
  url: https://www.themorning.lk/articles/39268
  fetched: 2026-11-12
  quote: The Wildlife and Nature Protection Society of Sri Lanka was first formed
    in 1894 under the name “Ceylon Game Protection Society”.
- claim: The same article says it was the first NGO in Sri Lanka to be incorporated
    by an Act of Parliament.
  url: https://www.themorning.lk/articles/39268
  fetched: 2026-11-12
  quote: Thus, the Society became the first NGO in Sri Lanka (then Ceylon) to be incorporated
    by an Act of Parliament.
- claim: LOLC's leopard conservation page says it and LOLC Holdings set up six research
    stations to monitor leopard populations with camera traps and surveys.
  url: https://lolc.com/community-and-enviroment/sri-lankan-leopard-conservation
  fetched: 2026-11-12
  quote: The initiative has established six research stations across diverse locations—Panama,
    Sinharaja, Kilinochchi, Belihuloya, Kotagala, and Sigiriya—to monitor leopard
    populations using advanced methods like camera traps and surveys.
