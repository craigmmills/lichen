summary: NGO co-founded by Anya Ratnayaka that studies fishing cats, with a 2025 camera
  trap project and a reported EUR 17,920 grant from the Van Tienhoven Foundation for
  camera traps and community surveys.
facts:
- claim: WorldAtlas (April 2021) says Anya Ratnayaka co-founded the NGO Small Cat
    Advocacy & Research and in 2013 started the Urban Fishing Cat Conservation Project,
    which was studying fishing cats in Colombo's urban wetlands.
  url: https://worldatlas.com/news/meet-the-secretive-fishing-cats-of-colombo-sri-lanka-and-the-conservationist-committed-to-save-them.html
  fetched: 2026-11-12
  quote: co-founded the NGO Small Cat Advocacy & Research . In 2013, she also started
    the Urban Fishing Cat Conservation Project
- claim: Its December 2025 Rufford progress report says it set up camera traps from
    1 May 2025 and checked them every 30 days at both study sites.
  url: https://media.rufford.org/media/project_reports/45051-2_Rufford_report_2025_12.pdf
  fetched: 2026-11-12
  quote: started to setup camera traps from 2025 May 1st and keep continuing up to
    now.
- claim: The report names the project's implementer as the Save Fishing Cat Conservation
    Project and Small Cat Advocacy & Research Organization.
  url: https://media.rufford.org/media/project_reports/45051-2_Rufford_report_2025_12.pdf
  fetched: 2026-11-12
  quote: 'Project conducted by: Save Fishing cat conservation Project/ Small cat advocacy
    & Research Organization'
- claim: The Van Tienhoven Foundation lists a 2025 grant of EUR 17,920 to it for a
    project combining camera traps and community surveys in the Bopaththalawa and
    Rakshashawa protected areas.
  url: https://www.vantienhovenfoundation.com/projects/promoting-coexistence-in-the-central-highlands-of-sri-lanka/
  fetched: 2026-11-12
  quote: Using a combination of camera traps and community surveys, the project will
    generate critical ecological and socio-cultural data
