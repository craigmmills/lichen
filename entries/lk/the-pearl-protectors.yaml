facts:
- claim: Its 2026 Turtle Patrol report says it is a volunteer-based, non-profit marine
    conservation organisation in Sri Lanka, established in 2018.
  url: https://pearlprotectors.org/wp-content/uploads/2026/04/Turtle-Patrol-Report-2026_Final_24042026.pdf
  fetched: 2026-11-12
  quote: The Pearl Protectors is a volunteer -based and non-profit marine conservation
    organization in Sri Lanka. Established in 2018
- claim: Its 2026 Turtle Patrol report says patrollers recorded the locations of nests,
    hatchlings and turtles in a Turtle Patrol App it developed.
  url: https://pearlprotectors.org/wp-content/uploads/2026/04/Turtle-Patrol-Report-2026_Final_24042026.pdf
  fetched: 2026-11-12
  quote: locations in the Turtle Patrol App developed by the Pearl Protectors
- claim: The report says 168 nests were identified and conserved in the 2026 season,
    89 at Dehiwala and 79 at Mount Lavinia.
  url: https://pearlprotectors.org/wp-content/uploads/2026/04/Turtle-Patrol-Report-2026_Final_24042026.pdf
  fetched: 2026-11-12
  quote: A total of 168 nests were identified and conserved through the ex-situ conservation
    programme, including 89 nests in Dehiwala and 79 nests in Mount Lavinia.
- claim: The report says the 2026 patrol collected spatial and biological data as
    well as conserving nests.
  url: https://pearlprotectors.org/wp-content/uploads/2026/04/Turtle-Patrol-Report-2026_Final_24042026.pdf
