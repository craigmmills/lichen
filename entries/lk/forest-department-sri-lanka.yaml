facts:
- claim: The ministry describes its aim to conserve forests with particular regard to biodiversity, soils
    and water.
  url: https://www.env.gov.lk/web/index.php/en/department-of-forest-conservation
  fetched: 2026-11-08
  quote: To conserve forests for posterity, with particular regard to biodiversity, soils, water, and
    historical, cultural, religious and aesthetic values.
- claim: Has technical divisions for Geographical Information Systems and Forest Inventory, and for Bio
    Diversity and Watershed Management.
  url: https://www.env.gov.lk/web/index.php/en/department-of-forest-conservation
  fetched: 2026-11-08
  quote: (vi) Geographical Information Systems & Forest Inventory (vii) Ecotourism and (viii) Bio Diversity
    & Watershed Management divisions are headed by Conservators of Forests
- claim: The ministry's page gives its address in Battaramulla and its website.
  url: https://www.env.gov.lk/web/index.php/en/department-of-forest-conservation
  fetched: 2026-11-08
  quote: forestdept.gov.lk
- claim: A 2020 Global Forest Watch blog says the department monitors two-thirds of Sri Lanka's natural
    forest, declared as protected area under the Forest Ordinance.
  url: https://www.globalforestwatch.org/blog/users-in-action/sri-lanka-covid-19-forest-monitoring
  fetched: 2026-11-08
  quote: The Department of Forest Conservation monitors two-thirds of this natural forest, which has been
    declared as protected area under the Forest Ordinance of Sri Lanka.
- claim: A July 2020 Global Forest Watch blog said the department had produced staff manuals on Global
    Forest Watch and Forest Watcher since the lockdown began, and used GLAD alerts to check reported encroachment.
  url: https://www.globalforestwatch.org/blog/users-in-action/sri-lanka-covid-19-forest-monitoring
  fetched: 2026-11-08
  quote: Since the beginning of lockdown, the department has produced manuals for staff on GFW and the
    Forest Watcher mobile app.
