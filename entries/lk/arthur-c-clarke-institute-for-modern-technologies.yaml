  quote: land use land cover mapping for Sri Lanka
- claim: A study page examines free polarimetric interferometric radar data for estimating forest height
    in Sri Lanka, as an input to forest biomass estimation and forest monitoring.
  url: https://www.accimt.ac.lk/space-forest/
  fetched: 2026-11-08
  quote: This study attempts to examine the potential of PolInSAR free data for Forest Height estimation
    Procedure of Sri Lanka.
- claim: A study page examines integrated hyperspectral and multitemporal multispectral satellite imagery
    for small-scale land use and land cover mapping in Ampara District.
