- claim: The division's current projects include a national hub for receiving and distributing Earth observation
    data, and feasibility studies include land use and land cover mapping for Sri Lanka.
  url: https://www.accimt.ac.lk/space-applications/
  fetched: 2026-11-08
  quote: national hub for receiving and distribution of earth observation data
