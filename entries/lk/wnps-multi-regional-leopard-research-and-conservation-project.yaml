summary: Leopard study outside protected areas, which the Daily Mirror says the Wildlife
  and Nature Protection Society launched in 2022 with LOLC Holdings, using camera
  traps at six field stations, with intensified studies reported as planned from 2027.
facts:
- claim: The Daily Mirror says the Wild Cats Subcommittee of the Wildlife and Nature
    Protection Society launched the project in 2022, in a partnership with LOLC Holdings,
    to study leopard populations outside protected areas.
  url: https://www.dailymirror.lk/news-features/World-Leopard-Day-LRCP-to-facilitate-human-leopard-coexistence-using-evidence-based-insights/131-339934
  fetched: 2026-11-12
  quote: the Wild Cats Subcommittee of the Wildlife and Nature Protection Society
    (WNPS) launched the Multi-Regional Leopard Research and Conservation Project in
    2022
- claim: The Daily Mirror says activities run from six field stations.
  url: https://www.dailymirror.lk/news-features/World-Leopard-Day-LRCP-to-facilitate-human-leopard-coexistence-using-evidence-based-insights/131-339934
  fetched: 2026-11-12
  quote: Activities are being conducted in six field stations located in Panama, Sigiriya,
    Kilinochchi, Kotagala, Belihuloya and Kalawana.
- claim: The subcommittee's co-chair told the Daily Mirror that each centre coordinator
    has camera traps and has been trained to install them in areas with leopard incidents.
  url: https://www.dailymirror.lk/news-features/World-Leopard-Day-LRCP-to-facilitate-human-leopard-coexistence-using-evidence-based-insights/131-339934
  fetched: 2026-11-12
  quote: Each centre coordinator is now equipped with camera traps and has been trained
    to install camera traps in areas with leopard incidents
- claim: The Daily Mirror reported in May 2026 a plan to intensify camera-trap studies
    of leopard activity patterns across the six study regions from 2027.
  url: https://www.dailymirror.lk/news-features/World-Leopard-Day-LRCP-to-facilitate-human-leopard-coexistence-using-evidence-based-insights/131-339934
  fetched: 2026-11-12
  quote: research efforts will be intensified with a strong focus on camera-trap–based
    studies to identify spatiotemporal activity patterns of leopards across multiple
    landscapes within the six study regions
