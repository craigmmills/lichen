summary: Active trust that in 2024 maintained long-term monitoring at seven sites and began new camera
  surveys with the Department of Wildlife Conservation, and which the Lanka Environment Fund says set
  up 18 leopard camera stations in Kotagala.
facts:
- claim: In 2024 it maintained long-term monitoring of seven sites across most of Sri Lanka's climatic
    regions.
  url: https://www.wwct.org/publications/annual-report-2024
  fetched: 2026-11-08
  quote: In 2024 WWCT maintained its long-term monitoring of 7 varied sites across most of Sri Lanka’s
    climatic regions
- claim: In 2024 it began new remote camera surveys in the Victoria-Randenigala-Rantambe Sanctuary with
    the Department of Wildlife Conservation.
  url: https://www.wwct.org/publications/annual-report-2024
  fetched: 2026-11-08
  quote: WWCT also initiated new remote camera surveys in the Victoria-Randenigala-Rantambe (VRR) Sanctuary
    in 2024, in collaboration with the Department of Wildlife Conservation (DWC).
- claim: The Lanka Environment Fund says WWCT set up 18 new remote camera stations in the Kotagala area
    to monitor leopards.
  url: https://www.lankaenvironmentfund.org/grants/corridors-for-conservation
  fetched: 2026-11-08
  quote: setting up 18 new remote camera stations and successfully monitoring 10 leopards (3 males, 4
    females and 4 cubs).
- claim: The Lanka Environment Fund says WWCT also records other species in the area, including the golden
    palm civet and pangolin.
  url: https://www.lankaenvironmentfund.org/grants/corridors-for-conservation
  fetched: 2026-11-08
  quote: Apart from monitoring leopards, the focus species of this project due to its umbrella role in
    the ecosystem, the WWCT has also been observing other biodiversity in the area
