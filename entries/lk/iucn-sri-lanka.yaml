facts:
- claim: An IUCN story says researchers from IUCN Sri Lanka photographed a rare cardinalfish
    during a coral reef survey around Kakkativu Island in Palk Bay.
  url: https://iucn.org/story/202609/forgotten-fish-resurfaces-underexplored-north-western-seascape-sri-lanka-almost-after
  fetched: 2026-11-12
  quote: During a coral reef survey in the shallow waters surrounding Kakkativu Island
    of Palk Bay in the north-western of Sri Lanka, a group of researchers from IUCN
    Sri Lanka photographed a small cardinalfish
- claim: The same story says its Erumaitivu-Kakkativu coral reef project, supported
    by Sampath Bank PLC, runs baseline surveys of coral reefs, associated species
    and ecological conditions as a foundation for future monitoring.
  url: https://iucn.org/story/202609/forgotten-fish-resurfaces-underexplored-north-western-seascape-sri-lanka-almost-after
  fetched: 2026-11-12
  quote: Baseline surveys are documenting coral reefs, associated species and ecological
    conditions, helping to establish a scientific foundation for longer-term conservation
    action and future monitoring.
