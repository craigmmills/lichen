  fetched: 2026-11-08
  quote: The aim of this project is to identify and establish forest corridors in the Central Highlands
    of Sri Lanka.
- claim: The Lanka Environment Fund says the project has 53 remote camera stations.
  url: https://www.lankaenvironmentfund.org/grants/corridors-for-conservation
  fetched: 2026-11-08
  quote: Thus far, this project has a total of 53 remote camera stations (18 new and 35 old)
