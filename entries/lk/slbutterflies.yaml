facts:
- claim: Contains photographs of 244 of the 248 butterfly species found in Sri Lanka.
  url: https://slbutterflies.lk/
  fetched: 2026-11-08
  quote: It contains photographs of 244 species out of the 248 species found in Sri Lanka up to date.
- claim: After the Butterfly Conservation Society of Sri Lanka was founded in 2013, the site was upgraded
    to an online database so that recorders could enter field data directly.
  url: https://slbutterflies.lk/
  fetched: 2026-11-08
  quote: Hence it was decided to upgrade SLButterflies as an online data base,
- claim: Distribution maps and seasonal abundance graphs are regularly updated from the records.
  url: https://slbutterflies.lk/
  fetched: 2026-11-08
