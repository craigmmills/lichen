summary: Registered non-profit in Sri Lanka that says it has created long-term datasets for elasmobranch
  fisheries and coral reef monitoring.
facts:
- claim: The Save Our Seas Foundation project page says the Blue Resources Trust team want to understand
    which sharks, rays and skates are caught in Sri Lanka's artisanal fisheries, focusing on landing sites
    around Valaichchenai.
  url: https://saveourseas.com/project/whats-the-catch-understanding-shark-catches-in-large-scale-data-limited-artisanal-fisheries
  fetched: 2026-11-08
  quote: Daniel and the team from the Blue Resource Trust want to understand which sharks, rays and skates
    are caught in Sri Lanka’s artisanal fisheries.
- claim: The project's stated aim is a long-term monitoring programme for shark and ray species in Sri
    Lanka's small-scale fisheries.
  url: https://saveourseas.com/project/whats-the-catch-understanding-shark-catches-in-large-scale-data-limited-artisanal-fisheries
  fetched: 2026-11-08
  quote: To develop a long-term monitoring programme for shark and ray species caught in Sri Lanka’s small-scale
    fisheries.
- claim: The project plans a public access toolkit and an R package for other organisations to set up
    their own monitoring.
  url: https://saveourseas.com/project/whats-the-catch-understanding-shark-catches-in-large-scale-data-limited-artisanal-fisheries
  fetched: 2026-11-08
  quote: the project will build a public access toolkit and complementary R package
- claim: Registered as a non-profit in Sri Lanka.
  url: https://www.blueresources.org/about
  fetched: 2026-11-08
  quote: We are registered as a non-profit in Sri Lanka (GA 3218).
- claim: Says it has created long-term datasets for elasmobranch fisheries and coral reef monitoring.
  url: https://www.blueresources.org/about
  fetched: 2026-11-08
  quote: creating long-term datasets for elasmobranch fisheries and coral reef monitoring
- claim: Runs a long-term coral reef monitoring programme on the east coast of Sri Lanka.
  url: https://www.blueresources.org/coral-reefs
  fetched: 2026-11-08
  quote: A long-term programme monitoring coral reef health and resilience on the east coast of Sri Lanka,
    and providing technical advise to inform conservation.
- claim: Its Seagrass Project studied Sri Lanka's seagrass meadows, with research and monitoring carried
    out with Project Seagrass and focused on Puttalam Lagoon.
  url: https://www.blueresources.org/seagrass-climate-change
  fetched: 2026-11-08
  quote: Through island-wide research and monitoring conducted with Project Seagrass
