summary: Sri Lankan authority whose staff wrote a 2024 conference paper on mapping
  Western Province wetlands, digitised in QGIS from Google Earth imagery and checked
  at 789 random field locations.
facts:
- claim: An ACRS 2024 paper by its staff, giving the authority's Battaramulla address,
    describes mapping the wetlands of Western Province, classifying them under the
    Ramsar scheme and preparing an online spatial wetland inventory.
  url: https://acrs-aars.org/proceeding/ACRS2024/AB0161.pdf
  fetched: 2026-11-12
  quote: Province of Sri Lanka to map and prepare an Online Spatial Wetland Inventory,
    to classify the wetlands
- claim: The paper gives nine of its ten authors an affiliation with the Central Environmental
    Authority, Battaramulla; the other author is affiliated with the International
    Water Management Institute.
  url: https://acrs-aars.org/proceeding/ACRS2024/AB0161.pdf
  fetched: 2026-11-12
  quote: Central Environmental Authority, No 104, Denzil Kobbekaduwa Mawatha, Battaramulla,
    Sri Lanka
- claim: The paper says wetlands were digitised in QGIS from current Google Earth
    satellite imagery and checked at 789 randomly selected field locations.
  url: https://acrs-aars.org/proceeding/ACRS2024/AB0161.pdf
  fetched: 2026-11-12
  quote: locations were randomly selected (Figure 5) from identified wetlands for
    field verification
- claim: The paper says the research was initiated by the CEA.
  url: https://acrs-aars.org/proceeding/ACRS2024/AB0161.pdf
  fetched: 2026-11-12
  quote: This research was initiated by CEA
- claim: The paper cites a CEA report, State of Wetlands in Colombo, 2023.
  url: https://acrs-aars.org/proceeding/ACRS2024/AB0161.pdf
  fetched: 2026-11-12
  quote: 'Central Environmental Authority. (2023). State of Wetlands in Colombo: 2023
    Report.'
