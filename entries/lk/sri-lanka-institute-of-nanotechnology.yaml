  quote: Sri Lanka Institute of Nanotechnology (SLINTEC), Mahenwatta, Pitipana, Homagama , Sri Lanka
- claim: Describes itself as the first public-private research institute in Sri Lanka.
  url: https://api.gbif.org/v1/organization/10edba3c-8fe0-4a8c-8767-312d0e2badb5
  fetched: 2026-11-08
  quote: SLINTEC is the first public-private research institute in Sri Lanka
- claim: Publishes a soil bacterial eDNA metabarcoding dataset from agricultural fields in Sri Lanka's
    24 main agroecological zones, with 14,958 records, under a CC0 licence; GBIF says the research was
    funded by the National Research Council of Sri Lanka.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=10edba3c-8fe0-4a8c-8767-312d0e2badb5
  fetched: 2026-11-08
  quote: The research was carried out at the Sri Lanka Institute of Nanotechnology and was funded by the
    National Research Council of Sri Lanka.
- claim: The dataset was collected by eDNA metabarcoding of the 16S rDNA gene.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=10edba3c-8fe0-4a8c-8767-312d0e2badb5
  fetched: 2026-11-08
  quote: Data was collected by eDNA metabarcoding, where the V4 region of the 16S rDNA gene was analysed
    to capture the soil bacterial diversity.
