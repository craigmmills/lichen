summary: Marine conservation organisation that says it has maintained photo-identification databases on
  all key marine mammal species since 2008; its flagship is the Sri Lankan Blue Whale Project.
facts:
- claim: Describes itself as a marine conservation research and education organisation.
  url: https://oceanswell.org/
  fetched: 2026-11-08
  quote: MARINE CONSERVATION RESEARCH AND EDUCATION ORGANISATION
- claim: Says it has maintained photo-identification databases on all key marine mammal species since
    2008.
  url: https://oceanswell.org/what-we-do
  fetched: 2026-11-08
  quote: We have maintained photo-identification databases on all key species of marine mammals dating
    back to 2008.
- claim: The Sri Lankan Blue Whale Project, established in 2008, is its flagship project.
  url: https://oceanswell.org/what-we-do
  fetched: 2026-11-08
  quote: Established in 2008, is the longest-running project on blue whales in the northern Indian Ocean
    and the flagship project of Oceanswell.
- claim: In February 2026 ran a remote volunteer programme in which volunteers analysed and classified
    humpback whale song for its PhD programme.
  url: https://oceanswell.org/wp-content/uploads/2026/04/Oceanswell-Quarterly-Jan-March-2026.pdf
  fetched: 2026-11-08
  quote: Participants learned how to analyze whale songs,
- claim: The Lanka Environment Fund says it funded a component of Oceanswell's research analysing whale
    species distribution off the south coast, using Oceanswell's long-term dataset from 10 years of field
    surveys.
  url: https://www.lankaenvironmentfund.org/grants/analysing-changes-in-whale-species-composition
  fetched: 2026-11-08
  quote: The project uses Oceanswell’s unique long-term dataset to examine shifts in species composition,
    and potential environmental drivers of these shifts.
- claim: Schmidt Marine Technology Partners lists it at Weligama Bay, Sri Lanka.
  url: https://schmidtmarine.org/ecosystem-support/
  fetched: 2026-11-08
  quote: Oceanswell Weligama Bay, Sri Lanka
