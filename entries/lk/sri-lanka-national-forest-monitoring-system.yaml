summary: Online geo-portal for forest data, described as newly launched in a 2017 report, with satellite
  land monitoring, a National Forest Inventory and greenhouse gas inventory data as components, built
  by the Forest Department.
facts:
- claim: A 2017 report described the newly launched system as an online geo-portal for forest-related
    data storage, analysis and dissemination.
  url: https://www.ft.lk/Other-Sectors/sri-lankas-redd-program-launches-countrys-first-national-forest-monitoring-system-platform/57-610849
  fetched: 2026-11-08
  quote: This online geo-portal containing forest-related data storage, analysis, and information dissemination
- claim: The 2017 report listed a satellite land monitoring system, the National Forest Inventory and
    greenhouse gas inventory data as its three components.
  url: https://www.ft.lk/Other-Sectors/sri-lankas-redd-program-launches-countrys-first-national-forest-monitoring-system-platform/57-610849
  fetched: 2026-11-08
  quote: 'It has three major components that includes: the Satellite Land Monitoring Systems, which collects
    and assesses activity data (over time) related to forest land'
