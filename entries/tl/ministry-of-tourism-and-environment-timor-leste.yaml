    support from UNDP and GEF funding.
  url: https://www.undp.org/timor-leste/news/timor-leste-elevates-its-commitment-biodiversity-empowering-communities-lead-conservation-and-foster-climate-resilience-outlined-its
  fetched: 2026-11-12
  quote: prepared by the Ministry of Tourism and Environment with support from the United Nations Development
    Programme (UNDP) and funding from the Global Environment Facility (GEF)
- claim: On behalf of the government, endorsed the National Biodiversity Strategy and Action Plan 2026-2030
    and submitted it to the Convention on Biological Diversity.
  url: https://www.undp.org/timor-leste/news/timor-leste-sets-new-direction-nature-and-people-its-national-biodiversity-strategy-and-action-plan-2026-2030
