summary: OceanX's first Timor-Leste research mission, fourteen days along the northern coast and Atauro
  Island, which mapped close to 5,000 square kilometres of seabed and recorded sixty blue whale sightings.
facts:
- claim: OceanX completed its first research mission in Timor-Leste, fourteen days of science along the
    northern coast and Atauro Island.
  url: https://oceanx.org/press-room/oceanx-completes-landmark-timor-leste-expedition-delivering-one-of-the-region-s-m
  fetched: 2026-11-12
  quote: OceanX has completed its first research mission in Timor-Leste, carrying out fourteen days of
    integrated science and exploration across the northern coast and Atauro Island region.
- claim: Mapped close to 5,000 square kilometres of seabed and recorded more than 100 hours of ROV and
    submersible activity.
  url: https://oceanx.org/press-room/oceanx-completes-landmark-timor-leste-expedition-delivering-one-of-the-region-s-m
  fetched: 2026-11-12
  quote: researchers mapped close to five thousand square kilometers of seabed and recorded more than
    one hundred hours of sustained ROV and submersible activity
- claim: Helicopter teams, drones and small vessels gave sixty blue whale sightings and genetic and microbiome
    samples.
  url: https://oceanx.org/press-room/oceanx-completes-landmark-timor-leste-expedition-delivering-one-of-the-region-s-m
  fetched: 2026-11-12
  quote: Helicopter teams, drones, and small vessels enabled sixty blue whale sightings and nearly fifty
    individual encounters, which produced a strong set of genetic and microbiome samples.
- claim: OceanX says the data will support biodiversity assessments and long-term baselines for the Atauro
    Marine Protected Area.
  url: https://oceanx.org/press-room/oceanx-completes-landmark-timor-leste-expedition-delivering-one-of-the-region-s-m
  fetched: 2026-11-12
  quote: The data collected will support biodiversity assessments, whale ecology research, and the development
    of long-term baselines for the Atauro Marine Protected Area.
