summary: Active wetland project run by Conservation International Timor-Leste, launched
  in May 2026, covering monitoring and environmental education; the country director
  said 35 lagoons were registered and seven chosen to start.
facts:
- claim: Launched at an inception workshop in Dili in early May 2026.
  url: https://timor-leste.conservation.org/press/conservation-international-launches-important-initiative-to-improve-wetland-management-for-biodiversity-conservation-and-human-wildlife-co-existence-in-timor-leste
  fetched: 2026-11-14
  quote: through an inception workshop held at Suai Room, Timor Plaza, Dili.
- claim: Its focus includes strengthening environmental education and regular monitoring.
  url: https://timor-leste.conservation.org/press/conservation-international-launches-important-initiative-to-improve-wetland-management-for-biodiversity-conservation-and-human-wildlife-co-existence-in-timor-leste
  fetched: 2026-11-14
  quote: Support sustainable livelihoods for target communities. Strengthening environmental
    education and regular monitoring.
- claim: The country director said CI identified and registered 35 lagoons and chose
    seven to start with.
  url: https://timor-leste.conservation.org/press/conservation-international-launches-important-initiative-to-improve-wetland-management-for-biodiversity-conservation-and-human-wildlife-co-existence-in-timor-leste
  fetched: 2026-11-14
  quote: We identified and registered 35 lagoons; however, due to the limited project
    budget, we decided to focus first on seven lagoons
- claim: Covers birds, fish, vegetation and other wetland biodiversity as well as
    crocodiles.
  url: https://timor-leste.conservation.org/press/conservation-international-launches-important-initiative-to-improve-wetland-management-for-biodiversity-conservation-and-human-wildlife-co-existence-in-timor-leste
  fetched: 2026-11-14
  quote: we are not only focusing on crocodiles, but also on other forms of biodiversity
    such as birds, fish, vegetation, and other wetland ecosystems
