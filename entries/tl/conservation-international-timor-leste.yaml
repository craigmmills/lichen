summary: Conservation NGO, established in 2009 according to itself, which led 2017–2019 CEPF-funded surveys,
  planned whale tagging and signed a three-year ministry memorandum in July 2026.
facts:
- claim: Says it was established in 2009 as the first international NGO in Timor-Leste dedicated only
    to conservation.
  url: https://timor-leste.conservation.org/home
  fetched: 2026-11-12
  quote: Established in 2009, Conservation International Timor-Leste was the first international NGO dedicated
    exclusively to conservation and biodiversity protection to support human wellbeing in Timor-Leste.
- claim: Says biological surveys led by Conservation International include a rapid cetacean survey that
    sighted more than 2,280 whales and dolphins.
  url: https://timor-leste.conservation.org/projects/northern-marine-conservation-blue-economy
  fetched: 2026-11-12
  quote: biological surveys led by Conservation International have found Timor-Leste to possess some of
    the most biodiverse waters in the world. One rapid cetacean survey sighted more than 2,280 whales
    and dolphins
- claim: Says it carries out marine research to inform management plans.
  url: https://timor-leste.conservation.org/projects/northern-marine-conservation-blue-economy
  fetched: 2026-11-12
  quote: We also carry out extensive marine research so we can understand the biodiversity and form suitable
    management plans.
- claim: Under a CEPF grant from 2017 to 2019, Conservation International's Timor-Leste programme office
    led rapid biological surveys of three protected areas.
  url: https://www.cepf.net/grants/grantee-projects/building-capacity-management-and-monitoring-timor-lestes-protected-areas
  fetched: 2026-11-12
  quote: Conservation International, through its program office in Timor-Leste, is providing training
    in applied biodiversity science to government counterparts in the Ministry of Agriculture and Fisheries
    and community and NGO partners, leading rapid biological surveys of three protected areas
- claim: Conservation International said in February 2026 that Konservasi Indonesia and CI Timor-Leste
    researchers planned further tagging of pygmy blue whales in Indonesia and Timor-Leste during the 2026
    migrations.
  url: https://www.conservation.org/press/indonesia-achieves-first-drone-based-limpet-tag-deployment-on-pygmy-blue-whale
  fetched: 2026-11-12
  quote: In 2026, Konservasi Indonesia and Conservation International Timor-Leste researchers plan to
    conduct additional tagging in Indonesia and Timor-Leste during the northbound (June–July) and southbound
    (October–November) migrations.
- claim: Signed a three-year memorandum of understanding with the Ministry of Agriculture, Livestock,
    Fisheries and Forestry on 28 July 2026.
  url: https://timor-leste.conservation.org/press/ci-tl-and-malff-sign-mou-to-strengthen-nature-conservation-in-timor-leste
  fetched: 2026-11-12
  quote: On 28 July 2026, as part of the World Mangrove Day celebration, Conservation International Timor-Leste
    (CI-TL) and the Ministry of Agriculture, Livestock, Fisheries and Forestry (MALFF) signed a Memorandum
    of Understanding (MoU)
