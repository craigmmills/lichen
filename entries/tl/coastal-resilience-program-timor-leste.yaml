summary: Programme funded by the GEF's Least Developed Countries Fund and run by UNDP, which mapped about
  4,775 hectares of mangroves in 11 districts and set up monitoring systems, with a mapping lab planned
  for 2021.
facts:
- claim: In June 2020, the GEF described the programme as funded by its Least Developed Countries Fund
    and implemented by UNDP in partnership with the Ministry of Agriculture and Fisheries.
  url: https://www.thegef.org/news/mangrove-mountain-building-coastal-resilience-timor-leste
  fetched: 2026-11-12
  quote: Implemented by the United Nations Development Programme (UNDP) in partnership with the Ministry
    of Agriculture and Fisheries
- claim: Mapped about 4,775 hectares of mangroves across 11 districts to find areas of mangrove loss and
    restoration potential.
  url: https://www.thegef.org/news/mangrove-mountain-building-coastal-resilience-timor-leste
  fetched: 2026-11-12
  quote: Approximately 4,775 hectares of mangroves have been mapped across 11 districts.
- claim: The GEF says the Ministry of Agriculture and Fisheries established monitoring systems under the
    programme, and that government and civil society members were trained in data collection for future
    mangrove monitoring.
  url: https://www.thegef.org/news/mangrove-mountain-building-coastal-resilience-timor-leste
  fetched: 2026-11-12
  quote: Under the program, the Ministry of Agriculture and Fisheries has also established monitoring
    systems.
- claim: In 2020 the GEF said the ministry would have a mangrove sustainability lab hosting mapping and
    GIS data by 2021, a plan at the time.
  url: https://www.thegef.org/news/mangrove-mountain-building-coastal-resilience-timor-leste
  fetched: 2026-11-12
  quote: By 2021, the Ministry will be equipped with a mangrove sustainability lab that will host mapping
    and geographical information system (GIS) data.
