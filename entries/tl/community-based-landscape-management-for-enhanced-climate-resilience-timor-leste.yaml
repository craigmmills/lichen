summary: Green Climate Fund project, under implementation until an estimated August 2029, that promotes
  community-based natural resource management and, per JICA in 2024, began drone forest monitoring in
  2023 and trains government GIS staff.
facts:
- claim: The Green Climate Fund lists the project as under implementation, with an estimated completion
    in August 2029.
  url: https://www.greenclimate.fund/project/sap021
  fetched: 2026-11-12
  quote: Under implementation
- claim: Aims to promote community-based natural resource management to decrease deforestation and forest
    degradation.
  url: https://www.greenclimate.fund/project/sap021
  fetched: 2026-11-12
  quote: This project aims to promote community-based sustainable natural resource management to decrease
    deforestation and forest degradation.
- claim: JICA reported in 2024 that forest monitoring using drones started in 2023 and that community-based
    natural resource management had started in four watersheds.
  url: https://www.jica.go.jp/oda/project/2005105/en_news/20241202_02.html
  fetched: 2026-11-12
  quote: They reported that CBNRM has started in the four target watersheds (Comoro, Laclo, Caraulun,
    and Tafara), that the training for government officials in the target watersheds was carried out as
    planned, and that the forest monitoring using drones started in 2023.
- claim: Trains government GIS staff to carry out the whole forest monitoring process, from drone data
    acquisition to analysis and reporting.
  url: https://www.jica.go.jp/oda/project/2005105/en_news/1583200_63365.html
  fetched: 2026-11-12
  quote: The project will continue to provide technical support so that the counterparts can carry out
    the entire process from drone data acquisition to analysis and reporting on their own.
