facts:
- claim: Under the project Blue Ventures sets up community-led seagrass monitoring
    teams.
  url: https://www.dugongseagrass.org/projects/seagrass-ecosystem-services-project/timor-leste/
  fetched: 2026-11-14
  quote: Under this project, Blue Ventures establishes community-led seagrass monitoring
    teams trained to manage, protect, and restore this important resource and marine
    environment.
- claim: The work is planned to be replicated at Beto Tasi and Tasi Tolu on the mainland.
  url: https://www.dugongseagrass.org/projects/seagrass-ecosystem-services-project/timor-leste/
  fetched: 2026-11-14
  quote: 'these initiatives will be replicated at two carefully chosen sites on the
    Timor-Leste mainland: Beto Tasi and Tasi Tolu'
- claim: Technical reports from Timor-Leste cover seagrass mapping, blue carbon assessment
    and seagrass ecosystem services evaluation, developed with Edith Cowan University,
    Project Seagrass and Seagrass Watch.
  url: https://www.dugongseagrass.org/projects/seagrass-ecosystem-services-project/timor-leste/
  fetched: 2026-11-14
  quote: These insights are captured in comprehensive reports developed through robust
    collaboration between national partners and esteemed technical experts from Edith
    Cowan University, Project Seagrass, and Seagrass Watch.
