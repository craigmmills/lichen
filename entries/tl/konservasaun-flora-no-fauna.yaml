facts:
- claim: Says it was established in Dili in 2014 by students from the UNTL Biology
    Department and is an independent, non-profit organisation.
  url: https://kff-tl.org/about-us/who-we-are/
  fetched: 2026-11-15
  quote: Konservasaun Flora and Fauna (KFF) is an independent, non-profit organization
    dedicated to safeguarding Timor-Leste’s biodiversity in both its terrestrial and
    marine environments.
- claim: Says its work includes research, habitat mapping, monitoring and mangrove
    reforestation.
  url: https://kff-tl.org/about-us/who-we-are/
  fetched: 2026-11-15
  quote: focusing on educational campaigns, research initiatives, habitat mapping,
    monitoring, mangrove reforestation
- claim: Lists a monitoring coordinator and a seagrass project officer among its team.
  url: https://kff-tl.org/about-us/ekipa-kff/
  fetched: 2026-11-15
  quote: MONITORIG COORDINATOR
- claim: HOT's project page says that from July 2026 KFF and a local team of enumerators
    have been field mapping seagrass, collecting seagrass data, underwater images
    and drone imagery in Sabuli and Wenunuc.
  url: https://hotosm.org/en/projects/monitoring-for-seagrass-timor-leste/
  fetched: 2026-11-15
  quote: 'July 2026 – ongoing: Field mapping by KFF and local team of enumerators
    to collect key seagrass data, underwater images, and drone imagery across two
    villages: Sabuli and Wenunuc.'
- claim: Tatoli reported in February 2023 that KFF's director Alito Rosa said KFF's
    data on migratory birds came from a census of birds across the territory of Timor,
    with 52 waterbird species identified around the sea and lagoons.
  url: https://tatoli.tl/2023/02/27/kada-tinan-manu-fuik-liu-100-halo-imigrasaun-mai-timor-leste/
  fetched: 2026-11-15
  quote: Dadus ne’e KFF hetan bazeia ba sensus ba manu-fuik sira iha teritoriu Timor
    laran tomak.
