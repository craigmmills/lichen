summary: One of the agriculture ministry's four general directorates, responsible for forest protection
  and protected areas, named in REDD+ readiness work and with two GIS staff trained by JICA in drone operation
  and image analysis.
facts:
- claim: AFoCO's country profile calls the body 'Director General of Forestry, Coffee, and Industrial
    Plants' (DG-FCPI), while describing it as one of the agriculture ministry's four general directorates,
    responsible for forest protection and protected natural areas among other duties.
  url: https://afocosec.org/knowledge/country-information-hub/timor-leste/
  fetched: 2026-11-12
  quote: The Director General of Forestry, Coffee, and Industrial Plants (DG-FCPI) is one of the Ministry’s
    four general directorates and holds broad responsibilities for community forest, watershed management
    hydrographic, forest protection, forest plantation, development of protected natural areas
- claim: Timor-Leste's forest reference level submission for UNFCCC technical assessment in 2023 names
    DGFCIP among the government bodies that worked through the REDD+ readiness project.
  url: https://redd.unfccc.int/media/tl_frl__submission-23.01.2022_final_clean.pdf
  fetched: 2026-11-12
  quote: Under the recent REDD+ readiness project, GoTL through DGFCIP, NDA, NDCC and ALGIS
- claim: JICA reports training two of the Directorate General of Forestry's GIS staff in drone operation
    and image analysis to strengthen forest monitoring.
  url: https://www.jica.go.jp/oda/project/2005105/en_news/1583200_63365.html
  fetched: 2026-11-12
  quote: The project has been supporting two counterparts from the Directorate General of Forestry with
    GIS experience to enhance their skills in drone operation and image analysis using specialized software,
    with the aim of strengthening forest monitoring capacity.
