summary: Government ministry whose minister co-chaired the July 2024 steering committee of the JICA landscape
  management project and which signed a July 2026 memorandum with Conservation International Timor-Leste
  on biodiversity and restoration.
facts:
- claim: Its minister, Marcos da Cruz, co-chaired the July 2024 joint coordination and steering committee
    of the JICA project on landscape management in priority watersheds.
  url: https://www.jica.go.jp/oda/project/2005105/en_news/20241202_02.html
  fetched: 2026-11-12
  quote: The meeting was co-chaired by the Minister of the Ministry of Agriculture, Livestock, Fishery
    and Forestry, H.E. Mr. Marcos da Cruz and the Chief Representative of JICA Timor-Leste Office, Dr.
    ITO Minpei.
- claim: Signed a memorandum of understanding with Conservation International Timor-Leste in July 2026
    to promote biodiversity conservation and ecosystem restoration.
  url: https://timor-leste.conservation.org/press/ci-tl-and-malff-sign-mou-to-strengthen-nature-conservation-in-timor-leste
  fetched: 2026-11-12
  quote: it aims to strengthen collaboration between the two parties to promote biodiversity conservation,
    ecosystem restoration, and sustainable natural resource management
