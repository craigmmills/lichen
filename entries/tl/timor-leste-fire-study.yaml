summary: Study in which, as FAO reported in May 2021, Timor-Leste was working with FAO to use SEPAL and
  Landsat 30-metre imagery from 1991 to 2020 to measure wildfire damage.
facts:
- claim: In May 2021, FAO said Timor-Leste was collaborating with it to improve fire monitoring and using
    SEPAL to measure wildfire damage over the preceding 30 years.
  url: https://www.fao.org/haltingdeforestation/news/detail/Tracking-forest-fires-from-above/en
  fetched: 2026-11-12
  quote: With the support of FAO forest monitoring tools like SEPAL, the country is in the process of
    measuring the extent of damage from wildfires over the past 30 years.
- claim: In May 2021, FAO said the team was working with Landsat 30-metre imagery from 1991 to 2020.
  url: https://www.fao.org/haltingdeforestation/news/detail/Tracking-forest-fires-from-above/en
  fetched: 2026-11-12
  quote: In Timor-Leste, the team is working with Landsat 30-meter resolution imagery from the period
    of 1991-2020.
