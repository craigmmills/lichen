facts:
- claim: In a story originally published in its 2024 annual report, RIEL described Karen Edyvane, its
    Adjunct Senior Research Fellow, as leading a decade-long research and citizen science monitoring programme
    on blue whales in Timor-Leste.
  url: https://www.cdu.edu.au/riel/news/supporting-conservation-efforts-pygmy-blue-whales
  fetched: 2026-11-12
  quote: Dr Karen Edyvane, Adjunct Senior Research Fellow at RIEL, is leading a decade-long research and
    ‘citizen science’ monitoring program that is providing baseline information on the status, movements,
    behaviour and ecology of blue whales in Timor-Leste.
- claim: The RIEL Annual Report 2024 story said the programme was run in partnership with local universities,
    fishing communities, government and whale tour operators in Timor-Leste.
