summary: Kyoto company, established 31 May 2017, that builds and runs the Biome app, which
  names species from photos; in April 2026 it said it was stepping up overseas work.
facts:
- claim: Its Biome app uses its own name identification AI to name species from users' photos,
    and covers about 100,000 species in Japan.
  url: https://biome.co.jp/news/press-20260424/
  fetched: 2026-11-02
  quote: 独自の名前判定AIによって、ユーザーが撮影した写真から生物の名前を判定します。
- claim: In April 2026 it said it was stepping up overseas work, including Indonesia, the
    Philippines and Palau.
  url: https://biome.co.jp/news/press-20260424/
  fetched: 2026-11-02
  quote: バイオームは、インドネシア、フィリピンやパラオをはじめとした海外展開を、さらに本格化しています。
