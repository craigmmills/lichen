id: japan-breeding-bird-atlas
kind: programme
name: Japan Breeding Bird Atlas
also_known_as:
- 全国鳥類繁殖分布調査
scope: jp
ai_label: conservation-tech
realms:
- land
techniques: []
status: active
website: https://bird-atlas.jp/
summary: Breeding bird atlas run by the Biodiversity Center of Japan and the Japan
  Bird Research Association; its 2016 to 2021 round surveyed 2,344 sites and mapped
  278 species.
facts:
- claim: In its October 2021 announcement, the Biodiversity Center of Japan described
    carrying out the atlas as part of the National Survey on the Natural Environment.
  url: https://www.env.go.jp/press/110125.html
  fetched: '2026-11-12'
  quote: 環境省生物多様性センターでは、自然環境保全基礎調査の一環として、「全国鳥類繁殖分布調査」を実施してきています。
- claim: The 2016 to 2021 round was co-hosted by the centre and a committee of five
    bodies, with 2,106 volunteers.
  url: https://www.env.go.jp/press/110125.html
  fetched: '2026-11-12'
  quote: 本調査は、環境省生物多様性センターと、野鳥観察者や研究者とのネットワークを持つ５団体からなる「鳥類繁殖分布調査会」が共催し、2,106人のボランティアの方々の参加を得て実施しました。
- claim: The 2016 to 2021 round conducted field surveys at 2,344 sites across Japan.
  url: https://www.env.go.jp/press/110125.html
  fetched: '2026-11-12'
  quote: 現地調査は、全国に設置した2,344地点で実施しました。
- claim: The 2016 to 2021 round produced breeding distribution maps for 278 species
    and three subspecies.
  url: https://www.env.go.jp/press/110125.html
  fetched: '2026-11-12'
  quote: 278種（＋３亜種）について繁殖分布図を作成しました。
- claim: The atlas site lists annual reports up to fiscal 2025, published in March
    2026.
  url: https://bird-atlas.jp/pub.html
  fetched: '2026-11-12'
  quote: 2025年度報告
