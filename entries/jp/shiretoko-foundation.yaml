    Movement land transferred to the foundation in 2002 after the Shiretoko Nature
    Center management office was abolished.
  url: https://www.shiretoko.or.jp/about/history/
  fetched: '2026-11-17'
  quote: 100平方メートル運動地自然復元事業の現地業務機能が当財団に移転。
- claim: Its outline lists conservation management of the natural environment and
    contracted management and operation of park facilities among its activities.
  url: https://www.shiretoko.or.jp/about/outline/
  fetched: '2026-11-17'
  quote: 自然環境の保全管理及び公園施設等の管理運営受託業務
- claim: In 2007 the Ministry of the Environment designated the foundation as a park
    management body for Shiretoko National Park. Its listed duties included managing
    and operating park facilities.
