summary: Japanese ministry that runs the Biodiversity Center of Japan and Ikimono-log, funds
  the Asia-Pacific Network for Global Change Research, and certified 610 private conserved
  areas by end of June 2026.
facts:
- claim: The inter-ministry liaison conference on the national biodiversity strategy, with
    the ministry as secretariat, compiled the mid-term review and the seventh national report.
  url: https://www.env.go.jp/press/press_02975.html
  fetched: 2026-11-02
  quote: 生物多様性国家戦略関係省庁連絡会議（事務局：環境省）においてとりまとめました
- claim: The seventh national report was submitted to the Convention on Biological Diversity
    secretariat in February 2026.
  url: https://www.env.go.jp/press/press_02975.html
  fetched: 2026-11-02
  quote: 「生物多様性条約第７回国別報告書」については、生物多様性条約事務局に提出しました
- claim: In March 2017, the ministry announced that national park management offices would
    be established in five national parks on 1 April.
  url: https://www.env.go.jp/press/103888.html
  fetched: 2026-11-02
  quote: 全国５つの国立公園に「国立公園管理事務所」が設置されます
- claim: The ministry's address is in Kasumigaseki, Tokyo.
  url: https://www.env.go.jp/en/nature/nps/park/index.html
  fetched: 2026-11-02
  quote: Joint Government Building No.5, Kasumigaseki 1-2-2, Chiyoda City, Tokyo Metropolis
    100-8975, Japan
- claim: Publishes Japan's national reports to the Convention on Biological Diversity, the
    seventh in February 2026.
  url: https://www.env.go.jp/nature/biodiversity/national_report.html
  fetched: '2026-11-02'
  quote: 生物多様性条約第７回国別報告書（2026年２月）
- claim: Its nature bureau works to conserve the natural environment.
  url: https://www.env.go.jp/nature/index.html
  fetched: '2026-11-02'
  quote: 自然環境局では、原生的な自然から身近な自然までそれぞれの地域に応じた自然環境の保全を行い
- claim: Its nature pages cover Japan's World Heritage natural sites and nature conservation
    areas.
  url: https://www.env.go.jp/nature/index.html
  fetched: '2026-11-02'
  quote: 自然環境保全地域
- claim: Says Japan's seventh national report under the Convention on Biological Diversity
    has been submitted to the convention secretariat.
  url: https://www.env.go.jp/press/press_02975.html
  fetched: '2026-11-02'
  quote: 「生物多様性条約第７回国別報告書」については、生物多様性条約事務局に提出しましたので、お知らせします。
- claim: The report was compiled by an inter-ministerial liaison conference whose secretariat
    is the ministry.
  url: https://www.env.go.jp/press/press_02975.html
  fetched: '2026-11-02'
  quote: 生物多様性国家戦略関係省庁連絡会議（事務局：環境省）においてとりまとめました。
- claim: A ministry document lists a National Park Division in its Nature Conservation Bureau.
  url: https://www.env.go.jp/en/chemi/pops/Appendix/07-MOE-Introduction/15.pdf
  fetched: '2026-11-02'
  quote: National Park Division
- claim: The same document gives 28 national parks and 55 quasi-national parks.
  url: https://www.env.go.jp/en/chemi/pops/Appendix/07-MOE-Introduction/15.pdf
  fetched: '2026-11-02'
  quote: designated as National Parks (28) or Quasi-National Parks
- claim: Began certifying privately conserved areas as nature symbiosis sites in fiscal 2023
    and had certified 610 by the end of June 2026.
  url: https://www.env.go.jp/press/press_05386.html
  fetched: '2026-11-02'
  quote: 環境省では、民間の取組等によって生物多様性の保全が図られている区域を「自然共生サイト」として認定する制度を令和５年度から開始し、令和８年６月末までに610箇所を認定しました。
