summary: Education, research and surveillance base at Ramsar-listed Akkeshi Lake and
  Bekambeushi, counting and mapping ducks, especially whooper swans, and surveying
  birds and mammals mainly with observation cameras.
facts:
- claim: Set up as a base for education, research and surveillance at the Ramsar-listed
    Akkeshi Lake and Bekambeushi area.
  url: https://www.env.go.jp/nature/yasei/guide/mizudori.html
  fetched: '2026-11-12'
  quote: 厚岸水鳥観察館は、「ラムサール条約」に登録された厚岸湖・別寒辺牛地区において、水鳥をはじめとする野生生物と、湿地の保全や湿原の賢明な利用について理解を深めていただくための普及啓発活動や、調査・研究、監視等を行う拠点施設として設置されました。
- claim: Studies crane behaviour, counts and maps ducks, especially whooper swans,
    counts sea eagles, and surveys birds and mammals around the centre mainly with
    observation cameras.
  url: https://www.env.go.jp/nature/yasei/guide/mizudori.html
  fetched: '2026-11-12'
  quote: タンチョウの行動調査、カモ類（特にオオハクチョウ）の飛来数および分布観察、オオワシ・オジロワシの飛来数調査、観察館周辺に出現する鳥獣調査（おもに観察カメラを利用）などの調査・研究を行っています。
- claim: Runs a grant scheme for researchers working on Akkeshi Lake and the Bekambeushi
    wetland.
  url: https://www.env.go.jp/nature/yasei/guide/mizudori.html
  fetched: '2026-11-12'
  quote: また、厚岸湖・別寒辺牛湿原学術研究奨励補助制度を立ち上げ、調査・研究者に対する補助を行っています。
- claim: Listed under waterbird and wetland centres in the Ministry of the Environment's
    wildlife facility guide; the page does not identify its operator.
  url: https://www.env.go.jp/nature/yasei/guide/mizudori.html
  fetched: '2026-11-12'
  quote: 水鳥・湿地センター【野生生物の世界へ（環境省野生生物等体験施設ガイドブック）】
