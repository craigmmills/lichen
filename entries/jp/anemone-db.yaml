summary: Open fish biodiversity database for eDNA surveys, opened 2 June 2022 with data from
  over 4,000 surveys at 861 locations, run by Michio Kondoh and the ANEMONE Consortium.
facts:
- claim: Opened to the public on 2 June 2022 with data from over 4,000 fish surveys at 861
    locations overseen by Kondoh since 2017.
  url: https://www.lifesci.tohoku.ac.jp/date/detail---id-50806.html
  fetched: 2026-11-02
  quote: has been overseeing data from over 4,000 fish surveys from 861 locations across Japan.
- claim: An open big-data database of fish biodiversity specialised to eDNA surveys.
  url: https://www.nyk.com/english/news/2022/20220602_01.html
  fetched: 2026-11-02
  quote: ANEMONE DB,* an open big-data database of fish biodiversity specialized to environmental
    DNA (eDNA)** survey, opened on June 2.
- claim: Accumulates fish survey results from eDNA in sea and river water and has been open
    since 2 June 2022.
  url: https://www.tohoku.ac.jp/japanese/2022/06/press20220602-01-anemone.html
  fetched: '2026-11-02'
  quote: 環境DNAビッグデータ「ANEMONE DB」をオープンデータとして一般公開（6/2〜）
- claim: The ANEMONE Consortium was set up in 2022 as its operating body.
  url: https://www.tohoku.ac.jp/japanese/2022/06/press20220602-01-anemone.html
  fetched: '2026-11-02'
  quote: 運営母体として「ANEMONEコンソーシアム」を設立
- claim: A biodiversity observation network using environmental DNA.
  url: https://www.tohoku.ac.jp/japanese/2022/06/press20220602-01-anemone.html
  fetched: '2026-11-02'
  quote: 環境DNA ※１ を利用した生物多様性観測ネットワーク
- claim: Tracks biodiversity through regular environmental DNA sampling along Japan's coasts,
    rivers and lakes.
  url: https://www.spf.org/opri/en/newsletter/604_3.html
  fetched: 2026-11-02
  quote: It tracks biodiversity through regular environmental DNA sampling along Japan's coasts,
    rivers, and lakes.
- claim: Grew out of a nationwide simultaneous survey of fish fauna led by Professor Michio
    Kondoh.
  url: https://www.spf.org/opri/en/newsletter/604_3.html
  fetched: 2026-11-02
  quote: grew out of a nationwide simultaneous survey of fish fauna
- claim: Released as open data available to anyone who registers.
  url: https://sj.jst.go.jp/news/202207/n0706-02k.html
  fetched: 2026-11-02
  quote: The database has been released as open data available to anyone who registers.
