id: forest-ecosystem-diversity-basic-survey
kind: programme
name: Forest Ecosystem Diversity Basic Survey
also_known_as:
- 森林生態系多様性基礎調査
scope: jp
ai_label: data-infrastructure
realms:
- land
status: active
website: https://www.rinya.maff.go.jp/j/keikaku/tayouseichousa/
summary: Forestry Agency survey, begun in fiscal 1999 and in its sixth five-year round since fiscal 2024,
  using 0.1 ha plots on a nationwide 4 km grid, with data used for forest carbon uptake calculations and
  Montreal Process reports.
facts:
- claim: Surveys forests nationwide by a uniform method to track their state and change.
  url: https://www.rinya.maff.go.jp/j/keikaku/tayouseichousa/
  fetched: '2026-11-02'
  quote: 全国の森林の状態とその変化の動向を把握するため、全国統一した手法により森林を調査しているものです。
- claim: Plots of 0.1 ha are set at eligible forested points of a nationwide 4 km grid, excluding points
    with safety or other access constraints.
  url: https://www.rinya.maff.go.jp/j/keikaku/tayouseichousa/
  fetched: '2026-11-02'
  quote: 全国を4kmメッシュで区切り、その交点が森林 ※2 に該当し、かつ安全上の支障等がない地点 ※3 に調査プロット（0.1ha）を設定しています。
- claim: Runs in five-year rounds, began in fiscal 1999, and has been in its sixth round since fiscal
    2024.
  url: https://www.rinya.maff.go.jp/j/keikaku/tayouseichousa/
  fetched: '2026-11-02'
  quote: 調査は5年間で全国を一巡するサイクルとしており、平成11年度に調査を開始し、令和6年度から第6期調査を実施しています。
- claim: Its data are used for forest carbon uptake calculations and national reports to the Montreal
    Process.
  url: https://www.rinya.maff.go.jp/j/keikaku/tayouseichousa/
  fetched: '2026-11-02'
  quote: 森林吸収量の算定や森林経営の持続可能性を評価するための国際的な取組であるモントリオール・プロセスの国別報告書等に活用しています。
