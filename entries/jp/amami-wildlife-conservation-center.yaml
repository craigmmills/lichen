  quote: 奄美野生生物保護センターは、アマミノクロウサギなどの希少な野生生物に関する調査・研究、外来種であるマングース防除事業
- claim: Runs distribution surveys of the Amami rabbit and, by song, of the Amami
    thrush.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/amami.html
  fetched: '2026-11-12'
  quote: アマミノクロウサギでは生息分布確認調査と、交通事故の被害を防止するためのキャンペーン活動を行っています。
- claim: Tracks the Amami woodcock by radio and surveys its distribution across Amami
    Oshima, Kakeroma and Tokunoshima twice a year.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/amami.html
  fetched: '2026-11-12'
  quote: アマミヤマシギではラジオトラッキングによる生態調査と、年2回の奄美大島、加計呂麻島、徳之島全域の分布調査を実施しています。
