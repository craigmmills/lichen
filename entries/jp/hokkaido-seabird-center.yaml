facts:
- claim: Set up in Haboro as a base for public education, recovery work and research
    on Hokkaido's seabirds.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/hokkaido-umidori.html
  fetched: '2026-11-12'
  quote: 北海道海鳥センターは、北海道の海鳥類を中心とした野生生物保護への理解を深めるための普及啓発活動や、保護増殖活動、調査研究を行うための拠点として北海道羽幌町に設置されました。
- claim: Runs population monitoring of the common murre and other seabirds, and uses
    decoys to attract them, under the murre recovery plan.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/hokkaido-umidori.html
  fetched: '2026-11-12'
  quote: ウミガラスの保護増殖事業計画や検討会の事業計画に基づき、ウミガラス等の生息モニタリング調査やデコイの設置による誘引等の保護対策を実施しています。
