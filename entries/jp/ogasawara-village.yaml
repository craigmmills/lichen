summary: Village that planted seedlings in the Haha-jima Forest in November 2018 and
  the Ogaguwa Forest on Chichi-jima that December, and aims to keep caring for both
  forests with residents.
facts:
- claim: The village planted seedlings in the Haha-jima Forest in November 2018 and
    in the Ogaguwa Forest on Chichi-jima that December. It aims to keep caring for
    both forests with residents.
  url: https://www.vill.ogasawara.tokyo.jp/kankyo/kankyo_mori/
  fetched: '2026-11-17'
  quote: 平成30年11月に「母島の森」、12月に「オガグワの森（父島）」に植栽しました。これを契機に、それぞれの森の維持管理を村民と一緒に長期的に継続することで、かつての小笠原の森へとゆっくりと転換することを目指しています。
- claim: The village gives its office address as Nishimachi, Chichi-jima, Ogasawara
    Village, Tokyo.
