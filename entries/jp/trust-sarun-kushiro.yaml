summary: Ministry sources describe this non-profit’s founding by residents in 1998
  and report over 2,600 donations and 20 sites protecting 202 hectares in and around
  Kushiro Wetland.
facts:
- claim: The Ministry of the Environment reports that the group collected more than
    2,600 donations and established 20 conservation sites totalling 202 hectares in
    and around Kushiro Wetland. It says the group acquired most sites and protected
    some through leases or agreements with landowners.
  url: https://www.env.go.jp/policy/ep_kaden/report/group/K151/index.html
  fetched: '2026-11-17'
  quote: 現在まで2,600件余の寄附を集め、釧路湿原内で国立公園区域等の保護指定を受けていない地域や、湿原の水源となる周辺丘陵地に20ヶ所、合計202haの自然保護地を成立させた。保護地の多くは取得により所有、恒久的に保全することを定め、一部は賃借または地権者との協定で保全し、湿原環境の維持に貢献している。
- claim: The Ministry of the Environment's Kushiro data centre describes it as founded
    by local residents in 1998 and incorporated as a non-profit in July 2000, helping
    to conserve Kushiro Wetland.
  url: https://kushirodata-center.env.go.jp/english/3_npo/npo_e.html
  fetched: '2026-11-17'
  quote: Trust Sarun Kushiro was founded by local residents since 1998.
