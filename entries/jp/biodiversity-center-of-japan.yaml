summary: Run by the Ministry of the Environment, it surveys and monitors Japan's vegetation,
  species, rivers, lakes, tidal flats and coral reefs, and runs Monitoring Sites 1000.
facts:
- claim: Carries out basic surveys and monitoring of Japan's vegetation, species distributions,
    rivers and lakes, tidal flats and coral reefs.
  url: https://www.biodic.go.jp/
  fetched: 2026-11-02
  quote: 環境省自然環境局生物多様性センターでは、わが国の植生、動植物の分布、河川・湖沼、干潟、サンゴ礁などについて基礎的な調査やモニタリングを実施しています。
- claim: Its slides list the National Survey on the Natural Environment, Monitoring Sites
    1000 and Ikimono-log among its work.
  url: https://www.biodic.go.jp/relatedinst/28th/s-2.pdf
  fetched: 2026-11-02
  quote: いきものログなど
- claim: Its four functions are surveys, information, specimens and public education.
  url: https://www.biodic.go.jp/center/framework.html
  fetched: '2026-11-02'
  quote: 「調査」「情報」「標本資料」「普及啓発」の４つの機能を活動
- claim: Surveys include the National Survey on the Natural Environment, Monitoring Sites
    1000 and Ikimono-log.
  url: https://www.biodic.go.jp/center/framework.html
  fetched: '2026-11-02'
  quote: 自然環境保全基礎調査 (緑の国勢調査)、モニタリングサイト1000、鳥類標識調査、いきものログなどの調査を通じて
- claim: Has published guides to eDNA survey methods for freshwater fish and amphibians.
  url: https://www.biodic.go.jp/edna/edna_top.html
  fetched: '2026-11-02'
  quote: 環境DNA分析技術を用いた調査手法の手引き（淡水魚類・両生類）
- claim: Part of the Ministry of the Environment's nature bureau, as the site title gives
    it.
  url: https://www.biodic.go.jp/center/framework.html
  fetched: '2026-11-02'
  quote: 生物多様性センター(環境省 自然環境局)
