facts:
- claim: A ministry facility with a public exhibition and a research facility for
    the care of rare birds.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/kushiro-shitsugen.html
  fetched: '2026-11-12'
  quote: 環境省の施設として、一般向けの展示施設と希少鳥類の保護管理に対応する研究施設に分かれています。
- claim: Watches birds in rehabilitation with remote cameras.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/kushiro-shitsugen.html
  fetched: '2026-11-12'
  quote: リモートカメラ等で、個体の監視と生態観察も行っています。
- claim: The ministry's facility guide says it runs wetland monitoring and other research
    and collects the survey data.
  url: https://www.env.go.jp/nature/yasei/guide/yaseiseibutsu.html
  fetched: '2026-11-12'
  quote: 具体的には湿原のモニタリング等の調査、研究を総合的に実施し、調査データ等の集積を行っています。
- claim: The same guide says it surveys the status of wildlife as a basis for species
    recovery and wetland conservation.
  url: https://www.env.go.jp/nature/yasei/guide/yaseiseibutsu.html
  fetched: '2026-11-12'
  quote: また野生生物の保護、増殖や湿原の保全の基礎となる野生生物の生息状況調査も実施しています。
