summary: A foundation named as applicant for its trust lands in Aso, Kumamoto, a certified
  nature symbiosis site, and designated a park management body for Aso-Kuju National
  Park on 2 December 2003.
facts:
- claim: The Ministry of the Environment's list of certified nature symbiosis sites
    names it as the applicant for its trust lands in Aso, Kumamoto.
  url: https://policies.env.go.jp/nature/biodiversity/30by30alliance/documents/nintei/R5R6ninteilist.pdf
  fetched: '2026-11-17'
  quote: 阿蘇グリーンストックトラスト地（駅裏/１区） 公益財団法人阿蘇グリーンストック 熊本県 阿蘇市
- claim: In fiscal 2023, the Ministry of the Environment began certifying areas where
    private or other efforts conserve biodiversity as nature symbiosis sites.
  url: https://www.env.go.jp/press/press_04456.html
  fetched: '2026-11-17'
  quote: 「民間の取組等によって生物多様性の保全が図られている区域」を「自然共生サイト」に認定する仕組みを令和５年度から開始しています。
- claim: The Ministry of the Environment's list of designated park management bodies
    includes the foundation, designated on 2 December 2003 for Aso-Kuju National Park.
  url: https://www.env.go.jp/press/press_00654.html
  fetched: '2026-11-17'
  quote: 公益財団法人阿蘇グリーンストック（阿蘇くじゅう国立公園）
