summary: Ministry of the Environment programme begun in fiscal 2003, planning long-term observation at
  about 1,000 sites, with an aim of monitoring for at least 100 years.
facts:
- claim: The programme's formal name is the Important Ecosystem Monitoring Promotion Project.
  url: https://www.env.go.jp/press/9631.html
  fetched: 2026-11-02
  quote: モニタリングサイト1000：正式名称は重要生態系監視地域モニタリング推進事業
- claim: The Biodiversity Center's slides say about 1,000 monitoring sites are set up nationwide.
  url: https://www.biodic.go.jp/relatedinst/28th/s-2.pdf
  fetched: 2026-11-02
  quote: 全国に約1,000か所のモニタリングサイトを設置し
- claim: The satoyama survey collected 2.98 million data points over 325 sites and 4,382 species between
    2005 and 2022.
  url: https://www.nacsj.or.jp/media/2024/10/42010/
  fetched: 2026-11-02
  quote: during 2005 to 2022, satoyama surveyors contributed 2.98 million data points over 325 monitoring
    sites, covering 4,382 species
- claim: Started in 2003 by the Ministry of the Environment to catch ecosystem degradation early.
  url: https://www.biodic.go.jp/moni1000/purpose.html
  fetched: '2026-11-02'
  quote: 2003年に「モニタリングサイト1000」事業を始めました。
- claim: Monitors over 1,000 sites and aims to continue monitoring for at least 100 years.
  url: https://www.biodic.go.jp/moni1000/purpose.html
  fetched: '2026-11-02'
  quote: 全国に1,000か所以上の調査サイトを設置し、100年以上モニタリングを継続する
- claim: A ministry programme begun in fiscal 2003, formally the Important Ecosystem Monitoring Promotion
    Project.
  url: https://www.wbsj.org/activity/conservation/research-study/monitoring1000/
  fetched: '2026-11-02'
  quote: モニタリングサイト1000（正式名称：重要生態系監視地域モニタリング推進事業）は、2003年度から始まった環境省の事業です。
- claim: Plans long-term observation at about 1,000 sites in total.
  url: https://www.wbsj.org/activity/conservation/research-study/monitoring1000/
  fetched: '2026-11-02'
  quote: 全国で合計1000か所程度のモニタリングサイトで、長期間観測することを計画しています。
