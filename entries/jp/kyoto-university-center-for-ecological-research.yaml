summary: Kyoto University centre that continues the monthly Lake Biwa regular observation
  begun in 1965, keeps plankton and benthos samples, and is named for the Lake Biwa
  JaLTER associate site.
facts:
- claim: Its database page says the Lake Biwa regular observation began monthly in
    1965 and was taken over by the centre, which continues it.
  url: https://www.ecology.kyoto-u.ac.jp/database.html
  fetched: '2026-11-09'
  quote: この定期観測は、森主一所長（当時）らの発案により1965年に月に１回の頻度で開始されました。大津臨湖実験所の廃止後は生態学研究センターに引き継がれ、今日まで継続的に実施されています。
- claim: Collects and keeps plankton and benthos samples at the same time.
  url: https://www.ecology.kyoto-u.ac.jp/database.html
