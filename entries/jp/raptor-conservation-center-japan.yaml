facts:
- claim: Set up by the ministry in Sakata as a base for research, protection and education
    on golden eagles and other rare raptors.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/moukinrui-hogo.html
  fetched: '2026-11-12'
  quote: 猛禽類保護センターは、イヌワシをはじめとする希少猛禽類を対象に調査・研究、保護の推進、普及啓発の拠点として鳥海山南麓の山形県酒田市湯ノ台に設置しました。
- claim: Collects data on rare raptors and monitors golden eagle status and habitat
    under the recovery plan.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/moukinrui-hogo.html
  fetched: '2026-11-12'
  quote: 希少猛禽類の分布や生態に関する情報の収集・蓄積と共に、イヌワシ保護増殖事業計画に基づいて、イヌワシの生息状況、生息環境のモニタリング調査を実施して
- claim: Local golden eagle work has passed to a council of Sakata city, Yamagata
    prefecture and the ministry.
  url: https://www.env.go.jp/nature/kisho/wildlifecenter/moukinrui-hogo.html
  fetched: '2026-11-12'
  quote: これらは現在、酒田市、山形県、環境省から構成される「猛禽類保護センター活用協議会」に引き継がれています。
