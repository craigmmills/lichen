summary: After supporting local trusts, the association began acquiring land in 2007
  and is saving for threatened species' habitats, while a notice reports joint land
  buying with Tsurui Village, Hokkaido.
facts:
- claim: In 2007 the association changed its policy and began acquiring land itself.
    It had previously supported local trust bodies through activities such as sharing
    information.
  url: https://www.ntrust.or.jp/gaiyo/gaiyo.html
  fetched: '2026-11-17'
  quote: そこで、2007年に方針を転換し、協会としても土地を積極的に取得していくことにしました。
- claim: It is saving money to buy the habitats of threatened species such as the
    Tsushima leopard cat.
  url: https://www.ntrust.or.jp/trust_project/trust.html
  fetched: '2026-11-17'
  quote: これらのいきものが安心して暮らせる生息地を買い取っていくため、1億円を目標に積み立て中です。
- claim: A trust notice says the association is buying land jointly with Tsurui Village,
    Hokkaido, to prevent a solar plant near Kushiro Wetland and keep the view from
    Otowa Bridge.
  url: https://www.ntrust.or.jp/index/tsurui2.pdf
  fetched: '2026-11-17'
  quote: ラスト協会は、鶴居村と共同で土地を購入する取組を進めています。
- claim: The Ministry of the Environment's list of certified nature symbiosis sites
    names the association as applicant for Amami Rabbit Trust plot 3 in Tatsugo, Kagoshima.
  url: https://policies.env.go.jp/nature/biodiversity/30by30alliance/documents/nintei/R5R6ninteilist.pdf
  fetched: '2026-11-17'
  quote: アマミノクロウサギ・トラスト 3 号地 公益社団法人日本ナショナル・トラスト協会 鹿児島県 龍郷町
