  url: https://www.mlit.go.jp/saiyojoho/data/r02gyoumu_12.pdf
  fetched: 2026-11-02
  quote: 国土地理院は、我が国の測量・地図に係る唯一の国家行政機関として、土地の測量及び地図の調製に関する
- claim: An MLIT document says it was secretariat of the Global Map international steering
    committee.
  url: https://www.mlit.go.jp/common/000028036.pdf
