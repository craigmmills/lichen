  quote: プロジェクトの進行管理は地球地図国際運営委員会（事務局：国土地理院）が担当。
- claim: Ran a special research project on automatic feature extraction with AI from fiscal
    2018 to fiscal 2022, which produced the GSI Dataset.
  url: https://gisstar.gsi.go.jp/gsi-dataset/index_ja.html
