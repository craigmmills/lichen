id: japan-goose-and-duck-census
kind: programme
name: Japan national goose and duck census
also_known_as:
- ガンカモ類の生息調査（全国一斉調査）
scope: jp
ai_label: conservation-tech
realms:
- freshwater
techniques: []
status: active
summary: Annual census run by the Ministry of the Environment Japan with prefectures
  since 1970; the 56th, in January 2025, covered about 8,700 sites with about 3,600
  counters.
facts:
- claim: The ministry has run the census every year since 1970 with the prefectures.
  url: https://www.env.go.jp/press/111163_00007.html
  fetched: '2026-11-12'
  quote: １． ガンカモ類の冬期の生息状況把握のため、各都道府県の協力の下、1970年から毎年調査を実施しています。
- claim: The 56th census, in January 2025, covered about 8,700 sites.
  url: https://www.env.go.jp/press/111163_00007.html
  fetched: '2026-11-12'
  quote: ・調査地：ガンカモ類の生息地となっている全国約8,700地点の湖沼等
- claim: About 3,600 counters, including volunteers, took part in the January 2025
    census.
  url: https://www.env.go.jp/press/111163_00007.html
  fetched: '2026-11-12'
  quote: ・調査者数：ボランティアの調査員など約3,600人の協力を得て実施。
- claim: Prefectures carry out the counts and the ministry compiles the results.
  url: https://www.env.go.jp/press/111163_00007.html
  fetched: '2026-11-12'
  quote: ・集計：各都道府県が実施した調査の結果を環境省が集計。
- claim: The Biodiversity Center of Japan publishes the census results.
  url: https://www.env.go.jp/press/111163.html
  fetched: '2026-11-12'
  quote: ＜環境省生物多様性センター ガンカモ類の生息調査 調査成果物＞
