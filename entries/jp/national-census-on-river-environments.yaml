summary: River and dam biota census run by the land ministry since fiscal 1990; about
  4,000 river surveys by May 2025, its analysis reported climate change and invasive
  species effects.
facts:
- claim: The ministry has run the census since fiscal 1990 to track the biota of rivers
    and dams regularly and in a uniform way.
  url: https://www.mlit.go.jp/report/press/mizukokudo04_hh_000266.html
  fetched: '2026-11-12'
  quote: 河川・ダムにおける生物相を定期的、継続的、統一的に把握することを目的として、平成２年(1990 年)度より「河川水辺の国勢調査」を実施しています。
- claim: It mainly covers the state-managed sections of all class A rivers; by the
    May 2025 announcement it had conducted about 4,000 river surveys over 34 years.
  url: https://www.mlit.go.jp/report/press/mizukokudo04_hh_000266.html
  fetched: '2026-11-12'
  quote: 本調査は、全国すべての一級河川の国管理区間を主な対象としており、これまでの34年間で約4000 調査※ を実施しています。
- claim: A May 2025 analysis of the results to fiscal 2023 reported effects of climate
    change and invasive species on river life.
  url: https://www.mlit.go.jp/report/press/mizukokudo04_hh_000266.html
  fetched: '2026-11-12'
  quote: 今回の分析により、日本の生物多様性を支える河川の重要性や、気候変動・外来生物の影響等が明らかになりました。
