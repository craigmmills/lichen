summary: OFB-funded inventory of freshwater fish and crustaceans by Vies d'Ô douce in August 2023, following
  a 2004 inventory that recorded 34 species, four endemic, with another planned for late 2023.
facts:
- claim: The OFB funded an inventory of freshwater fish and crustaceans carried out by the association
    Vies d'Ô douce from 3 to 15 August 2023.
  url: https://ofb.gouv.fr/actualites/recensement-des-poissons-et-crustaces-eau-douce-a-wallis-et-futuna
  fetched: 2026-11-12
  quote: l’OFB a financé un inventaire des poissons et crustacés d’eau douce mis en œuvre par l’association
    Vies d’Ô douce du 3 au 15 août 2023.
- claim: The 2004 inventory recorded 34 species of fish and crustaceans, four of them endemic. Following
    the August 2023 survey, another inventory was planned for the end of 2023.
  url: https://ofb.gouv.fr/actualites/recensement-des-poissons-et-crustaces-eau-douce-a-wallis-et-futuna
  fetched: 2026-11-12
  quote: Ce premier inventaire avait permis de répertorier 34 espèces de poissons et de crustacés, dont
    4 espèces endémiques.
