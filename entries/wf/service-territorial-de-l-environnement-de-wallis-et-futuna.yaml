summary: Created in 1997, this State and territory service defines and implements environmental policy,
  monitors rats and turtles, and is associated with reef, flying-fox and feral-pig projects.
facts:
- claim: A service of the State and the territory created in 1997, in charge of defining and carrying
    out environmental public policy, including the territorial biodiversity strategy and its invasive
    species plan.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: il est chargé de la définition et de la mise en œuvre opérationnelle des politiques publiques
    environnementales.
- claim: GBIF lists it as a publisher based in Mata'Utu, Uvea, and describes it as developing the territory's
    environmental policy.
  url: https://api.gbif.org/v1/organization/3e37e53f-7760-4370-9547-68e3f61d70c8
  fetched: 2026-11-12
  quote: It defines and proposes the elements necessary for the development of a coherent environmental
    policy.
- claim: Publishes to GBIF the list of invasive or harmful alien species of Wallis and Futuna.
  url: https://api.gbif.org/v1/organization/3e37e53f-7760-4370-9547-68e3f61d70c8/publishedDataset
  fetched: 2026-11-12
  quote: List of invasive or harmful alien species in Wallis and Futuna Territory
- claim: Carries out twice-yearly trapping on the islets cleared of rats, which confirmed 12 of the 13
    islets as rat-free, and says this monitoring will continue after the project ends.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: un piégeage semestriel est réalisé sur les îlots et a permis de confirmer le caractère exempt
    de rats de 12 des 13 îlots dératisés
- claim: Its staff ran two night surveys on islets to observe turtle nesting during a 2023 mission by
    Te Mana O Te Moana.
  url: https://www.temanaotemoana.org/projet-de-compagnonnage-te-me-um-2/
  fetched: 2026-11-12
  quote: ont mis en place deux prospections nocturnes sur des îlots dans le but d’observer des pontes
    de tortues
- claim: A James Cook University project page says the service was to carry out coral reef surveys in
    October 2024 to measure bleaching mortality and recovery.
  url: https://portfolio.jcu.edu.au/Projects/JCU7849
  fetched: 2026-11-12
  quote: These surveys, conducted by the Wallis and Futuna Service Territorial de l’Environnement (STE),
    will compare data with the April surveys.
- claim: Named among the OFB's TeMeUm 2026 laureates, for a study of whether several flying-fox subspecies
    exist on the territory.
  url: https://ofb.gouv.fr/sites/ofb-gouv-fr/files/2026-09/communique-de-presse-resultats-campagne-temeum-2026_1.pdf
  fetched: 2026-11-12
  quote: s’il existe plusieurs sous -espèces de roussettes sur le
- claim: IUCN listed it in August 2025 among the bodies awarded Kiwa Initiative local projects, for a
    project to set up monitoring and control of feral pigs; the page describes plans.
  url: https://iucn.org/news/202508/fifteen-new-local-projects-launched-under-kiwa-initiative-strengthen-pacific-resilience
  fetched: 2026-11-12
  quote: The project tackles the growing threat of feral pigs to biodiversity, agriculture, and food security
    in Wallis and Futuna by establishing effective monitoring and sustainable control measures.
- claim: Named as a political partner of the IKI-funded project Restoring Pacific Islands for Nature and
    People, implemented by Island Conservation in Palau, Samoa, Tonga and Wallis and Futuna.
  url: https://international-climate-initiative.com/PROJECT2212-1
  fetched: 2026-11-12
  quote: Wallis and Futuna Territorial Environment Service
- claim: A 2023 report on a botanical inventory mission in Wallis and Futuna, carried out under a convention
    between the OFB and the service, says the service coordinated and technically followed the study and
    supplied data.
  url: https://www.li-an.fr/jyves/Meyer_2023_Rapport_final_Mission_Wallis_Futuna.pdf
  fetched: 2026-11-12
  quote: (STE), à assuré la coordination et le suivi technique de cette étude et fourni les données
