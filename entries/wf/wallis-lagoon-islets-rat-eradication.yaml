id: wallis-lagoon-islets-rat-eradication
kind: project
name: Eradication of the black rat and Pacific rat from the Wallis lagoon islets
also_known_as:
- Éradication du Rat noir et du Rat du Pacifique des îlots du lagon de Wallis
scope: wf
ai_label: conservation-tech
realms:
- land
techniques:
- other
status: unknown
summary: Rat eradication on Wallis lagoon islets, part of the 2019 to 2023 PROTEGE programme, using drone-spread
  bait over 500 flights in 11 days at a total cost of 1,076,595 euros.
facts:
- claim: Part of the PROTEGE regional programme run by SPREP over 2019 to 2023; in Wallis and Futuna the
    project is carried by the territorial environment service with Island Conservation's support.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: À Wallis-et-Futuna, ce projet de dératisation est porté par le STE et bénéficie de l’appui d’Island
    Conservation (IC).
- claim: Bait was spread from an electric drone flown from a barge along parallel flight lines, planned
    with 3D models of the areas treated.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: L’opération a été préparée et programmée à l’aide de modèles 3D des secteurs à traiter.
- claim: Drone spreading took 10 people over 500 flights across 11 days.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: La dératisation aérienne par drone a mobilisé 10 personnes pendant 500 vols répartis sur 11 journées
- claim: The total cost of the intervention was 1,076,595 euros.
  url: https://especes-exotiques-envahissantes.fr/wp-content/uploads/2025/10/FicheRex_Ratnoir_RatPacifique_WallisetFutuna_WEB.pdf
  fetched: 2026-11-12
  quote: Le coût total de l’intervention est de 1 076 595 euros (Tab. 4).
- claim: Island Conservation says this was the first island eradication completed with remote technology,
    with its team training the environment service's staff over Zoom.
  url: https://www.islandconservation.org/tags/drones/
  fetched: 2026-11-12
  quote: For the first time ever, remote technology was used to successfully complete an island eradication.
    The project took place on the Wallis and Futuna Islands in the South Pacific.
