summary: A company owned by the Norwegian Ministry of Climate and Environment, state-owned since 1933,
  that provides the infrastructure for research and monitoring at Ny-Ålesund, including the port, airport
  and logistics.
facts:
- claim: Its main task is to provide the infrastructure needed for research and environmental monitoring
    at Ny-Ålesund Research Station; it operates the port and airport and provides logistics.
