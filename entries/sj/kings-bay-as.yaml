  quote: Kings Bay AS’ main task is to provide the infrastructure necessary to conduct research and environmental
    monitoring at Ny-Ålesund Research Station.
- claim: Owns the land at Ny-Ålesund and is responsible for its cultural heritage sites.
  url: https://nyalesundresearch.no/about-us/
  fetched: 2026-11-12
  quote: Kings Bay AS owns the land, and is responsible for safeguarding cultural heritage sites on the
