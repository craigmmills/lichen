summary: A 2021 pilot, built by the University Centre in Svalbard and the Norwegian Polar Institute, comparing
  drone imagery counts with foot and helicopter counts, mapping over 12 square kilometres; machine learning
  was then only planned.
facts:
- claim: The July 2021 report describes comparing counts from drone imagery with the foot and helicopter
    counts used for monitoring.
  url: https://www.unis.no/news/drone-based-reindeer-counting-in-svalbard/
  fetched: 2026-11-12
  quote: Counts from drones are then compared with currently used monitoring methods from foot and helicopter.
- claim: During the fieldwork reported in July 2021, the drone mapped more than 12 square kilometres.
  url: https://www.unis.no/news/drone-based-reindeer-counting-in-svalbard/
  fetched: 2026-11-12
  quote: During the fieldwork, the drone mapped an area of more than 12 km² including reindeer of all
    sex and age.
- claim: The page says future work would refine the drone method and introduce machine learning for automated
    post-processing; this was a plan in 2021.
  url: https://www.unis.no/news/drone-based-reindeer-counting-in-svalbard/
  fetched: 2026-11-12
  quote: Future work will focus on refining the drone method and on introducing machine learning for automated
    post-processing.
