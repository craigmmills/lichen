summary: Plankton time series project in Isfjorden, led by Janne Søreide and partnered with
  UNIS, which a 2018 item described as aiming for a long-term series; by 2021 some compiled
  series reached back 20 years.
facts:
- claim: A 2018 ARCTOS news item says IMOS, funded by NFR and led by Janne Søreide, is a collaboration
    between UNIS and the Murmansk Marine Biological Institute, with partners in Moscow, Poland
    and Bergen.
  url: https://arctos.uit.no/?p=858
  fetched: 2026-11-15
  quote: Isfjorden Marine Observatory Svalbard (IMOS), funded by NFR and led by Janne Søreide,
    is a collaboration between ARCTOS members at UNIS and the Murmansk Marine Biological Insitute
    (MMBI)
- claim: The same item says IMOS aims to establish a long-term plankton time series in Isfjorden.
  url: https://arctos.uit.no/?p=858
  fetched: 2026-11-15
  quote: IMOS aims at establishing a long term plankton time series in Isfjorden, the largest
    fjord system in Svalbard.
- claim: The same item says a standard sampling and analysis protocol has been set up and
    data will be stored in the Greenseas database with the Nansen Centre.
  url: https://arctos.uit.no/?p=858
  fetched: 2026-11-15
  quote: Within IMOS a standardized sample and analyses protocol has been established
- claim: A Fram Forum article of January 2021 says plankton data from Isfjorden have been
    compiled into IMOS time series, some reaching back 20 years.
  url: https://framsenteret.no/shedding-light-on-plankton-trends-seasonal-pelagic-monitoring-in-kongsfjorden-and-isfjorden/
  fetched: 2026-11-15
  quote: In Isfjorden, data on plankton communities collected over time and space have been
    compiled into time series (IMOS; Isfjorden Marine Observatory Svalbard), some of which
    reach back in time 20 years, covering spring, summer, autumn and winter.
