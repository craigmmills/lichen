summary: Closed year-round monitoring programme in Kongsfjorden from August 2024 to
  2025, set up within the Kongsfjorden System Flagship, in which scientists from several
  institutions and countries collected multidisciplinary marine ecosystem data.
facts:
- claim: The Ny-Ålesund Research Station site says IKY was established within the
    Kongsfjorden System Flagship to collect year-round, high-resolution multidisciplinary
    data on essential marine ecosystem parameters in Kongsfjorden, beginning in August
    2024.
  url: https://nyalesundresearch.no/kongsfjorden-system/
  fetched: 2026-11-15
  quote: Beginning in August 2024, this international initiative is dedicated to collecting
    year-round, high-resolution multidisciplinary data on essential marine ecosystem
    parameters in Kongsfjorden.
- claim: An April 2026 news item on the station site describes it as a year-round
    monitoring programme carried out in Kongsfjorden in 2024/2025 by scientists from
    several institutions and countries.
  url: https://nyalesundresearch.no/2026/04/year-round-monitoring-in-kongsfjorden-now-out-in-fram-forum-2026/
  fetched: 2026-11-15
  quote: The year‑round monitoring programme carried out in Kongsfjorden in 2024/2025
    is now highlighted in the latest edition of Fram Forum.
- claim: The same item says scientists from different institutions and countries joined
    forces to study the fjord across all seasons.
  url: https://nyalesundresearch.no/2026/04/year-round-monitoring-in-kongsfjorden-now-out-in-fram-forum-2026/
  fetched: 2026-11-15
  quote: Scientists from different institutions and countries joined forces to study
    the unknown, across all seasons of the year.
- claim: A March 2026 Fram Forum article says its largest project, YESSS, ran high-frequency,
    year-round monitoring of plankton, protists, microbes and biogeochemical parameters.
  url: https://framforum.com/2026/03/12/year-round-monitoring-of-the-marine-ecosystem-in-kongsfjorden/
  fetched: 2026-11-15
  quote: Alongside high-frequency, year-round monitoring of plankton, protists, microbes
    and biogeochemical parameters
- claim: A June 2024 station news item says the field work would run from August 2024
    to August 2025 through projects funded by third parties and by institutions active
    in Ny-Ålesund.
  url: https://nyalesundresearch.no/2024/06/the-international-kongsfjorden-year-2024-2025/
  fetched: 2026-11-15
  quote: The IKY field work will take place from August 2024 to August 2025
