facts:
- claim: The OpKROP page says KROP was established by UiT, UNIS and SAMS and has monitored
    the marine environment of Kongsfjorden and Rijpfjorden for almost 20 years by
    maintaining an underwater observatory in both fjords.
  url: https://www.mare-incognitum.no/opkrop/
  fetched: 2026-11-15
  quote: KROP has been monitoring the marine environment in the Atlantic-influenced
    Kongsfjorden and the Arctic Rijpfjorden for almost 20 years by maintaining an
    underwater observatory in both fjords.
- claim: The page reports that the main KROP moorings in both fjords were recovered
    in August 2025 and the main Kongsfjorden mooring was redeployed.
  url: https://www.mare-incognitum.no/opkrop/
  fetched: 2026-11-15
  quote: The KROP moorings have been recovered!
- claim: The page says all oceanographic data for 2002–2024 from Kongsfjorden, and
    from 2006 onwards from Rijpfjorden, had been published on the data portal in November
    2024.
  url: https://www.mare-incognitum.no/opkrop/
  fetched: 2026-11-15
  quote: all oceanographic data from 2002-2024 from both Konsgjforden and Rijpfjorden
    (since 2006) had finally been publsihed in its entirety on our data portal
