status: active
website: https://arcticstation.nl
summary: Active station in Ny-Ålesund, run by the University of Groningen, that monitors
  barnacle geese, Arctic terns and foxes, and offers data on marked barnacle geese
  and marked foxes.
facts:
- claim: The station's site says it is managed by the Arctic Centre of the University
    of Groningen and gives a Ny-Ålesund postal address.
  url: https://arcticstation.nl/index.php
  fetched: 2026-11-15
  quote: managed by the Arctic Centre of the University of Groningen.
- claim: The station's site offers data on marked barnacle geese and marked foxes.
  url: https://arcticstation.nl/index.php
  fetched: 2026-11-15
  quote: marked barnacle geese, marked foxes and installations
- claim: A 2017 status update from the station says its work continues a monitoring
    series of barnacle geese and that it monitors the migration of barnacle geese
    and Arctic terns with geolocators.
  url: https://www.arcticstation.nl/pics2017/20170401%20Status%20update%20Netherlands%20Arctic%20Station.pdf
  fetched: 2026-11-15
  quote: Our work is a continuation of a monitoring series of Barnacle Geese,
- claim: The same update says it monitors bird migration with geolocators.
  url: https://www.arcticstation.nl/pics2017/20170401%20Status%20update%20Netherlands%20Arctic%20Station.pdf
  fetched: 2026-11-15
  quote: We are also monitoring bird migration of barnacle geese and arctic terns
    using geolocators
- claim: A 2022 fieldwork note on the station's site describes village counts of barnacle
    geese twice a day as part of the Dutch Station's fieldwork.
  url: https://arcticstation.nl/pics2022/Jasmine%20fieldwork2022.pdf
  fetched: 2026-11-15
  quote: Village counts of barnacle geese twice a day, and collect insects trapped
    every other day.
- claim: A 2026 weblog entry on the station's site says it has for several years placed
    motion-sensitive wildlife cameras on two bridges to monitor fox activity.
  url: https://arcticstation.nl/weblog.php?nr=2686
  fetched: 2026-11-15
  quote: We have several years placed 4 motion sensitive wildlife cameras on each
    of the two bridges over the red river, to monitor fox activity.
- claim: The Ny-Ålesund Research Station site says studies on the ecology of the local
    barnacle goose have been ongoing since 1990 and that the University of Groningen
    has had a facility in Ny-Ålesund since 1995.
  url: https://nyalesundresearch.no/members/university-of-groningen-ug-the-netherlands/
  fetched: 2026-11-15
  quote: Studies on the ecology of the local barnacle goose have been ongoing since
    1990.
