summary: Active project, listed by UNIS under Arctic Biology and run by it, using
  time-lapse cameras taking one image per minute above plants and invertebrate traps;
  the page says machine learning methods for the same data have been advanced elsewhere.
facts:
- claim: Uses time-lapse cameras above plants and invertebrate traps to study the
    phenology of flowers and invertebrates; UNIS lists it as active under Arctic Biology.
  url: https://www.unis.no/project/big-flower-invertebrate-phenology-time-series/
  fetched: 2026-11-15
  quote: With the use of time-lapse cameras mounted above plants and invertebrate
    traps, we can study the phenology of flowers and invertebrates.
- claim: The cameras take one image per minute; the page says the images can be examined
    manually for flower stage and invertebrate visits.
  url: https://www.unis.no/project/big-flower-invertebrate-phenology-time-series/
  fetched: 2026-11-15
  quote: The cameras are set to take one image per minute, this gives high resolution
    data, at a small ecological scale, over a long period of time.
- claim: The page says machine learning methods to generate the same data have been
    advanced in a project led by Toke T. Høye of Aarhus University.
  url: https://www.unis.no/project/big-flower-invertebrate-phenology-time-series/
  fetched: 2026-11-15
  quote: There has also been advances in using machine learning (Project led by Toke
    T. Høye, Aarhus University) to generate the same data.
- claim: Its activities in Bjørndalen are part of Bjørndalen Integrated Gradients
    (BIG).
  url: https://www.unis.no/project/big-flower-invertebrate-phenology-time-series/
  fetched: 2026-11-15
  quote: The project activities in Bjørndalen, Svalbard are a part of Bjørndalen Integrated
    Gradients (BIG) .
