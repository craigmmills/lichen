  quote: The SIOS remote sensing service is a single point of contact for those using
    spaceborne, airborne, terrestrial and submarine remote sensing data for ESS research
    in Svalbard.
- claim: The Copernicus page on its EU-funded preparatory phase (2010 to 2014) says
    it set out to integrate research and monitoring platforms for geophysical, biological
    and chemical studies around Svalbard.
  url: https://www.copernicus.eu/en/node/1754
  fetched: 2026-11-14
  quote: integrates and complements existing research and monitoring platforms for
