- claim: The same evaluation describes its remote sensing service as a single point
    of contact for users of spaceborne, airborne, terrestrial and submarine remote
    sensing data for Earth system science research in Svalbard.
  url: https://www.forskningsradet.no/siteassets/publikasjoner/2024/sios-eval-report-2024.12.06-final-fix.pdf
