summary: Originating in a 1998 timber certification committee, this body has no endorsed
  national certification system; an associated ITTO project proposes QR log tracking
  and lists a digital tracking manual.
facts:
- claim: PEFC says MFCC grew out of the Timber Certification Committee of Myanmar,
    created in 1998 as a non-profit organisation by a Ministry of Forestry decree
    and transformed into MFCC in 2013.
  url: https://pefc.org/discover-pefc/our-pefc-members/national-members/myanmar-forest-certification-committee
  fetched: 2026-11-15
  quote: TCCM itself was created in 1998 as non-profit, non-political and impartial
    organization by a Myanmar Ministry of Forestry decree. The TCCM was transformed
    to MFCC in 2013.
- claim: PEFC says MFCC does not have an endorsed national forest certification system
    and the assessment is suspended.
  url: https://pefc.org/discover-pefc/our-pefc-members/national-members/myanmar-forest-certification-committee
  fetched: 2026-11-15
  quote: MFCC does not have an endorsed national forest certification system. The
    assessment of the Myanmar national forest certification system is suspended until
    further notice.
- claim: ITTO lists MFCC as executing agency of project PP-A/56-342A, Strengthening
    SFM Standards and Timber Legality Framework in Myanmar, with a Yangon address.
  url: https://www.itto.int/project/id/PP-A_56-342A
  fetched: 2026-11-15
  quote: MYANMAR FOREST CERTIFICATION COMMITTEE (MFCC)
- claim: The ITTO project summary proposes QR codes for log tracking and support for
    locally generated timber tracking technologies.
  url: https://www.itto.int/project/id/PP-A_56-342A
  fetched: 2026-11-15
  quote: including the application of QR codes for log tracking, will be implemented
    to develop the robustness of the mechanisms and infrastructures that underpin
    Myanmar’s timber certification systems
- claim: The ITTO project page lists a Digitalized Timber Tracking System manual among
    the project's technical reports.
  url: https://www.itto.int/project/id/PP-A_56-342A
  fetched: 2026-11-15
  quote: Digitalized Timber Tracking System manual (original language only).pdf
