summary: Run by IUCN, this Myanmar project included January 2023 shorebird surveying
  with Nature Conservation Society Myanmar, monitoring since 2018 and local bird identification
  and flock counting training.
facts:
- claim: IUCN says the 2023 shorebird survey in the Gulf of Mottama was carried out
    in January by the IUCN Myanmar country programme in partnership with Nature Conservation
    Society Myanmar.
  url: https://iucn.org/node/38582
  fetched: 2026-11-15
  quote: The 2023 shorebird survey was carried out in January by IUCN Myanmar country
    programme, in partnership with the Nature Conservation Society Myanmar along with
    local and international ornithologists.
- claim: IUCN's February 2023 story says the Gulf's shorebirds, including the Spoon-billed
    Sandpiper, had been monitored regularly since 2018.
  url: https://iucn.org/node/38582
  fetched: 2026-11-15
  quote: which have been monitored regularly since 2018.
- claim: IUCN's February 2023 story says Local Conservation Group members were trained
    in bird identification and flock counting and were expected to apply this to SMART
    monitoring.
  url: https://iucn.org/node/38582
  fetched: 2026-11-15
  quote: will apply this knowledge to SMART monitoring.
- claim: IUCN's February 2023 story says the work was part of the SDC Gulf of Mottama
    Project, which IUCN was implementing with HELVETAS and Network Activities Group.
  url: https://iucn.org/node/38582
  fetched: 2026-11-15
  quote: This work was done as part of the SDC Gulf of Mottama Project, which IUCN
    is implementing in collaboration with HELVETAS and Network Activities Group (NAG).
