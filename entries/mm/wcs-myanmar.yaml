summary: Myanmar programme of the Wildlife Conservation Society, which says it has worked there since
  1993 and in December 2017 trained patrol teams in camera trapping at Rakhine Yoma Elephant Reserve.
facts:
- claim: Says it has worked in Myanmar since 1993, conducting biological surveys and monitoring populations
    of key wildlife species.
  url: https://programs.wcs.org/myanmar/About-Us/Our-Mission.aspx
  fetched: 2026-11-12
  quote: Ever since, we conduct biological surveys, monitor populations of key wildlife species, aid in
    the establishment of protected areas, and assist protected area staff with trainings on landscape
    management.
- claim: In December 2017 its staff trained patrol teams at Rakhine Yoma Elephant Reserve in camera trapping
    and reviewed four years of SMART patrol data.
  url: https://programs.wcs.org/myanmar/News/articleType/ArticleView/articleId/10806.aspx
  fetched: 2026-11-12
  quote: A patrol review discussion, including a presentation and analysis of SMART patrol data over four
    years, led to a debate about the strategy for the recently increased patrol capacity and identification
    of new methods to detect hunters.
