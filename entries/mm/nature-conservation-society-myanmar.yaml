summary: A membership-based local environmental NGO working closely with the Forest
  Department, an IUCN National NGO member since March 2024, behind a 2024 ASAP-funded
  project with community patrols and shorebird monitoring surveys.
facts:
- claim: IUCN's member page describes it as a non-profit local environmental NGO in
    Myanmar, a membership-based organisation working closely with the Forest Department.
  url: https://iucn.org/our-union/members/iucn-members/nature-conservation-society-myanmar
  fetched: 2026-11-14
  quote: Nature Conservation Society- Myanmar (NCS) is a non-profit, non-political,
    non-religious and a local environmental NGO
- claim: IUCN lists it as a National NGO member since March 2024.
  url: https://iucn.org/our-union/members/iucn-members/nature-conservation-society-myanmar
  fetched: 2026-11-14
  quote: National NGO
- claim: The Asian Species Action Partnership's project page for a 2024 grant to it
    reports monthly community-led patrolling and shorebird population monitoring surveys
    from December 2024 to March 2025.
  url: https://www.speciesonthebrink.org/articles-stories/projects/protecting-sandbilledsandpiper-ayeyarwdy
  fetched: 2026-11-14
  quote: Conducted monthly community-led patrolling and shorebirds population monitoring
    surveys from December 2024 to March 2025.
- claim: The same page names Nature Conservation Society-Myanmar as the organisation
    behind the project.
  url: https://www.speciesonthebrink.org/articles-stories/projects/protecting-sandbilledsandpiper-ayeyarwdy
  fetched: 2026-11-14
  quote: 'Organisation: Nature Conservation Society-Myanmar'
- claim: ASAP's partner page headed Myanmar Nature Conservation and Protection Association
    gives NCS-Myanmar's mission, and says it has been an ASAP partner since 2022.
  url: https://www.speciesonthebrink.org/partners/myanmar-nature-conservation-and-protection-association
  fetched: 2026-11-14
  quote: NCS-Myanmar’s mission is to protect wildlife and nature nationwide through
    action based on research
- claim: An ASAP project page for a 2025 grant to the Myanmar Nature Conservation
    and Protection Association, supported by Fondation Segré, reports that the wintering
    status of Spoon-billed Sandpipers was assessed at nine coastal wetland sites along
    the Gulf of Mottama and Ayeyarwaddy delta.
  url: https://www.speciesonthebrink.org/articles-stories/projects/mottama-spoonbilled-sandpiper-assessment
  fetched: 2026-11-14
  quote: The wintering status of Spoon-billed Sandpipers at nine coastal wetland sites
    along the Gulf of Mottama and Ayeyarwaddy delta were assessed
