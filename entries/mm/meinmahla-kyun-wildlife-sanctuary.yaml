summary: Ramsar-listed mangrove sanctuary in Myanmar where staff counted 115 crocodiles
  in a November 2021 census, which was compared with the November 2020 count and described
  as a declining population to be monitored.
facts:
- claim: Myanmar Digital News reported in December 2021 that a crocodile census in
    the sanctuary's rivers and streams was carried out that November by 10 staff led
    by a forest ranger under the sanctuary warden's supervision.
  url: https://mdn.gov.mm/en/census-crocodiles-conducted-mainmahla-island-wildlife-sanctuary
  fetched: 2026-11-15
  quote: A census of crocodiles in rivers and streams in the Sanctuary was carried
    out in November by 10 staff led by U Thant Zin (Forest Ranger) under the supervision
    of Sanctuary warden U Sai Wunna Kyi.
- claim: The December 2021 report compares the count of 115 crocodiles with the November
    2020 census and says the declining population would continue to be monitored.
  url: https://mdn.gov.mm/en/census-crocodiles-conducted-mainmahla-island-wildlife-sanctuary
  fetched: 2026-11-15
  quote: the situation of the declining crocodile population from year to year will
    continue to be monitored.
- claim: The ASEAN Centre for Biodiversity says the sanctuary was established to protect
    the remaining mangrove forests and is a Ramsar site.
