summary: A local conservation NGO and CEPF grantee, an Asian Species Action Partnership
  partner since 2020, whose Chatthin Eld's deer project report records two completed
  annual censuses.
facts:
- claim: A CEPF grant page describes it as a local conservation NGO and names it as
    the grantee.
  url: https://www.cepf.net/grants/grantee-projects/supporting-development-and-sustainability-local-conservation-ngo-friends
  fetched: 2026-11-14
  quote: Supporting the Development and Sustainability of a Local Conservation NGO,
    “Friends of Wildlife”
- claim: Its final report to CEPF on Eld's deer conservation in Chatthin Wildlife
    Sanctuary (November 2014 to October 2016) gives its legal name as Friends of Wildlife.
  url: https://cepf.net/resources/final-project-report/final-project-report-533
  fetched: 2026-11-14
  quote: Organization Legal Name Friends of Wildlife
- claim: The same report says two annual deer censuses were completed and that it
    helped prepare the annual deer census report.
  url: https://cepf.net/resources/final-project-report/final-project-report-533
  fetched: 2026-11-14
  quote: Two annual deer censuses were completed. We helped to prepare the annual
    Deer census report
- claim: Its April 2017 final report says it was recording deer sightings with the
    sanctuary's staff during the project.
  url: https://cepf.net/resources/final-project-report/final-project-report-533
  fetched: 2026-11-14
  quote: In collaboration with CWS staff, FOW is recording deer sightings
- claim: The report gives Eld's deer densities in Chatthin Wildlife Sanctuary's core
    zone from the censuses of 2015, 2016 and 2017.
  url: https://cepf.net/resources/final-project-report/final-project-report-533
  fetched: 2026-11-14
  quote: The results of Deer censuses were 1.88 deer/km2 in 2015, 2.39 deer/km2 in
    2016, and 2.8 deer/km2 in 2017
- claim: The Asian Species Action Partnership's partner page gives its mission, including
    research and monitoring of species for conservation, and lists it as a partner
    since 2020.
  url: https://speciesonthebrink.org/partners/friends-of-wildlife
  fetched: 2026-11-14
  quote: research and monitoring of species for conservation
