summary: Government forest body under the Ministry of Natural Resources and Environmental Conservation,
  reported in 2019 to use Open Foris tools and GLAD forest products, and to have developed the National
  Forest Monitoring Action Plan.
facts:
- claim: UN-REDD reported in 2019 that the Forest Department under MONREC developed and endorsed the National
    Forest Monitoring Action Plan.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-12
  quote: the Forest Department under the Ministry of Natural Resources and Environmental Conservation
    (MONREC) has developed and endorsed the National Forest Monitoring Action Plan (NFMS-AP)
- claim: UN-REDD reported in 2019 that its staff had been trained since 2015 in Open Foris tools, including
    Collect Earth, for planning the national forest inventory.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-12
  quote: Since 2015, technical personnel of the Forest Department of Myanmar have been successively trained
    in using software tools of the Open Foris suite to master the challenges of the different stages of
    NFI planning
- claim: A September 2018 ITTO project report describes SMART patrol and database training for local communities
    and Forest Department staff around the proposed Tanintharyi National Park.
  url: https://www.itto.int/files/itto_project_db_input/3083/Technical/Completion%20report%20for%20SMART%20Training.pdf
  fetched: 2026-11-12
  quote: SMART Database System for Local Communities and Forest Department Staff
- claim: In July 2019, the University of Maryland reported that the Forest Department was using GLAD forest
    extent and change products for REDD+ and that a GLAD and SERVIR-Mekong workshop had been held at its
    Naypyidaw office.
  url: https://geog.umd.edu/featured-content/umd-and-servir-mekong-organized-technical-workshop-myanmar
  fetched: 2026-11-12
  quote: In particular, Myanmar Forest Department is using GLAD products in the context of REDD+ program
    implementation.
