summary: Forest Department programme with FAO and UN-REDD whose new design was developed in 2017 and 2018
  and field-tested in early 2019, using Collect Earth and Collect Earth Online in planning.
facts:
- claim: A new NFI design was developed in 2017 and 2018 and its methods were field-tested in early 2019.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-12
  quote: During the first quarter of 2019, the new methodologies were tested in the field in different
    regions of the country.
- claim: UN-REDD reported in November 2019 that Collect Earth and Collect Earth Online, using free satellite
    imagery, were used in NFI planning to pre-assess land classes and candidate plots.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-12
  quote: using Collect Earth and Collect Earth Online for pre-assessment of land classes, land types and
    accessibility of candidate NFI plots
