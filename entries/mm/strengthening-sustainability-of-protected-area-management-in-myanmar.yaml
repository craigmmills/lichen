status: closed
summary: A GEF-funded project closed on 1 April 2021, run by the Wildlife Conservation
  Society, that aimed to strengthen the national protected area system and developed
  SMART patrolling, reportedly taken up nationally by 2020.
facts:
- claim: Its stated aim is to strengthen the national terrestrial protected area system
    through enhanced representation, management effectiveness, monitoring, enforcement
    and financing.
  url: https://www.thegef.org/projects-operations/projects/5159
  fetched: 2026-11-13
  quote: Strengthen the terrestrial system of national protected areas for biodiversity
    conservation through enhanced representation, management effectiveness, monitoring,
    enforcement and financing
- claim: The GEF page lists its executing agencies as the Ministry of Environmental
    Conservation and Forestry (MOECAF) and the Wildlife Conservation Society.
  url: https://www.thegef.org/projects-operations/projects/5159
  fetched: 2026-11-13
  quote: Ministry of Environmental Conservation and Forestry (MOECAF), Wildlife Conservation
    Society
- claim: The GEF page gives the project as completed, closed on 1 April 2021.
  url: https://www.thegef.org/projects-operations/projects/5159
  fetched: 2026-11-13
  quote: Project Closed 01 Apr 2021
- claim: UNDP's February 2020 terminal evaluation lists SMART patrolling among five
    techniques the project developed and says it had been taken up nationally by then.
  url: https://erc.undp.org/evaluation/documents/download/16911
  fetched: 2026-11-14
  quote: 'Five new techniques were developed: Smart patrolling and its use as a law
    enforcement tool, now taken up nationally'
- claim: The terminal evaluation reports a significant SMART patrolling effort at
    Htamanthi Wildlife Sanctuary, measured by distance covered.
  url: https://erc.undp.org/evaluation/documents/download/16911
  fetched: 2026-11-14
  quote: The TMT WS results indicate a significant effort in Smart patrolling as measured
    by distance covered.
