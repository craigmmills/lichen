summary: Forest Department programme supported by FAO, with a design developed in
  2017 and 2018, field tests in early 2019, Open Foris training for staff, and Tanintharyi
  field work scheduled for January 2020.
facts:
- claim: A 2019 UN-REDD article says FAO has been supporting the government of Myanmar
    in improving the National Forest Monitoring System and implementing a National
    Forest Inventory.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-15
  quote: FAO has been supporting the government of Myanmar in the improvement of the
    country’s National Forest Monitoring System (NFMS) and the implementation of a
    National Forest Inventory (NFI).
- claim: The article says a new design for the NFI was developed during 2017 and 2018,
    and the new methodologies were tested in the field in the first quarter of 2019.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-15
  quote: During the first quarter of 2019, the new methodologies were tested in the
    field in different regions of the country.
- claim: The article says Forest Department staff were trained in the Open Foris tools,
    including Collect Earth and Collect Earth Online for pre-assessment of candidate
    NFI plots from satellite imagery.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-15
  quote: using Collect Earth and Collect Earth Online for pre-assessment of land classes,
    land types and accessibility of candidate NFI plots
- claim: The article says NFI field work in Tanintharyi was scheduled to start in
    January 2020.
  url: https://www.un-redd.org/post/ready-measure-myanmar-designing-and-planning-its-new-national-forest-inventory-nfi
  fetched: 2026-11-15
  quote: ways of incorporating local actors in the NFI work scheduled to start in
    January, 2020.
