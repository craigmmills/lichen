summary: Wildlife sanctuary where, according to a February 2025 report citing Myanmar state media, forest
  department workers monitor tigers and installed 24 camera traps in 12 locations in 2024.
facts:
- claim: In February 2025, The Star, citing Bernama and Myanmar state media, reported that forest department
    workers were protecting the sanctuary's tigers and monitoring their population.
  url: https://www.thestar.com.my/aseanplus/aseanplus-news/2025/02/01/myanmar039s-conversation-efforts-save-endangered-bengal-tiger-population
  fetched: 2026-11-12
  quote: Myanmar state media, The Global New Light of Myanmar, published that local forest department
    workers are protecting the tigers and monitoring their population diligently.
- claim: The same report says the forest department installed 24 camera traps in 12 locations in 2024
    to track tiger movements.
  url: https://www.thestar.com.my/aseanplus/aseanplus-news/2025/02/01/myanmar039s-conversation-efforts-save-endangered-bengal-tiger-population
  fetched: 2026-11-12
  quote: The forest department installed 24 camera traps in 12 locations last year and similar numbers
    this year to track the movement of the tigers.
