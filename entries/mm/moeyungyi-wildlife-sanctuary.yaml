summary: Protected area for endangered birds, run by the Myanmar Forest Department,
  where a May 2022 report described bird surveys and aquatic plant, fish and water
  quality assessments for habitat restoration projects.
facts:
- claim: Myanmar Digital News reported in May 2022 that the Forest Department was
    conducting a bird survey to observe populations of native and migratory birds
    at the sanctuary.
  url: https://mdn.gov.mm/en/moeyungyi-wildlife-sanctuary-rich-biodiversity
  fetched: 2026-11-15
  quote: The department is conducting a bird survey to observe the population of native
    bird species and migratory birds.
- claim: The May 2022 report says surveys of aquatic plants and fish species and water
    quality assessment were being carried out for habitat restoration projects.
  url: https://mdn.gov.mm/en/moeyungyi-wildlife-sanctuary-rich-biodiversity
  fetched: 2026-11-15
  quote: collecting surveys on aquatic plants and fish species and water quality assessment
    for habitat restoration projects are being implemented as well.
- claim: The report says the sanctuary is the protected area for endangered bird species
    by the Forest Department, and quotes a warden of the sanctuary in the Forest Department.
  url: https://mdn.gov.mm/en/moeyungyi-wildlife-sanctuary-rich-biodiversity
  fetched: 2026-11-15
  quote: It is the protected area for the endangered bird species by the Forest Department.
