  quote: Each year, WWF-Cambodia collects data from February to May to estimate the Irrawaddy river dolphin
    population, using photo identification with mark-resight methodology.
- claim: In January 2025 it deployed 17 new camera traps to monitor the Indochinese leopard.
  url: https://www.wwf.org.kh/our_work/biodiversity_research_and_monitoring/
  fetched: 2026-11-12
  quote: In January 2025, we deployed 17 new camera traps to monitor the Indochinese leopard
- claim: It uses eDNA from river water samples to study species diversity in the Mekong, detecting 117
    fish taxa in a survey between Kratie and the Lao border.
  url: https://www.wwf.org.kh/our_work/biodiversity_research_and_monitoring/
  fetched: 2026-11-12
  quote: 117 distinct fish taxa – representing 12 orders, 30 families, 72 genera and 80 species – were
    detected during our Mekong freshwater eDNA survey
- claim: With partners it uses drones and camera traps to estimate the hog deer population.
  url: https://www.wwf.org.kh/our_work/biodiversity_research_and_monitoring/
  fetched: 2026-11-12
  quote: Using drone technology and camera traps, WWF-Cambodia and our partners are calculating a new
    hog deer population estimate
- claim: It runs an annual census of white-shouldered ibis and river terns, recording 311 white-shouldered
    ibises in 2024.
  url: https://www.wwf.org.kh/our_work/biodiversity_research_and_monitoring/
