summary: A government body under the Ministry of Agriculture, Forestry and Fisheries
  that tested monitoring tools including SMART in a 2016 to 2019 FAO project and jointly
  collected Keo Seima wildlife survey data with WCS from 2010 to 2016.
facts:
- claim: An FAO project sheet names the Forestry Administration (FA) of the Ministry
    of Agriculture, Forestry and Fisheries among the beneficiaries of its 2016 to
    2019 National Forest Monitoring System project.
  url: https://openknowledge.fao.org/server/api/core/bitstreams/fb1b691d-b1ae-43fe-9ff5-03ea38df1746/content
  fetched: 2026-11-13
  quote: Forestry Administration (FA) of the
- claim: For the 2016–2019 project, the sheet says near real-time monitoring of natural
    vegetation loss, REDD+ activity monitoring and SMART were tested by the FA, the
    Fisheries Administration and GDANCP.
  url: https://openknowledge.fao.org/server/api/core/bitstreams/fb1b691d-b1ae-43fe-9ff5-03ea38df1746/content
  fetched: 2026-11-13
  quote: Reporting Tools (SMART) tested by the FA, FiA and GDANCP.
- claim: For the 2016–2019 project, the sheet says community-based patrolling was
    tested by the FA in Samroang Commune, Pursat Province.
  url: https://openknowledge.fao.org/server/api/core/bitstreams/fb1b691d-b1ae-43fe-9ff5-03ea38df1746/content
  fetched: 2026-11-13
  quote: Community-based patrolling tested by the FA in the
- claim: A Rufford final evaluation report dated 1 November 2022 names the Director
    of the Institute of Forest and Wildlife Research and Development, Forestry Administration
    of Cambodia, as giving access to a field site and a project permit.
  url: https://media.rufford.org/media/project_reports/32749-1_Final_Evaluation_Report.pdf
  fetched: 2026-11-13
  quote: Director of the Institute of Forest and Wildlife Research and Development,
    Forestry Administration of Camb odia
- claim: A GBIF dataset record says line-transect wildlife survey data in Keo Seima
    Wildlife Sanctuary were collected jointly by WCS and the Forestry Administration
    between 2010 and 2016.
  url: https://api.gbif.org/v1/dataset/bcaaf133-5433-46ab-b2e3-a1a9f4ce84d1
  fetched: 2026-11-13
  quote: Data were collected jointly by the Wildlife Conservation Society (WCS) and
    the Forestry Administration of the Royal Government of Cambodia (RGC) between
    2010 and 2016
