  quote: We will develop time-series land cover maps using the classification of remote
    sensing images acquired by satellites.
- claim: The page says it would run a camera-trap survey at corridor areas linking
    habitat patches.
  url: https://www.rufford.org/projects/adrian-dwiputra/mapping-drivers-habitat-loss-and-fragmentation-seasonally-dry-tropical-forest-landscape/
  fetched: 2026-11-13
  quote: We will also conduct a camera trap survey at select corridor areas that provide
    a structural connection between habitat patches.
