summary: Network of local forest activists who, with University of Copenhagen scientists,
  used the Prey Lang App in patrols, producing 4,560 validated entries on forest resources
  and illegal logging from February 2015 to January 2017.
facts:
- claim: A 2018 paper in Citizen Science Theory and Practice describes the PLCN as
    a network of local forest activists that, with University of Copenhagen scientists,
    implemented a monitoring programme in Prey Lang.
  url: https://doi.org/10.5334/cstp.129
  fetched: 2026-11-15
  quote: a monitoring program implemented by a network of local forest activists,
    the Prey Lang Community Network (PLCN), and scientists from the University of
    Copenhagen (UCPH)
- claim: The 2018 paper says PLCN had undertaken its own forest patrols since 2009.
  url: https://doi.org/10.5334/cstp.129
  fetched: 2026-11-15
  quote: by undertaking its own forest patrols to intercept illegal loggers
- claim: The 2018 paper says PLCN produced 4,560 validated data entries on forest
    resources and illegal logging using the Prey Lang App over February 2015 to January
    2017.
  url: https://doi.org/10.5334/cstp.129
  fetched: 2026-11-15
  quote: the PLCN was able to produce 4,560 successfully validated data entries on
    forest resources and illegal logging in Prey Lang
- claim: The 2018 paper states that all data produced with the Prey Lang App is PLCN's
    property.
  url: https://doi.org/10.5334/cstp.129
  fetched: 2026-11-15
  quote: All data produced with the Prey Lang App (PLA) is the specific property of
    the PLCN
- claim: Danmission's 2026 global report on community-based monitoring says that from
    2015 the PLCN integrated the Prey Lang App into its patrols.
  url: https://danmission.dk/en/wp-content/uploads/2026/02/CBM_GLOBAL-REPORT_EXPORT-ONLINE.pdf
  fetched: 2026-11-15
  quote: From 2015 onward, PLCN integrated the app into
