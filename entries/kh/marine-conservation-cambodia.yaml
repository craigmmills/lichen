facts:
- claim: Describes itself as a community-based NGO protecting Cambodia's marine ecosystems
    since 2008.
  url: https://marineconservationcambodia.org/?p=447
  fetched: 2026-11-13
  quote: Marine Conservation Cambodia (MCC) is a community-based NGO dedicated to
    protecting Cambodia’s marine ecosystems.
- claim: Its Cambodian Seagrass Conservation Project follows the Seagrass Watch protocol
    to monitor seagrass meadow health and composition.
  url: https://www.marineconservationcambodia.org/projects/cambodian-seagrass-conservation-project
  fetched: 2026-11-13
  quote: The CSCP follows the global Seagrass Watch protocol to ensure consistent
    and comparable monitoring of seagrass meadow health and composition.
- claim: The project runs ongoing monitoring at fixed sites to track trends over time.
  url: https://www.marineconservationcambodia.org/projects/cambodian-seagrass-conservation-project
  fetched: 2026-11-13
  quote: Ongoing monitoring at fixed sites to track trends over time, detect degradation
    or recovery, and inform adaptive conservation management.
- claim: A 2025 paper in Frontiers in Marine Science, with MCC in Kep as affiliation,
    reports a grid survey of benthic habitats across 62,146 ha and a 39% fall in seagrass
    cover in Kampot between 2013 and 2023.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2025.1656017/full
  fetched: 2026-11-13
  quote: 'A grid survey was conducted across four survey zones at 250 m intervals
    covering 62,146 ha: 1) Kep MFMA, 2) Outer Kep, 3) Kampot, and 4) Koh Seh.'
- claim: The paper gives the affiliation as Marine Conservation Cambodia, Kep, Cambodia.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2025.1656017/full
  fetched: 2026-11-13
  quote: Marine Conservation Cambodia, Kep, Cambodia
