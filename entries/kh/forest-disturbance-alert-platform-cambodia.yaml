summary: A platform built by Open Development Cambodia that sends forest disturbance
  alerts through Telegram, using GFW, JJ-FAST and SERVIR-SEA data, generally 12 to
  15 days after detection, and does not monitor wildlife.
facts:
- claim: ODC's launch post says the platform gives users near real-time forest disturbance
    alerts through Telegram channels for their selected areas of interest.
  url: https://opendevelopmentcambodia.net/odc-launches-forest-disturbance-alert-platform-to-strengthen-accessible-forest-monitoring-in-cambodia/
  fetched: 2026-11-13
  quote: The newly launched platform provides users with near real-time forest disturbance
    alerts through Telegram Channels based on their selected Areas of Interest (AOIs).
- claim: The post says it integrates satellite forest monitoring data from Global
    Forest Watch, JJ-FAST and SERVIR-SEA.
  url: https://opendevelopmentcambodia.net/odc-launches-forest-disturbance-alert-platform-to-strengthen-accessible-forest-monitoring-in-cambodia/
  fetched: 2026-11-13
  quote: By integrating satellite-derived forest monitoring data from Global Forest
    Watch (GFW), JICA-JAXA Forest Early Warning System in the Tropics (JJ-FAST), and
    SERVIR-SEA
- claim: The post says alerts are generally available 12 to 15 days after a disturbance
    is detected, and that the platform does not monitor wildlife.
  url: https://opendevelopmentcambodia.net/odc-launches-forest-disturbance-alert-platform-to-strengthen-accessible-forest-monitoring-in-cambodia/
  fetched: 2026-11-13
  quote: ODC clarified that the platform currently focuses on forest disturbance detection
    and does not monitor wildlife.
