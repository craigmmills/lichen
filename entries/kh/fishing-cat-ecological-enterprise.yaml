facts:
- claim: CEPF's grantee page gives the grantee name as Fishing Cat Ecological Enterprise
    Co. Ltd. for a Cambodian wetland project running from August 2021 to October 2023.
  url: https://www.cepf.net/grants/grantee-projects/integrated-conservation-wetland-ecosystems-cambodia
  fetched: 2026-11-15
  quote: 'Grantee Name: Fishing Cat Ecological Enterprise Co. Ltd.'
- claim: The CEPF project covered training Ministry of Environment rangers, implementing
    the SMART patrolling system and monitoring target species populations at Koh Kapik
    Ramsar Site.
  url: https://www.cepf.net/grants/grantee-projects/integrated-conservation-wetland-ecosystems-cambodia
  fetched: 2026-11-15
  quote: implementing the SMART patrolling system, monitoring target species populations
- claim: IUCN describes FCEE as an organisation working on the conservation of threatened
    wetland carnivores and the restoration of their mangrove habitats in Cambodia.
  url: https://iucn.org/story/202512/women-root-mangrove-conservation-economic-opportunity-cambodian-island
  fetched: 2026-11-15
  quote: an organisation working on the conservation of threatened wetland carnivores
    and restoration of their mangrove habitats in Cambodia
- claim: IUCN says FCEE, working with rangers appointed by the local authority, has
    set up 22 camera traps to monitor population trends at Koh Kapik.
  url: https://iucn.org/story/202512/women-root-mangrove-conservation-economic-opportunity-cambodian-island
  fetched: 2026-11-15
  quote: FCEE have set up 22 camera traps to monitor population trends and assess
    conservation efforts
- claim: IUCN says FCEE aims to create a long-term wildlife monitoring system, with
    solar-powered cameras and a technical team to maintain them.
  url: https://iucn.org/story/202512/women-root-mangrove-conservation-economic-opportunity-cambodian-island
  fetched: 2026-11-15
  quote: FCEE aims to create a long-term wildlife monitoring system
