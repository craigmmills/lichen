facts:
- claim: Conservation International says CI-Cambodia has worked in Cambodia since 2001 through science,
    community partnerships and fieldwork.
  url: https://www.conservation.org/places/greater-mekong
  fetched: 2026-11-12
  quote: Since 2001, Conservation International-Cambodia’s groundbreaking science, community-led partnerships
    and fieldwork have helped protect Cambodia’s rich natural capital.
- claim: An AFP report carried by Malay Mail says CI staff spent three months training a machine-learning
    program to identify gibbon calls recorded by monitors at 10 sites in the Cardamom Mountains.
  url: https://www.malaymail.com/news/life/2026/06/25/hidden-cameras-and-ai-expose-rare-wildlife-deep-in-cambodias-rainforest/225127
  fetched: 2026-11-12
  quote: Its staff spent three months training a machine-learning programme to identify calls recorded
    by dozens of monitors placed at 10 sites.
- claim: According to the AFP report, the team labelled up to half the recordings to train the model,
    which then processed the rest.
  url: https://www.malaymail.com/news/life/2026/06/25/hidden-cameras-and-ai-expose-rare-wildlife-deep-in-cambodias-rainforest/225127
  fetched: 2026-11-12
  quote: The team labelled up to half the data for the AI, teaching it “this is gibbon, this is not”,
    said Ratha Sor.
  ai_type: ml-supervised
- claim: According to the AFP report, CI published in 2024 the results of the first systematic camera-trap
    survey of the Central Cardamom region, using nearly 150 devices.
  url: https://www.malaymail.com/news/life/2026/06/25/hidden-cameras-and-ai-expose-rare-wildlife-deep-in-cambodias-rainforest/225127
  fetched: 2026-11-12
  quote: In 2024, CI published the results of the first-ever systematic camera trap survey of the Central
    Cardamom region
- claim: The AFP report describes its parent organisation, Conservation International, as a US-headquartered
    non-profit.
  url: https://www.malaymail.com/news/life/2026/06/25/hidden-cameras-and-ai-expose-rare-wildlife-deep-in-cambodias-rainforest/225127
