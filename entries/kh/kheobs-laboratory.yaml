facts:
- claim: The Institute of Technology of Cambodia's page says the KHEOBS Laboratory
    was set up at ITC to make use of Sentinel-1, Sentinel-2 and aerial imagery.
  url: https://itc.edu.kh/?p=12993
  fetched: 2026-11-15
  quote: The establishment of the KH mer E arth OBS ervation (KHEOBS) Laboratory at
    the Institute of Technology of Cambodia (ITC) is intended to facilitate the utilization
    of satellite imagery (Sentinel-1 and Sentinel-2) and aerial images.
- claim: The page says the installation of Sen2Chain and Sen2Extract processing chains
    is designed to generate time series of water and vegetation indicators from Sentinel-2
    imagery every five days.
  url: https://itc.edu.kh/?p=12993
  fetched: 2026-11-15
  quote: designed to automatically generate time series of spatial indicators of the
    dynamics of water and vegetation from Sentinel-2 satellite imagery every five
    days
- claim: The page says an iota2 installation is intended to automate annual land cover
    mapping of the Tonle Sap Lake.
  url: https://itc.edu.kh/?p=12993
  fetched: 2026-11-15
  quote: The iota2 installation is intended to automate the annual land cover mapping
    of the Tonle Sap Lake.
- claim: The page says the laboratory can observe water bodies, soil moisture and
    land cover from Sentinel-2 images on a five-day cycle using deep learning or machine
    learning.
  url: https://itc.edu.kh/?p=12993
  fetched: 2026-11-15
  quote: using deep learning and/or machine learning techniques
  ai_type: deep-learning
