summary: A Brazzaville university that co-leads the CongoPeat research programme with
  Kisangani and Leeds, co-researched a 2024 to 2025 peatland protection report, and
  whose field school used the Pl@ntNet app offline in April 2024.
facts:
- claim: A CongoPeat report says the CongoPeat research programme is co-led by Marien
    Ngouabi University, the University of Kisangani and the University of Leeds.
  url: https://congopeat.net/new-report/
  fetched: '2026-11-15'
  quote: This CongoPeat research programme is co-led by Marien Ngouabi University,
    University of Kisangani, and the University of Leeds.
- claim: The same report says the CongoPeat network, led by the University of Leeds
    and Marien Ngouabi University, has funds to map the peatlands to a legal definition
    once one is agreed.
  url: https://congopeat.net/new-report/
  fetched: '2026-11-15'
  quote: the CongoPeat network, led by University of Leeds and Marien Ngouabi University
    have funds to map the peatlands to a legal definition
- claim: The report on protecting the peatlands was researched jointly by University
    College London and Marien Ngouabi University between January 2024 and July 2025.
  url: https://congopeat.net/new-report/
  fetched: '2026-11-15'
  quote: The research was conducted jointly by University College London in the UK
    and Marien Ngouabi University in the Republic of Congo.
- claim: The CongoPeat team page lists a lecturer in forest ecology at the university
    who co-leads CongoPeat's expeditions in the Republic of Congo.
  url: https://congopeat.net/people/
  fetched: '2026-11-15'
  quote: Lecturer in Forest Ecology, Marien Ngouabi University, Republic of Congo.
    Forest ecologist & co-discoverer of the Congo peatlands, co-leading CongoPeat’s
    expeditions in Republic of Congo.
- claim: A One Forest Vision news item of April 2024 says a botany and ecology field
    school run by the university's Laboratoire de Biodiversité, de Gestion des Écosystèmes
    et de l'Environnement used the Pl@ntNet app offline at the Loundoungou super-site
    in northern Congo.
  url: https://www.oneforestvision.org/eng/news/pl-ntnet-training-in-congo
  fetched: '2026-11-15'
  quote: This practical school took place in the field from 26 March to 04 April at
    the Loundoungou super-site in northern Congo, where the Pl@ntNet application was
    regularly used in offline mode
- claim: Based in Brazzaville, Republic of Congo.
