summary: Acoustic monitoring project begun in 1999 at Cornell University that has worked in Nouabalé-Ndoki
  National Park since 2017, using 50 recording units to locate poaching and track forest elephants.
facts:
- claim: WCS Congo says the project aims to monitor forest elephants and their habitat through 50 autonomous
    recording units deployed in the canopy in the park and its periphery.
  url: https://congo.wcs.org/Wild-Places/Nouabal%C3%A9-Ndoki-National-Park/Research-And-Biomonitoring/Elephant-Listening-Project
  fetched: 2026-11-08
  quote: Monitor forest elephants and their habitat through 50 autonomous recording units deployed in
    the canopy, nearly 8 meters high, in the Park and its periphery.
- claim: WCS Congo says the data are used to identify the location and frequency of poaching events.
  url: https://congo.wcs.org/Wild-Places/Nouabal%C3%A9-Ndoki-National-Park/Research-And-Biomonitoring/Elephant-Listening-Project
  fetched: 2026-11-08
  quote: Identify the location and frequency of poaching events in order to respond to and better anticipate
    them.
- claim: WCS Congo reported more than 36,156 hours of acoustic monitoring with no gunshots detected in
    the 22nd deployment, August 2025 to April 2026.
  url: https://congo.wcs.org/Newsroom/ID/26415/36156-hours-spent-listening-to-the-forest-without-a-single-gunshot
  fetched: 2026-11-08
  quote: More than 36,156 hours of acoustic monitoring and no gunshots detected .
- claim: Started in 1999 at the K. Lisa Yang Center for Conservation Bioacoustics at Cornell University,
    placing autonomous recording units in the rainforest to listen to forest elephants and poachers.
  url: https://ndoki.org/en-us/About/Science
  fetched: '2026-11-08'
  quote: the Elephant Listening Project (ELP) was born in 1999 at the K. Lisa Yang Center for Conservation
    Bioacoustics at Cornell University with the mission to support conservation efforts by eavesdropping
    on forest elephants and poachers by placing Autonomous Recording Units (ARUs) deep in the rainforest
- claim: Has worked in Nouabalé-Ndoki National Park since 2017, gathering data on elephant population
    trends, landscape use and gun hunting.
  url: https://ndoki.org/en-us/About/Science
  fetched: '2026-11-08'
  quote: Since 2017, the ELP has worked in Nouabalé-Ndoki National Park.
