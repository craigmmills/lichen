summary: Programme of the Wildlife Conservation Society in the Republic of the Congo, active for over
  30 years, which runs the Elephant Listening Project and uses EarthRanger, SMART patrol data and Okala
  for monitoring.
facts:
- claim: Says it is one of WCS's largest country programmes and has been active in the Republic of the
    Congo for over 30 years.
  url: https://congo.wcs.org/
  fetched: 2026-11-08
  quote: In the Republic of Congo, one of the Wildlife Conservation Society's largest country program
    has been active for over 30 years
- claim: Reports that between August 2025 and April 2026, 46 acoustic units of the Elephant Listening
    Project recorded across a 1,250 km² grid in and around Nouabalé-Ndoki National Park.
  url: https://congo.wcs.org/Newsroom/ID/26415/36156-hours-spent-listening-to-the-forest-without-a-single-gunshot
  fetched: 2026-11-08
  quote: Between August 2025 and April 2026 , 46 acoustic units recorded continuous data across a 1,250
    km² monitoring grid covering part of the national park, the Kabo forest concession, and a safari zone.
- claim: Reports catch monitoring of sharks and rays at the Songolo landing site in Pointe-Noire.
  url: https://congo.wcs.org/
  fetched: 2026-11-08
  quote: At the Songolo landing site in Pointe-Noire, Republic of Congo, catch monitoring has shown that
    most
- claim: Reports camera-trap work at Wali Bai on the edge of Nouabalé-Ndoki National Park.
  url: https://congo.wcs.org/
  fetched: 2026-11-08
  quote: 'Wali Bai: Camera Traps reveal a surprising life in the wild'
- claim: Its 2025 Nouabalé-Ndoki National Park annual report says EarthRanger use was enhanced by integrating
    SMART patrol data, with field information available in the control room on one platform.
  url: https://congo.wcs.org/Portals/255/Reports/NNNP_2025_annual_Report_EN.pdf
  fetched: 2026-11-08
  quote: The use of EarthRanger has been enhanced through the integration of SMART data collected by patrols.
    All field information and real-time updates are now accessible from the control room on a single platform.
- claim: Gives an address in Brazzaville.
  url: https://congo.wcs.org/
  fetched: '2026-11-08'
  quote: 151 Av. de Gaulle, B.P. 14537, Brazzaville, République du Congo
- claim: Since 1999 its work has extended to three forest concessions of 1.3 million hectares, in a partnership
    with the forestry company CIB and the Congolese government.
  url: https://congo.wcs.org/
  fetched: '2026-11-08'
  quote: Since 1999, our conservation efforts have extended to three forest concessions covering 1.3 million
    ha, thanks to an innovative partnership with a forestry company, Congolaise Industrielle des Bois
    (CIB), and the Congolese government.
- claim: Reported in September 2026 that the park's tourism and research teams installed 18 camera traps
    around Wali Bai in October 2025, retrieved in September 2026.
  url: https://congo.wcs.org/Newsroom/ID/26639/Wali-Bai-Camera-Traps-reveal-a-surprising-life-in-the-wild
  fetched: '2026-11-08'
  quote: In October 2025, 18 camera traps were installed around the bai.
- claim: Okala quotes a WCS Congo conservation scientist saying Okala's data platform let them verify
    AI outputs at very large scales.
  url: https://okala.io/nature-technology
  fetched: '2026-11-08'
  quote: This was an ambitious project where we could put AI to the test at very large scales. Okala's
    data platform allowed us to verify AI outputs and rapidly interact with the data using the intuitive
    interface.
- claim: Says WCS has collected data on marine by-catch and illegal fishing since 2001, in partnership
    with the University of Exeter's Centre for Ecology & Conservation.
  url: https://congo.wcs.org/Wild-Places/Congo-Marine
  fetched: '2026-11-08'
  quote: WCS, in partnership with the Centre for Ecology & Conservation (CEC) at the University of Exeter,
    contributes to research and monitoring of marine ecosystems to better inform conservation strategies.
    We have been collecting data, particularly on by-catch and illegal fishing, since 2001.
