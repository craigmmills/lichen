summary: Rainforest Foundation UK programme that lets communities send real-time alerts of illegal forest
  activity, even without connectivity, and has been deployed in the Republic of Congo among other countries.
facts:
- claim: Rainforest Foundation UK says ForestLink lets communities send alerts of illegal forest activities
    in real time, even in areas with no connectivity.
  url: https://www.rainforestfoundationuk.org/rtm
  fetched: 2026-11-08
  quote: At the heart of this is ForestLink, a breakthrough system that enables communities to transmit
    highly accurate and low-cost alerts of illegal forest activities in real-time, even in remote areas
    with no connectivity.
- claim: Says ForestLink has been deployed in the Republic of Congo among other countries.
  url: https://www.rainforestfoundationuk.org/rtm
  fetched: 2026-11-08
  quote: ForestLink has been deployed in DRC, Republic of Congo, Cameroon, Ghana, Cameroon, Liberia and
    Peru where hundreds of community monitors are generating thousands of illegal deforestation alerts
- claim: In July 2022, RFUK and local partners, including in the Republic of Congo, announced a web map
    of alerts sent by community monitors through ForestLink.
  url: https://www.rainforestfoundationuk.org/new-alerts-map-shows-vital-role-of-forest-communities-in-tackling-illegal-logging/
  fetched: 2026-11-08
  quote: RFUK and its local partners in Cameroon, the Republic of Congo, the Democratic Republic of Congo,
    Gabon, Ghana, Liberia, Ivory Coast and Peru have launched a webmap that includes thousands of illegal
    alerts sent by local community monitors using the ForestLink system.
