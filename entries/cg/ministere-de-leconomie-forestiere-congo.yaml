summary: Ministry responsible for Congo’s forest resources and the regulatory framework for wildlife,
  forests and sustainable development, supervising ACFAP and CNIAF.
facts:
- claim: A 2020 SIVL user guide says the ministry's Cellule de la Légalité Forestière et de la Traçabilité
    is the body in charge of operating SIVL.
  url: https://www.atibt.org/files/upload/Annexe_9_-_D_-_Guide_Utilisateur_SIVL_-_Fiscalite_-_Role_Entreprises_V1-0.pdf
  fetched: 2026-11-08
  quote: Cellule de la Légalité Forestière et de la Traçabilité (organe du MEF en charge de l’exploitation
    métier du SIVL)
- claim: The Nouabalé-Ndoki park site says the ministry manages Congo's forest resources and organises,
    implements and monitors the regulatory framework of the wildlife, forest and sustainable development
    sector.
  url: https://ndoki.org/en-us/About/Management
  fetched: '2026-11-08'
  quote: The Republic of the Congo’s Ministry of Forest Economy is responsible for managing the Congo's
    forests resources. It organizes, implements, and monitors the application of the regulatory and legislative
    framework of the wildlife, forest, and sustainable development sector.
- claim: Gives its address in Brazzaville.
  url: https://economie-forestiere.gouv.cg
  fetched: '2026-11-08'
  quote: Ministère de l’Economie Forestière Boulevard Denis Sassou Nguesso Brazzaville - Congo
- claim: Lists the Agence Congolaise de la Faune et des Aires Protégées among the bodies under its supervision.
  url: https://economie-forestiere.gouv.cg/le-ministere/organismes-sous-tutelle
  fetched: '2026-11-08'
  quote: Organismes sous tutelle ACFAP Agence Congolaise de la Faune et des Aires Protégées
- claim: Lists the national forest and wildlife inventory centre CNIAF among the bodies under its supervision.
