facts:
- claim: The park's terrestrial ecological inventory combines line transects, reconnaissance
    walks and camera traps.
  url: https://www.conkouati.org/comprendre-linventaire-ecologique
  fetched: 2026-11-12
  quote: 'Three methodologies are combined to conduct the terrestrial ecological inventory
    of Conkouati-Douli National Park:'
- claim: Species monitored include elephants, chimpanzees, gorillas, leopards and
    buffaloes, as well as antelopes, small monkeys and rare birds.
  url: https://www.conkouati.org/comprendre-linventaire-ecologique
  fetched: 2026-11-12
  quote: The monitored species include iconic large mammals such as elephants, chimpanzees,
    gorillas, leopards, and buffaloes, as well as antelopes, small monkeys, and rare
    birds.
- claim: 42 people in eight teams took part, including eco-monitors, local trackers
    and master's students from Marien Ngouabi University.
  url: https://www.conkouati.org/comprendre-linventaire-ecologique
  fetched: 2026-11-12
  quote: These teams consist of eco-monitors, local trackers, contractors from communities
    within the park, and master’s students from Marien Ngouabi University in Brazzaville.
- claim: The park's head of conservation, Yorick van Hoef, answered the park's questions
    about the inventory; the previous inventory was over ten years earlier.
  url: https://www.conkouati.org/comprendre-linventaire-ecologique
  fetched: 2026-11-12
  quote: We asked all these questions to Yorick van Hoef, head of the conservation
    department at Conkouati-Douli National Park.
