facts:
- claim: A Congolese association working since 2009 to protect great apes and the
    biodiversity of the Congo Basin, according to the PPI beneficiary page.
  url: https://www.programmeppi.org/beneficiaire/esi/
  fetched: '2026-11-15'
  quote: L’ONG ESI Congo est une association congolaise œuvrant depuis 2009 pour la
    protection des grands singes et de la biodiversité du bassin du Congo.
- claim: The PPI page says its scientific research includes data collection carried
    out with local communities.
  url: https://www.programmeppi.org/beneficiaire/esi/
  fetched: '2026-11-15'
  quote: de recherches scientifiques dont la collecte de données menées avec l’implication
