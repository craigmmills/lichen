- claim: Its preliminary biological inventories in the corridor between Conkouati
    National Park and the Dimonika Biosphere Reserve showed western lowland gorillas.
  url: https://www.programmeppi.org/projects/la-cooperative-des-chasseurs-de-loaka-au-secours-des-gorilles/
