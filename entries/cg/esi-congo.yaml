    du gorille de plaine de l’ouest
- claim: A PPI project with an agreement dated 8 June 2012, now finished, planned
    a gorilla inventory of the Loaka area by hunters trained in inventory protocols.
  url: https://www.programmeppi.org/projects/la-cooperative-des-chasseurs-de-loaka-au-secours-des-gorilles/
