facts:
- claim: Describes itself as a Congolese association created in 1990 to protect chimpanzees and their
    habitat and conserve the biodiversity of Conkouati-Douli National Park.
  url: https://www.help-congo.org/
  fetched: '2026-11-08'
  quote: Créée en 1990, HELP Congo est une association congolaise engagée dans la protection des chimpanzés,
    la préservation de leur habitat et la conservation de la biodiversité du Parc National de Conkouati-Douli
- claim: Lists scientific studies and censuses of local biodiversity among its activities.
  url: https://www.help-congo.org/
  fetched: '2026-11-08'
  quote: études scientifiques et recensement de la biodiversité locale
- claim: Its president says it is putting in place projects including ethological studies, environmental
    DNA, camera placement and wildlife and plant censuses.
  url: https://www.help-congo.org/
  fetched: '2026-11-08'
  quote: 'Nous mettons en place tout un panel de projets : études éthologiques, ADN environnemental, pose
    de caméras, recensement de la faune et de la flore'
