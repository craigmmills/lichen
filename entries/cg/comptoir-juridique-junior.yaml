summary: Organisation founded by young lawyers that, RFUK reported in August 2019, was deploying ForestLink
  at two pilot sites in Likouala and Lékoumou, with 14 community observers and 8 leaders trained.
facts:
- claim: In August 2019, RFUK reported that CJJ was deploying Real Time Monitoring and ForestLink in the
    Republic of Congo after technical training in Brazzaville that month.
  url: https://www.rainforestfoundationuk.org/?p=2046
  fetched: 2026-11-08
  quote: Comptoir Juridique Junior (CJJ) is deploying "Real Time Monitoring" (RTM) and the ForestLink
    technology in the Republic of Congo following their technical training by RFUK in Brazzaville in August
    2019.
- claim: RFUK reported in August 2019 that the system was active at two pilot sites, monitoring forests
    around logging concessions in Likouala and Lékoumou.
  url: https://www.rainforestfoundationuk.org/?p=2046
  fetched: 2026-11-08
  quote: The system has been active at the two sites in the Republic of Congo since August 2019
- claim: RFUK reported in August 2019 that 14 community observers and 8 community leaders had been trained.
  url: https://www.rainforestfoundationuk.org/?p=2046
  fetched: 2026-11-08
  quote: 14 community observers and 8 community leaders have been trained to conduct community forest
    observation
- claim: RFUK describes CJJ as founded by young lawyers and as a pioneer of community-based forest monitoring
    with RFUK's support.
  url: https://www.rainforestfoundationuk.org/partners/cjj/
  fetched: 2026-11-08
  quote: With support from RFUK, they are pioneers of community-based forest monitoring.
