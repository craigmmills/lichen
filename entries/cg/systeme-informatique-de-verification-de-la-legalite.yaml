summary: Forest administration tool for recording legality and traceability data, designed around the
  APV-FLEGT; a March 2020 guide says national roll-out was starting with the tax module.
facts:
- claim: A March 2020 user guide describes SIVL as a forest administration tool for collecting data on
    forest legality and traceability and recording verifications, designed on the requirements of the
    APV-FLEGT.
  url: https://www.atibt.org/files/upload/Annexe_9_-_D_-_Guide_Utilisateur_SIVL_-_Fiscalite_-_Role_Entreprises_V1-0.pdf
  fetched: 2026-11-08
  quote: C’est un outil de l’administration forestière qui sert à la collecte de données sur la légalité
    et la traçabilité forestière ainsi qu’à l’enregistrement de données sur les vérifications effectuées.
- claim: The guide says national roll-out was starting with the tax module, to be followed by the other
    modules.
  url: https://www.atibt.org/files/upload/Annexe_9_-_D_-_Guide_Utilisateur_SIVL_-_Fiscalite_-_Role_Entreprises_V1-0.pdf
  fetched: 2026-11-08
  quote: Son déploiement national commence par le module Fiscalité, qui sera suivi par le déploiement
    des autres modules.
- claim: The guide says companies will be able to declare production for traceability from inventory to
    export.
  url: https://www.atibt.org/files/upload/Annexe_9_-_D_-_Guide_Utilisateur_SIVL_-_Fiscalite_-_Role_Entreprises_V1-0.pdf
  fetched: 2026-11-08
  quote: notamment pour la traçabilité des productions depuis l’inventaire jusqu’à l’exportation.
