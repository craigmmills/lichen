summary: A forest information system for Congo, hosted in the forestry ministry, whose
  2012 report gave National Forest Estate land-use allocation and land cover as of
  31 December 2011, built by WRI and the ministry.
facts:
- claim: On its October 2013 page, WRI said it partnered with the forestry ministry
    to develop the Forest Atlas of Congo and build forest stakeholders' capacity in
    remote sensing, GIS and forest information management.
  url: https://www.wri.org/data/forest-atlas-congo
  fetched: '2026-11-15'
  quote: WRI partners with the Ministry of Forest Economy and Sustainable Development
    (MEFDD) to develop the Forest Atlas of Congo and to build the capacity of forest
    stakeholders in remote sensing, GIS, and forest information management.
- claim: WRI's October 2013 page said the atlas was updated as new information became
    available, with periodic public releases of the data and database.
  url: https://www.wri.org/data/forest-atlas-congo
  fetched: '2026-11-15'
  quote: The Forest Atlas of Congo is updated as new information becomes available,
    with periodic publications of the data and database made publicly available through
    Atlas reports, posters, and online and offline mapping applications.
- claim: The version 3.0 report of December 2012 described the atlas as a forest information
    system hosted in the forestry ministry and managed by a joint ministry and WRI
    team.
  url: https://africa.wri.org/interactive-forest-atlas-congo-atlas-forestier-interactif-du-congo-version-30
  fetched: '2026-11-15'
  quote: The Interactive forest Atlas of Congo is a living forest information system
    hosted in the Ministry of Forest Economy and Sustainable Development of the Republic
    of Congo (MEFDD), and managed by a joint team including members from MEFDD and
    the World Resources Institute (WRI).
- claim: The 2012 report gave land-use allocation and land cover types in the National
    Forest Estate as of 31 December 2011, and updated information on protected areas.
  url: https://africa.wri.org/interactive-forest-atlas-congo-atlas-forestier-interactif-du-congo-version-30
  fetched: '2026-11-15'
  quote: It provides the reader with the land use allocation and land cover types
    in the National Forest Estate as of December 31st, 2011.
