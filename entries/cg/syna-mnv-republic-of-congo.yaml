facts:
- claim: Says it monitors the forests and greenhouse gas emissions of the Republic
    of Congo.
  url: https://www.syna-mnv.cg/
  fetched: 2026-11-12
  quote: Le Système National de Mesure, Notification et Vérification (SYNA-MNV) assure
    un suivi transparent et vérifiable des forêts et des émissions de gaz à effet
    de serre de la République du Congo.
- claim: Its forest-cover monitoring function is to map changes in forest cover with
    satellite remote sensing, as the system is being deployed.
  url: https://www.syna-mnv.cg/
  fetched: 2026-11-12
  quote: Cartographier l'évolution du couvert forestier grâce à la télédétection satellitaire.
- claim: Being put into operation by a project carried out since 2022 by FAO with
    the Ministry of Forest Economy and the Central African Forest Initiative.
  url: https://www.syna-mnv.cg/
  fetched: 2026-11-12
  quote: d'opérationnalisation du SYNA-MNV, mis en œuvre depuis 2022 par la FAO en
    partenariat avec le Ministère de l'Économie Forestière (MEF) et l'Initiative pour
    la Forêt d'Afrique Centrale (CAFI).
- claim: Offers a map platform of forest cover and environmental statistics for the
    country.
  url: https://www.syna-mnv.cg/
  fetched: 2026-11-12
  quote: Visualisez le couvert forestier et les statistiques environnementales de
    la République du Congo
