summary: Run by the Jane Goodall Institute, it began drone training with Conservation
  Drones in 2015; 30 camera traps were installed at the institute-managed Tchimpounga
  reserve in 2019.
facts:
- claim: The Tchimpounga reserve, created in March 1999 and classified by the government,
    has been entrusted to the Jane Goodall Institute to manage.
  url: https://janegoodall.fr/notre-impact/actions-terrain-afrique/protection-des-chimpanzes-et-de-la-faune-sauvage/le-sanctuaire-de-tchimpounga/
  fetched: 2026-11-12
  quote: une réserve de 7284 hectares a été créée en mars 1999 et classée par le gouvernement
    de la République du Congo. Sa gestion a été confiée au Jane Goodall Institute.
- claim: In 2019, 30 camera traps were installed at Tchimpounga to photograph, count
    and identify wild chimpanzees.
  url: https://janegoodall.fr/notre-impact/actions-terrain-afrique/protection-des-chimpanzes-et-de-la-faune-sauvage/le-sanctuaire-de-tchimpounga/
  fetched: 2026-11-12
  quote: A Tchimpounga, 30 pièges à caméra ont été installés dans des endroits stratégiques
    en 2019
- claim: JGI Congo employs eco-guards from local communities who patrol the reserve
    and record illegal activities.
  url: https://janegoodall.fr/notre-impact/actions-terrain-afrique/protection-des-chimpanzes-et-de-la-faune-sauvage/le-sanctuaire-de-tchimpounga/
  fetched: 2026-11-12
  quote: le Jane Goodall Institute au Congo (JGI Congo) a engagé des éco-gardes issus
    des communautés locales pour surveiller et patrouiller la zone. Ces éco-gardes
    enregistrent les activités illégales
- claim: In 2015 its team in the Republic of Congo began learning to use drones through
    a partnership with Conservation Drones, for uses including land cover mapping
    and chimpanzee censuses.
  url: https://janegoodall.org/?p=12542
  fetched: 2026-11-12
  quote: the team at the Jane Goodall Institute’s office in the Republic of Congo
    have been learning about the use of drones in conservation through a new partnership
    with Conservation Drones
