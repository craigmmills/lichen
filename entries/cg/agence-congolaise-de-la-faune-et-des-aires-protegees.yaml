summary: Public administrative body created by a 2012 law to implement national policy on wildlife, protected
  areas and anti-poaching units, and tasked with setting up an information system for them.
facts:
- claim: Created by Law No. 34-2012 of 31 October 2012 as a public administrative body of a scientific
    and technical character.
  url: https://economie-forestiere.gouv.cg/faune-aires-protegees/aires-protegees
  fetched: '2026-11-08'
  quote: L’ACFAP, crée par la loi N°34-2012 du 31 octobre 2012, est un établissement public administratif
    à caractère scientifique et technique, doté de la personnalité morale et de l’autonomie financière.
- claim: Its mandate is to implement national policy on managing wildlife, protected areas and anti-poaching
    units.
  url: https://economie-forestiere.gouv.cg/faune-aires-protegees/aires-protegees
  fetched: '2026-11-08'
  quote: Elle a pour mandat de mettre en œuvre la politique nationale en matière de gestion de la faune,
    des aires protégées et des Unités de surveillance et de lutte anti braconnage (USLAB)
- claim: The ministry's page says Congo's protected areas are run by a conservator who answers administratively
    to ACFAP.
  url: https://economie-forestiere.gouv.cg/faune-aires-protegees/aires-protegees
  fetched: '2026-11-08'
  quote: En République du Congo, les aires protégées sont gérées par un Conservateur qui dépend administrativement
    de l'Agence Congolaise de la Faune et des Aires Protégées (ACFAP).
- claim: In June 2015 it held a training workshop on a digital platform for exchanging data with protected
    areas and anti-poaching units, funded by the EU through ECOFAC V with support from RAPAC.
  url: https://economie-forestiere.gouv.cg/faune-aires-protegees/aires-protegees
  fetched: '2026-11-08'
  quote: un atelier de formation sur la gestion de la plateforme numérique d’échange des données et d’informations
    avec les Aires Protégées et les Unités de Surveillance et de Lutte Anti Braconnage (USLAB)
