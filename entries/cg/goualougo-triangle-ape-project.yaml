summary: Begun in 1999 and directed by its co-founders, it uses passive field cameras and
  aims to assess logging effects on apes using timber inventory data and satellite imagery.
facts:
- claim: Directed by its co-founders David Morgan and Crickette Sanz, and begun in 1999.
  url: https://congo-apes.org/about_gtap/
  fetched: 2026-11-12
  quote: The Goualougo Triangle Ape Project is directed by its co-founders David Morgan and
    Crickette Sanz. It was initiated in 1999
- claim: Its goals include evaluating the effect of logging on ape abundance from timber inventory
    data and satellite imagery.
  url: https://congo-apes.org/about_gtap/
  fetched: 2026-11-12
  quote: Evaluate the impact of logging on ape abundance by analyzing timber inventory data
    and satellite imagery
- claim: Surveys biodiversity and tool use with passive remote field cameras.
  url: https://congo-apes.org/
  fetched: 2026-11-12
  quote: Survey biodiversity and tool-use with passive remote field cameras
- claim: Monitors chimpanzees and gorillas in the Goualougo Triangle, at the Mondika site
    in the Kabo concession, and in the active Kabo and Loundougou logging concessions.
  url: https://congo-apes.org/protecting-forests/monitoring-the-impact-of-selective-logging/
  fetched: 2026-11-12
  quote: GTAP’s study sites include (1) the Goualougo Triangle in the southern portion of
    the Nouabalé-Ndoki National Park, (2) the Mondika research and tourism site, within the
    Kabo concession, and (3) the active Kabo and Loundougou logging concessions.
