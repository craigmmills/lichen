summary: Twenty-year partnership, signed by Noé with the Congolese government in April 2021, to manage
  the park, including monitoring of its habitats and wildlife; Noé reports relative stability in megafauna
  monitored since 2013.
facts:
- claim: Noé signed a 20-year partnership agreement with the Congolese government in April 2021 to manage
    the park.
  url: https://noe.org/en/actions/gestion-du-parc-national-de-conkouati-douli/
  fetched: '2026-11-08'
  quote: In April 2021 Noé signed a 20-year partnership agreement with the Congolese government for the
    management of this jewel of the Central African coast
- claim: Its aims include a system for monitoring and protecting the park's marine, river and land areas,
    and wildlife monitoring to measure the health of biodiversity.
  url: https://noe.org/en/actions/gestion-du-parc-national-de-conkouati-douli/
  fetched: '2026-11-08'
  quote: Manage species conservation programs and scientific research and wildlife monitoring activities
    to measure the health of biodiversity and better protect it,
- claim: Among its achievements for 2025, Noé reports an ecological inventory suggesting relative stability
    in the megafauna populations monitored since 2013.
  url: https://noe.org/en/actions/gestion-du-parc-national-de-conkouati-douli/
  fetched: '2026-11-08'
  quote: The results suggest a relative stability in the megafauna populations (chimpanzees, gorillas,
    and elephants) monitored since 2013.
- claim: A GEF announcement listed Conkouati-Douli among six protected areas intended to receive EarthRanger
    support through a project scheduled for July 2022 to March 2026.
  url: https://www.thegef.org/newsroom/press-releases/new-project-deploys-earthranger-strengthen-protected-areas-africa
  fetched: '2026-10-30'
  quote: the Republic of Congo's Nouabalé-Ndoki, Odzala-Kokoua and Conkouati-Douli National Parks
