  quote: Marquage des tortues pour suivi individuel Enregistrement GPS des sites de ponte
- claim: Patrols monitor the beaches through the whole nesting season, from September to March.
  url: https://renatura.org/suivideponte/
  fetched: '2026-11-08'
  quote: Surveillance des plages pendant toute la saison de ponte (de sept à mars).
