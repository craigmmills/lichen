summary: Congolese association created in Pointe-Noire in 2005 that studies and protects marine species,
  monitoring turtle nesting beaches by tagging and GPS recording from September to March.
facts:
- claim: Describes itself as a Congolese association created in Pointe-Noire in 2005.
  url: https://renatura.org/
  fetched: '2026-11-08'
  quote: Créée en 2005 à Pointe-Noire, Renatura est une association congolaise
- claim: Says it has studied and protected marine species and their habitat along the whole Congo coast
    for over 20 years.
  url: https://renatura.org/
  fetched: '2026-11-08'
  quote: Depuis plus de 20 ans, nous œuvrons à l’étude et à la protection des espèces marines emblématiques
    et de leur habitat naturel sur tout le littoral du Congo
- claim: Its nesting monitoring method includes tagging turtles for individual follow-up and GPS recording
    of nesting sites.
  url: https://renatura.org/suivideponte/
