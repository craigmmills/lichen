summary: Funded by WWF Belgium and partnering with the Congolese wildlife agency,
  this WWF organisation is associated with Ntokou-Pikounda, where WWF Belgium reports
  elephant and great ape inventories have begun.
facts:
- claim: WWF Belgium's project page for Ntokou-Pikounda National Park names WWF-République
    du Congo as its partner, for 2022 to 2025.
  url: https://wwf.be/fr/projets/congo-PNNP
  fetched: '2026-11-12'
  quote: Partenaire WWF-République du Congo durée 03/2022 – 06/2025
- claim: WWF Belgium says biological inventories to estimate the size of the park's
    elephant and great ape populations have begun, alongside a study of the decay
    rate of elephant dung and ape nests.
  url: https://wwf.be/fr/projets/congo-PNNP
  fetched: '2026-11-12'
  quote: Des inventaires biologiques pour estimer la taille de ces populations ont
    également débuté.
- claim: A WWF vacancy posted by the recruiter Mission Talent says WWF signed a co-management
    agreement for Ntokou-Pikounda National Park with the Congolese government in November
    2017, covering biological surveys of the park among other work.
  url: https://www.missiontalent.com/openings/wwf-pd-roc-fr/
  fetched: '2026-11-12'
  quote: En novembre 2017, le WWF a signé un accord de partenariat définissant les
    modalités de cogestion du Parc National de Ntokou Pikounda avec le Gouvernement
    du Congo
- claim: The same vacancy says the park director supervises park staff working in
    biomonitoring, under the direct supervision of WWF Congo's country director.
  url: https://www.missiontalent.com/openings/wwf-pd-roc-fr/
  fetched: '2026-11-12'
  quote: Le Directeur est le superviseur principal du personnel du Parc recruté pour
    travailler dans les domaines du biomonitoring
