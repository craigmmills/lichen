summary: Foundation formed through a WCS and forestry ministry partnership, reporting SMART analysis of
  patrol data and EarthRanger equipment in Nouabalé-Ndoki National Park’s operations room.
facts:
- claim: Has managed Nouabalé-Ndoki National Park since 2014, as the result of a public-private partnership
    between WCS and the Ministry of Forest Economy.
  url: https://ndoki.org/en-us/About/Management
  fetched: '2026-11-08'
  quote: Since 2014, Nouabalé-Ndoki National Park has been managed by the Nouabalé-Ndoki Foundation, which
    is the result of a public-private partnership signed between the Wildlife Conservation Society (WCS)
    and the Congolese Ministry of Forest Economy (MEF)
- claim: Says signs of illegal activity collected by patrols are analysed in SMART.
  url: https://ndoki.org/en-us/About/Wildlife-Protection
  fetched: '2026-11-08'
  quote: Signs of illegal human activity in the Park are collected by patrols and analyzed using the Spatial
    Monitoring And Reporting Tool (SMART)
- claim: Says the park's law enforcement operations room is equipped with EarthRanger.
  url: https://ndoki.org/en-us/About/Wildlife-Protection
  fetched: '2026-11-08'
  quote: The Park’s law enforcement operations room is also equipped with EarthRanger
- claim: Says the park hosts three permanent research sites and several other research projects.
  url: https://ndoki.org/en-us/About/Science
  fetched: '2026-11-08'
  quote: Currently, the Park hosts three permanent research sites and several other research projects.
