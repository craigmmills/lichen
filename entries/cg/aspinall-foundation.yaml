summary: A 2021 IUCN article describes BIOPAMA equipment enabling wider reserve patrols and monitoring,
  and says the foundation raised orphaned gorillas and returned them to the wild.
facts:
- claim: An IUCN news article (2021) says the Lésio-Louna Reserve is managed by a collaboration between
    The Aspinall Foundation and the Ministry of Forest Economy.
  url: https://iucn.org/news/protected-areas/202108/lesio-louna-reserve-a-place-beauty-and-potential-a-wildlife-haven
  fetched: 2026-11-08
  quote: It is managed by a collaboration between The Aspinall Foundation and the Ministry of Forest Economy.
- claim: The article says equipment and new technology obtained through BIOPAMA let the team conduct wider
    patrols and record unauthorised activities and bio-monitoring information.
  url: https://iucn.org/news/protected-areas/202108/lesio-louna-reserve-a-place-beauty-and-potential-a-wildlife-haven
  fetched: 2026-11-08
  quote: These valuable resources enable our team to conduct wider patrols and record both unauthorised
    activities and bio-monitoring information in a timely and efficient manner.
- claim: The article says the foundation has raised orphaned gorillas and returned them to the wild in
    the reserve through its Gorilla Protection Project.
  url: https://iucn.org/news/protected-areas/202108/lesio-louna-reserve-a-place-beauty-and-potential-a-wildlife-haven
  fetched: 2026-11-08
  quote: Through the Gorilla Protection Project, The Aspinall Foundation has raised orphaned gorillas
    and, when old enough, returned them to live in the wild.
