summary: Ecological monitoring programme in a community reserve, with an annual waterbird
  census since 1997 that WCS describes as central Africa's longest bird data series,
  a three-yearly hippo census, and camera traps and acoustic devices.
facts:
- claim: Since 1997 the reserve has run an annual waterbird census along the Likouala-aux-herbes
    river and two tributaries, which WCS calls the longest bird data series in central
    Africa.
  url: https://congo.wcs.org/Wild-Places/Lac-T%C3%A9l%C3%A9-Community-Reserve/Research-and-Biomonitoring
  fetched: '2026-11-12'
  quote: Since 1997, the Reserve has been conducting an annual waterbird census along
    the Likouala-aux-herbes river and two tributaries. This represents the longest
    datatime series for birds in central Africa.
- claim: A census of the reserve's hippos is carried out every three years.
  url: https://congo.wcs.org/Wild-Places/Lac-T%C3%A9l%C3%A9-Community-Reserve/Research-and-Biomonitoring
  fetched: '2026-11-12'
  quote: A census of the Reserve’s small population of hippos is carried out every
    three years
- claim: Camera traps deployed over two years generated more than 10,000 wildlife
    photos.
  url: https://congo.wcs.org/Wild-Places/Lac-T%C3%A9l%C3%A9-Community-Reserve/Research-and-Biomonitoring
  fetched: '2026-11-12'
  quote: Over 10,000 photos of wildlife have been generated by camera traps deployed
    over the past two years
- claim: The 2025 annual report records 122 camera traps installed across the study
    area.
  url: https://congo.wcs.org/Portals/255/Reports/Lac_Te%CC%81le%CC%81_Community_Reserve_annual_report_2025_EN.pdf?ver=RwlNHIuT0E94is5v63Ocig%3D%3D
  fetched: '2026-11-12'
  quote: 122 camera traps installed throughout the study area
- claim: The July-August 2026 newsletter says camera traps and acoustic monitoring
    devices are being used in the reserve's ecological monitoring.
  url: https://congo.wcs.org/Newsroom/ID/26636/Lac-Tele-Community-Reserve-July-August-2026-Newsletter
  fetched: '2026-11-12'
  quote: Efforts in the area of ecological monitoring, notably through the use of
    camera traps and acoustic monitoring devices
- claim: WCS says it has co-managed the reserve since 2001 and remains involved in
    its community management.
  url: https://congo.wcs.org/About-Us/Our-Story
  fetched: '2026-11-12'
  quote: In 2001, WCS went to co-manage the country’s first Community Reserve, created
    around Lac Télé
