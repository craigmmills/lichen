summary: Project developing a modelling system for Azores marine protected areas, focused on Condor Seamount,
  with high-resolution domains and vehicle-based validation still in development and due for completion
  in 2026.
facts:
- claim: Develops a modelling system to support monitoring, management and governance of Azores marine
    protected areas, with a focus on Condor Seamount.
  url: https://marine.copernicus.eu/services/use-cases/marine-protected-areas-mpas-modelling-system
  fetched: 2026-11-02
  quote: AIMOS develops and demonstrates a high-resolution physical and biogeochemical oceanographic modelling
    system to support the monitoring, management, and adaptive governance of Marine Protected Areas (MPAs)
    in the Azores
- claim: High-resolution domains and vehicle-based validation were still under development, with completion
    scheduled in 2026.
  url: https://marine.copernicus.eu/services/use-cases/marine-protected-areas-mpas-modelling-system
  fetched: 2026-11-02
  quote: Although the high-resolution domains and AUV-based validation are still under development
