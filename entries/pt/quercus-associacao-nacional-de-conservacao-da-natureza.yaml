summary: Nature conservation association that a 2017 crowdfunding page says owns and
  manages 430 ha in the Tejo Internacional area, and which was to join a 2017 pilot
  collaborative-management project there.
facts:
- claim: A 2017 crowdfunding page says Quercus owns and manages a 430 ha property
    in the Tejo Internacional area, and would manage over 680 ha with a planned 80
    ha purchase.
  url: https://ppl.pt/en/node/336977
  fetched: '2026-11-17'
  quote: the land that we intend to acquire share boundaries with a 430ha property
    which is owned and managed by Quercus.
- claim: A government news item of 18 April 2017 said Quercus would be involved in
    the pilot collaborative-management project for the Tejo Internacional Natural
    Park.
  url: https://portugal.gov.pt/gc21/comunicacao/noticias/20170418-pm-pn-tejo-internacional
  fetched: '2026-11-17'
  quote: O projeto de gestão vai envolver os municípios de Castelo Branco, Vila Velha
    de Ródão, Idanha-a-Nova, a organização ambientalista Quercus, a Associação Empresarial
    da Beira Baixa, o Instituto Politécnico de Castelo Branco e a Instituto de Conservação
    da Natureza e Florestas.
