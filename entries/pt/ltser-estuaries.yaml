summary: Long-term socio-ecological research site covering the Minho, Mondego and
  Mira estuaries, listing multi-year Mondego community monitoring and Mira water and
  tagged-animal monitoring through CoastNet, which it uses.
facts:
- claim: Says the estuaries site covers the estuaries of the Minho, Mondego and Mira
    rivers.
  url: https://www.lterportugal.pt/estuarios
  fetched: 2026-11-08
  quote: O sítio LTER e stuários compreende estuários de três rios - Minho, Mondego
    e Mira
- claim: Says zooplankton, phytoplankton, macrophyte, benthic macroinvertebrate and
    fish communities in the Mondego estuary have been monitored for several years
    alongside continuous water quality analysis.
  url: https://www.lterportugal.pt/estuariomondego
  fetched: 2026-11-08
  quote: Comunidades de zooplâncton, fitoplâncton, macrófitas, macroinvertebrados
    bentónicos e peixes têm sido monitorizados ao longo de vários anos em paralelo
    com análises contínuas da qualidade da água.
- claim: Lists for the Mira estuary continuous monitoring of water parameters and
    of tagged animal movements within the CoastNet infrastructure, and monitoring
    of non-native species.
  url: https://www.lterportugal.pt/estuariomira
  fetched: 2026-11-08
  quote: Monitorização em contínuo de alguns parâmetros físico-químicos e biológicos
    da água e da movimentação de animais marcados, no âmbito da infraestrutura CoastNet
