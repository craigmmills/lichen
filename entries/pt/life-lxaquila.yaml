id: life-lxaquila
kind: project
name: LIFE LxAquila
scope: pt
ai_label: conservation-tech
realms:
- land
status: active
summary: Project run by SPEA with Loures and other partners, co-financed by the EU's
  LIFE programme, which Loures said in August 2024 had carried out study and conservation
  actions, including camera traps at feeding points for prey species.
facts:
- claim: In August 2024, the municipality of Loures said the project was coordinated
    by SPEA in a consortium with the municipality and other bodies, and had carried
    out study and conservation actions.
  url: https://www.cm-loures.pt/noticia.aspx?displayid=16080
  fetched: 2026-11-08
  quote: O projeto LIFE LxAquila, coordenado pela Sociedade Portuguesa para o Estudo
    das Aves (SPEA), em consórcio com o Município de Loures e diversas outras entidades,
    tem desenvolvido ações de estudo e conservação
- claim: In August 2024, Loures said one breeding pair of Bonelli's eagles was monitored
    regularly in the municipality.
  url: https://www.cm-loures.pt/noticia.aspx?displayid=16080
  fetched: 2026-11-08
  quote: No concelho de Loures, a monitorização é realizada regularmente com a conservação
    de um casal
- claim: Says camera traps were installed to confirm that drinking and feeding points
    set up with the project were helping rabbit and red-legged partridge populations.
  url: https://www.cm-loures.pt/noticia.aspx?displayid=16080
  fetched: 2026-11-08
  quote: Para confirmar que estão a cumprir o objetivo, foram instaladas câmaras de
    armadilhagem fotográfica
- claim: Says the project is co-financed by the European Union's LIFE programme.
  url: https://www.cm-loures.pt/noticia.aspx?displayid=16080
  fetched: 2026-11-08
  quote: O objetivo do projeto cofinanciado pelo programa LIFE da União Europeia
