  in 2018.
facts:
- claim: Says it develops research projects in fisheries biology and aquatic ecology and takes
    part as a partner in wider projects on the Minho river basin.
  url: https://aquamuseu.cm-vncerveira.pt/pages/476
  fetched: 2026-11-08
  quote: O Aquamuseu desenvolve projetos de investigação na área da Biologia Pesqueira e Ecologia
    Aquática
- claim: Lists RESTAURAMINHO as a current INTERREG beneficiary-partner project on ecosystem
    rehabilitation, exotic species control and biodiversity conservation in the international
    Minho river, for 2026–2029.
  url: https://aquamuseu.cm-vncerveira.pt/pages/476
  fetched: 2026-11-08
  quote: 'RESTAURAMINHO – Reabilitação de ecossistemas, controlo de espécies exóticas e conservação
    da biodiversidade do rio Minho internacional. Parceiro beneficiário, INTERREG – POCTEP.
    Período: 2026-2029'
- claim: Minho Digital reported on 23 February 2018 that the Aquamuseu had placed a buoy near
    Ilha dos Amores in the Minho estuary to record physical and chemical water parameters.
  url: https://minhodigital.pt/colocada-boia-de/
  fetched: 2026-11-08
  quote: o Aquamuseu do Rio Minho colocou uma boia no estuário do rio Minho, junto à ilha
    dos Amores, com o objetivo de registar parâmetros físico-químicos da água
