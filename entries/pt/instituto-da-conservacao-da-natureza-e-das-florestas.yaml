summary: Portugal's national authority for nature conservation and biodiversity, a public
  institute that coordinates the ENCNB 2030 strategy and runs and built the national forest
  inventory, whose revised strategy cites AI monitoring.
facts:
- claim: The Council of Ministers resolution revising the national nature strategy says the
    ICNF, as national authority for nature conservation and biodiversity, must ensure compliance
    with international and national obligations in this field. Read in a copy of the gazette
    text hosted by the Ordem dos Biólogos.
  url: https://ordembiologos.pt/documents/content/GY0SLfiARnmiAlXW3BnGMQo266
  fetched: 2026-11-02
  quote: enquanto autoridade nacional para a conservação da natureza e biodiversidade, a missão
    de assegurar o cumprimento das obrigações internacionais e nacionais neste domínio
- claim: Its 2023 activity plan describes it as national authority for nature conservation
    and biodiversity and forest authority.
  url: https://www.icnf.pt/api/file/doc/88d785a9a28d5688
  fetched: 2026-11-02
  quote: autoridade nacional para a conservação da natureza e biodiversidade e autoridade
    florestal nacional
