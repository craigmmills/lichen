summary: A government-created agency implementing the national space strategy, Portugal Space
  2030, whose stated aims include expanding Copernicus data use and a national soil occupation
  monitoring programme.
facts:
- claim: Created by the Portuguese government to implement the national space strategy, Portugal
    Space 2030.
  url: https://ptspace.pt/space-2030/
  fetched: 2026-11-02
  quote: is an organization created by the Portuguese government to implement the National
    Strategy for Space (Portugal Space 2030)
- claim: Its founding members are FCT, the National Innovation Agency, the Ministry of Defence
    and the Regional Government of the Azores.
  url: https://ptspace.pt/space-2030/
  fetched: 2026-11-02
  quote: The founding members of Portugal Space are the Foundation for Science and Technology
    (FCT), the National Innovation Agency (ANI), the Ministry of Defence and the Regional
    Government of the Azores.
- claim: Says Copernicus data are used for land use characterisation and forest management,
    and that it aims to expand the national user base.
  url: https://ptspace.pt/?p=70306
  fetched: 2026-11-02
  quote: the Portuguese Space Agency aims to make all of these applications known, as well
    as to expand the national user base
- claim: Sets out aims for Earth observation in Portugal, including a national soil occupation
    monitoring programme.
  url: https://ptspace.pt/earth-observation/
  fetched: '2026-11-02'
  quote: to develop and implement a national soil occupation monitoring program that will
    benefit the entire Public Administration
- claim: Produced the Portuguese Space Catalogue, presented in November 2021 as a portrait
    of the country’s space sector.
  url: https://ptspace.pt/the-portuguese-space-catalogue-is-now-available/
  fetched: '2026-11-02'
  quote: The Portuguese Space Catalogue, produced by the Portuguese Space Agency
- claim: The AIR Centre says it organises Terra em Foco, a biennial Earth observation conference.
  url: https://aircentre.org/en/news/terra-em-foco-highlights-how-earth-observation-can-support-ocean-science-from-whale-detection-to-invasive-algae-monitoring
  fetched: '2026-11-02'
  quote: the biennial Earth Observation conference organised by the Portuguese Space Agency
- claim: Gives an office on Santa Maria island, in the Azores.
  url: https://ptspace.pt/pt/contactos/
  fetched: '2026-11-02'
  quote: Avenida do Faial, Vila do Porto, Ilha de Santa Maria
- claim: The president heads the delegation to the European Space Agency on behalf of the
