summary: A Portuguese non-profit working on nature restoration through rewilding, active in
  the Greater Côa Valley since 2019, with camera trap monitoring of roe deer reported in 2020
  and a volunteer fire monitoring programme opened in 2023.
facts:
- claim: Says it has worked in the Greater Côa Valley since 2019 on projects including scientific
    monitoring.
  url: https://rewilding-portugal.com/
  fetched: 2026-11-02
  quote: we carry out projects in conservation, ecological restoration, scientific monitoring,
    nature tourism and environmental education
- claim: In April 2020, it reported setting up camera traps to record roe deer within LIFE
    WolFlux, in an action coordinated by the University of Aveiro.
  url: https://rewilding-portugal.com/news/roe-deer-monitoring-in-vale-do-coa/
  fetched: 2026-11-02
  quote: Rewilding Portugal registered the presence of roe deer in monitoring actions by setting
    up camera traps
- claim: Describes itself as a Portuguese non-profit dedicated to nature restoration through
    rewilding.
  url: https://rewilding-portugal.com/
  fetched: '2026-11-02'
  quote: Rewilding Portugal is a Portuguese non-profit organisation dedicated to nature restoration
    through the rewilding approach.
- claim: Has worked in the Greater Côa Valley since 2019.
  url: https://rewilding-portugal.com/
  fetched: '2026-11-02'
  quote: Since 2019, we have been working in the Greater Côa Valley
- claim: Opened a volunteer fire monitoring programme in Ermo das Águias in 2023.
  url: https://rewilding-portugal.com/news/eyes-on-the-ground-several-dozen-volunteers-took-part-in-the-fire-monitoring-programme/
  fetched: '2026-11-02'
  quote: In 2023, Rewilding Portugal once again opened its volunteer fire monitoring programme
    in Ermo das Águias rewilding area
- claim: Rewilding Europe reports that a University of Aveiro survey in the area used camera
    trapping and pellet counts.
  url: https://rewildingeurope.com/news/rewilding-efforts-support-roe-deer-comeback-in-the-greater-coa-valley/
  fetched: 2026-11-02
  quote: The survey, which involved camera trapping and pellet counts at sites in and around
    the Greater Côa Valley
- claim: Reported managing 2,442 hectares on its page summarising its 2025 impact.
  url: https://rewilding-portugal.com/rewilding/rewilding-impact/
  quote: Today, 2,442 hectares are under the management of Rewilding Portugal, and it is on
    them that almost everything happens.
