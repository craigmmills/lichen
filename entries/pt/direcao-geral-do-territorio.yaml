  quote: é um serviço central da administração direta do Estado dotado de autonomia administrativa
- claim: The Portuguese Space Agency says DGT and IPMA coordinate the IPSentinel platform,
    which provides Sentinel images to Portugal.
  url: https://ptspace.pt/earth-observation/
  fetched: 2026-11-02
