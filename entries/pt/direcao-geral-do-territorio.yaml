- claim: Copernicus Portugal says it has responsibilities for official land use and land cover
    cartography, as the European Environment Agency's national reference centre.
  url: https://copernicusportugal.ptspace.pt/sistema-de-monitorizacao-da-ocupacao-do-solo-smos/
  fetched: '2026-11-02'
  quote: A DGT é o Centro Nacional de Referência para a ocupação e uso do solo da Agência
