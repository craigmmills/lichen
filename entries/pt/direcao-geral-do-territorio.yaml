summary: Central state service for spatial planning and geographic databases that runs and
  built the land use monitoring system, and is cited by Portugal Space as having substantial
  Earth observation experience.
facts:
- claim: Its stated mission is public policy on spatial planning and urbanism and creating
    and keeping the reference geographic databases.
  url: https://www.dgterritorio.gov.pt/sites/default/files/documentos-publicos/Plano_Atividades_DGT_2025.pdf
  fetched: 2026-11-02
  quote: manutenção das bases de dados geográficos de referência
- claim: Its 2025 activity plan gives its address as Rua Artilharia Um, 107, Lisbon.
  url: https://www.dgterritorio.gov.pt/sites/default/files/documentos-publicos/Plano_Atividades_DGT_2025.pdf
  fetched: 2026-11-02
  quote: Rua Artilharia Um, 107 | 1099-052 Lisboa
- claim: A DGT presentation lists training or fine-tuning deep learning models for image segmentation
    as a step in landscape-level analysis.
  url: https://www.dgterritorio.gov.pt/sites/default/files/ficheiros-artigos/Painel-inovacao-evento-julho.pdf
  fetched: 2026-11-02
  quote: modelos de deep learning para segmentação das imagens
  ai_type: deep-learning
