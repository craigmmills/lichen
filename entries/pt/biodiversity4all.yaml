  fetched: 2026-11-02
  quote: Launched in 2010, the International Year of Biodiversity, BioDiversity4All platform
- claim: A cE3c talk summary, dated to 2020 by the university's event listing, reported more than 276,000
    records from 10,400 species.
  url: https://www.ce3c.pt/en/agenda/encontro-scientia/biodiversity4all-10-years-recording-portuguese-biodiversity
