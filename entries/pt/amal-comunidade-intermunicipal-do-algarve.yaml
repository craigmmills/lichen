summary: Intermunicipal community of Algarve councils that, as Barlavento reported
  in July 2025, gave technical support to Ria Formosa Natural Park co-management and,
  as reported, took delegated powers for Castro Marim reserve co-management.
facts:
- claim: Barlavento reported on 8 July 2025 that AMAL provided technical support to
    Ria Formosa Natural Park co-management on behalf of Faro, Loulé, Olhão, Tavira
    and Vila Real de Santo António.
  url: https://www.barlavento.pt/amal-submete-candidatura-a-acoes-no-ambito-da-cogestao-de-areas-protegidas/
  fetched: '2026-11-17'
  quote: A AMAL presta apoio técnico à cogestão do Parque Natural da Ria Formosa (PNRF)
    em representação dos municípios de Faro, Loulé, Olhão, Tavira e Vila Real de Santo
    António.
- claim: Barlavento reports that Castro Marim and Vila Real de Santo António delegated
    to AMAL powers to take part in the co-management of the Sapal de Castro Marim
    e VRSA Nature Reserve.
  url: https://www.barlavento.pt/?p=248815
  fetched: '2026-11-17'
  quote: Estes municípios delegaram, depois, na AMAL – Comunidade Intermunicipal do
    Algarve competências para participar na cogestão da Reserva.
