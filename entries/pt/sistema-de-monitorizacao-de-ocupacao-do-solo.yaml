summary: A programme built and run by the Direção-Geral do Território that applies AI to Sentinel-2 images
  to map land cover across mainland Portugal, with products free to the public through SNIG.
facts:
- claim: Designed to develop a land cover monitoring system based on space technologies and AI to support
    integrated rural fire management.
  url: https://www.dgterritorio.gov.pt/sites/default/files/ficheiros-dgt/SMOS-Ficha_de_projeto.pdf
  fetched: 2026-11-02
  quote: suporte à gestão integrada de fogos rurais
- claim: Its products include the COS and COSc land use and land cover maps, monthly vegetation state
    maps and an annual map of temporary crops.
  url: https://www.dgterritorio.gov.pt/jiide2023/pdfs/resumos/13-PT_Resumo_PedroBenevides.pdf
  fetched: 2026-11-02
  quote: Mapas Intra-Anuais do Estado da Vegetação
- claim: Its products can be viewed and analysed free of charge in a browser.
  url: https://smos.dgterritorio.gov.pt/
  fetched: 2026-11-02
  quote: De forma livre e gratuita a partir do seu browser, visualize e analise os produtos SMOS
- claim: Aims to produce up-to-date land use and land cover information using space technologies and artificial
    intelligence.
  url: https://copernicusportugal.ptspace.pt/sistema-de-monitorizacao-da-ocupacao-do-solo-smos/
  fetched: '2026-11-02'
  quote: tem como objetivo produzir e disponibilizar informação atualizada de uso e ocupação do solo com
    base em tecnologias espaciais e Inteligência Artificial
- claim: Can support public administration work such as integrated rural fire management, cadastre and
    land planning.
  url: https://copernicusportugal.ptspace.pt/sistema-de-monitorizacao-da-ocupacao-do-solo-smos/
  fetched: '2026-11-02'
  quote: capaz de apoiar atividades da administração pública como a gestão integrada de fogos rurais,
    cadastro e ordenamento do território
- claim: Uses Sentinel-2 images.
  url: https://copernicusportugal.ptspace.pt/sistema-de-monitorizacao-da-ocupacao-do-solo-smos/
  fetched: '2026-11-02'
  quote: Imagens do Sentinel-2
- claim: Its products are free through SNIG.
  url: https://copernicusportugal.ptspace.pt/sistema-de-monitorizacao-da-ocupacao-do-solo-smos/
  fetched: '2026-11-02'
  quote: Produtos cartográficos disponibilizados gratuitamente através do Sistema Nacional de Informação
    geográfica (SNIG)
- claim: SMOS applies artificial intelligence with machine learning and expert knowledge to satellite
    images and makes maps available to the public at no cost.
  url: https://smos.dgterritorio.gov.pt/sobre-o-smos
  fetched: 2026-11-02
  quote: aplica algoritmos de Inteligência Artificial com machine learning e conhecimento pericial em
    imagens de satélite
- claim: Its products monitor mainland Portugal continuously and are free to the public.
  url: https://smos.dgterritorio.gov.pt/sobre-o-smos
  fetched: 2026-11-02
  quote: para disponibilizar ao público de forma fácil e sem custos um conjunto de produtos cartográficos
    de base e de uso e ocupação do solo
