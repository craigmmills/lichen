summary: US Forest Service-funded programme working to prevent extinction of Guam's
  rarest plants, those with fewer than 200 wild individuals, through regular field
  monitoring of wild and outplanted plants and habitat surveys.
facts:
- claim: Works to prevent the extinction of Guam's rarest plant species, those with
    fewer than 200 individuals remaining in the wild.
  url: https://www.gpepp.org/about
  fetched: 2026-11-13
  quote: dedicated to preventing the extinction of Guam’s rarest plant species that
    have fewer than 200 individuals remaining in the wild
- claim: Its field crew regularly monitors the health, phenology and threats of wild
    founder plants and of all outplanted individuals.
  url: https://www.gpepp.org/about
  fetched: 2026-11-13
  quote: The field crew regularly monitors the health, phenology, and potential threats
    to existing wild plants, referred to as founder plants, as well as all outplanted
    individuals.
- claim: Its survey crew regularly surveys habitats throughout Guam for the presence
    of rare plant species.
  url: https://www.gpepp.org/about
  fetched: 2026-11-13
  quote: The survey crew regulary visits and surveys habitats throughout Guam for
    the presence of rare plant species.
