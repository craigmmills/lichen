summary: University of Guam Marine Laboratory programme led by Laurie Raymundo that tracks
  coral communities on Guam's shallow reef flats, with semi-annual collection at five sites
  as of the 2023 report and Tumon Bay data since 2009.
facts:
- claim: The 2023 report describes it as led by Laurie Raymundo of the University of Guam
    Marine Laboratory to document changes in coral communities on Guam's shallow reef flats.
  url: https://www.uog.edu/_resources/files/ml/technical_reports/UOGML_TechRep170_GLTMP_2023.pdf
  fetched: 2026-11-15
  quote: an effort led by Dr. Laurie Raymundo of the University of Guam Marine Laboratory
    (UOGML) to document changes in coral communities on Guam
- claim: As of the 2023 report it involved semi-annual data collection at five reef flat sites.
  url: https://www.uog.edu/_resources/files/ml/technical_reports/UOGML_TechRep170_GLTMP_2023.pdf
  fetched: 2026-11-15
  quote: The Reef Flat Monitoring Program (RFMP) currently involves semi-annual data collection
    at five reef flat sites
- claim: As of the 2023 report, it had collected benthic cover and coral health data at a
    reef flat site in Tumon Bay since 2009.
  url: https://www.uog.edu/_resources/files/ml/technical_reports/UOGML_TechRep170_GLTMP_2023.pdf
  fetched: 2026-11-15
  quote: The UOGML Reef Flat Monitoring Program led by Dr. Raymundo has collected benthic
    cover and coral health data at a reef flat site in Tumon Bay since 2009.
- claim: The 2023 report says reef flat temperatures were recorded at three RFMP sites using
    loggers maintained by Laurie Raymundo since 2009.
  url: https://www.uog.edu/_resources/files/ml/technical_reports/UOGML_TechRep170_GLTMP_2023.pdf
  fetched: 2026-11-15
  quote: Reef flat temperatures were recorded at three RFMP sites using loggers maintained
    by Dr. Raymundo since 2009.
