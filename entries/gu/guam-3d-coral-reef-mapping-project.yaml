summary: Project run by the University of Miami and University of Guam that, as of July 2022,
  was producing centimetre-scale 3D maps of Guam's priority reefs, with imagery collected
  in 2022 still to be processed.
facts:
- claim: In July 2022, Ved Chirayath of the University of Miami and Romina King of the University
    of Guam were leading a project to produce centimetre-scale 3D maps of Guam's priority
    coral reefs; the collected imagery was still to be processed and rendered.
  url: https://www.uog.edu/news-announcements/2021-2022/2022-uog-partnership-produces-unprecedented-3d-maps-of-guams-coral-reefs
  fetched: 2026-11-15
  quote: are leading the project using advanced sensing technology and local resources to
    produce centimeter-scale 3D maps
- claim: From 21 May to 20 June 2022 a team of drone pilots and free divers collected photogrammetry
    data from three marine preserves (Tumon Bay, Piti Bomb Holes and the Achang Reef Flat)
    and other sites, the second phase after a first in 2019.
  url: https://www.uog.edu/news-announcements/2021-2022/2022-uog-partnership-produces-unprecedented-3d-maps-of-guams-coral-reefs
  fetched: 2026-11-15
  quote: This year’s field campaign was the second phase of the 3D reef-mapping project, following
    the first phase in 2019.
- claim: The maps are meant to help resource managers assess reef health, such as the rate
    of bleaching events and the success of coral restoration over time.
  url: https://www.uog.edu/news-announcements/2021-2022/2022-uog-partnership-produces-unprecedented-3d-maps-of-guams-coral-reefs
  fetched: 2026-11-15
  quote: natural resource managers assess the overall health of the reefs — such as the rate
    of bleaching events
- claim: Primarily funded through a Department of the Interior Coral Reef Initiative grant
    administered by the Guam Bureau of Statistics and Plans.
  url: https://www.uog.edu/news-announcements/2021-2022/2022-uog-partnership-produces-unprecedented-3d-maps-of-guams-coral-reefs
  fetched: 2026-11-15
  quote: The project is primarily funded through a grant from the Department of the Interior
    Coral Reef Initiative and administrated by the Guam Bureau of Statistics & Plans.
