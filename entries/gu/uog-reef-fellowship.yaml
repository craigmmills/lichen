summary: Ongoing undergraduate fellowship, run by the UOG Center for Island Sustainability
  and Sea Grant, in which 2026 fellows used AI on CoralNet to analyse reef sites in
  Yap and Kosrae, all showing steady coral decline.
facts:
- claim: In 2026 its fellows worked with the Micronesia Coral Reef Monitoring data
    portal, with each student assigned an island to monitor.
  url: https://www.uog.edu/news-announcements/2025-2026/2026-uog-reef-program-guam-cnmi-coral-reef-monitoring
  fetched: 2026-11-15
  quote: The group worked with the Micronesia Coral Reef Monitoring’s (MCRM) Data
    Portal, which is built to track the health of coral reefs across the region.
- claim: The fellows used AI on the CoralNet platform to identify and analyse the
    sites and their coral, including abundance and health.
  url: https://www.uog.edu/news-announcements/2025-2026/2026-uog-reef-program-guam-cnmi-coral-reef-monitoring
  fetched: 2026-11-15
  quote: They used AI on the Coral Net platform to help identify and analyze the site
    and its coral, including their abundance and overall health.
- claim: The fellows monitored three reefs across Yap and Kosrae, all showing signs
    of steady decline in coral populations.
  url: https://www.uog.edu/news-announcements/2025-2026/2026-uog-reef-program-guam-cnmi-coral-reef-monitoring
  fetched: 2026-11-15
  quote: The fellows monitored three different reefs across Yap and Kosrae, all of
    which showed signs of steady decline in coral populations.
- claim: A June 2026 article describes the programme as ongoing and placing undergraduates
    with mentors in STEM research fields.
  url: https://www.uog.edu/news-announcements/2025-2026/2026-uog-reef-program-guam-cnmi-coral-reef-monitoring
  fetched: 2026-11-15
  quote: The UOG CIS and Sea Grant REEF program is ongoing and places undergraduates
    with mentors in the STEM research fields.
- claim: A Sea Grant account describes its fellows working in Peter Houk's lab at
    the University of Guam Marine Laboratory on benthic image analysis and regional
    datasets with the Micronesia Coral Reef Monitoring programme.
  url: https://seagrant.uog.edu/?p=63280
  fetched: 2026-11-15
  quote: Through hands-on projects involving coral skeleton identification, benthic
    image analysis, and contributing to regional datasets
