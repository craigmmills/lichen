summary: University of Guam research hub that leads five grant-funded programmes,
  including NASA Guam EPSCoR and the UOG Drone Corps, and aims to maintain an online
  hub of geospatial datasets for Micronesia.
facts:
- claim: A September 2025 University of Guam article describes it as a research hub
    within the university's College of Natural and Applied Sciences leading five grant-funded
    programmes, including NASA Guam EPSCoR, NASA Guam Space Grant and the UOG Drone
    Corps.
  url: https://www.uog.edu/news-announcements/2025-2026/2025-research-matters-uog-magic-lab-expands-funding-research-capacity-in-the-pacific
  fetched: 2026-11-15
  quote: 'The lab leads five grant-funded programs: NASA Guam EPSCoR , NASA Guam Space
    Grant , the UOG Drone Corps'
- claim: Its 2023-2024 impact report presents products and datasets from the lab,
    including orthomosaic datasets to which access is granted for educational and
    research purposes on request.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: access to these orthomosaic datasets is granted exclusively for educational
    and research purposes
- claim: In October 2023, a team of eight from the lab travelled to Palau to demonstrate
    unmanned aerial vehicles for research and conservation.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: A team of eight members from the UOG MAGIC Lab traveled to Palau to demonstrate
    the use of unmanned aerial vehicles for research and conservation purposes.
- claim: States the aim of developing and maintaining an online hub of geospatial
    datasets for researchers, natural resource managers and policymakers in the Micronesia
    region.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: Develop and maintain an online hub of geospatial datasets to assist researchers,
    natural resource managers, and policymakers in the Micronesia region.
