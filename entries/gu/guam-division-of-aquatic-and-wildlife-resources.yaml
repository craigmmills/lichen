facts:
- claim: Its Aquatic Section has run offshore and inshore surveys since the early 1970s, and the data
    are the basis for management proposals such as the Marine Preserve Areas.
  url: https://doag.guam.gov/dawr-aquatic-resources/
  fetched: 2026-11-12
  quote: The Aquatic Section of DAWR has been conducting offshore and inshore surveys since the early
    1970’s. The data are the basis for management proposals such as the Marine Preserve Areas.
- claim: Runs a freshwater monitoring project designed to gather long-term data for watershed management.
  url: https://doag.guam.gov/dawr-aquatic-resources/
  fetched: 2026-11-12
  quote: The freshwater monitoring project of DAWR is designed to gather long-term, reliable data for
    watershed management.
- claim: Its Aquatic Section monitors freshwater habitats for introduced pest species of animals and plants.
  url: https://doag.guam.gov/dawr-aquatic-resources/
  fetched: 2026-11-12
  quote: The Aquatic Section also takes care of the freshwater fisheries and habitats, including monitoring
    for introduced pest species of animals and plants.
- claim: Based at the Department of Agriculture in Mangilao, Guam.
