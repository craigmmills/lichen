facts:
- claim: Public Radio Guam reports that the programme teaches local water users to identify and report
    threats to Guam's coral reefs, allowing biologists to gather long-term data on reef health.
  url: https://www.islapublic.org/news/2025-03-12/eyes-of-the-reef-marianas-resumes-training-to-protect-guams-coral-reefs
