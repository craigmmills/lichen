summary: Grant-funded programme led by the Micronesian Area Geospatial Information Center,
  whose freshwater and coral project collected reef imagery at four Guam sites and processed
  1989 to 2021 satellite data for the Northern Guam Lens Aquifer.
facts:
- claim: Its Hånom Fresko yan Åcho' Tåsi (Freshwater and Coral) project collected coral reef
    imagery at Ague Cove, Tumon Bay, Sharks Cove and Faifai Beach.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: collecting coral reef imagery at Ague Cove, Tumon Bay, Sharks Cove, and Faifai Beach
- claim: The same project processed satellite data from 1989 to 2021 to produce information
    on land cover and classification change and species identification at the Northern Guam
    Lens Aquifer.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: Processing of satellite data from 1989 to 2021 to produce information on land cover
    and classification change, species identification, and soil moisture at NGLA
- claim: Its FY2023 seed grants included a project using drone surveys to study the flight
    responses of reef manta rays.
  url: https://www.uog.edu/_resources/files/wptrc/2024-wptrc-magic-lab-impact-report-v6-reduced.pdf
  fetched: 2026-11-15
  quote: Predicting Flight Responses of Reef Manta Ray (Mobula alfredi) via UAS Surveys
- claim: In 2025 the University of Guam named it among the five grant-funded programmes the
    MAGIC Lab leads.
  url: https://www.uog.edu/news-announcements/2025-2026/2025-research-matters-uog-magic-lab-expands-funding-research-capacity-in-the-pacific
