status: active
summary: Project run by the Division of Aquatic and Wildlife Resources, with several
  funders and partners, aiming to establish six breeding pairs of Guam rails on Cocos
  Island, with planned radio telemetry and reported trail camera monitoring.
facts:
- claim: The Division of Aquatic and Wildlife Resources oversees the biological side
    of the project, including bird, lizard and snake surveys and the release and monitoring
    of Guam rails.
  url: https://doag.guam.gov/dawr-kontra-i-kulepbla/
  fetched: 2026-11-13
  quote: DAWR oversees the biological aspect of the project, including bird, lizard
    and snake surveys, rodent eradication, monitor lizard control, release and monitoring
    of Guam rails
- claim: The project page plans to locate all released rails by radio telemetry five
    days a week for the first month, with tracking data intended to determine survivorship,
    dispersal, nest success and habitat preference.
  url: https://doag.guam.gov/dawr-kontra-i-kulepbla/
  fetched: 2026-11-13
  quote: All rails will be located five days per week using radio telemetry for the
    first month after release.
- claim: Its primary focus is to protect the natural resources of Cocos Island and
    establish six breeding pairs of Guam rails.
  url: https://doag.guam.gov/dawr-kontra-i-kulepbla/
  fetched: 2026-11-13
  quote: The primary focus of the project is to protect the natural resources of Cocos
    Island and establish six breeding pairs of ko’ko’ birds.
- claim: UOG Sea Grant reports that a 2023 fellow working under the Division of Aquatic
    and Wildlife Resources set and retrieved trail cameras on Cocos Island to monitor
    rail behaviour, habitat preference, dispersal and survivorship, and to detect
    monitor lizards for removal.
  url: https://seagrant.uog.edu/?p=12911
  fetched: 2026-11-13
  quote: setting up and retrieving trail cameras, which help to monitor ko’ko’ bird
    behavior, habitat preference, dispersal patterns, and overall survivorship.
