facts:
- claim: In June 2018, the park reported that dozens of camera traps had photographed wildlife
    day and night since 2013, producing more than a million photos a year.
  url: https://www.naturetoday.com/intl/nl/nature-reports/message/?msg=24417
  quote: Op de Hoge Veluwe staan sinds 2013 tientallen cameravallen die dag en nacht foto’s
    nemen van al het wild dat voorbij komt. Jaarlijks levert dit meer dan een miljoen foto’s
    op.
  fetched: '2026-11-08'
- claim: The June 2018 report described the photos as a source for ecological research and
    the park's management questions.
  url: https://www.naturetoday.com/intl/nl/nature-reports/message/?msg=24417
  quote: vormen ze een enorm rijke bron aan informatie voor ecologisch onderzoek en beheervraagstukken
    van het park
  fetched: '2026-11-08'
- claim: Actively protects and manages the park's flora and fauna to achieve the highest possible
    biodiversity.
  url: https://hogeveluwe.nl/nl/over-het-park/organisatie
  quote: Het Park streeft een zo hoog mogelijke biodiversiteit na door de flora en fauna actief
    te beschermen en te beheren.
