summary: Monitoring and research programme on birds, bats and marine life at the Hollandse
  Kust (west) offshore wind farm site, using bird radars and cameras. DHI said its
  AI species recognition system MUSE would be deployed there.
scope: nl
facts:
- claim: Developed for the Hollandse Kust (west) Wind Farm Site VI with partners.
  url: https://ecowende.nl/en/news/waardenburg-ecology-and-ecowende-develop-most-extensive-ecological-programme-to-date-for-an-offshore-wind-farm/
  fetched: '2026-10-31'
  quote: Waardenburg Ecology and Ecowende are developing a comprehensive ecological
    programme for Ecowende’s offshore wind farm Hollandse Kust (west) Wind Farm Site
    VI with partners including WMR, WaterProof Marine Consultancy & Services B.V.
    and SEAMARCO.
- claim: DHI says Robin Radar's radar, its AI species recognition solution MUSE and
    a floating platform will be deployed in the wind farm.
