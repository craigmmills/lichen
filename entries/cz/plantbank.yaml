summary: A Czech consortium of four members that jointly operates an e-infrastructure for
  curated plant and vegetation data, and runs Pladias, according to GBIF's publisher record.
facts:
- claim: GBIF's publisher record names its four members and says they jointly operate the
    PlantBank e-infrastructure.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: PlantBank is a Czech consortium (Institute of Botany of the Czech Academy of Sciences;
    Masaryk University – Faculty of Science; University of South Bohemia – Faculty of Science;
    and the Czech Botanical Society) that jointly operates the PlantBank e-infrastructure
- claim: Its GBIF publisher record describes it as a Czech consortium that jointly operates
    an e-infrastructure for curated plant and vegetation data centred on Pladias.
  url: https://api.gbif.org/v1/organization/a1f0ce78-f8aa-4ad9-8315-4c5de93f3ea6
  fetched: 2026-11-07
  quote: jointly operates the PlantBank e-infrastructure centred on the Pladias platform (pladias.cz)
    and related systems for curated plant and vegetation data.
