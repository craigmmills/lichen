facts:
- claim: A non-governmental non-profit association founded in 1912 that brings together
    professional and amateur botanists.
  url: https://botanospol.cz/cs/node/1
  fetched: 2026-11-12
  quote: je nevládní a neziskový spolek, který sdružuje profesionální i amatérské
    botaniky a zájemce o tento obor
- claim: Its secretariat is in Prague 2.
  url: https://botanospol.cz/cs/contact
  fetched: 2026-11-12
  quote: 'Sekretariát: Benátská 433/2, 128 00 Praha 2 - Nové Město'
- claim: Its 2024 activity report says the Vratička floristic database, for entering
    plant records, held 167,145 records by 4 December 2024.
  url: https://botanospol.cz/sites/default/files/2025-07/Zprava_o_cinnosti_CBS_24_fin.pdf
  fetched: 2026-11-12
  quote: 4. prosince 2024 zapsáno 167 145 nálezů
- claim: The same report describes Vratička as a floristic database for entering plant
    records, not only from the Czech Republic.
  url: https://botanospol.cz/sites/default/files/2025-07/Zprava_o_cinnosti_CBS_24_fin.pdf
  fetched: 2026-11-12
  quote: Floristická databáze Vratička je určená pro zapisování floristických nálezů
    nejen z území České republiky.
- claim: The society's site lists Vratička as the records database of its South Bohemian
    branch, and a working group for botanical databases.
  url: https://botanospol.cz/cs/sitemap
