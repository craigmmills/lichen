summary: Interreg Central Europe project that ran from July 2017 to June 2020 with
  a 2,318,784 euro allocation, aiming to coordinate lynx monitoring in three isolated
  populations using camera traps and winter snow tracking.
facts:
- claim: Ran from July 2017 to June 2020 under Interreg Central Europe, with ERDF
    and Czech Ministry of the Environment funding and a total allocation of 2,318,784
    euros.
  url: https://www.npsumava.cz/sprava-np/seznam-projektu/projekt-3lynx/
  fetched: 2026-11-15
  quote: 'Trvání: 7/2017 – 6/2020'
- claim: The project aimed to coordinate monitoring of lynx in three isolated populations
    spanning several states.
  url: https://www.npsumava.cz/sprava-np/seznam-projektu/projekt-3lynx/
  fetched: 2026-11-15
  quote: Cílem projektu 3Lynx je zkoordinovat monitorování výskytu rysů ve 3 izolovaných
    populacích, které zasahují několik států.
- claim: Lynx populations were to be followed in two cross-border regions with a network
    of camera traps and winter snow tracking.
  url: https://www.npsumava.cz/sprava-np/seznam-projektu/projekt-3lynx/
