summary: A database of Czech flora and vegetation, built by Masaryk University, the Institute of Botany
  and the University of South Bohemia, funded by the Czech Science Foundation from 2014 to 2018 and still
  updated.
facts:
- claim: Offers free downloadable datasets, such as the species list of the Czech flora, the Red List
    and species indicator values.
  url: https://pladias.cz/en
  fetched: 2026-11-07
  quote: Download free datasets, e.g. species list of the Czech flora, Red List or species indicator values.
- claim: The Pladias project was funded by the Czech Science Foundation from 2014 to 2018, and the database
    was created in it as research infrastructure.
  url: https://pladias.cz/en
  fetched: 2026-11-07
  quote: was a project funded by the Czech Science Foundation in 2014–2018
- claim: Still updated after the end of the project, in collaboration with the Czech Botanical Society.
  url: https://pladias.cz/en
  fetched: 2026-11-07
  quote: It is continuously updated also after the end of the Pladias project in collaboration with the
    Czech Botanical Society.
- claim: GBIF's publisher record calls it an extensive database of critically revised data on Czech flora
    and vegetation.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: An extensive database of critically revised data on Czech flora and vegetation, available at
    this web portal, was created as an infrastructure to support research within this project.
- claim: The same record says it is continuously updated after the end of the project.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: It is continuously updated also after the end of the Pladias project in collaboration with the
    Czech Botanical Society.
- claim: Its own site says the data are prepared by Masaryk University, the Institute of Botany CAS and
    the University of South Bohemia with the Czech Botanical Society.
  url: https://pladias.cz/en
  fetched: 2026-11-07
  quote: Critically revised data about Czech flora and vegetation prepared by Masaryk University, the
    Institute of Botany of The Czech Academy of Sciences and University of South Bohemia in collaboration
    with the Czech Botanical Society.
- claim: GBIF's publisher record for Pladias says it started as a project funded by the Czech Science
    Foundation from 2014 to 2018.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: Pladias (Plant Diversity Analysis and Synthesis Centre) started as a project funded by the Czech
    Science Foundation from 2014 to 2018.
