summary: Scientific bird organisation founded in 1926 that says it is BirdLife International's
  Czech partner, runs the Avif database and Lineal Species Census, and counted a record 1,269
  volunteers in its 12th white stork count.
facts:
- claim: Founded in 1926 as a scientific organisation to study and protect birds.
  url: https://www.birdlife.cz/wp-content/uploads/2026/07/Vyrocni_zprava_CSO_2025.pdf
  fetched: 2026-11-07
  quote: Česká společnost ornitologická byla v roce 1926 založena jako vědecká organizace
    s cílem zkoumat a chránit ptáky a šířit osvětu.
- claim: In 2025 it published new indices of population change for common European bird species,
    using data from 30 countries on 168 species.
  url: https://www.birdlife.cz/wp-content/uploads/2026/07/Vyrocni_zprava_CSO_2025.pdf
  fetched: 2026-11-07
  quote: V roce 2025 jsme publikovali nové indexy změn početnosti běžných evropských druhů
    ptáků, které jsou volně dostupné na pecbms.info.
- claim: Its 12th white stork count involved a record 1,269 volunteers.
  url: https://www.birdlife.cz/wp-content/uploads/2026/07/Vyrocni_zprava_CSO_2025.pdf
  fetched: 2026-11-07
  quote: Do 12. ročníku sčítání čápů bílých se zapojilo rekordních 1 269 čapích spolupracovníků.
- claim: Registered address at Na Bělidle 34, Prague 5.
  url: https://www.birdlife.cz/wp-content/uploads/2026/07/Vyrocni_zprava_CSO_2025.pdf
  fetched: 2026-11-07
  quote: 'Česká společnost ornitologická, IČ: 49629549 , Na bělidle 34, Praha 5'
- claim: Says it is the Czech national partner of BirdLife International.
  url: https://www.birdlife.cz/en/
  fetched: 2026-11-07
  quote: CSO is the Czech national Partner of BirdLife International.
- claim: Says it runs long-term monitoring of bird distribution and abundance in the Czech
    Republic.
  url: https://www.birdlife.cz/en/
  fetched: 2026-11-07
  quote: Thanks to monitoring, the CSO obtains valuable information on the distribution and
    abundance of birds in the Czech Republic and abroad
- claim: Says volunteers take part in its Lineal Species Census (LSD) monitoring programme.
  url: https://www.birdlife.cz/en/
  fetched: 2026-11-07
  quote: Experienced volunteers regularly participate in the Lineal Species Census (LSD) monitoring
    program.
