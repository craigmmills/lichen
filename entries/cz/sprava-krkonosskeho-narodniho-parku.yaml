summary: Based in Vrchlabí, it processes data using GIS and databases; its 2024–2025
  project aimed to monitor protected species, with a planned black grouse acoustic
  monitoring pilot.
facts:
- claim: Its project scheduled for 1 March 2024 to 30 September 2025 aimed to monitor
    the park's protected species and other specially protected or regionally important
    species.
  url: https://www.krnap.cz/sprava/sprava-krnap/projekty/eu-2021-2027/zoologicky-monitoring-vybranych-druhu-na-uzemi-krnap-a-jeho-op/
  fetched: 2026-11-12
  quote: Realizace projektu spočívá v provedení monitoringů zaměřených především na
    předměty ochrany KRNAP, PO Krkonoše a na zvláště chráněné, či regionálně významné
    druhy
- claim: Its 2024 project plan included a pilot of acoustic monitoring of black grouse
    with recorders, aiming to test the method in mountain terrain and establish long-term
    monitoring.
  url: https://www.krnap.cz/sprava/sprava-krnap/projekty/eu-2021-2027/zoologicky-monitoring-vybranych-druhu-na-uzemi-krnap-a-jeho-op/
  fetched: 2026-11-12
  quote: Jedná se o první a pilotní projekt, jehož hlavním aktuálním cílem je otestovat
    metodiku v horském terénu a na základě získaných zkušeností zavést dlouhodobý
    akustický monitoring tetřívků na území KRNAP.
- claim: Its 2024 to 2025 project page describes a fifteen-year time series from monitoring
    high-altitude butterflies.
  url: https://www.krnap.cz/sprava/sprava-krnap/projekty/eu-2021-2027/zoologicky-monitoring-vybranych-druhu-na-uzemi-krnap-a-jeho-op/
  fetched: 2026-11-12
  quote: Nyní již patnáctiletá časová řada představuje naprosto unikátní datový soubor
- claim: The page gives its address in Vrchlabí.
  url: https://www.krnap.cz/sprava/sprava-krnap/projekty/eu-2021-2027/zoologicky-monitoring-vybranych-druhu-na-uzemi-krnap-a-jeho-op/
  fetched: 2026-11-12
  quote: Správa KRNAP Dobrovského 3 543 01 Vrchlabí
- claim: With the Polish Karkonosze park, it records and processes all data from inventory,
    monitoring and research projects with GIS, in botanical, zoological, climatological
    and other databases.
  url: https://www.krnap.cz/priroda/monitoring-a-vyzkum/publikace-a-databaze/
  fetched: 2026-11-12
  quote: Jejich pracovníci evidují a s využitím soudobých technologií GIS a aplikací
    zpracovávají, třídí, archivují a aktualizují veškerá data z inventarizačních,
    monitorovacích a výzkumných projektů.
