summary: Technology Agency-funded project, running April 2024 to December 2026, to
  develop genetic monitoring of wolves and determine population structure, abundance
  and viability in Czechia, with 10,871 thousand CZK of state support.
facts:
- claim: Aims to develop genetic monitoring methods and make analysis of invasive
    and non-invasive wolf samples more efficient.
  url: https://starfos.tacr.cz/projekty/SS07010447
  fetched: 2026-11-12
  quote: 1) Development of genetic monitoring methods, cooperation with field workers
    and increasing the efficiency of analysis of invasive and non-invasive samples.
- claim: Aims to determine the wolf population's structure, abundance and viability
    in Czechia and to integrate data with neighbouring countries.
  url: https://starfos.tacr.cz/projekty/SS07010447
  fetched: 2026-11-12
  quote: 2) Determination of the population structure, abundance and viability in
    Czechia and determination of favourable conservation status, integration of data
    with neighboring countries
- claim: Runs from 1 April 2024 to 31 December 2026.
  url: https://starfos.tacr.cz/projekty/SS07010447
