summary: State administrative authority under the Ministry of Agriculture from 1 January
  2026, formerly ÚHÚL, which runs the National Forest Inventory combining field plots
  with remote sensing and holds powers under the EU deforestation regulation.
facts:
- claim: The Ministry of Agriculture says the National Forest Inventory is carried
    out in full by the Národní lesnický institut, formerly ÚHÚL.
  url: https://mze.gov.cz/public/portal/mze/lesy/lesnictvi/inventarizace-lesu
  fetched: 2026-11-12
  quote: Její realizaci v plném rozsahu zajišťuje Národní lesnický institut (NLI,
    dříve ÚHÚL).
- claim: From 1 January 2026 it is an organisational unit of the state, set up by
    law as an administrative authority under the Ministry of Agriculture.
  url: https://nli.gov.cz/predmet-cinnosti/
  fetched: 2026-11-12
  quote: Národní lesnický institut, organizační složka státu je zřízená zákonem č.
    226/2013 Sb.
- claim: It exercises powers under the EU regulation on deforestation-free products
    for the relevant commodities and products, except in areas assigned by law to
    the ministry or another administrative authority.
  url: https://nli.gov.cz/predmet-cinnosti/
  fetched: 2026-11-12
  quote: je příslušným k výkonu pravomocí stanovených v nařízení proti odlesňování
- claim: The inventory combines field plot data with remote sensing, including photogrammetric
    interpretation of aerial images and automated map layers from aerial or satellite
    images.
  url: https://nli.gov.cz/portfolio/metodika-nil/
  fetched: 2026-11-12
  quote: Na výsledky FTGM interpretace navazují automatizované postupy tvorby digitálních
    mapových vrstev s využitím leteckých či satelitních snímků.
