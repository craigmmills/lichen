summary: Czech governmental body established in 2015 that runs the Nature Conservation Finds
  Database and National Biodiversity Portal and is registered as a GBIF data publisher.
facts:
- claim: Its English site covers the Czech Republic's 27 protected landscape areas and 4 national
    parks.
  url: https://aopk.gov.cz/web/en
  fetched: 2026-11-07
  quote: There are 27 Protected Landscape Areas (IUCN Category V) and 4 National Parks (Category
    II) in the Czech Republic
- claim: Designates nature reserves; its site reports the new Číhan Fen Meadows Nature Reserve
    designated by the agency.
  url: https://aopk.gov.cz/web/en
  fetched: 2026-11-07
  quote: This forms the new Číhan Fen Meadows Nature Reserve in the Mariánské Lázně region,
    designated by the Nature Conservation Agency of the Czech Republic (NCA CR)
- claim: The national biodiversity strategy says the agency operates the nationwide nature
    conservation information system (ISOP), with unified monitoring methods, and makes all
    its data public.
  url: https://mzp.gov.cz/system/files/2026-05/ODOIMZ-SOBR_CR_2026-2050_a_AP_2026-2030_20260519.pdf
  fetched: 2026-11-07
  quote: AOPK ČR provozuje celostátní systém (ISOP) vč. sjednocených metodik monitoringu a
    veškerá data veřejně poskytuje.
- claim: Registered as a GBIF data publisher.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=100
  fetched: 2026-11-07
  quote: Nature Conservation Agency Czech Republic
- claim: GBIF's publisher record describes it as a governmental body set up in 2015 to protect
    nature and landscape across the country.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: The Nature Conservation Agency of the Czech Republic (NCA) is a governmental body
    established in 2015 under the Conservation of Nature and Landscape Act.
- claim: The same record says its tasks include biodiversity monitoring and data management,
    including the National Biodiversity Portal.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: One of the main tasks is biodiversity monitoring, data management and governance,
    including the National Biodiversity Portal (comprising data about species and habitats).
- claim: The record gives its address in Prague.
  url: https://api.gbif.org/v1/organization?country=CZ&limit=200
  fetched: 2026-11-07
  quote: Kaplanova 1931/1
