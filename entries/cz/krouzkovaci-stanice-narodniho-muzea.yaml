facts:
- claim: Founded in 1934, it coordinates bird ringing in the Czech Republic and holds
    over 5 million records.
  url: https://www.nm.cz/prirodovedecke-muzeum/krouzkovaci-stanice
  fetched: 2026-11-12
  quote: Kroužkovací stanice byla založena v roce 1934 a koordinuje kroužkování ptactva
    na území České republiky. Ve své databázi má přes 5 milionů záznamů
- claim: Its digital database holds over 3.5 million records and 300,000 recoveries;
    the Rings Online application was launched in autumn 2016.
  url: https://www.nm.cz/prirodovedecke-muzeum/krouzkovaci-stanice
  fetched: 2026-11-12
  quote: Digitální databáze Rings Online aplikace byla spuštěna na podzim roku 2016.
- claim: Its data have been provided to dozens of researchers and institutions in
    Czechia and abroad.
  url: https://www.nm.cz/prirodovedecke-muzeum/krouzkovaci-stanice
  fetched: 2026-11-12
  quote: Databáze kroužkovací stanice je využívána nejen tuzemskými, ale i zahraničními
    badateli
- claim: Set up on 1 November 1964 as a scientific unit within the National Museum's
    zoology department.
  url: https://www.nm.cz/prirodovedecke-muzeum/krouzkovaci-stanice
  fetched: 2026-11-12
  quote: zřízena dne 1. listopadu Kroužkovací stanice Národního muzea jako vědecké
    pracoviště v rámci zoologického oddělení
- claim: The National Museum, of which the station is part, was established by the
    Ministry of Culture as a contributory organisation.
  url: https://publikace.nm.cz/povinne-zverejnovane-informace
  fetched: 2026-11-12
  quote: Národní muzeum bylo zřízeno zřizovací listinou Ministerstvem kultury České
    republiky jako příspěvková organizace
