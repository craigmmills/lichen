facts:
- claim: Its goal was research and new technologies for deep understanding of camera-trap
    data, to improve identification of individuals and population estimates of endangered
    species.
  url: https://starfos.tacr.cz/cs/projekty/SS05010008
  fetched: 2026-11-12
  quote: The goal of the project is to carry out research and develop new technologies
    related to deep understanding of data from camera traps.
- claim: The technologies were to support the Nature Conservation Agency in reporting
    species status under Article 17 of the Habitats Directive.
  url: https://starfos.tacr.cz/cs/projekty/SS05010008
  fetched: 2026-11-12
  quote: namely AOPK ČR responsible for reporting species status according to Art.
    17 of Habitats Directive (92/43/EEC)
- claim: The funder's evaluation says it produced a public library for automatic species
    identification on GitHub and PyPI, and neural network models on HuggingFace.
  url: https://starfos.tacr.cz/cs/projekty/SS05010008
