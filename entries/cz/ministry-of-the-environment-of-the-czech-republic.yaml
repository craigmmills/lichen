summary: The Czech ministry with main responsibility for implementing the national biodiversity
  strategy and monitoring progress, and listed by Biodiversa+ as a Czech partner.
facts:
- claim: Has the main responsibility for implementing the Czech biodiversity strategy and
    monitoring progress towards its goals and the 2050 vision.
  url: https://mzp.gov.cz/system/files/2026-05/ODOIMZ-SOBR_CR_2026-2050_a_AP_2026-2030_20260519.pdf
  fetched: 2026-11-07
  quote: Hlavní gesci v implementaci Strategie a monitoringu plnění cílů a Vize do roku 2050
    má Ministerstvo životního prostředí.
- claim: The strategy implements the relevant targets of the Kunming-Montreal Global Biodiversity
    Framework adopted at CBD COP 15.
  url: https://mzp.gov.cz/system/files/2026-05/ODOIMZ-SOBR_CR_2026-2050_a_AP_2026-2030_20260519.pdf
  fetched: 2026-11-07
  quote: Implementuje zejmé- na relevantní cíle Kchun-mingsko-montrealského globálního rámce
    pro biologickou rozmanitost (GBF)
- claim: Publisher of the strategy, with its seat at Vršovická 1442/65, Prague 10.
  url: https://mzp.gov.cz/system/files/2026-05/ODOIMZ-SOBR_CR_2026-2050_a_AP_2026-2030_20260519.pdf
  fetched: 2026-11-07
  quote: Vydalo Ministerstvo životního prostředí, se sídlem Vršovická 1442/65, Praha 10
