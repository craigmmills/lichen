summary: Mobile app for large carnivore mappers, recording GPX routes, signs and photographs,
  enhanced by Hnutí DUHA Šelmy from the original Shelmon app.
facts:
- claim: A mobile app for large carnivore mappers (volunteers, biologists or park
    rangers) that records the route travelled in GPX format and logs findings such
    as carnivore signs and photographs.
  url: https://www.carnivores.cz/carnitrack-mobile-app/
  fetched: 2026-11-15
  quote: CarniTrack is a mobile application designed for large carnivore mappers –
    volunteers, professional biologists, or park rangers.
- claim: Records can be sent to the Selmy.cz web interface and then to the large carnivore
    monitoring coordinators for approval.
  url: https://www.carnivores.cz/carnitrack-mobile-app/
  fetched: 2026-11-15
  quote: All information can be sent to the Selmy.cz web interface, where it can be
    further edited and sent to the large carnivore monitoring coordinators for approval.
- claim: Enhanced by Hnutí DUHA Šelmy from the original Shelmon app within the Interreg
    Central Europe LECA project, co-financed by the EU's ERDF.
  url: https://www.carnivores.cz/carnitrack-mobile-app/
  fetched: 2026-11-15
  quote: The application has been enhanced by Hnutí DUHA Šelmy based on an update
    of the original Shelmon app
