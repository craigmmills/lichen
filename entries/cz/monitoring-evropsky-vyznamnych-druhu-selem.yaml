summary: Closed project run by Hnutí DUHA that mapped wolf, brown bear, lynx and wildcat
  with camera traps and genetic methods, covering 241 squares (6,025 square kilometres)
  from July 2015 to June 2016.
facts:
- claim: Aimed to obtain reliable information on the distribution and numbers of wolf,
    brown bear, lynx and wildcat.
  url: https://www.eeagrants.cz/cs/programy/ehp-fondy-2009-2014/cz02-zivotni-prostredi/schvalene-projekty/monitoring-evropsky-vyznamnych-druhu-sel-1707
  fetched: 2026-11-12
  quote: 'Hlavním cílem projektu je získat věrohodné informace o současném rozšíření
    a početnosti evropsky významných druhů šelem: vlka obecného, medvěda hnědého,
    rysa ostrovida a kočky divoké.'
- claim: Mappers installed camera traps, genetic methods were used on biological samples,
    and the data were assessed in habitat models.
  url: https://monitoring.selmy.cz/o-projektu/
  fetched: 2026-11-12
  quote: Při monitoringu byly sledovány pobytové znaky šelem, mapovatelé instalovali
    fotopasti, při analýze biologických vzorků získaných při stopování pomohly moderní
    molekulárně genetické metody
- claim: From July 2015 to June 2016 it mapped 241 squares of 5 by 5 km, covering
    6,025 square kilometres.
  url: https://monitoring.selmy.cz/o-projektu/
  fetched: 2026-11-12
  quote: V období 7/2015–6/2016 bylo pomocí fotopastí a zjišťování pobytových znaků
    zmapováno 241 kvadrátů 5 × 5 km o celkové rozloze 6 025 km 2 .
- claim: The EEA Grants page lists implementation dates of 1 January 2015 to 30 April
    2016; the project's results page reports monitoring through June 2016 and a final
    conference in October 2016.
  url: https://www.eeagrants.cz/cs/programy/ehp-fondy-2009-2014/cz02-zivotni-prostredi/schvalene-projekty/monitoring-evropsky-vyznamnych-druhu-sel-1707
  fetched: 2026-11-12
  quote: 'Datum zahájení: 1.1.2015, Datum ukončení: 30.4.2016'
