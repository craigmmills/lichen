summary: Czech non-profit founded in 2007 that studies and protects selected wild mammals
  and birds; in 2019 it reported manually processing about 100,000 camera-trap photos and
  had a grant for an AI project still in development.
facts:
- claim: Founded in 2007, the non-profit researches and protects selected wild mammals and
    birds. In September 2019 it named otter and lynx as key species and said it had worked
    intensively on European ground squirrels for five years.
  url: https://news.microsoft.com/cs-cz/features/na-sysly-s-drony-fotopastmi-a-umelou-inteligenci/
  fetched: 2026-11-07
  quote: Nezisková organizace ALKA Wildlife z Peče nedaleko Dačic vznikla v roce 2007 a zaměřuje
    se na ochranu a výzkum volně žijících živočichů
- claim: Its 2025 annual report lists monitoring projects including small carnivore monitoring
    for the Nature Conservation Agency and development of a monitoring method for the steppe
    polecat.
  url: https://www.alkawildlife.eu/media/2024/ALKA_vyrocni_zprava_2025_final.pdf
  fetched: 2026-11-07
  quote: Monitoring drobných šelem se zaměřením na tchoře stepního AOPK ČR tchoř stepní Jihomoravský
    kraj
- claim: Registered at Lidéřovice 62, Dačice.
  url: https://www.alkawildlife.eu/media/2024/ALKA_vyrocni_zprava_2025_final.pdf
  fetched: 2026-11-07
  quote: Lidéřovice 62, 38001 Dačice
- claim: A September 2019 Microsoft article says ALKA Wildlife had manually processed about
    100,000 camera-trap photos from the previous year and had won a grant for a one-year AI
    project; the system was still being developed.
  url: https://news.microsoft.com/cs-cz/features/na-sysly-s-drony-fotopastmi-a-umelou-inteligenci/
  fetched: 2026-11-07
  quote: sepsali žádost o grant z programu Umělá inteligence pro životní prostředí a ten jsme
    hned v prvním termínu získali
- claim: The September 2019 article says the project planned to train the technology on processed
    photos to recognise ground squirrels and their burrows.
  url: https://news.microsoft.com/cs-cz/features/na-sysly-s-drony-fotopastmi-a-umelou-inteligenci/
  fetched: 2026-11-07
  quote: technologie se naučí jednotlivé sysly a jejich nory rozpoznávat ve všemožných scenériích
    nebo světelných podmínkách
