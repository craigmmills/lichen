summary: Czech Academy of Sciences institute (CzechGlobe) working on remote sensing, airborne
  data and forest monitoring, which in 2023 helped set up an oak vitality network and reported
  first National Forest Inventory results in October 2026.
facts:
- claim: In 2023 its scientists, with colleagues from Austria, Slovakia and Serbia, set up
    a monitoring network for the vitality of oaks in floodplain forests.
  url: https://www.avcr.cz/export/sites/avcr.cz/.content/galerie-souboru/tiskove-zpravy/2023/TZ_Vedci-sleduji-vitalitu-a-adaptabilitu-dubu-v-luznich-lesich.pdf
  fetched: 2026-11-07
  quote: Vědci z CzechGlobe spol ečně s kolegy z Rakouska, Slovenska a Srbska v letošním roce
    založili monitorovací síť pro sledování vitality dubů v lužních lesích
- claim: Listed by OpenAlex among Czech institutions on works about machine learning and biodiversity.
  url: https://api.openalex.org/works?filter=institutions.country_code:CZ,title_and_abstract.search:machine%20learning%20biodiversity&per_page=50
  fetched: 2026-11-07
  quote: Czech Academy of Sciences, Global Change Research Institute
- claim: Its Domain of Ecosystems Analysis works on aerial imaging spectroscopy and LiDAR
    to map vegetation parameters and detect plant stress.
  url: https://www.czechglobe.cz/en/institute-structure/research-sector/ii-domain-ecosystems-analysis/
  fetched: 2026-11-07
  quote: development of synchronization methods for aerial data imaging using passive imaging
    spectroscopy and active LiDAR scanning
- claim: The domain includes a Department of Remote Sensing and a Department of Biodiversity
    Research.
  url: https://www.czechglobe.cz/en/institute-structure/research-sector/ii-domain-ecosystems-analysis/
  fetched: 2026-11-07
  quote: Department of Remote Sensing Department of Biodiversity Research
- claim: The domain's address is in Brno.
  url: https://www.czechglobe.cz/en/institute-structure/research-sector/ii-domain-ecosystems-analysis/
  fetched: 2026-11-07
  quote: Bělidla 986/4a 60300 Brno
- claim: Describes CzeCOS as a national infrastructure for research on global change and its
    impacts on ecosystems.
  url: https://www.czechglobe.cz/en/
  fetched: 2026-11-07
  quote: Unique platform for undertaking comprehensive international interdisciplinary research
    on Global Change (GC) and its impacts on ecosystems.
- claim: CzechGlobe coordinates the ForBioSink work package on links between biodiversity,
    forest structure, productivity and carbon storage, using National Forest Inventory data.
  url: https://www.czechglobe.cz/en/institute-structure/research-sector/ii-domain-ecosystems-analysis/
  fetched: 2026-11-07
  quote: Work Package 1, coordinated by CzechGlobe, which focuses on the relationships between
    biodiversity, forest structure, productivity, and carbon storage
- claim: Its site offers airborne data.
  url: https://www.czechglobe.cz
  fetched: 2026-11-07
  quote: Airborne data of CzechGlobe
- claim: Its site describes a soil drought monitoring and forecasting portal combining ground
    measurements, a water balance model, remote sensing and reporters' observations.
  url: https://www.czechglobe.cz
  fetched: 2026-11-07
  quote: Portal of soil drought monitoring and forecasting. It combines data of ground-based
    measurement, a dynamic water balance model, remote sensing methods and observations from
    a wide network of reporters.
- claim: At the ForBioSink meeting on 1–2 October 2026, a CzechGlobe team presented work on
    near-real-time forest monitoring and the path from measured data to decision support.
  url: https://www.czechglobe.cz
  fetched: 2026-11-07
  quote: Another presentation by the CzechGlobe team introduced an activity within Work Package
    4, focusing on the use of modern near-real-time forest monitoring and the pathway from
    measured data to decision support.
- claim: At the ForBioSink meeting on 1–2 October 2026, its site reports first results from
    processing Czech National Forest Inventory data, with selected biodiversity, forest structure
    and carbon stock indicators mapped.
  url: https://www.czechglobe.cz
  fetched: 2026-11-07
  quote: Selected indicators of biodiversity, forest structure, and carbon stocks were visualized
    on maps, allowing their spatial distribution to be examined and areas with different combinations
    of these indicators to be compared.
- claim: Its research sector includes a Domain of Ecosystems Analysis.
  url: https://www.czechglobe.cz
  fetched: 2026-11-07
  quote: II. Domain of Ecosystems Analysis
