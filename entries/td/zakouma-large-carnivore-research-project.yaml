summary: Closed three-year project, 2020 to 2023, funded by the Lion Recovery Fund and led
  by Chiara Fraticelli, using camera traps to estimate large carnivore abundance, density
  and seasonal distribution in Zakouma.
facts:
- claim: Started in 2020 with Lion Recovery Fund money and run over three years, 2020 to 2023,
    coordinated by Chiara Fraticelli.
  url: https://www.apef-conservation.org/2021/03/02/premiers-resultats-de-letude-sur-les-lions-et-les-autres-grands-carnivores-de-zakouma-2/
  fetched: 2026-11-12
  quote: ce projet, coordonné par la chercheuse Chiara Fraticelli, est mené sur 3 ans (2020-2023)
    sur les grands carnivores
- claim: Camera traps across Zakouma were collected after a year of recording, to estimate
    the abundance, density and seasonal distribution of large carnivores.
  url: https://www.apef-conservation.org/2021/03/02/premiers-resultats-de-letude-sur-les-lions-et-les-autres-grands-carnivores-de-zakouma-2/
  fetched: 2026-11-12
  quote: Après un an de prise de vue, des pièges caméras installés sur tout le territoire
    du parc de Zakouma viennent d’être relevés.
- claim: Five lions were fitted with tracking collars in February 2020.
  url: https://www.apef-conservation.org/2021/03/02/premiers-resultats-de-letude-sur-les-lions-et-les-autres-grands-carnivores-de-zakouma-2/
  fetched: 2026-11-12
  quote: La surveillance des lions s’est améliorée par le déploiement de colliers de suivi
    sur cinq lions en février 2020.
- claim: The Zakouma National Park management unit proposed the research project in 2019.
  url: https://www.apef-conservation.org/2021/03/02/premiers-resultats-de-letude-sur-les-lions-et-les-autres-grands-carnivores-de-zakouma-2/
  fetched: 2026-11-12
  quote: L’unité de gestion du Parc national de Zakouma a donc soumis l’idée d’un projet de
    recherche en 2019
