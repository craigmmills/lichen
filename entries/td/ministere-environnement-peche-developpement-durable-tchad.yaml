summary: Chad's environment ministry, which hosts the primary CBD national focal point and,
  per Sahara Conservation, had its minister sign a ten-year management agreement for the Ouadi
  Rimé-Ouadi Achim reserve in July 2025.
facts:
- claim: The CBD lists the ministry, with a postal address in N'Djaména, as the home of Chad's
    primary national focal point for the Convention on Biological Diversity.
  url: https://www.cbd.int/kb/record/focalPoint/7959?Country=td
  fetched: 2026-11-08
  quote: CBD Primary NFP, CHM NFP, SBSTTA NFP
- claim: UNDP names Hassan Bakhit Djamous as the minister in June 2026.
  url: https://www.undp.org/fr/node/587716
  fetched: 2026-11-08
  quote: Le Ministre de l'Environnement, de la Pêche et du Développement Durable, Hassan Bakhit
    Djamous
- claim: UNDP says the Government of Chad, with GEF and UNDP support, officially launched
    the BIOFIN biodiversity finance initiative in Chad in June 2026.
  url: https://www.undp.org/fr/node/587716
  fetched: 2026-11-08
  quote: lance officiellement l'initiative pour le Financement de la Biodiversité (BIOFIN)
    au Tchad.
- claim: A WCS release credits a 2023 camera-trap image from Sena Oura National Park to the
    park, the ministry (MEPDD) and WCS.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/18937/Extinct-Lion-Photographed-in-National-Park.aspx
  fetched: 2026-11-08
  quote: 'Lioness in Sena Oura NP CREDIT: PN Sena Oura, Chad MEPDD/WCS'
- claim: Sahara Conservation's Chad report for July to September 2025 says the ALBIA local
    development and climate adaptation project, funded by the World Bank and the GEF, was
    implemented by the ministry.
  url: https://saharaconservation.org/wp-content/uploads/2026/01/Rapport-dactivites-Tchad-T3-2025_compressed.pdf
  fetched: 2026-11-08
  quote: financé par la Banque mondiale et le Fonds pour l’E nvironnement Mondial, est mis
    en œuvre par le
- claim: The same report says ALBIA as a whole officially ended on 31 October 2025.
  url: https://saharaconservation.org/wp-content/uploads/2026/01/Rapport-dactivites-Tchad-T3-2025_compressed.pdf
  fetched: 2026-11-08
  quote: ensemble a officiellement pris fin le 31 octobre 2025.
- claim: The same report shows the minister, Hassan Bakhit Djamous, signing the ten-year management
    agreement for the Ouadi Rimé-Ouadi Achim Faunal Reserve with Sahara Conservation in July
    2025.
  url: https://saharaconservation.org/wp-content/uploads/2026/01/Rapport-dactivites-Tchad-T3-2025_compressed.pdf
  fetched: 2026-11-08
  quote: Signature de l’accord entre Monsieur le Ministre Hassan
- claim: Its own site names it as the Ministry of Environment, Fisheries and Sustainable Development
    of the Republic of Chad.
  url: https://mepdd.org/
  fetched: '2026-11-08'
  quote: MEPDD — Ministère de l'Environnement, de la Pêche et du Développement Durable | République
    du Tchad
- claim: The Prime Minister's office reports that on 22 December 2025 the Prime Minister chaired
    a meeting to review the ministry's action plan.
  url: https://primature.gouv.td/suivi-evaluation-du-plan-daction-du-ministere-de-lenvironnement-de-la-peche-et-du-developpement-durable/
  fetched: '2026-11-08'
  quote: a présidé ce lundi 22 décembre 2025 , une réunion consacrée au suivi et à l’évaluation
    du plan d’action du Ministère de l’Environnement, de la Pêche et du Développement Durable.
- claim: The Prime Minister's office says the review covered protection of the environment
    and ecosystems, fisheries resources and land restoration.
  url: https://primature.gouv.td/suivi-evaluation-du-plan-daction-du-ministere-de-lenvironnement-de-la-peche-et-du-developpement-durable/
  fetched: '2026-11-08'
  quote: Les échanges ont notamment porté sur la protection de l’environnement et des écosystèmes,
    la gouvernance environnementale, la gestion des ressources halieutiques, la restauration
    des terres
- claim: Noé says its results at Binder-Léré rest on a close partnership with the ministry,
    which it says is pursuing a strategy to safeguard the country's protected areas.
  url: https://noe.org/le-tchad-confie-la-gestion-du-parc-national-de-manda-a-noe/
  fetched: '2026-11-08'
  quote: grâce à un partenariat étroit avec le ministère de l’Environnement, de la Pêche et
    du Développement durable du pays qui poursuit une stratégie ambitieuse de sauvegarde de
    ses aires protégées.
