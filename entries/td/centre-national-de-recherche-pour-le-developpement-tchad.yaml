summary: Chadian public scientific and technical institution renamed from CNAR (created
  in 1991) in 2015, whose remote sensing service an OSS REPSAHEL report says made
  land cover maps.
facts:
- claim: In 2015 the Centre National d'Appui à la Recherche, created in 1991, took
    the name Centre National de Recherche pour le Développement.
  url: https://legitchad.org/textes/ordonnances/ordonnance-15-012-2015-09-03-pr/
  fetched: 2026-11-12
  quote: Le Centre National d’Appui à la Recherche (CNAR), créé par Ordonnance n°19/PR/91
    du 14 décembre 1991 prend la dénomination du Centre National de Recherche pour
    le Développement, en abrégé CNRD.
- claim: A public scientific and technical institution with legal personality and
    financial autonomy.
  url: https://legitchad.org/textes/ordonnances/ordonnance-15-012-2015-09-03-pr/
  fetched: 2026-11-12
  quote: Le Centre National de Recherche pour le Développement est un établissement
    public à caractère scientifique et technique doté de la personnalité morale et
    de l’autonomie financière.
- claim: An OSS REPSAHEL report says CNAR has a remote sensing service.
