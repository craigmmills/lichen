summary: Initiated in 2008 and led by Sahara Conservation with Environment Agency-Abu Dhabi; Sahara Conservation
  reports over 650 wild oryx by mid 2026, monitored with satellite collars.
facts:
- claim: Sahara Conservation says the project was led by Sahara Conservation, with the leadership of the
    Environment Agency-Abu Dhabi and in partnership with the Government of Chad, and was initiated in
    2008.
  url: https://saharaconservation.org/species-recovery/the-scimitar-horned-oryx-reintroduction/
  fetched: 2026-11-08
  quote: and in partnership with the Government of Chad, the Scimitar-horned Oryx Reintroduction Project
    was initiated in 2008.
- claim: Sahara Conservation says its team and local and international experts monitor the oryx with satellite
    collars and field work.
  url: https://saharaconservation.org/species-recovery/the-scimitar-horned-oryx-reintroduction/
  fetched: 2026-11-08
  quote: uses advanced monitoring methods, including satellite collaring and field-based activities to
    track the oryx’s behavior, dispersion, reproduction, and feeding preferences.
- claim: Sahara Conservation says the wild population exceeded 650 by mid 2026.
  url: https://saharaconservation.org/species-recovery/the-scimitar-horned-oryx-reintroduction/
  fetched: 2026-11-08
  quote: the wild population now exceeding more than 650 individuals (mid 2026).
- claim: Sahara Conservation's Chad activity report for the third quarter of 2025 says nine oryx and fifteen
    addax were fitted with transmitter collars.
  url: https://saharaconservation.org/wp-content/uploads/2026/01/Rapport-dactivites-Tchad-T3-2025_compressed.pdf
  fetched: 2026-11-08
  quote: d’équiper neuf oryx et quinze addax de colliers éme tteurs
- claim: The report says that in August 2025 the DFAP and Sahara Conservation jointly investigated suspected
    vulture poisoning in Amdouback canton.
  url: https://saharaconservation.org/wp-content/uploads/2026/01/Rapport-dactivites-Tchad-T3-2025_compressed.pdf
  fetched: 2026-11-08
