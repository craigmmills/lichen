summary: Active monitoring programme in the Ennedi reserve, built by the reserve,
  in which ecoguards were trained in 2023 to use CyberTracker for 11 new ecological
  monitoring protocols.
facts:
- claim: Ecoguards of the reserve were trained in 2023 to use CyberTracker in support
    of 11 new ecological monitoring protocols developed for the reserve.
  url: https://www.apef-conservation.org/2023/06/un-outil-de-terrain-pour-ameliorer-le-suivi-ecologique-dans-l-ennedi/
  fetched: 2026-11-13
  quote: Cet instrument de suivi vient appuyer le travail mené sur les 11 nouveaux
    protocoles de suivi écologique développés récemment pour la RNCE.
- claim: The June 2023 article reported that four teams of three people (eco-monitor,
    ecoguard and driver) had been trained and were taking turns every eight days.
  url: https://www.apef-conservation.org/2023/06/un-outil-de-terrain-pour-ameliorer-le-suivi-ecologique-dans-l-ennedi/
  fetched: 2026-11-13
  quote: Quatre équipes constituées de 3 personnes chacune (éco moniteur, écogarde
    et chauffeur) ont été formées et se relaient tous les 8 jours.
- claim: The protocols cover inventories of fish, bats, small mammals, insects, reptiles
    and amphibians, counts of flagship species and monitoring of water permanence.
  url: https://www.apef-conservation.org/2023/06/un-outil-de-terrain-pour-ameliorer-le-suivi-ecologique-dans-l-ennedi/
  fetched: 2026-11-13
  quote: inventaires de l'ichtyofaune (poissons), chauves-souris, micromammifères,
    insectes, reptiles, amphibiens,
- claim: The June 2023 article says CyberTracker allows file exports whose data the
    Ennedi monitoring department's technician will be able to compile.
  url: https://www.apef-conservation.org/2023/06/un-outil-de-terrain-pour-ameliorer-le-suivi-ecologique-dans-l-ennedi/
  fetched: 2026-11-13
  quote: L’application permet un export de fichiers dont le technicien du département
    de suivi de l’Ennedi pourra compiler les données pour une meilleure gestion du
    parc .
- claim: The January 2021 article reported that the reserve had launched an ornithological
    study, a terrestrial wildlife monitoring system built on camera traps and GPS-collar
    monitoring of five Barbary sheep and five dorcas gazelles.
  url: https://apef-conservation.org/2021/01/15/la-reserve-de-lennedi-ou-la-naissance-dune-aire-protegee/
  fetched: 2026-11-13
  quote: un système de suivi de la faune terrestre conçu avec des pièges photographiques
    et un programme de suivi des certaines espèces grâce à des colliers GPS (5 mouflons
    à manchettes et 5 gazelles dorcas).
