summary: Closed waterbird counting project in Chad, run by the DFAP, which in February 2024
  had AEWA African Initiative support and included an experimental eDNA study using water
  samples.
facts:
- claim: Tour du Valat says that in February 2024 the AEWA African Initiative technical support
    unit (OFB and Tour du Valat) supported its Chadian partner the DFAP in waterbird counts,
    under the RESSOURCE+ project coordinated by FAO and co-funded by FFEM and the EU.
  url: https://tourduvalat.org/actualites/denombrements-doiseaux-deau-sur-le-lac-fitri-tchad-par-la-dfap-avec-le-soutien-de-la-tour-du-valat
  fetched: 2026-11-08
  quote: a appuyé son partenaire tchadien, la Direction de la Faune et des Aires Protégées
    (DFAP) dans des opérations de dénombrements d’oiseaux d’eau.
- claim: The page says the validated data will be added to the international database managed
    by Wetlands International.
  url: https://tourduvalat.org/actualites/denombrements-doiseaux-deau-sur-le-lac-fitri-tchad-par-la-dfap-avec-le-soutien-de-la-tour-du-valat
  fetched: 2026-11-08
  quote: Après avoir été validées, les données collectées viendront compléter la base de données
    internationale gérée par Wetlands International.
- claim: In February 2024, water samples from about twenty pools were collected for an experimental
    eDNA study intended to test quantitative waterbird monitoring, with extraction planned
    at SPYGEN.
  url: https://tourduvalat.org/actualites/denombrements-doiseaux-deau-sur-le-lac-fitri-tchad-par-la-dfap-avec-le-soutien-de-la-tour-du-valat
  fetched: 2026-11-08
  quote: L’objectif est de tester une nouvelle approche expérimentale d’une méthode de suivi
    quantitatif des oiseaux d’eau en Afrique en recoupant quantité d’ADNe et abondance d’oiseaux
    d’eau.
- claim: The page says the Lake Fitri count was made by systematic aerial sampling.
  url: https://tourduvalat.org/actualites/denombrements-doiseaux-deau-sur-le-lac-fitri-tchad-par-la-dfap-avec-le-soutien-de-la-tour-du-valat
  fetched: 2026-11-08
  quote: Un échantillonnage systématique en avion réalisé par Pierre Defos du Rau, Julien
    Birard et Abakar Saleh Wachoum a également permis de dénombrer le lac Fitri.
