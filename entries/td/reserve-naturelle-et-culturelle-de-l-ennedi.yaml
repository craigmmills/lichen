summary: Chadian reserve, officially created in February 2019 and reported in 2021
  as managed by African Parks Network, which uses CyberTracker for ecoguard monitoring
  data collected on smartphones or tablets.
facts:
- claim: Officially created in February 2019; an APEF article of January 2021 says
    it had been managed by African Parks Network since its creation.
  url: https://apef-conservation.org/2021/01/15/la-reserve-de-lennedi-ou-la-naissance-dune-aire-protegee/
  fetched: 2026-11-13
  quote: Gérée depuis sa création par African Parks Networks (APN), la RNCE est l’aire
    protégée la plus récente du Tchad .
- claim: The January 2021 article reported that the reserve had launched an ornithological
    study, a camera-trap system for monitoring terrestrial wildlife and GPS-collar
    monitoring of five Barbary sheep and five dorcas gazelles.
  url: https://apef-conservation.org/2021/01/15/la-reserve-de-lennedi-ou-la-naissance-dune-aire-protegee/
  fetched: 2026-11-13
  quote: La réserve a donc lancé plusieurs activités
- claim: The June 2023 article reported that CyberTracker had been configured for
    the reserve in 2023 and was used by ecoguards on smartphones or tablets; exported
    data could then be compiled by the monitoring department's technician.
  url: https://www.apef-conservation.org/2023/06/un-outil-de-terrain-pour-ameliorer-le-suivi-ecologique-dans-l-ennedi/
  fetched: 2026-11-13
  quote: Depuis 2023, cette application a été paramétrée pour la Réserve de l’Ennedi
    et est maintenant utilisée sur le terrain par les écogardes sur smartphone ou
    tablette.
