facts:
- claim: In its 5 November 2021 post, the JRS Biodiversity Foundation said it supported
    African Parks' research programme of large mammals and ostriches in Zakouma National
    Park, Siniaka Minia Wildlife Reserve and Bahr Salamat Faunal Reserve.
  url: https://jrsbiodiversity.org/using-field-data-to-conserve-two-of-africas-critical-ecosystems/
  fetched: 2026-11-15
  quote: JRS supports African Parks’ research program of large mammals and ostriches
    in Chad’s Zakouma National Park (ZNP), along with adjoining Siniaka Minia Wildlife
    Reserve (SMWR) and Bahr Salamat Faunal Reserve (BSFR).
- claim: The 5 November 2021 page said monitoring included aerial surveys, animal
    collars and ground patrols by law enforcement and research and monitoring teams
    to track large fauna and collect research data.
  url: https://jrsbiodiversity.org/using-field-data-to-conserve-two-of-africas-critical-ecosystems/
  fetched: 2026-11-15
  quote: Monitoring activities include aerial surveys, animal collars, and ground
    patrols by law enforcement and research and monitoring teams to track large fauna
    and collect research data.
- claim: The JRS page was posted on 5 November 2021.
