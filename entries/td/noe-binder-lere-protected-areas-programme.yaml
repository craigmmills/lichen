summary: Programme in south-west Chad where Noé says it has managed the Binder-Léré protected areas complex
  since 2021, reporting GPS-collared elephants and giraffe, an aerial inventory and regenerating forest
  cover.
facts:
- claim: Noé says it manages the Binder-Léré protected areas complex in south-west Chad in partnership
    with the Chadian state.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: 2026-11-08
  quote: En partenariat avec l’Etat tchadien, Noé gère le Complexe d’aires protégées de Binder-Léré situé
    au sud-ouest du Tchad.
- claim: Noé lists nine elephants and one giraffe fitted with GPS collars among its main achievements
    for 2025.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: 2026-11-08
  quote: 9 éléphants, dont 6 femelles, ainsi qu’une girafe mâle ont été équipés de colliers GPS
- claim: Noé says a land-cover report made with satellite images shows forest cover regenerating in the
    national park.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: 2026-11-08
  quote: Un rapport sur l’occupation des sols, produit à l’aide d’images satellitaires, montre une nette
    régénération du couvert forestier dans le Parc national
- claim: Noé says the park teams carried out a full aerial wildlife inventory in partnership with Aviation
    Sans Frontières.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: 2026-11-08
  quote: les équipes du parc ont réalisé un inventaire aérien complet et innovant de la faune
- claim: The complex is made up of the Binder-Léré Wildlife Reserve, created in 1974, and Zah Soo National
    Park, created in 2022.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: '2026-11-08'
  quote: composé de la Réserve faunique de Binder-Léré créée en 1974 et du Parc national de Zah Soo créé
    en 2022
- claim: Its activities include scientific research and wildlife monitoring, notably by aerial survey,
    to measure the state of biodiversity.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: '2026-11-08'
  quote: des activités de recherche scientifique et de surveillance de la faune sauvage via survol aérien
    notamment pour mesurer l’état de santé de la biodiversité et mieux la protéger,
- claim: A land cover report produced from satellite images shows forest cover regenerating in the national
    park since Noé arrived.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: '2026-11-08'
  quote: Un rapport sur l’occupation des sols, produit à l’aide d’images satellitaires, montre une nette
    régénération du couvert forestier dans le Parc national depuis l’arrivée de Noé
- claim: The park teams carried out a full aerial wildlife inventory in partnership with Aviation Sans
    Frontières.
  url: https://noe.org/actions/les-parcs-de-noe-le-complexe-daires-protegees-de-binder-lere/
  fetched: '2026-11-08'
  quote: En partenariat avec Aviation Sans Frontières , les équipes du parc ont réalisé un inventaire
    aérien complet et innovant de la faune
- claim: Noé says it arrived in 2021, and that its work is supported by the European Union, the French
    Development Agency and African Parks' incubator programme.
  url: https://noe.org/le-tchad-confie-la-gestion-du-parc-national-de-manda-a-noe/
  fetched: '2026-11-08'
  quote: avec le soutien de l’Union Européenne , de l’Agence Française du Développement et du programme
    incubateur d’African Parks . Depuis l’arrivée de Noé en 2021
- claim: At Zah Soo National Park, Noé says it uses drones, ultralight aerial surveillance and geospatial
    databases to find the areas most at risk of human-wildlife conflict.
  url: https://noe.org/conflits-humain-faune-tchad-co-existence-durable-possible/
  fetched: '2026-11-08'
  quote: L’utilisation de drones, la surveillance aérienne à l’aide d’un ULM et le suivi de bases de données
    géospatiales permettent d’identifier les zones les plus à risque.
