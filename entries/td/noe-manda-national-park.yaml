summary: Programme under which Chad's government entrusted Manda National Park to Noé for ten years from
  10 December 2025, with operations beginning in early 2026 and camera traps installed.
facts:
- claim: On 10 December 2025 the government of Chad entrusted the management of Manda National Park, in
    Moyen-Chari province, to Noé for ten years.
  url: https://noe.org/le-tchad-confie-la-gestion-du-parc-national-de-manda-a-noe/
  fetched: '2026-11-08'
  quote: Le 10 décembre 2025, le gouvernement du Tchad confie la gestion du Parc national de Manda, dans
    la province du Moyen-Chari, à Noé pour 10 ans.
- claim: Noé officially began operations in the park at the start of 2026.
  url: https://noe.org/au-parc-national-de-manda-au-tchad-les-premieres-missions-de-suivi-ecologique-de-noe-sont-lancees/
  fetched: '2026-11-08'
  quote: Depuis le début de l’année 2026, Noé a officiellement débuté ses opérations au Parc National
    de Manda, au sud du Tchad.
- claim: Since March 2026 ecological monitoring operations have been run in the field with support from
    the Zah Soo National Park teams.
  url: https://noe.org/au-parc-national-de-manda-au-tchad-les-premieres-missions-de-suivi-ecologique-de-noe-sont-lancees/
  fetched: '2026-11-08'
  quote: Depuis le mois de mars, plusieurs opérations de suivi écologique sont menées sur le terrain avec
    l’appui des équipes du Parc National de Zah Soo
- claim: Several camera traps have been installed in different sectors of the park.
  url: https://noe.org/au-parc-national-de-manda-au-tchad-les-premieres-missions-de-suivi-ecologique-de-noe-sont-lancees/
  fetched: '2026-11-08'
  quote: En parallèle, plusieurs caméras pièges ont été installées dans différents secteurs du parc.
- claim: Teams used the Zah Soo National Park ultralight aircraft for survey flights, including hippopotamus
    counts.
  url: https://noe.org/au-parc-national-de-manda-au-tchad-les-premieres-missions-de-suivi-ecologique-de-noe-sont-lancees/
  fetched: '2026-11-08'
  quote: Les équipes ont également mobilisé l’ULM du Parc National de Zah Soo afin de réaliser plusieurs
    survols du parc.
