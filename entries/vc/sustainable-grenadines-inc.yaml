summary: Non-governmental organisation, according to BirdsCaribbean, that trained community researchers
  in 2020 to identify stony coral tissue loss disease; 31 surveys on 6 islands found it absent from the
  country and Grenada then.
facts:
- claim: BirdsCaribbean calls it a non-governmental organisation.
  url: https://www.birdscaribbean.org/tag/susgren/
  fetched: 2026-11-12
  quote: I was introduced to the non-governmental organization Sustainable Grenadines Inc (SusGren).
- claim: Its office on Union Island was destroyed by Hurricane Beryl on 1 July 2024.
  url: https://www.birdscaribbean.org/tag/susgren/
  fetched: 2026-11-12
  quote: Sustainable Grenadines office was completely destroyed when Hurricane Beryl passed through Union
    Island on July 1, 2024.
- claim: Between October and December 2020 it trained community researchers to identify stony coral tissue
    loss disease, and 31 surveys were done on 6 islands.
  url: https://proceedings.gcfi.org/wp-content/uploads/2023/05/74-GCFI-PDF-77-1.pdf
  fetched: 2026-11-12
  quote: 21 individuals were trained, with 34 hours spent training and 31 surveys were done on 6 islands.
- claim: The surveys found that the disease was not present in Saint Vincent and the Grenadines and Grenada
    at the time.
  url: https://proceedings.gcfi.org/wp-content/uploads/2023/05/74-GCFI-PDF-77-1.pdf
  fetched: 2026-11-12
  quote: Based on the monitoring in St. Vincent and the Grenadines and Grenada we determined that SCTLD
    is not present.
- claim: A GCFI paper presented in 2015 described SusGren as championing the Grenadines Network of Marine
    Protected Areas.
  url: https://proceedings.gcfi.org/wp-content/uploads/2018/10/GCFI_68_80.pdf
  fetched: 2026-11-12
