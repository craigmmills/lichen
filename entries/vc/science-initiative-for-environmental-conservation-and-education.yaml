facts:
- claim: An SVGEF grant page says SCIENCE, headed by Lystra Culzac, was established
    in 2011 in St. Vincent, and that EPIC partnered with it and the Department of
    Forestry on seabird research in the Grenadines.
  url: https://www.svgef.org/?p=3801
  fetched: 2026-11-15
  quote: EPIC has partnered with the Department of Forestry and SCIENCE (headed by
    Lystra Culzac), established in 2011 in St. Vincent, to lead seabird research and
    conservation efforts in the Grenadines.
- claim: An SVGEF page says research over the last decade by EPIC and SCIENCE, with
    Grenadines fisherfolk, showed that the Grenadines hold regionally and internationally
    important seabird populations.
  url: https://www.svgef.org/?p=3159
  fetched: 2026-11-15
  quote: Ongoing research over the last decade by the Environmental Protection in
    the Caribbean (EPIC) and SCIENCE in collaboration with Grenadines fisherfolk,
    has revealed that the Grenadines hold regionally and internationally important
    populations of the Brown Booby
- claim: The same page says SVGPF funding paid for a National Avian Education Programme
    run by SCIENCE.
  url: https://www.svgef.org/?p=3159
  fetched: 2026-11-15
  quote: the expert birders of the Science Initiative for Environmental Conservation
    and Education (SCIENCE) embarked upon a National Avian Education Programme (NAEP)
