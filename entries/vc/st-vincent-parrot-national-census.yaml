summary: Programme started in 1986 and run by the Forestry Department; the 2010 census estimated 800 parrots,
  none followed until 2021 for lack of funds, and the 2021 count used GEF-funded project resources.
facts:
- claim: The census was started in 1986 to monitor population trends and was formerly run every other
    year.
  url: https://www.undp.org/node/299896
  fetched: 2026-11-12
  quote: This was initially started in the year 1986 to determine the population and monitor the trends
    in the population changes.
- claim: The 2010 census estimated 800 parrots, and none was held between 2010 and 2021 for lack of funds.
  url: https://www.undp.org/node/299896
  fetched: 2026-11-12
  quote: The most recent census of 2010 recorded an estimated 800 parrots. Since that eleven year lapse
    a census has not been conducted due to limited financial resources.
- claim: The 2021 census was made possible by resources from two GEF-funded projects executed through
    UNDP, the Ridge to Reef project and IWEco.
  url: https://www.undp.org/node/299896
  fetched: 2026-11-12
  quote: This was made possible by resources received from two Global Environment Facility (GEF) funded
    projects, executed through the UNDP
