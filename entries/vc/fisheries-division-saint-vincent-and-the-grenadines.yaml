summary: Division of the Ministry of Agriculture, Forestry, Fisheries, Rural Transformation,
  Industry and Labour that received sea turtle monitoring supplies from SVGCMEMS on
  1 October 2025, for Colonaire and Sandy Bay.
facts:
- claim: A division within the Ministry of Agriculture, Forestry, Fisheries, Rural
    Transformation, Industry and Labour, which on 1 October 2025 received supplies
    from the SVGCMEMS project.
  url: https://tourism.gov.vc/tourism/index.php/news/677-svgcmems-project-supports-sea-turtle-monitoring-programme-with-donation-of-supplies
  fetched: 2026-11-14
  quote: handed over supplies valued at EC$3,218 to the Fisheries Division within
    the Ministry of Agriculture, Forestry, Fisheries, Rural Transformation, Industry
    and Labour.
- claim: The supplies it received are to support sea turtle monitoring, particularly
    at Colonaire and Sandy Bay.
  url: https://tourism.gov.vc/tourism/index.php/news/677-svgcmems-project-supports-sea-turtle-monitoring-programme-with-donation-of-supplies
  fetched: 2026-11-14
  quote: The supplies will support sea turtle monitoring activities, particularly
    at Colonaire and Sandy Bay, two of the country’s key sea turtle nesting sites.
- claim: The UNDP mid-term review of the Ridge to Reef project, begun in November
    2021, says Fisheries carried out AGRRA coral reef monitoring in 2016.
  url: https://erc.undp.org/evaluation/documents/download/20141
  fetched: 2026-11-14
  quote: AGRRA monitori ng was done by Fisheries in 2016.
