summary: Marine park whose six staff were certified in December 2020 for routine biophysical monitoring,
  on a course funded by the SVG Conservation Fund; the CBD profile says it regularly inventories seagrass,
  fish and coral.
facts:
- claim: Six staff completed a biophysical monitoring course held from 15 to 23 December 2020 and were
    certified to conduct routine biophysical monitoring at the park, according to a February 2021 post.
  url: https://www.tobagocays.org/updates/biophysical-monitoring-training-course/
  fetched: 2026-11-12
  quote: The Biophysical Training Program was conducted between the period December 15 th to 23 rd 2020
- claim: During the course staff monitored seagrass and sea urchins at two, and queen conch at three,
    of the park's permanent monitoring sites.
  url: https://www.tobagocays.org/updates/biophysical-monitoring-training-course/
  fetched: 2026-11-12
  quote: Participants conducted in-water monitoring for sea grass and sea urchin at two (2) of the permanent
    monitoring sites and monitor for Queen Conch at three (3) of the permanent monitoring sites within
    the TCMP.
- claim: The training was part of the project "Enhancement of resource management capacity within the
    Tobago Cays Marine Park", funded by the SVG Conservation Fund.
  url: https://www.tobagocays.org/updates/biophysical-monitoring-training-course/
  fetched: 2026-11-12
  quote: under the ongoing project “Enhancement of resource management capacity within the Tobago Cays
    Marine Park” funded by the SVG Conservation Fund.
- claim: The CBD country profile says the park regularly inventories seagrass beds, fish, coral and marine
    vertebrates.
  url: https://www.cbd.int/countries/profile/?country=vc
  fetched: 2026-11-12
  quote: The Tobago Cays Marine Park regularly conducts inventories of the sea grass beds, fish, coral
    and marine vertebrates found within the Park.
- claim: Its contact address is in Clifton, Union Island.
  url: https://www.tobagocays.org/updates/biophysical-monitoring-training-course/
  fetched: 2026-11-12
  quote: Clifton Union Island
