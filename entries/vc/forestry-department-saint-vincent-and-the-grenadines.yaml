summary: Government department that runs the national parrot census; sixty staff and volunteers carried
  out the September 2021 count, which UNDP reports it treats as an indicator of forest health.
facts:
- claim: In September 2021 sixty staff and volunteers of the Forestry Department, in the Ministry of Agriculture,
    Forestry, Fisheries, Rural Transformation, Industry and Labour, conducted a national parrot census
    in the interior forest.
  url: https://www.undp.org/node/299896
  fetched: 2026-11-12
  quote: sixty staff members and volunteers of the Forestry Department of the Ministry of Agriculture,
    Forestry, Fisheries, Rural Transformation, Industry and Labour, journeyed to five (5) sectors positioned
    in remote locations of the interior forest of Saint Vincent to conduct a National Parrot census
- claim: UNDP reports that the department treats the census as an indicator of the health of the forest.
  url: https://www.undp.org/node/299896
  fetched: 2026-11-12
  quote: The Department was pleased to conduct this exercise which provides a good status of the population
    of nation’s national bird and the flagship species which also indicates the status and the health
    of the forest
- claim: The CBD country profile says the Forestry Division runs the parrot census and regular inventories
    of the endemic Black Snake and Endemic Frog.
  url: https://www.cbd.int/countries/profile/?country=vc
  fetched: 2026-11-12
  quote: The Forestry Division conducts a by-annual Parrot Census as well as regular inventorying of the
    population of the endemic Black Snake and Endemic Frog.
