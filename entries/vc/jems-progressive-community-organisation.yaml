facts:
- claim: Searchlight reported in January 2025 that the JEMS Progressive Community
    Organisation is developing a new vulnerability risk map of the country.
  url: https://searchlight.vc/news/2025/01/31/jems-using-integrated-community-approach-climate-awareness-project
  fetched: 2026-11-15
  quote: The Jems Progressive Community Organisation is using an integrated community
    approach to tackling climate change issues and develop new vulnerability Risk
    Map of St Vincent and the Grenadines.
- claim: The report says the Climate Risk Mapping Project is the first phase of the
    organisation's initiative and is supported by Wake Forest University and CEPF's
    small grant facility managed by CANARI.
  url: https://searchlight.vc/news/2025/01/31/jems-using-integrated-community-approach-climate-awareness-project
  fetched: 2026-11-15
  quote: The Climate Risk Mapping Project, which is the first phase of the organisation’s
    initiative to combat climate change in the country, is being supported by the
    Wake Forest University
- claim: Residents of the target communities took part in workshops on how these stressors
    affect wildlife and endemic plant species.
  url: https://searchlight.vc/news/2025/01/31/jems-using-integrated-community-approach-climate-awareness-project
  fetched: 2026-11-15
  quote: Residents of the target communities took part in workshops that assessed
    how these stressors affect wildlife and endemic plant species.
