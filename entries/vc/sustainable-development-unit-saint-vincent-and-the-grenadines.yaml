summary: National focal point for climate change, biodiversity and related areas; it held the 7th National
  Report validation workshop with UNDP on 16 February 2026 and runs the BioSleuths Challenge.
facts:
- claim: Held the validation workshop for the country's 7th National Report to the Convention on Biological
    Diversity on 16 February 2026, in partnership with UNDP.
  url: https://tourism.gov.vc/tourism/index.php/news/699-svg-validates-7th-national-biodiversity-report
  fetched: 2026-11-12
  quote: through the Sustainable Development Unit and in partnership with the United Nations Development
    Programme (UNDP), held a validation workshop for its 7th National Report (7NR) to the Convention on
    Biological Diversity (CBD).
- claim: Planned to submit the 7th National Report to the CBD Secretariat by 28 February 2026.
  url: https://tourism.gov.vc/tourism/index.php/news/699-svg-validates-7th-national-biodiversity-report
  fetched: 2026-11-12
  quote: The Sustainable Development Unit will incorporate decisions from the workshop to finalise the
    7NR ahead of its 28th February 2026 submission to the CBD Secretariat.
- claim: The Ministry of Tourism's office, which issues the unit's releases, is on the 2nd Floor of the
    NIS Building, Upper Bay Street, Kingstown.
  url: https://tourism.gov.vc/tourism/index.php/news/699-svg-validates-7th-national-biodiversity-report
  fetched: 2026-11-12
  quote: The Ministry of Tourism is located on the 2nd Floor, NIS Building, Upper Bay Street, Kingstown,
    St. Vincent & The Grenadines.
- claim: The unit is the national focal point for climate change, biodiversity, chemicals and waste, oceans
    and ozone protection.
  url: https://tourism.gov.vc/tourism/index.php/news/716-everyday-citizens-joined-environmental-experts-to-document-saint-vincent-s-unique-biodiversity-on-earth-day
  fetched: 2026-11-12
  quote: The Sustainable Development Unit serves as the national focal point for climate change, biodiversity,
    chemicals and waste management, oceans, and ozone protection
