summary: Community group, per SVGEF, whose ranger team the UIEA says received the International Ranger
  Award at the IUCN World Conservation Congress; its work includes forest patrols, gecko monitoring and
  turtle nest protection.
facts:
- claim: In a contributed article of October 2025, the UIEA says its ranger team received the International
    Ranger Award at the IUCN World Conservation Congress.
  url: https://www.searchlight.vc/features/2025/10/17/international-recognition-union-island-ranger-team/
  fetched: 2026-11-12
  quote: The Union Island Environmental Alliance (UIEA) Rangers Team, which works to protect the unique
    wildlife of Union Island, has received the International Ranger Award at the IUCN World Conservation
    Congress.
- claim: The ranger team's daily work includes forest patrols, monitoring of the critically endangered
    Union Island gecko and safeguarding sea turtle nests.
  url: https://www.searchlight.vc/features/2025/10/17/international-recognition-union-island-ranger-team/
  fetched: 2026-11-12
  quote: their daily activities ranging from patrolling forests and monitoring critically endangered Union
    Island geckos, to safeguarding sea turtle nests and addressing human-wildlife conflict.
- claim: A 2020 SVGEF grant page names the Union Island Environmental Attackers (UIEA), led by Roseman
    Adams, as doing turtle patrols for ten years.
  url: https://www.svgef.org/?p=3827
  fetched: 2026-11-12
  quote: The UIEA, led by Roseman Adams, has been doing turtle patrols for the last 10 years.
- claim: The SVGEF calls the UIEA a community group.
  url: https://www.svgef.org/?p=3827
  fetched: 2026-11-12
  quote: The implementation of this ban is possible through the work of community groups such as the UIEA
