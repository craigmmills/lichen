summary: Project run by SVGEF that began its fourth year in 2025, expanded to 11 beaches including Bequia,
  and in June 2026 began a monitoring season for nesting hawksbill and green turtles.
facts:
- claim: In 2025 the SVGEF launched the fourth year of its Sea Turtle Monitoring Project, running from
    April to November.
  url: https://www.svgef.org/grants/svgef-sea-turtle-project-in-action-for-2025/
  fetched: 2026-11-12
  quote: The St. Vincent and the Grenadines Environment Fund (SVGEF) has officially launched the fourth
    year of its Sea Turtle Monitoring Project. This national conservation effort runs from April through
    November
- claim: In June 2025 the project expanded to 11 beaches, including its first monitoring on Bequia.
  url: https://www.svgef.org/grants/svgef-sea-turtle-project-in-action-for-2025/
  fetched: 2026-11-12
  quote: the project expanded to cover 11 beaches throughout the country adding Questelles, Richmond,
    Wallibou, Mt.Wynne and Princess Margaret (Bequia).
- claim: Patrols at Big Sands in Sandy Bay are run in partnership with the Fisheries Services.
  url: https://www.svgef.org/grants/svgef-sea-turtle-project-in-action-for-2025/
  fetched: 2026-11-12
  quote: Big Sands in Sandy Bay (in partnership with the Fisheries Services)
- claim: In June 2026 the project began its monitoring season for nesting hawksbill and green turtles,
    with patrols until November.
  url: https://www.svgef.org/?p=5352
  fetched: 2026-11-12
  quote: Our SVGEF Sea Turtle Project begins the monitoring season for nesting hawksbill and green turtles
    in June, preparing the sea turtle team for their roles ahead as they patrol our beaches until November.
