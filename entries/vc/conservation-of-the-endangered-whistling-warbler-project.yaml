  in eBird.
facts:
- claim: Launched in April 2022 with the Forestry Department to monitor the Whistling Warbler and other
    forest birds, build monitoring capacity and prepare a Conservation Action Plan.
  url: https://www.birdscaribbean.org/?p=20962
  fetched: 2026-11-12
  quote: we launched the “ Conservation of the Endangered Whistling Warbler Project” in April 2022 to
    monitor the Whistling Warbler and other forest birds, build local landbird monitoring capacity, prepare
    a Conservation Action Plan for the Whistling Warbler
- claim: In January 2023 it held a Caribbean Landbird Monitoring Training Workshop to set up a long-term
    monitoring programme on St Vincent.
  url: https://www.birdscaribbean.org/?p=20962
  fetched: 2026-11-12
  quote: In January 2023, we held a Caribbean Landbird Monitoring Training Workshop to 1) build local
    capacity to monitor forest birds using standardized protocols, and 2) establish a long-term monitoring
    program on St Vincent.
- claim: Workshop participants recorded count data in the eBird app.
  url: https://www.birdscaribbean.org/?p=20962
  fetched: 2026-11-12
  quote: recording count data in the eBird app (Caribbean pack)
