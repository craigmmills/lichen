summary: National initiative run by the Sustainable Development Unit with UNDP as partner; on Earth Day
  2026 participants documented biodiversity in the Montreal Watershed, with observations to feed national
  environmental records.
facts:
- claim: A national initiative organised by the Sustainable Development Unit in partnership with UNDP;
    on Earth Day 2026 participants documented biodiversity in the Montreal Watershed.
  url: https://tourism.gov.vc/tourism/index.php/news/716-everyday-citizens-joined-environmental-experts-to-document-saint-vincent-s-unique-biodiversity-on-earth-day
  fetched: 2026-11-12
  quote: the BioSleuths Challenge, a national initiative organized by the Sustainable Development Unit
    (SDU) of the Ministry of Tourism, Civil Aviation and Sustainable Development in partnership with the
    United Nations Development Programme (UNDP).
- claim: Observations are to be integrated into the country's national environmental records.
  url: https://tourism.gov.vc/tourism/index.php/news/716-everyday-citizens-joined-environmental-experts-to-document-saint-vincent-s-unique-biodiversity-on-earth-day
  fetched: 2026-11-12
  quote: All observations will be integrated into Saint Vincent and the Grenadines’ national environmental
    records, strengthening the evidence base for conservation planning and environmental monitoring.
- claim: Participants were introduced to Seek by iNaturalist and Merlin Bird ID.
  url: https://tourism.gov.vc/tourism/index.php/news/716-everyday-citizens-joined-environmental-experts-to-document-saint-vincent-s-unique-biodiversity-on-earth-day
  fetched: 2026-11-12
  quote: Participants were also introduced to mobile identification applications such as Seek by iNaturalist
    and Merlin Bird ID.
- claim: A second field event was scheduled for 22 May 2026 at the Vermont Nature Trail.
  url: https://tourism.gov.vc/tourism/index.php/news/716-everyday-citizens-joined-environmental-experts-to-document-saint-vincent-s-unique-biodiversity-on-earth-day
  fetched: 2026-11-12
  quote: A second BioSleuths Challenge field event is scheduled for Friday, 22nd May, 2026, at the Vermont
    Nature Trail.
