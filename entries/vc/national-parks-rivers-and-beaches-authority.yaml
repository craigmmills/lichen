summary: Describes itself as a statutory government body protecting heritage through protected areas,
  and reports monitoring at about 42 water quality stations and eleven mainland beaches.
facts:
- claim: Describes itself as a statutory government body that protects the country's heritage through
    a protected area system.
  url: https://nationalparks.gov.vc/nationalparks/index.php/about
  fetched: 2026-11-12
  quote: The National Parks, Rivers and Beaches Authority (NPA) is a statutory government body that protects
    the rich natural, cultural and historic heritage of SVG. This is done through a protected area system.
- claim: Its technical and administrative staff work from a head office in Kingstown.
  url: https://nationalparks.gov.vc/nationalparks/index.php/about
  fetched: 2026-11-12
  quote: Our technical and administrative staff work from our head office in Kingstown.
- claim: Runs a water quality monitoring programme with about 42 stations at 13 sites, monitored monthly.
  url: https://nationalparks.gov.vc/nationalparks/index.php/monitoring-program
  fetched: 2026-11-12
  quote: Currently a total number of 13 sites and approximately 42 water quality stations has been established
    to date across St. Vincent and are monitored on a monthly basis.
- claim: Has run a beach profile monitoring programme since 2015 and monitors eleven beaches on mainland
    St Vincent.
  url: https://nationalparks.gov.vc/nationalparks/index.php/monitoring-program
  fetched: 2026-11-12
  quote: The NPRBA is currently monitoring eleven beaches across mainland St. Vincent.
- claim: Its past projects page describes a Sea Turtle Conservation Program designed to obtain baseline
    data on sea turtles, with Big Sand and Colonaire beaches planned for monitoring.
  url: https://nationalparks.gov.vc/nationalparks/index.php/projects/past-projects
  fetched: 2026-11-12
  quote: The two main beaches that will be monitored under this program are Big Sand and Colonaire Beach.
- claim: CEPF lists it as grantee for Integrated Watershed Management Planning and Forest Reserve Protection
    in the Central Mountain Range Conservation Corridor of St. Vincent.
  url: https://www.cepf.net/grants/grantee-projects/integrated-watershed-management-planning-and-forest-reserve-protection
  fetched: 2026-11-12
  quote: 'Grantee Name: National Parks, Rivers and Beaches Authority'
