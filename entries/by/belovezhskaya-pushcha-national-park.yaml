summary: State nature protection institution in Brest region, part of the transboundary Bialowieza Forest
  World Heritage Site since 2014, whose 2016 to 2020 research plan included species monitoring and forest
  dynamics.
facts:
- claim: Describes itself as a State Nature Protection Institution whose research serves conservation
    of natural complexes and biological and landscape diversity.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: The mentioned areas of research are consistent with the objectives of the State Nature Protection
    Institution for the preservation of unique natural complexes, biological and landscape diversity
- claim: Its 2016–2020 research plan included monitoring rare and most common species and studying dynamic
    processes in forest ecosystems.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: Observing the population state of rare and most common species in monitoring mode, studying the
    features of dynamic processes in forest ecosystems
- claim: The page sets this research within a subtask of the State Program of scientific research "Nature
    management and ecology" for 2016-2020.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: task 2.22 of the State Program of scientific research "Nature management and ecology" for 2016-2020
- claim: Since 2014 the park has been part of the transboundary World Heritage Site "Bialowieza Forest"
    with Poland.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: Since 2014, Belovezhskaya Pushcha is a transboundary World Heritage Site under the common name
    "Bialowieza Forest" on both sides of the border.
- claim: Its site names it the State Nature Protection Institution National Park Belovezhskaya Pushcha,
    under the Administration of the President of the Republic of Belarus.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: State Nature Protection Institution
- claim: Its site gives its address in the agrotown of Kamenyuki, Kamenets district, Brest region.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: 225063, The Republic of Belarus, Brest region, Kamenets district, agrotown Kamenyuki.
- claim: Its research plan for 2016 to 2020 included estimating the current state and long-term dynamics
    of wild ungulates, including the European bison population.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: estimation of the current state and long-term dynamics of wild ungulates, including the European
    bison population of Belovezhskaya Pushcha
- claim: Its history says regular keeping of the Annals of Nature began in 1948 to record changes in flora,
    fauna, climate and the natural environment.
  url: https://npbp.by/eng/about/science/
  fetched: 2026-11-09
  quote: in which all the changes in flora and fauna, climate, the state of the natural environment, phenological
    phenomena and many others were recorded
