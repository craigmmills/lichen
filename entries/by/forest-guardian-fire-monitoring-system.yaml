summary: Fire monitoring system using machine vision and GIS, reportedly providing full coverage of the
  Ministry of Forestry’s forest fund in 2024, with about 450 monitoring points by June.
facts:
- claim: Uses machine vision with a server platform, software and a GIS to monitor forest land in real
    time and locate fires early.
  url: https://park.by/en/press/news/Smart%20guardian%20of%20Belarusian%20forests.%20Hi-Tech%20Park%20resident%20protects%20from%20fires/
  fetched: 2026-11-09
  quote: In real-time mode, «Forest Guardian» provides smart monitoring of the situation in forest lands,
    determining the exact coordinates and nature of fires at an early stage.
- claim: A June 2024 report says about 450 monitoring points had been installed in Belarus and the system
    provided full coverage of the Ministry of Forestry’s forest fund areas in 2024.
  url: https://park.by/en/press/news/Smart%20guardian%20of%20Belarusian%20forests.%20Hi-Tech%20Park%20resident%20protects%20from%20fires/
  fetched: 2026-11-09
  quote: In 2024, the system provided 100% coverage of the forest fund areas of the Ministry of Forestry
    of Belarus.
- claim: One camera views a radius of 10 to 35 kilometres.
  url: https://park.by/en/press/news/Smart%20guardian%20of%20Belarusian%20forests.%20Hi-Tech%20Park%20resident%20protects%20from%20fires/
  fetched: 2026-11-09
  quote: The viewing radius of one camera is from 10 to 35 kilometers
