summary: Ministry that, according to a BelTA report on the National Legal Internet Portal, will coordinate
  government bodies and report annually on the national biodiversity plan.
facts:
- claim: The National Legal Internet Portal, citing BelTA, reports that the ministry will coordinate government
    bodies, monitor progress on the national biodiversity plan and report annually to the government.
  url: https://law.by/news_en/detail.php?ID=92224
  fetched: 2026-11-09
  quote: The Ministry of Natural Resources and Environmental Protection will coordinate the activities
    of government bodies, monitor the progress in the implements of the national plan and provide annual
    reports to the government.
- claim: The same report says the updated strategy takes account of the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://law.by/news_en/detail.php?ID=92224
  fetched: 2026-11-09
  quote: This update takes into account the Kunming-Montreal Global Biodiversity Framework, adopted in
    2022
