summary: Electronic database of animals living in Belarus, run by the environment
  ministry, which a 2016 news item says is open apart from restricted information,
  with a change to its regulation put to public discussion in 2019.
facts:
- claim: A 2016 news item on the national legal portal says the state cadastres of
    the animal and plant world are electronic databases placed on the internet and
    kept for animals and plants living in Belarus.
  url: https://pravo.by/novosti/novosti-pravo-by/2016/april/10534/
  fetched: 2026-11-12
  quote: Согласно документам кадастры представляют собой электронные базы данных (государственные
    информационные ресурсы «Государственный кадастр животного мира» и «Государственный
    кадастр растительного мира»), размещенные в глобальной компьютерной сети Интернет
- claim: The same item says the cadastres' data are open, apart from state secrets
    and other restricted information.
  url: https://pravo.by/novosti/novosti-pravo-by/2016/april/10534/
  fetched: 2026-11-12
  quote: Данные кадастров носят открытый характер
- claim: In 2019 a draft change to the 2016 regulation on keeping the animal world
    cadastre was put out for public discussion.
  url: https://pravo.by/novosti/novosti-pravo-by/2019/august/38126/
  fetched: 2026-11-12
  quote: Изменения в порядок ведения государственного кадастра животного мира можно
    обсудить на Правовом форуме
