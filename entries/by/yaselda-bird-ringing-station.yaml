summary: A bird ringing station in the Sporauski Nature Reserve, Brest Region, established
  in 2018, where more than 12,000 birds of 101 species were ringed in 2023, used to
  monitor migratory birds.
facts:
- claim: A UNDP Belarus story of 22 May 2024 calls the Yaselda station one of Belarus's
    three bird ringing stations.
  url: https://undp.org/node/463371
  fetched: 2026-11-15
  quote: there is one of Belarus's three bird ringing stations, the Yaselda.
- claim: The story says ornithologists catch birds in nets over the Sporauskaye fen
    mire and weigh, measure and ring each one before release.
  url: https://undp.org/node/463371
  fetched: 2026-11-15
  quote: Each bird is weighed, its biometric parameters are measured, and a light
    ring with an individual number is put on its right leg before it’s released back
    into the wild.
- claim: The story says 110 bird species were recorded at the station from 2018 to
    2023, and more than 12,000 birds of 101 species were ringed in 2023.
  url: https://undp.org/node/463371
  fetched: 2026-11-15
  quote: From 2018 to 2023, 110 species of birds were recorded at the Yaselda station.
    In 2023 alone, more than 12,000 birds of 101 species underwent ringing.
- claim: The story presents the station's ringing as monitoring of migratory birds
    for assessing the effect of wetland conservation work.
  url: https://undp.org/node/463371
  fetched: 2026-11-15
  quote: The ringing station plays a pivotal role in grasping the complex natural
    processes
- claim: A UNDP Belarus story of 8 May 2025 places the station in the Sporauski Nature
    Reserve in Brest Region.
  url: https://www.undp.org/node/522841
  fetched: 2026-11-15
  quote: At the Yaselda bird ringing station in the Sporauski Nature Reserve in Brest
    Region of Belarus
- claim: The 2025 story says the station was established in 2018.
  url: https://www.undp.org/node/522841
  fetched: 2026-11-15
  quote: Since its establishment in 2018, Yaselda station has transformed from a purely
    scientific endeavor into something far greater.
- claim: The 2025 story says the station processed over 12,000 birds of 101 species
    in 2024.
  url: https://www.undp.org/node/522841
  fetched: 2026-11-15
  quote: In 2024 alone, the station processed over 12,000 birds from 101 species
