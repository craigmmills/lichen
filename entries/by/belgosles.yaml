summary: Ministry of Forestry enterprise in Minsk focused on forest management planning and national forest
  condition monitoring, with a remote sensing department that processes drone and satellite data.
facts:
- claim: A republican unitary enterprise of the Ministry of Forestry of the Republic of Belarus.
  url: https://belgosles.by/
  fetched: 2026-11-09
  quote: Лесоустроительное республиканское унитарное предприятие (РУП) «Белгослес» Министерства лесного
    хозяйства Республики Беларусь
- claim: Its main work is forest management planning, which includes the inventory of the forest fund.
  url: https://belgosles.by/
  fetched: 2026-11-09
  quote: Лесоустройство, включающее в себя инвентаризацию лесного фонда, проектирование лесохозяйственных
    мероприятий и изготовление планово-картографических материалов
- claim: Address in Minsk.
  url: https://belgosles.by/
  fetched: 2026-11-09
  quote: г. Минск, 220089,
- claim: Organises national forest condition monitoring and processes its primary data; pest and disease
    monitoring is organised by the state institution Bellesozashchita.
  url: https://belgosles.by/vidy-rabot/monitoring-lesov/
  fetched: 2026-11-09
  quote: Организацию проведения мониторинга состояния лесов и обработку первичных или обобщенных данных
    осуществляет РУП «Белгослес», лесопатологического мониторинга – ГУ «Беллесозащита».
- claim: Monitoring plots sit at the nodes of the pan-European 16 by 16 km grid and are surveyed once
    a year.
  url: https://belgosles.by/vidy-rabot/monitoring-lesov/
  fetched: 2026-11-09
  quote: Мониторинг проводится в пунктах наблюдений заложенных в насаждениях лесного фонда в узлах пересечения
    общеевропейской растровой сетки 16×16 км.
- claim: Its remote sensing department processes drone and satellite data, including from the Belarusian
    satellite, and monitors stand damage from fire, windthrow and dieback.
  url: https://belgosles.by/vidy-rabot/obrabotka-materialov-aero-kosmosemki/
  fetched: 2026-11-09
  quote: Мы проводим обработку данных с беспилотников и спутников (включая Белорусский космический аппарат),
    визуальное и автоматизированное дешифрирование, а также мониторинг повреждений насаждений (пожары,
    ветровалы, усыхания) с использованием ГИС-технологий.
- claim: Uses automated classification methods for thematic interpretation of imagery.
  url: https://belgosles.by/vidy-rabot/obrabotka-materialov-aero-kosmosemki/
  fetched: 2026-11-09
  quote: Тематическое дешифрирование с использованием автоматизированных методов классификации по материалам
    съемки.
- claim: Lists a portal, Forests of Belarus, meant to give access to data on the state and dynamics of
    the country's forest resources, under a paid public contract.
  url: https://belgosles.by/vidy-rabot/portal-lesa-belarusi/
  fetched: 2026-11-09
  quote: Портал предназначен для того, чтобы аккумулировать и предоставлять доступ к самым актуальным
    и достоверным данным о состоянии и динамике развития лесных ресурсов страны.
- claim: OpenAlex lists Belgosles as the first author's affiliation on a 2022 paper on assessing forest
    fire effects by automated processing of remote sensing imagery.
  url: https://api.openalex.org/works?filter=ids.openalex:W4289836702|W4283721331|W7119611507|W7166773600&select=id,display_name,primary_location,authorships
  fetched: 2026-11-09
  quote: Assessment of forest fire effects based on automated processing of Earth remote sensing imager
- claim: A 2019 presentation on the Belarusian remote sensing system names Belgosles and the Ministry
    of Forestry among users of its data.
  url: https://ggim.un.org/meetings/2019/IWS/Minsk/documents/S2-6%20Belarus-Andrei%20Kosilo.pdf
  fetched: 2026-11-09
  quote: Белгослес , Министерство
