facts:
- claim: GBIF lists it as a national park created in 1995 in north-west Belarus, covering 64,493 hectares
    with 73 lakes.
  url: https://api.gbif.org/v1/organization/e64384b6-617c-4383-b92c-9a36a3866fba
  fetched: 2026-11-09
  quote: It is located in the North-West of Belarus. The area is 64 493.3 hectares. There are 73 lakes
    on the territory of the national Park.
