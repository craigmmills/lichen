summary: Planned digital register of Belarusian peatlands, which a 2021 UNDP blog
  says was aiming for completeness by 2025 with GEF funding, and which then held 420
  Brest region peatlands totalling 627,405 ha.
facts:
- claim: A UNDP Belarus blog of 21 April 2021 says Belarus started mapping all its
    peatlands with UNDP support and GEF funding, aiming for an exhaustive digital
    register by 2025.
  url: https://www.undp.org/belarus/blog/why-do-we-need-know-about-our-peatlands
  fetched: 2026-11-12
  quote: With UNDP support and the GEF funding, Belarus started mapping all its peatlands
    with the aim to have an exhaustive digital register by 2025.
- claim: At that date the database held 420 peatlands in the Brest region with a total
    area of 627,405 ha.
  url: https://www.undp.org/belarus/blog/why-do-we-need-know-about-our-peatlands
  fetched: 2026-11-12
  quote: Today the database contains comprehensive information on 420 regional peatlands
    with a total area of 627,405 ha, of which 400,000 ha are undisturbed mires.
- claim: The blog says the register is based on the peatland inventory made by the
    NAS Bioresources Centre and the Institute of Nature Management under a UNDP and
    environment ministry project funded by the GEF.
  url: https://www.undp.org/belarus/blog/why-do-we-need-know-about-our-peatlands
  fetched: 2026-11-12
  quote: The new register is based on the peatlands inventory, made by the Scientific
    and Production Center of the National Academy of Sciences of Belarus on Bioresources
    and the Institute of Nature Management
- claim: The blog says the register will serve as a decision support tool for peatland
    protection and use, including biodiversity conservation.
  url: https://www.undp.org/belarus/blog/why-do-we-need-know-about-our-peatlands
  fetched: 2026-11-12
  quote: the digital peatlands register will serve as a robust decision support tool
    for the protection and sustainable use of peatlands in Belarus
