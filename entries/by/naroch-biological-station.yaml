summary: A university station whose staff and hydroecology laboratory, according to
  a 2024 article, monitored three Naroch lakes year-round since 1978, recording hydrochemistry
  and plankton in an eight-table database.
facts:
- claim: A 2024 article in the BSU repository says that since 1978 staff of the hydroecology
    laboratory and the Naroch Biological Station have run year-round monitoring of
    the three Naroch lakes under a single programme.
  url: https://elib.bsu.by/handle/123456789/313267?locale=en
  fetched: 2026-11-12
  quote: С 1978 г. сотрудники научно-исследовательской лаборатории гидроэкологии и
    Нарочанской биологической станции имени Г. Г. Винберга биологического факультета
    БГУ по единой программе проводят круглогодичный мониторинг озер Нарочь, Мястро
    и Баторино
- claim: The monitoring covers hydrochemistry, phytoplankton, zooplankton, zoobenthos,
    bacterioplankton and primary production, held in an eight-table database.
  url: https://elib.bsu.by/handle/123456789/313267?locale=en
  fetched: 2026-11-12
  quote: 'База данных состоит из восьми таблиц: «Гидрохимия», «Температура и кислород»,
    «Фитопланктон (интегральные пробы)», «Фитопланктон (вертикали)», «Зоопланктон»,
    «Зообентос»'
