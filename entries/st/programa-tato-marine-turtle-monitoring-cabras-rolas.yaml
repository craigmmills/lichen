summary: Run by Programa Tatô at Cabras and Rolas islets, this marine monitoring programme
  reportedly monitored 84 turtles through 52 free-diving surveys.
facts:
- claim: In a post dated 24 November 2025, Programa Tatô wrote that Marine Conservation
    Action Fund funding had strengthened its marine monitoring programme at Cabras
    Islet and Rolas Islet.
  url: https://www.neaq.org/?p=20970
  fetched: 2026-11-15
  quote: 'MCAF funding allowed us to strengthen our marine monitoring program at two
    critical sites: Cabras Islet in the north and Rolas Islet in the south.'
- claim: The November 2025 post reports that the team monitored 84 turtles in 52 free-diving
    surveys, recording health, tagging animals and identifying threats.
  url: https://www.neaq.org/?p=20970
  fetched: 2026-11-15
  quote: Through 52 free-diving surveys, we monitored 84 individual turtles, recording
    health conditions, tagging animals for follow-up
- claim: From September 2024 to August 2025 the wider team of 64 collaborators monitored
    80 nesting beaches and documented 1,201 nests.
  url: https://www.neaq.org/?p=20970
  fetched: 2026-11-15
  quote: From September 2024 to August 2025, our team of 64 collaborators, including
    47 community agents, monitored 80 nesting beaches across the island. We documented
    1,201 nests
