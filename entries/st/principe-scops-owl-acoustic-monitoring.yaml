- claim: The monitors were to establish the distribution of the Príncipe Scops-owl
    and the number of individuals per sampling point.
  url: https://www.birdfund.org/new-page-2
  fetched: 2026-11-14
  quote: The monitors will establish the distribution of the Príncipe Scops-Owl and
    the number of individuals per sampling point.
