id: obo-carbono
kind: project
name: Participatory Management for Community-based Avoided Deforestation in São Tomé
  Obô Natural Park
also_known_as:
- OBÔ-CARBONO
- Gestão Participativa para a Redução da Desflorestação e Degradação Florestal no
  Parque de Obô
scope: st
ai_label: data-infrastructure
realms:
- land
countries:
- st
status: closed
summary: This closed CEPF-funded project aimed to strengthen Obô park community management;
  reports describe a deforestation reference line, STP-CLIMA carbon modelling and
  forest inventory work on São Tomé and Príncipe.
facts:
- claim: CEPF lists the grant period as June 2018 to December 2021.
  url: https://www.cepf.net/grants/grantee-projects/participatory-management-community-based-avoided-deforestation-sao-tome-obo
  fetched: 2026-11-14
  quote: Jun 2018 – Dec 2021
- claim: CEPF says the project aimed to strengthen community-based management of Obô
    park and its buffer zone, including through the production of data for management
    and a REDD+ pilot project.
  url: https://www.cepf.net/grants/grantee-projects/participatory-management-community-based-avoided-deforestation-sao-tome-obo
  fetched: 2026-11-14
  quote: the production of data for management, and the access to financial flows
    for sustainability interventions via the implementation of a REDD + pilot project.
- claim: The project's landscape restoration report, published by CEPF, includes a
    deforestation and forest degradation reference line.
  url: https://cepf.net/resources/documents/landscape-restoration-opportunity-technical-report
  fetched: 2026-11-14
  quote: Linha de Referência de Desflorestação e Degradação Florestal
- claim: The report covers the definition of metrics and the monitoring of indicators.
  url: https://cepf.net/resources/documents/landscape-restoration-opportunity-technical-report
  fetched: 2026-11-14
  quote: Definição de Métricas (C1.D5.A1) e Monitorização de Indicadores (C1.D5.A2)
- claim: The report says a reference line was to be set for each metric and a monitoring
    plan then carried out.
  url: https://cepf.net/resources/documents/landscape-restoration-opportunity-technical-report
  fetched: 2026-11-14
  quote: estabelecida a linha de referência para cada métrica e posteriormente executado
    o plano de monitorização
- claim: The report describes a tool, STP-CLIMA, created within the project to model
    the cost and benefit of carbon.
  url: https://cepf.net/resources/documents/landscape-restoration-opportunity-technical-report
  fetched: 2026-11-14
  quote: STP-CLIMA criada no âmbito deste projeto para a modelação do custo-benefício
    do carbono
- claim: The report's spatial data were organised in a QGIS project.
  url: https://cepf.net/resources/documents/landscape-restoration-opportunity-technical-report
  fetched: 2026-11-14
  quote: 'organizadas num projeto QGIS (Ficheiro Anexo: BaseDados_RPF_OBO_CARBONO.rar).'
- claim: The project's final report to CEPF says it carried out a forest inventory
    in part of São Tomé island.
  url: https://cepf.net/resources/final-project-report/final-project-report-2617
  fetched: 2026-11-14
  quote: O Inventário Florestal do OBO-CARBONO foi realizado em parte da Ilha de São
    Tomé
- claim: The final report says the project supported and designed the forest inventory
    carried out on Príncipe island.
  url: https://cepf.net/resources/final-project-report/final-project-report-2617
  fetched: 2026-11-14
  quote: OBÔ-CARBONO deu suporte e desenhou o inventário florestal realizado na ilha
    do Príncipe
