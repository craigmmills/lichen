summary: Sea turtle conservation NGO on São Tomé, formalised in 2018 from a programme created in 1998,
  employing more than 60 people, mostly from coastal communities, and holding a Monaco foundation project
  for January 2024 to December 2026.
facts:
- claim: Its predecessor, Programa Tatô, was created in 1998 by the EU-funded ECOFAC programme to protect
    sea turtles; coordination passed to MARAPA in 2002.
  url: https://www.fpa2.org/en/projets/community-conservation-of-marine-biodiversity-on-the-island-of-s%C3%A3o-tom%C3%A9-00595
  fetched: 2026-11-12
  quote: later in 2002, ECOFAC passed on to MARAPA, a recent created local NGO, Programa Tatô's coordination
- claim: In 2018 its coordination team set it up as an NGO, the Association Programa Tatô.
  url: https://www.fpa2.org/en/projets/community-conservation-of-marine-biodiversity-on-the-island-of-s%C3%A3o-tom%C3%A9-00595
  fetched: 2026-11-12
  quote: created an international NGO, the ASSOCIATION PROGRAMA TATÔ
- claim: Employs more than 60 people, most from coastal communities, who monitor and protect sites important
    for sea turtles.
  url: https://www.fpa2.org/en/projets/community-conservation-of-marine-biodiversity-on-the-island-of-s%C3%A3o-tom%C3%A9-00595
  fetched: 2026-11-12
  quote: The Programa Tatô now employs more than 60 people, most of whom are members of coastal communities
    responsible for monitoring and protecting sites important for sea turtles
- claim: Monaco Voice says its staff work in ecological monitoring, site protection, applied research
    and environmental education.
  url: https://monacovoice.com/en/article/prince-albert-ii-of-monaco-foundation-supports-sea-turtle-conservation-in-so-tom-and-prncipe
  fetched: 2026-11-12
  quote: working in ecological monitoring, site protection, applied research, environmental education,
    sustainable ecotourism and marine biodiversity advocacy
- claim: Holds a Prince Albert II of Monaco Foundation project, January 2024 to December 2026, on the
    protection and ecological monitoring of sea turtle nesting and feeding areas on São Tomé.
  url: https://www.fpa2.org/en/projets/community-conservation-of-marine-biodiversity-on-the-island-of-s%C3%A3o-tom%C3%A9-00595
  fetched: 2026-11-12
  quote: the protection and ecological monitoring of critical sea turtle nesting and feeding areas
