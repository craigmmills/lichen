summary: Community nonprofit that began about ten years before 2021 to protect and
  monitor sea turtle nesting beaches in the Arecibo region; in 2025 its project leader
  reported over ten years of data, with Playa Grande the main leatherback site.
facts:
- claim: El Nuevo Día (11 April 2021) says Yo Amo el Tinglar began ten years earlier
    to bring volunteers together to protect and monitor sea turtle nesting beaches
    in the Arecibo region.
  url: https://www.elnuevodia.com/ciencia-ambiente/flora-fauna/notas/yo-amo-el-tinglar-cumple-una-decada-de-compromiso-ambiental/
  fetched: 2026-11-15
  quote: Hace 10 años, Yo Amo el Tinglar surgió con la intención de agrupar voluntarios
    para proteger y monitorear las playas de anidación de tortugas marinas en la región
    de Arecibo
- claim: The same article calls it a community nonprofit organisation.
  url: https://www.elnuevodia.com/ciencia-ambiente/flora-fauna/notas/yo-amo-el-tinglar-cumple-una-decada-de-compromiso-ambiental/
  fetched: 2026-11-15
  quote: la organización comunitaria sin fines de lucro también se convirtió en forjadora
    de profesionales ambientales
- claim: The article says that during the COVID-19 pandemic the organisation kept
    up its turtle monitoring under a special permit.
  url: https://www.elnuevodia.com/ciencia-ambiente/flora-fauna/notas/yo-amo-el-tinglar-cumple-una-decada-de-compromiso-ambiental/
  fetched: 2026-11-15
  quote: la organización siguió trabajando en el monitoreo de tortugas con un permiso
    especial
- claim: On 26 August 2025, Primera Hora quoted its project leader saying Yo Amo el
    Tinglar had collected data on several nesting beaches for more than ten years,
    with Playa Grande consistently documented as the nesting site most used by leatherbacks
    among those beaches.
  url: https://www.primerahora.com/noticias/gobierno-politica/notas/podrian-designar-tres-playas-de-la-isla-como-habitat-protegido-de-tinglares/
  fetched: 2026-11-15
  quote: Durante más de 10 años, Yo Amo el Tinglar ha estado recopilando datos en
    múltiples playas de anidación
