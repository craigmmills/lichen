summary: Nonprofit sea turtle research and conservation association founded in 1980,
  with Mona Island, Culebra and Dorado projects reported in 2017 and overnight Dorado
  monitoring in 2025.
facts:
- claim: On 9 March 2017, Primera Hora described Chelonia as a sea turtle research
    and conservation organisation preparing Dorado's coast for the nesting season.
  url: https://www.primerahora.com/noticias/ciencia-tecnologia/notas/el-tinglar-llega-a-dorado/
  fetched: 2026-11-15
  quote: Chelonia, la organización de investigación y conservación de tortugas marinas,
    ya se está preparando para tener lista la casa del tinglar, en la costa de Dorado
- claim: The March 2017 article described Chelonia as a nonprofit association founded
    in 1980, with projects on Mona Island, Culebra and, more recently at that time,
    Dorado.
  url: https://www.primerahora.com/noticias/ciencia-tecnologia/notas/el-tinglar-llega-a-dorado/
  fetched: 2026-11-15
  quote: Chelonia es una asociación sin fines de lucro, fundada en 1980 y con proyectos
    en Isla de Mona, Culebra y más reciente en Dorado.
- claim: In the 2025 season Chelonia ran a saturation study in Dorado, monitoring
    the beaches overnight for two weeks to intercept every nesting female.
  url: https://www.neaq.org/?p=19919
  fetched: 2026-11-15
  quote: They were performing a saturation study, monitoring the beaches overnight
    for two straight weeks to intercept every nesting female
- claim: In the account of the 2025 season, the Chelonia team checked turtles for
    flipper tags and microchips, applied tags where there were none, took measurements
    and marked nests for further monitoring.
  url: https://www.neaq.org/?p=19919
  fetched: 2026-11-15
  quote: the Chelonia team examines the turtle for identification tags (metal flipper
    tags and microchips), applies identification tags if the turtle has none, takes
    measurements, and marks the nest for further monitoring.
