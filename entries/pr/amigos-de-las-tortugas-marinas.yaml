summary: Community-based, volunteer-run NGO in Maunabo, southeast Puerto Rico, protecting
  endangered sea turtles; in July 2023 it reported using an MCAF-funded drone with
  visible and infrared cameras to monitor beaches and detect nesting turtles.
facts:
- claim: The New England Aquarium's Marine Conservation Action Fund grantee post gives
    the organisation as ATMAR Inc., a community organisation and NGO in Maunabo, Puerto
    Rico.
  url: https://neaq.org/use-of-an-unmanned-aerial-vehicle-uav-drone-to-monitor-sea-turtles-on-nesting-beaches-in-southeast-puerto-rico/
  fetched: 2026-11-15
  quote: Friends of the Sea Turtles, ATMAR Inc.
- claim: The post describes it as a community-based, volunteer-run organisation protecting
    endangered sea turtles in southeast Puerto Rico.
  url: https://neaq.org/use-of-an-unmanned-aerial-vehicle-uav-drone-to-monitor-sea-turtles-on-nesting-beaches-in-southeast-puerto-rico/
  fetched: 2026-11-15
  quote: is a community-based, volunteer-run organization working to protect endangered
    sea turtles in southeast Puerto Rico.
- claim: In the July 2023 post, the organisation described monitoring nesting activity
    on remote beaches and tagging females at night while they nested.
  url: https://neaq.org/use-of-an-unmanned-aerial-vehicle-uav-drone-to-monitor-sea-turtles-on-nesting-beaches-in-southeast-puerto-rico/
  fetched: 2026-11-15
  quote: to account for nesting activity and to tag females at night while they nest.
- claim: In July 2023, the organisation reported buying a drone with visible and infrared
    cameras using an MCAF grant and using it to monitor beaches by day and detect
    nesting turtles at night.
  url: https://neaq.org/use-of-an-unmanned-aerial-vehicle-uav-drone-to-monitor-sea-turtles-on-nesting-beaches-in-southeast-puerto-rico/
  fetched: 2026-11-15
  quote: Thanks to the grant from MCAF, we acquired a drone with a visible camera
    and an infrared camera, which allows us to fly it at night.
