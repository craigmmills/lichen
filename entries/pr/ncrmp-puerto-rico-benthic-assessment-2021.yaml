facts:
- claim: In 2021, NCRMP assessed coral reef communities in Puerto Rico with two benthic
    surveys, the Benthic Assessment and the Coral Demographic method.
  url: https://www.fisheries.noaa.gov/inport/item/70628
  fetched: 2026-11-15
  quote: 'The National Coral Reef Monitoring Program (NCRMP) assessed coral reef communities
    in Puerto Rico using two benthic surveys: the Benthic Assessment (BA) and the
    Coral Demographic method.'
- claim: The data cover Puerto Rico including Vieques, Culebra, Mona and Desecheo,
    with NOAA NCCOS and SEFSC as lead agencies and HJR Reefscaping, CSS, the University
    of Puerto Rico and DNER as partners.
  url: https://www.fisheries.noaa.gov/inport/item/70628
  fetched: 2026-11-15
  quote: Lead agencies NOAA NCCOS and SEFSC, and partners HJR Reefscaping, Inc., CSS,
    the University of Puerto Rico and Puerto Rico Department of Natural and Environmental
    Resources.
- claim: The package holds three analysis-ready datasets on benthic cover, invertebrates
    and ESA-listed corals, and coral demography.
  url: https://www.fisheries.noaa.gov/inport/item/70628
  fetched: 2026-11-15
  quote: (1) analysis ready benthic cover dataset, (2) analysis ready invertebrates/ESA
    dataset, and (3) analysis ready coral demographic dataset.
