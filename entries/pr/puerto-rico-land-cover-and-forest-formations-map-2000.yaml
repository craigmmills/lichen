summary: Land cover and forest formations map for Puerto Rico, Vieques and Culebra,
  made from 1991 and 2000 Landsat mosaics by decision tree classification, and the
  original basis for the USGS 2001 NLCD data.
facts:
- claim: The map covers land cover and forest formations for Puerto Rico, Vieques
    and Culebra for about the year 2000, from Landsat image mosaics dated 1991 and
    2000.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Puerto_Rico/IITF_GISciRS44_puertorico_landcov2000_metadata.php
  fetched: 2026-11-15
  quote: This file is the map of land cover and forest formations for about the year
    2000 for Puerto Rico, Vieques and Culebra.
- claim: The forest type and land cover maps in the series are based on decision tree
    classification of Landsat image mosaics.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Puerto_Rico/IITF_GISciRS44_puertorico_landcov2000_metadata.php
  fetched: 2026-11-15
  quote: The other two maps are of forest type and land cover and are based on decision
    tree classification of Landsat image mosaics dated 1991 and 2000.
- claim: The data are the original basis for the USGS 2001 NLCD data.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Puerto_Rico/IITF_GISciRS44_puertorico_landcov2000_metadata.php
  fetched: 2026-11-15
  quote: These data are the original basis for the 2001 NLCD data from the USGS.
