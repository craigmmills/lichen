summary: Institute in Río Piedras, Puerto Rico, which with partners has mapped Caribbean
  forest types and land cover since 2002; a USDA Forest Service clearinghouse says
  FAO used the data in its 2005 and 2010 assessments.
facts:
- claim: The USDA Forest Service clearinghouse says the institute and partners have
    mapped forest types and land cover in the Caribbean since 2002 to support forest
    management, with the raster data and maps downloadable there.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/index.php
  fetched: 2026-11-15
  quote: The International Institute of Tropical Forestry and partners have mapped
    forest types and land cover in the Caribbean since 2002 to support forest management.
- claim: The clearinghouse says FAO used these data in its global forest assessments
    for 2005 and 2010, and that the Puerto Rico data are the basis for national land
    cover data (NLCD 2000).
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/index.php
  fetched: 2026-11-15
  quote: The United Nations Food and Agriculture Organization used these data in their
    global forestry assessments for 2005 and 2010, and the Puerto Rico data are the
    basis for recent National data (NLCD 2000).
- claim: The metadata for the Puerto Rico 2000 land cover map gives the institute's
    address in Río Piedras, Puerto Rico.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Puerto_Rico/IITF_GISciRS44_puertorico_landcov2000_metadata.php
  fetched: 2026-11-15
  quote: 1201 Calle Ceiba, Jardín Botànic Sur, Río Piedras, Puerto Rico, 00926, USA
