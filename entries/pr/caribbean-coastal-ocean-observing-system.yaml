    Navassa.
  url: https://ioos.noaa.gov/regions/caricoos/
  fetched: 2026-11-14
  quote: CARICOOS serves as a Regional Association responsible for operating and maintaining
    a certified Regional Coastal Observing System for Puerto Rico, the U.S. Virgin
    Islands, and the island of Navassa
- claim: In February 2020 it was working with the Department of Natural and Environmental
    Resources and U.S. partners of OBIS and MBON to translate the Puerto Rico Coral
    Reef Monitoring Program database to the Darwin Core standard.
