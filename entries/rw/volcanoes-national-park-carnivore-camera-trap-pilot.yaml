summary: Closed pilot, reported by the Fossey Fund in April 2013 and run and built
  by it, using five loaned camera traps in Volcanoes National Park that photographed
  five carnivore and four herbivore species.
facts:
- claim: In April 2013, the Fossey Fund reported that its biodiversity research and
    monitoring programme had launched a project using camera traps to survey carnivores
    and other animals in Volcanoes National Park.
  url: https://gorillafund.org/camera-traps-capture-carnivores/
  fetched: '2026-11-13'
  quote: biodiversity research and monitoring program has launched an exciting new
    project to use automatically operated cameras placed in the forest to survey carnivores
- claim: The page says the project used five cameras on loan from the Wildlife Conservation
    Society-Rwanda and concluded in April, and calls it a pilot.
  url: https://gorillafund.org/camera-traps-capture-carnivores/
  fetched: '2026-11-13'
  quote: The project concluded in April, as the cameras and other field materials
    had been borrowed for only three months.
- claim: The page names Deogratias Tuyisingize as coordinator of the biodiversity
    programme and designer of the camera trap study.
