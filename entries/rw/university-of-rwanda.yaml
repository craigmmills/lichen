summary: Rwandan university under which the government established CoEB, and which GBIF's record says
  is digitising and publishing its natural history specimen collections data and images.
facts:
- claim: GBIF's publisher record says CoEB was established by the Rwandan government under the University
    of Rwanda.
  url: https://api.gbif.org/v1/organization/43a10625-35b1-4f16-ab24-25f9c29ef6a2
  fetched: 2026-11-08
  quote: CoEB has been established by the Rwandan Governement under the University of Rwanda
- claim: JRS listed the Center for Geographic Information Systems, University of Rwanda, as a partner
    of its 2018–2020 wetlands assessment project.
  url: https://jrsbiodiversity.org/grants/arcos-2018/
  fetched: 2026-11-08
  quote: Center for Geographic Information Systems, University of Rwanda
- claim: Its GBIF publisher record, under the National Herbarium of Rwanda, says the university is digitising
    and publishing all of its natural history specimen collections data and images.
  url: https://api.gbif.org/v1/organization/0ab2dfb5-0ccd-42aa-b99f-8ce50edb676b
  fetched: 2026-11-08
  quote: The University of Rwanda has embarked on an effort to digitize and publish all of its natural
    history specimen collections data and associated digital images.
- claim: The same record says thousands of specimen records for amphibians, birds, mammals, fish, ants,
    plants and fungi were collected through a field school and are ready for publishing through a Symbiota
    portal.
  url: https://api.gbif.org/v1/organization/0ab2dfb5-0ccd-42aa-b99f-8ce50edb676b
  fetched: 2026-11-08
  quote: Thousands of biodiversity specimen data for amphibians, birds, mammals, fish, ants, plants and
    fungi have been recently collected through the field school program and are ready for publishing online
    through a Symbiota data portal.
