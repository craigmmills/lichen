facts:
- claim: Its site says its team has counted over 54,581 straw-coloured fruit bats
    in monthly counts at sites across Rwanda.
  url: https://www.rwandawildlife.org/bat-research-conservation
  fetched: '2026-11-12'
  quote: Over 54,581 straw-coloured fruit bats have been counted by our team during
    monthly bat counts at various sites throughout Rwanda.
- claim: Its site says it has fitted fruit bats with GPS tags to study movement and
    roost preferences.
  url: https://www.rwandawildlife.org/bat-research-conservation
  fetched: '2026-11-12'
  quote: We have fitted some with GPS tags to better understand their movement patterns
    and roost preferences
- claim: Its site says the Max Planck Institute supported it in piloting GPS tags
    on fruit bats.
  url: https://www.rwandawildlife.org/bat-research-conservation
  fetched: '2026-11-12'
  quote: We are working in partnership with Max Planck Institute who have supported
