summary: Mobile app and web platform recording forest boundaries and inventory data across Rwanda, built
  by Arbonaut with Enabel support and released in 2020, with a Luxembourg-funded upgrade planned.
facts:
- claim: A mobile app and web platform that records forest boundaries and inventory data on forests, agroforestry
    plots, deforested areas and forest fires across Rwanda.
  url: https://www.luxdev.lu/fr/node/8045
  fetched: 2026-11-08
  quote: It records forest boundaries using GPS points, as well as key inventory data on forests, agroforestry
    plots, deforested areas and forest fires across the country.
- claim: The first version was developed by Arbonaut Ltd with financial and technical support from Enabel
    and released in 2020.
  url: https://www.luxdev.lu/fr/node/8045
  fetched: 2026-11-08
  quote: The first version of FMES, developed by Arbonaut Ltd with financial and technical support from
    Enabel, was released in 2020.
- claim: Luxembourg Cooperation is financing a technical upgrade through the SFERE project, implemented
    by LuxDev, which includes handing the system over from the developer to the Rwanda Forestry Authority.
  url: https://www.luxdev.lu/fr/node/8045
  fetched: 2026-11-08
  quote: ensuring the full handover of the system from the developer to RFA for sustainability and ownership
    purposes
