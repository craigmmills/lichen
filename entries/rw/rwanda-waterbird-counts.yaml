summary: Citizen science initiative counting waterbirds in Rwandan wetlands; Wetlands International
  reports that the January 2026 count recorded 2,871 waterbirds of 58 species across 12 wetlands.
facts:
- claim: A University of Rwanda information sheet for the 2022 counts describes the Rwanda
    Waterbird Counts as a citizen science initiative in which volunteers record waterbird
    species and numbers in important wetlands, as part of the International Waterbird Census.
  url: https://ur.ac.rw/img/pdf/waterbird_count_background_info_2022_2.pdf
  fetched: '2026-11-12'
  quote: The Rwanda Waterbird Counts is a ‘citizen science’ initiative
- claim: The sheet says the data are published on an open website and on the Rwanda Biodiversity
    Information System.
  url: https://ur.ac.rw/img/pdf/waterbird_count_background_info_2022_2.pdf
  fetched: '2026-11-12'
  quote: The collected data are published on an open website, as well as the Rwanda Biodiversity
    Information
- claim: The 2022 sheet says the planned counts would follow International Waterbird Census
    protocols and forms, including GPS location and population estimates.
  url: https://ur.ac.rw/img/pdf/waterbird_count_background_info_2022_2.pdf
  fetched: '2026-11-12'
  quote: Counting will follow internationally agreed ‘protocols’
- claim: The sheet lists 2022 count sites including Lake Mugesera and Lake Ihema in Akagera,
    Lake Ruhondo, Lake Burera and the Rugezi wetland, and names the African Bird Club among
    supporters.
  url: https://ur.ac.rw/img/pdf/waterbird_count_background_info_2022_2.pdf
  fetched: '2026-11-12'
  quote: Friday 11 Feb – Rugezi wetland
- claim: Wetlands International says the January 2026 Rwanda count recorded 2,871 waterbirds
    of 58 species across 12 wetlands, up from seven wetlands in the first Rwanda count in
    2021.
  url: https://www.wetlands.org/counting-migratory-birds-is-key-to-saving-them/
  fetched: '2026-11-12'
  quote: In January 2026, counts recorded 2,871 individual waterbirds from 58 species across
    12 wetlands
- claim: Wetlands International says Nature Rwanda trained 27 new counters before the January
    2026 count, including in technology-based data collection, and that the network grew from
    30 members in 2021 to 128 trained people in 2026.
  url: https://www.wetlands.org/counting-migratory-birds-is-key-to-saving-them/
  fetched: '2026-11-12'
  quote: Ahead of the January 2026 count, Nature Rwanda conducted a dedicated capacity-building
    training session for 27 new counters
- claim: Wetlands International says its Waterbird Fund helped enable counts in countries
    including Rwanda in 2026.
  url: https://www.wetlands.org/counting-migratory-birds-is-key-to-saving-them/
  fetched: '2026-11-12'
  quote: These contributions helped enable counts not only in Afghanistan but also in countries
    such as Burundi, Ethiopia, Kenya, Indonesia, Rwanda and Turkmenistan.
