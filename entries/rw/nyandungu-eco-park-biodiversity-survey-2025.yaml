summary: Closed 2025 biodiversity survey of Nyandungu Eco-Park, carried out by RCID,
  reported to show bird species rising from 83 to 158 since a 2023 baseline.
facts:
- claim: The New Times says a 2025 survey found bird species in the park had risen
    from 83 to 158 since the 2023 baseline study, with findings validated by park
    management on 8 April 2026.
  url: https://www.newtimes.co.rw/article/34737/news/environment/biodiversity-nearly-doubles-in-nyandungu-eco-park---survey/amp
  fetched: 2026-11-15
  quote: point to steady ecological recovery since the 2023 baseline study, with bird
    species rising from 83 to 158.
- claim: The article says the survey also recorded aquatic macroinvertebrates rising
    from 29 to 41 families.
  url: https://www.newtimes.co.rw/article/34737/news/environment/biodiversity-nearly-doubles-in-nyandungu-eco-park---survey/amp
  fetched: 2026-11-15
  quote: The survey further recorded growth in aquatic macroinvertebrates, from 29
    to 41 families
- claim: The article says QA Venue Solutions Rwanda, which manages the park, commissioned
    the survey and RCID carried it out.
  url: https://www.newtimes.co.rw/article/34737/news/environment/biodiversity-nearly-doubles-in-nyandungu-eco-park---survey/amp
