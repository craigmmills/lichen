summary: Organisation running the Karisoke Research Center that reported in December 2023 two decades
  of biodiversity monitoring using camera traps, acoustic devices and vegetation plots in gorilla habitats.
facts:
- claim: Said in December 2023 that it had monitored and studied biodiversity in gorilla habitats for
    two decades.
  url: https://gorillafund.org/biodiversity/monitoring-animals-and-plants-near-gorilla-forest/
  fetched: 2026-11-08
  quote: the Dian Fossey Gorilla Fund has been actively monitoring and studying this biodiversity for
    two decades
- claim: Reported in December 2023 that it was using camera traps and passive acoustic devices to monitor
    wildlife on the Singita landscape next to Volcanoes National Park.
  url: https://gorillafund.org/biodiversity/monitoring-animals-and-plants-near-gorilla-forest/
  fetched: 2026-11-08
  quote: We also are using camera traps and passive acoustic devices to monitor wildlife
- claim: Reported in December 2023 that it had set up permanent vegetation plots and transects on the
    Singita property, with more than 310 tagged plants under weekly monitoring.
  url: https://gorillafund.org/biodiversity/monitoring-animals-and-plants-near-gorilla-forest/
  fetched: 2026-11-08
  quote: More than 310 plants, both replanted and naturally regenerated, have been tagged and are under
    weekly monitoring.
- claim: AWF says the Fossey Fund has led long-term research and monitoring across Volcanoes National
    Park for more than two decades.
  url: https://www.awf.org/news/rwanda-launches-edna-science-volcanoes-national-park
  fetched: 2026-11-08
  quote: For more than two decades, the Dian Fossey Gorilla Fund has led long-term research and monitoring
    across the park
- claim: Says its trackers, researchers and anti-poaching teams are in the forest in Rwanda every day
    to protect, monitor and study the gorillas and other biodiversity.
  url: https://gorillafund.org/what-we-do/where-we-work/rwanda/
  fetched: 2026-11-08
  quote: Our trackers, researchers and anti-poaching teams are in the forest every day to protect, monitor
    and study the gorillas, as well as other biodiversity in the forest.
- claim: Says its team in Rwanda collects data each year on mountain gorilla behaviour, ranging, social
    dynamics, wellbeing and forest biodiversity.
  url: https://gorillafund.org/what-we-do/scientific-research/
  fetched: 2026-11-08
  quote: our team in Rwanda has spent thousands of hours annually collecting data on mountain gorilla
    behavior, ranging patterns, social dynamics, wellbeing and forest biodiversity
- claim: Says it researches Grauer's gorillas in the Nkuba Conservation Area in the Democratic Republic
    of the Congo.
  url: https://gorillafund.org/what-we-do/scientific-research/
  fetched: 2026-11-08
  quote: Through research in the Nkuba Conservation Area, we are uncovering critical data on their movements,
    genetics, diet and population density.
