summary: Mongabay reported in April 2025 that Paul Webala and Rwanda Development Board
  researchers were mapping Egyptian fruit bat roosts for protection and disease surveillance.
facts:
- claim: Mongabay’s 25 April 2025 report said Paul Webala was working with a team
    from the Rwanda Development Board to map Egyptian fruit bat roost sites for their
    protection and to monitor them for disease surveillance.
  url: https://news.mongabay.com/2025/04/discovery-of-critically-endangered-bat-in-rwanda-leads-to-conservation-talks/
  fetched: '2026-11-12'
  quote: Webala is currently working with a team of conservation researchers from
    the government’s Rwanda Development Board (RDB) to map out roost sites for the
    Egyptian fruit bats to ensure their protection and to monitor them for disease
    surveillance.
- claim: The report says the board has applied a buffer zone of at least 50 metres
    between bat roosts and human activity across 80 listed roost sites.
  url: https://news.mongabay.com/2025/04/discovery-of-critically-endangered-bat-in-rwanda-leads-to-conservation-talks/
  fetched: '2026-11-12'
  quote: One of the sustainable solutions implemented by the RDB across 80 bat-listed
    roost sites in Rwanda
- claim: The report names Richard Muvunyi, head of the board's wildlife veterinary
    unit, as Webala's co-researcher.
  url: https://news.mongabay.com/2025/04/discovery-of-critically-endangered-bat-in-rwanda-leads-to-conservation-talks/
  fetched: '2026-11-12'
  quote: Richard Muvunyi, head of the RDB’s wildlife veterinary unit and Webala’s
