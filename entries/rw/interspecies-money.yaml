summary: Tehanu-built project piloted on 20 mountain gorillas in Volcanoes National Park, giving them
  digital wallets linked to AI facial recognition, and offering rural people payment for wildlife-recording
  tasks.
facts:
- claim: Piloted on 20 mountain gorillas in Volcanoes National Park, which were given digital wallets
    linked to AI-powered facial recognition.
  url: https://www.newtimes.co.rw/article/22167/news/technology/rwanda-deploys-ai-to-boost-gorilla-conservation/amp
  fetched: 2026-11-08
  quote: Through the project, 20 mountain gorillas in Volcanoes National Park were given digital wallets
    linked to AI-powered facial recognition systems.
- claim: Offers people in rural areas the opportunity to earn money for tasks such as photographing wildlife,
    recording animal sounds or reporting sightings.
  url: https://www.newtimes.co.rw/article/22167/news/technology/rwanda-deploys-ai-to-boost-gorilla-conservation/amp
  fetched: 2026-11-08
  quote: People in rural areas can earn money by completing tasks that support the ecosystem, such as
    photographing wildlife, recording animal sounds, or reporting sightings of specific species.
