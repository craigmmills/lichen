summary: Citizen science project run by CoEB at the University of Rwanda since 2019,
  which Mongabay reported had logged over 120,000 bird recordings, made with phones
  and an app it says uses artificial intelligence.
facts:
- claim: Mongabay reported in May 2025 that bird-watching clubs such as the Rugezi
    Ornithology Center contribute to a bird database maintained by CoEB at the University
    of Rwanda.
  url: https://news.mongabay.com/short-article/2025/05/young-rwandans-support-bird-conservation-through-mobile-app-recordings/
  fetched: '2026-11-13'
  quote: Bird-watching clubs such as the Rugezi Ornithology Center contribute to a
    database of birds maintained by the Centre of Excellence in Biodiversity and Natural
    Resource Management (CoEB) at the University of Rwanda.
- claim: Mongabay reported that more than 120,000 recordings had been logged since
    the CoEB project started in 2019.
  url: https://news.mongabay.com/short-article/2025/05/young-rwandans-support-bird-conservation-through-mobile-app-recordings/
  fetched: '2026-11-13'
  quote: Since the CoEB project started in 2019, more than 120,000 recordings have
    been logged.
- claim: Mongabay reported that the students record birds with a dish attached to
    a phone and the free Planet Birdsong app, which it says uses artificial intelligence
    to identify the species.
  url: https://news.mongabay.com/short-article/2025/05/young-rwandans-support-bird-conservation-through-mobile-app-recordings/
  fetched: '2026-11-13'
  quote: a free mobile app called Planet Birdsong , which uses artificial intelligence
    to identify the species
