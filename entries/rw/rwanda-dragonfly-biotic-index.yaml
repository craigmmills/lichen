facts:
- claim: The Rufford Foundation lists the project under Erasme Uyizeye, dated 13 March
    2017.
  url: https://www.rufford.org/projects/erasme-uyizeye/developing-a-dragonfly-biotic-index-and-applying-it-to-prioritizing-restoration-sites-within-the-congo-nile-crest-watershed-in-rwanda/
  fetched: 2026-11-15
  quote: 13 Mar 2017
- claim: The 13 March 2017 project page said the project would develop a biological
    monitoring tool, the Dragonfly Biotic Index.
  url: https://www.rufford.org/projects/erasme-uyizeye/developing-a-dragonfly-biotic-index-and-applying-it-to-prioritizing-restoration-sites-within-the-congo-nile-crest-watershed-in-rwanda/
  fetched: 2026-11-15
  quote: The project will develop a biological monitoring tool, Dragonfly Biotic Index
    (DBI).
- claim: The 13 March 2017 project page said that, once developed, the index would
    be used to monitor habitat recovery and prioritise conservation sites in the Congo
    Nile Crest watershed.
  url: https://www.rufford.org/projects/erasme-uyizeye/developing-a-dragonfly-biotic-index-and-applying-it-to-prioritizing-restoration-sites-within-the-congo-nile-crest-watershed-in-rwanda/
  fetched: 2026-11-15
  quote: the DBI will be used in monitoring habitat recovery and prioritizing sites
    that need special conservation attention
- claim: The 13 March 2017 project page described phase I as a countrywide odonate
    survey and an update of the species catalogue.
  url: https://www.rufford.org/projects/erasme-uyizeye/developing-a-dragonfly-biotic-index-and-applying-it-to-prioritizing-restoration-sites-within-the-congo-nile-crest-watershed-in-rwanda/
  fetched: 2026-11-15
  quote: Phase I consists of an extensive survey of odonates across the country and
    updating odonates’ species catalogue.
- claim: The final evaluation report dated 26 May 2019 said a preliminary scoring
    system for the Rwanda odonata-based biotic index was available.
  url: https://media.rufford.org/media/project_reports/20593-1%20Final%20Evaluation%20Report.pdf
  fetched: 2026-11-15
  quote: A preliminary scoring system for the Rwanda odonata -based biotic index is
    now
