summary: Coalition of Conservation International, Fauna & Flora International and WWF, based in Kigali,
  which in a January 2020 post reported deploying about 29 camera traps in Volcanoes National Park.
facts:
- claim: Deployed about 29 camera traps in Volcanoes National Park in partnership with the Rwanda Development
    Board, as a pilot study of arboreal cameras for biodiversity monitoring, per a January 2020 post.
  url: https://igcp.org/updates/camera-traps-deployed-to-monitor-biodiversity-in-volcanoes-national-park/
  fetched: 2026-11-08
  quote: About 29 camera traps have been deployed by IGCP in partnership with the Rwanda Development Board
    in Volcanoes national park.
- claim: Consists of Conservation International, Fauna & Flora International and the World Wide Fund for
    Nature.
  url: https://igcp.org/updates/camera-traps-deployed-to-monitor-biodiversity-in-volcanoes-national-park/
  fetched: 2026-11-08
  quote: The International Gorilla Conservation Programme (IGCP) currently consists of Conservation International,
    Fauna & Flora International and the World Wide Fund for Nature.
- claim: Describes itself as a coalition of international conservation organisations working with national
    and local partners for the survival of mountain gorillas.
  url: https://igcp.org/
  fetched: 2026-11-08
  quote: The International Gorilla Conservation Programme is a unique coalition of international conservation
    organizations joining forces with national and local partners to ensure the long-term survival of
    the now endangered mountain gorillas.
- claim: Says it led surveys of mountain gorillas, select large mammals and human activities in the Virunga
    Massif (2015 to 2016) and Bwindi-Sarambwe (2018), and vegetation mapping in 2020.
  url: https://igcp.org/what-we-do/conservation-science/
  fetched: 2026-11-08
  quote: leadership in conservation science in recent years, has been in the surveys of mountain gorillas,
    select large mammals, and human activities in the Virunga Massif ('15-'16) and Bwindi-Sarambwe ('18),
    vegetation mapping ('20)
- claim: Says it has supported Bwindi Mgahinga Conservation Area in Uganda since June 2015 to monitor
    species and illegal activities with the Spatial Monitoring and Reporting Tool (SMART), and handed
    over phones and other equipment for SMART data collection.
  url: https://igcp.org/bmca-receives-equipment-to-boost-smart-data-collection/
  fetched: 2026-11-08
  quote: Since June 2015, IGCP has been supporting Bwindi Mgahinga Conservation Area (BMCA) to monitor
    species and illegal activities using Spatial Monitoring and Reporting Tool (SMART).
- claim: Its team page says its head office is in Kigali.
  url: https://igcp.org/team/
  fetched: 2026-11-08
  quote: is based at IGCP Head Office in Kigali
