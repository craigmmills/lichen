summary: Rwandan environmental authority, supervised by the environment ministry, with the legal mandate
  for national environmental protection and conservation, which says it publishes a State of Environment
  report every four years.
facts:
- claim: Works under the supervision of the Ministry in charge of Environment and holds the legal mandate
    for national environmental protection, conservation, promotion and overall management.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: Under supervision of the Ministry in charge of Environment, Presidential Order N° 033/01 Of 06/05/2022
    Governing Rwanda Environment Management Authority (REMA) reserves the legal mandate for national environmental
    protection, conservation, promotion and overall management
- claim: Its responsibilities include ensuring effective management of research and monitoring data.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: Ensuring effective management of research and monitoring data.
- claim: Its quality management scope covers biodiversity conservation, including protecting ecosystems
    and forests.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: 'Biodiversity conservation: Protecting Rwanda’s ecosystems, forests and natural resources while
    ensuring access to genetic resources and benefit-sharing mechanisms.'
- claim: A 2012 list on the Rwanda CBD clearing-house site names a REMA officer as the primary national
    focal point for the Convention on Biological Diversity.
  url: https://rw.chm-cbd.net/en/national-focal-points
  fetched: 2026-11-08
  quote: CBD Primary NFP
- claim: Its site reports that Rwanda launched its National Biodiversity Strategy and Action Plan 2025-2030
    on 7 October 2025, aligned with the Kunming-Montreal Global Biodiversity Framework.
  url: https://www.rema.gov.rw/updates/news-details/rwanda-unveils-national-biodiversity-strategy-and-action-plan-nbsap-2025-2030
  fetched: 2026-11-08
  quote: It aligns with the Kunming–Montreal Global Biodiversity Framework (KM-GBF)
- claim: Says it holds the legal mandate for national environmental protection, conservation, promotion
    and overall management, under the supervision of the ministry in charge of environment.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: Governing Rwanda Environment Management Authority (REMA) reserves the legal mandate for national
    environmental protection, conservation, promotion and overall management
- claim: Lists biodiversity conservation among its areas of work.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: 'Biodiversity conservation: Protecting Rwanda’s ecosystems, forests and natural resources'
- claim: Says it prepares and publishes a State of Environment report for Rwanda every four years.
  url: https://www.rema.gov.rw/about/overview
  fetched: 2026-11-08
  quote: Preparing and publishing a State of Environment report for Rwanda every four (4) years.
- claim: JRS listed REMA as a partner of its 2018–2020 wetlands assessment project, calling it “Rwanda
    Environmental Management Authority”.
  url: https://jrsbiodiversity.org/grants/arcos-2018/
  fetched: 2026-11-08
  quote: 'Partners

    International Union for the Conservation of Nature

    Center of Excellence in Biodiversity and Natural Resource Management, University of Rwanda

    Center for Geographic Information Systems, University of Rwanda

    Rwanda Environmental Management Authority'
