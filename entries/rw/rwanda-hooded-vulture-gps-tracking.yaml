facts:
- claim: The Peregrine Fund reported on 8 February 2026 that in December 2025 its
    staff provided technical expertise as Nature Rwanda deployed nine GPS trackers,
    provided by the Max Planck Institute of Animal Behaviour, on vultures at abattoirs
    in Kigali and Musanze.
