summary: Rwandan government institution hosted at the University of Rwanda, working on research, monitoring
  and conservation education, and digitising specimen collections through the Rwanda Biodiversity Specimen
  Portal.
facts:
- claim: Describes itself as a Rwandan government institution hosted at the University of Rwanda, working
    in research and monitoring, bioprospecting, and conservation education.
  url: https://rbis.ur.ac.rw/pages/about_us/
  fetched: 2026-11-08
  quote: 'The Center is hosted at University of Rwanda and works in three areas: research and monitoring,
    bioprospecting, and conservation education and awareness raising.'
- claim: Says it addresses the need for data for national reporting, including to the CBD, and for global
    biodiversity indicators.
  url: https://rbis.ur.ac.rw/pages/about_us/
  fetched: 2026-11-08
  quote: We address the need for data for national reporting requirements (CBD, NDC, etc.) and to inform
    existing indicators of global biodiversity trends
- claim: Its data site lists eDNA sequences, the Rwanda Biodiversity Specimen Portal and published data
    sets among its products.
  url: https://rbis.ur.ac.rw/pages/about_us/
  fetched: 2026-11-08
  quote: eDNA sequences
- claim: Is digitising and publishing its natural history collection data through the Rwanda Biodiversity
    Specimen Portal.
  url: https://rwandabiodiversity.net/
  fetched: 2026-11-08
  quote: The Centre of Excellence in Biodiversity and Natural Resource Management (CoEB) has embarked
    on an effort to digitize and publish all of its natural history collection data and associated digital
    specimen images.
- claim: GBIF's publisher record says it was established by the Rwandan government under the University
    of Rwanda and acts as a clearing house for biodiversity and natural resource data for Rwanda, in Huye.
  url: https://api.gbif.org/v1/organization/43a10625-35b1-4f16-ab24-25f9c29ef6a2
  fetched: 2026-11-08
  quote: The centre acts as clearing house for data and information on biodiversity and natural resources
    for Rwanda
- claim: GBIF's publisher record gives its city as Huye, Rwanda.
  url: https://api.gbif.org/v1/organization/43a10625-35b1-4f16-ab24-25f9c29ef6a2
  fetched: 2026-11-08
  quote: '"city":"Huye"'
- claim: Its site lists the National Herbarium of Rwanda, the Rwanda Biodiversity Information System and
    the National Zoological Collection under its work.
  url: http://coebiodiversity.ur.ac.rw/
  fetched: 2026-11-08
  quote: OUR WORK NATIONAL HERBARIUM OF RWANDA RWANDA BIODIVERSITY INFORMATION SYSTEM NATIONAL ZOOLOGICAL
    COLLECTION
- claim: The GBIF publisher record for the National Herbarium of Rwanda says the centre leads the team
    of Rwandan scientists digitising the University of Rwanda's specimen collections.
  url: https://api.gbif.org/v1/organization/0ab2dfb5-0ccd-42aa-b99f-8ce50edb676b
  fetched: 2026-11-08
  quote: The Center of Excellence in Biodiversity and Natural Resource Management is leading the team
    of Rwandan scientists to help achieve this important mission.
