summary: National satellite data programme launched by the Government of Rwanda and Planet Labs, run by
  the Rwanda Space Agency, which government bodies are to use to monitor agriculture and forest health,
  per a 10 August 2026 press release.
facts:
- claim: Launched by the Government of Rwanda and Planet Labs PBC as a national satellite data programme,
    according to a Planet press release dated 10 August 2026.
  url: https://spaceinafrica.com/2026/08/10/rwanda-and-planet-launch-landmark-national-satellite-data-programme/
  fetched: 2026-11-08
  quote: The Government of Rwanda and Planet Labs PBC have launched a national satellite data programme
- claim: Government bodies are to use the data to monitor agriculture and to track forest health and resilience,
    among other uses.
  url: https://spaceinafrica.com/2026/08/10/rwanda-and-planet-launch-landmark-national-satellite-data-programme/
  fetched: 2026-11-08
  quote: Governmental entities will use Planet’s data to monitor agriculture and food security, track
    forest health and resilience, refine urban planning and zoning
