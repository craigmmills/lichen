summary: Closed JRS-funded grant, led by Sam Kanyamibwa from December 2018 to November 2020,
  which planned to assess wetland ecological integrity and publish 4,600 new species records
  to GBIF.
facts:
- claim: The 2018–2020 JRS grant planned to assess the ecological integrity of Rwanda’s wetlands
    and collect and share baseline data on their biodiversity and ecosystem services.
  url: https://jrsbiodiversity.org/grants/arcos-2018/
  fetched: 2026-11-08
  quote: This project will develop and apply an integrated approach to assess the ecological
    integrity of Rwanda’s wetlands and use the results to inform planning and decision-making.
- claim: Lists as a planned output 4,600 new georeferenced species records published to GBIF
    through the ARBIMS platform.
  url: https://jrsbiodiversity.org/grants/arcos-2018/
  fetched: 2026-11-08
  quote: 4,600 new geo-referenced records of plant, mammals, amphibians, reptiles, fish, and
    birds published to GBIF via Integrated Publishing Toolkit as part of the ARBIMS Platform.
- claim: Funding dates were 1 December 2018 to 30 November 2020.
  url: https://jrsbiodiversity.org/grants/arcos-2018/
  fetched: 2026-11-08
  quote: 1 December 2018 - 30 November 2020
