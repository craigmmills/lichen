facts:
- claim: A regional NGO founded in 1995 and headquartered in Kigali, Rwanda.
  url: https://arcosnetwork.org/?p=7332
  fetched: 2026-11-08
  quote: Headquartered in Kigali, Rwanda, ARCOS works at the intersection of environmental integrity and
    human well-being.
- claim: Received a JRS Biodiversity Foundation grant of $196,075 for 2011 to 2013 for the Albertine Rift
    Biodiversity Portal, to mobilise biodiversity data and create a regional web portal.
  url: https://jrsbiodiversity.org/grants/albertine-rift-conservation-society/
  fetched: 2026-11-08
  quote: to mobilize biodiversity data, and to create a regional web portal to serve biodiversity data
    according to global data standards
- claim: JRS reported that the portal's database then held 824 observation records, mostly birds, from
    ARCOS baseline surveys, and that the goal of a regional portal had not yet been met.
  url: https://jrsbiodiversity.org/grants/albertine-rift-conservation-society/
  fetched: 2026-11-08
  quote: The portal’s database contains 824 records of observational data mostly birds.
- claim: JRS reported that ARCOS' Integrated Landscape Assessment and Monitoring group had produced a
    report on biodiversity and ecosystem services in the Rweru-Mugesera Ramsar wetland.
  url: https://jrsbiodiversity.org/grants/albertine-rift-conservation-society/
  fetched: 2026-11-08
  quote: A report by the ARCOS’ Integrated Landscape Assessment and Monitoring group that investigates
    the level of biodiversity and ecosystem services in the Rweru-Mugesera Ramsar Wetland
- claim: Says biodiversity data is mobilised and hosted on its ARCOS Biodiversity Information System (ARBIMS).
  url: http://arcosnetwork.org/
  fetched: 2026-11-08
  quote: Biodiversity data mobilised and hosted on ARCOS Biodiversity Information System (ARBIMS)
- claim: Says its field interventions focus on the Albertine Rift region.
  url: http://arcosnetwork.org/
  fetched: 2026-11-08
  quote: Our field interventions are focused in the Albertine Rift region and working with partners for
    actions beyond the region.
