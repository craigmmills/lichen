summary: African Wildlife Foundation project aiming to complete an eDNA baseline survey across 30 sites
  in and around Volcanoes National Park, with a first training held in February 2026.
facts:
- claim: Aims to conduct an eDNA baseline survey across 30 sites, 16 inside Volcanoes National Park and
    14 in expansion and restoration zones; its first training was held in February 2026.
  url: https://www.awf.org/news/rwanda-launches-edna-science-volcanoes-national-park
  fetched: 2026-11-08
  quote: The initiative aims to conduct a focused eDNA baseline survey across 30 strategically selected
    sites—16 inside the park and 14 within expansion and restoration zones.
- claim: Trainees came from institutions including AWF, RDB, the Fossey Fund, Gorilla Doctors, the University
    of Rwanda, REMA and the Rwanda Wildlife Conservation Association.
  url: https://www.awf.org/news/rwanda-launches-edna-science-volcanoes-national-park
  fetched: 2026-11-08
  quote: 20 emerging conservation professionals are taking part, drawn from institutions including AWF,
    RDB, the Dian Fossey Gorilla Fund, Gorilla Doctors, the University of Rwanda, REMA, the Rwanda Wildlife
    Conservation Association, and others.
