summary: Symbiota-based portal holding Rwandan specimen data, images, observations and species inventories,
  in partnership with CoEB and the Rwanda Biodiversity Conservation Institute, with funding from Biocultural
  Diversity International.
facts:
- claim: Uses open-source Symbiota software and holds specimen data, images, field observations, species
    inventories, taxonomic data and species distribution data.
  url: https://rwandabiodiversity.net/
  fetched: 2026-11-08
  quote: The portal includes a variety of types of data, including specimen data, photographic images,
    field observations, species inventories, taxonomic data, and species distribution data.
- claim: Invites others holding specimen datasets from Rwanda to publish on the portal.
  url: https://rwandabiodiversity.net/
  fetched: 2026-11-08
  quote: Do you have or know of a specimen-based biodiversity dataset compiled from Rwanda that you would
    like to publish on the portal?
- claim: Its footer says it is in partnership with the Rwanda Biodiversity Conservation Institute and
    CoEB, with funding, site management and data curation support from Michael B. Thomas of Biocultural
    Diversity International.
  url: https://rwandabiodiversity.net/
  fetched: 2026-11-08
  quote: with funding, site management and data curation support by Michael B. Thomas, Biocultural Diversity
    International
