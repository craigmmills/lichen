facts:
- claim: Space in Africa reported in 2023 that UNOSAT and the Rwanda Space Agency signed a framework cooperation
    agreement covering the use of satellite imagery and geospatial data, including for environmental monitoring.
  url: https://spaceinafrica.com/2023/06/12/strengthening-partnerships-for-sustainable-development-unosat-and-rsa-forge-collaboration-in-geo-information-technologies/
  fetched: 2026-11-08
  quote: UNOSAT and the Rwanda Space Agency will deepen their collaboration and joint efforts in utilising
    satellite imagery and geospatial data for various purposes, including disaster management, environmental
    monitoring, urban planning
- claim: A Planet press release says the Rwanda Space Agency manages a national satellite data programme
    that gives government bodies Planet imagery, including to track forest health.
  url: https://spaceinafrica.com/2026/08/10/rwanda-and-planet-launch-landmark-national-satellite-data-programme/
  fetched: 2026-11-08
  quote: The initiative, managed by the Rwanda Space Agency, will provide Planet’s near-daily satellite
    imagery and data feeds to government agencies, public universities, selected startups, and strategic
    development partners
