summary: Annual Grey Crowned Crane census run by RWCA, whose 2021 account reports
  yearly surveys since 2017, counting 487 cranes in 2017 and 881 in 2020.
facts:
- claim: RWCA says it completed the first national census of Grey Crowned Cranes in
    2017 as a baseline.
  url: https://www.rwandawildlife.org/saving-endangered-grey-crowned-cranes/
  fetched: 2026-11-15
  quote: In 2017, RWCA completed the first ever national census of Grey Crowned Cranes
    to serve as a base line
- claim: On its page dated 26 April 2021, RWCA said it had repeated the census every
    year since 2017 to track population trends.
  url: https://www.rwandawildlife.org/saving-endangered-grey-crowned-cranes/
  fetched: 2026-11-15
  quote: We have been able to repeat this census every year so far and hope to track
    the population trends over time
- claim: The page gives counts of 487 cranes in 2017, 459 in 2018, 748 in 2019 and
    881 in 2020.
  url: https://www.rwandawildlife.org/saving-endangered-grey-crowned-cranes/
  fetched: 2026-11-15
  quote: In 2017 we counted 487 cranes, in 2018 we counted 459 cranes, in 2019 we
    counted 748 and we are delighted to say that in 2020 we counted a whopping 881!
