summary: Biodiversity data portal built by the Albertine Rift Conservation Society on GBIF, which JRS
  reports launched on 25 October 2014 and gives access to Albertine Rift species checklist and occurrence
  data.
facts:
- claim: JRS reports that ARCOS launched the portal on 25 October 2014 for biodiversity information exchange
    and data sharing in the African Great Lakes, Albertine Rift and Africa Mountains regions.
  url: https://jrsbiodiversity.org/arcos-arbmis/
  fetched: 2026-11-08
  quote: The ARCOS Biodiversity Management and Information System (ARBMIS) was launched on October 25th
    as a new platform to facilitate biodiversity information exchange and data sharing
- claim: JRS reports that it gives access to species checklist and occurrence data for the Albertine Rift
    region published through the ARCOS Integrated Publishing Toolkit.
  url: https://jrsbiodiversity.org/arcos-arbmis/
  fetched: 2026-11-08
  quote: ARBMIS is a web-based portal that provides access to data published through the ARCOS Integrated
    Publishing Toolkit, which includes species checklist and occurrence data for the Albertine Rift region
- claim: ARCOS says biodiversity data is mobilised and hosted on it.
  url: http://arcosnetwork.org/
  fetched: 2026-11-08
  quote: Biodiversity data mobilised and hosted on ARCOS Biodiversity Information System (ARBIMS)
