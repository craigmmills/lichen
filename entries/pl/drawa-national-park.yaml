  and non-native species.
facts:
- claim: The climate ministry names Drawa National Park as the beneficiary of a project on
    its aquatic ecosystems, run from January 2017 to the end of 2021.
  url: https://www.gov.pl/web/klimat/ochrona-ekosystemow-wodnych-drawienskiego-parku-narodowego
  fetched: 2026-11-08
  quote: od styczna 2017 do końca roku 2021
- claim: The project included nature monitoring to assess the state of habitats and animal
    species.
  url: https://www.gov.pl/web/klimat/ochrona-ekosystemow-wodnych-drawienskiego-parku-narodowego
  fetched: 2026-11-08
  quote: Monitoring przyrodniczy, którego celem było określenie stanu zachowania siedlisk
    i gatunków zwierząt.
- claim: Monitoring included river and lake fish, through control catches and studies of natural
    spawning of salmonids.
  url: https://www.gov.pl/web/klimat/ochrona-ekosystemow-wodnych-drawienskiego-parku-narodowego
  fetched: 2026-11-08
  quote: monitorowaniu ichtiofauny rzecznej i jeziornej poprzez wykonanie połowów kontrolnych
- claim: Monitoring included the occurrence of non-native species such as American mink, raccoon,
    raccoon dog and muskrat, and their effect on native species.
  url: https://www.gov.pl/web/klimat/ochrona-ekosystemow-wodnych-drawienskiego-parku-narodowego
