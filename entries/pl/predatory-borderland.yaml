summary: Interreg Poland-Slovakia co-financed project involving 19 institutions, aiming to standardise
  cross-border lynx, wolf and bear counts using AI; July 2025 reporting scheduled completion for August
  2026.
facts:
- claim: The project aims to standardise counts of lynx, wolves and bears on both sides of the border,
    with 19 Polish and Slovak institutions.
  url: https://www.radiokrakow.pl/aktualnosci/nowy-sacz/podhale/jeden-rys-plus-drugi-rys-plus-niedzwiedz-w-tatrach-rozpoczyna-sie-projekt-drapiezne-pogranicze
  fetched: '2026-11-02'
  quote: W projekt zaangażowanych jest 19 polskich i słowackich instytucji.
- claim: An AI system analyses camera-trap images and can tell individual lynx apart by coat markings.
  url: https://www.radiokrakow.pl/aktualnosci/nowy-sacz/podhale/drapiezniki-bez-paszportu-ai-pomoze-policzyc-wilki-rysie-i-niedzwiedzie
  fetched: '2026-11-02'
  quote: System oparty na sztucznej inteligencji analizuje zdjęcia z fotopułapek i pozwala m.in. rozróżniać
    poszczególne rysie na podstawie charakterystycznego umaszczenia.
- claim: A July 2025 report said the project was due to run until the end of August 2026.
  url: https://www.radiokrakow.pl/aktualnosci/nowy-sacz/podhale/jeden-rys-plus-drugi-rys-plus-niedzwiedz-w-tatrach-rozpoczyna-sie-projekt-drapiezne-pogranicze
  fetched: '2026-11-02'
  quote: Projekt „Drapieżne pogranicze” potrwa do końca sierpnia 2026 roku.
- claim: The Forest Research Institute's project page says it is co-financed by the Interreg Poland-Slovakia
    programme, with 17 Polish and 2 Slovak partners.
  url: https://ibles.pl/projekty/interreg-polska-slowacja-2021-2027
  fetched: '2026-11-02'
  quote: W projekcie współfinansowanym przez program Interreg Polska-Słowacja udział bierze 17 polskich
    oraz 2 słowackich partnerów.
- claim: The Forest Research Institute says 17 Polish and 2 Slovak partners take part.
  url: https://www.ibles.pl/projekt/drapiezne-pogranicze-transgraniczna-wspolpraca-na-rzecz-zintegrowanej-ochrony-duzych-drapieznikow-w-polsce-i-na-slowacji/
  fetched: '2026-11-02'
  quote: W projekcie współfinansowanym przez program Interreg Polska-Słowacja udział bierze 17 polskich
    oraz 2 słowackich partnerów.
- claim: Plans monitoring of wolf, lynx and bear in the field, including genetic and video monitoring,
    and a central database.
  url: https://www.ibles.pl/projekt/drapiezne-pogranicze-transgraniczna-wspolpraca-na-rzecz-zintegrowanej-ochrony-duzych-drapieznikow-w-polsce-i-na-slowacji/
  fetched: '2026-11-02'
  quote: Kolejnym krokiem będzie przeprowadzenie monitoringu wilka, rysia i niedźwiedzia w terenie (w
    tym genetycznego i wizyjnego)
- claim: The institute says it will use monitoring techniques with AI.
  url: https://www.ibles.pl/projekt/drapiezne-pogranicze-transgraniczna-wspolpraca-na-rzecz-zintegrowanej-ochrony-duzych-drapieznikow-w-polsce-i-na-slowacji/
  fetched: '2026-11-02'
  quote: zastosowanie innowacyjnych technik monitoringu wykorzystujących sztuczną inteligencję
- claim: Project value is 1,394,722 euros and the grant 1,115,777.46 euros.
  url: https://plsk.eu/projekty/drapiezne-pogranicze-transgraniczna-wspolpraca-na-rzecz-zintegrowanej-ochrony-duzych-drapieznikow-w-polsce-i-na-slowacji/
  fetched: '2026-11-02'
  quote: wartość dofinansowania 1.115.777,46 EUR
- claim: The openprocurements.com listing says the contract covers an AI model that detects animals, classifies
    species and identifies individual lynx.
  url: https://pl.openprocurements.com/tender/opracowanie-systemu-informatycznego-wykorzystujacego-sztuczna-inteligencje-ai-do-identyfikacji-osobn/
  fetched: '2026-11-02'
  quote: System będzie obejmował model AI zdolny do detekcji zwierząt, klasyfikacji gatunkowej (detekcji
    rysia) oraz identyfikacji osobniczej rysi
- claim: The same listing names the project and programme.
  url: https://pl.openprocurements.com/tender/opracowanie-systemu-informatycznego-wykorzystujacego-sztuczna-inteligencje-ai-do-identyfikacji-osobn/
  fetched: '2026-11-02'
  quote: „Drapieżne pogranicze - transgraniczna współpraca na rzecz zintegrowanej ochrony dużych drapieżników
    w Polsce i na Słowacji” w ramach Programu Interreg PL-SK
