summary: An AI system built by Jagiellonian University with two national parks that returns the five most
  similar lynx for a new image; Prof. Zieliński says the right animal is among them in 95 per cent of
  cases.
facts:
- claim: The system compares a new image with a database of known animals and returns the five most similar
    lynx.
