summary: Completed project led by the Institute of Meteorology and Water Management with Polish partners,
  creating Sentinel data infrastructure to support access to Copernicus and other satellite data.
facts:
- claim: The project created infrastructure for automatically downloading, storing and sharing Sentinel
    data. Cyfronet lists it as completed.
  url: https://www.cyfronet.pl/en/projects/national-projects/sat4envi
  fetched: '2026-11-02'
  quote: The project created an infrastructure for automatically downloading data directly from satellites
- claim: Its main aim was to make Copernicus data and data from other environmental and meteorological
    satellites available.
  url: https://sat4envi.imgw.pl/wp-content/uploads/2019/02/2018-09-13-imgw-ulotka-zatwierdzona.pdf
  fetched: '2026-11-02'
  quote: Celem głównym projektu Sat4Envi jest udostępnienie satelitarnych danych programu Copernicus
- claim: The main goal is to make Copernicus and other environmental and meteorological satellite data
