facts:
- claim: It grazes a herd of konik horses on meadows it has bought and leases beside
    Lake Rakutowskie, in the Natura 2000 site Błota Rakutowskie, to keep restored
    wetland bird habitat.
  url: https://www.pitax.pl/rozliczenie-pit-online-0000380495/
  fetched: '2026-11-17'
  quote: Tabun koników, który wypasamy na wykupionych i dzierżawionych łąkach położonych
    w bezpośrednim sąsiedztwie jeziora Rakutowskiego
- claim: It cares for and monitors the gull and tern colony on four restored islands
    of about 1.7 ha at the Żwirownia Skoki Natura 2000 site, and gives its address
    as Toruń.
  url: https://www.pitax.pl/rozliczenie-pit-online-0000380495/
  fetched: '2026-11-17'
  quote: W obszarze Natura 2000 Żwirownia Skoki opiekujemy się i monitorujemy populację
    lęgową mew i rybitw gniazdującą na odtworzonych w ramach projektu "Ptasie Wyspy"
    4 wyspach o łącznej powierzchni ok. 1,7 ha.
- claim: WWF Polska lists Błota Rakutowskie as one of nine privately protected areas
    and says Alauda grazes konik horses there.
