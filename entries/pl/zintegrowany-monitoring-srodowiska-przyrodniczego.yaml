summary: Polish integrated natural environment monitoring programme that says standardised
  stationary research runs at 12 base stations in river or lake catchments, with a
  ZMŚP Centre director as coordinator, and partners with Adam Mickiewicz University.
facts:
- claim: Says standardised stationary research is carried out at 12 base stations
    in representative river or lake catchments.
  url: https://centrumzmsp.web.amu.edu.pl/stacje-bazowe-zmsp/
  fetched: 2026-11-08
  quote: Szeroki zakres komplementarnych badań stacjonarnych prowadzony jest wg standaryzowanych
    metod w obrębie 12 Stacji Bazowych w reprezentatywnych zlewniach rzecznych lub
    jeziornych.
- claim: Names the director of the ZMŚP Centre as substantive coordinator, responsible
    among other things for managing the database and preparing reports.
  url: https://centrumzmsp.web.amu.edu.pl/organizacja/
  fetched: 2026-11-08
  quote: Koordynator merytoryczny (nadzór merytoryczny, zarządzanie bazą danych, opracowanie
    wyników i przygotowanie raportów)
- claim: Roztocze National Park says ZMŚP base stations form part of the national
    nature monitoring system within State Environmental Monitoring, and that its station
    was appointed by the Chief Inspector of Environmental Protection in 2010.
  url: https://rpn.gov.pl/monitoring-przyrodniczy
  fetched: 2026-11-08
  quote: Została powołana przez Głównego Inspektora Ochrony Środowiska 8 października
    2010 r. – jako dziewiąta Stacja Bazowa w Polsce, stanowiąca ogniwo krajowego systemu
    monitoringu przyrody realizowanego w ramach Państwowego Monitoringu Środowiska.
