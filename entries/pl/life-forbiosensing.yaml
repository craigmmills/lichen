summary: A closed project, run by the Forest Research Institute and led by Krzysztof Stereńczak,
  to develop a forest monitoring system for Białowieża Forest, with sources giving different
  end dates, June 2021 and April 2022.
facts:
- claim: The 2014–2021 project aimed to develop and apply a forest monitoring system for Białowieża
    Forest using reference plots and remote sensing data.
  url: https://www.ibles.pl/en/project/life-forbiosensing-pl/
  fetched: '2026-11-02'
  quote: ForBioSensing project entails the development and application of forest monitoring
    system Bialowieza Forest with the use of ground-based reference areas and remote sensing
    data.
- claim: The implementation period was 1 October 2014 to 30 June 2021.
  url: https://www.ibles.pl/en/project/life-forbiosensing-pl/
  fetched: '2026-11-02'
  quote: 01.10.2014 - 30.06.2021
- claim: Funding was 1,958,988 euros from the European Commission, 1,763,089 from the National
    Fund and 341,349 from the institute.
  url: https://www.ibles.pl/en/project/life-forbiosensing-pl/
  fetched: '2026-11-02'
  quote: EC:1 958 988 €; NFEP&WM:1 763 089 €; FRI:341 349€
- claim: The project ran from October 2014 to April 2022 and aimed to develop and apply a
    forest monitoring system for the Białowieża Forest.
  url: https://www.ibles.pl/projekt/life-forbiosensing-pl/
  fetched: '2026-11-02'
  quote: Projekt ForBioSensing zakłada opracowanie i zastosowanie systemu monitoringu lasów
    Puszczy Białowieskiej z wykorzystaniem naziemnych powierzchni referencyjnych i danych
    teledetekcyjnych.
- claim: The grant number is LIFE13 ENV/PL/000048, with NFOŚiGW co-funding.
