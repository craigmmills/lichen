summary: A national park that says its monitoring tracks ecosystem change and conservation
  effects, done by outside institutions and its own staff, and lists monitored species including
  black grouse, cranes, wolf, lynx and otter.
facts:
- claim: Says the main task of monitoring in the park is to track changes in ecosystems and
    the effects of conservation work, carried out by outside institutions and by staff of
    its Department of Nature and Sozological Monitoring.
  url: https://archiwum2.biebrza.org.pl/120%2Cmonitoring-w-biebrzanskim-parku-narodowym
  fetched: 2026-11-08
  quote: Najważniejszym zadaniem realizowanego w Parku monitoringu jest śledzenie zmian w
    ekosystemach oraz efektów wykonywanych działań ochronnych. Prowadzony jest on przez instytucje
    zewnętrzne oraz pracowników Działu Monitoringu Przyrodniczego i Sozologicznego przy udziale
    innych Służb Parku.
- claim: Lists monitoring by park services of species including black grouse, migrating birds,
    terns, herons, cranes, black stork, white-tailed eagle, wolf, lynx, beaver and otter.
  url: https://archiwum2.biebrza.org.pl/120%2Cmonitoring-w-biebrzanskim-parku-narodowym
