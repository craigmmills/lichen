  calls the most important pillar of its biodiversity monitoring.
facts:
- claim: GIOŚ coordinates State Environmental Monitoring, which Poland's national report calls
    the most important pillar of its biodiversity monitoring.
  url: https://www.gov.pl/attachment/2c829114-2edf-4bda-8618-e7f43756c747
  fetched: '2026-11-02'
  quote: Najważniejszym filarem pozostaje Państwowy Monitoring Środowiska (PMŚ), koordynowany
    przez G łówny Inspektorat Ochrony Środowiska (GIOŚ)
- claim: It commissioned the national survey of wolf and lynx distribution for 2023/2024.
  url: https://siedliska.gios.gov.pl/images/pliki_pdf/wyniki/2023-2025/dla_zwierzat/Badanie_rozmieszczenia_wilka_i_rysia_etap_VII.pdf
  fetched: '2026-11-02'
  quote: Praca wykonana na zlecenie Głównego Inspektoratu Ochrony Środowiska
- claim: It is to receive almost PLN 22 million for a first national system of wild pollinator
    monitoring.
  url: https://wartowiedziec.pl/zarzadzanie-przestrzenia/81222-blisko-22-mln-zl-na-pierwszy-w-polsce-system-monitoringu-dzikich-owadow-zapylajacych
  fetched: '2026-11-02'
  quote: Główny Inspektorat Ochrony Środowiska otrzyma na realizację projektu niemal 22 mln
    zł
- claim: The 2025-2029 inventory has begun in forests of all ownership types across the country
    and runs in a five-year cycle.
  url: https://samorzad.gov.pl/web/powiat-olesnicki/wykonanie-wielkoobszarowej-inwentaryzacji-stanu-lasu-w-kraju-w-latach-2025-2029
  fetched: '2026-11-02'
  quote: rozpoczęto realizację zadania pod nazwą „Wykonanie Wielkoobszarowej Inwentaryzacji
    Stanu Lasu w kraju w latach 2025-2029”, prowadzonego w cyklu 5-letnim.
- claim: The work is done by the state enterprise BULiGL.
  url: https://samorzad.gov.pl/web/powiat-olesnicki/wykonanie-wielkoobszarowej-inwentaryzacji-stanu-lasu-w-kraju-w-latach-2025-2029
  fetched: '2026-11-02'
  quote: Prace związane z realizacją tego przedsięwzięcia są wykonywane przez przedsiębiorstwo
    państwowe Biuro Urządzania Lasu i Geodezji Leśnej.
- claim: The Geoportal published a land cover layer for all of Poland for 2024, made from
    Sentinel-2 images.
  url: https://www.geoportal.gov.pl/aktualnosci/nowa-warstwa-klasyfikacja-pokrycia-terenu-2024/
  fetched: '2026-11-02'
  quote: Mapa przedstawia klasyfikację pokrycia terenu wykonaną na podstawie zdjęć satelitarnych
    Sentinel-2 zarejestrowanych w 2024 roku.
- claim: Its Environmental Protection map composition holds data on protected areas and environmental
    hazard areas.
  url: https://www.geoportal.gov.pl/aktualnosci/dzien-dzikiej-flory-fauny-i-naturalnych-siedlisk/
  fetched: '2026-11-02'
  quote: gromadzenie i udostępnianie danych przestrzennych oraz atrybutowych dotyczących zarówno
    obszarów chronionych
- claim: Biodiversity data is gathered by GDOŚ in the bank.
  url: https://www.gov.pl/attachment/2c829114-2edf-4bda-8618-e7f43756c747
  fetched: '2026-11-02'
  quote: Dane dotyczące różnorodności biologicznej gromadzone są przez Generalną Dyrekcję
    Ochrony Środowiska w Banku Danych o Zasobach Przyrodniczych
- claim: Its programmes include monitoring of birds, of species and habitats, and of forests.
  url: https://www.gov.pl/attachment/2c829114-2edf-4bda-8618-e7f43756c747
  fetched: '2026-11-02'
  quote: monitoring ptaków Polski, monitoring gatunków i siedlisk przyrodniczych, monitoring
    lasów
- claim: Its tasks are funded or co-funded from national funds, namely the National Fund for
    Environmental Protection and Water Management, and from EU funds.
  url: https://www.gov.pl/attachment/2c829114-2edf-4bda-8618-e7f43756c747
  fetched: '2026-11-02'
  quote: są finansowane bądź dofinansowywane ze środków krajowych tj. Narodowego Funduszu
    Ochrony Środowiska i Gospodarki Wodnej oraz środków UE
- claim: PECBMS says the survey has been part of State Environmental Monitoring since 2007.
  url: https://pecbms.info/country/poland/
  fetched: '2026-11-02'
  quote: Since 2007, it has been included in the State Environmental Monitoring – programme
    realised by Chief Inspectorate for Environmental Protection and funded by the National
    Fund for Environmental Protection and Water Management.
- claim: PECBMS gives its Department of Environmental Monitoring address in Warsaw.
  url: https://pecbms.info/country/poland/
  fetched: '2026-11-02'
  quote: Chief Inspectorate for Environmental Protection, Department of Environmental Monitoring,
    Al. Jerozolimskie 92, 00-807 Warszawa
- claim: PECBMS says the bird survey has been in the programme since 2007.
  url: https://pecbms.info/country/poland/
  fetched: '2026-11-02'
  quote: Since 2007, it has been included in the State Environmental Monitoring
- claim: The Chief Inspectorate says pollinator monitoring will be a new component.
  url: https://www.gov.pl/web/gios/pilotazowe-wdrozenie-monitoringu-dzikich-owadow-zapylajacych--misja-zapylacze
  fetched: '2026-11-02'
  quote: który będzie stanowił nowy komponent tego systemu
- claim: The General Director keeps the central register, available at crfop.gdos.gov.pl.
  url: https://www.gov.pl/web/gdos/dostep-do-danych-geoprzestrzennych
  fetched: '2026-11-02'
  quote: Generalny Dyrektor Ochrony Środowiska prowadzi centralny rejestr form ochrony przyrody,
    dostępny pod adresem crfop.gdos.gov.pl.
- claim: The Forest Research Institute lists it as coordinator and beneficiary, seated in
    Warsaw.
  url: https://www.ibles.pl/projekt/system-zarzadzania-i-monitoringu-obszarow-natura-2000-w-lasach-panstwowych-oraz-na-terenach-wojskowych/
  fetched: '2026-11-02'
  quote: K (beneficjent) 1 Centrum Koordynacji Projektów Środowiskowych CKPŚ Warszawa, Polska
- claim: The institute names it as a part of the State Forests.
  url: https://www.ibles.pl/projekt/system-zarzadzania-i-monitoringu-obszarow-natura-2000-w-lasach-panstwowych-oraz-na-terenach-wojskowych/
  fetched: '2026-11-02'
  quote: Państwowe Gospodarstwo Leśne Lasy Państwowe - Centrum Koordynacji Projektów Środowiskowych
- claim: At each monitoring site, the conservation status of the species or habitat is assessed
    using a method developed by the inspectorate.
  url: https://www.gov.pl/web/gios/monitoring-gatunkow-i-siedlisk-przyrodniczych-oraz-jego-wyniki
  fetched: '2026-11-02'
  quote: określana jest ocena stanu ochrony gatunku bądź siedliska przyrodniczego zgodnie
    z opracowaną przez GIOŚ metodyką monitoringu.
- claim: The inspectorate's page gives an address on Chmielna street.
  url: https://www.gov.pl/web/gios/monitoring-gatunkow-i-siedlisk-przyrodniczych-oraz-jego-wyniki
  fetched: '2026-11-02'
  quote: ul. Chmielna 132/134
- claim: OTOP says it coordinates the Monitoring of Birds of Poland programme on commission
    from the Chief Inspector.
  url: https://otop.org.pl/naszeprojekty/liczymy/ornitho-i-naturalist/
  fetched: '2026-11-02'
  quote: OTOP od lat z powodzeniem koordynuje program Monitoring Ptaków Polski wykonywany
    na zlecenie Głównego Inspektora Ochrony Środowiska.
- claim: The bank collects, updates, analyses and shares forest information.
  url: https://bdl.lasy.gov.pl/portal/misja-bdl?v=4
  fetched: '2026-11-02'
  quote: Bank Danych o Lasach to hurtownia danych, które zbiera i gromadzi informacje, aktualizuje,
    zestawia i analizuje je, po czym udostępnia na wiele sposobów.
- claim: The portal gives forest management results and large-area inventory results, among
    other data.
  url: https://bdl.lasy.gov.pl/portal/misja-bdl?v=4
  fetched: '2026-11-02'
  quote: Portal udostępnia dane z wynikami prac urządzeniowych, wyniki wielkoobszarowej inwentaryzacji
    stanu lasu
- claim: The portal launched officially in 2013.
  url: https://bdl.lasy.gov.pl/portal/misja-bdl?v=4
  fetched: '2026-11-02'
  quote: Oficjalnie portal został uruchomiony w 2013 roku
- claim: The Surveyor General creates and maintains the geoportal as the central access point
    to services.
  url: https://www.gov.pl/web/gugik/podstawowe-informacje
  fetched: '2026-11-02'
  quote: tworzy i utrzymuje geoportal infrastruktury informacji przestrzennej, jako centralny
    punkt dostępu do usług
- claim: A land-cover layer for all of Poland is available on it.
  url: https://www.gov.pl/web/gugik/nowa-warstwa--klasyfikacja-pokrycia-terenu-2024
  fetched: '2026-11-02'
  quote: udostępniliśmy nową warstwę „ Klasyfikacja pokrycia terenu 2024 ”, która umożliwia
    przeglądanie mapy pokrycia terenu dla całej Polski.
- claim: It is named as lead beneficiary of Sat4Envi.
  url: https://sat4envi.imgw.pl/?page_id=39
  fetched: '2026-11-02'
  quote: Instytut Meteorologii i Gospodarki Wodnej – Państwowy Instytut Badawczy (Beneficjent
    – Lider)
- claim: Large-area inventory results are published on the Forest Data Bank portal.
  url: https://bdl.lasy.gov.pl/portal/misja-bdl?v=4
  fetched: '2026-11-02'
  quote: wyniki wielkoobszarowej inwentaryzacji stanu lasu
- claim: MoniFun-PL aims to convert and harmonise inventory data from the 2016 to 2025 cycle.
  url: https://www.ibles.pl/projekt/walidacja-integracji-uczenia-federacyjnego-i-teledetekcji-w-mapowaniu-wielofunkcyjnosci-lasow-w-polsce-monifun-pl/
  fetched: '2026-11-02'
  quote: Konwersja i ujednolicenie danych polskiej Wielkoobszarowej Inwentaryzacji Stanu Lasu
    (z cyklu 2016-2025)
- claim: The programme aims to halt biodiversity loss and manage species and habitats effectively.
  url: https://www.gov.pl/web/nfosigw/ochrona-i-przywracanie-roznorodnosci-biologicznej-i-krajobrazowej
  fetched: '2026-11-02'
  quote: powstrzymanie procesu utraty różnorodności biologicznej i krajobrazowej, odtworzenie
    i wzbogacenie zasobów przyrody oraz skuteczne zarządzanie gatunkami i siedliskami
- claim: The fund's page gives an address on Pańska street.
  url: https://www.gov.pl/web/nfosigw/ochrona-i-przywracanie-roznorodnosci-biologicznej-i-krajobrazowej
  fetched: '2026-11-02'
  quote: ul. Pańska 97
- claim: NSIS is a national system for receiving, storing, processing and sharing satellite
    data.
  url: https://polsa.gov.pl/aktywnosci/obserwacja-ziemi/nsis/
  fetched: '2026-11-02'
  quote: NSIS to krajowy interoperacyjny systemem odbioru, przechowywania, przetwarzania i
    udostępniania danych satelitarnych wraz z niezbędną infrastrukturą.
- claim: New forestry products on NSIS cover wooded land and the structure and biodiversity
    of stands.
  url: https://polsa.gov.pl/wydarzenia/nowe-produkty-satelitarne-polsa-w-obszarze-lesnictwa/
  fetched: '2026-11-02'
  quote: 'dwa nowe produkty z kategorii leśnictwa: monitoring terenów zadrzewionych oraz struktura
    i bioróżnorodność drzewostanów.'
- claim: The monitoring covers 74 plant species, about 100 animal species other than birds,
    and 78 habitat types.
  url: https://www.gov.pl/web/gios/monitoring-gatunkow-i-siedlisk-przyrodniczych-oraz-jego-wyniki
  fetched: '2026-11-02'
  quote: prowadzone są obserwacje 74 gatunków roślin, około 100 gatunków zwierząt (innych
    niż ptaki) oraz 78 typów siedlisk przyrodniczych.
- claim: The project identified forests on former farmland using satellite data.
  url: https://www.igik.edu.pl/en/identification-of-forests-on-post-agricultural-land/
  fetched: '2026-11-02'
  quote: The subject of project is to perform the research on the identification of forests
    on former farmland based on available satellite datasets in Poland.
- claim: The Forest Data Bank is funded from the State Forests' forest fund.
  url: https://bdl.lasy.gov.pl/portal/misja-bdl?v=4
  fetched: '2026-11-02'
  quote: Bank Danych o Lasach finansowany jest ze środków funduszu leśnego Państwowego Gospodarstwa
    Leśnego Lasy Państwowe.
- claim: The State Forests describe the Forest Data Bank as supplying information on forests
    of all ownership forms.
  url: https://www.lasy.gov.pl/pl/nasza-praca/pgl-lasy-panstwowe/lasywliczbach/dane-ogolne-o-lasach
  fetched: '2026-11-02'
  quote: Bank Danych o Lasach , którego głównym celem jest dostarczanie informacji o gospodarce
    leśnej, stanie lasu oraz zmian stanu w lasach wszystkich form własności.
