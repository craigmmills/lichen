summary: Executive agency set up in 2014 that built and runs the National Satellite Information
  System platform and released free national satellite products for monitoring forest and
  wooded areas.
facts:
- claim: POLSA was established by the Act of 26 September 2014.
  url: https://polsa.gov.pl/about-polsa/
  fetched: '2026-11-02'
  quote: Polish Space Agency (POLSA) was established by the Act of 26 September 2014.
- claim: Its stated activity includes promoting satellite technology for uses that include
    environmental monitoring.
  url: https://polsa.gov.pl/about-polsa/
  fetched: '2026-11-02'
  quote: including communication, navigation, environmental monitoring and weather forecasting
- claim: The agency has land cover maps of Poland prepared, for 2019 to 2022 as of that page.
  url: https://polsa.gov.pl/?p=18604
  fetched: '2026-11-02'
  quote: Maps of Poland’s land coverage for the years 2019, 2020, 2021, and 2022 were prepared
    for the Agency.
- claim: According to Eurisy, POLSA plans the CAMILA programme of at least three small optical
    Earth observation satellites and one SAR satellite.
  url: https://www.eurisy.eu/eurisy-members-corner-empowering-public-administration-in-poland-with-satellite-data-solutions/
  fetched: '2026-11-02'
  quote: The project CAMILA (Country awareness mission in land analysis) designed for civil
    use will consist of at least three EO small optical and one SAR satellites.
- claim: An executive agency set up in 2014.
  url: https://polsa.gov.pl/o-polsa/
  fetched: '2026-11-02'
  quote: Polska Agencja Kosmiczna (POLSA) jest agencją wykonawczą MRiT, powołaną w 2014 r.
- claim: Works with international agencies and government on research and use of space.
  url: https://polsa.gov.pl/o-polsa/
  fetched: '2026-11-02'
  quote: POLSA współpracuje z międzynarodowymi agencjami oraz administracją państwową w zakresie
    badania i użytkowania przestrzeni kosmicznej.
- claim: The agency launched the National Satellite Information System platform.
  url: https://polsa.gov.pl/aktywnosci/obserwacja-ziemi/nsis/
  fetched: '2026-11-02'
  quote: Polska Agencja Kosmiczna uruchomiła platformę Narodowego Systemu Informacji Satelitarnej
    (NSIS)
- claim: The agency released national satellite products for monitoring forest and wooded
    areas.
  url: https://polsa.gov.pl/wydarzenia/nowe-produkty-satelitarne-polsa-w-obszarze-lesnictwa/
  fetched: '2026-11-02'
  quote: Polska Agencja Kosmiczna udostępniła nowe, ogólnokrajowe produkty satelitarne umożliwiające
    aktualny i obiektywny monitoring obszarów leśnych i zadrzewionych.
- claim: The agency's forestry products are free to use.
  url: https://polsa.gov.pl/wydarzenia/nowe-produkty-satelitarne-polsa-w-obszarze-lesnictwa/
  fetched: '2026-11-02'
  quote: Produkty są powszechnie i nieodpłatnie dostępne na platformie NSIS.
