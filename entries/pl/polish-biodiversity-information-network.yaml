facts:
- claim: GBIF lists the node under this title, with Poland as a voting participant.
  url: https://api.gbif.org/v1/node/2618bfdf-e194-4911-a241-80db3107bc51
  fetched: '2026-11-02'
  quote: '"participationStatus":"VOTING"'
- claim: The node is hosted by the Faculty of Biology of the University of Warsaw.
  url: https://api.gbif.org/v1/organization/17fba53b-3c1b-4689-82e1-4d66ad4f445c
  fetched: '2026-11-02'
  quote: The Polish Participant Node in the Global Biodiversity Information Facility is hosted
    by the Faculty of Biology of the University of Warsaw, Poland.
- claim: Its stated goal is open access to data about the biodiversity of Poland and the world,
    using GBIF.
  url: https://api.gbif.org/v1/organization/17fba53b-3c1b-4689-82e1-4d66ad4f445c
  fetched: '2026-11-02'
  quote: Our goal is to open access to relevant data about biodiversity of Poland and worldwide,
    using GBIF as the universal mechanism for sharing information.
- claim: Its address is at the Biological and Chemical Research Centre in Warsaw.
  url: https://api.gbif.org/v1/node/2618bfdf-e194-4911-a241-80db3107bc51
  fetched: '2026-11-02'
  quote: Biological and Chemical Research Centre
- claim: Its own site says a new version is coming soon.
  url: http://www.ksib.pl
  fetched: '2026-11-02'
  quote: Tutaj wkrótce pojawi się nowa witryna ksib.pl
- claim: Oppla says it was founded in 2003 to start cooperation between Polish research institutions
    and GBIF.
  url: https://oppla.eu/resource/polish-biodiversity-information-network
  fetched: '2026-11-02'
  quote: The Polish Biodiversity Information Network (PolBIN) was founded in 2003.
- claim: In its listing published on 12 September 2016, Oppla reported 22 member institutions.
  url: https://oppla.eu/resource/polish-biodiversity-information-network
  fetched: '2026-11-02'
  quote: PolBIN has 22 member institutions, represented by 27 scientific units, and 10 institutions
    and one NGO have a status of cooperating partners.
- claim: Its own site says a new site will appear soon.
  url: https://www.ksib.pl/
  fetched: '2026-11-02'
  quote: Tutaj wkrótce pojawi się nowa witryna ksib.pl
- claim: The node was established in 2003 and is hosted at the university.
  url: https://www.biol.uw.edu.pl/en/gbif-speaks-polish/
  fetched: '2026-11-02'
  quote: Established in 2003 and hosted at UW, GBIF Poland node has played an active role
    in promoting data mobilization and use
- claim: A March 2025 article says species occurrences from Polish institutions through GBIF
    rose from under two million records in 2022 to nearly 16 million.
  url: https://www.biol.uw.edu.pl/en/gbif-speaks-polish/
  fetched: '2026-11-02'
  quote: rising from less than two million records in 2022 to nearly 16 million today
- claim: The network includes most of the country's scientific institutions dealing with biodiversity.
  url: https://www.biol.uw.edu.pl/en/gbif-speaks-polish/
  fetched: '2026-11-02'
  quote: includes most of the country’s scientific institutions dealing with biodiversity
- claim: Its member institutions generated five large digitisation projects under the Digital
    Poland programme.
  url: https://www.biol.uw.edu.pl/en/gbif-speaks-polish/
  fetched: '2026-11-02'
  quote: KSIB member institutions have generated five large digitization projects under the
    government’s Digital Poland Operational Programme.
- claim: Completed Polish translations of GBIF.org, reported in March 2025.
  url: https://www.biol.uw.edu.pl/en/gbif-speaks-polish/
  quote: GBIF Poland has completed translations making Polish the eleventh language supported
    on GBIF.org
  fetched: '2026-11-02'
- claim: Its own site shows only a notice that a new site will appear soon.
