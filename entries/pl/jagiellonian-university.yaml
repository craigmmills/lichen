    z fotopułapek.
- claim: Research is carried out by its Institute of Environmental Sciences.
  url: https://naukawpolsce.pl/aktualnosci/news%2C113477%2Cnaukowcy-z-uj-wykorzystuja-ai-do-identyfikacji-rysi-i-ochrony-ich-populacji
