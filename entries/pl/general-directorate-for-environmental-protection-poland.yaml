    Środowiska oraz regionalni dyrektorzy ochrony środowiska.
- claim: The General Director supervises the working of Natura 2000 sites and keeps the data
    needed to protect them.
  url: https://www.gov.pl/web/gdos/zarzadzanie-siecia
  fetched: '2026-11-02'
  quote: Generalny Dyrektor Ochrony Środowiska nadzoruje funkcjonowanie obszarów Natura 2000,
