facts:
- claim: The district lists nature reserves, a landscape park, protected landscape
    areas, Natura 2000 areas and natural monuments on land under its management. As
    of 1 January 2017 it managed 14 islands covering 160 ha on Lake Kisajno within
    the Wyspy na Jeziorze Mamry i Kisajno reserve.
