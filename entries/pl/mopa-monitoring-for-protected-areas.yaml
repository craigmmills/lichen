summary: A project, running 1 April 2024 to 31 March 2027 with 773,158.80 euros of
  Interreg funding, that aims to improve and standardise monitoring methods in protected
  areas of the Pomerania Euroregion.
facts:
- claim: Says the project aims to keep or increase biodiversity in protected areas
    of the Pomerania Euroregion by improving, standardising and extending the monitoring
    methods they use.
  url: https://mopa.zut.edu.pl/
  fetched: 2026-11-08
  quote: Aby to osiągnąć, obecnie stosowane metody wykorzystywane w monitoringu obszarów
    chronionych zostaną ulepszone, ujednolicone i uzupełnione o metody badań społeczno-ekonomicznych.
- claim: Says it received 773,158.80 euros from the European Regional Development
    Fund under Interreg VI A Mecklenburg-Western Pomerania / Brandenburg / Poland.
  url: https://mopa.zut.edu.pl/
  fetched: 2026-11-08
  quote: 'w ramach Programu Współpracy Interreg VI A Meklemburgia-Pomorze Przednie
    / Brandenburgia / Polska w wysokości: 773 158,80 euro.'
