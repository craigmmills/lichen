summary: Online platform mapping bird movements on the Eurasian-African flyway, combining
  ringing data on 300 species with tracking data for over 100, built by EURING and
  the Max Planck Institute of Animal Behavior.
facts:
- claim: Online platform mapping bird movements on the Eurasian-African flyway.
  url: https://www.cms.int/news/un-initiative-establish-global-atlas-animal-migration-sets-milestone-launch-new-bird-migration
  fetched: 2026-11-21
  quote: The interactive Atlas is an online platform where data on the movements in
    time and space of millions of birds are mapped and analyzed in the Eurasian-African
    flyway.
- claim: Collates ringing data on 300 species and overlays tracking data for over
    100 of them.
  url: https://www.cms.int/news/un-initiative-establish-global-atlas-animal-migration-sets-milestone-launch-new-bird-migration
  fetched: 2026-11-21
  quote: for over 100 of these species, the online mapping tool overlays movement
    patterns identified through bird ringing with tracks obtained through satellite
    transmitters, GPS-GSM tags or geo-locators
- claim: Based on data in the EURING Databank and Movebank.
  url: https://www.cms.int/news/un-initiative-establish-global-atlas-animal-migration-sets-milestone-launch-new-bird-migration
  fetched: 2026-11-21
  quote: The Atlas is based on data maintained in the EURING Databank hosted by the
    British Trust for Ornithology (BTO), and Movebank hosted by the Max Planck Institute.
- claim: The migrationatlas.org site said it was unavailable for routine maintenance.
  url: https://migrationatlas.org/
  fetched: 2026-11-21
  quote: Currently unavailable due to routine maintenance.
