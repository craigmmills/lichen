facts:
- claim: Describes itself as a direct action conservation organisation protecting
    African rhinos, using technologies to prevent rhino killing.
  url: https://rhino-force.org/
  fetched: 2026-11-22
  quote: our teams use innovative tactics and technologies to prevent the killing
    of rhinos and to expose and confront illegal activities across the bush of Southern
    Africa.
- claim: Registered as Rhino Force gGmbH in Nuremberg, Germany, and Rhino Force SA
    NPC in South Africa.
  url: https://rhino-force.org/
  fetched: 2026-11-22
  quote: 'Rhino Force gGmbH Sulzbacher Str. 9 90489 Nürnberg Germany Registration
    Number: HRB 33992'
- claim: Its squads use infrared and night-vision cameras that feed footage to a base
    in real time.
  url: https://rhino-force.org/anti-poaching/
  fetched: 2026-11-22
  quote: The surveillance systems from each vehicle continually feed back footage
    to the base in real time
- claim: Operates five squads in the Greater Kruger region.
  url: https://rhino-force.org/anti-poaching/
  fetched: 2026-11-22
  quote: We have five elite squads operating in the Greater Kruger region along with
    a base camp and a sniffer dog unit protecting the Western border of Greater Kruger
    Park.
- claim: Runs a CryoVault that stores rhino genes to preserve genetic diversity.
  url: https://rhino-force.org/
  fetched: 2026-11-22
  quote: Through our CryoVault team, we capture and store rhino genes to preserve
    genetic diversity
