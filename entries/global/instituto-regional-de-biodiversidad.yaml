facts:
- claim: A CEPF final project report says the institute works for the region and describes
    its main headquarters as being in Honduras.
  url: https://cepf.net/resources/final-project-report/final-project-report-1848
  fetched: '2026-10-30'
  quote: focus from the main headquarters in Honduras.
- claim: The same report calls its creation a key decision for Central America.
  url: https://cepf.net/resources/final-project-report/final-project-report-1848
  fetched: '2026-10-30'
  quote: The creation of IRBIO in Central America is a key decision
- claim: A 2011 IRBIO presentation hosted by the CBD says the CCAD set it up in 2006 and that
    Zamorano University has run it under an agreement with the CCAD since 2007.
  url: https://www.cbd.int/doc/nbsap/nbsapcbw-cam-02/nbsap-san-jose-irbio.pdf
  quote: El IRBIO está administrado por la Universidad Zamorano bajo convenio con la CCAD
    desde 2007.
