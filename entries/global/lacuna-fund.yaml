summary: Fund that gives data scientists, researchers and social entrepreneurs in low- and middle-income
  contexts the resources to produce labelled datasets for machine learning, including remote
  sensing and land-use data. It says it moved its leadership and management to partners in Africa
  and Latin America in July 2025.
facts:
- claim: Says it is the first collaborative effort to provide people in low- and middle-income
    contexts with resources to produce labelled datasets.
  url: https://lacunafund.org/about/
  quote: Lacuna Fund is the world's first collaborative effort to provide data scientists, researchers,
    and social entrepreneurs in low- and middle-income contexts globally with the resources
    they need to produce labeled datasets
  fetched: '2026-10-30'
- claim: Began as a funder collaborative between The Rockefeller Foundation, Google.org and
    Canada's International Development Research Centre.
  url: https://lacunafund.org/?p=22
