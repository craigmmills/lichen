summary: Wildlife trade research organisation founded by IUCN and WWF, with about 150 experts
  worldwide. It co-convenes the Coalition to End Wildlife Trafficking Online.
facts:
- claim: Has around 150 experts and was founded by IUCN and WWF.
  url: https://www.traffic.org/about-us/our-organisation/
  quote: We have an international network of around 150 experts on the ground in Africa, Asia,
    Pacific, Europe, and the Americas – and leverage the conservation expertise of our founders
    IUCN and WWF
  fetched: 2026-10-30
- claim: Headquartered in the David Attenborough Building, Cambridge.
  url: https://www.traffic.org/about-us/contact/
  quote: Our headquarters are located at TRAFFIC, David Attenborough Building, Pembroke Street,
    Cambridge, CB2 3QZ
  fetched: 2026-10-30
- claim: Says it received a £4.17 million grant from Arcadia for work on illegal and legal
    wildlife trade.
  url: https://traffic.org/news/funding-boost-for-nature-through-sustainable-and-legal-wildlife-trade
  quote: TRAFFIC is delighted to announce a new £4.17m grant from Arcadia
  fetched: '2026-10-30'
- claim: The Coalition to End Wildlife Trafficking Online counts it among the groups working
    with companies on AI-powered tools to remove illegal listings.
  url: https://www.endwildlifetraffickingonline.org/news/2026/7/16/coalition-and-united-for-wildlife-team-up-to-reinforce-and-expand-commitments-to-tackle-illegal-wildlife-trade
  quote: working with the Coalition to End Wildlife Trafficking Online (including WWF, TRAFFIC
    and IFAW)
  fetched: '2026-10-30'
