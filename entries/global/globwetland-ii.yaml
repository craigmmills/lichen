summary: European Space Agency funded project that built a pilot Global Wetlands Observing System, mapping over 200 wetland sites in the coastal catchments of the southern and eastern Mediterranean from satellite data.
facts:
- claim: Aimed at a pilot information system for a Global Wetlands Observing System under the Ramsar Strategic Plan.
  url: https://www.geographie.uni-wuerzburg.de/en/earthobservation/research/completed-projects/globwetland-ii/
  quote: The project aims principally at developing a G-WOS pilot information system, also called the GlobWetland II information system.
  fetched: '2026-10-30'
- claim: Jena-Optronik says it mapped over 200 wetland sites and surrounding areas.
  url: https://jena-optronik.de/en/spaceborne-instruments/globwetland.html
  quote: over 200 wetland sites and surrounding areas
  fetched: '2026-10-30'
- claim: The Mediterranean Wetlands Observatory continued this mapping, according to a Tour du Valat seminar notice.
  url: https://tourduvalat.org/agenda/seminaire-jeudi-31-10-2019-identifying-changes-of-mediterranean-wetlands-over-four-decades-applying-landsat-and-sentinel-2/
  quote: In continuation of The GlobWetland II, the current analysis is aimed to update the maps of wetlands in 27 Mediterranean countries.
  fetched: '2026-10-30'
