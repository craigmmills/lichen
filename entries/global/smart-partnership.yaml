summary: Partnership of conservation organisations formed in 2011 that develops and supports
  SMART, software for managing protected and conserved areas. Since 2025 it has worked with
  EarthRanger through the SMART-EarthRanger Conservation Alliance.
facts:
- claim: Formed in 2011 by nine conservation organisations.
  url: https://smartconservationtools.org/en-us/About/About-Us
  quote: in 2011 nine leading conversation organizations joined forces to create the SMART
    partnership
  fetched: 2026-10-30
- claim: Managed by a Steering Committee.
  url: https://smartconservationtools.org/en-us/About/About-Us
  quote: The Partnership is managed by a Steering Committee
  fetched: 2026-10-30
- claim: Formed the SMART-EarthRanger Conservation Alliance with EarthRanger in October 2025.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/25320/The-SMART-Partnership-and-EarthRanger-Announce-New-Global-Alliance-to-Transform-Conservation.aspx
  quote: announced the launch of the SMART–EarthRanger Conservation Alliance (SERCA)
  fetched: 2026-10-30
- claim: A WWF scaling case study says the partnership has no independent legal status and
    is typically hosted on a legal basis by one of its member organisations.
  url: https://sites.google.com/impacthub.net/innovation-wwf/innovation-stories/the-scaling-series-smart
  quote: This partnership operates as a collaborative initiative without independent legal
    status.
  fetched: '2026-10-30'
- claim: The same WWF case study says regular support from WWF offices has allowed SMART to
    sustain itself, and that a decline in unrestricted funding is a constraint.
  url: https://sites.google.com/impacthub.net/innovation-wwf/innovation-stories/the-scaling-series-smart
  quote: regular support from offices such as WWF-US, WWF International, WWF-Belgium, WWF-Netherlands
    and WWF-Germany has allowed SMART to sustain itself
  fetched: '2026-10-30'
