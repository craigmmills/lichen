facts:
- claim: Registered as a non-profit association under the Swiss Civil Code in July 2010.
  url: https://www.iccaconsortium.org/governing-documents/
  quote: In July 2010, the ICCA Consortium was registered as a non-profit association under
    the Swiss Civil Code.
  fetched: '2026-10-30'
- claim: Its communications coordinator raised that most AI-based systems are built without
    input from Indigenous Peoples, at a meeting on Indigenous knowledge and AI.
  url: https://www.iccaconsortium.org/2025/09/12/recap-conversation-indigenous-knowledge-artificial-intelligence-fund
  quote: Arju further shared that most AI-based systems are built without any input from Indigenous
    Peoples.
  fetched: '2026-10-30'
- claim: Its 2024-2028 plan names work on databases and registries of territories of life
    with UNEP-WCMC, the ICCA Registry and Protected Planet.
  url: https://www.iccaconsortium.org/wp-content/uploads/2024/03/icca-2024-2028-strategic-plan-eng.pdf
  quote: in collaboration with UNEP World Conservation Monitoring Centre and the ICCA Registry
    and/or Protected Planet
  fetched: '2026-10-30'
