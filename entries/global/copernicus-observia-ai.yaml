summary: AI assistant in public beta, built on the European Environment Agency's GPT-LAB platform, that helps people find, understand and use Copernicus data products, including land monitoring data. Runs on a Mistral language model on the agency's own servers.
facts:
- claim: Launched as a beta demonstrator of an AI assistant for finding, understanding and using Copernicus products.
  url: https://land.copernicus.eu/en/news/copernicus-observia-ai-launched-to-guide-users-through-copernicus-data
  fetched: &id001 2026-10-30
  quote: We are excited to announce the launch of the beta demonstrator ‘Copernicus Observia AI’, a powerful AI assistant designed to help users to find, understand and use Copernicus products.
- claim: Powered by Mistral, chosen because it can run entirely offline.
  url: https://land.copernicus.eu/en/news/copernicus-observia-ai-launched-to-guide-users-through-copernicus-data
  fetched: *id001
  quote: Observia is powered by the European open-source large language model Mistral
  ai_type: large-language-models
- claim: Open to anyone to try, with feedback buttons on each reply.
