  quote: A global partnership for the preservation of the world’s coral reefs and associated
    ecosystems.
- claim: Says SHAMS, the Saudi General Organisation for the Conservation of Coral Reefs and
    Sea Turtles in the Red Sea, is currently its host secretariat. The secretariat rotates
    among members.
  url: https://icriforum.org/meet-the-secretariat/
  quote: is currently the Host Secretariat of ICRI.
