summary: R package that turns movement data and changes in environmental data into
  video animations, with example data on 15 white storks migrating to Africa and a
  peer-reviewed paper in Methods in Ecology and Evolution.
facts:
- claim: R package to visualise movement data and changes in environmental data as
    video animations.
  url: http://movevis.org/index.html
  fetched: 2026-11-21
  quote: moveVis provides tools to visualize movement data (e.g. from GPS tracking)
    and temporal changes of environmental data (e.g. from remote sensing) by creating
    video animations.
- claim: Example data cover 15 white storks migrating from Lake of Constance to Africa.
  url: http://movevis.org/index.html
  fetched: 2026-11-21
  quote: representing coordinates and acquisition times of 15 White Storks, migrating
    from Lake of Constance, SW Germany, to Africa.
- claim: Accompanied by a peer-reviewed paper in Methods in Ecology and Evolution.
  url: http://movevis.org/index.html
  fetched: 2026-11-21
  quote: A peer-reviewed open-access paper accompanying moveVis has been published
    in Methods in Ecology and Evolution
