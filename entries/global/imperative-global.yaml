summary: The organisation designs, develops, owns and operates native-species restoration
  projects, with a final Phase 2 investment decision reached in South Africa and mangrove
  projects planned in Mexico and India.
facts:
- claim: Designs, develops, owns and operates large-scale native-species ecosystem
    restoration projects in several countries.
  url: https://www.imperativeinc.com/
  fetched: 2026-11-22
  quote: We design, develop, own and operate large-scale, biodiverse, native-species
    ecosystem restoration projects across multiple jurisdictions and biome types.
- claim: Its Spekboom Restoration Project is a native-species reforestation project
    in South Africa’s Eastern and Western Cape. Phase 1 started in May 2024 and Phase
    2 reached a final investment decision in April 2026.
  url: https://www.imperativeinc.com/operations/
  fetched: 2026-11-22
  quote: Phase 1 started in May 2024. Phase 2 reached Final Investment Decision (FID)
    in April 2026.
- claim: Is designing and planning Project Chaac to protect and restore mangroves
    in Yucatán, Mexico. The page expects a final investment decision for Phase 1 in
    2027.
  url: https://www.imperativeinc.com/operations/
  fetched: 2026-11-22
  quote: Design and planning ongoing with Phase 1 Final Investment Decision (FID)
    expected in 2027.
- claim: Is designing and planning Project Bharat Neer Vana to restore mangrove forests
    and silvofishery systems in Odisha and West Bengal, India. The page expects a
    final investment decision for Phase 1 in the first half of 2027.
  url: https://www.imperativeinc.com/operations/
  fetched: 2026-11-22
  quote: Design and planning ongoing with Phase 1 Final Investment Decision (FID)
    expected in H1 2027.
- claim: Operates each project through an operating company in the host country.
  url: https://www.imperativeinc.com/operations/
  fetched: 2026-11-22
  quote: Incorporated in its host country and controlled by Imperative.
- claim: Lists offices in seven countries.
  url: https://www.imperativeinc.com/operations/
  fetched: 2026-11-22
  quote: Australia India Mexico Peru Singapore South Africa United States of America
