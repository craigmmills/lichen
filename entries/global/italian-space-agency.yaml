summary: Italian national space agency, party to the Broglio Space Centre agreement with Kenya,
  whose implementing arrangements cover a regional Earth observation centre and access to
  Earth observation data.
facts:
- claim: Agreement with Kenya on the Broglio Space Centre in Malindi took effect in December
    2020.
  url: https://www.asi.it/en/2023/11/kenya-delegation-visits-italy/
  quote: following the ratification of the new agreement between Italy and Kenya for the Broglio
    Space Centre (BSC) in Malindi, which came into effect on December 16, 2020
  fetched: '2026-10-31'
- claim: Space in Africa says the agreement provides for a Regional Centre for Earth Observation
    in Kenya.
  url: https://spaceinafrica.com/2020/10/21/an-overview-on-the-bilateral-cooperation-between-italy-and-kenya-for-earth-observation/
  quote: establish in Kenya a Regional Centre for Earth Observation dedicated to receiving,
    storing, processing and dissemination of remotely sensed data
  fetched: '2026-10-31'
- claim: Space in Africa says an arrangement promotes access to data from ASI's space programmes.
  url: https://spaceinafrica.com/2020/10/21/an-overview-on-the-bilateral-cooperation-between-italy-and-kenya-for-earth-observation/
  quote: promote access and use of data from past, ongoing and future space programmes undertaken
    by the Italian Space Agency (ASI)
