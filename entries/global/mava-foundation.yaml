summary: Swiss conservation foundation founded by Luc Hoffmann in 1994, which ceased grant-making
  at the end of 2022. It was the main donor of a BirdLife project on monitoring systems for
  migratory birds along the West African coast and a funder of Mediterranean waterbird counts.
