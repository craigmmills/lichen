facts:
- claim: Says it is a distributed marine data infrastructure for in situ data from the seas and oceans.
  url: https://www.seadatanet.org/
  fetched: '2026-10-30'
  quote: SeaDataNet is a distributed Marine Data Infrastructure for the management of large and diverse sets of data deriving from in situ of the seas and oceans.
- claim: Says more than 110 data centres from 35 countries are connected to it.
  url: https://www.seadatanet.org/
  fetched: '2026-10-30'
  quote: More than 110 national oceanographic data centres and marine data centres from 35 countries riparian to all European seas are now connected to the SeaDataNet infrastructure!
