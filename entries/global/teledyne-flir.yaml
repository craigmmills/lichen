facts:
- claim: Laser Focus World places it in Wilsonville, Oregon, and reports work with WWF on
    black-footed ferrets.
  url: https://laserfocusworld.com/detectors-imaging/article/14291736/thermal-imaging-aids-wildlife-conservation-efforts
  quote: Teledyne FLIR (Wilsonville, OR) has joined forces with the World Wildlife Fund
  fetched: '2026-10-30'
- claim: Vision Systems Design reports the Kifaru Rising Project with WWF, to deploy thermal
    imaging at 10 locations in Kenya.
  url: https://www.vision-systems.com/non-factory/article/16748310/flir-systems-provides-thermal-cameras-for-antipoaching-efforts-in-kenya
  quote: The Kifaru Rising Project, a collaboration between FLIR Systems and the World Wildlife
    Fund (WWF), will deploy thermal imaging technology to combat illegal rhino poaching across
    10 locations in Kenya.
  fetched: '2026-10-30'
- claim: Mongabay reports the Mara Conservancy began using FLIR cameras from WWF's Wildlife
    Crime Technology Project in 2016.
  url: https://news.mongabay.com/wildtech/2018/07/better-and-better-thermal-cameras-turn-up-the-heat-on-poachers/
  quote: In 2016, the Mara Conservancy began using FLIR thermal cameras, provided and set
    up by World Wildlife Fund’s Wildlife Crime Technology Project
  fetched: '2026-10-30'
- claim: Security Info Watch reports it donated 100 FLIR Scion OTM thermal monocular cameras
    to WWF for use across Kenya, and has worked with WWF since 2016.
  url: https://www.securityinfowatch.com/video-surveillance/cameras/night-vision-thermal-infrared-cameras/press-release/21266777/teledyne-flir-thermal-cams-used-to-help-stop-poaching-in-kenya
  quote: One hundred new FLIR Scion OTM Thermal Monocular cameras will soon be deployed across
    Kenya as a tool to help end illegal poaching, thanks to a donation to World Wildlife Fund
    (WWF) from Teledyne FLIR.
  fetched: '2026-10-30'
