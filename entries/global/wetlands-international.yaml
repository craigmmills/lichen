facts:
- claim: Has 18 offices and about 300 staff.
  url: https://wetlands.org/about-us/
  quote: With currently 18 offices across the globe and around 300 staff
  fetched: 2026-10-30
- claim: Established its headquarters in the Netherlands in 1996.
  url: https://wetlands.org/about-us/
  quote: adopted the name Wetlands International and established its headquarters in the Netherlands
    in 1996
  fetched: 2026-10-30
- claim: Says it will use AI, through satellite imagery and machine learning, to flag changes
    in land use, hydrology and vegetation cover.
  url: https://www.wetlands.org/?p=14929
  quote: Through satellite imagery and machine learning, AI will help us flag changes in land
    use, hydrology, and
  fetched: '2026-10-30'
- claim: Aberystwyth University says it has provided monthly alerts of mangrove loss across
    Africa with Wetlands International since January 2020.
  url: https://www.aber.ac.uk/en/rbi/research/research-in-action/environment/conserving-and-protecting-global-mangrove-forests/
  quote: From 1 January 2020, AU provided, in collaboration with Wetlands International (WI),
    monthly alerts of mangrove loss across the African continent.
  fetched: '2026-10-30'
- claim: Trained teams from the Rufiji Delta and the Saloum Delta in Senegal to monitor mangroves
    with drones.
  url: https://www.wetlands.org/using-drones-conserve-mangroves-africa/
  quote: spent the past week training the teams from Rufiji Delta, Tanzania and Saloum Deltas
    Senegal on how to fly and use drone applications to monitor and collect field data
  fetched: '2026-10-31'
