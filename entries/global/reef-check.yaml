summary: International non-profit that trains volunteer divers to survey coral reefs and kelp
  forests, with more than 17,000 reef surveys in 102 countries and territories since 1997.
facts:
- claim: Founded in 1996, with headquarters in California and volunteer teams in more than
    40 countries and territories.
  url: https://www.reefcheck.org/about-reef-check/
  quote: With headquarters in California and volunteer teams in more than 40 countries and
    territories
  fetched: '2026-10-30'
- claim: Says its EcoDivers have completed over 17,000 surveys in 102 countries and territories
    since 1997.
  url: https://www.reefcheck.org/
  quote: our EcoDivers have completed over 17,000 surveys in 102 countries and territories
  fetched: '2026-10-30'
- claim: Uses a globally standardised protocol to collect data for reef management.
  url: https://www.reefcheck.org/
  quote: uses a globally standardized scientific protocol to collect valuable data for reef
    management
  fetched: '2026-10-30'
- claim: The MacArthur Foundation lists a three-year grant to support Reef Check, held through
    the Hong Kong University of Science and Technology.
  url: https://www.macfound.org/grantee/hong-kong-university-of-science-and-technology-institute-for-environment-and-sustainable-development-reef-check-27194/
  quote: To support Reef Check, a global coral reef monitoring program (over three years).
  fetched: '2026-10-30'
- claim: Says it launched a partnership with Edison International to sponsor monitoring at
    Catalina Island.
  url: https://www.reefcheck.org/reef-check-launches-adopt-a-reef-partnership-with-edison-international-2/
  quote: Reef Check will officially launch the Catalina Island Adopt-A-Reef partnership with
    Edison International
  fetched: '2026-10-30'
