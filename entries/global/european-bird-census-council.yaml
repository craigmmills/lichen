summary: Association under Dutch law of ornithologists who work to improve bird monitoring
  and atlas work in Europe; it runs the EuroBirdPortal viewer and the European Breeding Bird
  Atlas.
facts:
- claim: Describes itself as an association under Dutch law of expert ornithologists working
    on bird monitoring and atlas work.
  url: https://www.ebcc.info/
  quote: The EBCC is an association under Dutch Law of like-minded expert ornithologists co-operating
    in a range of ways to improve bird monitoring and atlas work
  fetched: '2026-10-30'
- claim: Says its EuroBirdPortal viewer now covers nearly 600 bird species, updated close
    to real time.
  url: https://www.ebcc.info/
  quote: providing free access to hundreds of animated maps showing the weekly distribution
    of nearly 600 bird species, updated close to real time.
  fetched: '2026-10-30'
- claim: EuroBirdPortal, a project of the council, says a new LIFE grant will improve the
    capabilities of the project.
  url: https://eurobirdportal.org/news/A-grant-to-further-improve-the-capabilities-of-the-EBP-project-1702401060
  quote: A new LIFE grant will help to further improve the capabilities of the EBP project
    during the next years.
  fetched: '2026-10-30'
