summary: Working group co-chaired by Fugro and IOC/UNESCO that builds frameworks for making privately held ocean science data public. It wrote a bathymetry data sharing guideline.
facts:
- claim: Fugro says the group works on frameworks and mechanisms to make privately owned ocean science data publicly available.
  url: https://www.fugro.com/news/business-news/2023/fugro-ioc-unesco-working-group-unlock-private-sector-ocean-data
  quote: the working group is focused on creating frameworks and mechanisms to make privately owned ocean science data publicly available
  fetched: '2026-10-30'
- claim: GEBCO says the group prepared a guideline on industrial companies making bathymetry data public.
  url: https://www.gebco.net/news/ioc-unescos-ocean-decade-bathymetry-data-sharing-guideline
  quote: The document has been prepared by the Ocean Decade Corporate Data Group.
  fetched: '2026-10-30'
- claim: Founding members named in 2023 were Alcatel Submarine Networks, Ava Ocean, CGG, Equinor and Ørsted.
