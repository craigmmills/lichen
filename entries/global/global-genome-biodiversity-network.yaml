summary: International network of institutions, founded in 2011, that makes DNA and tissue samples from biodiversity biobanks discoverable for research.
facts:
- claim: Its terms of reference describe an international network on preserving genomic samples.
  url: https://wiki.ggbn.org/ggbn/Terms_of_reference
  quote: is an international network of institutions, organizations and other networks that share an interest in long-term preservation of genomic samples representing the non-human diversity of life on Earth.
  fetched: '2026-10-30'
- claim: Freie Universität Berlin reported 99 partner institutions from 33 countries in 2021.
  url: https://fu-berlin.de/en/presse/informationen/fup/2021/fup_21_245-botanischer-garten/index.html
  quote: Ninety-nine partner institutions from thirty-three countries are set to make more than three million DNA and tissue samples from their biological collections digitally available.
  fetched: '2026-10-30'
