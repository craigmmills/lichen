summary: Developed by IUCN and launched in 2016 as the Bonn Challenge Barometer, it
  tracks restoration targets, with IUCN reporting use by 22 countries and endorsement
  by over 50.
facts:
- claim: IUCN says governments use it to track restoration targets across terrestrial
    ecosystems, including coastal and inland waters where use or management rights
    can be identified. It launched in 2016 as the Bonn Challenge Barometer.
  url: https://iucn.org/resources/conservation-tool/restoration-barometer
  fetched: '2026-11-22'
  quote: The Barometer tracks restoration progress across terrestrial ecosystems including
    coastal and inland waters where use or management rights can be identified (i.e.,
    not high seas).
- claim: Says 22 countries use it to report progress and more than 50 have endorsed
    it.
  url: https://iucn.org/resources/conservation-tool/restoration-barometer
  fetched: '2026-11-22'
  quote: Currently, 22 countries are using the Barometer to report the progress of
    their restoration targets and more than 50 have endorsed it.
- claim: Records the area brought under restoration and the climate, biodiversity
    and socio-economic benefits.
  url: https://iucn.org/resources/conservation-tool/restoration-barometer
  fetched: '2026-11-22'
  quote: It records the size of the area being brought under restoration as well as
    the corresponding climate, biodiversity and socio-economic benefits
- claim: The Bonn Challenge progress page said the Barometer would increasingly integrate
    data such as biophysical data from restoration mapping initiatives.
  url: https://www.bonnchallenge.org/progress
  fetched: '2026-11-22'
  quote: the Barometer will increasingly integrate data from a range of existing and
    emerging sources, such as biophysical data from restoration mapping initiatives
