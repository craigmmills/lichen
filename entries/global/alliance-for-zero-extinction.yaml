summary: Joint initiative of biodiversity conservation organisations that identifies and maps the sites holding the last populations of highly threatened species. Its data and website are managed by American Bird Conservancy and BirdLife International.
facts:
- claim: Describes itself as a joint initiative of biodiversity conservation organisations.
  url: https://zeroextinction.org
  quote: The Alliance for Zero Extinction (AZE) is a joint initiative of biodiversity conservation organizations from around the world
  fetched: '2026-10-30'
- claim: Maps sites holding the last-remaining populations of 1802 species.
  url: https://zeroextinction.org
  quote: This map shows the sites that hold the last-remaining populations of 1,802 of the Earth’s most threatened species.
  fetched: '2026-10-30'
- claim: 'Publishes a map of sites and engages governments and non-governmental groups.'
  url: https://zeroextinction.org/the-alliance/about-the-alliance/
  fetched: 2026-10-30
  quote: 'The Alliance for Zero Extinction engages national and regional governments, multilateral institutions, local and Indigenous communities'
