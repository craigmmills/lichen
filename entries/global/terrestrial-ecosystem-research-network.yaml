facts:
- claim: Measures terrestrial ecosystem attributes and openly provides model-ready data.
  url: https://www.tern.org.au/about/
  fetched: '2026-10-30'
  quote: TERN measures key terrestrial ecosystem attributes over time from continental scale
    to field sites
- claim: Hosted by The University of Queensland and supported through Australia's research
    infrastructure strategy.
  url: https://www.tern.org.au/about/
  fetched: '2026-10-30'
  quote: TERN is supported by the Australian Government through the National Collaborative
    Research Infrastructure Strategy, NCRIS .
- claim: Says it is one of several continental-scale ecosystem research infrastructures working
    together through Global Ecosystem Research Infrastructure.
  url: https://www.tern.org.au/news/news-tern-present-future/
  quote: TERN is one of a number of continental-scale ecosystem research infrastructure (ERI)
    initiatives working collaboratively via the Global Ecosystem Research Infrastructure (GERI)
  fetched: '2026-10-30'
- claim: Wikipedia says its funding at launch in 2009 included $55 million from the Australian
    government and $4 million from Queensland.
  url: https://en.wikipedia.org/wiki/TERN
  quote: At launch in 2009, its funding included $55 million from the Australian government
    and $4 million in Queensland government funding.
  fetched: '2026-10-30'
