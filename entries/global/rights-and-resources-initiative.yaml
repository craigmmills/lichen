facts:
- claim: Established in 2005 over government failure to recognise the land rights of Indigenous
    Peoples, Afro-descendant Peoples and local communities.
  url: https://rightsandresources.org/who-we-are/
  quote: The Rights and Resources Initiative was established in 2005
  fetched: '2026-10-30'
- claim: Coordinated by the Rights and Resources Group, a non-profit in Washington, D.C.
  url: https://rightsandresources.org/who-we-are/
  quote: RRI is coordinated by the staff at Rights and Resources Group, a non-profit 501c(3)
    organization based in Washington, D.C., United States.
  fetched: '2026-10-30'
- claim: Publishes freshwater tenure data in its Tenure Tool.
  url: https://rightsandresources.org/who-we-are/
  quote: Freshwater tenure data in now available in the RRI Tenure Tool!
