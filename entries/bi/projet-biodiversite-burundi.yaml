id: projet-biodiversite-burundi
kind: project
name: Améliorer l'efficacité du système de gestion des aires protégées pour la conservation
  de la biodiversité au Burundi
also_known_as:
- Projet Biodiversité
- Improving the Effectiveness of the Protected Areas Management System for the Conservation
  of Biodiversity in Burundi (Dukingire Ibidukikije)
scope: bi
ai_label: conservation-tech
realms:
- land
- freshwater
countries:
- bi
status: active
runner: unknown
summary: UNDP-channelled project, funded by Belgium and the EU, that handed OBPE equipment
  including a surveillance boat in August 2025 and satellite GPS units and infrared
  drones in May 2026.
facts:
- claim: UNDP says equipment worth nearly 200,000 US dollars, including a surveillance
    boat and binoculars, was handed to OBPE in August 2025 under this initiative,
    for the management of Kibira and Rusizi national parks.
  url: https://www.undp.org/fr/node/542251
  fetched: 2026-11-12
  quote: Cette appui fait partie de l'initiative « Améliorer l’efficacité du système
    de gestion des aires protégées pour la conservation de la biodiversité au Burundi
    »
- claim: UNDP lists among its expected effects easier research and ecological monitoring
    missions.
  url: https://www.undp.org/fr/node/542251
  fetched: 2026-11-12
  quote: Facilitation des missions de recherche et de suivi écologique cruciales pour
    la conservation de la nature
- claim: OBPE says that in May 2026 UNDP handed it, under the Projet Biodiversité
    funded by Belgium and the EU, satellite GPS units, infrared drones that capture
    images day and night, and equipment for its biodiversity research laboratory.
  url: https://obpe.bi/2026/05/25/le-pnud-dote-lobpe-dequipements-de-haute-technologie/
  fetched: 2026-11-12
  quote: des drones infrarouges capables de capturer des images de jour comme de nuit
- claim: The equipment is for surveillance, ecological monitoring and protected-area
    management, in operations rooms to be set up in Rusizi and Kibira national parks.
  url: https://obpe.bi/2026/05/25/le-pnud-dote-lobpe-dequipements-de-haute-technologie/
  fetched: 2026-11-12
  quote: Ils seront utilisés dans les salles d’opérations qui seront installées au
    Parc national de la Rusizi et au Parc national de la Kibira.
- claim: Belgium's Openaid database lists the project under the Dukingire Ibidukikije
    name, with UNDP as the channel.
  url: https://openaid.be/fr/project/xm-dac-2-10-7202
  fetched: 2026-11-12
  quote: NU PNUD - Programme pour le développement - PRT
- claim: Its IATI record, in Dutch, lists among its outputs inventories, research
    and digital monitoring of nature conservation in protected areas.
  url: https://d-portal.org/q.html?aid=XM-DAC-2-10-4331
  fetched: 2026-11-12
  quote: inventarisering, onderzoek en digitale monitoring rond natuurbehoud in beschermde
    zones
