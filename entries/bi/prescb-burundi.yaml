id: prescb-burundi
kind: programme
name: Programme de recherche, échange d'information, sensibilisation et conservation
  de la biodiversité au Burundi
scope: bi
ai_label: conservation-tech
realms:
- land
- freshwater
countries:
- bi
status: active
summary: Under an agreement between OBPE and the Royal Belgian Institute of Natural
  Sciences, this OBPE-run programme collects habitat data in Kibira, Rusizi and Ruvubu,
  and fire-monitoring data in Ruvubu.
facts:
- claim: The 2023 narrative report says the programme follows an agreement between
    OBPE and the Royal Belgian Institute of Natural Sciences.
  url: https://bi.chm-cbd.net/sites/bi/files/2024-08/rapport%20narratif-exercice-2023.pdf
  fetched: 2026-11-12
  quote: sensibilisation et conservation de la biodiversité au Burundi conclu entre
    l’OBPE et l’IRSNB, des actions
- claim: The 2023 narrative report describes collecting data to monitor habitat dynamics.
  url: https://bi.chm-cbd.net/sites/bi/files/2024-08/rapport%20narratif-exercice-2023.pdf
  fetched: 2026-11-12
  quote: CEBioS. Ces activités sont entre autre la collecte de données pour le suivi
    de la dynamique des habitats
- claim: A report titled second quarter 2024 describes an April field mission intended
    to record habitat changes on quadrats along ecological trails in Kibira, Rusizi
    and Ruvubu national parks and build a database of ecosystem changes. Its text
    dates the mission to 15–23 April 2014, despite referring to the 2023–2024 reporting
    year.
  url: https://bi.chm-cbd.net/fr/implementation/programmes-projets/prescb/rapport-suivi-habitats-trim-2-2024
  fetched: 2026-11-12
  quote: Constituer une base de données sur l'évolution des états des écosystèmes
    au cours des années
- claim: The September 2023 mission report gives 31 participants in its results, but
    describes 32 people, including forest guards, as involved in habitat monitoring.
  url: https://bi.chm-cbd.net/sites/bi/files/2024-08/rapport-suivi-habitats-septembre-2023.pdf
  fetched: 2026-11-12
  quote: 31 personnes ont participé aux activités de suivi
- claim: In December 2023, under the programme, carried out in partnership between
    OBPE and RBINS, a mission collected fire-monitoring data on the quadrats of an
    experimental set-up in Ruvubu National Park.
  url: https://bi.chm-cbd.net/fr/implementation/programmes-projets/prescb/rapport-activites-exercice-2023-2024/dynamique-habitats-biodiv-ap-bi/rapport-suivi-feux-gestion-septembre-bi
  fetched: 2026-11-12
  quote: a été organisé une décente de collecte de données sur le suivi des feux au
    niveau des quadrants existants mis en place dans le Parc National de la RUVUBU
    (PNR)
