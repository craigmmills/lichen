summary: Project running from 2023 to 2027, run by OBPE and funded by Enabel, that
  strengthens biodiversity conservation in Kibira and Rusizi national parks, including
  vegetation mapping and monitoring of key species' home ranges.
facts:
- claim: Enabel says PACECOR, active from 2023 to 2027, works to strengthen biodiversity
    conservation in Kibira and Rusizi national parks, including ecological surveillance
    and restoration.
  url: https://www.enabel.be/fr/sauvegarder-la-biodiversite-au-burundi-une-collaboration-scientifique-au-service-de-la-nature/
  fetched: 2026-11-12
  quote: Le projet PACECOR, actif de 2023 à 2027, vise à renforcer la conservation
    de la biodiversité dans les parcs nationaux de la Kibira et de la Rusizi.
- claim: CEBioS and OBPE produced a detailed map of the vegetation types in both parks.
  url: https://www.enabel.be/fr/sauvegarder-la-biodiversite-au-burundi-une-collaboration-scientifique-au-service-de-la-nature/
  fetched: 2026-11-12
  quote: a réalisé une cartographie détaillée des types de végétation présents dans
    les deux parcs
- claim: The project monitors the home ranges of key species to analyse their movements,
    critical habitats and threats.
  url: https://www.enabel.be/fr/sauvegarder-la-biodiversite-au-burundi-une-collaboration-scientifique-au-service-de-la-nature/
  fetched: 2026-11-12
  quote: Le projet assure également un suivi des domaines vitaux des espèces clés
- claim: Enabel says the project is under UNDP coordination.
  url: https://www.enabel.be/fr/sauvegarder-la-biodiversite-au-burundi-une-collaboration-scientifique-au-service-de-la-nature/
  fetched: 2026-11-12
  quote: Sous la coordination du PNUD, il déploie une large gamme d’activités
