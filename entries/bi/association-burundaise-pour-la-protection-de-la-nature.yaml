- claim: The 2016 counts covered sites including Rusizi National Park, the northern
    lakes, Lake Dogodogo, Kibira National Park, Lake Tanganyika at Kigwena, the Malagarazi
    marshes and Ruvubu National Park.
  url: https://bi.chm-cbd.net/sites/bi/files/2019-12/rev-compta-ois-eau-2016-bi.pdf
  fetched: 2026-11-12
  quote: VI. Comptages dans les marais de la Malagarazi
- claim: Its December 2018 bulletin reports seeking funding for the January 2019 waterbird
    count.
  url: https://abn.bi/images/inyomvyi/inyomvyi11.pdf
  fetched: 2026-11-12
  quote: contact pour financer l’activité de comptage des oiseaux d’eau au mois de
