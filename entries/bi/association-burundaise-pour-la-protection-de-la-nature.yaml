summary: Burundian nature association, renamed in September 2013, that has organised
  waterbird counts since 2005 (interrupted in 2009, resumed January 2013) and held
  crane conservation workshops with OBPE in late 2025.
facts:
- claim: A review of Burundi's January 2016 waterbird counts says ABN has organised
    waterbird counts since 2005, interrupted in 2009 and resumed in January 2013.
  url: https://bi.chm-cbd.net/sites/bi/files/2019-12/rev-compta-ois-eau-2016-bi.pdf
  fetched: 2026-11-12
