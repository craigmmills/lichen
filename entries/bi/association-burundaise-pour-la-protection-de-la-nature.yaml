- claim: It organised a December 2025 advocacy workshop on the grey crowned crane
    with OBPE. In October 2025 it hosted experts for a workshop under the ZGAP-funded
    Umusambi crane conservation project.
  url: https://www.abn.bi/index.php/fr/projets/projets-realises/94-information-abn
  fetched: 2026-11-12
  quote: Leur visite s'inscrit dans le cadre d’Umusambi Conservation Project dédié
    à la conservation de la Grue royale (Grey Crowned Crane), financé par ZGAP.
