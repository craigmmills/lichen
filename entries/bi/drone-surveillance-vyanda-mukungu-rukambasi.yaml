summary: Programme to guard two protected areas with drones, after OBPE received two
  drones and four GPS units from the association 3C in November 2023, as ABP reports.
facts:
- claim: ABP reports that in November 2023 OBPE received two drones and four GPS units
    from the association Conservation et Communauté de Changement (3C) for guarding
    Vyanda and Mukungu-Rukambasi.
  url: https://abpinfo.bi/2023/11/17/les-outils-informatiques-pour-surveiller-les-reserves-naturelles-du-burundi/
  fetched: 2026-11-12
  quote: deux drones et quatre GPS (Global Positioning System = Système de géolocalisation
    par satellite), qui serviront dans les activités de garde des réserves naturelles
    de Vyanda et le paysage protégé de Mukungu-Rukambasi.
- claim: ABP says OBPE services were to use the drones in collaboration with 3C's
    agents.
  url: https://abpinfo.bi/2023/11/17/les-outils-informatiques-pour-surveiller-les-reserves-naturelles-du-burundi/
  fetched: 2026-11-12
  quote: pour que les services de l’OBPE en collaboration avec les agents de l’association
    conservation et communauté de changement commencent à utiliser ces drones dans
    la garde de ces réserves.
- claim: Iwacu reported in 2024 that OBPE's offices in southern Burundi announced
    surveillance of the two protected areas by two drones.
  url: https://www.iwacu-burundi.org/region-sud-bururi-makamba-des-drones-pour-la-surveillance-des-aires-protegees/
  fetched: 2026-11-12
  quote: Des drones assurent aujourd’hui la surveillance de la réserve naturelle de
    Vyanda et du paysage protégé de Mukungu-Rukambasi.
