summary: Public body under the environment ministry, created by decree in 2014, that
  manages protected areas, runs habitat monitoring in Ruvubu National Park, and received
  UNDP-supplied equipment in 2025 and 2026.
facts:
- claim: In August 2025 UNDP handed the office equipment worth nearly 200,000 US dollars
    for the management of the Kibira and Rusizi national parks.
  url: https://www.undp.org/fr/node/542251
  fetched: 2026-11-09
  quote: Ce matériel, d'une valeur de près de 200 mille dollars américains, vise à
    améliorer la gestion durable des parcs nationaux de la Kibira et de la Rusizi
- claim: The equipment, including a surveillance boat and binoculars, is for its rangers
    to fight poaching and monitor fragile ecosystems.
  url: https://www.undp.org/fr/node/542251
  fetched: 2026-11-09
  quote: destinés à donner aux gardes forestiers les outils dont ils ont besoin pour
    lutter contre le braconnage et surveiller les écosystèmes fragiles
- claim: Its site says it was created by decree no. 100/240 of 29 October 2014.
  url: https://obpe.bi/
  fetched: 2026-11-09
  quote: L’Office Burundais pour la Protection de l’Environnement a été créé par décret
    N° 100/240 du 29 Octobre 2014
- claim: Its contact page gives addresses in Gitega and Bujumbura.
  url: https://obpe.bi/contact/
  fetched: 2026-11-09
  quote: 56 Gitega et B.P. 2757 Bujumbura
- claim: Its site reports an April 2025 workshop to validate the draft national biodiversity
    strategy and action plan aligned with the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://obpe.bi/2025/04/16/validation-du-projet-de-document-de-la-strategie-et-plan-daction-nationaux-sur-la-biodiversite-spanb-alignee-au-cadre-mondial-sur-la-biodiversite-de-kunming-montreal/
  fetched: 2026-11-09
  quote: un atelier d’enrichissement et de validation du projet de document de la
    Stratégie et Plan d’Action Nationaux sur la Biodiversité (SNPAB) alignée au cadre
    mondial de la biodiversité de Kunming-Montréal
- claim: Its site says UNDP handed it high-technology equipment in May 2026 under
    a biodiversity project funded by Belgium and the European Union.
  url: https://obpe.bi/2026/05/25/le-pnud-dote-lobpe-dequipements-de-haute-technologie/
  fetched: 2026-11-09
  quote: le PNUD a procédé à la remise d’un important lot d’équipements de haute technologie
    à l’OBPE, dans le cadre du Projet Biodiversité financé par le Royaume de Belgique
    et l’Union européenne
- claim: Its site reports that Burundi was represented by two experts in OFAC work
    on mapping land cover and forest types in Central Africa using Sentinel-2 images.
  url: https://obpe.bi/2019/12/13/formation-sur-la-cartographie-decametrique-de-loccupation-de-sol-et-des-types-forestiers-dafrique-centrale-au-moyen-dimages-sentinel/
  fetched: 2026-11-09
  quote: 'Le Burundi avait été représenté par deux experts à savoir:'
- claim: A public body with its own legal personality, placed under the Ministry of
    Environment, Agriculture and Livestock.
  url: https://obpe.bi/structure/
  fetched: 2026-11-09
  quote: est un Etablissement Public doté de la personnalité juridique, d’un patrimoine
    propre et d’une autonomie financière et administrative. Il est placé sous le tutelle
    du Ministère de l’Environnement, de l’Agriculture et de l’Elevage.
- claim: Created by decree 100/240 of 29 October 2014.
  url: https://obpe.bi/structure/
  fetched: 2026-11-09
  quote: a été créé par décret N° 100/240 du 29 Octobre 2014
- claim: Its forest directorate's missions include centralising data on forests and
    protected areas and setting up surveillance and management of protected areas.
  url: https://obpe.bi/missions/
  fetched: 2026-11-09
  quote: Centraliser les données sur les forêts et les aires protégées en collaboration
    avec les services techniques concernés
- claim: Its forest directorate is to set up surveillance and management mechanisms
    for protected areas.
  url: https://obpe.bi/missions/
  fetched: 2026-11-09
  quote: Mettre en place des mécanismes de surveillance et de gest1on des aires protégées
- claim: Its forest directorate is to produce a yearly national report on the health
    of protected areas.
  url: https://obpe.bi/missions/
  fetched: 2026-11-09
  quote: Produire annuellement un rapport national sur l’état de santé des aires protégées
- claim: Its general directorate oversees international trade mechanisms for wild
    fauna and flora and the country's obligations under international environmental
    conventions.
  url: https://obpe.bi/missions/
  fetched: 2026-11-09
  quote: Veiller à la mise en œuvre des obligations découlant des conventions et accords
    internationaux relatifs à l’environnement auxquels le Burundi est partie
