summary: Red List assessing 1,619 animal species in seven groups, of which 390 are listed as threatened,
  published in seven volumes as an update to IUCN Bangladesh's 2000 edition, funded by the World Bank.
facts:
- claim: Assessed 1,619 animal species in seven groups and listed 390 as threatened and 31 as regionally
    extinct.
  url: https://iucn.org/news/bangladesh/201607/bangladesh-red-list-reports-31-regionally-extinct-and-390-threatened-animal-species
  fetched: 2026-11-07
  quote: 160 assessors in Bangladesh assessed 1,619 species and categorised 390 threatened species
- claim: Published in seven volumes with distribution, photographs and status for each species.
  url: https://iucn.org/news/bangladesh/201607/bangladesh-red-list-reports-31-regionally-extinct-and-390-threatened-animal-species
  fetched: 2026-11-07
  quote: In seven volumes, the detailed information with geographical distribution, photo and the present
    status of the each species of the country have been included
- claim: Updates the first Red List of Bangladesh, which IUCN Bangladesh published in 2000.
  url: https://iucn.org/news/bangladesh/201607/bangladesh-red-list-reports-31-regionally-extinct-and-390-threatened-animal-species
  fetched: 2026-11-07
  quote: In 2000, IUCN Bangladesh first published the IUCN Red List of Threatened Species™ Bangladesh.
