summary: Closed drone project run by Daffodil International University, December 2017 to June
  2022, producing canopy surface, height and cover estimates for inventory plots in the Sal
  and Sundarbans forests.
facts:
- claim: The team devised an automated drone image acquisition protocol and generated canopy
    surface, canopy height and canopy cover estimates for inventory plots in the Sal and Sundarbans
    forests.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_181419
  fetched: 2026-11-12
  quote: The researchers generated canopy surface and canopy height rasters for each selected
    inventory plot and its surroundings, as well as estimates of canopy cover for each subplot
- claim: The data were processed in partnership with the Bangladesh Forest Department, whose
    drone patrol team the researchers helped train.
  url: https://sites.nationalacademies.org/PGA/PEER/PEERscience/PGA_181419
  fetched: 2026-11-12
  quote: The researchers processed the raw data in partnership with the Bangladesh Forest
    Department (BFD).
- claim: Project dates were December 2017 to June 2022; the page gives a final summary of
    activities.
