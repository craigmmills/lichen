facts:
- claim: Launched on 17 November 2025 at the Bangladesh Forest Department.
  url: https://iucn.org/story/202511/cris-project-launched-landmark-partnership-sundarbans-conservation
  fetched: 2026-11-12
  quote: The Conservation and Restoration Initiatives in the Sundarbans Region (CRIS)
    project was officially launched on 17 November 2025 at the Bangladesh Forest Department
    in Agargaon.
- claim: IUCN Bangladesh will lead a faunal inventory inside the Sundarbans and GIS-based
    habitat and distribution mapping.
  url: https://iucn.org/story/202511/cris-project-launched-landmark-partnership-sundarbans-conservation
  fetched: 2026-11-12
  quote: Under the CRIS project, IUCN Bangladesh will lead a detailed faunal inventory
    inside the Sundarbans, along with several other scientific studies, including
    climate-risk assessments, socio-economic surveys, and GIS-based habitat and distribution
    mapping
