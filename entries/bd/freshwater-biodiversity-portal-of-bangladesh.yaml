facts:
- claim: The portal says it presents an updated species inventory of Bangladesh's freshwater
    biodiversity, and includes DNA barcodes of freshwater organisms from GenBank.
  url: https://freshwaterbiodiversity.org.bd/about
  fetched: 2026-11-07
  quote: The portal also includes available DNA barcodes of freshwater organisms from GenBank
    with accession numbers generated by ABR Lab and other Bangladeshi researchers.
- claim: The portal says the Aquatic Bioresource Research Lab at Sher-e-Bangla Agricultural
    University took the initiative to set it up.
  url: https://freshwaterbiodiversity.org.bd/about
  fetched: 2026-11-07
  quote: the Aquatic Bioresource Research Lab (ABR Lab) of the Department of Fisheries Biology
