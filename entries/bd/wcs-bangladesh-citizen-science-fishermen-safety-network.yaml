summary: Active WCS Bangladesh programme where gillnet fishers record verified catch
  and sighting data for safety equipment and training, including 234 cetaceans and
  96 marine turtles from 2015 to 2024.
facts:
- claim: Gillnet fishers record geo-referenced and photo-verified data on their fishing
    and catches in exchange for safety equipment and training.
  url: https://bangladesh.wcs.org/About-Us/News/articleType/ArticleView/articleId/24612
  fetched: 2026-11-09
  quote: Our Citizen Science Fishermen Safety Network engages gillnet fishermen to
    record geo-referenced and photo-verified data on their fishing practices and catches
    in exchange for the provision of equipment and training to increase their navigational
    safety.
- claim: Between 2015 and 2024 the fishers recorded sightings and catch locations
    for 234 cetaceans and 96 marine turtles, among others.
  url: https://bangladesh.wcs.org/About-Us/News/articleType/ArticleView/articleId/24612
  fetched: 2026-11-09
  quote: Between 2015 to 2024, citizen science fishers recorded sightings and catch
    locations for 234 cetaceans, 96 marine turtles, 242 rays, and 15,878 sharks.
- claim: WCS says the data feed a marine spatial planning process that guides marine
    protected area establishment.
  url: https://bangladesh.wcs.org/About-Us/News/articleType/ArticleView/articleId/24612
  fetched: 2026-11-09
  quote: Information gathered from this network contribute to a marine spatial planning
    process, guiding marine protected area establishment
