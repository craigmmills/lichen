summary: Project begun with an emphasis on ecological monitoring and aiming to set
  up a long-term monitoring system for the Sundarbans, with a February 2025 procurement
  notice listing the Forest Department and government development budget funds.
facts:
- claim: The January 2022 state of conservation report for the Sundarbans says the
    project was initiated with an emphasis on ecological monitoring.
  url: https://objectstorage.ap-dcc-gazipur-1.oraclecloud15.com/n/axvjbnqprylg/b/V2Ministry/o/office-forest-khulnadiv/2024/12/8903058cb609492ba8d3dadc332229e2.pdf
  fetched: 2026-11-12
  quote: Government for conservation of the Sundarbans with the emphasis on Ecological
    Monitoring.
- claim: The same report, describing the project's components including ecological
    monitoring, says it aims to establish a long-term ecological monitoring system
    for the Sundarbans.
  url: https://objectstorage.ap-dcc-gazipur-1.oraclecloud15.com/n/axvjbnqprylg/b/V2Ministry/o/office-forest-khulnadiv/2024/12/8903058cb609492ba8d3dadc332229e2.pdf
  fetched: 2026-11-12
  quote: The project aims to establish a long -term ecological monitoring system for
    the Sundarbans.
- claim: A February 2025 procurement notice under the project lists the Forest Department
    as agency and the government development budget as the source of funds, with no
    development partners.
  url: https://www.bppa.gov.bd/advertisement-services/details-9071.html
  fetched: 2026-11-12
  quote: 'Budget and Source of Funds : Development Budget GOB Development Partners
    : None PARTICULAR INFORMATION Project/Programme Name : Protection of Sundarbans
    Mangrove Forest Project (PSMFP)'
- claim: Arannayk Foundation says the Ecological Monitoring of the Sundarbans study
    under the project is jointly implemented by CEGIS and Arannayk Foundation, assessing
    ecosystem health through physical, chemical and biological indicators.
  url: https://arannayk.org/index.php/projects
  fetched: 2026-11-12
  quote: Jointly implemented by CEGIS and Arannayk Foundation, the study focuses on
    assessing the health of the Sundarbans ecosystem through physical, chemical, and
    biological indicators.
