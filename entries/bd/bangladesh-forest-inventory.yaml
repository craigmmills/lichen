summary: Closed 2016 to 2019 forest inventory run by the Forest Department and built by FAO and SilvaCarbon,
  which visited 1,781 field plots and surveyed 6,400 households, according to FAO's catalogue.
facts:
- claim: FAO's catalogue says the 2016–2019 inventory visited 1,781 field plots and surveyed 6,400 households,
    using semi-automated land cover mapping and Open Foris tools.
  url: https://microdata.fao.org/index.php/catalog/2651/study-description
  fetched: 2026-11-07
  quote: Biophysical inventory involved visiting of 1781 field plots, and the socioeconomic surveying
    covered 6400 households.
- claim: The catalogue says the inventory made its sample plots permanent for continuing monitoring.
  url: https://microdata.fao.org/index.php/catalog/2651/study-description
  fetched: 2026-11-07
  quote: BFI made the sample plots as permanent for the continuous assessment of forest resources and
    monitoring over time.
