summary: ESA-run activity supporting a World Bank coastal resilience programme in Bangladesh; ESA says
  it mapped mangroves across about 52,000 km2 of coast from Sentinel-2, with refinement planned.
facts:
- claim: In March 2026, ESA said its GDA Forest Management activity was supporting the World Bank in preparing
    a coastal resilience programme in Bangladesh.
  url: https://gda.esa.int/?p=8529
  fetched: 2026-11-07
  quote: The ESA Global Development Assistance (GDA) Forest Management activity is supporting the World
    Bank (WB) in the preparation of a multisectoral coastal resilience programme in Bangladesh
- claim: ESA says the consortium mapped mangroves across about 52,000 km2 of coast from Sentinel-2 imagery.
  url: https://gda.esa.int/?p=8529
  fetched: 2026-11-07
  quote: Sentinel-2 imagery was used to map mangrove areas across a large coastal area of approximately
    52,000 km², distinguishing open from closed mangrove classes.
- claim: In March 2026, ESA said the consortium would refine the products and finalise recommendations
    for adoption in the World Bank programme and the Forest Department.
  url: https://gda.esa.int/?p=8529
  fetched: 2026-11-07
  quote: In the coming months, the consortium will refine the products, expand analytical capabilities,
    and finalise recommendations for operational adoption
