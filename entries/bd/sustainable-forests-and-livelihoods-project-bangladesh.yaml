summary: Closed World Bank-funded project run by the Bangladesh Forest Department,
  approved October 2018 and ended 31 December 2024, with 175 million dollars committed
  and a digital surveillance system among its results.
facts:
- claim: The World Bank brief gives the Bangladesh Forest Department as implementing
    agency, approval in October 2018, an end date of 31 December 2024 and a total
    commitment of 175 million dollars.
  url: https://documents1.worldbank.org/curated/en/099805001042415781/pdf/IDU1adda18f816eba147981a52017fe28534a6e2.pdf
  fetched: 2026-11-09
  quote: 'DATE: October 05 2018 END DATE: December 31 2024 TOTAL COMMITMENT: $175
    million IMPLEMENTING AGENCIES: Bangladesh Forest Department'
- claim: Aimed to improve forest cover and carbon sequestration through collaborative
    forest management with local communities.
  url: https://documents1.worldbank.org/curated/en/099805001042415781/pdf/IDU1adda18f816eba147981a52017fe28534a6e2.pdf
  fetched: 2026-11-09
  quote: The Sustainable Forest and Livelihood (SUFAL) project helps to improve forest
    cover and enhance carbon sequestration through sustainable management of forest
    resources and introduction of a collaborative forest management approach involving
    local communities.
- claim: Lists among its results a digital surveillance system for site-specific planning
    of forest interventions.
  url: https://documents1.worldbank.org/curated/en/099805001042415781/pdf/IDU1adda18f816eba147981a52017fe28534a6e2.pdf
  fetched: 2026-11-09
  quote: A digital surveillance system for Site-Specific Planning to implement customized
    interventions
