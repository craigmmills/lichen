summary: Project, contracted between the Forest Department and IUCN Bangladesh on 14 January 2026, to
  review about 2,200 animal species and produce ten volumes and upgraded public databases.
facts:
- claim: The Forest Department and IUCN Bangladesh signed the project contract on 14 January 2026.
  url: https://iucn.org/story/202602/bangladesh-launches-third-national-faunal-red-list
  fetched: 2026-11-07
  quote: On 14 January 2026, in Dhaka, the Bangladesh Forest Department and IUCN Bangladesh formally signed
    the contract for the project titled "Updating the Faunal Red List of Bangladesh,"
- claim: Will review the conservation status of about 2,200 animal species.
  url: https://iucn.org/story/202602/bangladesh-launches-third-national-faunal-red-list
  fetched: 2026-11-07
  quote: the conservation status of approximately 2,200 faunal species, including previously assessed
    and newly evaluated species, will be reviewed
- claim: Planned outputs include ten volumes of Red List books and upgraded digital databases for public
    access to species information.
  url: https://iucn.org/story/202602/bangladesh-launches-third-national-faunal-red-list
  fetched: 2026-11-07
  quote: Key outputs of the project will include the publication of 10 volumes of Faunal Red List books,
    upgraded digital databases to improve public access to species information
