summary: Forest information system run and built by the Forest Department, launched in December 2018 with
  FAO support and UN-REDD and USAID funding, including a forest cover Geoportal.
facts:
- claim: The BFIS site calls it the national information system of the Bangladesh Forest Department, developed
    with technical support from FAO and financial support from UN-REDD and USAID.
  url: https://bfis.bforest.gov.bd/bfi/?p=95
  fetched: 2026-11-07
  quote: Bangladesh Forest Information System (BFIS) is the national information system of the Bangladesh
    Forest Department(BFD)
- claim: A 2019 UN-REDD article says the Forest Department launched BFIS in December 2018.
  url: https://www.un-redd.org/post/bangladesh-forest-information-system-bfis-connecting-people-and-resourcesdata
  fetched: 2026-11-07
  quote: A comprehensive Bangladesh Forest Information System (BFIS) was launched in December 2018 by
    the BFD
- claim: The same article says the BFIS Geoportal module gives spatial information on forest cover and
    was designed to support deforestation monitoring.
  url: https://www.un-redd.org/post/bangladesh-forest-information-system-bfis-connecting-people-and-resourcesdata
  fetched: 2026-11-07
  quote: This portal was designed to support the monitoring of deforestation
