summary: Bangladeshi NGO that Wikipedia says began in 2003 and ran the first Sundarbans tiger
  population survey, and which IUCN says will keep working with communities and the Forest
  Department from 2026 to 2028.
facts:
- claim: Wikipedia says WildTeam carried out the first Sundarbans tiger population monitoring
    survey and the first study of tiger home ranges there.
  url: https://en.wikipedia.org/wiki/WildTeam
  fetched: 2026-11-07
  quote: the first Sundarbans tiger population monitoring survey
- claim: Wikipedia says its Village Tiger Response Teams are trained to monitor local tiger
    conflict incidents.
  url: https://en.wikipedia.org/wiki/WildTeam
  fetched: 2026-11-07
  quote: trained to scare tigers back into the forest, monitor local tiger conflict incidents,
    and stop other villagers from killing tigers
- claim: IUCN says WildTeam will continue working with communities and the Forest Department
    from 2026 to 2028 on responding to tiger incursions, with monitoring used to assess which
    measures work.
  url: https://iucnsos.org/?p=11447
  fetched: 2026-11-07
  quote: In Bangladesh , WildTeam will continue working with local communities and the Bangladesh
    Forest Department to improve safety and strengthen the systems already in place to respond
    to tiger incursions .
- claim: Wikipedia says it began in 2003 as the Wildlife Trust of Bangladesh, took the name
    WildTeam in 2012 and registered as an NGO in Bangladesh in October 2013.
  url: https://en.wikipedia.org/wiki/WildTeam
  fetched: 2026-11-07
  quote: In October 2013, WildTeam became a registered non-government organization in Bangladesh
    under the NGO Affairs Bureau.
