summary: Dhaka-based department under the environment ministry that piloted SMART patrol management
  in the West Sundarbans Sanctuary, according to a 2016 WCS release, and organised the January
  2026 Faunal Red List workshop.
facts:
- claim: The CBD focal point list names a Deputy Chief Conservator of Forests at the Forest
    Department as Bangladesh's protected areas focal point, at Bana Bhaban, Agargaon, Dhaka.
  url: https://www.cbd.int/countries/nfp?country=bd
  fetched: 2026-11-07
  quote: Protected Areas NFP
- claim: The CBD list gives the Forest Department's address at Bana Bhaban, Agargaon, Dhaka.
  url: https://www.cbd.int/countries/nfp?country=bd
  fetched: 2026-11-07
  quote: Bana Bhaban, Agargaon
- claim: The department's Resources Information Management System unit manages the Bangladesh
    Forest Information System.
  url: https://bfis.bforest.gov.bd/bfi/?p=95
  fetched: 2026-11-07
  quote: Bangladesh Forest Information System (BFIS) is managed by Resources Information Management
    System (RIMS) unit of Bangladesh Forest Department(BFD).
- claim: A 2016 WCS release says the department piloted SMART patrol management in the West
    Sundarbans Sanctuary.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/9074/Bangladesh-Rolls-out-SMART-Patrolling-Across-the-Sundarbans.aspx
  fetched: 2026-11-07
  quote: the system has been piloted by the Bangladesh Forest Department in the West Sundarbans
    Sanctuary
- claim: A January 2025 Eco-Business article reported that an inspector of the Forest Department’s
    Wildlife Crime Control Unit used a drone at a bird sanctuary in Gopalganj district in
    mid-November.
  url: https://www.eco-business.com/news/new-technology-drives-bangladeshs-efforts-against-wildlife-crimes/
  fetched: 2026-11-07
  quote: a wildlife inspector of the forest department’s Wildlife Crime Control Unit (WCCU)
    who is assigned to catch bird poachers, used a drone camera to a bird sanctuary in Gopalganj
    district
- claim: In January 2025, Eco-Business reported that the unit had received equipment to combat
    wildlife poaching and trafficking from a UN office it called the United Nations Office
    on Drugs and Crimes.
  url: https://www.eco-business.com/news/new-technology-drives-bangladeshs-efforts-against-wildlife-crimes/
  fetched: 2026-11-07
  quote: Recently, the WCCU received a set of equipment from the United Nations Office on
    Drugs and Crimes to combat wildlife poaching and trafficking.
- claim: Eco-Business says SMART and HAWK have been deployed in wildlife conservation, in
    a passage about wildlife-rich countries generally.
  url: https://www.eco-business.com/news/new-technology-drives-bangladeshs-efforts-against-wildlife-crimes/
  fetched: 2026-11-07
  quote: AI-based tools like the Spatial Monitoring and Reporting Tool (SMART) and Hostile
    Activity Watch Kernel (HAWK) have been effectively deployed.
- claim: The department works under the Ministry of Environment, Forest and Climate Change
    and organised the Faunal Red List inception workshop on 29 January 2026.
  url: https://iucn.org/story/202602/bangladesh-launches-third-national-faunal-red-list
  fetched: 2026-11-07
  quote: The workshop was organised by the Bangladesh Forest Department (BFD), under the Ministry
    of Environment, Forest and Climate Change (MoEFCC), with technical support from IUCN Bangladesh
- claim: Its site lists wildlife management and nature conservation divisions, including one
    in Dhaka.
  url: https://bforest.gov.bd/
  fetched: 2026-11-07
  quote: বন্যপ্রাণী ব্যবস্থাপনা ও প্রকৃতি সংরক্ষণ বিভাগ, ঢাকা
- claim: Its site lists a national and zonal forest inventory and carbon surveys in protected
    areas.
  url: https://bforest.gov.bd/
  fetched: 2026-11-07
  quote: জাতীয় ও অঞ্চল ভিত্তিক বন জরিপ
- claim: Its site lists a national workshop on ecological monitoring of the Sundarbans.
  url: https://bforest.gov.bd/
  fetched: 2026-11-07
  quote: Ecological Monitoring of Sundarbans
- claim: Its headquarters are in Dhaka.
  url: https://iucn.org/story/202608/together-tigers-bangladesh-celebrates-global-tiger-day-2026-nationwide-conservation
  fetched: 2026-11-07
  quote: held at the Bangladesh Forest Department headquarters in Dhaka
