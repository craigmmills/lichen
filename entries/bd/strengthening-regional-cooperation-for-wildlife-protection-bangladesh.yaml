summary: Closed World Bank-funded project run by the Bangladesh Forest Department,
  implemented 2011 to 2016 with Nepal, using SMART; an evaluation reports a camera-trap
  estimate of 106 Sundarbans tigers.
facts:
- claim: A World Bank evaluation says the regional SRCWP project, including its Bangladesh
    component, was implemented in Bangladesh and Nepal from 2011 to 2016.
  url: https://documents.worldbank.org/curated/en/250431533557694267/pdf/128169-PPAR-P121210-P166769-PUBLIC.pdf
  fetched: 2026-11-15
  quote: implemented in Bangladesh and Nepal from 2011 to 2016
- claim: The evaluation reports an estimate of 106 tigers in the Bangladesh Sundarbans
    using a camera-trapping methodology developed under SRCWP.
  url: https://documents.worldbank.org/curated/en/250431533557694267/pdf/128169-PPAR-P121210-P166769-PUBLIC.pdf
  fetched: 2026-11-15
  quote: 'New methodology for tiger population estimates using camera-trapping

    developed under SRCWP gives estimate of 106 tigers in Bangladesh

    Sundarbans.'
- claim: The evaluation lists a new methodology for tiger population estimates using
    camera trapping.
  url: https://documents.worldbank.org/curated/en/250431533557694267/pdf/128169-PPAR-P121210-P166769-PUBLIC.pdf
  fetched: 2026-11-15
  quote: New methodology for tiger population estimates using camera-trapping
- claim: The evaluation lists a sub-project introducing SMART patrolling in the Sundarbans
    South Wildlife Sanctuary in Bangladesh.
