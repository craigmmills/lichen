summary: Danish ministry created on 3 June 2026, which Lex describes as mainly a continuation
  of the Ministeriet for Grøn Trepart, and which runs the Danish Nature Agency and the agency
  for green land use and aquatic environment.
facts:
- claim: Its predecessor, Ministeriet for Grøn Trepart, sent out the draft national action
    plan for biodiversity for consultation in 2024.
  url: https://hoeringsportalen.dk/Hearing/Details/69227
  fetched: '2026-11-02'
  quote: Ministeriet for Grøn Trepart er afsender for vedlagte h øring over udkast til national
    handlingsplan for biodiversitet.
- claim: A CBD COP16 document lists Denmark among Parties that submitted a strategy and action
    plan aligned with the Kunming-Montreal framework, received on 21 October 2024. The document
    does not name the ministry.
  url: https://www.cbd.int/doc/c/293d/5660/34ecf5c8730668d39328089a/cop-16-l-25-en.pdf
  fetched: '2026-11-02'
  quote: 10 Denmark 21 October 2024
- claim: Created on 3 June 2026 with two agencies under it.
  url: https://mgtp.dk/ministeriet/organisationen
  fetched: '2026-11-02'
  quote: Ministeriet for Natur og Dyrevelfærd blev oprettet 3. juni 2026 og har Styrelsen
    for Grøn Arealomlægning og Vandmiljø og Naturstyrelsen som underliggende myndigheder.
- claim: Its address is in Copenhagen.
