facts:
- claim: Says it has worked for decades on the monitoring and conservation of marine mammals,
    especially seals and whales.
  url: https://daza.dk/stafetten-overvaagning-og-bevarelse-af-havpattedyr/
  fetched: '2026-11-08'
  quote: Vi har i flere årtier arbejdet med overvågning og bevarelse af havpattedyr, især
    sæler og hvaler, både gennem nationale og internationale projekter.
- claim: Is part of the national response for stranded marine mammals, registering and collecting
    stranded and dead marine mammals on Danish coasts.
  url: https://daza.dk/stafetten-overvaagning-og-bevarelse-af-havpattedyr/
  fetched: '2026-11-08'
  quote: Vi er en del af det nationale beredskab for strandede havpattedyr, hvor vi registrerer
    og indsamler strandede og døde havpattedyr langs de danske kyster.
- claim: Serves as an expert in the Trilateral Wadden Sea Cooperation group working on marine
    mammal monitoring in the Wadden Sea.
  url: https://daza.dk/stafetten-overvaagning-og-bevarelse-af-havpattedyr/
  fetched: '2026-11-08'
  quote: Her fungerer vi som ekspert i den ekspertgruppe, som arbejder med overvågningen af
