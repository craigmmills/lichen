  url: https://blaavand.dof.dk/om-blavand-fuglestation/fuglestationen-s-strategi
  fetched: '2026-11-08'
  quote: Blåvand Fuglestation har siden august 1963 foretaget indsamling af data om fugletrækket
    ved Danmarks vestligste punkt, Blåvandshuk.
- claim: Since 1984 it has ringed migrating small birds more systematically as part of nature
    monitoring.
  url: https://blaavand.dof.dk/om-blavand-fuglestation/fuglestationen-s-strategi
  fetched: '2026-11-08'
  quote: Siden 1984 er der somet led i naturovervågningen foretaget en mere systematisk ringmærkning
    af de trækkendesmåfugle.
- claim: Its work follows a scientific minimum programme in spring and autumn seasons.
  url: https://blaavand.dof.dk/om-blavand-fuglestation/fuglestationen-s-strategi
