summary: Danish natural history museum, run by the University of Copenhagen, responsible for
  the national collections and their digitisation, with a new DNA laboratory announced in
  a 22 October 2026 release and a new museum due to open on 6 March 2027.
facts:
- claim: Its site says a new laboratory will use DNA from natural history collections.
  url: https://www.snm.ku.dk/people/icalabuig
  fetched: '2026-11-02'
  quote: Nyt laboratorium skal bruge DNA fra naturhistoriske samlinger til at forstå fremtidens
    natur
- claim: Its site gives 6 March 2027 as the opening date of a new museum.
  url: https://www.snm.ku.dk/people/icalabuig
  fetched: '2026-11-02'
  quote: Den 6. marts 2027 slår vi dørene op for det nye museum
- claim: Responsible for the national natural history collections.
  url: https://snm.dk/en/about-museum
  fetched: '2026-11-02'
  quote: The museum is responsible for the management of the national natural history collections
    as well as the associated research and public outreach.
- claim: Works on digitising the collections.
  url: https://snm.dk/en/research-and-collections
  fetched: '2026-11-02'
  quote: We are continuously working on digitization, and you can explore hundreds of thousands
    of items on our collections portal
- claim: A December 2024 announcement said its Science and Society section was responsible
    for developing portals for reporting species observations.
  url: https://snm.dk/en/news/new-head-research-natural-history-museum-denmark
  fetched: '2026-11-02'
  quote: The section is also responsible for developing portals for reporting species findings
    and observations in nature.
- claim: GBIF gives an address in Copenhagen.
