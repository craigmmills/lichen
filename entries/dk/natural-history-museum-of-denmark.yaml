- claim: Named as a partner in a planned three-year mammal monitoring project with Danmarks
    Jægerforbund, in an undated release.
  url: https://www.avjf.dk/pressemeddelelser/8123/
  fetched: *id001
  quote: Projektet er et samarbejde mellem Danmarks Jægerforbund, Nationalt Center for Miljø
    og Energi (Institut for Ecoscience, Aarhus Universitet), Naturhistorisk Museum Aarhus
    og Statens Naturhistoriske Museum.
