  fetched: '2026-11-02'
  quote: The Natural History Museum of Denmark (The University of Copenhagen) is leading the
    project
- claim: Its site lists a press release of 22 October 2026 on a new laboratory using DNA from
    natural history collections.
  url: http://snm.ku.dk/english/
  fetched: &id001 2026-11-02
  quote: New Laboratory Will Use DNA from Natural History Collections to Understand the Future
    of Nature
- claim: A vice director of the museum was quoted on Arter in a foundation release.
  url: https://www.avjf.dk/pressemeddelelser/fonde-giver-millioner-til-danskernes-nye-portal-om-arter-og-natur/
