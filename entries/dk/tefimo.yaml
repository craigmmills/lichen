summary: Active project, led by Valentina Melli and funded by the Danish Maritime Fisheries
  and Aquaculture Programme, researching AI and eDNA for monitoring commercial fish and ecosystem
  components, with a planned automated species detection and length measurement pipeline.
facts:
- claim: Plans a pipeline that automates underwater species detection and length measurement
    of the catch.
  url: https://maritime-forum.ec.europa.eu/node/7686_de
  fetched: '2026-11-02'
  quote: automating underwater species detection and length measurement of the catch
- claim: Plans to compare eDNA, electronic monitoring and observers for estimating catch composition.
  url: https://maritime-forum.ec.europa.eu/node/7686_de
  fetched: '2026-11-02'
  quote: develop and compare the accuracy of monitoring approaches (eDNA, EM, observers)
- claim: An August 2025 report describes research and development using AI and eDNA methods
    to monitor commercial fish and ecosystem components.
  url: https://www.aqua.dtu.dk/english/News/AI-Monitoring?id=78b72327-41d7-4a8d-abbb-6bea713944d1
  fetched: '2026-11-02'
  quote: using Artificiel Intelligence (AI) and eDNA methods for monitoring commercial fish
    and important ecosystem components such as benthic macro-fauna.
- claim: An August 2025 report describes training AI models for automated species detection
    and length measurement.
  url: https://www.aqua.dtu.dk/english/News/AI-Monitoring?id=78b72327-41d7-4a8d-abbb-6bea713944d1
  fetched: '2026-11-02'
  quote: to train the AI models at different levels of difficulty for automated species detection
    and length measurement.
- claim: Researches AI and eDNA for monitoring commercial fish and ecosystem components.
  url: https://www.aqua.dtu.dk/english/newsarchive/2025/08/ai-monitoring
  fetched: '2026-11-02'
  quote: using Artificiel Intelligence (AI) and eDNA methods for monitoring commercial fish
    and important ecosystem components
