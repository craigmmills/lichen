facts:
- claim: Pioneered the Geospatial Data Sharing Protocol, co-created with certification schemes
    and corporations.
  url: https://www.preferredbynature.org/node/9497
  fetched: '2026-11-08'
  quote: Pioneered by Preferred by Nature, and co-created with prominent certification schemes
    and corporations, the Geospatial Data Sharing Protocol stands as a digital compass for
    businesses.
- claim: The protocol is a voluntary standard for sharing geospatial data on harvest sites
    through supply chains.
  url: https://www.preferredbynature.org/node/9497
  fetched: '2026-11-08'
  quote: The Protocol is intended to be a voluntary standard for providing a uniform means
    for sharing geospatial data.
- claim: Is developing, with WWF, the Traceability Tool Navigator, a public site to compare
    digital traceability and geospatial monitoring tools, funded by a grant from the ISEAL
    Innovations Fund; the first test platform was expected in the first quarter of 2026.
  url: https://www.preferredbynature.org/projects/understanding-digital-tools-sustainability-open-platform-comparison-and-guidance
  fetched: '2026-11-08'
  quote: The platform, developed by Preferred by Nature in collaboration with WWF, brings
    clarity by providing neutral evaluations, structured comparisons, and verified assessments
- claim: Says it works on land management and business practices in more than 100 countries.
  url: https://www.preferredbynature.org/projects/understanding-digital-tools-sustainability-open-platform-comparison-and-guidance
