summary: Catch journal developed by DTU Aqua in which anglers share trip and catch
  records for research and fisheries management, funded from fishing licence income
  with Tips- og Lottomidlerne support.
facts:
- claim: DTU Aqua developed the catch journal to learn more about fish stocks; anglers
    who record trips and catches share their data with DTU Aqua for research and fisheries
    management.
  url: https://www.aqua.dtu.dk/nyheder/nyhed?id=20663d31-1fc1-4a05-963d-9f54bd695cd2
  fetched: '2026-11-08'
  quote: Fangstjournalen er udviklet af DTU Aqua med det formål at få mere viden om
    fiskebestandene.
- claim: Data from the journal let researchers follow changes in fish stocks.
  url: https://www.aqua.dtu.dk/nyheder/nyhed?id=20663d31-1fc1-4a05-963d-9f54bd695cd2
  fetched: '2026-11-08'
  quote: Lystfiskerens data fra Fangstjournalen gør det muligt at følge med i ændringer
    i fiskebestandene.
- claim: A January 2016 DTU Aqua article said Fangstjournalen was available on the
    web and as an iPhone beta app, with an Android version planned.
  url: https://www.aqua.dtu.dk/nyheder/nyhed?id=20663d31-1fc1-4a05-963d-9f54bd695cd2
  fetched: '2026-11-08'
  quote: Fangstjournalen findes både i en version til computer på www.fangstjournalen.dtu.dk
    og til smartphone
- claim: Its development was funded from fishing licence income administered by the
    then Ministry of Environment and Food, with support from Tips- og Lottomidlerne.
  url: https://www.aqua.dtu.dk/nyheder/nyhed?id=20663d31-1fc1-4a05-963d-9f54bd695cd2
  fetched: '2026-11-08'
  quote: Udviklingen af Fangstjournalen er finansieret af indtægterne fra salg af
    fisketegn, som administreres af Miljø- og Fødevareministeriet
