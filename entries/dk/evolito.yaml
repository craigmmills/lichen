summary: Company formerly called FaunaPhotonics, registered under the new name from 27 June
  2025, whose sensors capture insect wingbeat signatures and use AI to calculate insect metrics.
facts:
- claim: The Danish Business Authority registered the new name from 27 June 2025.
  url: https://danskcvrapi.dk/en/news/35642986-navneskift-2025-06-27
  fetched: '2026-11-02'
  quote: The Danish Business Authority has registered that FaunaPhotonics Agriculture & Environmental
    A/S carries the new company name evolito A/S from 27 June 2025.
- claim: The company's site says its evo-Sense sensors capture insect activity continuously.
  url: https://faunaphotonics.com
  fetched: '2026-11-02'
  quote: Our evo-Sense sensors capture insect activity continuously, turning millions of micro-movements
    into biodiversity metrics you can trust.
