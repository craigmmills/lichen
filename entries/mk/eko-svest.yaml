summary: Skopje citizen association founded in 2002, funded by CEPF for an October
  2021 to June 2022 project building species and habitat monitoring capacity through
  citizen science, using a Macedonian-translated iNaturalist.
facts:
- claim: IUCN's member page says it is an association of citizens founded on 18 September
    2002 in Skopje.
  url: https://iucn.org/our-union/members/iucn-members/centar-za-istrazuvanje-i-informiranje-za-zivotnata-sredina-eko-svest
  fetched: 2026-11-13
  quote: The Center for Environmental Research and Information Eko-svest is an association
    of citizens founded on September 18, 2002 in Skopje, North Macedonia.
- claim: CEPF's grant page says the project, from October 2021 to June 2022, aimed
    to build monitoring capacity for key species and habitats by involving citizen
    science in monitoring the protected area.
  url: https://www.cepf.net/grants/grantee-projects/citizen-science-service-biodiversity-protection-north-macedonia
  fetched: 2026-11-13
  quote: Build monitoring capacity for key species and habitats and enable more effective
    conservation by involving citizen science in the management and monitoring of
    the protected area.
- claim: The CEPF final report names Eko-svest as the organisation that carried out
    the project.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2729
  fetched: 2026-11-13
  quote: 'Organization Name: Center for environmental research and information Eko-svest
    Skopje'
- claim: The CEPF final report says the iNaturalist app was translated into Macedonian
    and used for the mapping exercises.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2729
  fetched: 2026-11-13
  quote: The mobile app iNaturalist was translated in Macedonian and used for the
    mapping exercises
