summary: Reports participation in LIFE DinPin Bear, started in January 2026, funds Mavrovo and Pelister
  parks, and may use the National Red List to inform conservation policy.
facts:
- claim: Says it is part of the EU LIFE DinPin Bear project, which started in January 2026 to conserve
    the brown bear population of the Dinaric-Pindos region.
  url: https://www.moepp.gov.mk/en-GB/odnosi-so-javnost/novosti/eu-life-dinpin-bear-ambiciozen-eu-proekt-za-zacuvuvanje-na-kafeavata-mecka-vo-dinarsko-pindskiot-region
  fetched: 2026-11-12
  quote: The MOEPP ( Ministry of Environment and Physical Planning of North Macedonia ) is part of the
    new European project LIFE DinPin Bear, which started in January 2026
- claim: In February 2026 the minister said the ministry had secured funds in its 2026 budget for the
    protection and promotion of the national parks.
  url: https://www.moepp.gov.mk/en-GB/odnosi-so-javnost/novosti/xodza-i-vo-2026-obezbedivme-sredstva-za-nacionalnite-parkovi-koi-se-klucen-stolb-vo-zastitata-na-prirodnoto-nasledstvo
  fetched: 2026-11-12
  quote: the Ministry, within its budget, has secured dedicated funds for further activities for the protection
    and promotion of the national parks
- claim: The National Red List site names the ministry as the government department that may use the Red
    List to inform national conservation policy.
  url: https://redlist.moepp.gov.mk/?p=11
  fetched: 2026-11-12
  quote: the relevant national government departments (e.g. the Ministry of Environment and Physical Planning
    of North Macedonia) may use it to inform national conservation policy
