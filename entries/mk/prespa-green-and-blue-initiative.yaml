  platform planned.
facts:
- claim: In June 2026 the Macedonian Ecological Society reported biodiversity field
    research with local protected areas as part of the project.
  url: https://prespa.mes.org.mk/en/blog/field-research-on-wildlife-in-prespa-is-in-full-swing/
  fetched: 2026-11-13
  quote: the ongoing biodiversity field research being conducted by the Macedonian
    Ecological Society in cooperation with local protected areas as part of the project
- claim: In June 2026, MES reported that monitoring of several bird species had begun
    along the shores of Lake Prespa.
  url: https://prespa.mes.org.mk/en/blog/field-research-on-wildlife-in-prespa-is-in-full-swing/
  fetched: 2026-11-13
  quote: Along the shores of Lake Prespa, monitoring of several bird species has already
    begun, including the Common Merganser, the Great White Pelican, and, of course,
    the Dalmatian Pelican
- claim: The data from these studies and from the ranger services of Ezerani Nature
    Park and the Galichica and Pelister national parks will be integrated into a single
    digital platform.
  url: https://prespa.mes.org.mk/en/blog/field-research-on-wildlife-in-prespa-is-in-full-swing/
