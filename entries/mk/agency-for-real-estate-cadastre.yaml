  quote: Агенцијата е надлежна за изработка на топографски карти , изработка на ортофото карти / планови
- claim: GIM International reported in October 2021 on a lidar mapping project for North Macedonia's territory
    by Kartverket, quoting AREC's project manager.
  url: https://www.gim-international.com/content/news/new-digital-elevation-models-in-north-macedonia
  fetched: 2026-11-12
  quote: says Sasho Dimeski, project manager at Agency for Real Estate Cadastre (AREC)
- claim: GIM International reported that a lidar portal was set up to give public access to the lidar
    data and derived products.
  url: https://www.gim-international.com/content/news/new-digital-elevation-models-in-north-macedonia
