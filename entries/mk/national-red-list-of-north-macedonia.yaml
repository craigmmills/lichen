facts:
- claim: Presents the National Red List of North Macedonia, based on the IUCN Red List methodology.
  url: https://redlist.moepp.gov.mk/?p=11
  fetched: 2026-11-12
  quote: This website presents the National Red List of the Republic of North Macedonia. The National
    Red List is based on the principles and methodologies of the global IUCN Red List of Threatened Species
- claim: The first official assessments covered all 32 reptile and 14 amphibian species in the country.
  url: https://redlist.moepp.gov.mk/?p=11
  fetched: 2026-11-12
  quote: the extinction risk of the populations of all 32 reptile and 14 amphibian species that occur
    in the country was evaluated according the IUCN Red List Categories and Criteria
- claim: Its Balkan lynx assessment draws on camera-trapping surveys in Mavrovo National Park in 2013,
    2015 and 2018.
  url: https://redlist.moepp.gov.mk/?p=6247
  fetched: 2026-11-12
  quote: The last three intensive camera-trapping surveys in its core area (Macedonia's Mavrovo National
    Park) in 2013, 2015 and 2018
