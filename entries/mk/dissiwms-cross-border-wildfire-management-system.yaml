facts:
- claim: keep.eu lists the project under the 2014 to 2020 IPA CBC North Macedonia
    - Albania programme, with the aim of a joint system for monitoring and early recognition
    of wildfire.
  url: https://keep.eu/projects/30864
  fetched: 2026-11-15
  quote: To develop joint smart and innovative management system for cross-border
    environmental protection, monitoring and early risk recognition and prevention
    from wildfire
- claim: The project installed sensors and cameras for early fire detection at four
    points on Mount Jablanica, two in North Macedonia and two in Albania.
  url: https://keep.eu/projects/30864
  fetched: 2026-11-15
  quote: Installation of sensors and cameras for early detection of fires in the border
    area of Mount Jablanica North Macedonia and Albania in the 4 designated points
    (two in North Macedonia and two in Albania);
- claim: The project bought four drones, two for the Struga firefighters and two for
    Librazhd.
  url: https://keep.eu/projects/30864
  fetched: 2026-11-15
  quote: Procurement of 4 drones (two for Struga firefighters and two for Librazhd);
- claim: The project ran from January 2022 to December 2024.
  url: https://keep.eu/projects/30864
  fetched: 2026-11-15
  quote: 'Project end date: 2024-12-31'
- claim: keep.eu gives the project status as closed.
  url: https://keep.eu/projects/30864
  fetched: 2026-11-15
  quote: 'Project status: closed'
- claim: The project site reports monitoring and inspection of the installed equipment
    at Bogojci, Struga, in July 2024.
  url: https://cbcforestshield.eu
  fetched: 2026-11-15
  quote: Monitoring and inspection of the installed equipment in the village of Bogojci
    -Struga
