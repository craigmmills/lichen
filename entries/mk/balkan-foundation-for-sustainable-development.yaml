    in 2005, with an office in Skopje.
  url: https://balkansfoundation.org/
  fetched: 2026-11-13
  quote: a regional non-governmental organization established in 2005
- claim: CEPF's grant page says the project was to study the distribution, population
    size and conservation status of the Prespa trout in three rivers.
  url: https://www.cepf.net/grants/grantee-projects/monitoring-and-conservation-endemic-and-endangered-trout-national-park
  fetched: 2026-11-13
  quote: Conduct a study on distribution, population size and conservation status
    of the Prespa trout in three rivers, Brajchinska, Kranska and Leva.
