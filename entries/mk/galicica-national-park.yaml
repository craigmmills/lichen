summary: National park that began capture-mark-recapture monitoring of the Macedonian newt with the Macedonian
  Ecological Society in May 2020, and had five representatives trained in monitoring endemic plants, according
  to a CEPF report.
facts:
- claim: In May 2020, the Macedonian Ecological Society reported that it and the park had started capture-mark-recapture
    monitoring of the Macedonian newt in Simoncheska Pond.
  url: https://prespa.mes.org.mk/en/blog/newt-monitoring-with-np-galichica/
  fetched: 2026-11-12
  quote: MES and NP Galichica started a detailed monitoring scheme (using the capture-mark-recapture methodology)
    of the Macedonian newt
- claim: A CEPF final project report by the Macedonian Biological Society says five park representatives
    were trained to monitor and assess endemic plant species.
  url: https://cepf.net/resources/final-project-report/final-project-report-2574
  fetched: 2026-11-12
  quote: Five representatives of Galicica NP were trained for monitoring and assessment of the species.
