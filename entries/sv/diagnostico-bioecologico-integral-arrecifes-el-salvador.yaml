summary: An active 14-month assessment of reefs at Los Cóbanos, Costa del Bálsamo and Punta Amapala, led
  by FIAES and the Red de Observadores Ciudadanos, funded from a 228,000 dollar TFCCA package, planning
  a reef health index and citizen science tools.
facts:
- claim: The project is led by FIAES and the Red de Observadores Ciudadanos, with technical backing from
    the ministry and funds from the TFCCA, and covers Los Cóbanos, Costa del Bálsamo and Punta Amapala
    over 14 months.
  url: https://www.elsalvador.com/?p=1255060
  fetched: 2026-11-12
  quote: El proyecto es liderado por FIAES y la Red de Observadores Ciudadanos (ROC), con respaldo técnico
    del MARN y fondos del TFCCA. Se estudiarán los ecosistemas de Los Cóbanos, Costa del Bálsamo y Punta
    Amapala
- claim: The assessment plans studies of reef biodiversity, a reef health index, growth of stony corals
    and sea fans, and a historical assessment of environmental variables since 2010.
  url: https://diario.elmundo.sv/nacionales/el-salvador-inicia-primer-diagnostico-integral-sobre-la-salud-de-sus-arrecifes
  fetched: 2026-11-12
  quote: El diagnóstico incluirá estudios sobre la biodiversidad arrecifal, el índice de salud de los
    arrecifes, el crecimiento de corales pétreos y abanicos de mar, así como una evaluación histórica
    de variables ambientales desde 2010.
- claim: The project plans data collection instruments for citizen science.
  url: https://diario.elmundo.sv/nacionales/el-salvador-inicia-primer-diagnostico-integral-sobre-la-salud-de-sus-arrecifes
  fetched: 2026-11-12
  quote: El proyecto también contempla el desarrollo de instrumentos de recolección de datos para ciencia
    ciudadana
- claim: The project is funded from a 228,000 dollar investment package of the TFCCA, which FIAES has
    administered since 2021.
  url: https://diario.elmundo.sv/nacionales/evaluaran-la-salud-de-los-arrecifes-de-coral-en-el-salvador
  fetched: 2026-11-12
  quote: es financiado como parte del paquete de inversión de $228,000 otorgado por el Acuerdo para la
    Conservación de Bosques Tropicales y Arrecifes de Coral (TFCCA, por sus siglas en inglés), administrado
    por FIAES desde 2021.
