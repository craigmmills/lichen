summary: A foundation that promoted the 2026 satellite tracking of sea turtles with FIAES and the ministry,
  and which a December 2025 report says will be local counterpart for the national reef health assessment.
facts:
- claim: The 2026 satellite tracking of sea turtles was promoted by the foundation with FIAES, the Red
    Xiuhtic and the ministry, and FIAES says the study plans to tag up to eight black turtles.
  url: https://www.elsalvador.com/?p=1277016
  fetched: 2026-11-12
  quote: La iniciativa, impulsada por Fundación Naturaleza El Salvador junto a FIAES, Red Xiuhtic y el
    MARN, incluye una capacitación especializada en Bahía de Jiquilisco sobre la instalación y seguimiento
    de estos equipos.
- claim: The foundation developed a project on improving knowledge of sea turtle populations and their
    habitats in its area of work.
  url: https://www.elsalvador.com/?p=1277016
  fetched: 2026-11-12
  quote: “Conservación e incremento del conocimiento acerca de las poblaciones de tortugas marinas y sus
    hábitats”, desarrollado por Fundación Naturaleza El Salvador en su área de influencia.
- claim: A December 2025 report says the foundation will serve as the local counterpart of the national
    reef health assessment, to continue the work after the project ends.
  url: https://www.elsalvador.com/?p=1255060
  fetched: 2026-11-12
  quote: la Fundación Naturaleza El Salvador servirá como contraparte local para dar continuidad a las
    acciones una vez finalizado el proyecto.
