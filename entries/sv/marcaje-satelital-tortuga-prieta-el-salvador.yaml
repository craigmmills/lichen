summary: El Salvador's first satellite tagging programme for the black turtle, begun in June 2026 and
  run by the foundation, FIAES and the ministry, with transmitters fitted to four turtles to gather migration,
  feeding and behaviour data.
facts:
- claim: In June 2026 El Salvador began its first satellite tagging programme for the black turtle, to
    gather data on migration routes, feeding areas and behaviour.
  url: https://www.prensa-latina.cu/2026/06/29/el-salvador-amplia-monitoreo-cientifico-a-tortugas-marinas/
  fetched: 2026-11-12
  quote: El Salvador impulsa hoy el primer programa de marcaje satelital de la tortuga prieta, una iniciativa
    orientada a obtener información científica sobre las rutas migratorias, áreas de alimentación y comportamiento
    de esta especie amenazada.
- claim: Satellite transmitters were fitted to four black turtles.
  url: https://www.prensa-latina.cu/2026/06/29/el-salvador-amplia-monitoreo-cientifico-a-tortugas-marinas/
  fetched: 2026-11-12
  quote: Como parte del proyecto fueron colocados transmisores satelitales a cuatro ejemplares de tortuga
    prieta
- claim: Training covered SPOT satellite transmitters and the Argos tracking system.
  url: https://www.prensa-latina.cu/2026/06/29/el-salvador-amplia-monitoreo-cientifico-a-tortugas-marinas/
  fetched: 2026-11-12
  quote: también se abordó el uso de transmisores satelitales tipo SPOT y del sistema de seguimiento Argos
