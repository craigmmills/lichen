summary: Annual wetland bird count from Barra de Santiago to La Unión bay, run by
  SalvaNATURA, with about 6,000 birds reported in that bay in 2025.
facts:
- claim: A report on elsalvador.com says the Central American Waterbird Census and
    the Migratory Shorebird Project are carried out every year in the wetlands from
    Barra de Santiago to the bay of La Unión.
  url: https://www.elsalvador.com/?p=1200872
  fetched: 2026-11-12
  quote: Cada año se realiza el Censo Centroamericano de Aves Acuáticas (CCAA) y el
    Proyecto de Aves Migratorias Playeras (MSP) en los humedales, desde Barra de Santiago
    hasta bahía de La Unión
- claim: The report gives about 6,000 birds in the bay of La Unión in the 2025 count.
  url: https://www.elsalvador.com/?p=1200872
  fetched: 2026-11-12
  quote: En la bahía de La Unión y los bosques salados hay un aproximado de 6,000
    aves en el censo del 2025.
- claim: The report gives the count as SalvaNATURA's records, with biologists, volunteers
    and a MARN ranger taking part.
  url: https://www.elsalvador.com/?p=1200872
  fetched: 2026-11-12
  quote: de acuerdo con registros de SalvaNatura Fundación Ecológica, realizado recientemente
    en un conteo de aves
