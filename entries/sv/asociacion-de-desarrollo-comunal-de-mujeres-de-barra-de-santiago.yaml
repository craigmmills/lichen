summary: Community women's association funded by FIAES, reported to have been created
  in 2000 and to work on recovering the Barra de Santiago ecosystem.
facts:
- claim: A report on elsalvador.com says the association was created in 2000 and works
    on recovering the Barra de Santiago ecosystem.
  url: https://www.elsalvador.com/?p=1285801
  fetched: 2026-11-12
  quote: El trabajo está a cargo de integrantes de la Asociación de Desarrollo Comunal
    de Mujeres de Barra de Santiago (AMBAS), una organización creada en el año 2000
- claim: A January 2023 report on elsalvador.com says 102,919 sea turtle eggs had
    been collected since August 2022 in the El Imposible-Barra de Santiago conservation
    area project.
  url: https://www.elsalvador.com/?p=1035330
  fetched: 2026-11-12
  quote: fueron recolectados 102,919 huevos de tortuga marina.
- claim: The January 2023 report says a hundred turtles had been tagged in that nesting
    season.
  url: https://www.elsalvador.com/?p=1035330
  fetched: 2026-11-12
  quote: Cien tortugas fueron marcadas en esta temporada de anidación.
- claim: An AMBAS technician said the association had tagged turtles for three years
    and that one tagged at Barra de Santiago in December 2020 was found the next month
    in Oaxaca, Mexico.
  url: https://www.elsalvador.com/?p=1035330
  fetched: 2026-11-12
  quote: En los tres años que hemos realizado marcaje de tortugas, marcamos dos tortugas
    Prieta.
