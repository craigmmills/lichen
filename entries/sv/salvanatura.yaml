summary: A non-profit conservation organisation founded in 1989, described by NatureServe, with a bird
  banding programme in 2010 across three national parks in El Salvador and one reserve in Honduras, and
  a study of coffee farms as migratory bird habitat.
facts:
- claim: NatureServe describes SalvaNATURA as a non-profit conservation organisation founded in 1989 as
    an ecological foundation.
  url: https://www.natureserve.org/news-releases/2012-conservation-impact-award-co-winner-salvanatura
  fetched: 2026-11-12
  quote: SalvaNATURA is a non-profit conservation organization recognized nationally and internationally
    for its successful work in the field of environmental conservation in El Salvador and Mesoamerican
    region. Founded in 1989 as an ecological foundation
- claim: In 2010 SalvaNATURA's birdathon blog described its bird monitoring programme as monthly bird
    banding in three national parks in El Salvador and one biological reserve in Honduras.
  url: https://maraton-de-aves-el-salvador.blogspot.com/2010/12
  fetched: 2026-11-12
  quote: all funds raised in the birdathon benefit the SalvaNATURA bird monitoring program, a monthly
    bird banding effort in three national parks in El Salvador and one biological reserve in Honduras.
- claim: NatureServe's 2012 award release mentions a study by SalvaNATURA of certified coffee farms as
    habitat for migratory birds in the Apaneca Mountain Range Biological Corridor.
  url: https://www.natureserve.org/news-releases/2012-conservation-impact-award-co-winner-salvanatura
  fetched: 2026-11-12
  quote: A recent scientific study by SalvaNATURA highlighted the vital habitat that certified coffee
    farms provide for migratory birds in the Apaneca Mountain Range Biological Corridor
- claim: A 2024 press report says SalvaNatura co-organised a talk promoting bird apps for community conservation.
  url: https://www.elsalvador.com/?p=1155689
  fetched: 2026-11-12
  quote: SalvaNatura en coordinación con Marta L. del Campo, PhD Coordinadora de las Iniciativas para
    Latinoamérica y El Caribe Latin American and Caribbean Initiatives, Leader, ofrecieron la ponencia
    "Recursos para apoyar actividades comunitarias y conservación".
