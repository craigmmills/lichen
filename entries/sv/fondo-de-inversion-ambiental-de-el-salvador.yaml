facts:
- claim: The fund's site gives its address in Santa Tecla, El Salvador.
  url: https://fiaes.org.sv/en_US/memorias-de-labores
  fetched: 2026-11-12
  quote: 12 calle oriente, entre 9°y 11° avenida sur, C-27-A. Colonia Utila, Santa Tecla, El Salvador,
    Centroamérica.
- claim: The fund's site carries the name Fondo de la Iniciativa para las Américas alongside its current
    name.
  url: https://fiaes.org.sv/en_US/memorias-de-labores
  fetched: 2026-11-12
  quote: FONDO DE LA INICIATIVA PARA LAS AMÉRICAS
- claim: A press report says the fund manages a conservation portfolio of more than 100 million dollars,
    including a debt conversion for restoring the Lempa river basin.
  url: https://diario.elmundo.sv/nacionales/fiaes-libera-8-5-millones-de-tortugas-marinas-recien-nacidas-en-playas-salvadorenas
  fetched: 2026-11-12
  quote: Actualmente, FIAES administra un portafolio de más de $100 millones para la conservación, incluyendo
    la conversión de deuda más grande del mundo destinada a la restauración de la cuenca del río Lempa
- claim: Four projects under the 2021 Tropical Forest and Coral Reef Conservation Agreement between El
    Salvador and the United States are carried out by Fundación Doménech, AMBAS Barra de Santiago, FUNZEL
    and OIKOS Solidaridad.
  url: https://diario.elmundo.sv/nacionales/fiaes-libera-8-5-millones-de-tortugas-marinas-recien-nacidas-en-playas-salvadorenas
  fetched: 2026-11-12
  quote: Los proyectos están a cargo de Fundación Doménech, AMBAS Barra de Santiago, FUNZEL y OIKOS Solidaridad.
- claim: IUCN reports that rangers of FIAES were among 27 trained in November 2022 in drones and digital
    tools for biological monitoring.
  url: https://iucn.org/es/node/38343
  fetched: 2026-11-12
  quote: Con el fortalecimiento de capacidades de 27 funcionarios guardarrecursos del Ministerio de Medio
    Ambiente y Recursos Naturales (MARN) y del Fondo de Inversión Ambiental de El Salvador (FIAES) en
    el uso de drones y herramientas digitales
