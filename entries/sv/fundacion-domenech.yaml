summary: Organisation reported to have worked on the Costa del Sol for over 18 years,
  with more than 1.3 million eggs incubated, and partnering with FIAES.
facts:
- claim: A report on elsalvador.com says the foundation has worked continuously on
    the Costa del Sol for more than 18 years and reports over 1.3 million eggs incubated.
  url: https://www.elsalvador.com/?p=1236621
  fetched: 2026-11-12
  quote: Fundación Doménech, con más de 18 años de trabajo continuo en la Costa del
    Sol, reporta resultados significativos
- claim: The report says the foundation tags nesting females for monitoring, alongside
    hatchery, education and mangrove and dune restoration work.
  url: https://www.elsalvador.com/?p=1236621
  fetched: 2026-11-12
  quote: La fundación además impulsa procesos de educación ambiental, fortalecimiento
    de corrales de incubación, marcaje de hembras anidantes para monitoreo
- claim: Diario El Mundo reported in January 2026 that in Jaltepeque FIAES and the
    foundation work on incubating over 40,000 eggs and tagging 100 turtles.
  url: https://diario.elmundo.sv/nacionales/fiaes-libera-8-5-millones-de-tortugas-marinas-recien-nacidas-en-playas-salvadorenas
  fetched: 2026-11-12
  quote: Uno de los proyectos clave es el que se ejecuta en Jaltepeque, donde FIAES
    y Fundación Doménech trabajan en la incubación de más de 40,000 huevos, liberación
    de 32,000 neonatos, marcaje de 100 tortugas
