summary: An active initiative, led by the ministry with CATIE, developing monitoring tools for the ecological
  status of forests and coffee agroecosystems; the ministry plans to expand sampling and design an MRV
  system.
facts:
- claim: A June 2025 report says the initiative develops monitoring tools to assess the ecological status
    of forests and coffee agroecosystems.
  url: https://elsalvadorinenglish.com/2025/06/24/el-salvador-builds-national-ecological-condition-index/
  fetched: 2026-11-12
  quote: El Salvador is advancing its efforts to evaluate the ecological status of forests and coffee
    agroecosystems , through the development of specialized monitoring tools and inter-institutional cooperation.
- claim: Workshops set ecological reference thresholds using National Forest Inventory data; the ministry
    plans to expand sampling and design an MRV system for the index.
  url: https://elsalvadorinenglish.com/2025/06/24/el-salvador-builds-national-ecological-condition-index/
  fetched: 2026-11-12
  quote: MARN will now move to expand sampling coverage across the country , validate ecological data,
    and design a Monitoring, Reporting, and Verification (MRV) system to implement a national ecological
    condition index.
