summary: El Salvador's Convention on Biological Diversity focal point reportedly expanded camera trap
  monitoring; 27 ministry and FIAES rangers received drone training in November 2022.
facts:
- claim: A UNDP strategy document on biodiversity inventory and monitoring in El Salvador says the ministry
    is the country's focal point for the Convention on Biological Diversity.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/sv/UNDP_SVEstrategia_Inventarios_y_Monitore_de_la_Biodiverisdad.pdf
  fetched: 2026-11-12
  quote: El Punto Focal de este convenio en el país es el MARN
- claim: El Salvador's sixth national report to the Convention on Biological Diversity carries the ministry's
    name.
  url: https://www.cbd.int/doc/nr/nr-06/sv-nr-06-es.pdf
  fetched: 2026-11-12
  quote: Sexto Informe Nacional al Convenio sobre la Diversidad Biológica de El Salvador
- claim: A press report of January 2023 says the ministry expanded its wildlife monitoring network by
    installing camera traps in protected natural areas.
  url: https://lapagina.com.sv/?p=348834
  fetched: 2026-11-12
  quote: El Ministerio de Medio Ambiente y Recursos Naturales (MARN) amplió la red de monitoreo de fauna
    silvestre, a través de la instalación de cámaras trampa
- claim: The ministry said its own technical staff and rangers place the camera traps in protected natural
    areas.
  url: https://lapagina.com.sv/?p=348834
  fetched: 2026-11-12
  quote: Nuestro equipo técnico y de guardarrecursos se encarga de colocarlas en puntos estratégicos dentro
    de las Áreas Naturales Protegidas
- claim: IUCN reports that in November 2022 27 rangers of the ministry and of FIAES were trained in using
    drones and digital tools for biological monitoring and surveillance.
  url: https://iucn.org/es/node/38343
  fetched: 2026-11-12
  quote: Con el fortalecimiento de capacidades de 27 funcionarios guardarrecursos del Ministerio de Medio
    Ambiente y Recursos Naturales (MARN) y del Fondo de Inversión Ambiental de El Salvador (FIAES) en
    el uso de drones y herramientas digitales
