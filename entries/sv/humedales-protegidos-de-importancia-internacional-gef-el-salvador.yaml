  quote: Nueve alcaldías de la zona oriental y la Asociación Los Nonualcos recibieron
    equipo tecnológico para monitorear amenazas y detectar riesgos de desastres
- claim: The page names the wetlands as Jiquilisco Bay, Laguna de Olomega and Laguna
    El Jocotal.
