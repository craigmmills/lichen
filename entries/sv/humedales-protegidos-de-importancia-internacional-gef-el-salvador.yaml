summary: Environment ministry project supported by UNDP and funded by GEF, reported
  in July 2018 to have provided municipalities and an association with equipment for
  monitoring wetland threats and risks.
facts:
- claim: UNDP reported in July 2018 that nine municipalities and the Asociación Los
    Nonualcos received technology equipment to monitor threats and disaster risks
    and follow the sustainable management of protected wetlands of international importance.
  url: https://www.undp.org/es/node/282541
