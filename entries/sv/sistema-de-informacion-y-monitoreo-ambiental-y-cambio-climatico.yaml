summary: An active ministry-built platform gathering environmental maps, indicators and databases, presented
  on 12 August and made official in September 2026, which the ministry says uses AI as support and not
  a replacement for specialists.
facts:
- claim: A press report says the platform gathers environmental maps, indicators and databases and incorporates
    artificial intelligence and territorial analysis tools.
  url: https://www.elsalvador.com/?p=1295589
  fetched: 2026-11-12
  quote: El SIMACC reúne mapas, indicadores y bases de datos ambientales de El Salvador en una plataforma
    que incorpora inteligencia artificial y herramientas de análisis territorial.
- claim: The platform holds information on the ecological condition of land, used as a baseline for assessing
    human impacts and prioritising areas for biodiversity management.
  url: https://www.elsalvador.com/?p=1295589
  fetched: 2026-11-12
  quote: La plataforma reúne información sobre la condición ecológica de los territorios, utilizada como
    línea base para evaluar impactos de actividades humanas y apoyar la priorización de áreas para gestión
    ambiental y biodiversidad.
- claim: The system was presented on 12 August and its creation was made official by an agreement published
    in the Diario Oficial on 7 September 2026.
  url: https://www.elsalvador.com/?p=1295589
  fetched: 2026-11-12
  quote: el Acuerdo No. 198 sobre la creación y oficialización del SIMACC fue publicado en el Diario Oficial
    del 7 de septiembre de 2026.
- claim: The ministry says the AI serves as a support tool and does not replace specialists' analysis
    or the authorities' decisions.
  url: https://www.elsalvador.com/?p=1295589
  fetched: 2026-11-12
  quote: La institución aclara que la inteligencia artificial funciona como herramienta de apoyo y no
    reemplaza el análisis de especialistas ni las decisiones de las autoridades.
