summary: Federal authority for biodiversity and landscape that runs Switzerland's landscape
  and biodiversity monitoring programmes and announced a November 2025 conference in Bern
  on AI in environmental observation.
facts:
- claim: Responsible for the sustainable use of natural resources and the preservation of
    biodiversity.
  url: https://www.bafu.admin.ch/en/biodiversity-international-affairs
  quote: The FOEN is responsible for the sustainable use of natural resources such as air,
    water, soil, and forests, for the climate policy, the protection against natural hazards
    and for the preservation of biodiversity.
  fetched: '2026-11-02'
