summary: An active programme serving as Switzerland's national contact point for satellite
  data users, which sells images and created free Sentinel-2 mosaics of Switzerland for 2017
  to 2020.
facts:
- claim: Sells satellite images from around the world to customers.
  url: https://www.swisstopo.admin.ch/en/satellite-images
  quote: Through the National Point of Contact for Satellite Images (NPOC), customers can
    purchase high-quality satellite images from around the world.
  fetched: '2026-11-02'
- claim: Has created free Sentinel-2 mosaics of Switzerland for 2017 to 2020.
  url: https://www.swisstopo.admin.ch/en/satellite-images
  quote: The NPOC has created freely available satellite image mosaics of 2017, 2018, 2019
    and 2020 of Switzerland and its surroundings from Sentinel-2 data
  fetched: '2026-11-02'
- claim: The national contact point for users of satellite data in Switzerland.
  url: https://www.npoc.ch/en/about
  fetched: '2026-11-02'
  quote: is the national contact point for authorities, the private sector, researchers and
    all other users of satellite data in Switzerland.
- claim: Created freely available Sentinel-2 mosaics of Switzerland for 2017 to 2020.
  url: https://www.swisstopo.admin.ch/en/satellite-images
  fetched: '2026-11-02'
  quote: The NPOC has created freely available satellite image mosaics of 2017, 2018, 2019
    and 2020 of Switzerland
