summary: An in-progress project, started 7 May 2025 and led by Silke Bauer with four partners,
  aiming to advance radar biodiversity monitoring with a focus on insect identification.
facts:
- claim: Aims to advance radar biodiversity monitoring, with a focus on insect identification.
  url: https://www.datascience.ch/projects/bioairad
  quote: BioAIRad aims to take the field of biodiversity monitoring using radars to the next
    level
  fetched: '2026-11-02'
- claim: Started on 7 May 2025 and listed as in progress.
  url: https://www.datascience.ch/projects/bioairad
  quote: Started May 7, 2025 Status In Progress
  fetched: '2026-11-02'
- claim: Airspace biodiversity monitoring relies on remote sensing such as radar.
  url: https://datascience.ch/projects/bioairad
  fetched: '2026-11-02'
  quote: Biodiversity monitoring of this important yet largely overlooked habitat can only
    be achieved with remote-sensing technology such as radars.
- claim: Aims to advance the taxonomic resolution of small-scale and weather radars and build
    predictive models of biomass flows.
  url: https://www.datascience.ch/projects/bioairad
  fetched: '2026-11-02'
  quote: by advancing the taxonomic resolution of small-scale and weather radars, with a particular
    focus on insect identification, and by developing interpolation and predictive models
    of bird and insect biomass flows
