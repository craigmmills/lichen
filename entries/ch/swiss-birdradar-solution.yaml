summary: A Winterthur company whose radar systems detect, classify, track and report aerial
  biomass in real time, sold to researchers collecting data on birds, bats and insects, and
  reported by it as deployed worldwide.
facts:
- claim: A Zenodo dataset record lists it in Winterthur.
  url: https://zenodo.org/record/5734961
  quote: Swiss Birdradar Solution AG, Winterthur, Switzerland
  fetched: '2026-11-02'
- claim: The dataset lets BirdScan MR1 radar echoes be sorted into biological groups.
  url: https://zenodo.org/record/5734961
  quote: This dataset enables classification of the radar echoes acquired with a BirdScan
    MR1 into a number of biological groups of interests
  fetched: '2026-11-02'
- claim: Its radar systems detect, classify, track and report aerial biomass in real time.
  url: https://swiss-birdradar.com/
  quote: Our radar systems automatically detect, classify, track and report aerial biomass
    in real time.
  fetched: '2026-11-02'
- claim: Sells to researchers and institutes collecting data on birds, bats and insects.
  url: https://swiss-birdradar.com/
  quote: We offer compact solutions for researchers and institutes to collect scientific data
    on the movements of birds, bats and insects.
  fetched: '2026-11-02'
- claim: Its data repository serves the improvement of its analytics modules, including with
    machine learning.
  url: https://swiss-birdradar.com/reference-data-repository/
  quote: which serves the continuous improvement of our analytics modules including the use
    of state-of-the-art Machine Learning techniques
  fetched: '2026-11-02'
- claim: Says its systems have been deployed worldwide.
  url: https://swiss-birdradar.com/research-projects/
  quote: Our sytems have been deployed worldwide for research, environmental impact assessment
    and active curtailment of wind parks.
  fetched: '2026-11-02'
