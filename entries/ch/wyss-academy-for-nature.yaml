  suitability.
facts:
- claim: Its Bern Hub has run since 2020 and works on climate, biodiversity and land use.
  url: https://www.berninvest.be.ch/en/start/standort/innovationsoekosystem/wyss-academy-for-nature.html
  quote: The Wyss Academy for Nature’s Bern Hub has been operational since 2020.
  fetched: '2026-11-02'
- claim: Its Tambopata work includes monitoring territorial change.
  url: https://explorer.land/x/project/healthy_forests/about
  quote: Generating strategic knowledge and monitoring territorial change to inform conservation
    and decision-making through geospatial, socio-ecological and economic data.
  fetched: '2026-11-02'
- claim: Runs 60 projects around the world with researchers and local knowledge holders.
  url: https://www.wyssacademy.org/en
  quote: In currently 60 projects around the world, the Wyss Academy for Nature brings together
    researchers with local knowledge bearers and stakeholders
  fetched: '2026-11-02'
- claim: Its ID PES project returned landscape data from an aerial survey in Laikipia County
    to communities at a workshop in April 2026.
  url: https://www.wyssacademy.org/en/sharing-aerial-survey-data-with-communities-in-northern-kenya
  quote: the workshop drew on an aerial survey covering approximately a quarter of Laikipia
    County
  fetched: '2026-11-02'
- claim: A Biodiversa+ project page names it at the University of Bern.
  url: https://www.biodiversa.eu/2023/04/19/bridgingvalues/
  quote: Wyss Academy for Nature, University of Bern, Bern, Switzerland
  fetched: '2026-11-02'
- claim: Describes its work as a systemic approach to climate change, biodiversity loss and
    land use change.
  url: https://www.wyssacademy.org/en/about-us
  fetched: '2026-11-02'
  quote: offers a new, systemic approach to pressing issues at the intersection of climate
    change, biodiversity loss and land use change
- claim: Its aquatic biodiversity project page says a new approach using Explainable AI was
    developed to identify which environmental factors make a habitat suitable for a species.
  url: https://www.wyssacademy.org/en/preventing-biodiversity-loss-in-waterbodies-despite-climate-change
  fetched: '2026-11-02'
  quote: a new approach has been developed in this project using Explainable AI to help identify
    which environmental factors make a habitat good or bad for a species
- claim: Its Kenya connectivity project aims to protect wildlife movement routes through community
    land-use plans.
  url: https://www.wyssacademy.org/en/increased-habitat-connectivity
  fetched: '2026-11-02'
  quote: by protecting key wildlife movement routes and co-designing community land-use plans
