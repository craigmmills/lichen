summary: Zurich-registered reef restorer founded as an association in 2020 that installed
  820 3D-printed terracotta modules in Pujada Bay, Philippines, and monitors reefs
  six-monthly for three years.
facts:
- claim: Rebuilds degraded coral reefs with modular 3D-printed clay structures and
    manages the process from design to scientific monitoring.
  url: https://www.rrreefs.com/faq/
  fetched: 2026-11-22
  quote: We rebuild and regenerate degraded coral reefs using modular 3D-printed clay
    structures that create habitats for marine life.
- claim: Handles design, production, installation and scientific monitoring of its
    reefs with local partners.
  url: https://www.rrreefs.com/faq/
  fetched: 2026-11-22
  quote: We manage the process from design and production to installation and scientific
    monitoring, always working closely with local partners.
- claim: Built a reef of 820 3D-printed terracotta modules in Pujada Bay, Philippines,
    a marine protected area declared in 1994.
  url: https://www.rrreefs.com/projects/pujada-bay-philippines/
  fetched: 2026-11-22
  quote: The project spans over 100 m² with 820 3D-printed modules made from terracotta
    clay.
- claim: Monitors reef sites every six months over three years with standardised ecological
    surveys.
  url: https://www.rrreefs.com/faq/
  fetched: 2026-11-22
  quote: Reef sites are monitored every six months across a three-year period using
    standardized ecological surveys to assess coral growth, fish abundance, biodiversity,
    and overall reef health.
- claim: Works at reef sites in Ecuador, Colombia, the British Virgin Islands, the
    Philippines and the Maldives through local partnerships.
  url: http://rrreefs.com
  fetched: 2026-11-22
  quote: Through local partnerships, our projects span from Ecuador, Colombia, the
    British Virgin Islands, the Philippines, and the Maldives.
- claim: Founded in 2020 and became an impact-driven business by 2023.
  url: http://rrreefs.com
  fetched: 2026-11-22
  quote: Founded in 2020 by Ulrike, Marie, Hanna and Josephine with backgrounds in
    science, art, and economics, rrreefs evolved from an association into an impact-driven
    business by 2023.
- claim: Registered as rrreefs AG with an address in Zurich.
  url: http://rrreefs.com
  fetched: 2026-11-22
  quote: rrreefs AG (Switzerland)
