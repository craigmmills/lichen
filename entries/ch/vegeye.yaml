summary: Project led by Jasmin Joshi and run by OST that developed drone image analysis, combining
  RGB and multispectral imagery, to identify invasive goldenrod stands; its page reports late
  goldenrod on 10% of the Kaltbrunner Riet.
facts:
- claim: Developed drone image analysis to identify invasive goldenrod stands, combining RGB
    and multispectral imagery; the page reports that 10% of the Kaltbrunner Riet was occupied
    by late goldenrod.
  url: https://www.ost.ch/de/forschung-und-dienstleistungen/interdisziplinaere-themen/icai-interdisciplinary-center-for-artificial-intelligence/ai-projekte-der-ost/vegeye-findet-und-kontrolliert-invasive-neophyten-aus-der-luft
  fetched: '2026-11-02'
  quote: Die kombinierte Bildanalyse hingegen führt zu einer sehr präzisen Klassifizierung
    und zeigt, dass das Kaltbrunner Riet zu 10% mit der Spätblühenden Goldrute besetzt ist.
- claim: OST says VegEye created the conditions for monitoring invasive plants from the air
