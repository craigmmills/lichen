summary: Swiss agricultural research centre, affiliated with the Federal Office for Agriculture,
  that builds ALL-EMA and aims to develop biodiversity recording with remote sensing, AI,
  insect radar and acoustic ecology.
facts:
- claim: Develops foundations for preserving biodiversity in agricultural environments.
  url: https://www.agroscope.admin.ch/en/all-ema-agricultural-species-and-habitats-monitoring-programme
  quote: Agroscope develops foundations for preserving biodiversity in agricultural environments
    and maintaining diverse agricultural landscapes.
  fetched: '2026-11-02'
- claim: Swiss centre of excellence for agricultural research, affiliated with the Federal
    Office for Agriculture.
  url: https://www.agroscope.admin.ch
  quote: Agroscope is the Swiss centre of excellence for agricultural research, and is affiliated
    with the Federal Office for Agriculture (FOAG).
  fetched: '2026-11-02'
- claim: Its researchers tested analysing drone images with deep learning to tell bee nest
    mounds from other soil deposits.
  url: https://www.agroscope.admin.ch/en/counting-wild-bee-nests-with-camera-drones
  quote: Agroscope researchers tested the feasibility of analysing drone images with Deep
    Learning to distinguish bee tumuli
  ai_type: deep-learning
  fetched: '2026-11-02'
- claim: An Agroscope team uses Earth observation with drones and satellites, read with process
    models and machine learning.
  url: https://www.agroscope.admin.ch/en/earth-observation-of-agroecosystems
  quote: We use local-to-continental-scale Earth Observation (EO) technology with a focus
    on drones for ecophysiological experiments and satellites for continental-scale monitoring.
  fetched: '2026-11-02'
- claim: A research programme aims to combine existing datasets with advanced environmental
    monitoring and AI methods to analyse the Swiss agroecosystem.
  url: https://www.agroscope.admin.ch/en/36-spatial-data-science-and-ai-for-the-analysis-of-agroecosystems-impacted-by-climate-and-land-use-changes
