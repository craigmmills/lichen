  quote: 01.12.2013 – 22.08.2018 Partner Ministry of Natural Resources and Environment
- claim: GIZ reported during the 2013–2018 project that the Spatial Monitoring and
    Reporting Tool had come into regular use and was helping improve management of
    the protected area.
  url: https://www.giz.de/en/projects/hin-nam-no-national-parc-ii
  fetched: 2026-11-13
  quote: The ‘Spatial Monitoring and Reporting Tool’, a participatory instrument for
    monitoring biodiversity, is now used regularly and is helping to improve the management
    of the protected area.
- claim: During the 2013–2018 project, GIZ reported that it had helped train 110 officially
    recognised village rangers to monitor indicator species and threats in Hin Nam
    No.
  url: https://www.giz.de/en/projects/hin-nam-no-national-parc-ii
  fetched: 2026-11-13
  quote: The project has assisted with the training of 110 officially recognised village
    rangers. These people are now able to monitor the indicator species and threats
    in Hin Nam No.
