facts:
- claim: GIZ lists the project's runtime as 1 December 2013 to 22 August 2018, with
    BMZ as client and the Ministry of Natural Resources and Environment as partner.
  url: https://www.giz.de/en/projects/hin-nam-no-national-parc-ii
