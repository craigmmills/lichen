summary: Conservation organisation in Vientiane that has supported government management of Nam Et-Phou
  Louey National Park since 2003, including wildlife research and monitoring, and works on wildlife health
  surveillance and trade.
facts:
- claim: Has supported the government to manage Nam Et-Phou Louey National Park since 2003, with activities
    including wildlife research and monitoring.
  url: https://laos.wcs.org/Saving-Wildlife/Tiger.aspx
  fetched: 2026-11-12
  quote: Tiger conservation activities supported by WCS have included law enforcement, community outreach,
    wildlife research and monitoring, and ecotourism.
- claim: Says tigers in Lao PDR have recently been confirmed only by camera trap photos and genetic analysis
    of scat from Nam Et-Phou Louey National Park.
  url: https://laos.wcs.org/Saving-Wildlife/Tiger.aspx
  fetched: 2026-11-12
  quote: recent confirmation only by camera trap photos (such as the one above) and genetic analysis of
    scat from one location in the country, the Nam Et-Phou Louey National Park
- claim: Works on wildlife health surveillance and wildlife trade with the Lao government.
  url: https://laos.wcs.org/Saving-Wildlife/Tiger.aspx
  fetched: 2026-11-12
  quote: WCS seeks to counter wildlife trade in tigers and other animals through its efforts in wildlife
    health surveillance and wildlife trade programs in partnership with the Lao government
