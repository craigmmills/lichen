summary: Satellite-based deforestation monitoring tool, built and run by JICA, in use in 15 of 18 provinces
  in 2024 and upgraded in 2026 with fire data, detecting 16,395 active fires by mid-March.
facts:
- claim: Uses remote sensing and satellite imagery to monitor deforestation in near real time.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20240524.html
  fetched: 2026-11-12
  quote: The PDMS uses advanced remote sensing technology and satellite imagery to monitor deforestation
    in near-real time.
- claim: Approved by the Ministry of Agriculture and Forestry as an official forest monitoring tool.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20240524.html
  fetched: 2026-11-12
  quote: The Ministry of Agriculture and Forestry of Lao People’s Democratic Republic (PDR) has approved
    the Provincial Deforestation Monitoring System (PDMS) as an official forest monitoring tool.
- claim: In 2024 it was in operation in 15 of Laos's 18 provinces, with the cooperation of the World Bank,
    Germany and NGOs.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20240524.html
  fetched: 2026-11-12
  quote: It is currently in operation in 15 of the 18 provinces in Laos, with the cooperation of other
    donors such as the World Bank, Germany and NGOs.
- claim: Upgraded in 2026 with active fire data from NASA VIIRS and Himawari satellites; between January
    and mid-March 2026 it detected 16,395 active fires and sends fire alerts to local forest officials.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/1582146_63247.html
  fetched: 2026-11-12
  quote: In fact, between January and mid-March 2026, the PDMS successfully detected 16,395 active fires
    across the country, providing figures that have even been used in official government reports.
- claim: Hosted on the NFMS server operated by the Department of Forestry's Forest Inventory and Planning
    Division.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20231020.html
  fetched: 2026-11-12
  quote: the PDMS service, which is being introduced and utilized nationwide, are also hosted on the NFMS
    server operated by the FIPD
