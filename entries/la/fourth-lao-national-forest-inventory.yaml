summary: Closed national forest inventory run by the Department of Forestry, launched
  October 2024 with preliminary results in September 2025, collecting data on forest
  resources and biodiversity, with World Bank, GIZ and JICA funding.
facts:
- claim: JICA reports that the Department of Forestry completed its fourth National
    Forest Inventory, which collects and analyses data on forest resources and biodiversity.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/1577855_63247.html
  fetched: 2026-11-13
  quote: The Department of Forestry (DOF) of the Lao People’s Democratic Republic
    (Lao PDR) has successfully completed its fourth National Forest Inventory (NFI).
    The NFI serves as a foundation for Laos to collect and analyze data on forest
    resources and biodiversity
- claim: Launched in October 2024, with preliminary results presented in September
    2025; earlier inventories were in the 1990s, 2016 and 2019.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/1577855_63247.html
  fetched: 2026-11-13
  quote: Launched in October 2024, the preliminary results were presented in September
    2025.
- claim: The Forest Inventory and Fire Protection Division led the fieldwork and data
    analysis with nine teams across the country.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/1577855_63247.html
  fetched: 2026-11-13
  quote: The Forest Inventory and Fire Protection Division (FIFPD) led the fieldwork
    and data analysis, deploying nine teams across the country.
