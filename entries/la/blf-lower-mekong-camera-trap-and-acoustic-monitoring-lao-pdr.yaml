summary: Active camera trap and acoustic monitoring work within the DEFRA-funded Biodiverse Landscapes
  Fund Lower Mekong project, run by FFI and IUCN, which has trained government staff and community members
  since 2023.
facts:
- claim: Part of the Biodiverse Landscapes Fund Lower Mekong project, funded by UK DEFRA and implemented
    by FFI, SNV and IUCN since 2023, which has trained dozens of government staff and community members
    in camera trapping and acoustic monitoring.
  url: https://iucn.org/story/202601/eyes-forest-how-camera-traps-empower-people-and-protect-biodiversity-lao-pdr
  fetched: 2026-11-12
  quote: This is a part of the Biodiverse Landscapes Fund (BLF) Lower Mekong project funded by the UK's
    Department for Environment, Food and Rural Affairs (UK DEFRA), and implemented by FFI, SNV, and IUCN
    since 2023.
- claim: Trainees learned to deploy cameras and AudioMoth devices and to use ArcGIS Survey123 for data
    collection.
  url: https://iucn.org/story/202601/eyes-forest-how-camera-traps-empower-people-and-protect-biodiversity-lao-pdr
  fetched: 2026-11-12
  quote: This training equipped participants with the skills to deploy cameras and AudioMoth devices and
    use ArcGIS Survey123 for data collection and management.
- claim: Sites include Hin Nam No National Park, Yod Nam Mo-Phou Samsoum National Protected Area and the
    Phou Louang, Phou Khao Nok and Namkong-Xexu national protection forests.
  url: https://iucn.org/story/202601/eyes-forest-how-camera-traps-empower-people-and-protect-biodiversity-lao-pdr
  fetched: 2026-11-12
  quote: This training has empowered local rangers and villagers working as biodiversity guardians in
    Hin Nam No National Park in Khammouane Province
