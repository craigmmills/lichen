summary: According to JICA, its official forest maps support REDD+ MRV; WWF-Laos says it will lead implementation
  of the National Tiger Recovery Action Plan.
facts:
- claim: JICA says the server operated by the Department of Forestry's Forest Inventory and Planning Division
    stores the official forest type and forest change maps owned by the department and used for REDD+
    MRV.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20231020.html
  fetched: 2026-11-12
  quote: The server operated by the Forest Inventory and Planning Division (FIPD) of the Department of
    Forestry (DOF) in Lao PDR has a database that stores and manages official versions of many spatial
    information data, such as forest type maps and forest change maps, owned by DOF and used for REDD+
    MRV.
- claim: The NFMS web portal and the Provincial Deforestation Monitoring System are hosted on the NFMS
    server operated by the Forest Inventory and Planning Division.
  url: https://www.jica.go.jp/oda/project/201904177/en_news/20231020.html
  fetched: 2026-11-12
  quote: are also hosted on the NFMS server operated by the FIPD
- claim: WWF-Laos says implementation of the National Tiger Recovery Action Plan will be led by the Department
    of Forestry.
  url: https://www.wwf.org.la/?396601/
  fetched: 2026-11-12
  quote: Implementation will be led by the Department of Forestry in partnership with conservation organizations
    in Laos, including WWF.
- claim: A 2026 Lao PDR submission to AFoCO says that after the government restructuring the Department
    of Forestry sits under the new Ministry of Agriculture and Environment.
  url: https://media.afocosec.org/2026/06/A-25-13-02-Agenda-3-Information-on-the-List-of-Parties-and-Observers-Promotion-of-Membership-Relations_Annex-4_Lao-PDR.pdf
  fetched: 2026-11-12
