summary: Active WCS Laos programme with local communities at the Xe Champhone Ramsar
  site; IUCN reported in February 2025 that 115 crocodiles had been released and were
  monitored, including by drone.
facts:
- claim: IUCN reported in February 2025 that WCS had worked with local communities
    near the Xe Champhone Ramsar site for over a decade to conserve the Siamese crocodile.
  url: https://iucn.org/node/43372
  fetched: 2026-11-13
  quote: Here, the Wildlife Conservation Society (WCS) have been working with the
    local communities for over a decade to conserve the species
- claim: IUCN reported in February 2025 that 115 crocodiles had been released into
    the surrounding wetland and were being monitored by locals and WCS Laos.
  url: https://iucn.org/node/43372
  fetched: 2026-11-13
  quote: 115 crocodiles have been successfully released back into the surrounding
    wetland, where they’re closely monitored by the locals and WCS Laos.
- claim: IUCN reported in February 2025 that WCS used drones with cameras to monitor
    the crocodiles and their use of different habitats through the seasons.
  url: https://iucn.org/node/43372
  fetched: 2026-11-13
  quote: WCS uses drones equipped with cameras to monitor the crocodiles and assess
    how they use different habitats during seasonal changes.
- claim: WCS reported on 21 January 2026 that annual nest surveys indicate the Xe
    Champhone wetland complex holds one of the largest remaining wild Siamese crocodile
    populations in mainland Southeast Asia.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/25829/Community-Led-Conservation-in-Laos-Is-Bringing-One-of-the-Worlds-Rarest-Crocodiles-Back-from-the-Brink.aspx
  fetched: 2026-11-13
  quote: Annual nest surveys indicate the wetland complex supports one of the largest
    remaining wild populations of Siamese crocodiles in mainland Southeast Asia.
