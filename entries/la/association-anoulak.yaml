summary: French-registered association, registered in September 2014, working on biodiversity
  conservation in Laos; its 2019 partnership with Nakai-Nam Theun National Park closed
  in May 2025, and from 2026 it emphasises education and capacity-building.
facts:
- claim: Says it is a French-registered association, registered in September 2014,
    working on biodiversity conservation in Laos.
  url: https://www.conservationlaos.com/about/about-project-anoulak/
  fetched: 2026-11-15
  quote: Association Anoulak ( conservation in Lao language) is a French-registered
    association (registered in September 2014)
- claim: Its research page describes a long-term wildlife monitoring programme using
    systematic camera-trapping in collaboration with the Nam Theun 2 Watershed Management
    and Protection Authority; its 2026 update says the park MoU closed in 2025 and
    its activities shifted toward capacity-building.
  url: https://www.conservationlaos.com/our-projects/biodiversity-research-and-monitoring-for-conservation/
  fetched: 2026-11-15
  quote: a long-term wildlife monitoring program using systematic camera-trapping
    methodology
- claim: Lists environmental DNA surveys, large-scale ground camera-trap surveys and
    elephant population monitoring among the work it led or supported over its 2019
    to 2025 partnership with the park.
  url: https://www.conservationlaos.com/celebrating-7-years-of-conservation-impact-association-anoulak-and-nakai-nam-theun-national-park-conclude-mou-partnership/
  fetched: 2026-11-15
  quote: Environmental DNA (eDNA) surveys
- claim: Its MoU with Nakai-Nam Theun National Park closed in May 2025, after running
    from 2019.
  url: https://www.conservationlaos.com/celebrating-7-years-of-conservation-impact-association-anoulak-and-nakai-nam-theun-national-park-conclude-mou-partnership/
  fetched: 2026-11-15
  quote: On 13 May 2025, Association Anoulak hosted a closing meeting to mark the
    successful conclusion of a seven-year Memorandum of Understanding (MoU) with Nakai-Nam
    Theun National Park (NNT NP), running from 2019 to 2025.
- claim: Says that from 2026 it places particular emphasis on education, awareness-raising
    and capacity-building.
  url: https://www.conservationlaos.com/about/about-project-anoulak/
  fetched: 2026-11-15
  quote: The Association therefore places particular emphasis on education, awareness-raising,
    support, and capacity-building initiatives.
- claim: Describes a gibbon survey method using digital recorders with synchronised
    clocks and multiple microphones for acoustic spatial capture-recapture.
  url: https://www.conservationlaos.com/our-projects/biodiversity-research-and-monitoring-for-conservation/
  fetched: 2026-11-15
  quote: using acoustic spatial capture-recapture methods
