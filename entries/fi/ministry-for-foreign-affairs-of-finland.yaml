summary: A ministry whose March 2026 release cites an evaluation finding 6.7 million hectares
  of forest protected, restored or sustainably managed in 2010 to 2024 with Finnish support,
  with biodiversity objectives included only from 2023.
facts:
- claim: Its March 2026 release says an independent evaluation of cooperation from 2010 to
    2024 found that, with Finland's support, 6.7 million hectares of forest were protected,
    restored and sustainably managed.
  url: https://um.fi/current-affairs/-/asset_publisher/gc654PySnjTX/content/arviointi-suomen-ymparisto-ja-luonnonvarayhteistyo-tuottanut-kehitystuloksia-ja-yrityskumppanuuksia/35732
  fetched: '2026-11-02'
  quote: with Finland’s support, 6.7 million hectares of forest have been protected, restored,
    and sustainably managed
- claim: The release says biodiversity objectives were included only from 2023 and were less
    well integrated into bilateral programmes.
  url: https://um.fi/current-affairs/-/asset_publisher/gc654PySnjTX/content/arviointi-suomen-ymparisto-ja-luonnonvarayhteistyo-tuottanut-kehitystuloksia-ja-yrityskumppanuuksia/35732
  fetched: '2026-11-02'
  quote: Biodiversity objectives, included only from 2023 onwards, were less well integrated
    into Finland’s bilateral programmes.
- claim: In a June 2017 article, its forest adviser said funding had been conditional on data
    being available to all who need it.
  url: https://um.fi/current-affairs/-/asset_publisher/gc654PySnjTX/content/metsia-kartoitetaan-suomalaislahtoisella-metodilla-jo-kymmenissa-maissa
  fetched: '2026-11-02'
  quote: Our funding has always been based on the condition that all material and data will
    be available to all those who need it
- claim: Says FAO and Finland launched a joint pilot project in five countries in 2009.
  url: https://um.fi/current-affairs/-/asset_publisher/gc654PySnjTX/content/metsia-kartoitetaan-suomalaislahtoisella-metodilla-jo-kymmenissa-maissa
  fetched: '2026-11-02'
  quote: FAO and Finland launched a joint pilot project in five countries, Tanzania, Ecuador,
    Zambia, Peru and Vietnam in 2009
