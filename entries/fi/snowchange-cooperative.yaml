facts:
- claim: The Ecologist describes it as a non-profit organisation based in Finland with members
    across the Arctic.
  url: https://theecologist.org/2019/dec/16/rewilding-finland-after-mining
  fetched: '2026-11-02'
  quote: a non-profit organisation based in Finland with members across the Arctic
- claim: The Ecologist says local fishermen had close relationships with it through endemic
    monitoring projects.
  url: https://theecologist.org/2019/dec/16/rewilding-finland-after-mining
  fetched: '2026-11-02'
  quote: having already developed close relationships through the endemic monitoring projects.
- claim: Says it owns 8,500 hectares of recovering lands.
  url: https://www.snowchange.org/re-wilding-actions-in-finland-snowchange-hq-in-selkie
  fetched: '2026-11-02'
  quote: In total Snowchange owns 8500 hecateres of recovering lands
- claim: The Landscape Rewilding Programme is led by the Finland-based non-profit Snowchange
    Cooperative.
  url: https://www.landscaperewilding.org/
  quote: The initiative is led by the Finland based non-profit Snowchange Cooperative.
  fetched: '2026-11-02'
- claim: Each rewilding site is to be inventoried with GHG data, species and vegetation surveys
    and limnological stocktaking.
  url: https://www.landscaperewilding.org/
  quote: Each Snowchange Rewilding site will be inventoried using scientific analysis, including
    GHG data, species of relevance, vegetation surveys and limnological stocktaking.
  fetched: '2026-11-02'
- claim: Has Linnunsuo as its flagship site, a 180-hectare restored wetland and peatland that
    is home to 200 bird species.
  url: https://www.maisema.org/
  quote: Our flagship site is Linnunsuo, ‘marshmire of birds’, a 180-hectare restored wetland
    and peatland which is also a home to 200 species of birds
  fetched: '2026-11-17'
