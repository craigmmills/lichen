summary: Says it collects and shares forest information and monitors forest laws; a staff
  member reported six-year nationwide inventories to Esri, and it partners with KOKO Forest.
facts:
- claim: A staff member told Esri that it collects forest data nationwide in a continuous
    inventory on a six-year cycle.
  url: https://www.esri.com/about/newsroom/blog/finland-enhances-forest-data-accuracy-for-automation
  fetched: '2026-11-02'
  quote: We conduct a continuous inventory that cycles through the entire forest every six
    years.
- claim: According to the Aalto Startup Center, KOKO Forest supplies it with forest insect
    damage data, which it distributes to private forest owners.
  url: https://startupcenter.aalto.fi/meet-our-startup-koko-forest-has-eyes-on-the-worlds-forests
  fetched: '2026-11-02'
  quote: the company has become a national supplier of forest insect damages data, which the
    Forest Centre distributes to private forest owners.
- claim: Says it collects and shares information on Finnish forests and monitors compliance
    with forest laws.
  url: https://www.metsakeskus.fi/en/about-us/the-finnish-forest-centre
  quote: The Finnish Forest Centre collects and shares information on Finnish forests.
  fetched: '2026-11-02'
- claim: Says its forest resource information covers habitats and habitats of special importance.
  url: https://www.metsakeskus.fi/en/about-us/the-finnish-forest-centre
  quote: Forest resource information includes information on, for example, forest habitats
    and tree stands, habitats of special importance, and forest use.
  fetched: '2026-11-02'
- claim: Offers the free Metsään.fi service to forest owners.
  url: https://www.metsakeskus.fi/en/about-us/the-finnish-forest-centre
  quote: You can get basic information about your own forest by logging in to the free Metsään.fi
    service.
  fetched: '2026-11-02'
- claim: Forest resource information is collected from sample plots, airborne laser scanning
    and aerial photography.
  url: https://www.metsakeskus.fi/en/open-forest-and-nature-information/collection-of-forest-resource-information
  quote: Forest resource information is collected using a method that utilizes sample plot
    measurements as well as laser scanning from an aircraft and aerial photography.
  fetched: '2026-11-02'
