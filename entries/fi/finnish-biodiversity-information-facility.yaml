summary: Run by Luomus, it was established in 2012 according to Syke and reported
  about 47,000 species and 50 million occurrence records in its CoreTrustSeal application.
facts:
- claim: Describes itself as a digital, Internet-based service infrastructure for
    data management.
  url: https://info.laji.fi/en/frontpage/mission/
  fetched: '2026-11-02'
  quote: The Finnish Biodiversity Information Facility is a digital, Internet-based
    service infrastructure for data management.
- claim: Works with GBIF and provides all observation data in its data warehouse for
    international use.
  url: https://info.laji.fi/en/frontpage/mission/
  fetched: '2026-11-02'
  quote: FinBIF works in cooperation with the Global Biodiversity Information Facility
    (GBIF) and provides all observation data in its data warehouse for international
    use.
- claim: Describes itself as an open access data repository for researchers, government
    and the public.
  url: https://laji.fi/en
  quote: The Finnish Biodiversity Information Facility (FinBIF) is an open access
    data repository for researchers, government and the public.
  fetched: '2026-11-02'
- claim: Observations recorded with iNaturalist in Finland are added to it.
  url: https://laji.fi/en
  quote: Observations recorded with iNaturalist are added to FinBIF so that they are
    available for Finnish researchers, government and the public.
  fetched: '2026-11-02'
- claim: Syke says it was set up in 2012 as a national collaboration led by Luomus
    and joined the national research infrastructure roadmap in 2020.
  url: https://www.syke.fi/fi/projektit/finbif-firi2021
  quote: Vuonna 2020 Lajitietokeskus hyväksyttiin Suomen kansallisten tutkimusinfrastruktuurien
    tiekartalle.
  fetched: '2026-11-02'
- claim: Its FIRI project for 2021 to 2026 develops tools for identifying bird sounds
    with AI.
  url: https://info.laji.fi/en/sound-identification/
  quote: FinBIF FIRI project 2021-2026 developes tools for identifying bird sounds
    using AI.
  fetched: '2026-11-02'
- claim: Open access data repository for researchers, government and the public.
  url: https://laji.fi/en
  fetched: '2026-11-02'
  quote: is an open access data repository for researchers, government and the public
- claim: Says it held information on about 47,000 species and 50 million occurrence
    records in its CoreTrustSeal application.
  url: https://cms.laji.fi/wp-content/uploads/2024/04/CoreTrustSeal_Application_FinBIF.pdf
  fetched: '2026-11-02'
  quote: Currently FinBIF hosts information about c. 47.000 species and 50 million
    occurrence records
- claim: Observations recorded with iNaturalist Finland are added to FinBIF.
  url: https://laji.fi/en
  fetched: '2026-11-02'
  quote: Observations recorded with iNaturalist are added to FinBIF
