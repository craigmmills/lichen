summary: City authority that tested AI on satellite data in summer 2025 to identify overgrown
  lawns and invasive plants, and has used Crowdsorsa since 2024.
facts:
- claim: Tested AI on satellite data to identify overgrown lawns and invasive plants in summer
    2025.
  url: https://forumvirium.fi/en/release/satellite-data-and-ai-help-to-maintain-green-spaces-in-helsinki/
  fetched: '2026-11-02'
  quote: This summer, the City of Helsinki has been testing how artificial intelligence (AI)
    can improve the maintenance of green spaces.
- claim: Has used Crowdsorsa since 2024.
  url: https://www.hel.fi/en/news/fight-invasive-species-by-playing-a-mobile-game-once-again-and-make-money-at-the-same-time
  fetched: '2026-11-02'
  quote: Crowdsorsa has been in use in Helsinki since 2024
- claim: Says it joined the Muuttolintujen kevät citizen science project in spring 2024.
