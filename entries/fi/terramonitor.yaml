summary: Satellite and remote sensing data company, based in Helsinki, that says it uses AI
  and machine learning, and was a subcontractor in the ESA-funded, VTT-led Forest Digital
  Twin Component project.
facts:
- claim: A January 2019 Copernicus story said Terramonitor used AI to handle satellite datasets.
