  fetched: '2026-11-02'
  quote: We use AI to handle massive satellite data sets
- claim: The story says it developed a law enforcement tool on loggings for the Finnish Government
    and Finnish Forest Centre.
  url: https://sentinels.copernicus.eu/web/success-stories/-/copernicus-sentinel-2-supports-forestry-in-finland
  fetched: '2026-11-02'
  quote: Terramonitor has developed a law enforcement tool for the Finnish Government and
