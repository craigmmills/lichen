summary: Regional government responsible for supervising and managing Åland's nature reserves,
  which has drafted a decision and management plan for a Storskär-Kalhära reserve in Kökar
  and partners with BiodiverSea LIFE IP.
facts:
- claim: Under Åland's nature conservation law, supervision of nature reserves and natural
    monuments falls to the regional government, which also manages them.
  url: https://www.regeringen.ax/sites/default/files/law/code/k_s563-734_2024.pdf
  fetched: '2026-11-08'
  quote: Tillsynen över naturreservat och naturminnen
- claim: Has drafted a decision to set up the Storskär-Kalhära nature reserve in Kökar municipality,
    with a management plan.
  url: https://www.regeringen.ax/sites/default/files/attachments/article/Utkast_till_fredningsbeslut_och_forvaltningsplan_for_Storskar-Kalhara%2C_ALR_2024-7345.pdf
  fetched: '2026-11-08'
  quote: om inrättande av Storskär-Kalhära naturreservat i Kökar kommun
- claim: The draft management plan describes the area's known species, underwater habitats
    and habitat types that are important to conserve from European and national perspectives.
  url: https://www.regeringen.ax/sites/default/files/attachments/article/Utkast_till_fredningsbeslut_och_forvaltningsplan_for_Storskar-Kalhara%2C_ALR_2024-7345.pdf
  fetched: '2026-11-08'
  quote: I förvaltningsplanen beskrivs samtliga av områdets kända arter, undervattenshabitat
    och naturtyper
