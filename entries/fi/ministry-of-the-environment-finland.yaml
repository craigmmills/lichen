summary: A ministry hosting Finland's primary national focal point for the Convention on Biological
  Diversity, which funds Zonation and uses Metsähallitus's Uljas protected area systems, according
  to Metsähallitus.
facts:
- claim: The Convention on Biological Diversity lists its primary national focal point for
    Finland in the ministry's Department of the Natural Environment.
  url: https://www.cbd.int/countries/nfp?country=fi
  fetched: '2026-11-02'
  quote: Department of the Natural Environment/Biodiversity
- claim: Listed with a Helsinki address on the Convention on Biological Diversity focal points
    page.
  url: https://www.cbd.int/countries/nfp?country=fi
  fetched: '2026-11-02'
  quote: Aleksanterinkatu 7
- claim: Syke carried out a wreck remediation project on its behalf and names its Ahti Programme.
  url: https://www.syke.fi/en/projects/potentially-polluting-wrecks
  quote: The Finnish Environment Institute (Syke) launched a wreck remediation project in
    2019 on behalf of the Ministry of the Environment.
  fetched: '2026-11-02'
- claim: Metsähallitus says the Ministry uses its Uljas protected area information systems.
  url: https://www.metsa.fi/en/lands-and-waters/geographic-information/
  quote: these systems are used not only by Metsähallitus but also by the ELY Centres, the
    Finnish Environment Institute and the Ministry of the Environment.
  fetched: '2026-11-02'
- claim: Prepares issues on biodiversity, sustainable use of natural resources and environmental
    protection for the Government and Parliament.
  url: https://www.vesi.fi/en/water-topics/ministry-of-the-environment/
  quote: We prepare for the Government and Parliament issues that concern communities, the
    built environment, housing, biodiversity, sustainable use of natural resources and environmental
    protection.
  fetched: '2026-11-02'
- claim: Daily Finland reports that the ministry issued a press release on the national report
    to the Convention on Biological Diversity.
  url: https://www.dailyfinland.fi/national/48136/Faster-action-needed-to-reach-biodiversity-targets-report
  fetched: '2026-11-02'
  quote: said the Ministry of the Environment in a press release on Wednesday referring to
    the report
- claim: Daily Finland says the seventh report covers Finland's implementation of the 23 objectives
    of the Kunming-Montreal Global Biodiversity Framework.
  url: https://www.dailyfinland.fi/national/48136/Faster-action-needed-to-reach-biodiversity-targets-report
  fetched: '2026-11-02'
  quote: contains information on how Finland has implemented the 23 objectives of the Kunming–Montreal
    Global Biodiversity Framework
