summary: A map built by Metsä Group, based on open spatial data, that calculates biodiversity value by
  16 by 16 metre grid square within its Metsäverkko service for owner-members.
facts:
- claim: Based on open spatial data and calculates biodiversity value by 16 by 16 metre grid square.
  url: https://www.metsagroup.com/metsaforest/news-and-publications/releases/2025/metsa-groups-new-map-service-helps-address-biodiversity-in-forestry/
  fetched: '2026-11-02'
  quote: The nature value map is based on open spatial data and can be used to calculate the current biodiversity
    value of each part of every forest stand in Finland, i.e. of each grid square (16 x 16 m).
- claim: Part of the digital Metsäverkko service for owner-members.
  url: https://news.cision.com/metsa-group/r/metsa-group-s-new-map-service-helps-address-biodiversity-in-forestry%2Cc4276254
