  ai_type: digital-twins
- claim: Syke says it will enable digital modelling of whole water systems.
  url: https://www.syke.fi/en/about-us/news/new-flagship-research-project-secures-water-resources-digital-twins-syke-partner-innovative-research
  quote: The Digital Waters partnership will enable digital modelling of entire water systems
