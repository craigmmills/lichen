  fetched: '2026-11-02'
- claim: Syke lists AIWaterBio, on AI for automated monitoring of water quality and vegetation
    biodiversity, under research cooperation.
  url: https://www.syke.fi/en/projects/diwa
  quote: Artificial intelligence for automatized monitoring of water quality and vegetation
    biodiversity (AIWaterBio)
  fetched: '2026-11-02'
- claim: Enables a transition to digital representations of water systems, including ecosystem
    responses.
  url: https://digitalwaters.fi/about-us/
  quote: We enable the transition towards digital representations of real-world water systems
    (Digital Twins), reproducing hydrological storages, states, fluxes, and processes, as
    well as ecosystem responses.
  fetched: '2026-11-02'
- claim: Pioneering Domain-Informed Neural Networks that integrate physical principles into
