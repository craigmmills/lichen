summary: Independent research institution under the University of Helsinki, responsible for
  national natural history collections, and it coordinates most Finnish bird monitoring with
  BirdLife Suomi.
facts:
- claim: Says it is part of the University of Helsinki on the FinBIF site.
  url: https://info.laji.fi/en/frontpage/mission/
  fetched: '2026-11-02'
  quote: The Finnish Museum of Natural History is part of the University of Helsinki.
- claim: Says it is responsible for the Finnish national natural history collections and for
    associated research and teaching.
  url: https://www.helsinki.fi/en/luomus/research/research-infrastructures
  quote: Luomus is responsible for preserving, acquiring and displaying Finnish national natural
    history collections and carrying out associated research and teaching.
  fetched: '2026-11-02'
- claim: Keeps genomic resources collections of DNA extracts and animal tissue samples.
  url: https://www.helsinki.fi/en/luomus/research/research-infrastructures
  quote: Established in 2018, the Luomus genomic resources collections include DNA extracts
    stored in cryogenic freezers as well as animal tissue samples for future extraction.
  fetched: '2026-11-02'
- claim: Lists national monitoring of the flying squirrel under its observations and monitoring
    work.
  url: https://www.helsinki.fi/en/luomus
  quote: National monitoring of the flying squirrel
  fetched: '2026-11-02'
- claim: Coordinates most Finnish bird monitoring, in cooperation with BirdLife Suomi.
  url: https://www.birdlife.fi/suojelu/seuranta/
  quote: Suomessa valtaosaa linnustonseurannoista koordinoi Luonnontieteellinen keskusmuseo,
    joka toteuttaa seurantoja yhteistyössä BirdLife Suomen kanssa.
  fetched: '2026-11-02'
- claim: Independent research institution under the University of Helsinki.
  url: https://cms.laji.fi/wp-content/uploads/2024/04/CoreTrustSeal_Application_FinBIF.pdf
  fetched: '2026-11-02'
  quote: an independent research institution under the University of Helsinki
- claim: Its Ringing Centre coordinates bird ringing in Finland and maintains its databases.
  url: https://www.luomus.fi/en/bird-ringing
  fetched: '2026-11-02'
  quote: The Finnish Ringing Centre coordinates bird ringing activities in Finland. The centre
    is responsible for, among other things, the maintenance of databases
- claim: Gives its address as Pohjoinen Rautatiekatu 13, University of Helsinki.
  url: https://www.luomus.fi/en/bird-ringing
  fetched: '2026-11-02'
  quote: PO Box 17 (Pohjoinen Rautatiekatu 13)
