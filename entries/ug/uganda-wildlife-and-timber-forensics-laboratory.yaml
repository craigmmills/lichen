summary: Forensics laboratory at the Uganda Wildlife Education Center in Entebbe,
  built by UWA with Danish and UNODC funding, which in April 2026 planned full timber
  DNA analysis in the coming months.
facts:
- claim: UWA launched the Uganda Wildlife and Timber Forensics Laboratory at the Uganda
    Wildlife Education Center in Entebbe.
  url: https://ugandawildlife.org/news/uwa-strengthens-efforts-against-wildlife-crime-with-new-forensic-lab-at-entebbe-zoo/
  fetched: 2026-11-15
  quote: launching a new Uganda Wildlife and Timber Forensics Laboratory at the Uganda
    Wildlife Education Center (UWEC) – Entebbe Zoo
- claim: UWA's April 2026 announcement describes forensic services for identifying
    species and tracing origins, with full implementation of timber DNA analysis planned
    for the coming months.
  url: https://ugandawildlife.org/news/uwa-strengthens-efforts-against-wildlife-crime-with-new-forensic-lab-at-entebbe-zoo/
  fetched: 2026-11-15
  quote: In the coming months, the laboratory will fully implement timber DNA analysis,
    further enhancing Uganda’s capacity to combat forest-related crimes.
- claim: In April 2026, UWA said timber DNA analysis would be fully implemented in
    the coming months and that previously stalled cases were already advancing to
    court.
  url: https://ugandawildlife.org/news/uwa-strengthens-efforts-against-wildlife-crime-with-new-forensic-lab-at-entebbe-zoo/
