summary: Closed JRS-funded project led by Kabale University, which planned to gather bird,
  reptile and amphibian data in Albertine Rift papyrus wetlands and build models to identify
  priority sites for protection.
facts:
- claim: Plans to generate data on the distribution, abundance and habitat use of birds, reptiles
    and amphibians, focusing on Albertine Rift papyrus wetlands, to identify priority areas
    for protection and share the data through the Uganda National Biodiversity Databank and
    GBIF.
  url: https://sebu.kab.ac.ug/about-us/about-the-project/
  fetched: 2026-11-08
  quote: the data will be shared on data portals for the Uganda National Biodiversity Databank
    and GBIF.
- claim: Builds models to identify wetlands likely to support populations of papyrus endemic
    species.
  url: https://sebu.kab.ac.ug/about-us/about-the-project/
  fetched: 2026-11-08
  quote: Creating models to identify wetlands that are likely to support large and sustainable
    populations of papyrus endemic birds, reptiles, and amphibians.
- claim: The project site lists presenting proposed Key Biodiversity Areas to the national
    KBA coordination committee.
  url: https://sebu.kab.ac.ug/about-us/about-the-project/
  fetched: 2026-11-08
  quote: SEBU Project Presents Findings and Proposed Key Biodiversity Areas to National KBA
