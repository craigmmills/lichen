summary: Organisation that captured forest data in Masindi with RGB, LiDAR and multispectral
  drone cameras, in partnership with the Jane Goodall Institute, with processing by machine
  learning and AI planned by a partner.
facts:
- claim: Captured forest data in Masindi with RGB, LiDAR and multispectral drone cameras to
    assess canopy cover, canopy height and terrain.
  url: https://flyinglabs.org/blog/in-uganda-discovering-the-forest-for-the-trees
  fetched: 2026-11-08
  quote: Uganda Flying Labs welcomed the opportunity to support the vital cause of ecological
    analysis through tree monitoring in Masindi forests sub-county Kasenene and Nyamtonzi
    using DJI M300 with P1 RGB and LiDAR camera and P4 multispectral to capture the forest
    data.
- claim: The October 2022 blog says the organisation it calls “Restorer Eco” would share the
    data on its platform after processing it with machine learning and AI.
  url: https://flyinglabs.org/blog/in-uganda-discovering-the-forest-for-the-trees
  fetched: 2026-11-08
  quote: Hence Restorer Eco will share the data on their platform after manipulating it with
    machine learning (ML) and artificial intelligence (AI) applications to display various
    interactive maps.
