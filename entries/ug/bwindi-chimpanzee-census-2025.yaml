summary: Closed census, carried out in May and June 2025 with the park's gorilla census, that estimated
  about 426 chimpanzees in Bwindi Impenetrable National Park using line-transect nest counts over 320.9
  square kilometres.
facts:
- claim: The census estimated about 426 chimpanzees across Bwindi Impenetrable National Park.
  url: https://ugandawildlife.org/news/census-confirms-426-chimpanzees-in-bwindi-impenetrable-national-park/
  fetched: 2026-11-08
  quote: The 2025 Bwindi Chimpanzee Census has confirmed the presence of an estimated 426 chimpanzees
    widely distributed across Bwindi Impenetrable National Park
- claim: Carried out in May and June 2025, alongside the park's sixth mountain gorilla census.
  url: https://ugandawildlife.org/news/census-confirms-426-chimpanzees-in-bwindi-impenetrable-national-park/
  fetched: 2026-11-08
  quote: Conducted between May and June 2025, the census was led by the Jane Goodall Institute (JGI) Uganda
    in partnership with Uganda Wildlife Authority (UWA) and the Greater Virunga Transboundary Collaboration
    (GVTC), and implemented alongside the park
- claim: Used line-transect nest count methods over 320.9 square kilometres.
  url: https://ugandawildlife.org/news/census-confirms-426-chimpanzees-in-bwindi-impenetrable-national-park/
  fetched: 2026-11-08
  quote: Using standardized line-transect survey methods, including Standing Crop Nest Count and Marked
    Nest Count approaches, researchers surveyed 320.9 square kilometres across all four park sectors
