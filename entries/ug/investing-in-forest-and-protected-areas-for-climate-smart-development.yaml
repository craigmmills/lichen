summary: A World Bank-funded six-year project, approved by Parliament on 28 April
  2021 and planned for 37 districts, under which UWA invited bids for 11 drones and
  sought a wildfire detection feasibility study.
countries: []
facts:
- claim: Funded by the World Bank, the six-year project is planned primarily for 37
    districts surrounding 7 national parks, 4 wildlife reserves and 28 central forest
    reserves; Parliament approved it on 28 April 2021.
  url: https://ugandawildlife.org/uwa-projects/investing-in-forest-and-protected-areas-for-climate-smart-development-project/
  fetched: 2026-11-12
  quote: The 6-year project shall be implemented primarily in 37 districts surrounding
    7 National Parks, 4 Wildlife Reserves, and 28 Central Forest Reserves including
    the 16 Refugee host districts.
- claim: UWA invited bids to supply 11 drones under the project.
  url: https://ugandawildlife.org/uwa-projects/investing-in-forest-and-protected-areas-for-climate-smart-development-project/
  fetched: 2026-11-12
  quote: Uganda Wildlife Authority invites interested bidders to submit proposals
    for the supply of 11 units of drones and accessories under the Investing In Forest
    And Protected Areas For Climate Smart Development Project.
- claim: UWA sought a feasibility study on wildfire detection options for protected
    areas and central forest reserves.
  url: https://ugandawildlife.org/uwa-projects/investing-in-forest-and-protected-areas-for-climate-smart-development-project/
  fetched: 2026-11-12
  quote: Terms of Reference for Consultancy services to undertake a feasibility study
    on the most cost effective and efficient options for wildfire detection and management
    in wildlife protected areas and Central Forest Reserves.
