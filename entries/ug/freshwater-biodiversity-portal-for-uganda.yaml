  quote: JRS grantee NaFIRRI mobilized data sets from national sources to create biodiversity
    databases of fish, invertebrate, and algae via an open access platform Global
    Diversity Information Facility (GBIF) and the Freshwater Biodiversity Portal for
    Uganda
- claim: JRS reported in May 2022 that the portal was fully online.
