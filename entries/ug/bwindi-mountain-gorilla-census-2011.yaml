summary: Closed census, run by the Uganda Wildlife Authority, that confirmed at least 400 mountain gorillas
  in Bwindi, up from 302 in 2006, using nest sweeps and faecal samples for genetics.
facts:
- claim: The 2011 census confirmed a minimum of 400 mountain gorillas in Bwindi, up from 302 in 2006.
  url: https://www.awf.org/news/mountain-gorilla-census-finds-increased-population-ugandas-bwindi-impenetrable-national-park
  fetched: 2026-11-08
  quote: The census, conducted in 2011 in Bwindi Impenetrable National Park, Uganda, confirms a minimum
    population of 400 mountain gorillas, up from 302 in 2006.
- claim: Teams swept the park twice for night nests and collected faecal samples for genetic analysis.
  url: https://www.awf.org/news/mountain-gorilla-census-finds-increased-population-ugandas-bwindi-impenetrable-national-park
  fetched: 2026-11-08
  quote: teams systematically moved through Bwindi not once, but twice, looking for and documenting mountain
    gorilla night nests, and collecting fecal samples for genetic analysis.
