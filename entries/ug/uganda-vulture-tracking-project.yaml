summary: Project in which the Hawk Conservancy Trust reports deploying 11 tracking
  units on vultures at three Ugandan national parks with UCF and UWA, tracking 13
  vultures whose movements may give early warning of poaching.
facts:
- claim: The Hawk Conservancy Trust says its project officer deployed 11 tracking
    units on vultures at Murchison Falls, Kidepo Valley and Queen Elizabeth National
    Parks, working with UCF and UWA.
  url: https://www.hawk-conservancy.org/?p=27079
  fetched: 2026-11-15
  quote: Andre was also able to deploy 11 tracking units on vultures across Uganda,
    at Murchison Falls, Kidepo Valley and Queen Elizabeth National Parks, working
    with the Uganda Conservation Foundation and Uganda Wildlife Authority.
- claim: Thirteen vultures of three species are in the tracking project, whose movement
    data can serve as an early warning of poaching.
  url: https://www.hawk-conservancy.org/?p=27079
  fetched: 2026-11-15
  quote: A total of 13 vultures of three species are now part of a tracking project
    whose movement data tells us where vultures are moving in parts of East Africa
    and can also be useful as an early warning system when poaching occurs.
