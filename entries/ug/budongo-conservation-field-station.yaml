summary: A Ugandan-run NGO in Budongo forest, established in 1990 and funded by the
  Royal Zoological Society of Scotland, which has collected systematic long-term Waibira
  chimpanzee data since April 2011 and offers a request form for access.
facts:
- claim: RZSS describes it as a Ugandan-run NGO in Budongo forest, established in
    1990.
  url: https://www.rzss.org.uk/budongo-conservation-field-station
  fetched: 2026-11-12
  quote: Established in 1990, the Ugandan-run Budongo Conservation Field Station (BCFS)
    is an NGO located in Uganda’s Budongo forest
- claim: Its staff study the forest's climate, trees, plants, chimpanzees, birds and
    amphibians, and a veterinary team monitors chimpanzee health.
  url: https://www.rzss.org.uk/budongo-conservation-field-station
  fetched: 2026-11-12
  quote: A staff of up to 40 Ugandans are employed by BCFS to execute a range of activities,
    including studying the forest’s climate, trees, plants, nutrients, chimpanzees,
    birds and amphibians.
- claim: Systematic long-term data collection on the Waibira chimpanzee community
    began in April 2011.
  url: https://www.budongo.org/explore/chimpanzee-communities/
  fetched: 2026-11-12
  quote: Systematic long-term data collection started in April 2011 and has continued
    and been developed into a number of research projects.
- claim: Offers a request form to access and use its long-term data.
  url: https://www.budongo.org/about/documents-and-guidelines/
  fetched: 2026-11-12
  quote: 'Data request : Request to access and use BCFS’s long term data'
