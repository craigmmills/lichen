summary: Programme built by UCF and UWA, with Global Conservation support, now deployed
  across nearly 85% of Murchison Falls National Park, with lion and elephant satellite
  collars registered on EarthRanger.
facts:
- claim: UCF and UWA, with Global Conservation support, have deployed Global Park
    Defense across nearly 85% of the park.
  url: https://globalconservation.org/news/gc-impact-report-2024-25-enabling-the-recovery-of-murchison-falls-national-park-uganda
  fetched: 2026-11-15
  quote: Over the past five years, UCF and UWA, with Global Conservation support,
    have built out critical new infrastructure and professional park management and
    protection systems, deploying Global Park Defense across nearly 85% of the national
    park.
- claim: Satellite collars on lions and elephants are registered on EarthRanger for
    monitoring.
  url: https://globalconservation.org/news/gc-impact-report-2024-25-enabling-the-recovery-of-murchison-falls-national-park-uganda
  fetched: 2026-11-15
  quote: Wildlife Monitoring using satellite collars on lions and elephants is registered
    on the EarthRanger system so they can always be monitored to see how they are
    using the habitat.
