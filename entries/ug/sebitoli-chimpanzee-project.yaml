summary: Founded in 2008 to protect Uganda’s chimpanzees, the project had 20 camera-trap and
  audio-recorder locations and offline laptop classification, One Forest Vision reported in
  February 2025.
facts:
- claim: Founded in 2008 by Sabrina and Jean-Michel Krief to protect chimpanzees and their
    habitat in Uganda.
  url: https://sebitolichimpanzeeproject.com/
  fetched: 2026-11-08
  quote: Créé en 2008 par Sabrina et Jean-Michel Krief, le Sebitoli Chimpanzee Project vise
    à préserver les chimpanzés et leur habitat en Ouganda
- claim: Part of its awareness team maintains camera traps in and at the edge of the forest
    and watches the videos they produce.
  url: https://sebitolichimpanzeeproject.com/le-projet/equipes-de-terrain/
  fetched: 2026-11-08
  quote: Une partie de cette équipe est également responsable de la maintenance des piège-caméras
    posés en forêt et en bordure, et du visionnage des vidéos générées.
- claim: Field assistants carry out daily behavioural and spatial monitoring of the chimpanzees.
  url: https://sebitolichimpanzeeproject.com/le-projet/equipes-de-terrain/
  fetched: 2026-11-08
  quote: Tous les jours, quatre binômes d’assistants se relaient pour réaliser le suivi comportemental
    et spatial des chimpanzés au nord et au sud de la route.
- claim: In February 2025, One Forest Vision reported that a Muséum-developed inter-species
    classification algorithm had been deployed on the station’s laptop, running offline, for
    initial analysis of video clips.
  url: https://www.oneforestvision.org/eng/news/animal-biodiversity-monitoring-mission-in-sebitoli
  fetched: 2026-11-08
  quote: The inter-species classification algorithm developed at the Muséum has been deployed
    on the station's laptop. It runs on a CPU and without an internet connection via an intuitive
    user interface
- claim: At the end of its December 2024 to February 2025 mission, One Forest Vision reported
    an active monitoring protocol with 20 grid locations, each equipped with a camera trap
    and passive audio recorder.
  url: https://www.oneforestvision.org/eng/news/animal-biodiversity-monitoring-mission-in-sebitoli
  fetched: 2026-11-08
  quote: A first protocol dedicated to the visual and acoustic monitoring of general animal
    biodiversity, with 20 locations spread over a regular grid, each equipped with a CT and
    a PAR.
- claim: Its team collected and annotated three video benchmarks used to evaluate DeepForestVisionV2.
  url: https://arxiv.org/html/2606.20223
  fetched: 2026-11-08
  quote: These benchmarks were collected and annotated by the Sebitoli Chimpanzee Project
    in Kibale National Park, Uganda
