facts:
- claim: A long-term field project for the scientific study and conservation of the
    Ngogo chimpanzee community in Kibale National Park, co-directed by Kevin Langergraber.
  url: https://shesc.asu.edu/research/projects/ngogo-chimpanzee-project-0
  fetched: 2026-11-13
  quote: The Ngogo Chimpanzee Project, co-directed by Kevin Langergraber, is a long-term
    field project devoted to the scientific study and conservation of the Ngogo community
    of chimpanzees living in Kibale National Park, Uganda.
- claim: Its local team collects faecal samples for an ongoing genetics-based monitoring
    programme of unhabituated chimpanzee communities in Kibale National Park.
  url: https://shesc.asu.edu/research/projects/ngogo-chimpanzee-project-0
  fetched: 2026-11-13
  quote: They also collect fecal samples for an ongoing genetics-based chimpanzee
    monitoring program that aims to determine the size, composition, number and location
    of unhabituated chimpanzee communities
- claim: It employs a local team that works with Uganda Wildlife Authority officers
    to collect snares.
  url: https://shesc.asu.edu/research/projects/ngogo-chimpanzee-project-0
  fetched: 2026-11-13
  quote: The Ngogo Chimpanzee Project also employs a team of local Ugandans who work
    alongside local law enforcement officers (Uganda Wildlife Authority) to collect
    snares
