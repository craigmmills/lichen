summary: Closed five-year activity (2020 to 2025) run by WCS with AWF and RUSI, which supported
  SMART roll-out in Uganda Wildlife Authority protected areas and handed over an upgraded
  offenders database in May 2024.
facts:
- claim: Described as a five-year activity for 2020 to 2025, implemented by WCS in partnership
    with AWF and RUSI.
  url: https://uganda.wcs.org/usaid-cwc-activity.aspx
  fetched: 2026-11-08
  quote: is a five-year activity (2020 - 2025) implemented by the Wildlife Conservation Society
    (WCS) in partnership with African Wildlife Foundation (AWF), and The Royal United Services
    Institute (RUSI).
- claim: Through the activity, WCS supported the roll-out of SMART in all protected areas
    managed by the Uganda Wildlife Authority, handing over equipment worth $32,858 in June
    2023.
  url: https://uganda.wcs.org/About-Us/News/ID/21222/WCS-donates-SMART-equipment-to-Uganda-Wildlife-Authority-to-foster-wildlife-conservation.aspx
  fetched: 2026-11-08
  quote: is supporting the roll out of Spatial Monitoring and Reporting Tools (SMART) in all
    the protected areas managed by Uganda Wildlife Authority (UWA), as part of the USAID/Uganda
    Combating Wildlife Crime Activity
- claim: Handed over an upgraded Online Wildlife Offenders Database to the Uganda Wildlife
    Authority on 7 May 2024.
  url: https://uganda.wcs.org/About-Us/News/ID/23987/Upgraded-Online-Wildlife-Database-Handed-over-to-UWA.aspx
  fetched: 2026-11-08
  quote: On May 7, 2024, USAID/CWC Activity officially handed over the upgraded Online Wildlife
    Offenders Database (OWODAT) to Uganda Wildlife Authority (UWA)
