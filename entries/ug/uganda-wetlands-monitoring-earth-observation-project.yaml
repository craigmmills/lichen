status: closed
runner: unknown
summary: A closed project led by RAMCEA and funded by the Global Partnership on Sustainable
  Development Data, which piloted a digital wetland monitoring system for Uganda's
  Ministry of Water and Environment, including a 2016 to 2017 Sentinel-based baseline
  map.
facts:
- claim: The World Bank's Data Innovation Fund page says the project was led by RAMCEA
    and piloted a digital system for the Ministry of Water and Environment to inventory
    and monitor national wetland resources.
  url: https://www.worldbank.org/en/data/statistical-capacity-building/data-innovation-fund/wetlands-monitoring-with-earth-observation-data
  fetched: 2026-11-13
  quote: The objective of the project, led by RAMCEA (Ramsar Centre for Eastern Africa)
    , was to explore the potential of earth observation (EO) satellite data for taking
    stock of and monitoring wetlands
- claim: One of its main outputs was a digital platform for monitoring and reporting
    on wetlands, hosted at uganda-wetlands.dhigroup.com.
  url: https://www.worldbank.org/en/data/statistical-capacity-building/data-innovation-fund/wetlands-monitoring-with-earth-observation-data
  fetched: 2026-11-13
  quote: One of the main outputs of the project was to finalize a digital platform
    for monitoring and reporting on wetlands
- claim: The project's own landing page says it was funded by the Global Partnership
    on Sustainable Development Data.
  url: https://uganda-wetlands.dhigroup.com/about.html
  fetched: 2026-11-13
  quote: The project is funded by the Global Partnership on Sustainable Development
    Data (GPSDD)
- claim: DHI's project page says a national baseline map of Uganda's wetlands for
    2016 to 2017 was made from Sentinel-1 and Sentinel-2 imagery.
  url: https://eo.dhigroup.com/?p=4497
  fetched: 2026-11-13
  quote: Within this project, a national baseline mapping of wetlands in Uganda was
    performed for 2016-2017 using all available Sentinel-1 and Sentinel-2 imagery
- claim: DHI's project page says the project's online portal is now operated by the
    Ministry of Water and Environment.
  url: https://eo.dhigroup.com/?p=4497
  fetched: 2026-11-13
  quote: The online portal for the project is now operated by the Ministry of Water
    and Environment in Uganda.
