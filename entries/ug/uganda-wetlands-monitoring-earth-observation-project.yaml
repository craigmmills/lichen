id: uganda-wetlands-monitoring-earth-observation-project
kind: project
name: Wetlands Monitoring with Earth Observation for SDG 6.6.1 in Uganda
also_known_as:
- Wetlands monitoring with earth observation data
scope: ug
ai_label: data-infrastructure
realms:
- freshwater
techniques:
- remote-sensing
countries:
