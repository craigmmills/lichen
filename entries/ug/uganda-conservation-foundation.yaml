summary: Established in 2001, this UK and Ugandan non-profit supports UWA rangers, uses conservation
  technology including EarthRanger, and reports over 1,000 UWA staff trained in EarthRanger.
facts:
- claim: Says it works with the Uganda Wildlife Authority and local communities on ranger
    support, anti-poaching operations, habitat restoration and community conservation.
  url: https://ugandacf.org/?p=1038
  fetched: 2026-11-08
  quote: UCF works to protect Uganda's wildlife and wild places by partnering with the Uganda
    Wildlife Authority and local communities.
- claim: Lists conservation technology, science and innovation as one of its areas of work.
  url: https://ugandacf.org/?p=1038
  fetched: 2026-11-08
  quote: Conservation Technology, Science and Innovation
- claim: Registered as a non-profit in the UK and Uganda.
  url: https://ugandacf.org/?p=1038
  fetched: 2026-11-08
  quote: UCF is a UK (Reg. No. 1087295) and Ugandan registered non-profit organisation.
- claim: An ATC News article credited to UCF says its quick reaction team in Queen Elizabeth
    National Park responded to every issue for three years, with an operations room supported
    by EarthRanger aiding UWA.
  url: https://atcnews.org/recovering-lions-and-fostering-community-coexistence-using-lorawan-in-queen-elizabeth-uganda/
  fetched: 2026-11-08
  quote: For three years, the UCF quick reaction team had managed to respond to 100% of the
    issues, resulting in no lions being lost.
- claim: Global Conservation says it has supported UCF and UWA in Murchison Falls National
    Park since 2018, and that UCF built 30 of the more than 100 ranger posts coordinated through
    EarthRanger operations rooms.
  url: https://globalconservation.org/news/gc-impact-report-2024-25-enabling-the-recovery-of-murchison-falls-national-park-uganda
  fetched: 2026-11-08
  quote: This enables coordination of over 100 ranger posts (30 built by UCF)
- claim: A UK-registered charity established in 2001; its Ugandan NGO was incorporated in
    2003.
  url: https://www.ugandacf.org/uganda-conservation-foundation
  fetched: 2026-11-08
  quote: The Uganda Conservation Foundation (UCF) is a UK-registered charity (Charity No.
    1087295) and a registered non-governmental organisation (NGO) in Uganda.
- claim: Uses wildlife telemetry, aerial surveys, EarthRanger, ecological monitoring and satellite
    imagery in its conservation work.
  url: https://www.ugandacf.org/biodiversity-conservation
  fetched: 2026-11-08
  quote: Wildlife telemetry, aerial surveys, EarthRanger, ecological monitoring and satellite
    imagery provide the information needed to understand changing ecosystems
- claim: Says it leads Uganda's national Carnivore & Scavenger Programme.
  url: https://www.ugandacf.org/biodiversity-conservation
  fetched: 2026-11-08
  quote: leads Uganda's national Carnivore & Scavenger Programme
- claim: Reports that more than 1,000 UWA staff have been trained in EarthRanger.
  url: https://www.ugandacf.org/conservation-technology-science-and-innovation
  fetched: 2026-11-08
  quote: Over 1,000 UWA staff trained in EarthRanger, including training-the-trainers and
    management systems.
