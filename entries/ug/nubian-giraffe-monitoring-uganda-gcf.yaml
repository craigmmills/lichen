summary: Long-term monitoring of Uganda's Nubian giraffe, begun in 2013 and run by
  the Giraffe Conservation Foundation with Makerere University and UWA, using individual-based
  photographic surveys and pattern recognition software.
facts:
- claim: GCF, with Makerere University and in partnership with UWA, continues long-term
    monitoring of Uganda's Nubian giraffe population, begun in 2013.
  url: https://giraffeconservation.org/programs/nubian-giraffe-conservation-in-uganda/
  fetched: 2026-11-15
  quote: Together with Uganda’s Makerere University, the Giraffe Conservation Foundation
    in partnership with UWA continues our long-term monitoring of the country’s Nubian
    giraffe population which started in 2013.
- claim: GCF's Uganda State of Giraffe 2023 report says the surveys are individual-based
    photographic surveys.
  url: https://giraffeconservation.org/wp-content/uploads/2024/11/Uganda-State-of-Giraffe-2023.pdf
  fetched: 2026-11-15
  quote: Uganda using individual based photographic surveys,
- claim: The same report says the surveys rely on pattern recognition software to
    identify giraffe.
  url: https://giraffeconservation.org/wp-content/uploads/2024/11/Uganda-State-of-Giraffe-2023.pdf
  fetched: 2026-11-15
  quote: which rely on pattern recognition software to identify
- claim: GCF says it is mapping Nubian giraffe migratory patterns in Murchison Falls
    National Park with the Global Initiative on Ungulate Migration.
  url: https://giraffeconservation.org/programs/nubian-giraffe-conservation-in-uganda/
  fetched: 2026-11-15
  quote: seasonal migratory patterns that are now being mapped for the first time
    by the Giraffe Conservation Foundation in partnership with the Global Initiative
    on Ungulate Migration (GIUM)
