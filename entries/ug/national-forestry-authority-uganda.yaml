summary: Maps national land cover through its GIS unit; UN-REDD reports its establishment
  in 2004 for 506 reserves and forest degradation assessment from June 2019 using SEPAL.
facts:
- claim: Its GIS unit carries out national land cover and land use mapping across Uganda,
    published as technical reports and land cover maps.
  url: https://nfa.go.ug/products-services
  fetched: 2026-11-08
  quote: The Geographic Information System Unit (GIS) at NFA carries out National Land Cover/Land
    Use Mapping on all land in Uganda.
- claim: Its land cover mapping feeds reports used by NEMA, the Ministry of Finance, UBOS
    and the Ministry of Energy.
  url: https://nfa.go.ug/products-services
  fetched: 2026-11-08
  quote: The Land cover/land use mapping contributes to reports used by NEMA, Ministry of
    Finance, UBOS, and Ministry of Energy, supporting national planning and biomass assessments.
- claim: A UN-REDD page says the NFA was set up in 2004 to manage Uganda's 506 central forest
    reserves, and that its Remote Sensing/GIS unit manages the satellite land monitoring work.
  url: https://www.un-redd.org/post/mapping-forest-degradation-using-remote-sensing-data-uganda
  fetched: 2026-11-08
  quote: In Uganda, the SLMS work is managed by the Remote Sensing/GIS unit, a small, specialized
    team in the NFA in charge of remote sensing and GIS analysis of the forest sector.
- claim: A UN-REDD page says the unit began assessing forest degradation across Uganda in
    June 2019, producing first national estimates with FAO's SEPAL platform.
  url: https://www.un-redd.org/post/mapping-forest-degradation-using-remote-sensing-data-uganda
  fetched: 2026-11-08
  quote: In June 2019, the Remote Sensing/GIS unit took on the challenging task of assessing
    forest degradation across Uganda for the first time.
- claim: Its biomass technical report was supported by NORAD.
  url: https://nfa.go.ug/products-services
  fetched: 2026-11-08
  quote: Supported by NORAD, it discusses data capture, processing, analysis, and presentation
    of national woody biomass.
