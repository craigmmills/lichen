summary: Deforestation monitoring platform built by UNDP and the National Forestry Authority, with a GIS
  web interface and field validation app, which UNDP planned to scale to natural resources governance.
facts:
- claim: Launched by the UNDP Uganda Accelerator Lab and the National Forestry Authority to monitor deforestation
    across Uganda.
  url: https://www.undp.org/node/258456
  fetched: 2026-11-08
  quote: The United Nations Development Programme (UNDP) Uganda Accelerator Lab and the National Forestry
    Authority (NFA) launched the Uganda Natural Resource Information System (NARIS)
- claim: Includes a GIS web interface with a land cover map of Uganda as baseline and a mobile app for
    validating information from satellite imagery in the field.
  url: https://www.undp.org/node/258456
  fetched: 2026-11-08
  quote: a mobile application to assist with field monitoring and validating information gathered from
    satellite imagery
- claim: UNDP said it planned to scale the platform to natural resources governance with SIDA and NORAD
    funds through its ACPIS global programme.
  url: https://www.undp.org/node/258456
  fetched: 2026-11-08
  quote: thanks to the generosity of the Swedish International Development Cooperation Agency (SIDA) and
    Norwegian Agency for Development Cooperation (NORAD) through the UNDP Anti-Corruption for Peaceful
    and Inclusive Societies (ACPIS) Global Programme
