facts:
- claim: Space in Africa describes it as a Ugandan company applying geoinformation science
    and Earth observation to environmental surveys and information.
  url: https://spaceinafrica.com/2022/03/07/interview-with-the-executive-director-of-esipps-dr-jane-bemigisha/
  fetched: 2026-11-08
  quote: is a Ugandan company focused on applying geoinformation science and Earth Observation
    (EO) coupled with research, consultancy and capacity development in environmental surveys
- claim: Selected as an institutional partner of the East African consortia in the GMES and
    Africa programme.
  url: https://spaceinafrica.com/2022/03/07/interview-with-the-executive-director-of-esipps-dr-jane-bemigisha/
  fetched: 2026-11-08
  quote: ESIPPS was privileged to be selected as an institutional partner working with the
    East African consortia to achieve the mandate of the GMES and Africa Programme .
- claim: Its executive director says it implemented a rangeland monitoring method and early
    warning system using EO data with ICPAC.
  url: https://spaceinafrica.com/2022/03/07/interview-with-the-executive-director-of-esipps-dr-jane-bemigisha/
  fetched: 2026-11-08
  quote: we implemented a rangeland monitoring and assessment methodology and a functional
    rangeland early warning system using EO data
