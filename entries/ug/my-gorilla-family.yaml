facts:
- claim: The Uganda Wildlife Authority announced that a paid subscription through
    the app would give access to the Bwindi and Mgahinga conservation area.
  url: https://ugandawildlife.org/news/uwa-leverages-technology-to-conserve-mountain-gorillas-in-uganda/
  fetched: 2026-11-22
  quote: subscribers will receive an all-access pass to Bwindi/Mgahinga Conservation
    Area
- claim: The Uganda Wildlife Authority said subscribers would be able to follow gorilla
    excursions and family migrations through virtual trekking.
  url: https://ugandawildlife.org/news/uwa-leverages-technology-to-conserve-mountain-gorillas-in-uganda/
  fetched: 2026-11-22
  quote: You will be able to follow gorilla daily excursions and family migrations
    through virtual trekking
- claim: Aims to create sustainable non-trekking revenue to fund conservation activities
    in the gorilla parks.
  url: https://ugandawildlife.org/news/uwa-leverages-technology-to-conserve-mountain-gorillas-in-uganda/
  fetched: 2026-11-22
  quote: create sustainable sources of non-trekking revenues to fund conservation
    activities in gorilla parks
- claim: Is developed under the Home of a Gorilla initiative, a partnership between
    the Uganda Wildlife Authority and RoundBob/The Naturalist.
