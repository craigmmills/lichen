summary: Run by Makerere University, this year-round Kibale Forest research station
  hosts long-term research, with chimpanzee health monitoring and Pl@ntNet training
  recorded in the university’s 2025 report.
facts:
- claim: A 2010 Makerere University news page describes MUBFS as a year-round field
    research station in Kibale Forest, with study sites at Kanyawara and Ngogo.
  url: https://news.mak.ac.ug/2010/08/mubfs-maks-world-renown-tropical-biology-gem/
  fetched: 2026-11-15
  quote: MUBFS has two main study sites – Kanyawara and Ngogo, with Kanyawara housing
    the station’s main facilities.
- claim: The same 2010 page lists long-term ecological monitoring of Kibale National
    Park's ecosystems among the research projects at the station.
  url: https://news.mak.ac.ug/2010/08/mubfs-maks-world-renown-tropical-biology-gem/
  fetched: 2026-11-15
  quote: Long-term Ecological Monitoring of Kibale National Park Eco-Systems.
- claim: Makerere's College of Agricultural and Environmental Sciences annual report
    for 2025 says MUBFS continues to host long-term research programmes.
  url: https://news.mak.ac.ug/wp-content/uploads/2026/07/Makerere-CAES-Annual-Report-2025.pdf
  fetched: 2026-11-15
  quote: MUBFS continues to host a diverse portfolio of long-term and ongoing research
    programs.
- claim: The 2025 report's MUBFS chapter covers the Chimpanzee Health, Intervention,
    and Monitoring Program (CHIMP).
  url: https://news.mak.ac.ug/wp-content/uploads/2026/07/Makerere-CAES-Annual-Report-2025.pdf
  fetched: 2026-11-15
  quote: Monitoring Program (CHIMP)
- claim: The 2025 report records Pl@ntNet training at MUBFS.
  url: https://news.mak.ac.ug/wp-content/uploads/2026/07/Makerere-CAES-Annual-Report-2025.pdf
  fetched: 2026-11-15
  quote: Pl@ntNet training with Daniel Barthélémy and Murielle Simo-Droissart at MUBFS
