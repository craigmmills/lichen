facts:
- claim: WildSpace Image Analytics lists a 2018 SRF wildlife survey of Queen Elizabeth
    National Park that acquired 32,000 oblique-camera-count images.
  url: https://www.wildspace-image-analytics.com
  fetched: 2026-11-15
  quote: An SRF wildlife survey, acquiring 32,000 OCC images for analysis.
- claim: A 2023 paper in Frontiers in Ecology and Evolution says the original 2018
    aerial survey of QENP was funded by UCF with support from Global Conservation,
    Vulcan Inc., Save the Elephants and the Uganda Wildlife Authority.
  url: https://www.frontiersin.org/articles/10.3389/fevo.2023.1270857
  fetched: 2026-11-15
  quote: The original aerial 2018 survey of QENP, from which this experimental imagery
    was collected, was funded by UCF with support from Global Conservation, Vulcan
    Inc., Save the Elephants and the Uganda Wildlife Authority.
- claim: The 2023 study trained and evaluated HerdNet using aerial imagery from the
    2018 survey.
  url: https://www.frontiersin.org/articles/10.3389/fevo.2023.1270857
  fetched: 2026-11-15
  quote: Using oblique aerial imagery of 2.1 hectares footprint collected during an
    SRF-OCC survey of Queen Elizabeth Protected Area in Uganda, a DL model (HerdNet)
    was trained and evaluated to detect and count 12 wildlife and livestock mammal
    species.
