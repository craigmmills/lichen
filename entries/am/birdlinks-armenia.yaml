- claim: The European Bird Census Council said in March 2026 that BirdLinks Armenia leads a project to
    publish the first breeding bird atlas of Armenia, drawing on more than two decades of monitoring data
    on 242 species.
  url: https://www.ebcc.info/ebcc-to-support-bird-monitoring-projects-in-armenia-and-bosnia-herzegovina/
  fetched: 2026-11-08
  quote: In Armenia, the project Publishing the first atlas on breeding birds of Armenia, led by BirdLinks
    Armenia, will result in the country's first comprehensive breeding bird atlas.
- claim: EuropaBON's monitoring inventory lists BirdLinks Armenia as a national integration node supplying
