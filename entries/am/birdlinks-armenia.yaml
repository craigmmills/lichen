summary: Yerevan-based organisation founded in 2014 according to the Sigrid Rausing Trust, leading a project
  for Armenia's first breeding bird atlas, according to the European Bird Census Council.
facts:
- claim: Says it runs the National Bird Monitoring programme and National Bird Monitoring Scheme in Armenia.
  url: https://api.gbif.org/v1/node/1adad26d-6733-463b-ab2c-f6e9f47827d6/organization
  fetched: 2026-11-08
  quote: It runs National Bird Monitoring program and National Bird Monitoring Scheme in the country.
- claim: Endorsed by GBIF Armenia as a publisher; expects to publish data from passive acoustic monitoring
    and transect counts.
  url: https://api.gbif.org/v1/node/1adad26d-6733-463b-ab2c-f6e9f47827d6/organization
  fetched: 2026-11-08
  quote: Data from Passive Acoustic Monitoring, occurrence-only
- claim: Leads the project to publish the first breeding bird atlas of Armenia, which will synthesise
    more than two decades of monitoring data on 242 breeding bird species.
  url: https://www.ebcc.info/ebcc-to-support-bird-monitoring-projects-in-armenia-and-bosnia-herzegovina/
  fetched: 2026-11-08
  quote: The atlas will synthesise more than two decades of monitoring data and analyse the distribution,
    population size, and trends of 242 breeding bird species across the country.
- claim: The Sigrid Rausing Trust says it was founded in 2014 and is based in Yerevan.
  url: https://www.sigrid-rausing-trust.org/grantee/towards-sustainable-ecosystems-tse/
  fetched: 2026-11-08
  quote: Birdlinks Armenia was founded in 2014. Based in Yerevan
- claim: The Sigrid Rausing Trust says its activities include establishing community-based species monitoring
    schemes.
  url: https://www.sigrid-rausing-trust.org/grantee/towards-sustainable-ecosystems-tse/
  fetched: 2026-11-08
  quote: Its activities include establishing community-based species monitoring schemes
- claim: Its GBIF publisher record says it runs the National Bird Monitoring program and National Bird
    Monitoring Scheme in Armenia.
  url: https://api.gbif.org/v1/organization/d7ec30db-0d49-4213-82a9-55791806e865
  fetched: 2026-11-08
  quote: It runs National Bird Monitoring program and National Bird Monitoring Scheme in the country.
- claim: Its GBIF publisher record says it uses the collected information to assess the state of species
    and ecosystems, threats and the effect of conservation work.
  url: https://api.gbif.org/v1/organization/d7ec30db-0d49-4213-82a9-55791806e865
  fetched: 2026-11-08
  quote: Based on the collected information, BirdLinks assesses states of the species and ecosystems,
    pressure of threats, and efficacy of conservation efforts.
- claim: Its GBIF publisher record lists data it expects to publish, including passive acoustic monitoring
    data and transect counts.
  url: https://api.gbif.org/v1/organization/d7ec30db-0d49-4213-82a9-55791806e865
  fetched: 2026-11-08
