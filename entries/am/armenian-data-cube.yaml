summary: Remote-sensing repository for Armenia's landscapes, being developed by two national institutes
  and the University of Geneva in 2022, when it held the full Landsat and Sentinel-2 archive.
facts:
- claim: Being developed by the Center for Ecological-Noosphere Studies and the Institute for Informatics
    and Automation Problems of the National Academy of Sciences with the University of Geneva, for remote-sensing
    monitoring of Armenia's landscapes (2022 report).
  url: https://www.ra.am/archives/77134
  fetched: 2026-11-08
  quote: Центр экологаносферных исследований НАН Армении и Институт проблем информатики и автоматизации
    НАН Армении совместно с Женевским университетом, Швейцария, разрабатывают многомерную информационную
    система сбора и обработки спутниковых фотографий
- claim: The 2022 report says the repository held the full Landsat and Sentinel-2 archive and drone images,
    and a Python algorithm had been developed to delineate water bodies.
  url: https://www.ra.am/archives/77134
  fetched: 2026-11-08
  quote: включающее в себя полный архив спутниковых снимков Landsat и Sentinel-2, а также снимки, полученные
    с дронов
- claim: Built in the project Armenian Data Cube for Sustainable Development, funded by the Swiss State
    Secretariat for Education, Research and Innovation.
  url: https://www.ra.am/archives/77134
  fetched: 2026-11-08
  quote: Работа была выполнена в рамках проекта «Армянский куб данных для устойчивого развития — ADC4SD».
