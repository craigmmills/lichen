summary: Funded from April 2020 to March 2024, mostly by Germany's research ministry,
  the project aimed to use satellite remote sensing and eutrophication modelling,
  with monthly Lake Sevan sampling.
facts:
- claim: Funded from 1 April 2020 to 31 March 2024 by Germany's Federal Ministry for
    Education and Research (91.5%) and Armenia's Ministry of Environment (8.5%).
  url: https://www.ufz.de/index.php?en=44302
  fetched: 2026-11-12
  quote: 'Funding period: April 1, 2020 – March 31, 2024 (including cost-neutral extension)'
- claim: Its goals included using satellite remote sensing to estimate Lake Sevan's
    water quality and a coupled physical-ecological eutrophication model of the lake.
  url: https://www.ufz.de/index.php?en=44302
  fetched: 2026-11-12
  quote: Use of satellite-based remote sensing for estimation of water quality of
    Lake Sevan
- claim: A core activity was monthly sampling of Lake Sevan at its deepest sites,
    analysed for chemistry, phytoplankton and zooplankton.
  url: https://www.ufz.de/index.php?en=44302
  fetched: 2026-11-12
  quote: One of the core activities to reach the goals is the operation of a monthly
    sampling of Lake Sevan at the deepest sites of Small Sevan and Big Sevan at different
    depths.
- claim: Its publications include a 2024 paper on satellite-based detection of algal
    blooms in Lake Sevan.
  url: https://www.ufz.de/index.php?en=44302
  fetched: 2026-11-12
  quote: 'Satellite-Based Detection of Algal Blooms in Large Alpine Lake Sevan: Can
    Satellite Data Overcome the Unavoidable Limitations in Field Observations?'
