status: active
summary: Programme launched in 2002 by WWF and the Ministry of Nature Protection, with long-term leopard
  and prey monitoring; recorded leopards rose from zero or one in 2002 to 2012 to eight adults and two
  cubs in 2021.
facts:
- claim: Launched in 2002 by WWF and the Ministry of Nature Protection, with funding from WWF Switzerland
    and WWF Germany.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: The Leopard Conservation Program in Armenia was launched in 2002 through joint efforts of WWF
    and the Ministry of Nature Protection of the Republic of Armenia (the current Ministry of Environment)
    and with the support and funding from WWF Switzerland and WWF Germany.
- claim: Its activities include long-term scientific monitoring of the leopard and its prey.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: To continue long-term scientific monitoring of leopard and prey species in Armenia.
- claim: Its listed activities include supporting caretakers to collect leopard and prey data with the
    EarthBeat application.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: support their data collection about the leopard and its prey species using the EarthBeat application
- claim: The male leopard Neo has lived in the Khosrov Forest State Reserve since December 2018.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: Since December 2018, young male Leopard named Neo has set its basic residence at the Khosrov
    Forest State Reserve.
- claim: Launched in 2002 through joint efforts of WWF and the Ministry of Nature Protection, now the
    Ministry of Environment, with support and funding from WWF Switzerland and WWF Germany.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: The Leopard Conservation Program in Armenia was launched in 2002 through joint efforts of WWF
    and the Ministry of Nature Protection of the Republic of Armenia (the current Ministry of Environment)
    and with the support and funding from WWF Switzerland and WWF Germany.
- claim: Recorded leopards in Armenia increased from zero or one during 2002–2012 to eight adults and
    two cubs in 2021; the page says its trail cameras currently detect at least six adults.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: to a country record of 8 adults and two cubs detected in Armenia during 2021. Current number
    of Leopards detected by our trail cameras is at least 6 adult individuals.
- claim: Its key activities include continuing long-term scientific monitoring of leopard and prey species
    in Armenia.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: To continue long-term scientific monitoring of leopard and prey species in Armenia.
