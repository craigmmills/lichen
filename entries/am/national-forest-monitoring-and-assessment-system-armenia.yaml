summary: Swiss-funded, FAO-run project, agreed on 30 April 2026, that plans to combine field data collection
  with remote sensing and GIS to produce forest data in Armenia.
facts:
- claim: The project agreement was signed on 30 April 2026 by the Swiss ambassador and the FAO Representative
    in Armenia.
  url: https://armenia.un.org/en/node/315011
  fetched: 2026-11-08
  quote: signed the project agreement “Support the establishment of a National Forest Monitoring and Assessment
    System in Armenia”
- claim: Says Armenia has not run a full National Forest Inventory since the 1980s.
  url: https://armenia.un.org/en/node/315011
  fetched: 2026-11-08
  quote: Armenia has not conducted a full National Forest Inventory (NFI) since the 1980s
- claim: Plans to combine field data collection with remote sensing and GIS to produce data on forest
    cover, forest health, biodiversity and carbon.
  url: https://armenia.un.org/en/node/315011
  fetched: 2026-11-08
  quote: Through the integration of field-based data collection with modern technologies such as remote
    sensing and geographic information systems (GIS), the initiative will generate accurate and comprehensive
    data on forest resources
- claim: Part of the SDC-funded Forest Restoration and Climate Change in Armenia (FORACCA) project.
  url: https://armenia.un.org/en/node/315011
  fetched: 2026-11-08
  quote: the project is part of the SDC-funded “Forest Restoration and Climate Change in Armenia” (FORACCA)
