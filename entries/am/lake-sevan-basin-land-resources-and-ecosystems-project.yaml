id: lake-sevan-basin-land-resources-and-ecosystems-project
kind: project
name: Conservation and Sustainable Management of Land Resources and High Value Ecosystems in Lake Sevan
  Basin for Multiple Benefits
also_known_as:
- Conservation of Sevan's Biodiversity
scope: am
ai_label: conservation-tech
realms:
- freshwater
- land
countries:
