status: active
summary: GEF-supported project, run by the Environmental Project Implementation Unit, that aims to strengthen
  biodiversity monitoring in Sevan National Park and reports six key biodiversity and bird areas mapped.
facts:
- claim: Aims to strengthen Sevan National Park's biodiversity monitoring and patrolling and to map Key
    Biodiversity Areas and Important Bird Areas outside the park.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources
  fetched: 2026-11-08
  quote: The five-year project aims to strengthen the capacity of Sevan National Park, a region of global
    biodiversity significance, by enhancing biodiversity monitoring, patrolling, and the development of
    eco-friendly, socially responsible ecotourism.
- claim: Plans a climate-sensitive integrated monitoring database for Sevan National Park.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources
  fetched: 2026-11-08
  quote: development of climate-sensitive integrated monitoring database
- claim: Reports six key biodiversity and bird areas mapped at the project site.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources
  fetched: 2026-11-08
  quote: key biodiversity and bird areas mapped at the project site
- claim: Aims to strengthen Sevan National Park's capacity by enhancing biodiversity monitoring and patrolling,
    and to map Key Biodiversity Areas and Important Bird Areas outside the park.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources/
  fetched: 2026-11-08
  quote: The five-year project aims to strengthen the capacity of Sevan National Park, a region of global
    biodiversity significance, by enhancing biodiversity monitoring, patrolling
- claim: An intended output includes a climate-sensitive integrated monitoring database for Sevan National
    Park.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources/
  fetched: 2026-11-08
  quote: development of climate-sensitive integrated monitoring database
- claim: Supported by GEF through UNDP and implemented by the Environmental Project Implementation Unit
    State Agency, with WWF Armenia responsible for Component 2.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources/
  fetched: 2026-11-08
  quote: The project is supported by Global Environment Facility (GEF) through United Nations Development
    Programme (UNDP) and implemented by Environmental Project Implementation Unit (EPIU) State Agency,
    with WWF Armenia as a responsible party for the project's Component 2.
