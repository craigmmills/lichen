summary: Armenian research centre, set up by government decision in 2006, that studies
  Lake Sevan cyanobacteria blooms, is working on an ecological model of the lake from
  data since 1933, and holds the country's largest entomological collection according
  to GBIF.
facts:
- claim: Established by a government decision in 2006 by merging the Institutes of
    Zoology and of Hydroecology and Ichthyology of the National Academy of Sciences.
  url: https://sczhe.sci.am/
  fetched: 2026-11-12
  quote: The Scientific Center of Zoology and Hydroecology was established by the
    decision of the Government of the Republic of Armenia in 2006 as a result of the
    merger of the Institutes of Zoology and Hydroecology and Fishology of the National
    Academy of Sciences of the Republic of Armenia
- claim: Its hydroecology laboratory studies the cyanobacteria blooms seen in Lake
    Sevan in recent years.
  url: https://sczhe.sci.am/
  fetched: 2026-11-12
  quote: The laboratory is also engaged in the study of the "blooming" of cyanobacteria
    observed in Lake Sevan in recent years
- claim: Is working to build an ecological model of Lake Sevan from long-term data
    since 1933 and current monitoring studies.
  url: https://sczhe.sci.am/
  fetched: 2026-11-12
  quote: On the basis of long-term data (since 1933) and modern monitoring studies,
    work is being done to create an ecological model of Lake Sevan.
