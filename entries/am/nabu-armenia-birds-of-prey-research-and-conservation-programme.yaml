facts:
- claim: NABU Armenia fitted a satellite sensor on a lesser spotted eagle, a first
    for Armenia, within its study of birds of prey.
  url: https://nabu.am/en/projects/birds-of-prey-research-and-conservation/tagging-lesser-spotted-eagle
  fetched: 2026-11-12
  quote: First time in Armenia, the branch of German Nature Protection Union (NABU)
    in the Republic of Armenia has installed a satellite sensor on the Lesser Spotted
    Eagle within the framework of the study of birds of prey.
- claim: The sensor is meant to show the species' local and migratory movements.
  url: https://nabu.am/en/projects/birds-of-prey-research-and-conservation/tagging-lesser-spotted-eagle
  fetched: 2026-11-12
  quote: The satellite sensor will make it possible to study the local and migratory
    movements of the species
- claim: The work was part of NABU's programme New Partnership for the Conservation
    of Birds of Prey in Eastern Europe, funded by NABU International and VGP funds.
  url: https://nabu.am/en/projects/birds-of-prey-research-and-conservation/tagging-lesser-spotted-eagle
