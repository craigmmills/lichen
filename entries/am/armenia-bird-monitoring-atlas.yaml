facts:
- claim: Divides Armenia into 10 km by 10 km squares, with field routes set up and a counting method piloted.
  url: https://ace.aua.am/bird-monitoring-atlas/
  fetched: 2026-11-08
  quote: Currently, Armenia is divided into 10km by 10km grids. The field data collection routes are set
