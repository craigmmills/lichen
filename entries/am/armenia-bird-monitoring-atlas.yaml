- claim: Will provide input to the European Breeding Bird Atlas, for which Karen Aghababyan was appointed
    national coordinator by the European Bird Census Council.
  url: https://ace.aua.am/bird-monitoring-atlas/
  fetched: 2026-11-08
  quote: The European Bird Census Council recently appointed Dr. Karen Aghababyan as the National Coordinator
