summary: Active project on ecosystem services and citizen science in Armenia's Hrazdan
  River basin, reporting school bioindication work, a July 2025 summer school, and
  a cultural ecosystem services framework tested in Dilijan National Park.
facts:
- claim: In December 2024, EcoServ reported that school students in the Hrazdan River
    basin were using bioindication methods to assess the river's ecological condition.
  url: https://ecoserv.boku.ac.at/?p=1512
  fetched: 2026-11-15
  quote: The students are using bioindication methods to assess the ecological condition
    of the river.
- claim: In July 2025 local schools presented results from bioindication, irrigation
    water quality measurements and data collection at the EcoServ Summer School in
    Armenia.
  url: https://ecoserv.boku.ac.at/?p=1512
  fetched: 2026-11-15
  quote: Students demonstrated their work with bioindication methods, irrigation water
    quality measurements, data collection, and result interpretation
- claim: In July 2024, EcoServ reported that a team from the Scientific Center of
    Zoology and Hydroecology and BOKU University had developed a cultural ecosystem
    services assessment framework for rivers and floodplains in the Caucasus, tested
    in Dilijan National Park.
  url: https://ecoserv.boku.ac.at/?p=1512
  fetched: 2026-11-15
  quote: Our interdisciplinary team from the Scientific Center of Zoology and Hydroecology
    NAS Armenia and BOKU University has developed a cultural ecosystem services assessment
    framework for rivers and floodplains in the Caucasus.
