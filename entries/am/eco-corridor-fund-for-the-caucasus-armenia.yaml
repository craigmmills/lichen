summary: Run by WWF-Armenia with the Ministry of Environment, the programme includes
  Gndasar, where WWF-Armenia reports a new leopard recorded on 9 and 13 October 2026.
facts:
- claim: The Gndasar Community Conserved Area was set up within the ECF programme,
    which WWF-Armenia implements with the Ministry of Environment.
  url: https://armenpress.am/en/article/1263265
  fetched: 2026-11-12
  quote: The Gndasar Community Conserved Area was established within the framework
    of the Eco-Corridor Fund for the Caucasus (ECF) program. The program is implemented
    by WWF-Armenia in cooperation with the Ministry of the Environment of the Republic
    of Armenia.
- claim: Camera traps belonging to the caretaker of the Gndasar Community Conserved
    Area recorded a new leopard on 9 and 13 October 2026.
  url: https://armenpress.am/en/article/1263265
  fetched: 2026-11-12
  quote: Camera traps installed in the Gndasar Community Conserved Area in Zangakatun
    village, Armenia, recorded a new leopard on October 9 and 13, WWF-Armenia reported.
