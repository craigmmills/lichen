summary: Run by NABU Armenia since 2020, the programme holds nest coordinates, counts
  adults and chicks, records pollution, and reportedly included ringing and satellite
  sensors in the Ararat valley.
facts:
- claim: NABU Armenia has run the programme since 2020 and holds the geographical
    coordinates of all the nests it covers.
  url: https://nabu.am/en/node/7449
  fetched: 2026-11-12
  quote: Since the NABU branch in Armenia has been implementing the "White Stork Research
    and Conservation" program since 2020, the organization already has geographical
    coordinates of all nests.
- claim: The census counts adult storks and chicks and records a pollution index.
  url: https://nabu.am/en/node/7449
  fetched: 2026-11-12
  quote: The census examines both the number of adult storks and chicks and the pollution
    index
- claim: NABU Armenia reported that it was conducting a stork census across all of
    Armenia in the international census year.
  url: https://nabu.am/en/node/7449
  fetched: 2026-11-12
  quote: the organization's branch in Armenia is conducting stork census in ALL Armenia
    this year.
- claim: In May 2024, Ecolur reported that work in the Ararat valley had included
    counts, ringing, sampling and the fitting of satellite sensors.
  url: https://www.ecolur.org/en/news/biodiversity/15545/
  fetched: 2026-11-12
  quote: bird species counting, pollution degree and area detection, as well as ringing,
    sampling and installation of satellite sensors were carried out in Ararat valley
