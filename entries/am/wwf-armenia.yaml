summary: Conservation organisation that runs a leopard programme; it says its trail cameras detect at
  least six adult leopards and lists EarthBeat-supported data collection among its activities.
facts:
- claim: Says its trail cameras currently detect at least six adult leopards in Armenia.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: Current number of Leopards detected by our trail cameras is at least 6 adult individuals.
- claim: Its listed activities include running a network of leopard caretakers and supporting data collection
    on the leopard and its prey with the EarthBeat application.
  url: https://wwf.am/our_work_armenia/ongoing_projects/conservation_of_the_leopard_in_armenia/
  fetched: 2026-11-08
  quote: To run a network of leopard caretakers in Armenia and support their data collection about the
    leopard and its prey species using the EarthBeat application.
- claim: Is the responsible party for Component 2 of a GEF project, implemented by EPIU, that builds monitoring
    and patrolling capacity in Sevan National Park.
  url: https://www.wwf.am/our_work_armenia/ongoing_projects/conservation_management_of_land_resources
  fetched: 2026-11-08
  quote: with WWF Armenia as a responsible party for the project’s Component 2
