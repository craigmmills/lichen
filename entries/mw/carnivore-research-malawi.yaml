summary: Active programme run by Conservation Research Africa, working on carnivore conservation, especially
  spotted hyaena, in Malawi since 2011, using camera traps and GPS collar data to monitor hyaena clans
  and dens.
facts:
- claim: Monitors its resident hyaena clans extensively through camera traps, which lets it respond when
    a snare is detected.
  url: https://www.carnivoreresearchmalawi.org/conservation
  fetched: 2026-11-08
  quote: We monitor our resident clans extensively through camera traps and therefore can respond immediately
    once we detect a possible snare.
- claim: Each month it monitors hyaena dens, locating areas from GPS collar data and installing camera
    traps to identify dens.
  url: https://www.carnivoreresearchmalawi.org/conservation
  fetched: 2026-11-08
  quote: Once an area of interest is located using our GPS collar data and cluster points, we install
    camera traps to identify the possible dens.
- claim: Has worked on carnivore conservation, especially spotted hyaena, in Malawi since 2011.
  url: https://www.carnivoreresearchmalawi.org/conservation
  fetched: 2026-11-08
  quote: We have been working to conserve carnivores and particularly spotted hyaena with our partners
    and stakeholders in Malawi since 2011.
