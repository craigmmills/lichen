summary: Malawi government department that says it manages nine protected areas, five national parks and
  four wildlife reserves, and whose research section runs ecological monitoring including animal population
  surveys and patrol analysis.
facts:
- claim: Mandated to conserve, manage and regulate the use of wildlife resources in Malawi, within the
    Ministry of Tourism, Culture and Wildlife.
  url: https://visitmalawi.mw/department-of-national-parks-and-wildlife/
  fetched: 2026-11-08
  quote: The Department of National Parks and Wildlife (DNPW) in the Ministry of Tourism, Culture and
    Wildlife is mandated to conserve, manage and regulate the use of wildlife resources in the Malawi.
- claim: Protects and manages the national parks, wildlife reserves and nature sanctuaries.
  url: https://visitmalawi.mw/department-of-national-parks-and-wildlife/
  fetched: 2026-11-08
  quote: The purpose is to protect and manage national parks, wildlife reserves and nature sanctuaries
    in which representative communities of wild plants and animals are conserved.
- claim: Its Wildlife Research and Development section runs ecological monitoring in protected areas,
    including animal population surveys and law enforcement patrol analysis.
  url: https://visitmalawi.mw/department-of-national-parks-and-wildlife/
  fetched: 2026-11-08
  quote: There are a number of ecological monitoring programs being undertaken in protected areas such
    as animal population surveys to provide information on the status; law enforcement patrol analysis
- claim: Its directorate is at Matamando House in Lilongwe.
  url: https://visitmalawi.mw/department-of-national-parks-and-wildlife/
  fetched: 2026-11-08
  quote: The DNPW Directorate is located in Matamando House, off Convention Drive opposite City Centre
    Civic Offices in the Capital City of Lilongwe, Malawi.
- claim: Has worked to restore Kasungu National Park since 2017, according to an IFAW release of October
    2026 on the renewed partnership between the Government of Malawi and IFAW.
  url: https://www.ifaw.org/press-releases/malawi-ifaw-renew-partnership-protect-wildlife-support-communities
  fetched: 2026-11-08
  quote: Malawi’s Department of National Parks and Wildlife has worked to restore Kasungu National Park
    since 2017
- claim: Says it manages nine protected areas in Malawi, five national parks and four wildlife reserves.
  url: https://wildlife.lilongwewildlife.org/protected-areas/
  fetched: 2026-11-08
  quote: 'DNPW manages nine protected areas in Malawi, five national parks and four wildlife reserves:
    National Parks: Kasungu, Nyika, Liwonde, Lengwe and Lake Malawi Wildlife Reserves: Majete, Mwabvi,
    Vwaza Marsh and Nkhotakota'
- claim: Gives its office as Matamando House, Lilongwe.
  url: https://wildlife.lilongwewildlife.org/contact/
  fetched: 2026-11-08
  quote: Department of National Parks and Wildlife Matamando House, Convention Drive City Centre PO Box
    30131 Lilongwe 3
