summary: A Lilongwe Wildlife Trust study of rehabilitated Temminck's pangolins in
  Malawi, which in September 2022 reported satellite tags on 16 pangolins released
  since the previous year, with VHF tracking also used.
facts:
- claim: On 8 September 2022, Lilongwe Wildlife Trust reported fitting satellite tags
    to 16 pangolins released since the previous year to track their movements, although
    Jumbo had temporarily eluded tracking.
  url: https://lilongwewildlife.org/news/on-the-trail-of-jumbo-the-pangolin/
  fetched: '2026-11-15'
  quote: Since last year, we’ve fitted satellite tags to 16 of the pangolins we’ve
    released back into the wild.
- claim: The September 2022 account says Jumbo could also be tracked using a VHF signal.
  url: https://lilongwewildlife.org/news/on-the-trail-of-jumbo-the-pangolin/
  fetched: '2026-11-15'
  quote: In addition to the satellite tag, Jumbo can also be tracked with what we
    call a ‘very high frequency’ (VHF) signal.
- claim: Its research list includes a study that followed rehabilitated Temminck's
    pangolins after release in Malawi using satellite and VHF tracking.
  url: https://lilongwewildlife.org/reports_cat/research/
  fetched: '2026-11-15'
  quote: This study followed rehabilitated Temminck’s pangolins after their release
    into the wild in Malawi, using satellite and VHF tracking to better understand
    how they adapt and establish home ranges.
