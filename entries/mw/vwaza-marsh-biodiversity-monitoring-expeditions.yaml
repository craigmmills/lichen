- claim: The combined 2024/2025 expedition report describes 14 camera traps deployed
    along the reserve's two main roads, as well as six at sites of animal activity
    along the lakeside and airstrip.
  url: https://zenodo.org/records/18821613
  fetched: 2026-11-13
  quote: 14 camera traps were deployed by the expedition along the two main roads
    within the reserve (the main track and northern track), as well as six at sites
    of animal activity, such as mammal paths, along the lakeside and airstrip.
