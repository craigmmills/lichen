summary: Active programme, run by the Department of Forestry, that Malawi's 2024 forest reference level
  describes as still in development, using Collect Earth for historical deforestation data.
facts:
- claim: Malawi's 2024 forest reference level says the country is in the process of developing its National
    Forest Monitoring System.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: Malawi is currently in the process of developing its National Forest Monitoring System (NFMS).
- claim: Malawi’s 2024 forest reference level reports progress since 2016 in completing a ground-based
    biomass survey, trialling a satellite-based land monitoring system and developing a national greenhouse
    gas accounting system; the monitoring components had only been applied to historical observations.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: the country has made  noteworthy progress in completing a ground -based biomass survey, trialing
    a satellite-based land monitoring system and developing a national GHG accounting system.
- claim: The 2024 report says the Department of Forestry had formalised a satellite land monitoring system
    since the first submission in 2019, using Collect Earth to generate historical deforestation and degradation
    data.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: a satellite land monitoring system (SLMS) for tracking deforestation has been formalized by the
    DoF in Malawi.
