summary: BirdLife International's partner in Malawi, described as the oldest conservation NGO there, founded
  in 1947; it is digitising biodiversity data and has 18 datasets published through GBIF.
facts:
- claim: Its GBIF publisher record says it is digitising and publishing its data through GBIF, including
    occurrence records and checklists of birds, mammals and plants.
  url: https://api.gbif.org/v1/organization?country=MW&limit=50
  fetched: 2026-11-08
  quote: It is focusing at making this data easily accessible through GBIF platform. The data is being
    digitized and published.  The data available is occurrence and checklists of birds, mammals, plants,
    among others.
- claim: The GBIF registry lists 18 datasets published by WESM.
