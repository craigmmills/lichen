summary: An active operation, run by DNPW and funded by IFAW, in which 20 elephants
  received new or replacement tracking collars in October 2026 alongside an aerial
  assessment.
facts:
- claim: In October 2026, 20 elephants received new or replacement tracking collars
    in Kasungu National Park.
  url: https://www.ifaw.org/press-releases/malawi-elephant-monitoring-operation-kasungu
  fetched: 2026-11-13
  quote: Twenty elephants received new or replacement tracking collars, while collars
    were removed from 11 others.
- claim: The October 2026 announcement said the collaring operation was being conducted
    alongside an aerial assessment of the park's elephant population.
  url: https://www.ifaw.org/press-releases/malawi-elephant-monitoring-operation-kasungu
  fetched: 2026-11-13
  quote: is conducting the operation alongside an aerial assessment of the park’s
    elephant population.
- claim: IFAW says tracking data helps DNPW monitor the elephants around the clock.
  url: https://www.ifaw.org/press-releases/malawi-elephant-monitoring-operation-kasungu
  fetched: 2026-11-13
  quote: Tracking data helps DNPW monitor the elephants around the clock
- claim: The October 2026 announcement named Robert Guldemond of the University of
    Pretoria's Conservation Ecology Research Unit as research team leader, working
    with DNPW, IFAW, Wildscapes and Mhuirich Aviation Services.
  url: https://www.ifaw.org/press-releases/malawi-elephant-monitoring-operation-kasungu
  fetched: 2026-11-13
  quote: The research team is led by Prof. Robert Guldemond of the University of Pretoria’s
    Conservation Ecology Research Unit (CERU), working with DNPW, IFAW and veterinary
    and technical partners, including Wildscapes and Mhuirich Aviation Services.
