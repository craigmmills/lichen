summary: An active Lilongwe Wildlife Trust monitoring programme in Liwonde National
  Park, supporting African Parks with priority species, especially reintroduced carnivores,
  and reporting in January 2022 almost 2,000 species reports and studbooks for every
  large carnivore.
facts:
- claim: In its 6 January 2022 article, Lilongwe Wildlife Trust said it had launched
    its Liwonde research monitoring programme just over a year earlier.
  url: https://lilongwewildlife.org/news/reflecting-on-a-year-of-biodiversity-monitoring-in-liwonde/
  fetched: '2026-11-15'
  quote: It’s been just over a year since we launched our research monitoring programme
    in Liwonde National Park
- claim: The project was created to support African Parks in Liwonde with monitoring
    priority species, with a focus on reintroduced carnivores.
  url: https://lilongwewildlife.org/news/reflecting-on-a-year-of-biodiversity-monitoring-in-liwonde/
  fetched: '2026-11-15'
  quote: The Biodiversity Monitoring Project was created to support African Parks
    in Liwonde with the monitoring of priority species, with a focus on reintroduced
    carnivores.
- claim: Its first task, in November 2020, was an aerial survey of Liwonde's wildlife
    populations.
  url: https://lilongwewildlife.org/news/reflecting-on-a-year-of-biodiversity-monitoring-in-liwonde/
  fetched: '2026-11-15'
  quote: In November 2020, our first task for the Biodiversity Monitoring Project
    involved an aerial survey of Liwonde’s wildlife populations.
- claim: In January 2022, the team reported maintaining databases on almost 2,000
    priority species reports and creating studbooks for every large carnivore in the
    park.
  url: https://lilongwewildlife.org/news/reflecting-on-a-year-of-biodiversity-monitoring-in-liwonde/
  fetched: '2026-11-15'
  quote: we’ve provided and maintained databases on almost 2,000 priority species
    reports
- claim: In January 2022, the team reported having deployed the first satellite transmitter
    on a pangolin in Liwonde.
  url: https://lilongwewildlife.org/news/reflecting-on-a-year-of-biodiversity-monitoring-in-liwonde/
  fetched: '2026-11-15'
  quote: Having deployed the first satellite transmitter on a pangolin in Liwonde
