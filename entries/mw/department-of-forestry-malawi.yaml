summary: Government forestry department under Malawi's Ministry of Natural Resources, protecting 88 gazetted
  forest reserves and producing the first national forest inventory and initial forest reference level
  with academic partners.
facts:
- claim: Has launched a National Forest Monitoring Unit charged with continually monitoring natural and
    plantation forests, according to Malawi's 2024 forest reference level.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: The DoF has launched a National Forest Monitoring Unit which has the specific charter to continually
    monitor the natural and plantation forests within Malawi.
- claim: Aggregated past inventories and new 2018 measurements to produce Malawi's first national forest
    inventory.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: the DoF aggregated and harmonized these past inventories, and incorporated new measurements taken
    in 2018, to fill gaps and produce the first truly national forest inventory
- claim: Developed Malawi's initial forest reference level in 2018-2019 with academic partners, and modified
    it after the UNFCCC technical assessment.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: The Department of Forestry (DoF) and academic partners developed the initial Malawi FRL in 2018-
    2019
- claim: In 2019 its staff were shown the use of dense time series of Sentinel-2 data for forest monitoring
    in a cloud environment, in a project with GAF Geospatial.
  url: https://www.gaf.de/operational-cloud-based-forest-monitoring-system-for-malawi/
  fetched: 2026-11-08
  quote: The project demonstrated successfully to staff in the DoF in Malawi the use of dense time series
    of Sentinel-2 satellite data for forest monitoring in a cloud-based environment.
- claim: Sits under the Ministry of Natural Resources and carries out the Forestry Act and the National
    Forest Policy.
  url: http://www.dof.gov.mw/
  fetched: 2026-11-08
  quote: The Department of Forestry, under the Ministry of Natural Resources, carries out the Forestry
    Act and the National Forest Policy in Malawi.
- claim: Protects 88 gazetted forest reserves.
  url: http://www.dof.gov.mw/
  fetched: 2026-11-08
  quote: Protecting 88 gazetted forest reserves and managing government plantations from planting through
    to harvest and replanting.
- claim: Lists Malawi's Second National REDD+ Forest Reference Level among its publications.
  url: http://www.dof.gov.mw/
  fetched: 2026-11-08
  quote: Malawi’s Second National REDD+ Forest Reference Level
- claim: Says its decisions rest on evidence from forest inventory and monitoring.
  url: http://www.dof.gov.mw/
  fetched: 2026-11-08
  quote: Decisions rest on evidence from the forest inventory and monitoring.
- claim: Headquarters at Nkhalango House, Lilongwe.
  url: http://www.dof.gov.mw/
  fetched: 2026-11-08
  quote: Nkhalango House, Lilongwe
