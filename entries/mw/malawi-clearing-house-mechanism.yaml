summary: Reported in February 2024 as introduced by the Environmental Affairs Department
  under the CBD, this biodiversity portal aimed to fill a central platform gap; experts
  were adding data.
facts:
- claim: Planet Defence reported in February 2024 that the Environmental Affairs Department
    had introduced a Clearing House Mechanism hosted under the CBD.
  url: https://planetdefence.substack.com/p/bio-portal-up-malawi-develops-central
  fetched: 2026-11-12
  quote: The Environmental Affairs Department (EAD) has taken a significant step towards
    coordinating biodiversity and natural resources knowledge management by introducing
    a Clearing House Mechanism hosted under the Convention on Biological Diversity
    (CBD).
- claim: Meant to serve as a portal for national knowledge and data on biodiversity
    and natural resources, filling the lack of a central platform for data from the
    Shire Valley Transformation Programme.
  url: https://planetdefence.substack.com/p/bio-portal-up-malawi-develops-central
  fetched: 2026-11-12
  quote: The newly introduced Clearing House Mechanism aims to fill this gap by serving
    as a portal for national knowledge and data on biodiversity and natural resources
    under the CBD convention.
- claim: Experts from academia, research institutions, forestry, wildlife, fisheries,
    agriculture and non-state actors were cataloguing and adding data to it.
  url: https://planetdefence.substack.com/p/bio-portal-up-malawi-develops-central
  fetched: 2026-11-12
  quote: Experts drawn from the academia, research institutions, forestry, wildlife,
    fisheries and agriculture and non-state actors are currently convening to catalogue
    and populate data in the biodiversity clearing house mechanism
