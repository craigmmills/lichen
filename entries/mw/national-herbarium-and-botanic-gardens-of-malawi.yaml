summary: Parastatal botanical institution in Zomba, described in its GBIF record as the principal botanical
  authority; it holds over 90,000 plant specimens, being digitised in BRAHMS, and has 26 GBIF datasets.
facts:
- claim: Its GBIF publisher record describes it as a parastatal botanical institution and the principal
    authority on botanical matters in Malawi.
  url: https://api.gbif.org/v1/organization/ef048156-6927-4ebf-a10c-131aa6a17966
  fetched: 2026-11-08
  quote: The National Herbarium and Botanic Gardens of Malawi (NHBG) is a parastatal botanical institution.
    It is the principal authority on botanical and related matters in Malawi.
- claim: The herbarium holds over 90,000 plant specimens collected across Malawi and is being digitised
    in the BRAHMS database.
  url: https://api.gbif.org/v1/organization/ef048156-6927-4ebf-a10c-131aa6a17966
  fetched: 2026-11-08
  quote: The herbarium therefore is Malawi's plant data bank and hence is very important for plant identification,
    taxonomic research, reference and loan exchange of herbarium specimens between herbaria. The collection
    is being digitized in BRAHMS database.
- claim: Its record gives an address in Zomba.
  url: https://api.gbif.org/v1/organization/ef048156-6927-4ebf-a10c-131aa6a17966
  fetched: 2026-11-08
  quote: '"address":["PO Box 528, Zomba, Malawi"],"city":"Zomba","country":"MW"'
