summary: Malawian NGO reporting biodiversity monitoring at Vwaza in 2017 and, in 2026, telemetry use,
  drone research and plans for eDNA in a pangolin survey.
facts:
- claim: In June 2017 it reported running a biodiversity monitoring programme from a research camp in
    Vwaza Wildlife Reserve, in partnership with Conservation Research Africa.
  url: https://lilongwewildlife.org/news/biodiversity-research/
  fetched: 2026-11-08
  quote: The biodiversity monitoring programme operates from our new research camp in Vwaza Wildlife Reserve,
    and is run in partnership with Conservation Research Africa.
- claim: In June 2017 it listed carnivore census and camera trapping, and bat diversity surveys including
    acoustic surveys, among the programme’s methods.
  url: https://lilongwewildlife.org/news/biodiversity-research/
  fetched: 2026-11-08
  quote: Carnivore census and camera trapping
- claim: In June 2017 it said monitoring results were shared with the Department of National Parks and
    Wildlife to inform management of the Nyika-Vwaza protected areas.
  url: https://lilongwewildlife.org/news/biodiversity-research/
  fetched: 2026-11-08
  quote: Results are shared with the Department of National Parks & Wildlife in order to to inform practical
    management of the parks that fall within the Nyika-Vwaza protected area ecosystem
- claim: Registered with Malawi's NGO Regulatory Authority.
  url: https://lilongwewildlife.org/news/biodiversity-research/
  fetched: 2026-11-08
  quote: NGORA Registration Number NGO/L/18/028
- claim: Its 2025-26 impact report, released in July 2026, says new biodiversity mapping initiatives continued
    at Lilongwe Wildlife Centre.
  url: https://lilongwewildlife.org/news/impact-report-2025-26/
  fetched: 2026-11-08
  quote: New biodiversity mapping initiatives, visitor attractions, and community engagement events continued
    to highlight the special appeal of this unique site
- claim: Says its biodiversity monitoring and research supports the conservation of targeted species and
    landscapes.
  url: https://lilongwewildlife.org/work/saving-wildlife/
  fetched: 2026-11-08
  quote: Our biodiversity monitoring and research supports the conservation of targeted species and landscapes.
- claim: Its team ran a workshop on how it uses telemetry, camera traps, radio and satellite tracking,
    and drones.
  url: https://lilongwewildlife.org/news/building-research-skills/
  fetched: 2026-11-08
  quote: Our team delivered a workshop on how we use technology in practical settings, including telemetry,
    camera traps, radio and satellite tracking, and drones.
- claim: In March 2026 it said it was developing a scientific paper on the use of drones in pangolin monitoring.
  url: https://lilongwewildlife.org/news/building-research-skills/
  fetched: 2026-11-08
  quote: a new scientific paper we are developing on the use of drones in pangolin monitoring
- claim: Two of its biodiversity research team attended an eDNA workshop in January 2026; in March 2026
    it said it hoped to use eDNA analysis in a pangolin survey in Malawi later that year.
  url: https://lilongwewildlife.org/news/building-research-skills/
  fetched: 2026-11-08
  quote: We are hoping to use eDNA analysis as part of a pangolin survey in Malawi later this year.
- claim: Gives its Malawian trust incorporation and NGO registration numbers.
  url: https://lilongwewildlife.org/
  fetched: 2026-11-08
  quote: Trust Incorporation No. TRNR-3Z3TZ6 NGORA Registration Number NGO/L/18/028
