facts:
- claim: Its 2024 Save Our Cedar report says it has set up multiple permanent monitoring plots across
    the mountain to track seedling survival.
  url: https://mountmulanje.org.mw/wp-content/uploads/2025/04/2024_mulanje_cedar_restoration_report.pdf
  fetched: 2026-11-08
  quote: We have set up multiple permanent monitoring plots (PMPs) throughout the mountainous terrain
    to evaluate and track the survival rates of seedlings.
- claim: The plots are used to gather ecological data, including soil, climate and vegetation composition.
  url: https://mountmulanje.org.mw/wp-content/uploads/2025/04/2024_mulanje_cedar_restoration_report.pdf
