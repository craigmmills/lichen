  quote: Central to achieving this aim is the development of a long-term Bats and
    Biodiversity Monitoring Programme (BMP) to assess the status, distribution of
    and threats to bats and biodiversity in Malawi.
- claim: Monitors permanent survey sites with harp traps, mist nets and acoustic recording
    on Song Meter SM3BAT and AudioMoth detectors.
  url: https://www.africanbatconservation.org/biodiversity-monitoring-programme
  fetched: 2026-11-12
  quote: We have permanent survey sites which are monitored using harp-trapping, mist
    netting and acoustic recording of bat echolocation calls using Song Meter SM3BAT
    and Audiomoth bat detectors.
- claim: Built a bats and biodiversity database of its records and trains Department
    of National Parks and Wildlife managers to use it.
  url: https://www.africanbatconservation.org/biodiversity-monitoring-programme
  fetched: 2026-11-12
  quote: We have created a bats and biodiversity database to store and record all
    sightings and records gathered from the ABC research projects and the Bats & Biodiversity
    Monitoring Programme.
