facts:
- claim: Launched by Lilongwe Wildlife Trust in 2019 to combine research, monitoring
    and public engagement on Malawi's vultures.
  url: https://lilongwewildlife.org/news/lwt-partners-launch-conserving-malawis-vultures-research-project-2/
  fetched: 2026-11-13
  quote: we’ve launched a new research project, Conserving Malawi’s Vultures , that
    will fill critical knowledge gaps for the region and develop Malawi’s first-ever
    vulture-focused conservation initiatives, using a combination of research, monitoring
    and public engagement.
- claim: In its January 2019 announcement, Lilongwe Wildlife Trust said its team had
    recently captured and tagged 16 critically endangered vultures in Majete Wildlife
    Reserve and Nyika National Park.
  url: https://lilongwewildlife.org/news/lwt-partners-launch-conserving-malawis-vultures-research-project-2/
  fetched: 2026-11-13
  quote: our research team recently captured and tagged a total of 16 critically endangered
    vultures in the Southern Region (Majete Wildlife Reserve) and Northern Region
    (Nyika National Park).
