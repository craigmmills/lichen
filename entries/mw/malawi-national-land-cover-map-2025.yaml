summary: An update of Malawi's national land cover map, whose then-current version
  dated from 2010, built by SBAPP with government partners using Google Earth Engine
  and under accuracy assessment in May 2025.
facts:
- claim: The SBAPP project in Malawi worked with stakeholders to update the national
    land cover map.
  url: https://www.must.ac.mw/posts/must-supports-updating-of-national-land-cover-map/details
  fetched: 2026-11-13
  quote: The Spatial Biodiversity Assessments, Prioritisation and Planning (SBAPP)
    project implemented in Malawi by the Malawi University of Science and Technology
    in partnership with the Environmental Affairs Department (EAD) has worked with
    various stakeholders to update the country’s land cover map.
- claim: The May 2025 article said the then-current version was released in 2010.
  url: https://www.must.ac.mw/posts/must-supports-updating-of-national-land-cover-map/details
  fetched: 2026-11-13
  quote: The current version of the land cover map was released in 2010
- claim: The SBAPP project manager said the map had been developed in Google Earth
    Engine and was under accuracy assessment before a validation meeting in May 2025.
  url: https://www.must.ac.mw/posts/must-supports-updating-of-national-land-cover-map/details
  fetched: 2026-11-13
  quote: we have developed the map using a modern technology called Google Earth Engine
- claim: The updated land cover map is an input to SBAPP's ecological condition map
    for Malawi.
  url: https://www.must.ac.mw/posts/must-supports-updating-of-national-land-cover-map/details
  fetched: 2026-11-13
  quote: one of its outputs is to come up with an ecological condition map for Malawi
    and this could not be done without an updated land cover map
