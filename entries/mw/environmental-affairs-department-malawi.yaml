summary: Malawi government department that is the focal point for the Convention on Biological Diversity,
  whose Biodiversity Unit led a September 2024 workshop on National Biodiversity Strategy and Action Plan
  targets.
facts:
- claim: Serves as the Malawi government's focal point for the Convention on Biological Diversity, according
    to a UN Biodiversity Lab report.
  url: https://unbiodiversitylab.org/wp-content/uploads/2026/02/UNBL-GBF-Mapping-Project-Technical-Report-Malawi-FNL.pdf
  fetched: 2026-11-08
  quote: under the leadership of EAD, which serves as the government’s CBD Focal Point
- claim: In September 2024 its Biodiversity Unit led a workshop in Blantyre to refine the preliminary
    targets of the National Biodiversity Strategy and Action Plan.
  url: https://mw.bl2.chm-cbd.net/en/node/10660
  fetched: 2026-11-08
  quote: led by the Biodiversity Unit under the Environmental Affairs Department of Malawi’s Ministry
    of Natural Resources and Climate Change, have gathered in Blantyre to refine the National Biodiversity
    Strategy and Action Plan (NBSAP) preliminary targets
- claim: Submitted Malawi's first forest reference level to the UNFCCC in 2019.
  url: https://redd.unfccc.int/media/malawi_second_national_redd_forest_reference_level_report_final_submitted.pdf
  fetched: 2026-11-08
  quote: the Environmental Affairs Department (EAD) submitted the FRL to the UNFCCC in 2019
