facts:
- claim: Arab Times reported in January 2026 that KEPS's team carried out field monitoring and documentation
    of birds at its World Winter Bird Count Day at Sulaibikhat Beach.
  url: https://www.arabtimesonline.com/news/keps-winter-bird-count-captures-a-rich-diversity-of-species
  fetched: 2026-11-12
  quote: Field monitoring and documentation by KEPS’ specialized team recorded large and diverse numbers
    of birds
- claim: Arab Times reports that KEPS has run the count since 2012, and that in 2026 it covered 1 to 17
    January across Kuwait for the Society's annual monitoring report.
  url: https://www.arabtimesonline.com/news/keps-winter-bird-count-captures-a-rich-diversity-of-species
  fetched: 2026-11-12
  quote: this year’s count was extended to cover January 1-17 across Kuwait, with systematic monitoring
    at different times and locations to be included in the Society’s 2026 annual monitoring report
- claim: The CBD's country profile for Kuwait lists the Environment Protection Society as an NGO among
    the bodies associated with biodiversity in Kuwait.
  url: https://www.cbd.int/countries/profile/?country=kw
  fetched: 2026-11-12
  quote: Environment Protection Society (NGO)
- claim: Arab Times reported in January 2026 that the team submitted all data collected during its field
    visits to eBird in preparation for Kuwait's 2025 annual bird monitoring report.
  url: https://www.arabtimesonline.com/news/five-new-bird-species-recorded-in-kuwait-bringing-the-total-to-424
  fetched: 2026-11-12
  quote: Shah said all data collected during the field visits were submitted to research lists on the
    global eBird platform in preparation for the release of Kuwait’s 2025 annual bird monitoring report.
