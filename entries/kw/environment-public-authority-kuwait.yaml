summary: Kuwaiti authority whose remit includes defining and managing protected areas, and which lists
  among its achievements a database of more than 250 geographic layers and satellite images.
facts:
- claim: Its remit includes defining Kuwait's protected areas, their borders, classification and how they
    are managed.
  url: https://epa.gov.kw/en-US/OrganizationalChart/Details
  fetched: 2026-11-12
  quote: Define the protected areas in Kuwait, define their geographical borders, classify and organize
    them, and how to manage and control them.
- claim: Lists eMISK among its own achievements, with a database of more than 250 geographic layers and
    satellite images covering the whole country.
  url: https://epa.gov.kw/en-US/Achievements/3
  fetched: 2026-11-12
  quote: includes more than 250 updated geographic layer and prepared for usage by applications and environment
    analyses and photos for satellites which is high quality and covers Kuwait country completely
- claim: The CBD's draft country profile for Kuwait says the EPA regularly monitors water benthic meiofauna,
    which comprise about 304 species, 45 found on Kuwait’s shores.
  url: https://www.cbd.int/countries/profile/?country=kw
  fetched: 2026-11-12
  quote: The Environment Public Authority (EPA) regularly monitors water benthic meiofauna that comprise
    about 304 species, 45 of which exist on Kuwait’s shores.
- claim: Gives its address as Shuwaikh Industrial, Fourth Ring Road, Kuwait.
  url: https://epa.gov.kw/en-us/eMISK
  fetched: 2026-11-12
  quote: Shuwaikh Industrial - Fourth Ring Road, next to the Ministry of Information.
