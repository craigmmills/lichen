summary: Project to document Kuwait's biodiversity and help establish a national database, funded by the
  Environment Public Authority and run by the International Union for Conservation of Nature.
facts:
- claim: Aims to document Kuwait's biodiversity from earlier records and selected field surveys, and to
    help establish a biodiversity database.
  url: https://iucn.org/our-work/region/west-asia/our-work/our-work/monitoring-and-documentation-biodiversity-kuwait
  fetched: 2026-11-12
  quote: The main purpose of this project is to document all the biodiversity elements in the State of
    Kuwait based on collecting previous records and updating the biodiversity components through selected
    field surveys.
- claim: Its objectives include a national biodiversity database linked with Kuwait's research and educational
    institutions.
  url: https://iucn.org/our-work/region/west-asia/our-work/our-work/monitoring-and-documentation-biodiversity-kuwait
  fetched: 2026-11-12
  quote: Establishing a national biodiversity database that is linked with the state’s research and educational
    institutions.
