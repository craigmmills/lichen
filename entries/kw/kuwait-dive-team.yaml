facts:
- claim: Al Jarida reports (June 2020) that the team, part of the Voluntary Environmental Foundation,
    monitored and documented coral reefs south of Umm Al-Maradim island and recorded their condition and
    water temperatures.
  url: https://www.aljarida.com/articles/1591434842023602100
  fetched: 2026-11-12
  quote: إن الفريق قام بمراقبة وتوثيق الشعاب المرجانية في جنوب جزيرة «أم المرادم» وشمال عارض الجزيرة
- claim: Al Jarida names it as the Kuwait Dive Team of the Voluntary Environmental Foundation.
  url: https://www.aljarida.com/articles/1591434842023602100
  fetched: 2026-11-12
  quote: أكد فريق الغوص الكويتي التابع للمبرة التطوعية البيئية استمرار متابعته بدأب حالة الشعاب المرجانية
    وبيئتها في البلاد
- claim: Al Jarida reported in October 2026 that the team fitted 35 moorings at Kubbar island as part
    of its project to install and maintain moorings around the southern islands and main coral reef sites.
  url: https://www.aljarida.com/article/147555
