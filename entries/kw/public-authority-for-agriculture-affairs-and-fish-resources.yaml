summary: Authority responsible, per the CBD's draft country profile, for national parks and combating
  desertification, and said by the Environment Public Authority to supervise the Sulaibikhat Bay marine
  reserve.
facts:
- claim: The CBD's draft country profile for Kuwait says the authority is responsible for establishing
    national parks and combating desertification in coordination with concerned authorities and in accordance
    with Kuwait Municipality’s plans.
  url: https://www.cbd.int/countries/profile/?country=kw
  fetched: 2026-11-12
  quote: The PAAFR is responsible for establishing national parks, combating desertification in coordination
    with concerned authorities and in accordance with the plans developed by the Kuwait Municipality,
    among other functions.
- claim: The Environment Public Authority says the Sulaibikhat Bay marine reserve, declared in 2016, is
    under this authority's supervision.
  url: https://epa.gov.kw/en-us/PA/PA06
  fetched: 2026-11-12
  quote: An existing marine reserve in Kuwait Bay (Sulaibikhat Bay) was declared by the Supreme Council
    for the Environment Resolution No. 7/2016, under the supervision of the Public Authority for Agriculture
    Affairs and Fish Resources.
