summary: Active project led by TUBITAK Marmara Research Center, running 19 March 2026 to 18 July 2028,
  planning a Black Sea FerryBox network and shared cloud data infrastructure, with Interreg funding of
  1,397,178.18 euros.
facts:
- claim: Aims to set up a FerryBox monitoring network in the Black Sea, with one mobile unit on a ship
    of opportunity and four stationary installations per country.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: The overall objective of the BLACKBOX is to implement and establish a comprehensive FerryBox
    monitoring network in the Black Sea, comprising one mobile unit on ship of opportunity and four stationary
    installations per country.
- claim: Plans to gather the countries' observations in a shared cloud data infrastructure with access
    through a web dashboard.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: (3) collect and integrate observations from the participating Black Sea countries in a shared
    cloud-based data infrastructure; (4) provide researchers and stakeholders access to the observations
    through a web-based dashboard
- claim: Interreg NEXT Black Sea Basin Programme funding of 1,397,178.18 euros.
