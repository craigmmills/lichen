summary: Sofia-based citizens' society and BirdLife partner that runs SmartBirds, built its
  database and the breeding bird atlas published through GBIF, and monitors birds.
facts:
- claim: Monitors endangered bird species every year, recording occupied nests and breeding
    success.
  url: https://bspb.org/en/activities/monitoring/
  fetched: 2026-11-08
  quote: Every year we carry out monitoring on many endangered species. We collect detailed
    data about the occupied nests and the number of young that hatched and were raised successfully.
- claim: Created the SmartBirdsPro mobile app and the SmartBirds database for volunteer data
    collection.
  url: https://bspb.org/en/activities/monitoring/
  fetched: 2026-11-08
  quote: In order to facilitate data collection for our volunteers, we created a specialized
    mobile application, SmartBirdsPro , and a data base, SmartBirds .
- claim: In Bulgaria the common bird monitoring programme began in 2004 across the whole country.
  url: https://bspb.org/en/about-birds/common-bird-monitoring/
  fetched: 2026-11-08
  quote: In Bulgaria the monitoring programme was launched in 2004 for the entire territory
    of the country.
- claim: GBIF published 87,747 records from the first Atlas of Breeding Birds in Bulgaria,
    developed and published by the society.
  url: https://bspb.org/en/huge-contribution-of-bspb-to-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: The dataset contains data (87,747 records) published in the first-ever Atlas of Breeding
    Birds in Bulgaria which was developed and published by the Bulgarian Society for the Protection
    of Birds.
- claim: With the National Museum of Natural History, it carried out the 2024 national breeding
    bird surveys for Birds Directive reporting.
  url: https://nmnhs.com/26010701-news_en.html
  fetched: 2026-11-08
  quote: an expert team from the National Museum of Natural History, Sofia and the Bulgarian
    Society for the Protection of Birds (BSPB), in partnership with the Executive Agency for
    the Environment (EEA) and the Ministry of Environment and Water (MOEW), successfully completed
    a large-scale study
- claim: A citizens' society working for the conservation of wild birds and their sites and
    habitats.
  url: https://bspb.org/en/about-us/about-the-bspb/
  fetched: 2026-11-08
  quote: The BSPB works for the conservation of wild birds and the sites and habitats that
    are important for them.
- claim: Its central office is in Sofia.
  url: https://bspb.org/en/contacts/
  fetched: 2026-11-08
  quote: BSPB’s central office in Sofia functions as a coordination and operational facility.
- claim: Registered as a data publisher with GBIF.
  url: https://api.gbif.org/v1/organization?country=BG&limit=100
  fetched: 2026-11-08
  quote: Bulgarian Society for the Protection of Birds
- claim: Streams live video from cameras it has placed in birds' nests.
  url: https://bspb.org/en/about-birds/cameras/
  fetched: 2026-11-08
  quote: Наблюдавайте на живо живота на птиците, в чиито гнезда сме поставили камери
- claim: Partner of BirdLife International in Bulgaria.
  url: https://bspb.org/en/about-us/about-the-bspb/
  fetched: 2026-11-08
  quote: For us it is an honour to be the partner of BirdLife International in Bulgaria.
- claim: Tracks vultures, eagles, pelicans and geese with satellite transmitters.
  url: https://bspb.org/en/satellite-tracking/
  fetched: 2026-11-08
  quote: We follow the movements and migration of vultures, eagles, pelicans and geese using
    satellite transmitters.
- claim: Its site lists SmartBirds, common bird monitoring, monitoring of endangered species,
    cameras and satellite tracking.
  url: https://bspb.org/en/
  fetched: 2026-11-08
  quote: Monitoring of endangered species
- claim: Its central office is in Sofia.
  url: https://bspb.org/en/
  fetched: 2026-11-08
