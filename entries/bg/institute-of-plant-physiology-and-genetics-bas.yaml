summary: A Bulgarian Academy of Sciences institute for plant research that lists DNA
  barcoding among its strategic orientations, is Bulgaria's iBOL node and is a partner
  of BIOSCAN Europe.
facts:
- claim: The Bulgarian Barcode of Life members page describes it as a national centre
    for research in plant ecophysiology, biochemistry, genetics and experimental algology.
  url: https://www.bgbol.org/members
  fetched: 2026-11-12
  quote: The Institute of Plant Physiology and Genetics (IPPG) at the Bulgarian Academy
    of Sciences (BAS) is a national centre for fundamental and applied research in
    the fields of plant ecophysiology, biochemistry, genetics and experimental algology.
- claim: Developing DNA-based markers, including DNA barcoding, to characterise biodiversity
    is one of its strategic orientations.
  url: https://www.bgbol.org/members
  fetched: 2026-11-12
  quote: The development of DNA-based marker systems, including DNA barcoding, for
    characterising biodiversity and supporting plant breeding practices has been one
    of the strategic scientific orientations of the institution.
- claim: It is Bulgaria's representative node of iBOL and a partner of BIOSCAN Europe.
  url: https://www.bgbol.org/members
  fetched: 2026-11-12
  quote: IPPG is a representative node for Bulgaria of the International Barcode of
    Life Consortium ( iBOL ) and a partner of its European hub Bioscan Europe .
