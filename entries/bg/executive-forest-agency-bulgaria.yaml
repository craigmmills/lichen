- claim: On 12 March 2026, BTA reported the agency’s account of a National Forest Protection
    Commission meeting on Bulgaria’s forest health and planned protection measures for 2026.
  url: https://www.bta.bg/en/green-BTA/1082368-national-forest-protection-commission-identifies-prolonged-drought-pests-as-mai
  fetched: 2026-11-08
  quote: Experts discussed the phytosanitary condition of Bulgaria's forests and the planned
    protection measures for 2026 at a meeting of the National Forest Protection Commission,
    the Executive Forests Agency said on Thursday.
- claim: The ministry’s October 2025 announcement named staff of the agency’s Vitosha, Rila
    Monastery and Bulgarka nature parks as participants in that year’s brown bear monitoring.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: 2026-11-08
  quote: as well as employees of the Vitosha, Rila Monastery and Bulgarka nature parks at
    the Executive Forestry Agency
