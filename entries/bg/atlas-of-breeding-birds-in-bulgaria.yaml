summary: Dataset of 87,747 breeding bird records covering all 1,240 ten-kilometre UTM squares in Bulgaria
  for 1996 to 2005, built by the Bulgarian Society for the Protection of Birds and published through GBIF.
facts:
- claim: Covers all 1,240 UTM squares of 10 by 10 km in Bulgaria for 1996 to 2005, using the European
    standard method.
  url: https://bspb.org/en/huge-contribution-of-bspb-to-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: It was done on the standard for Europe methodology and covers all the 1,240 10×10 km UTM squares
    on the territory of Bulgaria for the period 1996-2005.
- claim: Its 87,747 records were published through GBIF.
  url: https://bspb.org/en/huge-contribution-of-bspb-to-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: The dataset contains data (87,747 records) published in the first-ever Atlas of Breeding Birds
    in Bulgaria
- claim: The Habitat Foundation funded the upload through the project The Biodiversity of the Balkans
    in GBIF.
  url: https://bspb.org/en/huge-contribution-of-bspb-to-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: We express our gratitude to the Habitat Foundation for the financial support through the project
    “The Biodiversity of the Balkans in GBIF,”
