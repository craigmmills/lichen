facts:
- claim: BSPB's page says the census would run in June and July 2024 across the whole
    country and more than 5,000 locations, with volunteers visiting all stork nests.
  url: https://bspb.org/en/viii-international-white-stork-census/
  fetched: '2026-11-12'
  quote: The census will take place in June and July 2024, covering the entire country
    and more than 5,000 locations.
- claim: BSPB's 2024 census notice asked participants to share observations through
    the SmartBirds Pro mobile application or the SmartBirds website.
  url: https://bspb.org/en/viii-international-white-stork-census/
  fetched: '2026-11-12'
  quote: All that is needed is to share observations in the SmartBirds Pro mobile
    application or on the SmartBirds website
- claim: BTA reports that the census results were presented at its National Press
    Club in Sofia, in an article dated 9 October 2025.
