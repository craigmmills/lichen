summary: Programme run by the Executive Environment Agency, announced by the ministry
  on 20 October 2025 as its 16th annual brown bear monitoring, with 14 cameras planned
  in the Western Rhodopes and parallel DNA sampling under a pilot.
facts:
- claim: The Ministry of Environment and Water announced on 20 October 2025 the 16th
    annual monitoring of the brown bear, to record trends in its distribution, presence
    and numbers in Bulgaria.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: '2026-11-12'
  quote: the 16th annual monitoring of the Brown Bear (Ursus arctos) species will
    be conducted
- claim: Fourteen cameras were to be installed on three hunting farms in the Western
    Rhodopes to record bears' 24-hour activity for a month.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: '2026-11-12'
  quote: 14 cameras will be installed, which will collect information about the 24-hour
    activity of brown bears within a month
- claim: The ministry reported on 20 October 2025 that genetic samples were being
    collected in parallel under a pilot project for DNA monitoring of the species.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: '2026-11-12'
  quote: the collection of genetic samples from brown bears continues under a pilot
    project for DNA monitoring of the species
