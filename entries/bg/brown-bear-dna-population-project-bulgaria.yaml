summary: Reported by the ministry in September 2025 as Bulgaria’s first DNA-based
  bear count, with sampling underway, analysis planned in Slovenia and results expected
  in early 2027.
facts:
- claim: The Ministry of Environment and Water says (17 September 2025) that a project
    to determine brown bear numbers through DNA analysis is underway, funded by the
    Environment Programme and the first in Bulgaria.
  url: https://www.moew.government.bg/en/the-moew-is-working-to-reduce-tension-between-bears-and-humans-based-on-accurate-population-size-data/
  fetched: '2026-11-12'
  quote: a project to determine the number of the brown bear species through DNA analysis
    is already underway
- claim: The ministry reported on 17 September 2025 that scat samples were being collected
    across the species' range from late June to late November 2025 for analysis in
    Slovenia, with genotyping and data evaluation results expected in early 2027.
  url: https://www.moew.government.bg/en/the-moew-is-working-to-reduce-tension-between-bears-and-humans-based-on-accurate-population-size-data/
  fetched: '2026-11-12'
  quote: with the results of the isolation, genotyping and evaluation of the data
    obtained expected in early 2027
- claim: The ministry's notice of 20 October 2025 says the collection of genetic samples
    continues under a pilot project for DNA monitoring of the species.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: '2026-11-12'
  quote: the collection of genetic samples from brown bears continues under a pilot
    project for DNA monitoring of the species
