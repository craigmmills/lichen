summary: Active directorate for Central Balkan National Park, named by the ministry as a participant
  in 2025 brown bear field monitoring; staff detained two motorcyclists on a prohibited road
  on 15 March 2026.
facts:
- claim: On 15 March 2026, directorate staff found five motorcyclists on a prohibited road
    and detained two; the other three left before their identities were established.
  url: https://www.moew.government.bg/en/snowmobile-and-motorcycle-offenders-caught-in-a-week-in-all-three-national-parks/
  fetched: 2026-11-08
  quote: employees of the Central Balkan National Park Directorate, after repeatedly observing
    traces of unauthorized entry into the territory, identified five violators
- claim: The ministry says control of the protected areas' regimes is part of the national
    park directorates' regular work.
  url: https://www.moew.government.bg/en/snowmobile-and-motorcycle-offenders-caught-in-a-week-in-all-three-national-parks/
  fetched: 2026-11-08
  quote: The specialized actions to control compliance with the regimes in the three protected
    areas are part of the regular efforts by the national park directorates
- claim: The ministry’s October 2025 announcement named the Rila, Pirin and Central Balkan
    national park directorates as participants in that year’s brown bear field monitoring.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: 2026-11-08
  quote: the directorates of the three national parks - Rila, Pirin and Central Balkan, participate
    in the field observations
- claim: Nature FIRST says camera traps placed using Sensing Clues likelihood maps have been
    used against poaching and other illegal activity in Central Balkan National Park.
  url: https://www.naturefirst.info/resources/nature-first-and-bulgarian-academy-of-science-tackle-bear-conservation-challenges-with-innovation
  fetched: 2026-11-08
  quote: A key success has been the effective use of camera traps, supported by Nature FIRST
    and Sensing Clues Likelihood Maps , to combat poaching and other illegal activities in
    the Central Balkan National Park.
