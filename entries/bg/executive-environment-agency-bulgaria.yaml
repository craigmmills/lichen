facts:
- claim: Administers the National Automated System for Environmental Monitoring across the
    whole country.
  url: https://eea.government.bg/en/nsem
  fetched: 2026-11-08
  quote: ExEA administers the National Automated Syetem for Environmental Monitoring (NASEM)
    on the whole country
- claim: Maintains databases at national and regional level.
  url: https://eea.government.bg/en/nsem
  fetched: 2026-11-08
  quote: ExEA maintains various databases at national and regional level.
- claim: The ministry’s October 2025 announcement said staff of the agency’s Department of
    Biodiversity and Forest Ecosystems Monitoring were organising that year’s brown bear monitoring.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
  fetched: 2026-11-08
  quote: The monitoring is organized by employees of the Department of Biodiversity and Forest
    Ecosystems Monitoring at the Executive Environment Agency (EEA).
- claim: A July 2025 ministry announcement said the agency would administer activities under
    Bulgaria’s GBIF memorandum.
  url: https://www.moew.government.bg/en/bulgaria-joins-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: The activities under the memorandum will be administered by the Executive Environment
    Agency at the Ministry of Environment and Water.
- claim: The National Museum of Natural History says the 2024 breeding bird surveys for Birds
    Directive reporting were carried out under a contract with the agency.
  url: https://nmnhs.com/26010701-news_en.html
  fetched: 2026-11-08
  quote: were carried out under a contract with the EEA
