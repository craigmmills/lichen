summary: Active organisation conserving biodiversity in Bulgaria and neighbouring countries,
  which in 2015 presented a free web GIS platform and in 2021 began SaveGREEN wildlife crossing
  monitoring.
facts:
- claim: Works to conserve biodiversity in Bulgaria and neighbouring countries.
  url: https://biodiversity.bg/en/
  fetched: 2026-11-08
  quote: BBF has been working to conserve biodiversity in Bulgaria and neighboring countries
- claim: In 2015 it presented a web GIS platform giving free access to its spatial data, including
    field data collected by its experts.
  url: https://biodiversity.bg/en/The-web-based-GIS-platform-of-BBF-provides-free-access-to-environmental-spatial-data.p1360
  fetched: 2026-11-08
  quote: 'Field research data: data collected by BBF experts through the utilization of GPS'
- claim: In 2015, the GIS platform was offered for free use by citizens, organisations, institutions
    and businesses.
  url: https://biodiversity.bg/en/The-web-based-GIS-platform-of-BBF-provides-free-access-to-environmental-spatial-data.p1360
  fetched: 2026-11-08
  quote: is dedicated for free use by citizens, non-governmental and governmental organizations
    and institutions and businesses
- claim: In December 2021 it began a monitoring plan for wildlife crossings in the Rila-Verila-Kraishte
    ecological corridor, as part of the SaveGREEN project funded by Interreg Danube.
  url: https://biodiversity.bg/en/BBF-started-the-preparation-and-implementation-of-a-monitoring-plan-for-ecocorridor-Rila-Verila-Kraishte.p2361
  fetched: 2026-11-08
  quote: The preparation and implementation of a monitoring plan for the Rila-Verila-Kraishte
    ecological corridor began in December.
- claim: In its SaveGREEN monitoring of wildlife crossings on the Struma Motorway, photo traps
    were installed to record animals passing.
  url: https://biodiversity.bg/SaveGREEN--Presents-monitoring-results-on-wildlife-crossing-facilities-to-Bulgarian-regional-and-national-media-3-3981
  fetched: 2026-11-08
  quote: Photo traps have been installed to register and document the passage of animals
- claim: In November 2025, its projects page announced a project to identify and prioritise
    barriers for removal on the Veleka River, funded by the Open Rivers Programme; the announcement
    also spells the river name Veleika.
  url: https://biodiversity.bg/en/Actual-Projects.c135
  fetched: 2026-11-08
  quote: funded by the Open Rivers Programme (category A1 - Barrier Identification and Prioritisation)
