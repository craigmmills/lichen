summary: Closed 2024 survey of breeding birds for Birds Directive Art. 12 reporting,
  run by the museum and BSPB, covering 422 sites, 134,415 records and 314 species,
  completed in September 2025.
facts:
- claim: The National Museum of Natural History reports that the study, carried out
    from April to October 2024 under a contract with the Executive Environment Agency,
    covered 422 monitoring sites and entered 134,415 records into the database.
  url: https://nmnhs.com/26010701-news_en.html
  fetched: '2026-11-12'
  quote: over 2,400 man-days of fieldwork were carried out at 422 monitoring sites
    in the country
- claim: The status of 314 bird species was reported, with 469 assessments.
  url: https://nmnhs.com/26010701-news_en.html
  fetched: '2026-11-12'
  quote: the status of a total of 314 bird species in the country was reported, for
    which 469 assessments were prepared
- claim: The species are those in the National Biodiversity Monitoring System, and
    the work was completed at the end of September 2025.
  url: https://nmnhs.com/26010701-news_en.html
  fetched: '2026-11-12'
  quote: successfully completed a large-scale study and data collection for the preparation
    of an assessment of the status of 314 species of breeding birds
