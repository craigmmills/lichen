facts:
- claim: Says it makes its biodiversity data available through GBIF.
  url: https://www.nmnhs.com/e-natura/
  fetched: 2026-11-08
  quote: we strive to implement the best practices for accessing biodiversity data in Bulgaria
    by making it available on the GBIF (Global Biodiversity Information Facility)
- claim: As a DiSSCo-BG participant it had published over 26,615 records on GBIF by the end
    of 2024, from collections, monitoring projects and publications.
  url: https://www.nmnhs.com/25021801-news_en.html
  fetched: 2026-11-08
  quote: has published over 26 615 records on the Global Biodiversity Information Facility
    — GBIF website by the end of 2024, of which 11 416 are from museum collections, and the
    rest — from biodiversity monitoring projects and scientific publications.
- claim: Its expert team took part in the 2024 field surveys of breeding birds for Birds Directive
    reporting, under a contract with the Executive Environment Agency.
  url: https://nmnhs.com/26010701-news_en.html
