  url: https://catalogue.odis.org/view/402
  fetched: 2026-11-08
  quote: Bulgarian National Oceanographic Data Centre (BGODC) was established in 2002, as part of the
    Institute of Oceanology-Bulgarian Academy of Sciences (IO-BAS). It operates as a centre for oceanographic
    data collating and is responsible for processing, archiving and distributing marine data.
- claim: The catalogue says it has operated as the national oceanographic data centre since 2004.
