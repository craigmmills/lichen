summary: Volunteer bird count run by BSPB since 2004, with sites visited twice a year,
  294 plots analysed for long-term trends, and government funding secured to 2027
  as reported by EBCC.
facts:
- claim: BSPB's page says volunteers visit a chosen site twice a year, in May and
    June, and that the programme was launched in 2004 for the whole country.
  url: https://bspb.org/en/about-birds/common-bird-monitoring/
  fetched: '2026-11-12'
  quote: In Bulgaria the monitoring programme was launched in 2004 for the entire
    territory of the country.
- claim: The recorded observations are analysed and used as an indicator of the state
    of biodiversity in Bulgaria.
  url: https://bspb.org/en/about-birds/common-bird-monitoring/
  fetched: '2026-11-12'
  quote: The recorded observations are analyzed and are used as an indicator for the
    state of biodiversity in Bulgaria.
- claim: EBCC reports that long-term trends were analysed from 294 survey plots surveyed
    for at least three years, and a report compiled for 2005 to 2024.
  url: https://www.ebcc.info/?p=3732
  fetched: '2026-11-12'
  quote: Analyse long-term trends based on 294 survey plots surveyed at least for
    3 years
- claim: EBCC reports that BSPB secured three years of funding from a government fund
    managed by the Ministry of Environment and Water, to 2027.
  url: https://www.ebcc.info/?p=3732
  fetched: '2026-11-12'
  quote: BSPB has managed to ensure 3 years of funding from the Government fund managed
    by the Ministry of Environment and Water
- claim: EBCC reports that its funding enabled BSPB to provide Common Bird Monitoring
    Scheme data to the Executive Environment Agency as part of the 2024 monitoring
    work.
  url: https://www.ebcc.info/?p=3732
  fetched: '2026-11-12'
  quote: Provide CBMS data to the Executive Еnvironmental Аgency
