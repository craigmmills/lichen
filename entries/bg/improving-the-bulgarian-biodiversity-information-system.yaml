  quote: Project Improving the Bulgarian Biodiversity Information System (IBBIS) ensured
    the data collection back-end for all projects in programme BG03, including the
    mapping and assessment projects
- claim: It built IT infrastructure to display the mapping datasets, support volunteer
    data collection and connect to forest and invasive alien species databases.
  url: https://biodiversity.europa.eu/countries/bulgaria/maes
  fetched: 2026-11-12
  quote: The IBBIS project performed consistency checking of all data at the time
    of its receipt, developed the necessary IT infrastructure for displaying the mapping
    datasets, supporting volunteer data collection and interface with the forest and
    Invasive Alien Species databases.
- claim: BG03 was funded by the EEA Financial Mechanism 2009-2014.
  url: https://biodiversity.europa.eu/countries/bulgaria/maes
  fetched: 2026-11-12
  quote: The European Economic Area Financial Mechanism 2009–2014 through programme
