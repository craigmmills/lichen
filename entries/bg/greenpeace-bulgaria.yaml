  in 2026.
facts:
- claim: An investigation by Greenpeace Bulgaria and SkyTruth recorded more than 170 oil and
    ship-fuel slicks in Bulgarian Black Sea waters between 6 July 2024 and 26 June 2025, shown
    in an interactive map.
  url: https://www.greenpeace.org/bulgaria/press/11034/170-nefteni-petna-cherno-more/
  fetched: 2026-11-08
  quote: Това показва разследване на „Грийнпийс“ – България и SkyTruth, обобщено в нова интерактивна
    карта .
- claim: In 2026 it published a satellite analysis, based on Sentinel-1, Sentinel-2 and PlanetScope
    images, of dozens of oil slicks near the tanker Kairos off Burgas.
  url: https://www.greenpeace.org/bulgaria/press/14038/nefteni-petna-kairos/
  fetched: 2026-11-08
  quote: Анализът се базира на изображения от сателитните платформи Sentinel-1, Sentinel-2
    и PlanetScope.
