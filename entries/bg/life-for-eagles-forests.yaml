summary: Closed project (2013 to 2019) on lesser spotted eagle forest habitats, which
  found 73 active nests in 16 Natura 2000 sites and built a habitat distribution model
  from nests, land use, terrain and climate.
facts:
- claim: The project inventoried and identified the breeding areas of the lesser spotted
    eagle in 16 Natura 2000 sites, finding 73 active nests and 77 occupied territories.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE12-NAT-BG-001218/preserve-key-forest-habitats-of-the-lesser-spotted-eagle-aquila-pomarina-in-bulgaria
  fetched: '2026-11-12'
  quote: About 90 pairs of eagles were found, with 73 active nests and 77 occupied
    territories.
- claim: The team built a habitat distribution model from known nests, land use, terrain
    and bioclimatic variables.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE12-NAT-BG-001218/preserve-key-forest-habitats-of-the-lesser-spotted-eagle-aquila-pomarina-in-bulgaria
  fetched: '2026-11-12'
  quote: They established a Habitat Distribution Model for the species, incorporating
    information on known nests, land use, terrain and bioclimatic variables
- claim: Its monitoring methods were developed with a view to becoming national.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE12-NAT-BG-001218/preserve-key-forest-habitats-of-the-lesser-spotted-eagle-aquila-pomarina-in-bulgaria
  fetched: '2026-11-12'
  quote: The projects monitoring methodologies were developed and implemented with
    a view to them becoming national.
- claim: The project ran from 1 July 2013 to 1 July 2019.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE12-NAT-BG-001218/preserve-key-forest-habitats-of-the-lesser-spotted-eagle-aquila-pomarina-in-bulgaria
  fetched: '2026-11-12'
  quote: 'End Date: 01/07/2019'
