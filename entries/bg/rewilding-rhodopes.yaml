summary: Rewilding Europe reported in September 2025 that reintroduced bison at Zhenda wore
  GPS collars; the team also ran a 64-camera trap survey there that year.
facts:
- claim: In September 2025, Rewilding Europe reported that each reintroduced bison at Zhenda
    wore a GPS collar so the team could track its movements.
  url: https://rewildingeurope.com/blog/rewilding-lays-the-foundations-for-a-wilder-future-in-zhenda/
  fetched: 2026-11-08
  quote: Each bison is equipped with a GPS collar, allowing the Rewilding Rhodopes team to
    track their movement, study their behaviour, and ensure the animals are adapting well
    to their new home.
- claim: The team ran a camera trap survey with 64 cameras across Zhenda in 2025.
  url: https://rewildingeurope.com/blog/rewilding-lays-the-foundations-for-a-wilder-future-in-zhenda/
  fetched: 2026-11-08
  quote: the Rewilding Rhodopes team conducted a camera trap survey earlier this year, installing
    64 cameras across the landscape
- claim: In September 2025, the team said it planned an aerial survey with a multispectral
    camera to track vegetation change, to be repeated five years later.
  url: https://rewildingeurope.com/blog/rewilding-lays-the-foundations-for-a-wilder-future-in-zhenda/
  fetched: 2026-11-08
  quote: we will carry out an aerial survey with a multi-spectral camera — and repeat this
    in five years too — to track how the reintroduction of bison and other rewilding measures
    are influencing vegetation
