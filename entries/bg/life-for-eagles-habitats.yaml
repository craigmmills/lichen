id: life-for-eagles-habitats
kind: project
name: Conservation measures for the Lesser Spotted Eagle and its habitats in Bulgaria
  (LIFE for Eagle's Habitats)
also_known_as:
- LIFE for Eagles habitats
- LIFE18 NAT/BG/001051
scope: bg
ai_label: conservation-tech
realms:
- land
countries:
- bg
status: closed
summary: Closed project (2019 to 2025) with BSPB as partner, which satellite-tagged
  13 juvenile lesser spotted eagles for the first time in Bulgaria, with an EU contribution
  of EUR 1,460,260.
facts:
- claim: The EU LIFE database says 13 juvenile lesser spotted eagles were marked with
    satellite transmitters for the first time in Bulgaria, and the data used to identify
    staging and feeding areas.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-NAT-BG-001051/conservation-measures-for-the-lesser-spotted-eagle-and-its-habitats-in-bulgaria
  fetched: '2026-11-12'
  quote: For the first time in Bulgaria, 13 juvenile LSEs were marked with satellite
    transmitters
- claim: Monitoring of the species found 74 active nests and about 400 occupied breeding
    territories in the project area.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-NAT-BG-001051/conservation-measures-for-the-lesser-spotted-eagle-and-its-habitats-in-bulgaria
  fetched: '2026-11-12'
  quote: The monitoring of the species revealed 74 active nests, and approximately
    400 occupied breeding territories are reported in the project area.
- claim: The project ran from 2 August 2019 to 1 November 2025, with an EU contribution
    of EUR 1,460,260.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE18-NAT-BG-001051/conservation-measures-for-the-lesser-spotted-eagle-and-its-habitats-in-bulgaria
  fetched: '2026-11-12'
  quote: 'End Date: 01/11/2025'
- claim: The project site tracks 12 young eagles tagged with GPS-GSM transmitters
    before fledging between 2020 and 2023.
  url: https://eagleforests.org/transmitters/
  fetched: '2026-11-12'
  quote: We follow the movements and migration of 12 young Lesser Spotted Eagles tagged
    with GPS-GSM transmitters in Bulgaria.
