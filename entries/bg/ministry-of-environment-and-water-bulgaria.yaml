summary: Bulgarian ministry whose minister is the national competent authority for GBIF matters,
  and which runs the National System for Environmental Monitoring.
facts:
- claim: By a Council of Ministers decree, the Minister of Environment and Water is the national
    competent authority for GBIF matters in Bulgaria.
  url: https://www.moew.government.bg/en/bulgaria-joins-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: By a decree of the Council of Ministers, the Minister of Environment and Water has
    been designated as the national competent authority for issues related to the Global Biodiversity
    Information Facility in Bulgaria.
- claim: The ministry says that joining GBIF will help Bulgaria report on and meet its obligations
    to the Convention on Biological Diversity.
  url: https://www.moew.government.bg/en/bulgaria-joins-the-global-biodiversity-information-facility/
  fetched: 2026-11-08
  quote: Better data management by Bulgaria will also contribute to better reporting and implementation
    of obligations to the Convention on Biological Diversity (CBD)
- claim: The CBD country page for Bulgaria links the national clearing-house mechanism on
    the ministry's domain.
  url: https://www.cbd.int/countries?country=BG
  fetched: 2026-11-08
  quote: http://chm.moew.government.bg
- claim: The National System for Environmental Monitoring is managed by the Minister of Environment
    and Water through the Executive Environment Agency.
  url: https://eea.government.bg/en/nsem
  fetched: 2026-11-08
  quote: The system is managed by the Minister of Environment and Water through the Executive
    Environment Agency.
- claim: The ministry’s October 2025 announcement named its staff as participants in that
    year’s national brown bear field monitoring.
  url: https://www.moew.government.bg/en/the-annual-monitoring-of-the-brown-bear-species-begins/
