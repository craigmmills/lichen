facts:
- claim: DEIMS lists LTER Bulgaria as belonging to ILTER and LTER Europe, with seven verified member sites.
  url: https://deims.org/networks/20ad4fa2-cc07-4848-b9ed-8952c55f1a3f
  fetched: 2026-11-08
  quote: Verified member sites on DEIMS
- claim: In February 2021, the network announced the start of a project to upgrade its distributed scientific
    infrastructure.
  url: https://es-partnership.org/?p=14735
  fetched: 2026-11-08
  quote: The Bulgarian national Long-term ecosystem research network (LTER-Bulgaria) is starting the project
    “Upgrading the distributed scientific infrastructure”.
- claim: The February 2021 announcement named the Institute for Biodiversity and Ecosystem Research as
    consortium leader, with the Institute of Oceanology, the Forest Research Institute and the University
    of Forestry as partners.
  url: https://es-partnership.org/?p=14735
  fetched: 2026-11-08
  quote: Partners in the project consortium are the Institute for Biodiversity and Ecosystem Research
    at the Bulgarian Academy of Sciences (leading), the Institute of Oceanology “Fridtjof Nansen” – BAS,
    the Forest Research Institute – BAS, and the University of Forestry.
- claim: The project is carried out under the Ministry of Education and Science's National Roadmap for
    Research Infrastructure 2020 to 2027.
  url: https://es-partnership.org/?p=14735
  fetched: 2026-11-08
  quote: The project is implemented within the National Roadmap for Research infrastructure (2020-2027),
    Ministry of Education and Science.
