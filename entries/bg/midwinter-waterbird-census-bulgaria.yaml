summary: An active waterfowl census organised by the Executive Environment Agency
  and BSPB, whose January 2025 announcement scheduled its 49th round and planned national
  monitoring system data entry.
facts:
- claim: In its January 2025 announcement, the environment ministry said the census
    was organised by the Executive Environment Agency with BSPB, partner organisations
    and volunteers.
  url: https://www.moew.government.bg/en/the-mid-winter-census-of-wintering-waterfowl-will-be-conducted-16-19-january/
  fetched: 2026-11-12
  quote: is organized by the Executive Environment Agency (EEA) together with the
    Bulgarian Society for the Protection of Birds (BSPB), partner organizations, and
    volunteers.
- claim: The 49th census was set for 16 to 19 January 2025.
  url: https://www.moew.government.bg/en/the-mid-winter-census-of-wintering-waterfowl-will-be-conducted-16-19-january/
  fetched: 2026-11-12
  quote: The 49th mid-winter census of wintering waterfowl will be conducted from
    16 to 19 January 2025.
- claim: The January 2025 announcement said census field data would be entered into
    the National Biodiversity Monitoring System and that census data are reported
    annually to Wetlands International.
  url: https://www.moew.government.bg/en/the-mid-winter-census-of-wintering-waterfowl-will-be-conducted-16-19-january/
  fetched: 2026-11-12
  quote: Data from the mid-winter census of wintering waterfowl are reported annually
    to the international organization for the conservation and sustainable use of
    wetlands - Wetlands International.
