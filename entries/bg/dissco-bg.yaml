summary: Active project run by the National Museum of Natural History and the Institute of Biodiversity
  and Ecosystem Research, aiming by 2027 to digitise about 2 million items, with data shared to GBIF.
facts:
- claim: Digitised biodiversity data from DiSSCo-BG have been shared in an open, standard format with
    GBIF.
  url: https://www.nmnhs.com/25021801-news_en.html
  fetched: 2026-11-08
  quote: Digitized biodiversity data under the DiSSCo-BG project have been shared in an open and standardized
    format to the Global Biodiversity Information Facility
- claim: Collections are published on GBIF through regular automatic export from the DiSSCo-BG database
    in Specify 7.
  url: https://www.nmnhs.com/25021801-news_en.html
  fetched: 2026-11-08
  quote: The publication of collections on the gbif.org website is done through regular automatic export
    of data in the form of Darwin Core Archive from the DiSSCo-BG database in Specify 7.
- claim: Aims by 2027 to digitise and put online a large part of the two institutes' collections, about
    2 million items and 500,000 digital images.
  url: https://www.dissco-bg.eu/en/news/1
  fetched: 2026-11-08
  quote: The expectations of scientists are to be covered around 2 million collection items and about
    500 000 digital images of samples associated with the database.
- claim: Its first official meeting, on 12 January 2021, started stage one.
  url: https://www.dissco-bg.eu/en/news/1
  fetched: 2026-11-08
  quote: The first official online meeting conducted on January 12th 2021 has marked the start of stage
    one
- claim: Carried out under the National Roadmap for Scientific Infrastructures 2020-2027.
  url: https://www.dissco-bg.eu/en/news/1
  fetched: 2026-11-08
  quote: The project is implemented as part of the National Roadmap for Scientific Infrastructures for
    the period 2020-2027.
