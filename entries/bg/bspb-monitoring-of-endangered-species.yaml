summary: BSPB programme, run by the society and using SmartBirds, monitoring vultures,
  imperial eagles and red-breasted geese, including GPS tags on 32 griffon vultures
  by 2021 and photo traps at Egyptian vulture nests.
facts:
- claim: BSPB says griffon vulture monitoring in the Eastern Rhodopes has run since
    1988, and that 32 birds had been tagged with GPS transmitters by 2021.
  url: https://bspb.org/en/about-birds/monitoring-endangered-species/
  fetched: '2026-11-12'
  quote: Until 2021 32 birds of different ages have been tagged.
- claim: Photo traps and video cameras are used to monitor Egyptian vulture nests.
  url: https://bspb.org/en/about-birds/monitoring-endangered-species/
  fetched: '2026-11-12'
  quote: Photo traps and video cameras are also used for the monitoring of nesting
    pairs.
- claim: Imperial eagle monitoring has been systematic since 2000.
  url: https://bspb.org/en/about-birds/monitoring-endangered-species/
  fetched: '2026-11-12'
  quote: The monitoring of the population of the imperial eagle in Bulgaria is carried
    out systematically since 2000
- claim: Red-breasted goose monitoring began in the mid-1990s, with counts every two
    weeks from November to March.
  url: https://bspb.org/en/about-birds/monitoring-endangered-species/
  fetched: '2026-11-12'
  quote: Monitoring of the red-breasted goose started in the mid-1990s
