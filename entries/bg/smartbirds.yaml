summary: Biodiversity recording programme with two Android apps, run and built by the Bulgarian Society
  for the Protection of Birds, which describes it as the largest biodiversity database in Bulgaria.
facts:
- claim: SmartBirds Pro is a digital field notebook for recording observations of birds, mammals, amphibians,
    reptiles, invertebrates and protected plants.
  url: https://bspb.org/en/about-birds/smartbirds/
  fetched: 2026-11-08
  quote: SmartBirds Pro is a digital field notebook for quick and easy recording of observations of birds,
    mammals, amphibians, reptiles, protected and other invertebrates and protected plants.
- claim: The app is suited to specialised biological monitoring by experts as well as single entries by
    volunteers.
  url: https://bspb.org/en/about-birds/smartbirds/
  fetched: 2026-11-08
  quote: SmartBirds Pro is suitable both for single entries by active nature lovers, as well as for carrying
    out specialized biological monitoring by experts.
- claim: The BSPB team page describes SmartBirds as the largest biodiversity database in Bulgaria.
  url: https://bspb.org/en/about-us/team/
  fetched: 2026-11-08
  quote: He manages SmartBirds – the largest data base for biodiversity in Bulgaria.
- claim: SmartBirds and SmartBirds Pro are two Android apps.
  url: https://bspb.org/en/about-birds/smartbirds/
  fetched: 2026-11-08
  quote: SmartBirds and SmartBirds Pro are two separate applications for mobile devices under Android
    OS.
