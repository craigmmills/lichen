summary: An active project aiming to build a cross-border, non-invasive fish monitoring network for Black
  Sea reefs, planning an AI tool to identify reef fish from images and video, led by Karadeniz Technical
  University.
facts:
- claim: Aims to set up a cross-border, non-invasive fish monitoring network for Black Sea reef ecosystems.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: The overall objective of the WatchReefFish is to standardize, establish, perform, and enhance
    a crossborder, non-invasive fish monitoring (native and non-indigenous) network for reef ecosystems
    in the Black Sea.
- claim: Plans to use underwater visual census, baited remote underwater video and eDNA analysis.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: Baited Remote Underwater Video (BRUV) systems, and environmental DNA (eDNA) analysis
- claim: Planned outputs include an AI tool to recognise and identify reef fish species from images and
    video.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: an AI tool that can recognize and identify reef fish species from images and video records
