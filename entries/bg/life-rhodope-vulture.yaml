summary: Project aiming to restore the black vulture population in the cross-border Rhodopes of Bulgaria
  and Greece, planning GPS tracking to identify poisoning and other threat hotspots.
facts:
- claim: Aims to restore and conserve the black vulture population in the cross-border Rhodopes region
    of Bulgaria and Greece.
  url: https://rewilding-rhodopes.com/life-rhodope-vulture/
  fetched: 2026-11-08
  quote: The main objective of the project “Restoration of the Cinereous vulture population and trophic
    chain in the Bulgarian-Greek cross-border region” is the restoration and conservation of the population
    of the black vulture
- claim: Plans to identify and analyse poisoning and other threat hotspots through GPS tracking of wild
    and translocated cinereous vultures and wild griffon vultures.
  url: https://rewilding-rhodopes.com/life-rhodope-vulture/activities-life-rhodope-vulture/
  fetched: 2026-11-08
  quote: The poisoning and other threat hotspots for vultures are identified and analyzed through the
    GPS tracking of wild and translocated Cinereous Vultures and wild Griffon Vultures.
- claim: Plans to use trained dogs for monitoring and anti-poisoning patrols.
  url: https://rewilding-rhodopes.com/life-rhodope-vulture/activities-life-rhodope-vulture/
  fetched: 2026-11-08
  quote: The use of trained dogs for monitoring and anti-poisoning patrols is central to these actions.
