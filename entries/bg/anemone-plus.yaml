facts:
- claim: Aims to improve assessment of the Black Sea ecosystem's vulnerability to human and climate pressures.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: The primary objective of ANEMONE PLUS is to enhance the resilience and sustainability of the
    Black Sea marine ecosystem by improving the assessment of its vulnerability to human and climate pressures.
- claim: Plans tools for biodiversity assessment, pollution monitoring and environmental management based
    on underwater cameras, eDNA barcoding, remote sensing, passive samplers, passive acoustics, machine
    learning and modelling.
  url: https://io-bas.bg/en/international-projects/
  fetched: 2026-11-08
  quote: These tools will be based on advanced methodologies such as underwater cameras, eDNA barcoding,
    remote sensing technologies, passive samplers, passive acoustics, machine learning and modelling.
