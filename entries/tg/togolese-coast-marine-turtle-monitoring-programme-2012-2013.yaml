  ecoguards and 5 fishermen.
facts:
- claim: The monitoring ran from September 2012 to August 2013 as part of the environmental and social
    management plan for the container terminal at the Lomé port.
  url: https://api.gbif.org/v1/dataset/11c00ed9-1c1b-47d1-9eb4-66a491c7d7b3
