  quote: a follow-up program for marine turtles was developed between September 2012 and August 2013
- claim: Observations were made through a network of 10 ecoguards and 5 fishermen, and 740 occurrences
    were recorded.
  url: https://api.gbif.org/v1/dataset/11c00ed9-1c1b-47d1-9eb4-66a491c7d7b3
