summary: Closed camera-trap mammal inventory in Fazao-Malfakassa National Park, run by Agbo-Zégué and
  the University of Lomé, which recorded 1,564 individuals of 25 species from 61,089 photos taken by 100
  traps.
facts:
- claim: Agbo-Zégué says 100 camera traps were used and produced 61,089 photos, which were analysed.
  url: https://agbozegue.org/bilan-de-deux-annees-dinventaire-des-mammiferes-du-parc-national-de-fazao-malfakassa-par-les-cameras-trap/
  fetched: 2026-11-08
  quote: 100 caméras traps ont été utilisées pour réaliser l’étude et ont fourni un total de 61 089 photos
    qui par la suite ont été analysées.
- claim: The study recorded 1,564 individuals of 25 mammal species in the park.
  url: https://agbozegue.org/bilan-de-deux-annees-dinventaire-des-mammiferes-du-parc-national-de-fazao-malfakassa-par-les-cameras-trap/
  fetched: 2026-11-08
  quote: l’étude ressort un total, 1 564 individus appartenant à 25 différentes espèces de mammifères
    dans le parc
- claim: The results session on 30 August 2022 marked the end of the inventory project.
  url: https://agbozegue.org/bilan-de-deux-annees-dinventaire-des-mammiferes-du-parc-national-de-fazao-malfakassa-par-les-cameras-trap/
