facts:
- claim: Thairath reports that the Department of Fisheries launched Thailand FishAI
    on 2 May 2026. Its prototype initially identified 50 fish species from photos;
    a separate library held information on over 2,000 aquatic species.
  url: https://en.thairath.co.th/news/society/2930296
  fetched: 2026-11-15
  quote: Initially, the app can identify 50 species (it cannot identify all fish species
    yet).
- claim: Thairath reports that the app includes participatory fishery resource surveys,
    expert species verification and reporting of new fish discoveries.
  url: https://en.thairath.co.th/news/society/2930296
  fetched: 2026-11-15
  quote: The app also includes functions for participatory fishery resource surveys
    and conservation, expert species verification, reporting new fish discoveries,
    and more
- claim: Thairath reports that the department described the app as a research and
    development prototype.
  url: https://en.thairath.co.th/news/society/2930296
  fetched: 2026-11-15
  quote: the app is a research and development prototype AI system completed within
    a short period of just one year
- claim: Thairath reports that the app asks the public to collect and submit observations
    as citizen science, to expand biodiversity databases and support national aquatic
    resource surveys.
  url: https://en.thairath.co.th/plus/naturematter/106300
  fetched: 2026-11-15
  quote: encourages everyone to participate in data collection, observation, recording,
    and submitting information into the system as part of 'Citizen Science' to expand
    biodiversity databases and support national aquatic resource surveys
