summary: Camera-trap survey, run by the Department of National Parks and Panthera,
  that confirmed the flat-headed cat in Thailand for the first time since 1995, with
  13 detections in 2024 and 16 in 2025.
facts:
- claim: The flat-headed cat was confirmed by camera trap images, the first detection
    in Thailand since 1995.
  url: https://panthera.org/newsroom/endangered-flat-headed-cat-rediscovered-thailand-after-nearly-three-decades
  fetched: 2026-11-13
  quote: The existence of the flat-headed cat was confirmed through remote camera
    trap images, marking the first detection in Thailand since 1995.
- claim: There were 13 detections in 2024 and 16 in 2025 in Princess Sirindhorn Wildlife
    Sanctuary.
  url: https://panthera.org/newsroom/endangered-flat-headed-cat-rediscovered-thailand-after-nearly-three-decades
  fetched: 2026-11-13
  quote: Thirteen detections were made in 2024 and sixteen detections were made in
    southern Thailand’s Princess Sirindhorn Wildlife Sanctuary in 2025
- claim: Panthera says the results come from ongoing ecological research with the
    Hala-Bala Wildlife Research Station.
  url: https://panthera.org/newsroom/endangered-flat-headed-cat-rediscovered-thailand-after-nearly-three-decades
  fetched: 2026-11-13
  quote: the photographs and data recently released represent results of this ongoing
    research
