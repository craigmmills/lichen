summary: Marine and coastal ecosystem assessment and monitoring system that GISTDA says it developed in
  2022, with five marine spatial planning tools, including automatic mangrove status reporting and smartphone
  data collection by the public.
facts:
- claim: GISTDA says it developed the Marine GI Portal, a marine and coastal ecosystem assessment and
    monitoring system, in 2022 (BE 2565).
  url: https://www.gistda.or.th/th/news/marine-gi-portal-%e0%b8%a0%e0%b8%b2%e0%b8%a3%e0%b8%81%e0%b8%b4%e0%b8%88%e0%b8%97%e0%b8%b5%e0%b8%a1%e0%b8%97%e0%b8%b0%e0%b9%80%e0%b8%a5-gistda-%e0%b8%9a%e0%b8%b9%e0%b8%a3%e0%b8%93/
  fetched: 2026-11-08
  quote: GISTDA ได้มีการพัฒนาแพลตฟอร์ม “ Marine GI Portal ” หรือ “ ระบบประเมินและติดตามระบบนิเวศทางทะเลและชายฝั่ง
    ” ขึ้น เมื่อปี 2565
- claim: One of its five marine spatial planning tools analyses and reports mangrove status automatically.
  url: https://www.gistda.or.th/th/news/marine-gi-portal-%e0%b8%a0%e0%b8%b2%e0%b8%a3%e0%b8%81%e0%b8%b4%e0%b8%88%e0%b8%97%e0%b8%b5%e0%b8%a1%e0%b8%97%e0%b8%b0%e0%b9%80%e0%b8%a5-gistda-%e0%b8%9a%e0%b8%b9%e0%b8%a3%e0%b8%93/
  fetched: 2026-11-08
  quote: เครื่องมือที่ 2 คือ การวิเคราะห์และรายงานสถานภาพป่าชายเลนแบบอัตโนมัติ
- claim: Another tool lets the public collect marine spatial data by smartphone.
  url: https://www.gistda.or.th/th/news/marine-gi-portal-%e0%b8%a0%e0%b8%b2%e0%b8%a3%e0%b8%81%e0%b8%b4%e0%b8%88%e0%b8%97%e0%b8%b5%e0%b8%a1%e0%b8%97%e0%b8%b0%e0%b9%80%e0%b8%a5-gistda-%e0%b8%9a%e0%b8%b9%e0%b8%a3%e0%b8%93/
