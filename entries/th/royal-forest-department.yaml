summary: Thai forestry department that Matichon reported in September 2022 would receive duties
  and resources outside conservation forests, and which partners with the Mae Fah Luang Foundation
  on a community forest carbon project.
facts:
- claim: In September 2022, Matichon reported an agreement to transfer duties, units and resources
    outside conservation forest areas from the national parks department to the Royal Forest
    Department, to be completed by 30 September 2022.
  url: https://www.matichon.co.th/local/news_3563931
  fetched: 2026-11-08
  quote: กรมป่าไม้ รับโอนภารกิจ “นอกเขตป่าอนุรักษ์” จากกรมอุทยานฯ
- claim: ITTO names the Royal Forest Department as Kasetsart University’s intended collaborator
    in the completed border forest monitoring project.
  url: https://www.itto.int/project/id/PP-A_60-369
  fetched: 2026-11-08
  quote: Kasetsart University as the Executing agency in collaboration with the Royal Forest
    Department
- claim: In December 2023, Thansettakij reported that the Mae Fah Luang Foundation’s community
    forest carbon project worked with the Royal Forest Department.
  url: https://www.thansettakij.com/sustainable/zero-carbon/584075
  fetched: 2026-11-08
  quote: ได้ดำเนินการมาตั้งแต่ปี 2563 เป็นต้นมา ครอบคลุมพื้นที่ป่าชุมชนรวม 194,850 ไร่ โดยร่วมมือกับกรมป่าไม้
