facts:
- claim: In December 2023, Thansettakij reported plans for the Mae Fah Luang Foundation and
    Thaicom to combine satellite and geospatial data with AI and machine learning to develop
    a carbon credit platform.
  url: https://www.thansettakij.com/sustainable/zero-carbon/584075
  fetched: 2026-11-08
  quote: จะนำความเชี่ยวชาญด้านดาวเทียมและเทคโนโลยีอวกาศมาใช้ประโยชน์ร่วมกับข้อมูลภูมิสารสนเทศ
    และวิเคราะห์กับเทคโนโลยี Artificial Intelligence (AI) และ Machine Learning (ML) เพื่อพัฒนาเป็นแพลตฟอร์มคาร์บอนเครดิต
- claim: In December 2023, Thaicom’s chief executive said it would use remote sensing and
    geospatial data with AI and ML to check forest health and assess biomass in the foundation’s
    community forests.
  url: https://www.thansettakij.com/sustainable/zero-carbon/584075
  fetched: 2026-11-08
  quote: มาวิเคราะห์ร่วมกับเทคโนโลยี AI และ ML เพื่อตรวจสอบสุขภาพป่าไม้ และประเมินปริมาณมวลชีวภาพในพื้นที่ป่าชุมชนของมูลนิธิแม่ฟ้าหลวงฯ
    ต่อไป
- claim: The Nation reports that Thaicom has developed a system integrating satellite imaging
    with AI, created by Thai experts.
  url: https://www.nationthailand.com/business/tech/40057585
  fetched: 2026-11-08
  quote: Thaicom has developed a system that integrates satellite imaging with artificial
    intelligence (AI), entirely created by Thai experts.
- claim: The Nation reports that the system detects hotspots prone to forest fires.
  url: https://www.nationthailand.com/business/tech/40057585
  fetched: 2026-11-08
  quote: 'Pollution and wildfire monitoring: satellites detect hotspots prone to forest fires
    that often trigger severe air pollution.'
- claim: The Nation reports that the technology can evaluate forest areas and has been verified
    by the Thailand Greenhouse Gas Management Organisation.
  url: https://www.nationthailand.com/business/tech/40057585
  fetched: 2026-11-08
  quote: The technology can also evaluate forest areas and has already been verified by the
    Thailand Greenhouse Gas Management Organisation (TGO).
