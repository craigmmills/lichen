summary: Project run by IUCN with the Department of National Parks as partner, which
  in February 2022 aimed to map tigers and prey in the southern Western Forest Complex
  using camera traps and a GIS database.
facts:
- claim: In February 2022, the project's stated objective was to understand the distribution
    and status of tigers and tiger prey in the southern Western Forest Complex through
    camera traps and a GIS database.
  url: https://www.iucn.org/news/thailand/202202/request-proposals-rfp-assessing-tiger-and-prey-populations-southern-western-forest-complex-thailand
  fetched: 2026-11-13
  quote: through the deployment of camera traps and the development of a GIS database
- claim: In February 2022 IUCN requested proposals for camera-trap surveys of tigers
    and prey on DNP's 3x3 km grid standard in Thong Pha Phum and/or Lam Klong Ngu
    national parks.
  url: https://www.iucn.org/news/thailand/202202/request-proposals-rfp-assessing-tiger-and-prey-populations-southern-western-forest-complex-thailand
  fetched: 2026-11-13
  quote: The project must use camera trap techniques based on DNP’s research standard
    (3x3 km grid)
