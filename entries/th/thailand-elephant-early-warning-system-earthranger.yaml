summary: An active early warning system on EarthRanger using AI, camera traps and
  community data, in which 64 camera traps on 32 farms at Kuiburi have helped identify
  25 individual elephants since November 2025.
countries: []
facts:
- claim: Uses the EarthRanger platform, AI, camera traps and community data collection
    to warn of elephants leaving protected areas.
  url: https://www.earthranger.com/success-stories/when-the-forest-calls-ai-and-community-science-build-thailands-elephant-early-warning-system
  fetched: 2026-11-12
  quote: A new initiative is using the EarthRanger platform, AI, camera-trap technology,
    and community-driven data collection to change that.
- claim: At Kuiburi National Park, 64 AI-enabled camera traps on 32 farms have enabled
    researchers to identify 25 individual elephants since November 2025.
  url: https://www.earthranger.com/success-stories/when-the-forest-calls-ai-and-community-science-build-thailands-elephant-early-warning-system
  fetched: 2026-11-12
  quote: At Kuiburi National Park, 64 AI-enabled camera traps across 32 farms along
    the park’s border are capturing photos and videos of crop foraging behavior, enabling
    researchers to identify 25 individual elephants since the project began in November
    2025.
- claim: Global Forest Watch fire and deforestation alerts feed into EarthRanger.
  url: https://www.earthranger.com/success-stories/when-the-forest-calls-ai-and-community-science-build-thailands-elephant-early-warning-system
  fetched: 2026-11-12
  quote: The system also integrates Global Forest Watch fire and deforestation alerts
    across all four landscapes.
