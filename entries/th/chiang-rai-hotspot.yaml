facts:
- claim: In 2022, Mongabay reported that the app used NASA MODIS data to show fire hotspots
    in near real time.
  url: https://news.mongabay.com/2022/02/for-fire-ravaged-northern-thailand-theres-now-an-app-to-battle-the-blaze/
  fetched: 2026-11-22
  quote: In 2017, she came up with the “Chiang Rai Hotspot” smartphone application, which
    pulls hotspot data from the NASA’s MODIS satellite-based sensor to visualize, in near
    real time, fire hotspot locations.
- claim: Mongabay reported in 2022 that the app notified firefighters and nearby communities
    when it identified a new hotspot.
  url: https://news.mongabay.com/2022/02/for-fire-ravaged-northern-thailand-theres-now-an-app-to-battle-the-blaze/
  fetched: 2026-11-22
  quote: Whenever a new hotspot is identified, firefighters and nearby communities alike receive
    notifications on their phones.
- claim: Mongabay reported in 2022 that it was one of the most heavily used fire-monitoring
    tools at the Mirror Foundation, a Chiang Rai nonprofit.
  url: https://news.mongabay.com/2022/02/for-fire-ravaged-northern-thailand-theres-now-an-app-to-battle-the-blaze/
  fetched: 2026-11-22
  quote: It’s currently one of the most heavily used fire-monitoring tools at the Mirror Foundation,
    a Chiang Rai-based nonprofit
