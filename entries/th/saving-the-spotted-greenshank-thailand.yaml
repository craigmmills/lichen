summary: A Mubadala-funded project partnering with the Bird Conservation Society of
  Thailand, whose surveys continued until October 2023 and recorded a highest count
  of 249 birds in January 2023.
facts:
- claim: The Fund's 2023 report says it manages the project, funded by Mubadala Investment
    Corporation and Mubadala Petroleum, in partnership with the Bird Conservation
    Society of Thailand.
  url: https://reports.speciesconservation.org/stories/large-projects-thailand-2023/
  fetched: 2026-11-15
  quote: One project focuses on rehabilitating the wintering habitats of the Spotted
    Greenshank in partnership with the Bird Conservation Society
- claim: The 2023 report describes the project's aim as securing wintering habitats
    through field surveys and monitoring of the migratory population.
  url: https://reports.speciesconservation.org/stories/large-projects-thailand-2023/
  fetched: 2026-11-15
  quote: This project aims to secure their wintering habitats through field surveys
    and monitoring of the migratory population.
- claim: Field surveys on the species' distribution in the eastern Gulf of Thailand
    and Peninsular Thailand continued until October 2023.
  url: https://reports.speciesconservation.org/stories/large-projects-thailand-2023/
  fetched: 2026-11-15
  quote: Field surveys in Thailand aimed at enhancing our understanding of the distribution
    of the Spotted Greenshank in the eastern Gulf of Thailand and Peninsular Thailand
    continued until October 2023.
- claim: The highest count recorded was 249 birds at the Pak Thale-Lam Pak Ba site
    in Petchaburi in January 2023.
  url: https://reports.speciesconservation.org/stories/large-projects-thailand-2023/
  fetched: 2026-11-15
  quote: a count of 249 individuals was observed in January 2023
