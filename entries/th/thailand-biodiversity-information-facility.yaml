summary: Programme describing itself as Thailand's central biodiversity data centre,
  linking species data between agencies, with a 2023 reported plan for TISTR to share
  its database under a memorandum of understanding with ONEP.
facts:
- claim: TH-BIF describes itself as Thailand's central biodiversity data centre.
  url: https://thbif.onep.go.th/assets/themes/default/images/doc/01.pdf
  fetched: 2026-11-13
  quote: ศูนย์ข้อมูลกลางด้านความหลากหลายทางชีวภาพของประเทศไทย
- claim: It is a network system that gathers and links species data in Thailand between
    agencies and sectors.
  url: https://thbif.onep.go.th/assets/themes/default/images/doc/01.pdf
  fetched: 2026-11-13
  quote: เป็นระบบเครือข่ายที่รวบรวมและเชื่อมโยงข้อมูลสิ่งมีชีวิตในประเทศไทย
- claim: It offers a tool for collecting data and surveying organisms that uses crowdsourcing
    for spatial surveys.
  url: https://thbif.onep.go.th/assets/themes/default/images/doc/01.pdf
  fetched: 2026-11-13
  quote: โดยใช้เทคโนโลยี Crowdsourcing ในการสํารวจข้อมูลเชิงพื้นที่
- claim: The Bangkok Post reported in 2023 that TISTR would share its database with
    TH-BIF under a memorandum of understanding with ONEP.
  url: https://www.bangkokpost.com/thailand/general/2603305/biodiversity-database-gets-a-boost
  fetched: 2026-11-13
  quote: Under the agreement, the TISTR would share its database with the TH-BIF for
    the benefit of knowledge sharing, research and development and business use
- claim: The Bangkok Post says the aim is a national data warehouse and data mining
    system for species, invasive species, threatened species status, ecosystems and
    spatial data.
  url: https://www.bangkokpost.com/thailand/general/2603305/biodiversity-database-gets-a-boost
  fetched: 2026-11-13
  quote: The aim of the TH-BIF is to have a national data warehouse and data mining
    system for the storage of plants, animals, microorganisms, invasive species, the
    status of threatened species in Thailand, ecosystems and spatial data.
- claim: On 15 July 2025 ONEP's Biodiversity Management Division, with a consulting
    company, held a meeting on the development and service of the system, including
    the TH-BIF Journey application.
  url: https://www.onep.go.th/?p=104208
  fetched: 2026-11-13
  quote: การปรับปรุง Application THBIF Journey ให้สามารถใช้สะดวกและใช้งานได้ดียิ่งขึ้น
