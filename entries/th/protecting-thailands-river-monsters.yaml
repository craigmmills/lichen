summary: A project begun in March 2021 and extended to 2028, run by WCS Thailand and
  the Mohamed bin Zayed fund, which reported 15 camera traps and cumulative otter
  and crocodile captures by January 2023.
facts:
- claim: Began in March 2021 under Mubadala Phase 1 and was extended into Phase 2
    until 2028.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/protecting-thailands-river-monsters/
  fetched: 2026-11-15
  quote: it was decided to continue this project as part of the Mubadala Phase 2 initiatives
    until 2028
- claim: The project summary plans systematic field surveys from rafts and monitoring
    of forest health, riverside vegetation and human activity.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/protecting-thailands-river-monsters/
  fetched: 2026-11-15
  quote: In addition to the inventory of species in the river, the team will also
    monitor the health of the forest, the vegetation along the river, activities of
    people within the area, and natural characteristics of the sites.
- claim: Its research objectives include field surveys of rivers and tributaries and
    camera traps along river banks.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/protecting-thailands-river-monsters/
  fetched: 2026-11-15
  quote: Camera traps along river banks.
- claim: The 31 January 2023 update reports footage from 15 camera traps along the
    river and cumulative totals of 312 smooth-coated otter and 27 crocodile captures.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/protecting-thailands-river-monsters/
  fetched: 2026-11-15
  quote: To date the team has captured 312 incidents of Smooth-coated otters and 27
    of crocodiles on camera.
