  fetched: 2026-11-08
  quote: ขับเคลื่อนการบริหารจัดการด้านความหลากหลายทางชีวภาพของประเทศไทยด้วยแผนปฏิบัติการด้านความหลากหลายทางชีวภาพระดับชาติ
