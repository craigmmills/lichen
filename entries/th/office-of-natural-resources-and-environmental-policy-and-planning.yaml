summary: Agency of Thailand's environment ministry that sent the National Biodiversity Action
  Plan 2023-2027 to the Convention on Biological Diversity Secretariat on 31 October 2024.
facts:
- claim: Sent Thailand's National Biodiversity Action Plan 2023-2027 to the Convention on
    Biological Diversity Secretariat through the online reporting tool on 31 October 2024
    (2567 in the Thai calendar).
  url: https://www.onep.go.th/?p=105622
  fetched: 2026-11-08
  quote: สำนักงานนโยบายฯ ได้นำส่งให้สำนักเลขาธิการอนุสัญญาว่าด้วยความหลากหลายทางชีวภาพผ่านระบบ
    online reporting tool แล้ว เมื่อวันที่ 31 ตุลาคม 2567
- claim: The plan translates the Kunming-Montreal Global Biodiversity Framework into national
    plans and targets.
  url: https://www.onep.go.th/?p=105622
  fetched: 2026-11-08
  quote: โดยนำกรอบงานคุนหมิง-มอนทรีออลว่าด้วยความหลากหลายทางชีวภาพของโลก (Kunming-Montreal
    Global Biodiversity Framework)
- claim: Its site gives an address in Phaya Thai, Bangkok.
  url: https://www.onep.go.th/open-data-project-supported-by-envifund/
  fetched: 2026-11-08
  quote: อาคารทิปโก้ ทาวเวอร์ 2 ชั้นที่ 8 เลขที่ 118/1 ถ.พระราม 6 แขวงพญาไท เขตพญาไท กรุงเทพฯ
    10400
- claim: Its site publishes the list of projects funded by Thailand's Environment Fund in
    each fiscal year, as open data.
  url: https://www.onep.go.th/open-data-project-supported-by-envifund/
  fetched: 2026-11-08
  quote: รายชื่อโครงการ/กิจกรรม ที่ได้รับการสนับสนุนเงินจากกองทุนสิ่งแวดล้อม ในแต่ละปีงบประมาณ
