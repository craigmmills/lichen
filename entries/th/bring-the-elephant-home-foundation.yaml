- claim: Advertises for a camera trap field officer for a research project estimating
    the size and social structure of the wild elephant population of the Mae Ping-Om
    Koi Forest Complex.
  url: https://bteh.or.th/camera-trap-field-officer/
  fetched: 2026-11-12
  quote: 'BTEH is hiring a camera trap field officer for an existing new research
    project: Estimating the size and social structures of the wild elephant population
    of Mae Ping- Om Koi Forest Complex.'
- claim: The advertised officer's duties include deploying and maintaining camera
    traps in five protected areas to survey elephant population, demographics and
    distribution.
  url: https://bteh.or.th/camera-trap-field-officer/
  fetched: 2026-11-12
  quote: Manage the deployment and maintenance of camera traps in five protected areas
    in the Mae Ping-Omkoi Forest Complex, with the intent to survey elephant population,
    demographics and distribution.
- claim: Its 2024 annual report lists enhanced monitoring with camera traps.
