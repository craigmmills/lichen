summary: Self-described primary space and geo-informatics organisation of Thailand, established
  in 2000, which The Nation reported in June 2025 had developed a certified satellite-based
  carbon sequestration assessment method.
facts:
- claim: Describes itself as Thailand's primary organisation for developing space and geo-informatics
    technology.
  url: https://space.gistda.or.th/about-us
  fetched: 2026-11-08
  quote: is the nation’s primary organization dedicated to developing space and geo informatics
    technology to keep pace with the digital era
- claim: In June 2025, The Nation reported that GISTDA had developed a satellite-based carbon
    sequestration assessment method certified by the Thailand Greenhouse Gas Management Organisation.
  url: https://www.nationthailand.com/news/general/40051065
  fetched: 2026-11-08
  quote: GISTDA has developed a method using satellite data for carbon sequestration assessments,
    which has been certified by TGO
- claim: In June 2025, The Nation reported that GISTDA had proposed methods combining satellite
    imagery, AI and LiDAR to assess carbon sequestration.
  url: https://www.nationthailand.com/news/general/40051065
  fetched: 2026-11-08
  quote: These methods combine satellite imagery, AI, and LiDAR technology to assess carbon
    sequestration more accurately, efficiently, and cost-effectively.
- claim: Established on 3 November 2000 as a public organisation that took on all responsibilities
    for space technology and geo-informatics applications.
  url: https://www.gistda.or.th/about/organizarional-information-about-gistda-corporate-identity-gistda-core-value/
  fetched: 2026-11-08
  quote: GISTDA was established on November 3, 2000 as a public organization which assumes
    all responsibilities and activities for space technology and geo-informatics applications.
- claim: Its founding royal decree charges it to serve as a centre for satellite-based geo-informatics
    data and surveying data.
  url: https://www.gistda.or.th/about/organizarional-information-about-gistda-corporate-identity-gistda-core-value/
  fetched: 2026-11-08
  quote: (2) to study and analyse the satellite database and to serve as a centre for satellite
    based geo-informatics data and surveying data from other resources;
- claim: Developed the THEOS programme, Thailand's first operational earth observation satellite,
    with EADS Astrium as prime contractor.
  url: https://www.gistda.or.th/about/organizarional-information-about-gistda-corporate-identity-gistda-core-value/
  fetched: 2026-11-08
  quote: The THailand Earth Observation Satellite (THEOS) is the first operational earth observation
    satellite of Thailand. The THEOS program was developed by GISTDA, EADS Astrium, the prime
    contractor
- claim: Its site lists wildfire hotspot areas, a Carbon Atlas platform and a Marine GI Portal
    among its services.
  url: https://www.gistda.or.th/
  fetched: 2026-11-08
  quote: Wildfires – Wildfire-prone areas – Hotspot areas
- claim: Listed by CEOS as a member agency for Thailand since 2001.
  url: https://ceos.org/about-ceos/agencies/
  fetched: 2026-11-08
  quote: Geo-Informatics and Space Technology Development Agency (GISTDA) Thailand 2001 P
    - Pakorn Apaphant
- claim: Describes a forest area change monitoring system that analyses high-resolution satellite
    images with GIS, extended in fiscal year 2014 from the Dong Phayayen-Khao Yai forest to
    the whole country.
  url: https://www.gistda.or.th/news/monitoring-changes-in-forest-area/
  fetched: 2026-11-08
  quote: The monitoring system of forest area changes is an analysis of the high-resolution
    satellite images combined with the geographic information system to monitor, verify, and
    analyze forest area changes
- claim: Its address is in the Government Complex on Chaeng Watthana Road, Bangkok.
  url: https://www.gistda.or.th/news/monitoring-changes-in-forest-area/
  fetched: 2026-11-08
  quote: Ratthaprasasanabhakti Building, 6th and 7th Floors, Chaeng Watthana Road, Thung Song
    Hong, Lak Si, Bangkok 10210
