summary: Senegal’s national satellite programme. Its CubeSat GAINDESAT-1A, launched in August
  2024, collected environmental data and imagery, and a second satellite, GAINDESAT-1B, is
  planned.
facts:
- claim: GAINDESAT-1A collects environmental data and imagery for natural resource management.
