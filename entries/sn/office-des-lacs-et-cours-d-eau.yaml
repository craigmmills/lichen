summary: Senegalese public body created by a 2017 decree and draft law from the Office du Lac de Guiers,
  with missions extended to all inland lakes and watercourses, including water planning and aquatic plant
  management.
facts:
- claim: A 2017 law, adopted by the National Assembly on 28 March 2017, turned the Office du Lac de Guiers
    into the Office des Lacs et Cours d'eau and extended its missions to all inland lakes and watercourses
    of the country.
  url: https://www.vie-publique.sn/documents/7153/decret-n-2017-169-et-projet-de-loi-modifiant-la-loi-n-2010-01-portant-creation-de-loffice-du-lac-de
  fetched: '2026-11-16'
  quote: Le décret n°2017-169 du 25 janvier 2017 ordonne la présentation à l'Assemblée nationale du projet
    de loi visant à transformer l'OLAG en Office des Lacs et Cours d'eau (OLAC) et à étendre ses missions.
- claim: Its missions include planning and management of the waters and management of aquatic plants.
  url: https://www.vie-publique.sn/documents/7153/decret-n-2017-169-et-projet-de-loi-modifiant-la-loi-n-2010-01-portant-creation-de-loffice-du-lac-de
