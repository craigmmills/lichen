summary: Panthera’s camera-trap and GPS-collar monitoring of lions and other large carnivores
  in Niokolo-Koba National Park, under an agreement with the Senegalese national parks directorate.
facts:
- claim: A long-term agreement with the parks directorate covers park management and monitoring.
  url: https://panthera.org/blog-post/meet-me-niokolo-koba-senegal-where-wild-lives-west-african-lions-roar-returns
  fetched: '2026-10-31'
  quote: formalized through a long-term agreement with the DPN to strengthen park management
    and security
- claim: Lions were first collared in June 2021.
  url: https://panthera.org/blog-post/meet-me-niokolo-koba-senegal-where-wild-lives-west-african-lions-roar-returns
  fetched: '2026-10-31'
  quote: In June 2021, Florence, or Flo, was the first lion in Senegal to be collared
- claim: Camera-trap survey set up across the park with the directorate.
  url: https://panthera.org/blog-post/ensuring-future-niokolo-kobas-wildlife
  fetched: '2026-10-31'
  quote: my current task in Senegal is to set up a camera trap survey across a large chunk
    of Niokolo Koba National Park
- claim: A large carnivore monitoring campaign ran in 2025.
  url: https://panthera.org/blog-post/meet-me-niokolo-koba-senegal-where-wild-lives-west-african-lions-roar-returns
  fetched: '2026-10-31'
  quote: With the 2025 large carnivore monitoring campaign underway
- claim: Beauval Nature says Panthera developed and installed PoacherCam cameras that use
    an algorithm to tell animals from humans.
  url: https://www.beauvalnature.org/nos-actions/programmes-de-conservation/lions-du-niokolo-koba
  fetched: '2026-10-31'
  quote: L’ONG a également développé et installé des caméras PoacherCam®
- claim: Images go in real time to the operations centre.
  url: https://www.beauvalnature.org/nos-actions/programmes-de-conservation/lions-du-niokolo-koba
  fetched: '2026-10-31'
  quote: d’envoyer, en temps réel, les photographies au centre des opérations
