  url: https://badge.cse.sn/
  fetched: '2026-10-31'
  quote: Terrestrial ecosystems Biomass Bushfires Land use/cover
- claim: Announced by the director general of the Centre de Suivi Ecologique in February
    2026 as the digital form of national environment data.
  url: https://fr.allafrica.com/stories/202602200464.html
  fetched: '2026-10-31'
  quote: la digitalisation de ces informations à travers la BADGE (Base de Données
    Géographiques Environnementales du Sénégal)
- claim: Its biodiversity theme covers protected areas, Key Biodiversity Areas, threatened
    and invasive species and species mapping.
  url: https://badge.cse.sn/
  fetched: '2026-10-31'
  quote: 'Biodiversity theme: protected/conserved areas (terrestrial and marine),
    KBAs, VMEs, EBSA, threatened species and ecosystems, red and green lists, invasive
    species, species mapping, policies and governance.'
- claim: Holds ecosystem data on biomass, bush fires, land use and cover, coastal
    habitats and river and lake systems.
  url: https://badge.cse.sn/
  fetched: '2026-10-31'
  quote: 'Ecosystem states and dynamics: terrestrial (biomass, bushfires, land use/cover),
    marine and coastal (risks, habitats), river-lake systems (habitats, hydrological
    data), ecosystem goods and services.'
