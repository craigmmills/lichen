    data.
  url: https://www.cse.sn/2026/02/23/ceremonie-de-lancement-de-lannuaire-sur-lenvironnement-et-les-ressources-naturelles-aern-du-senegal-et-de-la-base-de-donnees-geographique-environnementale-du-senegal-badge/
