summary: West African coastal observatory carried by the Centre de Suivi Écologique,
  covering 12 countries and harmonising how coastal risk is monitored, with Digital
  Earth Africa coastline services.
facts:
- claim: A regional workshop brought together experts from 12 countries under ORLOA.
  url: https://digitalearthafrica.org/en_za/?p=5235
  fetched: '2026-10-31'
  quote: under the framework of the West African Coastal Observatory (ORLOA)
- claim: Digital Earth Africa says its coastline services cover all 12 member countries.
  url: https://digitalearthafrica.org/en_za/?p=5235
  fetched: '2026-10-31'
  quote: across all 12 member countries
- claim: Describes itself as a platform producing and sharing data on the West African
    coastal zone.
  url: https://gis.orloa.net/
  fetched: '2026-10-31'
  quote: The West African Coastal Regional Observatory is a dynamic platform dedicated
    to the production, analysis, and dissemination of reliable data and knowledge
    on the coastal zone.
- claim: Built a geospatial database of potential coastal pollution sources.
  url: https://gis.orloa.net/
  fetched: '2026-10-31'
  quote: the establishment of a geospatial database of potential sources of coastal
    pollution (BDGIPC_ORLOA_v1)
- claim: Senegal's GEO statement says the WACA ResIP initiative uses satellite imagery
    and geospatial data analysis.
  url: https://earthobservations.org/index.php/about-us/events/geo-global-forum-2025/statements/geo-global-forum-2025-statement-of-senegal
  fetched: '2026-10-31'
  quote: uses satellite imagery and geospatial data analysis to track coastal erosion,
    flooding risks, and sea-level rise impacts
- claim: Its data platform disseminates data for managing the West African coast.
  url: https://gis.orloa.net/
  fetched: '2026-10-31'
  quote: A dynamic regional platform dedicated to the dissemination of data, serving
    sustainable and effective management of the West African coast.
- claim: Combines field measurements, satellite imagery, local surveys and statistics
    to follow erosion, flooding by the sea, salinisation and ecosystem degradation.
  url: https://www.orloa.net/index.php/accueil/mission/
  fetched: '2026-10-31'
  quote: imagerie satellitaire
- claim: Grew out of a 2018 recommendation to turn the West African coastal observation
    mission into an observatory.
  url: https://www.orloa.net/index.php/accueil/historique/
  fetched: '2026-10-31'
  quote: a préconisé la transformation de la MOLOA en Observatoire Régional du Littoral
    Ouest Africain (ORLOA)
