summary: An active bird ringing programme at Djoudj National Bird Park, reported as
  operating again in 2024 after over a decade, with a work plan to ring pelicans,
  first with colour rings and later satellite transmitters.
facts:
- claim: The Alliance for Bird Ringing in Africa says the Djoudj ringing station was
    operating again in 2024 after more than a decade, ringing passerines and waders
    in the Djoudj and Langue de Barbarie parks.
  url: https://birdring.net/africa-news/
  fetched: '2026-11-09'
  quote: After more than a decade of inactivity, the ringing station at Djoudj National
    Bird Park was operational again in 2024.
- claim: The Alliance says the station is at the biological station in Djoudj National
    Bird Park and focuses on migrants and wintering birds; its location sentence shortens
    the park name to Oiseaux National Park.
  url: https://birdring.net/africa-news/
  fetched: '2026-11-09'
  quote: The station is located at the Biological Station of Oiseaux National Park
    and its main focus is on migrants and wintering birds.
- claim: It says a work plan with the National Parks Directorate covers ringing Senegal
    delta pelicans with colour-readable rings first and satellite transmitters later.
  url: https://birdring.net/africa-news/
  fetched: '2026-11-09'
  quote: to ring birds in the Senegal Delta using cr-Rings in the first phase, followed
    by satellite transmitters.
