summary: A closed survey project, run by the African Aquatic Conservation Fund with
  the University of St Andrews, whose fifth annual boat survey in February 2025 recovered
  acoustic recorders and aimed to build a dolphin species classifier library.
facts:
- claim: The Atlantic humpback dolphin consortium says AACF organised the fifth annual
    boat survey in the Saloum Delta in February 2025.
  url: https://sousateuszii.org/2025/03/29/back-on-the-boat-in-the-saloum-delta/
  fetched: '2026-11-09'
  quote: In February, 2025 CCAHD partner, the African Aquatic Conservation Fund (
    AACF ) organised the fifth annual boat survey campaign for the study of Atlantic
    humpback dolphins ( Sousa teuszii ) in the Saloum Delta.
- claim: During the February 2025 survey, the team recovered bottom-mounted acoustic
    recorders in coordination with protected area managers. The page lists two SoundTraps
    and one FPod but inconsistently calls them two recorders.
  url: https://sousateuszii.org/2025/03/29/back-on-the-boat-in-the-saloum-delta/
  fetched: '2026-11-09'
  quote: During the survey the team also recovered 2 bottom-mounted recorders (2 SoundTraps
    and 1 FPod) at strategic locations, in coordination with the managers of the MPAs
    and the Delta National Park.
- claim: Recordings made during dolphin encounters in the February 2025 survey were
    intended to build a library for developing an Atlantic humpback dolphin species
    classifier.
  url: https://sousateuszii.org/2025/03/29/back-on-the-boat-in-the-saloum-delta/
  fetched: '2026-11-09'
  quote: Recordings were also made during dolphin encounters to build up a library
    of ‘voucher’ recordings that can be used in the development of a species classifier
    for Atlantic humpback dolphins.
