summary: Fishermen's association founded in 2008, covering eight central Casamance
  villages, which gained statutory management rights over Kawawana in 2010, reported
  by Mongabay to span 9,665 hectares.
facts:
- claim: Fishermen created the association in 2008 and it now has members from eight
    villages of central Casamance.
  url: https://www.iccaregistry.org/en/explore/Senegal/kawawana
  fetched: '2026-11-16'
  quote: Created by fishermen in 2008, the association APCRM (Association of Fishermen
    of the Rural Community Mangagoulack) includes nowadays members of the communities
    of eight villages of central Casamance in Senegal.
- claim: It has established the Kawawana Indigenous and Community Conserved Area,
    with a no-take zone and areas of limited fishing.
  url: https://www.iccaregistry.org/en/explore/Senegal/kawawana
  fetched: '2026-11-16'
  quote: APCRM has established an Indigenous and Community Conserved Area (ICCA) named
    Kawawana with a no-take zones and other areas of limited fishing to protect local
    fish stocks.
- claim: It obtained the statutory rights to manage the coastal zone of Kawawana in
    2010, the first such devolution to a local community in Senegal.
  url: https://www.iccaregistry.org/en/explore/Senegal/kawawana
  fetched: '2026-11-16'
  quote: APCRM obtained the statutory rights of management of the coastal zone for
    Kawawana in 2010
- claim: The Natur'ELLES project, run by IUCN with SOCODEVI, handed floating surveillance
    platforms to the Kawawana area and two marine protected areas of Bignona.
  url: https://senego.com/protection-de-la-mangrove-a-bignona-le-projet-naturelles-deploie-des-plateformes-flottantes-contre-la-coupe-de-bois_1904367.html
  fetched: '2026-11-16'
  quote: ainsi qu’à l’Aire du Patrimoine autochtone et communautaire (APAC) Kawawana
- claim: Mongabay reports that Kawawana covers a coastal and maritime area of 9,665
    hectares governed and managed by local communities.
  url: https://news.mongabay.com/2022/06/a-tales-of-successes-and-new-challenges-in-senegal-qa-with-icca-coordinator-salatou-sambou/
  fetched: '2026-11-16'
  quote: Kawawana covers a coastal and maritime area of 9,665 hectares (23,882 acres)
    that are entirely governed, managed and maintained by local communities.
