summary: GIZ-implemented project with data354 and Senegal's environment ministry using AI,
  open satellite imagery and forest inventory data to generate forest carbon maps, building
  on the High Carbon Stock Approach.
facts:
- claim: The method uses AI to generate carbon maps from open satellite imagery and local
    inventory data.
  url: https://www.bmz-digital.global/en/from-motorbikes-to-satellites-senegals-new-ai-approach-to-forest-protection/
  fetched: '2026-10-31'
  quote: combining open satellite imagery with locally collected forest inventory data
- claim: An AI model is trained on biomass data from West African tree species.
  url: https://www.bmz-digital.global/en/from-motorbikes-to-satellites-senegals-new-ai-approach-to-forest-protection/
  fetched: '2026-10-31'
  quote: By training an AI model on biomass data from West African tree species
- claim: ITU material lists partners as data354 and METE/DEFCCS.
  url: https://www.itu.int/en/ITU-T/climatechange/symposia/202602/Documents/Julia%20Elisabeth%20Fink.pdf
  fetched: '2026-10-31'
  quote: 'Partners: data 354, Senegalese Climate Ministry (METE, DEFCCS), funded'
- claim: Scales the AI-based High Carbon Stock Approach to Senegal.
  url: https://www.bmz-digital.global/en/from-motorbikes-to-satellites-senegals-new-ai-approach-to-forest-protection/
  fetched: '2026-10-31'
  quote: Carbon Lense Senegal project, implemented by GIZ and supported by the BMZ
- claim: Combines open satellite imagery with field inventory data, aiming at a national biomass
    map.
  url: https://www.bmz-digital.global/en/from-motorbikes-to-satellites-senegals-new-ai-approach-to-forest-protection/
  fetched: '2026-10-31'
  quote: The next step is to extend the approach to other ecological zones in Senegal, ultimately
    creating a national biomass map.
- claim: data354 reports Random Forest as the best of three models tested.
  url: https://www.itu.int/en/ITU-T/academia/kaleidoscope/2026/Documents/Presentations/P4-presentation.pdf
  fetched: '2026-10-31'
  quote: Random Forest test RMSE - best of three models (training 11.85).
  ai_type: ml-supervised
- claim: iAfrica says the method combines open satellite imagery with field data.
  url: https://iafrica.com/?p=281021
  fetched: '2026-10-31'
  quote: The method combines open satellite imagery with locally collected forest inventory
    data to generate automated carbon maps.
