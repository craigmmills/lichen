facts:
- claim: The reserve covers about 13,300 hectares that the local community protects
    and manages.
  url: https://au-senegal.com/la-reserve-naturelle-communautaire-de-dindefelo,15784.html
  fetched: '2026-11-16'
  quote: La RNCD couvre aujourd’hui environ 13 300 hectares protégés et gérés par
    la communauté locale.
- claim: It received the 2024 Equator Prize for its local governance model.
  url: https://au-senegal.com/la-reserve-naturelle-communautaire-de-dindefelo,15784.html
  fetched: '2026-11-16'
  quote: la réserve a reçu en 2024 le Prix Équateur, valorisant son modèle de gouvernance
    locale et de développement durable.
- claim: The environment minister says the reserve was created in 2010 on 13,300 hectares
    to protect an ecosystem used by chimpanzees.
  url: https://lesoleil.sn/actualites/environnement/en-visite-a-kedougou-le-ministre-daouda-ngom-determine-a-preserver-la-reserve-naturelle-communautaire-de-dindefelo/
  fetched: '2026-11-16'
  quote: une réserve qui a été érigée en 2010 sur 13 300 hectares
- claim: Under its management committee the reserve has recruited 24 eco-guards, two
    per village, to fight bush fires and run reforestation, working with the Eaux
    et Forêts service and the Jane Goodall Institute.
  url: https://janegoodall.fr/app/uploads/2026/07/Reserve-de-Dindefelo-les-initiatives-locales-contre-les-feux-de-brousse-amplifiees-APS.pdf
