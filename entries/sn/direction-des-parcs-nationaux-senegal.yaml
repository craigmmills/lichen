summary: Senegal's national parks agency, which is also the Convention on Biological Diversity
  focal point. It runs camera-trap surveys with Panthera and trained on drones and AI bird
  counting with Senegal Flying Labs.
facts:
- claim: Manages national parks, reserves and conservation under the environment ministry.
  url: https://data.spacehubs.africa/database/entity/agencies/direction-des-parcs-nationaux/
  fetched: '2026-10-31'
  quote: responsible for managing national parks, reserves, and conservation efforts
- claim: Its director is the CBD focal point, according to Le Soleil.
  url: https://lesoleil.sn/actualites/environnement/biodiversite-le-senegal-prepare-sa-position-pour-la-cop17-cdb/
  fetched: '2026-10-31'
  quote: Le directeur des Parcs nationaux et point focal de la CDB
- claim: GIS experts from the DPN trained with Senegal Flying Labs on Picterra Detector for
    bird counts.
  url: https://flyinglabs.org/blog/drones-ai-help-improve-conservation-sustainability-efforts-in-a-protected-area
  fetched: '2026-10-31'
  quote: with GIS experts from the DPN and DAMP have spent time training using Picterra Detector
- claim: The waterbird counts it runs each 15 January are published as a dataset on GBIF by
    the Institut des Sciences de l'Environnement.
  url: https://api.gbif.org/v1/dataset/665edebe-8d21-49bd-9435-155ef2789ab0
  fetched: '2026-10-31'
  quote: effectués par la Direction des parcs nationaux
- claim: GIS experts trained on Picterra Detector to count birds.
  url: https://flyinglabs.org/blog/drones-ai-help-improve-conservation-sustainability-efforts-in-a-protected-area
  fetched: '2026-10-31'
  quote: The Senegal Flying Labs team with GIS experts from the DPN and DAMP have spent time
    training using Picterra Detector to count and characterize birds accurately.
- claim: Carries out the annual waterbird counts, published in a GBIF dataset.
  url: https://api.gbif.org/v1/dataset/665edebe-8d21-49bd-9435-155ef2789ab0
