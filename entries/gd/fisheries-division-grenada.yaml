facts:
- claim: Implemented a UNEP-CEP/CaMPAM mid-size grant to develop Grenada's national MPA structure, focused
    on the Sandy Island/Oyster Bed and Moliniere/Beausejour MPAs, according to a CaMPAM summary report
    (undated).
  url: https://campam.gcfi.org/CaribbeanChallenge/MidGrants/Grenada%20_Mid-size%20project_Summary_Report.pdf
  fetched: 2026-11-12
  quote: The Grenada Fisheries Division implemented the mid-size grant project supported by a UNEP- CEP/CaMPAM
    grant with funding from the Italian Cooperation Agency to assist the countries associated to the Caribbean
    Challenge.
- claim: The project provided operational equipment for MPA monitoring, enforcement and management, including
    a patrol boat.
  url: https://campam.gcfi.org/CaribbeanChallenge/MidGrants/Grenada%20_Mid-size%20project_Summary_Report.pdf
  fetched: 2026-11-12
  quote: Provide operational equipment for MPA monitoring, enforcement and management.
- claim: In 2026 the Woburn Bay MPA was described as a demonstration site for the Fisheries Division under
    the Caribbean Challenge Initiative.
  url: https://cvfv20.org/?p=30113
  fetched: 2026-11-12
  quote: serving as a demonstration site for the Fisheries Division under the Caribbean Challenge Initiative
