summary: Project run and led by The Nature Conservancy in the Greater Grenville Area
  of Grenada, using ecosystem-based adaptation against coastal erosion and flooding,
  with pilot reef structures in Grenville Bay monitored quarterly by TNC scientists
  and monthly by local partners.
