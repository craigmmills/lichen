    monitoring programme of the Moliniere-Beausejour MPA.
  url: https://campam.gcfi.org/CaribbeanChallenge/MPAFactsheets/MoliniereBeausejourMPA.pdf
  fetched: 2026-11-13
  quote: Monitoring programmes ReefCheck
- claim: The factsheet names the Fisheries Division, Ministry of Agriculture, Forestry
    and Fisheries as the primary management institution, with the Sustainable Grenadines
    Inc. among the other institutions that participate in management.
  url: https://campam.gcfi.org/CaribbeanChallenge/MPAFactsheets/MoliniereBeausejourMPA.pdf
