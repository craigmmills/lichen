summary: Raster map of Grenada's land cover and forest formations, made by decision
  tree classification of cloud-cleared Landsat imagery, mostly from November 2001,
  and funded by USAID and the International Institute of Tropical Forestry.
facts:
- claim: The USDA Forest Service FSGeodata Clearinghouse lists the raster map of land
    cover and forest formations developed for Grenada, with the Landsat image mosaics.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Grenada/IITF_CJS44_grenada_landcov_metadata.php
  fetched: 2026-11-15
  quote: This file is the raster map developed for Grenada.
- claim: The map was made by decision tree classification of cloud-cleared satellite
    imagery, as the cited 2008 paper by Helmer and others describes.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Grenada/IITF_CJS44_grenada_landcov_metadata.php
  fetched: 2026-11-15
  quote: Land cover and forest formation distributions for St. Kitts, Nevis, St. Eustatius,
    Grenada and Barbados from decision tree classification of cloud-cleared satellite
    imagery.
- claim: The most cloud-free image, the basis for most of the map, was Landsat ETM+
    imagery dated November 2001.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Grenada/IITF_CJS44_grenada_landcov_metadata.php
  fetched: 2026-11-15
  quote: The most cloud-free image, which is the basis for most of the map, was dated
    November 2001.
- claim: USAID and the International Institute of Tropical Forestry funded the work.
  url: https://data.fs.usda.gov/geodata/rastergateway/caribbean/Grenada/IITF_CJS44_grenada_landcov_metadata.php
  fetched: 2026-11-15
  quote: USAID and the International Institute of Tropical Forestry provided funding
    for this work.
