summary: Closed Rufford Foundation-funded project, covering 2012 to 2013, that aimed
  to establish Grenada Dove habitat requirements and threats, and per its final report
  trained Forestry Department staff to use tracking tunnels and camera traps.
facts:
- claim: The project aimed to establish the habitat requirements of the Grenada Dove
    and address the threats to it, and to train government National Park Officers.
  url: https://www.rufford.org/projects/nicholas-michael-bolton/habitat-requirements-threats-and-community-conservation-of-the-critically-endangered-grenada-dove-leptotila-wellsi/
  fetched: 2026-11-15
  quote: Establish the habitat requirements and address the threats to the Grenada
    Dove.
- claim: One aim was to establish a methodology to monitor introduced mongoose levels.
  url: https://www.rufford.org/projects/nicholas-michael-bolton/habitat-requirements-threats-and-community-conservation-of-the-critically-endangered-grenada-dove-leptotila-wellsi/
  fetched: 2026-11-15
  quote: 2. Establish a methodology to monitor introduced mongoose levels.
- claim: Another aim was to record dove activity at the threatened manmade wells in
    the Mt. Hartman area.
  url: https://www.rufford.org/projects/nicholas-michael-bolton/habitat-requirements-threats-and-community-conservation-of-the-critically-endangered-grenada-dove-leptotila-wellsi/
  fetched: 2026-11-15
  quote: 4. Record dove-activity at the threatened manmade wells in the Mt. Hartman
    area.
- claim: The final report says the project trained Forestry Department employees to
    use tracking tunnels and camera traps.
  url: https://media.rufford.org/media/project_reports/12069-1%20Final%20Report.pdf
  fetched: 2026-11-15
  quote: Government Forestry department to use tracking tunnels and camera traps.
