facts:
- claim: In February 2011 wardens of the Sandy Island Oyster Bed MPA on Carriacou
    took a Reef Check training course.
  url: https://www.reefcheck.org/grenadines-mpa-staff-trained-in-reef-check-methodology/
  fetched: 2026-11-13
  quote: their counterparts from the Sandy Island Oyster Bed MPA on Carriacou
- claim: Course participants collected data in the MPA, shallow by snorkelling and
    deeper by SCUBA, and were certified as Reef Check EcoDivers.
  url: https://www.reefcheck.org/grenadines-mpa-staff-trained-in-reef-check-methodology/
  fetched: 2026-11-13
  quote: participants collected data in deeper areas of the MPA using SCUBA
- claim: The training was meant to help MPA managers apply a standard protocol to
    monitor stressors on the reefs of the Grenadines regularly.
  url: https://www.reefcheck.org/grenadines-mpa-staff-trained-in-reef-check-methodology/
  fetched: 2026-11-13
  quote: This training will assist the MPA managers involved in implementing a standardized
    protocol to regularly monitor the effects of stressors
