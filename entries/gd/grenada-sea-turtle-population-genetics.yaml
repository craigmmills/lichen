summary: Closed 2022 to 2024 project using DNA analyses to identify possible origins and migration corridors
  of Grenada's hawksbill and green turtles, alongside nesting monitoring, run by the University of Plymouth
  and Ocean Spirits.
facts:
- claim: Ran from 2022 to 2024 and used DNA analyses to identify possible origins and migration corridors
    of Grenada's hawksbill and green turtles; the team also monitored nesting activities.
  url: https://www.plymouth.ac.uk/research/population-genetics-of-green-and-hawksbill-turtles-in-grenada-west-indies
  fetched: 2026-11-12
  quote: The research team identified the possible origins and migration corridors of Grenada's critically
    endangered hawksbill sea turtles and endangered green sea turtles by carrying out DNA analyses and
    assessing genetic connectivity with other populations.
- claim: Duration 2022 to 2024; the page says the project delivered evidence to inform management decisions.
  url: https://www.plymouth.ac.uk/research/population-genetics-of-green-and-hawksbill-turtles-in-grenada-west-indies
  fetched: 2026-11-12
  quote: Through this international partnership, this project delivered important evidence to help inform
    future management decisions by the Grenadian government
- claim: Research partners were St George's University, Ocean Spirits Inc. and the University of Georgia;
    funders were OMEF, WINDREF, the Sandals Foundation and SEE Turtles.
  url: https://www.plymouth.ac.uk/research/population-genetics-of-green-and-hawksbill-turtles-in-grenada-west-indies
  fetched: 2026-11-12
  quote: 'Research partners: St George''s University, Ocean Spirits Inc., University of Georgia.'
