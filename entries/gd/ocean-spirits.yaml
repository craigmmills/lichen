- claim: Has collected data on the leatherback nesting population at Levera beach since 2000.
  url: http://www.oceanspirits.org/
  fetched: 2026-11-12
  quote: In 2000, Ocean Spirits implemented a 5 year research study in the north east of Grenada with
    the aim of evaluating the current status of this leatherback sea turtle nesting population.
- claim: Describes itself as a non-profit organisation relying on volunteers, grants and donations, whose
