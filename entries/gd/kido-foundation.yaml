summary: Local NGO on Carriacou that, per Seacology, has restored mangroves, and which
  the Grenada Tourism Authority lists as monitoring nesting sea turtles, with a stated
  aim of preserving island ecosystems through conservation, research and youth education.
facts:
- claim: Seacology describes the YWF-Kido Foundation as a local NGO on Carriacou that
    has restored mangroves.
  url: https://www.seacology.org/project/carriacou-island/
  fetched: 2026-11-13
  quote: This project will expand a replanting effort begun by a local NGO, the YWF-Kido
    Foundation.
- claim: The Grenada Tourism Authority lists the foundation's nesting sea turtle monitoring
    at Petit Carenage Nesting Turtle Beach, 1 April to 31 August, among its programmes.
  url: https://www.puregrenada.com/kido-foundation/
  fetched: 2026-11-13
  quote: 'Where: Petit Carenage Nesting Turtle Beach, part of High North National
    Park'
- claim: The Grenada Tourism Authority page says the aim of the foundation is to preserve
    island ecosystems and biodiversity in Carriacou through conservation, environmental
    research, youth education and training.
  url: https://www.puregrenada.com/kido-foundation/
  fetched: 2026-11-13
  quote: The aim of Kido Foundation is to preserve the island ecosystems and biodiversity
    with conservation activities, environmental research, youth education and training
    in Carriacou.
- claim: In a 2005 to 2006 GEF Small Grants Programme project, the foundation was
    grantee for nesting and hatching turtle monitoring on Mt. Pleasant and Petit Carenage
    beaches, Carriacou, and said it intended to continue monitoring nesting sea turtles.
  url: https://sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?view=projectdetail&id=8426
  fetched: 2026-11-13
  quote: Kido Foundation intends to continue to restore and conserve the Carriacou
    coastal areas and to continue to monitor nesting sea turtles.
- claim: The WIDECAST page for Grenada cites a 2002 sea turtle monitoring and tagging
    project report from the KIDO Foundation, Carriacou.
  url: https://www.widecast.org/who-we-are/widecast-ccs/grenada
  fetched: 2026-11-13
  quote: 'WIDECAST Sea Turtle Monitoring and Tagging Programme. Project Report: 22
    May–21 October 2002. KIDO Foundation, Carriacou, Grenada.'
