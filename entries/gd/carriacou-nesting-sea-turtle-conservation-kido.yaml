summary: Closed Rufford Foundation-funded project, run by KIDO Foundation and led by Marina
  Fastigi, that planned hawksbill and leatherback nesting monitoring on Carriacou and, per
  its final report, trained and employed five local guides.
facts:
- claim: The project planned nesting hawksbill and leatherback turtle monitoring, tagging
    and data collection following WIDECAST protocol procedures, within and around High North
    National Park on Carriacou.
  url: https://www.rufford.org/projects/marina-fastigi/critically-endangered-nesting-sea-turtles-conservation-mangrove-ecosystem-restoration-and-youth-environmental-education-conservation-activities-in-carriacou-grenada-wi/
  fetched: 2026-11-15
  quote: Nesting Hawksbill and Leatherback turtle conservation, monitoring, rescue, tagging,
    data collection, disguise of turtle nests and tracks, following WIDECAST protocol procedures.
- claim: Trained local guides and volunteers patrolled the main nesting beach at Petit Carenage,
    monitoring hawksbills and leatherbacks.
  url: https://www.rufford.org/projects/marina-fastigi/critically-endangered-nesting-sea-turtles-conservation-mangrove-ecosystem-restoration-and-youth-environmental-education-conservation-activities-in-carriacou-grenada-wi/
  fetched: 2026-11-15
  quote: 'Sea Turtle Monitoring: trained local guides and volunteers patrol the main nesting
    beach (Petit Carenage), monitoring hawksbills and leatherbacks.'
- claim: After nesting, flipper tags were applied and carapace measurements and nest locations
    recorded.
  url: https://www.rufford.org/projects/marina-fastigi/critically-endangered-nesting-sea-turtles-conservation-mangrove-ecosystem-restoration-and-youth-environmental-education-conservation-activities-in-carriacou-grenada-wi/
  fetched: 2026-11-15
  quote: After eggs deposition flipper tags are applied, carapace measurements and nest location
    recorded
- claim: The final report gives a reporting period of 18 March 2018 to 31 August 2019.
  url: https://media.rufford.org/media/project_reports/25772-C%20Final%20Report.pdf
  fetched: 2026-11-15
  quote: Reporting period March 18, 2018 – August 31, 2019
- claim: The final report says five local nesting turtle monitoring guides were trained and
    employed, forming KIDO Turtle Monitoring Teams.
  url: https://media.rufford.org/media/project_reports/25772-C%20Final%20Report.pdf
  fetched: 2026-11-15
  quote: Five local Nesting Turtle Monitoring Guides
