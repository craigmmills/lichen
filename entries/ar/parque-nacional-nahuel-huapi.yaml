summary: A park monitoring huemul since 2021, with stations added in 2024, an action
  plan in preparation, and 14 waterbird sites surveyed within and nearby in February
  2025.
facts:
- claim: Camera-trap monitoring of the huemul corridor, begun in 2021, was strengthened
    in 2024 with new stations in the south of the park and neighbouring provincial
    areas.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: '2026-11-09'
  quote: se fortaleció el monitoreo con cámaras trampa en el corredor de huemul, iniciado
    en 2021, mediante la incorporación de nuevas estaciones de monitoreo en jurisdicción
    de la APN, Zona Sur del Parque Nacional Nahuel Huapi
- claim: A huemul conservation action plan for the park is being prepared.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: '2026-11-09'
  quote: Avanza la elaboración del Plan de Acción para la conservación del huemul
    del Parque Nacional Nahuel Huapi .
- claim: In February 2025 its technical, administrative and ranger staff carried out
    the Neotropical Waterbird Census at 14 sites in and around the park.
  url: https://www.anbariloche.com.ar/noticias/2025/03/06/97421-realizan-nuevo-censo-neotropical-de-aves-acuaticas
  fetched: '2026-11-09'
  quote: Personal técnico, administrativo y guardaparques de la Intendencia del Parque
    Nacional Nahuel Huapi realizó el Censo Neotropical de Aves Acuáticas
