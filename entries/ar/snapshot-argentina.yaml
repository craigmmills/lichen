summary: CONICET reports researchers coordinating annual camera-trap mammal monitoring within
  a network begun in the United States in 2019, with its first campaign planned for early
  October 2026.
facts:
- claim: CONICET reports that CONICET researchers coordinate Snapshot Argentina, part of an
    international biodiversity monitoring network that began in the United States in 2019.
  url: https://www.conicet.gov.ar/especialistas-del-conicet-coordinan-una-iniciativa-internacional-en-argentina-para-monitorear-mamiferos/
  quote: Investigadores del CONICET coordinan Snapshot Argentina, una iniciativa que es parte
    de una red internacional de monitoreo de biodiversidad que comenzó a desarrollarse en
    Estados Unidos en 2019
  fetched: '2026-11-03'
- claim: Its aim is standardised annual monitoring of terrestrial mammals with camera traps
    and a common protocol.
  url: https://www.conicet.gov.ar/especialistas-del-conicet-coordinan-una-iniciativa-internacional-en-argentina-para-monitorear-mamiferos/
  quote: El proyecto tiene como objetivo generar monitoreos estandarizados de mamíferos terrestres
    mediante cámaras trampa y un protocolo común que permita obtener datos comparables entre
    distintas regiones de manera anual.
  fetched: '2026-11-03'
- claim: The coordinating team is Sergio Lambertucci, Ilaria Agostini and Sebastián Ballari.
  url: https://www.conicet.gov.ar/especialistas-del-conicet-coordinan-una-iniciativa-internacional-en-argentina-para-monitorear-mamiferos/
  quote: el equipo coordinador, integrado por Lambertucci, Agostini y Sebastián Ballari, investigador
    del CONICET en el Parque Nacional Nahuel Huapi
  fetched: '2026-11-03'
- claim: The page gives the project's website for the protocol and sign-up.
  url: https://www.conicet.gov.ar/especialistas-del-conicet-coordinan-una-iniciativa-internacional-en-argentina-para-monitorear-mamiferos/
  quote: Más información del protocolo e inscripción en https://snapshot-argentina.com
  fetched: '2026-11-03'
- claim: The first monitoring campaign was planned to start in early October 2026.
  url: https://www.conicet.gov.ar/especialistas-del-conicet-coordinan-una-iniciativa-internacional-en-argentina-para-monitorear-mamiferos/
  fetched: 2026-11-03
  quote: La primera campaña de monitoreo está prevista para comenzar a principios de octubre.
