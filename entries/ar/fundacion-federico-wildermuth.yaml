summary: A foundation that owns and administers the Federico Wildermuth conservation
  unit, a Santa Fe provincial reserve under Law 12175 that gained 350 hectares in
  2008.
facts:
- claim: The foundation holds title to and administers the Federico Wildermuth conservation
    unit, which is under provincial jurisdiction (Law 12175) as part of the Santa
    Fe provincial system of protected areas.
  url: https://fundacionfw.org.ar/reserva/
  fetched: 2026-11-17
  quote: El dominio y la administración de la unidad de conservación lo realiza la
    Fundación Wildermuth. La jurisdicción es Provincial (Ley 12175) en tanto la Reserva
    está incorporada al Sistema Provincial de Áreas Protegidas.
- claim: A portion of 1,300 hectares of the Estancia La Invernada was made one of
    the first multiple-use reserves of the Santa Fe provincial system, and 350 hectares
    were added in 2008.
  url: https://fundacionfw.org.ar/reserva/
  fetched: 2026-11-17
  quote: una porción de 1300 hectáreas que formaban parte de la Estancia La Invernada,
    se constituyeron como una de las primeras reservas de Uso Múltiple del sistema
    Provincial de Santa Fe
