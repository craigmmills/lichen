summary: A reserve whose staff, alongside APN’s NEA office and Proyecto Yaguareté,
  had monitored jaguars since 2022, with 30 camera-trap stations and 18 records of
  one male by July 2024.
facts:
- claim: As reported in July 2024, its rangers and technicians had jointly implemented
    jaguar monitoring since 2022 with APN’s NEA regional office and Proyecto Yaguareté,
    using camera traps and signs to assess jaguar presence and prey availability.
  url: https://www.argentina.gob.ar/noticias/se-registro-al-yaguarete-tanhi-wuk-en-el-parque-nacional-el-impenetrable
  fetched: 2026-11-09
  quote: implementado desde 2022 de manera conjunta y articulada entre guardaparques
    y técnicos de la Reserva Natural Formosa, la Dirección Regional NEA de la APN
    y el Proyecto Yaguareté
- claim: By July 2024, 30 camera-trap stations had been installed, producing 18 records
    of the male jaguar Tañhi Wuk at seven stations.
  url: https://www.argentina.gob.ar/noticias/se-registro-al-yaguarete-tanhi-wuk-en-el-parque-nacional-el-impenetrable
  fetched: 2026-11-09
  quote: Durante estos años se instalaron 30 estaciones de cámaras trampa, logrando
    obtener hasta el momento 18 registros de Tañhi Wuk en siete de ellas.
