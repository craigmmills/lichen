summary: Project led by Fernando Zuloaga that compiles information on Argentina's 10,000 vascular
  plant species, with thirteen printed volumes published covering 80% of recorded species,
  plus a continually updated electronic version.
facts:
- claim: Compiles taxonomic information, descriptions, keys, illustrations, photographs, distribution
    and reference specimens for the 10,000 vascular plant species growing in Argentina.
  url: https://iboda.conicet.gov.ar/flora-argentina/
  fetched: '2026-11-03'
  quote: recopila por primera vez de manera unificada la información taxonómica, descripciones
    botánicas, claves, ilustraciones científicas, fotografías, distribución geográfica, ejemplares
    de herbario de referencia, bibliografía de las 10.000 especies de Plantas Vasculares
- claim: Offered in print and as an interactive electronic version that is continually updated.
  url: https://iboda.conicet.gov.ar/flora-argentina/
  fetched: '2026-11-03'
  quote: 'Toda esta información se ofrece en dos versiones: una versión impresa, y una versión
    electrónica, interactiva de actualización permanente a través del sitio Flora Argentina'
- claim: Thirteen printed volumes (18 tomes) have been published, covering 80% of the species
    recorded for Argentina.
  url: https://iboda.conicet.gov.ar/flora-argentina/
