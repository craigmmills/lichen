facts:
- claim: CONICET's forestry science network describes it as a tool for monitoring forest growth
    in Argentina's native forests.
  url: https://redforestal.conicet.gov.ar/tag/monitoreo
  fetched: '2026-11-15'
  quote: La Red Federal Bosque-Clima se posiciona como una herramienta clave para el monitoreo
    del crecimiento forestal en los bosques nativos de Argentina
- claim: Proposes long-term monitoring combining frequent measurements of tree attributes.
  url: https://bichosdecampo.com/existe-la-silvicultura-climaticamente-inteligente-desde-jujuy-la-biologa-eugenia-marcotti-forma-parte-de-una-red-cientifica-que-se-dedica-a-monitorear-los-bosques-y-todo-lo-que-depende-de-ello/
  fetched: '2026-11-15'
  quote: se conformó la Red Bosque-Clima, que propone el monitoreo a largo plazo (años a décadas),
    combinando mediciones a intervalos relativamente frecuentes de ciertos atributos de los
    árboles
- claim: Its work is organised in four geographic areas with 26 active stations.
  url: https://bichosdecampo.com/existe-la-silvicultura-climaticamente-inteligente-desde-jujuy-la-biologa-eugenia-marcotti-forma-parte-de-una-red-cientifica-que-se-dedica-a-monitorear-los-bosques-y-todo-lo-que-depende-de-ello/
  fetched: '2026-11-15'
  quote: 'El trabajo de la RED está organizado en cuatro áreas geográficas, donde se ubican
    26 estaciones activas: Noroeste, Noreste, Centro y Patagonia'
- claim: Brings together the Argentine Network of Permanent Plots (RAPP) and the Argentine
    Network of High-Resolution Dendrometers (RADAR).
  url: https://bichosdecampo.com/existe-la-silvicultura-climaticamente-inteligente-desde-jujuy-la-biologa-eugenia-marcotti-forma-parte-de-una-red-cientifica-que-se-dedica-a-monitorear-los-bosques-y-todo-lo-que-depende-de-ello/
  fetched: '2026-11-15'
  quote: Una es la Red Argentina de Parcelas Permanentes (RAPP) y la otra es la Red Argentina
