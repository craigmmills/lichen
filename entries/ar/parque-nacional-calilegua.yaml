summary: A national park that recorded taruca on camera traps in August 2019, after
  three monitoring campaigns since 2017, and by 2022 had 25 camera traps installed
  for jaguar monitoring.
facts:
- claim: In August 2019, park staff recorded taruca with camera traps as part of species
    monitoring in the park.
  url: https://www.argentina.gob.ar/noticias/imagenes-ineditas-de-taruca-registradas-por-camaras-trampa-en-calilegua
  fetched: '2026-11-09'
  quote: Personal del Parque Nacional Calilegua obtuvo este mes valiosas imágenes
    y videos en alta calidad de ejemplares de taruca ( Hippocamelus antisensis ),
    en el marco del monitoreo de la especie que se lleva adelante en el área protegida.
- claim: By August 2019, the park had carried out three taruca monitoring campaigns
    since joining in 2017, with camera traps installed on Cerro Hermoso.
  url: https://www.argentina.gob.ar/noticias/imagenes-ineditas-de-taruca-registradas-por-camaras-trampa-en-calilegua
  fetched: '2026-11-09'
  quote: El Parque Nacional Calilegua se sumó a su implementación en 2017, realizado
    tres campañas de monitoreo desde entonces.
- claim: By 2022, 25 camera traps had been installed in the park for APN jaguar monitoring
    in the Yungas.
  url: https://argentina.gob.ar/parquesnacionales/yaguarete/iniciativas
  fetched: '2026-11-09'
  quote: Ya se instalaron 25 cámaras trampa en el Parque Nacional Calilegua , en Jujuy,
    y otras 25 en el Parque Nacional Baritú , en Salta, ambos en la región de las
    Yungas
