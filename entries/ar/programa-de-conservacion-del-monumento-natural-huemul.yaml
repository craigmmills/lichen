name: Programa de Conservación del Monumento Natural Huemul
also_known_as:
- Programa Conservación del Huemul del Sur
scope: ar
ai_label: conservation-tech
realms:
- land
countries:
- ar
status: active
summary: A huemul conservation programme created in 2002 by the national parks administration,
  updated in 2021, covering six Patagonian national parks, with shared camera-trap
  methods and a 2026 staff training course.
facts:
- claim: The national parks administration created the programme in 2002, coordinated
    by its Patagonia regional office.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: 2026-11-09
  quote: La Administración de Parques Nacionales creó el Programa Conservación del
    Huemul del Sur , según la Resolución P.D. N° 75/2002
- claim: Updated in 2021, it has regional technical, operational and management staff
    to carry out its actions in Lanín, Lago Puelo, Nahuel Huapi, Los Alerces, Perito
    Moreno and Los Glaciares national parks.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: 2026-11-09
  quote: El programa tiene referentes técnicos regionales, operativos y de gestión
    destinados a implementar las acciones en los Parques Nacionales de Lanín, Lago
    Puelo, Nahuel Huapi, Los Alerces, Perito Moreno y Glaciares.
- claim: Its staff meet every two months, including on common methods for camera-trap
    monitoring.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: 2026-11-09
  quote: metodologías comunes para el monitoreo basado en cámaras trampa.
- claim: In 2026 a training course, "Camera traps, from image to information", was
    given for staff of conservation bodies monitoring huemul.
  url: https://www.argentina.gob.ar/parquesnacionales/conservacion/monumento-natural-huemul/iniciativas
  fetched: 2026-11-09
  quote: 'Durante julio se dictó la capacitación “Cámaras trampa: de la imagen a la
    información”'
