facts:
- claim: A system of permanent forest monitoring plots studying the long-term dynamics
    of the subtropical mountain forests of north-western Argentina.
  url: https://ier.conicet.gov.ar/red-subtropical-de-parcelas-permanentes-redspp-2/
  fetched: '2026-11-15'
  quote: The RedSPP is a system of permanent forest monitoring plots that studies
    long-term dynamics of the subtropical mountain forests of northwestern Argentina
- claim: The page published in September 2021 describes 87 permanent plots covering
    82.4 ha in Salta, Jujuy and Tucumán.
  url: https://ier.conicet.gov.ar/red-subtropical-de-parcelas-permanentes-redspp-2/
  fetched: '2026-11-15'
  quote: It consists of 87 permanent plots (82.4 ha)
- claim: The page published in September 2021 reports information on more than 45,000
    trees of 172 species.
  url: https://ier.conicet.gov.ar/red-subtropical-de-parcelas-permanentes-redspp-2/
  fetched: '2026-11-15'
  quote: So far, the RedSPP has generated information on more than 45000 trees belonging
    to 172 species.
