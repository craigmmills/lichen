summary: A Mapuche community reported in August 2024 as one of seven taking part in
  co-management of Lanín National Park, whose lonko said it won recognition of its
  territorial right from National Parks.
facts:
- claim: In August 2024 Río Negro reported that Cayún was one of seven Mapuche communities
    taking part in co-management of Lanín National Park with the National Parks Administration.
  url: https://www.rionegro.com.ar/politica/los-parques-nacionales-de-la-region-buscan-sostener-el-vinculo-con-comunidades-mapuches-3722723/?amp=1
  fetched: 2026-11-17
  quote: En el parque Lanín, con epicentro en San Martín de Los Andes, intervienen
    en el comanejo las comunidades Ñorquinco, Aigo, Lefiman, Lafkenche, Raquitue,
    Cayun y Curruhuinca.
- claim: Its lonko said the community won National Parks' recognition of its territorial
    right and support to administer a campsite and ceremonial space at Piedra de Trompul.
  url: https://www.rionegro.com.ar/politica/los-parques-nacionales-de-la-region-buscan-sostener-el-vinculo-con-comunidades-mapuches-3722723/?amp=1
  fetched: 2026-11-17
  quote: Dijo que la comunidad Cayún, por ejemplo, no solo logró el reconocimiento
    de Parques a su derecho territorial sino el acompañamiento para la administración
    de un camping y un espacio ceremonial en Piedra de Trompul
