summary: Jaguar conservation programme run by CeIBA, whose 2024 survey with Brazil's Projeto
  Onças do Iguaçu covered over 570,000 hectares using 267 camera-trap stations.
facts:
- claim: Última Hora reports that in Argentina the binational census is carried out by Proyecto
    Yaguareté, run by the civil association CeIBA.
  url: https://www.ultimahora.com/conservacionistas-procuraran-no-perderle-pisada-a-los-yaguaretes
  quote: En Argentina, el Proyecto Yaguareté, ejecutado por la Asociación Civil Centro de
    Investigaciones del Bosque Atlántico (CEIBA).
  fetched: '2026-11-03'
- claim: In June 2017, CONICET described it as an organisation that had worked for 15 years
    on conserving the species, with CONICET researcher Agustín Paviolo as a reference person.
  url: https://www.conicet.gov.ar/nuevo-monitoreo-cientifico-indica-que-crecio-la-poblacion-de-yaguaretes-en-misiones/
  quote: quien también es referente de Proyecto Yaguareté , una organización que trabaja hace
    15 años para la conservación de la especie.
  fetched: '2026-11-03'
- claim: The 2024 jaguar survey was led by scientists of the Instituto de Biología Subtropical
    (UNaM-CONICET) in the Proyecto Yaguareté, with Brazil's Projeto Onças do Iguaçu.
  url: https://unidosporelyaguarete.vidasilvestre.org.ar/materiales/nuevo-relevamiento-alerta-sobre-una-leve-baja-en-la-poblacion-de-yaguaretes-en-la-selva-misionera/
  fetched: 2026-11-03
  quote: El estudio fue liderado por científicos del Instituto de Biología Subtropical (UNAM
    – CONICET) nucleados en el Proyecto Yaguareté (CeIBA – CONICET) en Argentina y el Proyecto
    Onças do Iguaçu (ICMBio – Brasil)
- claim: The 2024 survey covered more than 570,000 hectares with 267 camera-trap stations.
  url: https://unidosporelyaguarete.vidasilvestre.org.ar/materiales/nuevo-relevamiento-alerta-sobre-una-leve-baja-en-la-poblacion-de-yaguaretes-en-la-selva-misionera/
  fetched: 2026-11-03
  quote: se abarcó una superficie de más de 570.000 hectáreas entre ambos países, con 267
    estaciones de muestreo
