  with a satellite collar; it belongs to the Selva Paranaense jaguar subcommission.
facts:
- claim: Misiones Online reported in April 2025 that genetic samples obtained during
    the jaguar capture would enrich the IMiBio biobank.
  url: https://misionesonline.net/2025/04/08/misiones-i-capturaron-a-las-yaguaretes-elecha-y-ararokai-en-iguazu-para-investigar-su-salud-y-movimientos/
  fetched: '2026-11-09'
  quote: Las muestras genéticas obtenidas durante la captura enriquecerán el Biobanco
    del IMiBio, contribuyendo a la conservación del felino más grande de América.
- claim: Misiones Online reports that IMiBio technicians supported Proyecto Yaguareté
    researchers in capturing two jaguars, one of which was fitted with a satellite
    collar.
  url: https://misionesonline.net/2025/04/08/misiones-i-capturaron-a-las-yaguaretes-elecha-y-ararokai-en-iguazu-para-investigar-su-salud-y-movimientos/
