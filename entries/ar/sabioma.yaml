facts:
- claim: An international collaboration between Argentina and the United Kingdom studying nature-based
    solutions to biodiversity loss, climate change and social wellbeing.
  url: https://sabioma.org/es/
  fetched: 2026-11-03
  quote: SABIOMA es una colaboración internacional entre Argentina y el Reino Unido, que estudia soluciones
    basadas en la naturaleza para enfrentar los desafíos de la pérdida de biodiversidad, el cambio climático
    y el bienestar social.
- claim: In May 2023, the Instituto de Ecología Regional reported testing AMI traps with NERC staff within
    SABIOMA; an AI algorithm would identify photographed moths, but still needed training for local species.
  url: https://ier.conicet.gov.ar/monitoreos-automatizados-de-biodiversidad/
  fetched: 2026-11-03
  quote: Luego, las mariposas nocturnas de las fotos tomadas, serán determinadas por un algoritmo de inteligencia
    artificial (IA) que está entrenado para reconocerlas a nivel de especie.
- claim: In May 2023, the institute planned to place sound recorders alongside the AMI traps and identify
    recorded bird calls with BirdNET, described as an AI developed by Cornell University.
  url: https://ier.conicet.gov.ar/monitoreos-automatizados-de-biodiversidad/
  fetched: 2026-11-03
  quote: se colocaran grabadores de sonido que registran la actividad vocal de las aves que también serán
    identificadas por una IA, en este caso desarrollada por la Universidad de Cornell, BirdNET.
