scale: local
status: closed
summary: Closed seasonal cetacean monitoring campaign in the north of the Golfo San
  Matías, started in September 2026 and run by two foundations, following a June campaign
  that made seven hydrophone recordings at four sites.
facts:
- claim: In September 2026, the Río Negro environment secretariat started a seasonal
    cetacean monitoring campaign in the north of the Golfo San Matías, scheduled to
    run until 23 September 2026.
  url: https://www.anbariloche.com.ar/noticias/2026/09/16/117301-monitorean-cetaceos-en-el-golfo-san-matias
  fetched: '2026-11-15'
  quote: La Secretaría de Ambiente y Cambio Climático de Río Negro puso en marcha
    una nueva campaña estacional de monitoreo de cetáceos en el norte del Golfo San
    Matías .
- claim: The September 2026 campaign was carried out by Fundación Por el Mar and Fundación
    Cethus.
  url: https://www.anbariloche.com.ar/noticias/2026/09/16/117301-monitorean-cetaceos-en-el-golfo-san-matias
  fetched: '2026-11-15'
  quote: Los trabajos son llevados adelante por la Fundación Por el Mar y la Fundación
    Cethus
- claim: The September 2026 monitoring was part of the Corredor de los 5 Grandes,
    which the page describes as covering more than 150 km of coast between Viedma
    and San Antonio Oeste.
  url: https://www.anbariloche.com.ar/noticias/2026/09/16/117301-monitorean-cetaceos-en-el-golfo-san-matias
  fetched: '2026-11-15'
  quote: El monitoreo se enmarca en el Corredor de los 5 Grandes
- claim: The report on the June 2026 monitoring in the north of the gulf was prepared
    by Fundación Por el Mar and Fundación Cethus and presented to the provincial protected
    areas undersecretariat.
  url: https://rionegro.gov.ar/articulo/60634/rio-negro-suma-datos-para-consolidar-el-corredor-de-los-5-grandes
  fetched: '2026-11-15'
  quote: El informe, elaborado por Fundación Por el Mar y Fundación Cethus, fue presentado
    al equipo técnico de la Subsecretaría de Áreas Naturales Protegidas
- claim: The June campaign made seven hydrophone recordings at four sites, setting
    a baseline for the gulf's underwater soundscape.
  url: https://rionegro.gov.ar/articulo/60634/rio-negro-suma-datos-para-consolidar-el-corredor-de-los-5-grandes
  fetched: '2026-11-15'
  quote: mediante siete muestreos acústicos realizados con hidrófonos en cuatro localidades
