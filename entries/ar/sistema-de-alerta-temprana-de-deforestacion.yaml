summary: Argentine national system processing Sentinel and Landsat 8 imagery every 15 days to detect native
  forest loss, with alerts received by national parks since November 2021.
facts:
- claim: Monitors native forest loss continuously through automated processes based on satellite images.
  url: https://www.argentina.gob.ar/ambiente/bosques/sistema-de-alerta-temprana-de-deforestacion
  fetched: 2026-11-03
  quote: es una herramienta que monitorea la pérdida de bosque nativo de forma continua, a través de procesos
    automatizados basados en imágenes satelitales.
- claim: Every 15 days it processes Sentinel and Landsat 8 imagery with algorithms analysing time series
    and spatial patterns.
  url: https://www.argentina.gob.ar/ambiente/bosques/sistema-de-alerta-temprana-de-deforestacion
  fetched: 2026-11-03
  quote: Cada 15 días, automáticamente el sistema procesa imágenes satelitales Sentinel y Landsat 8, aplicando
    algoritmos que analizan con diversas técnicas, series de tiempo y patrones espaciales.
- claim: Began in the Chaco Húmedo and Chaco Semiárido subregions of Parque Chaqueño and later added parts
    of the Yungas and the Bosque Andino Patagónico.
  url: https://www.argentina.gob.ar/ambiente/bosques/sistema-de-alerta-temprana-de-deforestacion
  fetched: 2026-11-03
  quote: La Subsecretaría de Ambiente de Nación comenzó la implementación del SAT en la región forestal
    Parque Chaqueño
- claim: The national native forest monitoring system’s page lists the early deforestation alert system
    in its “In this section” links.
