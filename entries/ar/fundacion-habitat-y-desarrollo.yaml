summary: A foundation founded in 1992 that shares administration of over 25 reserves
  covering more than 570,000 hectares, according to World Land Trust, and protects
  the Somuncurá Plateau Reserve with that trust's support.
facts:
- claim: Founded in 1992, the foundation shares the administration of over 25 reserves
    protecting more than 570,000 hectares in Argentina (World Land Trust partner page).
  url: https://www.worldlandtrust.org/partner/fundacion-habitat-y-desarrollo-fhd-fundacion-habitat-y-desarrollo-fhd/
  fetched: 2026-11-17
  quote: Founded in 1992, FHD currently shares the administration of over 25 reserves
    that protect more than 570,000 ha (1,408,500 acres) in Argentina.
- claim: With World Land Trust support the foundation protects and expands the Somuncurá
    Plateau Reserve. It works with Fundación Somuncura, which carries out activities
    at the reserve, to restore aquatic habitat.
  url: https://www.worldlandtrust.org/partner/fundacion-habitat-y-desarrollo-fhd-fundacion-habitat-y-desarrollo-fhd/
  fetched: 2026-11-17
  quote: With WLT support FHD are continuing to protect and expand the Somuncurá Plateau
    Reserve
- claim: In May 2025 the Río Negro Secretariat for Environment and Climate Change
    signed agreements with Fundación Hábitat y Desarrollo and Fundación Somuncura
    to strengthen the provincial protected-area system, with the Meseta de Somuncura
    highlighted as a priority.
  url: https://rionegro.gov.ar/articulo/54017/rio-negro-avanza-en-la-puesta-en-valor-de-sus-areas-naturales-protegidas
  fetched: 2026-11-17
  quote: firmó convenios con las fundaciones Somuncura y Hábitat y Desarrollo, con
    el objetivo de fortalecer el Sistema Provincial de Áreas Naturales Protegidas
