summary: The provincial ministry created Parque Provincial Patagonia Azul, and in
  December 2024 Chubut had 46 active wildlife rangers across 16 protected areas and
  was recruiting more.
facts:
- claim: The provincial ministry created the Parque Provincial Patagonia Azul as a
    new provincial natural protected area.
  url: https://www.diariojornada.com.ar/393250/magazine/nueva_rea_natural_protegida_parque_provincial_patagonia_azul
  fetched: 2026-11-17
  quote: El Ministerio de Turismo y Áreas Protegidas del Chubut creó una nueva Área
    Natural Protegida (ANP) denominada “Parque Provincial Patagonia Azul”.
- claim: In December 2024 Chubut had 46 active wildlife rangers across 16 provincial
    protected areas. The province was recruiting a new group of rangers to strengthen
    its protected-area system.
  url: https://cholilaonline.ar/2024/12/chubut-guardafaunas-provincial.html
  fetched: 2026-11-17
  quote: Chubut cuenta con un total de 46 guardafaunas activos en 16 Áreas Naturales
    Protegidas
- claim: In December 2024 members of the ministry’s Subsecretaría de Conservación
    y Áreas Protegidas and protected-area rangers sat on the panel that interviewed
    applicants for ranger positions.
  url: https://diariojornada.com.ar/385139/magazine/habra_21_nuevos_guardafaunas_en_chubut
  fetched: 2026-11-17
  quote: integrantes de la Subsecretaría de Conservación y Áreas Protegidas del Ministerio,
    junto a guardafaunas de las ANP
- claim: The Península Valdés administration implements the area's management plan
    jointly with the Ministry of Tourism and Protected Areas, which it names as authority
    of application.
  url: https://peninsulavaldes.org.ar/quienes-somos/
  fetched: 2026-11-17
  quote: el cual implementamos en forma mancomunada con el Ministerio de Turismo y
    Áreas Protegidas como Autoridad de Aplicación
