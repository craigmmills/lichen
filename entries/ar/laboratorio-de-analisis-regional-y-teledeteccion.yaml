- claim: Its research group's work produced a publicly accessible geospatial database of the
    transformations of the semi-arid Chaco since 1976.
  url: https://lart.agro.uba.ar/monitoreo-de-desmonte/
  fetched: 2026-11-03
  quote: Estos trabajos generaron una base de datos geoespacial de acceso público de las transformaciones
    que ha sufrido el Chaco Semiárido desde 1976.
- claim: Its project aims to develop tools for environmental and social monitoring of the
    Chaco forests.
  url: https://lart.agro.uba.ar/monitoreo-de-desmonte/
  fetched: 2026-11-03
  quote: El objetivo principal de este proyecto es desarrollar herramientas que permitan evaluar
    variables ecosistémicas claves para el monitoreo ambiental y social de los Bosques Chaqueños.
