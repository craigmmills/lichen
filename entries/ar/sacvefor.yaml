summary: Active inter-jurisdictional computer system for federal forest management
  and control, including traceability of forest products; in July 2019 an official
  said 20 provinces were working on it and three issued permits.
facts:
- claim: An inter-jurisdictional computer system to strengthen forest management and
    control at federal level, including traceability of forest products.
  url: https://www.argentina.gob.ar/node/158254
  fetched: '2026-11-15'
  quote: El SACVeFor es un sistema informático de implementación interjurisdiccional
    que permite fortalecer los sistemas de gestión y control forestal a nivel federal.
- claim: Aims to combat informality and illegality in the native forest production
    sector.
  url: https://www.argentina.gob.ar/node/158254
  fetched: '2026-11-15'
  quote: La herramienta, que busca combatir la informalidad e ilegalidad del sector
    productivo del bosque nativo
- claim: In July 2019 the national official said 20 provinces were working on it at
    different stages and three were issuing permits (guías) through it.
  url: https://www.argentina.gob.ar/node/158254
  fetched: '2026-11-15'
  quote: 'actualmente tres son las que están emitiendo guías: Jujuy, Salta y Santiago
    del Estero'
- claim: In November 2018 the national environment secretariat said it promoted the
    system for monitoring and control of forests to combat illegal logging, with seven
    provinces signed up.
  url: https://www.argentina.gob.ar/node/117160
  fetched: '2026-11-15'
  quote: La Secretaría de Ambiente nacional impulsa la utilización del SACVeFor para
    el monitoreo y control forestal de los bosques procurando combatir la ilegalidad
    forestal.
- claim: Listed in the national native forest monitoring section of the national environment
    pages.
  url: https://www.argentina.gob.ar/ambiente/bosques/umsef
  fetched: '2026-11-15'
  quote: Sistema de Administración, Control y Verificación Forestal (SACVeFor)
