- claim: The director general of geographic information systems of its land-use planning
    undersecretariat presented the 2025 native forest monitoring report for Misiones.
  url: https://www.canal12misiones.com/?p=619622
  fetched: '2026-11-15'
  quote: La directora general de Sistemas de Información Geográfica de la Subsecretaría
    de Ordenamiento Territorial, Verónica Centurión , presentó el Informe de Monitoreo
    del Bosque Nativo de Misiones correspondiente a 2025.
- claim: The report includes maps, spatial analyses and data on the evolution of native
    forest in the province.
  url: https://www.canal12misiones.com/?p=619622
