summary: Deep learning model using aerial images to detect and count southern elephant seals and sea lions
  at Península Valdés, based on about 3,000 images from two flights in spring 2023.
facts:
- claim: Combines high-resolution aerial images with deep learning to automate detection, classification
    and counting of southern elephant seals and South American sea lions at Península Valdés.
  url: https://cenpat.conicet.gov.ar/especialistas-implementan-un-novedoso-modelo-de-monitoreo-de-fauna-marino-costera/
  fetched: 2026-11-03
  quote: El método combina imágenes aéreas de alta resolución con técnicas de aprendizaje profundo para
    automatizar la detección de elefantes y lobos marinos
  ai_type: deep-learning
- claim: About 3,000 high-resolution images were taken on two crewed flights covering more than 300 km
    of coast in northern Chubut in spring 2023.
  url: https://cenpat.conicet.gov.ar/especialistas-implementan-un-novedoso-modelo-de-monitoreo-de-fauna-marino-costera/
  fetched: 2026-11-03
  quote: Para el estudio se tomaron cerca de 3000 imágenes de alta resolución durante dos vuelos tripulados
- claim: Part of a research project funded by the former national science ministry's Federal Innovation
    Projects, the national research promotion agency and the universities UNS and UNSJB.
  url: https://cenpat.conicet.gov.ar/especialistas-implementan-un-novedoso-modelo-de-monitoreo-de-fauna-marino-costera/
