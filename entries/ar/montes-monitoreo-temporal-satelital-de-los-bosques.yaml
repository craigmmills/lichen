summary: Developed by CONAE and BigPear and run by CONAE with IDB funding, the project aimed
  in November 2022 to map native forest cover and change online using satellite imagery.
facts:
- claim: In November 2022, aimed to build an online platform analysing satellite images to
    detect native forest cover across Argentina and show changes such as fires or clearing.
  url: https://www.argentina.gob.ar/node/346063
  fetched: 2026-11-03
  quote: generar una plataforma online de análisis de imágenes satelitales para la detección
    de cobertura de bosques nativos en toda la superficie de la Argentina
- claim: In November 2022, the platform was reported to use data from CONAE’s SAOCOM 1 satellites
    and the European Space Agency’s Sentinel satellites.
  url: https://www.argentina.gob.ar/node/346063
  fetched: 2026-11-03
  quote: La plataforma utiliza información de los satélites de la constelación argentina SAOCOM
    1, de la CONAE y Sentinel, de la Agencia Espacial Europea (ESA)
- claim: In November 2022 an intermediate product, a classification map of Argentina's forests,
    had been produced, with a final version expected by the end of 2022.
  url: https://www.argentina.gob.ar/node/346063
  fetched: 2026-11-03
  quote: 'actualmente se llegó a desarrollar un producto intermedio: un mapa de clasificación
    de bosques de la Argentina'
