facts:
- claim: Economía Sustentable reports that Argentine scientists founded Eirú, which uses IoT,
    satellite image analysis and biosensors to monitor and restore ecosystems.
  url: https://economiasustentable.com/noticias/son-argentinos-y-crearon-startup-que-usa-abejas-e-imagenes-satelitales-para-hacer-negocios-mas-sustentables/amp/
  quote: científicos argentinos fundaron Eirú (abeja, en guaraní), una startup que utiliza
    ciencia y tecnología como internet de las cosas (IOT), análisis de imágenes satelitales
    y biosensores para monitorear y restaurar ecosistemas.
  fetched: '2026-11-03'
- claim: Co-founder Lucas Garibaldi says they developed acoustic sensors that use bee sounds
    and satellite images to collect data for a simulation model.
  url: https://economiasustentable.com/noticias/son-argentinos-y-crearon-startup-que-usa-abejas-e-imagenes-satelitales-para-hacer-negocios-mas-sustentables/amp/
  quote: Desarrollamos sensores acústicos y a través del sonido de las abejas e imágenes satelitales
    para recopilar datos, generamos un modelo de simulación y procesamiento de la información
  fetched: '2026-11-03'
- claim: The article reports a first investment of USD 250,000 from the SF-500 accelerator,
    with private and Santa Fe provincial capital.
  url: https://economiasustentable.com/noticias/son-argentinos-y-crearon-startup-que-usa-abejas-e-imagenes-satelitales-para-hacer-negocios-mas-sustentables/amp/
  quote: La compañía recibió una inversión inicial de u$s250.000 por parte de la aceleradora
    de empresas SF-500
  fetched: '2026-11-03'
- claim: The BCR Innova startup directory says Eirú uses satellite images, bioacoustic sensors,
    AI and computer modelling for biodiversity monitoring, reporting and verification.
  url: https://www.innova.bcr.com.ar/startup-network
  fetched: 2026-11-03
  quote: Mediante Imágenes satelitales, sensores bio acústicos, IA y modelados computacionales
