summary: A network focused on Indigenous conserved territories, whose founding charter
  was drafted at an October 2021 meeting of members from 33 communities, 14 peoples
  and 12 provinces.
facts:
- claim: At a meeting on 29 and 30 October 2021, members of 33 Indigenous communities
    from 14 peoples in 12 provinces met to consolidate the TICCA network in Argentina,
    on territories conserved by Indigenous communities.
  url: https://www.iccaconsortium.org/es/2021/12/08/consolido-red-ticca-argentina/
  fetched: 2026-11-17
  quote: Participaron integrantes de 33 comunidades originarias de 14 Pueblos indígenas
    de 12 provincias del país
- claim: In October 2021 participants agreed that the network would include members
    of Indigenous peoples, communities and territorial organisations. They also drafted
    its founding charter.
  url: https://www.iccaconsortium.org/es/2021/12/08/consolido-red-ticca-argentina/
  fetched: 2026-11-17
  quote: Se acordó que la red esté integrada por miembros de Pueblos Indígenas, comunidades
    y organizaciones territoriales Indígenas
