summary: Remote data-logging system at Punta Tombo that, CONICET reported in June 2017, used a microchip-reading
  mat and a scale to detect and weigh penguins on trips to and from the sea.
facts:
- claim: In June 2017, CONICET quoted Borboroglu saying they had implemented a remote data-logging system
    that automatically detects when penguins go to and return from the sea, including at night.
  url: https://www.conicet.gov.ar/?p=55567
  quote: En la Colonia hemos implementado un sistema de registro de datos en forma remota que nos permite
    detectar automáticamente cuando los animales cuando van y regresan de sus nidos hacia el mar, inclusive
    durante la noche.
  fetched: '2026-11-03'
- claim: CONICET reported in June 2017 that the system used a mat to read each penguin’s microchip and
    a scale to record weight before and after feeding trips.
  url: https://www.conicet.gov.ar/?p=55567
  quote: El sistema usa además una balanza que registra automáticamente el peso de los ejemplares antes
    y después de sus viajes de alimentación en el mar.
  fetched: '2026-11-03'
