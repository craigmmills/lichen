status: active
summary: A GEF-funded, UNDP-partnered project in Mendoza that in March 2022 was assessing
  land degradation at a foothills pilot site, with baseline studies by IADIZA-CONICET
  and INTA and planned wetland inventories.
facts:
- claim: In March 2022, the Provincial Land-Use Planning Agency of the Mendoza environment
    secretariat was carrying out the project in Mendoza.
  url: https://www.mendoza.gov.ar/prensa/conservacion-de-biodiversidad-y-manejo-sostenible-de-las-tierras
  fetched: '2026-11-09'
  quote: La ejecución del Proyecto PNUD, a cargo de la Agencia Provincial de Ordenamiento
    Territorial, de la Secretaría de Ambiente de Mendoza
- claim: In March 2022, land degradation and ecosystem services were being assessed
    at the Mendoza metropolitan foothills pilot site.
  url: https://www.mendoza.gov.ar/prensa/conservacion-de-biodiversidad-y-manejo-sostenible-de-las-tierras
  fetched: '2026-11-09'
  quote: Para esto se encuentran en desarrollo la evaluación y monitoreo de la degradación
    de la tierra en este sitio piloto y la evaluación de los servicios ecosistémicos
    del área comprendida.
- claim: In March 2022, the project planned wetland inventories for the Oasis Norte
    green belt and the middle Llancanelo basin following Ramsar guidance adapted to
    drylands.
  url: https://www.mendoza.gov.ar/prensa/conservacion-de-biodiversidad-y-manejo-sostenible-de-las-tierras
  fetched: '2026-11-09'
  quote: Se realizará un Inventario de Humedales del Cinturón Verde del Oasis Norte
- claim: In March 2022, IADIZA-CONICET and INTA were carrying out baseline studies.
  url: https://www.mendoza.gov.ar/prensa/conservacion-de-biodiversidad-y-manejo-sostenible-de-las-tierras
  fetched: '2026-11-09'
  quote: a cargo del Iadiza- Conicet, el INTA
- claim: Funded by a GEF grant through UNDP, with the national environment ministry
    as implementing partner.
  url: https://www.mendoza.gov.ar/prensa/conservacion-de-biodiversidad-y-manejo-sostenible-de-las-tierras
  fetched: '2026-11-09'
  quote: El proyecto forma parte de un fondo de aportes no reembolsable otorgado por
    GEF ( Global Environment Facility ), ejecutado en Argentina a través del Programa
    de Naciones Unidas para el Desarrollo (PNUD)
