summary: An organisation that buys and protects land in the Córdoba Sierras Grandes,
  with 709 hectares now under its reserve model and an aim to restore 30,000 hectares
  of native forest and grassland.
facts:
- claim: It buys and protects land in the Sierras Grandes of Córdoba, with 709 hectares
    now under its reserve model, 209 of them already forest and 500 in restoration.
  url: https://bosquesdeagua.ar/nuestro-modelo
  fetched: 2026-11-17
  quote: 'Hoy tenemos 709 hectáreas bajo el modelo de reserva: 209 ya son bosque en
    pleno crecimiento, y las 500 restantes atraviesan un proceso activo de transición
    y restauración.'
- claim: It aims to restore 30,000 hectares of native forest and grassland in the
    Sierras Grandes, and is currently focused on a core of 1,600 hectares.
  url: https://bosquesdeagua.ar/nuestro-modelo
  fetched: 2026-11-17
  quote: Nuestro objetivo es restaurar 30.000 hectáreas de bosque y pastizal nativo
    en las Sierras Grandes
