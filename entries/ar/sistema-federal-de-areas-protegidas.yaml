facts:
- claim: Set up on 20 March 2003 by a framework agreement between the national parks agency, the environment
    secretariat and COFEMA.
  url: https://www.argentina.gob.ar/ambiente/areas-protegidas/sifap
  fetched: '2026-11-03'
  quote: El Sistema Federal de Áreas Protegidas (SiFAP) se constituyó el 20 de marzo de 2003 mediante
    un acuerdo marco
- claim: Managed by an executive committee of COFEMA (chair), APN (coordination) and the Subsecretaría
    de Ambiente (technical and administrative secretariat), which keeps the database and its information
    system.
  url: https://www.argentina.gob.ar/ambiente/areas-protegidas/sifap
  fetched: '2026-11-03'
  quote: La gestión del SiFAP es ejercida por un comité ejecutivo conformado por el COFEMA (presidencia),
    la APN (coordinación) y la Subsecretaría de Ambiente (secretaría técnico administrativa)
- claim: Its functions include promoting a common system for monitoring the conservation status, management
    and representativeness of its protected areas.
  url: https://www.argentina.gob.ar/ambiente/areas-protegidas/sifap
  fetched: '2026-11-03'
  quote: promover el desarrollo de un sistema de monitoreo y seguimiento común de la situación de conservación,
    gestión y representatividad de sus AP
