summary: A body created in 2001 under Chubut law that says it administers the Península
  Valdés Natural Protected Area, and implements the management plan jointly with the
  Ministry of Tourism and Protected Areas.
facts:
- claim: The entity says it administers the Península Valdés Natural Protected Area
    under its statute and Chubut laws XI 18 and XI 20, following directives of the
    provincial state.
  url: https://peninsulavaldes.org.ar/quienes-somos/
  fetched: 2026-11-17
  quote: Llevamos a cabo la administración del área conforme a nuestro Estatuto y
    de acuerdo a las disposiciones de las Leyes XI N° 18 y XI N° 20 y demás normas
    que se dicten
- claim: Chubut law allowed provincial protected areas whose management category permits
    sustainable use to be administered by non-state public entities. The Administración
    del Área Natural Protegida Península Valdés was created in 2001.
  url: https://peninsulavaldes.org.ar/quienes-somos/
  fetched: 2026-11-17
  quote: En consonancia, en el año 2001, se creó la Administración del Área Natural
    Protegida Península Valdés.
- claim: It implements the management plan jointly with the Ministry of Tourism and
    Protected Areas as authority of application.
  url: https://peninsulavaldes.org.ar/quienes-somos/
  fetched: 2026-11-17
  quote: el cual implementamos en forma mancomunada con el Ministerio de Turismo y
    Áreas Protegidas como Autoridad de Aplicación
