summary: A corporation whose own site describes co-management as a forum for decisions
  on Mapuche territories in Lanín National Park, and which in July 2026 reported signing
  a concession contract after a public tender.
facts:
- claim: The corporation's own site describes the co-management as a forum for decisions
    on administering the territories of Mapuche communities within Lanín National
    Park and the Corporation's area of influence.
  url: https://www.pulmari.org/turismo-y-ambiente/comunidades-mapuce/
  fetched: 2026-11-17
  quote: el Comanejo es un ámbito de participación para la toma de decisiones relacionadas
    con la administración de territorios de Comunidades Mapuches que se encuentran
    en jurisdicción del Parque Nacional Lanín y el área de influencia de la Corporación
    Interestadual Pulmarí.
- claim: In July 2026 the corporation reported signing a concession contract with
    the winner of its public tender and issued a call for tourism proposals for rafting
    on the Aluminé River.
  url: https://www.pulmari.org/
  fetched: 2026-11-17
  quote: La Corporación Interestadual Pulmarí firmó el contrato de concesión con Juan
    Manuel Fernández Ravazzani, adjudicatario del último Concurso Público de Concesiones
