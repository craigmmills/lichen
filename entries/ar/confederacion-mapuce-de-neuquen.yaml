summary: A body representing the Mapuce people that took part in the process leading
  to Lanín National Park co-management and was represented on the July 2000 committee.
facts:
- claim: The Confederación Mapuce de Neuquén represented Mapuche communities in the
    process that led to the Lanín National Park co-management arrangement. The committee
    formed in July 2000 included representatives of the National Parks Administration,
    the Confederation and the Mapuche communities linked to the park.
  url: https://www.iccaconsortium.org/wp-content/uploads/2015/08/example-documento-mapuce-cmn-2009-es.pdf
  fetched: 2026-11-17
  quote: representantes de la APN, de la CMN y de las Comunidades Mapuche vinculadas
    al parque.
- claim: The document describes the Confederación Mapuce de Neuquén as representing
    the Mapuce people. It says the zonal level groups 11 communities with territories
    in the Lanín and Nahuel Huapi national park areas.
  url: https://www.iccaconsortium.org/wp-content/uploads/2015/08/example-documento-mapuce-cmn-2009-es.pdf
  fetched: 2026-11-17
  quote: 'agrupa a las 11 comunidades cuyos territorios se encuentran en el área de
    los Parques

    Lanín y Nahuel Huapi y c) la del Pueblo Mapuce que está representado en la

    Confederación Mapuce de Neuquén.'
