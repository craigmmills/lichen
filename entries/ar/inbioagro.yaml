summary: Active project designing biodiversity management strategies with CREA farmers and researchers;
  monitoring began on about 30 farms, and its first report in 2025 covered pilot farms in Buenos Aires
  province.
facts:
- claim: Designs, with CREA farmers and researchers, management strategies to improve biodiversity on
    farms; listed as active.
  url: https://proyectos.crea.org.ar/proyectos/inbio-agro/
  fetched: 2026-11-03
  quote: Es un proyecto que diseña, junto con los productores CREA e investigadores, estrategias de manejo
    que permitan mejorar la biodiversidad presente en los sistemas de producción agropecuaria de las diferentes
    regiones.
- claim: Monitoring of birds, medium and large mammals, vegetation, pollinating insects and soil fauna
    began on about 30 farms in the north-west and centre of Argentina.
  url: https://ier.conicet.gov.ar/inbioagro/
  fetched: 2026-11-03
  quote: se iniciaron los monitoreos de aves, mamíferos de mediano y gran tamaño, vegetación, insectos
    polinizadores, y macro y mesofauna del suelo en alrededor de 30 establecimientos productivos de la
    región NOA
- claim: GBIF's registry says the project aims to compile, validate and standardise biodiversity data
    from Argentina's rural landscapes and publish it openly through GBIF.
  url: https://api.gbif.org/v1/organization/fcfefcbf-4a3d-444d-a563-82fb2f587c77
  fetched: 2026-11-03
  quote: mobilize biodiversity data from productive rural landscapes in Argentina by compiling, validating,
    and
- claim: Its first report, presented in 2025, assessed biodiversity on pilot farms monitored between 2023
    and early 2025 in Buenos Aires province.
  url: https://www.argentina.gob.ar/noticias/inta-y-crea-miden-indicadores-de-biodiversidad-en-15-campos-de-buenos-aires
  fetched: 2026-11-03
  quote: El primer informe de InBioAgro evaluó la biodiversidad presente en los campos piloto que fueron
    monitoreados entre el 2023 y principios de 2025
