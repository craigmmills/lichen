- claim: Reads the heat spots seen by NASA FIRMS and GOES-19 over the Patagonian Andes.
  url: https://www.sentineltech.com.ar/
  fetched: 2026-11-03
  quote: Leemos los focos de calor que ven los satélites (NASA FIRMS y GOES-19) sobre la cordillera patagónica.
