summary: Active organisation that says it leads the Patagonian Coastal Zone management plan
  and works with fishers who have tagged over 3,000 sharks, and in January 2023 reported tracking
  penguins.
facts:
- claim: Says a network of more than 200 sport and recreational fishers has tagged more than
    3,000 large endangered sharks for study and released them alive.
  url: https://argentina.wcs.org/Wild-Places/Patagonian-Coast.aspx
  quote: Currently, a network of more than 200 sport and recreational fishermen have transformed
    their practices and become allies in the conservation of large endangered sharks, tagging
    more than 3,000 for study and then releasing them alive back into the sea.
  fetched: '2026-11-03'
- claim: Says it leads and facilitates the Integrated Management Plan for the Patagonian Coastal
    Zone, funded by the GEF and UNDP.
  url: https://argentina.wcs.org/Wild-Places/Patagonian-Coast.aspx
  quote: we lead and facilitate the development and implementation of the Integrated Management
    Plan for the Patagonian Coastal Zone, funded by the Global Environment Facility (GEF)
    and the United Nations Development Programme (UNDP).
  fetched: '2026-11-03'
- claim: In January 2023, reported studying penguin nests in colonies in Chubut, Santa Cruz
    and Tierra del Fuego, on foot and with camera traps, drones or microchips.
  url: https://argentina.wcs.org/es-es/Quienes-somos/Noticias/articleType/ArticleView/articleId/18562.aspx
  fetched: 2026-11-03
  quote: Actualmente, estudiamos los nidos en colonias de las 3 provincias, a veces a pie,
    a través de cámaras trampa , drones o microchips .
- claim: In January 2023, reported fitting penguins with GPS and GLS geolocators to study
    their migration and the marine areas they use.
  url: https://argentina.wcs.org/es-es/Quienes-somos/Noticias/articleType/ArticleView/articleId/18562.aspx
  fetched: 2026-11-03
  quote: Colocamos dispositivos GPS y GLS (geolocalizadores) en pingüinos para estudiar su
    migración y conocer las áreas marinas utilizadas.
- claim: In January 2023, reported having studied Magellanic penguins at Punta Tombo since
    1982 with the University of Washington.
  url: https://argentina.wcs.org/es-es/Quienes-somos/Noticias/articleType/ArticleView/articleId/18562.aspx
  fetched: 2026-11-03
  quote: Desde 1982 realizamos estudios para la conservación de los pingüinos de Magallanes
    en la colonia emblemática de Punta Tombo, junto a la Universidad de Washington
