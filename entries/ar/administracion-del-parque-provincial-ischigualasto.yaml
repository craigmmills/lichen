summary: A self-governing entity of the San Juan provincial government, created by
  Law 7474, which assigns the coordinator responsibility for the administrative and
  technical staff, rangers and guides of Ischigualasto Provincial Park.
facts:
- claim: Law 7474 of San Juan created the Administración del Parque Provincial Ischigualasto
    as a self-governing entity (ente autárquico) of the provincial government.
  url: https://diputadossanjuan.gob.ar/cuerpo-legislativo/comisiones-y-representantes/organo-coordinador-provincial-ley-n-989-e?catid=114&id=2092%3Aley-n-7474&view=article
  fetched: 2026-11-17
  quote: ARTÍCULO 1º.- Créase la Administración del Parque Provincial Ischigualasto,
    como ente autárquico del Gobierno de la Provincia, con personería y competencia
    para actuar en el ámbito del Derecho Público y Privado
- claim: Law 7474 assigns the coordinator responsibility for the administrative and
    technical staff, park rangers and guides working in Ischigualasto Provincial Park.
  url: https://diputadossanjuan.gob.ar/cuerpo-legislativo/comisiones-y-representantes/organo-coordinador-provincial-ley-n-989-e?catid=114&id=2092%3Aley-n-7474&view=article
  fetched: 2026-11-17
  quote: Tendrá a su cargo el manejo del Personal afectado a tareas administrativas
    y técnicas, cuerpo de guardaparques y de guías que cumple funciones en el Parque
    Provincial Ischigualasto
