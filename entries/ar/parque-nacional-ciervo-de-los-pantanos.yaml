summary: A national park hosting a research project that monitors fauna with camera
  traps, foot transects and drone surveys, and has produced a habitat map and an assessment
  of burnt areas.
facts:
- claim: A research project in the park monitors fauna with camera traps, track transects
    on foot and aerial drone surveys.
  url: https://www.argentina.gob.ar/node/510072
  fetched: 2026-11-09
  quote: se desarrolla un monitoreo de fauna , empleando técnicas no invasivas como
    cámaras trampa, transectas (recorridas) lineales de rastros a pie y relevamientos
    aéreos con drones.
- claim: The park takes part through its staff and supplies camera traps, vehicles
    and boats for the fieldwork.
  url: https://www.argentina.gob.ar/node/510072
  fetched: 2026-11-09
  quote: participa activamente del mismo a través de su personal, prestando apoyo
    operativo a través de sus guardaparques, técnicos y brigadistas, así como el aporte
    de equipamiento como cámaras trampa
- claim: The project has produced a habitat map of the park and an assessment of areas
    burnt by fires.
  url: https://www.argentina.gob.ar/node/510072
  fetched: 2026-11-09
  quote: incluyendo la elaboración de un mapa de ambientes del Parque Nacional y la
    evaluación de áreas afectadas por incendios
- claim: Doctoral fellow Ivana Riedel (APN-CONICET) carries out the project under
    the direction of Facundo Schivo, Lucía Rodríguez-Planes and Cecilia Li Puma.
  url: https://www.argentina.gob.ar/node/510072
  fetched: 2026-11-09
  quote: que lleva adelante la becaria doctoral Ivana Riedel (APN-CONICET)
