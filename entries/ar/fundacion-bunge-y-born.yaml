summary: Announced collection digitisation funding with CONICET under the 2017 call and joined
  the 2026 call, open 14 April–14 May 2026, offering up to 6,000,000 pesos per project.
facts:
- claim: In June 2018, CONICET announced that, jointly with Fundación Bunge & Born, it would
    fund projects to preserve, recover and digitise biological collections under the 2017
    call.
  url: https://www.conicet.gov.ar/?p=66795
  quote: El CONICET, conjuntamente con la Fundación Bunge & Born, financiará proyectos tendientes
    a la preservación, recuperación y digitalización de datos, piezas, muestras o especímenes
    de colecciones biológicas
  fetched: '2026-11-03'
- claim: With CONICET and the other foundation, announced funding for preservation, recovery
    and digitisation of scientific collections in the 2026 Collections call, open from 14
    April to 14 May 2026.
  url: https://www.conicet.gov.ar/oportunidades-y-becas/publicacion/5142/novedades/
  fetched: 2026-11-03
  quote: El CONICET, conjuntamente con la Fundación Bunge y Born y la Fundación Williams (en
    el marco de la Iniciativa para el Fortalecimiento de Archivos que dichas Fundaciones desarrollan
    en alianza), financiará proyectos tendientes a la preservación, recuperación y digitalización
    de datos
- claim: The 2026 call offered partial or full funding for up to six biological science collection
    and database projects, up to 6,000,000 pesos each.
  url: https://www.conicet.gov.ar/oportunidades-y-becas/publicacion/5142/novedades/
  fetched: 2026-11-03
  quote: La financiación parcial y/o total de hasta seis (6) proyectos de fortalecimiento
    de colecciones de Ciencias Biológicas y conformación de bases de datos por un monto de
    hasta $ 6.000.000.- cada uno.
