summary: Network of private reserves and civil society organisations conserving private
  land, which gained legal status as a civil association in 2019 and, as reported
  by Ámbito in July 2024, had 111 reserves covering 223,000 hectares.
facts:
- claim: The network integrates private reserves and civil society organisations committed
    to conservation on private land.
  url: https://www.ambito.com/lifestyle/construyendo-un-legado-respeto-y-responsabilidad-la-naturaleza-n6031548
  fetched: 2026-11-17
  quote: es la primera iniciativa en el país que integra reservas privadas y organizaciones
    de la sociedad civil comprometidas con la conservación de los valores naturales
    y culturales en tierras de propiedad privada.
- claim: In July 2024 Ámbito reported that the network included 111 private reserves,
    owned by individuals, companies, non-profits, clubs and universities, covering
    a total of 223,000 hectares.
  url: https://www.ambito.com/lifestyle/construyendo-un-legado-respeto-y-responsabilidad-la-naturaleza-n6031548
  fetched: 2026-11-17
  quote: La Red Argentina de Reservas Privadas está conformada por 111 reservas privadas
    que son campos de personas físicas, empresas, organizaciones sin fines de lucro,
    clubes y hasta universidades
- claim: The network's own site records that it gained legal status as a civil association
    (listed under 2019).
  url: https://reservasprivadas.org.ar/institucional/
  fetched: 2026-11-17
  quote: Se logra la personería jurídica como Asociación Civil.
