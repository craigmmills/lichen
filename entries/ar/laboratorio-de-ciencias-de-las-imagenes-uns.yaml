summary: Image science laboratory at the Universidad Nacional del Sur researching AI wildlife
  surveys in Chubut, with project funding beginning in 2022 and cut at the end of 2023.
facts:
- claim: Its researchers created a method for analysing images and video to automate wildlife
    surveys with artificial intelligence, applied in Chubut to elephant seals and sea lions,
    with the data open to the community.
  url: https://www.enfoqueu.uns.edu.ar/cientificos-de-la-uns-ya-usan-inteligencia-artificial-para-la-conservacion-ambiental/
  fetched: 2026-11-03
  quote: Investigadores del Laboratorio de Ciencias de las Imágenes de la Universidad Nacional
    del Sur crearon un método de análisis de imágenes y videos para automatizar el relevamiento
    fauna silvestre utilizando inteligencia artificial.
- claim: The project began in 2022 with federal innovation funding from the then science ministry,
    which was cut at the end of 2023.
  url: https://www.enfoqueu.uns.edu.ar/cientificos-de-la-uns-ya-usan-inteligencia-artificial-para-la-conservacion-ambiental/
  fetched: 2026-11-03
  quote: Este proyecto comenzó en 2022 gracias a una línea de financiamiento llamada “Proyectos
    Federales de Innovación”, del entonces Ministerio de Ciencia y Tecnología
- claim: The work received an award from the Instituto Argentino de Inteligencia Artificial
