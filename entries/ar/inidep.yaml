summary: Argentine fisheries research institute that carried out 17 research campaigns and
  252 days at sea in 2021, advises government on fishery resources, and offers satellite-derived
  environmental data.
facts:
- claim: In 2021 it carried out 17 research campaigns and 252 days at sea with its research
    vessels.
  url: https://www.argentina.gob.ar/noticias/el-inidep-cierra-el-ano-con-17-campanas-de-investigacion-y-252-dias-navegados
  quote: A lo largo de 2021 , el Instituto Nacional de Investigación y Desarrollo Pesquero
    (INIDEP) concretó a 17 campañas de investigación y 252 días de navegación
  fetched: '2026-11-03'
- claim: Its 2021 campaigns included hake in the northern Patagonian nursery area and assessments
    of southern demersal fish and Patagonian scallop.
  url: https://www.argentina.gob.ar/noticias/el-inidep-cierra-el-ano-con-17-campanas-de-investigacion-y-252-dias-navegados
  quote: En 2021 el BIP Dr. Eduardo L. Holmberg realizó la campaña de merluza en la zona de
    cría norpatagónica, las evaluaciones de peces demersales australes y de vieira patagónica
  fetched: '2026-11-03'
- claim: Co-authors of the 2025 deep learning plankton classification paper give affiliations
    at INIDEP.
  url: https://api.openalex.org/works/W4415214000?select=id,title,doi,publication_year,authorships
  quote: Pesquero (INIDEP), Buenos Aires, Argentina
  fetched: '2026-11-03'
- claim: Advises the national fisheries undersecretariat, the Federal Fisheries Council and
    the foreign ministry on the rational use of fishery resources, with the aim of preserving
    the marine ecosystem.
