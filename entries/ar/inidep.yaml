    pesqueros con el objetivo de preservar el ecosistema marino
- claim: Its functions include research projects on the prospecting and assessment of fisheries.
  url: https://www.argentina.gob.ar/inidep/mision-funcion
  fetched: 2026-11-03
  quote: formular, ejecutar y controlar los proyectos de investigación en prospección, evaluación
