summary: Provincial government of Neuquén, which NoticiasNQN reported in December 2025 had
  52 active wildlife cameras, 60 more ready to install, a planned total of 150, and an AI
  species-identification platform launched in 2025.
facts:
- claim: NoticiasNQN reported in December 2025 that the provincial monitoring network had
    52 active cameras and 60 more ready to install, towards a planned total of 150.
  url: https://www.noticiasnqn.com.ar/amp/noticias/2025/12/07/324587-neuquen-moderniza-su-sistema-de-fauna-camaras-inteligentes-drones-y-mas-presencia-en-todo-el-territorio
  quote: La Red Provincial de Monitoreo ya cuenta con 52 cámaras activas y otras 60 listas
    para instalar, en un plan de expansión que llevará el número total a 150 dispositivos.
  fetched: '2026-11-03'
- claim: NoticiasNQN reports the launch in 2025 of an AI-based wildlife monitoring platform
    that identifies species from images sent by agents or citizens.
  url: https://www.noticiasnqn.com.ar/amp/noticias/2025/12/07/324587-neuquen-moderniza-su-sistema-de-fauna-camaras-inteligentes-drones-y-mas-presencia-en-todo-el-territorio
  quote: Uno de los hitos del año fue la puesta en marcha de una Plataforma de Monitoreo de
    Fauna Silvestre basada en Inteligencia Artificial , capaz de identificar especies a partir
    de imágenes enviadas por agentes o ciudadanos.
  fetched: '2026-11-03'
- claim: NoticiasNQN reported in December 2025 that the provincial wildlife directorate had
    25 offices and 122 conservation agents.
  url: https://www.noticiasnqn.com.ar/amp/noticias/2025/12/07/324587-neuquen-moderniza-su-sistema-de-fauna-camaras-inteligentes-drones-y-mas-presencia-en-todo-el-territorio
  quote: Con 25 delegaciones y 122 agentes de conservación , la dirección provincial de Fauna
    reforzó su presencia
  fetched: '2026-11-03'
