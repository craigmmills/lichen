summary: A national park that set up joint camera-trap monitoring with Proyecto Yaguareté
  and the NEA regional office after jaguar signs were found in March 2024, and recorded
  a new male jaguar in 2025.
facts:
- claim: After jaguar signs were found in March 2024, the park's administration designed
    and set up joint camera-trap monitoring with the Proyecto Yaguareté (CeIBA-CONICET)
    and APN's NEA regional office.
  url: https://www.argentina.gob.ar/noticias/se-registro-en-el-parque-nacional-rio-pilcomayo-un-nuevo-yaguarete-para-la-region-chaquena
  fetched: 2026-11-09
  quote: desde la Intendencia del área protegida, con el apoyo del Proyecto Yaguareté
    (CeIBA-CONICET) y de la Dirección Regional NEA de la APN, se diseñó e implementó
    un monitoreo conjunto mediante cámaras trampa.
- claim: Continuous camera-trap monitoring in the park recorded a new male jaguar
    in 2025.
  url: https://www.argentina.gob.ar/noticias/se-registro-en-el-parque-nacional-rio-pilcomayo-un-nuevo-yaguarete-para-la-region-chaquena
  fetched: 2026-11-09
  quote: En el marco del trabajo de monitoreo continuo con cámaras trampa en el Parque
    Nacional Río Pilcomayo, en Formosa
- claim: Individual jaguars are told apart by their spot pattern.
  url: https://www.argentina.gob.ar/noticias/se-registro-en-el-parque-nacional-rio-pilcomayo-un-nuevo-yaguarete-para-la-region-chaquena
  fetched: 2026-11-09
