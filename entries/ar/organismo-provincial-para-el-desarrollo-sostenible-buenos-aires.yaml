summary: Provincial body that approved an enforcement protocol for Buenos Aires province's
  protected areas in Resolution 592/2019, after a 2018 resolution set a protocol for
  audiovisual productions in reserves.
facts:
- claim: The OPDS approved a protocol for enforcement activities across the system
    of natural protected areas of Buenos Aires province (Resolution 592/2019).
  url: https://normas.gba.gob.ar/ar-b/resolucion/2019/592/214681
  fetched: 2026-11-17
  quote: Aprobar el “Protocolo para las actividades de fiscalización en el Sistema
    de Áreas Naturales Protegidas de la provincia de Buenos Aires”. (Custodia-Vigilancia-
    Control -Seguridad de las Áreas Protegidas-Actas de Infracción-Recomendaciones-Cuidados-Prevención-Parques-Ambientes
    Naturales)-(OPDS)
- claim: A 2018 provincial resolution approved a protocol for audiovisual productions
    in the reserves and natural monuments that form part of the province's protected-area
    system.
  url: https://normas.gba.gob.ar/ar-b/resolucion/2018/484/207166
  fetched: 2026-11-17
  quote: APROBAR PROTOCOLO PARA PRODUCCIONES AUDIOVISUALES EN LAS RESERVAS Y MONUMENTOS
    NATURALES QUE FORMAN PARTE DEL SISTEMA DE ÁREAS NATURALES PROTEGIDAS DE LA PROVINCIA
    DE BS. AS.
