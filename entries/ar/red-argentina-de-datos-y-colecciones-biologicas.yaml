summary: Network of institutions sharing primary biodiversity data openly, formed when members
  of the Argentine GBIF node continued after the Sistema Nacional de Datos Biológicos ended
  in 2020, and which produces the national biodiversity data portal.
facts:
- claim: Produces the design and content of the Portal de Datos de Biodiversidad de Argentina.
  url: https://www.macnconicet.gob.ar/se-presento-el-nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: '2026-11-03'
  quote: su diseño y contenido es producido por la Red Argentina de Datos y Colecciones Biológicas
    (RADyCB)
- claim: Made up of institutions that produce primary biodiversity data and share it openly,
    from natural history museums and research institutes to government bodies and NGOs.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: La Red Argentina de Datos y Colecciones Biológicas (RADyCB) está conformada por diversas
    instituciones que producen datos primarios de biodiversidad y que son compartidos de forma
    abierta.
- claim: The Sistema Nacional de Datos Biológicos, introduced in 2009 by the science ministry,
    ran until the end of 2020; members of the Argentine GBIF node then continued as this network.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: Posteriormente, los miembros del nodo argentino de GBIF continuaron su actividad,
    conformando la Red Argentina de Datos y Colecciones Biológicas .
- claim: Promotes the open publication and reuse of primary biodiversity data, following Darwin
    Core and the FAIR principles.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: La RADyCB promueve la generación, gestión, publicación y reutilización de datos primarios
    de biodiversidad de forma abierta y gratuita.
