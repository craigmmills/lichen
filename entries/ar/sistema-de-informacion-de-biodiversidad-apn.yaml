website: https://www.argentina.gob.ar/parquesnacionales/sib
summary: Biodiversity information system of Argentina's national parks agency, which runs
  it, funded by the GEF and building on a 1994 data bank, offering an online catalogue and
  spatial data infrastructure.
facts:
- claim: Its mission is to keep, store and organise biodiversity data from technical, scientific
    and management activities in Argentina's protected areas.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: 2026-11-03
  quote: Su misión es mantener, almacenar y organizar los datos sobre biodiversidad derivados
    de las actividades técnicas, científicas y de manejo que se realizan en el ámbito de las
    áreas protegidas de Argentina.
- claim: It came out of the Biodiversity Conservation Project prepared by the national parks
    agency and financed by the GEF.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: 2026-11-03
  quote: El Proyecto Conservación de la Biodiversidad de la República Argentina, elaborado
    por la Administración de Parques Nacionales y financiado con los llamados Fondos Globales
    Ambientales (GEF)
- claim: It built on the Banco de Datos para la Conservación started in 1994 in the Patagonia
    regional office.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: 2026-11-03
  quote: Para ello se aprovechó la experiencia del Banco de Datos para la Conservación iniciada
    desde 1994 en la Delegación Regional Patagonia (BDC-DRP)
- claim: Offers an online catalogue.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: '2026-11-03'
  quote: Accedé al catálogo en línea
- claim: Gathers, classifies, maps and makes public environmental, biological and socio-cultural
    information on Argentina's protected areas.
  url: https://sib.gob.ar/
  fetched: 2026-11-03
  quote: En el SIB recopilamos, clasificamos, ordenamos, cartografiamos y ponemos a disposición
    pública la información de carácter ambiental, biológico y socio-cultural de las áreas
    protegidas de Argentina.
- claim: Created within the national parks agency, building on a conservation data bank started
    in 1994 in its Patagonia regional office.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: 2026-11-03
  quote: se creó en su ámbito el Sistema de Información sobre Biodiversidad (SIB)
- claim: Collects, classifies, maps and publishes environmental, biological and socio-cultural
    information on Argentina's protected areas.
  url: https://sib.gob.ar/
  fetched: 2026-11-03
  quote: En el SIB recopilamos, clasificamos, ordenamos, cartografiamos y ponemos a disposición
    pública la información de carácter ambiental, biológico y socio-cultural de las áreas
- claim: Offers a spatial data infrastructure for the national parks agency.
  url: https://sib.gob.ar/
  fetched: 2026-11-03
  quote: Infraestructura de Datos Espaciales - APN
- claim: Data are entered at each regional technical unit with applications the SIB developed
    using free technologies.
  url: https://sib.gob.ar/index.php/institucional/como-esta-organizado-el-sib
  fetched: 2026-11-03
  quote: La carga de información se realiza en cada ITR utilizando las aplicaciones desarrolladas
    por el SIB utilizando tecnologías libres y gratuitas.
