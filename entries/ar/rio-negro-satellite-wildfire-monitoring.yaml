summary: Satellite wildfire detection and monitoring across 20 million hectares of Río Negro, built and
  run by GPTech using OroraTech data, with control centres inaugurated on 14 February 2026.
facts:
- claim: OroraTech, GPTech and the Río Negro provincial government announced satellite wildfire detection
    and monitoring across the province, covering 20 million hectares.
  url: https://ororatech.com/resources/news-blog/ororatech-signs-landmark-deal-to-protect-the-rio-negro-province-of-argentina-home-to-the-patagonia-region
  fetched: '2026-11-03'
  quote: OroraTech, GPTech, and Argentina’s Rio Negro provincial government have announced the launch
    of satellite-powered wildfire detection and monitoring services across the province, protecting 20
    million hectares in the Patagonia region
- claim: The control centre aims to combine OroraTech satellite data with ground inputs, drone footage
    and Starlink communications.
  url: https://ororatech.com/resources/news-blog/ororatech-signs-landmark-deal-to-protect-the-rio-negro-province-of-argentina-home-to-the-patagonia-region
  fetched: '2026-11-03'
  quote: The new control center aims to coordinate response and prevention efforts by combining OroraTech’s
    proprietary satellite data with ground-based inputs, drone footage, and communications infrastructure
    powered by Starlink.
- claim: Provincial officials, including the Governor and Minister of Environment, inaugurated the control
    centres on 14 February 2026.
  url: https://ororatech.com/resources/news-blog/ororatech-signs-landmark-deal-to-protect-the-rio-negro-province-of-argentina-home-to-the-patagonia-region
  fetched: '2026-11-03'
  quote: Provincial officials, including the Governor and Minister of Environment, inaugurated the new
    control centers on 14th of February.
