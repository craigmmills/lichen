summary: A biodiversity monitoring project in central Argentina whose third phase,
  announced in May 2025, plans to compare vertebrate and invertebrate assemblages
  across five RAPELD modules and strengthen PPBio.
facts:
- claim: The third phase, announced in May 2025, plans to compare vertebrate and invertebrate
    assemblages across five RAPELD grids or modules and strengthen the Program of
    Biodiversity Research (PPBio) in Argentina.
  url: https://www.rufford.org/projects/ana-cecilia-ochoa/implementing-long-term-biodiversity-monitoring-through-rapeld-methodology-in-central-argentina-step-three-integrating-ecological-studies/
  fetched: 2026-11-09
  quote: The project focuses on the integration of biodiversity information, strengthening
    the Program of Biodiversity Research (PPBio) in Argentina.
- claim: Its study sites include Sierra de las Quijadas and Talampaya national parks,
    a provincial reserve and three private reserves.
  url: https://www.rufford.org/projects/ana-cecilia-ochoa/implementing-long-term-biodiversity-monitoring-through-rapeld-methodology-in-central-argentina-step-three-integrating-ecological-studies/
  fetched: 2026-11-09
  quote: 'two parks involved in this study: Sierra de las Quijadas and Talampaya National
    Parks'
- claim: The second phase, described in August 2022, planned to sample medium and
    large mammals with camera traps and transects on RAPELD grids in two national
    parks.
  url: https://www.rufford.org/projects/ana-cecilia-ochoa/implementing-long-term-biodiversity-monitoring-through-rapeld-methodology-in-central-argentina-step-two-medium-and-large-size-mammals-assemblages/
  fetched: 2026-11-09
  quote: Camera traps and transects using RAPELD Grids.
- claim: The project plans reports for provincial agencies, landowners and the national
    parks administration.
  url: https://www.rufford.org/projects/ana-cecilia-ochoa/implementing-long-term-biodiversity-monitoring-through-rapeld-methodology-in-central-argentina-step-three-integrating-ecological-studies/
  fetched: 2026-11-09
  quote: We will also generate reports for state government agencies, landowners and
    the Argentinian National Parks Administration Office (APN).
