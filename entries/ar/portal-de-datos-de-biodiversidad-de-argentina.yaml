summary: Open Argentine biodiversity portal based on GBIF hosted portals technology, developed
  with over 60 institutions, reportedly holding over 17 million records at its September 2024
  launch.
facts:
- claim: In September 2024, CONICET reported that the portal held more than 17 million records.
  url: https://www.conicet.gov.ar/nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: 2026-11-03
  quote: La plataforma digital, que ya cuenta con más de 17 millones de datos
- claim: Its aim is to make available open primary data on Argentina from natural history
    collections, ecological studies and monitoring, and citizen science.
  url: https://www.conicet.gov.ar/nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: 2026-11-03
  quote: El objetivo del portal es poner a disposición los datos primarios abiertos de Argentina
    generados por instituciones de nuestro país y del mundo, a partir de sus colecciones de
    historia natural, estudios ecológicos y monitoreos
- claim: It is based on GBIF's hosted portals technology.
  url: https://www.conicet.gov.ar/nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: 2026-11-03
  quote: está basado en la tecnología desarrollada por GBIF con su programa de Portales Alojados
- claim: Part of GBIF's hosted portals programme; its design and content are produced by the
    Red Argentina de Datos y Colecciones Biológicas.
  url: https://www.macnconicet.gob.ar/se-presento-el-nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: '2026-11-03'
  quote: forma parte del programa Portales Alojados del Sistema Global de Información sobre
    Biodiversidad (GBIF por sus siglas en inglés) y su diseño y contenido es producido por
    la Red Argentina de Datos y Colecciones Biológicas (RADyCB)
- claim: Developed in collaboration with more than 60 Argentine institutions.
  url: https://www.macnconicet.gob.ar/se-presento-el-nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: '2026-11-03'
  quote: Este portal ha sido desarrollado mediante la colaboración de más de 60 instituciones
    de nuestro país
- claim: At its launch it held about 17 million records, 15 million with coordinates, and
    more than a million images.
  url: https://www.macnconicet.gob.ar/se-presento-el-nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: '2026-11-03'
  quote: cuenta con unos 17 millones de registros, 15 millones de ellos con coordenadas geográficas,
    y más de un millón de imágenes asociadas
- claim: Aggregates open biodiversity data on Argentina from Argentine and foreign institutions.
  url: https://biodiversidad.ar
  fetched: '2026-11-03'
  quote: Este portal agrega datos abiertos de biodiversidad de Argentina, ya sean datos de
    instituciones argentinas como extranjeras.
- claim: Built on technology developed by GBIF under its hosted portals programme, with design
    and content by the RADyCB.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: El Portal de Datos de Biodiversidad de Argentina está basado en la tecnología desarrollada
    por GBIF con su programa de Portales Alojados con diseño y contenido producido por la
    RADyCB .
- claim: The network's data follow the Darwin Core standard and FAIR principles and are credited
    to the institutions that publish them through the portal.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: Nuestros datos siguen el estándar Darwin Core y se rigen por los Principios FAIR
- claim: Data are attributed to the institutions that produce and publish them through the
    portal.
  url: https://biodiversidad.ar/acerca-de/
  fetched: 2026-11-03
  quote: Los datos son atribuidos de manera transparente a las instituciones que los producen
    y publican, a través del Portal de Biodiversidad de Argentina .
- claim: At its launch in September 2024, CADIC reported that the portal held more than 17
    million records and was developed at the Museo Argentino de Ciencias Naturales by CONICET
    specialists and Argentine GBIF node members.
  url: https://cadic.conicet.gov.ar/nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: 2026-11-03
  quote: La plataforma digital, que ya cuenta con más de 17 millones de datos, fue desarrollada
    en el Museo Argentino de Ciencias Naturales "Bernardino Rivadavia" por especialistas del
    CONICET e integrantes del Nodo Argentino de la Infraestructura Mundial de Información
    sobre Biodiversidad
- claim: Its aim is to make available open primary data on Argentina from natural history
    collections, ecological studies, monitoring and citizen science.
  url: https://cadic.conicet.gov.ar/nuevo-portal-de-datos-de-biodiversidad-de-argentina/
  fetched: 2026-11-03
  quote: El objetivo del portal es poner a disposición los datos primarios abiertos de Argentina
    generados por instituciones de nuestro país y del mundo, a partir de sus colecciones de
    historia natural, estudios ecológicos y monitoreos, así como los datos provenientes de
    iniciativas de ciencia ciudadana.
