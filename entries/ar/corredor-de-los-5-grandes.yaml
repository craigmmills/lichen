summary: Active strategic project promoted by the Río Negro environment secretariat
  with Fundación Por el Mar to protect marine habitats, with 2025 monitoring campaigns
  and a deep-water expedition in the Golfo San Matías described in October 2026.
facts:
- claim: A strategic project promoted by the Río Negro environment secretariat with
    Fundación Por el Mar to protect the marine habitats of the southern right whale,
    dolphins, orcas, sharks and sea lions.
  url: https://rionegro.gov.ar/articulo/57506/rio-negro-consolido-en-2025-el-proyecto-corredor-de-los-5-grandes
  fetched: '2026-11-15'
  quote: un proyecto estratégico impulsado por la Secretaría de Ambiente y Cambio
    Climático junto a Fundación Por el Mar
- claim: In 2025 it carried out research and environmental monitoring campaigns, such
    as at Bahía Creek with Fundación Por el Mar, Fundación Cethus and Grupo Condros
    (CIMAS).
  url: https://rionegro.gov.ar/articulo/57506/rio-negro-consolido-en-2025-el-proyecto-corredor-de-los-5-grandes
  fetched: '2026-11-15'
  quote: con campañas realizadas en sectores como Bahía Creek junto a Fundación Por
    el Mar, Fundación Cethus y el Grupo Condros (CIMAS)
- claim: An October 2026 page described a deep-water scientific expedition within
    the project in the Golfo San Matías, intended to identify deep-water species and
    habitats and generate information for monitoring and conservation.
  url: https://rionegro.gov.ar/articulo/62053/rio-negro-explora-las-profundidades-del-golfo-san-matias-con-tecnologia-de-natgeo
  fetched: '2026-11-15'
  quote: El relevamiento permitirá identificar especies y hábitats de profundidad
    y generar información clave para su monitoreo y conservación.
