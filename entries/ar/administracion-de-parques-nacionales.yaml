summary: Argentine national parks body with a conservation mission for protected areas, which
  runs a biodiversity information system receiving national deforestation alerts every two
  weeks since November 2021.
facts:
- claim: Says it manages the country's most important protected areas for conservation, research,
    sustainable tourism and local development.
  url: https://www.argentina.gob.ar/parquesnacionales
  fetched: 2026-11-03
  quote: Gestionamos las áreas protegidas más importantes del país como espacios de conservación
    del patrimonio natural y cultural, investigación, turismo sostenible y desarrollo local.
- claim: Says it is studying a maned wolf pair living with their cubs in Ansenuza National
    Park.
  url: https://www.argentina.gob.ar/parquesnacionales
  fetched: 2026-11-03
  quote: Estamos estudiando a una pareja de aguará guazú que habita junto a sus cachorros
    en el Parque Nacional Ansenuza.
- claim: Its page lists the project Recuperación Sustentable de Paisajes y Medios de Vida
    en Argentina.
  url: https://www.argentina.gob.ar/parquesnacionales
  fetched: 2026-11-03
  quote: Recuperación Sustentable de Paisajes y Medios de Vida en Argentina
- claim: The body whose mission is to ensure the conservation of biodiversity in national
    protected areas.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: '2026-11-03'
  quote: siendo la Administración de Parques Nacionales el organismo cuya misión es asegurar
    la conservación de la biodiversidad en las áreas protegidas de orden nacional
- claim: Prepared a GEF-funded biodiversity conservation project for Argentina that included
    a biodiversity information management component.
  url: https://www.argentina.gob.ar/parquesnacionales/sib
  fetched: '2026-11-03'
  quote: El Proyecto Conservación de la Biodiversidad de la República Argentina, elaborado
    por la Administración de Parques Nacionales y financiado con los llamados Fondos Globales
    Ambientales (GEF)
- claim: Since November 2021 it has received the national deforestation alerts inside national
    protected areas every two weeks, through its biodiversity information system.
  url: https://sib.gob.ar/novedades/sat-apn
  fetched: 2026-11-03
  quote: Desde noviembre de 2021, la APN mediante el SIB comenzó a recibir quincenalmente
    informes y coberturas geográficas de las alertas
- claim: Publishes on GBIF records of vertebrates of special value in protected areas, recorded
    by park rangers and technical staff.
  url: https://api.gbif.org/v1/organization/979dd240-16f7-11df-b5b3-b8a03c50a862/publishedDataset?limit=40
  fetched: 2026-11-03
  quote: Avistajes de vertebrados de valor especial en las áreas protegidas de la Argentina,
    registrados por guardaparques y técnicos del sistema de áreas protegidas.
