summary: An active programme run by the Wildlife Conservation Society, with offices
  in Munda and Honiara, whose 2021 release describes reef monitoring around Marovo
  Lagoon with Zaira community rangers and 2016 surveys around Kolombangara.
facts:
- claim: A 2021 WCS release says impacted reefs were observed during a WCS underwater
    monitoring expedition around Marovo Lagoon.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/15878/Widespread-Bleaching-Spotted-in-Solomon-Islands-Coral-Reefs.aspx
  fetched: 2026-11-14
  quote: Impacted reefs were observed during a recent WCS underwater monitoring expedition
    around Marovo Lagoon
- claim: The March 2021 release says WCS staff had long collaborated with Zaira community
    rangers to collect ecosystem data on the region's coral reefs.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/15878/Widespread-Bleaching-Spotted-in-Solomon-Islands-Coral-Reefs.aspx
  fetched: 2026-11-14
  quote: with whom WCS staff have long collaborated to collect ecosystem data to help
    keep tabs on the health of the region’s coral reefs
- claim: The release says WCS led surveys in 2016 around Kolombangara Island.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/15878/Widespread-Bleaching-Spotted-in-Solomon-Islands-Coral-Reefs.aspx
  fetched: 2026-11-14
  quote: Prior surveys led by WCS in 2016 in nearby areas
- claim: The WCS staff page lists a Country Director and an office in Munda, Western
    Province, and a Honiara office.
  url: https://programs.wcs.org/solomonislands/Who-we-are/Staff-Profiles
  fetched: 2026-11-14
  quote: Alec is based in our Munda office in Western Province.
