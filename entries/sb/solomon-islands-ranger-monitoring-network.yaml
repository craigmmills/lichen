summary: A community-led ranger monitoring network led by the Islands Knowledge Institute, in which CoMapeo
  field records feed Remoto; in Kira, rangers photographed logging damage after satellite analysis detected
  it, and this went into a report to the Ministry of Environment.
facts:
- claim: Awana Digital describes ranger groups adapting CoMapeo to local languages and building a community-led
    monitoring network across the Solomon Islands.
  url: https://awana.digital/blog/mapping-for-the-future-indigenous-rangers-lead-the-next-chapter-of-monitoring-in-solomon-islands
  fetched: 2026-11-12
  quote: Conservation ranger groups are adapting CoMapeo to local languages, documenting their territories,
    and building a community-led monitoring network across Solomon Islands.
- claim: Field records move from CoMapeo into Remoto, which connects them with satellite alerts, analysis,
    dashboards and reports.
  url: https://awana.digital/blog/mapping-for-the-future-indigenous-rangers-lead-the-next-chapter-of-monitoring-in-solomon-islands
  fetched: 2026-11-12
  quote: Remoto connects those records with satellite alerts, analysis, dashboards, and reports, helping
    turn field observations into action.
- claim: In the Kira protected area, rangers photographed logging damage after satellite analysis detected
    logging, and the evidence went into a report to the Ministry of Environment.
  url: https://awana.digital/blog/mapping-for-the-future-indigenous-rangers-lead-the-next-chapter-of-monitoring-in-solomon-islands
  fetched: 2026-11-12
  quote: In the Kira protected area, satellite analysis detected logging.
