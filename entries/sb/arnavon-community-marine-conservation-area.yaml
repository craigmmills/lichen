summary: Formed in 1995, the Solomon Islands' first community-based marine protected area labelled and
  relocated nests in 2016; TNC reported hawksbill nests more than doubling in 20 years.
facts:
- claim: Formed in 1995 as the Solomon Islands' first community-based marine protected area, after talks
    between the national and provincial governments, The Nature Conservancy and community leaders.
  url: https://blog.nature.org/2016/05/31/headhunters-poaching-arson-community-conservation-in-the-arnavon-islands/
  fetched: 2026-11-12
  quote: all parties came together to form the Arnavons Community Marine Conservation Area (ACMCA) in
    1995 — the Solomon Island’s first community-based marine protected area.
- claim: In 2016, its conservation rangers monitored and labelled turtle nests and relocated nests laid
    below the high-tide line.
  url: https://blog.nature.org/2016/05/31/headhunters-poaching-arson-community-conservation-in-the-arnavon-islands/
  fetched: 2026-11-12
  quote: Each nest is carefully monitored by the conservation rangers, who label them with the date the
    nest was laid and protect them from predators with wire mesh.
- claim: The Nature Conservancy reported in 2016 that monitoring data showed hawksbill nests on the Arnavons
    had more than doubled in 20 years.
  url: https://blog.nature.org/2016/05/31/headhunters-poaching-arson-community-conservation-in-the-arnavon-islands/
  fetched: 2026-11-12
  quote: Analysis of the monitoring data revealed that the number of hawksbill turtle nests laid on the
    Arnavons has more than doubled in the past 20 years.
