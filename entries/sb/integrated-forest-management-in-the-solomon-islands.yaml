summary: A GEF-funded project, run by two government ministries and partnered with FAO, aiming to help
  the government manage protected and productive forest landscapes; UN-REDD says its earlier monitoring
  work formed the foundation for FAO's support.
facts:
- claim: Its aim is to help the government implement integrated management of protected and productive
    forest landscapes.
  url: https://thegef.org/projects-operations/projects/5122
  fetched: 2026-11-12
  quote: To assist the Government of the Solomon Islands to implement integrated management of protected
    and productive forest landscapes for sustainable community development and multiple environmental
    benefits.
- claim: The GEF project page lists implementation reports up to 2026.
  url: https://thegef.org/projects-operations/projects/5122
  fetched: 2026-11-12
  quote: GEFID5122_2026PIR_FAO_Solomon Islands
- claim: UN-REDD says its national forest monitoring system and reference level work formed the foundation
    for FAO's GEF-funded support through this project.
  url: https://un-redd.org/partner-countries/asia-pacific/solomon-islands
  fetched: 2026-11-12
  quote: These activities have formed a solid foundation for additional support provided by FAO and funded
    by GEF in 2018 for the “Integrated Forest Management in the Solomon Islands” project.
