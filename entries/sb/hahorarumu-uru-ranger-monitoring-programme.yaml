summary: A closed ranger programme, led by Edgar Pollard, planned in 2017 to have 12 rangers
  in four teams monitor palms, vines, Vitex trees and frogs, with the work later moving to
  Ainapo and Hounamae.
facts:
- claim: The Rufford project page, dated 29 September 2017, says 12 rangers would be split
    into four teams for palms, vines, Vitex trees and frogs.
  url: https://www.rufford.org/projects/edgar-pollard/establishment-of-a-ranger-program-to-monitor-key-flora-and-fauna-of-hahorarumu-uru/
  fetched: 2026-11-14
  quote: The 12 rangers will be divided into 4 teams with our 4 focus areas (1. Palms, 2.
    Vines, 3. Vitex trees, 4. Frogs).
- claim: The page says the programme aimed at a forest inventory list and the documentation
    of key plants and animals.
  url: https://www.rufford.org/projects/edgar-pollard/establishment-of-a-ranger-program-to-monitor-key-flora-and-fauna-of-hahorarumu-uru/
  fetched: 2026-11-14
  quote: We also want to achieve tangible outputs in the production of a forest inventory
    list and the documentation and publication of our key plants and animals such as palms,
    vines, trees and frogs.
- claim: The final evaluation report says rangers learned GPS use, forestry plots and frog
    surveys.
  url: https://media.rufford.org/media/project_reports/19747-2%20Final%20Evaluation%20Report.pdf
  fetched: 2026-11-14
  quote: Rangers have learned basic skills such as GPS use, forestry plots, frogging
- claim: The final evaluation report says the work moved to the neighbouring tribal lands
    of Ainapo and Hounamae.
  url: https://media.rufford.org/media/project_reports/19747-2%20Final%20Evaluation%20Report.pdf
  fetched: 2026-11-14
  quote: decided to work in the neighbouring tribal lands of Ainapo and Hounamae.
