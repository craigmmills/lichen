status: active
summary: A forest conservation project in South Choiseul, led by the Natural Resources Development Foundation,
  where landowner rangers patrol transects and boundaries to monitor forest loss, under a monitoring plan
  developed to meet the Plan Vivo Standard.
facts:
- claim: Local rangers of the project carried out a forest monitoring survey in South Choiseul from 17
    to 20 January 2023.
  url: https://environment.islesmedia.net/working-to-conserve-babatana-rainforest-in-choiseul-province/
  fetched: 2026-11-12
  quote: A forest monitoring survey based on technical assessments was recently carried out by local rangers
    of the Babatana Rainforest Conservation Project in South Choiseul.
- claim: Forest cover loss in the Eligible Forest Area is monitored by landowner rangers on transect and
    boundary patrols, recording agricultural encroachment and illegal logging.
  url: https://environment.islesmedia.net/working-to-conserve-babatana-rainforest-in-choiseul-province/
  fetched: 2026-11-12
  quote: the Forest cover loss in the EFA is monitored in the field using transect and boundary patrols
    carried out by landowner rangers where any incidents of encroachment of agriculture or illegal logging
    are recorded.
- claim: Its monitoring plan was developed to meet the Plan Vivo Standard.
  url: https://environment.islesmedia.net/working-to-conserve-babatana-rainforest-in-choiseul-province/
  fetched: 2026-11-12
  quote: the monitoring plan was developed to meet the requirements of the Plan Vivo Standard for 30 years
