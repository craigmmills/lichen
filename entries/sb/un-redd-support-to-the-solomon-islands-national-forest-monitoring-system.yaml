  url: https://un-redd.org/partner-countries/asia-pacific/solomon-islands
  fetched: 2026-11-12
  quote: In 2017, the UN-REDD Programme began its activities in the Solomon Islands to establish a National
    Forest Monitoring System (NFMS) and Forest Reference Emission Level (FREL).
- claim: It supported survey design and training in Collect Earth for a national forest and land use change
    assessment covering 2000 to 2016.
  url: https://un-redd.org/partner-countries/asia-pacific/solomon-islands
  fetched: 2026-11-12
