summary: Closed satellite tracking study of hawksbill turtles, reported by The Nature
  Conservancy, in which Fastloc trackers showed Arnavons turtles returning to South
  Pacific foraging grounds, an average migration of 2,028 kilometres.
facts:
- claim: The Nature Conservancy's story says the team used Fastloc trackers that record
    a GPS location every three hours and send the data by satellite.
  url: https://www.nature.org/en-us/about-us/where-we-work/asia-pacific/solomon-islands/stories-in-solomon-islands/science-protects-hawksbill/
  fetched: 2026-11-15
  quote: Hamilton’s team used Fastloc® trackers, which record a GPS location every
    three hours, and then send the data back to Hamilton via satellite when the turtle
    surfaces for air.
- claim: Richard Hamilton, then director of TNC's Melanesia programme, wanted to verify
    where the turtles went after nesting.
  url: https://www.nature.org/en-us/about-us/where-we-work/asia-pacific/solomon-islands/stories-in-solomon-islands/science-protects-hawksbill/
  fetched: 2026-11-15
  quote: Dr. Richard Hamilton, then-TNC Melanesia program Director, wanted to verify
    where the turtles returned to after nesting.
- claim: The tracking data showed the Arnavons turtles returning to foraging grounds
    across the South Pacific, with an average migration of 2,028 kilometres.
  url: https://www.nature.org/en-us/about-us/where-we-work/asia-pacific/solomon-islands/stories-in-solomon-islands/science-protects-hawksbill/
  fetched: 2026-11-15
  quote: The average migration distance was 2,028 kilometers (1,260 miles), which
    is farther than any other known migration distance for hawksbill turtles.
- claim: Two turtles from the first tagging cohort were poached in 2016.
  url: https://www.nature.org/en-us/about-us/where-we-work/asia-pacific/solomon-islands/stories-in-solomon-islands/science-protects-hawksbill/
  fetched: 2026-11-15
  quote: two turtles from the first tagging cohort were poached in 2016
