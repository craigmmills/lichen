summary: An active forest inventory and ranger monitoring project partnered with the
  Natural Resources Development Foundation, where MCC reported over 800 hectares prepared
  and rangers receiving forest inventory training.
facts:
- claim: MCC's November 2024 article says the partnership between the two governments
    had prepared over 800 hectares at Sobehatunga as a potential haven for biodiversity.
  url: https://mcc.gov/blog/entry/blog-111424-solomon-islands-forest-rangers
  fetched: 2026-11-14
  quote: has prepared over 800 hectares of land, roughly the equivalent of 1,120 American
    football fields, to become a potential haven for biodiversity in a sanctuary named
    Sobehatunga
- claim: MCC's November 2024 article says Keith Moveni and his colleagues measured
    trees, documented plant and animal species using a smartphone app, and patrolled
    to monitor changes in forest conditions.
  url: https://mcc.gov/blog/entry/blog-111424-solomon-islands-forest-rangers
  fetched: 2026-11-14
  quote: document plant and animal species using a smartphone app, and patrol the
    land to monitor changes in forest conditions
- claim: MCC's November 2024 article says Keith Moveni, a consultant with the Ministry
    of Forestry and Research, was training rangers in forest inventory.
  url: https://mcc.gov/blog/entry/blog-111424-solomon-islands-forest-rangers
  fetched: 2026-11-14
  quote: At the heart of this endeavour stands Keith Moveni, a consultant with the
    Ministry of Forestry and Research.
- claim: In November 2024, MCC called the Viru Harbor forest carbon project one example
    of its efforts, with more sites to follow.
  url: https://mcc.gov/blog/entry/blog-111424-solomon-islands-forest-rangers
  fetched: 2026-11-14
  quote: The forest carbon project at Viru Harbor is one example of our efforts, with
    more sites to follow.
