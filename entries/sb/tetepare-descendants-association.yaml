facts:
- claim: Formed by descendants of Tetepare's former inhabitants to protect the island when commercial
    logging threatened it.
  url: https://tetepare.org/tetepare-community/
  fetched: 2026-11-12
  quote: the descendants of Tetepare’s former inhabitants came together and formed an alliance to become
    the Tetepare Descendants’ Association, or TDA
- claim: Runs monitoring programmes for turtles, seagrass, coconut crabs, reefs, forest, fish and trochus
    to inform management.
  url: https://tetepare.org/ranger-research-program/
  fetched: 2026-11-12
  quote: TDA runs numerous monitoring programs to inform conservation management including for turtles,
    seagrass, coconut crabs, reef check, forest, fish and trochus.
- claim: Its marine monitoring crew surveys the surrounding reefs as part of Reef Check.
  url: https://tetepare.org/ranger-research-program/
  fetched: 2026-11-12
  quote: TDA’s marine monitoring crew participates in the Global Reef Check initiative by performing surveys
    of Tetepare’s surrounding reefs.
- claim: Seagrass survey data from its women monitors go to the Seagrass Watch database.
  url: https://tetepare.org/ranger-research-program/
  fetched: 2026-11-12
  quote: The information they collect is sent to an Australian sea grass database (Seagrass Watch)
- claim: Its turtle programme tags adult turtles and protects nests.
  url: https://tetepare.org/tetepare-conservation-program/
  fetched: 2026-11-12
  quote: Tetepare’s turtle conservation program includes tagging adult turtles and protecting turtle nests
    from poachers, monitor lizards and high tides.
