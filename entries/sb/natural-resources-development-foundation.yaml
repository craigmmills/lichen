    2003.
  url: https://www.rufford.org/projects/wilko-bosma/nrdf-community-based-forest-conservation-project/
  fetched: 2026-11-14
  quote: NRDF is a local NGO established in 2003 addressing the problem of the ongoing
    exploitation of forest resources by foreign logging companies.
- claim: CEPF lists the grantee of its 2017 to 2018 Choiseul PES grant as Natural
