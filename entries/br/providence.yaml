  fetched: '2026-10-30'
  quote: é uma solução tecnológica de monitoramento da biodiversidade baseada em sensores
    com inteligência artificial
- claim: The Providence Plus team was one of six XPRIZE Rainforest finalists.
  url: https://redeondadigital.com.br/amazonas/projeto-desenvolvido-no-instituto-mamiraua-e-um-dos-finalistas-em-competicao-internacional
  fetched: '2026-10-30'
  quote: é um dos seis finalistas e o único representante amazonense na premiação internacional
    XPRIZE Rainforest
- claim: Sensors installed at Mamirauá and Amanã reserves identify animals by image and sound.
