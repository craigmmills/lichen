- claim: Its third phase plans about one hundred automated modules in 30 places.
  url: https://observatoriocientifico.ufc.br/pt/tecnologia-que-utiliza-inteligencia-artificial-amplia-area-de-monitoramento-da-biodiversidade-na-amazonia/
  fetched: '2026-10-30'
  quote: instalar cerca de cem módulos automatizados de monitoramento em 30 localidades
- claim: A study within the project used passive acoustic monitoring with AI for Amazonian
    manatee conservation.
