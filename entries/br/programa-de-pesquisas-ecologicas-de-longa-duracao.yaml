id: programa-de-pesquisas-ecologicas-de-longa-duracao
kind: programme
name: Programa de Pesquisas Ecológicas de Longa Duração
also_known_as:
- PELD
- Brazilian Long-Term Ecological Research Program
scope: br
ai_label: data-infrastructure
status: active
realms:
- land
- freshwater
- ocean
countries:
- br
summary: CNPq-coordinated network of ecological research sites running since 1999,
  with 55 sites approved under the 2024 call and about 60 million reais of federal
  funding from 1999 to 2025.
facts:
- claim: Since 1999, under CNPq's coordination, links a network of reference sites
    for research on ecosystem ecology.
  url: https://www.gov.br/cnpq/pt-br/acesso-a-informacao/acoes-e-programas/programas/peld/apresentacao
  fetched: '2026-11-09'
  quote: sob a coordenação do CNPq, uma rede de sítios de referência para a pesquisa
    científica no tema de Ecologia de Ecossistemas
- claim: The data collected include long time series on ecosystems and their species.
  url: https://www.gov.br/cnpq/pt-br/acesso-a-informacao/acoes-e-programas/programas/peld/apresentacao
  fetched: '2026-11-09'
  quote: As informações coletadas no PELD, que incluem longas séries temporais de
    dados sobre os ecossistemas e sua biota associada
- claim: The network has 55 research sites across the biomes and the coastal and marine
    system, approved under the 2024 call.
  url: https://www.gov.br/cnpq/pt-br/acesso-a-informacao/acoes-e-programas/programas/peld/apresentacao
  fetched: '2026-11-09'
  quote: A rede PELD conta atualmente com 55 sítios de pesquisa distribuídos nos diversos
    biomas brasileiros e no sistema marinho - costeiro
- claim: From 1999 to 2025 it received about 60 million reais of federal investment,
    mainly from CNPq's budget.
  url: https://www.gov.br/cnpq/pt-br/acesso-a-informacao/acoes-e-programas/programas/peld/investimentos
  fetched: '2026-11-09'
  quote: No período de 1999 a 2025, o Programa PELD contou com investimentos federais
    da ordem de 60 milhões de reais, com recursos oriundos especialmente do orçamento
    do CNPq.
