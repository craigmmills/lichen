    de 20 anos
- claim: The February 2022 article says it supported three surveillance bases at river
    access points to the Kayapó and Menkragnoti territories.
  url: https://www.ecycle.com.br/com-tecnologia-povo-kayapo-mebengokre-tenta-barrar-devastacao-da-amazonia/
