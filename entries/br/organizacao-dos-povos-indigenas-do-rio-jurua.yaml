summary: Indigenous organisation headquartered in Cruzeiro do Sul, Acre, representing
  14 peoples across 13 lands totalling 640,000 hectares, with an Amazon Fund project
  that built a Looker Studio management dashboard using data from 13 communities.
facts:
- claim: The Amazon Fund project page says the organisation represents the 14 peoples
    of 13 Indigenous lands totalling 640,000 hectares.
  url: https://www.fundoamazonia.gov.br/pt/projeto/Gestao-Territorial-OPIRJ/
  fetched: '2026-11-17'
  quote: em 13 Terras Indígenas (TIs) da região. Essas terras somam 640 mil hectares
    - uma área maior que o Distrito Federal - onde vivem mais de 11 mil indígenas
    de 14 povos, que são representados pela OPIRJ – a Organização dos Povos Indígenas
    do Rio Juruá
- claim: The project aims to promote integrated territorial and environmental management
    of the Indigenous lands of the Juruá river through the network of organisations
    linked to it.
  url: https://www.fundoamazonia.gov.br/pt/projeto/Gestao-Territorial-OPIRJ/
  fetched: '2026-11-17'
  quote: Promover a gestão territorial e ambiental integrada das Terras Indígenas
    do Rio Juruá, por meio do desenvolvimento da rede de organizações indígenas ligadas
    à Organização dos Povos Indígenas do Rio Juruá (OPIRJ)
- claim: The project built a strategic management dashboard on Looker Studio with
    data from 13 communities, including territorial management.
  url: https://www.fundoamazonia.gov.br/pt/projeto/Gestao-Territorial-OPIRJ/
  fetched: '2026-11-17'
  quote: Painel de Gestão Estratégica da OPIRJ, hospedado na plataforma Looker Studio,
    que reúne dados de 13 comunidades nos eixos gestão territorial
- claim: The project describes it as an organisation whose headquarters are in Cruzeiro
    do Sul, Acre.
  url: https://www.fundoamazonia.gov.br/pt/projeto/Gestao-Territorial-OPIRJ/
  fetched: '2026-11-17'
  quote: O projeto recuperará a sede da OPIRJ em Cruzeiro do Sul (AC)
