summary: Brazilian fund managed by BNDES, in coordination with the environment ministry, that
  pays for monitoring and forest protection projects, including INPE's SIM-Biomas.
facts:
- claim: BNDES manages the fund, and approved SIM-Biomas in coordination with the environment
    ministry.
  url: https://portalamazonia.com/economia/fundo-amazonia-inpe-ia/
  fetched: '2026-10-30'
  quote: O projeto SIM-Biomas foi aprovado pelo Banco Nacional de Desenvolvimento Econômico
    e Social (BNDES), gestor do Fundo Amazônia, em coordenação com o Ministério do Meio Ambiente
    e Mudança do Clima (MMA).
- claim: Raises donations for non-repayable investment in preventing, monitoring and combating
    deforestation.
  url: https://www.fundoamazonia.gov.br/pt/home/
  fetched: '2026-10-30'
  quote: O Fundo Amazônia tem por finalidade captar doações para investimentos não reembolsáveis
    em ações de prevenção, monitoramento e combate ao desmatamento
- claim: Also supports development of monitoring systems elsewhere in Brazil and in other
    tropical countries.
  url: https://www.fundoamazonia.gov.br/pt/home/
  fetched: '2026-10-30'
  quote: Também apoia o desenvolvimento de sistemas de monitoramento e controle do desmatamento
    no restante do Brasil e em outros países tropicais.
- claim: BNDES manages the fund.
  url: https://agenciadenoticias.bndes.gov.br/noticia/Fundo-Amazonia-apoia-Inpe-no-uso-de-IA-para-monitoramento-rapido-e-antecipacao-de-riscos-ambientais/
  fetched: '2026-10-30'
  quote: Banco Nacional de Desenvolvimento Econômico e Social (BNDES), gestor do Fundo Amazônia
- claim: Has contracted R$521 million for fire prevention and fighting in 14 states.
  url: https://agenciadenoticias.bndes.gov.br/noticia/Fundo-Amazonia-apoia-Inpe-no-uso-de-IA-para-monitoramento-rapido-e-antecipacao-de-riscos-ambientais/
  fetched: '2026-10-30'
  quote: com R$ 521 milhões contratados para ações em 14 estados e três biomas
