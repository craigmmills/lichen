summary: Platform of map layers on vegetation type, biomass, forecast fire danger
  and property fire history, which Imasul announced in November 2023 it had available
  to assess burning and fire management licence requests.
facts:
- claim: A platform of map layers on vegetation type, accumulated biomass, forecast
    fire danger and a property's fire history.
  url: https://www.imasul.ms.gov.br/?p=103467
  fetched: '2026-11-09'
  quote: O SIFAU consiste em uma plataforma composta de diversas camadas de mapas
    que fornecem informações sobre o tipo de vegetação, a quantidade de biomassa acumulada,
    a previsão de perigo de fogo no local e nos arredores e o histórico de fogo na
    propriedade
- claim: In November 2023, Imasul announced it had the system available to analyse
    licence requests for controlled burning or integrated fire management.
  url: https://www.imasul.ms.gov.br/?p=103467
  fetched: '2026-11-09'
  quote: passa a dispor de um sistema de geotecnologia para analisar pedidos de licença
    ambiental para queima controlada ou manejo integrado do fogo (MIF)
