  fetched: '2026-10-30'
  quote: 'Em 2025 teve início o projeto “IA-FogoBio: Inteligência Artificial para
    Predição de Risco e Avaliação de Impacto de Eventos de Fogo na Biodiversidade
    Amazônica”'
- claim: Plans an online AI system to predict Amazon forest fires up to 14 days ahead.
