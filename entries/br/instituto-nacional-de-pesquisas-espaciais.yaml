summary: Brazil's federal space research institute, under the science ministry, which runs
  the official deforestation monitoring systems PRODES and DETER and the Brazil Data Cube.
facts:
- claim: IPAM says INPE is linked to the Ministry of Science, Technology and Innovation and
    has published Amazon deforestation data since 1988.
  url: https://ipam.org.br/entenda/how-is-deforestation-in-the-amazon-monitored/
  fetched: '2026-10-30'
  quote: Since 1988, deforestation data in the Amazon have been freely available on the website
    of the Instituto Nacional de Pesquisas Espaciais
- claim: Develops the Brazil Data Cube project, using machine learning to produce land use
    and cover information.
  url: https://data.inpe.br/bdc/?p=507
  fetched: '2026-10-30'
  quote: generate land use and cover information from these data cubes using machine learning
    and satellite image time series analysis
- claim: Receives Amazon Fund money under the BIOMAS-BNDES project.
  url: https://www.gov.br/inpe/pt-br
  fetched: '2026-10-30'
  quote: O INPE é beneficiário de colaboração financeira do Fundo Amazônia no âmbito do projeto
    BIOMAS-BNDES.
- claim: Located in São José dos Campos, and will widen its use of AI to detect deforestation
    in the Amazon and Cerrado.
  url: https://www.band.com.br/ciencia-e-tecnologia/inpe-amplia-uso-de-inteligencia-artificial-no-combate-ao-desmatamento
  fetched: '2026-10-30'
  quote: localizado em São José dos Campos , vai ampliar o uso de inteligência artificial
    para detectar focos de desmatamento na Amazônia e no Cerrado
- claim: Says its deforestation prediction system uses artificial intelligence to forecast
    areas at highest risk up to 15 days ahead.
  url: https://www.gov.br/inpe/pt-br/assuntos/ultimas-noticias/sistema-de-prevencao-a-desmatamentos-na-amazonia-e-atualizado-e-fica-ainda-mais-preciso
  fetched: '2026-10-30'
  quote: utiliza inteligência artificial para prever, com até 15 dias de antecedência, as
    áreas de maior risco de desmatamento e de queimadas na região
- claim: A unit attached to the Ministry of Science, Technology and Innovation.
  url: https://www.gov.br/inpe/pt-br/assuntos/ultimas-noticias/inpe-mcti-e-secd-mma-lancam-sistema-deter-nao-floresta-para-monitoramento-diario-de-todo-o-bioma-amazonia/
  fetched: '2026-10-30'
  quote: unidade vinculada ao Ministério da Ciência Tecnologia e Inovação (MCTI)
- claim: Describes its DETER Não Floresta method as machine learning applied to image processing.
  url: https://www.gov.br/inpe/pt-br/assuntos/ultimas-noticias/inpe-mcti-e-secd-mma-lancam-sistema-deter-nao-floresta-para-monitoramento-diario-de-todo-o-bioma-amazonia/
  fetched: '2026-10-30'
  quote: métodos de aprendizagem por máquina (Inteligência Artificial)
- claim: Its own site gives its head unit at Avenida dos Astronautas, São José dos Campos.
  url: https://www.gov.br/inpe/pt-br/acesso-a-informacao/institucional/horario-de-atendimento
  quote: Unidade Sede, em São José dos Campos (SP)
