summary: NGO (REGUA) that Rainforest Trust says has bought land for a 22,466-acre
  reserve in the Guapiaçu Valley, and which a 2019 report said had reforested 60 hectares
  with 120,000 native seedlings.
facts:
- claim: Rainforest Trust says REGUA has bought land to create a 22,466-acre reserve
    in the Guapiaçu Valley.
  url: https://www.rainforesttrust.org/urgent-projects/expanding-regua-a-critical-reserve-in-brazils-atlantic-forest/
  fetched: '2026-11-17'
  quote: REGUA has created a secure 22,466-acre reserve that provides critical protection
    for many of the Atlantic Forest’s most threatened species
- claim: Rainforest Trust’s project page, marked protected in 2016, describes plans
    to help REGUA purchase seven parcels to link properties it had already acquired
    in the valley.
  url: https://www.rainforesttrust.org/urgent-projects/expanding-regua-a-critical-reserve-in-brazils-atlantic-forest/
  fetched: '2026-11-17'
  quote: linking properties previously acquired by REGUA
- claim: A September 2019 Agência Brasil report republished by Neo Mondo describes
    REGUA as an NGO whose Guapiaçu Grande Vida project had reforested 60 hectares
    with 120,000 native seedlings.
  url: https://neomondo.org.br/2019/09/25/ong-refloresta-area-equivalente-a-60-estadios-do-maracana
  fetched: '2026-11-17'
  quote: gerido pela organização não governamental (ONG) Reserva Ecológica de Guapiaçu
    (REGUA), foi o responsável pelo reflorestamento de 60 hectares com 120 mil mudas
    nativas da Mata Atlântica
