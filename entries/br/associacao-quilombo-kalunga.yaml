summary: Quilombo association for the 261,999-hectare Kalunga territory, home to about
  1,600 families in 39 communities; its board built a geographic information system
  and database, with youth trained in Open Data Kit and ArcGIS.
facts:
- claim: The ICCA Registry says about 1,600 families live in the 261,999-hectare Kalunga
    territory, in 39 communities.
  url: https://www.iccaregistry.org/en/explore/Brazil/sitio-historico-e-patrimonio-cultural-kalunga
  fetched: '2026-11-17'
  quote: approximately 1,600 families live in an area of 261,999 hectares, distributed
    between 39 communities
- claim: The registry says the association drew up internal regulations in 2019 and
    elected family representatives to its management through a council.
  url: https://www.iccaregistry.org/en/explore/Brazil/sitio-historico-e-patrimonio-cultural-kalunga
  fetched: '2026-11-17'
  quote: In 2019 Quilombo Kalunga Association (AQK) held 14 large meetings to prepare
    the Internal Regulations and a 3-day assembly to discuss and approve its final
    drafting.
- claim: The association's board built a geographic information system and a database
    for the territory, with youth trained in Open Data Kit and ArcGIS.
  url: https://www.iccaregistry.org/en/explore/Brazil/sitio-historico-e-patrimonio-cultural-kalunga
  fetched: '2026-11-17'
  quote: The AQK Board develops important mapping and data skills for the entire territory,
    having structured a Geographic Information System (GIS) and a physical and socio-economic
    database
