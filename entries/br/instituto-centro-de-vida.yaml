  fetched: '2026-10-30'
  quote: Acompanhe os dados sobre desmatamento na Amazônia e no Cerrado
- claim: Offers an interactive tool for monitoring heat spots in Mato Grosso.
  url: https://www.icv.org.br
  fetched: '2026-10-30'
  quote: Acesse nossa ferramenta interativa para monitoramento dos focos de calor durante
