summary: Closed snow leopard census run by WWF, reported to have run from May 2018 to October 2020 with
  1,475 camera traps, combined with field signs, prey counts and modelling, as part of PAWS.
facts:
- claim: IG Wild beim Wild reports that the census ran from May 2018 to October 2020 and deployed 1,475
    camera traps.
  url: https://wildbeimwild.com/en/mongolia-one-two-953-snow-leopards-counted
  fetched: 2026-11-08
  quote: The snow leopard census began in May 2018 and ended in October 2020. Together with partners,
    WWF surveyed and mapped all potential habitats in Mongolia and deployed 1,475 camera traps.
- claim: IG Wild beim Wild reports that camera-trap data were combined with field signs, prey counts and
    geographic computer modelling.
  url: https://wildbeimwild.com/en/mongolia-one-two-953-snow-leopards-counted
  fetched: 2026-11-08
  quote: Between 2018 and 2020, thousands of photos from camera traps and field observations were evaluated
    and combined with computer-assisted modelling.
- claim: IG Wild beim Wild reports that the survey was part of the Population Assessment of the World's
    Snow Leopards (PAWS).
  url: https://wildbeimwild.com/en/mongolia-one-two-953-snow-leopards-counted
  fetched: 2026-11-08
  quote: The snow leopard population survey was conducted as part of the Population Assessment of the
    World's Snow Leopards (PAWS) initiative.
