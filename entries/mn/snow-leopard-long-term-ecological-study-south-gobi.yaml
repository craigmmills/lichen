summary: A snow leopard study in the South Gobi that the Snow Leopard Trust says it
  has run since 2009 using GPS collars and remote cameras, with SMART used in a 2025
  gazelle survey.
facts:
- claim: The Snow Leopard Trust says it has run a long-term ecological study of snow
    leopards in the South Gobi since 2009, using GPS tracking collars and remote cameras.
  url: https://snowleopard.org/our-work/where-we-work/mongolia/
  fetched: 2026-11-12
  quote: using state-of-the-art techniques such as GPS tracking collars and remote
    sensing cameras.
- claim: The Snow Leopard Trust lists GPS collaring, research cameras and genetic
    research among its current programmes in Mongolia.
  url: https://snowleopard.org/our-work/where-we-work/mongolia/
  fetched: 2026-11-12
  quote: Long-term Ecological Study Research Center
- claim: In August 2016, the Snow Leopard Trust reported that Gobi Gurvan Saikhan
    National Park rangers were helping monitor most of the park with research cameras.
  url: https://snowleopard.org/celebrating-20-years-of-conservation-in-gurvan-saikhan-national-park
  fetched: 2026-11-12
  quote: They are helping us monitor most of the park with research cameras.
- claim: The Snow Leopard Trust says a 2025 goitered gazelle survey in the Tost Toson
    Bumba Nature Reserve ran 28 transects with distance sampling, recording data in
    the SMART mobile app.
  url: https://snowleopard.org/counting-gazelles-in-the-gobi/
  fetched: 2026-11-12
  quote: They surveyed 28 planned transect lines, ranging from 20 to 80 km each, using
    the SMART mobile app to record data in the field.
