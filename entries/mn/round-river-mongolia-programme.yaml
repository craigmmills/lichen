summary: A programme run and built by Round River, launched in 2018 with Ulaan Taiga
  administration guidance, using camera-trap grids for large mammals and 84 permanent
  Darhad Valley plots for pika and pasture work begun in 2019.
facts:
- claim: Round River says it launched its Mongolia programme in 2018 with guidance
    from the Ulaan Taiga Special Protected Area Administration.
  url: https://roundriver.org/what-we-do/where-we-work/mongolia-project/
  fetched: 2026-11-12
  quote: Round River Conservation Studies launched its Mongolia program in 2018 with
    guidance from the Local Advisory Board and the Ulaan Taiga Special Protected Area
    Administration (UTSPAA).
- claim: In 2018 it began monitoring large mammals in the Horidol Mountain region
    with camera-trap grids.
  url: https://roundriver.org/what-we-do/where-we-work/mongolia-project/
  fetched: 2026-11-12
  quote: In 2018, we initiated a project to monitor the large mammal population of
    the keystone species in UTSPA’s Horidol Mountain region using camera trap grids.
- claim: It keeps 84 permanent monitoring plots in the Darhad Valley for its pika
    and pasture project, begun in 2019.
  url: https://roundriver.org/what-we-do/where-we-work/mongolia-project/
  fetched: 2026-11-12
  quote: We have selected 84 random points throughout the valley bottom to serve as
    permanent monitoring plots for this and other Round River and UTSPA research.
