summary: Organisation whose 2025 report covers Khomyn Tal National Park work on Przewalski's horses, giving
  a population of 157 at the end of 2025 and SMART patrols since 2024.
facts:
- claim: Its 2025 report covers its project "Strengthening management capacity of Khomyn Tal National
    Park", focused on the reintroduction and conservation of Przewalski's horses.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: This report details the progress and outcomes of the Khomyn Talyn Takhi’s (KTT) project
- claim: The report says ranger patrols and wildlife censuses in the park have been run with the SMART
    program since 2024.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: Since 2024, ranger patrols and wildlife censuses have been conducted using the SMART
- claim: The report says its researchers patrol daily to monitor the horses and record data.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: researchers conduct daily patrols to monitor Przewalski’s horses and record data on h arem
- claim: The report puts the park's takhi population at 157 individuals at the end of 2025.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: Park stands at 157 individuals, comprising 86 males and 71 females
- claim: The report maps wild ungulates in 2025, including Mongolian gazelle, saiga, goitered gazelle
    and ibex.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: Distribution of wild ungulates in 2025 (M.gazelle, Saiga, G.gazelle and Ibex
- claim: The 2025 report describes camera trapping in the park, with 20 camera-trap stations established
    in 2025.
  url: https://takhi.mn/storage/files/documents/1772509022_69a6575ee74e3.pdf
  fetched: 2026-11-08
  quote: patterns. In total, 20 camera trap stations
