summary: Wildlife Conservation Society programme that introduced SMART to herder rangers and reports seven
  herder groups helping protect 3,184 square kilometres across Umnugobi and Dornogobi.
facts:
- claim: WCS Mongolia says it partners with seven herder groups across Umnugobi and Dornogobi provinces,
    which help protect 3,184 square kilometres of Gobi steppe.
  url: https://mongolia.wcs.org/en-us/About-Us/News/articleType/ArticleView/articleId/24693/Herder-Rangers-Leading-Conservation-in-Southern-Mongolia.aspx
  fetched: 2026-11-08
  quote: WCS Mongolia partners with seven herder groups across the southern Gobi, spanning the provinces
    of Umnogobi and Dornogobi.
- claim: WCS Mongolia introduced SMART to herder community rangers to document wildlife, track human activities
    and record ecological changes.
  url: https://mongolia.wcs.org/en-us/About-Us/News/articleType/ArticleView/articleId/24693/Herder-Rangers-Leading-Conservation-in-Southern-Mongolia.aspx
  fetched: 2026-11-08
  quote: SMART (spatial monitoring and reporting tool) has been introduced to herder community rangers
    by WCS Mongolia to support documenting wildlife, tracking human activities, and recording any unusual
    ecological changes.
