id: on-site-dna-sequencing-against-illegal-wildlife-trade-mongolia
kind: project
name: Combating Illegal Trade in Animal Products by Rapid On-Site DNA Sequencing in
  Mongolia
also_known_as: []
scope: mn
ai_label: conservation-tech
realms:
- land
techniques:
- edna-genomics
countries:
- mn
status: closed
summary: A closed Rufford-supported project whose 28 November 2022 report records
  sequencing 31 mammal samples and 96 plant barcodes for a planned database to identify
  illegally traded species.
facts:
- claim: The project page proposed demonstrating rapid on-site species identification
    in Mongolia using a portable Oxford Nanopore MinION; it says the methods could
    be used at a border customs post.
  url: https://www.rufford.org/projects/emily-patterson/combating-illegal-trade-animal-products-rapid-site-dna-sequencing-mongolia/
  fetched: 2026-11-12
  quote: This simplified process could be carried out at low cost, on-site such as
    at a border customs post, by anyone with minimal training.
- claim: The final report says 31 mammal samples and 96 plant barcodes were sequenced,
    to be used to build a database with the National Forensic Institute for identifying
    illegally traded species.
  url: https://media.rufford.org/media/project_reports/37568-1_Final_Evaluation_Report.pdf
  fetched: 2026-11-12
  quote: A total of 31 mammal samples (with up to four barcodes each) and 96 plant
    barcodes were sequenced.
- claim: The final report, dated 28 November 2022, says complete mitochondrial genomes
    were generated for the Siberian and Altai marmots, among the most hunted and traded
    species in Mongolia.
  url: https://media.rufford.org/media/project_reports/37568-1_Final_Evaluation_Report.pdf
  fetched: 2026-11-12
  quote: Complete mitochondrial genome sequences were generated for both the Siberian
    and Altai marmots
- claim: The final report says the sequences are to be shared in GenBank.
  url: https://media.rufford.org/media/project_reports/37568-1_Final_Evaluation_Report.pdf
  fetched: 2026-11-12
  quote: We plan to share the sequences generated in the open-access database GenBank.
