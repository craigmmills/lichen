summary: A Mongolian snow leopard organisation that partnered with Snow Leopard Conservancy
  on a 2009 survey with 977 scat samples, 274 genetically confirmed as snow leopard,
  and reports camera-trap surveys from 2008 to 2024.
facts:
- claim: A Snow Leopard Conservancy case study on the Mohamed bin Zayed Species Conservation
    Fund site reports 977 scat samples collected in Mongolia in partnership with Dr
    B. Munkhtsog and Irbis Mongolia NGO, with 274 genetically confirmed as snow leopard;
    field surveys took place in February to April 2009.
  url: https://speciesconservation.org/small-grant/snow-leopard/696
  fetched: 2026-11-12
  quote: under our partnership with Dr. B. Munkhtsog of the Mongolian Academy of Sciences
    and Irbis Mongolia NGO (Table 1).
- claim: NEASPEC workshop slides of May 2026 name Bariushaa Munkhtsog as Executive
    Director of Irbis Mongolia Center.
  url: https://neaspec.org/sites/default/files/2026-07/2.2%20Snow%20leopard%20population%20in%20Mongolia%20%281%29.pdf
  fetched: 2026-11-12
  quote: IRBIS MONGOLIA CENTER
- claim: The same slides report camera-trap occupancy surveys in potential snow leopard
    habitat from 2008 to 2024.
  url: https://neaspec.org/sites/default/files/2026-07/2.2%20Snow%20leopard%20population%20in%20Mongolia%20%281%29.pdf
  fetched: 2026-11-12
  quote: Camera trap occupancy survey
