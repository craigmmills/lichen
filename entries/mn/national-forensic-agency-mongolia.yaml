summary: Works with Hanns Seidel Foundation since 2022 on animal DNA databases; 58
  species entered an international database by September 2023; hosted a tree identification
  publication launch in November 2025.
facts:
- claim: A Hanns Seidel Foundation page (27 September 2023) says the foundation has
    worked with the national forensic authority since 2022, aiming to establish an
    animal database for rare and endangered species that are often illegally hunted
    and smuggled.
  url: https://mongolia.hss.de/en/news/detail/representative-of-the-national-forensic-authority-at-hss-mongolia-news10394/
  fetched: 2026-11-13
  quote: the aim of establishing an animal database for rare and endangered species
    that are often illegally hunted and smuggled
- claim: The same page says genetic information for 58 species had so far been newly
    entered into the international database.
  url: https://mongolia.hss.de/en/news/detail/representative-of-the-national-forensic-authority-at-hss-mongolia-news10394/
  fetched: 2026-11-13
  quote: So far, the genetic information of 58 species has been newly entered into
    the international database.
- claim: A 2023 workshop trained experts of the Genetic and Ecological Laboratory
    of the National Forensic Institute in building DNA databases for animals and plants
    with barcoding.
  url: https://mongolia.hss.de/en/news/detail/workshop-zur-dna-barcoding-fuer-forensiker-der-nationalen-forensischen-agentur-nfa-news9955/
  fetched: 2026-11-13
  quote: experts of the Genetic and Ecological Laboratory of the National Forensic
    Institute
- claim: On 27 November 2025 the National Forensic Agency of Mongolia hosted the launch
    of a publication on identifying Mongolia's major tree and shrub species and assessing
    damage from illegal logging. Its content was prepared by a team led by Dr. S.
    Dorjderem, identified as Head of the Environmental Analysis and Assessment Laboratory.
  url: https://mongolia.hss.de/en/news/bestimmung-der-in-der-mongolei-vorherrschenden-baum-und-straucharten-sowie-ihre-oekologisch-oekonomische-bewertung-news13528/
  fetched: 2026-11-13
  quote: On 27 November 2025, the National Forensic Agency of Mongolia hosted the
    official launch of the new publication
- claim: The publication gives methods for identifying the species through external
    morphology and wood anatomy, and for assessing ecological and economic damage
    from illegal logging.
  url: https://mongolia.hss.de/en/news/bestimmung-der-in-der-mongolei-vorherrschenden-baum-und-straucharten-sowie-ihre-oekologisch-oekonomische-bewertung-news13528/
  fetched: 2026-11-13
  quote: identifying Mongolia’s major tree and shrub species through external morphology
    and wood anatomy
