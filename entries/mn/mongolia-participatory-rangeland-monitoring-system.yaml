summary: Rangeland monitoring programme built by UNDP and a Mongolian land agency, which UNDP says combines
  photo-monitoring, satellite imagery, AI and herder data; the Belcheer app was piloted in two provinces,
  with nationwide scale-up next.
facts:
- claim: UNDP says the system combines national photo-monitoring data with satellite imagery, artificial
    intelligence and herder-collected information.
  url: https://www.undp.org/mongolia/press-releases/mongolia-launches-participatory-digital-rangeland-monitoring-system-unccd-cop17
  fetched: 2026-11-08
  quote: The Participatory Rangeland Monitoring System responds to this gap by combining Mongolia’s national
    photo-monitoring data with satellite imagery, artificial intelligence and information collected directly
    by herders.
- claim: UNDP says the Belcheer mobile app was piloted in Zavkhan and Sukhbaatar provinces, and that nationwide
    scale-up is the next step.
  url: https://www.undp.org/mongolia/press-releases/mongolia-launches-participatory-digital-rangeland-monitoring-system-unccd-cop17
  fetched: 2026-11-08
  quote: its Belcheer mobile application, piloted in Zavkhan and Sukhbaatar provinces
- claim: UNDP says the initiative is implemented under the Accelerating Mongolia's Inclusive Green Economy
    Transition project through PAGE, funded by the UN Multi-Partner Trust Fund.
  url: https://www.undp.org/mongolia/press-releases/mongolia-launches-participatory-digital-rangeland-monitoring-system-unccd-cop17
  fetched: 2026-11-08
  quote: through the Partnership for Action on Green Economy (PAGE) programme, funded by the UN Multi-Partner
    Trust Fund
