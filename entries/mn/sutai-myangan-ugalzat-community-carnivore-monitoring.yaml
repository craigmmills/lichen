summary: A community monitoring project in an ecological corridor, run by Wildlife Initiative,
  which Snow Leopard Conservancy reported in July 2026 involved 30 herder families and a 49-station
  camera-trap network recording snow leopards nearly 200 times.
facts:
- claim: In July 2026, Snow Leopard Conservancy reported that 30 herder families had conducted
    weekly monitoring surveys over the past year, producing 1,860 weekly monitoring forms.
  url: https://snowleopardconservancy.org/snow-leopard-conservation-in-western-mongolia/
  fetched: 2026-11-12
  quote: Their commitment resulted in the collection of 1,860 weekly monitoring forms
- claim: The camera-trap network had 49 functioning stations, more than 14,000 trap nights
    and recorded snow leopards nearly 200 times.
  url: https://snowleopardconservancy.org/snow-leopard-conservation-in-western-mongolia/
  fetched: 2026-11-12
  quote: Forty-nine functioning camera stations recorded more than 14,000 trap nights and
    generated thousands of wildlife detections.
- claim: A collaboration with the Pallas's Cat International Conservation Alliance added camera
    traps to monitor Pallas's cat.
  url: https://snowleopardconservancy.org/snow-leopard-conservation-in-western-mongolia/
  fetched: 2026-11-12
  quote: Collaboration with the Pallas’s Cat International Conservation Alliance (PICA) has
    led to the deployment of additional camera traps.
