summary: WCS Mongolia says it introduced SMART to herder community rangers in southern
  Mongolia, who use it to report observations, GPS locations and patrol distances
  while documenting wildlife and human activity.
facts:
- claim: WCS Mongolia says it has introduced SMART to herder community rangers to
    support documenting wildlife, tracking human activities and recording unusual
    ecological changes.
  url: https://mongolia.wcs.org/en-us/About-Us/News/articleType/ArticleView/articleId/24693/Herder-Rangers-Leading-Conservation-in-Southern-Mongolia.aspx
  fetched: 2026-11-15
  quote: SMART (spatial monitoring and reporting tool) has been introduced to herder
    community rangers by WCS Mongolia to support documenting wildlife, tracking human
    activities, and recording any unusual ecological changes.
- claim: The page says SMART lets the rangers report observations, GPS locations and
    patrol distances.
  url: https://mongolia.wcs.org/en-us/About-Us/News/articleType/ArticleView/articleId/24693/Herder-Rangers-Leading-Conservation-in-Southern-Mongolia.aspx
  fetched: 2026-11-15
  quote: This technology facilitates immediate reporting of observations, locations
    (using GPS), and patrol distances
- claim: The page names a herder community ranger from Nomgon soum in Umnugobi Province
    who uses SMART to log monitoring routes.
  url: https://mongolia.wcs.org/en-us/About-Us/News/articleType/ArticleView/articleId/24693/Herder-Rangers-Leading-Conservation-in-Southern-Mongolia.aspx
  fetched: 2026-11-15
  quote: a 65-year-old herder community ranger from Nomgon soum in Umnugobi Province
    in Southern Mongolia
