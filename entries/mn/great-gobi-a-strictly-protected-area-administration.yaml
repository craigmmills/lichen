summary: Protected area administration based in Bayantooroi village, whose rangers
  collect monitoring and patrol data through SMART and report to the director within
  three days of returning from expeditions, according to a 2025 study.
facts:
- claim: A 2025 study published on the International Takhi Group's site says the administration
    of Great Gobi A is in the village of Bayantooroi.
  url: https://savethewildhorse.org/wp-content/uploads/2025_management-structure-of-the-two-oldest-and-largest-protected-areas-in-the-mongolian-gobi_fay-goedbloed.pdf
  fetched: 2026-11-15
  quote: Great Gobi A is situated in the village Bayantooroi.
- claim: The study says rangers in Great Gobi A gather data through SMART and report
    to the director within three days of returning from expeditions.
  url: https://savethewildhorse.org/wp-content/uploads/2025_management-structure-of-the-two-oldest-and-largest-protected-areas-in-the-mongolian-gobi_fay-goedbloed.pdf
  fetched: 2026-11-15
  quote: Rangers gather data through the SMART program, and report to director CH.
    Bayarbat
