  snow leopards.
facts:
- claim: A Snow Leopard Trust post of February 2022 says its field partners from Gobi
    Gurvansaikhan National Park set up a pilot camera-trap survey in the park's Bayanbor
    mountains, and that 10 of the 11 cameras captured snow leopard images.
  url: https://snowleopard.org/finding-a-needle-in-a-boundless-haystack
  fetched: 2026-11-13
  quote: our field partners from the Gobi-Gurvansaikhan National Park in southern
    Mongolia ventured into a remote area of the park to set up a pilot camera trap
    survey in the Bayanbor mountains
- claim: The post says that in 2021 the park's Senior Park Specialist, Narangarav
    Tegshjargal, and her team of rangers asked the Trust to extend the survey to the
    Bayanbor mountains.
  url: https://snowleopard.org/finding-a-needle-in-a-boundless-haystack
  fetched: 2026-11-13
  quote: In 2021, Senior Park Specialist, Narangarav Tegshjargal and her team of rangers
    approached us to expand the survey efforts to include the Bayanbor mountains.
