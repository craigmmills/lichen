summary: Trust that manages the administration of Hustai National Park, employing 12 rangers with GPS
  and reporting 223 bird and 55 mammal species from continuous scientific evaluation of the park.
facts:
- claim: Its site says the Trust manages the administration of the Hustai National Park protected area.
  url: https://www.hustai.mn/structure/
  fetched: 2026-11-08
  quote: Hustai National Park Trust (HNPT) manages the administration of the Hustai National Park (HNP)
    protected area.
- claim: Its site says an academic council of 12 members meets once a year to assess research reports
    by the park biologists.
  url: https://www.hustai.mn/structure/
  fetched: 2026-11-08
  quote: This council meets once a year and discusses and assesses research reports established by the
    park biologists.
- claim: Its fauna page says a continuous scientific evaluation of the park lists 223 bird species and
    55 mammal species, among other groups.
  url: https://www.hustai.mn/fauna/
  fetched: 2026-11-08
  quote: 'A continuous scientific evaluation of the park now lists: -90 families of 400 species of insects,'
- claim: Its fauna page says monitoring has recorded 384 insect species in the park.
  url: https://www.hustai.mn/fauna/
  fetched: 2026-11-08
  quote: According to monitoring, insects of 384 species, 90 families, 10 orders have been recorded in
    the HNP.
- claim: Its site says the Trust employs 12 rangers who patrol the park daily, each with a GPS among their
    equipment.
  url: https://www.hustai.mn/introductionh/
  fetched: 2026-11-08
  quote: the Hustai National Park Trust, which manages the park, has chosen to employ 12 rangers.
- claim: Its site lists the Trust's governing institutions, including the Mongolian Association for Conservation
    of Nature and Environment, the environment ministry and the Foundation for the Preservation and Protection
    of the Przewalski Horse.
  url: https://www.hustai.mn/structure/
  fetched: 2026-11-08
  quote: The governing institutions of Hustai Trust are Mongolian Assocation for Conservation Nature and
    Environment (MACNE), Ministry of Nature, Environment and Tourism (MNET), The Foundation for the Preservation
    and Protection of the Przewalski Horse (FRPH)
