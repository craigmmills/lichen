  quote: The planning process was completed between 2009 – 2017 through a collaboration between the Mongolian
    government, The Nature Conservancy, and a large community of stakeholders
- claim: Marxan was used to identify areas that, with national protected areas, meet representation goals
    for biodiversity elements.
  url: https://marxansolutions.org/community/mongolia/
  fetched: 2026-11-08
  quote: Using MARXAN, we identified a set of areas that, in combination with national protected areas,
    meets representation goals for biodiversity elements
- claim: The case study says 68,800 square kilometres of new protected areas were designated on the basis
    of the portfolio after the framework was completed in 2013.
  url: https://marxansolutions.org/community/mongolia/
  fetched: 2026-11-08
  quote: After completion of the Gobi Desert regional planning framework in 2013, 68,800 sq.km. of new
    protected areas were designated based on the portfolio and 160 exploration leases have been retired.
