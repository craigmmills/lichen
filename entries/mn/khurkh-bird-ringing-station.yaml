summary: Volunteer-based bird ringing station in Khentii province, run by the Wildlife Science and Conservation
  Center of Mongolia, which says it is the only one regularly operating in the country.
facts:
- claim: Aims to carry out a long-term bird migration monitoring study in the eastern Khentii Mountains.
  url: https://www.wscc.org.mn/p/34
  fetched: 2026-11-08
  quote: The aim of the KBRS is to carry out a long-term bird migration monitoring study in eastern part
    of the Khentii Mountain range in Mongolia.
- claim: Located in the Khurkh River Valley, 20 km north-east of Khurkh Village in Khentii province.
  url: https://www.wscc.org.mn/p/34
  fetched: 2026-11-08
  quote: The Khurkh Bird Ringing Station (KBRS) is located in the Khurkh River Valley in southeastern
    part of Khentii Mountain range, 20 km north-east of the Khurkh Village, Khentii province
- claim: The page says it is the only bird ringing station regularly operating in Mongolia.
  url: https://www.wscc.org.mn/p/34
  fetched: 2026-11-08
  quote: today it is the only bird ringing station regularly operating in Mongolia.
- claim: All its operations are volunteer based.
  url: https://www.wscc.org.mn/p/34
  fetched: 2026-11-08
  quote: All operations at KKBRS are volunteer based.
- claim: Received a donation of 15 million tugrik from Taigiin Bulag LLC to build a log house at the station.
  url: https://www.wscc.org.mn/p/34
  fetched: 2026-11-08
  quote: We were very excited to receive a donation of 15 mln Mongolian tugrik from the Taigiin Bulag
    LLC to build a log house at the station.
