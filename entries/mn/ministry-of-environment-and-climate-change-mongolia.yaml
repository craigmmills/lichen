facts:
- claim: The ministry's own site gives its name as the Ministry of Environment and Climate Change.
  url: https://mecc.gov.mn/
  fetched: 2026-11-08
  quote: Байгаль орчин, уур амьсгалын өөрчлөлтийн яам | MECC
- claim: The CBD lists the ministry's Director General for Natural Resources Policy and Sustainable Management
    as Mongolia's primary national focal point for the Convention on Biological Diversity.
  url: https://www.cbd.int/countries/nfp?country=mn
  fetched: 2026-11-08
  quote: CBD Primary NFP
- claim: The CBD lists Ayuush Namkhai, Director of the ministry's Department for Special Protected Area,
    as Mongolia's protected areas focal point.
  url: https://www.cbd.int/countries/nfp?country=mn
  fetched: 2026-11-08
  quote: Department for Special Protected Area
- claim: The ministry's site lists databases including a protected-area database, a forest database and
    an animal database.
  url: https://mecc.gov.mn/
  fetched: 2026-11-08
  quote: Тусгай хамгаалалттай газар нутгийн мэдээллийн сан
- claim: Wikipedia says the ministry is responsible for environmental and tourism affairs and manages
    special protected areas, including national parks.
  url: https://en.wikipedia.org/wiki/Ministry_of_Environment_and_Climate_Change_%28Mongolia%29
  fetched: 2026-11-08
  quote: Ministry is responsible for environmental and tourism related affairs and, it manages special
    protected areas , including national parks .
- claim: Wikipedia says it directs the Forest Department, 34 protected area administrations and 21 river
    basin administrations.
  url: https://en.wikipedia.org/wiki/Ministry_of_Environment_and_Climate_Change_%28Mongolia%29
  fetched: 2026-11-08
  quote: Water Management Agency , Forest Department , 34 Protected Area Administration of special protected
    areas , 21 Administration of river basins
- claim: Wikipedia gives its headquarters in Khan Uul district, Ulaanbaatar.
  url: https://en.wikipedia.org/wiki/Ministry_of_Environment_and_Climate_Change_%28Mongolia%29
  fetched: 2026-11-08
  quote: Headquarters Artsat 624, 23th Khoroo , Khan Uul , Ulaanbaatar , Mongolia
- claim: Wikipedia lists a Department of Special Protected Area Policy and Regulation in the ministry.
  url: https://en.wikipedia.org/wiki/Ministry_of_Environment_and_Climate_Change_%28Mongolia%29
  fetched: 2026-11-08
  quote: Department of Special Protected Area Policy and Regulation
- claim: In 2024 TNC said the Government of Mongolia, TNC and others had launched Eternal Mongolia, a
    Project Finance for Permanence initiative for the country's protected areas.
  url: https://www.nature.org/en-us/newsroom/eternal-mongolia-pfp-announcement/
  fetched: 2026-11-08
  quote: Today, the Government of Mongolia, The Nature Conservancy (TNC) and others, announced the launch
    of Eternal Mongolia—a Project Finance for Permanence (PFP) initiative
