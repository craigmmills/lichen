summary: Mongolia's use of SMART patrol monitoring, which its report to the CMS Central
  Asian Mammals Initiative says over 120 state protected areas were integrating as
  of 2023, under a national working group and a directive.
facts:
- claim: Mongolia's report to the CMS Central Asian Mammals Initiative says that as
    of 2023 over 120 state protected areas are integrating SMART.
  url: https://cami.cms.int/sites/default/files/document/unep_cms_cami3_inf.7_national-reporting-mongolia_e.pdf
  fetched: 2026-11-12
  quote: As of 2023, Mongolia has widely adopted SMART across its protected area network.
    Over 120 State Protected Areas are now integrating SMART to
- claim: The report says a national SMART working group has been established under
    the Ministry of Environment and Climate Change.
  url: https://cami.cms.int/sites/default/files/document/unep_cms_cami3_inf.7_national-reporting-mongolia_e.pdf
  fetched: 2026-11-12
  quote: A national SMART working group has been established under the Ministry of
    Environment and Climate Change.
- claim: The report says the Protected Areas Department has issued a directive requiring
    all protected areas to adopt SMART.
  url: https://cami.cms.int/sites/default/files/document/unep_cms_cami3_inf.7_national-reporting-mongolia_e.pdf
  fetched: 2026-11-12
  quote: Protected Areas Department has issued a directive requiring all protected
    areas to adopt SMART
