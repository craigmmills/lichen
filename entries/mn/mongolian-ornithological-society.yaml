summary: Wikipedia describes a Ulaanbaatar non-profit founded in 1999 for bird research
  and conservation, contributing database information, with waterfowl census, black
  stork tracking and wind farm survey projects.
facts:
- claim: Wikipedia describes it as a non-profit organisation founded in 1999 in Ulaanbaatar,
    dedicated to research and conservation of birds in Mongolia.
  url: https://en.wikipedia.org/wiki/Mongolian_Ornithological_Society
  fetched: 2026-11-12
  quote: It is non-profit environmental organisation dedicated to the research and
    conservation of birds and their habitats, and also other wildlife in Mongolia
    .
- claim: Wikipedia says the society collects information on Mongolian birds for the
    Mongolian National Bird Database.
  url: https://en.wikipedia.org/wiki/Mongolian_Ornithological_Society
  fetched: 2026-11-12
  quote: The society collects information on Mongolian birds, which helps create Mongolian
    National Bird Database.
- claim: Wikipedia lists among its projects a wintering waterfowl census on the Tuul
    river in 2004 to 2005, funded by Khustai National Park.
  url: https://en.wikipedia.org/wiki/Mongolian_Ornithological_Society
  fetched: 2026-11-12
  quote: 2004–2005. Wintering waterfowl census in the Tuul river and valley (funded
    by Khustai National Park, Mongolia).
- claim: Wikipedia lists satellite tracking of black storks in 2004 to 2006 among
    its projects.
  url: https://en.wikipedia.org/wiki/Mongolian_Ornithological_Society
  fetched: 2026-11-12
  quote: 2004–2006. Satellite tracking of Black stork Ciconia nigra in Mongolia
- claim: Wikipedia lists a complete ornithological survey at the Salkhit Wind Farm
    in 2014 to 2016.
  url: https://en.wikipedia.org/wiki/Mongolian_Ornithological_Society
  fetched: 2026-11-12
  quote: 2014–2016. Complete Ornithological Survey at the Salkhit Wind Farm, Mongolia.
