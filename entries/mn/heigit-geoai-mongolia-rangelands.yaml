facts:
- claim: HeiGIT says it combined Earth observation, a custom-built deep learning model and spatial planning
    to map rangeland condition around Töv province and Ulaanbaatar.
  url: https://heigit.org/?p=43880
  fetched: 2026-11-08
  quote: We combined Earth observation, an innovative custom-built deep-learning model, and spatial planning
    to map the condition of the rangelands around Töv province and Ulaanbaatar.
- claim: The land cover map separates dry steppe, real steppe, barren land and sand, using a custom deep
    learning model fed with radar and multispectral imagery and Google AlphaEarth embeddings.
  url: https://heigit.org/?p=43880
  fetched: 2026-11-08
  quote: We combine radar and multispectral satellite imagery with Google AlphaEarth embeddings
