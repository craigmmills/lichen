summary: App for identifying Mongolia's species with expert help; an opinion piece
  of March 2024 reported over 12,000 observations from more than 2,700 citizens.
facts:
- claim: The App Store page says users can identify Mongolia's species with the help
    of Mongolian experts, and that names, descriptions, biology, distribution maps
    and photographs of each species are in the app.
  url: https://apps.apple.com/app/id1573196232
  fetched: 2026-11-13
  quote: You can identify all biodiversity species of Mongolia with the help of Mongolian
    leading experts.
- claim: It says users' observations will be used by Mongolian scientists and by the
    Future of Mongolian Biodiversity Foundation for conserving wildlife.
  url: https://apps.apple.com/app/id1573196232
  fetched: 2026-11-13
  quote: Your observations will be used by Mongolian scientists for understanding
    Mongolian biodiversity even more
- claim: The developer and seller is Revolution Development Asia LLC; version 3.0.31
    is dated 07/08/2025.
  url: https://apps.apple.com/app/id1573196232
  fetched: 2026-11-13
  quote: Version 3.0.31 07/08/2025
- claim: An ikon.mn opinion piece dated 5 March 2024 says more than 12,000 observations
    had been made and more than 2,700 citizens had used the app to get information
    and enter observations of animals and plants.
  url: https://ikon.mn/opinion/339x
  fetched: 2026-11-13
  quote: Одоогоор нийт 12,000 гаруй ажиглалт хийгдээд байгаа бөгөөд 2,700 гаруй иргэн
    уг апп-г ашиглан
