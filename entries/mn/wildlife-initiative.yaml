    occupancy with camera traps in western Mongolia.
  url: https://www.wildlifeinitiative.org
  fetched: 2026-11-12
  quote: A research project aimed to estimate the snow leopard density and occupancy
    by method of camera trap in western Mongolia
- claim: Its site says it leads the project on the status and conservation of Pallas's
    cat in the central Mongolian steppe, with the Mongolian Academy of Sciences and
    Southern Illinois University.
  url: https://www.wildlifeinitiative.org
  fetched: 2026-11-12
  quote: Leading the conservation and research project “Status and Conservation of
    Pallas’s Cat in the Central Mongolian Steppe” in Tov, Mongolia
- claim: Snow Leopard Conservancy calls it an NGO that has partnered with it since
    2022 on the Sutai Massif to Myangan Ugalzat corridor project.
