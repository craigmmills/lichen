    in 2020–2021 and 2022–2023.
  url: https://neaspec.org/sites/default/files/2026-07/2.2%20Snow%20leopard%20population%20in%20Mongolia%20%281%29.pdf
  fetched: 2026-11-08
  quote: 2020-2021 LOA No. 2020 - 0011
- claim: The 2024 slides list setting up camera traps in the Eastern Sayan and Tsagaan Shuvuut
    ranges in September 2022, by a partner institution.
  url: https://neaspec.org/sites/default/files/2024-11/Session%202.1%20%28big%20cats%29%203.%20Snow%20Leopard_MNG%26RUS_Munkhtsog%26Aleksander.pdf
  fetched: 2026-11-08
  quote: 1.6 Set up camera traps in Tsagaan shuvuut mountain range Partner Institution September
    2022
- claim: The slides list managing and coordinating collection of camera-trap data from Irbis
    Mongolian Center as a planned Russian-side activity for November 2020.
  url: https://neaspec.org/sites/default/files/2024-11/Session%202.1%20%28big%20cats%29%203.%20Snow%20Leopard_MNG%26RUS_Munkhtsog%26Aleksander.pdf
