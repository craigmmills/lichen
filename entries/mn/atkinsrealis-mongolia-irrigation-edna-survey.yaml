facts:
- claim: NatureMetrics calls it the first environmental DNA survey in Mongolia, run to inform a multilateral
    development bank's irrigation investment.
  url: https://naturemetrics.com/case-study/atkinsrealis-mongolia
  fetched: 2026-11-08
  quote: environmental DNA survey in Mongolia, run to inform a multilateral development bank's irrigation
    investment
- claim: Samples were filtered at each scheme's offtake point and at 1 km intervals up and downstream,
    and processed in NatureMetrics' UK lab by fish metabarcoding.
  url: https://naturemetrics.com/case-study/atkinsrealis-mongolia
  fetched: 2026-11-08
  quote: Samples were shipped to NatureMetrics' UK lab and processed using fish metabarcoding.
- claim: The survey identified 19 taxa, including Arctic grayling, the endemic Mongolian grayling and
    lenok, and four species that electric fishing had not recorded.
  url: https://naturemetrics.com/case-study/atkinsrealis-mongolia
  fetched: 2026-11-08
  quote: Just as tellingly, eDNA picked up 4 species the electric fishing surveys hadn't recorded at all.
