summary: Agency under the environment ministry, formerly the Forest Research and Development Centre, which
  FAO says led the national forest inventory and is helping move its database to Arena.
facts:
- claim: FAO says the National Forest Agency, formerly the Forest Research and Development Centre, sits
    under the Ministry of Environment and Climate Change and led the national forest inventory.
  url: https://www.fao.org/in-action/boosting-transparency-forest-data/news-and-events/news/detail/strengthening-forest-monitoring--mongolia-publishes-national-forest-inventory/en
  fetched: 2026-11-08
  quote: Led by the the National Forest Agency (former Forest Research and Development Centre) under the
    Ministry of Environment and Climate Change
- claim: FAO says the agency and the ministry are working to move the national forest inventory database
    from Microsoft Access to Open Foris Arena, with FAO support under the CBIT-Forest project.
  url: https://www.fao.org/in-action/boosting-transparency-forest-data/news-and-events/news/detail/mongolia-advances-forest-data-management-through-open-foris-arena/en
  fetched: 2026-11-08
  quote: The initiative also focuses on transitioning the existing national NFI database from Microsoft
    Access to Arena to integrate upcoming inventory cycles.
- claim: The ministry's site lists the Forest Agency as a government implementing agency.
