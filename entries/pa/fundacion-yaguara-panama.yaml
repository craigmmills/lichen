facts:
- claim: Mongabay reports that the foundation uses GPS collars and camera traps and has surveyed about
    141,000 hectares across Chagres and Darién national parks.
  url: https://news.mongabay.com/2025/08/fences-tech-and-trust-help-save-jaguars-in-panamas-darien
  fetched: 2026-11-08
  quote: So far, Yaguará Panamá has surveyed roughly 141,000 hectares (nearly 350,000 acres) across Chagres
    National Park and Darién National Park in eastern Panama.
- claim: Mongabay reports that Emberá community members from Pijibasal help the foundation monitor the
    forest for jaguars and maintain its camera traps, in a partnership running since 2014.
  url: https://news.mongabay.com/2025/08/fences-tech-and-trust-help-save-jaguars-in-panamas-darien
  fetched: 2026-11-08
  quote: who help Fundacion Yaguara Panama monitor the forest for jaguars and maintain the camera traps
- claim: TVN reports that the GEF project in which the first national jaguar census was carried out was
