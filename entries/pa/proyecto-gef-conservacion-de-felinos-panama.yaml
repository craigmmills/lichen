summary: A ministry and UNEP-led, GEF-funded project producing Panama's first camera-trap jaguar census,
  TVN reports, worth $1.78 million according to the ministry as reported by Mongabay.
facts:
- claim: TVN reports that the first national jaguar census was carried out under this project.
  url: https://www.tvn-2.com/nacionales/fundacion-yaguara-panama-conservacion-de-especies-jaguar-animales-en-peligro-de-extincion-conservacion-ecosistemas-panamenos_1_2167170.html
  fetched: 2026-11-08
  quote: se realizó el primer censo nacional del jaguar
- claim: TVN reports that camera traps were placed at 32 stations per sampling site for the census, and
    that a camera trap training workshop was held at SENACYT.
  url: https://www.tvn-2.com/nacionales/miambiente-prepara-censo-nacional-jaguar_1_2066018.html
  fetched: 2026-11-08
  quote: Para este censo se han colocado dos cámaras trampa divididas en 32 estaciones
- claim: Mongabay reports the environment ministry as saying the project is worth $1.78 million and funds
    GPS collars, solar electric fences and Panama's first centre for jaguar conservation and research.
  url: https://news.mongabay.com/2025/08/fences-tech-and-trust-help-save-jaguars-in-panamas-darien
  fetched: 2026-11-08
  quote: as part of a $1.78 million ministerial project funded by the Global Environment Facility
