summary: A marine mammal research non-profit founded in 2009, reporting humpback whale surveys in the
  Gulf of Chiriquí since 2002 and describing the ONDAS underwater acoustic network.
facts:
- claim: Says it has surveyed marine mammals in the Gulf of Chiriquí since 2002 to monitor two humpback
    whale populations.
  url: https://panacetacea.org/research/
  fetched: 2026-11-08
  quote: Since 2002 Panacetacea has been conducting surveys for marine mammals in the Chiriqui Gulf. Our
    main objective is to monitor two different humpback whale populations
- claim: Its surveys take identification photos, record song and collect biopsy samples.
  url: https://panacetacea.org/research/
  fetched: 2026-11-08
  quote: We document habitat use, behaviors, take identification photos, record song, and collect biopsy
    samples
- claim: Says it has studied a resident bottlenose dolphin population in Bocas del Toro since 2004, including
    its genetics.
  url: https://panacetacea.org/research/
  fetched: 2026-11-08
  quote: Since 2004 we have been working in Bocas del Toro studying the ecology, behavior, and genetics
    of a resident population of bottlenose dolphins.
- claim: Its research page describes the ONDAS initiative, a remote underwater acoustic network recording
    the soundscape of marine communities.
  url: https://panacetacea.org/research/
  fetched: 2026-11-08
  quote: The ONDAS initiative is a remote underwater acoustic surveillance network that records the soundscape
    of several marine communities.
- claim: Founded in 2009 as a US 501(c)(3) non-profit, with a Panamanian branch, Fundación Panacetacea
    Panamá, created in 2017.
  url: https://panacetacea.org/about-us/
  fetched: 2026-11-08
  quote: In 2017, Panacetacea incorporated new members and created a complementary branch in Panama called
    Fundación Panacetacea Panamá.
- claim: Its policy is to make its data available through journals, government reports, media and meetings.
  url: https://panacetacea.org/about-us/
  fetched: 2026-11-08
  quote: To make our data available to the public through peer-reviewed journals, government reports,
    media, meetings, and symposia
