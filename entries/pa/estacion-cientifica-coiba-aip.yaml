summary: A public interest association operating inside Coiba National Park since January 2018, built
  by SENACYT, with marine monitoring begun in 2019 and an oceanographic buoy transmitting data online.
facts:
- claim: Its executive director wrote in La Estrella that the station began a monitoring programme in
    2019 covering oceanography and marine biodiversity, including zooplankton, corals, molluscs, fish,
    calcareous algae and mangroves.
  url: https://www.laestrella.com.pa/vida-y-cultura/boya-oceanografica-clave-para-el-estudio-y-conservacion-de-la-diversidad-marina-DF9474126
  fetched: 2026-11-08
  quote: en 2019 se inició un programa de monitoreo que incluía aspectos oceanográficos, ambientales y
    de monitoreo de la biodiversidad marina
- claim: Installed an oceanographic buoy in Coiba National Park whose data are sent to an internet server
    and can be accessed from anywhere.
  url: https://www.laestrella.com.pa/vida-y-cultura/boya-oceanografica-clave-para-el-estudio-y-conservacion-de-la-diversidad-marina-DF9474126
  fetched: 2026-11-08
  quote: la información se envía a un servidor por internet, que hace posible su acceso desde cualquier
    parte del mundo
- claim: Began operating on 8 January 2018.
  url: https://www.laestrella.com.pa/vida-y-cultura/boya-oceanografica-clave-para-el-estudio-y-conservacion-de-la-diversidad-marina-DF9474126
  fetched: 2026-11-08
  quote: Coiba AIP comenzó sus operaciones el 8 de enero de 2018
- claim: Says it researches, monitors and opens up the data of the Eastern Tropical Pacific, inside the
    Coiba archipelago.
  url: https://coiba.org.pa
  fetched: 2026-11-08
  quote: We research, monitor and open up the data of the Eastern Tropical Pacific.
- claim: Says it has coordinated research in the archipelago since 2016, with Panamanian universities
    and international centres.
  url: https://coiba.org.pa
  fetched: 2026-11-08
  quote: Since 2016, Coiba AIP has coordinated the research done in the archipelago
- claim: Lists oceanographic and environmental monitoring under its research.
  url: https://coiba.org.pa
  fetched: 2026-11-08
  quote: Oceanographic and environmental monitoring
- claim: Its map of the park marks a site for biodiversity monitoring, at the Bahía Damas coral reef.
  url: https://coiba.org.pa
  fetched: 2026-11-08
  quote: Monitoreo de biodiversidad
- claim: Its home page has a digital catalogue of recorded flora and fauna.
  url: https://coiba.org.pa
