facts:
- claim: A Panamanian non-profit NGO that censuses primate populations in Panama's
    reserves and fragmented forests.
  url: https://www.fcprimatespanama.org/
  fetched: 2026-11-12
  quote: Es una organización no gubernamental Panameña, sin fines de lucro. Censamos
    poblaciones de Primates en las diferentes reservas y bosques fragmentados de Panamá.
- claim: Keeps up monitoring year after year in each censused area.
  url: https://www.fcprimatespanama.org/
  fetched: 2026-11-12
  quote: Mantenemos un monitoreo año tras año para cada área censada para obtener
    información científica respecto a su ecología y estado.
- claim: Devised the Orion Camera System, a method for placing automatic digital cameras
    in tree canopies more than 12 m up without climbing.
  url: https://www.fcprimatespanama.org/
  fetched: 2026-11-12
  quote: Con esto FCPP inventa el primer método para colocar cámaras digitales y automáticas
    en la copa de los árboles sin la necesidad de escalar, a más de 12 metros de altura.
- claim: A 2014 Rufford project page reported that FCPP was using the Orion Camera
    System to monitor canopy fauna in its Darién black spider monkey study at Chucantí
    Nature Reserve.
  url: https://www.rufford.org/projects/pedro-guillermo-mendez-carvajal/study-and-conservation-of-ateles-fusciceps-rufiventris-at-chucanti-nature-reserve-darien-panama/
  fetched: 2026-11-12
  quote: We are using the Orion Camera System (OCS) to monitor arboreal fauna at canopy
