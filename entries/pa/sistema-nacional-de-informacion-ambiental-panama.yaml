summary: Panama's national environmental information system, created under Law 41
  of 1998 and run by the Ministerio de Ambiente, whose open data page lists a 2021
  forest cover and land use map at 1:25,000.
facts:
- claim: The SINIA was created by article 45 of Law 41 of 1998, the General Environment
    Law, with the aim of compiling, systematising and distributing the state's environmental
    information.
  url: https://sinia.gob.pa/que-es-el-sinia/
  fetched: 2026-11-15
  quote: se crea el Sistema Nacional de Información Ambiental (SINIA)
- claim: Its open data and geoservices page lists the 2021 forest cover and land use
    map at 1:25,000.
  url: https://sinia.gob.pa/datos-abiertos-y-geoservicios/
  fetched: 2026-11-15
  quote: Cobertura Boscosa y Uso del Suelo, año 2021 (1:25 000)
- claim: The same page lists the 2012 forest and non-forest map at 1:50,000.
  url: https://sinia.gob.pa/datos-abiertos-y-geoservicios/
  fetched: 2026-11-15
  quote: Cobertura de Bosque, No Bosque año 2012 (1:50 000)
- claim: The site's footer gives copyright in 2026 to the Ministerio de Ambiente.
  url: https://sinia.gob.pa/que-es-el-sinia/
  fetched: 2026-11-15
  quote: Copyright © 2026 Ministerio de Ambiente
- claim: The environment ministry's 2018 organisation and functions manual, published
    in the Gaceta Oficial, gives one of its units the function of leading the SINIA
    platform.
  url: https://www.gacetaoficial.gob.pa/pdfTemp/28536_A/GacetaNo_28536a_20180530.pdf
  fetched: 2026-11-15
  quote: Liderar la plataforma del Sistema Nacional de Información Ambiental (SINIA),
