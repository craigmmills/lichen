summary: Sea turtle conservation project at Playa La Barqueta, Chiriquí, run by CRECOBIAN
  and led by Juan Blas, which a June 2025 university page says ran for over ten years, protecting
  nests and releasing hatchlings.
facts:
- claim: A June 2025 university page says ACOTMAR is a research line of the Centro de Reproducción
    y Conservación Biodiversidad Animal (CRECOBIAN), directed by biologist Juan Blas.
  url: https://unachi.ac.pa/noticia/2076/capacitacion-sobre-conservacion-de-tortugas-marinas-en-la-universidad-autonoma-de-chiriqui
  fetched: 2026-11-15
  quote: Juan Blas, director del proyecto ACOTMAR, que es una linea de investigación del Centro
    de Reproducción y Conservación Biodiversidad Animal (CRECOBIAN)
- claim: A June 2025 university page says the project had been running for more than ten years
    at Playa La Barqueta, in Alanje district, Chiriquí.
  url: https://unachi.ac.pa/noticia/2076/capacitacion-sobre-conservacion-de-tortugas-marinas-en-la-universidad-autonoma-de-chiriqui
  fetched: 2026-11-15
  quote: desarrolla desde hace más de 10 años en Playa La Barqueta, en el distrito de Alanje
    en la provincia de Chiriquí
- claim: Its activities include scientific research on nesting and the protection and incubation
    of nests in nurseries before release.
  url: https://unachi.ac.pa/noticia/2076/capacitacion-sobre-conservacion-de-tortugas-marinas-en-la-universidad-autonoma-de-chiriqui
  fetched: 2026-11-15
  quote: investigación científica sobre anidación, educación ambiental para comunidades cercanas,
    limpieza de playas y protección e incubación de nidos en viveros para su posterior liberación
    al mar
- claim: The June 2025 page reports about 949 nests protected and about 73,000 hatchlings
    released during the alliance with the Roja family since 2019.
  url: https://unachi.ac.pa/noticia/2076/capacitacion-sobre-conservacion-de-tortugas-marinas-en-la-universidad-autonoma-de-chiriqui
  fetched: 2026-11-15
  quote: En este tiempo han protegido cerca de 949 nidos y liberado aproximadamente 73 mil
    neonatos al mar.
