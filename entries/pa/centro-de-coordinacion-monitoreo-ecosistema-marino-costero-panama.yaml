summary: A marine and coastal monitoring centre led by Panama's environment ministry,
  opened on 11 September 2025 with Bezos Earth Fund funding, and reported by the ministry
  as the first interinstitutional one in its Pacific corridor region.
facts:
- claim: MiAmbiente says Panama opened the centre on 11 September 2025, the first
    interinstitutional one in the Eastern Tropical Pacific Marine Corridor region.
  url: https://miambiente.gob.pa/panama-inauguro-el-primer-centro-de-monitoreo-interinstitucional/?print=print
  fetched: 2026-11-13
  quote: Panamá puso en marcha desde hoy el Centro de Coordinación para el Monitoreo,
    Preservación y Protección del Ecosistema Marino y Costero
- claim: The centre combines operational and analytical capacity for monitoring marine
    and coastal ecosystems; the September 2025 announcement said it would link marine
    protected areas with security, fisheries and maritime bodies.
  url: https://miambiente.gob.pa/panama-inauguro-el-primer-centro-de-monitoreo-interinstitucional/?print=print
  fetched: 2026-11-13
  quote: El Centro de Coordinación integra capacidades operativas y de análisis para
    el monitoreo del ecosistema marino–costero
- claim: It was made possible by a Bezos Earth Fund donation, with equipment acquired
    through WildAid and coordination by Fundación PACÍFICO.
  url: https://miambiente.gob.pa/panama-inauguro-el-primer-centro-de-monitoreo-interinstitucional/?print=print
  fetched: 2026-11-13
  quote: el Centro fue posible gracias a una donación del Bezos Earth Fund
