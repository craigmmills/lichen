summary: An agreement with Panama's environment ministry covering three UNESCO national parks and Naso
  Comarca, according to Global Conservation, with planned satellite communications, camera surveillance,
  marine radar and EarthRanger systems.
countries:
- pa
facts:
- claim: Global Conservation says the agreement covers Panama's three UNESCO World Heritage national parks
    and the Naso Comarca.
  url: https://globalconservation.org/news/global-conservation-and-the-government-of-panama-sign-historic-agreement-for-enhanced-national-park-and-indigenous-territory-protection
  fetched: 2026-11-08
  quote: The Environmental Technical Cooperation agreement focuses on Panama's three UNESCO World Heritage
    national parks—Darién Biosphere Reserve, La Amistad Biosphere Reserve, and Coiba National Marine Park—as
    well as the largest Indigenous Territory in Panama—Naso Comarca
- claim: The planned work includes satellite communications, trail camera surveillance, marine radar and
    EarthRanger systems.
  url: https://globalconservation.org/news/global-conservation-and-the-government-of-panama-sign-historic-agreement-for-enhanced-national-park-and-indigenous-territory-protection
  fetched: 2026-11-08
  quote: Deploying advanced technologies for satellite communications, trailcam surveillance, forestry
    permitting and enforcement, marine radar, and EarthRanger systems.
- claim: In an August 2025 news summary, Global Conservation said Darién park rangers would receive a
    week of training including use of the EarthRanger platform.
  url: https://globalconservation.org/news/global-conservation-and-the-government-of-panama-sign-historic-agreement-for-enhanced-national-park-and-indigenous-territory-protection
  fetched: 2026-11-08
  quote: For one week, park rangers will receive training in active patrolling, inter-institutional coordination,
    and use of the Earth Ranger platform.
