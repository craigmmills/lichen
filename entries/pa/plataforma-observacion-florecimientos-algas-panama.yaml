summary: A closed project, run by GITTS-UTP and led by Fernando Arias with SENACYT funding,
  that developed a drone hyperspectral and AI platform for identifying algal blooms on Panama's
  coasts from December 2021 to December 2024.
facts:
- claim: The project developed a platform to identify and monitor algal blooms on Panama's
    coasts using a hyperspectral camera on a drone, a ground prototype and artificial intelligence.
  url: https://gitts.utp.ac.pa/proyectos/plataforma-de-observacion-de-florecimientos-de-algas-en-regiones-costeras-utilizando-imagenes-hiperespectrales-e-inteligencia-artificial/
  fetched: 2026-11-13
  quote: Este proyecto desarrolló una plataforma para identificar y monitorear florecimientos
    de algas en las costas de Panamá, utilizando una cámara hiperespectral a bordo de un vehículo
    aéreo no tripulado, un prototipo terrestre e inteligencia artificial.
- claim: Sampling at Vacamonte, Punta Galeta, Pedasí and Panama Bay was used to characterise
    blooms spectrally and train identification models, alongside satellite chlorophyll monitoring
    through Copernicus-LAC and Sentinel.
  url: https://gitts.utp.ac.pa/proyectos/plataforma-de-observacion-de-florecimientos-de-algas-en-regiones-costeras-utilizando-imagenes-hiperespectrales-e-inteligencia-artificial/
  fetched: 2026-11-13
  quote: complementados con monitoreo satelital de clorofila mediante Copernicus-LAC y Sentinel.
- claim: Ran from December 2021 to December 2024 and is marked finished.
