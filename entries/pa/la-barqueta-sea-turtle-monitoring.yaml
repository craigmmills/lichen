status: active
summary: A sea turtle project run by Panama's environment ministry at Playa La Barqueta
  Agrícola refuge, where August 2025 night patrols measured nesting females and georeferenced
  nests for later relocation to the nursery.
facts:
- claim: In August 2025, MiAmbiente reported that its Chiriquí protected areas and
    biodiversity section was conducting night patrols at the refuge during the nesting
    season.
  url: https://miambiente.gob.pa/ministerio-de-ambiente-refuerza-monitoreo-y-proteccion-de-tortugas-marinas-en-playa-la-barqueta/
  fetched: 2026-11-13
  quote: a través de la Sección de Áreas Protegidas y Biodiversidad de la regional
    de Chiriquí, intensifica sus acciones de conservación en el Refugio de Vida Silvestre
    Playa La Barqueta Agrícola
- claim: The August 2025 report said the patrols would allow collection of scientific
    data for the conservation project and highlighted measurements of nesting females’
    shell length and width.
  url: https://miambiente.gob.pa/ministerio-de-ambiente-refuerza-monitoreo-y-proteccion-de-tortugas-marinas-en-playa-la-barqueta/
  fetched: 2026-11-13
  quote: Estas acciones permitirán la recolección de datos científicos clave para
    el proyecto de conservación, además destaca la medición del ancho y largo del
    caparazón de las tortugas madres
- claim: In August 2025, MiAmbiente reported that nests were being georeferenced to
    allow later relocation to the refuge’s nursery.
  url: https://miambiente.gob.pa/ministerio-de-ambiente-refuerza-monitoreo-y-proteccion-de-tortugas-marinas-en-playa-la-barqueta/
  fetched: 2026-11-13
  quote: se está llevando a cabo la georreferenciación de los nidos, lo cual permite
    su posterior reubicación en el vivero del refugio.
