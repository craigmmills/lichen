summary: A Panamanian foundation that, with Sociedad Audubon de Panamá, launched the second Conserva Aves
  grant call in 2025, requiring funded projects to include bird monitoring plans.
facts:
- claim: Launched the second Conserva Aves grant call in Panama in 2025 with the Sociedad Audubon de Panamá.
  url: https://www.panamaamerica.com.pa/aldea-global/fundacion-natura-y-audubon-panama-lanzan-la-ii-convocatoria-de-conserva-aves-panama
  fetched: 2026-11-08
  quote: Fundación Natura y la Sociedad Audubon de Panamá anunciaron el lanzamiento oficial de la II Convocatoria
    de Conserva Aves – Fondo Equidad
- claim: Projects funded under the call must include management plans, bird monitoring strategies and
    financial sustainability mechanisms.
  url: https://www.panamaamerica.com.pa/aldea-global/fundacion-natura-y-audubon-panama-lanzan-la-ii-convocatoria-de-conserva-aves-panama
  fetched: 2026-11-08
  quote: Los proyectos también deben integrar el diseño de planes de manejo, estrategias de monitoreo
    de aves y mecanismos de sostenibilidad financiera.
- claim: Invited non-governmental organisations to submit proposals to the Conserva Aves fund in 2025.
  url: https://naturapanama.org/convocatoria-conserva-aves-fondo-rfp-2do-llamado/
  fetched: 2026-11-08
  quote: Se invita a Organizaciones No Gubernamentales , a presentar propuestas, según los requerimientos
    del Fondo Conserva Aves para proyectos en modalidad Proyecto No Solicitado (PnS)
- claim: The August 2025 call sought to create or consolidate protected areas, including the design of
    bird monitoring plans.
  url: https://naturapanama.org/convocatoria-conserva-aves-fondo-rfp-2do-llamado/
  fetched: 2026-11-08
  quote: incluyendo el diseño de sus planes de manejo, monitoreo de aves y sostenibilidad financiera.
- claim: Says the initiative is developed with support from the Government of Canada.
  url: https://naturapanama.org/convocatoria-conserva-aves-fondo-rfp-2do-llamado/
  fetched: 2026-11-08
  quote: La iniciativa es desarrollada con el apoyo del Gobierno de Canadá.
- claim: Gives its office address in Llanos de Curundú, Panama.
  url: https://naturapanama.org/convocatoria-conserva-aves-fondo-rfp-2do-llamado/
  fetched: 2026-11-08
  quote: Llanos de Curundu Edificio 1992 A - B, Panamá, Panamá
- claim: Conserva Aves' second Panama call required funded projects to include a bird monitoring plan
    that confirms the presence or absence of priority species each year.
  url: https://conserva-aves.org/convocatorias/abierta-segunda-convocatoria-de-conserva-aves-panama/
  fetched: 2026-11-08
  quote: 'b) Plan de monitoreo de aves: los proyectos financiados por esta convocatoria deberán incluir
    un plan de monitoreo de aves'
