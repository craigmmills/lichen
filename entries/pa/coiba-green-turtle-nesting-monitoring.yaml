summary: A green turtle nesting monitoring project run by Panama's environment ministry
  in Coiba National Park, which tags nesting females, counts nests and collects population
  data, reported in January 2026 as joint work with partners.
facts:
- claim: Telemetro reported in January 2026 that MiAmbiente was carrying out green
    turtle nesting monitoring in Coiba National Park to update information on the
    colony.
  url: https://www.telemetro.com/nacionales/miambiente-monitorea-la-anidacion-la-tortuga-verde-el-parque-nacional-coiba-n6066960
  fetched: 2026-11-13
  quote: El Ministerio de Ambiente ( MiAmbiente ) desarrolla una jornada de monitoreo
    de la anidación de la tortuga verde ( Chelonia mydas ) en el Parque Nacional Coiba
- claim: The monitoring records and tags nesting females, counts nests and collects
    biological data on the population's reproductive state.
  url: https://www.telemetro.com/nacionales/miambiente-monitorea-la-anidacion-la-tortuga-verde-el-parque-nacional-coiba-n6066960
  fetched: 2026-11-13
  quote: El monitoreo incluye el registro y marcaje de hembras anidantes, el conteo
    de nidos y la recopilación de datos biológicos
- claim: MiAmbiente says the work is a joint effort with the Fundación Coiba AIP and
    marine biology students of the Universidad Marítima Internacional de Panamá.
  url: https://www.telemetro.com/nacionales/miambiente-monitorea-la-anidacion-la-tortuga-verde-el-parque-nacional-coiba-n6066960
  fetched: 2026-11-13
  quote: Estas acciones forman parte de un esfuerzo interinstitucional junto a la
    Fundación Coiba AIP y estudiantes de biología marina de la Universidad Marítima
    Internacional de Panamá.
