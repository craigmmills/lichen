summary: Active Panamanian bird conservation society and BirdLife International partner that, La Estrella
  reports, has run migrating raptor counts since 2004, and whose home page also lists shorebird studies
  and waterbird censuses.
facts:
- claim: La Estrella reports that the society has run counts of migrating raptors since 2004, with volunteers
    and experts counting at several points in the country every day of the migration season.
  url: https://www.laestrella.com.pa/vida-y-cultura/ciencia/veinte-anos-contando-aves-rapaces-BMLE500643
  fetched: 2026-11-08
  quote: A partir de 2004, la Sociedad Audubon Panamá viene realizando los conteos de rapaces.
- claim: The National Audubon Society names it as its BirdLife International partner in Panama.
  url: https://www.audubon.org/es/conservaci%C3%B3n/americas/panam%C3%A1
  fetched: 2026-11-08
  quote: en asociación con la Sociedad Audubon de Panamá (nuestro socio de BirdLife International)
- claim: Its home page lists winter monitoring of the western sandpiper, migratory shorebird population
    studies and the Central American waterbird censuses among its work.
  url: https://www.audubonpanama.org
  fetched: 2026-11-08
  quote: Monitoreo Invernal del Playero Occidental
- claim: Its home page lists the Central American waterbird censuses.
  url: https://www.audubonpanama.org
  fetched: 2026-11-08
  quote: Censos Centroamericanos de Aves Acuáticas (CCAA)
- claim: Says it has promoted birds and nature in Panama for the last 50 years through four work programmes.
  url: https://www.audubonpanama.org
  fetched: 2026-11-08
  quote: La Sociedad Audubon de Panamá ha estado promoviendo el amor y el aprecio por las aves y la naturaleza
    en Panamá en los últimos 50 años.
- claim: Gives an address in Llanos de Curundú, Panama.
