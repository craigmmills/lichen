summary: Panama's environment ministry reports a remote sensing department and a 2025 GBIF Panama workshop,
  with park protection and marine monitoring partnerships reported by Global Conservation and Global Fishing
  Watch.
facts:
- claim: Said in August 2025 that Panama had 18 national parks, and named its director of protected areas
    and biodiversity.
  url: https://miambiente.gob.pa/panama-celebra-el-dia-internacional-de-los-parques-nacionales-con-18-areas-protegidas-con-esta-categoria-de-manejo/?print=pdf
  fetched: 2026-11-08
  quote: Tomás Fernández, director de Áreas Protegidas y Biodiversidad del Ministerio de Ambiente
- claim: Organised a workshop in August 2024 to review national biodiversity targets and align them with
    the Kunming-Montreal Global Biodiversity Framework, with technical support from UNDP and Wetlands
    International.
  url: https://miambiente.gob.pa/culmina-taller-de-revision-de-metas-nacionales-de-biodiversidad/?print=pdf
  fetched: 2026-11-08
  quote: Este avance es el seguimiento a la actividad que organiza el Ministerio de Ambiente
- claim: Says a new remote sensing department was created to implement the national forest monitoring
    system.
  url: https://miambiente.gob.pa/miambiente-implementa-sistema-nacional-de-informacion-ambiental-y-presenta-los-resultados-del-diagnostico-de-cobertura-boscosa/?print=pdf
  fetched: 2026-11-08
  quote: para la implementación de este sistema se creó el nuevo Departamento de Teledetección
- claim: Said in 2020 that it had bought camera traps and radio collars for biodiversity monitoring for
    all its regional offices, and drones for surveillance of hard-to-reach areas.
  url: https://miambiente.gob.pa/miambiente-destaca-su-inversion-en-el-cuidado-forestal-y-vida-silvestre-en-el-marco-del-dia-del-medio-ambiente/?print=pdf
  fetched: 2026-11-08
  quote: consistente en insumos de monitoreo de biodiversidad como cámaras trampa y radio collares
- claim: Ran a workshop in October 2025, with UNDP support and GEF funding, on standardising and publishing
    biodiversity data through the GBIF Panama node.
  url: https://miambiente.gob.pa/miambiente-promueve-taller-para-sistematizar-datos-sobre-la-biodiversidad/?print=pdf
  fetched: 2026-11-08
  quote: Un taller sobre Estandarización, Calidad y Publicación de Datos
- claim: Global Conservation reports a multi-year agreement with the Ministry of Environment to stop illegal
    activities in the country's largest national parks.
  url: https://globalconservation.org/news/global-conservation-and-the-government-of-panama-sign-historic-agreement-for-enhanced-national-park-and-indigenous-territory-protection
  fetched: 2026-11-08
  quote: Global Conservation (GC) has signed a multi-year agreement with the Ministry of Environment (MiaAmbiente)
    of Panama to strengthen conservation and stop illegal activities, such as logging and mining, within
    the country's largest national parks.
- claim: Global Conservation says the ministry committed to adding over 200 national park rangers under
    the agreement.
  url: https://globalconservation.org/news/global-conservation-and-the-government-of-panama-sign-historic-agreement-for-enhanced-national-park-and-indigenous-territory-protection
  fetched: 2026-11-08
  quote: the Ministry of the Environment has committed to adding over 200 new national park rangers
- claim: Global Fishing Watch says it launched a partnership with the ministry to strengthen monitoring
    of Panama's marine protected areas.
  url: https://globalfishingwatch.org/annual-report-2025/
  fetched: 2026-11-08
  quote: we launched a new partnership with the Ministry of the Environment to strengthen monitoring of
    the country's vast marine protected areas
- claim: Its home page reports a project on biodiversity in "our protected areas".
  url: https://miambiente.gob.pa/
  fetched: 2026-11-08
  quote: Proyecto BIORURAL, impactando la biodiversidad en nuestras Áreas Protegidas
- claim: Its home page carries a report dated 4 November 2026 about the ministry and environmental police
    stopping illegal mining in Sierra Llorona National Park.
  url: https://miambiente.gob.pa/
  fetched: 2026-11-08
  quote: Ministerio de Ambiente y Policía Ambiental frenan minería ilegal en el Parque Nacional Sierra
    Llorona
- claim: Its GBIF publisher record says data from its wildlife and biodiversity projects will be published
    in GBIF, through the national node that is expected to become part of SINIA.
  url: https://api.gbif.org/v1/organization/b4500b7a-7084-45dd-81ec-a565d7a501c8
  fetched: 2026-11-08
  quote: Data from Ministry of Environment projects related to wildlife species and biodiversity will
    be published in GBIF
- claim: Its GBIF publisher record says it expects to publish lists of species in the National System
    of Protected Areas; it had published no datasets when read.
  url: https://api.gbif.org/v1/organization/b4500b7a-7084-45dd-81ec-a565d7a501c8
  fetched: 2026-11-08
  quote: Lists of flora and fauna species found within the protected areas of the National System of Protected
    Areas of Panama.
- claim: Its GBIF publisher record gives an address in Albrook, Panama.
  url: https://api.gbif.org/v1/organization/b4500b7a-7084-45dd-81ec-a565d7a501c8
  fetched: 2026-11-08
  quote: Diego Dominguez Street, Building 804 Albrook, Ancon, Panama, Republic of Panama
