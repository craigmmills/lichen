summary: A closed NASA-led campaign with the Smithsonian Tropical Research Institute,
  which flew the AVIRIS-3 spectrometer over land and marine ecosystems in Panama and
  Costa Rica in February 2025 to capture hyperspectral imagery.
facts:
- claim: MiAmbiente describes AVUELO as a scientific campaign led by NASA in collaboration
    with the Smithsonian Tropical Research Institute.
  url: https://miambiente.gob.pa/miambiente-presenta-perspectiva-institucional-sobre-la-campana-avuelo-de-la-nasa-y-el-smithsonian/
  fetched: 2026-11-13
  quote: iniciativa científica liderada por la NASA en colaboración con el Smithsonian
    Tropical Research Institute (STRI).
- claim: The campaign ran in Panama and Costa Rica in February 2025, using NASA's
    AVIRIS-3 spectrometer to capture hyperspectral imagery over land and marine ecosystems.
  url: https://miambiente.gob.pa/miambiente-presenta-perspectiva-institucional-sobre-la-campana-avuelo-de-la-nasa-y-el-smithsonian/
  fetched: 2026-11-13
  quote: utilizando el espectrómetro AVIRIS-3 de la NASA para capturar imágenes hiperespectrales
    sobre ecosistemas terrestres y marinos, con el objetivo de fortalecer el monitoreo
    ambiental de nueva generación.
- claim: In May 2026 MiAmbiente's National Directorate of Environmental Information
    presented Panama's view at the AVUELO post-campaign assessment meeting.
  url: https://miambiente.gob.pa/miambiente-presenta-perspectiva-institucional-sobre-la-campana-avuelo-de-la-nasa-y-el-smithsonian/
  fetched: 2026-11-13
