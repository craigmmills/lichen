summary: Closed Darién project in which Indigenous communities used bioacoustic monitoring
  and camera trapping; Health in Harmony reports 12 people trained in 2024 to 2025,
  recording 199 bird and 73 animal species.
facts:
- claim: The communities used bioacoustic monitoring and camera trapping, the latter
    with a methodology developed by Savimbo, a biodiversity credits company.
  url: https://news.mongabay.com/2026/09/in-panamas-darien-indigenous-communities-test-a-new-way-to-fund-conservation/
  fetched: 2026-11-12
  quote: They used both bioacoustic monitoring, listening to the sounds of the forest,
    and camera-trapping, capturing its sights, the latter employing a methodology
    developed by Savimbo, a biodiversity credits company.
- claim: According to Health in Harmony, 12 people were trained between 2024 and 2025
    to install 80 audio recorders and seven cameras, which recorded 199 bird species
    and 73 animal species.
  url: https://news.mongabay.com/2026/09/in-panamas-darien-indigenous-communities-test-a-new-way-to-fund-conservation/
  fetched: 2026-11-12
  quote: According to Health in Harmony, between 2024 and 2025, 12 people were trained
    to install 80 audio recorders, which were only in place for two months, and seven
    cameras that were moved every two weeks.
- claim: After monitoring ended, the communities decided to enter the biodiversity
    credits market with Savimbo, outside the FSC Indigenous Foundation project.
  url: https://news.mongabay.com/2026/09/in-panamas-darien-indigenous-communities-test-a-new-way-to-fund-conservation/
  fetched: 2026-11-12
  quote: The communities are now among the first in Central America using this information
    to join the emerging biodiversity credits market.
