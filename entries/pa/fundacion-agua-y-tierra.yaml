summary: Reported in 2019 as a Mata Oscura turtle conservation group, with MarViva
  and LatAm Drones training members from September to locate nesting turtles using
  a thermal drone.
facts:
- claim: Panamá América reported in December 2019 that the community group Fundación
    Agua y Tierra works on sea turtle conservation at Mata Oscura beach in Mariato
    district, Veraguas.
  url: https://www.panamaamerica.com.pa/aldea-global/drones-para-monitorear-anidacion-de-tortugas-1152724
  fetched: 2026-11-13
  quote: Combatir las amenazas y garantizar la conservación de la tortuga marina es
    el compromiso adquirido por el grupo comunitario como Fundación Agua y Tierra,
    en la playa Mata Oscura
- claim: In September 2019, MarViva and LatAm Drones began training its members, using
    a drone with a thermal sensor to locate nesting turtles and support beach-monitoring
    volunteers.
  url: https://www.panamaamerica.com.pa/aldea-global/drones-para-monitorear-anidacion-de-tortugas-1152724
  fetched: 2026-11-13
  quote: LatAm Drones y la Fundación Mar Viva iniciaron el proceso de capacitación
    de los miembros de la Fundación Agua y Tierra
- claim: The December 2019 report said the drone was intended to speed up nesting-beach
    patrols and help detect predators.
  url: https://www.panamaamerica.com.pa/aldea-global/drones-para-monitorear-anidacion-de-tortugas-1152724
  fetched: 2026-11-13
  quote: Se trata de un nuevo elemento de apoyo que facilitará el trabajo de patrullaje
    en las playas de anidación
