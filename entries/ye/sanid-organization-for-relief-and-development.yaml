summary: Non-profit, non-partisan Yemeni organisation whose GlobalGiving project aims to verify Arabian
  leopard presence and population, and which reports training 21 volunteers in the third quarter of 2024
  to monitor violations.
facts:
- claim: A Sanid project document on GlobalGiving describes it as a non-governmental, non-profit and non-partisan
    organisation.
  url: https://www.globalgiving.org/pfil/39215/projdoc.pdf
  fetched: 2026-11-12
  quote: Sanid Organization for Relief and Development is a non -governmental, non -profit and non -partisan
- claim: The same document gives a registration certificate from the Ministry of Social Affairs and Labor.
  url: https://www.globalgiving.org/pfil/39215/projdoc.pdf
  fetched: 2026-11-12
  quote: registration certificate No. 1013 issued by the Ministry of Social Affairs and Labor (MoSAL).
- claim: Sanid's GlobalGiving report says it trained 21 volunteers in the three most affected areas to
    monitor and report violations against the Arabian leopard during the third quarter of 2024.
  url: https://www.globalgiving.org/projects/protecting-arab-leopard-in-endangered-yemen/reports/?pageNo=1
  fetched: 2026-11-12
  quote: 21 volunteers were trained on monitoring, tracking and surveillance skills.
- claim: The GlobalGiving project page says the project aims to verify the presence of the Arabian leopard
    and assess its population, in coordination with the Environmental Protection Authority.
  url: https://www.globalgiving.org/projects/protecting-arab-leopard-in-endangered-yemen/
  fetched: 2026-11-12
  quote: The project aims to verify the presence of the Arabian leopard, assess the population condition,
    and combat trafficking and killing during the project implementation period.
