summary: Yemen's national focal point to the CBD, named as executing agency with the Royal Society for
  the Conservation of Nature on GEF project 11408, and cited as a source of marine turtle survey work.
facts:
- claim: Yemen's sixth national report to the CBD describes the EPA as the national focal point to the
    Convention.
  url: https://www.cbd.int/doc/nr/nr-06/ye-nr-06-en.pdf
  fetched: 2026-11-12
  quote: the EPA as a national focal point to
- claim: Yemen's clearing-house site says a protected area may be established by Prime Ministerial decree
    on the recommendation of the EPA or another specialised body, and lists six formal protected areas.
  url: https://ye.chm-cbd.net/ar/node/698
  fetched: 2026-11-12
  quote: A protected Area may be established, in natural habitats, by a Prime Ministerial decree upon
    the recommendation of EPA or any specialized body
- claim: The GEF lists the Environment Protection Authority of the Ministry of Water and Environment,
    with the Royal Society for the Conservation of Nature, as executing agencies of GEF project 11408
    on conserving biodiversity in the Socotra Archipelago and managing the Aden wetlands.
  url: https://www.thegef.org/projects-operations/projects/11408
  fetched: 2026-11-12
  quote: The Environment Protection Authority of the - Ministry of Water and Environment
- claim: PERSGA names the EPA as Yemen's national focal point and held a workshop with it in Aden in July
    2025 on national action plans for sharks, marine turtles, birds and mammals.
  url: https://persga.org/news/yemen-national-workshop-on-national-action-plans-naps-for-protection-of-sharks-marine-turtles-birds-and-mammals-in-yemen-21-24-july-2025-aden-republic-of-yemen/
  fetched: 2026-11-12
  quote: PERSGA held this national workshop in coordination with Yemeni National Focal Point (Environment
    Protection Authority) for four days 21-24 July 2025) in Aden (Yemen).
- claim: Yemen's 2024 national report to the IOSEA marine turtle memorandum cites surveys and studies
    done by the EPA as a source.
  url: https://iosea-turtles.cms.int/sites/default/files/document/IOSEA_Turtles_NR_Yemen_2024_corr.pdf
  fetched: 2026-11-12
  quote: surveys and studies that have been done by Environment Protection Authority
