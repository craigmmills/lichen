    research and advice on marine, coastal and inland waters.
  url: https://geoecomar.ro
  fetched: 2026-11-08
  quote: este polul național de excelență în cercetarea geologică, geofizică și geoecologică și consiliere
    privind apele marine, de coastă și interioare
- claim: Its marine biology group analyses biological samples quantitatively and qualitatively.
  url: https://geoecomar.ro
  fetched: 2026-11-08
  quote: Colectivul de biologie marină analizează cantitativ și calitativ probele biologice
