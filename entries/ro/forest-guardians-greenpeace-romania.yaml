summary: App launched by Greenpeace România on 1 October 2018, built by Greenpeace
  România and mready, that let users compare satellite images to flag canopy changes
  in Romania's virgin forests and report illegal logging.
facts:
- claim: At its October 2018 launch, the app allowed users to monitor and flag changes
    in the canopy of Romania’s virgin forests by comparing satellite images taken
    at different times.
  url: https://www.greenpeace.org/romania/raport/1101/greenpeace-romania-lanseaza-forest-guardians-aplicatia-de-mobil-prin-care-poti-salva-padurile-de-taieri-ilegale/
  fetched: 2026-11-12
  quote: un instrument prin intermediul căruia utilizatorii pot monitoriza și semnala
    modificări apărute în coronamentul pădurilor virgine din România prin comparația
    imaginilor satelitare realizate la intervale diferite de timp.
- claim: At its October 2018 launch, the app was intended for identifying illegal
    logging and reporting it to the authorities.
  url: https://www.greenpeace.org/romania/raport/1101/greenpeace-romania-lanseaza-forest-guardians-aplicatia-de-mobil-prin-care-poti-salva-padurile-de-taieri-ilegale/
  fetched: 2026-11-12
  quote: prin identificarea tăierilor ilegale și raportarea lor către autorități.
- claim: Greenpeace România's launch release is dated 1 October 2018.
  url: https://www.greenpeace.org/romania/raport/1101/greenpeace-romania-lanseaza-forest-guardians-aplicatia-de-mobil-prin-care-poti-salva-padurile-de-taieri-ilegale/
  fetched: 2026-11-12
  quote: 01/10/2018
