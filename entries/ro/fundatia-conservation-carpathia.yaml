summary: Romanian conservation foundation whose monitoring includes acoustic recorders, wildlife cameras,
  DNA analysis and AI image processing, with partners including the British Trust for Ornithology, University
  of Freiburg and Hack the Planet.
facts:
- claim: Its July-August 2025 newsletter says it continues an acoustic forest monitoring programme developed
    with the British Trust for Ornithology, with 22 recording devices in different forest types.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FundatiaConservationCarpathia_PoveStiri_iulie-august25.pdf
  fetched: 2026-11-08
  quote: Continuăm programul de monitorizare audio a pădurilor. În cadrul acestui proiect, dezvoltat împreună
    cu British Trust for Ornithology, am instalat 22 de dispozitive
- claim: Its July-August 2025 newsletter says recordings are processed with AI to help identify insects,
    birds and mammals, including bats.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FundatiaConservationCarpathia_PoveStiri_iulie-august25.pdf
  fetched: 2026-11-08
  quote: Înregistrările sunt apoi prelucrate cu ajutorul unui program de inteligență artificială, care
    ne ajută să identificăm speciile de insecte, păsări și mamifere (inclusiv lilieci) prezente.
- claim: Its ungulate monitoring study in the Făgăraș Mountains used 127 wildlife cameras for a year and
    gathered 1,842,283 photographs.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FundatiaConservationCarpathia_PoveStiri_iulie-august25.pdf
  fetched: 2026-11-08
  quote: Timp de un an, 127 de camere de supraveghere a faunei au surprins imagini cu speciile vizate.
    În total, am obținut 1.842.283 de fotografii.
- claim: Its July-August 2025 newsletter says it was filtering images and identifying species with partners
    from German national parks and the University of Freiburg.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FundatiaConservationCarpathia_PoveStiri_iulie-august25.pdf
  fetched: 2026-11-08
  quote: Cu ajutorul partenerilor noștri de la mai multe parcuri naționale din Germania, dar și a Universității
    din Freiburg, filtrăm imaginile și identificăm speciile observate de camerele de fotografiat.
- claim: Monitors reintroduced European bison and beavers.
  url: https://carpathia.org/en/research-and-impact-monitoring/
  fetched: 2026-11-08
  quote: European bison monitoring
- claim: Records and analyses bird sounds as indicators of ecosystem health.
  url: https://carpathia.org/en/research-and-impact-monitoring/
  fetched: 2026-11-08
  quote: We record and analyse bird sounds, using them as precise biological indicators to measure the
    health and balance of the ecosystem.
- claim: Uses DNA analysis and satellite data to map bear food sources, supporting its network of smart
    cameras with artificial intelligence for real-time detection of conflicts.
  url: https://carpathia.org/en/research-and-impact-monitoring/
  fetched: 2026-11-08
  quote: Using state-of-the-art genetic analyses (DNA), satellite data and observations collected with
    the help of local communities, we map and quantify these food sources. This research directly supports
    our rapid response teams and our network of smart cameras equipped with artificial intelligence
- claim: Runs a wolf monitoring programme in the Southern Carpathians, launched in 2017, using DNA from
    field samples, with camera traps that transmit images.
  url: https://carpathia.org/en/genetic-monitoring-of-wolves-in-the-southern-carpathians-provides-new-insights-into-packs-territories-and-population-dynamics/
  fetched: 2026-11-08
  quote: The wolf monitoring programme, launched by Foundation Conservation Carpathia in 2017, is carried
    out in the Southern Carpathians across six hunting grounds
- claim: Its efforts form part of a vision of creating the Făgăraș Mountains National Park.
  url: https://carpathia.org/en/conservation/
  fetched: 2026-11-08
  quote: These efforts form part of the broader vision of creating the Făgăraș Mountains National Park.
- claim: Hack the Planet says it works with the foundation on detecting bears around mountain villages.
  url: https://www.hack-the-planet.io/partners/
  fetched: 2026-11-08
  quote: 'We collaborate specifically on human-bear conflict: detecting bears around mountain villages
    and keeping them at distance with our Smart Deterrent.'
