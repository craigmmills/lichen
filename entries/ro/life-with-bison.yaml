summary: Project with planned monitoring of bison numbers, genetics, health, ranges and habitat using
  sampling, cameras, GPS collars and satellite imagery, plus a planned national conservation strategy
  and Romanian Bison Action Plan.
facts:
- claim: Plans to monitor bison population size, structure, genetic diversity and health, using genetic
    spatial capture-recapture sampling, pellet counts, direct observation and camera-trapping.
  url: https://rewildingeurope.com/life-with-bison/monitor-and-analyse/
  fetched: 2026-11-08
  quote: Methods used include genetic spatial capture–recapture sampling, pellet count, direct observations
    and camera-trapping.
- claim: Plans to monitor bison ranges from GPS collar telemetry and camera-trapping, and habitat area
    from open-access satellite imagery.
  url: https://rewildingeurope.com/life-with-bison/monitor-and-analyse/
  fetched: 2026-11-08
  quote: This task will monitor estimated bison ranges, from telemetry (GPS collars), camera-trapping,
    field tracking and information gathered from local people.
- claim: Plans to develop a national conservation strategy for European bison and a Romanian Bison Action
    Plan with the National Environment Authority and the National Bison Working Group.
  url: https://rewildingeurope.com/life-with-bison/national-context/
  fetched: 2026-11-08
  quote: Task 2.1 Developing the National Strategy and a Romanian Bison Action Plan
