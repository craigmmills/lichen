summary: WWF Romania-led project with Sensing Clues and a Maramureș hunters' association, using cameras
  and an app to identify brown bears and send alerts, with five cameras installed and a first real alert
  by May 2026.
facts:
- claim: The system combines real-time monitoring cameras, the Cluey app and the Focus platform, where
    data are processed automatically.
  url: https://next.huskroua-cbc.eu/smart-early-warning-system-successfully-tested-to-help-prevent-human-brown-bear-conflict-coop4safes/
  fetched: 2026-11-08
  quote: The system combines real-time monitoring cameras, the digital mobile application Cluey , and
    the intelligent Focus platform, where collected data is automatically processed and analyzed.
- claim: In May 2026, the system was being tested and optimised; it could identify brown bears and send
    alerts, and had generated its first real alert.
  url: https://next.huskroua-cbc.eu/smart-early-warning-system-successfully-tested-to-help-prevent-human-brown-bear-conflict-coop4safes/
  fetched: 2026-11-08
  quote: Using artificial intelligence, the system can identify the presence of brown bears and rapidly
    send alerts to intervention teams and authorities before situations become dangerous.
- claim: Five monitoring cameras had been installed in high-risk areas at the time of the article.
  url: https://next.huskroua-cbc.eu/smart-early-warning-system-successfully-tested-to-help-prevent-human-brown-bear-conflict-coop4safes/
  fetched: 2026-11-08
  quote: So far, five monitoring cameras have been installed in high-risk areas
- claim: The programme's project listing names WWF Romania's Maramureș branch as lead, with partners in
    Ukraine and Slovakia and the Maramureș county hunters' and anglers' association.
  url: https://next.huskroua-cbc.eu/smart-early-warning-system-successfully-tested-to-help-prevent-human-brown-bear-conflict-coop4safes/
  fetched: 2026-11-08
