facts:
- claim: Its main activity is fundamental and applied research in oceanography, marine and coastal engineering,
    marine ecology and environmental protection, and management of living resources in the Black Sea.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: are ca obiect principal de activitate efectuarea de cercetări fundamentale, aplicative și de
    dezvoltare tehnologică în domeniul oceanografiei, ingineriei marine și costiere, ecologiei și protecției
    mediului marin
- claim: Has a Department of Marine Ecology and Biology.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: Departamentul de Ecologie şi Biologie Marină
- claim: Runs expeditions in the Romanian marine sector and Exclusive Economic Zone, averaging 60 to 80
    operating days a year, which collect data for research and monitoring.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: Expediții în sectorul marin românesc și în Zona Economică Exclusivă a României, cu o medie de
    60-80 de zile de operare pe an. Acestea ne permit să colectăm date esențiale pentru cercetare și monitorizare.
- claim: Says it applies its specialists' expertise in programmes ranging from integrated marine environmental
    monitoring and ecosystem conservation to marine radioactivity studies.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: de la monitoringul integrat al mediului marin și conservarea ecosistemului, la studii de radioactivitate
    marină
- claim: Lists among its European projects DINO-PATH, which proposes using telemetry and digital technologies
    to map the migration of Russian sturgeon in the Black Sea.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: utilizând instrumente inovatoare de telemetrie și tehnologii digitale pentru a cartografia migrația
    sturionilor
- claim: Gives its address as Bulevardul Mamaia 300, Constanța.
  url: http://www.rmri.ro/
  fetched: 2026-11-08
  quote: Bulevardul Mamaia nr. 300, Constanța
