summary: Programme run by Fundația Conservation Carpathia, developed with the British
  Trust for Ornithology, using 22 recorders in old-growth, managed and restored forests,
  with AI software identifying insects, birds and mammals, as reported in July 2025.
facts:
- claim: In July 2025 Carpathia said it was continuing its forest audio monitoring
    programme, developed with the British Trust for Ornithology, with 22 recording
    devices in old-growth, managed and newly restored forests.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FoundationConservationCarpathia_NewStories_July-August2025.pdf
  fetched: 2026-11-15
  quote: We are continuing our forest audio monitoring programme. As part of this
    project, developed in collaboration with the British Trust for Ornithology, we
    have installed 22 devices that ‘listen’ to and record sounds in various types
    of forests
- claim: The recordings are processed with artificial intelligence software to identify
    the insects, birds and mammals, including bats, present.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FoundationConservationCarpathia_NewStories_July-August2025.pdf
  fetched: 2026-11-15
  quote: The recordings are then processed using artificial intelligence software,
    which helps us identify the species of insects, birds, and mammals (including
    bats) present.
