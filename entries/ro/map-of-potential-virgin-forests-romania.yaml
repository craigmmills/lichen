summary: Dataset built by Greenpeace România with Eberswalde University and Al. I. Cuza University of
  Iași, launched on 15 November 2017, using satellite analysis to identify over 295,000 hectares of potential
  virgin forest.
facts:
- claim: Greenpeace România launched the map on 15 November 2017, made with Eberswalde University and
    Al. I. Cuza University of Iași.
  url: https://www.greenpeace.org/romania/comunicat-presa/1154/greenpeace-lanseaza-harta-padurilor-virgine-potentiale-din-romania/
  fetched: 2026-11-08
  quote: București, 15 noiembrie 2017 – Greenpeace România a lansat astăzi Harta pădurilor virgine potențiale,
    realizată împreună cu Universitatea Eberswalde, din Germania, și Universitatea Al. I. Cuza, din Iași.
- claim: The partners developed a satellite data analysis method, calibrated with field experience in
    identifying virgin forests.
  url: https://www.greenpeace.org/romania/comunicat-presa/1154/greenpeace-lanseaza-harta-padurilor-virgine-potentiale-din-romania/
  fetched: 2026-11-08
  quote: Împreună cu partenerii noștri și specialiști din domeniu am dezvoltat o metodologie de analiză
    a datelor satelitare pe care am adaptat-o și calibrat-o ținând cont de experiența noastră de teren
    în identificarea pădurilor virgine.
- claim: It identified over 295,000 hectares of potential virgin forest.
  url: https://www.greenpeace.org/romania/comunicat-presa/1154/greenpeace-lanseaza-harta-padurilor-virgine-potentiale-din-romania/
  fetched: 2026-11-08
  quote: La finalul procesului am identificat peste 295 000 de hectare de păduri virgine potențiale
