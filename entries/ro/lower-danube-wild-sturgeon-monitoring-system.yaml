summary: System run by INCDPM Bucharest, reported by Forbes România as finished by 31 August 2026 with
  recovery-plan funding, combining acoustic telemetry, genomic sequencing and AI analysis of environmental
  and transmitter data.
facts:
- claim: Forbes România reported that INCDPM Bucharest finished the project by 31 August 2026, funded
    through the National Recovery and Resilience Plan.
  url: https://www.forbes.ro/sistem-de-monitorizare-a-sturionilor-salbatici-de-a-lungul-dunarii-de-jos-realizat-prin-pnrr-518961
  fetched: 2026-11-08
  quote: Institutul Național de Cercetare-Dezvoltare pentru Protecția Mediului (INCDPM) București a finalizat,
    până la 31 august 2026, proiectul „Implementarea unui sistem de monitorizare a sturionilor sălbatici
    de-a lungul Dunării de Jos”, finanțat prin Planul Național de Redresare și Reziliență (PNRR).
- claim: The system integrates acoustic telemetry, genomic sequencing and artificial intelligence.
  url: https://www.forbes.ro/sistem-de-monitorizare-a-sturionilor-salbatici-de-a-lungul-dunarii-de-jos-realizat-prin-pnrr-518961
  fetched: 2026-11-08
  quote: Proiectul, finanțat prin PNRR, integrează telemetrie acustică, secvențiere genomică și inteligență
    artificială.
- claim: Its software applications use AI to analyse environmental parameters and data from the ultrasonic
    transmitters on sturgeon.
  url: https://www.forbes.ro/sistem-de-monitorizare-a-sturionilor-salbatici-de-a-lungul-dunarii-de-jos-realizat-prin-pnrr-518961
  fetched: 2026-11-08
  quote: O componentă importantă a proiectului este reprezentată de aplicațiile software dezvoltate pentru
    prelucrarea în timp real a datelor.
- claim: It includes a monitoring, alarm and genetic verification centre for wild sturgeon with a genomic
    sequencing laboratory.
  url: https://www.forbes.ro/sistem-de-monitorizare-a-sturionilor-salbatici-de-a-lungul-dunarii-de-jos-realizat-prin-pnrr-518961
  fetched: 2026-11-08
  quote: Centrul de Monitorizare, Alarmare și Verificare Genetică a Sturionilor Sălbatici (CMAVG-Sturioni),
    care include și un Laborator de Secvențiere Genomică de Nivel de Biosecuritate II.
