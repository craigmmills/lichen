id: monitorizarea-starii-de-conservare-articolul-17-smis-336936
kind: project
name: Completarea nivelului de cunoaștere a biodiversității prin implementarea sistemului
  de monitorizare a stării de conservare a speciilor și habitatelor de interes comunitar
  din România și raportarea în baza articolului 17 al Directivei Habitate
