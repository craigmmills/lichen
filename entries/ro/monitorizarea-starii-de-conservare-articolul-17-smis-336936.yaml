status: active
summary: Ministry-run project, with a financing contract signed on 30 June 2025, a
  30-month term and a 49,676,619.82 lei eligible budget, to monitor species and habitats
  of Community interest and prepare the Article 17 report.
facts:
- claim: The ministry signed the financing contract on 30 June 2025 and implements
    the project as beneficiary for 30 months in 2025 to 2027, with a total eligible
    budget of 49,676,619.82 lei.
  url: https://mmediu.ro/en/programe-de-finantare/pdd/art-17-specii-si-habitate-de-interes-comunitar-smis-336936/ministerul-mediului-apelor-si-padurilor-continua-monitorizarea-speciilor-si-habitatelor-printr-un-nou-proiect-cofinantat-din-fonduri-europene/
  fetched: 2026-11-12
  quote: Ministerul Mediului, Apelor și Pădurilor implementează proiectul în calitate
    de Beneficiar timp de 30 de luni, în perioada 2025-2027, acesta având un buget
    total eligibil de 49.676.619,82 lei.
- claim: Its general objective is monitoring the conservation status of species and
    habitats of Community interest, preparing the Article 17 national report and updating
    the national monitoring system for those species and habitats.
  url: https://mmediu.ro/en/programe-de-finantare/pdd/art-17-specii-si-habitate-de-interes-comunitar-smis-336936/ministerul-mediului-apelor-si-padurilor-continua-monitorizarea-speciilor-si-habitatelor-printr-un-nou-proiect-cofinantat-din-fonduri-europene/
  fetched: 2026-11-12
  quote: precum și actualizarea sistemului național de monitoring a speciilor și habitatelor
    de interes comunitar.
