summary: Three-year Interreg-co-financed project led by Romania’s environment ministry, reportedly planning
  the Danube basin’s first transboundary sturgeon monitoring system and tests of eDNA sampling and telemetry.
facts:
- claim: WWF Central and Eastern Europe reported that the three-year project, co-financed by the Interreg
    Danube Region Programme, will set up the first transboundary sturgeon monitoring system in the Danube
    River Basin.
  url: https://wwfcee.org/news/danube-countries-start-a-joint-sturgeon-monitoring-initiative-to-save-europes-migratory-giants
  fetched: 2026-11-08
  quote: Co-financed by the Interreg Danube Region Programme, this three-year project will establish the
    first-ever transboundary sturgeon monitoring system in the Danube River Basin
- claim: It plans to test joint techniques such as eDNA sampling and telemetry to track sturgeon population
    status.
  url: https://wwfcee.org/news/danube-countries-start-a-joint-sturgeon-monitoring-initiative-to-save-europes-migratory-giants
  fetched: 2026-11-08
  quote: Testing joint techniques like eDNA sampling and telemetry to track population status
