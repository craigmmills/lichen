facts:
- claim: It integrates Earth observation data into ecosystem monitoring, biodiversity management, protection
    and restoration.
  url: https://dteclimate.upb.ro/subprojects/specific-rdi-project-3-eo4nature-exploitation-of-satellite-earth-observation-data-for-natural-capital-accounting-and-biodiversity-management/
  fetched: 2026-11-08
  quote: The EO4NATURE project focuses on addressing environmental challenges caused by climate change,
    referring to ecosystem monitoring, biodiversity management, biosecurity, protection, and ecological
    restoration by integrating Earth observation data into monitoring and assessment processes.
- claim: It aims to recommend satellite-derived indicators for the Habitats, Birds, Water Framework and
    Invasive Species directives and Natura 2000 management plans.
  url: https://dteclimate.upb.ro/subprojects/specific-rdi-project-3-eo4nature-exploitation-of-satellite-earth-observation-data-for-natural-capital-accounting-and-biodiversity-management/
  fetched: 2026-11-08
  quote: addressing biodiversity management by recommending a set of indicators derived from satellite
    data to be used in the implementation of the Habitat directive
- claim: It uses open Copernicus Sentinel data for ecosystem assessment.
  url: https://dteclimate.upb.ro/subprojects/specific-rdi-project-3-eo4nature-exploitation-of-satellite-earth-observation-data-for-natural-capital-accounting-and-biodiversity-management/
  fetched: 2026-11-08
  quote: This study uses Copernicus Sentinel data (available in open access) to derive useful information
    for ecosystem assessment (ecosystem condition and ecosystem services).
