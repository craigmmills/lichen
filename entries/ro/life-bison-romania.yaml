summary: European Commission-funded project, run by Rewilding Europe and WWF Romania, that reintroduced
  bison to the Southern Carpathians, with actions from 2016 to 2021, a GPS-collar and camera monitoring
  protocol and a breeding centre.
facts:
- claim: Rewilding Europe and WWF Romania reintroduced bison into the Southern Carpathians through the
    European Commission-funded LIFE Bison project, whose actions ran from 2016 to 2021.
  url: https://rewildingeurope.com/landscapes/southern-carpathians/
  fetched: 2026-11-08
  quote: Rewilding Europe and WWF Romania have been reintroducing bison into the Southern Carpathians
    since 2014, and as part of the European Commission-funded LIFE Bison project since 2016.
- claim: A protocol was developed for monitoring the bison population, its impact, genetic structure and
    behaviour with GPS collars and motion detection cameras.
  url: https://rewildingeurope.com/landscapes/southern-carpathians/
  fetched: 2026-11-08
  quote: A detailed protocol has been developed for monitoring the bison population, the impact, the genetic
    structure and behaviour, using GPS collars and motion detection cameras.
- claim: Rewilding Europe and WWF Romania set up a bison breeding centre at Hunedoara Zoo in 2016 under
    the project.
  url: https://rewildingeurope.com/landscapes/southern-carpathians/
  fetched: 2026-11-08
  quote: In mid-2016, Rewilding Europe and WWF Romania established a bison breeding centre in the Hunedoara
    Zoo under the framework of the LIFE Bison project.
