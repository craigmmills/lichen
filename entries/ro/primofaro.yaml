summary: Inventory of Romania's primary and old-growth forests submitted by EuroNatur Foundation in September
  2019, identifying over 525,000 hectares and finding almost half of the 2005 inventory's virgin forests
  degraded or destroyed.
facts:
- claim: In September 2019, EuroNatur Foundation submitted PRIMOFARO, an inventory of Romania’s primary
    and old-growth forest areas.
  url: https://www.euronatur.org/en/what-we-do/news/romania-new-inventory-reveals-huge-and-threatened-natural-forest-treasure
  fetched: 2026-11-08
  quote: EuroNatur Foundation submitted a comprehensive inventory of the valuable forest stocks of Romania
- claim: The 2019 inventory identified more than 525,000 hectares of old-growth and virgin forests in
    Romania.
  url: https://www.euronatur.org/en/what-we-do/news/romania-new-inventory-reveals-huge-and-threatened-natural-forest-treasure
  fetched: 2026-11-08
  quote: Romania still host more than 525.000 hectares of old growth and virgin forests, more than any
    other EU member state (outside Scandinavia)
- claim: The 2019 analysis found that almost half of the virgin forests identified in the 2005 inventory
    were already degraded or destroyed.
  url: https://www.euronatur.org/en/what-we-do/news/romania-new-inventory-reveals-huge-and-threatened-natural-forest-treasure
  fetched: 2026-11-08
  quote: PRIMOFARO also shows that almost 50 percent of Romania’s virgin forests, which were identified
    in 2005 as part of a comprehensive inventory of virgin forests, are degraded or destroyed already.
