summary: Romanian agency which, according to the 2025 INSPIRE country fiche, provides the presidency and
  secretariat of the INIS Council and monitors implementation and use of the national spatial data infrastructure.
facts:
- claim: The 2025 INSPIRE country fiche says ANCPI provides the presidency and secretariat of the INIS
    Council, with the environment ministry as vice-president.
  url: https://inspire-mif.github.io/INSPIRE-in-your-Country/RO/Country_fiches/RO-Country_fiche-2025.html
  fetched: 2026-11-08
  quote: The Presidency and Secretariat of the INIS Council are provided by the National Agency for Cadastre
    and Land Registration (ANCPI), while the Vice-Presidency is provided by the Ministry of Environment,
    Water and Forests.
- claim: The same fiche says ANCPI monitors the implementation and use of the national spatial data infrastructure.
  url: https://inspire-mif.github.io/INSPIRE-in-your-Country/RO/Country_fiches/RO-Country_fiche-2025.html
  fetched: 2026-11-08
  quote: The National Agency for Cadastre and Land Registration (ANCPI) monitors the implementation and
    use of INIS and makes the results of this monitoring permanently accessible to the European Commission
    and the public.
