summary: With financing signed on 30 May 2025, the 48-month project has a 48,458,569.71 lei
  budget to strengthen national monitoring and reporting of bird species of Community interest.
facts:
- claim: The ministry signed the financing contract on 30 May 2025 and is to implement the
    project as beneficiary for 48 months in 2025 to 2029, with a total budget of 48,458,569.71
    lei.
  url: https://mmediu.ro/programe-de-finantare/pdd/art-12-pasari-smis-337659/comunicat-de-presa-peste-484-milioane-de-lei-pentru-natura-mmap-demareaza-un-nou-proiect-european-de-biodiversitate/
  fetched: 2026-11-12
  quote: Ministerul Mediului, Apelor și Pădurilor urmează să implementeze proiectul în calitate
    de Beneficiar timp de 48 de luni, în perioada 2025-2029, acesta având un buget total de
    48.458.569,71 lei.
- claim: Its general objective is strengthening the national system for monitoring and reporting
    bird species of Community interest, through monitoring of bird populations on the national
    reference list.
  url: https://mmediu.ro/programe-de-finantare/pdd/art-12-pasari-smis-337659/comunicat-de-presa-peste-484-milioane-de-lei-pentru-natura-mmap-demareaza-un-nou-proiect-european-de-biodiversitate/
