summary: Bird observatory described as Romania's first permanently active migration
  study station, studying Black Sea migration and climatic influences, staffed by
  seven to ten volunteer ringers helped by over 50 volunteers yearly.
facts:
- claim: Described as the first migration study station with permanent activity in
    Romania.
  url: https://statiunea-agigea.uaic.ro/statia-pentru-studiul-migratiei/
  fetched: 2026-11-12
  quote: Observatorul Ornitologic Agigea este prima stație de studiu a migrației cu
    activitate permanentă din România.
- claim: Its research activities include the study of bird migration on the Black
    Sea and of climatic influences on migration.
  url: https://statiunea-agigea.uaic.ro/statia-pentru-studiul-migratiei/
  fetched: 2026-11-12
  quote: a. Studiul migrației păsărilor la Marea Neagră
- claim: Between seven and ten experienced ringers work at the observatory as volunteers,
    helped by more than 50 volunteers a year.
  url: https://statiunea-agigea.uaic.ro/statia-pentru-studiul-migratiei/
  fetched: 2026-11-12
  quote: În cadrul Observatorului Ornitologic Agigea activează voluntar între 7 și
    10 inelatori cu experiență din România și din străinătate.
