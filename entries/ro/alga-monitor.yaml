id: alga-monitor
kind: project
name: Monitorizarea înfloririlor algale agravate de poluare eutrofică și încălzirea
  climei în ecosisteme din Delta Dunării
also_known_as:
- ALGA-MONITOR
- PN-IV-PCB-RO-MD-2024-0152
scope: ro
ai_label: conservation-tech
