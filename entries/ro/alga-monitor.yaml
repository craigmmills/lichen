status: closed
summary: A closed project, run by the Politehnica University of Timișoara from September
  2025 to August 2026, to monitor severe algal blooms in the lower Danube basin using
  remote stations and Copernicus satellite data.
facts:
- claim: Its general objective is a unified system for monitoring aquatic ecosystems,
    gathering data to map severe algal blooms and predict their hazards in the lower
    Danube basin.
  url: https://www.ct.upt.ro/centre/cchpm/alga_files/DATE%20GENERALE%20-%20Scop,%20Obiective,%20Rezultate%20asteptate.pdf
  fetched: 2026-11-15
  quote: Dezvoltarea unui sistem unificat de monitorizare inovatoare a ecosistemelor
    acvatice, achiziționarea de date esențiale pentru cartografierea infloririlor
    algale severe
- claim: Its activity plan describes a monitoring system combining fixed and mobile
    automatic remote stations with spectral reflectance measurements from Copernicus
    satellites.
  url: https://www.ct.upt.ro/centre/cchpm/alga_files/DATE%20GENERALE%20-%20Scop,%20Obiective,%20Rezultate%20asteptate.pdf
  fetched: 2026-11-15
  quote: o combinație de stații automate la distanță (atât fixe cât și mobile) și
    măsurători de reflectanță spectrală din spațiu folosind sateliti Copernicus
- claim: Its page shows an algal bloom map of the Danube Delta Biosphere Reserve for
    20 October 2025 made from Sentinel-2 MSI imagery.
  url: https://www.ct.upt.ro/centre/cchpm/alga_files/DATE%20GENERALE%20-%20Scop,%20Obiective,%20Rezultate%20asteptate.pdf
  fetched: 2026-11-15
  quote: Maparea a fost făcută de instrumentul MSI (Multispectral Imager) instalat
    pe sateliții Sentinel-2 ai ESA (European Space Agency).
- claim: Funded under contract 17PCBROMD of 2025.
  url: https://www.ct.upt.ro/centre/cchpm/alga_files/DATE%20GENERALE%20-%20Scop,%20Obiective,%20Rezultate%20asteptate.pdf
  fetched: 2026-11-15
  quote: Contract de finanţare nr. 17PCBROMD
- claim: Its implementation period was 1 September 2025 to 31 August 2026, with UEFISCDI
    as contracting authority.
  url: https://www.ct.upt.ro/centre/cchpm/algae_monitor.htm
