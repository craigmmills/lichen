summary: Forest monitoring system built by the environment ministry with recovery-plan funding of over
  272 million lei, which WWF Romania reports combines satellite monitoring, AI video monitoring of timber
  transport and LiDAR scanning.
facts:
- claim: WWF Romania reports the ministry announced the system's completion, funded through the PNRR at
    over 272 million lei, combining satellite monitoring of forest vegetation, AI video monitoring of
    timber transport, and aerial and ground LiDAR scanning.
  url: https://wwf.ro/paduri/noul-sistem-de-monitorizare-a-padurilor-finalizat/
  fetched: 2026-11-08
  quote: 'Investiția, de peste 272 de milioane de lei, combină trei tehnologii: monitorizarea prin satelit
    a vegetației forestiere, monitorizarea video cu inteligență artificială a transporturilor de lemn
    și scanarea aeriană și terestră a pădurilor cu tehnologie LiDAR.'
- claim: WWF Romania reported in September 2026 that the satellite component monitors about 70,000 km²
    of forest vegetation; Sentinel-2 images were to be compared automatically to generate alerts on vegetation
    change.
  url: https://wwf.ro/paduri/noul-sistem-de-monitorizare-a-padurilor-finalizat/
  fetched: 2026-11-08
  quote: Prima componentă a noului sistem monitorizează prin satelit aproximativ 70.000 km² de vegetație
    forestieră. Imaginile Sentinel-2 vor fi comparate automat
- claim: WWF Romania reports 700 number-plate recognition cameras and 350 advanced analysis cameras at
    350 monitoring points.
  url: https://wwf.ro/paduri/noul-sistem-de-monitorizare-a-padurilor-finalizat/
  fetched: 2026-11-08
  quote: Au fost instalate 700 de camere pentru recunoașterea numerelor de înmatriculare și 350 de camere
    pentru analiză avansată, în 350 de puncte de monitorizare.
