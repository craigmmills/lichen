summary: National surveillance system recording invasive alien species occurrences
  across Romania, required under Article 14 of Regulation (EU) No 1143/2014, where
  users add observations with images and location.
facts:
- claim: The surveillance system collects and records data on the occurrence of invasive
    alien species across the whole of Romania, to prevent their spread.
  url: https://specii-invazive.ro/
  fetched: 2026-11-13
  quote: Sistemul de supraveghere colectează și înregistrează date privind apariția
    în mediu a speciilor alogene invazive pe tot teritoriul României, în scopul prevenirii
    răspândirii lor.
- claim: Setting up the surveillance system is an obligation under Article 14 of Regulation
    (EU) No 1143/2014.
  url: https://specii-invazive.ro/
  fetched: 2026-11-13
  quote: Realizarea sistemului de supraveghere pentru detectarea speciilor alogene
    invazive din România este o obligație stabilită prin articolul 14 al Regulamentului
    (UE) nr. 1143/2014
- claim: Users record observations by adding images and location.
  url: https://specii-invazive.ro/
  fetched: 2026-11-13
  quote: imagini și localizare
- claim: The site carries the statement that the environment ministry implements,
    as beneficiary, the project on adequate management of invasive species in Romania,
    code SMIS 120008 (2018-2022).
  url: https://specii-invazive.ro/
  fetched: 2026-11-13
  quote: Ministerul Mediului, Apelor și Pădurilor implementează, în calitate de Beneficiar,
    proiectul Managementul adecvat al speciilor invazive din România
