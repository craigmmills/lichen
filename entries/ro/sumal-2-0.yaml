summary: Forest timber tracking system which, the ministry said in May 2026, had over
  92,000 users and about 20,000 transport permits issued daily, with satellite, camera
  and LiDAR monitoring systems to be integrated.
facts:
- claim: In May 2026 the environment ministry said more than 92,000 users used SUMAL
    2.0 and about 20,000 timber transport permits were issued daily.
  url: https://mmediu.ro/en/comunicare/comunicate-de-presa/diana-buzoianu-pregatim-legislatia-pentru-sumal-3-0-am-pus-in-transparenta-hotararea-de-guvern-care-va-sta-la-baza-noii-aplicatii/
  fetched: 2026-11-12
  quote: În prezent, peste 92.000 de utilizatori folosesc sistemul SUMAL 2.0, iar
    zilnic sunt emise aproximativ 20.000 de avize pentru transportul materialelor
    lemnoase.
- claim: The ministry says forest monitoring systems using satellite images, video
    cameras and LiDAR sensors, developed with Recovery and Resilience Facility funds,
    will be integrated into SUMAL 2.0 and later SUMAL 3.0.
  url: https://mmediu.ro/en/comunicare/comunicate-de-presa/diana-buzoianu-pregatim-legislatia-pentru-sumal-3-0-am-pus-in-transparenta-hotararea-de-guvern-care-va-sta-la-baza-noii-aplicatii/
  fetched: 2026-11-12
  quote: Sistemele de monitorizare a pădurilor prin imagini satelitare, camere video
    și senzori LiDAR, dezvoltate prin fonduri PNRR, vor fi integrate în SUMAL 2.0,
    iar ulterior în SUMAL 3.0
- claim: In February 2021 the ministry said suspect timber transports could be checked
    through 112, whose operators would check permits and legality in SUMAL 2.0, and
    authorised control bodies would act through SUMAL Control.
  url: https://mmediu.ro/comunicare/comunicate-de-presa/noua-aplicatie-inspectorul-padurii-va-fi-disponibila-pana-pe-10-februarie/
  fetched: 2026-11-12
  quote: Operatorii vor verifica existența avizului și legalitatea transportului în
    baza de date a SUMAL 2.0.
- claim: In February 2021 the ministry said a new public Inspectorul Pădurii app version
    was being tested to query SUMAL 2.0 and was due for release by 10 February 2021.
  url: https://mmediu.ro/comunicare/comunicate-de-presa/noua-aplicatie-inspectorul-padurii-va-fi-disponibila-pana-pe-10-februarie/
  fetched: 2026-11-12
  quote: Aplicația Inspectorul Pădurii care asigură, pentru publicul larg, transparența
    în ceea ce privește trasabilitatea materialului lemnos
