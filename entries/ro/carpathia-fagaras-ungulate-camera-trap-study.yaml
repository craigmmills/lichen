summary: Active study run by Fundația Conservation Carpathia in which 127 camera traps
  photographed red deer, roe deer and wild boar for a year, producing 1,842,283 photos,
  which were being processed in July 2025.
facts:
- claim: For a year 127 camera traps photographed red deer, roe deer and wild boar
    in the Făgăraș Mountains, giving 1,842,283 photos.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FoundationConservationCarpathia_NewStories_July-August2025.pdf
  fetched: 2026-11-15
  quote: For a year, 127 camera traps captured images of these species. In total,
    we obtained 1,842,283 photos.
- claim: In July 2025 the study was at the data processing stage, with partners from
    several German national parks and the University of Freiburg filtering the images
    and identifying species.
  url: https://www.carpathia.org/wp-content/uploads/2025/07/FoundationConservationCarpathia_NewStories_July-August2025.pdf
  fetched: 2026-11-15
  quote: With the help of our partners from several national parks in Germany, as
    well as the University of Freiburg, we are filtering the images and identifying
    the species observed by the cameras.
