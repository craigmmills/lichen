summary: Case study, reported in November 2024, of AI models trained on six years of camera-trap data
  to classify European mammals, used in an alert system at three locations, with Fundația Conservation
  Carpathia as partner.
facts:
- claim: A November 2024 case study reports that six years of camera-trap data were used to train and
    test AI models to detect and classify European mammals, integrated into an alert system deployed at
    three locations.
  url: https://climateandnature.impactmap.cam.ac.uk/real-time-wildlife-monitoring/
  fetched: 2026-11-08
  quote: Six years of camera trap data are used to train and test AI models to detect and classify European
    mammals. These models are integrated into an alert system and deployed in three locations.
- claim: The page describes it as the first known study to use remote processing of 4G camera-trap images
    for a human-wildlife conflict alert system.
  url: https://climateandnature.impactmap.cam.ac.uk/real-time-wildlife-monitoring/
  fetched: 2026-11-08
  quote: This is the first known study to use remote processing of 4G-enabled camera trap images to operate
    a human-wildlife conflict alert system.
- claim: The case study names Srinivasan Keshav and the Department of Computer Science and Technology.
