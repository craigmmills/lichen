id: planul-national-de-actiune-urs-brun-smis-319056
kind: project
name: Implementarea Planului național de acțiune pentru conservarea populației de
  urs brun din România
also_known_as:
- SMIS 2014+ 136899
- SMIS 2021+ 319056
scope: ro
ai_label: conservation-tech
realms:
- land
techniques:
- edna-genomics
countries:
- ro
status: closed
summary: Closed ministry-led brown bear action plan project that bought genetic analysis
  equipment and 150 cameras for electric fences; in December 2025 the ministry reported
  about 24,000 samples gave a conservative estimate of 10,657 to 12,787 bears.
facts:
- claim: Its general objective was the long-term maintenance of the current conservation
    status of the brown bear population and its habitat.
  url: https://mmediu.ro/programe-de-finantare/pdd/smis-2021319056-urs/comunicat-de-presa-etapizarea-proiectului-implementarea-planului-national-de-actiune-pentru-conservarea-populatiei-de-urs-brun-din-romania-cod-smis-2014-136899-cod-smis-2021-31/
  fetched: 2026-11-12
  quote: Obiectivul general al proiectului este menținerea pe termen lung a actualei
    stări de conservare a populației de urs brun și a habitatului său.
- claim: In its first stage it bought laboratory infrastructure and software for genetic
    analysis and began a campaign of genetic sampling to determine the minimum national
    brown bear population.
  url: https://mmediu.ro/programe-de-finantare/pdd/smis-2021319056-urs/comunicat-de-presa-etapizarea-proiectului-implementarea-planului-national-de-actiune-pentru-conservarea-populatiei-de-urs-brun-din-romania-cod-smis-2014-136899-cod-smis-2021-31/
  fetched: 2026-11-12
  quote: a fost achiziționată infrastructura de laborator și soluțiile software pentru
    analize genetice; a fost demarată campania de prelevare a probelor genetice
- claim: It bought 150 photo and video cameras and installed them around electric
    fences to monitor how well the fences protect property and crops.
  url: https://mmediu.ro/programe-de-finantare/pdd/smis-2021319056-urs/comunicat-de-presa-etapizarea-proiectului-implementarea-planului-national-de-actiune-pentru-conservarea-populatiei-de-urs-brun-din-romania-cod-smis-2014-136899-cod-smis-2021-31/
  fetched: 2026-11-12
  quote: au fost achiziționate 150 de camere foto-video și au fost instalate în arealul
    gardurilor electrice, în vederea monitorizării eficienței metodei de protecție
- claim: In December 2025 the ministry reported that genetic analysis of about 24,000
    samples collected nationally put the population, in a conservative scenario, at
    10,657 to 12,787 bears.
  url: https://mmediu.ro/en/comunicare/comunicate-de-presa/diana-buzoianu-romania-are-in-premiera-date-stiintifice-complete-pentru-un-management-responsabil-al-populatiei-de-urs-brun/
  fetched: 2026-11-12
  quote: Analizele genetice efectuate pe aproximativ 24.000 de probe colectate la
    nivel național indică faptul că populația de urs brun din România se situează,
    într-un scenariu conservator, între 10.657 și 12.787 de indivizi.
