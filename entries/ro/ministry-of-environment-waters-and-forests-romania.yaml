summary: Romanian ministry working on the 2030 biodiversity strategy update, offering a biodiversity geoportal
  and protected area data, and reported in 2026 to have received a recovery-plan-funded digital forest
  monitoring system.
facts:
- claim: The ministry's Biodiversity Directorate notified the ministry of its work on the National Strategy
    and Action Plan for Biodiversity Conservation 2030.
  url: https://mmediu.ro/storage/2026/04/proiect-Deciza-etapei-de-incadrare.pdf
  fetched: 2026-11-08
  quote: Ca urmare a notificării transmise de Direcția Biodiversitate din cadrul Ministerului Mediului
    Apelor și Pădurilor, cu nr. DB/138938/20.03.2026, cu privire la elaborarea Strategiei Naționale și
    a Planul de Acțiune pentru Conservarea Biodiversității 2030
- claim: The ministry's screening decision says the strategy update is motivated by the adoption of the
    Kunming-Montreal Global Biodiversity Framework under the Convention on Biological Diversity.
  url: https://mmediu.ro/storage/2026/04/proiect-Deciza-etapei-de-incadrare.pdf
  fetched: 2026-11-08
  quote: Această actualizare este motivată de adoptarea Cadrului Global pentru Biodiversitate Kunming
    - Montreal (GBF) sub egida Convenției privind Diversitatea Biologică (CBD)
- claim: A ministry press release of 1 November 2018 gives its address and website.
  url: https://www.mmediu.ro/app/webroot/uploads/files/2018-11-01_COMUNICAT%20structuri%20teritoriale%20ANANP.pdf
  fetched: 2026-11-08
  quote: Bd. Libertăţii, nr.12, Sector 5, Bucureşti
- claim: Forbes România reported on 1 September 2026 that Romania had finished a recovery-plan (PNRR)
    project for digital forest monitoring, which the minister announced as finished at the ministry.
  url: https://www.forbes.ro/romania-isi-monitorizeaza-padurile-din-satelit-518721
  fetched: 2026-11-08
  quote: Am finalizat la Ministerul Mediului proiectul din PNRR privind monitorizarea pădurilor!
- claim: Its site covers biodiversity, biosafety, protected natural areas and Natura 2000.
  url: https://mmediu.ro/
  fetched: 2026-11-08
  quote: Biodiversitate Biosecuritate Arii naturale protejate Natura 2000
- claim: Its site offers a biodiversity INSPIRE geoportal and spatial data on protected areas and the
    National Forest Inventory.
  url: https://mmediu.ro/
  fetched: 2026-11-08
  quote: Geoportal INSPIRE Biodiversitate
- claim: WWF Romania reports that the ministry received and launched a new forest monitoring system in
    2026, funded by the national recovery plan (PNRR).
  url: https://wwf.ro/paduri/noul-sistem-de-monitorizare-a-padurilor-finalizat/
  fetched: 2026-11-08
  quote: Ministerul Mediului a recepționat și lansat noul sistem de monitorizare a pădurilor.
