summary: Public online application for reporting forest cutting in Romania, made within
  a volunteer afforestation initiative; it received more than 1,400 reports nationally
  in its first year.
facts:
- claim: A public online application for reporting forest cutting in Romania, either
    from Google Maps imagery or from the site itself.
  url: https://www.plantamfaptebune.ro/htp/
  fetched: 2026-11-15
  quote: Harta tăierilor de păduri este aplicaţia online publică din România în care
    se pot raporta tăierile de păduri, fie utilizând imaginile disponibile pe Google
    Maps, fie prin transmiterea informaţiei chiar de la locul faptei.
- claim: Made within Plantăm fapte bune în România, a national volunteer afforestation
    initiative.
  url: https://www.plantamfaptebune.ro/htp/
  fetched: 2026-11-15
  quote: Harta tăierilor de păduri este o aplicaţie online realizată în cadrul " Plantăm
    fapte bune în România ", iniţiativă naţională de împădurire pe bază de voluntariat.
- claim: In its first year it received more than 1,400 reports nationally, Argeș,
    Suceava and Covasna having the most.
  url: https://www.plantamfaptebune.ro/htp/
  fetched: 2026-11-15
  quote: numărul sesizărilor a depășit 1.400 la nivel național
- claim: Asociația EcoAssist is named as the map's legal representative and the initiator
    of Plantăm fapte bune în România.
  url: https://www.plantamfaptebune.ro/htp/
  fetched: 2026-11-15
  quote: Asociaţia EcoAssist, reprezentantul legal al Harţii tăierilor de păduri și
    inițiatorul proiectului Plantăm fapte bune în România
