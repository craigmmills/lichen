summary: Romanian agency responsible for managing protected natural areas and conserving habitats, flora
  and fauna, which a July 2024 draft ordinance proposed merging into a new agency, ANMAP; whether that
  happened is unstated.
facts:
- claim: The University of Bucharest's actor listing describes the agency's remit as the management of
    protected natural areas and the conservation of habitats, flora and fauna, and gives its website.
  url: https://responserepository.unibuc.ro/actors/list/
  fetched: 2026-11-08
  quote: The unitary and efficient management of protected natural areas and the conservation of natural
    habitats, flora and fauna, mainly regulated by the provisions of the Government Emergency Ordinance
    no. 57/2007
- claim: The same listing gives its address in Bucharest.
  url: https://responserepository.unibuc.ro/actors/list/
  fetched: 2026-11-08
  quote: Piața Valter Mărăcineanu nr. 1-3, sector 1, Bucuresti
- claim: A ministry press release of November 2018 says the government approved 41 county structures of
    the agency, which would administer protected natural areas.
  url: https://www.mmediu.ro/app/webroot/uploads/files/2018-11-01_COMUNICAT%20structuri%20teritoriale%20ANANP.pdf
  fetched: 2026-11-08
  quote: Cele 41 de structuri se vor organi za la nivel de servicii fără personalitate juridică și vor
    avea rol de administrare a ariilor naturale protejate.
