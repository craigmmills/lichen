summary: Forestry research institute running the National Forest Inventory, which annually surveys about
  6,000 permanent and 1,250 temporary sample plots across Romania, a quarter of the total.
facts:
- claim: Its IFN service works from field data collection to digital photogrammetry, laboratory analysis
    and statistical processing.
  url: https://icas.ro/areas-of-activity/technological-development/the-national-forest-inventory-ifn/what-is-ifn/?lang=en
  fetched: 2026-11-08
  quote: The activity of the IFN service established within the “Marin Drăcea” INCDS is particularly complex,
    from the collection of field data (about trees, groves, dead wood, forest soils, etc.) to digital
    photogrammetry, laboratory analyzes and the statistical processing
- claim: Its mission is research, development and experimentation for the sustainable development of the
    forest sector.
  url: https://icas.ro/despre-noi/
  fetched: 2026-11-08
  quote: Misiunea INCDS ”Marin Drăcea” este de a asigura pe baze ştiinţifice creşterea capacităţii, calităţii
    şi competitivităţii cercetării – dezvoltării şi experimentării pentru dezvoltarea durabilă a sectorului
    forestier.
- claim: Carries out the National Forest Inventory, surveying forest vegetation across Romania each year
    through about 6,000 permanent and 1,250 temporary sample plots, a quarter of the total plots.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/departament/
  fetched: 2026-11-08
  quote: IFN este realizat de INCDS ,,Marin Drăcea”. În fiecare an este acoperită întreaga suprafaţă a
    terenurilor cu vegetaţie forestieră
- claim: The National Forest Inventory service set up within the institute works from field data collection
    on trees, stands, dead wood and forest soils to digital photogrammetry, laboratory analysis and statistical
    processing.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: Activitatea serviciul IFN constituit în cadrul INCDS ,,Marin Drăcea” este deosebit de complexă,
    de la culegerea datelor de teren (despre arbori, arborete, lemn mort, soluri forestiere etc.) la fotogrammetrie
    digitală
- claim: States its mission as improving the capacity, quality and competitiveness of research, development
    and experimentation for sustainable development of the forestry sector.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
