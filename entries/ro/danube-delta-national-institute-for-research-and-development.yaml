summary: Tulcea research institute founded in 1970 for ecology and environmental research
  supporting Danube Delta management, whose past Nucleus programmes included species
  monitoring and sturgeon migration work, and which has a geomatics and GIS department.
facts:
- claim: Founded in 1970, its main activity is fundamental and applied research in
    ecology and environmental protection to support management of the Danube Delta
    Biosphere Reserve and other wetlands.
  url: https://ddni.ro/wps/ro/institution_ro/
  fetched: 2026-11-12
  quote: înfiinţat în anul 1970, are ca obiect principal de activitate efectuarea
    de cercetări fundamentale şi aplicative în domeniul ecologiei şi protecţiei mediului
- claim: Its 2009–2011 Nucleus programme included a project monitoring species of
    Community interest in the Danube Delta Biosphere Reserve and Natura 2000 sites.
  url: https://ddni.ro/wps/nucleus-programme/
  fetched: 2026-11-12
  quote: Monitoring the species of Community interest in the Danube Delta Biosphere
    Reserve and Natura 2000 sites (project leader – Dr. Mihai Marinov)
- claim: Its 2006–2008 Nucleus programme included research on early-life-stage sturgeon
    migration to support the International Station for monitoring migratory fish species
    at Isaccea.
  url: https://ddni.ro/wps/nucleus-programme/
  fetched: 2026-11-12
  quote: Research concerning the migration of the early life stage sturgeons in the
    Danube River for a better operation of the International Station for monitoring
    the migratory fish species in Isaccea Romania
- claim: Its staff page describes a head of the Geomatics and Information Systems
    department whose expertise is databases, GIS and remote sensing.
  url: https://ddni.ro/wps/nucleus-programme/
  fetched: 2026-11-12
  quote: 'head of Geomatics and Information Systems department at Danube Delta National
    Institute. Main expertise in: databases, GIS and remote sensing, web application
    applied in environment.'
- claim: Its public information page names Government Decision 253/2015 establishing
    national research and development institutes in environmental protection, ecology
    and sustainable development.
  url: https://ddni.ro/wps/public_info_en/
  fetched: 2026-11-12
  quote: HG nr.253/2015 privind înfiinţarea unor institute naţionale de cercetare-dezvoltare
    în domeniul protecţiei mediului, ecologiei şi dezvoltării durabile
- claim: Gives its address as 165 Babadag street, Tulcea.
