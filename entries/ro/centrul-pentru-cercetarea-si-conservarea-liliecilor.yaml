facts:
- claim: A non-profit association founded in 2017 by Romanian bat researchers and
    nature conservation enthusiasts, for the research and conservation of Romania's
    bats and their habitats and roosts.
  url: https://lilieci.ro/despre/cccl/
  fetched: 2026-11-15
  quote: Centrul pentru Cercetarea și Conservarea Liliecilor (CCCL) este o asociație
    non-profit, fondată în 2017 de către mai mulți chiropterologi și pasionați de
    protecția naturii din România.
- claim: Based in Cluj-Napoca, Cluj county.
  url: https://lilieci.ro/chiropterologie/organizatii-din-romania/
  fetched: 2026-11-15
  quote: 'Centrul pentru Cercetarea și Conservarea Liliecilor Sediu: Cluj-Napoca,
    jud. Cluj'
- claim: Says it ended winter 2025 having monitored bats in 95 underground sites in
    17 protected areas, including 9 national and natural parks, recording 27 of Romania's
    32 species.
  url: https://lilieci.ro/acasa/istoric-cccl/
  fetched: 2026-11-15
  quote: Iarna 2025 se încheie cu monitorizarea liliecilor în 95 locuri subterane
    din 17 arii protejate ale României , incluzând 9 parcuri naționale și naturale.
- claim: Runs annual winter monitoring of bats in underground roosts across Romania.
  url: https://lilieci.ro/acasa/istoric-cccl/
  fetched: 2026-11-15
  quote: Începem din nou monitorizarea anuală de iarnă a liliecilor în adăposturile
    subterane din România.
- claim: Calls the CHIROHUB online database of bats in Romania and Moldova its own
    project, with volunteers collecting bat data in new areas of Romania for it.
  url: https://lilieci.ro/en/home/cbrc-timeline/
  fetched: 2026-11-15
  quote: Our volunteers are covering new areas of Romania with bat data, contributing
    to our ChiRoHub project , the online database of bats in Romania and Moldova.
