website: https://icas.ro/areas-of-activity/technological-development/the-national-forest-inventory-ifn/about-ifn/?lang=en
summary: Continuous forest inventory run by INCDS Marin Drăcea, started in 2006, combining orthophoto
  assessment with field plots on a grid in five-year cycles, and supplying data for UNFCCC and biodiversity
  convention reporting.
facts:
- claim: The inventory was started in 2006 and covers all forest vegetation in Romania.
  url: https://icas.ro/areas-of-activity/technological-development/the-national-forest-inventory-ifn/about-ifn/?lang=en
  fetched: 2026-11-08
  quote: The national forest inventory (IFN) was initiated in 2006. It is designed to cover the entire
    forest vegetation in Romania
- claim: It is designed as a continuous inventory with five-year cycles, combining orthophoto assessment
    with field measurements on a 4 by 4 km grid, densified to 2 by 2 km in plains.
  url: https://icas.ro/areas-of-activity/technological-development/the-national-forest-inventory-ifn/about-ifn/?lang=en
  fetched: 2026-11-08
  quote: is a two-stage NFI (forest assessments and measurements on orthophoto planes and then in the
    field). IFN uniformly covers the entire territory of the country and is based on a 4×4 km network
- claim: It provides data for reporting under the UNFCCC and the Convention on Biological Diversity.
  url: https://icas.ro/areas-of-activity/technological-development/the-national-forest-inventory-ifn/what-is-ifn/?lang=en
  fetched: 2026-11-08
  quote: It also provides data essential to reporting for the United Nations Framework Convention on Climate
    Change/Kyoto Protocol ( UNFCCC/KP ) and the Convention on Biological Diversity ( CBD ).
- claim: Collects, manages and analyses information on forest resources nationally.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: El are ca sarcină principală desfășurarea la nivel național a activităților de colectare, gestionare
    şi analiză a informațiilor privind resursele forestiere
- claim: Supplies data for reporting to the UNFCCC and Kyoto Protocol and to the Convention on Biological
    Diversity.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: şi pentru Convenția privind diversitatea biologică ( CBD ).
- claim: Its work runs from field data on trees, stands, deadwood and forest soils to digital photogrammetry,
    laboratory analysis and statistics.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: de la culegerea datelor de teren (despre arbori, arborete, lemn mort, soluri forestiere etc.)
    la fotogrammetrie digitală, analize de laborator și prelucrarea statistică a unui volum imens de date.
- claim: Each year a quarter of about 6,000 permanent and 1,250 temporary sample plots is surveyed in
    the field.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/departament/
  fetched: 2026-11-08
  quote: parcurgându-se cu lucrări de teren un sfert din numărul total de suprafeţe de probă (circa 6000
    de suprafeţe de probă permanente şi 1250 de suprafeţe de probă temporare).
- claim: Supplies data for reporting under the UNFCCC and Kyoto Protocol and the Convention on Biological
    Diversity.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: El furnizează, de asemenea, date indispensabile raportărilor pentru Convenția-cadru a Națiunilor
    Unite privind schimbarea climei/Protocolul de la Kyoto ( UNFCCC/KP ) şi pentru Convenția privind diversitatea
    biologică ( CBD )
- claim: Makes a statistical inventory of all forest vegetation in the country.
  url: https://icas.ro/domenii-de-activitate/dezvoltare-tehnologica/inventarul-forestier-national-ifn/ce-este-ifn/
  fetched: 2026-11-08
  quote: În cadrul IFN se realizează inventarierea statistică a întregii vegetaţii forestiere de pe teritoriul
    ţării
