facts:
- claim: An environmental foundation, part of Rewilding Europe, founded in 2017.
  url: https://rewilding-romania.com/about-us/rewilding-romania/
  fetched: 2026-11-13
  quote: Rewilding Romania is an environmental foundation, part of Rewilding Europe
    along 9 other landscapes across the continent.
- claim: Says its monitoring programmes help evaluate wildlife populations and provide
    data.
  url: https://rewilding-romania.com/initiatives/wildlife-comeback/
  fetched: 2026-11-13
  quote: Our monitoring programmes help evaluate the population and provide the data
    needed to better understand nature’s way and how to protect it.
- claim: A monitoring programme in the Retezat Mountains started in 2024 and is ongoing,
    with about 60 camera traps deployed.
  url: https://rewilding-romania.com/initiatives/wildlife-comeback/
  fetched: 2026-11-13
  quote: Approximately 60 camera traps were deployed in the field covering a large
    area, for a better understanding of the fauna.
- claim: Created the monitoring programme methodology with Retezat National Park in
    2023.
  url: https://rewilding-romania.com/initiatives/wildlife-comeback/
  fetched: 2026-11-13
  quote: In 2023 we started a partnership with the Retezat National Park and we created
    together the methodology for the monitoring programme.
- claim: Collects DNA samples to monitor the gene pool for future translocation selections.
  url: https://rewilding-romania.com/initiatives/wildlife-comeback/
  fetched: 2026-11-13
  quote: DNA samples are being collected to monitor the gene pool
