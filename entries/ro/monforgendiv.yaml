summary: Active 2024 to 2026 Romania-Moldova project funded by UEFISCDI and run by INCDS Marin
  Drăcea, aiming to harmonise forest monitoring, with tree health data validation and genotyping
  training completed.
facts:
- claim: Funded by UEFISCDI for 2024 to 2026 under the PNCDI IV subprogramme of bilateral
    projects with the Republic of Moldova.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: 'Project Period: 2024-2026(2 ani)'
- claim: Its first objective is to harmonise forest research and monitoring methods between
    Romania and Moldova and to analyse and process data for annual forest condition reports
    to national forestry authorities and European bodies.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: analysis and processing of data for the preparation of annual forest condition reports
    to be submitted to national forestry authorities and European bodies (ICP-Forests Programme,
    Forest Europe Process – MCPFE)
- claim: Lists validated databases in ICP Forests format and databases and a digital map among
    its results.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: Databases and digital map
- claim: In 2026 it analysed and validated tree health data from the Level I forest monitoring
    network in Moldova.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: Analysis and validation of data regarding the health status of trees assessed within
    the Level I forest monitoring network in the Republic of Moldova
- claim: Trained Moldovan specialists in genomic DNA extraction and in genotyping xerophytic
    oaks for genetic diversity assessment.
  url: https://icas.ro/programs-and-projects/national-programs-and-projects/specializare-in-monitoring-forestier-diversitatea-genetica-si-sistematica-plantelor-lemnoase-si-rezilienta-stejarilor-xerofiti-la-schimbarile-climatice-monforgendiv/?lang=en
  fetched: 2026-11-15
  quote: Training on chloroplast-level evaluation of xerophytic oaks through genotyping using
    an AB sequencer.
