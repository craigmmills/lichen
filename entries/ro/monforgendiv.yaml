id: monforgendiv
kind: project
name: Specializare în monitoring forestier, diversitatea genetică și sistematica plantelor
  lemnoase și reziliența stejarilor xerofiți la schimbările climatice
also_known_as:
- MONFORGENDIV
- PN-IV-P8-8.3-ROMD-2023-0029
scope: ro
ai_label: conservation-tech
