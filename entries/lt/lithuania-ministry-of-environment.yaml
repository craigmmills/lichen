summary: Ministry whose adviser InforMEA lists as Lithuania's Convention on Biological Diversity focal
  point; in 2021 it sought a forest stand segmentation technology through a GovTech Lab challenge, with
  no chosen solution stated.
facts:
- claim: InforMEA lists an adviser at the ministry as Lithuania's primary national focal point for the
    Convention on Biological Diversity.
  url: https://www.informea.org/en/countries/lt/party-contacts-hub
  fetched: 2026-11-08
  quote: Viktorija Dapkutė Biological diversity Lithuania Advisor Ministry of Environment of the Republic
    of Lithuania Contact person Biological diversity CBD Primary NFP
- claim: InforMEA lists a senior adviser at the ministry as Lithuania's protected areas national focal
    point.
  url: https://www.informea.org/en/countries/lt/party-contacts-hub
  fetched: 2026-11-08
  quote: Senior Advisor Ministry of Environment of the Republic of Lithuania Contact person Biological
    diversity Protected Areas NFP
- claim: GovTech Lab Lithuania published a 2021 challenge in which the ministry sought a forest stand
    segmentation technology, with the deadline for entries set at 9 November 2021; the page does not say
    which solution was chosen.
  url: https://govtechlab.lt/challenge/integrated-forest-cover-monitoring-using-advanced-ai-based-algorithms-and-satellite-image-information/
  fetched: 2026-11-08
  quote: The Ministry of the Environment is looking for an advanced and efficient stand segmentation technology
    that uses different resolutions of spectral data, polarimetric data series and stand height data from
    laser scanning.
- claim: The challenge said a monitoring system using satellites and AI could track forest changes such
    as clearings daily at national scale.
  url: https://govtechlab.lt/challenge/integrated-forest-cover-monitoring-using-advanced-ai-based-algorithms-and-satellite-image-information/
  fetched: 2026-11-08
  quote: Using satellites and algorithms and artificial intelligence (AI), it would be possible to monitor
    forest changes (e.g. clearings) on a daily basis on a national scale
