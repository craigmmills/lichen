summary: Information system collecting invasive species data for Lithuania, with distribution
  maps and public submission of records; its footer carries the Ministry of Environment's
  copyright, but no page read names an operator.
facts:
- claim: Its home page says INVA collects and manages information on invasive species,
    and shows the invasive species found in Lithuania with their distribution maps.
  url: https://inva.biip.lt/
  fetched: 2026-11-15
  quote: INVA renkama ir tvarkoma informacija apie invazines rūšis.
- claim: The home page says anyone interested can submit data on species they find,
    and offers registration of invasive plant, animal and fungus species and their
    sites.
  url: https://inva.biip.lt/
  fetched: 2026-11-15
  quote: Visi susidomėję asmenys gali teikti duomenis apie aptiktas rūšis.
- claim: The home page footer carries the copyright of the Ministry of Environment
    of Lithuania; no page read says who operates the system.
  url: https://inva.biip.lt/
  fetched: 2026-11-15
  quote: © 2023-2026, Lietuvos Respublikos aplinkos ministerija
- claim: Training material on invasive species control calls it the invasive species
