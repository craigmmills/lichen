summary: Dataset built by the LIFE IP PAF-NATURALIT project with open-source GIS; in 2019 it held conservation
  objectives, management maps and large carnivore records, and BIOMON2 had no public module.
facts:
- claim: A 2019 presentation by LIFE IP Naturalit staff describes building BIOMON with open-source GIS
    technology.
  url: https://naturalit.lt/wp-content/uploads/2019/12/cartocon_2019_biomon.pdf
  fetched: 2026-11-08
  quote: BIOMON sukūrimas taikant atviro kodo GIS technologijas
- claim: In 2019 BIOMON held conservation objectives, nature management maps, reports of large carnivores,
    animal track records and information on hunted wolves.
  url: https://naturalit.lt/wp-content/uploads/2019/12/cartocon_2019_biomon.pdf
  fetched: 2026-11-08
  quote: 1. Apsaugos tikslai 2. Gamtotvarkos žemėlapiai 3. Pranešimai apie stambius plėšrūnus 4. Žvėrių
    pėdsakų registracija 5. Informacija apie sumedžiotus vilkus
- claim: The BIOMON2 monitoring data system had no public module in 2019; its data were available on request
    from the State Service for Protected Areas' biodiversity unit.
  url: https://naturalit.lt/wp-content/uploads/2019/12/cartocon_2019_biomon.pdf
  fetched: 2026-11-08
  quote: BIOMON2 monitoringo duomenų kaupimo sistema (nėra viešo modulio, duomenys kaupiami bazėje visų
    atsakingų institucijų. Duomenys prieinami paprašius VSTT biologinės įvairovės skyriaus
