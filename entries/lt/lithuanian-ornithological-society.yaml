summary: Bird research and protection society that BirdLife International says finished five years of
  Breeding Bird Atlas fieldwork; its own news reports GSM transmitters fitted to four roller chicks in
  2026.
facts:
- claim: A non-governmental organisation uniting people interested in research and protection of wild
    birds and their habitats in Lithuania.
  url: http://www.birdlife.lt/
  fetched: 2026-11-08
  quote: Lithuanian Ornithological Society (LOD) - non-governmental organization uniting people who interested
    in research and protection of wild birds and their habitats in Lithuania.
- claim: Gives its address as Naugarduko 47-3, Vilnius.
  url: http://www.birdlife.lt/
  fetched: 2026-11-08
  quote: Naugarduko 47-3, LT-03208 Vilnius,
- claim: Its saved news page reports that GSM transmitters were fitted to four European roller chicks
    in 2026 to follow their movements and migration route.
  url: http://www.birdlife.lt/
  fetched: 2026-11-08
  quote: Šiemet keturiems europinių žalvarnių (Coracias garrulus) jaunikliams buvo uždėti GSM siųstuvai,
    leidžiantys stebėti jų judėjimą ir migracijos kelią.
- claim: Lists a project to improve the status of the European roller in Lithuania among its activities.
  url: http://www.birdlife.lt/
  fetched: 2026-11-08
  quote: Europinio žalvarnio būklės gerinimas Lietuvoje projektas
- claim: Its site carries an observation reporting form asking for observations meeting LOFK criteria.
  url: http://www.birdlife.lt/
  fetched: 2026-11-08
  quote: Čia aprašykite tik tuos stebėjimus, kurie atitinka LOFK kriterijus.
