summary: Proposed Lithuanian forest fire detection system; a March 2024 announcement
  planned a market consultation ahead of procurement, with at least 151 detectors
  tentatively planned on existing towers and isolated forests up to 25 ha excluded.
facts:
- claim: In its 18 March 2024 announcement, the State Forestry Office said it and
    the Environmental Project Management Agency were organizing a market consultation
    to prepare the expected public procurement of the Unified Forest Fire Monitoring
    System.
  url: https://vmu.lt/en/?p=195872
  fetched: 2026-11-13
  quote: The Environmental Project Management Agency and the State Forestry Office
    are organizing a consultation with market participants in order to properly prepare
    for the expected public procurement of the Unified Forest Fire Monitoring System
    (VMSS).
- claim: The March 2024 announcement says the planned system would detect and record
    forest fire outbreaks, determine their coordinates and automatically inform the
    Department of Fire Protection and Rescue. Its intended coverage excluded isolated
    remote forests of up to 25 ha.
  url: https://vmu.lt/en/?p=195872
  fetched: 2026-11-13
  quote: VMGSS will detect and record outbreaks of forest fires in all Lithuanian
    forests and will be able to accurately determine their coordinates and automatically
    inform the Department of Fire Protection and Rescue.
- claim: The March 2024 announcement tentatively planned at least 151 detectors on
    existing towers.
  url: https://vmu.lt/en/?p=195872
  fetched: 2026-11-13
  quote: It is tentatively planned to place at least 151 detectors in towers belonging
    to the State Forestry Office, GSM operators or other private owners.
