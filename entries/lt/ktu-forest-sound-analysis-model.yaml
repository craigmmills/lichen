  anomalies, and integrates into its Forest 4.0 smart forest IoT.
facts:
- claim: KTU says its researchers developed a sound analysis system that identifies
    natural forest sounds and detects anomalies that may indicate ecosystem disturbances
    or human activity.
  url: https://en.ktu.edu/news/ktu-scientists-develop-advanced-forest-monitoring-systems-will-forests-monitor-themselves-in-the-future/
  fetched: 2026-11-13
  quote: Another tool developed by the researchers is a sound analysis system that
    can identify natural forest sounds and detect anomalies that may indicate ecosystem
    disturbances or human activity.
- claim: KTU says the model combines a convolutional neural network with a bidirectional
    long short-term memory model.
  url: https://en.ktu.edu/news/ktu-scientists-develop-advanced-forest-monitoring-systems-will-forests-monitor-themselves-in-the-future/
  fetched: 2026-11-13
  quote: The model, proposed by KTU RLKSC PhD student Ahmad Qurthobi, is innovative
    in combining a convolutional neural network (CNN) with a bi-directional long short-term
    memory (BiLSTM) model.
  ai_type: deep-learning
- claim: KTU says the system integrates into its Forest 4.0 smart forest IoT.
