summary: Core ecological research station of the Nature Research Centre at Lake Drūkšiai,
  whose fish communities have been monitored annually for over 60 years; it was recently
  used for FISHPAR, TRANSWAT and INVA.
facts:
- claim: The Nature Research Centre's page calls the station its core ecological research
    station in the Aukštaitija region, at Lake Drūkšiai.
  url: https://gamtostyrimai.lt/en/field-research-bases-and-stationary/
  fetched: 2026-11-15
  quote: The Drūkšiai Biological Station (Raipolės village, Zarasai district) is NRC’s
    core ecological research station in Aukštaitija region, located at Lake Drūkšiai,
    the largest lake in Lithuania.
- claim: The page says Lake Drūkšiai has been the object of regular annual monitoring
    of fish communities for more than 60 years.
  url: https://gamtostyrimai.lt/en/field-research-bases-and-stationary/
  fetched: 2026-11-15
  quote: For more than 60 years, Lake Drūkšiai is an object of regular annual monitoring
    of fish communities.
- claim: The page says the closure of the power plant in 2009 gave a chance to resume
    studies of the lake's hydrobiont communities and their recovery, and that the
    station was recently used for the FISHPAR, TRANSWAT and INVA projects.
  url: https://gamtostyrimai.lt/en/field-research-bases-and-stationary/
  fetched: 2026-11-15
  quote: Recently, the station was used for the implementation of different projects
    (FISHPAR, TRANSWAT, INVA).
