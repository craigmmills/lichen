summary: State budget museum in Klaipėda with a marine animal rehabilitation centre;
  Lithuania’s 2024 marine strategy report credits its seal data with supporting regional
  grey seal indicator development.
facts:
- claim: Its statute says it is a state museum and a budget institution.
  url: https://muziejus.lt/sites/default/files/documents/2024-10/Nuostatai-LJM.pdf
  fetched: 2026-11-15
  quote: biudžetinė įstaiga, kaupianti, sauganti, tirianti, konservuojanti, restauruojanti
    ir populiarinanti
- claim: Its page says the Baltic Sea Animal Rehabilitation Center, part of the museum
    complex, runs a marine animal research and rescue programme.
  url: https://juru.muziejus.lt/en/activities-baltic-sea-animal-rehabilitation-center
  fetched: 2026-11-15
  quote: The center runs a marine animal research and rescue program, as well as public
    awareness and education initiatives.
- claim: The same page says studies of dead seals are an important part of monitoring
    across the HELCOM countries.
  url: https://juru.muziejus.lt/en/activities-baltic-sea-animal-rehabilitation-center
  fetched: 2026-11-15
  quote: Studies of dead seals are an important part of monitoring, as only continuous
    and synchronized work by all HELCOM countries can answer questions about the health
    status of seals.
- claim: Lithuania's 2024 Marine Strategy Framework Directive report says museum data
    support development of the regional grey seal indicator and that seals marked
    with satellite or GSM transmitters shall be released off the coast.
  url: https://water.europa.eu/marine/assessment-module/national-descriptors-assessments/lt/bal/d1.2/art9-2024/@@view-report-data-2024
  fetched: 2026-11-15
  quote: 'The regional development of the indicator on the grey seal is supported
    by the data collected by the Lithuanian Maritime Museum: grey seals marked with
    satellite or GSM transmitters shall be released off the coast.'
- claim: Its page gives an address in Klaipėda and a Register of Legal Entities code.
  url: https://juru.muziejus.lt/en/activities-baltic-sea-animal-rehabilitation-center
  fetched: 2026-11-15
  quote: LT-93100 Klaipėda, Lithuania
