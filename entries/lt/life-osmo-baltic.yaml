summary: Lithuanian and Latvian project running in 2024–2030, aiming to monitor hermit
  beetles and inform Natura 2000 expansion; its 2024 report records 2,929 inventoried
  trees in Lithuania.
facts:
- claim: The Lithuanian Zoo's 2024 report on the project says its main goal is to
    monitor the hermit beetle and conduct research to expand or create Natura 2000
    sites.
  url: https://www.zoosodas.lt/wp-content/uploads/2024/03/LIFE-OSMO-Baltic_2024_ENG.pdf
  fetched: 2026-11-15
  quote: to monitor the hermit beetle (Osmoderma barnabita) species and conduct scientific
    research in
- claim: The same report says that in 2024, according to the Lithuanian Fund for Nature,
    2,929 trees were inventoried in Lithuania and 78 pheromone traps were used during
    the beetle's mating season, catching and releasing adults at 15 locations.
  url: https://www.zoosodas.lt/wp-content/uploads/2024/03/LIFE-OSMO-Baltic_2024_ENG.pdf
  fetched: 2026-11-15
  quote: 78 pheromone traps were used during the mating season
- claim: The Lithuanian Fund for Nature's home page says the project began at the
    initiative of the fund and partners in Latvia and Lithuania and runs from 1 January
    2024 to 30 June 2030.
  url: https://www.lgf.lt
  fetched: 2026-11-15
  quote: projekto trukmė – 6,5 metų (nuo 2024 m. sausio mėn. 1 d. iki 2030 m. birželio
    30 d.).
