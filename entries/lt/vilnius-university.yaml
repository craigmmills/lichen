summary: University whose Life Sciences Center researchers implement a biodiversity
  data capacity project, and whose planned data centre would make science data accessible
  under FAIR principles and build machine learning and quantum computing models.
facts:
- claim: The Capacity Building in Biodiversity Data in Lithuania project is implemented
    by researchers from the Institute of Biosciences at the Vilnius University Life
    Sciences Center, with the Nature Research Centre and the Kaunas Tadas Ivanauskas
    Museum of Zoology.
  url: https://www.gmc.vu.lt/en/about/news/5723-opening-lithuania-s-biodiversity-data-to-the-world
  fetched: '2026-11-12'
  quote: The project is implemented by researchers from the Institute of Biosciences
    at the Vilnius University Life Sciences Center, the Nature Research Centre, and
    the Kaunas Tadas Ivanauskas Museum of Zoology
- claim: The university's data centre project says data on species distribution, environmental
    pollution and interactions of wild animals with humans in Lithuania have been
    accumulated over several decades.
  url: https://www.data-center.vu.lt/about-main
  fetched: '2026-11-12'
  quote: In the fields of ecology and zoology, data on species distribution, environmental
    pollution, and the interactions of wild animals with humans in Lithuania have
    been accumulated over several decades.
- claim: The data centre project plans to make existing and new natural and biomedical
    science data accessible under FAIR principles and to build machine learning and
    quantum computing models on them.
  url: https://www.data-center.vu.lt/about-main
  fetched: '2026-11-12'
  quote: existing and newly acquired data from the natural and biomedical sciences
    will be made accessible in accordance with the FAIR principles and utilised to
    create models by implementing machine learning (ML) and quantum computing (QC)
    methods
