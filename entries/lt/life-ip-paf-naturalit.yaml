- claim: Action C.7 set out to develop, test and standardise new methods for monitoring populations and
    habitats.
  url: https://naturalit.lt/en/project-actions/
  fetched: 2026-11-08
  quote: Innovative methods will be developed, tested and standardized for monitoring of populations and
    habitats.
- claim: Action C.7 also planned to test and adapt remote monitoring tools for changes in habitat condition.
