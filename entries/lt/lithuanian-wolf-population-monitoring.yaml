summary: Lithuanian articles report nationwide wolf monitoring since 2018, including
  genetic studies of hunted wolves, over a thousand studied by October 2024, and at
  least 63 families in 2020–2021.
facts:
- claim: An Anykšta article dated 4 October 2021, naming Vytautas Magnus University
    lecturer Dr Renata Špinkytė-Bačkaitienė, says systematic nationwide observations
    of wolf distribution, numbers and damage, and genetic, age and reproduction studies
    of hunted wolves, had run since 2018.
  url: https://www.anyksta.lt/vilku-populiacija-reguliuokime-ne-emocijomis-o-argumentais
  fetched: 2026-11-15
  quote: Sistemingi vilkų populiacijos paplitimo, gausos, daromos žalos stebėjimai,
    išsamūs sumedžiotų vilkų genetiniai, amžiaus, reprodukcijos tyrimai Lietuvoje
    vykdomi jau nuo 2018 m.
- claim: The article says genetic studies are a significant part of the monitoring
    and identify each wolf to the individual level.
  url: https://www.anyksta.lt/vilku-populiacija-reguliuokime-ne-emocijomis-o-argumentais
  fetched: 2026-11-15
  quote: Labai reikšminą vilkų populiacijos būklės stebėsenos dalį sudaro genetiniai
    tyrimai.
- claim: The article says the genetic studies use a nuclear DNA microsatellite marker
    system on muscle samples from hunted wolves.
  url: https://www.anyksta.lt/vilku-populiacija-reguliuokime-ne-emocijomis-o-argumentais
  fetched: 2026-11-15
  quote: naudojant mikrosatelitų branduolio DNR žymenų sistemą
- claim: The article says the studies and reports showed at least 63 wolf families
    in Lithuania in the 2020-2021 season.
  url: https://www.anyksta.lt/vilku-populiacija-reguliuokime-ne-emocijomis-o-argumentais
  fetched: 2026-11-15
  quote: Lietuvos teritorijoje gyveno ne mažiau kaip 63 vilkų šeimos
- claim: A Telšių žinios article dated 10 October 2024 says a team at the Faculty
    of Forest Sciences and Ecology of Vytautas Magnus University's Agriculture Academy
    began genetic studies of hunted wolves.
  url: https://tzinios.lt/?p=55234
  fetched: 2026-11-15
  quote: Vytauto Didžiojo universiteto Žemės ūkio akademijos (VDU ŽŪA) Miškų ir ekologijos
    fakulteto mokslininkų komandos pradėti vykdyti sumedžiotų vilkų genetiniai tyrimai
- claim: The 10 October 2024 article says that since the 2018-2019 hunting season,
    a muscle sample, a canine root and, for females, the uterus were taken from every
    hunted wolf, with more than 98% of required samples collected over six years.
  url: https://tzinios.lt/?p=55234
  fetched: 2026-11-15
  quote: jau šešerius metus yra surenkama virš 98 % visų privalomų mėginių
- claim: The 10 October 2024 article says more than a thousand wolves had been studied
    genetically.
  url: https://tzinios.lt/?p=55234
  fetched: 2026-11-15
  quote: yra genetiškai ištirta virš tūkstančio vilkų imtis
