summary: Active since 1991, this Lithuanian charitable foundation protects nature,
  researches hermit beetle habitats and collaborated with Klaipėda University on planned
  Curonian Lagoon fish spawning site mapping.
facts:
- claim: Its home page says it is a charitable support foundation working to preserve
    Lithuania's natural environment, and one of the first environmental organisations
    in Lithuania, active since 1991.
  url: https://www.lgf.lt
  fetched: 2026-11-13
  quote: Lietuvos gamtos fondas (LGF) - labdaros paramos fondas, veikiantis tam, kad
    būtų išsaugota sveika ir nepažeista Lietuvos gamtinė aplinka.
- claim: The home page says its LIFE Osmo Baltic project, running from January 2024
    to June 2030, is dedicated to research on and protection of the habitats of the
    hermit beetle Osmoderma barnabita, which are old broadleaved trees.
  url: https://www.lgf.lt
  fetched: 2026-11-13
  quote: dedikuotas niūriaspalvio auksavabalio ( Osmoderma barnabita ) buveinių –
    senųjų lapuočių medžių – tyrimams bei apsaugai.
- claim: The European Green Belt Association says the foundation led a project with
    Klaipėda University from October 2024 to September 2026. Its expected results
    included mapping fish spawning sites across 85% of the Lithuanian side of the
    Curonian Lagoon, with local fishers and nature enthusiasts collecting data at
    80 sites.
  url: https://europeangreenbelt.org/bestbelt/projects/mapping-of-fish-spawning-grounds-and-nurseries-in-the-curonian-lagoon-for-better-management-and-protection-of-natural-resources
  fetched: 2026-11-13
  quote: The project was implemented by the Lithuanian Fund for Nature in collaboration
    with the Klaipėda University from October 2024 to September 2026.
- claim: The same page says local fishers and nature enthusiasts would collect data
    at 80 sites.
  url: https://europeangreenbelt.org/bestbelt/projects/mapping-of-fish-spawning-grounds-and-nurseries-in-the-curonian-lagoon-for-better-management-and-protection-of-natural-resources
  fetched: 2026-11-13
  quote: Local fishermen and nature enthusiasts will help by collecting data at 80
    sites.
