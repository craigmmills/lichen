summary: Lithuanian monitoring station founded in 1993, run by Vytautas Magnus University
  and the Environmental Protection Agency, which the site record says has measured
  continuously since and feeds national programmes, ICP Integrated Monitoring, ICP
  Forests and eLTER.
facts:
- claim: The DEIMS-SDR site record says the station was founded in 1993 and that measurements
    have been carried on continuously since.
  url: https://deims.org/fad7f221-25f3-4286-a1b3-43a5f010a3e3
  fetched: 2026-11-13
  quote: Aukštaitija integrated monitoring station (LT01) was founded in 1993, and
    measurements continuously carried on since.
- claim: The record says the station is part of national ecosystem and air monitoring
    programmes, ICP Integrated Monitoring, ICP Forests and the eLTER network.
  url: https://deims.org/fad7f221-25f3-4286-a1b3-43a5f010a3e3
  fetched: 2026-11-13
  quote: National ecosystem and air monitoring programs
- claim: The record says most ICP Integrated Monitoring and ICP Forests measurements
    are taken in Aukštaitija National Park, the Ažvinčiai strict nature reserve and
    the Versminis river basin, in an area covered by mixed coniferous forest.
  url: https://deims.org/fad7f221-25f3-4286-a1b3-43a5f010a3e3
  fetched: 2026-11-13
  quote: The majority of ICP IM and ICP Forests measurements are carried in Aukštaitija
    National Park, Ažvinčiai strict nature reserve, Versminis river basin.
- claim: The record lists the site status as operational and names Algirdas Augustaitis
    and Ainis Pivoras as site managers.
