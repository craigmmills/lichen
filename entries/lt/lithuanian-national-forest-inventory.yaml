summary: Programme running since 1998 that covers the whole country by sampling; a poster says its information
  system needs modernising, planning integration with AI-driven analysis and remote sensing sources.
facts:
- claim: The inventory has been carried out since 1998 and covers the whole country through a sampling
    method.
  url: https://www.mii.lt/damss/files/posters_2025/id_II-14.pdf
  fetched: 2026-11-08
  quote: National inventory of Lithuanian forests (NFI) has been carried out since 1998 . It is a key
    source of information on the Lithuanian forests, covering the entire area through a reliable sampling
    method .
- claim: The poster says the inventory is used for reporting and policy-making.
  url: https://www.mii.lt/damss/files/posters_2025/id_II-14.pdf
  fetched: 2026-11-08
  quote: This inventory is used for reporting and policy - making purposes .
- claim: The poster says the existing NFI information system needs to be modernised, and that the new
    architecture will allow integration with AI-driven analysis and remote sensing data sources; this
    is a plan.
  url: https://www.mii.lt/damss/files/posters_2025/id_II-14.pdf
  fetched: 2026-11-08
  quote: The new architecture will enable seamless integration with emerging technologies, including AI
    - driven analysis and remote sensing data sources .
- claim: The poster names three State Forest Service authors and gives vdu.lt email addresses for other
    authors.
  url: https://www.mii.lt/damss/files/posters_2025/id_II-14.pdf
  fetched: 2026-11-08
  quote: 'STATE FOREST SERVICE : Marijus Eigirdas, Gintaras Kulbokas, Andrius Galinskas'
- claim: The poster says the research was funded under the Horizon Europe Teaming project for the Forest
    4.0 centre of excellence in smart forestry.
  url: https://www.mii.lt/damss/files/posters_2025/id_II-14.pdf
  fetched: 2026-11-08
  quote: Creation of the centre of excellence in smart forestry “Forest 4 . 0 ” No . 101059985
