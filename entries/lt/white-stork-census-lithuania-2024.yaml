summary: Closed 2024 count of Lithuania's breeding white storks, run by the Nature Research
  Centre and led by Daiva Vaitkuvienė, using 10 by 10 km squares or defined areas.
facts:
- claim: The June 2024 invitation instructed participants to count in 10 by 10 km squares,
    avoiding squares counted in 2023, or in clearly defined areas.
  url: https://alkas.lt/?p=627379
  fetched: 2026-11-08
  quote: Apskaita vykdoma 10×10 km kvadratuose (nedubliuojant 2023 m. apskaitos kvadratų)
    arba aiškiai apibrėžtoje teritorijoje
- claim: The organisers said a 2024 count in additional areas under the international method
    would give reliable results on Lithuania's breeding white stork population.
  url: https://alkas.lt/?p=627379
  fetched: 2026-11-08
  quote: 2024 m. atlikus papildomuose plotuose baltųjų gandrų apskaitą pagal tarptautinę metodiką,
    galima būtų pateikti patikimus rezultatus apie Lietuvoje perinčią baltųjų gandrų populiaciją.
