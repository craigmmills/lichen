summary: Service that BISE said in 2015 coordinated protected-area administrations; its Methodical-Analytical
  Center, set up in 2018, collects and analyses data on species and habitats of Community interest.
facts:
- claim: The EU Biodiversity Information System for Europe (BISE), in its synthesis of fifth national
    reports to the CBD in 2015, said the service coordinated protected-area administrations, including
    in Natura 2000 sites.
  url: https://biodiversity.europa.eu/countries/lithuania/eu-biodiversity-strategy
  fetched: 2026-11-08
  quote: The State Service for Protected Areas under the Ministry of Environment coordinates activities
    of protected areas administrations in protected areas, including in Natura 2000 sites.
- claim: The LIFE IP Naturalit project site says the Methodical-Analytical Center under the service was
    set up in 2018, and that its tasks include collecting and analysing data on species and habitats of
    Community interest.
  url: https://naturalit.lt/en/project-actions/
  fetched: 2026-11-08
  quote: The Methodical-Analytical Center under the State Service for Protected Areas was established
    at the beginning of the project implementation in 2018.
- claim: The centre's tasks include collecting and analysing data on species and habitats of Community
    interest and assessing their conservation status.
  url: https://naturalit.lt/en/project-actions/
  fetched: 2026-11-08
  quote: 'The main tasks of the Methodical-Analytical Center are: to collect and analyze data on species
    and habitats of Community interest, assess their conservation status'
