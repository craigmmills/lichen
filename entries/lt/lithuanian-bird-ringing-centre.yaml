summary: Centre founded in 1978 and run by the Kaunas Tadas Ivanauskas Zoological
  Museum, which coordinates and stores Lithuanian bird ringing data, with about 103,700
  birds ringed yearly on average.
facts:
- claim: The Centre is responsible for organising, coordinating and supervising bird
    ringing in Lithuania, collecting recovery, control and resighting data, and publishing
    ringing data.
  url: https://zoomuziejus.lt/en/bird-ringing-centre/mission/
  fetched: '2026-11-12'
  quote: The Centre is responsible for the organising, coordinating and supervising
    of bird ringing in Lithuania, collecting of recovery, control and resighting data
    of ringed birds, publishing ringing data
- claim: The Lithuanian Bird Ringing Scheme is a full member of EURING.
  url: https://zoomuziejus.lt/en/bird-ringing-centre/mission/
  fetched: '2026-11-12'
  quote: The Lithuanian Bird Ringing Scheme is a full member of The European Union
    for Bird Ringing (EURING).
- claim: Founded in 1978, the Centre collects, processes and stores data on birds
    ringed in Lithuania and on foreign-ringed birds found there, and exchanges data
    with other countries' ringing centres.
  url: https://zoomuziejus.lt/en/divisions/
  fetched: '2026-11-12'
  quote: All the information about birds ringed in Lithuania (data on their ringing
    and finding), as well as information about birds ringed abroad but found in our
    country, is collected, processed, and stored in this Centre.
- claim: About 103,700 birds are ringed in Lithuania each year on average.
  url: https://zoomuziejus.lt/en/divisions/
  fetched: '2026-11-12'
  quote: On average, about 103,700 birds are ringed every year in Lithuania
