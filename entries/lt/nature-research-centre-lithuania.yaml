summary: State research institute created in 2009 by merging three institutes, with 25 laboratories studying
  ecosystems, habitats and species, including bird populations followed partly with satellite and GPS-GSM
  transmitters.
facts:
- claim: In 2024 the centre, working with NABU and the Lithuanian Ornithological Society, invited people
    to take part in the eighth international white stork census.
  url: https://alkas.lt/?p=627379
  fetched: 2026-11-08
  quote: Šiais metais Gamtos tyrimų centras (toliau – GTC), bendradarbiaujant su Vokietijos seniausia
    bei didžiausia aplinkosaugos asociacija NABU ir Lietuvos ornitologų draugija (toliau – LOD), kviečia
    dalyvauti jau 8-toje tarptautinėje baltųjų gandrų apskaitoje.
- claim: InforMEA lists the centre as a Lithuanian contact for biological diversity.
  url: https://www.informea.org/en/countries/lt/party-contacts-hub
  fetched: 2026-11-08
  quote: Nature Research Centre Biological diversity Lithuania Nature Research Centre Contact person Biological
    diversity
- claim: A state research institute set up by the Government of Lithuania in 2009 by merging the Institute
    of Botany, the Institute of Ecology of Vilnius University and the Institute of Geology and Geography.
  url: https://gamtostyrimai.lt/en/about-us/info-about-the-center/
  fetched: '2026-11-08'
  quote: by merging the Institute of Botany, the Institute of Ecology of Vilnius University and the Institute
    of Geology and Geography
- claim: Its address is Akademijos St. 2, Vilnius.
  url: https://gamtostyrimai.lt/en/about-us/info-about-the-center/
  fetched: '2026-11-08'
  quote: Akademijos St. 2, 08412 Vilnius
- claim: Its scientists study natural ecosystems, habitats, species and populations in 25 laboratories.
  url: https://gamtostyrimai.lt/en/about-us/info-about-the-center/
  fetched: '2026-11-08'
  quote: In twenty five laboratories of the NRC, scientists carry out investigations into environmental
    state quality, natural ecosystems, habitats, species, structure of communities and populations
- claim: Its bird ecology laboratory studies bird populations with field surveys and ringing, and with
    satellite and GPS-GSM transmitters.
  url: https://gamtostyrimai.lt/en/padaliniai/pauksciu-ekologijos-laboratorija/
  fetched: '2026-11-08'
  quote: Bird research is carried out using traditional field research methods (observations, surveys,
    nest search and inspection, ringing), as well as telemetry research (satellite and GPS-GSM transmitters,
    activity loggers, geolocators).
- claim: Its hydrobiological field station at Ventė studies the ecosystems of the Curonian Lagoon and
    the Baltic Sea all year round, including fish communities and stocks.
  url: https://gamtostyrimai.lt/en/field-research-bases-and-stationary/
  fetched: '2026-11-08'
  quote: is the major hydrobiological research field station where research into the functioning of ecosystems
    of the Curonian Lagoon and Baltic Sea are pursued all year round
- claim: Its field research stations page says Lake Drūkšiai, where it runs the Drūkšiai Biological Station,
    has had regular annual monitoring of fish communities for more than 60 years.
  url: https://gamtostyrimai.lt/en/field-research-bases-and-stationary/
  fetched: '2026-11-08'
  quote: For more than 60 years, Lake Drūkšiai is an object of regular annual monitoring of fish communities.
