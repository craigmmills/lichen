summary: According to KTU, a model built by three universities combines blockchain, IoT and
  AI to analyse tree sensor data for examining forest health and biodiversity.
facts:
- claim: KTU says Lithuanian scientists with Swedish experts developed Forest 4.0, a forest
    data processing model that integrates blockchain, IoT and AI.
  url: https://en.ktu.edu/news/managing-forests-with-smart-technologies/
  fetched: 2026-11-08
  quote: Lithuanian scientists, in collaboration with Swedish experts, have developed Forest
    4.0, an intelligent forest data processing model integrating blockchain, Internet of Things
    (IoT), and Artificial Intelligence (AI) technologies.
- claim: Sensors installed in trees send data to a central system where AI algorithms analyse
    it.
  url: https://en.ktu.edu/news/managing-forests-with-smart-technologies/
  fetched: 2026-11-08
  quote: These devices send data to a central system, where it is analysed using AI algorithms
    within the data analysis layer
- claim: The analysis results are used to examine forest health, biodiversity, carbon sequestration
    and ecosystem services.
  url: https://en.ktu.edu/news/managing-forests-with-smart-technologies/
  fetched: 2026-11-08
  quote: The analysis findings are further used in the monitoring and evaluation layer to
    examine forest health, biodiversity, carbon sequestration, and ecosystem services.
