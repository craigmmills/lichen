summary: Lithuanian butterfly monitoring network that began collecting transect counts in
  2009, now gathers all data through the eBMS website and ButterflyCount app, and is coordinated
  by Eglė Vičiuvienė with ministry and entomological society support.
facts:
- claim: The eBMS page for the scheme says the Lithuanian butterfly monitoring network began
    collecting transect count data in 2009 and later added 15-minute counts and moth trap
    data.
  url: https://butterfly-monitoring.net/node/128
  fetched: 2026-11-13
  quote: The Lithuanian butterfly monitoring network began collecting transect count data
    in 2009, later incorporating 15-minute counts and moth trap data collection as well.
- claim: The page says it currently gathers all its data through the eBMS website and the
    ButterflyCount app.
  url: https://butterfly-monitoring.net/node/128
  fetched: 2026-11-13
  quote: It currently gathers all data through the eBMS website and ButterflyCount App .
- claim: The page credits the support of the Ministry of Environment and the Lithuanian Entomological
    Society, with Eglė Vičiuvienė as main coordinator.
  url: https://butterfly-monitoring.net/node/128
  fetched: 2026-11-13
  quote: This BMS continues to grow thanks to the support of the Ministry of Environment of
    the Republic of Lithuania and the Lithuanian Entomological Society , along with the efforts
    of Eglė Vičiuvienė, main coordinator
