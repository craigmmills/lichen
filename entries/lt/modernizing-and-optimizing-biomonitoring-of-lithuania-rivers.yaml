summary: Nature Research Centre project aiming to modernise Lithuanian river biomonitoring
  with type-specific and DNA-based indices under the Water Framework Directive, including
  an eDNA microorganism index and new benthic invertebrate DNA sequences.
facts:
- claim: The Nature Research Centre's project page says the project aims to modernise
    river biomonitoring in Lithuania by developing type-specific and DNA-based assessment
    indices compliant with the Water Framework Directive.
  url: https://gamtostyrimai.lt/en/projektai/modernizing-and-optimizing-biomonitoring-of-lithuania-rivers/
  fetched: 2026-11-13
  quote: This project aims to modernize river biomonitoring in Lithuania through the
    development of novel type-specific and DNA-based EU Water Framework Directive
    (WFD) compliant assessment indices.
- claim: The page lists development of an eDNA microorganism-based index as one of
    its three strands.
  url: https://gamtostyrimai.lt/en/projektai/modernizing-and-optimizing-biomonitoring-of-lithuania-rivers/
  fetched: 2026-11-13
  quote: 2) Development of eDNA microorganism-based index.
- claim: The page says the project will compare DNA-based and morphology-based identification
    and add new DNA sequences of Lithuanian benthic invertebrates to genetic libraries.
  url: https://gamtostyrimai.lt/en/projektai/modernizing-and-optimizing-biomonitoring-of-lithuania-rivers/
  fetched: 2026-11-13
  quote: This objective will also enrich genetic libraries with new DNA sequences
    of Lithuanian benthic invertebrates.
