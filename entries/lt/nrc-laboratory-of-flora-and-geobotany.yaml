  several biodiversity databases.
facts:
- claim: Vegetation studies use classical methods and remote sensing with unmanned
    aerial vehicles or satellite imagery.
  url: https://gamtostyrimai.lt/en/padaliniai/floros-ir-geobotanikos-laboratorija/
  fetched: '2026-11-12'
  quote: Studies are performed using both classical methods of vegetation research
    and remote sensing, involving unmanned aerial vehicles or satellite imagery.
- claim: The laboratory developed and manages biodiversity databases on Lithuanian
    vegetation relevés, habitats of European importance, alien and invasive plants
    and soil temperatures.
  url: https://gamtostyrimai.lt/en/padaliniai/floros-ir-geobotanikos-laboratorija/
  fetched: '2026-11-12'
  quote: 'has developed and manages biodiversity databases: phytosociological relevés
    of Lithuanian vegetation (EU-LT-001), distribution of habitats of European importance
    (BIGIS), alien and invasive plants (INVA), and in situ soil temperatures (soilTemp-LT)'
- claim: Its data are used as a basis for improving the national system of biodiversity
    conservation.
  url: https://gamtostyrimai.lt/en/padaliniai/floros-ir-geobotanikos-laboratorija/
