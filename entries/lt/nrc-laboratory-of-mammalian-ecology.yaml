summary: Nature Research Centre laboratory founded in 2003, reporting citizen science
  and wildlife cameras in 2017–2021, GIS analysis of roadkill hotspots, and IENE use
  of its hotspot data.
facts:
- claim: The laboratory's history page says it was established in 2003 and has been
    part of the Nature Research Centre since 2010.
  url: https://gamtostyrimai.lt/en/padaliniai/history-of-laboratory1
  fetched: 2026-11-15
  quote: Since 2010, the Laboratory of Mammalian Ecology is part of the Nature Research
    Centre.
- claim: For 2017-2021, the laboratory's history page reports using citizen science,
    wildlife cameras and other new methods, and applying GIS analysis and KDE+ software
    to mammal roadkill to identify ungulate accident hotspots.
  url: https://gamtostyrimai.lt/en/padaliniai/history-of-laboratory1
  fetched: 2026-11-15
  quote: 'New methods were used: citizen science, stable isotope and chemical element
    analysis, wildlife cameras.'
- claim: In its account of 2017-2021, the laboratory's history page says its roadkill
    hotspot data were used by the IENE network to assess hotspots in Europe.
  url: https://gamtostyrimai.lt/en/padaliniai/history-of-laboratory1
  fetched: 2026-11-15
  quote: These data have been used in the work of the IENE network to assess the hotspots
    in Europe.
- claim: The page says that in 2006 the laboratory assessed the abundance of the wolf
    population and proposed management and monitoring measures.
  url: https://gamtostyrimai.lt/en/padaliniai/history-of-laboratory1
  fetched: 2026-11-15
  quote: In 2006, the abundance of the wolf population was assessed and measures for
    population management and monitoring were proposed.
