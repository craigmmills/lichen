summary: Active project run by four bodies to improve biodiversity data availability, quality and use,
  with a GBIF publishing meeting and an invitation for 19 October 2026.
facts:
- claim: Says its activities contribute to improving the availability, quality and use of biodiversity
    data in Lithuania and internationally.
  url: https://gamtostyrimai.lt/en/biodiversity-data-capacity-building-in-lithuania-discussed-at-international-meeting/
  fetched: '2026-11-08'
  quote: The project's activities contribute to improving the availability, quality and use of biodiversity
    data in Lithuania and internationally.
- claim: An invitation to an event under the project, on biodiversity data for research, collaboration
    and impact, gives the date 19 October 2026.
  url: https://gamtostyrimai.lt/en/invitation-to-the-event-biodiversity-data-for-research-collaboration-and-impact/
  fetched: '2026-11-08'
  quote: 'Date: 19 October 2026'
- claim: A meeting under the project discussed publishing biodiversity data through GBIF, with GBIF experts
    from Poland, Estonia, Belgium, Sweden and Denmark and Lithuanian bodies including the State Service
    for Protected Areas, the Ministry of Environment and the State Data Agency.
  url: https://gamtostyrimai.lt/en/biodiversity-data-capacity-building-in-lithuania-discussed-at-international-meeting/
  fetched: '2026-11-08'
  quote: Experts from Lithuania and abroad shared their experience of publishing biodiversity data via
    GBIF
