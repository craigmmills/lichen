summary: Within Algeria’s agriculture ministry, it presented a forest fire detection pilot in 2023 and
  partners with ASAL and Tour du Valat.
facts:
- claim: UN-SPIDER describes it as the General Directorate of Forest of the Ministry of Agriculture and
    Rural Development.
  url: https://un-spider.org/es/node/13246
  fetched: 2026-11-08
  quote: The General Directorate of Forest of the Ministry of Agriculture and Rural Development of Algeria
- claim: In December 2015, Algerie360 quoted the DGF's inspector in charge of national parks and reported
    the DGF's statement that Algeria had eight national parks under the Ministry of Agriculture and five
    parks under the Ministry of Culture.
  url: https://www.algerie360.com/huit-parcs-nationaux-reconnus-par-lunesco-comme-des-reserves-de-biosphere-dgf/
  fetched: 2026-11-08
  quote: l’Algérie possède 8 parcs nationaux relevant du ministère de l’Agriculture, du développement
    rural et de la pêche et 5 parcs relevant du ministère de la Culture
- claim: In 2023 the DGF presented a pilot for early detection of forest fires based on a solution built
    by the Algerian start-up Basseer.
  url: https://algerie-eco.com/2023/11/24/feux-de-forets-une-nouvelle-technique-pour-la-prevention-precoce-des-incendies/
  fetched: 2026-11-08
  quote: La Direction générale des forêts (DGF) a présenté, jeudi à Alger, un nouveau projet de prévention
    et détection précoce des feux de forêts , basé sur une solution innovante développée par une startup
    algérienne
- claim: The national network of Algerian bird observers' review says the DGF carried out the national
    breeding bird count of May 2017 through the network.
  url: https://tourduvalat.org/wp-content/uploads/2017/12/Revue-Ornithologique-Alg%C3%A9rie.pdf
  fetched: 2026-11-08
  quote: par la Direction Générale des Forêts à travers le RNOOA et ses structures décentral-
- claim: The FAO Mountain Partnership lists Algeria as a government member, with focal points at the Direction
    Générale des Forêts in Algiers, including a Sub-Directorate for Reforestation and Nurseries and a
    Land Restoration Office.
  url: https://www.fao.org/mountain-partnership/members/detail/algeria/en
  fetched: '2026-11-08'
  quote: Responsible of the Sub-Directorate for Reforestation and Nurseries
- claim: The FAO Mountain Partnership page gives its address in Algiers.
  url: https://www.fao.org/mountain-partnership/members/detail/algeria/en
  fetched: '2026-11-08'
  quote: Direction Générale des Forêts, Chemin Doudou Mokhtar, BP N° 232, Alger, Algérie
- claim: The Tour du Valat says its collaboration with the directorate led to land cover maps of Algerian
    wetlands made from satellite images, and to support for the integrated management of El Kala National
    Park.
  url: https://tourduvalat.org/actualites/une-cooperation-renforcee-avec-la-direction-generale-des-forets-en-algerie/
  fetched: '2026-11-08'
  quote: le développement de cartes d’occupation du sol de zones humides algériennes à partir d’images
    satellitales
- claim: In 2018 the Tour du Valat and the directorate signed a framework cooperation agreement.
  url: https://tourduvalat.org/actualites/une-cooperation-renforcee-avec-la-direction-generale-des-forets-en-algerie/
  fetched: '2026-11-08'
  quote: la Tour du Valat et la DGF viennent de signer une convention cadre de coopération
- claim: In 2019 the Tour du Valat said it was working with the directorate with the aim of setting up
    a wetland monitoring and local governance system in the Oranais-Dahra complex, under the National
    Wetlands Strategy and funded by the Franco-Algerian PROFAS C+ programme.
  url: https://tourduvalat.org/actualites-projets/la-tour-du-valat-active-en-afrique-du-nord-en-2019/
  fetched: '2026-11-08'
  quote: dans le but de mettre en œuvre un système de suivi et de gouvernance locale des zones humides
    dans le complexe de l’Oranais-Dahra
