summary: According to MaghrebOrnitho, its scientific team installed cameras that filmed a Saharan cheetah
  in March 2020; the PPCA director said the work produced over 230,000 photos.
facts:
- claim: MaghrebOrnitho reported that the ONPCA's scientific team set up the camera traps that filmed
    a Saharan cheetah at Atakor in March 2020.
  url: https://magornitho.org/2020/05/saharan-cheetah-ahaggar-algeria/
  fetched: 2026-11-08
  quote: The remote cameras were set up by the scientific team of the Ahaggar Cultural Park Office (ONPCA).
- claim: In May 2020, the PPCA director said the work had mobilised about fifty ONPCA agents for 120 days
    with 40 camera traps, producing a database of more than 230,000 photos.
  url: https://magornitho.org/2020/05/saharan-cheetah-ahaggar-algeria/
  fetched: 2026-11-08
  quote: using among others 40 camera traps operating continuously. This generated a new database of more
    than 230,000 photos which are under study
- claim: UNDP credited the result to the technical teams of the national office of the Ahaggar cultural
    park and the Algerian Cultural Parks Programme.
  url: https://www.undp.org/fr/node/211471
  fetched: 2026-11-08
  quote: les équipes techniques de l’Office national du parc culturel de l’Ahaggar et du Programme des
    Parcs Culturels Algériens (PPCA)
