summary: Camera-trap survey of Saharan cheetah and large fauna in the Ahaggar Cultural
  Park, run by the park office; in May 2020 Algérie Eco reported 40 cameras and over
  230,000 photos under study.
facts:
- claim: In May 2020, Algérie Eco reported that the project had mobilised about fifty
    park office staff for 120 days with 40 cameras running continuously, producing
    more than 230,000 photos then under study.
  url: https://algerie-eco.com/2020/05/18/tamanrasset-le-guepard-saharien-reapparu-dans-lahaggar/
  fetched: 2026-11-12
  quote: une cinquantaine d’agents de l’Onpca de différentes spécialités pendant 120
    jours et 40 caméras fonctionnant en continu générant ainsi une nouvelle banque
    de données de plus de 230 000 photos qui sont à l’étude
- claim: The park office's director said the research missions took place in 2017,
    2019 and March 2020 under a scientific protocol involving local people.
  url: https://algerie-eco.com/2020/05/18/tamanrasset-le-guepard-saharien-reapparu-dans-lahaggar/
  fetched: 2026-11-12
  quote: ces missions de recherches effectuées en 2017,2019 puis en mars dernier obéissent
    à un protocole scientifique
- claim: The results were announced by the director of the Algerian cultural parks
    project (PPCA).
  url: https://algerie-eco.com/2020/05/18/tamanrasset-le-guepard-saharien-reapparu-dans-lahaggar/
  fetched: 2026-11-12
  quote: a annoncé lundi à Alger le directeur du projet des parcs culturels algériens
    (Ppca), Salah Amokrane
- claim: A 2022 paper on monitoring the Saharan cheetah and large fauna in the Ahaggar
    Cultural Park has two authors from the park office.
  url: https://api.openalex.org/works?filter=ids.openalex:W4401365089|W4316095863|W7108465390|W4412933321&select=id,title,publication_year,authorships
  fetched: 2026-11-12
