summary: Park in Béjaïa whose staff poster describes a seabird inventory of its coast
  and Lake Mézaïa from September 2021 to August 2022, using transects, point counts
  and colony counts.
facts:
- claim: A poster by park staff places the Parc National du Gouraya in Béjaïa.
  url: https://act4med-marinebirds.org/wp-content/uploads/posters/PO10-%20Samia%20BERKANE.pdf
  fetched: 2026-11-12
  quote: Parc National du Gouraya, Bejaia-Algérie
- claim: The poster's heading names the Ministry of Agriculture and the Direction
    Générale des Forêts above the park.
  url: https://act4med-marinebirds.org/wp-content/uploads/posters/PO10-%20Samia%20BERKANE.pdf
  fetched: 2026-11-12
  quote: Direction Générale des Forêts
- claim: The seabird inventory of the park's coast and Lake Mézaïa ran from September
    2021 to August 2022.
  url: https://act4med-marinebirds.org/wp-content/uploads/posters/PO10-%20Samia%20BERKANE.pdf
  fetched: 2026-11-12
  quote: La période de cette étude s’étale du mois de septembre 2021 jusqu’au
- claim: Methods included kilometric abundance index transects, point counts, colony
    counts, counts of migrants and winter waterbird counts under the Wetlands International
    programme.
  url: https://act4med-marinebirds.org/wp-content/uploads/posters/PO10-%20Samia%20BERKANE.pdf
  fetched: 2026-11-12
  quote: '- Parcours en ligne par la méthode d’Indice Kilométrique d’Abondance'
- claim: The poster cites the park's ornithology unit and scientific support from
    Riadh Moulai, an ornithology professor at the University of Béjaïa, with a list
    of years from 2010 to 2022.
  url: https://act4med-marinebirds.org/wp-content/uploads/posters/PO10-%20Samia%20BERKANE.pdf
  fetched: 2026-11-12
  quote: -Cellule d’Ornithologie du Parc National du Gouraya avec un appui scientifique
    de Mr   MOULAI Riadh, professeur ornithologue, université de Bejaia.
