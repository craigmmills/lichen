summary: An association describing a participatory environmental monitoring cell for the Rocher de Constantine,
  with institutional and local partners and public reporting through an online form.
facts:
- claim: Describes itself as an association that, under the project to develop and conserve the Rocher
    de Constantine and with partners including the environment directorate and forest conservation service,
    set up an environmental monitoring cell.
  url: https://ecocirta.dz/nos-activites/nos-projets/rocher-de-constantine/cellule-de-veille/
  fetched: 2026-11-08
  quote: notre association Écocirta, en collaboration avec plusieurs partenaires institutionnels et locaux
- claim: The cell's aim is to monitor the site's conservation state, detect threats or degradation and
    coordinate action to protect its fauna, flora and natural heritage.
  url: https://ecocirta.dz/nos-activites/nos-projets/rocher-de-constantine/cellule-de-veille/
  fetched: 2026-11-08
  quote: Surveiller l’état de conservation du Rocher, détecter toute menace ou dégradation, et coordonner
    les actions nécessaires pour protéger la faune, la flore et le patrimoine naturel.
- claim: The monitoring cell is participatory, taking reports from the public through a form on the page.
  url: https://ecocirta.dz/nos-activites/nos-projets/rocher-de-constantine/cellule-de-veille/
