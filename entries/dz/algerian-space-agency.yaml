summary: A UN-SPIDER Regional Support Office established in 2002, reportedly partnering with the forest
  directorate in 2018 and able, according to TSA in August 2022, to supply fire-location satellite imagery.
facts:
- claim: Space in Africa reported that in October 2018 ASAL and the General Directorate of Forests signed
    an agreement on space technologies for decision-making and monitoring of natural ecosystems.
  url: https://spaceinafrica.com/2018/10/15/algeria-space-agency-enters-agreement-to-use-space-technologies-to-monitor-natural-ecosystems/
  fetched: 2026-11-08
  quote: which aims to space technologies and their applications in the development of tools for decision-making
    and monitoring of natural ecosystems
- claim: Space in Africa listed among the planned tools the detection of change in land use and the mapping
    of land degradation, including deforestation.
  url: https://spaceinafrica.com/2018/10/15/algeria-space-agency-enters-agreement-to-use-space-technologies-to-monitor-natural-ecosystems/
  fetched: 2026-11-08
  quote: Mapping of land degradation (water and wind erosion, deforestation …);
- claim: In August 2022, TSA reported that ASAL could supply images from the Alsat 1 and Alsat 2 satellites
    to locate forest fires and the area burnt.
  url: https://www.tsa-algerie.com/lutte-anti-incendie-en-algerie-comment-les-satellites-peuvent-aider/
  fetched: 2026-11-08
  quote: l’Asal peut aussi livrer des images provenant des satellites algériens Alsat 1 et Alsat 2 permettant
    d’identifier l’endroit de l’incendie ainsi que la surface parcourue par les flammes
- claim: UN-SPIDER lists ASAL as a UN-SPIDER Regional Support Office; with UN-SPIDER and the University
    of Bonn's ZFL it organised a workshop on space-based solutions for forest fires in Algiers in November
    2023.
  url: https://un-spider.org/es/node/13246
  fetched: 2026-11-08
  quote: Algerian Space Agency (ASAL, UN-SPIDER Regional Support Office)
- claim: Spacehubs Africa says the agency was established on 16 January 2002 in Bouzareah, Algiers, and
    is in charge of the Algerian space programme.
  url: https://data.spacehubs.africa/database/entity/agencies/agence-spatiale-algerienne/
  fetched: '2026-11-08'
  quote: The Algerian Space Agency (ASAL) was established on January 16, 2002 in Bouzareah, Algiers. It
    is in charge of the Algerian space program.
- claim: Spacehubs Africa lists CNTS as its former name.
  url: https://data.spacehubs.africa/database/entity/agencies/agence-spatiale-algerienne/
  fetched: '2026-11-08'
  quote: 'Formerly: CNTS (2002)'
- claim: Spacehubs Africa says the national space programme adopted in 2006 set up the Alsat Earth observation
    series, and that two more Earth observation satellites, Alsat-3A and Alsat-3B, were launched in January
    2026.
  url: https://data.spacehubs.africa/database/country/DZ/
  fetched: '2026-11-08'
  quote: The National Space Programme, adopted in 2006 as a 15-year framework, established Algeria's Earth
    observation Alsat series.
- claim: Spacehubs Africa says the programme covers environmental and resource monitoring among other
    areas.
  url: https://data.spacehubs.africa/database/country/DZ/
  fetched: '2026-11-08'
  quote: Algeria's programme spans Warth observation, telecommunications, and environmental and resource
    monitoring.
