summary: Forest fire detector built by the CDTA that scans the horizon with invisible
  light pulses to locate smoke and alert civil protection; the CDTA says it aims to
  cut alert time to one to five minutes.
facts:
- claim: The detector scans the horizon with invisible light pulses, locates smoke
    from a fire and sends alerts to the civil protection and forest services.
  url: https://www.cdta.dz/fr/detecteur-de-feux-de-foret/
  fetched: 2026-11-15
  quote: Il est basé sur la détection des foyers d’incendie par l’envoi d’un faisceau
    lumineux qui scanne l’horizon en émettant des impulsions lumineuses invisibles
- claim: In October 2024 the minister of higher education inspected the first remote
    fire detector in Médéa.
  url: https://www.cdta.dz/fr/detecteur-de-feux-de-foret/
  fetched: 2026-11-15
  quote: dans la wilaya de Médéa, l’inspection du premier détecteur d’incendie à distance
- claim: In July 2023 the CDTA said the detector had been developed there and tested
    on a representative site, and still had to be adapted to a forest site's topography.
  url: https://www.cdta.dz/en/conference-de-presse-sur-le-detecteur-de-departs-de-feux-de-forets/
  fetched: 2026-11-15
  quote: Ce détecteur de départ de feux de forêts a été développé au CDTA et testé
    à l’échelle d’un terrain représentatif et reste à adapter à un site forestier
    selon sa topographie.
- claim: The CDTA says the system aims to cut the time from a fire's start to the
    alert to between one and five minutes.
  url: https://www.cdta.dz/en/conference-de-presse-sur-le-detecteur-de-departs-de-feux-de-forets/
  fetched: 2026-11-15
  quote: de le réduire à une échelle de temps de 1 à 5 minutes
