summary: According to Algérie Eco in November 2023, an Algerian start-up with an artificial intelligence
  forest fire sensor project tested at two Tizi-Ouzou sites, selected for a green-economy programme.
facts:
- claim: In November 2023, Algérie Eco reported that the start-up had designed and built a technique of
    environmental sensors giving indicators to assess the risk and extent of forest fires in real time.
  url: https://algerie-eco.com/2023/11/24/feux-de-forets-une-nouvelle-technique-pour-la-prevention-precoce-des-incendies/
  fetched: 2026-11-08
  quote: Conçue et réalisée par la startup « Basseer », la nouvelle technique consiste à « installer des
    capteurs environnementaux permettant d’avoir des indicateurs climatiques pour évaluer les risques
    et l’ampleur des incendies de forêts en temps réel »
- claim: The report says the project uses artificial intelligence and was tested jointly by the DGF and
    Basseer at two pilot forest sites in Tizi-Ouzou from August 2023.
  url: https://algerie-eco.com/2023/11/24/feux-de-forets-une-nouvelle-technique-pour-la-prevention-precoce-des-incendies/
  fetched: 2026-11-08
  quote: Utilisant l’intelligence artificielle, le projet, dont les résultats ont été présentés aujourd’hui,
    a été expérimenté conjointement, par la DGF et « Basseer »
- claim: In November 2023, an ILO coordinator said Basseer had been one of 15 start-ups selected by Algeria
    Venture in June 2023 for a green-economy acceleration programme.
  url: https://algerie-eco.com/2023/11/24/feux-de-forets-une-nouvelle-technique-pour-la-prevention-precoce-des-incendies/
  fetched: 2026-11-08
  quote: a rappelé que « Basseer » a été parmi les 15 startups sélectionnées en juin dernier, suite à
    un appel à candidature lancé par Algeria-Venture
