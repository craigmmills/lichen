summary: Sudanese government body in Khartoum North, listed in wildlife papers, reported
  by Tour du Valat as participating in waterbird surveys, and identified as needing
  capacity building.
facts:
- claim: In a 4 May 2022 article, Noon Post described the Wildlife Research Center
    in Sudan as a government body and named Dr Ameer Awad Mohammed Mahjoub as its
    director.
  url: https://www.noonpost.com/43919/
  fetched: 2026-11-14
  quote: مدير مركز بحوث الحياة البرية في السودان (حكومي) الدكتور أمير عوض محمد محجوب
- claim: The first author of a paper on the abundance of larger mammals in Dinder
    National Park, and most of his co-authors, list the Wildlife Research Center in
    Khartoum North as their affiliation.
  url: https://api.openalex.org/works?filter=doi:10.1007/s10344-023-01675-1&select=id,title,publication_year,authorships
  fetched: 2026-11-14
  quote: Wildlife Research Center, PO Box 16, Khartoum North, Sudan
- claim: The paper is titled "Abundance of larger mammals in Dinder National Park,
    Sudan" and was published in 2023.
  url: https://api.openalex.org/works?filter=doi:10.1007/s10344-023-01675-1&select=id,title,publication_year,authorships
  fetched: 2026-11-14
  quote: Abundance of larger mammals in Dinder National Park, Sudan
- claim: In February 2021, Tour du Valat reported that since 2010 OFB and Tour du
    Valat, with the Wildlife Conservation General Administration, the Sudanese Wildlife
    Society, universities and the Wildlife Research Center, had carried out field
    missions under Sudan's International Waterbird Census scheme.
  url: https://tourduvalat.org/en/projects/support-for-the-conservation-of-waterbirds-and-their-habitats-in-sudan-mission-in-the-framework-of-the-ressource-project/
  fetched: 2026-11-14
  quote: universities and the Wildlife Research Center
- claim: Tour du Valat says these field missions, part of the Sudanese International
    Waterbird Census scheme, assessed the importance of one hundred wetlands.
  url: https://tourduvalat.org/en/projects/support-for-the-conservation-of-waterbirds-and-their-habitats-in-sudan-mission-in-the-framework-of-the-ressource-project/
  fetched: 2026-11-14
  quote: Conducted as part of the IWC Sudanese scheme, these field missions assessed
    the importance of one hundred wetlands.
- claim: Sudan's national clearing-house site names the Wildlife Research Center,
    with HCENR and the Wildlife Conservation General Administration, as a body whose
    capacity needs building.
  url: https://sd.chm-cbd.net/strategies-and-actions-plans
  fetched: 2026-11-14
  quote: Wildlife Conservation General Administration and the Wildlife Research Center
    are urgently required
- claim: A co-author of a 2026 paper on the distribution and density of wild ass in
    Red Sea State lists the Wildlife Research Center in Khartoum North as his affiliation.
  url: https://api.openalex.org/works?filter=doi:10.1007/s44338-026-00201-2&select=id,title,publication_year,authorships
  fetched: 2026-11-14
  quote: Wildlife Research Center, Khartoum North, Sudan
