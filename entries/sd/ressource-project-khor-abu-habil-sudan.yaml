summary: A project run by the Sustainable Wildlife Management Programme, which has
  carried out waterbird censuses and socio-economic appraisals at the delta since
  2017, leading to its Ramsar designation on 10 April 2022.
facts:
- claim: The SWM Programme's Sahelian wetlands page says waterbird censuses and socio-economic
    appraisals have been carried out at the Khor Abu Habil Inland Delta since 2017,
    with the Sudanese Wildlife Administration and local communities.
  url: https://www.fao.org/in-action/swm-programme/where-we-work/sahelian-wetlands/en
  fetched: 2026-11-15
  quote: Since 2017, socio-economic appraisals and waterbird censuses have been conducted
    in collaboration with the Sudanese Wildlife Administration and local communities.
- claim: The page says this work led to the delta's designation as a Ramsar site on
    10 April 2022.
  url: https://www.fao.org/in-action/swm-programme/where-we-work/sahelian-wetlands/en
  fetched: 2026-11-15
  quote: This collaboration led to the designation of Khor Abu Habil Inner Delta as
    a wetland of international importance under the Ramsar Convention on April 10,
    2022.
