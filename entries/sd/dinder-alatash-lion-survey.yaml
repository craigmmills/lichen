summary: Born Free and WildCRU’s survey, led by Hans Bauer, reported Dinder-Alatash lions in 2017 and
  estimated up to 183 lions and 198 hyenas in Dinder in 2018.
facts:
- claim: Born Free reported in October 2017 that a 2016 expedition jointly organised by Born Free and
    WildCRU, led by Hans Bauer, found a lion population spanning Dinder National Park in Sudan and Alatash
    in Ethiopia.
  url: https://www.bornfree.org.uk/news/update-on-the-lions-of-dinder-alatash
  fetched: 2026-11-12
  quote: an expedition jointly organised by Born Free and WildCRU*, led by Dutch lion biologist Dr. Hans
    Bauer
- claim: The team used extensive camera trapping, which gave updated species lists for the ecosystem.
  url: https://www.bornfree.org.uk/news/update-on-the-lions-of-dinder-alatash
  fetched: 2026-11-12
  quote: The team used extensive camera trapping but didn’t get enough observations to calculate lion
    density.
- claim: Dr Ameer Awad of the Sudan Wildlife Research Centre accompanied the 2017 expedition to Dinder
    and helped write the report.
  url: https://www.bornfree.org.uk/news/update-on-the-lions-of-dinder-alatash
  fetched: 2026-11-12
  quote: Dr Ameer Awad of the Sudan Wildlife Research Centre, who accompanied Hans on his expedition to
    Dinder National Park and helped write the report
- claim: Born Free reported in April 2018 that a March 2018 survey in Dinder National Park, led by Hans
    Bauer of WildCRU in partnership with the Sudan Wildlife Research Centre, Born Free and the Lion Recovery
    Fund, estimated up to 183 lions and 198 hyenas.
  url: https://bornfree.org.uk/news/news-lion-population-surveyed-in-sudan
  fetched: 2026-11-12
  quote: There could be as many as 183 lions and 198 hyenas living in a remote national park on the Sudan-Ethiopia
    border
