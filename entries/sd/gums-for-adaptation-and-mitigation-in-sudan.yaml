  fetched: 2026-11-15
  quote: 'Donor: GCF'
- claim: The 2025 annual performance report to the GCF says the project maintained
    remote sensing and high-resolution satellite imagery to monitor vegetation change
    and land degradation trends while field-based restoration was suspended because
    of insecurity.
