  an automated identification algorithm.
facts:
- claim: AI4Biodiversity says SPNI, with Yarok Balev, tracks salamander population
    size by experts identifying individuals from images collected in annual winter
    monitoring.
  url: https://ai4biodiversity.haifa.ac.il/impact/
  fetched: 2026-11-12
  quote: The Society for the Protection of Nature in Israel, in collaboration with
    Yarok Balev NGO, works to track Salamander population size by identifying individual
    salamanders by human experts based on digital images collected during annual winter
    monitoring projects.
- claim: AI4Biodiversity proposes developing an automated algorithm to identify individual
    salamanders from the images.
  url: https://ai4biodiversity.haifa.ac.il/impact/
  fetched: 2026-11-12
  quote: we propose the development of an automated algorithm to process the images
    so that the identification of individual salamanders can take place without human
    intervention.
