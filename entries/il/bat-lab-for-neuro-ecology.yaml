summary: Active lab describing miniature technologies for tracking bats, the Vesper sensor,
  Batalef sound-analysis software, and monitoring of Egyptian fruit bats in the laboratory
  and wild.
facts:
- claim: Says it develops miniature technologies that track and record bats' behaviour in
    the laboratory and in the wild.
  url: https://www.yovelbatlab.com/
  fetched: 2026-11-08
  quote: We develop miniature technologies that track and record bats' behaviors within controlled
    laboratory settings and in their wild environment
- claim: Describes its Vesper sensor as weighing a minimum of 1.8 g, with GPS, an ultrasonic
    microphone and other sensors.
  url: https://www.yovelbatlab.com/vesper
  fetched: 2026-11-08
  quote: Minimum weight of 1.8g, includes GPS, ultrasonic microphone, 9DOF (e,g. ACC) and
    electrophysiology sensors.
- claim: Describes Batalef as software for analysing sound recordings, with automatic call
    detection among its features.
  url: https://www.yovelbatlab.com/batalef
  fetched: 2026-11-08
  quote: 'Batalef is a user friendly software for sound analysis and manipulation of single
    channel and multi-channel recordings. Some of its features include: Automatic call detection'
- claim: Says it monitors Egyptian fruit bats with miniature GPS, accelerometers and microphones
    outside the colony, and video and RFID inside it.
  url: https://www.yovelbatlab.com/communication
  fetched: 2026-11-08
  quote: Miniature GPS, accelerometers and microphones are mounted on the bats to follow them
    when they fly out of the colony at night
