summary: An association that conducted 82 dolphin surveys in 2024, collected over
  a year of continuous cave camera data at Rosh Hanikra, and began training volunteer
  surveyors with University of Haifa researchers.
facts:
- claim: Says every public sighting report of a marine mammal is added to its database.
  url: https://www.delphis.ngo/en
  fetched: 2026-11-15
  quote: Every sighting report is added to our database and helps to protect the marine
    mammals living along the coast of Israel
- claim: Conducted 82 dolphin surveys in 2024.
  url: https://www.delphis.ngo/en/post/2024-delphis-activity-for-the-marine-mammals-in-israel
  fetched: 2026-11-15
  quote: We conducted 82 dolphin surveys in 2024, documenting 15 dolphin pod encounters
- claim: In 2024 it collected more than a year of continuous data from cameras installed
    in the small caves at Rosh Hanikra.
  url: https://www.delphis.ngo/en/post/2024-delphis-activity-for-the-marine-mammals-in-israel
  fetched: 2026-11-15
  quote: For the first time, we collected over a year's worth of continuous data from
    cameras installed in the small caves at Rosh Hanikra.
- claim: In 2024 it began training volunteers to conduct dolphin surveys, in collaboration
    with researchers from the Morris Kahn Marine Research Station at the University
    of Haifa.
  url: https://www.delphis.ngo/en/post/2024-delphis-activity-for-the-marine-mammals-in-israel
  fetched: 2026-11-15
  quote: This program, made possible by collaboration with researchers from the Morris
    Kahn Marine Research Station at the University of Haifa and a generous donation
    from a Delphis volunteer
