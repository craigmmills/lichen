summary: Applied, policy-relevant centre at the Steinhardt Museum that, per KKL-JNF,
  has run over thirty GIS-based land surveys and developed vegetation mapping methods
  and a model of open-space fragmentation.
facts:
- claim: The Steinhardt Museum names the Open Landscape Institute as one of its three
    applied, policy-relevant centres.
  url: https://smnh.tau.ac.il/en/research/the-museum-collections/
  fetched: 2026-11-12
  quote: 'Additionally, the Steinhardt Museum is home to three applied policy-relevant
    centers: the Open Landscape Institute; HaMaarag, Israel’s National Ecosystem Assessment
    Program; and Israel Center for Aquatic Ecology.'
- claim: KKL-JNF says its Survey Unit conducts systematic surveys of large land units
    and that the findings are public.
  url: https://www.kkl-jnf.org/people-and-environment/national-masterplan-forests-israel/open-landscape-institute/
  fetched: 2026-11-12
  quote: The Survey Unit conducts systematic surveys of comparatively large land units
    using a clear and transparent methodology.
- claim: The surveys are produced with GIS and have built a broader database, especially
    on vegetation, that can be used to help monitor the environment.
  url: https://www.kkl-jnf.org/people-and-environment/national-masterplan-forests-israel/open-landscape-institute/
  fetched: 2026-11-12
  quote: they have contributed to the establishment of a broader database – especially
    where vegetation is concerned – which can be used to help monitor various aspects
    of the environment.
- claim: KKL-JNF says the institute has run over thirty surveys and developed methods
    for mapping vegetation and a model of open-space contiguity and fragmentation.
  url: https://www.kkl-jnf.org/people-and-environment/national-masterplan-forests-israel/open-landscape-institute/
  fetched: 2026-11-12
  quote: a model for examining the contiguity of open spaces and the fragmentation
    processes they undergo; and methods of mapping vegetation.
