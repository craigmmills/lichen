website: https://ai4biodiversity.haifa.ac.il/
summary: Active project developing new methods, with conservation agencies, to assess the state of nature,
  using transfer-learned YOLOv5 and MegaDetector on camera images, and proposing satellite mammal detection
  for two gazelle species.
facts:
- claim: Aims to develop new methods for assessing the state of nature, with conservation agencies.
  url: https://ai4biodiversity.haifa.ac.il/partners/
  fetched: '2026-11-08'
  quote: AI4Biodiversity project aims at developing novel methods for assessing the state-of-nature.
- claim: Retrained a YOLOv5 neural network by transfer learning to classify animals in images.
  url: https://ai4biodiversity.haifa.ac.il/projects/
  fetched: '2026-11-08'
  quote: We re-trained the head of the trained neural network yolov5 using transfer learning and fine-tuning
    techniques
  ai_type: deep-learning
- claim: Uses MegaDetector to remove empty camera images.
  url: https://ai4biodiversity.haifa.ac.il/projects/
  fetched: '2026-11-08'
  quote: we created a pipeline that utilizes mega-detector (MD)
- claim: Trained a fine-grained model on images cropped from wild boar videos to distinguish piglets from
    adults and males from females.
  url: https://ai4biodiversity.haifa.ac.il/projects/
  fetched: '2026-11-08'
  quote: We propose a method for identifying the sex and gender using fine-grained classifying neural
    network.
  ai_type: deep-learning
- claim: Proposes combining semi-supervised annotations with ML detections to detect mammals in very-high-resolution
    satellite images, with planned evaluation of two gazelle species.
  url: https://ai4biodiversity.haifa.ac.il/projects/
  fetched: '2026-11-08'
  quote: the proposed approach uses cross-validation of semi-supervised annotations with synced ML-based
    detections of targeted objects
  ai_type: ml-semi-supervised
