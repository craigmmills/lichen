summary: Ministry and founding partner of the 2006 National Ecosystem Assessment Program;
  the State Comptroller's May 2022 report said Israel missed 14 of 19 national biodiversity
  targets.
facts:
- claim: In its May 2022 report, the State Comptroller recommended that the ministry and INPA,
    described as the national centre for Israel's international biodiversity targets, set
    up a cooperation mechanism.
  url: https://library.mevaker.gov.il/sites/DigitalLibrary/Documents/2022/2022.5/EN/2022.5-211-Migvan-Biology-Taktzir-EN.pdf
  fetched: '2026-11-08'
  quote: It is recommended that the MEP and the Israel Nature and Parks Authority, which serve
    as the national center for the realization of Israel's international targets of biodiversity
    preservation
- claim: The State Comptroller's May 2022 report said Israel did not meet 14 of the 19 national
    biodiversity targets it had set itself in its reporting to the CBD.
  url: https://library.mevaker.gov.il/sites/DigitalLibrary/Documents/2022/2022.5/EN/2022.5-211-Migvan-Biology-Taktzir-EN.pdf
  fetched: '2026-11-08'
  quote: Israel does not meet 14 of the 19 national targets (about 74%) it has set itself
    for preserving biological diversity
- claim: The draft CBD country profile describes the Ministry of Education collaborating with
    MoEP, INPA, KKL-JNF and NGOs on nature conservation and sustainable development education.
  url: https://www.cbd.int/countries/profile?country=il
  fetched: '2026-11-08'
  quote: the Ministry of Education collaborates with the Ministry of Environmental Protection
    (MoEP), Israel Nature Reserves and Parks Authority (INPA), Keren Kayemeth LeIsrael–the
    Jewish National Fund (JNF-KKL)
- claim: A Tel Aviv University research authority page lists the ministry as the fund for
    Israeli partners in the Biodiversa+ 2023-2024 joint call, with EUR 187,500 for the Israeli
    partner.
  url: https://research-authority.tau.ac.il/node/21637
  fetched: '2026-11-08'
  quote: 'Funding: €187,500 total for the Israeli Partner'
- claim: Hamaarag names it as one of the four founding partners of Israel's National Ecosystem
    Assessment Program in 2006.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: partnership framework between the Ministry of Environmental Protection, the Jewish
    National Fund – Keren Kayemeth LeIsrael, the Israel Nature and Parks Authority and the
    Steinhardt Museum of Nature History
- claim: The National Natural History Collections' GBIF record lists it among the national
    organisations they advise.
  url: https://api.gbif.org/v1/organization/cb633566-ed21-4684-bcce-df84d0eb4c8a
  fetched: '2026-11-08'
  quote: provide consultation services to national organizations (the Nature & Parks Authority,
    the Ministry of Agriculture, the Ministry of Environmental Protection
