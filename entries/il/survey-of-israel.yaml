facts:
- claim: Its regulations set quality requirements for each geospatial product, including maps,
    elevation models and ortho imagery.
  url: https://isprs-archives.copernicus.org/articles/XLIII-B2-2022/65/2022/isprs-archives-XLIII-B2-2022-65-2022.pdf
  fetched: '2026-11-08'
  quote: The new Survey of Israel (SOI) regulations specify the quality requirements for each
    geospatial product including maps at different scales and for different purposes, elevation
    models, ortho imagery etc.
- claim: In 2019 it published a new national aerial capturing standard.
  url: https://isprs-archives.copernicus.org/articles/XLIII-B2-2022/65/2022/isprs-archives-XLIII-B2-2022-65-2022.pdf
  fetched: '2026-11-08'
  quote: In 2019 the SOI has updated the camera certification and validation procedure and
    published a new national aerial capturing standard
