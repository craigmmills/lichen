summary: Long-term ecological research station set up at Ramat Hanadiv in September
  2003, monitoring gazelles, partridges, songbirds, butterflies and vegetation, with
  data to be collated into an online database.
facts:
- claim: An LTER station was set up at Ramat Hanadiv in September 2003.
  url: https://www.ramat-hanadiv.org.il/en/mehkarim/what-is-longterm-ecological-research-lter/
  fetched: 2026-11-12
  quote: After a period of discussion, an LTER station was established at Ramat Hanadiv
    in September 2003.
- claim: The programme includes long-term monitoring of set variables and organisms,
    including gazelles, partridges, songbirds, butterflies and vegetation.
  url: https://www.ramat-hanadiv.org.il/en/mehkarim/what-is-longterm-ecological-research-lter/
  fetched: 2026-11-12
  quote: gazelles, partridges, songbirds, butterflies, herbaceous vegetation and woody
    vegetation.
- claim: The long-term data are to be collated into an online database.
  url: https://www.ramat-hanadiv.org.il/en/mehkarim/what-is-longterm-ecological-research-lter/
  fetched: 2026-11-12
  quote: The data collected for the long-term will be collated into an online database
    and serve as baseline data for future studies.
- claim: The LTER-Israel site list gives its operating organisation as Ramat-Hanadiv
    and spells its manager's name 'Liat Hadat'; the network homepage instead gives
    'Dr. Liat Hadar'.
  url: https://lter-israel.org.il/sites/
