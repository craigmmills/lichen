summary: Israel's national knowledge centre for inland water ecology, founded in 2015
  at the Steinhardt Museum of Natural History, which sets biological standards for
  assessing streams and publishes basin monitoring reports.
facts:
- claim: Serves as the national knowledge centre for inland water ecology and sets
    the biological standards used to assess the ecological state of Israel's streams.
  url: https://smnh.tau.ac.il/aquatic_center/
  fetched: 2026-11-12
  quote: ואמון על קביעת הסטנדרטים הביולוגיים המשמשים להערכת המצב האקולוגי של נחלים
    בישראל.
- claim: Founded in 2015 at the Steinhardt Museum of Natural History.
  url: https://smnh.tau.ac.il/aquatic_center/
  fetched: 2026-11-12
  quote: המרכז הוקם ב-2015 במוזיאון הטבע ע”ש שטיינהרדט
- claim: Its work is supported by the Ministry of Environmental Protection, the Israel
    Nature and Parks Authority, KKL-JNF and the museum.
  url: https://smnh.tau.ac.il/aquatic_center/
  fetched: 2026-11-12
  quote: ופעילותו נתמכת על ידי המשרד להגנת הסביבה, רשות הטבע והגנים, קרן קיימת לישראל
    והמוזיאון.
- claim: Publishes monitoring reports for the streams of several basins, including
    the Kishon basin from 2016 to date.
  url: https://smnh.tau.ac.il/aquatic_center/
  fetched: 2026-11-12
  quote: דוחות ניטור בנחלי אגן הקישון מ-2016 ועד היום
- claim: Water4All lists it as an active national-access research facility of Tel
    Aviv University that has set up a nationwide network of biological and chemical
    sampling sites using macroinvertebrates under the EU Water Framework Directive
    assessment system.
  url: https://www.water4all-partnership.eu/node/1266
  fetched: 2026-11-12
  quote: The IAEC has established a network of biological and chemical sampling sites
    across the country, adopting the EU-WFD assessment system using macroinvertebrates
    as the primary target group.
- claim: Water4All gives Tel Aviv University as its institution.
  url: https://www.water4all-partnership.eu/node/1266
  fetched: 2026-11-12
  quote: Tel Aviv University
- claim: Gives its address as 12 Klausner Street, Tel Aviv.
  url: https://www.water4all-partnership.eu/node/1266
  fetched: 2026-11-12
  quote: 12 Klausner Street, Tel Aviv
