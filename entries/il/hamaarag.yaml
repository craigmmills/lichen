summary: Active national ecosystem assessment programme founded in 2006 with four partners,
  monitoring terrestrial biodiversity using trail cameras, with remote sensing work and GBIF
  dataset publishing.
facts:
- claim: Founded in 2006 as a partnership of the ministry, KKL-JNF, INPA and the Steinhardt
    Museum.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: Hamaarag - Israel's National Ecosystem Assessment Program was founded in 2006 as
    a partnership framework between the Ministry of Environmental Protection, the Jewish National
    Fund – Keren Kayemeth LeIsrael, the Israel Nature and Parks Authority and the Steinhardt
    Museum
- claim: Operates a long-term programme monitoring terrestrial biodiversity.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: Hamaarag operates a long-term monitoring program tracking how the pressures of human
    development and climate change impact ecosystems, by monitoring terrestrial biodiversity.
- claim: Monitors medium to large mammals with motion-triggered trail cameras as part of the
    national monitoring programme.
  url: https://hamaarag.org.il/en/photographs-from-surveillance-cameras-mammals/
  fetched: '2026-11-08'
  quote: The monitoring of large- to medium-sized mammals as part of Hamaarag project is carried
    out as part of the national monitoring program, using surveillance cameras.
- claim: Has a remote sensing coordinator working on vegetation, fire and light pollution
    monitoring.
  url: https://hamaarag.org.il/en/%d7%a6%d7%95%d7%95%d7%aa-%d7%94%d7%9e%d7%90%d7%a8%d7%92/hamaarag-staff/
  fetched: '2026-11-08'
  quote: mining and decoding spatial data based on remote sensing for projects dealing with
    vegetation monitoring, fire, light pollution and more
- claim: Developed Israel's Biodiversity Index, published in the Central Bureau of Statistics
    well-being report.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: we developed the “Biodiversity Index”, which examines the state of biodiversity in
    Israel
- claim: Publishes datasets to GBIF.
  url: https://api.gbif.org/v1/organization?country=IL&limit=100
  fetched: '2026-11-08'
  quote: '"title":"Hamaarag"'
- claim: Founded in 2006 as Israel's National Ecosystem Assessment Program.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: Hamaarag - Israel’s National Ecosystem Assessment Program was founded in 2006
- claim: Coordinates the National Terrestrial Biodiversity Monitoring Program and runs monitoring
    programmes after ecological disasters.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: 'Hamaarag activities include: coordination of the National Terrestrial Biodiversity
    Monitoring Program, management of national monitoring programs following ecological disasters'
- claim: Its site lists a database of mammal photographs from trail cameras.
  url: http://www.hamaarag.org.il/en
  fetched: '2026-11-08'
  quote: Mammals photographs from trail cameras
- claim: Its GBIF publisher record says it operates long-term programmes.
  url: https://api.gbif.org/v1/organization/d311f0e2-e067-4df9-9374-ae058ea4c19f
  fetched: '2026-11-08'
  quote: HaMaarag’s activities include operating long-term programs that are interconnected
    and mutually supportive.
