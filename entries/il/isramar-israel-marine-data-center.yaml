facts:
- claim: Set up in 2001 at the National Institute of Oceanography to collect, document, store and distribute
    data on Israel's marine environment.
  url: https://www.ocean.org.il/isramar-%d7%9e%d7%a8%d7%9b%d7%96-%d7%94%d7%9e%d7%99%d7%93%d7%a2-%d7%94%d7%99%d7%9e%d7%99-%d7%94%d7%9c%d7%90%d7%95%d7%9e%d7%99/
  fetched: '2026-11-08'
  quote: מרכז המידע הימי הלאומי (Israel Marine Data Center = ISRAMAR) הוקם בשנת 2001 במכון הלאומי לאוקיאנוגרפיה
    במטרה לרכז, לתעד, לשמור ולהפיץ נתונים על הסביבה הימית של ישראל
- claim: Holds physical, chemical, biological and geological data from the Mediterranean, the Red Sea
    and the Dead Sea, from research cruises, automatic systems at sea and remote sensing.
  url: https://www.ocean.org.il/isramar-%d7%9e%d7%a8%d7%9b%d7%96-%d7%94%d7%9e%d7%99%d7%93%d7%a2-%d7%94%d7%99%d7%9e%d7%99-%d7%94%d7%9c%d7%90%d7%95%d7%9e%d7%99/
  fetched: '2026-11-08'
  quote: במרכז המידע נשמרים נתונים פיזיקליים, כימיים ביולוגיים וגיאולוגים מהים התיכון, מים סוף ומים המלח.
