summary: Programme says it was set up at the Steinhardt Museum in early 2022 to promote public participation
  in biodiversity research, and says it launched a data collection website in February 2025.
facts:
- claim: Says it was set up at the Steinhardt Museum in early 2022 to promote public participation in
    environmental research for biodiversity science and conservation in Israel.
  url: https://smnh.tau.ac.il/en/research/israel_citizen_science_center/
  fetched: 2026-11-08
  quote: The Israel Center for Citizen Science at the Steinhardt Museum of Natural History was established
    in early 2022, to promote public participation in environmental research to promote biodiversity science
    and conservation in Israel.
- claim: Says it launched a website and tools to collect data and public reports in February 2025.
  url: https://smnh.tau.ac.il/en/research/israel_citizen_science_center/
  fetched: 2026-11-08
  quote: On February 2025 the new center has officially launched the collaborations with existing citizen
    science projects and introduce the website and tools to collect data and public reports for scientific
    research.
- claim: Gives among its goals making research data accessible and establishing shared FAIR data.
  url: https://smnh.tau.ac.il/en/research/israel_citizen_science_center/
  fetched: 2026-11-08
  quote: to ensure that research data and results are accessible to the public, stakeholders, and decision-makers;
    to establish globally shared FAIR data.
