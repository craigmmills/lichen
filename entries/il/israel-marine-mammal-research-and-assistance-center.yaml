summary: An Israeli association that began a cetacean database in 1993, runs surveys
  of common bottlenose dolphins and staffs a national 24/7 network for reports of
  distressed marine mammals.
facts:
- claim: In 1993 its four founders began collecting a database on cetaceans off Israel's
    coasts, across the Mediterranean and in the Gulf of Eilat.
  url: https://immrac.com/%D7%90%D7%95%D7%93%D7%95%D7%AA-%D7%94%D7%A2%D7%9E%D7%95%D7%AA%D7%94/
  fetched: 2026-11-15
  quote: החלו לאסוף מסד נתונים על לוויתנאים בחופי ישראל וברחבי הים התיכון וגם במפרץ
    אילת
- claim: As part of its ongoing work it carries out surveys near the coast to study
    the commonest local species, the common bottlenose dolphin.
  url: https://immrac.com/%D7%90%D7%95%D7%93%D7%95%D7%AA-%D7%94%D7%A2%D7%9E%D7%95%D7%AA%D7%94/
  fetched: 2026-11-15
  quote: במסגרת פעילות העמותה השוטפת נערכים סקרים בקרבת החוף במטרה ללמוד את המין המקומי
    הנפוץ ביותר
- claim: It staffs a national 24/7 emergency network for real-time reports of marine
    mammals in distress, floating or stranded.
  url: https://immrac.com/%D7%90%D7%95%D7%93%D7%95%D7%AA-%D7%94%D7%A2%D7%9E%D7%95%D7%AA%D7%94/
  fetched: 2026-11-15
  quote: העמותה מאיישת רשת חירום לאומית 24/7 לדיווחים בזמן אמת על אודות יונקים ימיים
    במצוקה
- claim: It was formed and registered as an association (amuta).
  url: https://immrac.com/%D7%90%D7%95%D7%93%D7%95%D7%AA-%D7%94%D7%A2%D7%9E%D7%95%D7%AA%D7%94/
  fetched: 2026-11-15
  quote: וכך מתגבשת, מוקמת ונרשמת עמותת מחמל"י
- claim: It set up the Dolphin and Sea Center in Ashdod in 2016, which the Delphis
    association now operates.
  url: https://immrac.com/%D7%90%D7%95%D7%93%D7%95%D7%AA-%D7%94%D7%A2%D7%9E%D7%95%D7%AA%D7%94/
  fetched: 2026-11-15
  quote: שהוקם בשנת 2016 על ידי מחמל"י ומתופעל כיום על ידי עמותת דלפיס
- claim: A 2021 ACCOBAMS review says IMMRAC and Delphis receive dolphin sighting reports
    from the public.
  url: https://accobams.org/wp-content/uploads/2021/09/SC14.Doc37_Review-of-the-current-citizen-sciences-initiatives-in-the-ACCOBAMS-Area.pdf
  fetched: 2026-11-15
  quote: Today, dolphin sighting reports are either sent directly to members of IMMRAC
    / Delphis
