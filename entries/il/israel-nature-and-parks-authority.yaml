summary: Statutory body established under a 1963 Knesset law, protecting habitats and species
  and publishing GBIF observations, named alongside the ministry in 2022 as the biodiversity
  targets centre.
facts:
- claim: Established by law to fulfil the National Parks, Nature Reserves and Wildlife Protection
    laws.
  url: https://en.parks.org.il/about/
  fetched: '2026-11-08'
  quote: for the purpose of fulfilling the goals of the National Parks Law, the Nature Reserves
    and Commemoration Sites Law and the Wildlife Protection Law
- claim: Protects habitats, ecosystems and plant and animal diversity in reserves, parks and
    open spaces.
  url: https://en.parks.org.il/about/
  fetched: '2026-11-08'
  quote: The Israel Nature and Parks Authority protects nature, including habitats, ecosystems,
    and plant and animal diversity in nature reserves, national parks and open spaces.
- claim: The AI4Biodiversity project describes it as a government organisation that manages
    Israel's nature reserves and national parks.
  url: https://ai4biodiversity.haifa.ac.il/partners/
  fetched: '2026-11-08'
  quote: The Israel Nature and Parks Authority is a government organization that manages nature
    reserves and national parks in Israel.
- claim: The State Comptroller's May 2022 report named INPA and the ministry as the national
    centre for Israel's international biodiversity targets.
  url: https://library.mevaker.gov.il/sites/DigitalLibrary/Documents/2022/2022.5/EN/2022.5-211-Migvan-Biology-Taktzir-EN.pdf
  fetched: '2026-11-08'
  quote: the MEP and the Israel Nature and Parks Authority, which serve as the national center
    for the realization of Israel's international targets of biodiversity preservation
- claim: Tel Aviv University says vulture GPS transmitters send an alert to INPA when a bird
    stops moving or lands in a dangerous place.
  url: https://www.eurekalert.org/news-releases/1056413
  fetched: '2026-11-08'
  quote: The transmitters are connected to a system that sends an alert to the Israel Nature
    and Parks Authority
- claim: Listed in the GBIF registry as an Israeli data publisher.
  url: https://api.gbif.org/v1/organization?country=IL&limit=100
  fetched: '2026-11-08'
  quote: '"title":"Israel Nature and Parks Authority"'
- claim: Says it was established under a 1963 Knesset law to carry out the National Parks
    Law, the Nature Reserves and Commemoration Sites Law and the Wildlife Protection Law.
  url: https://en.parks.org.il/about/
  fetched: 2026-11-08
  quote: The Israel Nature and Parks Authority was established as two entities (which were
    unified in 1998), based on a law passed by the Knesset in 1963, for the purpose of fulfilling
    the goals of the National Parks Law, the Nature Reserves and Commemoration Sites Law and
    the Wildlife Protection Law.
- claim: GBIF lists it as a publisher endorsed by GBIF Israel.
  url: https://api.gbif.org/v1/organization/4f160e00-329d-11d9-8439-b8a03c50a862
  fetched: 2026-11-08
  quote: '"endorsementStatus":"ENDORSED","title":"Israel Nature and Parks Authority"'
