summary: Hungarian project running from 1 October 2024 to 30 September 2029, with a 970 million
  forint grant, to review the National Biodiversity Monitoring System and create the planned
  BÁRKA biotic data store.
facts:
- claim: The Ministry of Agriculture is the main beneficiary and carries out the project in
    partnership with the Herman Ottó Institute and the HUN-REN Centre for Ecological Research.
  url: https://kormany.hu/hirek/a-kehop-plusz-kereteben-elindult-a-biotika-projekt
  fetched: 2026-11-12
  quote: fő kedvezményezettje az Agrárminisztérium, amely a Herman Ottó Intézet Nonprofit
    Kft. és a HUN-REN Ökológiai Kutatóközpont partnerségével és széles kutatói bázis bevonásával
    valósítja meg
- claim: The project runs from 1 October 2024 to 30 September 2029.
  url: https://kormany.hu/hirek/a-kehop-plusz-kereteben-elindult-a-biotika-projekt
  fetched: 2026-11-12
  quote: A 2024. október 1. és 2029. szeptember 30. között megvalósuló „BIOTIKA” projekt
- claim: The review of the National Biodiversity Monitoring System will analyse the data gathered
    over its 20 to 25 years of operation and modernise its monitoring programmes and data
    processing.
  url: https://kormany.hu/hirek/a-kehop-plusz-kereteben-elindult-a-biotika-projekt
  fetched: 2026-11-12
  quote: A felülvizsgálat keretében átfogó elemzésre kerülnek az NBmR 20-25 éves működése
    alatt keletkezett adatok.
- claim: Its second main activity is creating the BÁRKA nature conservation data store, a
    nationally unified system for collecting and sharing biotic data.
  url: https://kormany.hu/hirek/a-kehop-plusz-kereteben-elindult-a-biotika-projekt
  fetched: 2026-11-12
  quote: A cél egy országosan egységes biotikai adatgyűjtő és -megosztó rendszer létrehozása
- claim: The planned BÁRKA store is described as a biodiversity data centre with built-in
    analysis tools and map display with GIS support.
  url: https://www.hermanottointezet.hu/kehop-biotika-projekt
  fetched: 2026-11-12
  quote: Egy egységes biodiverzitási adatközpont létrehozása, magas konnektivitással, beépített
    elemző eszközökkel és elemzés támogatással, beépített térképi megjelenítő eszköz készlettel
    és GIS támogatással.
- claim: The grant is 970 million forints, 85% from the European Regional Development Fund
    and 15% from the Hungarian state.
  url: https://www.hermanottointezet.hu/kehop-biotika-projekt
  fetched: 2026-11-12
  quote: A forrás 85%-át az Európai Regionális Fejlesztési Alap (ERFA) 15%-át pedig a Magyar
    Állam biztosítja
- claim: Réti-Michalkó Melinda is named as the project's professional project manager.
  url: https://kormany.hu/hirek/a-kehop-plusz-kereteben-elindult-a-biotika-projekt
  fetched: 2026-11-12
  quote: Réti-Michalkó Melinda szakmai projektvezető
