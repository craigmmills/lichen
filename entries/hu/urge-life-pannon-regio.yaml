summary: Ground squirrel conservation project running from 1 December 2025 to 1 March
  2033, budgeted at €9,791,425 with €7,343,568 EU support, planning colony records,
  health assessments and threat maps.
facts:
- claim: The project runs from 1 December 2025 to 1 March 2033 (87 months), with a
    budget of 9,791,425 euros, of which 7,343,568 euros is EU support.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: 'A projekt megvalósításának időtartama: 2025.12.01. – 2033.03.01. (87 hónap)'
- claim: Planned activities include drawing up and filling in record sheets for colonies
    as the basis of a conservation safety net for ground squirrel populations.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: kolóniákra vonatkozó „törzslapok” kialakítása és kitöltése
- claim: Planned activities include a repeatable assessment of colony health, including
    locating threats and making threat maps, and tracking negative effects.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: A kolóniák egészségi állapotának átfogó értékelése, többszempontú, általánosítható
    és ismételhető módszerekkel.
- claim: Planned activities include follow-up monitoring of the interventions and
    development and documentation of its methods.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: A beavatkozások tudásközpontú megalapozása és utólagos nyomon követése, illetve
    ezek módszertanának fejlesztése, dokumentálása.
