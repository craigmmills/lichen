- claim: Its main mission is research on biodiversity and ecosystems, aquatic and terrestrial.
  url: https://ecolres.hun-ren.hu/en/home/
  fetched: 2026-11-08
  quote: Our main mission is to conduct high-quality research on biodiversity and ecosystems, including
    aquatic and terrestrial life.
- claim: Its Institute of Ecology and Botany carries out public monitoring as well as basic research.
  url: https://ecolres.hun-ren.hu/en/home/
  fetched: 2026-11-08
  quote: In addition to its basic research activities, the institute carries out a number of public monitoring
    and applied research activities.
- claim: Its large-river monitoring covers bacterioplankton, phytoplankton, zooplankton, mussels and fish.
  url: https://ecolres.hun-ren.hu/kozcelu_feladatok/nagy-folyokon-vegzett-monitorozasok/
  fetched: 2026-11-08
  quote: Az HUN-REN Ökológiai Kutatóközpont nagy folyó monitorozásában bakterio-, fito-, zooplankton,
    kagyló, és halmonitorozás történik.
- claim: Its IAE Service and Environmental Monitoring Unit conducts surveys for the public monitoring
    programmes.
  url: https://ecolres.hun-ren.hu/en/iae-service-and-environmental-monitoring-unit/
  fetched: 2026-11-08
  quote: conducting surveys related to the public monitoring programmes
- claim: Its Large-scale Vegetation Ecology Research Group documents, models and predicts the effects
    of climate and land use change and biological invasion, using vegetation and environmental databases.
  url: https://ecolres.hun-ren.hu/en/kutatocsoportok/large-scale-vegetation-ecology-research-group/
  fetched: 2026-11-08
  quote: The focus of our interest is to document, model and predict the effects of climate and land use
    change and that of the biological invasion.
- claim: Lists among its research infrastructure the KISKUN LTER long-term ecological research site and
    the ER HTV database of the Hungarian Forest Reserve Programme.
  url: https://ecolres.hun-ren.hu/en/research/research-infrastructure/
  fetched: 2026-11-08
  quote: The ER HTV database of the Hungarian Forest Reserve Programme manages and helps to process data-flow
    services of the standard inventory data acquired from the permanent sampling plots (PSPs)
- claim: Says its task is research on terrestrial and aquatic ecosystems and that it studies and monitors
    how ecosystems function.
  url: https://ecolres.hun-ren.hu
  fetched: 2026-11-08
  quote: Vizsgáljuk és monitorozzuk az ökoszisztémák működését
