summary: Research centre studying aquatic and terrestrial ecosystems, mosquito and animal sound recognition,
  and public monitoring, with OpenAlex listing 801 ecology and conservation works since 2018.
facts:
- claim: Researchers of the centre, with Eötvös Loránd University and the University of Szeged, studied
    whether mosquito species can be told apart by wingbeat sound, as a step towards AI monitoring of hazardous
    mosquito species.
  url: https://hun-ren.hu/research_news/we-tell-what-it-is-from-its-buzz-artificial-intelligence-in-mosquito-monitoring-110026
  fetched: 2026-11-08
  quote: The findings of this recent study represent an important step toward enabling the effective application
    of artificial intelligence under real-world conditions for monitoring hazardous mosquito species.
- claim: A centre researcher’s 2024 Academy session abstract says the group uses machine learning to recognise
    invasive mosquito species in citizen science reports and identify environmental factors behind their
    spread.
  url: https://mta.hu/data/esemenyek/mtu2024/1121_5396_Mesters%C3%A9ges_intelligencia_a_hazai_%C3%B6kol%C3%B3gi%C3%A1ban_%C3%A9s_term%C3%A9szetv%C3%A9delemben_FZS.pdf
  fetched: 2026-11-08
  quote: Kutatásainkban gépi tanulásos módszereket használunk a fajok felismerésére
- claim: A centre researcher’s 2024 Academy session abstract discusses animal sounds and AI, citing convolutional
    neural networks for identifying and classifying animal sounds.
  url: https://mta.hu/data/esemenyek/mtu2024/1121_5396_Mesters%C3%A9ges_intelligencia_a_hazai_%C3%B6kol%C3%B3gi%C3%A1ban_%C3%A9s_term%C3%A9szetv%C3%A9delemben_FZS.pdf
