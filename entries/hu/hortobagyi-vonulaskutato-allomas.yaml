summary: Songbird migration research station, built by the Hortobágy National Park
  Directorate within an EU-funded project, where songbirds are mist-netted and ringed
  to study population change and migration strategies.
facts:
- claim: Songbirds are caught for scientific purposes with mist nets at the station
    and individually ringed.
