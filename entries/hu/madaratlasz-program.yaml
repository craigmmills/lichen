facts:
- claim: Created in 2015 by MME's Monitoring Centre to collect data on bird species occurring in Hungary.
  url: https://map.mme.hu/
  fetched: 2026-11-08
  quote: A Madáratlasz Program adatbázist a Magyar Madártani és Természetvédelmi Egyesület (MME) Monitoring
    Központja hozta létre 2015-ben a Magyarországon előforduló madárfajok adatainak gyűjtésére.
- claim: Served the Hungarian data collection of the European Breeding Bird Atlas (EBBA2) published in
    2020.
  url: https://map.mme.hu/
  fetched: 2026-11-08
  quote: A MAP szolgálta ki a 2020-ban megjelent Európa Fészkelő Madarainak Atlasza (EBBA2) program magyarországi
    adatgyűjtését
- claim: Has continued collecting Hungarian bird data since those projects ended.
  url: https://map.mme.hu/
  fetched: 2026-11-08
  quote: A MAP pedig a két projekt lezárását követően is megállás nélkül gyűjti Magyarország madártani
    adatait.
- claim: The site shows a total of 60,766,444 data records.
  url: https://map.mme.hu/
  fetched: 2026-11-08
  quote: 'Összes adatrekord: 60766444'
