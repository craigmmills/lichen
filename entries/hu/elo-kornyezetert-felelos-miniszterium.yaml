summary: Hungarian ministry described on the state nature conservation website as the top body of state
  nature conservation, whose deputy state secretariat directs the national park directorates; it partners
  with OpenBioMaps.
facts:
- claim: The state nature conservation website says the ministry is the top body of state nature conservation
    in Hungary.
  url: https://termeszetvedelem.hu/category/intezmenyrendszer/termeszetvedelemert-felelos-helyettes-allamtitkarsag
  fetched: 2026-11-08
  quote: Az Élő Környezetért Felelős Minisztérium (ÉKFM) az állami természetvédelem csúcsszerve.
- claim: Its deputy state secretariat for nature conservation directs and supervises the national park
    directorates and coordinates the implementation of international nature conservation conventions.
  url: https://termeszetvedelem.hu/category/intezmenyrendszer/termeszetvedelemert-felelos-helyettes-allamtitkarsag
  fetched: 2026-11-08
  quote: nemzetközi természetvédelmi egyezmények végrehajtásának koordinációja
- claim: Its organisational rules were set by a ministerial instruction dated 15 September 2026.
  url: https://termeszetvedelem.hu/category/intezmenyrendszer/termeszetvedelemert-felelos-helyettes-allamtitkarsag
  fetched: 2026-11-08
  quote: az Élő Környezetért Felelős Minisztérium Szervezeti és Működési Szabályzatáról szóló 3/2026.
    (IX. 15.) ÉKFM utasítás
- claim: The official state nature conservation website names the ministry and its Deputy State Secretariat
    for Nature Conservation in its footer.
  url: https://termeszetvedelem.hu/nemzeti-park-igazgatosagok/
