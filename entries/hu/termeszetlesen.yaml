summary: Public data-collection programme of five simple schemes, run by MME through
  the Turdus app and created with LIFE NGO4GD support, covering feeder birds, spring
  wildlife, swallows, storks and dead animals.
facts:
- claim: TermészetLesen is a data-collection programme for the public that anyone
    can join without prior natural history training, made up of five simple schemes.
  url: https://www.mme.hu/termeszetlesen
  fetched: 2026-11-15
  quote: A TermészetLesen program egy lakosságnak szóló adatgyűjtő program, amelyben
    bárki részt vehet előzetes természetismereti képzés nélkül.
- claim: Its creation was supported by the LIFE NGO4GD (HU/000037) grant.
  url: https://www.mme.hu/termeszetlesen
  fetched: 2026-11-15
  quote: A TermészetLesen program létrejöttét a LIFE NGO4GD(HU/000037) "Közösen a
    természetért" elnevezésű pályázat támogatta.
- claim: MME says it set out to create the programme through the TermészetLesen module
    of the Turdus app, with schemes for winter feeder birds, spring wildlife, swallows
    (Fecskeles), storks (Gólyales) and dead animals (Totem).
