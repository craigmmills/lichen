summary: Bird observatory run by Száz Völgy Természetvédelmi Egyesület, operating
  since 1991 and founded as Ferencmajori Madárvárta in 2013, with ringing programmes
  including Constant Effort Site and Actio Hungarica.
facts:
- claim: The page describes the observatory as operating since 1991, but dates its
    founding as Ferencmajori Madárvárta to 2013, incorporating the traditional bird
    camp. Its main aims include protocol-based bird marking for scientific purposes.
  url: https://szazvolgy.hu/ferencmajori-madarvarta/
  fetched: 2026-11-15
  quote: Az 1991 óta működő Madárvárta legfontosabb céljai
- claim: Its programmes include protocol-based spring, summer and autumn ringing over
    5 and 16 weeks.
  url: https://szazvolgy.hu/ferencmajori-madarvarta/
  fetched: 2026-11-15
  quote: 'tavaszi-, nyári-, őszi madárgyűrűzés protokoll szerinti: 5, illetve 16 héten
    keresztül'
- claim: It runs Constant Effort Site (CES) ringing from April to July, nine times
    at ten-day intervals.
  url: https://szazvolgy.hu/ferencmajori-madarvarta/
  fetched: 2026-11-15
  quote: 'CES – Állandó Ráfordítású Gyűrűzés: április–július, kilenc alkalommal tíznaponta'
