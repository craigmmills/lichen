facts:
- claim: The national park directorates are central budgetary bodies operating as central offices under
    the direction of the minister responsible for nature conservation.
  url: https://termeszetvedelem.hu/nemzeti-park-igazgatosagok/
  fetched: 2026-11-08
  quote: 'A nemzeti park igazgatóságok a természetvédelemért felelős miniszter (a továbbiakban: miniszter)
    irányítása alá tartozó, központi hivatalként működő központi költségvetési szervek.'
- claim: The ten directorates have separate operating areas that together cover the whole country.
  url: https://termeszetvedelem.hu/nemzeti-park-igazgatosagok/
  fetched: 2026-11-08
  quote: A tíz NPI egymástól elkülönülő működési területe az egész ország területét lefedi.
- claim: Their state tasks include conservation management, asset management and conservation research.
  url: https://termeszetvedelem.hu/nemzeti-park-igazgatosagok/
  fetched: 2026-11-08
  quote: a természetvédelmi kezeléssel kapcsolatos feladatokat; a vagyonkezelői feladatokat; a természetvédelmi
    kutatással kapcsolatos feladatokat;
- claim: Their state tasks include keeping the register of protected natural areas, natural assets and
    individual landscape values.
  url: https://termeszetvedelem.hu/nemzeti-park-igazgatosagok/
