summary: Hungarian branch of the international WWF foundation, active since 1991, which says it used AI
  to help process LECA camera trap data and monitored lynx in Slovak Karst National Park from 2023 to
  2026.
facts:
- claim: Says it used artificial intelligence to help process information from some of the LECA camera
    traps.
  url: https://wwf.hu/ketmillio-ora-a-vadonban-800-megvedett-haszonallat-nagyragadozok-projekt/
  fetched: 2026-11-08
  quote: A kamerák egy részéből érkező információk feldolgozásához a mesterséges intelligencia segítségét
    is igénybe vettük
- claim: Its partners operated 40 wildlife cameras, mainly in the Heves-Borsod hills, the Mátra, the western
    Bükk and Aggtelek National Park.
  url: https://wwf.hu/ketmillio-ora-a-vadonban-800-megvedett-haszonallat-nagyragadozok-projekt/
  fetched: 2026-11-08
  quote: 40 db vadkamerát üzemeltettek a WWF partnerei
- claim: The Hungarian organisation of the international foundation, operating since 1991.
  url: https://wwf.hu/rolunk/
  fetched: 2026-11-08
  quote: A WWF Magyarország a nemzetközi alapítvány hazai szervezete, amely 1991-ben kezdte meg működését.
- claim: Its conservation work covers wetlands, especially river and floodplain systems, natural forests,
    and protected and threatened habitats and species.
  url: https://wwf.hu/rolunk/
  fetched: 2026-11-08
  quote: Természetvédelmi munkánk kiterjed a vizesélőhelyek – kiemelten a folyóvízi és ártéri rendszerek
    – és a természetes erdeink védelmére
- claim: Says it is a member of WWF CEE, formerly the WWF Danube-Carpathian Programme Office.
  url: https://wwf.hu/rolunk/
  fetched: 2026-11-08
  quote: A WWF Magyarország továbbá a WWF CEE tagja (korábban WWF Duna-Kárpátok Regionális Iroda).
- claim: WWF Slovakia, WWF Hungary and partners monitored the Eurasian lynx in Slovak Karst National Park
    between 2023 and 2026.
  url: https://wwf.hu/eltunhet-az-eurazsiai-hiuz-magyarorszagrol/
  fetched: 2026-11-08
  quote: A WWF Szlovákia, a WWF Magyarország és partnerszervezeteik 2023 és 2026 között figyelték meg
    a fajt a Szlovák-karszt Nemzeti Parkban
- claim: The monitoring was carried out under the EU co-financed LECA project and combined camera trapping
    and genetic analysis.
  url: https://wwf.hu/eltunhet-az-eurazsiai-hiuz-magyarorszagrol/
  fetched: 2026-11-08
  quote: beleértve a kameracsapdázást és a genetikai elemzést
- claim: Its large carnivore expert says that between 2023 and 2025 more than 100 camera traps on the
    Hungarian side of the study area recorded mainly wolves and occasionally bears.
  url: https://wwf.hu/eltunhet-az-eurazsiai-hiuz-magyarorszagrol/
  fetched: 2026-11-08
  quote: 2023 és 2025 között több mint 100 vadkamerával elsősorban farkasokat, alkalmanként medvéket rögzítettünk
- claim: Lists among its field projects a comprehensive survey of the forests, birds, bats and insects
    of the North Hungarian Mountains from 2013 to 2016, with universities, national parks and forestry
    companies.
  url: https://wwf.hu/erdok/terepi-projektjeink/
  fetched: 2026-11-08
  quote: Az Északi-középhelység erdeinek, madarainak, denevéreinek és rovarainak átfogó kutatása egyetemek,
    nemzeti parkok és erdőgazdaságok közreműködésével.
- claim: Says it works with the national park directorates concerned on field observation of large carnivores.
  url: https://wwf.hu/nagyragadozok/mit-tesz-a-wwf-magyarorszag/
  fetched: 2026-11-08
  quote: együttműködünk az érintett nemzeti park igazgatóságokkal a nagyragadozók terepi megfigyelésében
- claim: Operates under the auspices of WWF CEE.
  url: https://wwf.hu/nagyragadozok/mit-tesz-a-wwf-magyarorszag/
  fetched: 2026-11-08
  quote: A WWF Magyarország a WWF CEE égisze alatt működő szervezet.
