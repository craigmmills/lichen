summary: EU LIFE project run by MME for 2025 to 2031 to restore four salt lakes, with
  planned AI software to detect indicator bird nests from thermal camera night flights.
facts:
- claim: MME won EU LIFE funding to restore four salt lakes on more than 1,000 ha
    between 2025 and 2031, together with the Kiskunság National Park Directorate and
    Sándorfalva town council.
  url: https://mme.hu/hirek/2025/11/17/bemutatkozik_az_mme_uj_life_projektje_0
  fetched: 2026-11-12
  quote: Az MME támogatást nyert az EU LIFE pályázati alapjától arra a célra, hogy
    2025 és 2031 között
- claim: A key aim is AI-based software that detects nests of indicator bird species
    on automated night flights with thermal cameras and monitors breeding success.
  url: https://mme.hu/hirek/2025/11/17/bemutatkozik_az_mme_uj_life_projektje_0
  fetched: 2026-11-12
  quote: Fontos cél egy, – olyan mesterséges intelligencia-alapú –, szoftver fejlesztése,
    amely az indikátor madárfajok fészkét éjszakai, automatizálható repülések alkalmával,
    hőkamera alkalmazásával felderíti
- claim: The project will survey the country's salt lakes and marshes by drone and
    make 3D maps to model water management.
  url: https://mme.hu/hirek/2025/11/17/bemutatkozik_az_mme_uj_life_projektje_0
