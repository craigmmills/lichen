summary: A research infrastructure with a farmhouse research station, weather station and experimental
  area at Fülöpháza, where researchers study dry grasslands and wetlands; the centre says Hungary is not
  a full eLTER member.
facts:
- claim: A research infrastructure that includes the Fejes Farmhouse research station at Fülöpháza with
    its meteorological station and experimental area.
  url: https://ecolres.hun-ren.hu/en/research/research-infrastructure/
  fetched: 2026-11-08
  quote: KISKUN-LTER is a research infrastructure with property, equipment and virtual parts. These include
    on the one hand Fejes Farmhouse research station at Fülöpháza, with its associated meteorological
    station and experimental area.
- claim: The centre's researchers study the functioning of dry grasslands, wetlands and mosaic landscapes
    there, building on decades-long time series.
  url: https://ecolres.hun-ren.hu/nemzetkozi-egyuttmukodes-az-okologiai-kutatasok-szolgalataban-kutatoink-reszvetele-az-elter-zaro-konzorciumi-talalkozon/
  fetched: 2026-11-08
  quote: ahol az ÖK kutatói több évtizedes idősorokra építve vizsgálják a szárazgyepek, vizes élőhelyek
    és mozaikos tájak működését
- claim: The centre says Hungary does not currently hold full membership of the eLTER research infrastructure,
    although Hungarian researchers contribute work and data to the network.
  url: https://ecolres.hun-ren.hu/nemzetkozi-egyuttmukodes-az-okologiai-kutatasok-szolgalataban-kutatoink-reszvetele-az-elter-zaro-konzorciumi-talalkozon/
