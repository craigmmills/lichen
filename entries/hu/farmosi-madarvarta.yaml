summary: Bird observatory at Farmos, described in 2019 and 2020 as collecting breeding
  and passage data throughout the year, and reported renovated in 2022.
facts:
- claim: A page dated 2019 and 2020 describes the Duna-Ipoly National Park Directorate's
    observatory at Farmos collecting breeding and passage bird data throughout the
    year, on selected winter weekends and daily in a ringing camp from the last week
    of July to September.
