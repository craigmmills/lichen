- claim: In 2022 the directorate reported renovating the Farmos observatory as a Natura
    2000 demonstration site; the converted farm building serves the bird ringing demonstration
    site.
  url: https://www.dunaipoly.hu/hu/hir/megujult-a-farmosi-madarvarta-es-az-egreskatai-major
  fetched: 2026-11-12
  quote: A Farmosi Madárvárta Natura 2000 bemutatóhely a környék környezeti nevelési
    és ökoturisztikai bázisaként és az önkéntes természetvédelmi munka központjaként
    szolgál.
