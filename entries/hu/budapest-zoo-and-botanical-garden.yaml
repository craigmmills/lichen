summary: Municipal zoo in Budapest reporting transmitter implants in over 100 meadow
  vipers by its vets and participation in the 2019 to March 2025 LIFE HUNVIPHAB project.
facts:
- claim: The zoo is an independent municipal budgetary institution maintained and
    supervised by the Municipality of Budapest.
  url: https://zoobudapest.com/en/impressum/
  fetched: 2026-11-15
  quote: is an independent municipal budgetary institution that operates and manages
    its own budget;
- claim: Its address is 1146 Budapest, Állatkerti krt. 6-12.
  url: https://zoobudapest.com/en/impressum/
  fetched: 2026-11-15
  quote: 'Our address: 1146 Budapest, XIV. ker. Állatkerti krt. 6-12.'
- claim: Over the past two decades the zoo's vets have surgically implanted radio-telemetry
    transmitters in more than 100 meadow vipers, which the zoo says has increased
    knowledge of the species' habitat use.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: Az elmúlt két évtized során, 100 feletti egyed testüregébe helyeztek be az
    állatorvosaink rádiótelemetriás adókat sebészeti módszerrel
- claim: The zoo says it took part as a partner in the MME-coordinated LIFE HUNVIPHAB
    meadow viper project, which ran from 2019 to March 2025.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: a Magyar Madártani és Természetvédelmi Egyesület által koordinált Rákosi
    vipera LIFE programnak a partnerei és részesei vagyunk
- claim: In the ground squirrel project the zoo's specialists take part in breeding
    and veterinary supervision of ground squirrels.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: A programban a Fővárosi Állat- és Növénykert szakemberei az ürgék szaporításában
    és állategészségügyi felügyeletében vesznek részt
- claim: It plans to use radio-telemetry transmitters on the Hungarian birch mouse
    to learn its habitat use, and has tested the technique on house mice as a model
    species.
  url: https://zoobudapest.com/termeszetvedelem/aktualis-life-programok/
  fetched: 2026-11-15
  quote: Ennél a fajnál is tervezzük a rádiótelemetriás adók alkalmazását, hogy felderítsük
    az eddig még nem ismert élőhelyhasználatát ennek a fajnak.
