facts:
- claim: Founded in 2000 with the main aim of operating the Kolon-tó bird observatory,
    which Kiskunság National Park set up in 1999.
  url: https://birdingstation.hu/kolon-tavi-madarvarta/
  fetched: 2026-11-12
  quote: Legfőbb célunk a kezdetektől az izsáki Kolon-tavi Madárvárta üzemeltetése,
    melyet a Kiskunsági Nemzeti Park 1999-ben hozott létre.
- claim: Runs daily songbird capture and ringing on a 600 m standard net line from
    10 July to autumn each year.
  url: https://birdingstation.hu/kolon-tavi-madarvarta/
  fetched: 2026-11-12
  quote: Minden évben július 10-től őszig mindennapos énekesmadár befogást és gyűrűzést
    végzünk ezen a hálófelületen.
- claim: In 2017 birds were ringed on 88 days of the standard migration period, 7,891
    birds in all.
  url: https://birdingstation.hu/kolon-tavi-madarvarta/
  fetched: 2026-11-12
  quote: Ebben az időszakban összesen 7891 madárra került egyedi számozású ornitológiai
    jelölőgyűrű.
