  fetched: 2026-11-08
  quote: 'HNP Igazgatóság működési területe: 1 747 744 hektár'
- claim: In 2011 the directorate started the Hortobágy Bird Monitoring on the Hortobágy Special Protection
    Area, based on its own resources.
  url: https://www.hnp.hu/uploads/files/igazgatosag/HNPI%202015.%20%C3%A9vi%20besz%C3%A1mol%C3%B3.pdf
