summary: CNRS-run research programme in French Guiana on tropical biodiversity, supported
  by the French state with close to 18 million over 15 years, using camera traps,
  eco-acoustics and environmental DNA.
facts:
- claim: Based in French Guiana and carried by the CNRS, it studies the origin and
    maintenance of diversity in tropical ecosystems.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: le Labex CEBA, basé en Guyane française et porté par le CNRS
- claim: The ANR project page says the Labex, set up in French Guiana, brings together
    more than 300 researchers in 12 research units and 10 higher education and research
    institutions.
  url: https://anr.fr/ProjetIA-10-LABX-0025
  fetched: 2026-11-15
  quote: le LabEx CEBA fédère aujourd’hui plus de 300 chercheurs répartis au sein
    de 12 unités de recherche
- claim: Supported by the French state under France 2030 with close to 18 million
    over 15 years, operated by the ANR.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: soutenu par l’Etat au titre de France 2030 à hauteur de près de 18 millions
    sur 15 ans et opéré par l’ANR
- claim: Its monitoring relies on a network of 14 permanently monitored forest sites,
    open databases and the Nouragues research station, among other infrastructure.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: dont un réseau de 14 sites forestiers suivis en permanence
- claim: Has used camera traps on eight terrestrial species to estimate forest fauna
    population densities.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: notamment l’utilisation de pièges photo sur huit espèces terrestres
- claim: Has deployed eco-acoustic methods, where an unsupervised deep-learning method
    with clustering of manually labelled bird sounds improved performance.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: Une méthode non-supervisée par apprentissage profond et le regroupement de
    sons d'oiseaux étiquetés manuellement a considérablement amélioré les performances
  ai_type: deep-learning
- claim: The eco-acoustic method it describes is unsupervised.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: Une méthode non-supervisée par apprentissage profond
  ai_type: ml-unsupervised
- claim: Its scientists use environmental DNA to monitor biodiversity in French Guiana.
  url: https://anr.fr/actus/details/news/plongee-au-coeur-de-quatorze-annees-de-recherche-sur-la-biodiversite-amazonienne-avec-le-laboratoire/
  fetched: 2026-11-15
  quote: Les scientifiques du CEBA utilisent la technique de l’ADN environnemental
    pour relever ce challenge.
