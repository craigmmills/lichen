summary: French Guiana’s first reserve, created in 1992 and managed solely by GEPOG
  since 2016, reports frigatebird and dolphin monitoring and a turtle protocol developed
  in 2019.
facts:
- claim: Its history page says the decree creating the reserve was published in 1992,
    making it the first reserve in French Guiana.
  url: https://www.reserve-connetable.com/la-reserve/historique/
  fetched: 2026-11-14
  quote: En 1992, le décret de création de la Réserve Naturelle de l’Ile du Grand-Connétable
    paraît ; la première réserve en Guyane est ainsi créée.
- claim: Its history page says GEPOG became its sole manager in 2016.
  url: https://www.reserve-connetable.com/la-reserve/historique/
  fetched: 2026-11-14
  quote: en 2016 le GEPOG devient l’unique gestionnaire
- claim: Its 2022 activity report lists monitoring of the breeding of magnificent
    frigatebirds, and reports a sub-colony of 173 nests followed.
  url: https://www.reserve-connetable.com/wp-content/uploads/2024/03/Rapport_activites_RNN-Connetable_2022.pdf
  fetched: 2026-11-14
  quote: Une sous-colonie de 173 nids a été suivie.
- claim: Its 2022 activity report says the reserve developed a photo-identification
    monitoring protocol for young green turtles in 2019.
  url: https://www.reserve-connetable.com/wp-content/uploads/2024/03/Rapport_activites_RNN-Connetable_2022.pdf
  fetched: 2026-11-14
  quote: La réserve a développé en 2019 un protocole de suivi par photo-identification
    des jeunes
- claim: Its 2022 activity report lists monitoring of the Guiana dolphin population.
  url: https://www.reserve-connetable.com/wp-content/uploads/2024/03/Rapport_activites_RNN-Connetable_2022.pdf
  fetched: 2026-11-14
