summary: Aerial census programme for grey seals in Iceland, carried out at regular
  intervals since 1982, which put the 2022 population at 6,697 animals.
facts:
- claim: The MFRI grey seal census page says aerial censuses in Iceland have been
    carried out at regular intervals since 1982. In its account mentioning an estimate
    underway in 2017, it states an aim of conducting aerial surveys every other year.
  url: https://www.hafogvatn.is/en/research/harbour-seal/grey-seal-census
  fetched: 2026-11-15
  quote: The current aim is therefore to conduct aerial surveys to produce estimates
    for the size of the Icelandic grey seal population every other year.
- claim: An MFRI news item of 22 August 2024 announced a population estimate based
    on an aerial survey in 2022 and said regular estimates since 1982 rest on autumn
    pup counts.
  url: https://www.hafogvatn.is/en/about/news-announcements/population-estimate-of-grey-seals-in-iceland
  fetched: 2026-11-15
  quote: Regular population estimates have been conducted since 1982 and are based
    on pup counts in the autumn.
- claim: The news item puts the total grey seal population in 2022 at 6,697 animals.
  url: https://www.hafogvatn.is/en/about/news-announcements/population-estimate-of-grey-seals-in-iceland
  fetched: 2026-11-15
  quote: Based on the pup production, the total grey seal population size in 2022
    was estimated to be 6697 animals
