summary: Public limited company formed under a 2006 act from three state food research
  institutions, which says it is developing eDNA methods.
facts:
- claim: Its about page says a 2006 law allowed a public limited company to be set
    up that merged three state institutions for food research and development, and
    that it operates under Act no. 68/2006 on Matís ohf.
  url: https://matis.is/en/um-matis/
  fetched: 2026-11-13
  quote: In 2006, a law was passed by the Alþingi allowing the establishment of a
    public limited company that merged under one umbrella three state institutions
    specializing in research and development in the food industry.
- claim: The same page says its activities fall under the Ministry of Industries and
    Innovation.
  url: https://matis.is/en/um-matis/
  fetched: 2026-11-13
  quote: Its activities today fall under the Ministry of Industries and Innovation.
- claim: Its environmental research page says it has put growing emphasis on developing
    eDNA methods, for uses that include monitoring the effects of seaweed farming
    on benthic ecosystems and mapping new species.
  url: https://matis.is/en/?p=35784
  fetched: 2026-11-13
  quote: There has also been a growing emphasis on the development of the eDNA methodology,
    which will be useful, for example, in monitoring the effects of seaweed farming
    on benthic ecosystems at pens, mapping new species
- claim: A July 2026 news item says it leads the VS-eDNA project, funded by the Ministry
    of Industries, on marine biodiversity in the waters around Iceland.
  url: https://matis.is/en/frettir/matis-a-pisces-radstefnunni-i-kanada/
  fetched: 2026-11-13
  quote: Matís also leads the VS-eDNA project, funded by the Ministry of Industries,
    which focuses on marine biodiversity in the waters surrounding Iceland.
- claim: The same item says it leads the European project BioProtect, which aims to
    develop methods and technical solutions for decisions on using or conserving marine
    areas.
  url: https://matis.is/en/frettir/matis-a-pisces-radstefnunni-i-kanada/
  fetched: 2026-11-13
  quote: Matís leads the European project BioProtect which aims to develop methodologies
    and technical solutions to facilitate decision-making on the utilisation or conservation
    of marine areas.
- claim: Gives its Reykjavík address.
