  results.
facts:
- claim: A notice dated 25 July 2023 announced that the centre would hold the Great
    Seal Count at Hvammstanga on 30 July 2023.
  url: https://selasetur.is/is/page/8
  fetched: 2026-11-13
  quote: verður Selatalningin mikla haldin á vegum Selaseturs Íslands á Hvammstanga
- claim: The July 2023 notice said the count would cover seals on Vatnsnes and Heggstaðanes,
    with sections about 2 to 7 km long.
  url: https://selasetur.is/is/page/8
  fetched: 2026-11-13
  quote: Talningin felst í því að telja seli á Vatnsnesi og Heggstaðanesi
- claim: The July 2023 notice said the count aimed to support further research by
    gathering knowledge on seal numbers in the area and to develop sustainable wildlife-watching
    tourism.
  url: https://selasetur.is/is/page/8
  fetched: 2026-11-13
  quote: Markmið með selatalningunni er að styðja við frekari rannsóknir, með því
    að afla þekkingar á fjölda sela á þessum slóðum
