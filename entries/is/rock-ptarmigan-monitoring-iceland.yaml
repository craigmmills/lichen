summary: Annual ptarmigan population monitoring run by the Natural Science Institute
  with the Westfjords Nature Research Centre, with organised counts since 1963 and
  2,325 cock birds seen in spring 2025.
facts:
- claim: A 2025 memo says the spring 2025 ptarmigan counts run by the Natural Science
    Institute are finished.
  url: https://www.ni.is/sites/default/files/2025-06/minnisblad-rjupnatalningar-2025.pdf
  fetched: 2026-11-13
  quote: Rjúpnatalningum á vegum Náttúrufræðistofnunar vorið 202 5 er lokið
- claim: The memo says 2,325 cock ptarmigan were seen and that the counts were done
    in cooperation with the Westfjords Nature Research Centre, among others.
  url: https://www.ni.is/sites/default/files/2025-06/minnisblad-rjupnatalningar-2025.pdf
  fetched: 2026-11-13
  quote: Alls sáust 2325 karrar. Talningarnar voru unnar í samvinnu við Náttúrustofu
    Vestfjarða,
- claim: The memo says organised ptarmigan counts began in 1963.
  url: https://www.ni.is/sites/default/files/2025-06/minnisblad-rjupnatalningar-2025.pdf
  fetched: 2026-11-13
  quote: Skipulagðar rjúpnatalningar hófust 1963
- claim: The memo describes the work as annual monitoring of the ptarmigan population,
    which includes measuring age ratios in the hunted and breeding populations.
  url: https://www.ni.is/sites/default/files/2025-06/minnisblad-rjupnatalningar-2025.pdf
  fetched: 2026-11-13
  quote: þættir í árlegri vöktun rjúpnastofnsins eru mælingar á aldurshlutföllum í
    veiði- og varpstofni.
