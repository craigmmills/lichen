facts:
- claim: The institute's main role is fundamental research on Icelandic nature, collecting geospatial
    and geographical baseline data, and operating a research station by Lake Mývatn.
  url: https://www.natt.is/en/about/role-and-organisation
  fetched: 2026-11-12
  quote: The institute's main role is to conduct fundamental research on Icelandic nature, collect and
    process geospatial and geographical baseline data on the country, as well as operate a nature research
    station by Lake Mývatn.
- claim: Its tasks include monitoring key elements of Icelandic nature where no other agency is assigned
    that monitoring.
  url: https://www.natt.is/en/about/role-and-organisation
  fetched: 2026-11-12
  quote: be responsible for monitoring key elements of Icelandic nature, insofar as such monitoring is
    not assigned to other agencies by law or regulation
- claim: It manages bird ringing, for which it holds sole authority in Iceland.
  url: https://www.natt.is/en/about/role-and-organisation
  fetched: 2026-11-12
  quote: manage bird ringing, for which the institute holds the sole authority in Iceland
- claim: It operates and maintains the national spatial data portal under the Act on the Infrastructure
    for Spatial Information.
  url: https://www.natt.is/en/about/role-and-organisation
  fetched: 2026-11-12
  quote: implement the Act on the Infrastructure for Spatial Information, including the operation, maintenance,
    and technical development of the national spatial data portal
- claim: Its address is Smiðjuvellir 28, Akranes.
  url: https://www.natt.is/en/about/role-and-organisation
  fetched: 2026-11-12
  quote: Smiðjuvellir 28
- claim: On 12 November 2026, the institute's home page announced a greylag goose count planned for 14
    and 15 November 2026 as part of population monitoring.
  url: https://www.natt.is
  fetched: 2026-11-12
  quote: Talningin er liður í vöktun grágæsastofnsins.
