summary: Bird ringing programme begun in 1921, run by the Natural Science Institute of Iceland since 1932,
  which has sole legal authority to ring wild birds, with ringing done by permitted volunteers.
facts:
- claim: Bird ringing in Iceland began in 1921, and the institute has been responsible for it since 1932.
  url: https://www.natt.is/node/27971
  fetched: 2026-11-12
  quote: Bird ringing in Iceland began in 1921. From 1932, the IINH has had responsibility for bird ringing
    in Iceland.
- claim: Under Act 64/1994 the institute has sole authority to ring or mark wild birds in Iceland.
  url: https://www.natt.is/node/27971
  fetched: 2026-11-12
  quote: The IINH has the sole authority to ring or otherwise mark wild birds in Iceland.
- claim: Ringing is done by volunteer bird enthusiasts and ornithologists holding a ringing permit.
  url: https://www.natt.is/node/27971
  fetched: 2026-11-12
  quote: Bird ringing is carried out by bird enthusiasts and ornithologists who have received the necessary
    ringing permit
