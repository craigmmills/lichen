summary: EU-funded project coordinated by Matís with 18 partners from 8 countries
  and 8 million euros, planning an Area-Based Management Decision Support Framework
  to be demonstrated at five study sites.
facts:
- claim: Matís's news of 15 May 2024 says BioProtect is a newly funded EU project,
    coordinated by Matís, with 18 partners from 8 countries and 8 million euros.
  url: https://matis.is/news/eu-funded-bioprotect-initiative-launches-to-restore-protect-marine-biodiversity-in-the-arctic-atlantic-oceans
  fetched: 2026-11-15
  quote: Coordinated by MATIS in Iceland, the 8 million EUR bring together 18 partners
    from 8 countries.
- claim: The same page says the project will consolidate its solutions into an Area-Based
    Management Decision Support Framework, demonstrated at five study sites in Norway,
    Iceland, Ireland, the Azores and Portugal.
  url: https://matis.is/news/eu-funded-bioprotect-initiative-launches-to-restore-protect-marine-biodiversity-in-the-arctic-atlantic-oceans
  fetched: 2026-11-15
  quote: The project will consolidate these solutions into an Area-Based Management
    Decision Support Framework (ABM-DSF), which will be demonstrated at five different
    study sites across Europe, including Norway, Iceland, Ireland, the Azores, and
    Portugal.
- claim: A Matís page says the project plans to monitor the sea's biological diversity
    and to map human use and impact on sea areas and species.
  url: https://matis.is/en/?p=52558
  fetched: 2026-11-15
  quote: The biological diversity of the sea will be monitored so that it will be
    possible to account for its status and predict possible changes.
- claim: An MFRI news item of 9 November 2024 said BioProtect was seeking five regions
    for grants of up to 100,000 euros each and technical support to implement and
    enhance Area-Based Management tools developed by the project and tested in its
    demonstration sites.
  url: https://hafogvatn.is/en/about/news-announcements/bioproject-seeks-regions-to-receive-grants
  fetched: 2026-11-15
  quote: BioProtect is seeking 5 regions to receive grants of up to 100.000 EUR each
    and technical support to implement and enhance Area-Based Management tools developed
    by the BioProtect project and tested in the demonstration sites .
