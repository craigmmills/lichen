  habitat mapping as a priority, and attempted minke whale tagging in 2024.
facts:
- claim: Its about page says it is a government institute under the Ministry of Industries.
  url: https://www.hafogvatn.is/en/about
  fetched: 2026-11-13
  quote: Marine and Freshwater Research Institute (MFRI) is a government institute
    under the auspices of the Ministry of Industries (Atvinnuvegaráðuneytið).
- claim: The same page says it gives advice on sustainable use and protection of the
    environment with an ecosystem approach by monitoring marine and freshwater ecosystems.
  url: https://www.hafogvatn.is/en/about
  fetched: 2026-11-13
  quote: providing advice on sustainable use and protection of the environment with
    an ecosystem approach by monitoring marine and freshwater ecosystems
- claim: The same page lists seafloor and habitat mapping among its main research
    priorities.
  url: https://www.hafogvatn.is/en/about
  fetched: 2026-11-13
  quote: research on fishing technology and seafloor and habitat mapping
- claim: An 11 October 2024 news item says it had recently attempted to tag minke
    whales in Eyjafjörður as part of MinTag, a project under the North Atlantic Marine
    Mammal Commission (NAMMCO).
  url: https://www.hafogvatn.is/en/about/news-announcements/category/1?page=9
  fetched: 2026-11-13
  quote: The tagging is a part of project called MinTag and is under the North Atlantic
    Marine Mammal Commission, NAMMCO.
