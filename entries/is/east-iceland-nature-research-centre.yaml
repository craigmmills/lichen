summary: Regional nature research centre in Neskaupstaður, established by regulation
  with state support, which reported GPS transmitters on more than 20 pink-footed
  geese in the East Iceland highlands.
facts:
- claim: Regulation 384/1994 says the centre is to be run in Neskaupstaður, owned
    and run by Neskaupstaður and other municipalities in the East Iceland constituency
    that join, with support from the state treasury.
  url: https://island.is/reglugerdir/nr/0384-1994
  fetched: 2026-11-13
  quote: Starfrækt skal Náttúrustofa Austurlands í Neskaupstað. Neskaupstaður og önnur
    sveitarfélög í Austurlandskjördæmi sem gerast kunna aðilar eiga og reka stofuna
    með stuðningi ríkissjóðs.
- claim: An item dated 26 August 2026 on its home page says it had GPS transmitters
    on more than 20 pink-footed geese across the East Iceland highlands.
  url: https://www.na.is/
  fetched: 2026-11-13
  quote: Náttúrustofa Austurlands er með GPS senda á rúmlega 20 heiðagæsum víðsvegar
    um heiðar Austurlands.
- claim: Its home page has a section on research and information about reindeer in
    Iceland.
  url: https://www.na.is/
