summary: Agency that began work on 1 January 2025, announced it would assume the former Environment Agency’s
  nature conservation duties, and runs Vatnajökull National Park.
facts:
- claim: The agency began work on 1 January 2025, after the Environment Agency of Iceland was dissolved
    on 31 December 2024.
  url: https://ust.is/english/the-agency/news/newsitem/2025/01/02/Icelandic-Environment-and-Energy-Agency-and-Nature-Conservation-Agency-of-Iceland-established
  fetched: 2026-11-12
  quote: On January 1, 2025, the Icelandic Environment and Energy Agency and the Nature Conservation Agency
    of Iceland commenced operations.
- claim: The January 2025 announcement said the agency would assume the Environment Agency's nature conservation
    duties and the operations of Vatnajökull National Park.
  url: https://ust.is/english/the-agency/news/newsitem/2025/01/02/Icelandic-Environment-and-Energy-Agency-and-Nature-Conservation-Agency-of-Iceland-established
  fetched: 2026-11-12
  quote: The Nature Conservation Agency of Iceland will assume responsibilities related to nature conservation
    previously handled by the Environment Agency of Iceland and the operations of Vatnajökull National
    Park.
- claim: The January 2025 announcement said its focus would include protected areas, conservation of wild
    birds and mammals, and hunting regulation.
  url: https://ust.is/english/the-agency/news/newsitem/2025/01/02/Icelandic-Environment-and-Energy-Agency-and-Nature-Conservation-Agency-of-Iceland-established
  fetched: 2026-11-12
  quote: Its focus will include protected areas, conservation of wild birds and mammals, and hunting regulation.
- claim: Vatnajökull National Park's site says the agency coordinates regional management, protection
    planning and monitoring in its fields.
  url: https://www.vatnajokulsthjodgardur.is/en/news/natturuverndarstofnun-tekin-til-starfa
  fetched: 2026-11-12
  quote: Additionally, the agency coordinates the regional management and protection planning and monitoring
    in the above-mentioned divisions.
