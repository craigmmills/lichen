summary: Long-term study of Iceland's cliff-breeding seabirds, with monitoring reported
  at twelve locations nationwide and fixed-camera photographs at two Westfjords cliffs
  analysed for egg-laying dates and breeding success.
facts:
- claim: The Natural Science Institute's page, under its former name, says the institute
    is undertaking a major long-term study of Iceland's cliff-breeding seabirds with
    the University of Iceland and the Marine Research Institute.
  url: https://www.natt.is/en/research/monitoring-and-research/voktun-bjargfugla
  fetched: 2026-11-15
  quote: The IINH is undertaking a major long-term study of Iceland’s cliff-breeding
    seabirds, in partnership with the University of Iceland and the Marine Research
    Institute.
- claim: A 2022-2023 report by the Westfjords Nature Research Centre says seabird
    monitoring is conducted at twelve locations nationwide.
  url: https://nave.is/wp-content/uploads/2024/06/NV-nr.-33-23-Monitoring-cliff-birds-in-the-Westfjords.-Final-report-2022-2023-submitted.pdf
  fetched: 2026-11-15
  quote: Seabird monitoring is conducted in twelve locations nationwide
- claim: The same report names the Northeast Iceland Nature Research Centre as the
    institution responsible for seabird monitoring nationwide.
  url: https://nave.is/wp-content/uploads/2024/06/NV-nr.-33-23-Monitoring-cliff-birds-in-the-Westfjords.-Final-report-2022-2023-submitted.pdf
  fetched: 2026-11-15
  quote: Norðausturlands, the institution responsible for seabird monitoring nationwide
- claim: The December 2023 report on monitoring in the Westfjords says photographs
    from fixed cameras at Látrabjarg and Hælavíkurbjarg are analysed to find incubation
    or egg-laying dates and breeding success.
  url: https://nave.is/wp-content/uploads/2024/06/NV-nr.-33-23-Monitoring-cliff-birds-in-the-Westfjords.-Final-report-2022-2023-submitted.pdf
  fetched: 2026-11-15
  quote: these fixed cameras are analysed in order to acquire start of incubation/
    egg laying dates
