- claim: Its home page says it does scientific research on nature with a focus on
    alien and invasive species and the ecology of birds and mammals.
  url: https://nsv.is/
  fetched: 2026-11-15
  quote: Náttúrustofa Vesturlands stundar vísindalegar rannsóknir á náttúrunni með
