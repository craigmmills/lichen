summary: Light-trap monitoring of Iceland's Lepidoptera at 19 sites for 30 weeks a
  year, built by the Natural Science Institute of Iceland and begun in 1995 within
  the Nordic Moth Monitoring Scheme.
facts:
- claim: The Natural Science Institute's page says Iceland's Lepidoptera are monitored
    at 19 sites, with light traps gathering data for 30 weeks a year from mid-April
    to mid-November.
  url: https://www.natt.is/node/27981
  fetched: 2026-11-15
  quote: At present, the Lepidoptera fauna of Iceland is being monitored at 19 sites
    around the country.
- claim: The page says the project was started in 1995 as part of the Nordic Moth
    Monitoring Scheme and that sites were later added, mainly with local nature centres,
    the most recent in 2015.
  url: https://www.natt.is/node/27981
  fetched: 2026-11-15
  quote: Ten years into the project, more sites gradually began to be added, mainly
    in cooperation with local nature centres.
