facts:
- claim: Its home page says it is a general research and service institution in natural
    sciences that works under Act 54/2024 on the Natural Science Institute and nature
    research centres.
  url: https://nattsa.is/
  fetched: 2026-11-15
  quote: Stofan er alhliða rannsóknar- og þjónustustofnun í náttúrufræðum og starfar
    eftir lögum 54/2024 um Náttúrufræðistofnun og náttúrustofur.
- claim: Its home page says its area covers Hornafjörður municipality and Skaftárhreppur,
    with its seat at Höfn and a station at Kirkjubæjarklaustur.
  url: https://nattsa.is/
  fetched: 2026-11-15
  quote: Starfssvæðið nær yfir Sveitarfélagið Hornafjörð og Skaftárhrepp og er stofan
    með aðsetur á Höfn og starfsstöð á Kirkjubæjarklaustri.
- claim: In a home-page news item dated 3 September 2026, the centre said its specialists
    had been surveying invertebrate life in the Skarðsfjörður mudflats to give an
    overview of the area's biota; a comparable survey was made in 1979.
  url: https://nattsa.is/
  fetched: 2026-11-15
  quote: Síðastliðnar vikur hafa sérfræðingar Náttúrustofu Suðausturlands unnið að
    rannsókn á smádýralífi í leirunum í Skarðsfirði.
