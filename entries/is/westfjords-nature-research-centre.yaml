summary: Nature research centre responsible to six municipalities under Act no. 60/1992,
  conducting cliff bird monitoring and assuming oversight of Látrabjarg cameras and
  beginning vegetation monitoring in 2022.
facts:
- claim: Its history page says the six municipalities responsible for the centre are
    Bolungarvíkurkaupstaður, Ísafjarðarbær, Súðavíkurhreppur, Strandabyggð, Vesturbyggð
    and Tálknafjarðarhreppur.
  url: https://en.nave.is/?p=2306
  fetched: 2026-11-13
  quote: The six municipalities responsible for the institute are Bolungarvíkurkaupstaður,
    Ísafjarðarbær, Súðavíkurhreppur, Strandabyggð, Vesturbyggð and Tálknafjarðarhreppur.
- claim: The same page says it operates under Act no. 60/1992 on the Icelandic Institute
    of Natural Sciences and nature centres, with later changes.
  url: https://en.nave.is/?p=2306
  fetched: 2026-11-13
  quote: Nave operates according to the Act on the Icelandic Institute of Natural
    Sciences and Nature Centers, no.60/1992, with subsequent changes.
- claim: Its 2022-2023 cliff bird report says cliff bird monitoring in the Westfjords
    is conducted by the centre.
  url: https://nave.is/wp-content/uploads/2024/06/NV-nr.-33-23-Monitoring-cliff-birds-in-the-Westfjords.-Final-report-2022-2023-submitted.pdf
  fetched: 2026-11-13
  quote: Monitoring of cliff birds in the Westfjords is conducted by Náttúrustofa
    Vestfjarða (NAVE)
- claim: The same report says that in 2022 it took over oversight of fixed monitoring
    cameras at Látrabjarg.
  url: https://nave.is/wp-content/uploads/2024/06/NV-nr.-33-23-Monitoring-cliff-birds-in-the-Westfjords.-Final-report-2022-2023-submitted.pdf
  fetched: 2026-11-13
  quote: In 2022 Nave took over the oversight of fixed monitoring cameras at Látrabjarg
- claim: Its 2022 annual report notice says vegetation monitoring began that year
    under the Monitoring Key Elements in Icelandic Nature programme.
  url: https://en.nave.is/?p=2899
  fetched: 2026-11-13
  quote: Vegetation monitoring began and fossils were recorded in connection to the
    Monitoring Key Elements in Icelandic Nature program.
