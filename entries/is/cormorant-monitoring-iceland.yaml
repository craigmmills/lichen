summary: Annual estimate of great cormorant and shag breeding populations from nest
  counts on aerial photographs, run by the Natural Science Institute of Iceland, which
  took it over in 2016 from monitoring begun in 1975.
facts:
- claim: The Natural Science Institute's page says breeding populations of great cormorants
    and shags are estimated each year from nest counts on aerial photographs.
  url: https://www.natt.is/en/research/monitoring-and-research/voktun-skarfastofna
  fetched: 2026-11-15
  quote: Breeding populations of great cormorants and shags are estimated on an annual
    basis from nest count data from aerial photography.
- claim: The page says the institute, under its former name, took over the monitoring
    in 2016, which had been carried out since 1975 by a professor at the University
    of Iceland.
  url: https://www.natt.is/en/research/monitoring-and-research/voktun-skarfastofna
  fetched: 2026-11-15
  quote: In 2016, the IINH took over monitoring the populations of great cormorants
- claim: The page gives shag breeding estimates for 2016 to 2018, the latest 2,732
    nests in 2018.
  url: https://www.natt.is/en/research/monitoring-and-research/voktun-skarfastofna
  fetched: 2026-11-15
  quote: The shag breeding population was estimated at 4,000 nests in 2016, 3,795
    nests in 2017, and 2,732 in 2018.
