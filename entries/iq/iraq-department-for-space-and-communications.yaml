summary: Iraqi department through which, according to the Space Security Portal, the Ministry of Higher
  Education and Scientific Research is responsible for the country's space objectives.
facts:
- claim: The Space Security Portal says the Ministry of Higher Education and Scientific Research, through
    this department, is responsible for Iraq's space objectives.
  url: https://spacesecurityportal.org/states/iraq
  fetched: 2026-11-08
  quote: The Ministry of Higher Education and Scientific Research through its Department for Space and
    Communications is responsible for its space objectives.
- claim: The same page says the ministry's Scientific Research Commission has a Research Center for Space
    Science and Technology with a remote sensing research department.
  url: https://spacesecurityportal.org/states/iraq
  fetched: 2026-11-08
  quote: The Scientific Research Commission under the Ministry also has a Research Center for Space Science
    and Technology with dedicated departments including satellite systems department, ground stations
    and laboratories department, remote sensing research department.
