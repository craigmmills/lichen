summary: GEF-funded project run by FAO with the Ministry of Environment, building
  national land degradation monitoring capacity, with 16 field monitoring packages
  handed over on 7 July 2026, as FAO reported.
facts:
- claim: In its January–February 2026 training listing, Iraq LD Monitor says FAO Iraq,
    through this GEF-funded project, is building national capacity to assess and monitor
    land degradation.
  url: https://www.iraqlandmonitor.com/
  fetched: 2026-11-12
  quote: FAO Iraq, through the GEF-funded project “Sustainable Land Management for
    Improved Livelihoods in Degraded Areas of Iraq,” is building national capacity
    to assess and monitor land degradation
- claim: Its training listed for 30 January to 15 February 2026 was intended to teach
    spatial field data collection, remote sensing and GIS tools to feed a digital
    land degradation monitoring platform.
  url: https://www.iraqlandmonitor.com/
  fetched: 2026-11-12
  quote: apply advanced remote sensing and GIS tools (e.g., Map Marker, ArcGIS Pro,
    Google Earth Engine) to feed a digital land degradation monitoring platform.
- claim: On 7 July 2026, FAO reported handing the Ministry of Environment 16 field
    monitoring packages under the project, intended to provide data for Iraq's National
    Land Degradation Monitoring Platform.
  url: https://www.fao.org/iraq/news/detail/fao-and-ministry-of-environment-advance-iraq%27s-land-degradation-monitoring-with-handover-of-field-monitoring-equipment/
  fetched: 2026-11-12
  quote: The handover included 16 complete field monitoring packages, each comprising
    a soil quality measuring device, a water quality measuring device and a field
    tablet for digital data collection.
- claim: FAO calls the National Land Degradation Monitoring Platform a key component
    of the project.
  url: https://www.fao.org/iraq/news/detail/fao-and-ministry-of-environment-advance-iraq%27s-land-degradation-monitoring-with-handover-of-field-monitoring-equipment/
  fetched: 2026-11-12
  quote: A key component of the project is the National Land Degradation Monitoring
    Platform, which integrates field observations with satellite imagery and digital
    mapping technologies
