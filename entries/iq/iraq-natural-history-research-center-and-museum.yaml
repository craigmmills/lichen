summary: University of Baghdad centre that held a field trip to Al-Dubouni District, Wasit Governorate,
  on 1 May 2026 to collect specimens and help establish a biodiversity database for Iraq.
facts:
- claim: Organised a field trip to Al-Dubouni District, Wasit Governorate, on 1 May 2026, collecting animal
    and plant specimens.
  url: https://en.nhm.uobaghdad.edu.iq/?p=1566
  fetched: 2026-11-08
  quote: organized a field trip to Wasit Governorate, specifically Al-Dubouni District, and its surrounding
    areas on Friday, May 1, 2026. Numerous animal and plant specimens were collected to fulfill the requirements
    of the scientific research.
- claim: The trip aimed to enrich the centre's collection of Iraqi specimens and establish a database
    of biodiversity in Iraq.
  url: https://en.nhm.uobaghdad.edu.iq/?p=1566
  fetched: 2026-11-08
  quote: The field trip aimed to collect biological samples to complete the research plan, enrich the
    center's collection of Iraqi animal and plant specimens, and establish a database of biodiversity
    in Iraq.
