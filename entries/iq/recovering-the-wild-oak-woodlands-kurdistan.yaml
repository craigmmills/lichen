  quote: A National Geographic Society-funded partnership initiative of Kurdistan Botanical Foundation,
    the American University of Iraq, Sulaimani, and BGCI, 2021-2023
- claim: Surveyed remnant oak populations and built ex situ collections and nursery stocks of three oak
    species, more than 10,000 seedlings.
  url: https://www.bgci.org/our-work/projects-and-case-studies/recovering-the-wild/
  fetched: 2026-11-08
  quote: this collaborative initiative has surveyed the conservation status of remnant oak populations,
    collected propagules and developed ex situ conservation collections and nursery stocks of three oak
    species
- claim: About 1,200 seedlings were planted in the last year of the project.
  url: https://www.bgci.org/our-work/projects-and-case-studies/recovering-the-wild/
  fetched: 2026-11-08
  quote: Some 1,200 seedlings were planted as part of population reinforcement efforts in the wild and
    conservation campaigns i n the last year of the project
