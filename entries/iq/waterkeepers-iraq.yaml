facts:
- claim: Became an independent NGO registered in the Kurdistan Region of Iraq in December 2014, after
    starting as a Nature Iraq programme in 2011.
  url: https://www.waterkeepersiraq.org/about.html
  fetched: 2026-11-08
  quote: Waterkeepers Iraq (WI) was originally initiated by the Iraq conservation organization, Nature
    Iraq , in May of 2011 but became an independent non-governmental organization registered in the Kurdistan
    Region of Iraq (Baghdad registration is pending) in December of 2014.
- claim: From 2016 to 2018 ran an assessment of fish habitat health and threats in the nine rivers and
    streams of Halgurd-Sakran Park, sponsored by the Conservation Leadership Programme.
  url: https://www.waterkeepersiraq.org/watershed-assessment-for-threatened-fish-in-halgurd-sakran-park.html
  fetched: 2026-11-08
  quote: Summer 2016 to Spring 2018 - This project, sponsored by the Conservation Leadership Programme,
    included an assessment and inventory of the general health and threats to fish habitat in the nine
    rivers/streams that are present within the Halgurd-Sakran Park Area.
- claim: The survey team was trained in fish identification, habitat assessment and survey methods including
    electro-fishing.
  url: https://www.waterkeepersiraq.org/watershed-assessment-for-threatened-fish-in-halgurd-sakran-park.html
  fetched: 2026-11-08
  quote: The team was trained in basic fish identification, habitat assessments and survey techniques
    (including electro-fishing)
- claim: Its site lists survey data from the Lesser Zab Threat Assessment and RiverWatch data.
  url: https://www.waterkeepersiraq.org/river-ecosystem-health-project.html
  fetched: 2026-11-08
  quote: Survey Data (LZTA) RiverWatch Data
