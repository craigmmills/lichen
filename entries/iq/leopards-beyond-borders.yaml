summary: Described by Mongabay as a nonprofit founded by Hana Raza, and reported by Kurdistan Chronicle
  as established in 2022 with footage recording Iraq's first leopard prey caching.
facts:
- claim: Mongabay described it in 2026 as a nonprofit working to protect leopards and other wildlife in
    the Kurdistan Region, founded by Hana Raza.
  url: https://news.mongabay.com/2026/05/endangered-persian-leopards-persist-across-borders-despite-hunters-and-landmines/
  fetched: 2026-11-08
  quote: Hana Raza, founder of the nonprofit Leopards Beyond Borders , which works to protect these cats
    and other wildlife in northern Iraq's Kurdistan Region
- claim: Kurdistan Chronicle reports that it was established in the Kurdistan Region in 2022.
  url: https://kurdistanchronicle.com/b/3948
  fetched: 2026-11-08
  quote: In 2022, Hana established LBB in the Kurdistan Region.
- claim: Kurdistan Chronicle reports that its team installed a camera trap at a kill site, and that the
    footage identified the breeding female leopard known as Kurdistan returning to cached prey, the first
    prey caching recorded in Iraq.
  url: https://kurdistanchronicle.com/babat/4819
  fetched: 2026-11-08
  quote: To confirm what had happened, the team installed a camera trap near the site.
- claim: The same article says camera traps across the Zagros Mountains had recorded this female for several
    years.
  url: https://kurdistanchronicle.com/babat/4819
  fetched: 2026-11-08
  quote: For several years, camera traps placed across the rugged Zagros Mountains had quietly recorded
    the movements of a female leopard
