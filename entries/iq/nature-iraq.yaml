facts:
- claim: Founded in 2003 by Azzam Alwash.
  url: https://en.wikipedia.org/wiki/Nature_Iraq
  fetched: 2026-11-08
  quote: Nature Iraq was founded in 2003 by Azzam Alwash
- claim: IUCN NL wrote in 2020 that Nature Iraq is responsible for the establishment and management of
    the Qara Dagh Nature Reserve.
  url: https://www.iucn.nl/en/story/protecting-the-persian-leopard-by-creating-the-first-nature-reserve-in-kurdistan/
  fetched: 2026-11-08
  quote: The local nature conservation NGO Nature Iraq listed Qara Dagh as a Key Biodiversity Area (KBA)
    and is responsible for the establishment and management of the reserve.
- claim: IUCN NL wrote that Nature Iraq's camera trap monitoring identified 15 mammal species in the reserve.
  url: https://www.iucn.nl/en/story/protecting-the-persian-leopard-by-creating-the-first-nature-reserve-in-kurdistan/
  fetched: 2026-11-08
  quote: through their camera trap monitoring, Nature Iraq was able to identify 15 different mammal species
- claim: Its 2008 Key Biodiversity Areas survey report covers seasonal field surveys of birds, fish, plants
    and water quality in Sulaimani, Erbil and Duhok.
  url: https://iq.chm-cbd.net/nature-iraq-site-review-2008
  fetched: 2026-11-08
  quote: 'The field effort focused on the following surveys: bird, fish, botany, water quality physical
    parameters, phytoplankton, zooplankton and benthic macro invertebrates.'
- claim: OSME wrote in 2022 that Nature Iraq published the Key Biodiversity Areas of Iraq in 2017 with
    the Ministry of Health and Environment.
  url: https://osme.org/2022/09/nature-iraq-20-years-on/
  fetched: 2026-11-08
  quote: The Key Biodiversity Areas of Iraq – published in 2017 with the Ministry of Health & Environment.
