summary: Kurdistan Region body that Kurdistan24 reports says 45 of Iraq's 82 identified protected areas
  lie in the region, and which partners with Nature Iraq.
facts:
- claim: Kurdistan24 reports the Board's figures that 45 of Iraq's 82 officially identified natural protected
    areas are in the Kurdistan Region.
  url: https://www.kurdistan24.net/en/story/931773/kurdistan-region-moves-to-register-45-protected-areas
  fetched: 2026-11-08
  quote: According to figures from the Kurdistan Region Environmental Board, 45 of Iraq's 82 officially
    identified natural protected areas are located within the Kurdistan Region.
- claim: Kurdistan24 reports the Board saying registration with IUCN would raise the share of protected
    land in the Kurdistan Region above 30 percent.
  url: https://www.kurdistan24.net/en/story/931773/kurdistan-region-moves-to-register-45-protected-areas
  fetched: 2026-11-08
  quote: The Environmental Board has said that the process would raise the proportion of protected land
    in the Kurdistan Region above 30 percent.
- claim: IUCN NL wrote in 2020 that, through a partnership with Nature Iraq, the KRG's Environmental Protection
    and Improvement Board recognised Qara Dagh as the first formally protected area of Kurdistan.
  url: https://www.iucn.nl/en/story/protecting-the-persian-leopard-by-creating-the-first-nature-reserve-in-kurdistan/
  fetched: 2026-11-08
  quote: Nature Iraq managed to consolidate an agreement with the Kurdistan Regional Government through
    a partnership with its Environmental Protection and Improvement Board that recognised Qara Dagh as
    the first formally protected area of Kurdistan
