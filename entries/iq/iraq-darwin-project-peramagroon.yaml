summary: Nature Iraq project funded by the Darwin Initiative, run from April 2012 to March 2015, that
  trained Iraqis in botany, ornithology and conservation and found five previously undescribed plant species.
facts:
- claim: Ran from April 2012 to March 2015 and trained Iraqis in botany, ornithology and conservation
    techniques.
  url: https://osme.org/2016/02/darwin-project-puts-iraqs-wildlife-on-the-map/
  fetched: 2026-11-08
  quote: Darwin project, which ran between April 2012 and March 2015, has been successful in helping to
    build capacity for biodiversity conservation, through training Iraqis in botany, ornithology and conservation
    techniques.
- claim: National Red Lists for Iraq's endemic plants and birds became available, and OSME says the Iraqi
    Government used the data in assessing Key Biodiversity Areas.
  url: https://osme.org/2016/02/darwin-project-puts-iraqs-wildlife-on-the-map/
  fetched: 2026-11-08
  quote: National Red Lists are now available for the country's endemic plants and birds, and this data
    has already been used by the Iraqi Government in its assessment of the country's Key Biodiversity
    Areas.
- claim: Found five previously undescribed plant species on Peramagroon Mountain.
  url: https://osme.org/2016/02/darwin-project-puts-iraqs-wildlife-on-the-map/
  fetched: 2026-11-08
  quote: Five new (as yet undescribed) species were found
