summary: An NGO based in Erbil province which, according to 964media in January 2024,
  unveiled a tool measuring shade trees, mountain tree population change over seven
  years, and changes in water bodies.
facts:
- claim: 964media reported in January 2024 that the NGO Hasar had unveiled a new tool
    offering three environmental services, including measuring the number of shade
    trees in an area.
  url: https://en.964media.com/9587/?amp=1
  fetched: 2026-11-12
  quote: NGO Hasar recently unveiled a new tool offering three environmental services,
    including the ability to measure the number of shade trees in any given area.
- claim: According to 964media, the tool's second service shows the increase or decrease
    in mountain tree populations over seven years.
  url: https://en.964media.com/9587/?amp=1
  fetched: 2026-11-12
  quote: The second feature provides data on mountain regions, revealing the increase
    or decrease in tree populations over seven years.
- claim: According to 964media, its third service tracks changes in water bodies over
    the same period.
  url: https://en.964media.com/9587/?amp=1
  fetched: 2026-11-12
  quote: The third service tracks changes in water bodies over the same seven-year
    period.
- claim: 964media says Hasar focuses on environmental activities and climate change
    awareness and is based in Erbil province.
  url: https://en.964media.com/9587/?amp=1
  fetched: 2026-11-12
  quote: Hasar, focusing on environmental activities and climate change awareness,
