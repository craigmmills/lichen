status: closed
runner: unknown
summary: Closed dataset of 2 m satellite-derived bathymetry and seafloor habitat maps
  for the marine park's shallow waters, acquired in 2023 and 2024, giving baseline
  information for long-term monitoring, built by EOMAP.
facts:
- claim: The project mapped satellite-derived bathymetry and seafloor habitats at
    2 m resolution for the shallow waters of the marine park.
  url: https://researchdata.edu.au/satellite-derived-bathymetry-marine-park/3451860
  fetched: 2026-11-14
  quote: This project mapped Satellite-derived Bathymetry (SDB) and seafloor habitats
    at 2m horizontal spatial resolution, for the shallow waters (~0-25 m) of the Cocos
    (Keeling) Islands Marine Park.
- claim: The record says the layers give baseline information for long-term monitoring
    and management of the Indian Ocean Territories marine parks.
  url: https://researchdata.edu.au/satellite-derived-bathymetry-marine-park/3451860
  fetched: 2026-11-14
  quote: These critical geospatial data layers provide the essential environmental
    baseline information for the long-term monitoring and management of the IOT Marine
    Parks.
- claim: Seafloor habitat classes came from an object-based classification of seafloor
    reflectance.
  url: https://researchdata.edu.au/satellite-derived-bathymetry-marine-park/3451860
  fetched: 2026-11-14
  quote: The information on seafloor reflectance at different wavelengths was used
    to run an object-based classification procedure which groups objects of similar
    spectral characteristics, shape and texture into different classes of major seafloor
    habitat type.
- claim: The survey was acquired by Parks Australia under the IOT Marine Park grant
    in 2023 and 2024 and carried out by EOMAP Australia Pty Ltd and EOMAP GmbH & Co.KG.
  url: https://researchdata.edu.au/satellite-derived-bathymetry-marine-park/3451860
  fetched: 2026-11-14
  quote: The Cocos (Keeling) Islands Marine Park survey was acquired by the Australian
    Government (Parks Australia) as part of the IOT Marine Park Funding grant in 2023-2024,
    undertaken by EOMAP Australia Pty Ltd and EOMAP GmbH & Co.KG.
- claim: The record lists WorldView-2/3 imagery for Cocos and Pleiades-1 imagery for
    North Keeling.
  url: https://researchdata.edu.au/satellite-derived-bathymetry-marine-park/3451860
  fetched: 2026-11-14
  quote: Maxar's WorldView-2/3 (Cocos) and Airbus Pleiades-1 (North Keeling) multispectral
    satellite data were processed by the Modular and Inversion System (MIP) by EOMAP
    GmbH & Co.KG.
