summary: A Commonwealth reserve under the EPBC Act, managed by the Director of National Parks, mainly
  for scientific research and environmental monitoring, including continuous bird counts, weed mapping
  and coral and fish health checks.
facts:
- claim: The park's conservation work is mainly monitoring biodiversity and managing endangered species;
    it monitors bird numbers continuously, with attention to red-footed boobies.
  url: https://pulukeelingnationalpark.gov.au/discover/nature/conservation/
  fetched: 2026-11-12
  quote: We continuously monitor bird numbers in the park, with particular attention given to our large
    population of red-footed boobies .
- claim: The park says it is monitoring the health of coral and fish species in the waters around the
    island.
  url: https://pulukeelingnationalpark.gov.au/discover/nature/conservation/
  fetched: 2026-11-12
  quote: We’re also monitoring the health of coral and fish species in the waters around the island.
- claim: The park runs regular weed-mapping surveys.
  url: https://pulukeelingnationalpark.gov.au/discover/nature/conservation/
  fetched: 2026-11-12
  quote: We perform regular weed-mapping surveys to monitor the spread of these introduced plants.
- claim: The 2015 management plan says the park is a Commonwealth reserve under the EPBC Act, managed
    by the Director of National Parks.
  url: https://www.legislation.gov.au/F2015L01389/asmade/2015-09-01/text/original/epub/OEBPS/document_1/document_1.html
  fetched: 2026-11-12
  quote: The park is a Commonwealth reserve under the EPBC Act and is managed by the Director of National
    Parks in accordance with the Act , the regulations made under it , and this management plan .
- claim: The 2015 management plan says red-footed booby surveys had been run regularly since 1986.
  url: https://www.legislation.gov.au/F2015L01389/asmade/2015-09-01/text/original/epub/OEBPS/document_1/document_1.html
  fetched: 2026-11-12
  quote: These surveys have been conducted regularly since 1986 .
- claim: The 2015 management plan says satellite imagery was used to map the island's vegetation, supported
    by ground-truthing.
  url: https://www.legislation.gov.au/F2015L01389/asmade/2015-09-01/text/original/epub/OEBPS/document_1/document_1.html
  fetched: 2026-11-12
  quote: Satellite imagery was also used to map vegetation on the island , supported by ground - truthing
    .
- claim: Parks Australia's news item on the park's 25th anniversary says the island is mainly managed
    for scientific research and environmental monitoring.
  url: https://parksaustralia.gov.au/news/parks-australias-ecological-time-capsule-indian-ocean/
  fetched: 2026-11-12
  quote: The island is mainly managed for scientific research and environmental monitoring to conserve
    its habitats, ecosystems and native species.
