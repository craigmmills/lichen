facts:
- claim: The TERN record describes National Parks staff conducting the Island-wide
    Survey to map several flora and fauna species, with surveys in November 2009 and
    March 2012.
  url: https://portal.tern.org.au/metadata/f7c702c2-8e3f-4f3c-a682-d86b20a3fe45
  fetched: 2026-11-15
  quote: National Parks staff conduct an Island-wide Survey (IWS) to map the distribution
    of several flora and fauna species.
- claim: The TERN record gives the survey's aims as monitoring changes in native and
    non-native species and mapping invasive weeds.
  url: https://portal.tern.org.au/metadata/f7c702c2-8e3f-4f3c-a682-d86b20a3fe45
  fetched: 2026-11-15
  quote: In order to monitor changes in the distributions of native and non-native
    species across the island, map the distribution of invasive weeds for future management
- claim: The TERN record says the survey has Transit and Ink Card and Nocturnal components
    recorded separately from the Waypoint Survey.
  url: https://portal.tern.org.au/metadata/f7c702c2-8e3f-4f3c-a682-d86b20a3fe45
  fetched: 2026-11-15
  quote: The other components of the IWS (Transit Survey and Ink Card and Nocturnal
    Survey) are recorded in separate submissions.
