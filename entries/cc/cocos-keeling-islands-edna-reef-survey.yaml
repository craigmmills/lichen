status: closed
summary: A closed coral reef eDNA metabarcoding survey, with water samples taken at 42 sites in April
  2017 and processed at Curtin University's TrEnD Laboratory, whose records on GBIF set a new baseline
  for monitoring reef fauna.
facts:
- claim: Water samples were collected at 42 sites in 2017 and processed at the TrEnD Laboratory at Curtin
    University.
  url: https://australian.museum/learn/news/blog/edna-flushes-out-cryptic-marine-fauna-and-aids-biomonitoring-on-coral-reefs/
  fetched: 2026-11-12
  quote: Water samples were collected at 42 ocean sites in and around the coral reefs in 2017. DNA was
    extracted from these water samples and processed back at the TrEnD Laboratory in Curtin University.
- claim: The eDNA records set a new biodiversity baseline for monitoring the islands' coral reef fauna.
  url: https://australian.museum/learn/news/blog/edna-flushes-out-cryptic-marine-fauna-and-aids-biomonitoring-on-coral-reefs/
  fetched: 2026-11-12
  quote: These eDNA records set a new biodiversity baseline for continual monitoring of the coral reef
    fauna at the Cocos (Keeling) Islands.
- claim: The survey's records are published on GBIF as an occurrence dataset.
  url: https://api.gbif.org/v1/dataset/bc5a5e8e-0891-46f6-a981-52021ce06658
  fetched: 2026-11-12
  quote: eDNA metabarcoding survey of Cocos (Keeling) Islands, Indian Ocean (2017)
- claim: The GBIF record says six 1 L seawater replicates were taken at each of 42 sites in and around
    the atoll in April 2017.
  url: https://api.gbif.org/v1/dataset/bc5a5e8e-0891-46f6-a981-52021ce06658
  fetched: 2026-11-12
  quote: A total of six 1 L seawater replicates were sampled from 42 sites in and around the main Cocos
    (Keeling) Islands atoll in April 2017
- claim: Aims to map satellite-derived bathymetry, seafloor reflectance and benthic habitats at 2 m resolution
    for waters of 0 to 20 m in the marine park.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: This project aims to map the Satellite-Derived Bathymetry (SDB), reflectance (seafloor colour)
    and benthic habitats at 2m horizontal spatial resolution, for the shallow waters (0-20 m) of the Cocos
    (Keeling) Island Marine Park.
- claim: The grantee listed is EOMAP Australia, for 71,760 dollars.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: EOMAP Australia - $71,760
- claim: Used support vector machine classification of a 14-year series (2006 to 2020) of publicly available
    high-resolution satellite imagery to show the scale of seagrass loss.
  url: https://library.dpird.wa.gov.au/fr_fja/492
  fetched: 2026-11-12
  quote: Through support vector machine classification of a 14-year time series (2006—2020) of publicly
    available high-resolution satellite imagery, we demonstrate the temporal and spatial scale of the
    loss of the high-canopy seagrass meadows
  ai_type: ml-supervised
- claim: Found complete canopy loss of all described meadows of the dense seagrass Thalassodendron ciliatum.
  url: https://library.dpird.wa.gov.au/fr_fja/492
  fetched: 2026-11-12
  quote: includes the complete canopy loss of all described meadows of the dense, high-canopy seagrass
    species Thalassodendron ciliatum
- claim: Both authors are listed at the Department of Primary Industries and Regional Development, Western
    Australia; published in Marine Biology.
  url: https://library.dpird.wa.gov.au/fr_fja/492
  fetched: 2026-11-12
  quote: Nick Konzewitsch , Department of Primary Industries and Regional Development, Western Australia
- claim: Plans to use midwater baited remote underwater video systems (BRUVS), provide them to the community
    for training and ongoing use, and undertake two surveys in partnership with Cocos Marine Care.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: Building on previous surveys, the project will undertake 2 midwater BRUVS surveys in partnership
    with Cocos Marine Care (CMC), forming the basis of any longer term open-ocean wildlife monitoring
    programs.
- claim: Listed under the Indian Ocean Territories Marine Park grant program, launched in March 2022,
    with the University of Western Australia as the grantee for 426,774 dollars.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: University of Western Australia - $426,774
- claim: Aims to document the population and health status of the islands' green and hawksbill turtles
    in the context of seagrass loss.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: This project will document the population and health status in the context of catastrophic seagrass
    loss and potentially long-term habitat changes at this key Indian Ocean location.
- claim: The grantee listed is Biomarine International, for 371,880 dollars.
  url: https://australianmarineparks.gov.au/parks/indian-ocean-territories-marine-parks/indian-ocean-territories-grants-program/
  fetched: 2026-11-12
  quote: Biomarine International - Scott David Whiting - $371,880
- claim: The islands' tourism site says marine scientists Scott and Andrea Whiting have visited Cocos
    since 1999, leading long-term turtle research, and have captured 3,000 turtles to tag with titanium
    flipper tags.
  url: https://cocoskeelingislands.com.au/travel-tips/turtles-of-the-cocos-keeling-islands/
  fetched: 2026-11-12
  quote: The Whitings have captured 3000 turtles to tag with titanium flipper tags.
links:
