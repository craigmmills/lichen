  url: https://australian.museum/learn/news/blog/edna-flushes-out-cryptic-marine-fauna-and-aids-biomonitoring-on-coral-reefs/
  fetched: 2026-11-12
  quote: At Curtin University in Perth, in collaboration with the WA Department of Primary Industries
    and Regional Development, we tested the use of a new genetic technique to efficiently detect a wide
    variety of marine fauna in a single survey at the Cocos (Keeling) Islands.
