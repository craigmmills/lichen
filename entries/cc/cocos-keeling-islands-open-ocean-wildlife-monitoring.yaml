runner: unknown
summary: Grant-funded project planning to build local capacity to monitor tunas, billfishes
  and sharks using midwater baited underwater video, with two surveys planned; by
  February 2024 the equipment was awaiting shipment.
facts:
- claim: The grant description set an objective of building local capacity to monitor
    open-ocean wildlife such as tunas, billfishes and sharks in the proposed marine
    park.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: The project objective is to enhance the local community understanding of,
    and capacity to monitor open-ocean (pelagic) wildlife such as tunas, billfishes
    and sharks in the proposed Cocos (Keeling) Islands (CKI) Marine Park to support
    long-term management.
- claim: The grant description planned to use midwater baited remote underwater video
    systems and provide them to the community for training and ongoing use.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: State-of-the-art midwater baited remote underwater video systems (BRUVS)
    will be used and provided to the community for training and on-going use.
- claim: The grant description planned two midwater BRUVS surveys in partnership with
    Cocos Marine Care as a basis for longer-term open-ocean monitoring.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: Building on previous surveys, the project will undertake 2 midwater BRUVS
    surveys in partnership with Cocos Marine Care (CMC), forming the basis of any
    longer term open-ocean wildlife monitoring programs.
- claim: The page says a companion Christmas Island BRUVS survey complements a 2.5-year
    project at the Cocos (Keeling) Islands.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: Note, this project complements the 2.5 year project that will be undertaken
    at Cocos (Keeling) Islands.
- claim: The grant program was launched in March 2022 with the establishment of the
    Indian Ocean Territories marine parks.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: an Indian Ocean Territories Marine Park grant program was launched in March
    2022 to contribute to the protection of these unique environments.
- claim: A news release on the grants said the funded projects would start in 2023
    and finish by mid-2025.
  url: https://australianmarineparks.gov.au/news/grants-protect-australias-newest-marine-parks/
  fetched: 2026-11-15
  quote: The newly funded projects will commence in 2023 and finish by mid-2025.
- claim: The committee minutes of 7 February 2024 record open-water BRUVS monitoring
    by UWA and an April visit planned for training with Cocos Marine Care and Parks
    Australia; the BRUVS were awaiting shipment.
  url: https://shire.cc/images/files/Agendas/2024/Attachments/May/11.1%20-%20PKNPCMC%20Minutes%2007.02.24%20final.pdf
  fetched: 2026-11-15
  quote: Open-water monitoring (BRUVS) by UWA. On island in April for wet/dry training
    with CMC & Parks.
