summary: Grant-funded project planning to document the population and health of the
  islands' green and hawksbill turtles amid seagrass loss, with monitoring by Scott
  Whiting recorded as planned for six months in 2024.
facts:
- claim: The grant description planned to document the population and health status
    of the islands' turtles in the context of seagrass loss.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: This project will document the population and health status in the context
    of catastrophic seagrass loss and potentially long-term habitat changes at this
    key Indian Ocean location.
- claim: The page says the islands support significant populations of threatened green
    and hawksbill turtles.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: The Cocos Keeling Islands (CKI) supports nationally and internationally significant
    populations of threatened green and hawksbill turtles.
- claim: The grant description planned for a team of experts to use several techniques
    and technologies to build lines of evidence for the turtles' status.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: A team of multidisciplinary experts will use innovative techniques and technology
    to establish multiple lines of evidence for their current status.
- claim: The grant description said the results would inform local custodians, park
    managers and the Shire.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: The results will inform local Custodians, park managers, the CKI Shire and
    various stakeholders, all of which highly value turtles as a prominent feature
    of CKI.
- claim: The grant line names Biomarine International and Scott David Whiting, for
    371,880 dollars.
  url: https://parksaustralia.gov.au/marine/the-indian-ocean-territories-marine-parks-grants
  fetched: 2026-11-14
  quote: Biomarine International - Scott David Whiting - $371,880
- claim: A news release on the grants said the funded projects would start in 2023
    and finish by mid-2025.
  url: https://australianmarineparks.gov.au/news/grants-protect-australias-newest-marine-parks/
  fetched: 2026-11-15
  quote: The newly funded projects will commence in 2023 and finish by mid-2025.
- claim: Committee minutes filed with the Shire's May 2024 agenda record turtle monitoring
    by Scott Whiting on the island for a planned six months.
  url: https://shire.cc/images/files/Agendas/2024/Attachments/May/11.1%20-%20PKNPCMC%20Minutes%2007.02.24%20final.pdf
  fetched: 2026-11-15
  quote: Turtle monitoring by Scott Whiting also on island for a planned 6 month to
    continue turtle
