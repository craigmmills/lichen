summary: Completed dataset from the park's Island-wide Survey, held in November 2009
  and March 2012, recording yellow crazy ant and scale insect distribution at 132
  random waypoints, built by Parks Australia.
facts:
- claim: The dataset holds distribution data for the yellow crazy ant and scale insects
    from the Waypoint Survey part of the park's Island-wide Survey.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: The aim of the Waypoint Survey is to monitor densities of the invasive Yellow
    Crazy Ant (Anoplolepis gracilipes) and to detect establishment of any new scale
    insect species.
- claim: The first Island-wide Survey was in November 2009 and the second in March
    2012.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: The inaugural survey took place in November 2009, and a second survey followed
    in March 2012.
- claim: The record says National Parks staff conduct the Island-wide Survey to map
    the distribution of several flora and fauna species.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: National Parks staff conduct an Island-wide Survey (IWS) to map the distribution
    of several flora and fauna species.
- claim: The other parts of the survey, the Transit Survey and the Ink Card and Nocturnal
    Survey, are published as separate records.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: The other components of the IWS (Transit Survey and Ink Card and Nocturnal
    Survey) are recorded in separate submissions.
- claim: The survey design places 132 waypoints at random on the survey's transit
    lines.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: 132 waypoints have been randomly positioned on the IWS transit lines across
    the island.
- claim: The record gives the dataset's progress as completed.
  url: https://researchdata.edu.au/pulu-keeling-national-waypoint-survey/1952483
  fetched: 2026-11-14
  quote: 'Progress Code: completed'
