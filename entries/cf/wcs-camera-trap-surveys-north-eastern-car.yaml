summary: In August 2025, WCS reported its north-eastern Central African Republic surveys
  had documented a lioness for the first time in six years; a later release reported
  cubs.
facts:
- claim: WCS says that in August 2025 it reported camera trap evidence of an adult
    female lion in North-Eastern Central African Republic for the first time in six
    years.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/24893/Signs-of-Lion-Recovery-WCS-Camera-Trap-Captures-First-Lioness-in-Northern-CAR-since-2019.aspx
  fetched: 2026-11-12
  quote: The Wildlife Conservation Society (WCS) has captured camera trap evidence
    of an adult female lion in North-Eastern Central African Republic (NCAR) for the
    first time in six years.
- claim: WCS says its camera-trap surveys in North-Eastern CAR show carnivores including
    leopards, caracals, African wildcats and servals returning to the landscape.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/24893/Signs-of-Lion-Recovery-WCS-Camera-Trap-Captures-First-Lioness-in-Northern-CAR-since-2019.aspx
  fetched: 2026-11-12
  quote: Beyond lions, WCS camera-trap surveys in North-Eastern Central African Republic
    are revealing that carnivores are coming back into this landscape
- claim: A later WCS release says the field team then saturated the area with silent
    infra-red video cameras, combining satellite imagery with field knowledge to place
    them, and recorded the first lion cubs in decades.
  url: https://newsroom.wcs.org/News-Releases/articleType/ArticleView/articleId/25140/Lions-Roar-Back-Camera-Traps-Capture-First-Cubs-in-Decades-in-North-Eastern-Central-African-Republic.aspx
  fetched: 2026-11-12
  quote: The field team then launched a major effort to saturate the area with silent
    infra-red video cameras.
