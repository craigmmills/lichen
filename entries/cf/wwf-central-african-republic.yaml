summary: Carries out the Dzanga-Sangha wildlife inventory every five years with DSPA, including 2025 eDNA
  leaf swabs, and relies on ongoing donor support for programme development.
facts:
- claim: The Dzanga-Sangha site says WWF CAR and DSPA carry out the wildlife inventory every five years.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: 2026-11-09
  quote: The World Wildlife Fund CAR and DPSA conduct the wildlife inventory every five years
- claim: The page describes eDNA leaf swabs in the 2025 inventory and says the inventory will also include
    DNA samples from elephant dung.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: 2026-11-09
  quote: Beyond the line transect and camera traps, this year, DPSA is experimenting with a new method
