summary: Run by the Wildlife Conservation Society; under a 25-year public-private partnership signed in
  December 2018 it is responsible for the 11.5 million hectare Northeastern Protected Area Complex.
facts:
- claim: Says that under a 25-year public-private partnership signed with the government in December 2018,
    WCS is responsible for park management, law enforcement and conservation in the Northeastern Protected
    Area Complex.
  url: https://car.wcs.org/About-Us
  fetched: 2026-11-09
  quote: In December 2018, WCS and the Central African Republic government subscribed to a 25-year public-private
    partnership agreement
- claim: Says the complex covers 11.5 million hectares and includes the Bamingui-Bangoran and Manovo-Gounda
    St Floris national parks.
  url: https://car.wcs.org/About-Us
  fetched: 2026-11-09
  quote: The Northeastern Protected Area Complex (NPAC) extends across 11.5 million hectares.
- claim: Says it has set up a wildlife monitoring system based on conservation technology, real-time satellite
    data and operational teams, with community scouts trained to use satellite communication devices.
  url: https://car.wcs.org/Conservation-Solutions
  fetched: 2026-11-09
  quote: We have set up an innovative monitoring system based on conservation technology, real-time satellite
    data, and effective deployment of operational teams.
- claim: Says it works in the Northeastern Protected Area Complex, the country's largest wilderness protection
    area.
  url: https://car.wcs.org/About-Us
  fetched: '2026-11-09'
  quote: The WCS Central African Republic program is dedicated to saving wildlife and enabling sustainable
    community development in the Northeastern Protected Area Complex
- claim: Says it has set up a wildlife monitoring system based on conservation technology, real-time satellite
    data and operational teams.
  url: https://programs.wcs.org/car/Conservation-Solutions
  fetched: '2026-11-09'
  quote: We have set up an innovative monitoring system based on conservation technology, real-time satellite
    data, and effective deployment of operational teams.
