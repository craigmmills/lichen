summary: Five-yearly large-mammal inventory run by WWF Central African Republic and Dzanga-Sangha Protected
  Areas; the 2025 round used 186 line transects and collected 990 eDNA leaf swabs.
facts:
- claim: Conducted every five years by WWF CAR and the protected areas.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: '2026-11-09'
  quote: The World Wildlife Fund CAR and DPSA conduct the wildlife inventory every five years
- claim: Since 2010 the inventory has relied mainly on line transects and camera traps, focused on large
    mammals.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: '2026-11-09'
  quote: Since 2010, DPSA has been primarily relying on the line transect and camera trap methods for
    the inventory
- claim: The 2025 inventory used 186 line transects and was overseen by Antoine Edé.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: '2026-11-09'
  quote: one of 186 line transects being set up across the Dzanga-Sangha Protected Areas (DPSA) for the
    2025 Wildlife Inventory overseen by Antoine Edé
- claim: The 2025 round collected leaf swabs for eDNA, ten per transect.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: '2026-11-09'
  quote: To capture this data, the inventory team collected 10 leaf swabs per transect.
- claim: The page gives the 2025 totals as more than 26,000 camera trap footage items, 386 elephant DNA
    samples and 990 eDNA leaf swabs.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: '2026-11-09'
  quote: 6 teams, 48 people, 12 deployments, +26 000 camera trap footage, 386 Elephant DNA samples, 990
    Edna Leaf Swabs
