summary: Long-running camera trap work in Chinko Nature Reserve, over 12 years, where images are processed
  at a Swiss lab and volunteers' tags train an AI to recognise species.
facts:
- claim: Says camera traps have run across the Chinko Nature Reserve for over 12 years, with images sent
    to Daniel Wegmann's lab in Switzerland for processing.
  url: https://www.zooniverse.org/projects/wegmannlab/camera-traps-in-chinko/about/research
  fetched: 2026-11-09
  quote: For over 12 years now, camera traps have been set up throughout the Chinko Nature Reserve.
- claim: Says volunteers' tags are used to train an AI to recognise images of species such as leopard
    and eastern giant eland, through active learning.
  url: https://www.zooniverse.org/projects/wegmannlab/camera-traps-in-chinko/about/research
  fetched: 2026-11-09
  quote: 'This is how active learning works : the more we show the AI different points of view of the
    animals, the more it will be trained to recognize them in any situation.'
- claim: Says a team in Africa led by Thierry Aebischer placed and installed the cameras, and a University
    of Fribourg team led by Professor Daniel Wegmann processes the data.
  url: https://www.zooniverse.org/projects/wegmannlab/camera-traps-in-chinko/about/team
  fetched: 2026-11-09
  quote: There is also a team based in Switzerland at the University of Fribourg, led by Professor Daniel
    Wegmann, who is in charge of processing the data received
- claim: Says African Parks has managed the Chinko reserve since 2014.
  url: https://www.zooniverse.org/projects/wegmannlab/camera-traps-in-chinko/about/research
  fetched: 2026-11-09
  quote: Since 2014, the biodiversity conservation NGO African Parks has taken over management of the
    park.
