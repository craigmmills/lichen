summary: Environment ministry that UNDP says will co-chair the BIOFIN national steering committee launched
  in September 2025, and that CAFI lists as a partner of the Bangui PES project.
facts:
- claim: UNDP says the ministry and the finance ministry will co-chair the national steering committee
    of BIOFIN, launched in the Central African Republic in September 2025.
  url: https://www.undp.org/fr/node/548306
  fetched: 2026-11-09
  quote: en collaboration étroite avec le Ministère de l’Environnement et du Développement Durable et
    le Ministère des Finances et du Budget , qui co-présideront le Comité national de pilotage
- claim: UNDP says the ministries will help collect and provide access to financial and environmental
    data and support the national biodiversity finance plan.
  url: https://www.undp.org/fr/node/548306
  fetched: 2026-11-09
  quote: faciliter la collecte et l’accès aux données financières et environnementales
- claim: UNDP says the government will guide a CAFI-funded payments for environmental services project
    around Bangui through the ministries for the environment, forest economy and finance.
  url: https://www.undp.org/fr/node/607051
  fetched: 2026-11-09
  quote: Le Gouvernement centrafricain assurera l’orientation et l’ancrage institutionnel du projet à
    travers les ministères chargés de l’Environnement, de l’Économie forestière et des Finances.
- claim: CAFI's country page names the Minister of Environment and Sustainable Development as its lead
    government partner in the Central African Republic.
  url: https://cafi.org/country/the-central-african-republic/
  fetched: '2026-11-09'
  quote: 'Lead Government Partner: Minister of Environment and Sustainable Development'
- claim: CAFI lists the Ministry of Environment, Sustainable Development and the Congo Basin as a national
    partner of the Bangui and Surrounding Areas PES Project.
  url: https://cafi.org/project/bangui-and-surrounding-areas-pes-project/
  fetched: '2026-11-09'
  quote: Ministry of Environment, Sustainable Development and the Congo Basin
