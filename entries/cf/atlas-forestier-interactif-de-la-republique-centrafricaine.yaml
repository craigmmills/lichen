    sector in a single, interactive mapping platform
- claim: The data page offers GIS data layers, among them conservation, habitat and
    vegetation.
  url: https://www.wri.org/data/interactive-forest-atlas-central-african-republic-atlas-forestier-interactif-de-la-republique
