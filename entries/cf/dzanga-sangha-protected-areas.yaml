summary: Protected areas run by WWF and the water, forests, hunting and fishing ministry, with biomonitoring
  including wildlife inventories, camera traps, a zoonotic disease field lab and remote-sensing mapping.
facts:
- claim: Lists biomonitoring work including wildlife inventory and monitoring, a field lab for zoonotic
    disease monitoring, and mapping of land use and forest stand types by remote sensing.
  url: https://dzanga-sangha.org/
  fetched: 2026-11-09
  quote: mapping land use and forest stand types by remote sensing
- claim: Says DSPA has relied mainly on line transects and camera traps for its wildlife inventory since
    2010.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: 2026-11-09
  quote: Since 2010, DPSA has been primarily relying on the line transect and camera trap methods for
    the inventory
- claim: Gives the 2025 inventory figures as 6 teams, 48 people, over 26,000 camera-trap footage items,
    386 elephant DNA samples and 990 eDNA leaf swabs.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: 2026-11-09
  quote: 6 teams, 48 people, 12 deployments, +26 000 camera trap footage, 386 Elephant DNA samples, 990
    Edna Leaf Swabs, 14 963 observations data
- claim: Says the wildlife inventory is carried out every five years by WWF CAR and DSPA.
  url: https://dzanga-sangha.org/stories/wildlife-monitoring/
  fetched: 2026-11-09
  quote: The World Wildlife Fund CAR and DPSA conduct the wildlife inventory every five years
- claim: Says the protected areas are managed by a team of the relevant ministry and WWF.
  url: https://dzanga-sangha.org/our-work/
  fetched: '2026-11-09'
  quote: The DSPA is managed by a team consisting of the relevant ministry and WWF.
- claim: Says it has set up a monitoring system that follows wildlife species and human pressure, and
    records habitat distribution, forest change and timber use.
  url: https://dzanga-sangha.org/research/
  fetched: '2026-11-09'
  quote: In Dzanga-Sangha, we have established a monitoring system that not only follows wildlife species,
    but also, for example, how human pressure affects the natural resources.
- claim: Says it monitors four large forest clearings with permanently installed camera traps, 30 of them
    on and around Dzanga Bai.
  url: https://dzanga-sangha.org/research/
  fetched: '2026-11-09'
  quote: In the DSPA, we are currently monitoring four large forest clearings with permanently installed
    camera traps.
- claim: Says it worked with the Robert Koch Institute for six years on an early warning system for zoonoses,
    and has cooperated with the Helmholtz Institute for One Health since 2022.
  url: https://dzanga-sangha.org/research/
  fetched: '2026-11-09'
  quote: we worked with the Robert Koch Institute on an early warning system for 6 years. This system
    is designed to help identify health threats rapidly and initiate immediate responses. Since 2022 we
    are cooperating with HIOH Helmholtz Institute for One Health.
