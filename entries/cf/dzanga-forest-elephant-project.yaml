summary: Started by Andrea Turkalo and run by the Elephant Listening Project, it reportedly
  combines behavioural observation with acoustic monitoring; 27 years’ data identified over
  4,000 forest elephants.
facts:
- claim: Mongabay reports that the project, part of the Elephant Listening Project at Cornell
    University, combines long-term behavioural observation with passive acoustic monitoring.
  url: https://news.mongabay.com/2026/04/studying-the-worlds-largest-gathering-of-forest-elephants-with-sound-and-field-observation/
  fetched: 2026-11-09
  quote: She leads the Dzanga Forest Elephant Project , part of the Elephant Listening Project
    at Cornell University. Her work combines long-term behavioral observation with passive
    acoustic monitoring.
- claim: Mongabay reports that its acoustic monitoring systems run continuously across the
    landscape and record gunshots as well as ecological soundscapes.
  url: https://news.mongabay.com/2026/04/studying-the-worlds-largest-gathering-of-forest-elephants-with-sound-and-field-observation/
  fetched: 2026-11-09
  quote: These systems record gunshots as well as ecological soundscapes, providing a way
    to track both threats and broader environmental conditions.
- claim: Its head researcher told Mongabay the team uses acoustic data to map elephant distribution
    and is working to connect it with the Elephant Listening Project's grid in Congo.
  url: https://news.mongabay.com/2026/04/studying-the-worlds-largest-gathering-of-forest-elephants-with-sound-and-field-observation/
  fetched: 2026-11-09
  quote: There’s an existing grid in Congo through the Elephant Listening Project, and we’re
    trying to connect that with what we have here to see how elephants move across this whole
    tri-national area.
- claim: The Dzanga-Sangha site says Andrea Turkalo started the study at Dzanga Bai in 1990.
  url: https://dzanga-sangha.org/research/
  fetched: '2026-11-09'
  quote: In 1990, Andrea Turkalo started the first and longest study on forest elephants at
    Dzanga Bai – the Dzanga Forest Elephant Study.
- claim: The same page says data were collected over 27 years and more than 4,000 forest elephants
    identified.
  url: https://dzanga-sangha.org/research/
  fetched: '2026-11-09'
  quote: Over a period of 27 years, data have been continuously collected, analyzed and evaluated.
    More than 4,000 forest elephants have been identified
