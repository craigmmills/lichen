summary: Ministry described by FAO in 2010 as applying government policy on forest, wildlife and fisheries
  resources; it runs Dzanga-Sangha Protected Areas and is listed by WCS as a supporter.
facts:
- claim: An FAO page from 2010 says the ministry's main mission is to apply government policy on the sustainable
    management of forest, wildlife and fisheries resources.
  url: https://www.fao.org/forestry-fao/nwfp/66871/fr/
  fetched: 2026-11-09
  quote: a pour principal mission d’appliquer la politique du gouvernement en matière de gestion durable
    des ressources forestières, fauniques et halieutiques
- claim: The 2010 FAO page listed a Directorate of Wildlife and Protected Areas (DFAP) and a Forest Data
    Centre directorate (CDF).
  url: https://www.fao.org/forestry-fao/nwfp/66871/fr/
  fetched: 2026-11-09
  quote: Direction de la Faune et des Aires Protégées (DFAP)
- claim: The 2010 FAO page said the ministry drew up management plans for forest areas, hunting areas
    and protected areas.
  url: https://www.fao.org/forestry-fao/nwfp/66871/fr/
  fetched: 2026-11-09
  quote: le Ministère réalise des Plans d’Aménagement ou de gestion durable des ressources de la biodiversité
    dans les zones forestières, cynégétiques et les aires protégées
- claim: The Dzanga-Sangha site says the protected area is managed by a WWF-led unit under the supervision
    of a board chaired by the Minister of Water, Forests, Hunting and Fishing.
  url: https://dzanga-sangha.org/our-work/
  fetched: '2026-11-09'
  quote: The area is managed by a Management Unit led by WWF and acting under the supervision of a Board
    chaired by the Minister of Water, Forests, Hunting and Fishing.
- claim: WCS lists the ministry first among those supporting management of the Northeastern Protected
    Areas Complex, under a public-private partnership.
  url: https://programs.wcs.org/car/Partnerships
  fetched: '2026-11-09'
  quote: Central African Republic Ministry of Water, Forest, Hunt, and Fisheries Public-Private Partnership.
    Management of the CAR Northeastern Protected Areas Complex
