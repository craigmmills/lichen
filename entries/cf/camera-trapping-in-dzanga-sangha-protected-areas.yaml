summary: A closed master's thesis project that, as planned in January 2018, would
  use camera trapping on 36 transects of 2 km, with two cameras each for about 165
  days, to assess large mammals in two zones.
facts:
- claim: The January 2018 page described a master's thesis aiming to assess large
    mammal density, distribution, abundance and threats in two zones of the Dzanga-Sangha
    Protected Areas using camera trapping.
  url: https://www.rufford.org/projects/janika_wendefeuer
  fetched: 2026-11-12
  quote: This master thesis aims to assess large mammal population density, distribution
    and abundance as well as major threats to wildlife population in two zones (National
    Park and Community Hunting Area) in the Dzanga Sangha Protected Areas using a
    recently developed camera trapping technique.
- claim: The January 2018 plan envisaged a feasibility study for continuous camera
    monitoring in the protected areas and a contribution of data to the A.P.E.S. database.
  url: https://www.rufford.org/projects/janika_wendefeuer
  fetched: 2026-11-12
  quote: serve as a feasibility study for the implementation of a continuous camera
    monitoring system in the DSPA. Additionally, the data will contribute to the A.P.E.S.
    database
- claim: The January 2018 design planned 36 transects of 2 km, with two cameras per
    transect installed for approximately 165 days.
  url: https://www.rufford.org/projects/janika_wendefeuer
  fetched: 2026-11-12
  quote: The study will sample in total 36 transects of each 2 km length covering
    two zones of DSPA (National Park & Community Hunting Area).
