summary: Acoustic monitoring run by the Elephant Listening Project across almost 1,200 square kilometres,
  recording elephant sounds and gunshots, with recorded shots evaluated to plan anti-poaching patrols.
facts:
- claim: The Dzanga-Sangha site says Elephant Listening Project teams installed acoustic recording devices
    across almost 1,200 square kilometres of the protected area complex.
  url: https://dzanga-sangha.org/stories/dzanga-sangha-deciphering-the-secret-language-of-forest-elephants/
  fetched: '2026-11-09'
  quote: Research teams from the Elephant Listening Project have installed acoustic recording devices
    in the Dzanga-Sangha protected area complex, covering almost 1,200 square kilometers.
- claim: The devices record elephant sounds and poachers' gunshots.
  url: https://dzanga-sangha.org/stories/dzanga-sangha-deciphering-the-secret-language-of-forest-elephants/
  fetched: '2026-11-09'
  quote: The devices record the sounds of elephants and gunshots from poachers.
- claim: The scientists report their data to the protected area administration, and recorded shots are
    evaluated to plan anti-poaching patrols.
  url: https://dzanga-sangha.org/stories/dzanga-sangha-deciphering-the-secret-language-of-forest-elephants/
  fetched: '2026-11-09'
  quote: The scientists report their data at regular intervals to the protected area administration in
    Dzanga-Sangha
