summary: Active use of EarthRanger, run by Dzanga-Sangha Protected Areas, to combine
  patrol, researcher and satellite data in real time, with historical soundscapes
  being uploaded to build a baseline.
facts:
- claim: EarthRanger's success story says that in Dzanga-Sangha EarthRanger collects
    and synthesises data from patrol teams, researchers and satellite systems in real
    time.
  url: https://www.earthranger.com/success-stories/dzanga-sangha
  fetched: 2026-11-12
  quote: In Dzanga-Sangha, EarthRanger serves as a centralized digital hub, collecting
    and synthesizing data from patrol teams, researchers, and satellite systems in
    real-time.
- claim: Field teams use EarthRanger Mobile and inReach GPS devices integrated into
    EarthRanger.
  url: https://www.earthranger.com/success-stories/dzanga-sangha
  fetched: 2026-11-12
  quote: Today, field teams use EarthRanger Mobile and inReach GPS devices, which
    provide satellite communication to stay connected even in remote areas.
- claim: Historical soundscapes are being uploaded into EarthRanger to build a baseline
    for tracking long-term change and poaching hotspots.
  url: https://www.earthranger.com/success-stories/dzanga-sangha
  fetched: 2026-11-12
  quote: Historical soundscapes are now being uploaded into EarthRanger, building
    a baseline to track long-term changes, spotlight poaching hotspots, and deploy
    law enforcement teams accordingly.
- claim: The DSPA newsletter of May 2025 lists EarthRanger platform and staff training
    among its news.
  url: https://dzanga-sangha.org/wp-content/uploads/2025/06/DSPA-newsletter-Mai-2025.pdf
  fetched: 2026-11-12
  quote: EarthRanger platform and staff training.
