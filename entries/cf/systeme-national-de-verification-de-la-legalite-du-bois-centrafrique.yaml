summary: National timber legality verification system, intended to ensure exported
  timber meets legal standards, which the EU delegation says is housed in a new APV-FLEGT
  building the ministry officially received on 27 February 2026.
facts:
- claim: The EU delegation says that on 27 February 2026 the Ministry of Water, Forests,
    Hunting and Fishing officially received the new building of the APV-FLEGT project.
  url: https://www.eeas.europa.eu/node/463629_en
  fetched: 2026-11-15
  quote: Le 27 février 2026, une étape importante a été franchie au sein du Ministère
    des Eaux, Forêts, Chasse et Pêche avec la réception officielle du nouveau bâtiment
    du projet APV-FLEGT.
- claim: The EU delegation says the building now houses the national timber legality
    verification system, intended to ensure that every exported timber meets the legal
    standards in force.
  url: https://www.eeas.europa.eu/node/463629_en
  fetched: 2026-11-15
  quote: il abrite désormais le Système national de vérification de la légalité du
    bois, un outil stratégique destiné à garantir que chaque bois exporté respecte
    les normes légales en vigueur.
- claim: The EU delegation lists strengthening forest traceability among the aims
    of the APV-FLEGT between the Central African Republic and the European Union.
  url: https://www.eeas.europa.eu/node/463629_en
  fetched: 2026-11-15
  quote: renforcer la traçabilité forestière
