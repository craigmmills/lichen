  quote: High intensity monitoring of an aggregation of very small juvenile whale sharks Rhincodon typus
    found in the Gulf of Tadjoura off Djibouti.
- claim: Photo-identities were added to a database, with 350 sharks identified from the aggregation by
    2011.
  url: https://saveourseas.com/project/djiboutis-baby-giants/
  fetched: 2026-11-12
  quote: Photo-identities are added to the on-going database to enable population estimations; 95 identities
    were verified on the 2010 expedition and a further 53 in 2011, bringing the total number of sharks
    identified from this aggregation to 350.
