facts:
- claim: Djibouti Nature says it is registered under the 1901 associations act in
    Djibouti, with a certificate issued by the Ministry of Interior and Decentralisation.
  url: https://djiboutinature.org/about/
  fetched: 2026-11-15
  quote: Djibouti Nature is registered under the provisions of Act of July 1st, 1901,
    relating to the contract of association in Djibouti
- claim: It describes itself as an independent, membership-based, not-for-profit organisation
    legally established in Djibouti in 1999, formerly known as the Wildlife Protection
    Organization.
  url: https://djiboutinature.org/?p=797
  fetched: 2026-11-15
  quote: formerly known as Wildlife Protection Organization -WPO) is an independent,
    membership-based and not-for-profit grassroots organization, legally established
    in Djibouti
- claim: Among its achievements, it lists spring counts of migratory soaring raptors
    focusing on Egyptian vultures, completed with a report disseminated.
  url: https://djiboutinature.org/publications/
  fetched: 2026-11-15
  quote: Spring migratory soaring raptor counts focusing on Egyptian vultures have
    been completed and report disseminated.
- claim: It says it has carried out field studies to add to national knowledge of
    the country's biodiversity, among more than 31 small projects since 1999.
  url: https://djiboutinature.org/our-works/
  fetched: 2026-11-15
  quote: carrying out field studies in order to contribute to national efforts to
    improve knowledge of the country’s biodiversity
- claim: The Mohamed bin Zayed Species Conservation Fund lists a grant of 10,000 dollars
    to Djibouti Nature (MBZF grant 10251279) for the Djibouti francolin.
