summary: Closed biodiversity survey in Djibouti, contracted by the World Bank in 2021
  as reported by GroundUp, whose camera trapping on the Digri Plateau in March 2022
  confirmed a cheetah.
facts:
- claim: HawkWatch International says a team of scientists led by Megan Murgatroyd
    of HawkWatch International and the Fitzpatrick Institute of African Ornithology
    confirmed a cheetah in Djibouti during a broad biodiversity study.
  url: https://hawkwatch.org/?p=6761
  fetched: 2026-11-12
  quote: The discovery was made by a team of scientists led by Dr. Megan Murgatroyd
    of HawkWatch International and the Fitzpatrick Institute of African Ornithology
    during a broad biodiversity study in the Horn of Africa.
- claim: The cheetah was recorded during a camera-trapping survey on the Digri Plateau
    in March 2022, in the mammal survey part of the study.
  url: https://hawkwatch.org/?p=6761
  fetched: 2026-11-12
  quote: The adult cheetah was spotted during a camera-trapping survey in March 2022
    on the Digri Plateau during the mammal survey portion of the study.
- claim: The study's report in Cat News describes the camera-trapping survey the authors
    carried out.
  url: https://www.peregrinefund.org/sites/default/files/2023-06/Cat_News_77_Murgatroyd_et_al.pdf
  fetched: 2026-11-12
  quote: We undertook a camera trapping survey
- claim: GroundUp reports that in 2021 the World Bank contracted Evan Buechley to
    undertake a biodiversity survey in Djibouti ahead of a development project.
  url: https://groundup.news/article/cheetah-spotted-in-djibouti-for-the-first-time-in-over-30-years/
  fetched: 2026-11-12
  quote: In 2021, the World Bank contracted American ornithologist and vulture expert
    Dr Evan Buechley to undertake a biodiversity survey in Djibouti ahead of a development
    project.
