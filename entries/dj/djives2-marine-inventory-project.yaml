summary: Marine inventory project in Djibouti whose second mission, reported by CERD,
  ran from 5 to 21 November 2025 to extend surveys of macroalgae and sponges, funded
  by ISblue and CERD.
facts:
- claim: CERD reports that after a first campaign in May 2023, a joint team of LEMAR
    and CERD's marine biology laboratory carried out the project's second mission
    from 5 to 21 November 2025.
  url: https://cerd.dj
  fetched: 2026-11-15
  quote: de laboratoire biologie marine du CERD a conduit du 5 au 21 novembre 2025
    la seconde mission du projet DJIVES2
- claim: The mission's main aim was to continue and extend inventories of Djibouti's
    marine flora and fauna, especially macroalgae and sponges, in areas not yet explored.
  url: https://cerd.dj
  fetched: 2026-11-15
  quote: L’objectif principal de cette campagne était de poursuivre et d’enrichir
    les inventaires de la flore et de la faune marines djiboutiennes, en particulier
    les macroalgues et les spongiaires
- claim: The mission was funded by the ISblue programme and CERD, with logistic support
    from the local dive club AquaClub.
  url: https://cerd.dj
  fetched: 2026-11-15
  quote: Cette mission est financée par le programme ISblue et le CERD
