summary: Uses infrared cameras for wildlife and satellite hotspot monitoring for fire;
  a September 2026 report gives 1.4 million mu of land and 84.04 per cent forest cover.
facts:
- claim: A September 2026 report gives its land area as 1.4 million mu and forest
    cover as 84.04 per cent, and describes its plantation restoration model as experience
    for restoring degraded land.
  url: https://www.forestry.gov.cn/lyj/1/dfdt/20260914/688319.html
  fetched: '2026-11-17'
  quote: 监测结果显示，塞罕坝机械林场土地总面积140万亩，有林地面积117.65万亩，森林覆盖率达84.04%；全场活立木总蓄积量1121.5万立方米，乔木林平均蓄积量达每公顷147.1立方米。
- claim: Uses infrared cameras to record protected wildlife and a satellite hotspot
    monitoring system for fire.
  url: https://www.forestry.gov.cn/lyj/1/dfdt/20260914/688319.html
  fetched: '2026-11-17'
  quote: 搭配卫星热点智能监测系统，搭建起“空天地”立体化生态防护体系，实现林火监测全覆盖、无死角、全天候。
