facts:
- claim: A Ministry of Water Resources basin management body exercising water administration
    over the Taihu and Qiantang River basins and Zhejiang and Fujian, excluding the
    Han River basin.
  url: https://www.tba.gov.cn/
  fetched: '2026-11-17'
  quote: 水利部太湖流域管理局是水利部派出的流域管理机构，在太湖流域、钱塘江流域和浙江省、福建省（韩江流域除外）区域内依法行使水行政管理职责，为具有行政职能的事业单位。
- claim: Guides ecological protection and restoration of rivers and lakes and carries
    out comprehensive water environment treatment of the Taihu basin.
  url: https://www.tba.gov.cn/slbthlyglj/zyzz/zyzz.html
  fetched: '2026-11-17'
  quote: 指导河湖水生态保护与修复、河湖水系连通、地下水开发利用以及地下水资源管理保护工作，组织实施河湖生态流量水量管理、保障工作。组织开展太湖流域水环境综合治理有关工作。
