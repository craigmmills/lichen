summary: China's environment ministry. It coordinates the country's work under international
  environmental conventions and is leading the drafting of China's seventh national report
  to the Convention on Biological Diversity.
facts:
- claim: Coordinates China's implementation of international conventions on the ecological
    environment.
  url: https://english.mee.gov.cn/About_MEE/Mandates/
  fetched: '2026-10-31'
  quote: Coordinate the implementation of international conventions regarding the ecological
    environment
- claim: In a reply published in November 2025, the ministry says it is organising more than
    60 experts and leading the compilation of China's seventh national report to the Convention
    on Biological Diversity.
  url: https://www.mee.gov.cn/xxgk2018/xxgk/xxgk13/202511/t20251113_1133435.html
  fetched: '2026-10-31'
  quote: 生态环境部正组织60余位各相关领域专家，牵头编制中国履行《生物多样性公约》第七
- claim: Signed the agreements with the UN Environment Programme and the UN Multi-Partner
    Trust Fund Office that started the Kunming Biodiversity Fund in May 2024.
  url: https://www.mee.gov.cn/xxgk2018/xxgk/xxgk13/202511/t20251113_1133435.html
  fetched: '2026-10-31'
  quote: 生态环境部同联合国环境规划署、联合国多边信托基金办公室共同签署了有关合作协议，正式启动了昆明基金
- claim: Its mandate includes guiding and supervising ecological protection and remediation.
  url: http://english.mee.gov.cn/About_MEE/Mandates/
  fetched: '2026-10-31'
  quote: Guide and supervise ecological protection and remediation
- claim: Its Department of Nature and Ecology Conservation is also its Biodiversity Protection
    Office.
  url: http://english.mee.gov.cn/About_MEE/Internal_Departments/
  fetched: '2026-10-31'
  quote: Department of Nature and Ecology Conservation (Biodiversity Protection Office; National
    Bio-safety Management Office)
- claim: Its address is in Dongcheng District, Beijing.
  url: https://english.mee.gov.cn/
  fetched: '2026-10-31'
  quote: No.12, East Chang'an Avenue, Dongcheng District, Beijing, P.R. China
- claim: Leads the compilation of China's seventh national report under the Convention on
    Biological Diversity, with more than 60 experts.
  url: https://www.mee.gov.cn/xxgk2018/xxgk/xxgk13/202511/t20251113_1133435.html
  fetched: '2026-10-31'
  quote: 生态环境部正组织60余位各相关领域专家，牵头编制中国履行《生物多样性公约》第七次国家报告
- claim: Led the coordination group set up in 1993 for China's implementation of the Convention
    on Biological Diversity.
  url: https://www.mee.gov.cn/xxgk2018/xxgk/xxgk13/202412/t20241204_1097996_wh.html
