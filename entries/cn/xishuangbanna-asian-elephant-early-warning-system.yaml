status: active
summary: Warning system launched in 2020 around the Xishuangbanna National Nature Reserve.
  It uses 600 camera traps, AI image recognition and loudspeakers to warn villages when wild
  elephants are near.
facts:
- claim: Uses AI image recognition, and takes about 15 seconds from image to warning.
  url: https://english.www.gov.cn/news/202306/13/content_WS648820d8c6d0868f4e8dccd5.html
  fetched: '2026-10-31'
  quote: The system uses artificial intelligence (AI) image recognition technology to identify
    the wildlife accurately
- claim: Had sent 10,849 early warnings by June 2023.
  url: https://english.www.gov.cn/news/202306/13/content_WS648820d8c6d0868f4e8dccd5.html
  fetched: '2026-10-31'
  quote: the system had sent 10,849 early warnings
- claim: Huanqiu reports AI recognition trained on more than 3 million elephant photos with
    99% accuracy.
  url: https://society.huanqiu.com/article/4Nsn7tAlgT3
  fetched: '2026-10-31'
  quote: 通过300多万张亚洲象照片训练，识别正确率已达99%
- claim: Uses 600 infrared cameras and 177 intelligent broadcasting sets.
  url: https://english.www.gov.cn/news/202306/13/content_WS648820d8c6d0868f4e8dccd5.html
  fetched: '2026-10-31'
  quote: With the help of 600 infrared cameras and 177 intelligent broadcasting sets
