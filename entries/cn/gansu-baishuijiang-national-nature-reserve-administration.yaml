summary: Administration whose 2021 budget describes a 183,799-hectare reserve in Longnan
  with core, buffer and experimental zones, and lists six protection stations and
  a giant panda breeding centre as its grassroots units.
facts:
- claim: Its 2021 budget describes the Baishuijiang reserve as covering 183,799 hectares
    in Wudu District and Wen County, Longnan, with core, buffer and experimental zones.
  url: https://www.forestry.gov.cn/c/www/gkzsdwyjs/146233.jhtml
  fetched: '2026-11-17'
  quote: 甘肃白水江国家级自然保护区于1978年成立，位于甘肃省最南端，东经104°16’— 105°25’，北纬32°35ˊ－33°00ˊ，行政区划上隶属陇南市武都区、文县的10个乡镇。总面积为183799公顷，区划为核心区90158公顷、缓冲区26132公顷、实验区67509公顷，森林覆盖率为68.6%。
- claim: Its 2021 budget lists six protection stations and a giant panda breeding
    centre as its seven grassroots units.
  url: https://www.forestry.gov.cn/c/www/gkzsdwyjs/146233.jhtml
  fetched: '2026-11-17'
  quote: 管理局下设六个保护站（红土河保护站、碧口保护站、让水河保护站、刘家坪保护站、丹堡河保护站、白马河保护站），一个大熊猫驯养繁殖中心共七个基层单位。
