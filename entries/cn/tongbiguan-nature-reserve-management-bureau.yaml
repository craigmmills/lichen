summary: A Yunnan reserve management body that, a June 2024 report says, had installed
  242 camera traps since 2017 and was reported to have set up a wildlife sound monitoring
  system with the Institute of Zoology, Chinese Academy of Sciences.
facts:
- claim: A June 2024 report says the reserve began camera trap field monitoring in
    2017 and had cumulatively installed 242 cameras, providing grid monitoring of
    its main wildlife areas.
  url: https://www.forestry.gov.cn/c/www/slzyjc/569628.jhtml
  fetched: 2026-11-08
  quote: 自2017年开始，铜壁关保护区开展红外相机的野外监测，累计安装242台红外相机，实现了对保护区主要野生动物分布区域的网格化监测。
- claim: In June 2024, it was reported to have jointly established a wildlife sound
    monitoring system with the Institute of Zoology, Chinese Academy of Sciences,
    aiming at automatic identification of species or individuals.
  url: https://www.forestry.gov.cn/c/www/slzyjc/569628.jhtml
  fetched: 2026-11-08
  quote: 云南铜壁关省级自然保护区管护局与中国科学院动物研究所合作，共同建立铜壁关自然保护区野生动物鸣声监测体系。
