summary: Office for a 1,567-hectare reserve that received 64 Milu in 1993 and 1994;
  a June 2024 survey with partners recorded 439 free-ranging Milu outside it.
facts:
- claim: In June 2024 the management office and researchers from the Beijing Milu
    Ecological Research Centre and Shishou wildlife protection station surveyed a
    free-ranging Milu population outside the reserve and recorded 439 animals.
  url: https://www.forestry.gov.cn/c/www/dfdt/568013.jhtml
  fetched: '2026-11-17'
  quote: 近日，湖北省石首麋鹿国家级自然保护区管理处携手北京麋鹿生态实验中心（麋鹿国家保护研究中心）以及石首市野保站的科研人员，共同开展了一次针对保护区外野生麋鹿种群状况和健康监测的调查。
- claim: The reserve covers 1,567 hectares at the Tianezhou old course of the Yangtze
    and received 64 Milu from the Beijing Nanhaizi Milu Park in 1993 and 1994.
  url: https://www.forestry.gov.cn/c/www/lcdt/626701.jhtml
  fetched: '2026-11-17'
  quote: 保护区总面积1567公顷，位于长江天鹅洲故道
