status: active
summary: Chinese Academy of Sciences monitoring network of 10 sub-networks covering animals,
  plants and microbes, with 30 main sites and 60 affiliated sites and a near-ground remote
  sensing network.
facts:
- claim: Supported by near-ground remote sensing, satellite tracking and molecular biology.
  url: https://english.cas.cn/special-reports/5thwcbr/wcbrrn/202601/t20260105_1145093.shtml
  fetched: '2026-10-31'
  quote: a biodiversity network monitoring system supported by advanced technologies such
    as near ground remote sensing, satellite tracking and molecular biology
- claim: Includes 10 sub-networks, with 30 main sites and 60 affiliated sites.
  url: https://www.biodiversity-science.net/CN/10.17520/biods.2022434
  fetched: '2026-10-31'
  quote: which covers 30 main sites and 60 affiliated sites in China
- claim: Brought high-speed internet to Chebaling reserve in Guangdong, with automatic uploading
    and recognition of monitoring images.
  url: https://english.cas.cn/special-reports/5thwcbr/wcbrrn/202601/t20260105_1145093.shtml
  fetched: '2026-10-31'
  quote: achieving automatic uploading, recognition and analysis of monitoring images
- claim: Started by the Chinese Academy of Sciences in 2013 and accepted into AP BON and GEO
    BON in 2014.
  url: https://www.plantplus.cn/sinobon/news/71
  fetched: '2026-10-31'
  quote: 2014 年，Sino BON 被亚太地区生物多样性监测网络（AP BON）和全球生物多样性监测网络（GEO BON）正式接受成为其成员网络
- claim: Planned as a network of 30 main and 60 secondary sites.
  url: https://www.plantplus.cn/sinobon/news/71
  fetched: '2026-10-31'
  quote: 建立布局合理、综合配套的生物多样性测网络（30 个主点，60 个辅点）
- claim: Its data portal lists 11,097,747 metadata records.
  url: https://www.plantplus.cn/sinobon
  fetched: '2026-10-31'
  quote: 11097747 元数据记录总数
- claim: Accepted in 2014 as a member network of AP BON and GEO BON.
  url: https://www.plantplus.cn/cn/news/71
  fetched: '2026-10-31'
  quote: 2014 年，Sino BON 被亚太地区生物多样性监测网络（AP BON）和全球生物多样性监测网络（GEO BON）正式接受成为其成员网络。
- claim: Includes ten specialist networks covering animals, plants and microbes, and one integrated
    monitoring centre.
  url: https://www.cas.cn/cm/202110/t20211011_4808416.shtml
  fetched: '2026-10-31'
  quote: 正式启动建设中国生物多样性监测与研究网络（Sino BON），包括了动物、植物和微生物三个方面的10个专项网和1个综合监测管理中心
- claim: Launched in 2013 with support from the Chinese Academy of Sciences and the Ministry
    of Finance.
  url: https://www.biodiversity-science.net/CN/10.17520/biods.2022434
  fetched: '2026-10-31'
  quote: was launched in 2013 with strong support from the Chinese Academy of Sciences and
    the Ministry of Finance
- claim: Has 10 subnetworks and a near-ground remote sensing network, across 30 main and 60
    affiliated sites.
  url: https://www.biodiversity-science.net/CN/10.17520/biods.2022434
  fetched: '2026-10-31'
  quote: Sino BON includes 10 subnetworks specialized at monitoring animals, plants and microbes
    and an additional network for near-ground remote sensing, which covers 30 main sites and
    60 affiliated sites in China
