id: sino-bon
kind: programme
name: China Biodiversity Observation and Research Network
also_known_as:
- Sino BON
- 中国生物多样性监测与研究网络
scope: cn
ai_label: conservation-tech
realms:
- land
- freshwater
techniques:
- remote-sensing
