summary: Chinese Academy of Sciences institute in Wuhan that built a passive acoustic monitoring
  system for Yangtze finless porpoises and has applied it in Cambodia and Bangladesh.
facts:
- claim: Its scientists developed passive acoustic devices that automatically identify porpoise
    vocalisations.
  url: https://english.cas.cn/newsroom/cas_media/202505/t20250529_1044685.shtml
  fetched: '2026-10-31'
  quote: scientists from the Institute of Hydrobiology (IHB) of the Chinese Academy of Sciences
    managed to develop passive acoustic monitoring devices capable of capturing real-time
    underwater signals
- claim: Chinese and Cambodian scientists deployed three monitoring stations on the Mekong
    in December 2023.
  url: https://english.cas.cn/newsroom/cas_media/202505/t20250529_1044685.shtml
  fetched: '2026-10-31'
  quote: In December 2023, Chinese and Cambodian scientists deployed three monitoring stations
    along a 140-kilometer stretch of the Mekong River
- claim: Worked with Jahangirnagar University in Bangladesh to monitor Ganges river dolphins
    with a real-time acoustic system, according to the Global Times.
  url: https://english.cas.cn/newsroom/cas-in-media/202607/t20260730_1183463.shtml
  fetched: '2026-10-31'
  quote: researchers from the Institute of Hydrobiology and Aziz's team jointly launched a
    project to apply China's self-developed monitoring technologies
- claim: Its address is in Wuchang District, Wuhan.
  url: http://english.ihb.cas.cn/newsroom/itm/202608/t20260827_1189371.html
  fetched: '2026-10-31'
  quote: 'Address: No. 7 Donghu South Road, Wuchang District, Wuhan, Hubei Province'
- claim: Its site lists a scientific database page among its resources.
  url: http://english.ihb.cas.cn/
  fetched: '2026-10-31'
  quote: Scientific Database
- claim: In its Yangtze finless porpoise survey, an automatic image system with later AI recognition
    was tried to reduce observer error.
  url: https://www.cas.cn/cm/202209/t20220922_4848393.shtml
  fetched: '2026-10-31'
  quote: 此次新尝试的自动影像辅助系统辅以后期人工智能（AI）识别
- claim: Carried out a survey in Bangladesh with Jahangirnagar University using a standardised
    real-time acoustic monitoring system.
  url: https://news.cjn.cn/whpd/yw_19947/202601/t5252725.htm
