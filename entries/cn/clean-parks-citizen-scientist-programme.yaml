summary: A citizen science programme built by NIO and the Shan Shui Conservation Center,
  whose first Shanghai camera trap site began operating on 21 April 2023 with five
  cameras.
facts:
- claim: Launched jointly by NIO and the Shan Shui Conservation Center, with plans
    for nature observation and volunteer training in national parks, partner protected
    areas and urban areas.
  url: https://lhsr.sh.gov.cn/ywdt/20230424/765d2282-5bbc-4a53-96c8-1edcf46ff506.html
