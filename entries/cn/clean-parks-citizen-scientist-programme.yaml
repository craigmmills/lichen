- claim: Its first Shanghai camera trap monitoring site began operating on 21 April
    2023, with five cameras installed at Shanghai Forestry Comprehensive Monitoring
    Experimental Base for biodiversity baseline surveys.
  url: https://lhsr.sh.gov.cn/ywdt/20230424/765d2282-5bbc-4a53-96c8-1edcf46ff506.html
