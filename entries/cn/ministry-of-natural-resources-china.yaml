summary: China's ministry for natural resources, formed in 2018 and taking on the work of
  the former surveying and mapping bureau and the State Oceanic Administration. It is the
  national mapping authority.
facts:
- claim: Formed in 2018, taking on the responsibilities of the Ministry of Land and Resources,
    the State Bureau of Surveying and Mapping and the State Oceanic Administration, according
    to Wikipedia.
  url: https://Www.wikipedia.org/wiki/Ministry_of_Natural_Resources_(China)
  fetched: '2026-10-31'
  quote: It was formed on 19 March 2018, taking on the responsibilities of the now-defunct
    Ministry of Land and Resources
- claim: The Second Institute of Oceanography is directly affiliated to it.
  url: https://sio.org.cn/en/
  fetched: '2026-10-31'
  quote: Directly affiliated to the Ministry of Natural Resources (MNR), the Second Institute
    of Oceanography (SIO) was established in 1966
- claim: The land satellite centre sits under it.
  url: https://www.isprs.org/resources/datasets/images/lasac.aspx
  fetched: '2026-10-31'
  quote: under the Ministry of Nature Resources
- claim: A ministry of the State Council that keeps the State Oceanic Administration title
    externally.
  url: https://m.cgs.gov.cn/ddyw/201809/t20180911_467083.html
  fetched: '2026-10-31'
  quote: 自然资源部是国务院组成部门，为正部级，对外保留国家海洋局牌子。
- claim: Responsible for surveying, monitoring and evaluating natural resources.
  url: https://m.cgs.gov.cn/ddyw/201809/t20180911_467083.html
  fetched: '2026-10-31'
  quote: （二）负责自然资源调查监测评价。
- claim: Wikipedia says it is a State Council department responsible for natural resources.
  url: https://en.wikipedia.org/wiki/Ministry_of_Natural_Resources_(China)
  fetched: '2026-10-31'
  quote: is an executive-department of the State Council of China which is responsible for
    natural resources in the country
- claim: Wikipedia says it took on the State Bureau of Surveying and Mapping and State Oceanic
    Administration.
  url: https://en.wikipedia.org/wiki/Ministry_of_Natural_Resources_(China)
  fetched: '2026-10-31'
  quote: taking on the responsibilities of the now-defunct Ministry of Land and Resources
    , State Bureau of Surveying and Mapping and State Oceanic Administration
- claim: Wikipedia gives its headquarters as Beijing.
