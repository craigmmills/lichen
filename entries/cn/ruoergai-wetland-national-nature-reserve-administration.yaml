summary: Deputy county-level public institution that sets wetland protection rules
  and manages the 166,570.6-hectare Ruoergai reserve, which protects alpine peat marsh
  and rare species including black-necked cranes.
facts:
- claim: A deputy county-level public institution that sets wetland protection rules
    and carries out the reserve's construction, planning, protection and management.
  url: https://www.ruoergai.gov.cn/regxrmzf/zfbm/201909/dddc79b030814889ba49a1b0270c14c5.shtml
  fetched: '2026-11-17'
  quote: 制定湿地保护、生态功能保护的各项管理制度，组织实施保护区的建设、规划、保护和管理。
- claim: The reserve covers 166,570.6 hectares in Ruoergai County and principally
    protects alpine peat marsh ecosystems and rare species including black-necked
    cranes; it was listed as a wetland of international importance in 2008.
  url: https://www.forestry.gov.cn/c/www/sd/22047.jhtml
  fetched: '2026-11-17'
  quote: 是以高寒泥炭沼泽湿地生态系统和黑颈鹤等珍稀濒危物种为主要保护对象的自然保护区，面积166570.6公顷。
