summary: Chinese organisation founded in 2013 to protect wild cats. It runs camera-trap monitoring
  of North China leopards in Shanxi and has identified nearly 100 adult leopards.
facts:
- claim: Founded in 2013 and focused on protecting China's wild cats.
  url: https://news.cgtn.com/news/2023-03-15/Back-to-Beijing-Restoring-leopards-habitat-in-N-China-1ibACMEI8tW/index.html
  fetched: '2026-10-31'
  quote: founded the China Felid Conservation Alliance (CFCA) in 2013, an organization focused
    on protecting China's wild cats
- claim: Its team has identified nearly 100 adult leopards in Shanxi over a decade.
  url: https://news.cgtn.com/news/2023-03-15/Back-to-Beijing-Restoring-leopards-habitat-in-N-China-1ibACMEI8tW/index.html
  fetched: '2026-10-31'
  quote: Over the past decade, Song and his CFCA teammates have identified nearly 100 adult
    leopards in Shanxi
- claim: Local villagers in Heshun help with patrols, camera maintenance and data collection.
  url: https://news.cgtn.com/news/2023-03-15/Back-to-Beijing-Restoring-leopards-habitat-in-N-China-1ibACMEI8tW/index.html
  fetched: '2026-10-31'
  quote: more than 20 local villagers in Heshun are helping us in patrol, camera maintenance,
    data collection and publicity
- claim: Its paper gives its address as Beijing.
  url: https://www.biodiversity-science.net/article/2020/1005-0094/1005-0094-28-9-1067.shtml
  fetched: '2026-10-31'
  quote: Chinese Felid Conservation Alliance, Beijing 100875
- claim: It leads the camera trap platform, working with research institutes, universities,
    conservation groups, government and protected areas.
  url: https://www.biodiversity-science.net/article/2020/1005-0094/1005-0094-28-9-1067.shtml
  fetched: '2026-10-31'
  quote: 该平台由中国猫科动物保护联盟(猫盟)牵头组织, 与科研院所、高校、保护组织、政府部门、保护地管理机构等合作开展监测
- claim: Works to conserve China's 12 native wild cat species.
  url: https://www.forestry.gov.cn/c/www/lcdt/606923.jhtml
  fetched: '2026-10-31'
  quote: 该组织以科学保护虎、豹、云豹、金猫等中国12种本土野生猫科动物为目标。
- claim: A camera trap it set in the Taihang mountains in Shanxi recorded a North China leopard,
    according to a report on the forestry administration's site.
  url: https://www.forestry.gov.cn/c/www/lcdt/606923.jhtml
  fetched: '2026-10-31'
  quote: 山西晋中太行山，猫盟设置的红外触发相机拍摄到一只华北豹在晨晖中走下一块岩石
