summary: 'Reported in December 2023: supplementary water exceeding 3 billion cubic
  metres, wetlands stable above 170,000 hectares and monitoring covering 860 square
  kilometres, 40.9 per cent of the reserve.'
facts:
- claim: A December 2023 report says the Zhalong wetland had received more than 3
    billion cubic metres of supplementary water and its wetland area was stable above
    170,000 hectares.
  url: https://www.forestry.gov.cn/lyj/1/dfdt/20231212/536633.html
  fetched: '2026-11-17'
  quote: 记者从扎龙国家级自然保护区管理局获悉，截至目前，扎龙湿地累计补水量已超过30亿立方米，保证了水量充盈。湿地生态系统呈正向演替过程，湿地面积稳定在17万公顷以上。
- claim: By December 2023 it had built an integrated sky-ground-air monitoring system
    and a networked video platform, with monitoring covering 860 square kilometres,
    40.9 per cent of the reserve.
  url: https://www.forestry.gov.cn/lyj/1/dfdt/20231212/536633.html
  fetched: '2026-11-17'
  quote: 搭建起“天地空”一体化监管体系，建设网络可视一体化监管平台，将野外巡护执法、科研监测、宣传教育、视频监控、森林草原防火、资源管理等工作内容全部纳入。目前，监控覆盖面积达到860平方公里，占保护区总面积的40.9%。
