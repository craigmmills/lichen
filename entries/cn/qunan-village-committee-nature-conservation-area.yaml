summary: Village committee for a community conservation area approved by Fusui County
  forestry bureau in 2014; an August 2019 interview described it managing the area
  daily, with rules, patrols and a 14-person volunteer team.
facts:
- claim: In an August 2019 interview, the village committee was described as managing
    the conservation area day to day, publishing village rules and patrol arrangements
    and forming a volunteer patrol team of 14, mostly young people.
  url: https://civilpa.oecm.org.cn/portal/article/index/id/205.html
  fetched: '2026-11-17'
  quote: 屯委负责保护小区的日常管理，制定、公布了村规民约和巡护管理制度，成立了14个年轻人为主的志愿巡护队，全村共同参与日常监督，防止、制止外来人员盗猎和砍伐等破坏行为。
- claim: The conservation area was approved by the Fusui County forestry bureau in
    2014 after committee mobilisation, community mobilisation, a village representatives'
    vote and an application.
  url: https://civilpa.oecm.org.cn/portal/article/index/id/205.html
  fetched: '2026-11-17'
  quote: 2014年，经过屯委动员、社区动员、村民代表大会投票、递交申请，最终在扶绥县林业局批准下成立了保护小区。
