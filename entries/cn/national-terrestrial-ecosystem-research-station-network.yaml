  quote: 以森林、湿地、荒漠三类陆地生态系统为主要观测研究对象
- claim: The July 2014 notice made the 140 stations already established by the State
    Forestry Administration members of the network.
  url: https://www.forestry.gov.cn/c/www/gkgfxwj/300357.jhtml
