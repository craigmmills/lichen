- claim: The 2014 rules required stations to make long-term continuous observations
    of basic ecosystem variables and provide the data regularly.
  url: https://www.forestry.gov.cn/c/www/gkgfxwj/300357.jhtml
  fetched: 2026-11-08
  quote: （一）数据积累。对生态系统的基本生态要素进行长期连续观测，收集、保存并定期提供数据信息。
