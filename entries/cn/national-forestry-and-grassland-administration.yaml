summary: China's national bureau for forests, grasslands, wetlands, deserts and land wildlife,
  also known as the National Park Administration, and so the country's protected-area agency.
  It publishes monitoring figures for national park wildlife.
facts:
- claim: Responsible for the supervision and management of forests, grasslands, wetlands,
    deserts and terrestrial wildlife, according to Wikipedia.
  url: https://en.wikipedia.org/wiki/National_Forestry_and_Grassland_Administration
  fetched: '2026-10-31'
  quote: responsible for the supervision and management of forests, grasslands, wetlands,
    deserts, and terrestrial wildlife
- claim: Is concurrently known as the National Park Administration, according to Wikipedia.
  url: https://en.wikipedia.org/wiki/National_Forestry_and_Grassland_Administration
  fetched: '2026-10-31'
  quote: concurrently known as the National Park Administration
- claim: Released monitoring data showing 72 wild Amur tigers in the Northeast China Tiger
    and Leopard National Park in 2026, according to Science and Technology Daily.
  url: https://www.stdaily.com/web/English/2026-10/21/content_598562.html
  fetched: '2026-10-31'
  quote: According to the latest monitoring data released by the National Forestry and Grassland
    Administration
- claim: Its site lists itself as the host of the site.
  url: https://www.forestry.gov.cn/
  fetched: '2026-10-31'
  quote: 主办：国家林业和草原局
- claim: Its stated duties include supervising forestry and grassland protection and restoration.
  url: https://www.forestry.gov.cn/jgjj/69631.jhtml
  fetched: '2026-10-31'
  quote: 负责林业和草原及其生态保护修复的监督管理
- claim: Its duties include dynamic monitoring of forest, grassland, wetland, desert and terrestrial
    wildlife resources.
  url: https://www.forestry.gov.cn/jgjj/69631.jhtml
  fetched: '2026-10-31'
  quote: 组织开展森林、草原、湿地、荒漠和陆生野生动植物资源动态监测与评价
- claim: A vice-ministerial national bureau under the Ministry of Natural Resources that also
    carries the title of National Park Administration.
  url: https://www.forestry.gov.cn/main/4815/20180911/120000155283699.html
  fetched: '2026-10-31'
  quote: 国家林业和草原局是自然资源部管理的国家局，为副部级，加挂国家公园管理局牌子。
- claim: Supervises all categories of protected area and is responsible for work related to
    biodiversity protection.
  url: https://www.forestry.gov.cn/main/4815/20180911/120000155283699.html
  fetched: '2026-10-31'
  quote: （六）负责监督管理各类自然保护地。
- claim: Issued guidance on promoting AI in forestry and grassland work, with the aim of applying
    AI across the sector's core business.
  url: https://www.forestry.gov.cn/c/www/gkzfwj/272575.jhtml
  fetched: '2026-10-31'
  quote: 全面推动人工智能技术在林草业核心业务中的应用
