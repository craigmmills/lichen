  quote: “天空地人”一体化监测系统
- claim: Automatically recognises 119 animal species with accuracy above 90 percent, at a
    density of one camera trap per square kilometre.
  url: https://www.stdaily.com/web/gdxw/2026-04/21/content_505850.html
  fetched: '2026-10-31'
  quote: 我们按照每平方公里一台红外相机的密度来布置设备，结合智能模型，目前系统可自动识别119种动物，识别精度超90%
- claim: Environment ministry policy researchers report a pilot human-bear conflict monitoring
