    analysis by specialists.
  url: https://www.forestry.gov.cn/lyj/1/dzbhdt/20260824/685564.html
  fetched: 2026-11-08
  quote: 形成供专业人员进一步分析研究的“生物多样性数据库”
- claim: Its long-running projects include Shanghai butterfly monitoring and Chongming Dongtan
    bird surveys.
  url: https://www.forestry.gov.cn/lyj/1/dzbhdt/20260824/685564.html
  fetched: 2026-11-08
  quote: 以及持续多年的经典项目“上海昆虫家谱”“上海蝴蝶监测”“路杀生物调查”“崇明东滩鸟类调查”等。
