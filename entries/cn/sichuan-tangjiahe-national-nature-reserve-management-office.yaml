summary: Management office for the 40,000-hectare Tangjiahe reserve in the Giant Panda
  National Park, whose patrollers monitor 104 panda transects and service infrared
  cameras, with joint cross-boundary patrols planned in February 2023.
facts:
- claim: The Tangjiahe reserve it manages covers 40,000 hectares inside the Giant
    Panda National Park and principally protects giant pandas and their habitat.
  url: https://www.forestry.gov.cn/c/www/xwdt/366645.jhtml
  fetched: '2026-11-17'
  quote: 唐家河国家级自然保护区位于大熊猫国家公园内，面积达4万公顷，以大熊猫及其栖息地为主要保护对象，有各类动植物3700余种。
- claim: In February 2023 its director said the reserve planned joint cross-boundary
    patrol monitoring with the Xinyi village protected area and Laohegou protection
    centre for the first quarter.
  url: https://www.forestry.gov.cn/c/www/xwdt/366645.jhtml
  fetched: '2026-11-17'
  quote: 唐家河国家级自然保护区管理处处长谌利民说，保护区还将实行跨区域联合巡护，联手新驿村保护地、老河沟保护中心开展第一季度跨区域联合巡护监测。
- claim: Patrollers monitor 104 panda ecological transects and replace infrared cameras
    and bring back their images.
  url: https://www.forestry.gov.cn/c/www/xwdt/366645.jhtml
  fetched: '2026-11-17'
  quote: 根据预估，我们会对电池电量不够的红外相机进行替换，同时把拍摄的照片带回。
