summary: A Yellow River basin wetland project, funded by Lao Niu Foundation and run
  by IGSNRR, which at its September 2021 launch planned a database of waterbirds and
  habitats to assess and forecast wetland state.
facts:
- claim: At its September 2021 launch, the project planned to build a database of
    Yellow River basin waterbirds and habitats to assess and forecast the state of
    the basin's wetlands.
  url: https://www.lnfoundation.cn/index.php?s=%2FIndex%2Fnews_show%2Fid%2F2254%2Fcid%2F172.html
  fetched: 2026-11-08
  quote: 项目将通过构建黄河流域水鸟及其栖息地数据库，系统评估和预测黄河流域湿地现状及未来变化趋势
- claim: The October 2021 launch report named IGSNRR, Beijing Normal University, Beijing
    Forestry University, the Aerospace Information Research Institute and other CAS
    institutes as joint implementers.
  url: https://www.lnfoundation.cn/index.php?s=%2FIndex%2Fnews_show%2Fid%2F2254%2Fcid%2F172.html
