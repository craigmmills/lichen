summary: Official body for managing Saint Lucia's forest reserves and terrestrial wildlife, supported
  by FMIS, and reported in 2024 to use camera traps, drones and real-time cameras for monitoring and feral
  pig detection.
facts:
- claim: The ministry says the Forest and Land Resources Division is the official body responsible for
    managing Saint Lucia's forest reserves and protecting and managing its terrestrial wildlife.
  url: https://moaslu.govt.lc/forestry/
  fetched: 2026-11-12
  quote: The Forest and Land Resources Division is the official body responsible for the direct management
    of Saint Lucia’s forest reserves, for oversight of the management of all forests on Saint Lucia and
    for the protection and management of Saint Lucia’s terrestrial wildlife.
- claim: The ministry says its activities are supported by the Forest Management Information Unit (FMIS).
  url: https://moaslu.govt.lc/forestry/
  fetched: 2026-11-12
  quote: These activity areas are all supported by the Forest Management Information Unit (FMIS).
- claim: A Forestry Department statement for World Wildlife Day 2024, published by St Lucia Times, says
    camera traps and drones are used to gather wildlife information and to patrol and monitor protected
    areas and forest reserves.
  url: https://stluciatimes.com/?p=162012
  fetched: 2026-11-12
  quote: Currently, camera traps and drones are incorporated in our work program for information gathering
    on wildlife and patrolling and monitoring of protected areas and the forest reserves.
- claim: The 2024 statement said real-time cameras were being used to detect feral pigs in forest reserves
    and on private land.
  url: https://stluciatimes.com/?p=162012
  fetched: 2026-11-12
  quote: Additionally, real time cameras are being used to detect the presence of feral pigs in our forest
    reserves and private lands.
- claim: The CBD lists an Assistant Chief Forest Officer at the Gabriel Charles Forestry Complex, Union,
    Castries, among Saint Lucia's focal points.
  url: https://www.cbd.int/countries/nfp?country=lc
  fetched: 2026-11-12
  quote: Gabriel Charles Forestry Complex, Union
