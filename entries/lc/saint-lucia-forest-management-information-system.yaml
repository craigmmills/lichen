summary: Unit run by the Forestry Department that, according to the ministry, holds all data the Division
  collects and handles data collection, analysis, GIS mapping, digitising and reporting, with a team of
  trained drone pilots.
facts:
- claim: The ministry says FMIS is the repository for all data collected by the Division, including wildlife,
    wildfire and forest reserve data and maps.
  url: https://moaslu.govt.lc/fmis/
  fetched: 2026-11-12
  quote: Data collected by the Division include wildlife data, wildfire data, forest reserve data, chainsaw
    owners, removal and transportation of local timbre, project data and maps generated within the Division.
- claim: Its main activities are data collection, analysis, GIS mapping, digitising and reporting under
    multilateral environmental agreements.
  url: https://moaslu.govt.lc/fmis/
  fetched: 2026-11-12
  quote: The main activities undertaken by the Unit are data collection, data analysis, map generation
    using GIS, digitizing of exiting data, and compilation of reports to meet the reporting obligations
    of the Division under the different MEAs.
- claim: A team of trained drone pilots works under the FMIS unit.
  url: https://moaslu.govt.lc/fmis/
  fetched: 2026-11-12
  quote: Unmanned Aerial Vehicles, more commonly known as “drones” are currently being used by a team
    of trained UAV pilots under the FMIS unit, Forestry Department.
