summary: Non-profit established in 1994 to oversee marine resources on Saint Lucia's
  southwestern coast, acting as Local Fisheries Management Authority over about 11
  kilometres, and receiving a February 2025 post-Hurricane Beryl grant.
facts:
- claim: The Parastatal Monitoring Department lists the SMMA as a non-profit organisation
    established in 1994 to oversee the use and conservation of marine resources along
    Saint Lucia's southwestern coast.
  url: https://pmd.govt.lc/statutory-body/soufriere-marine-management-association/
  fetched: 2026-11-13
  quote: is a non-profit organization established in 1994 to oversee the sustainable
    use and conservation of marine resources along the southwestern coast of Saint
    Lucia
- claim: The same page says it serves as the Local Fisheries Management Authority
    under the Fisheries Act, over about 11 kilometres of coastline.
  url: https://pmd.govt.lc/statutory-body/soufriere-marine-management-association/
  fetched: 2026-11-13
  quote: It serves as the Local Fisheries Management Authority, a designation conferred
    under the Fisheries Act.
- claim: The page gives its address in Soufriere.
  url: https://pmd.govt.lc/statutory-body/soufriere-marine-management-association/
  fetched: 2026-11-13
  quote: 3 Bay Street, P.O. Box 305 Soufriere Saint Lucia
- claim: A February 2025 grant from the Saint Lucia National Conservation Fund, after
    Hurricane Beryl, is to restore the SMMA's monitoring vessel and reinstall moorings.
  url: https://www.govt.lc/news/ncf-assists-soufriere-marine-management-association
  fetched: 2026-11-13
  quote: The funds received will directly assist in the restoration of the organisation’s
    monitoring vessel and reinstallation of moorings which are critical to supporting
    management action in the marine managed area.
