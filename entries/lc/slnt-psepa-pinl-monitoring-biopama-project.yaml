summary: Closed BIOPAMA-funded project run by the Saint Lucia National Trust, May 2021 to April 2022,
  which aimed to improve monitoring and management capacity and planned remote monitoring devices for
  the Pointe Sables protected area.
facts:
- claim: The BIOPAMA action page lists the project for May 2021 to April 2022 and says it aimed to improve
    the Saint Lucia National Trust's monitoring and management capacity.
  url: https://action.biopama.org/?p=1889
  fetched: 2026-11-12
  quote: The project aims to improve the Saint Lucia National Trust’s monitoring and management capacity
    to continue key conservation initiatives during this period of economic downturn.
- claim: The project page planned increased monitoring and surveys for the offshore islands, marine turtles
    and other endangered wildlife during the 2021–2022 project.
  url: https://action.biopama.org/?p=1889
  fetched: 2026-11-12
  quote: Increased monitoring activities and surveys will be conducted for the offshore islands, marine
    turtles and other endangered wildlife.
- claim: The project page said remote monitoring devices provided by the 2021–2022 project would allow
    more frequent monitoring of the PSEPA.
  url: https://action.biopama.org/?p=1889
  fetched: 2026-11-12
  quote: Therefore the increased capacity to use remote monitoring devices provided by this project will
    enable more frequent monitoring in order to capture changes in the area.
