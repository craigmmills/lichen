summary: Active project launched on World Environment Day 2025 to restore the Soufrière
  River, using a multispectral drone operated by six community members trained as
  certified pilots, funded at US$150,000.
facts:
- claim: A GEF Small Grants Programme story of 5 September 2025 says the project was
    launched on World Environment Day 2025 to restore the Soufrière River, led by
    the Caribbean Student Environmental Alliance Inc. (WaterWays Caribbean), which
    has no entry yet.
  url: https://sgp.undp.org/resources-155/our-stories/809-flowing-clean-river-restoration-project-gains-momentum-in-soufriere-saint-lucia.html
  fetched: 2026-11-13
  quote: Led by the Caribbean Student Environmental Alliance Inc. (WaterWays Caribbean)
    , the initiative blends citizen science, advocacy, and hands-on restoration to
    protect one of Saint Lucia’s most vital freshwater systems.
- claim: The September 2025 story says the project has a multispectral drone capable
    of mapping waterways and detecting ecological changes, and six community members
    trained as certified pilots form the core of its drone monitoring team.
  url: https://sgp.undp.org/resources-155/our-stories/809-flowing-clean-river-restoration-project-gains-momentum-in-soufriere-saint-lucia.html
  fetched: 2026-11-13
  quote: The project also leverages cutting-edge technology, including a multispectral
    drone capable of mapping waterways and detecting ecological changes in real time.
- claim: Six community members trained as certified drone pilots form the Flowing
    Clean Drone Monitoring Team.
  url: https://sgp.undp.org/resources-155/our-stories/809-flowing-clean-river-restoration-project-gains-momentum-in-soufriere-saint-lucia.html
  fetched: 2026-11-13
  quote: The six community members are now certified pilots, forming the core of the
    Flowing Clean Drone Monitoring Team.
- claim: The project is funded at US$150,000 through the PROCARIBE+ regional project
    and the GEF Small Grants Programme, with co-funding from the Soufrière Regional
    Development Foundation and the Government of Saint Lucia. None of these funders
    has an entry yet.
  url: https://sgp.undp.org/resources-155/our-stories/809-flowing-clean-river-restoration-project-gains-momentum-in-soufriere-saint-lucia.html
  fetched: 2026-11-13
  quote: Funded at US $150,000, the project is supported by the UNDP/GEF/UNOPS PROCARIBE+
    regional project and the Global Environment Facility Small Grants Programme (GEF
    SGP)
