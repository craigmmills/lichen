summary: Project on the Endangered White-breasted Thrasher in Saint Lucia that used
  camera traps across the Mandelé range, recording 19 nests at four field sites from
  July 2020.
facts:
- claim: A November 2020 BirdsCaribbean post says the team installed a network of
    camera traps across the Mandelé range to gauge predator abundance, monitored regularly
    by Durrell and partners.
  url: https://birdscaribbean.org/?p=12128
  fetched: 2026-11-13
  quote: The team had recently installed a network of camera traps, which take photos
    when trigged by motion, across the Mandelé range to get an indication of potential
    predator abundance in the area.
- claim: The post says camera traps watched thrasher nests from July 2020 and recorded
    19 nests across the four field sites.
  url: https://birdscaribbean.org/?p=12128
  fetched: 2026-11-13
  quote: We recorded a total of 19 White-breasted Thrasher nests during this period,
    with nests occurring across each of our four field sites.
- claim: The November 2020 post names Bela Barata, a Durrell Wildlife Conservation
    Trust project officer, as coordinating the project at that time.
  url: https://birdscaribbean.org/?p=12128
  fetched: 2026-11-13
  quote: Bela is Project Officer with Durrell Wildlife Conservation Trust. She coordinates
    this project
- claim: The MBZ grant page lists the project's activities as including monitoring
    invasive predators and thrasher nesting success with a camera trap network.
  url: https://www.speciesconservation.org/small-grant/white-breasted-thrasher/23986
  fetched: 2026-11-13
  quote: monitoring abundance of invasive predators and thrasher nesting success using
    a camera trap network
