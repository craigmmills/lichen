summary: Saint Lucia's first national environmental information system, launched in August 2018 with UN
  Environment on a GEF-funded project, and reported by GEF to involve an agreement among 17 major environmental
  data providers.
facts:
- claim: A GEF news item of 29 March 2019 says the government launched its first national environmental
    information system in August 2018, working with UN Environment on a GEF-funded project.
  url: https://www.thegef.org/news/paradise-found-saint-lucia-preserving-beauty-through-data-and-policy-action
  fetched: 2026-11-12
  quote: In August 2018, the island took a big step forward. Working with UN Environment on a Global Environment
    Facility-funded project, the Saint Lucian government launched its first national environmental information
    system.
- claim: The item says 17 major environmental data providers signed an agreement to cooperate on developing
    and using the system.
  url: https://www.thegef.org/news/paradise-found-saint-lucia-preserving-beauty-through-data-and-policy-action
  fetched: 2026-11-12
  quote: As part of the project, 17 major environmental data providers signed an agreement to cooperate
