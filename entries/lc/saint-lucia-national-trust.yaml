summary: Established in 1975, this statutory membership body gathers Maria Islands ecological data, supports
  turtle and mangrove monitoring, organised drone training and received turtle-tagging training in 2021.
facts:
- claim: IUCN describes it as a membership organisation established in 1975 under the Saint Lucia National
    Trust Act.
  url: https://iucn.org/node/34325
  fetched: 2026-11-12
  quote: The Saint Lucia National Trust (SLNT) is a membership organization established in 1975 under
    the Saint Lucia National Trust Act, Chapter 6.02 of the Revised Laws of Saint Lucia
- claim: IUCN lists it in the National NGO membership category.
  url: https://iucn.org/node/34325
  fetched: 2026-11-12
  quote: National NGO
- claim: A 2024 Trust statement published by The Voice calls it a statutory body established by Act of
    Parliament in 1975.
  url: https://thevoiceslu.com/2024/10/national-trust-addresses-concerns-raised-in-parliament-last-week/
  fetched: 2026-11-12
  quote: The Trust, established on September 26, 1975, by an Act of Parliament, is a statutory body dedicated
    to preserving Saint Lucia’s heritage
- claim: An INTO blog says Trust rangers go out each week to gather data on the Maria Islands reserve's
    species and habitat.
  url: https://www.into.org/guardians-of-nature-and-heritage-world-ranger-day-in-saint-lucia/
  fetched: 2026-11-12
  quote: Each week, the Trust rangers go out to gather data on these unique species and their habitat.
- claim: The same blog says the Trust supports other national agencies with marine turtle monitoring,
    mangrove research and beach profiling.
  url: https://www.into.org/guardians-of-nature-and-heritage-world-ranger-day-in-saint-lucia/
  fetched: 2026-11-12
  quote: In addition, the Trust supports other national agencies with marine turtle monitoring, mangrove
    research, beach profiling and other species conservation work.
- claim: A 2021 press release says the Trust organised a five-day training programme in the use of drones,
    starting 11 October 2021.
  url: https://thevoiceslu.com/2021/10/uas-training-slnt-goes-aerial-to-monitor-and-conserve-protected-areas
  fetched: 2026-11-12
  quote: a 5-day training programme in the proper use of Unmanned Aerial Systems (UAS) organized by the
    Saint Lucia National Trust, commenced
- claim: A 2021 report in The Voice says SLNT rangers from the PSEPA and Pigeon Island were trained by
    the Department of Fisheries to tag turtles and collect turtle monitoring data.
  url: https://thevoiceslu.com/2021/10/slnt-and-department-of-fisheries-tag-to-conserve-turtles/
  fetched: 2026-11-12
  quote: Participants were also taught how to tag turtles and collect turtle monitoring data.
