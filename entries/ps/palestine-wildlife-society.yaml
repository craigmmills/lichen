summary: Established officially in 1999, this not-for-profit wildlife organisation describes satellite
  tracking, acoustic monitoring and Palestine's first bird ringing station in Jericho.
facts:
- claim: Describes itself as a not-for-profit organisation working in research, education and wildlife
    protection in Palestine and the region.
  url: https://www.wildlife-pal.org/Article/54/About-Us
  fetched: 2026-11-12
  quote: Palestine Wildlife Society (PWLS) is an active, professional, Not for profit organization working
    in research and education, and wildlife protection in Palestine and the region.
- claim: Officially established in 1999.
  url: https://www.wildlife-pal.org/Article/54/About-Us
  fetched: 2026-11-12
  quote: Their dream came to fruition in 1999 with the official establishment of the Palestine Wildlife
    Society.
- claim: Lists monitoring and promoting important bird areas among its objectives.
  url: https://www.wildlife-pal.org/Article/54/About-Us
  fetched: 2026-11-12
  quote: Monitoring and promoting important bird areas
- claim: Its bird monitoring programme page describes tracking storks, pelicans, eagles, cranes and vultures
    with satellite-linked transmitters.
  url: https://wildlife-pal.org/en/Article/56/Bird-Migration
  fetched: 2026-11-12
  quote: With the aid of satellite-linked transmitters attached to birds, we are able to track migrating
    birds (storks, pelicans, and eagles), wintering birds (cranes) and resident birds (vultures).
- claim: The same page says recording stations with sensitive microphones were placed in Beit Jala and
    Jericho to study night migration, in cooperation with an acoustic laboratory at Cornell University.
  url: https://wildlife-pal.org/en/Article/56/Bird-Migration
  fetched: 2026-11-12
  quote: Recording stations, which are equipped with highly sensitive microphones, have been placed in
    Beit Jala & Jericho.
- claim: The page names the station in the Wildlife Monitoring Station in Jericho as the first ringing
    station in Palestine.
  url: https://wildlife-pal.org/en/Article/56/Bird-Migration
  fetched: 2026-11-12
  quote: The station for the study of Jericho birds located in the Wildlife Monitoring Station is the
    FIRST ringing station in the Palestine.
