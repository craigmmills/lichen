summary: Palestinian environmental body, set up in 1996 by presidential decree and renamed in 2002, whose
  mission is protecting the environment and preventing hazards, with a 2017 to 2022 strategy covering
  biodiversity management.
facts:
- claim: Established in 1996 by presidential decree as the Palestinian Environmental Authority, and named
    the Environment Quality Authority in 2002.
  url: https://ps.chm-cbd.net/environment-quality-authority-eqa
  fetched: 2026-11-12
  quote: so that its official name in 2002 was "Environment Quality Authority".
- claim: Its main mission is to protect the environment with all its elements and prevent environmental
    hazards.
  url: https://ps.chm-cbd.net/environment-quality-authority-eqa
  fetched: 2026-11-12
  quote: its main mission is to protecting the environment with all its elements as well as preventing
    environmental hazards to which all living organisms are exposed
- claim: One objective of its 2017–2022 cross-sectoral environment strategy was to maintain and manage
    the natural environment and biodiversity sustainably.
  url: https://ps.chm-cbd.net/environment-quality-authority-eqa
  fetched: 2026-11-12
  quote: The natural environment and biodiversity are maintained and managed in a sustainable manner.
