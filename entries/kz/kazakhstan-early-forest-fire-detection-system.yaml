summary: Programme piloting AI-based early detection of forest and steppe fires in
  the Semey Ormany reserve with 37 cameras over 510,000 hectares, planned to cover
  the most fire-prone areas of 24 parks and reserves by July 2026.
facts:
- claim: The Prime Minister reviewed the pilot of an AI-based early detection system
    for forest and steppe fires in the Semey Ormany reserve (ministry news, 9 April
    2026).
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
  quote: На территории резервата Премьер-министр ознакомился с результатами внедрения
    в пилотном режиме системы раннего обнаружения лесных и степных пожаров, функционирующей
    на базе ИИ.
- claim: Round-the-clock video monitoring with thermal and optical cameras automatically
    detects signs of fire at early stages.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
  quote: комплексы круглосуточного видеомониторинга с использованием современных тепловизионных
    и оптических камер автоматически фиксируют признаки возгорания на ранних стадиях
- claim: The system was installed in the reserve the previous year with 37 cameras
    covering 510,000 hectares.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
  quote: В прошлом году в резервате внедрена система раннего обнаружения пожаров с
    37 современными камерами, покрывающими 510 тыс. гектаров.
- claim: Kazakhtelecom reported a two-stage roll-out to forest enterprises in Akmola
    region, two reserves near Astana and the Karkaraly and Bayanaul parks, with work
    finishing in Ile-Alatau, Sairam-Ugam and Kolsai lakes parks.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
  quote: Завершаются работы в Иле-Алатауском, Сайрам-Угамском нацпарках и ГНПП «Кольсайские
    озера».
- claim: The plan was to cover the most fire-prone areas of 24 nature parks and reserves
    by July 2026.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
  quote: в июле т.г планируется завершить охват наиболее пожароопасных территорий
    24-х природных парков и заповедников Казахстана
- claim: The ministry news item is dated 9 April 2026.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1197269?lang=ru
  fetched: 2026-11-13
