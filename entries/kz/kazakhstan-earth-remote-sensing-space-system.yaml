summary: Two-satellite system, KazEOSat-1 and KazEOSat-2, with ground complexes; a ministry page reports
  all forest land digitised in 2018 and daily monitoring of felling, burnt spots and fire hazard.
facts:
- claim: A Ministry of Artificial Intelligence and Digital Development page describes the system as two
    satellites, KazEOSat-1 and KazEOSat-2, with ground complexes for control and for receiving, processing
    and distributing data.
  url: https://www.gov.kz/org/maidd/projects/details/18?lang=en
  fetched: 2026-11-08
  quote: The domestic ERS system consists of high spatial resolution "KazEOSat-1" and medium spatial resolution
    "KazEOSat-2" satellites, as well as ground-based complexes for satellite control and reception, processing
    and distribution of ERS data directly to consumers.
- claim: The same page reports, for 2018, all forest land digitised and daily monitoring of felling, burnt
    spots and fire hazard.
  url: https://www.gov.kz/org/maidd/projects/details/18?lang=en
  fetched: 2026-11-08
  quote: Digitized forest land - 17.6 million hectares (100%)
- claim: The same page says images can be ordered at eo.gharysh.kz.
  url: https://www.gov.kz/org/maidd/projects/details/18?lang=en
  fetched: 2026-11-08
  quote: Space images taken with the help of satellites can be ordered at eo.gharysh.kz.
