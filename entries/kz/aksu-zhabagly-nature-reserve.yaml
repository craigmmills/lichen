summary: Founded in 1926 as the country’s first reserve according to UNDP, it had
  25 camera traps installed by July 2021, used for biodiversity monitoring according
  to Qazinform.
facts:
- claim: UNDP describes it as founded in 1926 as the first nature reserve in the country.
  url: https://www.undp.org/kazakhstan/stories/digital-technology-critical-helping-flora-and-fauna-thrive
  fetched: 2026-11-12
  quote: Founded in 1926 as the first nature reserve in the country and located in
    the Talas Alatau mountains
- claim: UNDP reported in July 2021 that 25 of 294 UNDP and GEF camera traps given
    to protected areas were installed in the reserve.
  url: https://www.undp.org/kazakhstan/stories/digital-technology-critical-helping-flora-and-fauna-thrive
  fetched: 2026-11-12
  quote: In total, with the UNDP and the GEF support, 294 camera traps were transferred
    to 13 specially protected natural areas of Kazakhstan, of which 25 were installed
    on Aksu-Zhabagly Reserve territory.
- claim: UNDP says it gave the reserve a drone in 2020 to patrol hard-to-reach areas.
  url: https://www.undp.org/kazakhstan/stories/digital-technology-critical-helping-flora-and-fauna-thrive
  fetched: 2026-11-12
  quote: UNDP’s transfer of a drone to the park in 2020 has really helped to patrol
    hard-to-reach areas
- claim: The Kazakhstan MAB committee says the biosphere reserve monitors rare and
    threatened species and the condition of its natural complexes.
  url: https://www.kazmab.kz/index.php/en/biosphere-reserves/2016-01-25-13-17-07/aksu-dzhabagly/description
  fetched: 2026-11-12
  quote: There is a current monitoring of the condition and conservation of natural
    complexes on the territory of biosphere reserve, and monitoring of rare and threatened
    species
- claim: Qazinform reported on 8 November 2026, citing the Forestry and Wildlife Committee,
    that camera traps in the reserve are used to monitor biodiversity.
  url: https://qazinform.com/news/camera-traps-record-wildlife-in-kazakhstans-aksu-zhabagly-nature-reserve-80e7d3
  fetched: 2026-11-12
  quote: According to the committee, data collected through camera traps play an important
    role in monitoring biodiversity and developing conservation measures.
