status: active
summary: Steppe conservation programme working since 2005 or 2006 (sources differ) across 75 million hectares,
  led by ACBK and built by FZS and ACBK, using aerial surveys and saiga tracking.
facts:
- claim: The RSPB says the initiative has worked since 2005 to protect and restore steppe habitats, and
    that the RSPB co-founded it.
  url: https://www.rspb.org.uk/helping-nature/what-we-do/protecting-species-and-habitats/international/altyn-dala-conservation-initiative
  fetched: 2026-11-08
  quote: Since 2005, the Altyn Dala Conservation Initiative (Altyn Dala) , co-founded by the RSPB, has
    been dedicated to protecting and restoring these precious habitats.
- claim: The RSPB says the partners have begun reintroducing kulan and Przewalski's horse.
  url: https://www.rspb.org.uk/helping-nature/what-we-do/protecting-species-and-habitats/international/altyn-dala-conservation-initiative
  fetched: 2026-11-08
  quote: Altyn Dala partners have now embarked upon reintroducing other large herbivores, like the Kulan
    (Asiatic Wild Ass)
- claim: ACBK's own site lists the initiative among its work.
  url: https://www.acbk.kz
  fetched: 2026-11-08
  quote: Природоохранная инициатива "Алтын Дала"
- claim: The Sigrid Rausing Trust says the initiative won the 2024 Earthshot Prize in the Protect and
    Restore Nature category.
  url: https://www.sigrid-rausing-trust.org/story/altyn-dala-conservation-initiative-wins-earthshot-prize/
  fetched: 2026-11-08
  quote: has won the 2024 Earthshot Prize in the Protect and Restore Nature category
- claim: FZS says it formed the initiative in 2006 with national and international partners and the government
    of Kazakhstan.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/
  fetched: 2026-11-08
  quote: FZS teamed up with national and international partner organizations and the government of Kazakhstan
    in 2006 to form the Altyn Dala Conservation Initiative
- claim: Works across 75 million hectares of steppe on protected areas, species restoration, illegal wildlife
    trade and training.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/
  fetched: 2026-11-08
  quote: Today, Altyn Dala is working across 75 million hectares of steppe ecosystems
- claim: FZS names comprehensive ecosystem monitoring as one foundation of its landscape protection.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/
  fetched: 2026-11-08
  quote: Allocation of suitable areas, comprehensive ecosystem monitoring and reliable law enforcement
    form the foundation of effective landscape level protection for the ecosystem.
- claim: FZS describes aerial surveys of saiga population size and distribution.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/supporting-saiga-antelope-recovery/
  fetched: 2026-11-08
  quote: Aerial surveys are crucial to understanding population sizes and whereabouts of the saiga.
- claim: Movement data from collared saiga feeds into the Central Asian Mammals Migration and Linear Infrastructure
    Atlas.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/supporting-saiga-antelope-recovery/
  fetched: 2026-11-08
  quote: The movement data of collared saiga antelopes feeds into the "Central Asian Mammals Migration
    and Linear Infrastructure Atlas", an open-access tool to support advocacy for migrating species across
    the wider landscape.
- claim: FZS reports that the initiative's field team and rangers track saiga in the Ustyurt, Betpakdala
    and Ural populations.
  url: https://fzs.org/en/news/altyn-dala-contributes-to-global-migration-atlas/
  fetched: 2026-11-08
  quote: 'As the Altyn Dala field team and rangers started tracking saiga, they focused on the three populations
    in Kazakhstan: Ustyurt, Betpakdala, and Ural.'
- claim: FZS says ACBK, the government of Kazakhstan and international NGOs formed the initiative.
  url: https://fzs.org/en/news/altyn-dala-contributes-to-global-migration-atlas/
  fetched: 2026-11-08
  quote: Kazakh conservationists from the Association for the Conservation of Biodiversity of Kazakhstan
    (ACBK), the government of Kazakhstan and international NGOs formed the Altyn Dala Conservation Initiative
- claim: FZS's page lists the initiative as a UN World Restoration Flagship and an Earthshot Prize winner.
  url: https://fzs.org/en/programs/kazakhstan/altyn-dala-protecting-the-golden-steppe/
  fetched: 2026-11-08
  quote: The Altyn Dala Conservation Initiative is a UN World Restoration Flagship & Earthshot Prize Winner
