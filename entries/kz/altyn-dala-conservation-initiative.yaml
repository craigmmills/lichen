id: altyn-dala-conservation-initiative
kind: programme
name: Altyn Dala Conservation Initiative
also_known_as:
- Altyn Dala
- Природоохранная инициатива "Алтын Дала"
- ADCI
scope: kz
ai_label: conservation-tech
realms:
- land
