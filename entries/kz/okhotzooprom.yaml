summary: Organisation that ACBK says organised the 2026 saiga aerial count on the
  Forestry and Wildlife Committee's instruction, and that held a contract with ACBK
  in 2025 covering saiga calving observation and monitoring.
facts:
- claim: ACBK says the 2026 saiga aerial count was organised by Okhotzooprom on the
    instruction of the Forestry and Wildlife Committee, with ACBK planning the flights
    and calculating numbers.
  url: https://www.acbk.kz/article/default/view?id=699
  fetched: 2026-11-12
  quote: Учет по поручению Комитета лесного хозяйства и животного мира МЭПР РК был
    организован РГКП «ПО Охотзоопром»; научный компонент, включая планирование полетов
    и расчет численности, выполняла РОО «Казахстанская ассоциация сохранения биоразнообразия»
    (АСБК).
- claim: ACBK says that in 2025, under its contract with Okhotzooprom, it would also
    observe calving and carry out summer and autumn monitoring of saiga.
  url: https://www.acbk.kz/article/default/view?id=674
  fetched: 2026-11-12
  quote: Кроме авиучета, в рамках договора с "ПО Охотзоопром" будут вестись наблюдения
    на окоте, летний и осенний мониторинг
- claim: The Forestry and Wildlife Committee said the 2023 aerial count would be carried
    out by Okhotzooprom staff with the regional inspectorates and ACBK.
  url: https://www.gov.kz/memleket/entities/forest/press/news/details/537123?lang=ru
  fetched: 2026-11-12
  quote: Авиаучет проведут сотрудники РГКП «ПО «Охотзоопром» совместно с областными
    территориальными инспекциями Комитета лесного хозяйства и животного мира
