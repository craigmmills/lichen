summary: Field station of the Institute of Zoology that says over 1.7 million birds
  of 236 species have been ringed on the Chokpak pass, over 70 per cent of Kazakhstan's
  ringed birds, and 12 species tagged with GPS/GSM transmitters.
facts:
- claim: Describes itself as a field station of the Institute of Zoology and a participant
    in EURING.
  url: https://www.chokpak.kz/
  fetched: 2026-11-12
  quote: Одной из них является Орнитологическая станция «Чокпак» – полевой стационар
    РГП на ПХВ «Институт зоологии» КН МНВО РК и участник системы EURING .
- claim: Says more than 1.7 million birds of 236 species have been ringed on the Chokpak
    pass, over 70 per cent of all birds ringed in Kazakhstan.
  url: https://www.chokpak.kz/
  fetched: 2026-11-12
  quote: Из них на перевале Чокпак окольцовано уже более 1.7 миллионов особей 236
    видов из 16 отрядов, что составляет более 70% от всех птиц, окольцованных в нашей
    стране.
- claim: Says it has also fitted GPS/GSM transmitters to birds of 12 species on the
    pass.
  url: https://www.chokpak.kz/
  fetched: 2026-11-12
  quote: На перевале Чокпак передатчиками помечены уже несколько особей 12 видов птиц
    (в основном Хищников).
