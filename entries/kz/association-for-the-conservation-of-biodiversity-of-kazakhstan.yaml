summary: Conservation body active since 2004, tracking saiga with satellite collars since 2009 and publishing
  to GBIF, whose specialist reports developing AI counts of saiga, kulan and goitered gazelle.
facts:
- claim: Its site says it has tracked saiga with satellite collars since 2009.
  url: https://www.acbk.kz/article/default/view?id=296
  fetched: 2026-11-08
  quote: С 2009 года АСБК отслеживает передвижения сайгаков через спутниковые ошейники
- claim: Its site says it monitors wolves with camera traps among other methods in its Alty Sai ecological
    park in Kostanay region.
  url: https://www.acbk.kz/article/default/view?id=296
  fetched: 2026-11-08
  quote: установки фотоловушек и опроса местных жителей на территории экологического парка АСБК
- claim: Its site says it provided the scientific part of the 2024 saiga aerial count, which the state
    enterprise Okhotzooprom organised.
  url: https://www.acbk.kz/article/default/view?id=651
  fetched: 2026-11-08
  quote: Учет организован РГКП «ПО Охотзоопром» Комитета лесного хозяйства и животного мира МЭПР РК.
- claim: Albert Salemgareyev of ACBK told the Astana Times that drones paired with AI are used to monitor
    Przewalski's horses and kulan.
  url: https://astanatimes.com/2025/08/science-steppe-and-survival-kazakh-biologists-conservation-journey/
  fetched: 2026-11-08
  quote: Drones, especially when paired with AI, have had the most surprising impact. We use them to monitor
    Przewalski’s horses and kulan with minimal disturbance
- claim: Salemgareyev said he is developing an AI workflow to detect and count saiga, kulan and goitered
    gazelle.
  url: https://astanatimes.com/2025/08/science-steppe-and-survival-kazakh-biologists-conservation-journey/
  fetched: 2026-11-08
  quote: now developing an AI workflow to detect and count saiga, kulan, and goitered gazelle
