summary: National park that says it monitors snow leopards with 35 camera traps, including
  20 donated under the UNDP programme, and has given 22 leopards an ID code.
facts:
- claim: Says it counts, studies and monitors snow leopards in the park.
  url: https://www.ile-alatau.kz/en/news/the-snow-leopard-is-the-beauty-of-the-peak/
  fetched: 2026-11-12
  quote: In addition, accounting, scientific research and monitoring of this animal
    are conducted.
- claim: Says it has 35 camera traps, 20 of them given under the UNDP programme.
  url: https://www.ile-alatau.kz/en/news/the-snow-leopard-is-the-beauty-of-the-peak/
  fetched: 2026-11-12
  quote: There are 35 cameras in the national park, of which 20 copies were donated
    under the UNDP program.
- claim: Says it sets up permanent monitoring sites in winter habitats and installs
    cameras each year.
  url: https://www.ile-alatau.kz/en/news/the-snow-leopard-is-the-beauty-of-the-peak/
  fetched: 2026-11-12
  quote: Permanent monitoring sites for winter habitats are established above sea
    level in the tracts and cameras are installed annually
- claim: Says it has a scientific partnership contract with the Institute of Zoology,
    and that 22 leopards now have an ID code.
  url: https://www.ile-alatau.kz/en/news/the-snow-leopard-is-the-beauty-of-the-peak/
  fetched: 2026-11-12
  quote: The National Park concludes a scientific partnership contract with the Institute
    of Zoology and conducts systematic work. At the moment, 22 leopards have an ID
    code and a passport.
- claim: Gives an address in Almaty.
  url: https://www.ile-alatau.kz/en/news/the-snow-leopard-is-the-beauty-of-the-peak/
  fetched: 2026-11-12
  quote: Address Almaty, str. Sanzhar Zhandosov, 1
