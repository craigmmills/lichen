summary: Laboratory run by the Institute of Zoology that says it uses camera traps,
  satellite telemetry and drones to study rare mammals, and that four snow leopards
  were fitted with satellite collars in 2021 and 2022.
facts:
- claim: Says it uses camera traps, satellite telemetry and drones to get regular
    data on rare, hidden mammals such as snow leopard, Turkestan lynx and manul.
  url: https://zool.kz/laboratorii-i-otdely/laboratoriya-teriologii/
  fetched: 2026-11-12
  quote: В последние годы в териологических исследованиях широко используются новейшие
    методы дистанционного изучения – фотоловушки, спутниковая телеметрия, БПЛА и др.
- claim: Says the Snow Leopard Monitoring Centre works within the laboratory and observes
    snow leopards every year across their range in Kazakhstan.
  url: https://zool.kz/laboratorii-i-otdely/laboratoriya-teriologii/
  fetched: 2026-11-12
  quote: При лаборатории териологии работает Центр мониторинга снежного барса. Ежегодно
    специалисты проводят наблюдения за барсом как стандартными зоологическими методами,
    так и современными дистанционными методами на всей территории его обитания в Казахстане.
- claim: Says four snow leopards were fitted with satellite collars in Kazakhstan
    for the first time in 2021 and 2022.
  url: https://zool.kz/laboratorii-i-otdely/laboratoriya-teriologii/
  fetched: 2026-11-12
  quote: В 2021-2022 г. в Казахстане впервые помечены спутниковыми ошейниками четыре
    снежных барса.
