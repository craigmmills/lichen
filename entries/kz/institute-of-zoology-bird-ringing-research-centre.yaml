summary: Centre run by the Institute of Zoology, described on its August 2020 page
  as Kazakhstan's only laboratory of its kind for marking birds, which processes ring
  records and has written programs to check migration data.
facts:
- claim: Its page dated 3 August 2020 describes it as Kazakhstan’s only laboratory
    of its kind for marking birds.
  url: https://zool.kz/laboratorii-i-otdely/czentr-mecheniya-zhivotnyh/
  fetched: 2026-11-12
  quote: Лаборатория «Центр кольцевания птиц» единственная в своем роде лаборатория
    по мечению птиц в Казахстане.
- claim: Its August 2020 page says it processes ringing, recovery, duplicate and repeat
    ring records, and has written programs to extract and check migration data.
  url: https://zool.kz/laboratorii-i-otdely/czentr-mecheniya-zhivotnyh/
  fetched: 2026-11-12
  quote: В лаборатории ведутся работы по обработке данных ввода колец, возвратов колец,
    дублей колец и повторов колец.
- claim: Its August 2020 page says ringing had resumed at the Lake Alakol colonies,
    where a relict gull colony was found in 1968, and at Lake Sorbulak.
  url: https://zool.kz/laboratorii-i-otdely/czentr-mecheniya-zhivotnyh/
  fetched: 2026-11-12
  quote: Возобновлено кольцевание птиц на колониях оз. Алаколь
