summary: AFoCO-funded pilot, with a memorandum signed in March 2022, to inventory
  unaccounted forests in two regions; by March 2023 a contractor was chosen for an
  information system on the state forest fund.
facts:
- claim: The fund signed a memorandum with the Forestry and Wildlife Committee in
    March 2022 for the project, funded by AFoCO.
  url: https://www.fsbk.kz/en/fund-activities/news/268-pilot-project-on-inventory-of-unaccounted-forests-in-kostanay-and-north-kazakhstan-regions-and-automation-of-information-collection-on-forestry
  fetched: 2026-11-12
  quote: signed a Memorandum of Understanding with the Forestry and Wildlife Committee
    of the Ministry of Ecology, Geology and Natural Resources of the Republic of Kazakhstan
    for the implementation of the grant project
- claim: In April 2022, the fund said the project planned an inventory of unaccounted
    forests in the two regions and a digital program for forest data management.
  url: https://www.fsbk.kz/en/fund-activities/news/268-pilot-project-on-inventory-of-unaccounted-forests-in-kostanay-and-north-kazakhstan-regions-and-automation-of-information-collection-on-forestry
  fetched: 2026-11-12
  quote: it is planned to conduct an inventory of unaccounted forests in Kostanay
    and North Kazakhstan regions, as well as develop a fully functional digital program
    (software) for forest data management.
- claim: In March 2023 the fund said a contractor had been chosen to build an information
    system consolidating reports on the state forest fund, and suppliers chosen to
    upgrade the server room of the Kazakh Forest Management Enterprise.
  url: https://fsbk.kz/deyatelnost-fonda/novosti/278-novostnoj-dajdzhest-po-proektam-fsbk
  fetched: 2026-11-12
  quote: Проведен конкурс и отобран исполнитель по разработке информационной системы
    по автоматизации сбора информации по лесному хозяйству «Консолидация отчетности
    о состоянии государственного лесного фонда республики Казахстана».
