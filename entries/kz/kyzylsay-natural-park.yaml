summary: Regional natural park where 38 cameras, the first installed in 2021, had
  taken about 17,000 images by February 2024, according to its director Mynbergen
  Karatauov.
facts:
- claim: By February 2024, 38 cameras installed in the park had taken about 17,000
    images, according to the park director.
  url: https://www.lada.kz/aktau_news/ecology/119443-kto-popadal-na-kameru-poryadka-17-tysyach-snimkov-zafiksirovali-fotolovushki-v-prirodnom-parke-kyzylsay-v-mangistau.html
  fetched: 2026-11-13
  quote: По данным на февраль, 38 фотокамер, установленных на территории государственного
    регионального природного парка «Кызылсай», зафиксировали около 17 тысяч снимков.
- claim: The first cameras in the park were installed in 2021.
  url: https://www.lada.kz/aktau_news/ecology/119443-kto-popadal-na-kameru-poryadka-17-tysyach-snimkov-zafiksirovali-fotolovushki-v-prirodnom-parke-kyzylsay-v-mangistau.html
  fetched: 2026-11-13
  quote: Первые камеры в природном парке начали устанавливать в 2021 году.
- claim: Staff change batteries, download the images and reset the cameras.
  url: https://www.lada.kz/aktau_news/ecology/119443-kto-popadal-na-kameru-poryadka-17-tysyach-snimkov-zafiksirovali-fotolovushki-v-prirodnom-parke-kyzylsay-v-mangistau.html
  fetched: 2026-11-13
  quote: затем сотрудники производят замену батареек, загружают отснятые снимки на
    компьютер, и вновь устанавливают камеры на территории заказников.
- claim: Mynbergen Karatauov is the director of the enterprise.
  url: https://www.lada.kz/aktau_news/ecology/119443-kto-popadal-na-kameru-poryadka-17-tysyach-snimkov-zafiksirovali-fotolovushki-v-prirodnom-parke-kyzylsay-v-mangistau.html
  fetched: 2026-11-13
  quote: Об этом рассказал Мынберген Каратауов, директор предприятия.
