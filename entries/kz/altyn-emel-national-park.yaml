    № 2
- claim: 24KZ reported on 30 October 2026 that Altyn-Emel had more than 3,500 kulans
    and 5,500 goitered gazelles, quoting its director.
  url: https://24.kz/en/802805-rare-wildlife-populations-grow-in-zhetysu-region
  fetched: 2026-11-12
  quote: The number of kulans in the national park has exceeded 3,500, while the goitered
    gazelle population has reached 5,500.
- claim: The Institute of Zoology says it took part, with Okhotzooprom and ACBK, in
    the park's annual winter census of argali, kulan and goitered gazelle in 2025.
  url: https://zool.kz/eng/news/the-staff-of-the-institute-of-zoology-participated-in-the-annual-winter-survey-of-ungulates-in-altyn-emel-national-park/
  fetched: 2026-11-12
  quote: The primary goal of the annual winter census in the national park is to inventory
    the populations of argali, kulan, and goitered gazelle, which are listed in the
    Red Book of Kazakhstan.
