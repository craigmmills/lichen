facts:
- claim: Lists among its main tasks developing scientific methods for conserving biodiversity
    and monitoring ecosystems under the Chronicle of Nature programme.
  url: https://altynemel-park.kz/ru/%D0%BE%D1%81%D0%BD%D0%BE%D0%B2%D0%BD%D1%8B%D0%B5-%D0%B7%D0%B0%D0%B4%D0%B0%D1%87%D0%B8/
  fetched: 2026-11-12
  quote: разработка научных методов сохранения биологического разнообразия, ведение
    мониторинга экологических систем и отдельных природных объектов по Программе Летописи
    природы;
- claim: Gives an address in Basshi, Kerbulak district, Zhetysu region.
  url: https://altynemel-park.kz/ru/%D0%BE%D1%81%D0%BD%D0%BE%D0%B2%D0%BD%D1%8B%D0%B5-%D0%B7%D0%B0%D0%B4%D0%B0%D1%87%D0%B8/
  fetched: 2026-11-12
