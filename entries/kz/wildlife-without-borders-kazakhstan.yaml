summary: Conservation group that a CEPF review says installed up to 50 camera traps
  to study snow leopards; it launched an IUCN-backed project near Almaty in 2020 and
  co-organised a 2025 snow leopard monitoring training.
facts:
- claim: A CEPF review of its Central Asia grants, published by Zoï Environment Network,
    says Wildlife Without Borders installed up to 50 camera traps and studied snow
    leopard numbers and habitats.
  url: https://zoinet.org/wp-content/uploads/2024/08/cepf-synthesis-CA_EN.pdf
  fetched: 2026-11-12
  quote: Wildlife Without Borders installed up to 50 camera
- claim: Launched an IUCN Save Our Species Central Asia project in 2020 to protect
    mountain ecosystems around Almaty, with the Institute of Zoology among its key
    partners.
  url: https://wwb.kz/
  fetched: 2026-11-12
  quote: supported by the International Union for Conservation of Nature (IUCN) as
    part of its Save Our Species Central Asia Initiative
- claim: Its researchers studied the Turkestan lynx in the Kazakh Northern Tien Shan
    under a Rufford Small Grant.
  url: https://wwb.kz/
  fetched: 2026-11-12
  quote: Population and Conservation Status of the Turkestan Lynx in the Kazakh Part
    of the Northern Tien Shan”, approved by Rufford Small Grant.
- claim: Co-organised a 2025 training on snow leopard conservation and monitoring
    in Zhambyl region with QazaqGeography and the Institute of Zoology.
  url: https://qazaqgeography.kz/en/snow-leopard-conservation-training-held-in-zhambyl-region-352638
  fetched: 2026-11-12
  quote: The event was organized by QazaqGeography in collaboration with the Institute
    of Zoology of the Ministry of Science and Higher Education of Kazakhstan and the
    NGO Wildlife Without Borders.
