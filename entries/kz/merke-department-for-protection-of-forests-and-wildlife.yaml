summary: Local forest and wildlife protection department that UNDP says received 11
  GEF-funded camera traps, which recorded a snow leopard family in 2021, and was credited
  for protection measures in Zhambyl region.
facts:
- claim: UNDP says 11 camera traps were provided to the department under a GEF-funded
    UNDP initiative, and recorded a snow leopard family on its territory in 2021.
  url: https://www.undp.org/kazakhstan/press-releases/camera-traps-zhambyl-region-captured-unique-footage-snow-leopard-family
  fetched: 2026-11-12
  quote: The unique footage of the wild family was made possible thanks to 11 trap
    cameras provided to the Merke Department for Protection of Forests and Wildlife
    (the Department)
- claim: In March 2021, UNDP said snow leopards had been recorded at least 20 times
    in Zhambyl region since 2019, and credited the department’s protection measures.
  url: https://www.undp.org/kazakhstan/press-releases/camera-traps-zhambyl-region-captured-unique-footage-snow-leopard-family
  fetched: 2026-11-12
  quote: For the first time snow leopard was captured in Zhambyl region in 2019. Since
    then, wild cats have been spotted at least 20 times.
