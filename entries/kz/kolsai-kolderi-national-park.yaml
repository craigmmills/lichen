summary: National park reporting 16 snow leopards in July 2021; in January 2020, the
  Institute of Zoology reported camera-trap guidance and responsibility for staff
  training in snow leopard monitoring.
facts:
- claim: In July 2021, the Forestry and Wildlife Committee said the park’s camera
    trap had recorded snow leopards and the park reported 16 individuals on its territory.
  url: https://www.gov.kz/memleket/entities/forest/press/news/details/228993?lang=ru
  fetched: 2026-11-12
  quote: По информации парка, на его территории замечены всего 16 особей снежного
    барса.
- claim: The committee says camera traps at crossing points are used to count and
    monitor snow leopards.
  url: https://www.gov.kz/memleket/entities/forest/press/news/details/228993?lang=ru
  fetched: 2026-11-12
  quote: Одним из современных методов учета и мониторинга численности этого хищника
    является применение фотоловушек, которые устанавливаются в местах их переходов.
- claim: In January 2020, the Institute of Zoology said camera traps had been installed
    in the park under the UNDP and forest committee key ecosystems project. It provided
    scientific guidance and was responsible for training park staff in snow leopard
    monitoring.
  url: https://zool.kz/novosti/novost-1/
  fetched: 2026-11-12
  quote: Научно-методическое сопровождение работ обеспечивает Институт зоологии КН
    МОН РК, в задачу которого входит и обучение навыкам мониторинга снежного барса
    сотрудников национального парка.
- claim: In May 2023, UNDP said the park had 126 staff, including 71 state inspectors,
    who also made wildlife observations.
  url: https://www.undp.org/kazakhstan/stories/renewable-energy-and-biodiversity-conservation-kazakhstan
  fetched: 2026-11-12
  quote: The staff is comprised of 126 employees, 71 of whom are state inspectors
    for nature protection.
