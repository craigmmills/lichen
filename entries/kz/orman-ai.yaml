summary: Wildfire detection programme in which, VEON says, Beeline tower cameras feed an AI engine trained
  to recognise smoke; VEON reports 34 cameras gave early alerts for 50 fires in testing.
facts:
- claim: VEON says the system scans from Beeline towers with high-definition cameras and processes the
    images through an AI analytics engine trained to recognise smoke.
  url: https://www.veon.com/newsroom/stories/ai-to-fight-forest-fires-in-kazakhstan
  fetched: 2026-11-08
  quote: then processed through an AI analytics engine trained to recognise the appearance of smoke
- claim: VEON says 34 cameras were deployed in the initial test period and gave early alerts to firefighters
    for 50 fires in the region.
  url: https://www.veon.com/newsroom/stories/ai-to-fight-forest-fires-in-kazakhstan
  fetched: 2026-11-08
  quote: During the initial test period, 34 cameras with both optical and thermal imaging capabilities
    were deployed.
