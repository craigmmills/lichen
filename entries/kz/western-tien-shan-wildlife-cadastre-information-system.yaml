summary: Run by the Institute of Zoology and led by Aydyn Eszhanov in 2024–2026, the programme
  plans a GIS-linked fauna database, promising free access for agencies, universities and
  environmental NGOs.
facts:
- claim: The programme runs from 2024 to 2026.
  url: https://zool.kz/?p=12212
  fetched: 2026-11-13
  quote: 'Implementation period: 2024–2026'
- claim: It is to create an electronic database for the Western Tien Shan fauna cadastre,
    integrated with GIS, holding data on living and fossil species.
  url: https://zool.kz/?p=12212
  fetched: 2026-11-13
  quote: To create an electronic database for the cadastre of the Western Tien Shan fauna,
    integrated with GIS and containing data on both recent and fossil animal species of the
    region
- claim: The page says the data will be freely accessible to state agencies, universities
    and non-governmental environmental organisations.
  url: https://zool.kz/?p=12212
  fetched: 2026-11-13
  quote: Reliable scientific data on the fauna of the Western Tien Shan region will be freely
    accessible to state agencies, universities, and non-governmental environmental organizations.
- claim: Its geoinformation analysis used remote sensing and climate observations for 1950
    to 2024.
  url: https://zool.kz/?p=12212
  fetched: 2026-11-13
  quote: Results of remote sensing and climatic observations for the period 1950–2024 indicate
    gradual climate warming
