facts:
- claim: Set up by Kazakh non-governmental environmental organisations on 4 October
    2007 to finance biodiversity projects through grants.
  url: https://fsbk.kz/en/about-the-fund
  fetched: 2026-11-12
  quote: The Corporative Fund "Biodiversity Conservation Fund of Kazakhstan" was established
    by non-governmental environmental organizations of Kazakhstan on 04.10.2007.
- claim: Gives an address in Nur-Sultan (Astana).
  url: https://fsbk.kz/en/about-the-fund
  fetched: 2026-11-12
  quote: D. Kunaev str., 12/1, VP 22-2
- claim: Says it carried out two UNDP-funded projects to inventory and map unaccounted
    forests in Pavlodar and East Kazakhstan regions, covering more than 100,000 hectares.
  url: https://fsbk.kz/deyatelnost-fonda/novosti/275-2022-2
  fetched: 2026-11-12
  quote: Было реализовано два проекта по инвентаризации и картированию неучтенных
    лесов в Павлодарской и Восточно-Казахстанской областях. Донором выступила Программа
    Развития ООН.
- claim: In December 2022, the fund said it was carrying out a four-year, $1.2 million
    AFoCO-funded pilot to inventory unaccounted forests in Kostanay and North Kazakhstan
    regions and develop forest data software.
  url: https://fsbk.kz/deyatelnost-fonda/novosti/275-2022-2
  fetched: 2026-11-12
  quote: Донор проекта – Азиатская Организация Лесного Сотрудничества (АФОКО). Проект
    рассчитан на 4 года, общей суммой гранта в 1,2 миллиона долларов.
