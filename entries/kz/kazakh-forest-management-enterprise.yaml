summary: State forest inventory organisation, named in ministry rules as a republican
  state enterprise covering forest resource accounting and state forest monitoring,
  which includes use of Earth remote sensing data.
facts:
- claim: The ministry's rules name it as the state forest inventory organisation,
    a republican state enterprise whose work covers forest resource accounting and
    state forest monitoring.
  url: https://old.adilet.zan.kz/rus/docs/V1500011387
  fetched: 2026-11-12
  quote: деятельность которого направлена на обеспечение учета лесных ресурсов, территориального
    устройства лесного фонда, государственного мониторинга лесов, планирования ведения
    лесного хозяйства и лесопользования.
- claim: The same rules define state forest monitoring as observing, assessing and
    forecasting the state of the forest fund, including with Earth remote sensing
    data from space.
  url: https://old.adilet.zan.kz/rus/docs/V1500011387
  fetched: 2026-11-12
  quote: в том числе с использованием данных дистанционного зондирования Земли из
    космоса
- claim: The Forestry and Wildlife Committee lists forest inventory, state forest
    accounts, the state forest cadastre and forest monitoring as the enterprise's
    state-monopoly services.
  url: https://www.gov.kz/memleket/entities/forest/press/article/details/178552
  fetched: 2026-11-12
  quote: орман орналастыру, орман қорының мемлекеттік есебін жүргізу, мемлекеттік
    орман кадастырын жүргізу, орман мониторингі.
- claim: The Biodiversity Conservation Fund of Kazakhstan chose suppliers in 2023
    to upgrade the enterprise's server room under the AFoCO forest inventory pilot.
  url: https://fsbk.kz/deyatelnost-fonda/novosti/278-novostnoj-dajdzhest-po-proektam-fsbk
  fetched: 2026-11-12
  quote: проведен отбор поставщиков на проведение работ по модернизации серверной
    комнаты в РГКП «Казахское лесоустроительное предприятие».
