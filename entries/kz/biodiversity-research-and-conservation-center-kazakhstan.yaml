  quote: In 2022, biologists at the Biodiversity Research and Conservation Center
    ( BRCC ) began monitoring Egyptian vultures and juvenile birds were fitted with
    coloured rings and GPS trackers to follow their movements.
- claim: Over three seasons 27 Egyptian vultures were ringed, 13 of them in 2025 (news
    of 29 August 2025).
  url: https://www.rufford.org/news/egyptian-vultures-hatching-cracks-species-record-in-kazakhstan/
