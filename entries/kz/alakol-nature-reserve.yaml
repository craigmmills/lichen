summary: A state nature reserve that lists scientific monitoring among its four main
  lines of work and partners with the Institute of Zoology, including on GPS-tracking
  of pelicans and gulls.
facts:
- claim: The ministry's page on the reserve lists scientific monitoring among its
    four main lines of work.
  url: https://www.gov.kz/memleket/entities/ecogeo/press/news/details/1254494?lang=ru
  fetched: 2026-11-15
  quote: 'Деятельность заповедника осуществляется по четырем основным направлениям:
    охрана территории, научный мониторинг, экологическое просвещение и пожаротушение.'
- claim: Institute of Zoology ornithologists and reserve specialists carried out field
    studies of pelicans in the Mynkol lakes on 7 August 2026.
  url: https://zool.kz/?p=14841
  fetched: 2026-11-15
  quote: Researchers from the Laboratory of Ornithology of the Institute of Zoology
    of the Republic of Kazakhstan, together with specialists from the Alakol State
    Nature Reserve, conducted field studies
- claim: The work was done under a research agreement between the institute and the
    reserve.
  url: https://zool.kz/?p=14841
  fetched: 2026-11-15
  quote: under a research agreement between the Institute of Zoology and the Alakol
    State Nature Reserve
- claim: GPS trackers were fitted to five Dalmatian pelicans during the fieldwork
    on 7 August 2026.
  url: https://zool.kz/?p=14841
  fetched: 2026-11-15
  quote: GPS trackers were fitted to 5 Dalmatian pelicans .
- claim: The reserve's department of science, information and monitoring reported
    that a 2024 field expedition organised with Institute of Zoology ornithologists
    fitted GPS trackers to three relict gulls and one other gull.
  url: https://www.inform.kz/ru/redkiy-vid-reliktovih-chaek-naalakole-otslezhivayut-spomoshyu-gps-ustroystv-630bab
  fetched: 2026-11-15
  quote: в 2024 году в ходе полевой экспедиции, организованной совместно с учеными-орнитологами
    Института зоологии, на трёх особях реликтовых чаек и одной черноголовой были установлены
    GPS-трекеры.
