summary: Network of marine managers across Belize, reformed in 2008 over a bleaching
  forecast, that ran coral bleaching surveys from September 2023 to March 2024 using
  a transect method adapted from AGRRA.
facts:
- claim: The Coastal Zone Management Authority and Institute describes the NCRMN as
    a network of marine managers throughout Belize.
  url: https://www.coastalzonebelize.org/coral-bleaching-project/
  fetched: 2026-11-12
  quote: The National Coral Reef Monitoring Network (NCRMN) is a network of marine
    managers throughout Belize.
- claim: Its responsibilities include monitoring coral health, collecting and analysing
    data and supporting early warning systems.
  url: https://www.coastalzonebelize.org/coral-bleaching-project/
  fetched: 2026-11-12
  quote: The NCRMN’s responsibilities include monitoring coral health, collecting
    and analysing data, supporting early warning systems
- claim: During the 2023 bleaching event it carried out coral bleaching surveys in
    September, October and November, with a follow-up survey in February and March
    2024.
  url: https://www.coastalzonebelize.org/coral-bleaching-project/
  fetched: 2026-11-12
  quote: During the major bleaching event of 2023, the NCRMN in Belize undertook coral
    bleaching surveys during the hottest months of the year
- claim: The surveys used the Weighted Bar Swimming Transect method adapted from AGRRA.
  url: https://www.coastalzonebelize.org/coral-bleaching-project/
  fetched: 2026-11-12
  quote: the Weighted Bar Swimming Transect (WBST) method adapted from AGRRA was used
- claim: ECOMAR's page on the Belize Coral Reef Monitoring Network says the network
    was reformed in 2008 in response to a forecast of severe coral bleaching, with
    support from TNC, WWF and PACT.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: The Coral Network was reformed in 2008 in response to a forecast of severe
    coral bleaching with support from The Nature Conservancy, World Wildlife Fund
    (WWF) and the Protected Areas Conservation Trust (PACT).
- claim: The same page says its members include government departments and NGOs, many
    of them co-managers of marine protected areas.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: Members of the Coral Network include government departments and non-governmental
    organizations.
- claim: The page refers to the network's terms of reference under the name Belize
    National Coral Reef Monitoring Network.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: The Terms of Reference for the Belize National Coral Reef Monitoring Network
