    platform! This innovative citizen science initiative aims to document and understand the impact of
    roadways on wildlife in Belize.
- claim: Says its reports will help map hotspots, identify vulnerable species and inform road management.
  url: https://www.uberibz.org/post/launching-of-the-belize-roadkill-project-on-inaturalist
