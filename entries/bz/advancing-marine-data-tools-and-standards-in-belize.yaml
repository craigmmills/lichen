facts:
- claim: Aims to advance marine data tools and standards in Belize by delivering customised tools to partners.
  url: https://www.uberibz.org/marinedatatools
  fetched: 2026-11-09
  quote: This UB-ERI focus area aims to advance marine data tools and standards in Belize, through delivering
    customized tools to partners and making recommendations on standardization for long-term projects.
- claim: In 2025 it designed two R Shiny tools with TASA, a public dashboard and an internal reporting
    tool for TASA's marine monitoring data.
  url: https://www.uberibz.org/marinedatatools
  fetched: 2026-11-09
  quote: An internal reporting tool that allows TASA staff to automatically generate customizable reports
    based on their marine monitoring data based on chosen timeframes and data types
- claim: Wrote two chapters of supplementary materials on reef health indicators for the 2024 Mesoamerican
    Reef Report Card.
