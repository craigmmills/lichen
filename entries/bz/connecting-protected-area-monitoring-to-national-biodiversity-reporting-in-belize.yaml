summary: Active project run by the University of Belize Environmental Research Institute and funded by
  Biodiversity Information for Development, intended to feed protected-area records of under-represented
  taxa into national monitoring and CBD reporting.
facts:
- claim: Aims to mobilise records of under-represented taxa from protected areas, including arthropods,
    mammals, bats, fish, reptiles, amphibians and plants.
  url: https://www.uberibz.org/post/strengthening-biodiversity-data-mobilization-at-the-gbif-latin-america-and-caribbean-workshop
  fetched: 2026-11-09
  quote: The project aims to strengthen Belize's biodiversity information systems by mobilizing records
    of underrepresented taxa
- claim: Intended to feed protected-area monitoring data into the National Biodiversity Monitoring Program
    and CBD reporting.
  url: https://www.uberibz.org/post/strengthening-biodiversity-data-mobilization-at-the-gbif-latin-america-and-caribbean-workshop
  fetched: 2026-11-09
  quote: the project will help integrate information from protected area monitoring into the National
    Biodiversity Monitoring Program (NBMP)
