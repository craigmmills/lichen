  url: https://tidebelize.org/marine-research-and-monitoring/
  fetched: 2026-11-09
  quote: Manatee Monitoring Mangrove Monitoring Seagrass Monitoring
- claim: Its website lists Payne's Creek National Park, Port Honduras Marine Reserve and Sapodilla Cayes
    Marine Reserve under Protected Areas.
  url: https://tidebelize.org/marine-research-and-monitoring/
  fetched: 2026-11-09
  quote: Payne's Creek National Park Port Honduras Marine Reserve Sapodilla Cayes Marine Reserve
