summary: Organisation in Punta Gorda Town that monitors water quality monthly at 43 sites in the Maya
  Mountain Marine Corridor and lists coral reef, manatee, mangrove and seagrass monitoring.
facts:
- claim: Carries out freshwater and marine water quality research at 43 sites in the Maya Mountain Marine
    Corridor.
  url: https://tidebelize.org/?p=206
  fetched: 2026-11-09
  quote: Freshwater and marine water quality research is carried out by TIDE at 43 sites in the Maya Mountain
    Marine Corridor
- claim: Monitors all sites on monthly trips for temperature, salinity, dissolved oxygen, pH, sedimentation,
    nutrients, turbidity and visibility.
  url: https://tidebelize.org/?p=206
  fetched: 2026-11-09
  quote: TIDE now regularly monitors all sites
- claim: Began habitat mapping in 2014 to understand coastal marine benthic structure.
  url: https://tidebelize.org/?p=206
  fetched: 2026-11-09
  quote: habitat mapping was begun in 2014
- claim: Its address is in Punta Gorda Town.
  url: https://tidebelize.org/?p=206
  fetched: 2026-11-09
  quote: Punta Gorda Town Belize C.A.
- claim: Runs a research and monitoring programme that assesses the health of ecosystems and species in
    the Maya Mountain Marine Corridor.
  url: https://tidebelize.org/marine-research-and-monitoring/
  fetched: 2026-11-09
  quote: The monitoring program is like a spotlight on the Maya Mountain Marine Corridor – it reveals
    where management is working and where there are problems to address.
- claim: Its marine monitoring includes coral reef surveys under the MBRS Synoptic Monitoring Protocol
    and monthly coral bleaching surveys in season.
  url: https://tidebelize.org/marine-research-and-monitoring/
  fetched: 2026-11-09
  quote: MBRS Synoptic Monitoring Protocol (Coral Reef, Finfish and Benthic) Coral Bleaching Surveys (Monthly
    during season – September to February)
