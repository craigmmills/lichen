summary: Non-governmental organisation that, per ECOMAR, manages Blue Hole National
  Park and Half Moon Caye Natural Monument, where staff monitor coral bleaching, lobster,
  conch and seagrass, and held bird banding training in October 2024.
facts:
- claim: ECOMAR's coral network page lists the Belize Audubon Society among non-governmental
    organisations that manage marine protected areas, as caretakers of Blue Hole National
    Park and Half Moon Caye Natural Monument.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: The Belize Audubon Society are the caretakers of the Blue Hole National Park
    and the Half Moon Caye Natural Monument.
- claim: The same page says its Marine Protected Areas Manager and other staff at
    Half Moon Caye conduct regular monitoring of marine ecosystems, including coral
    bleaching, lobster, conch and seagrass.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: The Marine Protected Areas Manager and other staff based at Half Moon Caye
    conduct regular monitoring of the marine ecosystems including coral bleaching,
    lobster, conch and seagrass.
- claim: A UB-ERI post says the society held an introduction to bird banding training
    at Cockscomb Basin Wildlife Sanctuary in October 2024, with two NABC-certified
    assistant banders from its staff.
  url: https://www.uberibz.org/post/bird-banding-training-to-boost-national-bird-conservation-efforts
  fetched: 2026-11-12
  quote: The Belize Audubon Society held an "Introduction to Bird Banding" training
    from October 8-11 at the Cockscomb Basin Wildlife Sanctuary.
