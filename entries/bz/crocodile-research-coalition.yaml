facts:
- claim: Describes itself as a Belize-based nonprofit established in January 2016
    working on crocodiles across Central America and the Caribbean.
  url: https://crocodileresearchcoalition.org/about-us
  fetched: 2026-11-12
  quote: The Crocodile Research Coalition (CRC) is a Belize-based nonprofit, established
    in January 2016, that seeks to preserve crocodiles and their environments throughout
    Central America and the Caribbean
- claim: Led a population study of Morelet's crocodile in the Chiquibul Forest from
    2016, with a plan to survey every five years.
  url: https://crocodileresearchcoalition.org/chiquibul-survey
  fetched: 2026-11-12
  quote: This research initiated a program in which CRC plans to conduct surveys of
    this population every 5 years
- claim: In 2022 it surveyed the Morelet's crocodile population of the Macal and Raspaculo
    Rivers with FCD and began baseline primate surveys near Las Cuevas Research Station.
  url: https://crocodileresearchcoalition.org/chiquibul-survey
  fetched: 2026-11-12
  quote: In 2022, the CRC revisited the Chiquibul National Park to monitor the Morelet’s
    crocodile population of the Macal and Raspaculo Rivers in collaboration with FCD.
- claim: Its team page describes nationwide population surveys of American and Morelet's
    crocodiles in Belize in 2017, and a satellite tracking programme initiated with
    assistance from its Research Coordinator during March 2017 to June 2019.
  url: https://crocodileresearchcoalition.org/about-us
  fetched: 2026-11-12
  quote: assisting with ongoing nationwide population suveys of Crocodylus acutus
    and C. moreletii in Belize
