facts:
- claim: The dataset spans 2010 to 2025 in Turneffe Atoll Marine Reserve and was collected
    with the MBRS-SMP and AGRRA protocols.
  url: https://www.uberibz.org/post/ub-eri-presents-long-term-turneffe-coral-reef-monitoring-at-international-coral-reef-symposium
  fetched: 2026-11-15
  quote: The long-term dataset used for this study brings together 15 years of standardized
    coral reef monitoring from Turneffe Atoll Marine Reserve, spanning 2010 to 2025.
- claim: Surveys ran annually from 2010 to 2018 and every two years from 2021 to 2025.
  url: https://datadryad.org/dataset/doi:10.5061/dryad.c866t1gcn
  fetched: 2026-11-15
  quote: carried out at the Turneffe Atoll Marine Reserve in Belize, annually between
    2010-2018, and biennially between 2021-2025
- claim: The dataset is published on Dryad (2025); an earlier 2010-2023 version is
    on Zenodo (2024).
  url: https://datadryad.org/dataset/doi:10.5061/dryad.c866t1gcn
  fetched: 2026-11-15
  quote: Boles, Jessica C.; Martinez, Ninon; Salazar, Jané et al. (2025). Coral reef
    benthic and fish monitoring data from Turneffe Atoll, Belize, 2010-2025 [Dataset].
    Dryad.
- claim: UB-ERI says the Resilience Reef Initiative supported collating and validating
