summary: Government body managing five categories of protected areas in Belize, whose Geospatial Monitoring
  Unit analyses land use change and uses fire hotspot platforms and drones for fire and beetle monitoring.
facts:
- claim: Manages five categories of protected areas in Belize.
  url: https://forest.gov.bz/protected-areas/
  fetched: 2026-11-09
  quote: Presently, the Forest Department manages five categories of protected areas, those being National
    Parks, Nature Reserves, Natural Monuments, Forest Reserves and Wildlife Sanctuaries.
- claim: Its Geospatial Monitoring Unit monitors and analyses land use change, sustainable forest management,
    protected areas management and wildlife conservation.
  url: https://forest.gov.bz/geospatial-monitoring/
  fetched: 2026-11-09
  quote: The Geospatial Monitoring Unit (GSMU) was established to support forest resources management
    by monitoring and conducting spatiotemporal analysis
- claim: The unit uses NASA FIRMS and CONABIO platforms to detect fire hotspots, and drones to monitor
    wildland fires.
  url: https://forest.gov.bz/geospatial-monitoring/
  fetched: 2026-11-09
  quote: The GSMU uses online platforms on fires and heat signatures such as NASA FIRMs and CONABIO to
    detect heat points and monitor hotspots
- claim: The unit uses drones to assess the spread of the Southern Pine Bark Beetle in the Mountain Pine
    Ridge Forest Reserve.
  url: https://forest.gov.bz/geospatial-monitoring/
  fetched: 2026-11-09
  quote: The GSMU uses drone technology to examine, assess and understand the extent and spread of the
    Southern Pine Bark Beetle Infestation
- claim: Targeted overflights of key protected areas were carried out through a GIZ, Selva Maya, IUCN
    and KfW project.
  url: https://forest.gov.bz/geospatial-monitoring/
  fetched: 2026-11-09
  quote: Through the GIZ Selva Maya IUCN KfW project, targeted overflights in key protected areas have
    been conducted across Belize.
- claim: Planet names it as one of three bodies in a collaborative initiative monitoring land use change
    in Belize's Maya Forest Mosaic.
  url: https://www.planet.com/pulse/announcing-the-next-wave-of-project-centinela-biodiversity-sites/
  fetched: 2026-11-09
  quote: Today, a collaborative initiative between place-based Belize Maya Forest Trust , Wildlife Conservation
    Society , and Belize Forest Department is actively monitoring these land use changes to assess ecosystem
    health
