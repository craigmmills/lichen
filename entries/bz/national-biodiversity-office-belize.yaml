facts:
- claim: The San Pedro Sun, reprinting a government press release, says the office was established in
    2020 and coordinates national biodiversity efforts through the NBSAP and the National Protected Areas
    System Act.
  url: https://www.sanpedrosun.com/?p=114862
  fetched: 2026-11-09
  quote: Established in 2020, the NBIO plays a pivotal role in coordinating national efforts for biodiversity
    conservation, particularly through the implementation of the National Biodiversity Strategy and Action
    Plan (NBSAP) and the National Protected Areas System Act (NPAS).
- claim: The San Pedro Sun reports that the office has begun updating the National Protected Areas Policy
    and System Plan with technical support from IOM and EU funding.
  url: https://www.sanpedrosun.com/government/2026/06/15/belize-on-the-path-to-update-its-protected-areas-plan-with-iom-and-eu-support/
