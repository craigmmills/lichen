summary: Non-profit established in 2013 and co-manager of Turneffe Atoll Marine Reserve, which runs spawning
  surveys, coral bleaching assessments and, with UB-ERI, two-yearly AGRRA reef health assessments.
facts:
- claim: A non-profit NGO and the official co-manager of Turneffe Atoll Marine Reserve, with the Government
    of Belize.
  url: https://visitturneffe.org/learn/who-we-are/
  fetched: 2026-11-09
  quote: The Turneffe Atoll Sustainability Association (TASA) is a non-profit NGO and the official co-manager
    of the Turneffe Atoll Marine Reserve, working in partnership with the Government of Belize.
- claim: Established in 2013.
  url: https://visitturneffe.org/learn/who-we-are/
  fetched: 2026-11-09
  quote: Established in 2013, TASA is dedicated to the stewardship of the Turneffe Atoll, carrying out
    day-to-day operations within the marine reserve.
- claim: Runs seasonal spawning aggregation surveys at three sites, with passive acoustic monitoring at
    some of them.
  url: https://visitturneffe.org/learn/programs/adaptive-management/
  fetched: 2026-11-09
  quote: Passive acoustic monitoring is also applied at select sites to better understand aggregation
    timing and persistence.
- claim: Carries out coral bleaching assessments at permanent monitoring sites.
  url: https://visitturneffe.org/learn/programs/adaptive-management/
  fetched: 2026-11-09
  quote: The AMP conducts coral bleaching assessments at permanent monitoring sites during periods of
    elevated thermal stress, allowing for comparison across years and seasons.
- claim: Runs AGRRA coral reef health assessments every two years with UB-ERI.
  url: https://visitturneffe.org/learn/programs/adaptive-management/
  fetched: 2026-11-09
  quote: In collaboration with the University of Belize Environmental Research Institute (UB ERI), the
    AMP also implements comprehensive coral reef ecosystem health assessments using the AGRRA (Atlantic
    and Gulf Rapid Reef Assessment) methodology every two years.
- claim: Says its marine radar is the only one of its kind in Belize used for marine enforcement.
  url: https://visitturneffe.org/learn/programs/enforcement/
  fetched: 2026-11-09
  quote: The marine radar is the only radar of its kind in Belize used for Marine Enforcement.
- claim: Established in 2013; its day-to-day work in the reserve includes science monitoring of marine
    environments.
  url: https://visitturneffe.org/learn/who-we-are/
  fetched: 2026-11-09
  quote: This includes a wide range of activities from science monitoring of marine environments, to education
    and outreach efforts.
- claim: Its Adaptive Management Program works through marine monitoring programmes that feed science
    into management of the reserve.
  url: https://visitturneffe.org/learn/programs/
  fetched: 2026-11-09
  quote: The program aims to maintain ecosystem services and sustainably manage fisheries through different
    marine monitoring programs that promote the direct application of science into adaptive management.
