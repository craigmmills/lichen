- claim: By August 2023 the team had found 67 turtle nests, 36 of which hatched.
  url: https://www.sanpedrosun.com/environment/2024/04/12/hol-chan-marine-reserve-begins-monitoring-seasonal-sea-turtle-nesting-sites/
