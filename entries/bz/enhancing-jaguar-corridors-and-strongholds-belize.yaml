summary: Forest Department project run in partnership with UNDP that, in November
  2021, was expanding camera trapping of jaguars and prey and letting landowners contribute
  to the national camera trap network as citizen scientists.
facts:
- claim: In November 2021, UNDP Belize said the project, executed by the Forest Department
    in partnership with UNDP, was expanding camera trapping to monitor jaguars and
    their prey.
  url: https://www.undp.org/belize/news/3-cs-vital-jaguar-conservation-coordination-connectivity-and-coexistence
  fetched: 2026-11-12
  quote: The project executed by the Forest Department, Ministry of Fisheries, Forestry,
    the Environment, and Sustainable Development in partnership with the United Nations
    Development Program (UNDP) is expanding camera trapping to monitor jaguars and
    their prey.
- claim: In November 2021, UNDP said the project was enabling landowners to contribute
    to the national camera trap network as citizen scientists.
  url: https://www.undp.org/belize/news/3-cs-vital-jaguar-conservation-coordination-connectivity-and-coexistence
  fetched: 2026-11-12
  quote: At the local level, the project is also enabling landowners to participate
    in conservation practices as citizen scientists, such as contributors to the national
    camera trap network.
- claim: A 2025 World Bank Global Wildlife Program presentation by the Forest Department
    and CSFI names the project as the background to the Belize Jaguar Program's work.
  url: https://thedocs.worldbank.org/en/doc/4820df77318e15bfcaa62909a5a83f56-0320052025/original/Tech-is-in-our-Nature-WILDLIFE-Presentation.pdf
