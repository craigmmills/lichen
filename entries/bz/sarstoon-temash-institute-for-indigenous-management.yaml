summary: Indigenous NGO whose five founding communities' land was included in Sarstoon
  Temash National Park; organised forest patrols, trained Maya communities in GIS
  mapping and became WRI's partner in 2016.
facts:
- claim: Describes itself as an Indigenous NGO founded almost 30 years ago by five
    communities whose land was included in Sarstoon Temash National Park.
  url: https://satiim.org.bz/
  fetched: 2026-11-12
  quote: This collaborative effort is being coordinated by SATIIM, an Indigenous NGO
    founded almost 30 years ago on the principle of free, prior and informed consent
    by five communities
- claim: A September 2016 post says it had organised community forest patrols to monitor
    environmental damage in Sarstoon Temash National Park.
  url: https://satiim.org.bz/?p=750
  fetched: 2026-11-12
  quote: Since then SATIIM has organized community forest patrols to monitor environmental
    damage in the park.
- claim: A 2017 post says it had trained Maya communities in GIS-based forest mapping
    and monitoring over the previous three years.
  url: https://satiim.org.bz/
  fetched: 2026-11-12
  quote: In the past three years, SATIIM has trained Maya communities in GIS-based
    forest mapping and monitoring
- claim: In 2016 it was chosen by the World Resources Institute's forest monitoring
    initiative as partner for a community-led network of forest patrols in the Sarstoon
    Temash river basin.
  url: https://www.satiim.org.bz/global-forest-watch-has-teamed-up-with-satiim-to-create-the-regions-first-binational-maya-led-forest-monitoring-system-in-southern-belize-and-eastern-guatemala/
  fetched: 2026-11-12
  quote: has chosen SATIIM as its partner to create a community-led network of forest
    patrols who will collect and disseminate data about deforestation and environmental
    damage in the Sarstoon Temash river basin and surrounding areas.
- claim: Its address is in Punta Gorda Town, Toledo.
  url: https://satiim.org.bz/
  fetched: 2026-11-12
  quote: P.O Box 127 Punta Gorda Town, Toledo, Belize, C.A.
