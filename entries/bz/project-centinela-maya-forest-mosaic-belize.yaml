summary: Site where, Planet says, a collaboration of three partners monitors land use change in the Maya
  Forest Mosaic and will use Planet data to strengthen the National Forest Monitoring System.
facts:
- claim: Planet says a collaborative initiative between the Belize Maya Forest Trust, the Wildlife Conservation
    Society and the Belize Forest Department monitors land use change in the Maya Forest Mosaic.
  url: https://www.planet.com/pulse/announcing-the-next-wave-of-project-centinela-biodiversity-sites/
  fetched: 2026-11-09
  quote: Today, a collaborative initiative between place-based Belize Maya Forest Trust , Wildlife Conservation
    Society , and Belize Forest Department is actively monitoring these land use changes to assess ecosystem
    health
- claim: Planet says the initiative will use Planet data to strengthen Belize's National Forest Monitoring
    System.
  url: https://www.planet.com/pulse/announcing-the-next-wave-of-project-centinela-biodiversity-sites/
  fetched: 2026-11-09
  quote: As a Project Centinela site, the initiative will leverage Planet data to strengthen Belize's
    National Forest Monitoring System and management strategies
