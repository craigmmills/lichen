summary: UB-ERI-led project funded by the Canada Fund for Local Initiatives, from September 2026 to February
  2027, planning three seagrass monitoring sites, a condition baseline and practitioner training.
facts:
- claim: Led by UB-ERI with funding from the Government of Canada through the Canada Fund for Local Initiatives,
    running from 26 September 2026 to 26 February 2027.
  url: https://www.uberibz.org/post/ub-eri-launches-project-to-strengthen-seagrass-conservation-in-belize
  fetched: 2026-11-09
  quote: The project runs from September 26, 2026, to February 26, 2027, with fieldwork and training based
    at the Calabash Caye Field Station within the Turneffe Atoll Marine Reserve.
- claim: Plans to set up three seagrass monitoring and demonstration sites and a baseline of seagrass
    condition, species composition and blue carbon.
  url: https://www.uberibz.org/post/ub-eri-launches-project-to-strengthen-seagrass-conservation-in-belize
  fetched: 2026-11-09
  quote: UB-ERI will establish three seagrass monitoring and demonstration sites in the Turneffe Atoll
    Marine Reserve
- claim: Plans to train marine protected area practitioners in standardised monitoring methods.
  url: https://www.uberibz.org/post/ub-eri-launches-project-to-strengthen-seagrass-conservation-in-belize
  fetched: 2026-11-09
  quote: Marine protected area practitioners will receive training in standardized monitoring methods
    to strengthen their ability to assess seagrass health
