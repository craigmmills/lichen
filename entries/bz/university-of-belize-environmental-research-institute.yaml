    of it in R Shiny in 2024.
  url: https://www.uberibz.org/marinedatatools
  fetched: 2026-11-09
  quote: In 2024, we created a public demo data dashboard using our open-access AGRRA reef monitoring
    data ( accessible on Dryad )
- claim: Inaugurated in January 2010 to address the gap in local capacity for research and monitoring
    in Belize.
  url: https://www.uberibz.org/about-us
  fetched: 2026-11-09
  quote: The University of Belize Environmental Research Institute (UB-ERI), inaugurated in January 2010,
    was created primarily to address the large gap in local capacity for research and monitoring that
    exists within Belize.
- claim: Its stated address is Price Centre Road, Belmopan, Cayo District.
  url: https://api.gbif.org/v1/organization/8e3e7b8f-88de-4be0-bdcf-f4524171313a
  fetched: 2026-11-09
  quote: '"address":["Price Centre Road"],"city":"Belmopan","province":"Cayo District","country":"BZ"'
- claim: Says it supports the mobilisation, management, analysis and publication of biodiversity information.
  url: https://api.gbif.org/v1/organization/8e3e7b8f-88de-4be0-bdcf-f4524171313a
  fetched: 2026-11-09
  quote: UB-ERI supports the mobilization, management, analysis, and publication of biodiversity information
    to inform research, policy, conservation, and evidence-based decision-making.
- claim: Compiled and standardised coral reef monitoring data from Turneffe Atoll Marine Reserve collected
    between 2010 and 2023, for the Resilient Reef Initiative.
  url: https://www.uberibz.org/environmentaldatamanagement
  fetched: 2026-11-09
  quote: As part of the Resilient Reef Initiative (RRI) project, UB-ERI also compiled and standardized
    coral reef monitoring data from the Turneffe Atoll Marine Reserve.
- claim: Its avian team collects bird banding data each winter and spring under the MoSI programme with
    partners.
  url: https://www.uberibz.org/environmentaldatamanagement
  fetched: 2026-11-09
  quote: Each year during the winter and spring, the UB-ERI Avian Team works with partners to collect
    bird banding data under the Monitoreo de Sobrevivencia Invernal (MoSI) program.
- claim: In a post dated 9 October, it reported publishing on GBIF the first dataset from its 'Connecting
    protected area monitoring to national biodiversity reporting in Belize' project, records of fruit-feeding
    butterflies from Pook's Hill.
  url: https://www.uberibz.org/post/bringing-belize-s-butterflies-into-the-global-biodiversity-record
  fetched: 2026-11-09
  quote: UB-ERI has published the first dataset from their 'Connecting protected area monitoring to national
    biodiversity reporting in Belize project to GBIF,' making records of fruit-feeding butterflies from
    Pook’s Hill openly available
