summary: Research institute, run by the University of Belize and founded in 2010, and the only Belizean
  organisation registered as a GBIF data publisher, with about 30,000 observations published.
facts:
- claim: The only Belizean organisation registered as a GBIF data publisher, having published about 30,000
    observations across 11 datasets.
  url: https://www.uberibz.org/post/belize-s-contributions-to-global-biodiversity-information-facility-gbif
  fetched: 2026-11-09
  quote: UB-ERI is currently the only Belizean organization registered as a GBIF data publisher.
- claim: Has published approximately 30,000 biodiversity observations across 11 datasets with national
    partners.
  url: https://www.uberibz.org/post/belize-s-contributions-to-global-biodiversity-information-facility-gbif
  fetched: 2026-11-09
  quote: the Institute has published approximately 30,000 biodiversity observations across 11 datasets
- claim: Its team page says its team is capable of leading projects on biodiversity monitoring among other
    conservation issues.
  url: https://www.uberibz.org/about-us/team
  fetched: 2026-11-09
  quote: UB-ERI has a skilled and experienced team capable of leading projects on key conservation issues,
