summary: Private Belizean non-profit, established in 1988, that manages the Rio Bravo
  Conservation and Management Area; in 2022 its rangers monitored 47 parrot nests
  and were trained in SMART and PAWS.
facts:
- claim: Describes itself as a private, non-profit Belizean conservation organisation
    established in 1988 that manages the Rio Bravo Conservation and Management Area.
  url: https://pfbelize.org/wp-content/uploads/2024/08/PfB-Monitoring-Activities-Report-Summary-2022.pdf
  fetched: 2026-11-12
  quote: Programme for Belize (PfB) is a private, non-profit, Belizean conservation
    organization established in 1988
- claim: Its rangers collected nesting data on yellow-headed parrots from March to
    June 2022 and monitored 47 nests.
  url: https://pfbelize.org/wp-content/uploads/2024/08/PfB-Monitoring-Activities-Report-Summary-2022.pdf
  fetched: 2026-11-12
  quote: Data on the nesting population of Yellow -headed Parrot was collected by
    Programme for Belize rangers between the months of March to June of 2022.
- claim: Its 2022 report records a jaguar camera trap survey with 72 camera stations
    in the reserve, carried out by a Virginia Tech researcher and her field team.
  url: https://pfbelize.org/wp-content/uploads/2024/08/PfB-Monitoring-Activities-Report-Summary-2022.pdf
  fetched: 2026-11-12
  quote: A total of 72 camera stations were set up in RBCMA
- claim: Its rangers were trained in 2022 with WCS staff in PAWS, a patrol planning
    tool, and in entering data on SMART devices.
  url: https://pfbelize.org/wp-content/uploads/2024/08/PfB-Monitoring-Activities-Report-Summary-2022.pdf
  fetched: 2026-11-12
  quote: The focus on the training was the introduction to PAWS as a tool to assist
    in patrol planning.
- claim: During the 2022 fire season, monitored fires at least twice a day from a
    fire observation tower at the East Gate.
  url: https://pfbelize.org/wp-content/uploads/2024/08/PfB-Monitoring-Activities-Report-Summary-2022.pdf
  fetched: 2026-11-12
  quote: Monitoring is done at least two times daily through the fire observation
    tower at the East Gate
