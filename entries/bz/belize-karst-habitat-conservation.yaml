facts:
- claim: Describes itself as a community-based conservation organisation.
  url: https://belizekarst.org/about-bkhc
  fetched: 2026-11-12
  quote: We are a dynamic and progressive community-based conservation organization
    with a global perspective
- claim: Launched a research programme in early 2023 to establish ongoing monitoring
    of Tapir Mountain Nature Reserve.
  url: https://www.belizekarst.org/belize-conservation-research-monitoring
  fetched: 2026-11-12
  quote: In early 2023, BKHC launched its research program with an objective to establish
    ongoing monitoring and research activities for informing management decisions
    and measuring management success
- claim: Set up 22 bird point count stations, surveyed monthly from June 2023, and
    signed a co-management agreement with the Forest Department in 2019.
  url: https://www.belizekarst.org/belize-conservation-research-monitoring
  fetched: 2026-11-12
  quote: In June 2023, monthly bird surveys commenced at each station to establish
    a baseline count of the present bird species variety
- claim: Monitors water quality and stream habitat at sites on Barton Creek and Roaring
    River.
  url: https://www.belizekarst.org/belize-conservation-research-monitoring
  fetched: 2026-11-12
  quote: By continuously monitoring the stream habitats, we will be better equipped
    to make well-informed management decisions aimed at effectively safeguarding the
    Tapir Mountain Nature Reserve watershed.
- claim: Builds a species inventory for the reserve through eBird and iNaturalist.
  url: https://www.belizekarst.org/belize-conservation-research-monitoring
  fetched: 2026-11-12
  quote: Utilizing citizen science platforms like eBird and iNaturalist, we’ve been
    able to create a species inventory for Tapir Mountain Nature Reserve
- claim: Its address is in San Ignacio.
