summary: Government department that manages five marine reserves and monitors coral
  health, and in a September 2024 presentation set milestones of 25% of ocean space
  in Biodiversity Protection Zones by November 2024 and up to 30% by November 2026.
facts:
- claim: In a September 2024 presentation to the International Coral Reef Initiative,
    the Belize Fisheries Department lists the designation of new Biodiversity Protection
    Zones, including stakeholder engagement and the gazette process, as its task.
  url: https://icriforum.org/wp-content/uploads/2024/09/BFD_ICRI_38.pdf
  fetched: 2026-11-12
  quote: Designation of the new BPZs
- claim: The presentation sets milestones to expand Biodiversity Protection Zones
    to 25% of Belize's ocean space by November 2024 and up to 30% by November 2026.
  url: https://icriforum.org/wp-content/uploads/2024/09/BFD_ICRI_38.pdf
  fetched: 2026-11-12
  quote: 'No later than November 4th 2024: Expand Biodiversity'
- claim: The Coastal Zone Management Authority and Institute says monitoring visits
    by the Fisheries Department and partners in late June 2023 confirmed coral bleaching.
  url: https://www.coastalzonebelize.org/coral-bleaching-project/
  fetched: 2026-11-12
  quote: monitoring visits conducted by the Fisheries Department and partners in late
    June 2023 confirmed bleaching.
- claim: ECOMAR's page on the coral reef monitoring network says the department manages
    five marine reserves and that its biologists conduct regular monitoring of marine
    life, including coral reef health.
  url: https://www.ecomarbelize.org/coral-network.html
  fetched: 2026-11-12
  quote: They manage five marine protected areas in Belize and their biologists conduct
    regular monitoring of marine life including coral reef health.
