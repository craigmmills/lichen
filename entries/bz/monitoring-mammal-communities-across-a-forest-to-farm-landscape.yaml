- claim: Aims to build a photo-based inventory of individual jaguars to help identify cats potentially
    involved in human-wildlife conflict.
  url: https://www.uberibz.org/mammalssgwp
  fetched: 2026-11-09
  quote: Build a photo-based inventory of individual jaguars to help identify and track cats potentially
    involved in human-wildlife conflict in surrounding communities.
- claim: Plans to process all imagery into Panthera's IDS database, where jaguar individuals will be identified
    by coat pattern.
  url: https://www.uberibz.org/mammalssgwp
  fetched: 2026-11-09
  quote: All imagery will be processed and entered into Panthera’s IDS database, where jaguar individuals
    will be identified using their unique coat patterns.
