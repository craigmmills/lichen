summary: Non-governmental organisation that monitors turtle nesting and coral bleaching and, its about
  page says, co-managed Gladden Spit and Silk Cayes Marine Reserve and Laughing Bird Caye National Park.
facts:
- claim: A non-governmental organisation formed from Friends of Nature and the Toledo Association for
    Sustainable Tourism and Empowerment.
  url: https://seabelize.bz/about-us/
  fetched: 2026-11-09
  quote: The Southern Environmental Association (SEA) is a non-governmental organization, developed when
    two longstanding conservation organizations, Friends of Nature (FON) and the Toledo Association for
    Sustainable Tourism and Empowerment (TASTE).
- claim: Its about page says it co-managed Gladden Spit and Silk Cayes Marine Reserve and Laughing Bird
    Caye National Park.
  url: https://seabelize.bz/about-us/
  fetched: 2026-11-09
  quote: 'SEA comanaged two important marine protected areas in southern Belize: Gladden Spit & Silk Cayes
    Marine Reserve (GSSCMR) and Laughing Bird Caye National Park (LBCNP).'
- claim: Monitors loggerhead, green and hawksbill turtle nesting from June to September.
  url: https://seabelize.bz/services/sea-turtle-nesting/
  fetched: 2026-11-09
  quote: From June to September, SEA conducts nesting monitoring activities for Loggerhead (Caretta caretta),
    Green (Chelonia mydas), and Hawksbill (Eretmochelys imbricata) turtles.
- claim: Lists annual coral bleaching monitoring in September and October among its services.
  url: https://seabelize.bz/services/coral-bleaching/
  fetched: 2026-11-09
  quote: Coral bleaching monitoring is conducted annually during September and October.
