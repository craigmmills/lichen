summary: Non-governmental organisation registered in 2005 that monitors the Chiquibul
  Forest, including scarlet macaws and camera traps whose data goes to Panthera, and
  uses the SMART tool.
facts:
- claim: Registered as a non-governmental organisation with the Ministry of Human
    Development in June 2005.
  url: https://fcdbelize.org/our-history/
  fetched: 2026-11-12
  quote: Officially it became registered in the Ministry of Human Development as a
    non-governmental organization in June 2005.
- claim: Signed its first co-management agreement for Chiquibul National Park in 2007.
  url: https://fcdbelize.org/our-history/
  fetched: 2026-11-12
  quote: In 2007 FCD signed its first co-management agreement for the management and
    protection of Belize’s largest terrestrial protected area, the Chiquibul National
    Park.
- claim: Its Research Unit spends six to eight months monitoring scarlet macaws in
    the Chiquibul Forest.
  url: https://fcdbelize.org/biodiversity-research/
  fetched: 2026-11-12
  quote: FCD’s Research Unit spends 6-8 months conducting bio-monitoring of scarlet
    macaws in the Chiquibul Forest
- claim: Its Research Unit runs wildlife camera traps for the park's conservation
    targets and passes the data to Panthera for analysis.
  url: https://fcdbelize.org/biodiversity-research/
  fetched: 2026-11-12
  quote: To assess the species identified as conservation targets, the FCD Research
    Unit have established wildlife camera traps.
- claim: Runs a Biodiversity Research, Inventory and Monitoring (BRIM) framework for
    the Chiquibul Forest.
  url: https://fcdbelize.org/biodiversity-research/
  fetched: 2026-11-12
  quote: The implementation of the BRIM framework serves the management authorities,
    like FCD with scientific data
- claim: Its 2025 annual report says its scientific teams continued long-term monitoring
    of scarlet macaws, forest cover, aquatic systems and wildlife.
  url: https://www.fcdbelize.org/fcd-annual-report-2025/
  fetched: 2026-11-12
  quote: Scientific teams advanced long-term monitoring of scarlet macaws, forest
    cover, aquatic systems, and wildlife populations
- claim: Its headquarters are in San Jose Succotz, Cayo District, Belize.
  url: https://fcdbelize.org/biodiversity-research/
  fetched: 2026-11-12
  quote: Chi-Hah Street, San Jose Succotz
