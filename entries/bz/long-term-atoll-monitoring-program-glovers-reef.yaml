summary: Programme run by the Wildlife Conservation Society that began applying the
  LAMP protocol at Glover's Reef in 2004 with 33 sites, rose to 50 sites in 2010,
  and was revised in 2015 as LAMP II.
facts:
- claim: WCS Belize says WCS and the reserve staff at Glover's Reef began applying
    the LAMP protocol in 2004, collecting fishery-independent data on conch, lobster
    and fish communities from an initial 33 sites.
  url: https://belize.wcs.org/Initiatives/Long-Term-Atoll-Monitoring-Program-LAMP.aspx
  fetched: 2026-11-12
  quote: Since 2004, WCS and the reserve staff at Glover's Reef have been applying
    the Long-term Atoll Monitoring Program (LAMP) protocol
- claim: The number of sampling sites was raised to 50 in 2010.
  url: https://belize.wcs.org/Initiatives/Long-Term-Atoll-Monitoring-Program-LAMP.aspx
  fetched: 2026-11-12
  quote: In 2010, the number of sampling sites was increased to 50 to allow better
    representation of the General Use Zone.
- claim: Revised in 2015 as LAMP II, it assesses patch and fore-reef habitats, including
    benthic cover, fish communities and mobile invertebrates, as well as seagrass
    and algal flats.
  url: https://belize.wcs.org/Initiatives/Long-Term-Atoll-Monitoring-Program-LAMP.aspx
  fetched: 2026-11-12
  quote: LAMP II also included the assessment of seagrass, algal flats and associated
    invertebrate populations.
