facts:
- claim: PMN reports that the expedition, the country's first full marine survey designed to guide national
    ocean protection policy, wrapped up in 2025.
  url: https://pmn.co.nz/read/environment/from-reef-ruins-to-science-inspiration-tuvalu-s-marine-mission-concludes
  fetched: 2026-11-12
  quote: A months-long expedition in Tuvalu wrapped up last week, marking the completion of the country's
    first full marine survey designed to guide national ocean protection policy.
- claim: PMN reports that scientists used baited remote underwater video systems, eDNA sampling and the
    Argonauta submersible from Nanumea to Niulakita.
  url: https://pmn.co.nz/read/environment/from-reef-ruins-to-science-inspiration-tuvalu-s-marine-mission-concludes
  fetched: 2026-11-12
  quote: Scientists used baited remote underwater video systems (BRUVs), environmental DNA (eDNA) sampling,
    and the Argonauta submersible to explore Tuvalu's deep-sea, reef, and coastal ecosystems from Nanumea
    to Niulakita.
