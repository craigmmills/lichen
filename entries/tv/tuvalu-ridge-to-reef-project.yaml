id: tuvalu-ridge-to-reef-project
kind: project
name: Implementing a Ridge to Reef Approach to Protect Biodiversity and Ecosystem Functions in Tuvalu
also_known_as:
- R2R Tuvalu
- Tuvalu Ridge to Reef Project
scope: tv
ai_label: conservation-tech
realms:
