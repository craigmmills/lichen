status: closed
summary: Closed biodiversity project run by the Department of Environment, funded by the GEF (grant of
  3,762,844 US dollars) and UNDP, which aimed to build a centralised GIS database and improve natural
  resource data.
facts:
- claim: The GEF lists the project as completed, with a GEF grant of 3,762,844 US dollars, approved for
    implementation on 21 July 2015 and closed on 31 August 2023.
  url: https://thegef.org/projects-operations/projects/5550
  fetched: 2026-11-12
  quote: Project Approved for Implementation 21 Jul 2015 Project Closed 31 Aug 2023
- claim: UNDP says the project would assess the status of natural resources across the nine islands, with
    baseline analysis and data collection.
  url: https://www.undp.org/pacific/projects/tuvalu-ridge-reef-project
  fetched: 2026-11-12
  quote: The project will work across the nine islands of Tuvalu on assessing natural resources status
    (baseline analysis and data collection)
- claim: Among its stated aims was to enhance or develop a centralised GIS database on biodiversity, natural
    resources and governance systems.
  url: https://www.undp.org/pacific/projects/tuvalu-ridge-reef-project
  fetched: 2026-11-12
  quote: enhance and/or develop a centralized GIS database system on biodiversity, natural resources,
    and governance systems
- claim: ESCAP describes one of its four components as improving data and information systems for natural
    resource management.
  url: https://sdghelpdesk.unescap.org/technical-assistance/best-practices/implementing-ridge-reef-approach-protect-biodiversity-and
  fetched: 2026-11-12
  quote: (4) improving data and information systems to facilitate evidence-based planning, decision-making,
    and management of natural resources
- claim: In November 2021, UNDP quoted Feagaiga Penivaoo of the project as saying that LiDAR imagery had
    helped the project update its biodiversity land and marine surveys and map conservation areas.
  url: https://www.undp.org/pacific/stories/lidar-imagery-data-tuvalu-crucial-tool-understand-climate-change-impacts-and-plan-adaptation
  fetched: 2026-11-12
  quote: Feagaiga Penivaoo, of the Ridge to Reef Project said the LiDAR imagery data have benefited the
    Tuvalu Ridge to Reef project to update their biodiversity land survey and marine survey.
