summary: Tuvalu government environment department, listed by the CBD as a national focal point and registered
  as a GBIF data publisher, which Island Conservation reports implemented the Predator Free Pacific programme
  there in 2024.
facts:
- claim: The CBD lists the Acting Director of Environment as Tuvalu's CBD primary, clearing-house and
    protected-areas national focal point.
  url: https://www.cbd.int/countries/nfp/?country=tv
  fetched: 2026-11-12
  quote: Acting Director of Environment Ministry of Home Affairs, Climate Change and Environment Funafuti
    Tuvalu CBD Primary NFP, CHM NFP, Protected Areas NFP
- claim: Registered with GBIF as a data publisher in Funafuti, describing its aim as publishing and collecting
    data for research and biodiversity information management.
  url: https://api.gbif.org/v1/organization?country=TV
  fetched: 2026-11-12
  quote: Publish and collect data for research forcus and biodiversity information management.
- claim: Its GBIF registration records a November 2022 expectation to publish seabird and marine species
    data as occurrences and sampling events, associated with a GBIF-funded project.
  url: https://api.gbif.org/v1/organization?country=TV
  fetched: 2026-11-12
  quote: Dataset on seabird and marine species will primarily be available as occurrences and sampling-event
    data.
- claim: Its GBIF registration gives its address as the Government Building, Vaiaku, Funafuti.
  url: https://api.gbif.org/v1/organization?country=TV
  fetched: 2026-11-12
  quote: Gevernment Building, Vaiaku, Funafuti, Tuvalu.
- claim: Island Conservation reports that the department implemented the Predator Free Pacific programme
    in Tuvalu between July and September 2024, with technical support from Island Conservation.
  url: https://www.islandconservation.org/?p=11108
  fetched: 2026-11-12
  quote: The Predator Free Pacific (PFP) programme, part of the Pacific Regional Invasive Species Management
    Support Service (PRISMSS), was implemented by the Tuvalu Department of Environment with technical
    support from Island Conservation .
- claim: In July 2025, Island Conservation reported that a follow-up monitoring mission had confirmed
    successful rat eradication on six islets in Nukufetau and Funafuti.
  url: https://www.islandconservation.org/?p=11108
  fetched: 2026-11-12
  quote: A follow-up monitoring mission has confirmed the success of the eradication
- claim: IUCN reports that in 2018 the department and SPREP, through BIOPAMA, held a workshop to collate
    and improve Tuvalu's protected area data.
  url: https://iucn.org/node/16666
  fetched: 2026-11-12
  quote: BIOPAMA regional observatory (resource-hub) recently held a joint workshop with the Tuvalu Department
    of Environment to collate and improve protected area data.
