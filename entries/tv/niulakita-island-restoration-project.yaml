summary: Ongoing restoration project on Niulakita led by the Department of Environment with Island Conservation,
  whose teams arrived in March 2026 and, as reported in April 2026, were collecting baseline environmental
  data.
facts:
- claim: In April 2026, Island Conservation reported that the team was collecting baseline environmental
    data, monitoring seabirds, land crabs, vegetation and rodent activity through field surveys, camera
    traps and biological sampling.
  url: https://www.islandconservation.org/protecting-niulakitas-future-tuvaluan-island-prepares-for-holistic-ecosystem-restoration/
  fetched: 2026-11-12
  quote: This includes monitoring seabirds, land crabs, vegetation, and rodent activity through field
    surveys, camera traps , and biological sampling.
- claim: Island Conservation says teams from Island Conservation and the Tuvalu Department of Environment
    arrived on Niulakita in early March 2026.
  url: https://www.islandconservation.org/protecting-niulakitas-future-tuvaluan-island-prepares-for-holistic-ecosystem-restoration/
  fetched: 2026-11-12
  quote: In early March, the Niulakita community welcomed teams from Island Conservation and the Tuvalu
    Department of Environment with a traditional feast and introductions.
