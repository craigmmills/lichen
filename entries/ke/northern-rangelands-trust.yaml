summary: Organisation working with community conservancies in northern and coastal Kenya,
  which runs a landscape-wide IoT conservation network and tracks rangelands with satellite
  data.
facts:
- claim: Partners with community conservancies in Kenya and parts of Uganda.
  url: https://digitalearthafrica.org/pt/?p=5030
  quote: the Northern Rangelands Trust (NRT) has partnered with community conservancies in
    northern and coastal Kenya, as well as parts of Uganda
  fetched: '2026-10-30'
- claim: Says it is a membership organisation owned and led by the community conservancies
    it serves.
  url: https://www.nrt-kenya.org/about-nrt
  fetched: '2026-10-30'
  quote: NRT is a membership organisation owned and led by the 43 community conservancies
    it serves in Kenya (northern and coastal regions) and Uganda.
- claim: Digital Earth Africa says the use case compares vegetation health across twenty-two
    conservancies against baseline conditions.
  url: https://digitalearthafrica.org/pt/?p=5030
  fetched: '2026-10-30'
  quote: The current use case focuses on comparing vegetation health across twenty-two conservancies
    against baseline conditions
- claim: EarthRanger says NRT and Lewa run a joint operations command centre on its platform.
  url: https://www.earthranger.com/partners
  fetched: '2026-10-30'
  quote: Using EarthRanger, NRT and Lewa run a joint operations command centre (JOCC)
- claim: Deployed a landscape-wide IoT conservation network.
  url: https://www.nrt-kenya.org/news-2/2023/10/3/scaling-new-heights-of-wildlife-conservation-africas-largest-iot-network-deployed-in-nrt-member-community-conservancies
  fetched: '2026-10-31'
  quote: NRT's is Africa's largest landscape-wide, IoT conservation network.
- claim: Uses EarthRanger in its member conservancies.
  url: https://www.nrt-kenya.org/news-2/2023/10/3/scaling-new-heights-of-wildlife-conservation-africas-largest-iot-network-deployed-in-nrt-member-community-conservancies
  fetched: '2026-10-31'
  quote: EarthRanger systems were installed in NRT member community conservancies
- claim: Digital Earth Africa reports NRT using its tools to analyse vegetation productivity.
  url: https://digitalearthafrica.org/fr/?p=5030
  quote: By using DE Africa's tools, NRT can analyse seasonal cycles of vegetation productivity
  fetched: '2026-10-31'
- claim: Gives a mailing address at Isiolo.
  url: https://www.nrt-kenya.org/contact
  fetched: '2026-10-31'
  quote: Northern Rangelands Trust, Private Bag, Isiolo 60300, Kenya
