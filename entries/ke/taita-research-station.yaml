summary: Established by the University of Helsinki in 2011 in Wundanyi, Taita Taveta
  County, this station holds a geospatial database including airborne laser scanner,
  hyperspectral and satellite data.
facts:
- claim: Located in Wundanyi, Taita Taveta County; established by the University of
    Helsinki in 2011.
  url: https://www.helsinki.fi/en/research-stations/taita-research-station
  fetched: '2026-11-09'
  quote: The multidisciplinary Taita Research Station is located in Wundanyi, Taita
    Taveta County in southeastern Kenya. It was established by the University of Helsinki
    in 2011.
- claim: Holds a geospatial database on land cover and its changes, field plots, and
    multitemporal aerial, satellite, airborne laser and hyperspectral data.
  url: https://www.helsinki.fi/en/researchgroups/earth-change-observation-laboratory/taita-research-station
  fetched: '2026-11-09'
  quote: The most valuable asset of the station is the geospatial database about land
    cover and its changes, soil, topography, climate, and infrastructure.
- claim: Its remote sensing data include airborne laser scanner and hyperspectral
    data.
  url: https://www.helsinki.fi/en/researchgroups/earth-change-observation-laboratory/taita-research-station
  fetched: '2026-11-09'
  quote: Remote sensing data of the station includes multitemporal aerial photography
    and satellite imagery, airborne laser scanner data and airborne hyperspectral
    remote sensing data.
- claim: Its research list includes a 2022 land cover map of Taita Taveta County from
    Sentinel-1, Sentinel-2 and topoclimatic data.
  url: https://www.helsinki.fi/en/research-stations/taita-research-station/research
  fetched: '2026-11-09'
  quote: Land Cover Map for Multifunctional Landscapes of Taita Taveta County, Kenya,
    Based on Sentinel-1 Radar, Sentinel-2 Optical, and Topoclimatic Data.
- claim: Postal address in Wundanyi, Kenya.
  url: https://www.helsinki.fi/en/research-stations/taita-research-station/contact
  fetched: '2026-11-09'
  quote: 'Postal address: TAITA Research Station, P.O. Box 1156, 80304 Wundanyi, Kenya'
