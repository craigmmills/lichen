summary: Network established in 2011 by government and non-governmental agencies for
  consistent marine mammal data collection on the Kenyan coast; a 2021 paper described
  more than 100 contributors, with reports going to Watamu.
facts:
- claim: Established in 2011 by government and non-governmental agencies as a platform
    for consistent collection of marine mammal data along the Kenyan coast.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2021.642399
  fetched: '2026-11-09'
  quote: In 2011, several non-governmental and government agencies established the
    Kenya Marine Mammal Network (KMMN) to provide a platform for the consistent collection
    of data on marine mammals along the Kenyan coast
- claim: A 2021 paper described nationwide data collection through dedicated surveys,
    opportunistic sightings and citizen science, involving more than 100 contributors.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2021.642399
  fetched: '2026-11-09'
  quote: The KMMN collects data nationwide through dedicated surveys, opportunistic
    sightings and participative citizen science, currently involving more than 100
    contributors.
- claim: For the sightings reviewed in the 2021 paper, reports went to the KMMN data
    centre at the Watamu Marine Association office.
  url: https://www.frontiersin.org/articles/10.3389/fmars.2021.642399
  fetched: '2026-11-09'
  quote: were reported to the KMMN data center at the Watamu Marine Association (WMA)
    office in Watamu
