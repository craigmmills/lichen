    66.7 hectares of degraded wetland by planting papyrus.
  url: https://naturekenya.org/2021/09/27/yalas-indigenous-and-community-conserved-area/
  fetched: '2026-11-16'
  quote: Within the ICCA, local community conservation champions, the Yala Ecosystem
    Site Support Group (YESSG) has worked hard to restore 66.7 ha of degraded wetland
    by planting papyrus.
- claim: It has planted 69,622 indigenous trees in the lower Yala River riparian zone.
  url: https://naturekenya.org/2021/09/27/yalas-indigenous-and-community-conserved-area/
