summary: Web tool built by SERVIR-Eastern and Southern Africa at the Regional Centre for Mapping
  of Resources for Development, which makes downloadable maps of vegetation condition from
  MODIS NDVI for Kenyan rangelands.
facts:
- claim: A 2019 paper describes MODIS NDVI monitoring of Kenyan rangelands through a web tool.
  url: https://www.frontiersin.org/articles/10.3389/fenvs.2019.00187
  quote: Application of MODIS NDVI for Monitoring Kenyan Rangelands Through a Web Based Decision
    Support Tool
  fetched: '2026-10-31'
- claim: Users can select indices and produce downloadable maps.
  url: https://www.frontiersin.org/articles/10.3389/fenvs.2019.00187
  quote: It allows users to select indices, the necessary ancillary data, and produce downloadable
    maps.
  fetched: '2026-10-31'
