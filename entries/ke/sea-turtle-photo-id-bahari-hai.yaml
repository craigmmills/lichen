summary: Programme run by Bahari Hai that identifies individual sea turtles from facial
  scales, aiming to use the data to study turtle populations in Kenya's coastal habitats
  and later other marine protected areas.
facts:
- claim: Identifies individual sea turtles from the scales on their faces, which it
    says are distinct like a fingerprint.
  url: https://baharihai.org/sea-turtle-photo-id/
  fetched: 2026-11-22
  quote: Like a fingerprint, each sea turtle’s facial scales are distinct and don’t
    change over time.
- claim: Presents photo-ID as a low-cost, non-intrusive method that can involve citizen
    scientists.
  url: https://baharihai.org/sea-turtle-photo-id/
  fetched: 2026-11-22
  quote: photo-ID is a low-cost, non-intrusive method that makes it simple to monitor
    sea turtles without upsetting them.
- claim: Aims to use the data to study size, structure, residency and trends of sea
    turtles in Kenya's coastal habitats, and to extend to other marine protected areas.
