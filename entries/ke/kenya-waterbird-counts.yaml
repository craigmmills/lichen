summary: Annual count of waterbirds in wetlands as an indicator of wetland health,
  run by National Museums of Kenya, Kenya Wildlife Service and Nature Kenya; January
  2023 counts included Lake Naivasha and Lake Baringo.
facts:
- claim: An annual monitoring activity collecting the numbers of waterbirds in wetlands
    as an indicator of wetland health.
  url: https://naturekenya.org/2023/01/31/waterbird-counts/
  fetched: '2026-11-09'
  quote: It’s an annual monitoring activity to collect information on the number of
    waterbirds in wetlands, indicating the health of the wetlands.
- claim: The January 2023 counts covered sites including Nairobi National Park, Lake
    Ol'Bolossat, Lake Bogoria, Lake Baringo and Lake Naivasha.
  url: https://naturekenya.org/2023/01/31/waterbird-counts/
  fetched: '2026-11-09'
  quote: Sites covered in January included Manguo Ponds
