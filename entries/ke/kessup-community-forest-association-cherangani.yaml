summary: One of six Cherangani Hills community forest associations running tree nurseries;
  its nursery raised over 400,000 seedlings in Kessup forest, one of thirteen fragments
  of the Cherangani Hills Forest.
facts:
- claim: Its nursery raised over 400,000 seedlings in the Kessup forest, one of thirteen
    fragments of the Cherangani Hills Forest.
  url: https://naturekenya.org/2025/01/14/raising-seedlings-of-hope-in-cherangani/
  fetched: '2026-11-16'
  quote: In the Kessup forest, one of thirteen fragments of the Cherangani Hills Forest
    that spans Trans-Nzoia, Uasin Gishu, and Elgeyo-Marakwet counties, the CFA raised
    over 400,000 seedlings
- claim: Is one of six community forest associations in the Cherangani Hills that
    run tree nurseries for forest restoration.
  url: https://naturekenya.org/2025/01/14/raising-seedlings-of-hope-in-cherangani/
  fetched: '2026-11-16'
  quote: The CFAs – Elgeyo, Kessup, Cherangani, Cheptongei, Kapyego, and Chesoi –
    have established vibrant nurseries that nurture over 20 species of indigenous
    trees
- claim: Together the six associations’ seedlings were planted over 290 hectares of
    forest to restore degraded areas inside state forests.
  url: https://naturekenya.org/2025/01/14/raising-seedlings-of-hope-in-cherangani/
  fetched: '2026-11-16'
  quote: over 288,000 seedlings of 18 assorted species raised in the CFAs’ nurseries
    were planted across 290 hectares of forest, marking significant progress in restoring
    degraded areas inside the state forests.
