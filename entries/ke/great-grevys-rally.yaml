summary: Citizen science photographic census of Grevy's zebra across Kenya, first run in 2016,
  which identifies individuals by their stripe patterns.
facts:
- claim: The Grevy's Zebra Technical Committee enlisted the public in the first survey in
    2016.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  quote: the Grevy’s Zebra Technical Committee enlisted the public in the first ever citizen
    science Grevy’s Zebra survey
  fetched: '2026-10-30'
- claim: The first rally estimated 2350 individuals.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  quote: produced over 25,000 useable images that were analyzed to produce a population estimate
    of 2350 individual Grevy’s zebra in Kenya
  fetched: '2026-10-30'
- claim: The Grevy's Zebra Trust says the Grevy's Zebra Technical Committee began it in 2016
    as the first citizen science survey of the species.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  fetched: '2026-10-31'
  quote: In 2016, the Grevy’s Zebra Technical Committee enlisted the public in the first ever
    citizen science Grevy’s Zebra survey, dubbed the Great Grevy’s Rally.
- claim: An arXiv paper says it produces estimates through expert and algorithmic curation
    of images.
  url: https://arxiv.org/abs/2412.00290
  fetched: '2026-10-31'
  quote: a citizen science event that produces population estimates via expert and algorithmic
    curation of volunteer-captured images
- claim: The trust says its estimates were accepted by Kenya Wildlife Service as official.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  fetched: '2026-10-31'
  quote: these rallies collectively resulted in greatly refined population estimates that
    were accepted by the Kenya Wildlife Service (KWS) as the official status of population
    numbers in the country
- claim: Citizen science survey started in 2016.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  fetched: '2026-10-30'
  quote: In 2016, the Grevy's Zebra Technical Committee enlisted the public in the first ever
    citizen science Grevy's Zebra survey, dubbed the Great Grevy's Rally.
- claim: Counts come from stripe patterns in photographs.
  url: https://www.grevyszebratrust.org/great-grevys-rally/
  fetched: '2026-10-30'
  quote: photographic recording of Grevy's zebra, using individual unique stripe patterns
    on each animal like fingerprints for identification
