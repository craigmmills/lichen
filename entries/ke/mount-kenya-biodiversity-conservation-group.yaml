summary: Site Support Group for the Mount Kenya Forest KBA that operates three tree
  nurseries and worked with others to restore the Nanyuki River with indigenous trees
  and gabions.
facts:
- claim: Operates three tree nurseries.
  url: https://naturekenya.org/2024/01/08/promoting-conservation-in-mount-kenya-forest-through-nature-based-enterprises/
  fetched: '2026-11-16'
  quote: Mt. KEBIO also operates three tree nurseries, namely Tumaini, Mazingira and
    Gathiuru, that currently have 11,400 indigenous and exotic tree seedlings.
- claim: Worked with other groups to restore the Nanyuki River with indigenous trees
    and gabions.
  url: https://naturekenya.org/2024/01/08/promoting-conservation-in-mount-kenya-forest-through-nature-based-enterprises/
  fetched: '2026-11-16'
  quote: The SSG collaborated with other conservation groups to support restoration
    of Nanyuki River through the planting of indigenous trees and construction of
    gabions to control degradation of the river banks.
- claim: Is the Site Support Group for the Mount Kenya Forest KBA.
  url: https://naturekenya.org/2024/01/08/promoting-conservation-in-mount-kenya-forest-through-nature-based-enterprises/
  fetched: '2026-11-16'
  quote: Mt. KEBIO, the Site Support Group (SSG) for the Mount Kenya Forest KBA, is
    engaged in eco-tourism and other nature-based enterprises.
