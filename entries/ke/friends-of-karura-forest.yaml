summary: Community forest association co-managing Karura Forest Reserve with the Kenya
  Forest Service under a 2021 to 2041 agreement; it led replanting that raised indigenous
  cover from 25% in 2009 to over 40%.
facts:
- claim: Co-manages Karura Forest Reserve with the Kenya Forest Service under a joint
    forest management agreement for 2021 to 2041.
  url: https://friendsofkarura.org/about-fkf/
  fetched: '2026-11-16'
  quote: This is all managed through a legally binding joint Forest Management Agreement
    (2021 – 2041) with the Kenya Forest Service (KFS) which makes FKF a full partner
    in the management and conservation of Karura Forest Reserve.
- claim: Is a community forest association whose aims include protecting Karura and
    restoring its natural ecosystem.
  url: https://friendsofkarura.org/about-fkf/
  fetched: '2026-11-16'
  quote: FKF aims to protect Karura, restore its natural ecosystem, provide access
    to the public, and create employment for neighbouring communities.
- claim: Led indigenous tree replanting that raised indigenous vegetation cover in
    Karura from 25% in 2009 to more than 40%.
  url: https://friendsofkarura.org/about-fkf/
  fetched: '2026-11-16'
  quote: We led a massive indigenous tree re-planting effort, increasing Karura’s
    indigenous vegetation cover from 25% in 2009 to more than 40% today.
- claim: After an announced change to the arrangement was reversed, the Kenya Forest
    Service and Friends of Karura Forest continue to manage the forest jointly.
  url: https://news.mongabay.com/2025/11/new-arrangements-should-preserve-nairobis-much-loved-karura-forest/
  fetched: '2026-11-16'
  quote: the forest service and FKF will now continue jointly managing the forest.
