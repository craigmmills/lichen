facts:
- claim: Is one of two community forest associations brought into structured collaboration
    with the Kenya Forest Service under a 2026 to 2031 participatory forest management
    plan.
  url: https://www.standardmedia.co.ke/business/environment-climate/article/2001550307/communities-to-co-manage-mumoni-mutitu-forests-after-deal
  fetched: '2026-11-16'
  quote: The five-year road map, covering 2026 to 2031, brings Muumoni and Mutitu
    Community Forest Associations (CFAs) and grassroots Site Support Groups (SSGs)
    into structured collaboration with the Kenya Forest Service (KFS).
- claim: Local groups work alongside Kenya Forest Service rangers to patrol forest
    boundaries, manage resource zones and regulate access.
  url: https://www.standardmedia.co.ke/business/environment-climate/article/2001550307/communities-to-co-manage-mumoni-mutitu-forests-after-deal
  fetched: '2026-11-16'
  quote: local groups will work alongside KFS rangers to patrol forest boundaries,
    manage designated resource zones and regulate access to forest resources.
- claim: The plan brings 13,000 hectares under community-led conservation, including
    1,958 hectares in Mutitu Hill Forest Reserve.
  url: https://www.standardmedia.co.ke/business/environment-climate/article/2001550307/communities-to-co-manage-mumoni-mutitu-forests-after-deal
  fetched: '2026-11-16'
  quote: The initiative brings 13,000 hectares under a community-led conservation
    framework. This includes 11,031 hectares in Mumoni Hill Forest Reserve and 1,958
    hectares in Mutitu Hill Forest Reserve
