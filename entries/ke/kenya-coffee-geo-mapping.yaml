summary: National exercise that maps coffee farms from satellite imagery and field checks
  to show coffee is grown on non-deforested land, for the EU Deforestation Regulation.
facts:
- claim: Generates farm-level polygons to show coffee is produced on non-deforested land.
  url: https://www.kenyanews.go.ke/dg-akali-urges-for-swift-coordination-as-coffee-geo-mapping-begins/
  quote: generate farm-level polygons and location metadata to demonstrate that Kenyan coffee
    is produced on non-deforested land
  fetched: '2026-10-31'
- claim: 30 per cent of coffee-growing areas were reported as captured by satellite imagery.
  url: https://www.kenyanews.go.ke/dg-akali-urges-for-swift-coordination-as-coffee-geo-mapping-begins/
  quote: 30 per cent of coffee-growing areas have already been captured through satellite
    imagery
  fetched: '2026-10-31'
- claim: A ministry officer reported coverage of 16 of 33 coffee-growing counties.
  url: https://www.foodbusinessmea.com/kenya-accelerates-coffee-geo-mapping-to-meet-eu-deforestation-regulation-deadline/
  quote: The mapping covers 16 out of 33 coffee-growing counties
  fetched: '2026-10-31'
