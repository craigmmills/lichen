summary: Conservation organisation in Kenya's Maasai Mara that uses drones, some with thermal
  imaging, to manage human-elephant conflict and monitor herds.
facts:
- claim: Nomad Africa reports it has nine drones, three with thermal imaging.
  url: https://nomad.africa/inspiration/mara-elephant-project-drone-technology
  quote: Equipped with nine drones, including three with thermal imaging
  fetched: '2026-10-30'
- claim: Sponsored the Youth Conservation Tech Award.
  url: https://africasciencenews.org/kenyan-innovator-wins-top-youth-conservation-tech-award-at-gctdf-2026
  quote: The award, sponsored by the Mara Elephant Project
  fetched: '2026-10-30'
- claim: Established in 2011 to protect elephants in the Maasai Mara ecosystem, according
    to EarthRanger.
  url: https://www.earthranger.com/partners
  fetched: '2026-10-30'
  quote: Mara Elephant Project (MEP) was established in 2011 with the mission of protecting
    elephants to conserve the Maasai Mara ecosystem
- claim: Capital FM reports it uses drones for wildlife monitoring and rapid response to human-elephant
    conflict.
  url: https://www.capitalfm.co.ke/business/2026/02/mara-elephant-project-partners-with-global-conservation-tech-forum
  fetched: '2026-10-30'
  quote: particularly through the use of drones for wildlife monitoring and rapid response
    to human–elephant conflict
- claim: Nawiri Group reports it sets geo-fences that alert staff when collared elephants
    enter farmland.
  url: https://www.nawirigroup.com/impact/the-silicon-savannah
  fetched: '2026-10-30'
  quote: These virtual boundaries, set around farmlands and communities, trigger alerts when
    collared elephants breach them
