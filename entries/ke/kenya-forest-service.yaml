facts:
- claim: Its headquarters are at Karura in Kiambu.
  url: https://www.kenyanews.go.ke/kenya-france-launch-22-million-euro-forest-fire-management-project/
  quote: the Kenya Forest Service (KFS) headquarters, Karura, Kiambu
  fetched: '2026-10-30'
- claim: In talks with the Kenya Space Agency on satellite monitoring of forests.
  url: https://capitalfm.africa/kfs-turns-to-space-technology-to-track-kenyas-forests-and-boost-tree-growing-drive/
  quote: held talks with Kenya Space Agency (KSA) Director General Hillary Kipkosgei on Wednesday
  fetched: '2026-10-30'
- claim: Pilots the M-Situ system at Ngong Forest.
  url: https://africasolutionsmediahub.org/2026/08/04/meet-the-ai-startup-using-smart-technology-to-protect-kenyas-forests/
  quote: piloted in partnership with the Kenya Forest Service at Ngong Forest
  fetched: '2026-10-30'
- claim: Says it is a state corporation with a mandate from the Forest Conservation and Management
    Act of 2016.
  url: https://www.kenyaforestservice.org/
  fetched: '2026-10-30'
  quote: Kenya Forest Service is a state corporation that was created through the Forest Act
- claim: The Standard reports a Kilifi conservator saying it uses satellite images to monitor
    forests.
  url: https://www.standardmedia.co.ke/business/amp/environment-climate/article/2001492072/kfs-banks-on-technology-to-curb-illegal-logging
  fetched: '2026-10-30'
  quote: Kilifi KFS conservator Elvis Fondo said they are using satellite images to monitor
    forests.
- claim: Wetlands International says Global Mangrove Watch alerts combine with its national
    forest alert system.
  url: https://eastafrica.wetlands.org/?p=4370
  fetched: '2026-10-31'
  quote: Combined with the Kenya Forest Service’s (KFS) national forest alert system
- claim: Wetlands International says it has set up an alert command centre in Lamu.
  url: https://eastafrica.wetlands.org/?p=4370
  fetched: '2026-10-31'
  quote: KFS has also established Lamu’s first-ever alert command center
- claim: Capital FM reports talks with the Kenya Space Agency on using Earth observation in
    the National Forest Resources Assessment.
  url: https://capitalfm.africa/kfs-turns-to-space-technology-to-track-kenyas-forests-and-boost-tree-growing-drive/
  fetched: '2026-10-31'
  quote: The partnership is expected to strengthen the National Forest Resources Assessment
- claim: Its address is Karura Forest, off Kiambu Road.
  url: https://nfms.kenyaforestservice.org/apps/mangrove-portal
  fetched: '2026-10-31'
  quote: Kenya Forest Service Karura Forest, off Kiambu Road
- claim: Houses the National Forest Monitoring System.
  url: https://reddplus.forestry.go.ke/national-forest-monitoring-system
  fetched: '2026-10-31'
  quote: Housed within the Kenya Forest Service (KFS), the NFMS provides the technical infrastructure
    for generating reliable, transparent, and consistent forest information
- claim: Gives an address at Karura Forest, Nairobi.
  url: https://nfms.kenyaforestservice.org/
  fetched: '2026-10-31'
  quote: Kenya Forest Service Karura Forest, off Kiambu Road P.O. Box 30513-00100, Nairobi
- claim: Capital FM reports it is turning to satellite and Earth observation data.
  url: https://capitalfm.africa/kfs-turns-to-space-technology-to-track-kenyas-forests-and-boost-tree-growing-drive/
  fetched: '2026-10-31'
  quote: is turning to satellite technology and Earth observation data to strengthen monitoring
    of the country’s forests
- claim: The Star reported in 2020 that KFS and the Kenya Space Agency were running a research
    project on Earth observation applications using Google Earth.
  url: https://www.the-star.co.ke/news/2020-10-22-kfs-to-use-space-technology-to-monitor-forests/
  quote: the two agencies are implementing a research project on the development of earth
    observation applications using Google Earth to develop products on natural resource management
  fetched: '2026-10-31'
- claim: Speakers at a JICA and JAXA COP28 side event on satellite forest monitoring included
    the Chief Conservator of Forests.
  url: https://www.satnavi.jaxa.jp/files/document/pdf/COP28_JJ-Event_Flyer_v2.pdf
  quote: Chief Conservator of Forest, Kenya Forest Service, Government of Kenya
  fetched: '2026-10-31'
- claim: Wetlands International says 13 of its rangers trained on Global Mangrove Watch alerts
    in Kwale in November 2025.
  url: https://www.wetlands.org/technology-for-good-global-mangrove-watch-training-in-kwale-kenya/
  quote: 15 rangers (2 from Kenya Wildlife Service and 13 from Kenya Forest Service)
  fetched: '2026-10-31'
