summary: Cuban enterprise in the Flora y Fauna system for conserving protected-area
  resources, which in 1999 created a nesting-record programme for sea turtles and
  partners with turtle and crocodile monitoring programmes.
facts:
- claim: OnCuba says the Flora y Fauna system is a group of enterprises dedicated
    to conserving and developing the natural resources of protected areas, made up
    of this enterprise and others.
  url: https://oncubanews.com/cuba/economia/flora-y-fauna-areas-protegidas-y-desarrollo-sostenible
  fetched: '2026-11-12'
  quote: Este sistema está integrado por la Empresa Nacional para la Protección de
    la Flora y la Fauna, la Empresa para la Conservación de la Ciénaga de Zapata
- claim: The UNDP sea turtle monitoring report says that in 1999 the ENPFF created
    a programme to record nesting in the nesting areas it administers.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: 1999 la ENPFF creó un programa para registrar la anidación en las áreas de
    anidación bajo su administración.
- claim: The same report says the executive coordinator of the sea turtle monitoring
    programme was a conservation specialist of the enterprise.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Especialista de Conservación de la Empresa Nacional para la Protección de
    la Flora y la Fauna.
