summary: Sandy-shore vegetation monitoring programme on eight beaches in three protected
  areas on Cuba's south coast, begun in 2011, using two permanent 100 square metre
  plots per beach, per the UNDP report.
facts:
- claim: The UNDP report says the programme is carried out on eight beaches in three
    protected areas on Cuba's south coast.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/6125ef758f58d7b680548014f19102c6db4bc2fd0fb54108aa990b6608288f13.pdf
  fetched: '2026-11-15'
  quote: El Programa de monitoreo de vegetación de costa arenosa se implementa en
    ocho playas de tres áreas protegidas de la costa sur de Cuba
- claim: The report says vegetation monitoring began in 2011 on three beaches in Guanahacabibes;
    Cayos de San Felipe joined late in 2011 and Jardines de la Reina in 2012.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/6125ef758f58d7b680548014f19102c6db4bc2fd0fb54108aa990b6608288f13.pdf
  fetched: '2026-11-15'
  quote: El monitoreo comenzó en el año 2011
- claim: The report says the variables are analysed from two permanent plots of 100
    square metres on each beach.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/6125ef758f58d7b680548014f19102c6db4bc2fd0fb54108aa990b6608288f13.pdf
  fetched: '2026-11-15'
  quote: dos parcelas permanentes de 10 0 m 2 cada una, ubicadas sistemáticamente
    en cada playa
- claim: The report says new software with the database created by the programme was
    presented at the data validation workshop in November 2012.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/6125ef758f58d7b680548014f19102c6db4bc2fd0fb54108aa990b6608288f13.pdf
  fetched: '2026-11-15'
  quote: software nuevo con la base de datos creada por el programa
- claim: The report names Jorge Ferro Díaz of ECOVIDA as scientific coordinator and
    María Antonia Castañeira Colomé of CNAP as executive coordinator.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/6125ef758f58d7b680548014f19102c6db4bc2fd0fb54108aa990b6608288f13.pdf
  fetched: '2026-11-15'
  quote: 'Coordinador científico: Dr. Jorge Ferro Díaz .'
