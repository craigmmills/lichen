summary: Marine research centre run by the University of Havana, whose researchers
  followed two manatees released with satellite transmitters in 2012 and which supplied
  coordinators for the manatee and seagrass monitoring programmes.
facts:
- claim: The UNDP report describes two manatees released with satellite transmitters
    in 2012 and followed by researchers of the centre and specialists of Sea to Shore
    Alliance.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: 2026-11-12
  quote: Dos manatíes fueron liberados con un transmisor satelital y su seguimiento
    se lleva a cabo por investigadores del Centro de Investigaciones Marinas de la
    Universidad de La Habana
- claim: The report names a researcher of the centre as scientific coordinator of
    the manatee monitoring programme.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: 2026-11-12
  quote: 'Coordinadora Científica: MC. Anmari Alvarez Alemán. Graduada de Biología
    de la Universidad de la Habana en 2006. Master en Manejo Integrado de Zonas Costeras.
    Investigadora del Centro de Investigaciones Marinas de la Universidad de la Habana'
- claim: The scientific coordinator of the project's seagrass monitoring programme,
    who processes and analyses its data, was a lecturer at the centre.
