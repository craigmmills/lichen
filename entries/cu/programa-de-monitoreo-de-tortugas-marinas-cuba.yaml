summary: National sea turtle monitoring programme, created through a group formed
  in 2009 with a standard protocol and national database, whose project areas recorded
  8,275 nests from 2010 to early 2012.
facts:
- claim: The UNDP report says the national sea turtle conservation group was created
    in 2009 to organise a national programme, with a standard monitoring protocol
    and a national database.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: En el año 2009 se creó el Grupo Nacional de Conservación de Tortugas Marinas
    para la organización de un Programa Nacional.
- claim: The report says a standard monitoring protocol and a national database were
    set up.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Un paso decisivo fue el establecimiento de un protocolo estándar para el
    monitoreo que puede adaptarse a las condiciones específicas de cada área ; y la
    creación de una base de datos nacional.
- claim: The UNDP report describes monitoring by 52 people in marine protected areas,
    supported by eight specialists from CIP, CIM and ENPFF and one from WWF, with
    data sent to the national group's coordination for annual reports.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: El monitoreo se lleva a cabo por 52 personas que trabajan en las áreas marinas
    protegidas, con el apoyo de 8 especialistas de los centros nacionales CIP, CIM,
    ENPFF y uno de W WF.
- claim: From 2010 to early 2012 the project areas recorded 8,275 nests.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/8.-Reporte-Programa-de-Monitoreo-Tortugas-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Se han registrado para las áreas del proyecto desde 2010 hasta inicios del
    2012 8 275 anidaciones
