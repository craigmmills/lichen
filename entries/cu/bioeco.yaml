summary: Cuban budgeted unit under CITMA, based in Santiago de Cuba, reportedly involved
  in monthly bird banding for twelve years by May 2023 and responsible for areas with
  mangrove monitoring.
facts:
- claim: A Cuban legal resolution, held in FAOLEX, concerns the budgeted unit named
    Centro Oriental de Ecosistemas y Biodiversidad, abbreviated BIOECO.
  url: https://faolex.fao.org/docs/pdf/cub82835.pdf
  fetched: '2026-11-12'
  quote: Unidad Presupuestada denominada Centro Oriental de Eco
- claim: The same document places it under the Ministry of Science, Technology and
    Environment.
  url: https://faolex.fao.org/docs/pdf/cub82835.pdf
  fetched: '2026-11-12'
  quote: Biodiversidad, subordinada al Ministerio de Ciencia, Tecno
- claim: The same document says it has its seat in the province of Santiago de Cuba.
  url: https://faolex.fao.org/docs/pdf/cub82835.pdf
  fetched: '2026-11-12'
  quote: Biodiversidad, con sede en la provincia de Santiago de Cu
- claim: BirdsCaribbean (May 2023) says BIOECO researchers and protected-area staff
    had run monthly banding sessions at the reserve for twelve years.
  url: https://www.birdscaribbean.org/2023/05/a-cuban-banding-workshop-caps-off-a-great-year-for-the-caribbean-bird-banding-network/
  fetched: '2026-11-12'
  quote: For twelve years, researchers of BIOECO and the staff of the protected area
    (some of whom have banding training and certification from Germany) have conducted
    monthly banding sessions at the reserve.
- claim: OnCuba (12 October 2018) named Luz Margarita Figueredo as BIOECO director
    and CBC coordinator for Cuba, reporting planned use of bird-count data from Gran
    Piedra and Siboney.
  url: https://oncubanews.com/?p=195066
  fetched: '2026-11-12'
  quote: explicó Figueredo, que es directora del Centro Oriental de Ecosistemas y
    Biodiversidad (Bioeco).
- claim: A UNDP report on the southern archipelagos mangrove monitoring programme
    says mangrove monitoring was established in the protected areas BIOECO looks after.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: En las AP, que son atendidas por el Centro Oriental de Ecosistemas y Biodiversidad
    (BIOECO), ya se estableció el monitoreo de manglar.
