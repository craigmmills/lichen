summary: Cuban environmental research centre attached to CITMA, reported in April
  2025 to be assessing seagrass meadows periodically, with 15 new stations added on
  Camagüey's north coast, and a partner in mangrove monitoring.
facts:
- claim: Prensa Latina (17 April 2025) says CIMAC, attached to CITMA, has a multidisciplinary
    team making periodic assessments of seagrass meadows.
  url: https://www.prensa-latina.cu/2025/04/17/cuba-lidera-monitoreo-de-pastos-marinos-en-el-caribe/
  fetched: '2026-11-12'
  quote: El Centro de Investigaciones del Medioambiente de Camagüey (Cimac), adscrito
    al Ministerio de Ciencia, Tecnología y Medioambiente (Citma), ha desplegado un
    equipo multidisciplinario que realiza evaluaciones periódicas del estado de estas
    praderas submarinas.
- claim: The project coordinator said the monitoring network had been extended to
    15 new research stations along Camagüey's north coast in the previous six months.
  url: https://www.prensa-latina.cu/2025/04/17/cuba-lidera-monitoreo-de-pastos-marinos-en-el-caribe/
  fetched: '2026-11-12'
  quote: «En los últimos seis meses hemos ampliado la red de monitoreo a 15 nuevas
    estaciones de investigación a lo largo de la costa norte camagüeyana», reveló
    el Dr. Carlos Martínez, coordinador del proyecto.
- claim: A UNDP report on the southern archipelagos mangrove monitoring programme
    says plots in areas monitored by CIEC and CIMAC specialists were surveyed in 2012,
    and lists CIMAC as responsible for Refugio de Fauna Macurije-Santa María.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: y del Centro de Investigaciones Medioambientales de Cam agüey (CIMAC) las
    parcelas fueron levantadas en el 2012.
