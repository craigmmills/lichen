summary: A project funded by a 2023 Betty Petersen Conservation Fund grant to Yaro Rodríguez
  and Nils Navarro, giving binoculars and training to community leaders to share bird data
  through eBird Caribbean.
facts:
- claim: In 2023 Yaro Rodríguez and Nils Navarro were awarded a Betty Petersen Conservation
    Fund grant to grow bird watching in Cuba and promote conservation based on citizen science.
  url: https://www.birdscaribbean.org/2024/03/cubas-avifauna-conservation-movement-soars-to-new-heights/
  fetched: 2026-11-09
  quote: were awarded a Betty Petersen Conservation Fund grant to grow the nascent bird watching
    movement in Cuba as a way to improve the knowledge of Cuban avifauna and promote conservation
    efforts based on citizen science.
- claim: A March 2024 BirdsCaribbean post says the project involved providing binoculars and
    training to community and group leaders so they would monitor birds and share data through
    eBird Caribbean.
  url: https://www.birdscaribbean.org/2024/03/cubas-avifauna-conservation-movement-soars-to-new-heights/
  fetched: 2026-11-09
  quote: Their project involved providing binoculars and training to community and group leaders
    so that they would engage in bird monitoring and share the data through eBird Caribbean.
- claim: The project held a National Bird Identification Workshop whose objectives included
    participants acting as eBird ambassadors.
  url: https://www.birdscaribbean.org/2024/03/cubas-avifauna-conservation-movement-soars-to-new-heights/
  fetched: 2026-11-09
  quote: to act as eBird ambassadors by sharing everything we have learnt about using and
    contributing to the platform as citizen scientists
- claim: A January 2025 BirdsCaribbean post says the project continues to grow, with birdwatching
    clubs across Cuba taking part in ongoing bird monitoring.
  url: https://www.birdscaribbean.org/2025/01/cuban-birdwatchers-soar-in-october-birds-science-and-the-spirit-of-community/
  fetched: 2026-11-09
  quote: Yaro and Nils' project continues to grow, with birdwatching clubs across the country
    now actively engaging in ongoing bird monitoring and conservation efforts.
