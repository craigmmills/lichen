summary: A bird banding station in the Siboney Juticí Ecological Reserve, described by BirdsCaribbean
  in May 2023 as Cuba's longest running, which hosted part of Cuba's first banding workshop
  in 2022.
facts:
- claim: In May 2023 BirdsCaribbean described it as Cuba’s longest running banding station,
    in the Siboney Juticí Ecological Reserve, named after Juan Cristóbal Gundlach.
  url: https://www.birdscaribbean.org/2023/05/a-cuban-banding-workshop-caps-off-a-great-year-for-the-caribbean-bird-banding-network/
  fetched: 2026-11-09
  quote: 'It was a perfect location for the longest running banding station in Cuba, named
    after the German scientist that was a pioneer of Cuban ornithology: Juan Cristóbal Gundlach.'
- claim: A May 2023 BirdsCaribbean report says BIOECO researchers and protected-area staff
    had conducted monthly banding sessions at the reserve for twelve years.
  url: https://www.birdscaribbean.org/2023/05/a-cuban-banding-workshop-caps-off-a-great-year-for-the-caribbean-bird-banding-network/
  fetched: 2026-11-09
  quote: For twelve years, researchers of BIOECO and the staff of the protected area (some
    of whom have banding training and certification from Germany) have conducted monthly banding
    sessions at the reserve.
- claim: The station hosted the first part of Cuba's first bird banding workshop in November
    2022, held by the Caribbean Biological Corridor with BirdsCaribbean.
  url: https://www.birdscaribbean.org/2023/05/a-cuban-banding-workshop-caps-off-a-great-year-for-the-caribbean-bird-banding-network/
  fetched: 2026-11-09
  quote: the Caribbean Biological Corridor (CBC) partnered with BirdsCaribbean to host the
    first ever Banding Workshop in Cuba
