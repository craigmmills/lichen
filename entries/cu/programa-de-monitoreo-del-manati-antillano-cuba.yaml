summary: Manatee monitoring programme that, per the UNDP report, had reached five
  of seven selected protected areas, recorded 14 manatee mortality events in 2011
  and 2012, and released two satellite-tagged manatees in 2012.
facts:
- claim: The UNDP report says the manatee monitoring programme was planned at the
    start of the southern archipelagos project for six areas including seven protected
    areas.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: '2026-11-15'
  quote: El programa de monitoreo de manatí se planificó en los inicios del proyecto
- claim: The report says the programme had reached five of the seven selected protected
    areas, with one to three expedition visits per year to each monitored area in
    2011 and 2012.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: '2026-11-15'
  quote: Se han realizado entre 2011 y 2012 expediciones con una frecuencia de entre
    1 y 3 visitas en el año
- claim: The report records 14 manatee mortality events in 2011 and 2012.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: '2026-11-15'
  quote: Fueron registrados 14 eventos de mortalidad de manatí entre los años 2011
    y 2012.
- claim: In its account of 2012 results, the report says two manatees were released
    with a satellite transmitter and were being tracked by CIM-UH researchers and
    Sea to Shore Alliance specialists.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: '2026-11-15'
  quote: Dos manatíes fueron liberados con un transmisor satelital
- claim: The report names Anmari Alvarez Alemán (CIM-UH) as scientific coordinator
    and Yanet Forneiro Martín-Viaña (ENPFF) as executive coordinator.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/30a2392f82dcde325741832c314bb3a4c737e08b23e6d07f7f2d82bee235fa80.pdf
  fetched: '2026-11-15'
  quote: 'Coordinadora Científica: MC. Anmari Alvarez Alemán.'
