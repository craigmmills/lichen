summary: A Cuban hydrographic and geodetic service created by a 1997 decree law, which in a UN congress
  presentation described full national topographic mapping coverage and a land cover map of Cuba.
facts:
- claim: A presentation by the service to the second UN World Geospatial Information Congress says a 1997
    decree law created it.
  url: https://ggim.un.org/2unwgic/documents/Rebeca%20Parada.pdf
  fetched: 2026-11-09
  quote: Decree Law 179 October/1997 creates the Hydrographic and Geodetic Service of the Republic of
    Cuba.
- claim: The presentation names the national office of hydrography and geodesy and the GEOCUBA business
    group as parts of the service.
  url: https://ggim.un.org/2unwgic/documents/Rebeca%20Parada.pdf
  fetched: 2026-11-09
  quote: NATIONAL OFFICE OF HYDROGRAPHY AND GEODESY BUSINESS GROUP GEOCUBA
- claim: The presentation describes topographic mapping as a form of geospatial information management,
    with full national coverage at several scales.
  url: https://ggim.un.org/2unwgic/documents/Rebeca%20Parada.pdf
  fetched: 2026-11-09
  quote: Topographic Mapping as a form of Geospatial Information Management
- claim: The presentation lists a land cover map of Cuba under a Caribbean project.
  url: https://ggim.un.org/2unwgic/documents/Rebeca%20Parada.pdf
  fetched: 2026-11-09
  quote: Caribbean Project • Land Cover Map of the Republic of Cuba
