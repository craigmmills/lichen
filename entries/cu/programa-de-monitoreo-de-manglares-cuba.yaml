summary: A UNDP report recorded 68 permanent mangrove plots by December 2012, citing
  14 protected areas in results but 13 elsewhere, with remote sensing among its monitoring
  goals.
facts:
- claim: The report's results section says 68 permanent mangrove plots were established
    in 14 marine protected areas, although its programme description and table list
    13 areas.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Se han establecidos 68 parc elas permanentes en bosques de manglares en 14
    áreas marinas protegidas.
- claim: One of its monitoring goals is the use of remote sensing to detect mangrove
    cover.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Uso de técnicas de Sensores Remotos para la detección de áreas de manglar.
- claim: The report says data collection for the plots in each selected protected
    area was completed in December 2012.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: en las parcelas establecidas por cada AMP seleccionada, en diciembre del
    2012.
- claim: The report says the information system was updated and detailed cover maps
    of the monitored areas completed.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/5.-Reporte-Programa-de-Monitoreo-Manglar-final2-prueba.pdf
  fetched: '2026-11-12'
  quote: Además se actualizó el sistema de información de acuerdo a los campos comprometidos
    y se concluyen los mapas de cobertura a escala detalladas en las áreas monitoreadas.
