summary: Seagrass monitoring programme that, per the UNDP report, began in ten marine
  protected areas in 2011–2012 to set a baseline, using 12 fixed quadrats along 50
  m transects.
facts:
- claim: The UNDP report says a monitoring protocol was written, with field sheets
    and Excel sheets for reporting the data.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: '2026-11-15'
  quote: Se elaboró un Protocolo de Monitoreo que explica toda la metodología a seguir.
- claim: The report says the protocol evaluates seagrass indicators in 12 fixed quadrats
    along 50 m transects.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: '2026-11-15'
  quote: indicadores de los pastos marinos en 12 cuadrados fijos a lo largo de transeptos
    de 50 m.
- claim: The report says monitoring began in ten marine protected areas in 2011–2012,
    establishing a baseline; two areas had two years of sampling.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: '2026-11-15'
  quote: identificándose una línea base para continuar el mismo en el futuro
- claim: The report names Beatriz Martínez Daranas (CIM-UH) as scientific coordinator
    and Aylem Hernández Avila (CNAP) as executive coordinator.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: '2026-11-15'
  quote: 'Coordinador científico: Dra. Beatriz Martínez Daranas.'
