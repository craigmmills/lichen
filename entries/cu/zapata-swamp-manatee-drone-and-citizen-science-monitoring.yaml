facts:
- claim: The grant case study says that in 2025 the project combined systematic boat
    surveys, aerial drone surveys and citizen-science monitoring by recreational fishing
    guides.
  url: https://www.speciesconservation.org/small-grant/greater-caribbean-manatee/35985
  fetched: '2026-11-12'
  quote: In 2025, we implemented an integrated monitoring strategy combining systematic
    boat-based surveys, aerial drone (UAV) surveys, and citizen-science monitoring
    carried out by recreational fishing guides who operate daily within the Park.
- claim: Drone surveys detected nine individual manatees, including calves, in the
    Hatiguanico River and Laguna del Tesoro.
  url: https://www.speciesconservation.org/small-grant/greater-caribbean-manatee/35985
  fetched: '2026-11-12'
  quote: drone surveys proved highly effective, detecting nine individual manatees,
    including calves, in the Hatiguanico River and Laguna del Tesoro.
