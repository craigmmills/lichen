summary: Founded in 1995, the lead centre of Cuba's National System of Protected Areas reviewed 24 protected-area
  management plans in 2022.
facts:
- claim: A project report says the GEF-funded project on marine and coastal protected areas of the southern
    archipelagos was executed by the centre.
  url: https://monitoringmatters.org/wp-content/uploads/2025/10/1.-Sistema-de-Monitoreo-de-la-Biodiversidad-final-prueba.pdf
  fetched: 2026-11-09
  quote: ejecutado por el Centro Nacional de Áreas Protegidas de Cuba
- claim: A UNDP-hosted report on the seagrass monitoring programme says area technicians delivered their
    data to the centre's executive coordinator.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: 2026-11-09
  quote: la entrega de los datos de los técnicos de las áreas al coordinador ejecutivo del CNAP
- claim: Describes itself as the lead centre of the National System of Protected Areas, aimed at in situ
    biodiversity conservation, founded in 1995.
  url: https://www.snap.cu/cnap/
  fetched: 2026-11-09
  quote: El Centro Nacional de áreas protegidas (CNAP) es el centro rector del Sistema Nacional de áreas
    protegidas , dirigido a la conservación de la biodiversidad in situ y la sostenibilidad del sistema,
    fundado en el 1995
- claim: Its mission is to raise the effectiveness of management of the SNAP through science, technology
    and innovation.
  url: https://www.snap.cu/mision-y-vision/
  fetched: 2026-11-09
  quote: 'Misión : Incrementar la efectividad de la gestión en el SNAP a través del aporte de la ciencia,
    la tecnología'
- claim: In 2022 it reviewed 24 protected-area management plans for 2022 to 2026 on state commission from
    the Dirección General de Medio Ambiente.
  url: https://www.snap.cu/servicios-cientifico-tecnicos-estatales-del-cnap-en-el-2022/
  fetched: 2026-11-09
  quote: Se revisaron y dictaminaron 24 Planes de Manejo (PM) de áreas protegidas correspondientes al
    ciclo 2022-2026 por encargo estatal de la Dirección General de Medio Ambiente.
- claim: Its page on 2022 state-commissioned services lists drawing up the SNAP system plan for 2023 to
    2030.
  url: https://www.snap.cu/servicios-cientifico-tecnicos-estatales-del-cnap-en-el-2022/
  fetched: 2026-11-09
  quote: 'SCT por encargo estatal: Elaboración del Plan de Sistema 2023 – 2030 del SNAP'
- claim: Acts as executive secretary of the SNAP coordinating board, which the Dirección General de Medio
    Ambiente chairs.
  url: https://www.snap.cu/junta-coordinadora/
  fetched: 2026-11-09
  quote: CNAP. Secretario Ejecutivo
- claim: Gives its address as Calle 18 A No. 4114, Playa.
  url: https://www.snap.cu/contacto/
  fetched: 2026-11-09
  quote: 'Dirección: Calle 18 A No. 4114 e/41 y 47 . Playa. C.P. 11300'
