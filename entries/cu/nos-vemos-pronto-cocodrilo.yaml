summary: Proposed initiative, from an alliance including FANJ, ECOCIENZAP and UNDP
  Cuba, to raise funds for buying and fitting satellite tags to track the movements
  of Cuban crocodiles.
facts:
- claim: UNDP says the funds raised will make it possible to buy and fit satellite
    tags to monitor the movements of Cuban crocodiles.
  url: https://www.undp.org/es/node/535441
  fetched: '2026-11-12'
  quote: Estos fondos harán posible adquirir y colocar etiquetas satelitales para
    monitorear los desplazamientos de especímenes del cocodrilo cubano y ayudar así
    a su conservación.
- claim: UNDP says the initiative comes from an alliance of FANJ, ECOCIENZAP, the
    Cuban crocodile specialist group and UNDP Cuba.
  url: https://www.undp.org/es/node/535441
  fetched: '2026-11-12'
  quote: Esta iniciativa parte de una alianza entre la Fundación Antonio Núñez Jiménez
    de la Naturaleza y el Hombre (FANJ), la Empresa para la Conservación de la Ciénaga
    de Zapata (ECOCIENZAP), el Grupo de Especialistas en Cocodrilos de Cuba (GECC)
- claim: Prensa Latina (14 October 2025) reports that a biologist and a veterinarian
    with over 25 years of work with the Cuban crocodile will fit the satellite tags
    and lead the research and conservation work.
  url: https://www.prensa-latina.cu/2025/10/14/pnud-apoya-en-cuba-proteccion-del-cocodrilo/
  fetched: '2026-11-12'
  quote: quienes serán los responsables de colocar las etiquetas satelitales y liderar
    las acciones de investigación y conservación.
