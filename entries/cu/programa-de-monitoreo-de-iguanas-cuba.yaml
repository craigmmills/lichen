summary: Iguana monitoring programme in six protected areas on Cuba's south coast,
  begun in 2011, measuring population density per hectare twice a year, according
  to the UNDP report.
facts:
- claim: The UNDP report says the iguana monitoring programme is carried out in six
    protected areas on Cuba's south coast.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: El programa de monitoreo de iguanas se realiza en seis áreas protegidas de
    la costa sur de Cuba
- claim: The report says monitoring of the iguana populations began in 2011 in the
    selected areas.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: comenzó en el año 2011 en las áreas seleccionadas
- claim: The report says the basic indicator is population abundance, expressed as
    density of individuals per hectare, measured twice a year.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: El indicador básico que se monitorea es la abundancia de las poblaciones,
    que se expresa como densidad de
- claim: The report says an Excel sheet was made for recording the data, and that
    the scientific and executive coordinators process and analyse the data as a whole.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: También se elaboró una planilla en formato Excel para el registro de los
    datos
- claim: The report names Vicente Berovides Álvarez as scientific coordinator and
    Amnerys González Rossell as executive coordinator.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: 'Coordinadora Ejecutiva: MSc. Amnerys González Rossell.'
