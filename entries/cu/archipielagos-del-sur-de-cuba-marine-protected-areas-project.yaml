summary: A GEF-funded project, implemented by UNDP and executed by the Centro Nacional de Áreas Protegidas
  from 2010 to 2014, which its report says set up nine monitoring programmes in 26 marine protected areas.
facts:
- claim: A project report says the project ran from 2010 to 2014, funded by the GEF, implemented by UNDP
    and executed by the Centro Nacional de Áreas Protegidas.
  url: https://monitoringmatters.org/wp-content/uploads/2025/10/1.-Sistema-de-Monitoreo-de-la-Biodiversidad-final-prueba.pdf
  fetched: 2026-11-09
  quote: desde el año 2010 y hasta el 2014, un proyecto internacional financiado por el Fondo Mundial
    para el Medio Ambiente (GEF)
- claim: The report says nine monitoring programmes were implemented in 26 marine protected areas.
  url: https://monitoringmatters.org/wp-content/uploads/2025/10/1.-Sistema-de-Monitoreo-de-la-Biodiversidad-final-prueba.pdf
  fetched: 2026-11-09
  quote: Implementación de nueve Programas de Monitoreo (arrecifes coralinos, pastos marinos, manglares,
    vegetación de costa arenosa, aves acuáticas y marinas, tortugas marinas, manatí, cocodrilos e iguana)
    en 26 AMPs.
- claim: The report says the project's monitoring system was to be the starting point of the biodiversity
    monitoring system for the national protected-area system in the 2014 to 2020 plan.
  url: https://monitoringmatters.org/wp-content/uploads/2025/10/1.-Sistema-de-Monitoreo-de-la-Biodiversidad-final-prueba.pdf
  fetched: 2026-11-09
  quote: constituye la base y punto de partida del Sistema de Monitoreo de la Biodiversidad del SNAP
- claim: The seagrass monitoring programme began in ten marine protected areas.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/4.-Reporte-Programa-de-Monitoreo-Pastos-final2.pdf
  fetched: 2026-11-09
  quote: Inicio d el monitoreo en diez AMPs
