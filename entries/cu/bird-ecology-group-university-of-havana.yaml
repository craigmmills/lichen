summary: A bird research group at the University of Havana, led by Dr. Martin Acosta Cruz
  in 2021, which BirdsCaribbean reported had surveyed Piping Plover wintering coastline yearly
  since 2016.
facts:
- claim: In 2021 BirdsCaribbean placed the group at the University of Havana and named Dr.
    Martin Acosta Cruz as its leader.
  url: https://www.birdscaribbean.org/2021/08/oldest-birding-group-in-cuba-wins-prestigious-ralph-w-schreiber-award-at-the-2021-aos-awards/
  fetched: 2026-11-09
  quote: Part of the current Bird Ecology Group at the University of Havana, Cuba.
- claim: In 2021 BirdsCaribbean reported that, since 2016, the group had surveyed between
    68 and 180 km of coastline each year to assess wintering Piping Plovers in the Cuban archipelago.
  url: https://www.birdscaribbean.org/2021/08/oldest-birding-group-in-cuba-wins-prestigious-ralph-w-schreiber-award-at-the-2021-aos-awards/
  fetched: 2026-11-09
  quote: Since 2016, the BEG has annually surveyed between 68 to 180 km of coastline to assess
    the conservation status of wintering Piping Plovers frequenting the Cuban archipelago
- claim: The group has carried out Caribbean Waterbird Census counts at Cuban wetlands over
    several years.
  url: https://www.birdscaribbean.org/2021/08/oldest-birding-group-in-cuba-wins-prestigious-ralph-w-schreiber-award-at-the-2021-aos-awards/
  fetched: 2026-11-09
  quote: The group has also carried out years of vital Caribbean Waterbird Census counts at
    Cuba's many important wetlands to learn more about numbers and trends of resident and
    migratory waterbirds and shorebirds.
- claim: Received the American Ornithological Society's Ralph W. Schreiber Conservation Award
    in 2021.
  url: https://www.birdscaribbean.org/2021/08/oldest-birding-group-in-cuba-wins-prestigious-ralph-w-schreiber-award-at-the-2021-aos-awards/
  fetched: 2026-11-09
  quote: The group has received the American Ornithological Society's (AOS) Ralph W. Schreiber
    Conservation Award.
