summary: Protected area in Ciego de Ávila and Camagüey with two people responsible
  for iguana monitoring; the UNDP report says 2011 and 2012 results there and at Cayos
  de Ana María show stable metapopulations.
facts:
- claim: The UNDP iguana report lists two people responsible for the iguana monitoring
    programme at the park, in Ciego de Ávila and Camagüey.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: 4 PN Jardines de la Reina Ciego de Ávila- Camagüey
- claim: The report says the administration of each area designated a technician or
    specialist who was then trained in the iguana monitoring method.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
  fetched: '2026-11-15'
  quote: La administración de cada área designó un técnico o especialista relacionado
    con el tema de monitoreo de fauna o reptiles en general
- claim: The report says results for 2011 and 2012 at Jardines de la Reina and Cayos
    de Ana María show stable metapopulations.
  url: https://www.undp.org/sites/g/files/zskgke326/files/migration/cu/11.-Reporte-Programa-de-Monitoreo-de-iguana--final3-prueba.pdf
