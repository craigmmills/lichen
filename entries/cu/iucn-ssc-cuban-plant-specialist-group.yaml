summary: A regional IUCN Species Survival Commission group with 63 members and collaborators, producing
  Cuban plant Red List assessments since 1998 and publishing checklists and occurrence data through GBIF.
facts:
- claim: Describes itself as a regional group of the IUCN Species Survival Commission and one of the main
    authorities on the conservation of Cuban plants.
  url: https://cubanplantsiucn.planta.ngo/
  fetched: 2026-11-09
  quote: Como grupo regional de la CSE/UICN somos una de las principales autoridades en conservación de
    las plantas de Cuba.
- claim: One of its objectives is to assess, monitor and publicise the conservation status of the Cuban
    flora.
  url: https://cubanplantsiucn.planta.ngo/inicio/
  fetched: 2026-11-09
  quote: Evaluar, monitorear y difundir la situación de conservación de la flora cubana
- claim: Has 63 members and collaborators, most of them Cuban, from five universities, 16 research centres
    and two government agencies.
  url: https://cubanplantsiucn.planta.ngo/inicio/
  fetched: 2026-11-09
  quote: El grupo está integrado en la actualidad por 63 miembros y colaboradores, la mayoría cubanos,
    de cinco universidades, 16 centros de investigación y dos agencias gubernamentales.
- claim: Its GBIF publisher record says it compiles information on Cuban plants and conducts Red List
    assessments.
  url: https://api.gbif.org/v1/organization?country=CU&limit=100
  fetched: 2026-11-09
  quote: We are compiling information about plants in Cuba, conducting Red List assessments and promoting
    and supporting conservation initiatives for more than 20 years.
- claim: Its GBIF registration says it intends to publish occurrences and checklists of Cuban plants for
    conservation planning and policy.
  url: https://api.gbif.org/v1/organization?country=CU&limit=100
  fetched: 2026-11-09
  quote: We intend to publish through GBIF occurrences and also checklists improving Cuban plant data
    accessibility for conservation planning, policymaking and decision-making.
- claim: Its lines of work include digitising occurrence data for the species it assesses, through GBIF,
    and documenting plant invasions in Cuba.
  url: https://cubanplantsiucn.planta.ngo/acciones/
  fetched: 2026-11-09
  quote: Digitalización de datos de ocurrencia e información relevante al manejo de las especies evaluadas
    por el GEPC
- claim: Has its central node at Planta! - Plantlife Conservation Society and at the Jardín Botánico Nacional
    of the University of Havana.
  url: https://cubanplantsiucn.planta.ngo/
  fetched: 2026-11-09
  quote: El Grupo de Especialistas en Plantas Cubanas (UICN/CSE) tiene nodo central en Planta! – Plantlife
    Conservation Society y en el Jardín Botánico Nacional de la Universidad de La Habana.
- claim: Has produced Red List assessments and compiled records of Cuba's native plants since 1998.
  url: https://api.gbif.org/v1/organization/5424f6ba-ea53-490e-99d7-3ee6cdef1a9e/publishedDataset
  fetched: 2026-11-09
  quote: The IUCN/SSC Cuban Plant Specialist Group (CubanPSG) has been producing ed list assessments and
    compiling records of native plants of Cuba since 1998.
- claim: Publishes a checklist of assessed Cuban native plants with IUCN category, assessment rationale
    and the protected areas where they occur.
  url: https://api.gbif.org/v1/organization/5424f6ba-ea53-490e-99d7-3ee6cdef1a9e/publishedDataset
  fetched: 2026-11-09
  quote: This resource presents an updated checklist of Cuban native plants assessed, with relevant conservation
    information like IUCN category, conservation assessment rationale and protected areas where occur.
- claim: Publishes a checklist of invasive alien plants in Cuba based on data gathered from 2017 to 2022.
  url: https://api.gbif.org/v1/organization/5424f6ba-ea53-490e-99d7-3ee6cdef1a9e/publishedDataset
  fetched: 2026-11-09
  quote: This resource presents an updated checklist of invasive alien plants in Cuba based on data gathered
    during 2017-2022
- claim: Publishes occurrence data on the distribution of invasive plants across the Cuban archipelago.
  url: https://api.gbif.org/v1/organization/5424f6ba-ea53-490e-99d7-3ee6cdef1a9e/publishedDataset
  fetched: 2026-11-09
  quote: In this resource, the distribution of invasive plants in Cuba is addressed, based on these species
    occurrence recorded in the Cuban archipelago.
- claim: Gives its Cuban address care of the Jardín Botánico Nacional, Carretera El Rocío, Calabazar,
    Boyeros, La Habana.
  url: https://cubanplantsiucn.planta.ngo/
  fetched: 2026-11-09
  quote: c/o Jardín Botánico Nacional Carretera El Rocío Km 3.5, Calabazar, Boyeros, La Habana, CP 19230
