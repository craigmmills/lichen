summary: A body established in 1992 by Republic Act 7611 to govern the Strategic Environmental
  Plan for Palawan, which under a February 2026 agreement is to receive land use,
  land cover and benthic maps from PhilSA.
facts:
- claim: Established in 1992 by Republic Act 7611, the Strategic Environmental Plan
    for Palawan Act.
  url: https://pcsd.gov.ph/about-pcsds/
  fetched: 2026-11-12
  quote: The Palawan Council for Sustainable Development was established in 1992 by
    Republic Act 7611, also known as the Strategic Environmental Plan (SEP) for Palawan
    Act.
- claim: Implements the Environmentally Critical Areas Network, a ridge-to-reef system
    of graded protection across Palawan.
  url: https://pcsd.gov.ph/about-pcsds/
  fetched: 2026-11-12
  quote: The PCSD facilitates sustainable development in Palawan through implementing
    the Environmentally Critical Areas Network (ECAN), which is the key strategy of
    the SEP Law.
- claim: Charged by law with the governance, implementation and policy direction of
    the SEP Law for the Province of Palawan.
  url: https://pkp.pcsd.gov.ph/about-us/
  fetched: 2026-11-12
  quote: which under the law is charged with the governance, implementationand policy
    direction of the SEP Law (RA 7611 of 1992) covering the Province of Palawan
- claim: Gives its head office as the PCSD Building, Puerto Princesa City, Palawan.
  url: https://pkp.pcsd.gov.ph/about-us/
  fetched: 2026-11-12
  quote: PCSD Building Sports Complex Road Sta.Monica Heights, Puerto Princesa City
    Palawan
- claim: Under a February 2026 agreement, PhilSA will generate land use, land cover
    and benthic maps for PCSD, which will help validate them with ground data.
