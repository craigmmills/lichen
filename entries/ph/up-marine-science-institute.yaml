- claim: A constituent institute of the University of the Philippines College of Science,
    studying marine ecosystems from Diliman and the Bolinao Marine Laboratory.
  url: https://msi.upd.edu.ph
  fetched: 2026-11-08
  quote: A constituent institute of the University of the Philippines’ College of Science,
    the UP MSI studies marine ecosystems in its main compound in the National Science Complex
    and the Bolinao Marine Laboratory in Bolinao, Pangasinan.
- claim: Its Marine Biodiversity Resources and Information System (MBRIS) lists among its
    aims to develop a marine biodiversity data analytics platform.
  url: https://msi.upd.edu.ph/facilities/mbris/
  fetched: 2026-11-08
  quote: Develop a marine biodiversity data analytics platform
- claim: MBRIS lists biodiversity informatics as a research theme, through ocean-to-cloud
    data pipelines and analytics.
  url: https://msi.upd.edu.ph/facilities/mbris/
  fetched: 2026-11-08
  quote: Bridging marine biodiversity information with resources management and decision-making
    through ocean-to-cloud data pipelines and analytics.
- claim: Its Ocean Color and Coastal Oceanography Laboratory works through quantitative modelling,
    remote sensing and GIS.
  url: https://msi.upd.edu.ph/research/laboratory/ocean-color-and-coastal-oceanography-laboratory/
  fetched: 2026-11-08
  quote: explores the interactions between ocean physics, climate change, and coastal ecosystems
    primarily through quantitative modelling, remote sensing, and GIS techniques
