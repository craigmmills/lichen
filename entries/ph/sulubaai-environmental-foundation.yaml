summary: Philippine non-profit created in 2012, working around Pangatalan, monitoring marine
  protected areas and restoration sites with eDNA, developing Project CORaiL, with partner
  Chorus planning acoustic monitoring.
facts:
- claim: A 2020 press release describes it as a Philippine-based non-profit created in 2012,
    working mainly around Pangatalan Island in Palawan.
  url: https://www.nasdaq.com/press-release/accenture-intel-and-sulubaai-environmental-foundation-use-artificial-intelligence-to
  fetched: 2026-11-08
  quote: Created in 2012, Sulubaaï Environmental Foundation (SEF) is a Philippine-based non-profit
    organization dedicated to conserve, protect, and restore the natural resources of Palawan
- claim: Its team runs monitoring in and around marine protected areas, counting fish and
    invertebrates and assessing coral cover.
  url: https://sulubaai-foundation.com/scientific-research/
  fetched: 2026-11-08
  quote: The Sulubaaï team set up monitoring in and around marine protected areas to assess
    the effect of protection.
- claim: Its marine biologists monitor the marine ecosystems and restoration sites.
  url: https://sulubaai-foundation.com/scientific-research/
  fetched: 2026-11-08
  quote: The marine biologists of Sulubaaï also implement the steady scientific monitoring
    on the marine ecosystems and the restoration sites.
- claim: Its research page describes passive acoustic monitoring of reefs by its partner the
    Chorus Research Institute under the Sea Academy project.
  url: https://sulubaai-foundation.com/scientific-research/
  fetched: 2026-11-08
  quote: Our partner, the Chorus Research Institute, has mastered and developed this technique,
    and as part of the Sea Academy project, Chorus will monitor several sites in Shark Fin
    Bay
- claim: Its research page describes environmental DNA sampling as one of its monitoring methods.
  url: https://sulubaai-foundation.com/scientific-research/
  fetched: 2026-11-08
  quote: This method helps to identify the presence of non-visible species
- claim: Says Chris and Fred Tardieu settled on Pangatalan Island in 2011 and founded Sulubaaï
    with Filipinos.
  url: https://sulubaai-foundation.com/
  fetched: 2026-11-08
  quote: left everything behind to settle on the island of Pangatalan in 2011 and founded
    Sulubaaï in the process with Filipinos
