facts:
- claim: Continued its post-spill environmental monitoring with a field survey at
    Capiñahan Marine Sanctuary on 13 April 2026.
  url: https://su.edu.ph/news/su-leads-continuing-post-spill-marine-assessment-in-north-bais-bay/
  fetched: 2026-11-15
  quote: continued its post-spill environmental monitoring efforts with a field survey
    at the Capiñahan Marine Sanctuary on April 13, 2026
- claim: Used manta tow methods for a broad-scale assessment of the sanctuary's coral
    reef.
  url: https://su.edu.ph/news/su-leads-continuing-post-spill-marine-assessment-in-north-bais-bay/
  fetched: 2026-11-15
  quote: Preliminary findings from the broad-scale assessment using manta tow methods
    indicate that the coral reef remains generally healthy and intact.
- claim: Its mission includes basic research on shallow coastal ecosystems such as
    coral reefs, seagrass beds and mangrove forests.
  url: https://su.edu.ph/schools-colleges/institute-of-environmental-and-marine-sciences/
  fetched: 2026-11-15
  quote: Undertake basic research in coastal, marine and environmental sciences with
    emphasis on the shallow coastal ecosystems, such as coral reefs, seagrass beds,
    mangrove forests, and soft-bottom communities;
