summary: A marine protection effort at Apo Reef in which Global Conservation says it supports enforcement
  with M2 radar detecting vessels of 7 metres or more to 9.5 nautical miles, plus Skylight and EarthRanger.
facts:
- claim: Global Conservation says it supports marine protection at Apo Reef with Marine Monitor (M2) radar,
    fast boats, rapid response teams and Skylight and EarthRanger.
  url: https://globalconservation.org/projects/apo-reef-philippines
  fetched: 2026-11-08
  quote: Global Conservation is supporting Marine Protection for Apo Reef National Marine Park in the
    Philippines, including Marine Monitor (M2) radar, fast boats and motors, Rapid Response Teams, and
    deployment of Skylight and EarthRanger marine protection systems.
- claim: The page says an M2 radar on Apo Island detects vessels of 7 metres or more out to 9.5 nautical
    miles, combined with AIS, VMS and satellite.
  url: https://globalconservation.org/projects/apo-reef-philippines
  fetched: 2026-11-08
  quote: An M2 radar on a 15-meter tower, above the island tree line, detects vessels of 7 meters or more
    out to 9.5 nautical miles
- claim: The page says the enforcement plan was prepared jointly by DENR, the Sablayan local government
    and Blue Alliance.
  url: https://globalconservation.org/projects/apo-reef-philippines
  fetched: 2026-11-08
  quote: The system was redesigned in March 2026 and is set out in the park's current enforcement plan,
    prepared jointly by DENR, the Sablayan local government and Blue Alliance.
