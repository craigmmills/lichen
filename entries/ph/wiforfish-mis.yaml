summary: Operational prototype management information system for local patrollers and data managers in
  Tayabas, Pagbilao and Sariaya, combining SMART and CyberTracker, pilot tested in 2017.
facts:
- claim: Developed as an operational prototype for local patrollers and data managers in Tayabas, Pagbilao
    and Sariaya.
  url: https://conservation-innovations.org/project/wiforfish/
  fetched: 2026-11-08
  quote: Center for Conservation Innovation PH Inc. (CCIPH) together with Tanggol Kalikasan (TK), Dalubhasaan
    ng Lungsod ng Lucena (DLL) and Southern Luzon State University (SLSU) developed the operational prototype
- claim: Combines SMART for database management and CyberTracker for data collection.
  url: https://conservation-innovations.org/project/wiforfish/
  fetched: 2026-11-08
  quote: utilizing the combination of Spatial Management and Reporting Tool (SMART) for database management,
    and the CyberTracker application for data collection
- claim: Pilot tested with patrollers and data managers in 2017.
  url: https://conservation-innovations.org/project/wiforfish/
  fetched: 2026-11-08
  quote: In 2017, Tanggol Kalikasan Inc. together with Center for Conservation Innovations Philippines
    conducted a three-day Pilot Testing and Simulation of WiForFISH-MIS
