summary: A boat-towable underwater video platform with software that stitches footage
  into geotagged coral reef records, described as covering up to 33 km of coastline
  a day without divers.
facts:
- claim: Provides a fast, diverless method of coastal survey and mapping that creates
    permanent visual records of the marine environment.
  url: https://tapitechtransfer.dost.gov.ph/technologies/it-development/automated-rapid-reef-assessment-system-arras
  fetched: 2026-11-12
  quote: The Automated Rapid Reef Assessment System (ARRAS) provides a fast and diverless
    method of coastal survey and mapping services for creating permanent visual records
    of the marine environment.
- claim: Combines a boat-towable underwater video platform with software that stitches
    video into geotagged records of coral reefs, at up to 33 km of coastline a day.
  url: https://tapitechtransfer.dost.gov.ph/technologies/it-development/automated-rapid-reef-assessment-system-arras
  fetched: 2026-11-12
  quote: Kiko&Stitch is a software developed for automatic video stitching to create
    geotagged visual records of coral reefs. With this system, a stitched underwater
    imagery map can be generated at a rate of 33km of coastline per day.
- claim: The DOST page names Maricor N. Soriano of the University of the Philippines
    Diliman with the technology and DOST-PCIEERD as the contact for inquiries.
  url: https://tapitechtransfer.dost.gov.ph/technologies/it-development/automated-rapid-reef-assessment-system-arras
  fetched: 2026-11-12
  quote: 'Dr. Maricor N. Soriano University of the Philippines Diliman For inquiries,
    please contact: DOST-PCIEERD'
