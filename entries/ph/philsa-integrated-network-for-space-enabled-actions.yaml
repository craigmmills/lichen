    and individuals working toward sustainability using space data.
  url: https://philsa.gov.ph/news/space-data-to-support-environmental-protection-for-palawan-and-tubbataha-under-new-philsa-agreements/
  fetched: 2026-11-12
  quote: Launched in October 2022, PINAS is an active network of Local Government
