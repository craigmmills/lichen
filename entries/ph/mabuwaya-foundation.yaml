  fetched: 2026-11-15
  quote: 'Organization Legal Name: Mabuwaya Foundation Inc.'
- claim: The ASAP Species Conservation Fund project page lists five Philippine crocodile
    population monitoring surveys under the project, which started in 2021.
  url: https://www.speciesonthebrink.org/articles-stories/projects/mabuwaya-foundation-northeast-luzon
  fetched: 2026-11-15
  quote: Five Philippine Crocodile population monitoring surveys have been conducted
    and ten nests have been found
- claim: The same page lists two Isabela Oriole surveys, in 2021 and 2022.
  url: https://www.speciesonthebrink.org/articles-stories/projects/mabuwaya-foundation-northeast-luzon
  fetched: 2026-11-15
  quote: Two Isabela Oriole surveys have been conducted with a count of 30 individuals
    in 2021 and 37 individuals in 2022.
