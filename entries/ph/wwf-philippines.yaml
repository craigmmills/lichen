summary: A national organisation of the WWF network since 1997, which runs the Donsol
  whale shark survey, identified 58 individual whale sharks in 2021, and helped operate
  a tourist citizen science effort.
facts:
- claim: The Palawan Knowledge Platform says WWF-Philippines has worked as a national
    organisation of the WWF network since 1997.
  url: https://pkp.pcsd.gov.ph/about-us/
  fetched: 2026-11-12
  quote: WWF-Philippines, the 26 th organization in the network, has been working
    as a national organization of the WWF network since 1997.
- claim: Identified 58 individual whale sharks in its 2021 annual population survey
    off Donsol.
  url: https://support.wwf.org.ph/resource-center/story-archives-2021/2021-whale-shark-survey/
  fetched: 2026-11-12
  quote: The World Wide Fund for Nature (WWF) Philippines identified 58 individual
    whale sharks during the organizations’ 2021 population survey, held annually off
    the coast of Donsol.
- claim: The 2021 survey account said WWF-Philippines helped operate a citizen science
    effort in which tourists documented whale sharks, building a database of individuals.
  url: https://support.wwf.org.ph/resource-center/story-archives-2021/2021-whale-shark-survey/
  fetched: 2026-11-12
  quote: The conservation organization also helps operate a citizen science effort
    to keep track of whale sharks passing through the protected seascape.
