summary: Laboratory run by the University of the Philippines Diliman that monitors
  Philippine marine mammal and megafauna populations using distance sampling, photo-identification
  and visual and acoustic surveys.
facts:
- claim: Conducts assessment and monitoring of marine mammal and other megafauna populations
    in the Philippines.
  url: https://iesm.science.upd.edu.ph/marine-mammal-research-and-conservation-laboratory/
  fetched: 2026-11-13
  quote: MMRCL conducts assessment and monitoring of marine mammal & other megafauna
    (i.e. sharks, rays and sea turtles) populations in the Philippines.
- claim: Uses distance sampling and photo-identification to describe distribution
    and estimate population density.
  url: https://iesm.science.upd.edu.ph/marine-mammal-research-and-conservation-laboratory/
  fetched: 2026-11-13
  quote: Distance sampling and photo-identification techniques for marine mammals
    are used to describe distribution and estimate population density and relative
    abundance.
- claim: Lists a project assessing and monitoring Philippine marine mammals with visual
    and acoustic surveys.
  url: https://iesm.science.upd.edu.ph/marine-mammal-research-and-conservation-laboratory/
  fetched: 2026-11-13
  quote: Assessment and monitoring of Philippine marine mammals combining visual and
    acoustic surveys (PHLMarMams2)
- claim: Conducted the yearly Simultaneous Dugong Monitoring on Calawit Island, Busuanga,
    with C3-Philippines in June 2022, with 68 local volunteers as observers.
  url: https://iesm.science.upd.edu.ph/marine-mammal-research-and-conservation-laboratory/
  fetched: 2026-11-13
  quote: together with C3-Philippines conducted its yearly Simultaneous Dugong Monitoring
