summary: A DENR-funded effort under a February 2023 PhilSA agreement that planned
  a geospatial database of natural resources, with forest monitoring using remote
  sensing, machine learning and AI, and annual mangrove extent maps.
facts:
- claim: In February 2023, PhilSA and DENR signed an agreement to jointly create a
    geospatial database of the country’s natural resources and monitor the National
    Greening Program with spaceborne data.
  url: https://philsa.gov.ph/news/philsa-denr-to-use-space-data-to-create-natural-resources-database-monitor-natl-reforestation-program/
  fetched: 2026-11-12
  quote: signed a Memorandum of Agreement (MOA) to jointly implement a project that
    will create a geospatial database of the country’s natural resources, and monitor
    the National Greening Program through the use of spaceborne data
- claim: The February 2023 agreement planned for PhilSA to generate monthly vegetation
    indices or maps, develop forest disturbance detection and forest cover classification,
    and help DENR monitor forests with remote sensing, machine learning and AI.
  url: https://philsa.gov.ph/news/philsa-denr-to-use-space-data-to-create-natural-resources-database-monitor-natl-reforestation-program/
  fetched: 2026-11-12
  quote: PhilSA will also assist to enhance the capability of DENR in monitoring NGP
    areas and other forests using satellite remote sensing, machine learning, artificial
    intelligence, and geographic information systems.
- claim: For natural resource accounting, the February 2023 agreement planned for
    PhilSA to develop methods to produce annual mangrove extent maps.
  url: https://philsa.gov.ph/news/philsa-denr-to-use-space-data-to-create-natural-resources-database-monitor-natl-reforestation-program/
  fetched: 2026-11-12
  quote: For the NRAP, PhilSA will develop methodologies to produce annual mangrove
    extent maps and air quality maps.
