- claim: Its research programme includes habitat and species research and regular
    biodiversity monitoring.
  url: https://www.mbcfi.org.ph/programs-and-initiatives/
  fetched: 2026-11-15
  quote: This program involves project site profiling, habitat and/or species-focused
    research, studies on ecological services and functions and regular biodiversity
    monitoring.
- claim: Its page names the core monitoring zone within Mts Iglit-Baco Natural Park
    as one landscape in the joint tamaraw conservation initiative for 2024–2029.
  url: https://www.mbcfi.org.ph/programs-and-initiatives/
  fetched: 2026-11-15
  quote: 'Tamaraw landscape 1 : The core zone of the monitoring within Mts Iglit-Baco
    Natural Park- Taobuid indigenous territories.'
- claim: Records from the 1999 island-wide biological survey became the basis of the
    Mindoro Biodiversity Information System, a species database for Mindoro.
  url: https://www.mbcfi.org.ph/about/
  fetched: 2026-11-15
  quote: The records in the survey became the basis in the formulation of the Mindoro
    Biodiversity Information System, a database for species found in Mindoro, the
    first of its kind in the country.
