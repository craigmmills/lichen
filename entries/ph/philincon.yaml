summary: Organisation founded in 1995 that monitors wildlife in Northwest Panay Peninsula
  Natural Park; it says monitoring cut poached hornbill nests from 50% to 5% since
  2001.
facts:
- claim: Conducts biodiversity surveys and species monitoring in the Northwest Panay
    Peninsula Natural Park to track wildlife populations.
  url: https://www.philincon.org.ph/
  fetched: 2026-11-15
  quote: We conduct biodiversity surveys and species monitoring deep inside the forests
    of NPPNP to track wildlife populations, assess ecosystem health, and support conservation
    efforts.
- claim: Was founded in 1995, originally as the Philippine Endemic Species Conservation
    Project.
  url: https://www.philincon.org.ph/
  fetched: 2026-11-15
  quote: was founded in 1995 by Dr. Eberhard Curio. Originally the Philippine Endemic
    Species Conservation Project (PESCP), it later became PhilinCon.
- claim: Says forest and nest-hole monitoring cut the share of poached hornbill nests
    from 50% to 5% since 2001.
  url: https://philincon.org/project-overview/
  fetched: 2026-11-15
  quote: 'Success: Forest and nesthole monitoring allowed to reduce the number of
    poached hornbill nests (brood and sometimes also females killed) from 50% earlier
    to 5% since 2001.'
