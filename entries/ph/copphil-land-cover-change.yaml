- claim: Detects change with BFASTmonitor on Sentinel-1 and Sentinel-2 time series and classifies it with
    a machine learning model.
  url: https://copphil.philsa.gov.ph/land-cover-mapping-service/
  fetched: 2026-11-08
  quote: Changes are identified using the BFASTmonitor algorithm , classified through a machine-learning
    model, and refined by filtering out small or isolated detections to reduce noise in the final output.
