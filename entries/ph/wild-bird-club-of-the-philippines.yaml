facts:
- claim: Describes itself as a nationwide club of birdwatchers.
  url: https://birdwatch.ph/about-the-club/
  fetched: 2026-11-15
  quote: The Wild Bird Club of the Philippines is a nationwide club of birdwatchers
    interested in the wild birds of the Philippines and in the preservation of these
    birds.
- claim: Aims to be the main resource for birdwatchers' records in the Philippines
    in a non-profit way.
  url: https://birdwatch.ph/about-the-club/
  fetched: 2026-11-15
  quote: We are a club that will endeavor to be the primary resource for information
    and records of birdwatchers in the Philippines in a fair, non-profit way.
