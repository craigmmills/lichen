facts:
- claim: Describes itself as a nature conservation NGO.
  url: https://conservation-innovations.org/about/
  fetched: 2026-11-08
  quote: The Center for Conservation Innovations PH, Inc (CCIPH) is a nature conservation
    NGO.
- claim: Established in 2015, evolving from Fauna and Flora International Philippines.
  url: https://conservation-innovations.org/about/
  fetched: 2026-11-08
  quote: It evolved organically from the Fauna and Flora International Philippines (FFI PH)
    and continued its program of work in the Philippines as an independent NGO.
- claim: Lists machine learning tools for ecological modelling among its tools and services.
  url: https://conservation-innovations.org/our-solutions/
  fetched: 2026-11-08
  quote: Using Machine Learning Tools for Ecological Modeling
- claim: Its Biodiversity Solutions Team collects field data on wildlife and habitat at project
    sites and is trained in species distribution modelling.
  url: https://conservation-innovations.org/our-solutions/
  fetched: 2026-11-08
  quote: The team is highly trained in species distribution modeling (SDM), which is a tool
    for determining viable habitats for target species.
- claim: Its Technology Solutions Team (TechLab) deploys conservation technologies in biodiversity
    monitoring projects.
  url: https://conservation-innovations.org/our-solutions/
  fetched: 2026-11-08
  quote: Also known as the Wildlife Technology Laboratory, or TechLab, is responsible for
    deploying conservation technologies and demonstrating their use and applicability to level
    up biodiversity monitoring projects.
- claim: Gives an office address in Filinvest Corporate City, Alabang, Muntinlupa City.
