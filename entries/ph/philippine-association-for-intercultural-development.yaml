summary: Quezon City organisation reporting partnerships with over 250 Indigenous communities
  over 50 years, training communities in mapping and GIS, with a Rainforest Trust-supported
  Maragusan project spanning 2022 to 2026.
facts:
- claim: Says it has partnered with more than 250 Indigenous communities in the Philippines
    and across Asia over 50 years.
  url: https://pafid.org.ph/
  fetched: 2026-11-08
  quote: For over 50 years, PAFID has partnered with over 250 Indigenous Communities in the
    Philippines and across the Asian region to protect lands, cultures, and self-determination.
- claim: Trains communities in community mapping and GIS for ancestral domain documentation.
  url: https://pafid.org.ph/our-work/
  fetched: 2026-11-08
  quote: 'Community Mapping and GIS: Technical training for accurate ancestral domain documentation.'
- claim: In January 2026 its team and local forest guards carried out a forest resource assessment
    in Maragusan.
  url: https://pafid.org.ph/projects/maragusan-mandaya-and-mansaka-for-forest-conservation/
  fetched: 2026-11-08
  quote: the PAFID team, together with the Forest Guards of Sumpaw Nang Mangkatikadung Sang
    Maragusan and LABATA, conducted a Forest Resource Assessment
- claim: Its Maragusan project (2022 to 2026), supported by Rainforest Trust, aims to map,
    document and register the Mandaya and Mansaka ICCA with the Global ICCA Registry.
  url: https://pafid.org.ph/projects/maragusan-mandaya-and-mansaka-for-forest-conservation/
  fetched: 2026-11-08
  quote: Supported by the Rainforest Trust, this project (2022-2026) aims to map, document,
    and register the Mandaya and Mansaka ICCA with the Global ICCA Registry.
- claim: Gives an address in Quezon City.
  url: https://pafid.org.ph/
  fetched: 2026-11-08
  quote: 71 Malakas Street, Quezon City, Philippines
