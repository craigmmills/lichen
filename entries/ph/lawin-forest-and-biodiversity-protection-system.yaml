id: lawin-forest-and-biodiversity-protection-system
kind: programme
name: Lawin Forest and Biodiversity Protection System
also_known_as:
- LAWIN
scope: ph
ai_label: conservation-tech
realms:
- land
countries:
- ph
status: active
summary: Forest protection system combining planning, technology-aided patrolling and open-source data
  platforms; Chemonics reports over 3,000 patrollers monitoring over 6.2 million hectares, and it was
  built by the DENR and Chemonics.
facts:
- claim: Combines science-based forest planning, technology-aided patrolling and open-source data platforms.
  url: https://www.chemonics.com/?p=1818
  fetched: 2026-11-08
  quote: This national framework combined science-based forest planning, technology-aided patrolling,
    and open-source data platforms to enable forest officers and communities to better detect threats
    and analyze consistent, accurate data.
- claim: Chemonics says over 3,000 forest patrollers monitor over 6.2 million hectares of forest.
  url: https://www.chemonics.com/?p=1818
  fetched: 2026-11-08
  quote: over 3,000 forest patrollers – including Indigenous Peoples, women, and former combatants – are
    now responsible for monitoring over 6.2 million hectares of forests
- claim: Chemonics says Lawin was institutionalised as the national forest protection strategy and is
    one of the world's largest applications of SMART.
  url: https://www.chemonics.com/?p=1818
  fetched: 2026-11-08
  quote: The system became one of the world’s largest applications of the Spatial Monitoring and Reporting
    Tool (SMART)
- claim: CCIPH says the DENR, in partnership with USAID through the B+WISER programme, launched the LAWIN
    system.
  url: https://conservation-innovations.org/project/technical-assistance-to-the-lawin-roll-out/
  fetched: 2026-11-08
  quote: Department of Environment and Natural Resources (DENR) in partnership with United States Agency
    for International Development (USAID) through the Biodiversity and Watersheds Improved for Stronger
    Economy and Ecosystem Resilience Program launched the LAWIN
- claim: CCIPH describes it as letting communities monitor and report on a protected area through CyberTracker,
    with patrollers tracking illegal logging and poaching.
  url: https://conservation-innovations.org/project/technical-assistance-to-the-lawin-roll-out/
  fetched: 2026-11-08
  quote: Patrollers can easily track activities in the forests such as illegal logging and poaching among
    others.
