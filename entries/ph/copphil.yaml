summary: A programme launched on 24 April 2023 to strengthen use of Copernicus data in the Philippines
  through a CopPhil Centre, with services co-developed with PhilSA and partners who will continue them
  after the pilot.
facts:
- claim: Launched on 24 April 2023 to promote use of Copernicus data through a CopPhil Centre, including
    for biodiversity conservation.
  url: https://copphil.philsa.gov.ph/about/
  fetched: 2026-11-07
  quote: the Centre will support and increase the ability of the Philippines to address climate vulnerability
    and biodiversity conservation while improving hazard management and resilience
- claim: Its services are co-developed with local stakeholders, who are to keep operating them after the
    pilot phase.
  url: https://copphil.philsa.gov.ph/wp-content/uploads/2026/05/2026-CopPhil-Benthic-Habitat-Monitoring.pdf
  fetched: 2026-11-07
  quote: The services are co-developed with local stakeholders, who will continue to operate them after
    the end of the pilot demonstration phase.
- claim: Launched on 24 April 2023 to strengthen the uptake of Copernicus data in the Philippines through
    a CopPhil Centre.
  url: https://copphil.philsa.gov.ph/about/
  fetched: 2026-11-08
  quote: Launched on 24 April 2023, the objective of the National Copernicus Capacity Support Action Programme
    for the Philippines (CopPhil) is to strengthen and promote the operational uptake of free and open
    Copernicus data in the Philippines through the establishment of the CopPhil Centre.
- claim: Says the centre will support biodiversity conservation as well as climate and hazard work.
  url: https://copphil.philsa.gov.ph/about/
  fetched: 2026-11-08
  quote: In particular, the Centre will support and increase the ability of the Philippines to address
    climate vulnerability and biodiversity conservation while improving hazard management and resilience.
- claim: Its services cover land cover, forest and crop mapping and coastal marine (benthic) habitat monitoring,
    as well as ground motion.
  url: https://copphil.philsa.gov.ph/pilot-thematic-services/
  fetched: 2026-11-08
  quote: Coastal Marine (benthic) Habitat Monitoring Service
- claim: Its Forest Area and Type product is produced with a machine learning approach from Sentinel-1
    and Sentinel-2 imagery.
  url: https://copphil.philsa.gov.ph/forest-mapping-service/
  fetched: 2026-11-08
  quote: Generated from Sentinel-1 and Sentinel-2 satellite imagery at a resolution of 10 metres and produced
    using a machine learning approach
- claim: Says the services were co-developed with PhilSA and other partners, who will continue to implement
    them after the pilot phase.
  url: https://copphil.philsa.gov.ph/pilot-thematic-services/
  fetched: 2026-11-08
  quote: The EO services were co-developed with the Philippines Space Agency (PhilSA) alongside other
    partners, which will continue to implement them after the end of the pilot demonstration phase.
