  url: https://www.huawei.com/en/publications/winwin-magazine/36/protecting-palawan-rainforest-philippines
  fetched: 2026-11-08
  quote: Identified by AI, forest sounds and data are uploaded to cloud on the Smart Communications network
    and then sent to forest rangers via RFCx’s mobile app.
