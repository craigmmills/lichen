summary: A non-profit affiliate of Conservation International Foundation that signed
  a remote sensing conservation agreement with PhilSA in October 2023, when its director
  reported using its own mapping tools.
facts:
- claim: A non-stock and non-profit corporation affiliated with the Conservation International
    Foundation.
  url: https://philsa.gov.ph/news/philsa-cipfi-sign-agreement-to-utilize-remote-sensing-technologies-in-advancing-environmental-conservation-management/
  fetched: 2026-11-12
  quote: the CIPFI is a non-stock and non-profit corporation that implements conservation
    strategies through its integrated Highlands to Oceans (H2O) approach
- claim: Signed an agreement with PhilSA on 27 October 2023 to apply remote sensing
    to environmental conservation and management.
  url: https://philsa.gov.ph/news/philsa-cipfi-sign-agreement-to-utilize-remote-sensing-technologies-in-advancing-environmental-conservation-management/
  fetched: 2026-11-12
  quote: The Philippine Space Agency (PhilSA) has inked an agreement with the Conservation
    International Philippines Foundation, Inc. (CIPFI) to work on advancing environmental
    conservation and management through the application of remote sensing technologies.
- claim: At the October 2023 signing, its country executive director said it was using
    its own mapping, assessment and estimation tools.
  url: https://philsa.gov.ph/news/philsa-cipfi-sign-agreement-to-utilize-remote-sensing-technologies-in-advancing-environmental-conservation-management/
  fetched: 2026-11-12
  quote: Some of these tools that we are currently using, and we are trying to develop
    even more include our own mapping, assessment, and estimation.
