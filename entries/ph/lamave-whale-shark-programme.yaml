summary: A whale shark research programme run by the Large Marine Vertebrates Research
  Institute Philippines, using photo-identification, satellite telemetry, stereophotogrammetry
  and genetics, with satellite tags deployed at Tubbataha in 2015.
facts:
- claim: Its research techniques include photo-identification, satellite telemetry,
    stereophotogrammetry and genetics.
  url: https://www.lamave.org/our-programs/whale-sharks
  fetched: 2026-11-12
  quote: Our research techniques include photo-identification, satellite telemetry,
    focal animal follows, behavioral studies, laser & stereophotogrammetry, genetics/genomics
- claim: Photo-identification has been used at five whale shark project sites in the
    Philippines.
  url: https://www.lamave.org/our-programs/whale-sharks
  fetched: 2026-11-12
  quote: We have employed this technique across five whale shark project sites in
    the Philippines.
- claim: In 2015, satellite tags were deployed at Tubbataha with the TMO, PCSD and
    the Marine Megafauna Foundation.
  url: https://www.lamave.org/our-programs/whale-sharks
  fetched: 2026-11-12
  quote: we also deployed satellite tags on whale sharks in collaboration with the
    TMO, the Palawan Council for Sustainable Development (PCSD), and the Marine Megafauna
