summary: Central government space agency created in August 2019 under Republic Act No. 11363,
  which says it supports DENR monitoring with satellite data and AI, and signed a satellite
  data agreement with NAMRIA in February 2025.
facts:
- claim: PhilSA describes itself as the central government agency that plans, develops and
    promotes the national space programme, created in August 2019 under Republic Act No. 11363.
  url: https://philsa.gov.ph/news/philsa-namria-advance-satellite-data-utilization-for-environmental-and-natural-resource-mapping-and-monitoring/
  fetched: 2026-11-07
  quote: The Philippine Space Agency (PhilSA) is the central government agency of the Philippines
    that plans, develops, and promotes the national space program in line with the Philippine
    Space Policy.
- claim: Says it supports the environment department's monitoring systems through satellite
    remote sensing, machine learning, artificial intelligence and GIS.
  url: https://philsa.gov.ph/?p=6884
  fetched: 2026-11-07
  quote: PhilSA remains committed to supporting the enhancement of DENR’s monitoring systems
    through satellite remote sensing, machine learning, artificial intelligence, and geographic
    information systems.
