summary: A closed five-year USAID-funded biodiversity project launched in 2020, described
  in January 2024 as developing monitoring and decision-making tools, with CCIPH expected
  to contribute species distribution modelling.
facts:
- claim: A five-year natural resources management and biodiversity conservation project
    funded by USAID, launched in 2020.
  url: https://conservation-innovations.org/project/usaid-sibol/
  fetched: 2026-11-12
  quote: a five-year natural resources management and biodiversity conservation project
    funded by the United States Agency for International Development
- claim: The January 2024 page described SIBOL as developing decision-making tools
    to improve biodiversity and socio-economic monitoring and analysis.
  url: https://conservation-innovations.org/project/usaid-sibol/
  fetched: 2026-11-12
  quote: as well as by developing cutting-edge decision-making tools to improve biodiversity
    and socio-economic monitoring and analysis
- claim: The January 2024 page said CCIPH would contribute species distribution modelling
    and technical support for rolling out landscape and wildlife threats monitoring
    and reporting.
  url: https://conservation-innovations.org/project/usaid-sibol/
  fetched: 2026-11-12
  quote: species distribution modeling, and the provision of technical support on
    the roll-out of a landscape and wildlife threats monitoring and reporting
