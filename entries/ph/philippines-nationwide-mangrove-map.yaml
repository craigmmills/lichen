  quote: PhilSA, in partnership with the DENR, produced the Nationwide Mangrove Map for 2023 using remotely-sensed
    images from Sentinel-2 and ALOS PALSAR2 .
- claim: The mapping initiative was launched on 28 February 2024 at the DENR Central Office, and the map
    was to undergo validation.
  url: https://philsa.gov.ph/news/philsa-denr-launch-nationwide-mangrove-mapping-initiative/
  fetched: 2026-11-08
  quote: The map will undergo a validation process to enhance the reliability and applicability of data
    to support coastal management, conservation efforts, and scientific research.
