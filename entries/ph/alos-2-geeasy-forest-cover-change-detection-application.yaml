summary: A web-based forest cover change tool using ALOS-2 ScanSAR data in Google Earth Engine, built
  by JAXA with PhilSA's assistance for non-coders, with training attended by several Philippine agencies
  and Conservation International Philippines.
facts:
- claim: A web-based application built on ALOS-2 Level 2.2 ScanSAR data held in the Google Earth Engine
    archive.
  url: https://philsa.gov.ph/news/philsa-jaxa-to-make-space-data-accessible-through-the-development-of-the-alos-2-geeasy-forest-change-detection-application/
  fetched: 2026-11-08
  quote: utilizing the ALOS-2 GEEasy Forest Cover Change Detection Application, a web-based application
    that has been designed to leverage the capabilities of ALOS-2 Level 2.2 ScanSAR data accessible through
    the GEE archive.
- claim: JAXA developed it with PhilSA's assistance for users without coding experience.
  url: https://philsa.gov.ph/news/philsa-jaxa-to-make-space-data-accessible-through-the-development-of-the-alos-2-geeasy-forest-change-detection-application/
  fetched: 2026-11-08
  quote: To make ALOS-2 data more accessible to users without prior coding and programming experience,
    JAXA developed the ALOS-2 GEEasy Application with the assistance of PhilSA.
- claim: Training participants included the DENR, NAMRIA, the University of the Philippines, the Palawan
    Council for Sustainable Development Staff and Conservation International Philippines.
  url: https://philsa.gov.ph/news/philsa-jaxa-to-make-space-data-accessible-through-the-development-of-the-alos-2-geeasy-forest-change-detection-application/
  fetched: 2026-11-08
  quote: Palawan Council for Sustainable Development Staff (PCSDS), and Conservation International Philippines.
