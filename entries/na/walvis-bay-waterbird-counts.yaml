facts:
- claim: A March 2026 presentation by John Paterson describes 43 years of contiguous
    citizen-science counts at Walvis Bay, 1983 to 2026.
  url: https://www.namibiabirdclub.org/43%20Years%20of%20Counting.pdf
  fetched: 2026-11-12
  quote: '1983 – 2026: 43 Years of contiguous Citizen Science driven counts'
- claim: The March 2026 presentation says CETN facilitated the counts from 1994 to
    2026, with John Paterson from 2021 to 2026.
  url: https://www.namibiabirdclub.org/43%20Years%20of%20Counting.pdf
  fetched: 2026-11-12
  quote: 1994 – 2026 CETN has been facilitating the counts
