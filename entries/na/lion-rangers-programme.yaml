  quote: The Lion Rangers programme was founded in 2018 as part of the Human-Lion Conflict Management
    Plan for North West Namibia introduced by Namibia's Ministry of Environment, Forestry and Tourism
    (MEFT)
- claim: A November 2023 article reported 47 lion rangers and four rapid response teams across Kunene
    and Erongo, in eleven conservancies.
  url: https://conservationnamibia.com/articles/smart-rangers-conserve-lions.php
