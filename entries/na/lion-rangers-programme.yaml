  quote: It employs 47 lion rangers and four Rapid Response Teams across the Kunene and Erongo regions
    in northwestern Namibia.
- claim: In the 18 months after SMART was put in place in April 2022, rangers recorded 12,002 patrols,
    445 lion sightings and 876 lion tracks.
  url: https://conservationnamibia.com/articles/smart-rangers-conserve-lions.php
