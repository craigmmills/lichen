  quote: In the 18 months since the SMART system was implemented in April 2022, the Lion Rangers have
    recorded 12,002 patrols across the northwest
- claim: A November 2023 article says SMART reports were sent to MEFT to contribute to managing north-west
    Namibia's lion populations.
  url: https://conservationnamibia.com/articles/smart-rangers-conserve-lions.php
  fetched: 2026-11-08
  quote: SMART reports are also sent to MEFT to contribute to the overall management of northwestern Namibia's
    lion populations.
