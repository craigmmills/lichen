summary: Mobile app for reporting carnivore sightings in Namibia, built by the Cheetah
  Conservation Fund and announced in a December 2015 post as collecting species, number
  of individuals and GPS location.
facts:
- claim: CCF's blog of 2 December 2015 says CCF debuted a mobile app, in association
    with the Large Carnivore Management Association of Namibia, for reporting sightings
    of carnivore species in Namibia.
  url: https://cheetah.org/ccf-blog/conservation/tracking-carnivores-with-your-phone/
  fetched: 2026-11-15
  quote: CCF debuted a new application for mobile devices that enables members of
    the scientific community, farmers, tourists and local residents to identify and
    report sightings of carnivore species in Namibia.
- claim: The December 2015 post says the app collects the species sighted, the number
    of individuals and the GPS location.
  url: https://cheetah.org/ccf-blog/conservation/tracking-carnivores-with-your-phone/
  fetched: 2026-11-15
  quote: The type of information collected through Carnivore Tracker includes identification
    of the species sighted, number of individuals and the GPS location
- claim: The post says the distribution data gathered will help provide data on Namibia's
    wild carnivores.
  url: https://cheetah.org/ccf-blog/conservation/tracking-carnivores-with-your-phone/
  fetched: 2026-11-15
  quote: The distribution data gathered with this app, known as Carnivore Tracker,
    will help provide data on Namibia’s wild ranging carnivores
