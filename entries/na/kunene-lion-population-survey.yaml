summary: Closed survey run by the ministry, Lion Rangers programme and Namibian Lion
  Trust photographed 54 of 57 adult lions in Kunene, estimating density at 0.11 per
  100 km2.
facts:
- claim: From 6 November 2022 to 6 January 2023, four teams of 45 trained surveyors
    searched communal and government land in Kunene to find and identify all free-ranging
    adult lions.
  url: https://conservationnamibia.com/articles/lion-population-survey.php
  fetched: 2026-11-15
  quote: From 6 November 2022 to 6 January 2023, four teams of 45 trained surveyors
    traversed thousands of kilometres of communal and government-managed land in the
    Kunene Region to find and individually identify all free-ranging adult lions in
    the area.
- claim: The teams photographed both sides of the face of 54 of 57 adult lions to
    identify them by whisker-spot patterns.
  url: https://conservationnamibia.com/articles/lion-population-survey.php
  fetched: 2026-11-15
  quote: the survey teams captured high-quality photos of both sides of the face of
    54 of 57 adult lions that clearly showed their whisker-spot patterns.
- claim: The teams used movement data from collared lions to cover the areas lions
    roam.
  url: https://conservationnamibia.com/articles/lion-population-survey.php
  fetched: 2026-11-15
  quote: Throughout the survey teams relied heavily on movement data from collared
    lions to ensure that all areas where lions are known to roam were covered.
- claim: The survey put lion density in Kunene at 0.11 lions per 100 km2.
  url: https://conservationnamibia.com/articles/lion-population-survey.php
  fetched: 2026-11-15
  quote: At 0.11 lions/100 km 2 , lion density in Kunene is the lowest recorded for
    stable, free-ranging lion populations in Africa.
