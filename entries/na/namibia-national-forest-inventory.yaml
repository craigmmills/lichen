summary: Forest inventory programme whose 1992 and 2000 inventories fed FAO's FRA
  2005 report, with the 1992 data covering only the north-east and no inventory in
  Okavango or Kunene for security reasons.
facts:
- claim: Namibia's FRA 2005 country report, published by FAO, gives one of its contributors
    the title of forester with the National Forestry Inventory.
  url: https://fao.org/docrep/fao/010/ai910E/ai910E00.pdf
  fetched: 2026-11-15
  quote: 'Title:    Forester, National Forestry Inventory'
- claim: The report says its FRA 2005 estimates of forest and other wooded land area
    extrapolated changes between the 1992 and 2000 inventories.
  url: https://fao.org/docrep/fao/010/ai910E/ai910E00.pdf
  fetched: 2026-11-15
  quote: Estimation for FRA 2005 was by extrapolating changes between 1992 and the
    latest 2000 inventory.
- claim: The report says the forest inventory used for its 1992 land-area data covered
    only the north-eastern part of Namibia.
  url: https://fao.org/docrep/fao/010/ai910E/ai910E00.pdf
  fetched: 2026-11-15
  quote: this  forest inventory covered only the north-eastern part of the country,
- claim: The report says no inventory was undertaken in the Okavango and Kunene regions,
    for security reasons.
  url: https://fao.org/docrep/fao/010/ai910E/ai910E00.pdf
  fetched: 2026-11-15
  quote: Inventory was not undertaken in Okavango and Kunene regions due to security
    reasons.
