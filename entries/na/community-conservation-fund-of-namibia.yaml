facts:
- claim: Describes itself as financially supporting Namibia's communal conservancies and community forests.
  url: https://www.ccf-namibia.org/background/
  fetched: 2026-11-08
  quote: Financially supporting Namibia’s communal conservancies and community forests
- claim: Its background page describes a planned scope of funding critical support services to communal
    conservancies and, eventually, community forests.
  url: https://www.ccf-namibia.org/background/
  fetched: 2026-11-08
  quote: The primary scope of the CCFN will be to fund critical support services (eg. Minimum Support
    Packages) to communal conservancies, and eventually, community forests.
- claim: The German embassy says the ministry and the fund handed over about NAD 31 million in grants
    to Kunene conservancies on 18 October 2024.
  url: https://windhuk.diplo.de/na-en/2681074-2681074
  fetched: 2026-11-08
  quote: in collaboration with the Community Conservation Fund of Namibia (CCFN), officially handed over
    grants valued at approximately NAD 31 million (EUR 1.5 million) to communal conservancies in the Kunene
    Region.
- claim: The embassy says equipment handed over through the POSCCIN project included trail cameras and
    SMART phones for wildlife monitoring.
  url: https://windhuk.diplo.de/na-en/2681074-2681074
  fetched: 2026-11-08
  quote: Trail cameras to monitor wildlife activity and gather data on species presence and their behaviour.
