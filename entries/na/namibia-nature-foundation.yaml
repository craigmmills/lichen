summary: Windhoek trust whose 2024 report says it facilitated a SMART data model for K9 units and reports
  SMART rollout to ministry and Save the Rhino Trust ranger teams.
facts:
- claim: Its 2024 annual report says it facilitated the development of a SMART data model for the K9 units.
  url: https://nnf.org.na/wp-content/uploads/2025/06/NNF-Annual-Report_2024_fin_online_spreads.pdf
  fetched: 2026-11-08
  quote: Facilitated the development of a Spatial Monitoring and Reporting T ool (SMART) data model for
    the K9 units.
- claim: The report says SMART has been rolled out to MEFT and Save the Rhino Trust ranger teams across
    Namibia.
  url: https://nnf.org.na/wp-content/uploads/2025/06/NNF-Annual-Report_2024_fin_online_spreads.pdf
  fetched: 2026-11-08
  quote: The Spatial Monitoring and Reporting T ool (SMART) has been successfully rolled out to MEFT and
    SRT ranger teams across the country.
- claim: Its applied research programme runs the Oppenheimer Generations Fellowship, studying the ecological
    drivers of wildlife movements in Kunene and Etosha National Park from 2024 to 2029.
  url: https://nnf.org.na/programmes/applied-scientific-research/
  fetched: '2026-11-08'
  quote: Studying ecological drivers of wildlife movements between parks, communal conservancies, and
- claim: Supported community rhino rangers in Kunene in rhino monitoring from April 2023 to April 2024,
    funded by the B2Gold Rhino Gold Bar Fund.
  url: https://nnf.org.na/programmes/combatting-wildlife-crime/
  fetched: '2026-11-08'
  quote: Support to community Rhino Rangers in Kunene, in conducting rhino monitoring.
- claim: Says its wildlife crime programme supported partners in operations to detect incursions into
    protected areas.
  url: https://nnf.org.na/programmes/combatting-wildlife-crime/
  fetched: '2026-11-08'
  quote: Supported partners in on the ground operations helping to detect incursions in protected areas,
    reduce criminal opportunity and increase deterrence
- claim: JRS Biodiversity Foundation lists a 2023 grant of $264,108 for incorporating succulent plant
    and animal species information into conservation planning, naming the recipient as Namibian Nature
    Foundation.
  url: https://jrsbiodiversity.org/our-grants/
  fetched: '2026-11-08'
  quote: Namibian Nature Foundation (2023) Incorporating Succulent Plant and Animal Species Information
    into Conservation Planning $264,108 (36 Months)
- claim: Its 2025 highlights say that it, NAMCOB and government developed and implemented SMART monitoring
    within the Namibian Islands' Marine Protected Area.
  url: https://nnf.org.na/programmes/marine-coastal-conservation/
  fetched: 2026-11-08
  quote: The NNF, NAMCOB and government have developed and implemented SMART monitoring within the NIMPA
    digitalising monitoring for Africas 2 nd biggest Marine protected area
- claim: Lists a project dated 1 June 2022 to 1 June 2024 to develop a baseline database of Namibian shark
    and ray species from demersal trawl bycatch.
  url: https://nnf.org.na/programmes/marine-coastal-conservation/
  fetched: 2026-11-08
  quote: Develop a baseline database of Namibian shark and ray species from demersal trawl fisheries bycatch,
    and assess the impacts and threats to these species.
- claim: Runs an applied scientific research programme in support of national and communal conservation
    management.
  url: https://nnf.org.na/programmes/applied-scientific-research/
  fetched: 2026-11-08
  quote: Conduct applied scientific research in support of national and communal conservation management
