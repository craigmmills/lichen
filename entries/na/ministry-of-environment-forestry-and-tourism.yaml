summary: Government ministry in Windhoek whose stated mission is biodiversity conservation through sustainable
  resource use and tourism; UNDP Namibia says it led the process for the third NBSAP.
facts:
- claim: States that its mission is to promote biodiversity conservation through the sustainable use of
    natural resources and tourism development.
  url: https://www.meft.gov.na/
  fetched: 2026-11-08
  quote: The mission of the Ministry of Environment, Forestry and Tourism is to promote biodiversity conservation
    in the Namibian environment through the sustainable utilization of natural resources and tourism development
- claim: Its site lists directorates of Forestry and of Wildlife and National Parks, and the national
    parks under the ministry.
  url: https://www.meft.gov.na/
  fetched: 2026-11-08
  quote: Wildlife and National Parks
- claim: Its address is in Windhoek.
  url: https://www.meft.gov.na/
  fetched: 2026-11-08
  quote: Erf 842 Dr. Kenneth Kaunda Street, Windhoek, Namibia
- claim: UNDP Namibia says the ministry led the process for the third National Biodiversity Strategy and
    Action Plan, with the Namibia Nature Foundation and the University of Namibia.
  url: https://www.undp.org/namibia/blog/namibia-files-its-nature-receipts-nbsap-iii-7nr-why-it-matters
  fetched: 2026-11-08
  quote: Led by the Ministry of Environment, Forestry and Tourism (MEFT), together with the Namibia Nature
    Foundation and the University of Namibia
- claim: UNDP Namibia says Namibia has filed the draft NBSAP III and its Seventh National Report with
    the Convention on Biological Diversity.
  url: https://www.undp.org/namibia/blog/namibia-files-its-nature-receipts-nbsap-iii-7nr-why-it-matters
  fetched: 2026-11-08
  quote: 'Namibia has just filed two hefty items with the United Nations Convention on Biological Diversity
    (CBD): the draft Third National Biodiversity Strategy and Action Plan (NBSAP III) and the Seventh
    National Report (7NR).'
- claim: NUST's 2 October 2025 article reports that the minister of environment, forestry and tourism
    launched Namibia's first official Ecosystems Map.
  url: https://www.nust.na/mapping-namibias-biodiversity-first-official-ecosystems-map-launched
  fetched: 2026-11-08
  quote: Launched by the Honourable Minister of Environment, Forestry and Tourism, Indileni Daniel, the
    map identifies 218 ecosystem types in Namibia
- claim: The minister described the map as a tool underpinning Namibia's National Biodiversity Action
    Plan 2025.
  url: https://www.nust.na/mapping-namibias-biodiversity-first-official-ecosystems-map-launched
  fetched: 2026-11-08
  quote: This map is a strategic tool underpinning Namibia’s National Biodiversity Action Plan 2025.
- claim: GBIF's record for the National Botanical Research Institute places it in the ministry's Directorate
    of Forestry.
  url: https://api.gbif.org/v1/organization/49bc1213-a2cc-4fd8-8dc9-1b8c209a1b7f
  fetched: 2026-11-08
  quote: is a sub-division within the Division Forest & Botanical Research of Directorate of Forestry,
    resorting under the Ministry of Environment, Forestry and Tourism.
