summary: Namibian conservation body, founded by Laurie Marker, whose centre is in Otjiwarongo
  and whose cheetah population study, running since 1990, combines monitoring with genetic
  analysis, including scat detection dogs.
facts:
- claim: Led published research on combining detection dogs and camera traps for monitoring
    cheetah populations.
  url: https://cheetah.org/ccf-blog/research/tracking-spots-and-saving-species-ccf-featured-on-the-cover-of-ecological-solutions-and-evidence/
  fetched: 2026-11-08
  quote: research led by CCF titled Combining detection dogs and camera traps improves minimally
    invasive population monitoring for the cheetah
- claim: The study was carried out in north-central Namibia.
  url: https://cheetah.org/ccf-blog/research/tracking-spots-and-saving-species-ccf-featured-on-the-cover-of-ecological-solutions-and-evidence/
  fetched: 2026-11-08
  quote: The study was conducted in north-central Namibia
- claim: Its research and education centre is in Otjiwarongo, Namibia, and it has fundraising
    operations in five other countries.
  url: https://cheetah.org/ccf-blog/research/tracking-spots-and-saving-species-ccf-featured-on-the-cover-of-ecological-solutions-and-evidence/
  fetched: 2026-11-08
  quote: Our Research and Education Centre is located in Otjiwarongo, Namibia.
- claim: Its research and education centre is in Otjiwarongo, Namibia.
  url: https://cheetah.org/ccf-blog/ccf-in-somaliland/conservation-technology-a-glimpse-into-the-future-of-cheetah-co
  fetched: '2026-11-08'
  quote: Our Research and Education Centre is located in Otjiwarongo, Namibia.
- claim: Its population study of Namibian cheetahs has run since 1990 and combines population
    monitoring with genetic analysis to identify individuals.
  url: https://cheetah.org/about/what-we-do/research/
  fetched: '2026-11-08'
  quote: CCF’s population study for the Namibian cheetah has been ongoing since 1990, with
    over 750 tissue & 1000 scat samples collected to date.
- claim: Runs population monitoring within its own 50,000 hectares of conservancy.
  url: https://cheetah.org/about/what-we-do/research/
  fetched: '2026-11-08'
  quote: Population monitoring within CCF’s 50.000 hectares of wildlife conservancy, in combination
    with genetic analysis via microsatellite markers, allows us to identify individual cheetahs
    by both visual and genetic traits.
- claim: Says its conservation genetics laboratory is the only fully equipped genetics laboratory
    at a conservation facility in Africa, and that its sample collection is available for
    genetic research.
  url: https://cheetah.org/about/what-we-do/research/
  fetched: '2026-11-08'
  quote: CCF has a large sample collection that is available for genetic research.
- claim: Works with wildlife observers in Somaliland who are trained to use SMART for wildlife
    observations and human-wildlife conflict reports.
  url: https://cheetah.org/ccf-blog/ccf-in-somaliland/conservation-technology-a-glimpse-into-the-future-of-cheetah-co
  fetched: '2026-11-08'
  quote: In Somaliland, we work with Wildlife Observers that are trained in the use of SMART,
    a spatial monitoring and reporting tool.
- claim: Laurie Marker founded it and made Namibia its base after independence in 1990.
  url: https://cheetah.org/about/who-we-are/dr-laurie-marker/
  fetched: '2026-11-08'
  quote: After Namibia gained its independence in 1990, Dr. Marker decided to make this newly-formed
    country the base for her frontline conservation organization focused on saving the cheetah.
- claim: Its research and education centre is in Otjiwarongo, Namibia.
  url: http://cheetah.org/
  fetched: 2026-11-08
  quote: Our Research and Education Centre is located in Otjiwarongo, Namibia.
- claim: Says it uses trained scat detection dogs to find cheetah scat, from which DNA is
    extracted to identify individuals.
  url: https://cheetah.org/about/what-we-do/research/
  fetched: 2026-11-08
  quote: Trained scat detection dogs help CCF geneticists find cheetah scat in the field.
- claim: Says it runs the Life Technologies Conservation Genetics Laboratory at its facility
    in Namibia.
  url: https://cheetah.org/about/what-we-do/research/
  fetched: 2026-11-08
  quote: The Life Technologies Conservation Genetics Laboratory is the only fully-equipped
    genetics lab in situ at a conservation facility in Africa.
