summary: Fire project run by the environment ministry with UNDP and Korean funding,
  involving a geospatial fire database covering 1990–2022 and training 95 community
  members in 2023.
facts:
- claim: In May 2024, UNDP described the project as funded by the Korean Government
    under the UNDP SDG Partnership on Sustainable Forestry.
  url: https://www.undp.org/namibia/blog/fire-monitoring-and-community-engagement-meft-and-undps-collaborative-efforts
  fetched: 2026-11-12
  quote: with funding from the Korean Government through the Project on Strengthening
    Namibia's Forest and Veld Fire Detection, Monitoring, and Response System under
    the UNDP SDG Partnership on Sustainable Forestry
- claim: Under the project MEFT collated remote sensing work on fire monitoring and
    built a geospatial fire occurrence database with shapefiles from 1990 to 2022.
  url: https://www.undp.org/namibia/blog/fire-monitoring-and-community-engagement-meft-and-undps-collaborative-efforts
  fetched: 2026-11-12
  quote: Under the project, the Ministry of Environment, Forestry, and Tourism (MEFT)
    collated ongoing remote sensing initiatives on fire monitoring and mapping and
    developed a geospatial fire occurrence database for Namibia.
- claim: Participatory mapping ground-truthed the national fire incidence and burning
    severity map in four regions.
  url: https://www.undp.org/namibia/blog/fire-monitoring-and-community-engagement-meft-and-undps-collaborative-efforts
  fetched: 2026-11-12
  quote: participatory mapping exercises were conducted to ground-truth the national
    fire incidence and burning severity map
- claim: Trained 95 community members in fire fighting and prevention in 2023.
  url: https://www.undp.org/namibia/blog/fire-monitoring-and-community-engagement-meft-and-undps-collaborative-efforts
  fetched: 2026-11-12
  quote: In 2023, the trained 95 community members on firefighting and prevention
    measures
