summary: University whose 2 October 2025 article reports the launch of Namibia's first official Ecosystems
  Map and says Prof Ben Strohbach led a research team.
facts:
- claim: Its 2 October 2025 article reports the launch of Namibia's first official Ecosystems Map, developed
    through the Spatial Biodiversity Assessment, Prioritisation and Planning (SBAPP) Regional Project.
  url: https://www.nust.na/mapping-namibias-biodiversity-first-official-ecosystems-map-launched
  fetched: 2026-11-08
  quote: NUST is advancing innovation in biodiversity conservation and sustainable development with the
    launch of Namibia’s first official Ecosystems Map.
- claim: Says Prof Ben Strohbach of its Department of Natural Resource Sciences, Namibia's principal investigator
    for the project, led a team of researchers and supervised 11 postgraduate students.
  url: https://www.nust.na/mapping-namibias-biodiversity-first-official-ecosystems-map-launched
  fetched: 2026-11-08
  quote: Prof Strohbach led a team of researchers and supervised 11 postgraduate students, strengthening
    local expertise and building capacity for future biodiversity research.
- claim: Has four faculties, including one for Health, Natural Resources and Applied Sciences.
  url: https://www.nust.na
  fetched: 2026-11-08
  quote: The university consists of four Faculties, namely, Computing and Informatics; Commerce, Human
    Sciences and Education; Engineering and the Built Environment; Health, Natural Resources and Applied
    Sciences.
