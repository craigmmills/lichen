summary: Project started in 2012 to collect fine-scale black-footed cat distribution
  records on Namibian farmland and in protected areas; collared females were monitored
  by telemetry and camera traps into 2021.
facts:
- claim: The project was initiated in 2012 to collect fine-scale distribution records
    of black-footed cats on farmland and in protected areas in Namibia.
  url: https://the-eis.com/elibrary/search/27509
  fetched: 2026-11-13
  quote: The Black-footed Cat Research Project Namibia was initiated in 2012 to 1)
    collect more fine-scale distribution records of black-footed cats in Namibia
- claim: An April 2021 update described the project as a collaboration between the
    Black-Footed Cat Working Group, NUST's Biodiversity Research Centre and the Ministry
    of Environment, Forestry and Tourism.
  url: https://the-eis.com/elibrary/search/27509
  fetched: 2026-11-13
  quote: This project is a collaborative effort between the Black-Footed Cat Working
    Group (BFCWG), the Namibia University of Science and Technology (NUST) Biodiversity
    Research Centre (BRC) and the Ministry of Environment, Forestry and Tourism.
- claim: Collared females were monitored by telemetry, camera traps and observation
    through 2020 and into 2021.
  url: https://the-eis.com/elibrary/search/27509
  fetched: 2026-11-13
  quote: regularly monitored all the females by telemetry, some camera trap footage
    (Figure 1) and visual observations throughout 2020 and into 2021.
