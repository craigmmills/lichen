summary: Namibian vulture group, set up in 1997 as the local branch of the Vulture
  Study Group and renamed in 2005, which is unregistered as a charity and has no paid
  staff, according to the Environmental Information Service.
facts:
- claim: The Environmental Information Service says Vultures Namibia is not registered
    as a charity and has no paid employees.
  url: https://the-eis.com/elibrary/search/15455
  fetched: 2026-11-13
  quote: Vultures Namibia is not registered as a charity, as it is not large enough
    to warrant charity status. It has no paid employees.
- claim: It was established in 1997 as the Namibian representation of the Vulture
    Study Group and renamed Vultures Namibia in 2005.
  url: https://the-eis.com/elibrary/search/15455
  fetched: 2026-11-13
  quote: It was officially renamed 'Vultures Namibia' in 2005, to reflect its local
    identity.
- claim: Aerial surveys for Lappet-faced Vulture nests in the Namib-Naukluft Park
    have been run annually since 2001.
  url: https://the-eis.com/elibrary/search/15455
  fetched: 2026-11-13
  quote: Aerial surveys have since been performed on an annual basis.
- claim: Its camera trap network monitors seven waterholes, five in the park and two
    on adjacent land.
  url: https://vultures-namibia.com/whatwedo.html
  fetched: 2026-11-13
  quote: we are now monitoring seven waterholes, five in the park and two on land
    adjacent to the park.
- claim: It fitted GPS tracking devices to vulture chicks in 2018 and 2019.
  url: https://vultures-namibia.com/whatwedo.html
  fetched: 2026-11-13
  quote: we were able to purchase several of these devices and fit them to chicks,
    just before they fledged, in 2018 and 2019.
