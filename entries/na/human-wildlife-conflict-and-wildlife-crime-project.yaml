summary: Project run by the environment ministry with Global Environment Facility funding, which UNDP
  Namibia says has reached over 60 communities and supports ranger teams using SMART, GPS devices and
  digital radios.
facts:
- claim: UNDP Namibia says the project has reached more than 60 communities in the North-Central, North-West
    and North-East regions.
  url: https://www.undp.org/namibia/blog/living-giants-namibias-path-coexistence-and-prosperity
  fetched: 2026-11-08
  quote: the project has reached more than 60 communities across the North-Central, North-West, and North-East
    regions
- claim: UNDP Namibia says ranger and game guard teams supported by the project use SMART, GPS devices
    and digital radios to track wildlife and record patrol data.
  url: https://www.undp.org/namibia/blog/living-giants-namibias-path-coexistence-and-prosperity
  fetched: 2026-11-08
  quote: Ranger/Game guards teams now use Spatial Monitoring and Reporting Tool (SMART) technology, GPS
    devices, and digital radios to track wildlife movements, record patrol data
