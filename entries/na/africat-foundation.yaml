summary: Namibian conservation body whose Okonjima reserve camera trap network of almost 200 cameras produces
  about 50,000 images a month, processed with TrapTagger, with GPS data collected through LoRaWAN gateways.
facts:
- claim: Maintains a network of camera traps throughout the Okonjima Nature Reserve.
  url: https://africat.org/methodology/
  fetched: 2026-11-08
  quote: AfriCat has established and maintains an extensive network of camera traps throughout the ONR.
- claim: Its camera trap system has almost 200 cameras producing about 50,000 images a month, processed
    with TrapTagger.
  url: https://africat.org/methodology/
  fetched: 2026-11-08
  quote: AfriCat’s camera trap system on the ONR currently consists of almost 200 camera traps and generates
    about 50,000 images per month. AfriCat uses TrapTagger, an open-source web application that applies
    the latest artificial intelligence technologies
- claim: GPS data from tracked animals is picked up by LoRaWAN gateways in the reserve.
  url: https://africat.org/methodology/
  fetched: 2026-11-08
  quote: The GPS data is picked up by a network of LoRaWAN (long range wide area network) gateways installed
    within the Reserve.
- claim: A camera-trap lure study started at Okonjima in May 2025 and was scheduled to run until October
    2025, implemented by NUST student Victoria Mulyuu with the Ongava Research Centre and AfriCat; the
    page also names a collaborator as the University of George.
  url: https://africat.org/methodology/
  fetched: 2026-11-08
  quote: The study is being implemented by Victoria Mulyuu, a Namibian student from the Namibian University
    of Science and Technology, in collaboration with the Ongava Research Centre, the University of George
    and AfriCat.
