summary: Trust formed in 1982 to monitor rhinos in Kunene and Erongo, using local trackers
  on foot patrols, and which calls its black rhino database the longest running.
facts:
- claim: A March 2018 article said SRT had developed its rhino monitoring programme since
    its formation in 1982, introducing GPS and ultra-zoom digital cameras.
  url: https://www.savetherhino.org/africa/namibia/smart-work-by-save-the-rhino-trust/
  fetched: 2026-11-08
  quote: Since its formation in 1982, Save the Rhino Trust (SRT) has continued to develop
    its highly effective rhino monitoring programme, introducing technology such as GPS and
    ultra-zoom digital cameras
- claim: A March 2018 article said SRT employed local people as rangers to monitor desert-adapted
    black rhinos in north-west Namibia.
  url: https://www.savetherhino.org/africa/namibia/smart-work-by-save-the-rhino-trust/
  fetched: 2026-11-08
  quote: SRT employs local people as rhino rangers trackers to monitor and protect the Critically
    Endangered desert-adapted black rhino found in northwest Namibia
- claim: Save the Rhino says the SRT database is described as the longest-running dataset
    on black rhino, with 3,333 verified sightings in 2016.
  url: https://www.savetherhino.org/africa/namibia/smart-work-by-save-the-rhino-trust/
  fetched: 2026-11-08
  quote: The SRT database is acknowledged as the longest-running dataset on black rhino anywhere
    in the world.
- claim: Formed in 1982 to monitor the last remaining rhinos in the Kunene and Erongo regions.
  url: http://www.savetherhinotrust.org/about-us.html
  fetched: '2026-11-08'
  quote: In 1982, prior to Namibia’s Independence, SRT was formed to monitor the last remaining
    rhinos in the Kunene and Erongo regions.
- claim: Monitors and reports on black rhino numbers, distribution and disturbances, compiling
    data from photos, sightings and field operations.
  url: http://www.savetherhinotrust.org/monitoring-of-the-rhinos.html
  fetched: '2026-11-08'
  quote: We monitor and report on black rhino numbers, distribution, human and wildlife conflict
    and Human-induced Disturbances. We compile and update data using photos, wildlife sightings
    and field operations.
- claim: Developed a photographic and life history database on the region's rhinos, which
    it calls the longest running database of black rhinos.
  url: http://www.savetherhinotrust.org/about-us.html
  fetched: '2026-11-08'
  quote: SRT also developed a photographic and life history database on rhinos in the region.
- claim: Its trackers, drawn from local communities, patrol on foot on communal land in northern
    Namibia.
  url: https://www.savetherhinotrust.org/
  fetched: '2026-11-08'
  quote: We work to monitor and protect critically endangered black rhinos on communal lands
    in northern Namibia, SRT's trackers come from local communities
- claim: Says it monitors and protects black rhinos on communal lands in northern Namibia,
    with trackers from local communities on long foot patrols.
  url: http://www.savetherhinotrust.org
  fetched: 2026-11-08
  quote: We work to monitor and protect critically endangered black rhinos on communal lands
    in northern Namibia, SRT's trackers come from local communities and possess a deep knowledge
    of rhinos and their surroundings.
- claim: Says it works with government on black rhino conservation.
  url: http://www.savetherhinotrust.org
  fetched: 2026-11-08
  quote: Save the Rhino Trust works with Government facilitating black rhino conservation
    initiatives
