  quote: Individuals are recognised using coded variation in stripe patterns. All
    identifications are from photographs obtained from camera traps and conventional
    digital photography in the field
- claim: The July 2018 page planned to pass population size estimates to stakeholders
    to inform management.
  url: https://www.rufford.org/projects/morris-gosling/what-factors-limit-mountain-zebra-populations-in-namibia-and-when-is-intervention-necessary-for-conservation-management/
