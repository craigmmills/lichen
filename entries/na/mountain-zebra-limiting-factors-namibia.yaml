  quote: Monitoring will continue at five main study sites (Gondwana Canyon Park/Ai-Ais
    National Park, NamibRand National Reserve, Namib-Naukluft National Park, Etosha
    National Park, Hobatere Concession Area) using networks of camera traps and field
    observation.
- claim: The July 2018 page described recognising individuals from stripe patterns
    in camera trap and field photographs.
  url: https://www.rufford.org/projects/morris-gosling/what-factors-limit-mountain-zebra-populations-in-namibia-and-when-is-intervention-necessary-for-conservation-management/
