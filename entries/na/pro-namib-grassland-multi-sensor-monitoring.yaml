summary: Joint project since 2023 between a Göttingen department and NUST monitoring
  Pro-Namib grasslands with several sensors; plans include fusing EnMAP and PRISMA
  hyperspectral imagery with Sentinel-2 and Landsat.
facts:
- claim: Since 2023 the Göttingen department and NUST have run a joint project to
    monitor grasslands with a multi-sensor approach in the Pro-Namib area.
  url: https://www.uni-goettingen.de/en/environmental+monitoring+namibia/652814.html
  fetched: 2026-11-13
  quote: Since 2023, our department has engaged in a joint research project with NUST
    to monitor grasslands using a multi-sensor approach.
- claim: A central aim is a spectral library of the main grassland species from field
    spectra.
  url: https://www.uni-goettingen.de/en/environmental+monitoring+namibia/652814.html
  fetched: 2026-11-13
  quote: A central activity and objective in the project are the measurement of field
    spectra using an institutional ASD-FieldSpec3 spectroradiometer in order to create
    a unique spectral library for the most important grassland species and types.
- claim: It plans to fuse EnMAP and PRISMA hyperspectral imagery with Sentinel-2 and
    Landsat for grassland monitoring.
  url: https://www.uni-goettingen.de/en/environmental+monitoring+namibia/652814.html
  fetched: 2026-11-13
  quote: The targeted integration and data fusion of new emerging hyperspectral satellite
    generations (EnMAP, PRISMA) with multispectral imagery (Sentinel-2, Landsat) and
    field spectroscopy
