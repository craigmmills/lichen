facts:
- claim: On 24 December 2024, 24.kg reported that experts presented the results of
    a comprehensive assessment of Kyrgyzstan's snow leopard population.
  url: https://24.kg/english/315254_285_snow_leopards_live_on_the_territory_of_Kyrgyzstan____/amp/
  fetched: 2026-11-15
  quote: Experts presented the results of a comprehensive assessment of the snow leopard
    population in Kyrgyzstan and measures to conserve the species and its ecosystem.
- claim: The Global Snow Leopard Program's international coordinator said the four-year
    study used camera traps to gather data on the population and habitat.
  url: https://24.kg/english/315254_285_snow_leopards_live_on_the_territory_of_Kyrgyzstan____/amp/
  fetched: 2026-11-15
  quote: the study conducted over the past four years used advanced methods, including
    camera traps, to gather extensive data on the population and habitat of snow leopards.
- claim: The study covered more than 125,000 km2 with more than 875 camera traps and
    estimated 234 to 349 snow leopards.
  url: https://24.kg/english/315254_285_snow_leopards_live_on_the_territory_of_Kyrgyzstan____/amp/
  fetched: 2026-11-15
  quote: Scientists studied over 125,000 square kilometers and installed more than
    875 camera traps. The study revealed that Kyrgyzstan is home to between 234 and
    349 snow leopards.
