summary: Community-based anti-poaching project by NABU and Ilbirs whose main goal, the CMS Central Asian
  Mammals Initiative says, was implementing SMART; a model was customised for Kara-Kujur and mobile devices
  given to local participants.
facts:
- claim: The CMS Central Asian Mammals Initiative says the project's main goal was implementing SMART
    through a community-based approach.
  url: https://cami.cms.int/es/node/41050
  fetched: 2026-11-12
  quote: The primary goal of this initiative was the implementation of the Spatial Monitoring and Reporting
    Tool (SMART) through a community-based approach, enhancing local engagement in anti-poaching activities.
- claim: A SMART model was customised for the Kara-Kujur area and SMART mobile devices given to local
    participants.
  url: https://cami.cms.int/es/node/41050
  fetched: 2026-11-12
  quote: Using preliminary data, a SMART model was customized to address the specific challenges of the
    Kara-Kujur area.
