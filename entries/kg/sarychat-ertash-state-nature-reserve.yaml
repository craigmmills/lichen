summary: Protected area that was one of two SMART pilot sites, where the June 2023
  report said patrol volume and coverage had not increased and teams could reach only
  a small part of the reserve.
facts:
- claim: A CEPF final report of June 2023 names Sarychat-Ertash Strict Nature Reserve
    as one of two pilot sites for SMART-based monitoring and adaptive management of
    patrols.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: Improve protection management in Khan-Tengri National Park and Sarychat-Eertash
    Strict Nature Reserve by establishing SMART-based monitoring and adaptive management
    of patrols.
- claim: The report says data were being collected on all patrols by the two pilot
    sites.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: Good quality data are presently being collected on all patrols by the two
    pilot sites.
- claim: The June 2023 report listed improved protection of the reserve's 134,140
    hectares through SMART as a planned impact, but said patrol volume and coverage
    had not increased and teams could access only a small part of the reserve during
    much of the project.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: 134,140 hectares of Sarychat-Ertash State Nature Reserve under improved protection
    due to introduction of SMART adaptive protection management
- claim: In December 2017, the Snow Leopard Trust reported that conservationists and
    the reserve's rangers had counted wild mountain ungulates in the reserve using
    the double observer method.
  url: https://snowleopard.org/ibex-are-plentiful-in-kyrgyz-nature-reserve
  fetched: 2026-11-15
  quote: In Sarychat, they worked in partnership with the Nature Reserve rangers from
    the State Agency for Environment Protection and Forestry
- claim: A UNDP page dated 20 September 2020 reported the reserve's director saying
    that, with international organisations' help, the reserve was studying snow leopards,
    tracking their movement and keeping records of their numbers.
  url: https://www.undp.org/node/119316
  fetched: 2026-11-15
  quote: with international environmental organizations' help, they are currently
    studying snow leopards, tracking their movement, and keeping records of their
    numbers using modern methods.
