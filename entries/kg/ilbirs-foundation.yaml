summary: Kyrgyz NGO that launched a community anti-poaching project with NABU in 2021; Mongabay reported
  in May 2025 that it supported 10 community conservancies in nine districts with GPS, camera traps and
  patrol gear.
facts:
- claim: The CMS Central Asian Mammals Initiative describes Ilbirs as a Kyrgyz NGO that launched a community
    anti-poaching project with NABU in 2021.
  url: https://cami.cms.int/es/node/41050
  fetched: 2026-11-12
  quote: In 2021, NABU (Nature and Biodiversity Conservation Union) and the Kyrgyz NGO Ilbirs launched
    a project engaging local communities in conservation efforts to combat poaching and protect wildlife
    in specific regions of Kyrgyzstan.
- claim: Mongabay reported in May 2025 that the foundation supported 10 community-based conservancies
    in nine districts and supplied them with GPS, camera traps and patrol gear.
  url: https://news.mongabay.com/2025/05/community-conservancies-in-kyrgyzstan-see-conservation-success-against-illegal-hunting/
  fetched: 2026-11-12
  quote: They support their member conservancies with trainings and GPS, camera traps, patrolling gear,
    walkie-talkies, horses and vehicles to patrol the protected areas.
- claim: 24.kg reports camera traps in the Kara-Kujur area photographed a snow leopard, citing the Ilbirs
    Foundation.
  url: https://24.kg/english/334039_Camera_traps_in_Kara-Kujur_capture_snow_leopard_and_mountain_goats_
  fetched: 2026-11-12
  quote: Camera traps installed in Kara-Kujur area of Naryn region have captured images of a snow leopard
    and mountain goats. Ilbirs Foundation reports.
links:
