  quote: After the workshops, Ilbirs experts initially accompanied local community members in the field
    to ensure effective training in using the tool for practical, on-the-ground monitoring.
- type: partners-with
  to: conservation-x-labs
  url: https://conservationxlabs.com/blog-post/celebrating-the-snow-leopard-a-symbol-of-resilience-of-central-asia-2
  fetched: 2026-11-12
  quote: The program together with the Ilbirs Foundation and other partners in the UN Environment Programme-led
    and IKI-funded Central Asian Mammals and Climate Adaptation (CAMCA) project.
