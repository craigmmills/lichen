summary: Covered Kyrgyzstan’s forests from 2020 to 2023 within a Forest Service project
  funded by a World Bank and GEF grant and loan, with results presented in October
  2023.
facts:
- claim: CAREC says the inventory was carried out from 2020 to 2023 using an international
    methodology.
  url: https://carececo.org/en/main/news/2-ya-natsionalnaya-inventarizatsiya-lesov-v-kyrgyzstane-itogi/
  fetched: 2026-11-13
  quote: The duration of the event is 2020-2023.
- claim: It covered the whole country, including the State Forest Fund, protected
    areas and the forests of other land users.
  url: https://carececo.org/en/main/news/2-ya-natsionalnaya-inventarizatsiya-lesov-v-kyrgyzstane-itogi/
  fetched: 2026-11-13
  quote: was carried out throughout the territory of the republic, including the State
    Forest Fund, the territory of specially protected Natural Territories (protected
    areas), and forests of other land users.
- claim: A final seminar on its results was held on 25 October 2023.
  url: https://carececo.org/en/main/news/2-ya-natsionalnaya-inventarizatsiya-lesov-v-kyrgyzstane-itogi/
  fetched: 2026-11-13
  quote: On October 25, 2023, a final seminar was held to provide the results of the
    2nd National Forest Inventory of Kyrgyzstan
- claim: The executor was a consortium of UNIQUE land use and forestry and CAREC's
    branch in the Kyrgyz Republic.
  url: https://carececo.org/en/main/news/2-ya-natsionalnaya-inventarizatsiya-lesov-v-kyrgyzstane-itogi/
  fetched: 2026-11-13
  quote: The executor of the 2nd National forest inventory was a consortium whose
    members are the German consulting organization Unique land use and forestry and
    a branch of the Regional Environmental Center of Central Asia (CAREC) in the Kyrgyz
    Republic.
- claim: It was carried out within the Forest Service project "Integrated Management
    of Forest Ecosystems in the Kyrgyz Republic", funded by a World Bank and GEF grant
    and loan.
  url: https://carececo.org/en/main/news/2-ya-natsionalnaya-inventarizatsiya-lesov-v-kyrgyzstane-itogi/
