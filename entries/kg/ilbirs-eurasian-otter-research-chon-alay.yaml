summary: Closed field study in Chon-Alay district, run by the Ilbirs Foundation with
  UNDP support, using camera traps and water analyses, which found no stable breeding
  Eurasian otter population in Kyrgyzstan at that time.
facts:
- claim: With UNDP support under the GEF Small Grants Programme, the Ilbirs Foundation
    carried out field research on the Eurasian otter in Chon-Alay district.
  url: https://www.undp.org/kyrgyzstan/stories/eurasian-otter-spotted-again-kyrgyzstan-hope-returns-conservation-endangered-species
  fetched: 2026-11-15
  quote: With support from UNDP under the GEF Small Grants Programme, the Ilbirs Foundation
    conducted extensive field research in the Chon-Alay district.
- claim: The researchers surveyed mountain rivers, installed camera traps, ran chemical
    and biological water analyses and studied fish and terrestrial vertebrates.
  url: https://www.undp.org/kyrgyzstan/stories/eurasian-otter-spotted-again-kyrgyzstan-hope-returns-conservation-endangered-species
  fetched: 2026-11-15
  quote: Researchers surveyed mountain rivers, engaged with local communities, installed
    camera traps, carried out chemical and biological water analyses, and studied
    fish populations and terrestrial vertebrates.
- claim: The findings confirmed that at that time there was no stable breeding otter
    population in Kyrgyzstan.
  url: https://www.undp.org/kyrgyzstan/stories/eurasian-otter-spotted-again-kyrgyzstan-hope-returns-conservation-endangered-species
  fetched: 2026-11-15
  quote: The findings confirmed that, at that time, no stable breeding population
    of otters existed in Kyrgyzstan.
