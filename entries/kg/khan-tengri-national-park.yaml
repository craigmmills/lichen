summary: Protected area that was one of two SMART pilot sites, where SMART patrol
  data showed patrol days rising from 12 to 69 between the first quarters of 2022
  and 2023.
facts:
- claim: A CEPF final report of June 2023 names Khan-Tengri National Park as one of
    two pilot sites where WCS helped introduce SMART for patrol and wildlife monitoring.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: WCS assisted in the introduction of SMART for patrol and wildlife monitoring
    at two pilot sites and KBAs in Kyrgyzstan
- claim: The report says data were being collected on all patrols by the two pilot
    sites.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: Good quality data are presently being collected on all patrols by the two
    pilot sites.
- claim: SMART patrol data showed patrol days at Khan-Tengri rose from 12 to 69 between
    the first quarters of 2022 and 2023.
  url: https://cepf.net/resources/final-project-report/final-project-report-2789
  fetched: 2026-11-15
  quote: Patrol days (i.e., days with at least 1 patrol) increased from 12 days to
    69 days
- claim: In December 2025, UNDP reported that staff of the Khan-Tengri State Nature
    Park had sighted a Eurasian otter on the Turuk River.
  url: https://www.undp.org/kyrgyzstan/stories/eurasian-otter-spotted-again-kyrgyzstan-hope-returns-conservation-endangered-species
  fetched: 2026-11-15
  quote: staff of the Khan-Tengri State Nature Park reported an unexpected sighting
    of a single Eurasian otter on the Turuk River
