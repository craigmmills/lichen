summary: Kyrgyz ministry that, per MTS.kg, prepared the country's seventh national report to the Convention
  on Biological Diversity, and which 24.kg reports took part in a September 2025 camera trap survey of
  snow leopards in Shamshy-Tuyuk reserve.
facts:
- claim: 24.kg reports that the Cabinet amended the regulation on the Department of Biodiversity Conservation
    and Specially Protected Natural Areas under the Ministry of Natural Resources, Ecology and Technical
    Supervision.
  url: https://24.kg/vlast/380549_kabmin_rasshiril_polnomochiya_departamenta_poohrane_zapovednikov_ibioraznoobraziya/
  fetched: 2026-11-12
  quote: Кабмин внес изменения в положение о Департаменте сохранения биоразнообразия и особо охраняемых
    природных территорий при Министерстве природных ресурсов, экологии и технического надзора.
- claim: MTS.kg reports that the ministry carried out the preparation of Kyrgyzstan's seventh national
    report to the Convention on Biological Diversity, which assesses progress against the Kunming-Montreal
    Global Biodiversity Framework.
  url: https://mts.kg/en/ekonomika/21034-kyrgyzstan-predstavit-oon-nacionalnyj-doklad-o-sohranenii-bioraznoobrazija.html
  fetched: 2026-11-12
  quote: The project was carried out by the Ministry of Natural Resources, Ecology and Technical Supervision
    of the Kyrgyz Republic with the support of UNDP and the participation of the ecological movement "BIOM".
- claim: 24.kg, citing the ministry, reports that a ranger of the protected areas section of the ministry's
    Chui regional department and scientists from Japan set 27 camera traps in the Shamshy-Tuyuk reserve
    in September 2025 to estimate snow leopard numbers.
  url: https://24.kg/obschestvo/344410_vzapovednike_shamshyi-tuyuk_ustanovlenyi_fotolovushki_dlya_izucheniya_snejnogo_barsa/
  fetched: 2026-11-12
  quote: С 15 по 21 сентября 2025 года егерь отдела особо охраняемых природных территорий Чуйского регионального
    управления Министерства природных ресурсов, экологии и технического надзора КР совместно с учеными
    из Японии установили 27 фотоловушек
