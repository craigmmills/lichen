summary: Biodiversity app, launched in February 2023 in Kyrgyz and Russian and both
  built and run by CAMP Alatoo, that lets users record and identify species and send
  data to experts for confirmation.
facts:
- claim: The app lets users record observations and identify species by comparing
    their photos with its catalogue; the data go to biodiversity experts for confirmation.
  url: https://camp.kg/mobilnye-prilozheniya/mobilnoe-prilozhenie-tabiyat-kenchi?lang=en
  fetched: 2026-11-13
  quote: Your data will go to biodiversity experts for confirmation of the observation
- claim: CAMP Alatoo's February 2023 launch news said scientists and conservationists
    using the app would be able to monitor rare animal and plant populations and update
    the regional biodiversity database.
  url: https://camp.kg/news/tabiyat-kenchi-novoe-mobilnoe-prilozhenie-po-bioraznoobraziyu-kyrgyzstana?lang=en
  fetched: 2026-11-13
  quote: Scientists and conservationists using the Tabiyat Kenchi app will be able
    to monitor the status of rare animal and plant populations and update the database
    on the region's biodiversity.
- claim: CAMP Alatoo's February 2023 launch news said the app was available in Kyrgyz
    and Russian from Google's and Apple's app stores.
  url: https://camp.kg/news/tabiyat-kenchi-novoe-mobilnoe-prilozhenie-po-bioraznoobraziyu-kyrgyzstana?lang=en
  fetched: 2026-11-13
  quote: The Tabiyat kenchi mobile application in Kyrgyz and Russian is available
    for download from the Google Marketplace and Appstore.
- claim: The idea came from CAMP Alatoo specialists and a Bishkek IT company did the
    technical work.
  url: https://camp.kg/news/tabiyat-kenchi-novoe-mobilnoe-prilozhenie-po-bioraznoobraziyu-kyrgyzstana?lang=en
