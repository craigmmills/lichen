summary: Earth observation project with the ADB that produced land cover, forest type
  and change maps (2019, 2024) covering about 8,558 km2 of Jalal-Abad walnut-fruit
  forests, which the page says national agencies now use.
facts:
- claim: GDA Forest Management, with the ADB, used Earth observation to map forest
    conditions and changes and give Kyrgyzstan's Forest Service data on the walnut-fruit
    forests of Jalal-Abad.
  url: https://knowledge-hub-gda.esa.int/?p=2789
  fetched: 2026-11-15
  quote: GDA Forest Management in collaboration with the ADB used Earth Observation
    to map forest conditions, track changes, and provide Kyrgyzstan’s Forest Service
    with reliable data
- claim: The datasets covered about 8,558 km2 across four State Forest Enterprises,
    with land cover and forest type maps for 2019 and 2024 and change maps for 2019
    to 2024.
  url: https://knowledge-hub-gda.esa.int/?p=2789
  fetched: 2026-11-15
  quote: detailed land cover and forest type maps for 2019 and 2024, and land cover
    and forest change maps for 2019 – 2024
- claim: The page says national agencies now use the products, and that they will
    be refined and integrated into Kyrgyzstan's National Forest Monitoring System.
  url: https://knowledge-hub-gda.esa.int/?p=2789
  fetched: 2026-11-15
  quote: the datasets will be refined with feedback and integrated into Kyrgyzstan’s
    National Forest Monitoring System
