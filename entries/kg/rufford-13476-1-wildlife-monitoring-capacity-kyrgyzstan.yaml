  first snow leopard photos and videos.
facts:
- claim: The project aimed to train rangers and local conservationists to monitor
    wildlife with satellite collars and sensor video and photo cameras.
  url: https://www.rufford.org/projects/maksatbek-anarbaev/capacity-enhancement-for-better-wildlife-conservation-and-monitoring-in-kyrgyzstan/
  fetched: 2026-11-13
  quote: The project aims to work on capacity enhancement of rangers and local conservationists
    for better wild-life conservation and monitoring by using modern technologies
    such as satellite collars, sensor video and photo cameras.
- claim: Rufford lists it under Maksatbek Anarbaev's name, at Sarychat-Ertash Nature
    Reserve.
