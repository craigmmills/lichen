facts:
- claim: The project behind it set out to create a wildlife management system for
    Kyrgyzstan with a database reached through a web interface.
  url: https://caiag.kg/en/projects/118-natsionalnaya-baza-dannykh-kyrgyzstana-dikie-zhivotnye
  fetched: 2026-11-13
  quote: The objective of this project was to create a wildlife management system
    in Kyrgyzstan with data storage in the database with access through the web interface.
- claim: The project loaded and checked data from wildlife observation cards in the
    database.
  url: https://caiag.kg/en/projects/118-natsionalnaya-baza-dannykh-kyrgyzstana-dikie-zhivotnye
  fetched: 2026-11-13
  quote: Loading data from wildlife observation cards, data control, correcting error
    and inaccurate data
- claim: The database was built on PostgreSQL with 36 tables and a site for access,
    including spatial data.
  url: https://caiag.kg/en/projects/118-natsionalnaya-baza-dannykh-kyrgyzstana-dikie-zhivotnye
  fetched: 2026-11-13
  quote: On the basis of the PostgreSQL DBMS, a database consisting of 36 tables was
    created
- claim: The CAIAG page says the project was carried out with the support of the EU's
    FLERMONECA, GIZ and the World Bank, on the initiative of the National Wildlife
    Information Center of Kyrgyzstan.
  url: https://caiag.kg/en/projects/118-natsionalnaya-baza-dannykh-kyrgyzstana-dikie-zhivotnye
  fetched: 2026-11-13
  quote: The project is implemented with the support of the European Union FLERMONECA,
    GIZ and the World Bank on the initiative of the National Wildlife Information
    Center of Kyrgyzstan.
