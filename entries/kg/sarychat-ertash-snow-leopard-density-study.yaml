summary: Snow Leopard Foundation Kyrgyzstan and Snow Leopard Trust study described in a March 2019 field
  blog as Kyrgyzstan's first long-term snow leopard density study, running since 2013, with a plan for
  35 camera traps over three months.
facts:
- claim: A Snow Leopard Trust field blog published in March 2019 describes SLFK and the Trust carrying
    out Kyrgyzstan’s first long-term snow leopard population density study in Sarychat-Ertash since 2013.
  url: https://snowleopard.org/field-tales-camera-trapping-in-sarychat/
  fetched: 2026-11-12
  quote: Since 2013, SLFK and Snow Leopard Trust have been working in Sarychat-Ertash, carrying out the
    first long-term snow leopard population density study ever done in Kyrgyzstan.
- claim: The March 2019 field blog describes a plan for three teams to set 35 camera traps across the
    reserve’s two main valleys for three months.
  url: https://snowleopard.org/field-tales-camera-trapping-in-sarychat/
  fetched: 2026-11-12
  quote: In three teams, we will be covering the two main valleys of Sarychat-Ertash to set up in total
    35 cameras traps, which will stay in the reserve for the next three months.
