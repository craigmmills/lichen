id: cbit-afolu-equatorial-guinea
kind: project
name: Enhancing Equatorial Guinea's institutional and technical capacity in the agriculture, forestry
  and other land-use sector for enhanced transparency under the Paris Agreement
also_known_as: []
scope: gq
ai_label: data-infrastructure
realms:
- land
status: active
summary: GEF-funded forest data project launched in Bata in June 2021 with USD 1,400,138, aiming to improve
  inventories, with INCOMA and INDEFOR-AP assigned responsibility for execution.
facts:
- claim: Launched in Bata in June 2021 by FAO and the government of Equatorial Guinea, funded by the GEF
    with USD 1,400,138.
  url: https://www.fao.org/in-action/boosting-transparency-forest-data/news-and-events/news/detail/GEF-finances-a-USD-1-million-project-to-improve-the-management-of-Equatorial-Guinean-forests/en
  fetched: 2026-11-12
  quote: This project has been funded by the Global Environment Facility (GEF), with a total of USD 1
    400 138 to support the country in the sustainable management of Equatorial Guinea’s forests.
- claim: At the June 2021 launch, INCOMA and INDEFOR-AP were assigned technical responsibility and overall
    project execution, with FAO to provide technical oversight as GEF agency.
  url: https://www.fao.org/in-action/boosting-transparency-forest-data/news-and-events/news/detail/GEF-finances-a-USD-1-million-project-to-improve-the-management-of-Equatorial-Guinean-forests/en
  fetched: 2026-11-12
  quote: INCOMA and INDEFOR-AP will have technical responsibility and overall project execution, and FAO
    will provide technical oversight as a GEF Agency.
- claim: Aims to set up processes to generate quality data for forest management and to improve the inventory
    data.
  url: https://www.fao.org/in-action/boosting-transparency-forest-data/news-and-events/news/detail/GEF-finances-a-USD-1-million-project-to-improve-the-management-of-Equatorial-Guinean-forests/en
  fetched: 2026-11-12
  quote: it will deepen the knowledge of the forestry sector to support its management, improve the inventory
    data and report on the commitments of Nationally Determined Contributions.
