summary: International conservation NGO, formerly the Equatorial Guinea Bird Initiative,
  working mainly in Equatorial Guinea; it has run camera-trap surveys in Oyala since
  2015 and runs a mammal camera-trapping project.
facts:
- claim: Describes itself as an international nature conservation NGO.
  url: https://biodiversityinitiative.org/?p=1770
  fetched: 2026-11-13
  quote: Biodiversity Initiative is an international nature conservation NGO that
    exists to conserve biodiversity through ecology, exploration and education.
- claim: Says it works predominantly in Equatorial Guinea.
  url: https://biodiversityinitiative.org/?p=1770
  fetched: 2026-11-13
  quote: BI works predominantly in Equatorial Guinea, the only Spanish-speaking country
    in Africa.
- claim: Was previously known as the Equatorial Guinea Bird Initiative.
  url: https://biodiversityinitiative.org/?p=70
  fetched: 2026-11-13
  quote: Biodiversity Initiative (then known as Equatorial Guinea Bird Initiative)
- claim: With INDEFOR-AP it developed an enforcement plan for conservadores to deploy
    camera traps in protected areas.
  url: https://biodiversityinitiative.org/initiatives/equatorial-guinea-mammals/
  fetched: 2026-11-13
  quote: Biodiversity Initiative, in partnership with INDEFOR-AP, developed an enforcement
    plan focused on getting conservadores into PAs to deploy camera traps.
- claim: Has run biodiversity surveys with camera traps in Oyala since 2015 and uses
    the photographic data to identify biodiversity hotspots and populations of vulnerable
    wildlife.
  url: https://biodiversityinitiative.org/?p=1115
  fetched: 2026-11-13
  quote: Biodiversity Initiative has been conducting biodiversity surveys in the village
    of Oyala in central Equatorial Guinea since 2015.
- claim: Says it is using camera trap data to map areas of biological significance
    in protected areas that may be vulnerable to illegal activities.
  url: https://biodiversityinitiative.org/?p=1115
  fetched: 2026-11-13
  quote: we are creating maps identifying areas of biological significance in Protected
    Areas
- claim: Its personnel page lists Tiff DeGroot, a Ph.D. candidate in the Brzeski and
    Wolfe Laboratories, using camera trapping and DNA metabarcoding of carrion flies
    to survey mammals in Equatorial Guinea.
  url: https://biodiversityinitiative.org/about/personnel/
  fetched: 2026-11-13
  quote: She is using camera trapping and DNA metabarcoding of carrion flies, a promising
    new genetic method, to survey mammals in Equatorial Guinea.
- claim: Its Ureka road study asks how the bird community changes along the road compared
    with the rainforest interior.
  url: https://biodiversityinitiative.org/?p=275
  fetched: 2026-11-13
  quote: How the community of birds changes along the road vs. in the rainforest interior
