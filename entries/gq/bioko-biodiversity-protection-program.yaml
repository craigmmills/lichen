summary: Academic and research partnership between Drexel and UNGE on Bioko Island, reported by Drexel
  in March 2020 as having started in 1998 and employing Equatoguineans.
facts:
- claim: A March 2020 Drexel article described it as an academic and research partnership between Drexel
    and UNGE promoting conservation and environmental research on Bioko Island.
  url: https://drexel.edu/news/archive/2020/march/in-equatorial-guinea-drexel-leaders-deepen-longstanding-research-partnership
  fetched: 2026-11-12
  quote: an academic and research partnership between Drexel and the Universidad Nacional de Guinea Ecuatorial
    (UNGE) that promotes conservation efforts and environmental research on the country’s Bioko Island.
- claim: In March 2020, Drexel reported that the programme employed Equatoguineans to run the Moka Wildlife
    Center research station and seasonal research camps and to conduct and monitor biodiversity research.
  url: https://drexel.edu/news/archive/2020/march/in-equatorial-guinea-drexel-leaders-deepen-longstanding-research-partnership
  fetched: 2026-11-12
  quote: The Bioko program works with and employs Equatoguineans to run the research station and seasonal
    research camps, conduct and monitor biodiversity research
- claim: A March 2020 Drexel article showed its beach research site monitoring marine turtle nesting grounds.
  url: https://drexel.edu/news/archive/2020/march/in-equatorial-guinea-drexel-leaders-deepen-longstanding-research-partnership
  fetched: 2026-11-12
  quote: the Bioko program's research site on a beach monitoring marine turtles’ nesting grounds.
- claim: According to Drexel in March 2020, the programme started in 1998 and had been operated by Drexel
    since 2007.
  url: https://drexel.edu/news/archive/2020/march/in-equatorial-guinea-drexel-leaders-deepen-longstanding-research-partnership
  fetched: 2026-11-12
  quote: which was officially started in 1998 and has been operated by Drexel since 2007.
