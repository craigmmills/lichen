summary: Run by Bioko Biodiversity Protection Program, Moka's research station was
  called nationally unique for continuous operation in 2020, with laboratory, training
  and climate monitoring reported in 2008.
facts:
- claim: A March 2020 Drexel article calls it Equatorial Guinea's first and only continuously
    operated research station.
  url: https://drexel.edu/news/archive/2020/march/in-equatorial-guinea-drexel-leaders-deepen-longstanding-research-partnership
  fetched: 2026-11-13
  quote: Equatorial Guinea’s first and only continuously operated research station,
    the Moka Wildlife Center.
- claim: A 2008 Drexel release says the field station consists of a staff house and
    a research lab in the highlands village of Moka.
  url: https://drexel.edu/news/archive/2008/july/drexel-professors-mission-to-conserve-african-wildlife-reaches-new-milestone
  fetched: 2026-11-13
  quote: The field station consists of a staff house and a research lab in the highlands
    village of Moka.
- claim: The same 2008 release says the station has hosted training courses in GPS
    and wildlife monitoring strategies for local Equatoguineans.
  url: https://drexel.edu/news/archive/2008/july/drexel-professors-mission-to-conserve-african-wildlife-reaches-new-milestone
  fetched: 2026-11-13
  quote: The field station has hosted training courses in global positioning systems
    (GPS) and wildlife monitoring strategies for local Equatoguineans
- claim: The same 2008 release says the station serves as a climate monitoring site
    that tracks temperature, rainfall and the condition of surrounding trees.
  url: https://drexel.edu/news/archive/2008/july/drexel-professors-mission-to-conserve-african-wildlife-reaches-new-milestone
  fetched: 2026-11-13
  quote: measuring temperatures and rainfall and tracking the condition of surrounding
    trees
