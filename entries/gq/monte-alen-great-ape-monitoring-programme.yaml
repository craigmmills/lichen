summary: Bristol Zoological Society programme begun in 2019, described in June 2020 as using cameras,
  bioacoustics, surveys and invertebrate DNA, with 20 cameras by August 2019 and more planned.
facts:
- claim: Bristol Zoological Society started a research, monitoring and conservation programme in Monte
    Alén National Park in 2019.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/a-long-term-monitoring-programme-for-great-apes-in-monte-alen-national-park/
  fetched: 2026-11-12
  quote: in 2019, BZS initiated a research, monitoring and conservation programme in Equatorial Guinea's
    Monte Alén National Park (MANP).
- claim: A June 2020 account described the programme as using camera trapping, bioacoustics, transect
    and recce surveys, and invertebrate DNA.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/a-long-term-monitoring-programme-for-great-apes-in-monte-alen-national-park/
  fetched: 2026-11-12
  quote: This programme utilizes multiple techniques to enhance our detection rate for rare or cryptic
    species, including camera trapping, bioacoustics, transect and recce surveys, and invertebrate DNA.
- claim: By August 2019 the camera trap network had 20 cameras, with more than 30 planned for 2020 to
    2021.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/a-long-term-monitoring-programme-for-great-apes-in-monte-alen-national-park/
  fetched: 2026-11-12
  quote: As of August 2019, we expanded our camera trap network (n = 20)
