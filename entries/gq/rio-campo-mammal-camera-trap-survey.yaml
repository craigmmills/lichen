summary: Closed camera-trap survey run by INDEFOR-AP at 66 sites in Rio Campo Nature
  Reserve in 2017 and 2019, with hurdle models relating mammal presence and abundance
  to human impact and habitat.
facts:
- claim: An article on berggorilla.org, written in the first person, says camera-trap
    data were collected at 66 sites across most of the reserve, in 2017 (26 sites)
    and 2019 (40 sites).
  url: https://www.berggorilla.org/en/home/news-archive/article-view/rio-campo-schutzgebiet-in-aequatorial-guinea/
  fetched: 2026-11-13
  quote: we collected camera trap data at 66 sites across the majority of the reserve
    (except for the northernmost portion), in 2017 (n = 26) and 2019 (n = 40)
- claim: The same article says species distributions were reported to INDEFOR-AP to
    assist its management of the reserve's mammals.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/rio-campo-schutzgebiet-in-aequatorial-guinea/
  fetched: 2026-11-13
  quote: Species distributions were reported to INDEFOR-AP to assist in their management
    of Rio Campo
- claim: The 2023 article hosted on Biodiversity Initiative's site reports that INDEFOR-AP
    field teams deployed Bushnell Trophycam HD cameras.
  url: https://biodiversityinitiative.org/wp-content/uploads/2023/01/DeGroot-et-al_2023_Human-impacts-on-mammal-communities-in-Rio-Campo-Nature-Reserve-EG.pdf
  fetched: 2026-11-13
  quote: INDEFOR- AP field teams deployed 61 Bushnell Trophycam HD
- claim: The same article says the models used two-step hurdle models of taxonomic
    group presence and relative abundance against human impact and habitat variables.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/rio-campo-schutzgebiet-in-aequatorial-guinea/
  fetched: 2026-11-13
  quote: we used two-step or 'hurdle' models to assess 1) presence of taxonomic groups
    and 2) relative abundance of each group
