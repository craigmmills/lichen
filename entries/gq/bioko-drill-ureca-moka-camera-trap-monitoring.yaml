facts:
- claim: The project page, dated 15 December 2025, is listed under Equatorial Guinea
    on the Rufford Foundation's projects pages; it plans to give updated baseline
    data on the distribution, occupancy and approximate density of the Bioko drill
    in the Ureca-Moka corridor.
  url: https://www.rufford.org/projects/laura-simo-trillo/monitoring-drill-populations-in-the-urecamoca-corridor-southern-bioko-integrating-non-invasive-methods-along-an-ancient-hunting-trail/
  fetched: 2026-11-13
  quote: This project aims to generate updated, robust baseline data on the distribution,
    occupancy, and approximate density of the Bioko drill within the Ureca–Moka corridor
- claim: Plans twenty camera traps placed semi-randomly using QGIS, running from October
    to May, along a 20 km transect between Ureca and Moka.
  url: https://www.rufford.org/projects/laura-simo-trillo/monitoring-drill-populations-in-the-urecamoca-corridor-southern-bioko-integrating-non-invasive-methods-along-an-ancient-hunting-trail/
  fetched: 2026-11-13
  quote: Twenty camera traps will be deployed semi-randomly using QGIS
- claim: Plans single-season occupancy models for detection probability and site occupancy,
    and Random Encounter Models for approximate density.
  url: https://www.rufford.org/projects/laura-simo-trillo/monitoring-drill-populations-in-the-urecamoca-corridor-southern-bioko-integrating-non-invasive-methods-along-an-ancient-hunting-trail/
  fetched: 2026-11-13
  quote: Data analysis will use single-season occupancy models to estimate detection
    probability and site occupancy
- claim: Plans to train INDEFOR-AP technicians as part of the project.
