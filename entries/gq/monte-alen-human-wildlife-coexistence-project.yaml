summary: Bristol Zoological Society reports monitoring crop foraging in 15 Monte Alén
  villages using camera traps and surveys, and setting up elephant-deterrent Rapid
  Response Units in October 2024.
facts:
- claim: Bristol Zoological Society says it is monitoring levels of crop foraging
    in 15 villages around Monte Alén National Park with camera traps and surveys.
  url: https://bristolzoo.org.uk/conservation/equatorial-guinea
  fetched: 2026-11-15
  quote: We are monitoring levels of crop foraging in 15 villages around Monte Alen
    National Park, using a combination of camera traps and surveys
- claim: The project engages local communities on their perceptions of wildlife in
    the park and looks for ways to reduce conflict between people and wildlife.
  url: https://bristolzoo.org.uk/conservation/equatorial-guinea
  fetched: 2026-11-15
  quote: This exciting new project is engaging with local communities to understand
    people’s perceptions of wildlife in the park and investigate ways to reduce conflicts
    between people and wildlife.
- claim: In October 2024 Bristol Zoological Society reported setting up Rapid Response
    Units to deter elephants from farms as a new element of the project.
  url: https://www.bristolzoo.org.uk/news/supporting-human-elephant-coexistence-in-equatorial-guinea
  fetched: 2026-11-15
  quote: A key aim of their visit was to set up an exciting new element of our human-elephant
    coexistence project - Rapid Response Units to help prevent elephant crop foraging.
