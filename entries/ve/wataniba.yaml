summary: Civil society organisation promoting sustainable territorial management in the Venezuelan Amazon,
  which says it monitors mining, deforestation and burning by satellite; Mongabay reported in 2023 that
  it found 70 illegal mining sites.
facts:
- claim: Mongabay reported in 2023 that Wataniba's satellite monitoring found 70 illegal mining sites
    and 934 hectares deforested in Ye'kwana and Sanema territory.
  url: https://es.mongabay.com/2023/08/venezuela-focos-de-mineria-ilegal-deforestacion-en-territorio-yekwana-y-sanema/
  fetched: 2026-11-08
  quote: según un monitoreo satelital con fecha de mayo de 2023 de la organización de la sociedad civil
    venezolana Wataniba
- claim: Mongabay reported in 2023 that Wataniba carried out continuous satellite monitoring in the area.
  url: https://es.mongabay.com/2023/08/venezuela-focos-de-mineria-ilegal-deforestacion-en-territorio-yekwana-y-sanema/
  fetched: 2026-11-08
  quote: Todas estas cifras son parte del monitoreo satelital que realiza continuamente Wataniba en la
    zona.
- claim: A civil society organisation promoting sustainable territorial management in the Venezuelan Amazon,
    with offices in Caracas and Puerto Ayacucho.
  url: https://watanibasocioambiental.org/wataniba/
  fetched: 2026-11-08
  quote: Tenemos sede en Caracas y en Puerto Ayacucho.
- claim: Says it continuously monitors pressures and threats in the Venezuelan Amazon, with emphasis on
    mining, deforestation and burning.
  url: https://watanibasocioambiental.org/wataniba/
  fetched: 2026-11-08
  quote: con énfasis en aspectos como la minería, la deforestación y las quemas a través del monitoreo
    contínuo de las presiones y amenazas de la Amazonía venezolana
- claim: Combines local knowledge with interpretation of satellite images to produce information for decisions.
  url: https://watanibasocioambiental.org/wataniba/
  fetched: 2026-11-08
  quote: Generamos información intercultural para la toma de decisiones conjugando el conocimiento de
    los habitantes locales con la interpretación de imágenes satelitales.
- claim: Monitors mining activity across the 470,000 km2 of the Venezuelan Amazon.
  url: https://watanibasocioambiental.org/
  fetched: 2026-11-08
  quote: Monitoreo de la actividad minera en los 470.000 km2 de la Amazonia venezolana.
