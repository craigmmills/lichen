summary: Bird monitoring project that Mongabay reported in August 2019 had recorded
  224 resident Venezuelan and eight migratory species, begun in 2017 and awaiting
  results of a second monitoring round; it partners with Provita.
facts:
- claim: Mongabay reported in August 2019 that the project had recorded 224 resident
    Venezuelan bird species and eight migratory species and was awaiting results of
    a second monitoring round.
  url: https://es.mongabay.com/2019/08/venezuela-aves-cafe/
  fetched: 2026-11-12
  quote: “Hasta la fecha el proyecto ha reportado la presencia de 224 especies de
    aves venezolanas residentes y ocho migratorias estadounidenses, aunque se presume
    que puede haber hasta 35 especies de aves migratorias en esta región”, dice Arrieta,
    mientras esperan resultados del segundo monitoreo.
- claim: Mongabay says Luis Arrieta joined Miguel Árvelo of Provita and the work began
    in 2017.
  url: https://es.mongabay.com/2019/08/venezuela-aves-cafe/
  fetched: 2026-11-12
  quote: Luis Arrieta se juntó entonces con Miguel Árvelo de Provita y se pusieron
    a trabajar. La aventura comenzó en el 2017.
- claim: Mongabay says many of the birds were identified by song with the help of
    Provita ornithologist Jhonathan Miranda.
  url: https://es.mongabay.com/2019/08/venezuela-aves-cafe/
  fetched: 2026-11-12
  quote: Muchas de estas aves han sido identificadas por su canto con la ayuda del
    ornitólogo Jhonathan Miranda de Provita.
