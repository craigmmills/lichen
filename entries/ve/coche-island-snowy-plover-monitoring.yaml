summary: Snowy Plover population survey on Coche Island, run by AveZona and the ARA MACAO
  Scientific Foundation, begun formally in 2019 with monthly visits and funded by BirdsCaribbean;
  led by Josmar Márquez.
facts:
- claim: In March 2020, BirdsCaribbean reported that AveZona and the ARA MACAO Scientific
    Foundation had carried out population surveys of Snowy Plovers on Coche Island with support
    from its David S. Lee Fund.
  url: https://www.birdscaribbean.org/?p=8193
  fetched: 2026-11-12
  quote: thanks to the support of the BirdsCaribbean David S. Lee Fund , AveZona and the ARA
    MACAO Scientific Foundation have carried out population surveys of Snowy Plovers
- claim: The post says the project began formally in 2019 with monthly monitoring visits to
    the San Pedro de Coche salt pans.
  url: https://www.birdscaribbean.org/?p=8193
  fetched: 2026-11-12
  quote: Our project formally began in 2019, and since then we have conducted monitoring visits
    monthly to the San Pedro de Coche salt pans.
- claim: The March 2020 post says the team was partnering with Adrián Naveda-Rodríguez of
    Mississippi State University on the plover's detectability and abundance, using counts
    at 12 points in the San Pedro de Coche salt pans.
  url: https://www.birdscaribbean.org/?p=8193
  fetched: 2026-11-12
  quote: Together, we are working on the detectability and abundance of the Snowy Plover in
    eastern Venezuela.
