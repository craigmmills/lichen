summary: Venezuelan non-profit founded in 1987 that says it co-leads MapBiomas Venezuela and reported
  ringing 159 parrot fledglings and counting 3,203 wild parrots in Macanao in 2026.
facts:
- claim: Runs a programme assessing the conservation status of ecosystems in Venezuela and worldwide (Lista
    Roja de Ecosistemas).
  url: https://provita.org.ve/
  fetched: 2026-11-08
  quote: Programa de evaluación del estado de conservación de los ecosistemas de Venezuela y el mundo
- claim: Its news page lists an April 2022 report that it implemented a camera-trap system to monitor
    species in Macanao.
  url: https://www.provita.org.ve/?p=1127
  fetched: 2026-11-08
  quote: Provita implementa sistema de cámaras trampa para monitoreo de especies en Macanao
- claim: Its news page lists a July 2022 report of ringing parrot chicks to monitor individuals.
  url: https://www.provita.org.ve/?p=1127
  fetched: 2026-11-08
  quote: Provita coloca anillos a pichones de cotorras para monitoreo de individuos
- claim: SWOT describes a 2024 grant for an in-water sea turtle research programme in the Gulf of Paria,
    alongside nesting beach monitoring.
  url: https://www.seaturtlestatus.org/swot-grantees/provita-2024
  fetched: 2026-11-08
  quote: This initiative complements ongoing nesting beach monitoring and strengthens collaboration with
    Macuro’s artisanal fishers
- claim: A non-profit civil association founded in February 1987.
  url: https://www.provita.org.ve/2026/09/24/215-nuevas-cotorras-pintan-los-cielos-de-margarita-con-sus-vuelos-durante-2026/
  fetched: 2026-11-08
  quote: Provita es una Asociación Civil sin fines de lucro, fundada en febrero de 1987
- claim: Has an office in Caracas.
  url: https://www.provita.org.ve/contacto/
  fetched: 2026-11-08
  quote: Caracas, Venezuela.
- claim: Says it has been part of MapBiomas since 2017 and co-leads MapBiomas Venezuela with LSIGMA-USB
    and Wataniba.
  url: https://www.provita.org.ve/programas/mapbiomasvenezuela/
  fetched: 2026-11-08
  quote: la cual co-lideramos junto a nuestros aliados de LSIGMA-USB y Wataniba
- claim: Says it developed the database that compiles IUCN Red List of Ecosystems assessments and manages
    that initiative's website and social media.
  url: https://www.provita.org.ve/programas/lista-roja-de-ecosistemas/
  fetched: 2026-11-08
  quote: Desarrollar la base de datos que compila las evaluaciones de la Lista Roja de Ecosistemas de
    la UICN , incluyendo cientos de ecosistemas de todo el mundo.
- claim: Says it has published six datasets to GBIF.
  url: https://www.provita.org.ve/programas/lista-roja-de-especies-amenazadas/
  fetched: 2026-11-08
  quote: Hemos publicado 6 conjuntos de datos y contribuimos a la capacitación de otros profesionales
    para la incorporación de más datos de la biodiversidad venezolana a la plataforma internacional GBIF
- claim: In its September 2026 report, Provita describes monitoring yellow-shouldered parrot nests on
    Margarita Island and ringing 159 fledglings during the 2026 breeding season to identify individual
    birds.
  url: https://www.provita.org.ve/2026/09/24/215-nuevas-cotorras-pintan-los-cielos-de-margarita-con-sus-vuelos-durante-2026/
  fetched: 2026-11-08
  quote: Durante esta temporada también anillamos 159 volantones, lo que nos permite identificar individualmente
    a cada ave
- claim: Its Geoportal offers a downloadable layer of the boundaries of Venezuela's protected natural
    areas.
  url: https://geoportal.provita.org.ve/
  fetched: 2026-11-08
  quote: Contiene los límites de demarcación de las áreas naturales protegidas de Venezuela.
- claim: Says it is a Venezuelan non-profit, non-governmental organisation founded in 1987.
  url: https://api.gbif.org/v1/organization/c98078af-00d2-40c6-b5ea-5d0d6c7e93c7
  fetched: 2026-11-08
  quote: Founded in 1987, Provita is a Venezuelan non-profit, non-governmental organization whose mission
    is to develop innovative socio-environmental solutions to conserve nature.
- claim: Says it co-leads MapBiomas Venezuela with LSIGMA-USB and Wataniba, after working on MapBiomas
    Amazonía since 2017.
  url: https://www.provita.org.ve/programas/mapbiomasvenezuela/
  fetched: 2026-11-08
  quote: mediante la iniciativa MapBiomas Venezuela , la cual co-lideramos junto a nuestros aliados de
    LSIGMA-USB y Wataniba.
- claim: Says the first MapBiomas Venezuela collection gives annual maps of land cover and land use change
    in Venezuela from 1985 to the present.
  url: https://www.provita.org.ve/programas/mapbiomasvenezuela/
  fetched: 2026-11-08
  quote: la cual ofrece mapas anuales que muestran las transformaciones en la cobertura y el uso de la
    tierra en el territorio venezolano desde 1985 al presente.
- claim: Says it completed the first national assessment of Venezuela's ecosystems, published as the Red
    Book of the Terrestrial Ecosystems of Venezuela.
  url: https://www.provita.org.ve/programas/lista-roja-de-ecosistemas/
  fetched: 2026-11-08
  quote: Completar la primera evaluación nacional de ecosistemas, con la publicación del Libro Rojo de
    Los Ecosistemas Terrestres de Venezuela.
- claim: Says it developed the database that compiles IUCN Red List of Ecosystems assessments.
  url: https://www.provita.org.ve/programas/lista-roja-de-ecosistemas/
  fetched: 2026-11-08
  quote: Desarrollar la base de datos que compila las evaluaciones de la Lista Roja de Ecosistemas de
    la UICN
- claim: Reported in September 2026 that its Margarita parakeet programme counted 3,203 wild birds in
    Macanao in a population census after the breeding season.
  url: https://www.provita.org.ve/2026/09/24/215-nuevas-cotorras-pintan-los-cielos-de-margarita-con-sus-vuelos-durante-2026/
  fetched: 2026-11-08
  quote: contabiliza 3203 individuos de la especie en vida silvestre en Macanao, de acuerdo con el censo
    poblacional realizado una vez finalizada la temporada reproductiva.
