website: https://venezuela.mapbiomas.org
summary: Collaborative network, built by Provita, Wataniba, LSIGMA-USB and RAISG, producing free annual
  land cover maps from 1985 using Landsat and machine learning on Google Earth Engine, with new modules
  released in 2026.
facts:
- claim: In March 2026 it released a beta collection with modules on vegetation loss and secondary vegetation.
  url: https://venezuela.mapbiomas.org/en/?p=10
  fetched: 2026-11-08
  quote: 'Estos datos forman parte del lanzamiento de la Colección Beta de los nuevos datos de MapBiomas
    Venezuela: los módulos de Pérdida de Vegetación y Vegetación Secundaria'
- claim: The new collections are publicly and freely available.
  url: https://venezuela.mapbiomas.org/en/?p=10
  fetched: 2026-11-08
  quote: Los datos de estas nuevas colecciones están disponibles de forma pública y gratuita
- claim: A collaborative network producing historical series of land cover, land use and surface water
    maps for Venezuela from 1985, excluding Isla de Aves, shared publicly and free of charge.
  url: https://venezuela.mapbiomas.org/
  fetched: 2026-11-08
  quote: Producimos series históricas de mapas de cobertura y uso del suelo y de la superficie de agua,
    que datan de 1985, abarcando toda Venezuela.
- claim: The annual maps are classified pixel by pixel from Landsat imagery with machine learning algorithms
    on Google Earth Engine.
  url: https://venezuela.mapbiomas.org/iniciativas-y-productos/metodologia-mapbiomas/vision-general/
  fetched: 2026-11-08
  quote: Todo el proceso es realizado con algoritmos de aprendizaje automático (machine learning) a través
    de la plataforma Google Earth Engine
- claim: Runs an award, the Premio MapBiomas Venezuela, for work that uses its data, now in its second
    edition.
  url: https://venezuela.mapbiomas.org/premio-mapbiomas/
  fetched: 2026-11-08
  quote: La Segunda Edición del Premio MapBiomas Venezuela es co-organizada por la red MapBiomas Venezuela,
    bajo la coordinación de Provita, Wataniba y el Laboratorio de Sistemas de Información Geográfica y
    Modelado Ambiental de la Universidad Simón Bolívar (LSIGMA-USB).
- claim: Provita says the first MapBiomas Venezuela collection gives annual maps of land cover and land
    use change in Venezuela from 1985 to the present.
  url: https://www.provita.org.ve/programas/mapbiomasvenezuela/
  fetched: 2026-11-08
  quote: la cual ofrece mapas anuales que muestran las transformaciones en la cobertura y el uso de la
    tierra en el territorio venezolano desde 1985 al presente.
- claim: Provita says it co-leads the initiative with LSIGMA-USB and Wataniba.
  url: https://www.provita.org.ve/programas/mapbiomasvenezuela/
  fetched: 2026-11-08
  quote: mediante la iniciativa MapBiomas Venezuela , la cual co-lideramos junto a nuestros aliados de
    LSIGMA-USB y Wataniba.
- claim: Provita reported in April 2026 three new modules on vegetation loss, secondary vegetation and
    urban areas, with the data free on the MapBiomas Venezuela website.
  url: https://www.provita.org.ve/2026/04/24/mapbiomas-venezuela-sigue-creciendo-nuevos-lanzamientosnuevos-datos-disponibles-para-el-publico-sobre-los-cambios-en-elterritorio-venezolano/
  fetched: 2026-11-08
  quote: ya están disponibles tres nuevos módulos de información asociados a los datos de Cobertura y
    Uso del Suelo de la plataforma, que permiten monitorear los cambios en nuestro territorio
- claim: Provita says the initiative was co-created by Provita, Wataniba, LSIGMA-USB and RAISG.
  url: https://www.provita.org.ve/2026/04/24/mapbiomas-venezuela-sigue-creciendo-nuevos-lanzamientosnuevos-datos-disponibles-para-el-publico-sobre-los-cambios-en-elterritorio-venezolano/
  fetched: 2026-11-08
  quote: MapBiomas Venezuela es una iniciativa co-creada por Provita, Wataniba, el Laboratorio de Sistemas
    de Información Geográfica y Modelado Ambiental de la Universidad Simón Bolívar (LSIGMA–USB) y la Red
    Amazónica de Información Socioambiental Georreferenciada (RAISG)
