summary: Venezuelan NGO researching and protecting jaguar habitat, whose founder told
  Mongabay (2020) it estimated 3.37 jaguars per 100 km2 south of Lake Maracaibo, with
  camera trap monitoring planned.
facts:
- claim: El Diario (2022) describes Proyecto Sebraba as an NGO focused on research,
    protection and conservation of the jaguar's habitat in Venezuela.
  url: https://eldiario.com/2022/11/17/proyecto-sebraba-para-la-proteccion-del-jaguar-en-venezuela/
  fetched: 2026-11-13
  quote: La ONG Proyecto Sebraba es una iniciativa centrada en la investigación, protección
    y conservación del hábitat del jaguar en Venezuela.
- claim: Its founder told El Diario (2022) that the research began south of Lake Maracaibo
    and has added regions in northern Amazonas and Cojedes.
  url: https://eldiario.com/2022/11/17/proyecto-sebraba-para-la-proteccion-del-jaguar-en-venezuela/
  fetched: 2026-11-13
  quote: La investigación comenzó en el sur del lago de Maracaibo y ahora se han incorporado
    dos regiones más.
- claim: Its founder told Mongabay (2020) that it estimated 3.37 jaguars per 100 km2
    south of Lake Maracaibo and planned to keep monitoring with camera traps.
  url: https://es.mongabay.com/2020/03/venezuela-maria-fernanda-puerto-jaguares-entrevista-video/
  fetched: 2026-11-13
  quote: La idea es seguir monitoreando con cámaras trampa para ir corrigiendo y ajustando
    esa información con los años.
