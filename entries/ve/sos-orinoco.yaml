summary: Organisation reported by El Diario and Mongabay to detect mining using satellite imagery; El
  Diario also reported its August 2026 report of a 5.8-hectare illegal mine in Canaima.
facts:
- claim: El Diario reported in 2022 that SOS Orinoco detected mining rafts on rivers in high-resolution
    satellite imagery.
  url: https://eldiario.com/2022/02/26/sos-orinoco-parque-nacional-canaima/
  fetched: 2026-11-08
  quote: En imágenes satelitales de alta resolución, la organización detectó hasta 10 balsas mineras circulando
    por los ríos.
- claim: El Diario reported that SOS Orinoco published a monthly bulletin on Canaima National Park on
    23 February 2022.
  url: https://eldiario.com/2022/02/26/sos-orinoco-parque-nacional-canaima/
  fetched: 2026-11-08
  quote: Así lo denunció la organización ambientalista SOS Orinoco el 23 de febrero de 2022, en su boletín
    mensual sobre la situación de esta área protegida.
- claim: Mongabay (2023) cites its satellite image detection systems for a mining site on the Metacuni
    river.
  url: https://es.mongabay.com/2023/08/venezuela-focos-de-mineria-ilegal-deforestacion-en-territorio-yekwana-y-sanema/
  fetched: 2026-11-08
  quote: según sus sistemas de detección de imágenes satelitales
- claim: El Diario reported in August 2026 that SOS Orinoco had reported a new illegal mine of 5.8 hectares
    inside Canaima National Park.
  url: https://eldiario.com/2026/08/13/sos-orinoco-denuncia-nueva-mina-ilegal-parque-nacional-canaima/
  fetched: 2026-11-08
  quote: de 5,8 hectáreas dentro del Parque Nacional Canaima de Venezuela
