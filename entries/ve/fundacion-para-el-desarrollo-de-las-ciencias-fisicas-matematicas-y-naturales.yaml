summary: Non-profit civil society organisation founded in 1973 by the Academy of Sciences,
  whose FUDECI team has, per a funder's report, worked since October 2024 to bolster
  the Rancho Grande harlequin toad population.
facts:
- claim: An article in Tribuna del Investigador on its 45 years of work calls it a
    non-profit civil society organisation founded in 1973 by the Academy of Sciences.
  url: https://www.tribunadelinvestigador.com/download/article/217
  fetched: '2026-11-15'
  quote: Organización de la Sociedad Civil (OSC) sin fines de lucro, fundada en 1973
    por la Academia de Ciencias
- claim: The Mohamed bin Zayed Species Conservation Fund's report says Margarita Lampo
    and her team at FUDECI have been acting since October 2024 to bolster and genetically
    diversify the Rancho Grande harlequin toad population.
  url: https://reports.speciesconservation.org/?p=5897
  fetched: '2026-11-15'
  quote: Dr Margarita Lampo and her team at la Fundación para el Desarrollo de las
    Ciencias Físicas, Matemáticas y Naturales (FUDECI) have been taking action since
    October 2024 to bolster and genetically diversify the population.
- claim: The same report says the team has since been monitoring the released captive-bred
    population, tracking health and survival through capture and release.
  url: https://reports.speciesconservation.org/?p=5897
  fetched: '2026-11-15'
  quote: Since then, the team has been focusing on monitoring the captive bread population,
    tracking their health and survival rates through capture and release to track
    the toad’s success.
