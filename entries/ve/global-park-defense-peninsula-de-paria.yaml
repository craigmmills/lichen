summary: Project in Península de Paria National Park where, since 2021, rangers use SMART
  on mobile phones to log patrols and offences; Provita reports over 120 offences and about
  a hundred biodiversity observations.
facts:
- claim: Since 2021 the Global Park Defense system has been in place in the part of the park
    most affected by environmental crime.
  url: https://www.provita.org.ve/programas/proyectos-asociados/
  fetched: 2026-11-08
  quote: desde 2021 se ha implementado el sistema Global Park Defense (GPD) en la zona más
    impactada por delitos ambientales del Parque
- claim: Rangers carry SMART software on mobile phones, which georeferences patrols, records
    offences and logs biodiversity observations.
  url: https://www.provita.org.ve/programas/proyectos-asociados/
  fetched: 2026-11-08
  quote: Este sistema emplea patrullas de guardaparques equipadas con el software SMART en
    celulares, que además de georreferenciar los recorridos, detectan los ilícitos y registran
    observaciones de biodiversidad.
- claim: Provita reports more than 120 offences and about a hundred biodiversity observations
    recorded since then.
  url: https://www.provita.org.ve/programas/proyectos-asociados/
  fetched: 2026-11-08
  quote: Desde entonces se han detectado más de 120 delitos y un centenar de observaciones
    de biodiversidad.
