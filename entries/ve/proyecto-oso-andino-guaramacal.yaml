summary: Andean bear monitoring project led by Marcos Hidalgo, which Mongabay reports recorded
  489 bear events among 7,464 camera-trap events in 2021 and identified 29 individuals in
  a 230 km2 study area.
facts:
- claim: Mongabay reports that the project recorded 7,464 camera-trap events during 2021,
    489 of them with Andean bears, and identified 29 individuals in a 230 km2 study area.
  url: https://es.mongabay.com/2022/03/la-carrera-para-salvar-de-la-extincion-al-oso-andino-en-venezuela/
  fetched: 2026-11-12
  quote: 7464 eventos de cámara trampa durante 2021 en las que han aparecido distintos animales.
    En 489 de estos eventos apareció el oso andino.
- claim: In March 2022, Mongabay reported that the team had installed 12 camera-trap stations
    and expected to reach 20 that year with support from Fundación Wii of Colombia.
  url: https://es.mongabay.com/2022/03/la-carrera-para-salvar-de-la-extincion-al-oso-andino-en-venezuela/
  fetched: 2026-11-12
  quote: El equipo ha instalado 12 estaciones de fototrampeo y estiman llegar a 20 este año
    con el apoyo de la Fundación Wii de Colombia.
- claim: Mongabay says the team went into the field to install new cameras in January 2021
    to strengthen monitoring.
  url: https://es.mongabay.com/2022/03/la-carrera-para-salvar-de-la-extincion-al-oso-andino-en-venezuela/
  fetched: 2026-11-12
  quote: realizaron la primera expedición de ese año para instalar las cámaras nuevas y así
    reforzar el monitoreo
