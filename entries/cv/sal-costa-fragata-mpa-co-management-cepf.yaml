summary: A CEPF-funded project run by Project Biodiversity from May 2019 to November
  2023, monitoring birds, plants, reptiles and nesting turtles (with drones) at Costa
  Fragata, and starting fisher-led megafauna monitoring.
facts:
- claim: The CEPF final report gives the grantee as Associação Projetos Biodiversidade,
    although its body and contact section use Associação Projeto Biodiversidade, with
    project dates of 1 May 2019 to 30 November 2023.
  url: https://cepf.net/resources/final-project-report/final-project-report-2840
  fetched: '2026-11-13'
  quote: 'Project Dates:  May 01, 2019 - November 30, 2023'
- claim: The report says the team implemented a monitoring plan targeting birds, plants
    and reptiles in the Costa Fragata protected area, and enhanced nesting sea turtle
    monitoring with the use of drones.
  url: https://cepf.net/resources/final-project-report/final-project-report-2840
  fetched: '2026-11-13'
  quote: The team implemented a monitoring plan, targeting birds, plants and reptiles
    regularly. Nesting sea turtles monitoring and protection was enhanced with the
    use of drones.
- claim: The report says plant surveys were held twice a year and bird and reptile
    surveys once a year.
  url: https://cepf.net/resources/final-project-report/final-project-report-2840
  fetched: '2026-11-13'
  quote: with plant surveys conducted twice per year (before and after the rainy season),  and
    bird and reptiles surveys once per year
- claim: The report says fishers from Santa Maria and Pedra de Lume started a participative
    monitoring of marine megafauna.
  url: https://cepf.net/resources/final-project-report/final-project-report-2840
  fetched: '2026-11-13'
  quote: A participative monitoring of marine megafauna started
