  quote: 'Project Dates:  April 01, 2021 - November 30, 2023'
- claim: The report says the Vigilantes da Natureza carried out monitoring from the
    action plan in all seven protected areas of Maio, including biophysical indicators
    of an endemic reptile, invasive mammals, birds and plants.
  url: https://cepf.net/resources/final-project-report/final-project-report-2841
  fetched: '2026-11-13'
  quote: The Vigilantes da Natureza have been implementing monitoring activities from
    the Action Plan in all 7 Protected Areas of Maio
