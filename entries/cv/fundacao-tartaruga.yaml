summary: Non-profit protecting Boa Vista’s sea turtles since 2008, with detection dogs, proposed BIOPAMA-funded
  drone use and 8,607 nests reported by Inforpress for September 2025.
facts:
- claim: SWOT describes it as a non-profit based in Cabo Verde that has worked to protect sea turtles
    on Boa Vista since 2008.
  url: https://seaturtlestatus.org/swot-grantees/2024/2/1/fundao-tartaruga-cabo-verde-2023
  fetched: '2026-11-12'
  quote: Fundação Tartaruga is a non-profit based in Cabo Verde that has been actively working to protect
    sea turtles and their habitats on the island of Boa Vista since 2008.
- claim: Inforpress reports it registered 8,607 of the more than 35,000 nests monitored on Boa Vista in
    September 2025.
  url: https://inforpress.cv/en/article-5481
  fetched: '2026-11-12'
  quote: 8,607 by Fundação Tartaruga
- claim: SWOT says it has trained detection dogs to find illegally harvested turtles and eggs.
  url: https://seaturtlestatus.org/swot-grantees/2024/2/1/fundao-tartaruga-cabo-verde-2023
  fetched: '2026-11-12'
  quote: Fundação Tartaruga has trained and implemented “detection dogs” like Kelo (pictured above), to
    find illegally harvested turtles and eggs.
- claim: A BIOPAMA sheet describes an 81,199-euro grant for November 2020 to October 2021, led by Fundação
    Tartaruga Cabo Verde, that planned vehicles for its drone and dog teams and thermal imaging binoculars
    for night patrols on Boa Vista.
  url: https://action.biopama.org/wp-content/uploads/2020/12/STG_WA589_InfoFiche_final.pdf
  fetched: '2026-11-12'
  quote: The first project activity is focused on the purchase of two vehicles, one for the drone team
    and the second for the dog team
- claim: The same sheet proposes conservation dogs and a night-vision drone to reduce sea turtle poaching
    on Boa Vista.
  url: https://action.biopama.org/wp-content/uploads/2020/12/STG_WA589_InfoFiche_final.pdf
  fetched: '2026-11-12'
  quote: 'two new techniques aimed at better protecting sea turtles: Conservation Dogs and Night-Vision
    Drone'
