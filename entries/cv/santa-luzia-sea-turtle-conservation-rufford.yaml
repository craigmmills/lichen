summary: Closed Rufford-supported project, completed by December 2015, continuing
  work begun in 2011 on nesting sea turtles at the Santa Luzia marine reserve through
  daily beach patrols, nest relocation and marking of females.
facts:
- claim: The Rufford project page of 30 June 2015, for the Marine Reserve of Santa
    Luzia, said the project continued work begun in 2011 to improve the conservation
    status of nesting sea turtles through better knowledge of the population's biological
    data.
  url: https://www.rufford.org/projects/tommy-arruda-nobre-de-melo/conservation-status-for-sea-turtles-caretta-caretta-in-santa-luzia-island-cabo-verde/
  fetched: '2026-11-15'
  quote: This project, which is actually the continuation of the work that started
    since 2011
- claim: The 30 June 2015 page described daily beach patrols to find and relocate
    nests at risk, and marking females at night with subcutaneous devices and recording
    biometric data.
  url: https://www.rufford.org/projects/tommy-arruda-nobre-de-melo/conservation-status-for-sea-turtles-caretta-caretta-in-santa-luzia-island-cabo-verde/
  fetched: '2026-11-15'
  quote: During the night the females are marked with subcutaneous devices
