summary: Closed Rufford-supported project, reported in 2014, that aimed to use genetic
  methods on shark bycatch samples, collected with the local community, to get first
  abundance and population data around a Cape Verde island.
facts:
- claim: The Rufford project page of 8 September 2014, for Vila do Maio, said the
    project aimed to use genetic methods to obtain the first data on abundance, population
    structure, isolation and nursery use of a model shark species around an island
    in Cape Verde.
  url: https://www.rufford.org/projects/katharina-fietz/conservation-of-key-shark-habitats-and-development-of-a-stepping-stone-for-a-long-term-monitoring-system-of-local-shark-communities-in-cape-verde/
  fetched: '2026-11-15'
  quote: The project aims to use genetic methodology to obtain the first critical
    data about abundance, population structure, degree of isolation, and the use of
    nursery areas of a model shark species around an island in Cape Verde.
- claim: The page says the team collected biopsy samples from sharks caught as bycatch,
    working with the local community.
  url: https://www.rufford.org/projects/katharina-fietz/conservation-of-key-shark-habitats-and-development-of-a-stepping-stone-for-a-long-term-monitoring-system-of-local-shark-communities-in-cape-verde/
  fetched: '2026-11-15'
  quote: We are working in close collaboration with the local community to collect
    biopsy samples from by-caught sharks.
- claim: The final report form records the completion of the project, supported by
    The Rufford Small Grants Foundation.
  url: https://media.rufford.org/media/project_reports/16035-1%20Final%20Report.pdf
