id: guardians-of-the-sea-cabo-verde
kind: programme
name: Guardians of the Sea (Cabo Verde)
scope: cv
ai_label: conservation-tech
realms:
- ocean
scale: national
status: active
summary: A community monitoring programme in which fishers record illegal activities
  and marine megafauna sightings, begun on Maio in 2016; Mongabay reported in July
  2026 that around 190 fishers take part on seven islands.
facts:
- claim: Fundação Maio Biodiversidade's own page says the initiative empowers local
    fishers to collect data on illegal activities and sightings of marine megafauna.
  url: https://www.fmb-maio.org/en/marinho-pesca-sustent%C3%A1vel
  fetched: '2026-11-13'
  quote: empowering them to collect data on illegal activities and sightings of marine
    megafauna
- claim: The same page says the programme expands participatory monitoring and gives
    continuous data on illegal activities, megafauna sightings and commercial fish,
    held in standardized databases.
  url: https://www.fmb-maio.org/en/marinho-pesca-sustent%C3%A1vel
  fetched: '2026-11-13'
  quote: It expands participatory monitoring, providing continuous data on illegal
    activities, megafauna sightings and commercial fish.
- claim: The same page says the initiative, created in Maio, is being replicated on
    other islands of the country.
  url: https://www.fmb-maio.org/en/marinho-pesca-sustent%C3%A1vel
  fetched: '2026-11-13'
  quote: the “Guardians of the Sea” initiative, created in Maio, is being replicated
    on other islands in the country
- claim: Project Biodiversity's page describes it as a community-based monitoring
    initiative spearheaded by Maio Biodiversity Foundation, in which fishers track
    turtles, seabirds, sharks and cetaceans and report illegal fishing.
  url: https://projectbiodiversity.org/guardians-of-the-sea
  fetched: '2026-11-13'
  quote: a community-based monitoring initiative spearheaded by Maio Biodiversity
    Foundation that empowers fishers to track marine megafauna
- claim: Mongabay reported in July 2026 that around 190 fishers take part on seven
    of the ten islands and that the programme began on Maio in 2016.
  url: https://news.mongabay.com/2026/07/cabo-verde-program-and-its-fishers-have-been-protecting-the-sea-for-10-years/
  fetched: '2026-11-13'
  quote: Around 190 fishers are involved, working around seven of the archipelago’s
    10 islands. The program launched on the island of Maio in 2016
