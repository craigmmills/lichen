facts:
- claim: An August 2026 Inforpress report says the technical team of Associação Projecto Vitó was responsible
    for local fieldwork in the Ilhéu de Cima sea turtle monitoring campaign, which ran from 15 June to
    15 October 2026.
  url: https://inforpress.cv/en/fogo-monitoring-on-ilheu-de-cima-recorded-281-nests-and-535-sea-turtle-tracks-between-june-and-july
  fetched: '2026-11-12'
  quote: The data released today by the technical team at the Associação Projecto Vitó, which is responsible
    for the local fieldwork, relates to the first two months of the campaign
- claim: The campaign on Ilhéu de Cima, in the Ilhéus do Rombo Strict Nature Reserve, recorded 281 nests
    and 535 tracks in June and July 2026.
  url: https://inforpress.cv/en/fogo-monitoring-on-ilheu-de-cima-recorded-281-nests-and-535-sea-turtle-tracks-between-june-and-july
  fetched: '2026-11-12'
  quote: The sea turtle monitoring campaign on Ilhéu de Cima, within the Ilhéus do Rombo Strict Nature
    Reserve, recorded 281 nests and 535 tracks on the nesting beaches during June and July.
