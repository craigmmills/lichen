summary: Local biodiversity conservation association for Brava's terrestrial ecosystems,
  established in 2016, whose botanical inventory work under a CEPF grant is to underpin
  a protected area proposal prepared with Projecto Vitó.
facts:
- claim: UNCCD's accredited civil society page describes Biflores as a local biodiversity
    conservation association focused on the terrestrial ecosystems of Brava, established
    in 2016, with an address in Nova Sintra, Brava.
  url: https://www.unccd.int/cso/associacao-de-conservacao-da-biodiversidade-biflores
  fetched: '2026-11-15'
  quote: Biflores is a local biodiversity conservation association focused on the
    protection of terrestrial ecosystems of Brava, Cabo Verde.
- claim: Biflores's CEPF final report for grant 112080 (March 2021 to May 2022) says
    the project continued data collection to keep the botanical inventory of Brava
    up to date.
  url: https://cepf.net/sites/default/files/final-report-112080.pdf
  fetched: '2026-11-15'
  quote: Through this project we have continued the data collection to keep updated
    the botanical inventory of Brava.
- claim: The same report says the botanical survey will be the basis for a protected
    area proposal on Brava, prepared with Projecto Vitó.
  url: https://cepf.net/sites/default/files/final-report-112080.pdf
  fetched: '2026-11-15'
  quote: the botanical survey, integrated with the information collected by Projecto
    Vitó, will be the base to justify the PA
- claim: Associação Projecto Vitó's CEPF final report lists Biflores, in 2021, against
    biodiversity monitoring and capacity building.
  url: https://cepf.net/resources/final-project-report/final-project-report-2682
  fetched: '2026-11-15'
  quote: Biflores 2021 Cape Verde Yes Monitorização da biodiversidade e capacitação
- claim: The same Projecto Vitó report says a flora monitoring unit for Fogo and Brava
