summary: A MeerWissen project from 2019 to 2023 that developed standards for coastal
  ecosystem monitoring around Cabo Verde, where no systematic observations existed,
  and which GEOMAR says local researchers can operate and extend.
facts:
- claim: From 2019 to 2023 the MeerWissen project CEM-CV developed standards for a
    coastal monitoring programme in a region without systematic ecosystem observations,
    to improve knowledge of coastal marine biodiversity around Cabo Verde.
  url: https://www.geomar.de/en/centre/research-in-cape-verde/hub-for-knowledge-exchange
  fetched: '2026-11-13'
  quote: From 2019 to 2023, the MeerWissen project CEM-CV developed standards for
    a coastal monitoring program in a region that has lacked systematic ecosystem
    observations
- claim: GEOMAR's Cape Verde page says CEM_CV laid the foundation for a coastal ecosystem
    monitoring programme that local researchers can operate independently and extend
    to other regions.
  url: https://www.geomar.de/en/centre/research-in-cape-verde/marine-biodiversity
  fetched: '2026-11-13'
  quote: CEM_CV has laid the foundation for a monitoring program for coastal ecosystems
    that can be operated independently by local researchers and extended to other
    regions.
- claim: The Ocean Science Centre Mindelo's 2021 news item says the project is one
    of the MeerWissen projects sponsored by the German Federal Ministry for Economic
    Cooperation and Development.
