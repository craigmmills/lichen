summary: Active alliance of three bodies building on the Open Data Cube for satellite monitoring of Chilean
  land and sea, with a prototype funded by Australia's foreign affairs department and the Data Observatory.
facts:
- claim: An alliance of the three bodies to develop a project using the Open Data Cube for land and marine
    satellite monitoring of Chile.
  url: https://datacubechile.cl/who-we-are/?lang=en
  fetched: 2026-11-02
  quote: Adolfo Ibáñez University, CSIRO Chile and Data Observatory formed a strategic alliance to develop
    a revolutionary project using the Open Data Cube for land and marine satellite monitoring of Chile.
- claim: The initial prototype partnership was funded by Australia's Department of Foreign Affairs and
    Trade and the Data Observatory, within the APEC framework.
  url: https://datacubechile.cl/who-we-are/?lang=en
  fetched: 2026-11-02
