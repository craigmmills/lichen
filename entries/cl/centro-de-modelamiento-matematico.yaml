summary: A University of Chile mathematical modelling centre that presented a Magallanes wetland
  monitoring system with GIZ, hosted the regional Copernicus centre (reported November 2024),
  and has authors on a 2021 blue whale call detection paper.
facts:
- claim: Presented, with GIZ, the wetland and peatland monitoring system in Magallanes.
  url: https://www.eeas.europa.eu/node/451386_en
  fetched: 2026-11-02
  quote: El Centro de Modelamiento Matemático (CMM) de la Universidad de Chile, junto a la
    agencia alemana de cooperación GIZ, presentó oficialmente el nuevo Sistema de Monitoreo
    de Humedales y Turberas
- claim: A 2021 paper with authors at the centre covers detection of blue whale calls with
    a convolutional neural network.
  url: https://api.openalex.org/works/doi:10.1109/la-cci48322.2021.9769846?select=title,authorships
  fetched: 2026-11-02
  quote: Detection of blue whale vocalisations using a temporal-domain convolutional neural
    network
  ai_type: deep-learning
- claim: In November 2024, CMM reported that it hosted the regional Copernicus centre.
  url: https://www.cmm.uchile.cl/?p=57984
  fetched: '2026-11-02'
  quote: The Regional Center, hosted by the CMM, now has two of the three satellite tools
- claim: One research line explores the impact of environmental pressures on biodiversity,
    from omics to mathematical models.
  url: https://www.cmm.uchile.cl/investigacion/investigacion-aplicada/clima-y-biodiversidad/
  fetched: '2026-11-02'
  quote: Esta línea explora el impacto de las presiones ambientales sobre la biodiversidad,
