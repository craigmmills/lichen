summary: Proposed platform led by Cristian Bonacic, to be developed by UC, with twelve months
  planned to validate AI recognition, building on the Live Andes 1.0 citizen science platform.
facts:
- claim: A group of Universidad Católica academics is working to launch the platform.
  url: https://eldesconcierto.cl/hoja-ruta/personas-podran-participar-iniciativa-live-andes-20-que-monitorea-fauna-silvestre-su-conservacion-n5457780
  fetched: 2026-11-02
  quote: Un grupo de académicos de la Universidad Católica trabaja para lanzar una plataforma
    que utiliza tecnologías como la inteligencia artificial
- claim: Project lead says multimodal AI will allow Live Andes 1.0 to become a platform for
    semi-automated analysis of camera-trap images.
  url: https://eldesconcierto.cl/hoja-ruta/personas-podran-participar-iniciativa-live-andes-20-que-monitorea-fauna-silvestre-su-conservacion-n5457780
  fetched: 2026-11-02
  quote: arquitecturas de redes neuronales y la inteligencia artificial multimodal permitirán
    transformar Live Andes 1.0
  ai_type: multimodal
- claim: Part of Avanza UC, which funds the university's own research with institutional resources.
  url: https://visionuniversitaria.uc.cl/universidad-y-sociedad/proyecto-uc-combinara-inteligencia-artificial-y-participacion-ciudadana-para-el-monitoreo-de-fauna-silvestre/
  fetched: '2026-11-02'
  quote: iniciativa de la UC que busca impulsar investigación propia con recursos institucionales
- claim: Will rest on the Live Andes 1.0 platform, initially funded by Microsoft Research.
