- claim: A 2015 paper on the Ingeniería UC site described Live ANDES as a mobile-cloud shared
    workspace promoting citizen science, data collection and analysis for wildlife conservation.
  url: https://www.ing.uc.cl/?p=325656
  fetched: 2026-11-02
  quote: Live ANDES is a mobile-cloud shared workspace designed to address this problem, promoting
