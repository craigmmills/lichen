- claim: Twelve-month phase to validate AI recognition with convolutional neural networks
    and multimodal architectures.
  url: https://visionuniversitaria.uc.cl/universidad-y-sociedad/proyecto-uc-combinara-inteligencia-artificial-y-participacion-ciudadana-para-el-monitoreo-de-fauna-silvestre/
