summary: Joint project of the ministry and Fundación MERI, run and built by both, to set up a whale-presence
  early-warning buoy system with AI; its first buoy was reported destroyed in March 2023.
facts:
- claim: An October 2022 report says the project aimed to install and connect South America’s first whale-presence
    early-warning system and had put its first buoy into operation.
  url: https://www.elmostrador.cl/cultura/2022/10/14/ministerio-de-medio-ambiente-y-fundacion-meri-instalan-primera-boya-inteligente-para-el-monitoreo-de-los-oceanos/
  fetched: 2026-11-02
  quote: tiene como objetivo instalar y conectar en Sudamérica el Primer Sistema de Alerta Temprana de
    Presencia de Ballenas
- claim: The October 2022 report describes smart buoys equipped with hydrophones, oceanographic sensors
    and transmitters using Listen To The Deep Ocean (LIDO) technology.
  url: https://www.elmostrador.cl/cultura/2022/10/14/ministerio-de-medio-ambiente-y-fundacion-meri-instalan-primera-boya-inteligente-para-el-monitoreo-de-los-oceanos/
  fetched: 2026-11-02
  quote: boyas inteligentes equipadas con hidrófonos, sensores oceanográficos y transmisores con la tecnología,
    Listen To The Deep Ocean (LIDO)
- claim: A joint national project of the ministry and Fundación MERI.
  url: https://fundacionmeri.cl/theblueboatinitiative/
  fetched: '2026-11-02'
  quote: es un proyecto nacional conjunto entre el Ministerio del Medio Ambiente de Chile y Fundación
    MERI
- claim: In March 2023 the first smart buoy was reported severely destroyed, stranded on Lemuy island.
  url: https://fundacionmeri.cl/theblueboatinitiative/
  fetched: '2026-11-02'
  quote: había sido severamente destruida, encontrándose varada en la Isla de Lemuy
- claim: UPC says the project includes AI technology.
  url: https://www.upc.edu/es/sala-de-prensa/noticias/instalan-en-el-golfo-de-corcovado-en-chile-la-primera-boya-inteligente-para-monitorizar-los-oceanos-con-tecnologia-upc
  fetched: '2026-11-02'
  quote: The Blue BOAT Initiative es un proyecto que incluye tecnología de inteligencia artificial.
