    el uso de sensores remotos embarcados en vehículos aéreos no tripulados y herramientas
    moleculares
- claim: The fund's results summary for the hualo project reports three-dimensional
    models and vegetation indices generated from LiDAR and satellite flights.
  url: https://investigacion.conaf.cl/documentos/documento.php?idDocumento=1210726
