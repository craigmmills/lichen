facts:
- claim: In March 2026, CONAF reported four remote-sensing cameras with AI installed in Magallanes.
  url: https://www.conaf.cl/conaf-instala-camaras-de-teledeteccion-con-inteligencia-artificial-para-la-prevencion-de-incendios-forestales/
  fetched: '2026-11-02'
  quote: En la Región de Magallanes implementó tecnología de Inteligencia Artificial (AI) en 4 puntos
    estratégicos.
- claim: In June 2026, CONAF described the aim in La Araucanía as a monitoring network of smart cameras
    detecting smoke, heat and fire early.
  url: https://www.conaf.cl/conaf-impulsa-red-de-camaras-con-inteligencia-artificial-para-prevenir-incendios-forestales-en-la-araucania/
  fetched: '2026-11-02'
  quote: consolidar una red de monitoreo territorial mediante la instalación de cámaras inteligentes capaces
    de detectar humo, focos de calor y fuego en etapas tempranas
- claim: In June 2026, CONAF reported signing agreements with five municipalities and a fire brigade in
    La Araucanía.
  url: https://www.conaf.cl/conaf-impulsa-red-de-camaras-con-inteligencia-artificial-para-prevenir-incendios-forestales-en-la-araucania/
  fetched: '2026-11-02'
  quote: suscribió convenios de colaboración con las municipalidades de Pitrufquén, Pucón, Teodoro Schmidt,
    Galvarino y Lonquimay, además del Cuerpo de Bomberos de Curarrehue
