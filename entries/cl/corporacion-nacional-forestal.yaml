summary: A private-law forest and protected-areas administrator under the agriculture ministry,
  undergoing transformation into a public service, which has trialled AI photo sorting and
  uses wildfire cameras and Sentinel-2 imagery.
facts:
- claim: A private-law body under the Ministry of Agriculture whose main task is administering
    Chile's forest policy.
  url: https://www.conaf.cl/quienes-somos/
  fetched: 2026-11-02
  quote: es una entidad de derecho privado dependiente del Ministerio de Agricultura, cuya
    principal tarea es administrar la política forestal de Chile
- claim: A law promulgated in May 2025 creates the Servicio Nacional Forestal and transforms
    CONAF into a public service.
  url: https://www.conaf.cl/gobierno-promulga-ley-que-crea-el-nuevo-servicio-nacional-forestal/
  fetched: 2026-11-02
  quote: la promulgación de la ley que crea el nuevo Servicio Nacional Forestal y que transforma
    a la actual Corporación Nacional Forestal (CONAF) en un servicio público
- claim: In August 2026 a press report still described the transformation into SERNAFOR as
    a process that will give rise to the new service.
  url: https://www.radioagricultura.cl/noticias/nacional/conaf-presenta-modernizacion-hacia-sernafor-en-reunion-forestal-de-apec-2026_20260811/
  fetched: 2026-11-02
  quote: el proceso de transformación institucional que dará paso al Servicio Nacional Forestal
    (SERNAFOR)
- claim: Installed 60 camera traps in Reserva Nacional Magallanes in 2022 for an early warning
    system for American mink, with CAPES at Universidad Católica.
  url: https://www.conaf.cl/presencia-de-34-especies-nativas-detecto-monitoreo-de-conaf-con-camaras-trampa-en-reserva-nacional-magallanes/
  fetched: 2026-11-02
  quote: Estas cámaras fueron instaladas entre marzo y mayo del 2022 en el contexto del Sistema
    de Alerta Temprana para la detección del visón
- claim: Its GBIF publisher record says it is the public institution that administers the
    state system of protected wild areas.
  url: https://api.gbif.org/v1/organization/6568c9e4-fdc6-4d73-a7ea-2d1bf44fcd61
  fetched: '2026-11-02'
  quote: CONAF es la institución pública encargada de la administración del Sistema Nacional
    de Áreas Silvestres Protegidas del Estado (SNASPE).
- claim: Its GBIF publisher record gives an address in Santiago.
  url: https://api.gbif.org/v1/organization/6568c9e4-fdc6-4d73-a7ea-2d1bf44fcd61
  fetched: '2026-11-02'
  quote: Paseo Bulnes 259 Oficina 703
- claim: In December 2023, CONAF reported AI trials for camera-trap image selection in Parque
    Nacional Nonguén, with wider use in state protected areas envisaged.
  url: https://www.conaf.cl/aplican-inteligencia-artificial-en-fotomonitoreo-con-camaras-trampa-dentro-de-areas-silvestres-protegidas/
  fetched: '2026-11-02'
  quote: La primera experiencia aplicada se desarrolla en el Parque Nacional Nonguén
- claim: In August 2024, CONAF reported two AI cameras detecting smoke in the Metropolitan
    Region and described the Sky Costanera camera as using deep learning.
  url: https://www.conaf.cl/camaras-con-inteligencia-artificial-optimizan-la-deteccion-de-quemas-agricolas-en-la-region-metropolitana/
  fetched: '2026-11-02'
  quote: Utiliza inteligencia artificial bajo el modelo deep learning
  ai_type: deep-learning
- claim: In July 2026, CONAF reported using Sentinel-2 imagery in La Araucanía to detect burns
    and protect native forest.
  url: https://www.conaf.cl/tecnologia-satelital-fortalece-la-proteccion-del-bosque-nativo-en-la-araucania/
  fetched: '2026-11-02'
  quote: A través del uso de imágenes satelitales de la constelación Sentinel-2, la Corporación
    Nacional Forestal (CONAF) está fortaleciendo el monitoreo del territorio
- claim: In December 2023, CONAF said it was advancing AI for camera-trap photo monitoring
    in state protected areas.
  url: https://www.conaf.cl/aplican-inteligencia-artificial-en-fotomonitoreo-con-camaras-trampa-dentro-de-areas-silvestres-protegidas/
  fetched: '2026-11-02'
  quote: se encuentra avanzando en el uso de inteligencia artificial para el trabajo de fotomonitoreo
    con cámaras trampa
- claim: CONAF and CENIA proposed the remote-sensing cameras with AI placed in Magallanes
    and Última Esperanza provinces.
  url: https://www.conaf.cl/conaf-instala-camaras-de-teledeteccion-con-inteligencia-artificial-para-la-prevencion-de-incendios-forestales/?term=region-metropolitana
  fetched: '2026-11-02'
  quote: alianza de nivel nacional entre CONAF y el Centro Nacional de Inteligencia Artificial
    (CENIA), quienes desarrollaron la propuesta de implementación de estas cámaras de teledetección
- claim: CONAF says its monitoring platforms detect changes in vegetation, guide inspections
    and support wildfire response.
  url: https://www.conaf.cl/conaf-evoluciona-su-monitoreo-satelital-para-detectar-cambios-en-el-territorio-con-mayor-rapidez-y-precision/
  fetched: '2026-11-02'
  quote: plataformas que permiten detectar cambios en la vegetación, orientar fiscalizaciones
    y apoyar la respuesta frente a incendios forestales
- claim: Ecogen carried out environmental DNA monitoring and analysis for CONAF, according
    to Ladera Sur.
  url: https://laderasur.com/articulo/ecogen-la-innovadora-iniciativa-chilena-que-identifica-especies-a-partir-del-adn-ambiental/
  fetched: '2026-11-02'
  quote: La empresa ECOGEN es la responsable de los monitoreos y análisis realizados a la
    CONAF.
- claim: Administers Chile's national system of protected wild areas.
  url: https://www.conaf.cl/
  fetched: 2026-11-02
  quote: Sistema Nacional de Áreas Silvestres Protegidas del Estado, que administra CONAF
- claim: Its home page lists ecosystem monitoring and a vegetation survey.
  url: https://www.conaf.cl/
  fetched: 2026-11-02
  quote: Monitoreo de Ecosistemas​ Catastro Vegetacional
- claim: Rewilding Chile says CONAF and the foundation both have access to the AI camera-trap
    platform and receive alarms when threats are detected.
  url: https://www.rewildingchile.org/en/news/cutting-edge-technology-in-patagonia-national-park-real-time-monitoring-with-artificial-intelligence-camera-traps/
  fetched: 2026-11-02
  quote: Both the National Forestry Corporation (CONAF) and Rewilding Chile have access to
    the platform and receive alarms in case of threat detection
