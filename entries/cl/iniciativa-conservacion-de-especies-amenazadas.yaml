summary: Initiative run by Chile's environment ministry and FAO, funded by the Global
  Environment Facility, which a March 2025 FAO article says arranged a donation of
  seven camera traps for huemul monitoring.
facts:
- claim: A FAO article dated March 2025 reports that Enel gave seven camera traps
    to CONAF-administered Laguna del Laja National Park for huemul monitoring, in
    a handover arranged by the initiative.
  url: https://www.fao.org/chile/news-and-opinion/news/detail/Nuevos-equipos-permiten-mejorar-el-sistema-de-monitoreo-del-huemul-de-Chile-central/es
  fetched: 2026-11-09
  quote: La acción fue gestionada por la Iniciativa Conservación de Especies Amenazadas,
    proyecto ejecutado por el Ministerio del Medio Ambiente (MMA)
- claim: The coordinator quoted in the FAO article said the initiative brought territorial
    actors into the huemul monitoring system.
  url: https://www.fao.org/chile/news-and-opinion/news/detail/Nuevos-equipos-permiten-mejorar-el-sistema-de-monitoreo-del-huemul-de-Chile-central/es
  fetched: 2026-11-09
  quote: Nos enorgullece integrar a todos los actores del territorio al sistema de
    monitoreo del huemul
