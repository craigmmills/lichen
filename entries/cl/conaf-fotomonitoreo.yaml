summary: A CONAF camera-trap programme that reported over a million records from 2,000 cameras in 35 protected
  areas in May 2024, has trialled AI image sorting, and is to pass gradually to SBAP.
facts:
- claim: In May 2024, CONAF reported more than a million records from 2,000 camera traps in 35 protected
    areas on an open-access platform.
  url: https://www.conaf.cl/chile-estrena-la-plataforma-de-fotomonitoreo-en-areas-protegidas-mas-grande-del-mundo/
  fetched: '2026-11-02'
  quote: captadas mediante dos mil cámaras trampa instaladas en 35 áreas protegidas, desde ahora están
    disponibles en una plataforma de libre acceso
- claim: In December 2023, CONAF reported its first applied AI experience in Nonguén National Park, sorting
    useful images from empty ones.
  url: https://www.conaf.cl/aplican-inteligencia-artificial-en-fotomonitoreo-con-camaras-trampa-dentro-de-areas-silvestres-protegidas/
  fetched: '2026-11-02'
  quote: La primera experiencia aplicada se desarrolla en el Parque Nacional Nonguén
- claim: CONAF reported in December 2023 that University of Bío-Bío students had proposed an invasive-species
    labelling model trained on more than 40,000 CONAF camera-trap photographs from Nonguén National Park.
  url: https://www.conaf.cl/aplican-inteligencia-artificial-en-fotomonitoreo-con-camaras-trampa-dentro-de-areas-silvestres-protegidas/
  fetched: '2026-11-02'
  quote: proponer un modelo de etiquetado de especies invasoras que fue “entrenado” con más de 40 mil
    fotografías
- claim: The programme is to pass gradually to SBAP.
  url: https://www.conaf.cl/chile-estrena-la-plataforma-de-fotomonitoreo-en-areas-protegidas-mas-grande-del-mundo/
  fetched: '2026-11-02'
  quote: gradualmente será traspasada al nuevo Servicio Nacional de Biodiversidad y Áreas Protegidas
