summary: Wetland and peatland monitoring system for Magallanes, built by the Centro de Modelamiento Matemático
  and GIZ, combining Sentinel imagery with field data and offering yearly maps of 13 surface types.
facts:
- claim: Based on Copernicus imagery from the Sentinel constellation, complemented by field campaigns.
  url: https://www.eeas.europa.eu/node/451386_en
  fetched: 2026-11-02
  quote: El trabajo se basó en imágenes de Copernicus, el programa de observación de la tierra de la Unión
    Europea
- claim: The principal researcher said it combined geospatial information with artificial intelligence.
  url: https://www.eeas.europa.eu/node/451386_en
  fetched: 2026-11-02
  quote: ha combinado el uso de información geoespacial con inteligencia artificial
- claim: The system is available to public institutions, communities and developers.
  url: https://www.eeas.europa.eu/node/451386_en
  fetched: 2026-11-02
  quote: El sistema ya está disponible para instituciones públicas, comunidades y desarrolladores
- claim: Combines satellite technology and field data.
  url: https://copernicuslac-chile.eu/noticia/video-ceremonia-de-lanzamiento-del-sistema-de-monitoreo-de-humedales-y-turberas-en-la-region-de-magallanes/
  fetched: '2026-11-02'
  quote: Combina tecnología satelital y datos recopilados en terreno para entregar información detallada
    y actualizada sobre estos ecosistemas estratégicos.
- claim: Offers yearly updated maps of 13 surface types.
  url: https://turberas.cmm.uchile.cl
  fetched: '2026-11-02'
  quote: esta herramienta ofrece mapas de actualización anual sobre 13 tipos de superficies de la región
    de Magallanes
- claim: The result of a collaboration between the EU, Germany, Spain and two Chilean ministries.
  url: https://copernicuslac-chile.eu/noticia/video-ceremonia-de-lanzamiento-del-sistema-de-monitoreo-de-humedales-y-turberas-en-la-region-de-magallanes/
  fetched: '2026-11-02'
  quote: resultado de una colaboración entre la Unión Europea, el Ministerio Federal de Economía y Energía
    de Alemania (BMWK), la Agencia Española de Cooperación Internacional para el Desarrollo (AECID), y
    los ministerios chilenos de Energía y Medio Ambiente
- claim: Uses Copernicus images from the Sentinel satellites with field campaigns.
  url: https://www.cmm.uchile.cl/noticias/cmm-lanza-sistema-pionero-para-proteger-humedales-y-turberas-en-magallanes/
