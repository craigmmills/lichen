summary: Organisation with a Rufford project approved in September 2025 that plans
  long-term herbivore monitoring and GPS-collar analysis of taruka deer; a February
  2026 update reports 22 of 33 camera traps installed.
facts:
- claim: Its Rufford project, approved in September 2025, plans to continue long-term
    monitoring of wild and domestic large herbivores and use GPS-collar data from
    taruka deer to identify priority conservation areas.
  url: https://www.rufford.org/projects/nicol%C3%A1s-fuentes-allende/seeking-the-equilibrium-between-livestock-farming-and-the-conservation-of-threatened-large-herbivores-in-the-high-altitude-desert-of-the-central-andes-ecoregion/
  fetched: '2026-11-12'
  quote: 'In this project we will: i) continue our long-term monitoring of abundance,
    habitat preferences, and disease transmission between wild and domestic large
    herbivores; ii) use GPS-collar data from taruka to identify priority conservation
    areas'
- claim: The February 2026 update reports 22 of 33 camera traps installed in a programme
    to monitor large mammals around Chapiquiña and Murmuntani.
  url: https://media.rufford.org/media/project_reports/48744-B___Project_update_RUFFORD.pdf
  fetched: '2026-11-12'
  quote: Installing 22 of the 33 camera traps that are part of the programme to monitor
    large mammals in the surroundings of the villages of Chapiquiña and Murmuntani
    (Putre County)
- claim: The February 2026 project update names Nicolás Fuentes-Allende and Fundación
    Sudamérica Diversa together.
  url: https://media.rufford.org/media/project_reports/48744-B___Project_update_RUFFORD.pdf
  fetched: '2026-11-12'
  quote: Dr Nicolás Fuentes-Allende / Fundación Sudamérica Diversa / Chile
