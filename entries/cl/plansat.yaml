summary: Project led by Carmen Gloria Ossa and funded by the national research agency, which
  in July 2024 proposed a geospatial platform on wildfire history and forest recovery in Ñuble
  using satellite data.
facts:
- claim: In July 2024, it proposed a geospatial platform showing historical wildfire frequency,
    intensity and magnitude in Ñuble, and their influence on land-use change and native forest
    recovery.
  url: https://uv.cl/archivo-noticias-uv/26901-uv-se-adjudica-proyecto-que-contribuira-a-la-prevencion-de-incendios-forestales-y-recuperacion-de-suelos-en-la-region-del-nuble
  fetched: 2026-11-09
  quote: propone generar una plataforma geoespacial que permitirá visualizar datos históricos
    sobre la frecuencia, intensidad y magnitud de los incendios forestales, y su influencia
    en el cambio de uso de suelo y la posterior recuperación de los bosques nativos
- claim: In July 2024, it aimed to use satellite information to assess changes in burned forests
    in Ñuble over the preceding thirty years.
  url: https://uv.cl/archivo-noticias-uv/26901-uv-se-adjudica-proyecto-que-contribuira-a-la-prevencion-de-incendios-forestales-y-recuperacion-de-suelos-en-la-region-del-nuble
  fetched: 2026-11-09
  quote: El objetivo es utilizar la información satelital para evaluar qué sucedió con los
    bosques incendiados en los últimos treinta años en la zona
