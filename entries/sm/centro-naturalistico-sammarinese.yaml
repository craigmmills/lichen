summary: San Marino's CNS has sat within the Department of the Territory and Environment since 2012, serves
  as CITES Scientific Authority, is legally responsible for wildlife monitoring and censuses, and hosts
  the Wildlife Observatory.
facts:
- claim: San Marino's CBD country profile says the CNS has been an organisational unit within the Department
    of the Territory and Environment since 2012, designated as CITES Scientific Authority and responsible
    for monitoring the country's natural features.
  url: https://www.cbd.int/countries/profile/?country=sm
  fetched: 2026-11-12
  quote: Since 2012, the San Marino Naturalistic Centre (CNS) has existed as an organizational unit within
    the Department of the Territory and Environment, designated as the Scientific Authority for CITES
    and responsible for monitoring the natural aspects of the country
- claim: The profile says monitoring protocols for the main groups of fauna and flora, especially vertebrates,
    were promoted and implemented in collaboration with the CNS.
  url: https://www.cbd.int/countries/profile/?country=sm
  fetched: 2026-11-12
  quote: In collaboration with the CNS, San Marino has promoted and implemented monitoring protocols for
    the main groups of fauna and flora to be preserved and managed
- claim: The profile says the CNS's research includes monitoring the presence of exotic species.
  url: https://www.cbd.int/countries/profile/?country=sm
  fetched: 2026-11-12
  quote: Research activities conducted by the CNS also include the monitoring and analysis of the presence
    of exotic species
- claim: San Marino's wildlife law, as published on FAOLEX, makes monitoring and census activities the
    competence of the CNS.
  url: https://faolex.fao.org/docs/pdf/smr71177.pdf
  fetched: 2026-11-12
  quote: Le attività di monitoraggio e di censimento s ono di competenza del C.N.S., che le attua con
- claim: The profile says the CNS is the seat of the Observatory of Wild Fauna and Relevant Habitats.
  url: https://www.cbd.int/countries/profile/?country=sm
  fetched: 2026-11-12
  quote: The CNS is also the seat of the Observatory of Wild Fauna and Relevant Habitats
