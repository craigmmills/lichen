    of forest, had deployed 280 automatic cameras to monitor biodiversity.
  url: https://voh.com.vn/khoa-hoc/phat-hien-gau-ngua-va-cua-bay-tai-vuon-quoc-gia-chu-mom-ray-quang-ngai-610512.html
