  quote: Vườn Quốc gia Chư Mom Ray, với diện tích hơn 60.600ha rừng, đã triển khai
    280 máy ảnh tự động để giám sát đa dạng sinh học.
- claim: On 12 August 2025 its director reported camera-trap records of Asian black
    bear and an animal the article calls 'cua bay' in the Ya Mô forest area.
  url: https://voh.com.vn/khoa-hoc/phat-hien-gau-ngua-va-cua-bay-tai-vuon-quoc-gia-chu-mom-ray-quang-ngai-610512.html
