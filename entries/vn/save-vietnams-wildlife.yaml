summary: Conservation organisation with offices in Ninh Binh Province and Hanoi, which set
  up an anti-poaching unit at Pu Mat National Park in 2018 and later extended it to other
  parks, using SMART and AI PoacherCams.
facts:
- claim: Mongabay reports that the antipoaching unit supported by Save Vietnam's Wildlife
    in Pu Mat National Park uses SMART data software and remotely monitored PoacherCams to
    find trafficking hotspots and guide patrols.
  url: https://news.mongabay.com/2026/07/a-targeted-data-driven-approach-interview-with-vietnams-antipoaching-unit/
  fetched: 2026-11-08
  quote: Supported by the NGO Save Vietnam’s Wildlife, the APU integrates tools such as SMART
    data aggregation software and remotely monitored “PoacherCams” to identify trafficking
    hotspots and guide patrols more strategically.
- claim: Mongabay reports that SVW has partnered with several national parks on antipoaching
    work.
  url: https://news.mongabay.com/2026/07/a-targeted-data-driven-approach-interview-with-vietnams-antipoaching-unit/
  fetched: 2026-11-08
  quote: Save Vietnam’s Wildlife (SVW), which has partnered with several national parks to
    implement antipoaching practices
- claim: Its forest protection teams use the SMART program and AI Poachercam technology to
    track patrol results and monitor biodiversity.
  url: https://www.svw.vn/en/site-protections
  fetched: '2026-11-08'
  quote: They utilize the SMART program and AI Poachercam technology to track patrol results,
    monitor biodiversity, and conduct outreach to gather information.
- claim: Set up an anti-poaching unit at Pu Mat National Park in 2018, co-managed with the
    park, and later extended the model to Cat Tien, U Minh Thuong and U Minh Ha National Parks
    and the Dong Nai Culture and Nature Reserve.
  url: https://www.svw.vn/en/site-protections
  fetched: '2026-11-08'
  quote: SVW has expanded the model to Cat Tien, U Minh Thuong, and U Minh Ha National Parks,
    as well as the Dong Nai Culture and Nature Reserve.
- claim: Its species conservation page shows wildlife records captured by its own camera traps.
  url: https://www.svw.vn/en/species-conservation
  fetched: '2026-11-08'
  quote: Wild animal records captured by SVW camera traps
- claim: Its contact page gives an office in Cuc Phuong Commune, Ninh Binh Province, and a
    Hanoi office.
