summary: National park of 15,100 ha, recognised as an ASEAN Heritage Park in September
  2025, where the ministry's site says 20 years of monitoring show 36 to 93 black-faced
  spoonbills a year.
facts:
- claim: The ministry's site says 20 years of monitoring by the Xuan Thuy Ramsar site
    show 36 to 93 black-faced spoonbills a year.
  url: https://mae.gov.vn/bao-ton-thien-nhien-va-da-dang-sinh-hoc/kip-thoi-hanh-dong-bao-ve-cac-loai-chim-quy-hiem-21823.htm
  fetched: 2026-11-13
  quote: Theo kết quả theo dõi trong 20 năm trở lại đây của Khu Ramsar Xuân Thủy cho
    thấy số lượng cò mỏ thìa diễn biến hàng năm từ 36-93 cá thể/năm.
- claim: The park covers 15,100 ha, with a core zone of 7,100 ha and a buffer zone
    of 8,000 ha.
  url: https://mae.gov.vn/bao-ton-thien-nhien-va-da-dang-sinh-hoc/kip-thoi-hanh-dong-bao-ve-cac-loai-chim-quy-hiem-21823.htm
  fetched: 2026-11-13
  quote: Diện tích toàn bộ VQG Xuân Thủy là 15.100 ha, bao gồm vùng lõi 7.100 ha,
    vùng đệm 8.000 ha.
- claim: In September 2025 it was recognised as an ASEAN Heritage Park.
  url: https://mae.gov.vn/bao-ton-thien-nhien-va-da-dang-sinh-hoc/kip-thoi-hanh-dong-bao-ve-cac-loai-chim-quy-hiem-21823.htm
  fetched: 2026-11-13
  quote: Tháng 9/2025, Hội nghị Bộ trưởng Môi trường ASEAN lần thứ 18 công nhận VQG
    Xuân Thủy là Vườn Di sản ASEAN thứ 69 của Đông Nam Á và thứ 15 của Việt Nam.
