summary: Viet Nam News reports a US$7.15 million GEF-funded project through UNDP to
  2030, led by NBCA, planning tourism models and SMART patrol deployment or expansion
  in two national parks.
facts:
- claim: Viet Nam News reports a US$7.15 million project funded by the GEF through
    UNDP to 2030 and led by the NBCA.
  url: https://vietnamnews.vn/environment/1798439/viet-nam-launches-un-backed-drive-linking-conservation-and-nature-tourism.html
  fetched: 2026-11-12
  quote: The US$7.15 million initiative is funded by the Global Environment Facility
    through the UN Development Programme (UNDP) in Việt Nam through 2030, and is led
    by the National Biodiversity Conservation Authority (NBCA) under the Ministry
    of Agriculture and Environment.
- claim: It will pilot models in Núi Chúa and Phong Nha-Kẻ Bàng national parks.
  url: https://vietnamnews.vn/environment/1798439/viet-nam-launches-un-backed-drive-linking-conservation-and-nature-tourism.html
  fetched: 2026-11-12
  quote: The project will pilot models in Núi Chúa and Phong Nha-Kẻ Bàng national
    parks
- claim: A SMART patrol system is to be deployed at Núi Chúa and expanded at Phong
    Nha-Kẻ Bàng.
  url: https://vietnamnews.vn/environment/1798439/viet-nam-launches-un-backed-drive-linking-conservation-and-nature-tourism.html
  fetched: 2026-11-12
  quote: Meanwhile, a SMART patrol system will be deployed at Núi Chúa and expanded
    at Phong Nha-Kẻ Bàng.
- claim: Biodiversity protection and monitoring are to be strengthened.
  url: https://vietnamnews.vn/environment/1798439/viet-nam-launches-un-backed-drive-linking-conservation-and-nature-tourism.html
  fetched: 2026-11-12
  quote: Biodiversity protection and monitoring will be strengthened.
