status: active
summary: Funded by the Rufford Foundation, this project involves CCD surveying and
  monitoring red-shanked and grey-shanked doucs in partnership with Chư Mom Ray National
  Park.
facts:
- claim: Rufford lists the project in April 2025, with population surveys, habitat
    assessment and threat identification in Chu Mom Ray National Park.
  url: https://www.rufford.org/projects/dinh-van-nguyen/conservation-of-two-critically-endangered-species-red-shanked-douc-and-grey-shanked-douc-in-chu-mom-ray-national-park-vietnam/
  fetched: 2026-11-15
  quote: By conducting detailed population surveys, assessing habitat conditions,
    and identifying key threats such as poaching and deforestation, the initiative
    will generate critical data to inform evidence-based conservation strategies.
- claim: CCD says it has conducted and continues systematic field surveys and monitoring
    of the two douc species, and plans to share the data with the national park.
  url: https://www.ccd.org.vn/en/post/conserving-douc-langurs-in-chu-mom-ray-national-park-from-awareness-to-action
  fetched: 2026-11-15
  quote: CCD has conducted—and continues to undertake—systematic field surveys and
    monitoring to improve knowledge of population status, ecological traits, and habitat
    changes affecting the two douc species.
