id: chu-mom-ray-douc-langur-conservation-and-monitoring
kind: project
name: 'Conservation of Two Critically Endangered Species: Red-shanked Douc and Grey-shanked
  Douc in Chu Mom Ray National Park, Vietnam'
scope: vn
ai_label: conservation-tech
realms:
