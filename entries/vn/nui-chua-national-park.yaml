summary: National park in the Núi Chúa World Biosphere Reserve that, per Viet Nam
  News, recorded 585 nesting female turtles and 203 successful nests from 2014 to
  early October 2025.
facts:
- claim: Viet Nam News reports that between 2014 and early October 2025 the park recorded
    585 female turtles coming ashore to nest and 203 successful nests.
  url: https://vietnamnews.vn/environment/1726552/over-1-300-sea-turtle-hatchlings-return-to-the-ocean-in-nui-chua.html
  fetched: 2026-11-13
  quote: Statistics show that between 2014 and early October 2025, Núi Chúa National
    Park recorded 585 female turtles coming ashore to nest, 203 successful nests,
    and a total of 12,749 hatchlings released safely into the sea.
- claim: From April to 3 October 2025, 57 female turtles came ashore to search for
    nesting sites, with 30 laying eggs; 14 nests were still being monitored.
  url: https://vietnamnews.vn/environment/1726552/over-1-300-sea-turtle-hatchlings-return-to-the-ocean-in-nui-chua.html
  fetched: 2026-11-13
  quote: Of these, 16 nests have hatched with 1,631 eggs, while 14 nests are still
    being monitored.
- claim: It is part of the Núi Chúa World Biosphere Reserve in Khánh Hòa Province.
  url: https://vietnamnews.vn/environment/1726552/over-1-300-sea-turtle-hatchlings-return-to-the-ocean-in-nui-chua.html
  fetched: 2026-11-13
  quote: Núi Chúa National Park, part of the Núi Chúa World Biosphere Reserve in Khánh
    Hòa Province
