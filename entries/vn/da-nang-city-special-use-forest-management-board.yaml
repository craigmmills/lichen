summary: Forest management board that, according to Tiền Phong, recorded nine elephants
  after months of camera trapping with 45 traps at 15 points in the almost 19,000-hectare
  Đà Nẵng elephant reserve.
facts:
- claim: After months of camera trapping, the board recorded nine elephants in the
    Đà Nẵng elephant species and habitat reserve (Tiền Phong).
  url: https://tienphong.vn/niem-vui-vo-oa-khi-dan-voi-ngang-qua-post1877656.tpo
  fetched: 2026-11-15
  quote: Sau mấy tháng ròng rã đặt bẫy ảnh, Ban quản lý rừng đặc dụng Đà Nẵng đã phát
    hiện 9 chú voi trong Khu bảo tồn loài và sinh cảnh voi thành phố Đà Nẵng.
- claim: Its team placed 45 camera traps at 15 points in three sub-compartments (Tiền
    Phong).
  url: https://tienphong.vn/niem-vui-vo-oa-khi-dan-voi-ngang-qua-post1877656.tpo
  fetched: 2026-11-15
  quote: Cho đến khi 45 bẫy ảnh đặt ở 15 điểm tại 3 tiểu khu xong xuôi
- claim: The elephant reserve covers almost 19,000 hectares in Quế Phước commune (Tiền
    Phong).
  url: https://tienphong.vn/niem-vui-vo-oa-khi-dan-voi-ngang-qua-post1877656.tpo
  fetched: 2026-11-15
  quote: Khu bảo tồn loài và sinh cảnh voi thành phố Đà Nẵng có diện tích gần 19.000
    ha tại xã Quế Phước.
