summary: Listed under Decree 35/2025/ND-CP as a Ministry of Agriculture and Environment unit,
  with a runs link to the Department of Survey, Mapping and Geographic Information of Vietnam.
facts:
- claim: Listed in Decree 35/2025/ND-CP as a unit of the Ministry of Agriculture and Environment.
  url: https://english.luatvietnam.vn/co-cau-to-chuc/decree-35-2025-nd-cp-the-functions-tasks-powers-of-the-ministry-of-agriculture-and-environment-391751-d1.html
  fetched: 2026-11-08
  quote: The Department of Forestry and Forest Protection.
- claim: Decree 35/2025/ND-CP sets the ministry's functions as state management of fields
    including agriculture and forestry.
  url: https://english.luatvietnam.vn/co-cau-to-chuc/decree-35-2025-nd-cp-the-functions-tasks-powers-of-the-ministry-of-agriculture-and-environment-391751-d1.html
  fetched: 2026-11-08
  quote: 'The Ministry of Agriculture and Environment is an agency of the Government, performing
    the state management of the following fields: agriculture; forestry'
- claim: The decree gives the ministry tasks in nature and biodiversity conservation, including
    the national master plan on biodiversity conservation.
  url: https://english.luatvietnam.vn/co-cau-to-chuc/decree-35-2025-nd-cp-the-functions-tasks-powers-of-the-ministry-of-agriculture-and-environment-391751-d1.html
  fetched: 2026-11-08
  quote: Regarding nature and biodiversity conservation a/ To formulate, submit for approval,
    announce, and organize and evaluate the implementation of, the national master plan on
    biodiversity conservation
- claim: A 2020 news item on the ministry site says the Ministry of Natural Resources and
    Environment had completed a draft project on monitoring natural resources and the environment,
    including mangroves, coral and seagrass, by remote sensing, for the Prime Minister to
    approve.
  url: https://en.mae.gov.vn/remote-sensing/monitoring-resources-and-environment-by-remote-sensing-technology-5747.htm
  fetched: 2026-11-08
  quote: Ministry of Natural Resources and Environment has just completed the project "Monitoring
    natural resources and environment by remote sensing technology" to submit to the Prime
    Minister for approval.
- claim: Listed in Decree 35/2025/ND-CP as a unit of the Ministry of Agriculture and Environment.
  url: https://english.luatvietnam.vn/co-cau-to-chuc/decree-35-2025-nd-cp-the-functions-tasks-powers-of-the-ministry-of-agriculture-and-environment-391751-d1.html
  fetched: 2026-11-08
  quote: The National Remote Sensing Department.
- claim: A 2025 ministerial decision sets up its Centre for Monitoring Agriculture, Natural
    Resources and Environment, a public unit under the department that monitors by remote
    sensing.
  url: https://nrsd.mae.gov.vn/noidung/Lists/ListTinTuc/Attachments/2564/637-Q%C4%90-BNNMT-CNNV-TTGiamSat.pdf
  fetched: 2026-11-08
  quote: có chức n ăng thực hiện các nhiệm vụ giám sát nông nghiệp, tài nguyên và môi tr ường
    bằng công nghệ viễn thám
- claim: The decision tasks the centre with building and managing image interpretation keys
    and a spectral library to support automated analysis and extraction of information from
    remote sensing data.
  url: https://nrsd.mae.gov.vn/noidung/Lists/ListTinTuc/Attachments/2564/637-Q%C4%90-BNNMT-CNNV-TTGiamSat.pdf
  fetched: 2026-11-08
  quote: viễn thám; xây dựng, quản lý hệ thống khóa giải đoán ảnh, thư viện phổ và chuẩn
- claim: Listed in Decree 35/2025/ND-CP as a unit of the Ministry of Agriculture and Environment.
  url: https://english.luatvietnam.vn/co-cau-to-chuc/decree-35-2025-nd-cp-the-functions-tasks-powers-of-the-ministry-of-agriculture-and-environment-391751-d1.html
  fetched: 2026-11-08
  quote: The Nature and Biodiversity Conservation Agency
- claim: Its site publishes Viet Nam's national biodiversity reports for 2011 and 2022.
  url: https://nbca.gov.vn/bao-cao-ve-da-dang-sinh-hoc/
  fetched: 2026-11-08
  quote: ĐA DẠNG SINH HỌC 2022
- claim: Its site lists the functions of its Biodiversity Survey and Monitoring Centre.
  url: https://nbca.gov.vn/gioi-thieu/chuc-nang-nhiem-vu/
  fetched: 2026-11-08
  quote: Chức năng nhiệm vụ của Trung tâm Điều tra, Quan trắc đa dạng sinh học
- claim: Its functions were set most recently by Decision 215/QĐ-BNNMT of 1 March 2025 of
    the Minister of Agriculture and Environment.
  url: https://nbca.gov.vn/gioi-thieu/lich-su-hinh-thanh/
  fetched: 2026-11-08
  quote: Quyết định số 215/QĐ-BNNMT ngày 01 tháng 03 năm 2025 của Bộ trưởng Bộ Nông nghiệp
    và Môi trường
- claim: Its site gives its address as 10 Tôn Thất Thuyết, Cầu Giấy, Hà Nội.
  url: https://nbca.gov.vn/gioi-thieu/lich-su-hinh-thanh/
  fetched: 2026-11-08
  quote: Số 10 Tôn Thất Thuyết, Phường Cầu Giấy, Hà Nội
- claim: Its functions, duties and structure were set by Decree 35/2025/ND-CP of 25 February
    2025.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: Chính phủ ban hành Nghị định số 35/2025/NĐ-CP ngày 25/2/2025 Quy định chức năng,
    nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Nông nghiệp và Môi trường.
- claim: The government body carrying out state management of fields that include agriculture,
    forestry, salt production, fisheries and irrigation.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: 'Bộ Nông nghiệp và Môi trường là cơ quan của Chính phủ thực hiện chức năng quản lý
    nhà nước về các lĩnh vực: nông nghiệp; lâm nghiệp; diêm nghiệp; thủy sản; thủy lợi'
- claim: Its duties on nature conservation and biodiversity include guiding and organising
    baseline surveys, monitoring, inventories, databases and reports on nature conservation
    and biodiversity.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: Hướng dẫn, tổ chức điều tra cơ bản, quan trắc, kiểm kê, thống kê, xây dựng cơ sở
    dữ liệu, báo cáo về bảo tồn thiên nhiên và đa dạng sinh học theo quy định của pháp luật
- claim: Its departments include the Department of Nature Conservation and Biodiversity (Cục
    Bảo tồn thiên nhiên và Đa dạng sinh học).
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: 22- Cục Bảo tồn thiên nhiên và Đa dạng sinh học;
- claim: Its departments include the Department of Forestry and Forest Protection (Cục Lâm
    nghiệp và Kiểm lâm).
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: 12- Cục Lâm nghiệp và Kiểm lâm;
- claim: Its departments include the National Remote Sensing Department (Cục Viễn thám quốc
    gia).
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: 26- Cục Viễn thám quốc gia;
- claim: Its contact address is 10 Ton That Thuyet, Hanoi.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: '2026-11-08'
  quote: 'Liên hệ: Số 10 Tôn Thất Thuyết - Hà Nội'
