summary: Conservation organisation that, according to VietNamNet, led a four-year camera-trap
  wildlife survey across 21 forests, totalling more than 350,000 camera-trap days, with WWF-US
  and others under a USAID project.
facts:
- claim: VietNamNet reports that WWF-Vietnam surveyed wildlife trends over four years with
    systematic camera trapping across 21 special-use and protection forests, with more than
    350,000 camera-trap days.
  url: https://vietnamnet.vn/en/vietnam-s-forests-show-signs-of-wildlife-recovery-2465714.html
  fetched: 2026-11-08
  quote: WWF-Vietnam conducted a survey of the country’s forest ecosystems and trends in its
    wildlife populations over four years through systematic camera-trapping surveys across
    21 Special-Use Forests (SUFs) and Protection Forests (PFs), capturing data from more than
    350,000 camera-trap days.
- claim: VietNamNet reports that the survey was led by WWF-Vietnam and WWF-US under the USAID
    Biodiversity Conservation project, with local forest management boards and the Leibniz
    Institute for Zoo and Wildlife Research.
  url: https://vietnamnet.vn/en/vietnam-s-forests-show-signs-of-wildlife-recovery-2465714.html
  fetched: 2026-11-08
  quote: Led by WWF-Vietnam and WWF-US under the USAID Biodiversity Conservation project,
    in collaboration with local forest management boards and the Leibniz Institute for Zoo
    and Wildlife Research
- claim: The survey findings were presented at the Applied Conservation Technology Congress.
  url: https://vietnamnet.vn/en/vietnam-s-forests-show-signs-of-wildlife-recovery-2465714.html
  fetched: 2026-11-08
  quote: The findings of this landmark survey were presented at the Applied Conservation Technology
