summary: Autonomous national conservation NGO from BirdLife's Viet Nam programme,
  involved in a 2013 Spoon-billed Sandpiper census, with IUCN reporting a new BirdLife
  migratory species monitoring project in 2021.
facts:
- claim: Describes itself as an autonomous national conservation NGO that grew from
    BirdLife's programme in Viet Nam, with biodiversity monitoring among its areas
    of work.
  url: https://www.thiennhienviet.org.vn/en/about/
  fetched: 2026-11-12
  quote: 'Viet Nature’s works focus on: conservation action on the ground; biodiversity
    monitoring;'
- claim: Its about page calls it an autonomous national conservation NGO.
  url: https://www.thiennhienviet.org.vn/en/about/
  fetched: 2026-11-12
  quote: Viet Nature Conservation Centre is an autonomous national conservation NGO
    in Vietnam
- claim: Took part in December 2013 in a global census of Spoon-billed Sandpiper wintering
    grounds, surveying coasts of the Red River and Mekong deltas.
  url: https://www.thiennhienviet.org.vn/?p=307
  fetched: 2026-11-12
  quote: During the week of 16-21 December 2013, Viet Nature participated in a global
    census of Spoon-billed Sandpiper wintering grounds supported by the Royal Society
    for the Protection of Birds (RSBP).
- claim: IUCN reported in 2021 that it began a project with BirdLife International
    to build protected-area staff capacity to monitor threatened migratory species,
    with a planned focus on Xuan Thuy National Park and the Thai Binh Wetland Conservation
    Area.
  url: https://www.iucn.org/news/asia/202111/strengthening-local-capacity-monitor-migratory-waterbirds-northern-viet-nam
  fetched: 2026-11-12
  quote: Viet Nature Conservation Centre commenced a new project in collaboration
    with BirdLife International to build the capacity of protected area staff to monitor
    and conserve threatened migratory species
