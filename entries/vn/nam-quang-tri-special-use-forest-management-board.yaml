summary: Forest management board that, according to VietnamPlus, surveyed 10 transects
  and placed 34 camera traps, and reported 228 bird species, 139 directly recorded,
  in a June to September 2026 study in Đakrông Nature Reserve.
facts:
- claim: The board surveyed 10 transects totalling more than 36.6 km and set up 10
    bird capture-and-release points (VietnamPlus).
  url: https://www.vietnamplus.vn/3-loai-chim-trong-sach-do-viet-nam-xuat-hien-tai-khu-bao-ton-thien-nhien-dakrong-post1143223.vnp
  fetched: 2026-11-15
  quote: Ban Quản lý rừng đặc dụng Nam Quảng Trị đã khảo sát 10 tuyến xuyên qua các
    dạng sinh cảnh
- claim: According to the board, the June–September 2026 bird study in Đakrông Nature
    Reserve listed 228 species, including 139 recorded directly and 89 drawn from
    earlier studies (VietnamPlus).
  url: https://www.vietnamplus.vn/3-loai-chim-trong-sach-do-viet-nam-xuat-hien-tai-khu-bao-ton-thien-nhien-dakrong-post1143223.vnp
  fetched: 2026-11-15
  quote: qua 3 tháng điều tra, đánh giá đa dạng khu hệ chim tại Khu bảo tồn thiên
    nhiên Đakrông, đơn vị đã ghi nhận 228 loài chim thuộc 55 họ, 17 bộ.
- claim: The unit placed 34 camera traps at 34 survey points, each running more than
    60 days and nights (VietnamPlus).
  url: https://www.vietnamplus.vn/3-loai-chim-trong-sach-do-viet-nam-xuat-hien-tai-khu-bao-ton-thien-nhien-dakrong-post1143223.vnp
  fetched: 2026-11-15
  quote: đơn vị đã bố trí 34 máy bẫy ảnh tại 34 điểm khảo sát với tổng thời gian hoạt
    động đạt trên 60 ngày đêm/máy
