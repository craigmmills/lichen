summary: University that publishes biodiversity datasets, including endemic insects of Vietnam
  and a 2023 camera-trap survey of terrestrial vertebrates in Xuan Lien Nature Reserve intended
  to establish a monitoring database.
facts:
- claim: Publishes the Endemic Insects of Vietnam dataset, built from a national research
    project on the taxonomy and distribution of endemic insects, supported by the Ministry
    of Science and Technology and carried out at its Faculty of Biology.
  url: https://api.gbif.org/v1/organization/26436826-4777-475c-b087-c5280cf704fe/publishedDataset
  fetched: '2026-11-08'
  quote: supported by the Vietnam Ministry of Science and Technology, that is conducted at
    the Faculty of Biology, University of Science, Vietnam National University, Hanoi.
- claim: Publishes a dataset from a systematic camera-trap survey of terrestrial vertebrates
    in Xuan Lien Nature Reserve, Thanh Hoa Province, from February to June 2023, intended
    to establish a monitoring database.
  url: https://api.gbif.org/v1/organization/26436826-4777-475c-b087-c5280cf704fe/publishedDataset
  fetched: '2026-11-08'
  quote: We provide a dataset of terrestrial vertebrates from systematic camera trapping survey
    in Xuan Lien Nature Reserve, Thanh Hoa Province, Vietnam, from February 2023 to June 2023.
