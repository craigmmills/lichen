summary: Not-for-profit research organisation in Ho Chi Minh City, established under a VUSTA
  decision, that publishes GBIF datasets on cetacean strandings and marine mammal encounters
  in Vietnam.
facts:
- claim: Its GBIF publisher record describes it as a not-for-profit research organisation
    established under a decision of the Vietnam Union of Science and Technology Associations
    (VUSTA).
  url: https://api.gbif.org/v1/organization/457fbdb9-ef71-4d0f-b5c7-e67b01372cd9
  fetched: '2026-11-08'
  quote: is a not-for-profit research organization that established under decision No 965-LHHVN
    of the Vietnam Union of Science and Technology Associations (VUSTA)
- claim: Publishes a dataset of cetacean stranding cases reported in the media in Vietnam,
    mobilised with the Vietnam Marine Megafauna Network.
  url: https://api.gbif.org/v1/dataset/5b8b3849-659d-4a08-b268-1a8edaff7e9b
  fetched: '2026-11-08'
  quote: This dataset included all cetacean stranding cases reported in media in Vietnam.
    The data were mobilised by CBES and Vietnam Marine Megafauna Network
- claim: Publishes a dataset of marine mammal encounters in Vietnam recorded by local fishermen,
    tourists, ship crews and marine protected area staff.
  url: https://api.gbif.org/v1/dataset/8dd916d3-848b-4fae-9e69-ba0d01ff0396
  fetched: '2026-11-08'
  quote: This dataset contains the records of marine mammal encounters made by local fishermen,
    tourists, ship crews and staff of marine protected areas in Vietnam.
- claim: Its GBIF publisher record gives an address in District 2, Ho Chi Minh City.
  url: https://api.gbif.org/v1/organization/457fbdb9-ef71-4d0f-b5c7-e67b01372cd9
  fetched: '2026-11-08'
  quote: '"address":["541 Nguyen Duy Trinh, Binh Trung Dong ward, District 2"],"city":"Ho
    Chi Minh city","country":"VN"'
- claim: Publishes on GBIF a dataset of marine mammal encounters reported through citizen
    science apps.
  url: https://api.gbif.org/v1/organization/457fbdb9-ef71-4d0f-b5c7-e67b01372cd9/publishedDataset
  fetched: 2026-11-08
  quote: CBES marine mammals encounters through citizen science apps (2022)
- claim: Publishes on GBIF a dataset of cetacean strandings in Vietnam from 2004, mobilised
    with the Vietnam Marine Megafauna Network.
  url: https://api.gbif.org/v1/organization/457fbdb9-ef71-4d0f-b5c7-e67b01372cd9/publishedDataset
  fetched: 2026-11-08
  quote: The data were mobilised by CBES and Vietnam Marine Megafauna Network
