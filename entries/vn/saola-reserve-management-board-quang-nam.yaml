summary: Board of the Quảng Nam saola reserve, established in 2012, that has used
  camera traps, SMART Mobile data storage and a GreenViet partnership with leech and
  water samples to assess biodiversity.
facts:
- claim: The reserve was established by Decision 2265/QĐ-UBND of the Quảng Nam People's
    Committee on 13 July 2012 (Tạp chí Tòa án nhân dân).
  url: https://tapchitoaan.vn/ban-quan-ly-khu-bao-ton-loai-sao-la-gop-phan-bao-ton-da-dang-sinh-hoc-bao-ve-cac-loai-dong-thuc-vat-quy-hiem10046.html
  fetched: 2026-11-15
  quote: được thành lập theo Quyết định số 2265/QĐ-UBND ngày 13/7/2012 của UBND tỉnh
    Quảng Nam
- claim: The board set up 45 camera traps in sub-compartment 14 to record saola (Tạp
    chí Tòa án nhân dân).
  url: https://tapchitoaan.vn/ban-quan-ly-khu-bao-ton-loai-sao-la-gop-phan-bao-ton-da-dang-sinh-hoc-bao-ve-cac-loai-dong-thuc-vat-quy-hiem10046.html
  fetched: 2026-11-15
  quote: Ban Quản lý đã tổ chức thiết lập 45 bẫy ảnh tại tiểu khu 14 nhằm ghi nhận
    hình ảnh của loài Sao la
- claim: With a sustainable forest management and biodiversity project, the board
    set and retrieved 50 camera traps at 25 points and stored the data in SMART Mobile
    to assess the reserve's biodiversity (Tạp chí Tòa án nhân dân).
  url: https://tapchitoaan.vn/ban-quan-ly-khu-bao-ton-loai-sao-la-gop-phan-bao-ton-da-dang-sinh-hoc-bao-ve-cac-loai-dong-thuc-vat-quy-hiem10046.html
  fetched: 2026-11-15
  quote: thiết lập và thu hồi 50 bẫy ảnh tại 25 điểm trong lâm phận Khu bảo tồn loài
    Sao la và lưu dữ liệu trên công cụ Smart Mobile
- claim: With GreenViet it set 224 camera traps in 14 survey plots and collected 28
    leech samples and 28 water samples (Tạp chí Tòa án nhân dân).
  url: https://tapchitoaan.vn/ban-quan-ly-khu-bao-ton-loai-sao-la-gop-phan-bao-ton-da-dang-sinh-hoc-bao-ve-cac-loai-dong-thuc-vat-quy-hiem10046.html
  fetched: 2026-11-15
  quote: tổ chức thiết lập 224 bẫy ảnh tại 14 ô khảo sát, thu 28 mẫu vắt (20 cá thể/mẫu)
    và 28 mẫu nước
