id: sustainable-forest-management-and-biodiversity-conservation-project-viet-nam
kind: project
name: Sustainable Forest Management and Biodiversity Conservation Project (VFBC)
also_known_as:
- VFBC
- Dự án Quản lý rừng bền vững và Bảo tồn đa dạng sinh học
scope: vn
ai_label: conservation-tech
realms:
- land
countries:
- vn
status: closed
summary: Closed USAID-funded project run by WWF-Viet Nam, whose 2023 workshop presented
  forest monitoring in 21 areas and a camera-trap baseline, and which ran 91 activities
  at Cúc Phương from 2021 to 2025.
facts:
- claim: An NBCA news page says the workshop of 25 October 2023 ran under the biodiversity
    conservation component of the USAID-funded VFBC project, implemented by WWF-Viet
    Nam with the Ministry of Agriculture and Rural Development.
  url: https://en.nbca.gov.vn/hoi-thao-chi-so-ve-tinh-lien-tuc-cua-rung-da-dang-sinh-hoc-va-cac-moi-de-doa-tai-21-khu-rung-dac-dung-phong-ho-cua-viet-nam/
  fetched: 2026-11-12
  quote: this is operating under the Biodiversity Conservation Component, Sustainable
    Forest Management and Biodiversity Conservation (VFBC) Project funded by the United
    States Agency for International Development (USAID)
- claim: Results presented covered forest continuity monitoring in 21 forest areas,
    wildlife monitoring methods and a camera-trap biodiversity baseline.
  url: https://en.nbca.gov.vn/hoi-thao-chi-so-ve-tinh-lien-tuc-cua-rung-da-dang-sinh-hoc-va-cac-moi-de-doa-tai-21-khu-rung-dac-dung-phong-ho-cua-viet-nam/
  fetched: 2026-11-12
  quote: Wildlife monitoring methods and tools; Biodiversity baseline report based
    on camera traps.
- claim: The NBCA page says the project established the foundation for a long-term
    monitoring programme for terrestrial mammals and birds in Viet Nam.
  url: https://en.nbca.gov.vn/hoi-thao-chi-so-ve-tinh-lien-tuc-cua-rung-da-dang-sinh-hoc-va-cac-moi-de-doa-tai-21-khu-rung-dac-dung-phong-ho-cua-viet-nam/
  fetched: 2026-11-12
  quote: the Project has established the foundation for a long-term biodiversity monitoring
    program for terrestrial mammals and birds in Vietnam
- claim: From 2021 to 2025 VFBC ran 91 activities at Cúc Phương with nearly USD 655,000,
    including camera trapping that recorded the serow.
  url: https://tienphong.vn/phat-hien-son-duong-quy-hiem-o-vuon-quoc-gia-cuc-phuong-post1854210.tpo
  fetched: 2026-11-12
  quote: Giai đoạn 2021-2025, VFBC triển khai 91 hoạt động tại Cúc Phương với nguồn
    lực gần 655.000 USD.
