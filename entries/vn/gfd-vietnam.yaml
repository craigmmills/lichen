  quote: Phòng 705, số 14 Trần Hưng Đạo, P. Phan Chu Trinh, Q. Hoàn Kiếm, TP. Hà Nội
- claim: Says it works with government, private and non-government clients on GIS for forestry,
    water resources and environmental monitoring.
  url: https://gfd.com.vn/en/
  fetched: 2026-11-08
