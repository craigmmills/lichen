  url: https://gfd.com.vn/en/developing-a-forest-monitoring-system-for-tan-mai-group-joint-stock-company/
  fetched: 2026-11-08
  quote: The forest monitoring system of Tan Mai Company (FMS Tan Mai) developed by GFD is
