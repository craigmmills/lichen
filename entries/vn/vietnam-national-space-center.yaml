summary: Space centre set up in 2011 under the Vietnam Academy of Science and Technology,
  working on satellite and remote sensing technology, and a CEOS member since 2013.
facts:
- claim: As 2019 CEOS chair, VAST-VNSC led an initiative to integrate CEOS activities, data
    and algorithms for forest and rice crop monitoring in the Mekong Delta.
  url: https://ceos.org/2019chairinitiative
  fetched: 2026-11-08
  quote: As 2019 CEOS Chair, VAST-VNSC is leading an initiative to integrate a number of ongoing
    CEOS activities, data, algorithms, and training/capacity building in support of forest
    and rice crop monitoring for the Mekong Delta region.
- claim: An OpenAlex record gives its address as part of the Vietnam Academy of Science and
    Technology at 18 Hoang Quoc Viet, Hanoi, on a 2020 paper on mangrove extent, age and species
    in the Red River estuaries.
  url: https://api.openalex.org/works/W3043127529?select=id,display_name,publication_year,authorships
  fetched: 2026-11-08
  quote: Vietnam National Space Center (VNSC), Vietnam Academy of Science and Technology (VAST),
    18 Hoang Quoc Viet, Hanoi 100000, Vietnam
- claim: OpenAlex lists the 2020 paper Multi-Decadal Changes in Mangrove Extent, Age and Species
    in the Red River Estuaries of Viet Nam.
  url: https://api.openalex.org/works/W3043127529?select=id,display_name,publication_year,authorships
  fetched: 2026-11-08
  quote: Multi-Decadal Changes in Mangrove Extent, Age and Species in the Red River Estuaries
