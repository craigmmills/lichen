- claim: The government set up the National Satellite Center under the Vietnam Academy of
    Science and Technology on 16 September 2011 to manage and carry out the Vietnam Space
    Center project.
  url: https://vnsc.org.vn/vi/gioi-thieu/trung-tam-vu-tru-viet-nam/
  fetched: '2026-11-08'
  quote: Chính phủ đã thành lập Trung tâm Vệ tinh Quốc gia (TTVTQG) thuộc Viện Hàn lâm Khoa
    học và Công nghệ Việt Nam (Viện Hàn lâm KH&CN VN) vào ngày 16/09/2011
- claim: Its work includes research and development of satellite, ground station, remote sensing
    and satellite positioning technology.
