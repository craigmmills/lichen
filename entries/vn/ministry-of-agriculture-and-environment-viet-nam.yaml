summary: Ministry whose duties, set by Decree 35/2025/ND-CP, include organising biodiversity
  baseline surveys, monitoring and databases and drawing up the national master plan,
  and which runs four departments and agencies.
facts:
- claim: Its functions, duties and structure were set by Decree 35/2025/ND-CP of 25
    February 2025.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: 2026-11-13
  quote: Chính phủ ban hành Nghị định số 35/2025/NĐ-CP ngày 25/2/2025 Quy định chức
    năng, nhiệm vụ, quyền hạn và cơ cấu tổ chức của Bộ Nông nghiệp và Môi trường.
- claim: Its duties on nature conservation and biodiversity include guiding and organising
    baseline surveys, monitoring, inventories, statistics, databases and reports.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: 2026-11-13
  quote: Hướng dẫn, tổ chức điều tra cơ bản, quan trắc, kiểm kê, thống kê, xây dựng
    cơ sở dữ liệu, báo cáo về bảo tồn thiên nhiên và đa dạng sinh học theo quy định
    của pháp luật
- claim: Its duties include drawing up and implementing the national biodiversity
    conservation master plan.
  url: https://botruong.mae.gov.vn/Pages/chi-tiet-tin-tuc.aspx?ItemID=2537
  fetched: 2026-11-13
  quote: Tổ chức lập, trình phê duyệt, công bố, tổ chức thực hiện và đánh giá việc
    thực hiện quy hoạch bảo tồn đa dạng sinh học quốc gia theo quy định của pháp luật
