summary: According to Save Vietnam's Wildlife, this Nghệ An park co-manages an anti-poaching
  unit established in 2018 and uses SMART and AI Poachercam for patrols and biodiversity
  monitoring.
facts:
- claim: Save Vietnam's Wildlife says the anti-poaching unit it set up at Pu Mat in
    2018 is co-managed by the park and SVW.
  url: https://www.svw.vn/en/site-protections
  fetched: 2026-11-12
  quote: This force is co-managed by Pu Mat National Park and SVW.
- claim: The forest protection force uses SMART and AI Poachercam technology to track
    patrols and monitor biodiversity.
  url: https://www.svw.vn/en/site-protections
  fetched: 2026-11-12
  quote: They utilize the SMART program and AI Poachercam technology to track patrol
    results, monitor biodiversity, and conduct outreach to gather information.
- claim: Located along the Truong Son range in Nghệ An, with records of 2,494 plant
    and 132 mammal species.
  url: https://www.svw.vn/en/site-protections
  fetched: 2026-11-12
  quote: Pu Mat boasts a diverse ecosystem with 2,494 plant species, 132 mammal species,
    324 bird species, and 86 reptile and amphibian species.
- claim: A Rufford project page says government rangers and SVW's anti-poaching teams
    in Pu Mat have applied the SMART framework since 2018.
  url: https://rufford.org/projects/thi-mai-trinh/poachers-patrols-and-protection-an-integrative-solution-to-owstons-civet-conservation-in-vietnam
  fetched: 2026-11-12
  quote: By applying the SMART anti-poaching framework since 2018, government rangers
    and SVW’s anti-poaching teams in Pu Mat have become more effective in law enforcement
    and aiding conservation planning
