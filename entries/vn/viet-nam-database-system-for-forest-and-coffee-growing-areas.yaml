summary: Database launched on 17 December 2024 by the Ministry of Agriculture and
  Rural Development, IDH and JDE Peet's, integrating land-use, cadastral and production
  area data, which IDH says will enable deforestation risk assessments.
facts:
- claim: The Ministry of Agriculture and Rural Development, IDH and JDE Peet's launched
    the database system on 17 December 2024.
  url: https://idh.org/news/vietnams-coffee-sector-marks-a-landmark-step-towards-sustainability-launching-the-eudr-database-system-for-forest-and-coffee-growing-areas
  fetched: 2026-11-15
  quote: On 17 December 2024, the Ministry of Agriculture and Rural Development (MARD),
    IDH and JDE Peet’s, in collaboration with local and international partners, officially
    launched the Database System for Forest and Coffee Growing Areas.
- claim: It integrates land-use planning maps, cadastral maps and production area
    details, checked by field surveys.
  url: https://idh.org/news/vietnams-coffee-sector-marks-a-landmark-step-towards-sustainability-launching-the-eudr-database-system-for-forest-and-coffee-growing-areas
  fetched: 2026-11-15
  quote: Key datasets such as land-use planning maps , cadastral maps , and production
    area details have been meticulously collected and integrated into the system.
- claim: IDH says the platform will enable risk assessments and mitigation strategies
    for deforestation-free production.
  url: https://idh.org/news/vietnams-coffee-sector-marks-a-landmark-step-towards-sustainability-launching-the-eudr-database-system-for-forest-and-coffee-growing-areas
  fetched: 2026-11-15
  quote: This platform will also enable risk assessments and the implementation of
    mitigation strategies, ensuring that Vietnam’s coffee industry meets emerging
    market demands such as low emissions and deforestation-free production.
