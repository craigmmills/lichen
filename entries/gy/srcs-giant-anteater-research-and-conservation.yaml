facts:
- claim: In late 2020 SRCS announced a two-year giant anteater research and protection
    project funded by GEF's Small Grants Programme and a programme the page calls
    The Sustainable Management Programme – Guyana (SWM).
  url: https://www.srcs-gy.com/giant-anteaters
  fetched: '2026-11-12'
  quote: With funding from GEF’s Small Grants Programme (SGP) and The Sustainable
    Management Programme – Guyana (SWM), SRCS has started an ambitious new 2-year
    project to research and protect Giant Anteaters in the South Rupununi.
- claim: In October 2021, 40 camera traps on a 1 km grid were placed by SRCS rangers
    in Katoonarib's giant anteater safe zone to estimate population density.
  url: https://www.srcs-gy.com/giant-anteaters
  fetched: '2026-11-12'
  quote: 40 camera traps, spaced in a 1km by 1km were placed by a team of SRCS rangers
    from Katoonarib Village.
- claim: In September 2019, rangers were trained to use camera traps, GPS and the
    KoBo Collect data collection app.
  url: https://www.srcs-gy.com/giant-anteaters
  fetched: '2026-11-12'
  quote: how to use the data collection application KoBo Collect
