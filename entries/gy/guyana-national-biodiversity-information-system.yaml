summary: Platform for managing, visualising and analysing biodiversity data, built on Map of Life, forming
  the data foundation of Guyana's national monitoring initiative, with a border-to-border system planned
  by 2030.
facts:
- claim: Esri's ArcNews describes the NBIS as a platform for managing, visualising and analysing biodiversity
    data, and Guyana as one of its first adopters.
  url: https://www.esri.com/about/newsroom/arcnews/new-scalable-system-for-nationwide-biodiversity-monitoring
  fetched: 2026-11-08
  quote: One of the first adopters of the NBIS is Guyana, a country that’s teeming with biodiversity.
- claim: The NBIS is the technological and data management foundation of Guyana's National Biodiversity
    Monitoring Initiative.
  url: https://www.esri.com/about/newsroom/arcnews/new-scalable-system-for-nationwide-biodiversity-monitoring
  fetched: 2026-11-08
  quote: The NBIS is the technological and data management foundation of this initiative.
- claim: Its Regions tool generates species lists for protected areas, provinces and custom areas within
    Guyana.
  url: https://www.esri.com/about/newsroom/arcnews/new-scalable-system-for-nationwide-biodiversity-monitoring
  fetched: 2026-11-08
  quote: The National Biodiversity Information System (NBIS) Regions tool generates species lists for
    protected areas, provinces, and—as shown here—custom-drawn areas within Guyana.
- claim: Guyana Times reported in December 2025 that Guyana signed an agreement with the Yale Center for
    Biodiversity and Global Change at the Global Biodiversity Alliance Summit to implement a border-to-border
    national biodiversity monitoring system by 2030.
  url: https://guyanatimesgy.com/national-biodiversity-information-system-will-be-groundbreaking-epa-head
  fetched: 2026-11-08
  quote: Guyana had signed an agreement with the Yale Centre for Biodiversity and Global Change to implement
    the world’s first fully standardised, border-to-border national biodiversity monitoring system by
    2030
