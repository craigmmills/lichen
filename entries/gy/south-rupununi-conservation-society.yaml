summary: Society registered in 2002, according to Mongabay, that trains and pays local residents to research
  and protect wildlife, including camera-trap work on giant anteaters and armadillos.
facts:
- claim: Mongabay reports that it was officially registered in 2002.
  url: https://news.mongabay.com/2026/08/how-a-rare-bird-sparked-a-wildlife-movement-across-16-villages-in-guyana/
  fetched: 2026-11-08
  quote: The SRCS was officially registered in 2002 .
- claim: Mongabay reports that it trains and pays local residents to research and protect wildlife across
    the Rupununi.
  url: https://news.mongabay.com/2026/08/how-a-rare-bird-sparked-a-wildlife-movement-across-16-villages-in-guyana/
  fetched: 2026-11-08
  quote: What makes it stand out is its multi-community approach, which trains and pays local residents
    to research and protect wildlife across the Rupununi.
- claim: Its rangers used camera traps and field surveys to document giant armadillos and giant anteaters
    in a two-year project with three Wapichan communities.
  url: https://news.mongabay.com/2026/08/how-a-rare-bird-sparked-a-wildlife-movement-across-16-villages-in-guyana/
  fetched: 2026-11-08
  quote: Then, they used camera traps and field surveys to document them.
- claim: Working with four Indigenous communities, it placed cameras at trees used by giant anteaters
    and recorded 883 visits.
  url: https://news.mongabay.com/2026/08/how-a-rare-bird-sparked-a-wildlife-movement-across-16-villages-in-guyana/
  fetched: 2026-11-08
  quote: Working with four Indigenous communities, SRCS placed cameras at trees identified by locals.
    The resulting 883 recorded visits suggested the solitary animals use the trees to communicate.
- claim: Local rangers monitor red siskins and threats to their habitat in a conservation zone approved
    by five Indigenous communities.
  url: https://news.mongabay.com/2026/08/how-a-rare-bird-sparked-a-wildlife-movement-across-16-villages-in-guyana/
  fetched: 2026-11-08
  quote: where they establish rules and local rangers monitor the birds and threats to their habitat
