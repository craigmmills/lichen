summary: Village Council of Kanashen, a body corporate under Guyana's Amerindian Act
  and sole management authority of the Kanashen Amerindian Protected Area since its
  2017 declaration, employing rangers for monitoring, patrols and data collection,
  with Protected Areas Trust funding.
facts:
- claim: Guyana's Amerindian Act names the Kanashen Village Council among the Village
    Councils it covers.
  url: https://faolex.fao.org/docs/pdf/guy81428.pdf
  fetched: '2026-11-15'
  quote: Council, Kanashen Village Council, Baramita Village
- claim: Under the Amerindian Act a Village Council is a body corporate.
  url: https://faolex.fao.org/docs/pdf/guy81428.pdf
  fetched: '2026-11-15'
  quote: (2) A Village Council is a body corporate.
- claim: The 2017 declaration of Kanashen Village as an Amerindian Protected Area
    under the Protected Areas Act makes the Village Council its sole management authority.
  url: https://faolex.fao.org/docs/pdf/guy172051.pdf
  fetched: '2026-11-15'
  quote: The Village Council is the Sole Management Authority for the Amerindian
- claim: The Village Council employs a KAPA management team of rangers to carry out
    the protected area's technical work programme.
  url: https://www.pac.gov.gy/kanashen-amerindian-protected-area/
  fetched: '2026-11-15'
  quote: employs a KAPA Management Team of Rangers to implement the technical work
    programme
- claim: The protected area's biodiversity management work includes biodiversity inventories,
    monitoring and patrols, and data collection.
  url: https://www.pac.gov.gy/kanashen-amerindian-protected-area/
  fetched: '2026-11-15'
  quote: biodiversity inventories, monitoring and patrols, data collection and capacity
    building
- claim: A Protected Areas Trust grant from September 2023 to June 2025 to the Kanashen
    Amerindian Protected Area lists ecological monitoring patrols and a chartered
    flight for a biodiversity inventory with the Field Museum among its outputs.
  url: https://protectedareastrust.org.gy/grant/implementing-year-5-of-kanashen-amerindian-protected-area-management-plan-2/
  fetched: '2026-11-15'
  quote: Chartered flight for biodiversity inventory with Field Museum
