- claim: Its GBIF publisher record describes a project, "Enhancing Guyana's National Biodiversity Research
    Information System Database", to strengthen the management of biodiversity data and make it more accessible.
  url: https://api.gbif.org/v1/organization/e7cc89db-d984-4b46-bf67-fb2ffdcf1e22
