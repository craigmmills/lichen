  quote: The National Agricultural Research and Extension Institute (NAREI) was established
    following the assent of the National Agricultural Research and Extension Institute
    Act 2010 in March 2011.
- claim: Mangrove restoration and management were integrated into NAREI in 2014 after
    the Guyana Mangrove Restoration Project of 2010-2013.
