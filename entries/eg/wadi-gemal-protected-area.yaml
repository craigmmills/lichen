summary: Protected area covering 7,000 km² in Egypt’s Eastern Desert; a 2009 Oryx
  paper describes camera monitoring of ibex waterholes and a biologist’s responsibilities
  for bird, gazelle and ibex surveys.
facts:
- claim: A 2009 Oryx paper describes Wadi Gemal Protected Area as 7,000 km2 in Egypt's
    Eastern Desert.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
  fetched: 2026-11-12
  quote: Wadi Gemal Protected Area (7,000 km 2 ) in Egypt's Eastern Desert
- claim: The paper says camera traps were in use at selected waterholes in the protected
    area to monitor ibex waterhole use.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
  fetched: 2026-11-12
  quote: Local community guards still patrol the waterholes in Wadi Gemal Protected
    Area and camera traps are now employed at select waterholes to monitor ibex waterhole
    use.
- claim: The paper says a biologist for the protected area carried out bird surveys
    on Wadi Gemal Island and oversaw dorcas gazelle and Nubian ibex surveys on the
    mainland.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
