summary: Says it explores Egyptian desert resources and reports a remote sensing and GIS unit
  opened in 1988 and a gene bank storing 2,500 rare wild medicinal plants.
facts:
- claim: Says it aims to explore the natural resources of the Egyptian desert and plan their
    use for sustainable development.
  url: https://drc.gov.eg/en/about-us/
  fetched: 2026-11-08
  quote: Desert Research Centre aims to explore the natural resources in the Egyptian desert,
    and to develop plans to invest these resources to achieve sustainable development
- claim: Says its remote sensing and GIS unit opened in 1988, and that in 1991 it set up a
    ground station to receive NOAA satellite images to monitor climate and desertification
    at local and regional level.
  url: https://drc.gov.eg/%D9%88%D8%AD%D8%AF%D8%A9-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%B4%D8%B9%D8%A7%D8%B1-%D8%B9%D9%86-%D8%A8%D8%B9%D8%AF-%D9%88%D9%86%D8%B8%D9%85-%D8%A7%D9%84%D9%85%D8%B9%D9%84%D9%88%D9%85%D8%A7%D8%AA-%D8%A7/
  fetched: 2026-11-08
  quote: افتتحت هذه الوحدة عام 1988، وفى عام 1991 أنشأت محطة أرضية لاستقبال الصور الفضائية
    من الأقمار الصناعية NOAA الأمريكية بهدف رصد المظاهر المناخية ومظاهر التصحر على المستوى
    المحلى والإقليمي
- claim: Says its gene bank, set up in 1977, has collected and stored 2,500 rare wild medicinal
    plants.
  url: https://drc.gov.eg/en/genebank/
  fetched: 2026-11-08
  quote: Since its establishment in 1977, it has collected and stored 2,500 rare wild medicinal
    plants.
- claim: Says the HERD project, which it implemented with IUCN and CEDARE, designed a natural
    and rangeland database for research and decision makers.
  url: https://drc.gov.eg/en/herd-project/
  fetched: 2026-11-08
  quote: Design of the natural and rangeland data-base for research purposes and decision
    makers.
