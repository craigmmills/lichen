summary: Egyptian body founded by the Ministry of Tourism in 2007 for diving standards
  and Red Sea protection; it built the CDWS ECO Monitoring app for uploading marine
  species photos and videos.
facts:
- claim: The chamber was founded by Egypt's Ministry of Tourism in 2007 to improve
    the quality, safety and standards of the diving and water sports industry and
    to preserve the Red Sea environment.
  url: https://cdws.travel/info/environment/adoptareef
  fetched: 2026-11-12
  quote: The chamber of diving and watersports was founded by Egypt's Ministry of
    Tourism in 2007
- claim: The Adopt A Reef pilot page asks participating dive centres to monitor their
    site twice a year with video and photographs sent to CDWS to help create a reef-condition
    database. It says CDWS will administer the project with assistance from Eco-Dahab.
  url: https://cdws.travel/info/environment/adoptareef
  fetched: 2026-11-12
  quote: Monitor your dive site twice a year by taking videos and a series of pictures
    of the reef, once in winter and once in summer. Send the footage in one file to
    the CDWS. This will help create a database on the progress of the reefs over time.
- claim: It announced the CDWS ECO Monitoring app, whose environmental monitoring
    system lets professionals upload photos and videos of target marine species to
    build a database.
  url: https://www.cdws.travel/news/announcement-18-of-2025
  fetched: 2026-11-12
  quote: 'Environmental Monitoring System: Monitor and track marine life by allowing
    professionals to upload photos/videos of targeted marine species.'
