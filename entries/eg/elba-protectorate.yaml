summary: Protected area of 36,000 km² in Egypt’s Eastern Desert; a 2009 Oryx paper
  describes an author’s responsibility for monitoring dorcas gazelle, lappet-faced
  vulture and Egyptian vulture populations.
facts:
- claim: A 2009 Oryx paper describes Elba Protectorate as 36,000 km2 and places its
    study area in the protectorate's north, in Egypt's Eastern Desert.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
  fetched: 2026-11-12
  quote: The study areas are in northern Elba Protectorate (36,000 km 2 ) and Wadi
    Gemal Protected Area (7,000 km 2 ) in Egypt's Eastern Desert
- claim: The paper says one of its authors was responsible for the fauna of Elba Protectorate,
    monitoring the status of dorcas gazelle, lappet-faced vulture and Egyptian vulture
    populations.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
  fetched: 2026-11-12
  quote: is responsible for the fauna of Elba Protectorate, with an emphasis on monitoring
    the status of dorcas gazelle, lappet-faced vulture and Egyptian vulture populations
- claim: The paper was published online in September 2009.
  url: https://www.cambridge.org/core/journals/oryx/article/influence-of-landscape-characteristics-and-anthropogenic-factors-on-waterhole-use-by-vulnerable-nubian-ibex-capra-nubiana/50490DE8A358D9977798E5D21CF46E5F
