  fetched: 2026-11-15
  quote: December 15, 2022
- claim: In HEPCA's December 2022 announcement, the team said it was using genomics
    and computational biology to study the diversity and functions of the coral microbiome
    and its potential role in thermal resilience in these coral populations.
  url: https://www.hepca.org/news/a-new-research-project-to-understand-the-thermal-resilience-of-corals-in-the-egyptian-red-sea
  fetched: 2026-11-15
  quote: We are utilizing state-of-the-art technologies in genomics and computational
    biology to study the diversity and functions of the coral microbiome
- claim: In HEPCA's December 2022 announcement, the team planned heat-stress experiments
    on some coral species to assess their thermal tolerances.
  url: https://www.hepca.org/news/a-new-research-project-to-understand-the-thermal-resilience-of-corals-in-the-egyptian-red-sea
  fetched: 2026-11-15
  quote: the research team will collaborate to conduct heat-stress experiments on
    some coral species and assess their thermal tolerances.
