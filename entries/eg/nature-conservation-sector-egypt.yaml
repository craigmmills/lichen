facts:
- claim: A 2018 CBD workshop document describes the sector as Egypt's central institution
    for protected areas management and biodiversity conservation.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: The NCS is the central institution concerned with protected areas management and
    biodiversity conservation and coordination in Egypt.
- claim: The ministry's 2024 report says monitoring of the Egyptian gazelle in Siwa protectorate
    was completed and the report delivered to the sector.
  url: https://www.eeaa.gov.eg/Uploads/Reports/Files/20250113121923967.pdf
