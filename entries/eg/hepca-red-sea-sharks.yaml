summary: Research programme built and run by HEPCA, which says it gathers data on
  shark population structure, ecology and behaviour, using diver sightings and photo-identification,
  including of oceanic whitetip sharks.
facts:
- claim: HEPCA says it launched a research programme on Red Sea sharks to gather information
    on their population structure, ecology and behaviour.
  url: https://www.hepca.org/projects/conservation/red-sea-sharks
  fetched: 2026-11-15
  quote: The sharks of the Red Sea are a focus of a research program launched by HEPCA
    to gather information on their population structure, ecology and behavior for
    better conservation measures.
- claim: Diving professionals are asked to help monitor shark populations through
    sighting documentation and photo-identification.
  url: https://www.hepca.org/projects/conservation/red-sea-sharks
  fetched: 2026-11-15
  quote: The diving professionals in the Red Sea are continually called upon to help
    monitor the shark populations in the Egyptian Red Sea.
- claim: The Longimanus Initiative collects photographs and video of oceanic whitetip
    sharks to identify individuals from their natural markings and follow their movements.
  url: https://www.hepca.org/projects/conservation/longimanus-initiative
  fetched: 2026-11-15
  quote: the initiative collects photo and video footage of Oceanic Whitetip Sharks,
    which is then used to identify individual sharks with the help of their natural
    markings.
