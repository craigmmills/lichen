  fetched: 2026-11-08
  quote: Led by Prof. Mahmoud H. Hanafy and Dr. Mohamed Salem, the study highlights the impact
    of rising sea temperatures on coral ecosystems.
- claim: Its BleachWatch Egypt page says HEPCA aims, with the dive community, to have coral
    reef monitoring representation all over the Egyptian Red Sea.
  url: https://hepca.org/projects/conservation/bleach-watch-egypt
