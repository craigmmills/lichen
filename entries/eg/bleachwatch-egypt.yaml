facts:
- claim: HEPCA's page says BleachWatch Egypt ran workshops and trainings for a coral monitoring programme
    that began in Hurghada, Safaga, El Quseir and Marsa Alam.
  url: https://hepca.org/projects/conservation/bleach-watch-egypt
  fetched: 2026-11-08
  quote: BleachWatch Egypt launched a series of workshops and trainings for a coral monitoring program
    along the Red Sea coast. The program began in Hurghada, Safaga and El Quseir and Marsa Alam
- claim: The page says it derives from BleachWatch, a community coral reef monitoring programme of the
    Great Barrier Reef Marine Park Authority.
  url: https://hepca.org/projects/conservation/bleach-watch-egypt
  fetched: 2026-11-08
  quote: It is an offspring from BleachWatch, a community based coral reef monitoring program developed
    by the Great Barrier Reef Marine Park Authority (GRBMPA), Australia
