summary: Annual Red Sea coral reef monitoring programme announced in September 2025
  and run by Red Sea Protectorates, in which reserve specialists and university researchers
  use standardised surveys to measure coral cover and stress factors.
facts:
- claim: Announced by the acting environment minister in September 2025 as the country's
    annual coral reef monitoring programme in the Red Sea.
  url: https://dailynewsegypt.com/2025/09/07/egypt-launches-annual-coral-reef-monitoring-programme-in-red-sea/
  fetched: 2026-11-12
  quote: announced the launch of the country’s annual coral reef monitoring programme
    in the Red Sea
- claim: It is carried out each year by specialists from the Red Sea and South Sinai
    nature reserves with Egyptian university coral reef researchers.
  url: https://dailynewsegypt.com/2025/09/07/egypt-launches-annual-coral-reef-monitoring-programme-in-red-sea/
  fetched: 2026-11-12
  quote: the monitoring programme is carried out annually by specialists from the
    Red Sea and South Sinai nature reserves, in collaboration with Egyptian university
    researchers who specialize in coral reef ecosystems
- claim: The surveys use standardised methods to measure coral cover and assess stress
    factors such as temperature and pollution.
  url: https://dailynewsegypt.com/2025/09/07/egypt-launches-annual-coral-reef-monitoring-programme-in-red-sea/
  fetched: 2026-11-12
  quote: The surveys use standardized scientific methods to measure coral cover and
    evaluate external stress factors such as temperature fluctuations and pollution.
