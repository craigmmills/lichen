summary: A closed project, run by HEPCA, whose 2010 to 2013 monitoring plan set twelve
  weeks a year at sea, combining visual observation, towed hydrophone acoustic monitoring
  and photo-identification.
facts:
- claim: The monitoring plan set twelve weeks a year at sea for three years, from
    June 2010 to March 2013.
  url: https://www.hepca.org/projects/conservation/red-sea-dolphin-project
  fetched: 2026-11-12
  quote: The monitoring plan anticipates twelve weeks per year at sea, six in the
    summer (June to August) and six in the winter (December to March) for 3 years
    (from June 2010 to March 2013).
- claim: The 2010–2013 monitoring plan combined visual observation with passive acoustic
    monitoring through a towed hydrophone.
  url: https://www.hepca.org/projects/conservation/red-sea-dolphin-project
  fetched: 2026-11-12
  quote: The visual observation is carried on together with passive acoustic monitoring
    (PAM) through a towed hydrophone to increase the probability to detect dolphins
    using their vocalizations.
- claim: The 2010–2013 monitoring plan used photo-identification to identify individuals
    and confirm species.
  url: https://www.hepca.org/projects/conservation/red-sea-dolphin-project
  fetched: 2026-11-12
  quote: Photo-identification is applied to identify single individuals and to confirm
    species identification
