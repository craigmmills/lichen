summary: Described in a 2018 CBD document as Egypt's central environmental protection body,
  responsible for protectorates management and leading preparation of the national biodiversity
  strategy.
facts:
- claim: A 2018 CBD workshop document describes the agency as Egypt's central institution
    for environmental protection and coordination.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: The EEAA is the central institution concerned with environmental protection and coordination
    in Egypt.
- claim: The same document lists management of the protectorates among its responsibilities
    and gives it the lead role in preparing the National Biodiversity Strategy.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: management of the protectorates. The agency has the lead role in the preparation
    of the National Plan for Environmental Protection, National Oil Spill Contingency Plan,
    the National Biodiversity Strategy
- claim: Its site names it as an agency of the Ministry of Local Development and Environment.
  url: https://www.eeaa.gov.eg/
  fetched: 2026-11-08
  quote: حقوق النشر © 2026 جهاز شئون البيئة - وزارة التنمية المحلية والبيئة
- claim: The minister gave Egypt's address at a world leaders' summit for nature in Armenia.
  url: https://www.eeaa.gov.eg/
  fetched: 2026-11-08
  quote: وزيرة التنمية المحلية والبيئة تلقي كلمة مصر بقمة قادة العالم من أجل الطبيعة في أرمينيا
- claim: The Ministry of Environment’s 2024 report says it finished a draft national biodiversity
    strategy and action plan aligned with the Global Biodiversity Framework.
  url: https://www.eeaa.gov.eg/Uploads/Reports/Files/20250113121923967.pdf
  fetched: 2026-11-08
  quote: الانتهاء من مسودة الاستراتيجية الوطنية وخطة العمل للتنوع البيولوجي المتوافقة مع الإطار
    العالمي للتنوع
- claim: The 2024 report says the Ministry of Environment relied on satellites to monitor
    fires and open burning, and used them to detect pollution and oil slicks.
  url: https://www.eeaa.gov.eg/Uploads/Reports/Files/20250113121923967.pdf
  fetched: 2026-11-08
  quote: تعتمد وزارة البيئة على الأقمار الصناعية فى رصد الحرائق وتحديد نقاط الحرق المكشوف
- claim: Egypt Independent reported in April 2026 that the ministry launched a drone surveillance
    system and signed an agreement with DroneTech to implement it.
  url: https://www.egyptindependent.com/egypt-deploys-ai-powered-drones-to-track-pollution-and-environmental-violations/
  fetched: 2026-11-08
  quote: Egypt’s Ministry of Local Development and Environment signed a cooperation agreement
    with DroneTech to implement the system.
