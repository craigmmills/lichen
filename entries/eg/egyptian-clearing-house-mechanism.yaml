summary: Described in a 2018 document as a national biodiversity page updated in 2015, with no maintenance
  staff and two earlier versions no longer online.
facts:
- claim: The 2018 document says the national CHM page was updated in 2015 and contained information on
    nature reserves, strategies, action plans and national reports.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: The page was updated in 2015 and contains basic information on nature reserves, success stories,
    strategies, plans of action and national reports
- claim: The 2018 document lists no human resources available for its maintenance and development.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: No staff for operation and maintenance
- claim: The document says two earlier versions, one from 2001 on the EEAA server and one built by the
    BioMAP Project in 2008, were no longer online.
  url: https://www.cbd.int/doc/c/7680/4ce3/e78e31b775baacd64d79e48d/chmws-2018-01-item-07-eg-en.pdf
  fetched: 2026-11-08
  quote: There are two versions of CHM that had already been established and are not working online.
