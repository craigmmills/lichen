summary: A closed project, run by the Nature Conservation Sector and Nature Conservation
  Egypt and funded by the AEWA Small Grants Fund, which from 2011 to 2014 sought better
  breeding waterbird data and set up a database with historical counts.
facts:
- claim: AEWA says the project ran from April 2011 to December 2014 and was financed
    by the AEWA Small Grants Fund.
  url: https://www.unep-aewa.org/news/boost-conservation-waterbirds-breeding-red-sea-islands-egypt
  fetched: 2026-11-12
  quote: This project was implemented from April 2011 to December 2014 and financed
    in the framework of the AEWA Small Grants Fund (SGF).
- claim: Its aim was better data on breeding waterbird populations of the Red Sea
    islands, through systematic surveying and monitoring.
  url: https://www.unep-aewa.org/news/boost-conservation-waterbirds-breeding-red-sea-islands-egypt
  fetched: 2026-11-12
  quote: The project’s main aim was to improve the availability of data on breeding
    waterbird populations in the Red Sea islands
- claim: A waterbird database was set up within the Nature Conservation Sector's database,
    with historical counts entered.
  url: https://www.unep-aewa.org/news/boost-conservation-waterbirds-breeding-red-sea-islands-egypt
  fetched: 2026-11-12
  quote: A waterbird database was established within the existing Nature Conservation
    Sector database.
