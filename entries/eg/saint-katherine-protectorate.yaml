- claim: In June 2021 its director said community rangers were told to step up foot
    patrols to monitor biodiversity and identify violations.
  url: https://www.elwatannews.com/news/details/5553153
  fetched: 2026-11-12
  quote: توعية حراس البيئة بضرورة تكثيف الدوريات الراجلة لرصد التنوع البيولوجي، وتحديد
    المخالفات التي تحدث من قبل المواطنين، لسرعة التدخل.
- claim: In June 2021, its director said the South Sinai protectorates sought to organise
    patrols lasting one to three days to record observations and changes and identify
    plant and animal species close to extinction.
  url: https://www.elwatannews.com/news/details/5553153
