  quote: وتسجيل كافة الملاحظات والتغيرات التي تطرأ على المحميات، وكذلك تحديد أنواع
    النباتات والحيوانات التي قاربت على الانقراض مع تحديد الأسباب.
- claim: In June 2021, El Watan named Ismail Hatab as director of the Saint Katherine
    Protectorate and Mohamed Kotb as director general of the South Sinai protectorates.
  url: https://www.elwatannews.com/news/details/5553153
