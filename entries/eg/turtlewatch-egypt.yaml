summary: Citizen science programme on endangered marine turtles in the Egyptian Red
  Sea, started in 2011, with a photo-identification database and, from February 2025,
  a team member leading development of an AI identification system.
facts:
- claim: Describes itself as a citizen science programme collecting information on
    endangered marine turtles in the Egyptian Red Sea.
  url: https://turtlewatchegypt.net/
  fetched: 2026-11-15
  quote: Turtlewatch Egypt is a citizen science programme aimed at collecting important
    information on endangered marine turtles in the Egyptian Red Sea.
- claim: Keeps a photo-identification database built since 2011.
  url: https://turtlewatchegypt.net/
  fetched: 2026-11-15
  quote: Photos from TurtleWatch Egypt 2.0’s photo-ID database (built since 2011).
- claim: The site says TurtleWatch Egypt 2.0 is affiliated to Marine Life Watch (Milan)
    and to the Marine Life Conservation and Preservation Foundation (Marsa Alam);
    it does not say either runs it.
  url: https://turtlewatchegypt.net/
  fetched: 2026-11-15
  quote: affiliated to Marine Life Conservation and Preservation Foundation (MLCPF),
    Marsa Alam, Egypt
- claim: Its team page says the programme was started in 2011 by a turtle biologist
    then working for HEPCA.
  url: https://turtlewatchegypt.net/marine-turtles-conservation-project/
  fetched: 2026-11-15
  quote: In 2011, while working for the Hurghada Environmental Protection and Conservation
    Association (HEPCA), she started Turtlewatch Egypt
- claim: Its team page says Hoda Ahmed Riad joined on 1 February 2025 to lead development
    of an AI system to identify individual sea turtles. It also says Lukáš Adam applies
    computer vision to help automate the programme's photo-identification processes.
  url: https://turtlewatchegypt.net/marine-turtles-conservation-project/
  fetched: 2026-11-15
  quote: Lukáš applies his knowledge of computer vision to help people working in
    the field.
- claim: HEPCA's TurtleWatch page (undated) says dive-centre data are reviewed by
    its staff and entered in its Red Sea Turtles database.
  url: https://www.hepca.org/projects/conservation/turtlewatch
  fetched: 2026-11-15
  quote: The data collected from the dive centers is reviewed by our staff, inserted
    in our Red Sea Turtles database
