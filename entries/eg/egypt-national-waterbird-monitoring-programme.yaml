summary: Run by Nature Conservation Egypt with EEAA and Nature Conservation Sector
  collaboration, the programme surveys wetlands and, NCE says, seeks long-term trend
  analysis using field observations and remote sensing.
facts:
- claim: NCE says it is implementing a national waterbird monitoring programme with
    the EEAA and the Nature Conservation Sector.
  url: https://www.natureegypt.org/what-we-do/monitoring/winter-waterbird-count-2
  fetched: 2026-11-12
  quote: NCE is currently implementing a national waterbird monitoring programme in
    collaboration with the Egyptian Environmental Affairs Agency (EEAA) and the Nature
    Conservation Sector.
- claim: Survey sites include Lakes Burullus, Bardawil, Manzala, Edku, Mariout, Qarun
    and Nasser, Wadi El-Rayan and Nile islands.
  url: https://www.natureegypt.org/what-we-do/monitoring/winter-waterbird-count-2
  fetched: 2026-11-12
  quote: Survey activities cover a wide range of internationally important sites,
    including Lake Burullus, Lake Bardawil, Lake Manzala, Lake Edku, Lake Mariout,
    Lake Qarun, Wadi El-Rayan, Lake Nasser, and selected islands along the Nile River.
- claim: NCE says the programme seeks to analyse long-term population trends using
    field observations and remote sensing.
  url: https://www.natureegypt.org/what-we-do/monitoring/winter-waterbird-count-2
  fetched: 2026-11-12
  quote: analyzing long-term population trends using field observations and remote
    sensing technologies
- claim: In 2025–2026, waterbird identification and survey training was expanded as
    part of the National Winter Waterbird Census Project, implemented by NCE with
    the EEAA and the Nature Conservation Sector.
  url: https://www.natureegypt.org/what-we-do/massage/waterbird-identification-and-survey-techniques-training
  fetched: 2026-11-12
  quote: In 2025–2026, the programme was further expanded as part of the National
    Winter Waterbird Census Project implemented by NCE in collaboration with the Egyptian
    Environmental Affairs Agency (EEAA) and the Nature Conservation Sector.
