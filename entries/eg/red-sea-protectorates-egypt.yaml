summary: Egyptian Ministry of Environment conservation body whose scientific team
  leads the Red Sea coral reef monitoring programme announced in September 2025; surveys
  at several Northern Islands sites found no bleaching in 2025.
facts:
- claim: In September 2025 the acting environment minister announced an annual coral
    reef monitoring programme in the Red Sea, led by a scientific team from the Red
    Sea protectorates.
  url: https://dailynewsegypt.com/2025/09/07/egypt-launches-annual-coral-reef-monitoring-programme-in-red-sea/
  fetched: 2026-11-12
  quote: The initiative is led by a scientific team from the Red Sea protectorates
    to assess the health of coral reefs and track the ongoing impacts of climate change
    on marine ecosystems.
- claim: Field surveys at several sites in the Northern Islands Protected Area found
    no coral bleaching in 2025.
  url: https://dailynewsegypt.com/2025/09/07/egypt-launches-annual-coral-reef-monitoring-programme-in-red-sea/
