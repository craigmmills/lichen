summary: A protected-areas agency created by a 2015 Council of Ministers decision, which hosts an ILIRIA
  manual on plant monitoring that covers drones and satellite images, and which helped coordinate the
  2026 waterbird census.
facts:
- claim: The agency's announcements cite Council of Ministers Decision No. 102 of 4 February 2015 on the
    creation, organisation and operation of the agency and regional protected-area administrations.
  url: https://akzm.gov.al/en/category/announcements/
  fetched: 2026-11-12
  quote: VKM no. 102, dated 04.02.2015 “On the creation and manner of organization and operation of the
    National Agency of Protected Areas and the Regional Administration of Protected Areas”
- claim: In May 2024, the agency announced a public consultation on the integrated management plan for
    Vjosa River National Park.
  url: https://akzm.gov.al/en/category/announcements/
  fetched: 2026-11-12
  quote: The National Agency of Protected Areas organizes the public consultation on the presentation
    of the “Integrated Management Plan for the Vjosa River National Park”
- claim: The agency's website hosts a manual prepared by ILIRIA on monitoring and assessing plant species,
    including endangered and endemic species and monitoring large forest or pasture areas with drones
    and satellite images.
  url: https://akzm.gov.al/wp-content/uploads/2020/07/10.02.22_Manual-per-web.pdf
  fetched: 2026-11-12
  quote: Ky publikim ështe përgatitur nga ILIRIA në kuadër të projektit
- claim: The manual is titled Manual for the Monitoring and Assessment of Plant Species.
  url: https://akzm.gov.al/wp-content/uploads/2020/07/10.02.22_Manual-per-web.pdf
  fetched: 2026-11-12
  quote: 'Titulli: Manual i Monitorimit dhe Vlerësimit të Specieve Bimore'
- claim: The environment ministry says the 2026 waterbird census in Albania was coordinated by the ministry
    with the agency.
  url: https://mjedisi.gov.al/en/?p=11083
  fetched: 2026-11-12
  quote: Në Shqipëri, procesi u koordinua nga Ministria e Mjedisit në bashkëpunim me Agjencinë Kombëtare
    të Zonave të Mbrojtura
