facts:
- claim: Regional administrations of protected areas were created with the National
    Agency of Protected Areas under Council of Ministers Decision No. 102 of 4 February
    2015.
  url: https://akzm.gov.al/en/category/announcements/
  fetched: 2026-11-15
  quote: VKM no. 102, dated 04.02.2015 “On the creation and manner of organization
    and operation of the National Agency of Protected Areas and the Regional Administration
    of Protected Areas”
- claim: The agency’s August 2023 bulletin says AdZM Fier staff had monitored the
    heron colony weekly in Divjakë-Karavasta National Park within the JICA project.
  url: https://akzm.gov.al/wp-content/uploads/2020/07/Buletini-Gusht-2023.pdf
  fetched: 2026-11-15
  quote: Çdo javë stafi i AdZM Fier në kuadër të Projek
- claim: The bulletin reports monitoring of a heron colony, with aerial drone photography.
  url: https://akzm.gov.al/wp-content/uploads/2020/07/Buletini-Gusht-2023.pdf
  fetched: 2026-11-15
  quote: Monitorimi i Kolonisë së Çafkave
- claim: The bulletin says the monitoring used aerial photography from a drone.
  url: https://akzm.gov.al/wp-content/uploads/2020/07/Buletini-Gusht-2023.pdf
