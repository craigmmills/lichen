summary: A national bird data portal for Albania on the Observation.org platform,
  launched by the Albanian Ornithological Society at Divjaka-Karavasta National Park
  in 2025, with EuroBirdPortal reporting it was made possible by a LIFE reinforcement
  project.
facts:
- claim: EuroBirdPortal says partners in Albania and three other countries decided
    to adopt Observation.org as their official national platform for collecting bird
    data and translated it into local languages.
  url: https://eurobirdportal.org/news/Local-Observation-org-portals-launched-in-four-countries-of-SE-Europe-1756482578
  fetched: 2026-11-13
  quote: The partners from these countries have decided to incorporate Observation.org
    as their official national platform for collecting bird data
- claim: In Albania the Albanian Ornithological Society held the launch event at Divjaka-Karavasta
    National Park in April or May 2025, with 31 students and staff of the regional
    protected-area administration.
  url: https://eurobirdportal.org/news/Local-Observation-org-portals-launched-in-four-countries-of-SE-Europe-1756482578
  fetched: 2026-11-13
  quote: In Albania, the partner AOS (Albanian OrnithologicalSociety) held the launching
    event at Divjaka-Karavasta National Park
- claim: EuroBirdPortal says the national portals were made possible by the LIFE22-PLP-ES-EBP
    reinforcement project.
  url: https://eurobirdportal.org/news/Local-Observation-org-portals-launched-in-four-countries-of-SE-Europe-1756482578
  fetched: 2026-11-13
  quote: This development has been possible thanks to the LIFE22-PLP-ES-EBP reinforcement
