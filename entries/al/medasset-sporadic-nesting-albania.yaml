summary: Closed 2018 to 2019 project run by MEDASSET and funded by the MAVA Foundation
  that assessed Albanian beaches for turtle nesting using transects and drone images,
  with drone work continuing afterwards.
facts:
- claim: The October 2020 release says the 2018–2019 project was implemented by MEDASSET
    in collaboration with Dr Enerit Sacdanaku and funded by the MAVA Foundation within
    the regional marine turtle conservation project.
  url: https://medmarineturtles.org/news/52-press-release-officials-and-experts-meet-to-discuss-research-results-on-sea-turtle-nesting-in-albania
  fetched: 2026-11-15
  quote: is implemented by MEDASSET in collaboration with Dr. Enerit Sacdanaku. The
    project is funded by the MAVA Foundation
- claim: All sandy beaches were assessed for nesting suitability by combining beach
    transects and drone images.
  url: https://medmarineturtles.org/news/52-press-release-officials-and-experts-meet-to-discuss-research-results-on-sea-turtle-nesting-in-albania
  fetched: 2026-11-15
  quote: 'All sandy beaches were assessed to evaluate their suitability for supporting
    sea turtle nesting by combing two different methodologies: beach transects and
    drone images.'
- claim: Sand temperature data were collected on seven beaches as part of a Mediterranean
    study coordinated by DEKAMER.
  url: https://medmarineturtles.org/news/52-press-release-officials-and-experts-meet-to-discuss-research-results-on-sea-turtle-nesting-in-albania
  fetched: 2026-11-15
  quote: sand temperature data that was collected on 7 beaches, as part of a Mediterranean
    study coordinated by DEKAMER
- claim: The October 2020 release described continuation activities including fieldwork
    and drone surveys, with MAVA support for work in Albania in 2021–2022.
  url: https://medmarineturtles.org/news/52-press-release-officials-and-experts-meet-to-discuss-research-results-on-sea-turtle-nesting-in-albania
  fetched: 2026-11-15
  quote: presented the continuation of the project activities such as field work,
    including drone surveys
- claim: The regional project's site lists a publication by Enerit Sacdanaku and Vicky
    Rae (MEDASSET) on drone surveying of Drini Bay and Patok Lagoon for sea turtle
    presence and distribution, 2020 to 2022.
  url: https://medmarineturtles.org/publications/119-drone-survey-drini-bay
  fetched: 2026-11-15
  quote: Drone surveying of Drini Bay & Patok Lagoon (Albania) for Sea Turtles Presence
    & Distribution (2020-2022)
