summary: Rufford-funded project run by PPNEA to map, protect and monitor loggerhead
  nesting sites in southern Albania; PPNEA reports four of seven Vlora nests succeeded
  between June and September 2024.
facts:
- claim: The Rufford Foundation lists the project under Endora Celohoxhaj, dated 12
    September 2023, in Vlore, Albania.
  url: https://www.rufford.org/projects/endora-celohoxhaj/advancing-marine-turtle-conservation-comprehensive-study-nesting-habitats-and-effective-protection-measures-caretta-caretta-albania/
  fetched: 2026-11-15
  quote: Endora Celohoxhaj
- claim: The Rufford page dated 12 September 2023 describes a project aiming to identify,
    map, protect and monitor marine turtle nesting sites in southern Albania, with
    fieldwork planned for June to November 2024.
  url: https://www.rufford.org/projects/endora-celohoxhaj/advancing-marine-turtle-conservation-comprehensive-study-nesting-habitats-and-effective-protection-measures-caretta-caretta-albania/
  fetched: 2026-11-15
  quote: the project aims to identify, map, protect and monitor the nesting sites
    for threatened marine turtles in southern Albania
- claim: The page says there was no systematic monitoring on the Albanian coast and
    no data on the status and reproduction of marine turtles.
  url: https://www.rufford.org/projects/endora-celohoxhaj/advancing-marine-turtle-conservation-comprehensive-study-nesting-habitats-and-effective-protection-measures-caretta-caretta-albania/
  fetched: 2026-11-15
  quote: there is a complete lack of systematic monitoring in Albanian coast
- claim: The page lists a final evaluation report dated October 2024.
  url: https://www.rufford.org/projects/endora-celohoxhaj/advancing-marine-turtle-conservation-comprehensive-study-nesting-habitats-and-effective-protection-measures-caretta-caretta-albania/
  fetched: 2026-11-15
  quote: Final Evaluation Report October 2024
- claim: PPNEA’s project page says four of seven nests in the Vlora region were successful
    between June and September 2024, and that Albania’s first attempt to relocate
    sea turtle eggs was successfully completed with Rufford support.
  url: https://ppnea.org/portfolio-item/24580/?lang=en
  fetched: 2026-11-15
  quote: between June and September 2024, 4 out of 7 nests were successful
- claim: PPNEA's page lists the Rufford Foundation as the funder.
  url: https://ppnea.org/portfolio-item/24580/?lang=en
  fetched: 2026-11-15
  quote: 'Funding: Rufford Foundation'
