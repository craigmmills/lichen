summary: An agency with its central office in Tirana that draws up the National Environmental Monitoring
  Programme every year, whose 2023 edition lists biodiversity monitoring stations and stresses migratory
  bird monitoring.
facts:
- claim: A 2014 Council of Ministers decision on its functions says the agency has its central office
    in Tirana and regional branches in the counties.
  url: https://akm.gov.al/wp-content/uploads/2022/03/vkm-nr.-47-funksionet-e-akm-dhe-drm-ve-29.1.2014.pdf
  fetched: 2026-11-12
  quote: AKM-ja ka zyrën qendrore të saj në Tiranë dhe degët rajonale në qarqe (ARM).
- claim: The agency draws up the National Environmental Monitoring Programme every year.
  url: https://akm.gov.al/wp-content/uploads/2022/12/Programi-Kombetar-i-Monitorimit-te-Mjedisit-2023.pdf
  fetched: 2026-11-12
  quote: Agjencia Kombëtare e Mjedisit harton çdo vit Programin Komb ëtar t ë Monitorimit t ë Mjedisit
- claim: The 2023 programme has a table of monitoring stations for biodiversity.
  url: https://akm.gov.al/wp-content/uploads/2022/12/Programi-Kombetar-i-Monitorimit-te-Mjedisit-2023.pdf
  fetched: 2026-11-12
  quote: Tabela 21. Stacionet monitoruese për biodiversitetin
- claim: The 2023 programme identifies monitoring migratory birds in lagoons and lakes as an important
    component of biodiversity monitoring.
  url: https://akm.gov.al/wp-content/uploads/2022/12/Programi-Kombetar-i-Monitorimit-te-Mjedisit-2023.pdf
  fetched: 2026-11-12
  quote: Një komponent i rëndësishëm i monitorimit të biodiversitetit është dhe monitorimi i shpendëve
