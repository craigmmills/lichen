facts:
- claim: A PPNEA wildlife biologist says the team monitors jackals in Divjaka with
    acoustic call playback and camera traps provided through the 4PETHABECO project.
  url: https://eeas.europa.eu/delegations/albania/calls-collars-how-eu-supporting-wildlife-tracking-albania_en
  fetched: 2026-11-13
  quote: we conduct intensive monitoring using innovative acoustic methods and camera
    traps
- claim: The EU Delegation says audio equipment and camera traps were provided through
    the 4PETHABECO project, under the Interreg IPA ADRION Programme co-funded by the
    European Union.
  url: https://eeas.europa.eu/delegations/albania/calls-collars-how-eu-supporting-wildlife-tracking-albania_en
  fetched: 2026-11-13
  quote: places the audio equipment and camera traps provided through the 4PETHABECO
    project, under the Interreg IPA ADRION Programme, co-funded by the European Union
- claim: The story says a brown bear was released near Pogradec with a GPS collar
    provided through the Interreg IPA ADRION Programme and later travelled more than
    100 kilometres into North Macedonia.
  url: https://eeas.europa.eu/delegations/albania/calls-collars-how-eu-supporting-wildlife-tracking-albania_en
  fetched: 2026-11-13
  quote: the bear was released after being fitted with a GPS collar provided through
    the Interreg IPA ADRION Programme
- claim: The story says the GPS collar transmits hourly location data, and that this
    is the second bear in Albania monitored by this method.
  url: https://eeas.europa.eu/delegations/albania/calls-collars-how-eu-supporting-wildlife-tracking-albania_en
