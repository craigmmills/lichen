  quote: Tabela 21. Stacionet monitoruese për biodiversitetin
- claim: It says monitoring of migratory birds is an important component of biodiversity
    monitoring, with a monitoring network of sites for migratory birds.
  url: https://akm.gov.al/wp-content/uploads/2022/12/Programi-Kombetar-i-Monitorimit-te-Mjedisit-2023.pdf
  fetched: 2026-11-15
  quote: Tabela 23. Rrjeti i monitorimit/Sipërfaqet monitoruese të shpendëve migratorë
