summary: Annual programme drafted and run by Albania's National Environment Agency;
  the 2023 edition covers biodiversity monitoring stations, a migratory bird network
  and forest genetic resources, using contracted universities and laboratories.
facts:
- claim: The 2023 programme says the National Environment Agency drafts the National
    Environmental Monitoring Programme every year.
