facts:
- claim: The inventory is a continuing process giving information on the size, distribution, composition
    and state of forests, forest lands and pastures and changes in forest lands over time.
  url: https://akpyje.gov.al/en/ikpk
  fetched: 2026-11-12
  quote: Albania National Forest and Pasture Inventory (ANFI) is an ongoing process designed to provide
    accurate information about the size, distribution, composition and the state of our forests, forest
    lands, pastures and changes in forest lands over time.
- claim: It has 1,100 sampling plot clusters across the country.
  url: https://akpyje.gov.al/en/ikpk
  fetched: 2026-11-12
  quote: National Forest and Pasture Inventory (ANFI) has a total of 1100 sampling plot clusters, distributed
    across the country.
- claim: The full re-inventory cycle is eight years, with a quarter of the forest area inventoried every
    two years.
  url: https://akpyje.gov.al/en/ikpk
  fetched: 2026-11-12
  quote: Full cycle of national forest re-inventory is 8 years, inventorying 25% of the forest area every
    2 years;
