summary: A closed project that IUCN says began in 2015 to support protected area management
  and a Natura 2000 network, training around 100 agency staff and giving a preliminary
  list of 43 proposed sites.
facts:
- claim: IUCN says NaturAL began in 2015, when the National Agency of Protected Areas
    was established, and supported the management of protected areas and the start
    of a Natura 2000 network.
  url: https://iucn.org/news/eastern-europe-and-central-asia/201905/towards-natura-2000-albania
  fetched: 2026-11-13
  quote: Initiated in 2015, at the time of the establishment of National Agency of
    Protected Areas in Albania, NaturAL provided a strong push
- claim: IUCN says around 100 staff of the agency and its regional offices were trained
    on conservation biology, implementation of monitoring and other subjects.
  url: https://iucn.org/news/eastern-europe-and-central-asia/201905/towards-natura-2000-albania
  fetched: 2026-11-13
  quote: Around 100 persons from the agency and its regional offices were trained
    on conservation biology, implementation of monitoring
- claim: In May 2019, IUCN reported that the National Biodiversity database (BioNNA)
    and the Wildlife Information Management System were in place and used daily by
    rangers.
  url: https://iucn.org/news/eastern-europe-and-central-asia/201905/towards-natura-2000-albania
  fetched: 2026-11-13
  quote: The National Biodiversity database (BioNNA) and the Wildlife Information
    Management System are in place, used daily by the rangers to collect and analyze
    the wildlife data
- claim: IUCN says the project identified the potential distribution of Natura 2000
    Sites of Community Interest, giving a preliminary list of 43 proposed sites.
  url: https://iucn.org/news/eastern-europe-and-central-asia/201905/towards-natura-2000-albania
  fetched: 2026-11-13
  quote: Potential distribution of the Natura 2000 Sites of Community Interest was
    identified, resulting in the preliminary list of 43 proposed sites.
