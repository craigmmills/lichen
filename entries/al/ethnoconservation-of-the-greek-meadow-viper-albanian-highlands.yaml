facts:
- claim: The Fund lists the grant as awarded on 22 April 2015 for $3,810, located
    in Albania, to Edvárd Mizsei of the Greek Meadow Viper Working Group.
  url: https://www.speciesconservation.org/case-studies-projects/greek-meadow-viper/10498
  fetched: 2026-11-13
  quote: 'Awarded Date : April 22, 2015'
- claim: The grant recipient's case study says monitoring continued at grazing-exclusion
    sites on Trebeshine Mountain, where 71 vipers were recorded in and around the
    fences.
  url: https://www.speciesconservation.org/case-studies-projects/greek-meadow-viper/10498
  fetched: 2026-11-13
  quote: We continued our monitoring in Trebeshine Mountain at our grazing-exclusion
    sites. We recorded 71 vipers in and around the fences.
- claim: The case study says habitats in Albania and Greece were visited up to the
    end of 2016, with data from more than 200 vipers in 17 populations.
  url: https://www.speciesconservation.org/case-studies-projects/greek-meadow-viper/10498
  fetched: 2026-11-13
  quote: collected a data from more than 200 vipers, from 17 populations
- claim: The case study says a model of presence data with climate variables predicts
    90% habitat loss by the end of the century.
  url: https://www.speciesconservation.org/case-studies-projects/greek-meadow-viper/10498
  fetched: 2026-11-13
  quote: A modelling based on the available presence data combined with climate variables
    predicts dramatic decline, 90% habitat loss for the end of the century.
- claim: The page says its text is uploaded by the grant recipient, not written by
    the Fund.
  url: https://www.speciesconservation.org/case-studies-projects/greek-meadow-viper/10498
