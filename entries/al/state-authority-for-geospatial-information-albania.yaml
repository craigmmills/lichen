summary: A public geospatial authority in Albania reporting fire maps supporting the
  National Civil Protection Agency, including a satellite-derived land-cover map for
  the Selishte fire in August 2026.
facts:
- claim: In August 2026, ASIG said experts had prepared a land-cover map of the area
    affected by the Selishte fire in Dibër from satellite images, in support of the
    National Civil Protection Agency.
  url: https://asig.gov.al/en/analysis-of-satellite-images-in-the-area-affected-by-the-selishte-fire-diber/
  fetched: 2026-11-13
  quote: a landcover map has been prepared which identifies the areas affected by
    the fire
- claim: ASIG says its experts created a thematic map of the July 2023 fire at Peshtan
    in Fier, in support of the National Civil Protection Agency.
  url: https://asig.gov.al/en/use-of-satellite-services-for-the-identification-of-fire-damage/
  fetched: 2026-11-13
  quote: during the month of July 2023, created the following thematic map
- claim: ASIG took part in a June 2025 workshop on GIS, remote sensing and UAV in
    precision forestry, organised within a national technology and innovation project
    on forest health monitoring in Divjakë-Karavasta National Park, and presented
    on geoinformation for forest health.
  url: https://asig.gov.al/en/asig-participates-in-the-workshop-on-use-of-gis-rs-and-uav-in-precision-forestry/
  fetched: 2026-11-13
  quote: The material presented by ASIG on the topic “Geoinformation for forest health”
- claim: ASIG's site describes its focus as presenting geospatial data and services
    offered by the responsible public authorities.
  url: https://asig.gov.al/en/asig-participates-in-the-workshop-on-use-of-gis-rs-and-uav-in-precision-forestry/
  fetched: 2026-11-13
  quote: ASIG is focused on presenting geospatial data and services offered by the
    responsible public authorities.
- claim: ASIG gives its address as Rruga e Dibrës, near the Ministry of Defence, Tiranë.
  url: https://asig.gov.al/en/asig-participates-in-the-workshop-on-use-of-gis-rs-and-uav-in-precision-forestry/
  fetched: 2026-11-13
  quote: 'Address: Rruga e Dibrës (pranë Ministrisë së Mbrojtjes), Tiranë'
