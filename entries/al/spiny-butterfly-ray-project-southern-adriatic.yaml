summary: A project funded by a $6,059 grant that, according to the recipient, recorded
  five spiny butterfly rays off Vlore, suggesting a nursery area, and held more than
  25 workshops for fishermen.
facts:
- claim: The recipient's case study says the project's primary objective is to investigate
    the frequency and abundance of the spiny butterfly ray and to confirm, map and
    characterise key habitats.
  url: https://www.speciesconservation.org/small-grant/spiny-butterfly-ray/32379
  fetched: 2026-11-13
  quote: The primary objective of this project is to investigate the frequency and
    abundance of the Spiny Butterfly Ray
- claim: The case study says the team recorded a gravid female in Vlore, Albania,
    and then four more individuals, suggesting a population with a nursery area off
    Vlore.
  url: https://www.speciesconservation.org/small-grant/spiny-butterfly-ray/32379
  fetched: 2026-11-13
  quote: our team recorded a gravid female in Vlore, Albania, carrying seven near-term
    fetuses
- claim: The case study says more than 25 educational workshops were held for local
    fishermen, who recorded and released the species.
  url: https://www.speciesconservation.org/small-grant/spiny-butterfly-ray/32379
