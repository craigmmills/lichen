summary: Run by UNDP and the Italian Agency for Development Cooperation, it uses camera traps and drones,
  UNDP says; ten pilot protected areas averaged 36.53% on METT-4.
facts:
- claim: UNDP says the project deploys camera traps in forest and mountain habitats to monitor wildlife,
    track rare species and detect illegal activity.
  url: https://www.undp.org/albania/stories/eu4nature-protects-albanias-extraordinary-natural-heritage-0
  fetched: 2026-11-12
  quote: Camera Traps — Deployed in forest and mountain habitats to monitor wildlife populations, track
    rare species, and detect illegal activity.
- claim: UNDP says drones are used for aerial surveys of large or hard-to-reach areas.
  url: https://www.undp.org/albania/stories/eu4nature-protects-albanias-extraordinary-natural-heritage-0
  fetched: 2026-11-12
  quote: Drones — Used for aerial surveys of large or hard-to-access areas, providing data on habitat
    change, erosion, and ecosystem health.
- claim: Ten pilot protected areas were assessed with the METT-4 tool, with an average management score
    of 36.53%.
  url: https://www.undp.org/albania/stories/eu4nature-protects-albanias-extraordinary-natural-heritage-0
  fetched: 2026-11-12
  quote: Ten pilot protected areas were assessed using the METT-4 tool to evaluate how effectively they
    are managed. The assessment resulted in an average management score of 36.53%.
