- claim: In June 2020, the Society described the monitoring as part of its activity
    on breeding waterbirds in Albania's main wetlands, continuing work begun in 1995
    as part of the national waterbird monitoring scheme.
  url: https://aos-alb.org/?p=5470
  fetched: 2026-11-13
  quote: This monitoring is a continuation of previous work started in 1995 by AOS
    ornithologists as part of the national monitoring scheme of waterbirds
- claim: The 2020 results gave 85 breeding pairs of Dalmatian pelican in the colony
    monitored from January.
  url: https://aos-alb.org/?p=5470
  fetched: 2026-11-13
  quote: reached the record number of 85 breeding pairs
- claim: In June 2020, the Society said the Divjaka-Karavasta monitoring was supported
