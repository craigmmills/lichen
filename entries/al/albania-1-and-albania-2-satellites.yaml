  quote: The two satellites, Albania-1 and Albania-2, were part of SpaceX’s Transporter-6 rideshare mission
- claim: In January 2023, bne IntelliNews reported government plans to use the satellites to detect crimes
    including illegal logging and to fight wildfires.
  url: https://www.intellinews.com/albania-s-first-satellites-launched-into-space-265909/
  fetched: 2026-11-12
  quote: Tirana plans to use the satellites to detect crimes such as drug cultivation, illegal construction
    and logging. They will also make it easier to monitor traffic and border security, and fight wildfires
- claim: In January 2023, bne IntelliNews reported that a three-year deal would give Albania priority
    satellite access and that Satellogic would train government specialists to analyse the data.
  url: https://www.intellinews.com/albania-s-first-satellites-launched-into-space-265909/
