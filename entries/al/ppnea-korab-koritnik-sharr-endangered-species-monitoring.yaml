facts:
- claim: PPNEA's project page says it aimed to raise regional capacity for endangered
    species monitoring and to generate the first regional data on wildlife distribution
    in the transboundary area.
  url: https://ppnea.org/support-to-the-management-of-protected-areas/?lang=en
  fetched: 2026-11-13
  quote: PPNEA aims to raise regional capacities on endangered species monitoring
    and generate, for the first time, regional data regarding wildlife distribution
    in the area
- claim: The planned actions were camera-trap training sessions, donating camera traps
    and equipment to regional stakeholders, a regional camera-trap study and a report
    on wildlife distribution.
  url: https://ppnea.org/support-to-the-management-of-protected-areas/?lang=en
