summary: Türkiye's first national satellite imagery portal, according to TÜBİTAK UZAY, which built it;
  it has served since 2014 and holds GÖKTÜRK-2 imagery and the RASAT archive.
facts:
- claim: Described by TÜBİTAK UZAY as Türkiye's first national satellite imagery portal, serving since
    2014.
