  fetched: 2026-11-03
  quote: Developed by TÜBİTAK UZAY and serving as Türkiye's first national satellite imagery portal since
    2014, Gezgin Portal has been upgraded.
- claim: Holds GÖKTÜRK-2 imagery as well as the RASAT archive.
  url: https://uzay.tubitak.gov.tr/en/data-processing-and-mining-applications/
  fetched: 2026-11-03
  quote: GÖKTÜRK-2 imagery in addition to the RASAT archive, Gezgin is accessible to all users, primarily
    public institutions, municipalities, universities, and the private sector.
