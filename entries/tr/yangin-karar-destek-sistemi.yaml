- claim: Development started in 2021, took nine months, and the system went into service in 2022.
  url: https://www.turktarim.gov.tr/Haber/1125/yuksek-teknoloji-ve-yapay-zeka-ile-orman-yanginlarina-en-dogru-mudahale-yapiliyor
