  quote: Orman yangınlarıyla daha etkin bir mücadele için 2022'den beri yerli ve milli
- claim: Described as a GIS and AI-based forest fire modelling and decision support system using live
    weather, geographic and forest data.
  url: https://www.memurlar.net/haber/1103652/orman-genel-mudurlugu-nun-yapay-zeka-destekli-sistemine-bm-den-cevre-odulu.html
  fetched: 2026-11-03
  quote: ve yapay zeka tabanlı orman yangını modelleme ve karar destek sistemi oluşturuluyor.
- claim: Came second in the environment category of a competition run by the International Telecommunication
    Union, according to the minister in June 2024.
  url: https://www.memurlar.net/haber/1103652/orman-genel-mudurlugu-nun-yapay-zeka-destekli-sistemine-bm-den-cevre-odulu.html
