summary: A foundation formed in 2004 for a roughly 110-decare arboretum in Yalova,
  which a 2022 report called Türkiye's first private arboretum, with the founder's
  granddaughter as board chair.
facts:
- claim: The arboretum in Yalova covers about 110 decares. It became an arboretum
    in 1980 and a foundation in 2004. In 2022 the foundation said it shared the site
    with the public.
  url: https://www.aa.com.tr/tr/yesilhat/cevre-hikayeleri/turkiyenin-toprak-dedesi-hayrettin-karacanin-emaneti-emin-ellerde/1815981
  fetched: 2026-11-17
  quote: Karaca Arboretum yaklaşık 110 dönüm araziye kurulu. 1980 yılında arboretuma
    dönüştü. 2004 yılında da biz burayı vakıf yaptık ve halkla beraber paylaşıyoruz.
- claim: A 2022 report described the site as Türkiye's first private arboretum and
    named the founder's granddaughter, Yeşne Karaca İren, as its board chair.
  url: https://www.aa.com.tr/tr/yesilhat/cevre-hikayeleri/turkiyenin-toprak-dedesi-hayrettin-karacanin-emaneti-emin-ellerde/1815981
  fetched: 2026-11-17
  quote: torunu Karaca Arboretum Yönetim Kurulu Başkanı Yeşne Karaca İren ve ekibinin
    çalışmalarıyla her yıl binlerce ziyaretçiyi ağırlıyor.
