summary: National bird ringing programme, run by DKMP, begun in March 2002 and reported
  in May 2024 to have followed 178,941 birds of about 190 species at four active stations
  over nine years.
facts:
- claim: In May 2024, Anadolu Agency reported that ringing at four stations, coordinated
    by the General Directorate, had followed 178,941 birds of about 190 species over
    nine years.
  url: https://www.aa.com.tr/tr/yasam/kus-turlerinin-gelecegi-halkalama-calismalariyla-guvence-altinda/3214313
  fetched: 2026-11-09
  quote: Doğa Koruma ve Milli Parklar (DKMP) Genel Müdürlüğü koordinasyonunda, Türkiye
    genelinde 4 istasyonda yürütülen halkalama çalışmaları sonucu 9 yılda yaklaşık
    190 türden 178 bin 941 kuş takibe alındı.
- claim: The programme began in March 2002 under a cooperation protocol between DKMP,
    METU's Biology Department and Kuş Araştırmaları Derneği.
  url: https://www.aa.com.tr/tr/yasam/kus-turlerinin-gelecegi-halkalama-calismalariyla-guvence-altinda/3214313
  fetched: 2026-11-09
  quote: Mart 2002'de ise DKMP, ODTÜ Biyoloji Bölümü ve KAD arasında imzalanan işbirliği
    protokolü ile Ulusal Halkalama Programı (UHP) başlatıldı.
- claim: The May 2024 report named Cernek (Samsun), Aras (Iğdır), Eymir (Ankara) and
    Boğazkent (Antalya) as the four active stations.
  url: https://www.aa.com.tr/tr/yasam/kus-turlerinin-gelecegi-halkalama-calismalariyla-guvence-altinda/3214313
  fetched: 2026-11-09
  quote: Türkiye'deki 4 kuş halkalama istasyonundan Samsun'daki Cernek, Iğdır'daki
    Aras, Ankara'daki Eymir ve Antalya'daki Boğazkent aktif olarak çalışmalarını sürdürüyor.
