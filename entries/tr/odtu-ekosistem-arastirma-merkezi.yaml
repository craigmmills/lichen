    out the Lakes Mogan and Eymir Ecological Monitoring and Restoration Programme
    for 27 years.
  url: https://ekosam.metu.edu.tr/en/lake-eymir-and-mogan-long-term-ecological-monitoring-and-restoration-research
  fetched: 2026-11-09
  quote: The Lakes Mogan and Eymir Ecological Monitoring and Restoration Programme
    (EMEM-RP) in Türkiye has been continously carried out for 27 years by Centre for
    Ecosystem REsearch (EKOSAM).
- claim: The programme samples the lakes every two weeks.
  url: https://ekosam.metu.edu.tr/en/lake-eymir-and-mogan-long-term-ecological-monitoring-and-restoration-research
  fetched: 2026-11-09
  quote: The program involves sampling the lakes every two weeks
