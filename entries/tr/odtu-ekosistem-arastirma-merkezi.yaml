    data are streamed over LoRa.
  url: https://ekosam.metu.edu.tr/en/lake-eymir-and-mogan-long-term-ecological-monitoring-and-restoration-research
  fetched: 2026-11-09
  quote: Lately EMEM-RP has included continous monitoring using a standardized platform
    with a sonda and the data have been continously streamed using LoRA.
