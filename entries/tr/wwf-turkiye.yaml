summary: Turkish organisation collaborating with DKMP on Akyatan turtle monitoring since 2006,
  reporting satellite tracking of adult females and about 270,000 hatchlings reaching the
  sea over 20 years.
facts:
- claim: Since 2006 a Green Sea Turtle Monitoring and Conservation Programme has run at Akyatan
    Wildlife Development Area in cooperation between WWF-Türkiye and DKMP's 7th Regional Directorate.
  url: https://www.ekonomist.com.tr/yesil-ekonomist/adana-da-son-20-yilda-270-bin-kaplumbaga-yavrusu-denizle-bulustu-64283
  fetched: 2026-11-03
  quote: 2006'dan bu yana WWF-Türkiye ve Doğa Koruma ve Milli Parklar 7. Bölge Müdürlüğü işbirliğiyle
    Yeşil Deniz Kaplumbağası İzleme ve Koruma Programı yürütülüyor.
- claim: Its marine and wildlife programme manager said they fitted satellite devices to 19
    adult female green turtles.
  url: https://www.ekonomist.com.tr/yesil-ekonomist/adana-da-son-20-yilda-270-bin-kaplumbaga-yavrusu-denizle-bulustu-64283
  fetched: 2026-11-03
  quote: Aynı zamanda 19 ergin dişi yeşil kaplumbağasına da uydu cihazı taktık.
- claim: About 270,000 hatchlings from 7,500 nests reached the sea in the programme's first
    20 years.
  url: https://www.ekonomist.com.tr/yesil-ekonomist/adana-da-son-20-yilda-270-bin-kaplumbaga-yavrusu-denizle-bulustu-64283
  fetched: 2026-11-03
  quote: Programı'nın 20. yılında 7 bin 500 yuvadan yaklaşık 270 bin yavru denize ulaştı.
- claim: Says it has run sea turtle monitoring and protection at the Akyatan Wildlife Development
    Area since 2006, in cooperation with the Ministry of Agriculture and Forestry's 7th Regional
    Directorate.
  url: https://www.wwf.org.tr/kesfet/biyocesitlilik/turler/deniz_kaplumbagalari/
  fetched: 2026-11-03
  quote: 2006 yılından bu yana Akyatan Yaban Hayatı Geliştirme Sahası’nda, Tarım ve Orman
    Bakanlığı 7.Bölge Müdürlüğü işbirliğiyle, deniz kaplumbağası izleme ve koruma çalışmalarımızı
    gerçekleştiriyoruz.
- claim: Says it fitted satellite devices to 18 adult female green turtles under a regional
    Mediterranean sea turtle project supported by the MAVA Foundation.
  url: https://www.wwf.org.tr/kesfet/biyocesitlilik/turler/deniz_kaplumbagalari/
  fetched: 2026-11-03
  quote: MAVA Vakfı desteğiyle 18 ergin dişi yeşil deniz kaplumbağasının yuvalama dönemleri
    arasındaki periyodun ve göç rotalarının belirlenmesi için uydu cihazı taktık.
- claim: Says it was founded as Doğal Hayatı Koruma Derneği in 1975.
  url: https://www.wwf.org.tr/wwf/hakkimizda/
  fetched: 2026-11-03
  quote: Doğal Hayatı Koruma Derneği olarak kurulduğumuz 1975’ten bu yana
- claim: Gives an office address on İstiklal Caddesi.
  url: https://www.wwf.org.tr/wwf/iletisim_bilgileri/
  fetched: 2026-11-03
  quote: Asmalı Mescit Mah. İstiklal Caddesi No.136 Kat:4
- claim: Says on GlobalGiving that it runs an uninterrupted monitoring and protection programme
    at Akyatan Beach and monitors adult female turtles by satellite.
  url: https://www.globalgiving.org/projects/wwf-turkiye/
  fetched: 2026-11-03
  quote: Collaborating with local authorities, WWF-Turkiye runs an uninterrupted monitoring
    and protection program at Akyatan Beach. We protect nests, track temperatures, and guide
    hatchlings safely to the sea while monitoring adult females via satellite to support conservation
    planning.
- claim: Says the programme has helped more than 270,000 green sea turtle hatchlings from
    over 6,000 nests reach the sea.
  url: https://www.globalgiving.org/projects/wwf-turkiye/
  fetched: 2026-11-03
  quote: we are proud to have helped more than 270,000 baby green sea turtles from over 6,000
    nests reach the sea safely
