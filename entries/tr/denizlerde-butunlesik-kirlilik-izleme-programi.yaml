summary: Sea pollution monitoring programme run by the environment ministry and TÜBİTAK Marmara Research
  Center, with 425 monitoring points planned across four seas for 2023 to 2025, on a three-year cycle.
facts:
- claim: Over 2023 to 2025 the Marmara, Mediterranean, Aegean and Black Seas were to be monitored at 425
    points, coordinated by the ministry and TÜBİTAK Marmara Research Center.
  url: https://www.dha.com.tr/gundem/denizlerdeki-kirlilik-425-noktada-izlenecek-2288068
  fetched: 2026-11-03
  quote: Bakanlık ve TÜBİTAK Marmara Araştırma Merkezi koordinasyonunda 2023-2025 dönemi içerisinde gerçekleştirilecek
    çalışma ile Marmara, Akdeniz, Ege ve Karadeniz 3 yıl süre ile 425 noktada
- claim: The July 2023 report said the 2023–2025 work was planned to monitor pollution levels, ecological
    quality, biodiversity and living species in the seas.
  url: https://www.dha.com.tr/gundem/denizlerdeki-kirlilik-425-noktada-izlenecek-2288068
  fetched: 2026-11-03
  quote: denizlerdeki kirlilik seviyesi, ekolojik kalite durumu, biyolojik çeşitlilik ve canlı türler
    izlenip, takip edilecek
- claim: A 2016 TÜBİTAK release says 106 scientists from 11 research institutions and universities, including
    TÜBİTAK MAM and TAEK, took part.
  url: https://tubitak.gov.tr/tr/haber/denizlerimiz-mercek-altinda
  fetched: 2026-11-03
  quote: TÜBİTAK-MAM ve TAEK’in dahil olduğu 11 araştırma kurumu ve üniversiteden konusunda uzman 106
    bilim insanının yer aldığı
- claim: The programme's website names it and says it monitors and assesses the quality of Türkiye's seas.
  url: http://www.den-iz.org/
  fetched: 2026-11-03
  quote: DENİZLERİMİZİN KALİTE DURUMUNU İZLİYOR VE DEĞERLENDİRİYORUZ
- claim: The programme's site says it is carried out under the Ministry of Environment, Urbanisation and
    Climate Change and coordinated by TÜBİTAK MAM's marine research group.
  url: https://www.den-iz.org/tr-TR/4-ulusal-denizlerde-izleme-ve-degerlendirme-sempozyumu
