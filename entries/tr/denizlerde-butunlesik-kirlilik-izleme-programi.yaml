  quote: Çevre, Şehircilik ve İklim Değişikliği Bakanlığı uhdesinde, TÜBİTAK-Marmara Araştırma Merkezi
    (TÜBİTAK MAM) Deniz Araştırmaları ve Teknolojileri Araştırma Grubu koordinasyonunda yürütülen
- claim: Its monitoring runs on a regular three-year cycle.
