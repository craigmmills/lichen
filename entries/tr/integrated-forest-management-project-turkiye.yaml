summary: A closed GEF-funded forest management project run by OGM and UNDP, which UNDP says ended after
  seven years and contributed integrated fire management software and Forest Management System software.
facts:
- claim: UNDP reports the project concluded with a closing event in Ankara, after seven years.
  url: https://www.undp.org/turkiye/press-releases/integrated-forest-management-project-concludes-closing-event-ankara
  fetched: 2026-11-03
  quote: Implemented over a span of 7 years, the project aimed to promote an integrated approach to management
    of forests in Turkey
- claim: UNDP says the project contributed to developing an integrated fire management system and software,
    and Forest Management System software for forward-looking modelling.
  url: https://www.undp.org/turkiye/press-releases/integrated-forest-management-project-concludes-closing-event-ankara
  fetched: 2026-11-03
  quote: developing an integrated fire management system and software to prevent forest fires
- claim: A forest fires official said cameras on helicopters and water level sensors introduced by the
    project helped decision-making in firefighting.
  url: https://www.undp.org/turkiye/news/carrying-turkeys-forests-future
