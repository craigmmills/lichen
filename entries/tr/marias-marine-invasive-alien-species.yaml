id: marias-marine-invasive-alien-species
kind: project
name: Denizel İstilacı Yabancı Türler (MarIAS)
also_known_as:
- MarIAS
- Marine Invasive Alien Species project
scope: tr
ai_label: conservation-tech
realms:
- ocean
countries:
- tr
status: closed
summary: Closed UNDP project, funded by GEF from 2018 with USD 3.3 million, to monitor and reduce marine
  invasive alien species along Türkiye's coast; TurIST data system launched in 2024.
facts:
- claim: A USD 3.3 million UNDP project funded by GEF from 2018 that aimed to monitor, control and reduce
    invasive alien species along Türkiye's 8,333 km coastline.
  url: https://www.undp.org/tr/turkiye/press-releases/turkiye-undpnin-destegiyle-istilaci-turlerle-mucadeleye-yonelik-ilk-strateji-ve-eylem-planini-benimsiyor
  fetched: 2026-11-03
  quote: 2018'den bu yana Küresel Çevre Fonu (GEF) tarafından finanse edilen ve Türkiye'nin 8.333 km'lik
    kıyı şeridi boyunca istilacı yabancı türlerin izlenmesini, kontrol edilmesini ve azaltılmasını amaçlayan
    3,3 milyon ABD Doları tutarında bir UNDP projesi
- claim: UNDP and DKMP presented Türkiye's first strategy and action plan on invasive alien species in
    May 2024.
  url: https://www.undp.org/tr/turkiye/press-releases/turkiye-undpnin-destegiyle-istilaci-turlerle-mucadeleye-yonelik-ilk-strateji-ve-eylem-planini-benimsiyor
  fetched: 2026-11-03
  quote: Birleşmiş Milletler Kalkınma Programı (UNDP) ile Doğa Koruma ve Milli Parklar Genel Müdürlüğü,
    dün Türkiye'nin istilacı yabancı türlerle mücadele ve bunların zarar verdiği ekosistemleri yeniden
    canlandırmaya yönelik ilk strateji ve eylem planını açıkladı.
- claim: UNDP reported that it had completed the project.
  url: https://www.undp.org/tr/turkiye/press-releases/turkiye-undpnin-destegiyle-istilaci-turlerle-mucadeleye-yonelik-ilk-strateji-ve-eylem-planini-benimsiyor
  fetched: 2026-11-03
  quote: UNDP, Türkiye'nin denizlerindeki istilacı yabancı türlerle mücadele projesini tamamladı
- claim: UNDP reports that the project has concluded.
  url: https://www.undp.org/turkiye/news/undp-concludes-its-project-targeting-invasive-alien-species-turkiyes-seas
  fetched: 2026-11-03
  quote: UNDP concludes its project targeting invasive alien species in Türkiye's seas
- claim: Worked at four sites, in the Black Sea, Sea of Marmara, Aegean and Mediterranean, including İğneada
    Floodplain Forests National Park and Ayvalık Islands Natural Park.
  url: https://www.undp.org/turkiye/news/undp-concludes-its-project-targeting-invasive-alien-species-turkiyes-seas
  fetched: 2026-11-03
  quote: In line with its objectives, the initiative was implemented at four key sites, representing the
    diverse seascapes surrounding Türkiye.
- claim: UNDP says the Turkish National Invasive Alien Species Data and Information System (TurIST) was
    launched in 2024, following the project's conferences and consultations.
  url: https://www.undp.org/turkiye/news/undp-concludes-its-project-targeting-invasive-alien-species-turkiyes-seas
  fetched: 2026-11-03
  quote: With the findings of the conferences and stakeholder consultations, the Turkish National Invasive
    Alien Species Data and Information System ( TurIST ) was launched in 2024
