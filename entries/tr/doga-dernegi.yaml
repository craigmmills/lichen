summary: Association that says it has worked since 2002 to protect threatened species, with
  bird counts at 33 fixed Gediz Delta points and soaring-bird monitoring set up in 2018.
facts:
- claim: Says it has worked since 2002 to defend the diversity of life and protect threatened
    species with their ecosystems.
  url: https://dogadernegi.org/
  fetched: 2026-11-03
  quote: Derneğimiz 2002 yılından bu yana, yaşamın benzersiz çeşitliliğini savunmak ve tehlike
    altındaki türleri bu türlere yaşam alanı sunan ekosistemlerle birlikte korumak için çalışmalar
    yürütüyor.
- claim: Says the Important Nature Area methodology was set out in 2004 by an international
    team that included its experts, and in September 2026 reported the first national coordination
    workshop for updating Türkiye's Important Nature Areas.
  url: https://dogadernegi.org/
  fetched: 2026-11-03
  quote: Bu alanların belirlenmesi için geliştirilen metodoloji, Doğa Derneği uzmanlarının
    da arasında bulunduğu uluslararası bir ekip tarafından 2004 yılında ortaya kondu.
- claim: A May 2019 OSME post says a joint 2013 pilot by Doğa and BSPB found a major soaring-bird
    migration bottleneck in southern Türkiye, and that annual monitoring had been established
    in 2018, with another count planned near Sarımazı, Adana in autumn 2019.
  url: https://osme.org/2019/05/we-invite-you-to-join-the-sarimazi-raptor-count/
  fetched: 2026-11-03
  quote: A joint pilot work of Doga and BSPB in 2013 revealed a major bottleneck
- claim: Reported European Birdwatch Day events in 14 provinces in October 2026.
  url: https://dogadernegi.org/
  fetched: 2026-11-03
  quote: Avrupa Kuş Gözlem Günü Etkinlikleri 14 İlde Gerçekleşti
- claim: Carries out regular bird counts at 33 fixed observation points in the Gediz Delta
    to track annual and seasonal changes.
  url: https://dev.dogadernegi.org/calismalarimiz/onemli-doga-alanlari/sulak-alanlar-ve-nehirler/gediz-deltasi/
  fetched: 2026-11-03
  quote: 33 sabit gözlem noktasında gerçekleştirdiğimiz düzenli kuş sayımlarıyla, kuş popülasyonlarındaki
    yıllık ve mevsimsel değişimleri izlenebilir hale getirdik.
- claim: In 2022 identified jackal, wild boar, fox, badger and other mammals in the Gediz
    Delta through field observation and camera traps.
  url: https://dev.dogadernegi.org/calismalarimiz/onemli-doga-alanlari/sulak-alanlar-ve-nehirler/gediz-deltasi/
  fetched: 2026-11-03
  quote: 2022 yılında, Gediz Deltası’nda yaşayan çakal, yaban domuzu, tilki ve porsuk gibi
    orta ve büyük memeli yaban hayvanlarını ve yaşam alanlarını saha gözlemi ve fotokapanlar
    aracılığıyla belirledik.
- claim: Says midwinter waterbird counts provided information about waterbird populations
    wintering in the Gediz Delta.
  url: https://dev.dogadernegi.org/calismalarimiz/onemli-doga-alanlari/sulak-alanlar-ve-nehirler/gediz-deltasi/
  fetched: 2026-11-03
  quote: Kış Ortası Su Kuşu Sayımları (KOSKS) ile, Gediz Deltası’nda kışlayan su kuşlarının
    popülasyonları hakkında önemli bilgiler elde ettik.
