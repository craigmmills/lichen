summary: University ornithology centre whose Cernek ringing station, reported in September
  2026 as running since spring 2002, has ringed about 150,000 birds of about 180 species.
facts:
- claim: In September 2026, the university reported that its Cernek ringing station
    work had continued since spring 2002 and had ringed about 150,000 birds of about
    180 species.
  url: https://www.omu.edu.tr/tr/icerik/haber/kizilirmak-deltasinda-kuslarin-goc-yollari-25-yildir-kesintisiz-takip-ediliyor
  fetched: 2026-11-09
  quote: '"Şu ana kadar yaklaşık 180 türden 150 bin kuşa halka taktık.'
- claim: The station studies the migration timing, dynamics and stopover ecology of
    songbirds.
  url: https://www.omu.edu.tr/tr/icerik/haber/kizilirmak-deltasinda-kuslarin-goc-yollari-25-yildir-kesintisiz-takip-ediliyor
  fetched: 2026-11-09
  quote: Cernek Kuş Halkalama İstasyonu kurulduğu günden bu yana ötücü kuşların göç
    takvimlerini, göç dinamiklerini, konaklama ekolojilerini araştırmaktadır.
- claim: Its director says national ringing work and training are done in cooperation
    with the General Directorate of Nature Conservation and National Parks.
  url: https://www.omu.edu.tr/tr/icerik/haber/kizilirmak-deltasinda-kuslarin-goc-yollari-25-yildir-kesintisiz-takip-ediliyor
  fetched: 2026-11-09
  quote: Ulusal düzeyde halkalama çalışmaları ve eğitimleri Tarım ve Orman Bakanlığı
