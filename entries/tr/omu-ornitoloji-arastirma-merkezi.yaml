- claim: In January 2019, Doğa Derneği said that Türkiye’s midwinter waterbird counts
    had been coordinated since 2013 by the KOSKS committee, the OMÜ Ornithology Research
    Centre and the General Directorate of Nature Conservation and National Parks.
