summary: A species monitoring app for volunteer observers, built and run by WWF-Türkiye, released for
  Android and iOS, first covering vultures, dolphins, sea turtles and cranes, with a sharks module added
  later.
facts:
- claim: WWF-Türkiye says it completed development and testing of the Gözüm Doğada species monitoring
    app with experts, and released it for Android and iOS.
  url: https://www.wwf.org.tr/kesfet/biyocesitlilik/gozum_dogada/
  fetched: 2026-11-03
  quote: “Gözüm Doğada” isimli tür izleme mobil uygulama çalışmalarını ve testlerini konunun uzmanlarıyla
    tamamladık. Uygulama, Android ve iOS işletim sistemine sahip telefonlarda kullanıma açıldı.
- claim: Volunteer observers could at first record vultures, dolphins, sea turtles and cranes.
