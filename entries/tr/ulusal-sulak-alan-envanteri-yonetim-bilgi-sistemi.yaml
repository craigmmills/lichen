    management information system.
  url: https://dogayaguckat.org/doga-danis/
  fetched: 2026-11-09
  quote: Ulusal Sulak Alan Envanteri Yönetim Bilgi Sistemidir.
- claim: It describes it as a database of all artificial and natural wetlands in Türkiye
    with some information on each.
  url: https://dogayaguckat.org/doga-danis/
  fetched: 2026-11-09
  quote: Türkiye’deki yapay veya doğal tüm sulak alanların ve bu alanlara ait bazı
    bilgilerin yer aldığı veri tabanıdır.
- claim: It says the database records province, district, basin, wetland type, size,
    registered area and protection status.
  url: https://dogayaguckat.org/doga-danis/
  fetched: 2026-11-09
  quote: Veri tabanında sulak alanın bulunduğu, il, ilçe, havza, sulak alan tipi (denizel/kıyısal-karasal
