summary: Closed survey described as the first nationwide, basin-scale eDNA study of Turkish freshwater
  fishes, covering 29 sites in seven basins and detecting 52 species, published in 2026.
facts:
- claim: Described as the first nationwide, basin-scale eDNA metabarcoding survey of freshwater fishes
    across Türkiye's major river systems, covering 29 sites in seven basins.
  url: https://avesis.ankara.edu.tr/yayin/f04c0fe2-5a4f-417f-8ef0-24a81fb5601a/basin-scale-edna-metabarcoding-reveals-freshwater-fish-biodiversity-patterns-across-major-river-systems-in-turkiye
  fetched: 2026-11-03
  quote: we present the first nationwide, basin-scale eDNA metabarcoding survey of freshwater fishes across
    Türkiye's major river systems
- claim: Detected 52 fish species, including native, invasive and some previously unrecorded in their
    basins.
  url: https://avesis.ankara.edu.tr/yayin/f04c0fe2-5a4f-417f-8ef0-24a81fb5601a/basin-scale-edna-metabarcoding-reveals-freshwater-fish-biodiversity-patterns-across-major-river-systems-in-turkiye
  fetched: 2026-11-03
  quote: detecting 52 fish species, including native, invasive and several taxa previously unrecorded
