summary: Regional directorate, run by the General Directorate of Nature Conservation
  and National Parks, which in December 2022 was reported to have recorded animals
  with 160 camera traps across seven provinces.
facts:
- claim: In December 2022, Anadolu Agency reported that the directorate's teams had
    recorded animals with 160 camera traps placed in rural areas.
  url: https://www.aa.com.tr/tr/yasam/anadoludaki-yaban-hayati-fotokapanlara-yansidi/2773474
  fetched: 2026-11-09
  quote: Tarım ve Orman Bakanlığı Doğa Koruma ve Milli Parklar 15. Bölge Müdürlüğü
    ekipleri, kırsal alanlara yerleştirilen 160 fotokapanla çeşitli hayvanları doğal
    ortamlarında görüntüleyerek kayıt altına aldı.
- claim: The December 2022 report described its responsibility area as Kahramanmaraş,
    Malatya, Elazığ, Diyarbakır, Batman, Sivas and Tunceli.
  url: https://www.aa.com.tr/tr/yasam/anadoludaki-yaban-hayati-fotokapanlara-yansidi/2773474
  fetched: 2026-11-09
  quote: Kahramanmaraş, Malatya, Elazığ, Diyarbakır, Batman, Sivas ve Tunceli'de yaban
    hayatının yoğun olduğu bölgelere yerleştirilen fotokapanlar
- claim: In the December 2022 report, regional director Ahmet Çörtük said experts
    reported the camera-trap images before they were sent to the ministry.
  url: https://www.aa.com.tr/tr/yasam/anadoludaki-yaban-hayati-fotokapanlara-yansidi/2773474
  fetched: 2026-11-09
  quote: Fotokapanlarla aldığımız görüntüler toplanıyor, uzmanlar tarafından raporlanıyor
    daha sonra biz bunu Bakanlığımıza gönderiyoruz.
