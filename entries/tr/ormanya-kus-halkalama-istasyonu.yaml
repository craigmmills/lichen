summary: Bird ringing station set up in Ormanya Natural Life Park, reported in May
  2023 to have ringed over 100 birds of 21 species in its first week, with ringing
  planned across four seasons.
facts:
- claim: In May 2023, Kocaeli Metropolitan Municipality reported that a bird ringing
    station had been set up and begun work in Ormanya Natural Life Park to study migrating
    birds.
  url: https://www.kocaeli.bel.tr/amp/haber/ormanya-kus-halkalama-istasyonu-kuruldu-43626.html
  fetched: 2026-11-09
  quote: Kocaeli Büyükşehir Belediyesi’ne bağlı Ormanya Doğal Yaşam Parkında göçmen
    kuş türlerinin göç rotaları, davranışları, kışlama alanları, göç zamanı ve stratejilerinin
    belirlenmesi amacıyla kuş halkalama istasyonunu kuruldu.
- claim: The May 2023 report said Ergün Bacak and a person it named as Cemal Özsemir
    supervised ringing and observation, which were planned to continue across four
    seasons, initially for one year.
  url: https://www.kocaeli.bel.tr/amp/haber/ormanya-kus-halkalama-istasyonu-kuruldu-43626.html
  fetched: 2026-11-09
  quote: İstanbul Üniversitesi Öğr. Gör. Ergün Bacak ve Samsun 19 Mayıs Üniversitesi’nden
    Cemal Özsemir nezaretinde gerçekleşen halkalama ve gözlem çalışmaları dört mevsim
    devam edecek.
- claim: The May 2023 report said more than 100 birds of 21 species had been ringed
    in the first seven days.
  url: https://www.kocaeli.bel.tr/amp/haber/ormanya-kus-halkalama-istasyonu-kuruldu-43626.html
  fetched: 2026-11-09
  quote: İlk 7 günde 21 farklı türden 100’ün üzerinde kuş halkalanarak kayıt altına
    alındı.
- claim: The May 2023 report described 27 ringing points in different parts of Ormanya.
  url: https://www.kocaeli.bel.tr/amp/haber/ormanya-kus-halkalama-istasyonu-kuruldu-43626.html
  fetched: 2026-11-09
  quote: Ormanya’nın farklı bölümlerine kurulan 27 halkalama noktası
