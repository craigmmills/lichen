summary: Pilot technology-based biodiversity monitoring system for Kazdağı National Park, built by IUCN,
  Huawei and Doğa Koruma Merkezi, deployed from April 2026, with a press release saying it focuses on
  wild goats and fallow deer.
facts:
- claim: IUCN, Huawei and local partner DKM developed a pilot technology-based biodiversity monitoring
    system for Kazdağı National Park.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: International Union for Conservation of Nature (IUCN) , Huawei, and local partner DKM (Nature
    Conservation Center) have developed a pilot technology-based biodiversity monitoring system for Kazdağı
    National Park.
- claim: Deployment began in April 2026 with bioacoustic recorders, weather stations and solar-powered
    camera traps over 15,000 hectares.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: With deployment commencing in April 2026, the solution comprises bioacoustic recorders, meteorological
    stations, and solar-powered camera traps
- claim: By September 2026 it had captured more than 4,500 images and videos and 45 hours of bioacoustic
    recordings.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: As of September 2026, the solution had captured more than 4,500 images and videos, and 45 hours
    of bioacoustic recordings of environmental sounds.
- claim: A Tech4Nature press release on Kyodo News PR Wire says the Türkiye project monitors umbrella
    species as indicators of ecosystem health, focusing on wild goats and fallow deer.
  url: https://kyodonewsprwire.jp/release/202510136977
  fetched: 2026-11-03
  quote: in Türkiye to monitor umbrella species as indicators of overall ecosystem health, with a focus
    on wild goats and fallow deer
