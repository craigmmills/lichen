summary: Mediterranean monk seal research group that monitored the İzmir, Muğla and Antalya
  coasts in 2019 to 2022 using cave camera traps and a sightings database, and partners with
  DKMP.
facts:
- claim: Between 2019 and 2022 it ran five monitoring projects on the İzmir, Muğla and Antalya
    coasts.
  url: https://sadafag.org/wp-content/uploads/2023/08/tr-v1.3-sad-afag-akdeniz-fokunun-izmir-mugla-antalya-kiyilarinda-izlenmesi-2022-csib-ve-tubitak-mam.pdf
  fetched: 2026-11-03
  quote: uzunluğundaki kıyılarında araştırmalara odaklanmış ve bu kapsamda 5 farklı izleme
    projesi
- claim: Images came from infrared camera traps in 6 caves on the İzmir coast, 12 in Muğla
    and 6 in Antalya.
  url: https://sadafag.org/wp-content/uploads/2023/08/tr-v1.3-sad-afag-akdeniz-fokunun-izmir-mugla-antalya-kiyilarinda-izlenmesi-2022-csib-ve-tubitak-mam.pdf
  fetched: 2026-11-03
  quote: kıyılarında 12 mağara ve Antalya kıyılarında 6 mağaranın kızılötesi kamera tuzaklarından
    alınan
- claim: In 2021 and January–November 2022, 554 first-hand seal sighting records from the
    AFBİKA network were entered into the SAD-AFAG seal database.
  url: https://sadafag.org/wp-content/uploads/2023/08/tr-v1.3-sad-afag-akdeniz-fokunun-izmir-mugla-antalya-kiyilarinda-izlenmesi-2022-csib-ve-tubitak-mam.pdf
  fetched: 2026-11-03
  quote: gözlem kaydı SAD-AFAG fok veri tabanına girilmiştir.
- claim: Its 2022 report says one project started in 2019 with MAVA Foundation support and
    was completed in 2020 with the IUCN Mediterranean Office; two later projects were supported
    by the Monk Seal Alliance.
  url: https://sadafag.org/wp-content/uploads/2023/08/tr-v1.3-sad-afag-akdeniz-fokunun-izmir-mugla-antalya-kiyilarinda-izlenmesi-2022-csib-ve-tubitak-mam.pdf
  fetched: 2026-11-03
  quote: Projelerden biri İzmir ve Muğla kıyılarında MAVA Vakfı’nın desteği ile
- claim: Its 2013 FokData page says AFAG created the digital inventory in 1987 and entered
    reliable sightings and seals observed in its own field surveys.
  url: https://sadafag.org/akdeniz-foku/fokdata/
  fetched: 2026-11-03
  quote: AFAG kurulduğu 1987 senesinde FokData adı ile bir sayısal envanter oluşturmuştur.
- claim: Had identified 60 individual monk seals on Türkiye's coasts from its own detailed
    photographs and videos by September 2013.
  url: https://sadafag.org/akdeniz-foku/fokdata/
  fetched: 2026-11-03
  quote: SAD-AFAG Eylül 2013 itibariyle detaylı fotoğraf ve videolar ile aratırma grubu olarak
    kendisinin yaptığı gözlemlerle şu ana Türkiye kıyılarında 60 Akdeniz foku bireyi tanımlamıştır.
