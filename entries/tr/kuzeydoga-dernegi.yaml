summary: Kars-registered association founded in 2008 that runs and builds a large carnivore
  research project using camera traps and GPS collars, and uses eBird, as reported by Cumhuriyet.
facts:
- claim: Wikipedia says it began in 2003 as the Kars-Iğdır Biodiversity Project and was founded
    as KuzeyDoğa by Çağan H. Şekercioğlu in January 2008.
  url: https://en.wikipedia.org/wiki/KuzeyDo%C4%9Fa
  fetched: 2026-11-03
  quote: The organization was initially created in 2003 as the Kars-Iğdır Biodiversity Project
    by the biology professor Çağan H. Şekercioğlu, who subsequently founded KuzeyDoğa in January
    2008.
- claim: Wikipedia says it has placed motion-triggered cameras in eastern Anatolia since 2006.
  url: https://en.wikipedia.org/wiki/KuzeyDo%C4%9Fa
  fetched: 2026-11-03
  quote: Since 2006, the organization placed motion-triggered cameras to capture the wildlife
    in the Eastern Anatolian region
- claim: Wikipedia says its tracking collars and wildlife cameras are used to describe the
    movements and home ranges of bears, wolves and lynx.
  url: https://en.wikipedia.org/wiki/KuzeyDo%C4%9Fa
  fetched: 2026-11-03
  quote: These tracking collars, combined with information from wildlife cameras sprinkled
    across the region, allow KuzeyDoğa researchers to describe the movements and home ranges
- claim: An AA report says more than 500,000 camera-trap photos from 142 points and 91,166
    GPS points from collared wolves were obtained in the Sarıkamış work.
  url: https://www.haberler.com/guncel/kars-in-sarikamis-ilcesinde-kurtlar-hakkinda-onemli-bilgiler-elde-edildi-17540314-haberi/
  fetched: 2026-11-03
  quote: Fotokapanlarla 142 noktada çekilen 500 binin üzerinde fotoğraftaki kurtlar bulundu.
    Vericili kurtlardan 91 bin 166 GPS noktası
- claim: A 2012 GEF news item says the KuzeyDoga Society started a project in April 2010,
    with GEF Small Grants Programme support, on the status of large carnivores in north-eastern
    Turkey.
  url: https://www.thegef.org/newsroom/news/gef-sgp-helps-establish-turkeys-first-wildlife-corridor
  fetched: 2026-11-03
  quote: the KuzeyDoga Society started a project in April 2010 aimed to understand the status
    of large carnivores in the northeastern part of Turkey
- claim: GEF says the society monitored wolves' GPS coordinates through collars that sent
    SMS messages.
  url: https://www.thegef.org/newsroom/news/gef-sgp-helps-establish-turkeys-first-wildlife-corridor
  fetched: 2026-11-03
  quote: the organization was able to monitor wolves GPS coordinates via regular SMS text
    messages
- claim: GEF says an agreement to create the wildlife corridor was signed between the ministry
    and KuzeyDoga in December 2011.
  url: https://www.thegef.org/newsroom/news/gef-sgp-helps-establish-turkeys-first-wildlife-corridor
  fetched: 2026-11-03
  quote: an MOU for the creation of the wildlife corridor has been signed between the Ministry
    and KuzeyDoga in December 2011.
- claim: Registered in Kars in January 2008; its mission is conserving the biocultural diversity
    of northeastern Türkiye.
  url: https://iucn.org/our-union/members/iucn-members/kuzeydoga-dernegi
  fetched: 2026-11-03
  quote: KuzeyDoğa Society is officially registered under the Associations Law No. 5253, with
    registry no. 36-003-158, in Kars, Turkey, in 16.01.2008.
- claim: In July 2022, Anadolu Agency reported that it had placed 45 camera traps in Allahuekber
    Mountains National Park forests and nearby sites under a large carnivore research project
    the report says it started in 2006.
  url: https://mobile.aa.com.tr/tr/bilim-teknoloji/kars-ormanlarindaki-fotokapanlar-bilimsel-calismalara-isik-tutuyor/2634666
  fetched: 2026-11-03
  quote: Kars KuzeyDoğa Derneği tarafından 2006 yılında başlatılan "Büyük Etoburların Araştırılması
    Projesi" kapsamında
