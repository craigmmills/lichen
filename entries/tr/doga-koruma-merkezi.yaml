summary: Organisation founded in 2004, based in Ankara, that builds Tech4Nature Türkiye, a
  pilot biodiversity monitoring system for Kazdağı National Park, with Huawei and IUCN as
  partners.
facts:
- claim: Local partner, with IUCN and Huawei, in developing a pilot biodiversity monitoring
    system for Kazdağı National Park.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: International Union for Conservation of Nature (IUCN) , Huawei, and local partner
    DKM (Nature Conservation Center) have developed a pilot technology-based biodiversity
    monitoring system for Kazdağı National Park.
- claim: Its deputy director general said that as part of Tech4Nature they developed a sample
    monitoring protocol.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: As part of the Tech4Nature project, we developed a sample monitoring protocol for
    a globally important site.
- claim: Received a CEPF grant of $146,757 (August 2006 to June 2008) for a biodiversity assessment
    and monitoring training programme in the Turkish Caucasus.
  url: https://www.cepf.net/grants/grantee-projects/training-conservation-biodiversity-assessment-and-monitoring-training
  fetched: 2026-11-03
  quote: 'Grantee Name: Doga Koruma Merkezi-Nature Conservation Centre'
- claim: Founded in 2004 to conserve biodiversity and manage natural resources sustainably;
    address in Çankaya, Ankara.
  url: https://dkm.org.tr/hakkimizda
  fetched: 2026-11-03
  quote: Doğa Koruma Merkezi (DKM), 2004 yılında, biyolojik çeşitliliğin etkin şekilde korunması
    ve doğal kaynakların sürdürülebilir şekilde yönetilmesi amacıyla kurulmuştur.
- claim: Its address is in Çankaya, Ankara.
  url: https://dkm.org.tr/hakkimizda
  fetched: 2026-11-03
  quote: 'Çiğdem Mahallesi 1594. Sokak No: 3 06530 Çankaya/Ankara'
- claim: Its project manager writes that the team installed solar-powered camera traps, bioacoustic
    recorders and a meteorological station in Kazdağı.
  url: https://tech4nature.iucngreenlist.org/building-conservation-from-the-ground-up-tech4nature-turkiye-in-kazdagi/
  fetched: 2026-11-03
  quote: By the end of the deployment, we had installed solar-powered camera traps, bioacoustic
    recorders, and a meteorological station across the area.
