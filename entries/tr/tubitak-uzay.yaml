summary: TÜBİTAK space technologies institute that builds the Gezgin portal and processes
  İMECE satellite images, with İMECE described as the first domestic observation satellite
  with sub-metre resolution.
facts:
- claim: Developed the İMECE satellite.
  url: https://tubitak.gov.tr/tr/haber/imece-uydusu-icin-geri-sayim-basladi
  fetched: 2026-11-03
  quote: TÜBİTAK UZAY tarafından geliştirilen yerli ve milli İMECE Uydusu'ndan fırlatmanın
    ardından ilk görüntünün, 48 saat içerisinde alınması hedefleniyor.
- claim: İMECE is described as the first domestic observation satellite with sub-metre resolution.
  url: https://tubitak.gov.tr/tr/haber/imece-uydusu-icin-geri-sayim-basladi
  fetched: 2026-11-03
  quote: “Metrealtı çözünürlüğe sahip” ilk yerli ve milli gözlem uydusu İMECE
- claim: An April 2022 announcement said İMECE was intended to serve target detection, natural
    disasters, mapping and agricultural uses, among others, for civil and military purposes.
  url: https://tubitak.gov.tr/tr/haber/imece-uydusu-icin-geri-sayim-basladi
  fetched: 2026-11-03
  quote: hedef tespit ve teşhis, doğal afet, haritalama, tarımsal uygulamalar gibi birçok
    alanda hizmet verecek
- claim: Processes images from the RASAT, GÖKTÜRK-2 and İMECE imaging satellites it developed,
    including calibration and analysis-ready data creation.
  url: https://uzay.tubitak.gov.tr/en/data-processing-and-mining-applications/
  fetched: 2026-11-03
  quote: Processing of satellite images, absolute radiometric and geometric calibration and
    analysis-ready data creation for RASAT, GÖKTÜRK-2 and İMECE imaging satellites that are
    developed by TÜBİTAK UZAY are carried out in this context.
- claim: Listed by CEOS as a member agency for Turkey, joining in 2006.
  url: https://ceos.org/about-ceos/agencies/
  fetched: 2026-11-03
  quote: TÜBİTAK Space Technologies Research Institute (TÜBİTAK UZAY) Turkey 2006
- claim: Address on the METU campus in Ankara.
  url: https://uzay.tubitak.gov.tr/en/contact/
  fetched: 2026-11-03
  quote: TÜBİTAK UZAY METU Campus No:167, 06800, Ankara
- claim: Its data valorisation skills cover satellite image levelling, calibration, semantic
    image analysis, image matching, and pattern and object recognition.
  url: https://uzay.tubitak.gov.tr/veri-kiymetlendirme-uygulamalari/
  fetched: 2026-11-03
  quote: Sahip olduğumuz yetkinlikler; uydu görüntü seviyelendirilmesi, kalibrasyon, anlamsal
    görüntü analizi, görüntü eşleme, 3 boyutlu görüntüleme, örüntü ve nesne tanıma, yüksek
    performanslı hesaplama ve 3 boyutlu görselleştirme alanlarını kapsamaktadır.
