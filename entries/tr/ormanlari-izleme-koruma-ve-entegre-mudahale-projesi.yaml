status: active
summary: OGM project started in 2017 using AI-supported monitoring, with OGM reporting 3,150 camera traps
  active across Türkiye’s forests at the end of 2025 and 136 forest crimes detected.
facts:
- claim: Started in 2017; AI-supported monitoring systems are used under it.
  url: https://www.dha.com.tr/gundem/ogmden-kacak-kesimlere-karsi-7-24-koruma-2780143
  fetched: 2026-11-03
  quote: 2017 yılında hayata geçirilen ORİKEM (Ormanları İzleme, Koruma ve Entegre Müdahale Projesi) kapsamında
    yapay zeka destekli izleme sistemleri kullanılıyor.
- claim: An OGM statement reported by DHA says 3,150 camera traps were active in forest areas across Türkiye
    at the end of 2025.
  url: https://www.dha.com.tr/gundem/ogmden-kacak-kesimlere-karsi-7-24-koruma-2780143
  fetched: 2026-11-03
  quote: 2025 yılı sonu itibarıyla Türkiye genelindeki orman alanlarında 3 bin 150 fotokapan aktif olarak
    görev yapıyor.
- claim: The same statement says 136 forest crimes have been detected on site and responded to through
    these systems.
  url: https://www.dha.com.tr/gundem/ogmden-kacak-kesimlere-karsi-7-24-koruma-2780143
  fetched: 2026-11-03
  quote: Bu sistemler sayesinde bugüne kadar 136 orman suçu olay yerinde tespit edilerek müdahale edildi.
- claim: In September 2025, OGM reported using AI to detect forest crimes and to analyse, classify and
    produce statistics from camera-trap data.
  url: https://www.ogm.gov.tr/tr/haberler/ormanlari-korumada-yapay-zeka-destekli-ori%CC%87kem
  fetched: 2026-11-03
  quote: Projede orman suçlarının tespiti, olay yerinde hızlı müdahale ve fotokapanlardan gelen verilerin
    analizi, sınıflandırılması, istatistiksel veriler oluşturulması, stratejik planlar içinde verilerin
    değerlendirilmesi konularında yapay zeka uygulaması aktif rol alıyor.
- claim: In September 2025, OGM reported that camera traps were in active use in 30 regional forestry
    directorates, providing monitoring around the clock.
  url: https://www.ogm.gov.tr/tr/haberler/ormanlari-korumada-yapay-zeka-destekli-ori%CC%87kem
  fetched: 2026-11-03
  quote: Bu cihazlar sayesinde ormanlar 7/24 izlenerek, olası suçlara karşı önleyici bir mekanizma kurulmuş
    oluyor.
