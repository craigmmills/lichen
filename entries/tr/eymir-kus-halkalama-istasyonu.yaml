facts:
- claim: An April 2025 Başkent Gazete report said the station had operated for eight
    years through cooperation of Ankara University, METU and DKMP, with OSME support,
    and had ringed more than 15,000 birds of 95 species.
  url: https://baskentgazete.com.tr/ankarada-halkalandilar-israil-ve-lublanda-aga-takildilar
  fetched: 2026-11-09
  quote: Ankara Üniversitesi (AÜ), ODTÜ ile Doğa Koruma ve Milli Parklar Genel Müdürlüğünün
    işbirliğinde ve Ornithological Society of the Middle East'in destekleriyle 8 yıldır
    faaliyet gösteren Eymir Kuş Halkalama İstasyonu'nda bugüne kadar 95 farklı türden
    15 binden fazla kuş halkalandı.
