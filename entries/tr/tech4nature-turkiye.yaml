summary: Biodiversity monitoring project built by IUCN, Huawei and Doğa Koruma Merkezi, deployed from
  April 2026 over 15,000 hectares, with more than 4,500 images and videos and 45 hours of recordings by
  September 2026.
facts:
- claim: Deployment began in April 2026 with bioacoustic recorders, meteorological stations and solar-powered
    camera traps, covering 15,000 hectares.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: With deployment commencing in April 2026, the solution comprises bioacoustic recorders, meteorological
    stations, and solar-powered camera traps, as well as training sessions to instruct regional forestry
    experts in their use. It covers 15,000 hectares
- claim: By September 2026 it had captured more than 4,500 images and videos and 45 hours of bioacoustic
    recordings.
  url: https://www.huawei.com/en/tech4all/stories/tech4nature-turkiye-every-species-counts
  fetched: 2026-11-03
  quote: As of September 2026, the solution had captured more than 4,500 images and videos, and 45 hours
    of bioacoustic recordings of environmental sounds.
- claim: Work is under way on digital infrastructure to support IUCN Red List species assessments.
  url: https://tech4nature.iucngreenlist.org/building-conservation-from-the-ground-up-tech4nature-turkiye-in-kazdagi/
  fetched: 2026-11-03
  quote: Alongside the field deployment, work is underway to develop digital infrastructure that supports
    species assessments for the International Union for Conservation of Nature Red List and broader conservation
    planning efforts.
