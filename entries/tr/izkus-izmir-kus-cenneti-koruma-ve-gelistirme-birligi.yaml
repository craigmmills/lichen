summary: A union whose 2008 İzmir Bird Sanctuary protocol expired unrenewed, according
  to a June 2017 report that quoted then mayor Aziz Kocaoğlu putting spending at 26
  million liras.
facts:
- claim: The union signed a protocol in 2008 with the General Directorate of Nature
    Conservation and National Parks for joint work at the İzmir Bird Sanctuary. A
    June 2017 report said the ministry had let the protocol expire without renewal
    four months earlier.
  url: https://hurriyetdailynews.com/road-construction-plans-over-flamingo-sanctuary-in-turkeys-west-stir-debate-114725
  fetched: 2026-11-17
  quote: A protocol signed between the Conservation and Development Union of the İzmir
    Bird Sanctuary (İZKUŞ) and the ministry’s General Directorate of Nature Conservation
    and National Parks in 2008 was not renewed by the ministry after it ended four
    months ago.
- claim: In a June 2017 report, then İzmir mayor and İZKUŞ head Aziz Kocaoğlu put
    total spending on the İzmir Bird Sanctuary at 26 million Turkish liras.
  url: https://hurriyetdailynews.com/road-construction-plans-over-flamingo-sanctuary-in-turkeys-west-stir-debate-114725
  fetched: 2026-11-17
  quote: İzmir Mayor and İZKUŞ head Aziz Kocaoğlu said the total amount spent on the
    İzmir Bird Sanctuary had reached 26 million Turkish Liras.
