summary: A legal entity of four member municipalities that aims to protect the 56,000-hectare
  Kızılırmak Delta, and which the Samsun Governor's Office says received its protection
  and management under a 2015 protocol.
facts:
- claim: The union is a legal entity established to protect and sustain the Kızılırmak
    Delta's ecological and socioeconomic balance and biodiversity.
  url: https://samsun.bel.tr/uploads/documents/faaliyet-raporlari/samsun-kizilirmak-deltasi-koruma-ve-gelistirme-birligi-2019-yili-faaliyet-raporu.pdf
  fetched: 2026-11-17
  quote: 'Sosyo-ekonomik denge, ekolojik denge ve biyolojik

    çeşitliliğin korunması ve sürdürülebilirliğinin

    sağlanması amacıyla kurulmuş bir tüzel kişiliktir.'
- claim: Its 2019 activity report names the four member municipalities, Samsun Metropolitan,
    Alaçam, Bafra and 19 Mayıs.
  url: https://samsun.bel.tr/uploads/documents/faaliyet-raporlari/samsun-kizilirmak-deltasi-koruma-ve-gelistirme-birligi-2019-yili-faaliyet-raporu.pdf
  fetched: 2026-11-17
  quote: Birliğin üyeleri Samsun Büyükşehir Belediyesi,
- claim: The union's 2019 activity report describes protecting the full 56,000 hectares
    of the Samsun Kızılırmak Delta, including areas with national and international
    protection status, as one of its aims.
  url: https://samsun.bel.tr/uploads/documents/faaliyet-raporlari/samsun-kizilirmak-deltasi-koruma-ve-gelistirme-birligi-2019-yili-faaliyet-raporu.pdf
  fetched: 2026-11-17
  quote: 'Ulusal ve Uluslararası koruma statülerine

    sahip alanlar ile birlikte toplam 56.000 hektar olan

    Samsun K ızılırmak Deltası’nın; tüm bu alanlar ile

    birlikte korunması'
- claim: A 2015 cooperation protocol with the ministry and DKMP handed protection,
    control and management of the Kızılırmak Delta area to the union, according to
    the Samsun Governor's Office.
  url: https://www.samsun.gov.tr/kizilirmak-deltasi-kus-cenneti-ve-mandacilik
  fetched: 2026-11-17
  quote: alanın koruma-kontrol, yönetim faaliyetleri SAMKUŞ’ a devredilmiştir.
