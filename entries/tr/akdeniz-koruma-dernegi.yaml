summary: Association founded after a 2008 study found Gökova Bay the poorest Mediterranean
  area for fish; its 2024 report says AI work advanced sandbar shark monitoring, with real-time
  hardware planned for 2025.
facts:
- claim: Founded after a 2008 study found Gökova Bay to be the poorest area of the Mediterranean
    for fish; its founder is Zafer Kızılkaya.
  url: https://indigodergisi.com/2018/04/akdeniz-koruma-dernegi-deniz-koruculugu
  fetched: 2026-11-03
  quote: Derneğin kurucusu Zafer Kızılkaya, hem bu sıkıntıları gidermek hem de dünyaya örnek
    bir proje hayata geçirmek amacıyla Akdeniz Koruma Derneği’ni kurdu.
- claim: Carries out scientific monitoring in Boncuk Bay under the coordination of the environment
    ministry's natural assets directorate general.
  url: https://www.dha.com.tr/foto-galeri/boncuk-koyunun-kum-kopek-baliklari-24-saat-izleniyor-2915673
  fetched: 2026-11-03
  quote: Çevre, Şehircilik ve İklim Değişikliği Bakanlığı Tabiat Varlıklarını Koruma Genel
    Müdürlüğü koordinasyonunda, Akdeniz Koruma Derneği tarafından gerçekleştiriliyor.
- claim: On its proposal, based on its scientific work, Boncuk Bay was designated an Important
    Shark Area (ISRA) by IUCN in 2023, according to the report.
  url: https://www.dha.com.tr/foto-galeri/boncuk-koyunun-kum-kopek-baliklari-24-saat-izleniyor-2915673
  fetched: 2026-11-03
  quote: Akdeniz Koruma Derneği'nin yürüttüğü bilimsel çalışmalar kapsamında sunduğu öneri
    doğrultusunda Boncuk Koyu, Uluslararası Doğayı Koruma Birliği (IUCN) tarafından 2023 yılında
    Önemli Köpek Balığı Alanı (ISRA) olarak belirlendi.
- claim: Its marine rangers use the GPS-enabled SMART mobile app to record patrols, incidents
    and species observations in no-fishing zones.
  url: https://www.akdenizkoruma.org.tr/tr/calismalarimiz/deniz-koruma-alanlari/b/deniz-koruyuculugu-sistemi
  fetched: 2026-11-03
  quote: küresel veri sistemi (GPS) ile uyumlu SMART (Smart Monitoring and Reporting Tool)
    adlı mobil uygulama kullanılmaktadır.
- claim: Its 2024 activity report says AI integration work advanced its sandbar shark monitoring
    project, with hardware integration for real-time application of the model planned for
    completion in 2025.
  url: https://akdenizkoruma.org.tr/storage/66pPcx2KZiqya6gaBqk6JtjlVjcpafAUlNrxwuEP.pdf
  fetched: 2026-11-03
  quote: 'Yapay zeka modelinin sürekli izleme sistemine

    gerçek zamanlı olarak uygulanabilmesi için donanım

    entegrasyonunun 2025 yılında tamamlanması

    planlanmaktadır.'
- claim: Its address is in Bornova, İzmir.
  url: https://www.akdenizkoruma.org.tr/tr/calismalarimiz/deniz-koruma-alanlari/b/deniz-koruyuculugu-sistemi
  fetched: 2026-11-03
  quote: 'Kazımdirik Mah. 296 Sok. No:8 Folkart Time 1 Blok D: 704 Bornova-İZMİR'
