summary: Caracal tracking project in Muğla where, a February 2024 report said, Dr. Yasin İlemin fitted
  a satellite transmitter to a caracal for the first time in Türkiye.
facts:
- claim: A February 2024 report said Dr. Yasin İlemin, who had followed caracals for 16 years, fitted
    a satellite transmitter to a caracal for the first time in Türkiye.
  url: https://www.haberturk.com/turkiye-de-ilk-defa-bir-karakulaka-uydu-verici-takildi-3663259
  fetched: 2026-11-03
  quote: Dr. Yasin İlemin, nesli tehlike altındaki bu türe Türkiye'de ilk defa uydu verici taktı.
- claim: In February 2024, the team said it had focused since late 2021 on caracals in areas not affected
    by fire, catching them with special techniques and using satellite transmitters to understand their
    ecology.
  url: https://www.haberturk.com/turkiye-de-ilk-defa-bir-karakulaka-uydu-verici-takildi-3663259
  fetched: 2026-11-03
  quote: Onlara zarar vermeden özel tekniklerle yakalayarak uydu vericisi yardımı ile onların ekolojilerini
    ve biyolojilerini daha iyi anlamak için çalışıyoruz
- claim: The female was fitted with a light GPS collar with a UHF transmitter after a camera-trap signal
    led the team to the trap.
  url: https://www.haberturk.com/turkiye-de-ilk-defa-bir-karakulaka-uydu-verici-takildi-3663259
