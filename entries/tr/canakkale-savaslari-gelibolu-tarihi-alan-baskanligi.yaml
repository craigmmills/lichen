summary: A directorate set up by Law 6546 of June 2014, which ended the Gallipoli
  Peninsula's national park status; its history page gives the peninsula as 33,500
  hectares.
facts:
- claim: Law 6546 of June 2014 ended the national park status of the Gallipoli Peninsula
    and set up the Directorate.
  url: https://canakkaletarihialan.gov.tr/tr/kurumsal/kurulus
  fetched: 2026-11-17
  quote: 2014 yılında Haziran ayında 6546 Sayılı Kanun ile milli park vasfı kaldırılmış
    ve Çanakkale Savaşları Gelibolu Tarihi Alan Başkanlığı kurulmuştur.
- claim: The Directorate's history page describes the Gallipoli Peninsula as covering
    33,500 hectares. It says the peninsula was placed under the forest regime on 25
    May 1973 and declared a national park on 2 November 1973.
  url: https://canakkaletarihialan.gov.tr/tr/kurumsal/kurulus
  fetched: 2026-11-17
  quote: 33 bin 500 hektar alana sahip olan Gelibolu Yarımadası, Orman Bakanlığının
    önerisiyle önce Bakanlar Kurulu'nun 7/6477 sayılı kararı ile 25.05.1973 tarihinde
    “orman rejimi” içine alınmıştır.
