summary: An AI forest fire prediction model built by Koç Holding, KoçDigital and Orman Genel Müdürlüğü,
  reportedly analysing over 400 variables and detecting fire risk with 86% accuracy.
facts:
- claim: Koç Holding's chief executive presented FireAId, an AI-supported prediction model the group developed
    against forest fires.
  url: https://www.forbes.com.tr/yapay-zeka/koc-holding-in-yangin-tahmin-projesi-akdeniz-e-ornek-oldu
  fetched: 2026-11-03
  quote: Koç Holding’in orman yangınlarına karşı geliştirdiği yapay zeka destekli tahmin modeli FireAId’i
    tanıttı.
- claim: He said the system, developed after the large 2021 fires in the Aegean and Mediterranean regions,
    analyses more than 400 variables and detects fire risk with 86% accuracy.
  url: https://www.forbes.com.tr/yapay-zeka/koc-holding-in-yangin-tahmin-projesi-akdeniz-e-ornek-oldu
  fetched: 2026-11-03
  quote: 400’den fazla değişkeni analiz ederek yüzde 86 doğrulukla yangın riski tespiti yaptığını söyledi.
- claim: A second phase developed a resource management module so authorities can send resources earlier
    to high-risk areas; he said the Ministry of Agriculture and Forestry's interest in the project was
    growing.
  url: https://www.forbes.com.tr/yapay-zeka/koc-holding-in-yangin-tahmin-projesi-akdeniz-e-ornek-oldu
  fetched: 2026-11-03
  quote: Modelin ikinci aşamasında, yetkililerin kaynaklarını yangın riski yüksek bölgelere daha erken
    yönlendirebilmesini sağlayan bir kaynak yönetim modülü geliştirildi.
- claim: Selected among the 20 most successful of more than 800 projects at the AI Action Summit in Paris.
  url: https://www.forbes.com.tr/yapay-zeka/koc-holding-in-yangin-tahmin-projesi-akdeniz-e-ornek-oldu
  fetched: 2026-11-03
  quote: 800’den fazla girişim arasında en başarılı 20 projeden biri seçildi
- claim: Koç Holding says the model uses more than 400 variables from 14 datasets and produces dynamic
    fire risk maps.
  url: https://www.koc.com.tr/medya-merkezi/haberler/2023/koc-holding-orman-yanginlariyla-mucadele-projesiyle-davos-zirvesine-damga-vurdu
  fetched: 2026-11-03
  quote: FireAId’de 14 farklı veri seti içinden 400’den fazla değişkenin kullanıldığını belirten Levent
    Çakıroğlu
- claim: In January 2023 the pilot covered 44,000 square kilometres in the southern Aegean and western
    Mediterranean, and Koç Holding said work had begun to extend it to all regions of Türkiye.
  url: https://www.koc.com.tr/medya-merkezi/haberler/2023/koc-holding-orman-yanginlariyla-mucadele-projesiyle-davos-zirvesine-damga-vurdu
  fetched: 2026-11-03
  quote: Ülkemizin Güney Ege ve Batı Akdeniz bölgelerinde 44.000 kilometrekarelik bir alanı kapsayan pilot
    uygulamamızı Orman Genel Müdürlüğümüzün de görüşleriyle Türkiye'nin tüm bölgelerine genişletmek üzere
    çalışmalarımıza başladık.
- claim: In September 2024, an OGM official told the ministry's magazine that the model used all fires
    since 1975 and meteorological data and was working across Türkiye.
  url: https://www.turktarim.gov.tr/Haber/1125/yuksek-teknoloji-ve-yapay-zeka-ile-orman-yanginlarina-en-dogru-mudahale-yapiliyor
  fetched: 2026-11-03
  quote: Buralardaki pilot çalışmadan sonra gerekli düzeltmeler yapıldı ve şu anda tüm Türkiye’de bu proje
    çalışıyor.
- claim: Shown by the World Economic Forum as an example at the 2023 Davos meeting, in a report on the
    FireAId pilot.
  url: https://www.koc.com.tr/medya-merkezi/haberler/2023/koc-holding-orman-yanginlariyla-mucadele-projesiyle-davos-zirvesine-damga-vurdu
  fetched: 2026-11-03
  quote: Koç Holding’in öncülük ettiği “FireAId” projesi, Dünya Ekonomik Forumu (WEF) tarafından Davos
    Zirvesi’nde örnek uygulama olarak gösterildi.
