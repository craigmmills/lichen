summary: Local arm of the Global Coral Reef Monitoring Network, launched in June 2003 by the Caribbean
  Coastal Data Centre and run by UWI Mona's Centre for Marine Sciences.
facts:
- claim: Launched on 27 June 2003 by the Caribbean Coastal Data Centre as the local arm of the Global
    Coral Reef Monitoring Network.
  url: https://www.mona.uwi.edu/cms/research-activities/jcrmn
  fetched: 2026-11-09
  quote: On June 27, 2003, the local arm of GCRMN, Jamaica Coral Reef Monitoring Network (JCRMN) was launched
    by the CCDC.
- claim: Aims to coordinate monitoring of coral reefs and associated ecosystems in Jamaica and improve
    the availability of data on the status of coral reefs.
  url: https://www.mona.uwi.edu/cms/research-activities/jcrmn
  fetched: 2026-11-09
  quote: The aim of the JCRMN is to coordinate the monitoring of coral reefs and associated ecosystems
    in Jamaica and to improve the availability of data and information on the status of coral reefs.
- claim: Its members are agencies, institutions, organisations and individuals involved in coral reef
    monitoring, research or management, and it has had funding for training and monitoring in Jamaica,
    Haiti and the Turks and Caicos Islands.
  url: https://www.mona.uwi.edu/cms/research-activities/jcrmn
  fetched: 2026-11-09
  quote: Since its inception the JCRMN has acquired funding to conduct training and monitoring at sites
    around Jamaica as well as in Haiti and the Turks and Caicos Islands.
- claim: Surveys reefs across Jamaica using Reef Check, at 14 locations in 2008.
  url: https://www.mona.uwi.edu/cms/about
  fetched: 2026-11-09
  quote: where reefs across the island are methodically surveyed (14 locations in 2008) by the Jamaica
    Coral Reef Monitoring Network (JCRMN) coordinated in the CMS
