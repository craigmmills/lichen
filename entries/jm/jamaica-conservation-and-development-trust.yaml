  quote: The Natural Resources Conservation Authority has delegated management of the Blue and John Crow
    Mountains National Park (BJCMNP) to the Jamaica Conservation and Development Trust (JCDT).
- claim: The park's monitoring programme aims to monitor the Giant Swallowtail Butterfly, the Jamaican
    Coney and the Yellow Boa.
  url: https://www.blueandjohncrowmountains.org/?p=162
  fetched: 2026-11-09
  quote: To monitor the populations of key, threatened species – the Giant Swallowtail Butterfly, the
    Jamaican Coney and the Yellow Boa.
- claim: The park's pages say streams are monitored for temperature, turbidity, oxygen and macro-invertebrates
    at 12 sites.
  url: https://www.blueandjohncrowmountains.org/?p=162
  fetched: 2026-11-09
