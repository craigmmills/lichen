- claim: Jamaica's 2023 report to ICRI says the index is now measured every three
    years at 20 sites, and was measured yearly before 2023.
  url: https://icriforum.org/wp-content/uploads/2023/09/ICRIGM37-Members_Report-Jamaica.pdf
