- claim: Its botany department monitors the populations of several critically endangered species through
    fieldwork supported by The Red List Project.
  url: https://nhmj-ioj.org.jm/ongoing-projects/
  fetched: 2026-11-09
  quote: Through fieldwork supported by The Red List Project (TRLP) the department is monitoring the population
