summary: Lead government agency for environmental protection, land use and spatial planning, which the
  Jamaica Observer reports received monitoring equipment under the Hills to Ocean project.
facts:
- claim: Responsible, as NEPA/NRCA, for managing eleven protected areas declared under the NRCA Act and
    the Wild Life Protection Act.
  url: https://www.nepa.gov.jm/node/1309
  fetched: 2026-11-09
  quote: The National Environment and Planning Agency/NRCA is responsible for the management of eleven
    protected areas declared/designated under the NRCA Act and Wild Life Protection Act.
- claim: Gives its address as 10 and 11 Caledonia Avenue, Kingston 5.
  url: https://www.nepa.gov.jm/node/1309
  fetched: 2026-11-09
  quote: 10 and 11 Caledonia Avenue
- claim: The Jamaica Observer reports NEPA was supplied with marine and terrestrial monitoring equipment,
    including data loggers and GPS units, under the Hills to Ocean project.
  url: https://www.jamaicaobserver.com/2026/06/12/jamaican-path-hills-ocean-project-benefits-wetland-coastal-ecosystems-says-nepa/
  fetched: 2026-11-09
  quote: The equipment will enhance NEPA’s ability to conduct marine and terrestrial ecosystem monitoring,
    data collection and analysis
- claim: The lead government agency for environmental protection, natural resource management, land use
    and spatial planning in Jamaica.
  url: https://www.nepa.gov.jm/agency-profile
  fetched: 2026-11-09
  quote: NEPA is the lead government agency with the mandate for environmental protection, natural resource
    management, land use and spatial planning in Jamaica.
- claim: An executive agency of the Ministry of Economic Growth and Infrastructure Development, operational
    since 1 April 2001.
  url: https://www.nepa.gov.jm/agency-profile
  fetched: 2026-11-09
  quote: The National Environment and Planning Agency (NEPA) is an Executive Agency of the Ministry of
    Economic Growth and Infrastructure Development. The Agency became operational on April 1, 2001
- claim: Its core functions include management of species, habitats and ecosystems and of protected, watershed,
    coastal and marine areas.
  url: https://www.nepa.gov.jm/agency-profile
  fetched: 2026-11-09
  quote: Management of species, habitats, and ecosystems; protected, watershed, coastal and marine areas
    management; wild fauna and flora protection, rescue and relocation.
- claim: Its address is 10 and 11 Caledonia Avenue, Kingston 5, Jamaica.
  url: https://www.nepa.gov.jm/agency-profile
  fetched: 2026-11-09
  quote: 10 and 11 Caledonia Avenue
