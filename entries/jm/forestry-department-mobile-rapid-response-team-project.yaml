summary: Closed 2024 project, led by Jamaica's Forestry Department and funded by BIOPAMA
  with a 99,927.30 euro grant, that planned a small ranger team and drone training
  for enforcement around Mount Diablo, St Ann.
facts:
- claim: The project fiche gives a duration of 15 January to 15 December 2024 and
    a small technical grant of 99,927.30 euros.
  url: https://forestry.gov.jm/resourcedocs/BioPama__Project_Fiche__Forestry_Department_Jamaica.pdf
  fetched: 2026-11-12
  quote: Small Technical Grant| 99,927.30 €
- claim: The project fiche identified Mount Diablo and its environs in St Ann as the
    target area.
  url: https://forestry.gov.jm/resourcedocs/BioPama__Project_Fiche__Forestry_Department_Jamaica.pdf
  fetched: 2026-11-12
  quote: Mount Diablo and its environs, St Ann
- claim: The project sought to pilot a dedicated team of two to four forest rangers
    to address gaps in patrol planning.
  url: https://forestry.gov.jm/resourcedocs/BioPama__Project_Fiche__Forestry_Department_Jamaica.pdf
  fetched: 2026-11-12
  quote: The project seeks to pilot an approach that will allow for a dedicated team
    of forest rangers (between two to four)
- claim: Its planned activities included UAV and drone operation training.
  url: https://forestry.gov.jm/resourcedocs/BioPama__Project_Fiche__Forestry_Department_Jamaica.pdf
