facts:
- claim: The Jamaica Observer reports NEPA's statement on the completion of the six-year project.
  url: https://www.jamaicaobserver.com/2026/06/12/jamaican-path-hills-ocean-project-benefits-wetland-coastal-ecosystems-says-nepa/
  fetched: 2026-11-09
  quote: In a statement on Friday, the National Environment and Planning Agency (NEPA) highlighted the
    completion of the six-year “A Jamaican Path from Hills to Ocean” project
- claim: Its seagrass study combined drone and satellite imagery with field validation and geospatial
    modelling to map seagrass beds.
  url: https://www.jamaicaobserver.com/2026/06/12/jamaican-path-hills-ocean-project-benefits-wetland-coastal-ecosystems-says-nepa/
  fetched: 2026-11-09
  quote: The study combined high-resolution drone and satellite imagery with detailed field validation,
    water quality analysis, and geospatial modelling to produce accurate maps and baseline data
- claim: UWI Department of Life Sciences scientists carried out a rapid ecological assessment of three
    watershed management units in its first phase.
  url: https://www.pioj.gov.jm/j1billion-eu-goj-hills-to-ocean-project-seeks-to-reverse-loss-within-three-watersheds-and-more/
