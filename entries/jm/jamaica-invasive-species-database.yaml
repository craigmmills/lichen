summary: Database launched on 14 October 2015, described then as the island's first
  comprehensive portal of its kind, covering how invasive species arrived, where they
  were and how far they had spread.
facts:
- claim: Launched in October 2015 as the Jamaica Invasive Species Database, described
    at the time as the first comprehensive portal of its kind in the island.
  url: https://jis.gov.jm/jamaica-invasive-species-database-launched/
  fetched: 2026-11-12
  quote: 'The database, which can be found at: http://apps.licj.org.jm/jamaica-invasives/,
    is the first comprehensive portal of its kind in the island.'
- claim: At its October 2015 launch, the database provided information on how alien
    invasive species reached the island, where they were and the extent of their invasion.
  url: https://jis.gov.jm/jamaica-invasive-species-database-launched/
  fetched: 2026-11-12
  quote: the database provides crucial information on how alien invasive species are
    brought into the island, where they are located, the extent of their invasion,
    among other things
- claim: It was launched on 14 October 2015 at the Courtleigh Hotel in New Kingston,
    with a senior research officer of the Jamaica Clearing House Mechanism at the
    Institute of Jamaica presenting it.
  url: https://jis.gov.jm/jamaica-invasive-species-database-launched/
  fetched: 2026-11-12
  quote: Occasion was the launch of the database at the Courtleigh Hotel in New Kingston
    on October 14.
- claim: The Jamaica Information Service article on the launch is dated 19 October
    2015.
  url: https://jis.gov.jm/jamaica-invasive-species-database-launched/
  fetched: 2026-11-12
  quote: 'By: Chris Patterson , October 19, 2015'
