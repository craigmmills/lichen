summary: Neural network for telling zooplankton species apart in water-sample images,
  published on GitHub under Apache 2.0; Yandex Cloud said in 2022 it worked with 70
  plankton forms.
facts:
- claim: Published on GitHub under the Apache 2.0 licence.
  url: https://yandex.cloud/ru/blog/posts/2022/12/baikal-ecosystem
  quote: Алгоритм опубликован на GitHub по открытой лицензии Apache 2.0.
  fetched: '2026-10-31'
- claim: In December 2022, Yandex Cloud said the algorithm worked with 70 forms of
    plankton.
  url: https://yandex.cloud/ru/blog/posts/2022/12/baikal-ecosystem
  quote: Сейчас алгоритм умеет работать с 70 формами планктона
  fetched: '2026-10-31'
- claim: Described as a neural network developed for Point No. 1.
  url: https://yandex.cloud/ru/blog/posts/2022/12/baikal-ecosystem
  quote: Изначально нейросеть разрабатывалась для проекта «Точка № 1»
  ai_type: deep-learning
  fetched: '2026-10-31'
- claim: In September 2022, Yandex Cloud said the network analysed images of water
    samples and worked with 70 forms of plankton most often found in the samples.
  url: https://yandex.cloud/ru/blog/posts/2022/09/neural-network-baikal-monitoring
  fetched: '2026-10-31'
  quote: Уже сейчас нейросеть умеет работать с 70 формами планктона, которые чаще
    всего встречаются в пробах.
- claim: Yandex Cloud names a neural network trained to tell zooplankton species apart.
  url: https://yandex.cloud/ru/special/baikal/
  fetched: '2026-10-31'
  quote: В сервисе Yandex DataSphere обучили нейросеть различать виды байкальского
    зоопланктона.
  ai_type: deep-learning
- claim: In September 2022, Snob reported that the programme could work with 70 forms
    of plankton most often found in the samples, citing the company press service.
  url: https://snob.ru/news/nejroset-pomozhet-uchenym-kontrolirovat-kachestvo-vody-bajkala/
  fetched: '2026-10-31'
  quote: программа уже может работать с 70 формами планктона
