summary: A funder that gave grant support to the photo-monitoring project, and which RAPSI
  reported accepted 2027 grant applications until 30 September 2026 for biodiversity study,
  conservation or monitoring projects.
facts:
- claim: Gave grant support to the photo-monitoring project.
  url: https://sev-in.ru/en/node/4435
  quote: has received grant support from the Presidential Fund for Nature and has begun operations
  fetched: '2026-10-31'
- claim: RAPSI reported that its 2027 grant competition accepted applications from protected-area
    management bodies, NGOs and teams of ecologists and biologists until 30 September 2026.
  url: https://www.rapsinews.ru/incident_news/20260902/312156340.html
  fetched: 2026-10-31
  quote: Стартовал прием заявок на конкурс Президентского фонда природы 2027 года
- claim: RAPSI reports that projects must relate to the study, conservation or monitoring
    of biological diversity.
  url: https://www.rapsinews.ru/incident_news/20260902/312156340.html
  fetched: 2026-10-31
  quote: Тематики подаваемых проектов на получение гранта должны быть связаны с изучением,
    сохранением, мониторингом биологического разнообразия
- claim: Kommersant reports that the fund will start a project to create a single digital
    environment for staff of bodies managing protected areas.
  url: https://www.kommersant.ru/doc/8907146
  fetched: 2026-10-31
  quote: Президентский фонд природы даст старт проекту по созданию единой цифровой среды для
    сотрудников организаций, управляющих особо охраняемыми природными территориями
- claim: NIA Ecology reports that the fund organised a session on digital solutions for nature
    at COP17.
  url: https://nia.eco/2026/10/29/148569/
