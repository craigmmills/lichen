- claim: Kommersant reports that CLS plans to stop serving Russian organisations and passing data through
    Argos in the country from 1 November 2026.
  url: https://www.kommersant.ru/doc/9038410
  fetched: 2026-10-31
  quote: С 1 ноября 2026 года французская компания CLS планирует полностью прекратить обслуживание российских
    организаций
- claim: www1.ru reports the agreement.
  url: https://www1.ru/en/news/2026/10/19/francuzskaia-argos-uxodit-iz-rossii-sledit-za-nerpoi-i-drugimi-krasnokniznymi-zivotnymi-stanet-necem.html
  fetched: '2026-10-31'
  quote: On October 15, the Lake Baikal Foundation and the Agency for Strategic Initiatives
    agreed to develop Russia's own national system for satellite monitoring of animals.
- claim: www1.ru gives the cause.
  url: https://www1.ru/en/news/2026/10/19/francuzskaia-argos-uxodit-iz-rossii-sledit-za-nerpoi-i-drugimi-krasnokniznymi-zivotnymi-stanet-necem.html
