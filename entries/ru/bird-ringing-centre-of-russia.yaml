summary: Department of the Severtsov Institute that coordinates bird ringing in Russia,
  collects migration data, and relies on a ring recovery database of more than 130,000
  records.
facts:
- claim: The institute's page says the centre coordinates bird ringing in Russia and
    collects and processes bird migration data.
  url: https://sev-in.ru/en/bird-ringing-and-scientificinformation-cente
  fetched: '2026-11-09'
  quote: The Bird Ringing Center of Russia (BRC) is the main institution in Russia
    which collects and processes bird migration data. The BRC coordinates bird rinding
    in Russia, where more than 100,000 birds are ringed annually.
- claim: Its work rests on a database of ring recoveries with more than 130,000 records.
  url: https://sev-in.ru/en/bird-ringing-and-scientificinformation-cente
  fetched: '2026-11-09'
  quote: The foundation for this work is a database of ring recoveries containing
    more than 130,000 records of banded birds.
- claim: In parts of the Russian Arctic its staff monitor waterfowl using ultralight
    aircraft and remote tracking of marked birds.
  url: https://sev-in.ru/en/bird-ringing-and-scientificinformation-cente
  fetched: '2026-11-09'
  quote: waterfowl resources are monitored using ultralight aircraft, remote tracking
    of marked birds and collection of data for various GIS purposes
- claim: It moved to the institute in 1970 and became a separate department in 1984;
    the institute is at Leninsky Prospect 33, Moscow.
  url: https://sev-in.ru/en/bird-ringing-and-scientificinformation-cente
  fetched: '2026-11-09'
  quote: It was moved to the Institute of Animal Ecology and Evolution of the Academy
    of Sciences of the USSR in 1970 and became a separate department in 1984.
