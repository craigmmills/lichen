  fetched: '2026-10-31'
- claim: In September 2022, Yandex Cloud named it among the developers of the Baikal plankton
    network.
  url: https://yandex.cloud/ru/blog/posts/2022/09/neural-network-baikal-monitoring
  fetched: '2026-10-31'
  quote: Вместе с учёными НИИ биологии Иркутского государственного университета нейросеть
