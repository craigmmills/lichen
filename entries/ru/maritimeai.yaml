facts:
- claim: In June 2021, Interfax described it as a developer of AI models for ship control.
  url: https://www.interfax.ru/russia/773314
  quote: разработчики моделей искусственного интеллекта для управления судами Maritime AI
  fetched: '2026-10-31'
- claim: In December 2022, Yandex Cloud said it took part in making the Lake Baikal technology.
  url: https://yandex.cloud/ru/blog/posts/2022/12/baikal-ecosystem
  quote: В создании технологии также участвовали компания MaritimeAI и Фонд поддержки прикладных
