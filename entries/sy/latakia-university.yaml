summary: University whose staff published 2025 and 2026 papers on burned forest mapping,
  vegetation cover and Syrian shelf chlorophyll-a from satellite data, estimating
  about 8,230.74 hectares of forest burned in the Lattakia region.
facts:
- claim: A 2025 paper in the university's biological sciences journal, by an assistant
    professor in its Faculty of Agricultural Engineering, maps burned forest sites
    in the Lattakia region from Landsat images and spectral indices.
  url: https://journal.latakia-univ.edu.sy/index.php/biosc/article/download/19934/14819/97071
  fetched: 2026-11-14
  quote: Assistant Professor - Faculty of Agricultural Engineering- Lattakia University(formerly
    Tishreen) -
- claim: The 2025 paper uses Landsat image archives and spectral indices to evaluate
    burned forest sites.
  url: https://journal.latakia-univ.edu.sy/index.php/biosc/article/download/19934/14819/97071
  fetched: 2026-11-14
  quote: evaluate the dynamics of burned forest sites and the severity of disturba
    nce caused by fires
- claim: The paper estimates that about 8,230.74 hectares of forest burned in the
    Lattakia region over the period it studied.
  url: https://journal.latakia-univ.edu.sy/index.php/biosc/article/download/19934/14819/97071
  fetched: 2026-11-14
  quote: during the period under study, approximately 8,230.74 hectare s of forest
    area were burned
- claim: A 2026 paper by an associate professor in the Faculty of Agricultural Engineering
    tracks vegetation cover in the Al-Haffah region from 2023 to 2025 with NDVI and
    EVI.
  url: https://journal.latakia-univ.edu.sy/index.php/biosc/en/article/download/21809/15308/100052
  fetched: 2026-11-14
  quote: Associate Professor, Faculty of Agricultural Engineering, Latakia University(formerly
    Tishreen),
- claim: The 2026 Al-Haffah paper reports that, based on NDVI, barren land increased
    from 17% of the study area in 2023 to 30% in November 2025.
  url: https://journal.latakia-univ.edu.sy/index.php/biosc/en/article/download/21809/15308/100052
  fetched: 2026-11-14
  quote: 'Based on NDVI, barren land increased from 17% of the total

    study area in 2023 to 30% in November 2025.'
- claim: A 2026 satellite-based analysis of chlorophyll-a across the Syrian continental
    shelf lists its first author at the university's Faculty of Surveying and Geomatic
    Engineering and its High Institute of Marine Research.
  url: https://api.openalex.org/works/W7211885154?select=id,title,publication_year,doi,authorships
  fetched: 2026-11-14
  quote: Spatially non-stationary drivers and clustering of chlorophyll-a across the
    Syrian continental shelf
- claim: The first author's affiliations include the High Institute of Marine Research
    at the university.
  url: https://api.openalex.org/works/W7211885154?select=id,title,publication_year,doi,authorships
  fetched: 2026-11-14
  quote: High Institute of Marine Research, Latakia University (formerly Tishreen
    University), Latakia, Syria
- claim: The university's Higher Institute for Marine Research was established at
    the university by a legislative decree in 2000.
  url: https://latakia-univ.edu.sy/en/Faculty/Index/4259
  fetched: 2026-11-14
  quote: In 2000, the legislative decree No. 426/ was issued to establish the Higher
    Institute for Marine Research at Latakia University.
