summary: Damascus-based NGO that says it conserves Syrian biodiversity, and in February 2021 reported
  wintering bird surveys, migratory soaring bird counts and data updates for accessible Important Bird
  Areas.
facts:
- claim: Describes itself as an NGO concerned with conserving the biodiversity of Syrian ecosystems.
  url: https://osme.org/2021/02/conservation-is-syria-is-thriving/
  fetched: 2026-11-12
  quote: The Syrian Society for the Conservation of Wildlife (SSCW) is a Non-Governmental Organization
    (NGO), concerned with the conservation of biodiversity of Syrian ecosystems and their components
- claim: In its February 2021 guest blog, SSCW said it concentrated birdwatching at Al-Jabboul to maintain
    an annual survey of wintering birds.
  url: https://osme.org/2021/02/conservation-is-syria-is-thriving/
  fetched: 2026-11-12
  quote: SSCW has concentrated this activity on the Jabboul area to maintain a constant annual survey
    for the birds over the wintering season
- claim: In its February 2021 guest blog, SSCW said its team was organising counts of soaring migratory
    birds, especially to record Egyptian Vulture movements.
  url: https://osme.org/2021/02/conservation-is-syria-is-thriving/
  fetched: 2026-11-12
  quote: the SSCW team is organising counts on the soaring birds on migratory route especially to record
    the movements of the Endangered Egyptian Vulture
- claim: In its February 2021 guest blog, SSCW said it was updating data for some national Important Bird
    Areas still accessible to its members for monitoring and surveys.
  url: https://osme.org/2021/02/conservation-is-syria-is-thriving/
  fetched: 2026-11-12
  quote: the SSCW continues its work to update the data of some of the national IBAs that are still accessible
    by SSCW members for the monitoring and surveys
