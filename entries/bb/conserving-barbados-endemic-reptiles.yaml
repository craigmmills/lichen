name: Conserving Barbados' Endemic Reptiles
also_known_as:
- CBER
- Reducing the threats to endangered reptiles from habitat loss and Invasive Alien Species (IAS) through
  enhanced biodiversity governance and strengthened bio-security in Barbados
scope: bb
ai_label: conservation-tech
realms:
