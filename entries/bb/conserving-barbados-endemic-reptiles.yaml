status: active
summary: Reptile project funded by GEF, with UNEP and CAB International as partners; a 2025 excerpt says
  searches of 20 sites in 2024 and early 2025 found only invasive blindsnakes.
facts:
- claim: In April 2024, the Biodiversity Conservation and Management Section announced GEF funding for
    the project and thanked UNEP and CAB International for helping develop it; the page calls CAB International
    the Centre for Agriculture and Bioscience International.
  url: https://biodiversity.gov.bb/conserving-barbados-endemic-reptiles/
  fetched: 2026-11-12
  quote: The Section would like to thank its partners, the United Nations Environment Programme (UNEP)
    and the Centre for Agriculture and Bioscience International (CAB International), for their dedication
    in assisting the development of this project.
- claim: A September 2025 linked-article excerpt in the page’s comments says the Section searched 20 sites
    under the project in 2024 and early 2025, finding only invasive Brahminy blindsnakes.
  url: https://biodiversity.gov.bb/conserving-barbados-endemic-reptiles/
  fetched: 2026-11-12
  quote: Biodiversity Conservation and Management Section had searched across 20 sites under the GEF-funded
    Conserving Barbados’ Endemic Reptiles (CBER) project throughout 2024 and early 2025, finding only
    invasive Brahminy blindsnakes.
