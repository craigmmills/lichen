  quote: The Barbados National Wetland Inventory was completed in March 2023 and categorises
    the primary, secondary and tertiary wetlands of the island.
- claim: The page says the inventory reports on biodiversity, geomorphology, threats,
    water regimes and ecosystem services, with a focus on Long Pond, Green Pond, Graeme
    Hall and Chancery Lane.
  url: https://biodiversity.gov.bb/national-wetlands-inventory/
