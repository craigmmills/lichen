    the Folkstone Park and Marine Reserve.
- claim: CERMES’s Folkestone project page, for a project starting in February 2006, describes Folkestone
    Marine Park as the island’s only legislated marine protected area.
  url: https://www.cavehill.uwi.edu/cermes/?p=288
  fetched: 2026-11-12
  quote: It is the only legislated marine protected area on the island.
