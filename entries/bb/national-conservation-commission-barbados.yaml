    Water Resources & Drainage, directed by a Board of Management.
  url: https://biodiversity.gov.bb/ministry/national-conservation-commission/
  fetched: 2026-11-12
  quote: The NCC a department of the Ministry of Environment, Water Resources & Drainage, has as its directorship,
    a Board of Management.
- claim: The page lists a ranger and warden service and the park and marine reserve it spells “Folkstone”
    among the NCC’s operations.
  url: https://biodiversity.gov.bb/ministry/national-conservation-commission/
  fetched: 2026-11-12
