facts:
- claim: The UN listing identifies CORALL as a non-governmental organisation and GEF SGP as a partner
    in a coral restoration project completed in August 2022.
  url: https://sdgs.un.org/partnerships/engaging-community-and-building-capacity-coral-reef-restoration-west-coast-reefs
  fetched: 2026-11-12
  quote: Coral Reef Restoration Alliance (Non-governmental organizations); GEF SGP (UN)
- claim: The UN listing dates the completed project’s final component, monitoring all coral restoration
    sites using a science-based approach, to April 2022.
  url: https://sdgs.un.org/partnerships/engaging-community-and-building-capacity-coral-reef-restoration-west-coast-reefs
  fetched: 2026-11-12
  quote: The final component focused on the use of a science-based approach to monitor all coral restoration
    sites.
- claim: The GEF SGP says CORALL set up a coral nursery at Vauxhall in the Folkestone Marine Reserve and
    two restoration sites in 2018.
  url: https://sgp.undp.org/resources-155/our-stories/726-in-living-colour-local-action-for-coral-reef-restoration-in-barbados.html
  fetched: 2026-11-12
  quote: CORALL established a coral nursery at Vauxhall within the Folkestone Marine Reserve, and two
    coral restoration sites on the west coast of Barbados at Port St Charles and Driftwood in 2018.
