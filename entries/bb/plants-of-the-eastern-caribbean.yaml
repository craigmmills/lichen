summary: An online plant database and virtual herbarium maintained by the University
  of the West Indies, with specimens still being scanned and the database updated
  by a senior technician, per a December 2025 department page.
facts:
- claim: The Barbados biodiversity clearing-house site lists it as an external database
    maintained by the University of the West Indies, citing Broome, Sabir and Carrington
    (2007).
  url: https://biodiversity.gov.bb/resources/chm/plants-of-the-eastern-caribbean/
  fetched: 2026-11-13
  quote: Plants of the Eastern Caribbean is an external database maintained by the
    University of the West Indies.
- claim: The Cave Hill Department of Biological and Chemical Sciences says the online
    database was initiated by a professor of plant biology at the campus.
  url: https://www2.cavehill.uwi.edu/fst/bcs/projects/barbados-sea-turtle-project.aspx
  fetched: 2026-11-13
  quote: The Plants of the Eastern Caribbean online database was initiated by Sean
    Carrington, Professor of Plant Biology at the Cave Hill Campus.
- claim: The department's project page (modified December 2025) says a senior technician
    has continued updating the database and scanning specimens for the virtual herbarium,
    and that a UWI computer science graduate constructed the database and website.
  url: https://www.cavehill.uwi.edu/fst-bcs/wp-json/wp/v2/pages/47
  fetched: 2026-11-13
  quote: Damian Greaves, Senior Technician, has continued with updating the database
    and scanning of specimens for the virtual herbarium.
