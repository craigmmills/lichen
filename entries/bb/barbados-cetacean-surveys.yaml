summary: Barbados Today reports visual and acoustic whale and dolphin surveys for
  the Marine Spatial Plan in February, March and November 2025, with the team intending
  to continue them.
facts:
- claim: Barbados Today reports that the surveys were conducted in February and March
    2025 and again in November 2025 as part of the Barbados Marine Spatial Plan, contributing
    to the Caribbean Cetacean Society's Ti Whale An Nou programme.
  url: https://barbadostoday.bb/2025/11/12/barbados-may-host-resident-bottlenose-dolphins/amp
  fetched: 2026-11-15
  quote: The surveys were conducted in February and March and again earlier this month
    as part of the Barbados Marine Spatial Plan
- claim: The missions combined visual observations with underwater acoustic monitoring
    of whale and dolphin diversity, abundance and distribution.
  url: https://barbadostoday.bb/2025/11/12/barbados-may-host-resident-bottlenose-dolphins/amp
  fetched: 2026-11-15
  quote: The missions combined visual observations with underwater acoustic monitoring
    to document whale and dolphin diversity, abundance, and distribution
- claim: The project team intends to continue the surveys.
  url: https://barbadostoday.bb/2025/11/12/barbados-may-host-resident-bottlenose-dolphins/amp
  fetched: 2026-11-15
  quote: The project team intends to continue surveys to gather more detailed information
    about the dolphins’ numbers, distribution, and behaviour.
- claim: Blue Marine Foundation says it supported a research expedition led by the
    Caribbean Cetacean Society, using photo ID and acoustic monitoring, with results
    to support the marine spatial planning process.
  url: https://www.bluemarinefoundation.com/?p=16605
  fetched: 2026-11-15
  quote: Blue Marine recently supported a research expedition led by our local partner,
    the Caribbean Cetacean Society.
- claim: The Barbados Marine Spatial Plan's newsletter (Issue 3) reports the cetacean
    survey, with early results supported by the Caribbean Cetacean Society's Ti Whale
    An Nou programme.
  url: https://barbadosmarinespatialplan.com/wp-content/uploads/2025/12/BluePrint_Newsletter_Issue_3.pdf
  fetched: 2026-11-15
  quote: Cetacean Society’s “Ti Whale An Nou” programme, recorded frequent sightings
