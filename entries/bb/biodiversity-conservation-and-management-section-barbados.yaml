summary: A section of the Ministry of Environment and National Beautification that
  leads the government's biodiversity programme and, under the GEF CBER project, surveyed
  gullies and wetlands for the Critically Endangered Barbados threadsnake, with eDNA
  follow-up under way in November 2024.
facts:
- claim: The ministry's biodiversity site says the section initiated field surveys
    under the GEF project Conserving Barbados' Endemic Reptiles (CBER).
  url: https://biodiversity.gov.bb/biodiversity-conservation-and-management-section-summer-internships-under-the-cber-project/
  fetched: 2026-11-13
  quote: The Biodiversity Conservation and Management Section has initiated field
    surveys under the Global Environment Facility (GEF) project
- claim: The page says the section's surveys searched forested gullies and wetlands
    for the Critically Endangered Barbados threadsnake.
  url: https://biodiversity.gov.bb/biodiversity-conservation-and-management-section-summer-internships-under-the-cber-project/
  fetched: 2026-11-13
  quote: the Section accepted four interns who assisted surveys into forested gullies
    and wetlands in search of the Critically Endangered and endemic Barbados threadsnake
- claim: The page, posted on 12 November 2024, says follow-up surveys to collect soil
    samples for eDNA analyses were under way.
  url: https://biodiversity.gov.bb/biodiversity-conservation-and-management-section-summer-internships-under-the-cber-project/
  fetched: 2026-11-13
  quote: Follow up surveys to collect soil samples for eDNA analyses are currently
    underway to hopefully detect the rare and cryptic Barbados threadsnake through
    molecular means.
- claim: The CBER project's GEF CEO endorsement document, posted on the ministry's
    biodiversity site, describes the section as part of the Ministry of Environment
    and National Beautification and as leading the government's Biodiversity Conservation
    and Management Programme.
  url: https://biodiversity.gov.bb/wp-content/uploads/2024/04/06c95450-79ac-ec11-983f-000d3a59eabd_CEOEndorsement.pdf
  fetched: 2026-11-13
  quote: the Biodiversity Conservation and Management Section of the Ministry of Environment
    and National
