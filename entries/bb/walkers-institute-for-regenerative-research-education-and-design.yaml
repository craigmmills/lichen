facts:
- claim: The Cable & Wireless press release of May 2019 describes WIRRED as a local
    non-profit organisation.
  url: https://cwc.com/news-and-media/press-releases/barbados-ecosystem-gets-us$100k-boost-from-flow.html
  fetched: 2026-11-13
  quote: a local non-profit organization that focuses on improving communities and
    the natural environment
- claim: The Barbados Environmental Conservation Trust's grant page names WIRRED,
    as an incorporated body, as running the Long Pond Wetland Restoration Project.
  url: https://barbadosenvironment.org/grants/long-pond-wetland-restoration-project/
  fetched: 2026-11-13
  quote: The Walkers Institute for Regeneration Research Education and Design Inc.
    (WIRRED) Long Pond Wetland Restoration Project
- claim: The same page says regular water quality monitoring and biodiversity assessments
    track the wetland's health, with probes continuously recording pH and conductivity.
  url: https://barbadosenvironment.org/grants/long-pond-wetland-restoration-project/
  fetched: 2026-11-13
  quote: Regular water quality monitoring and biodiversity assessments have been implemented
    to track the wetland’s health
- claim: A BirdsCaribbean post of November 2022 says the first Motus station on Barbados
    was erected at Walkers Reserve, where WIRRED's Director of Projects toured the
    team round the possible sites; the post does not say who operates the station.
  url: https://www.birdscaribbean.org/2022/11/a-new-adventure-for-a-motus-tracking-trainee-an-eventful-journey-and-a-climbing-lesson-in-barbados/
  fetched: 2026-11-13
  quote: Shae Warren, the Director of Projects at Walkers Institute for Regeneration
    Research Education and Design Inc. (WIRRED) greeted us and gave us a tour of the
    reserve.
