summary: A GEF-funded ministry pilot with Mosaic Eco Consult (June 2021–August 2022)
  reported 75.6% lower nest predation in 2022, possibly following removal of 57 mongooses.
facts:
- claim: The ministry's June 2022 page says the ministry collaborated with a local
    consultancy firm, Mosaic Eco Consult, to undertake the pilot as part of the GEF-funded
    project on invasive alien species in Barbados and the OECS.
  url: https://biodiversity.gov.bb/?p=2519
  fetched: 2026-11-13
  quote: has collaborated with local consultancy firm, Mosaic Eco Consult, to undertake
    a mongoose and rat control pilot programme at Bath Beach, St John.
- claim: The June 2022 page says the first phase used beach patrols to record new
    turtle nests and monitor rat and mongoose activity, and planned to resume nest
    monitoring in phase three after trapping.
  url: https://biodiversity.gov.bb/?p=2519
  fetched: 2026-11-13
  quote: Phase 1 entails beach patrols to record new turtle nests and monitor rat
    and mongoose activity at these nests.
- claim: The final monitoring report page, posted in April 2024, gives the project
    period as June 2021 to August 2022.
  url: https://biodiversity.gov.bb/resources/chm/invasive-predator-control-at-a-selected-hawksbill-nesting-beach-bath-pilot-project-final-monitoring-report/
  fetched: 2026-11-13
  quote: period from June 2021 – August 2022
- claim: The final report page says nest predation fell by 75.6% in 2022, possibly
    because trapping removed 57 mongooses.
  url: https://biodiversity.gov.bb/resources/chm/invasive-predator-control-at-a-selected-hawksbill-nesting-beach-bath-pilot-project-final-monitoring-report/
