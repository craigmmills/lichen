summary: Robot built by Bajan Digital Creations and funded by UNDP, which reports ten public datasets
  from its images in 2020 and a 2024 award of up to US$40,000.
facts:
- claim: In its account of 2020, UNDP says the BlueBOT robot’s underwater images led to classification
    of fish varieties and ten publicly available datasets on species such as Atlantic tang, trumpetfish
    and sergeant majors.
  url: https://www.undp.org/node/492676
  fetched: 2026-11-12
  quote: underwater images gathered by the robot led to the classification of fish varieties and eventual
    creation of 10 publicly available datasets on species such as Atlantic Tang, Trumpet Fish and Sergeant
    Majors.
- claim: UNDP says BlueBOT developed a new version of its software in 2023 to learn from underwater video
    of reef environments.
  url: https://www.undp.org/node/492676
  fetched: 2026-11-12
  quote: BlueBOT developed a new version of software to learn from and give insight into underwater video
    content from reef environments.
- claim: In 2024 BlueBOT was named a winner of the Ocean Innovation Challenge; UNDP said it would receive
    up to US$40,000 in financial support with support from Sweden and Norway.
  url: https://www.undp.org/node/492676
  fetched: 2026-11-12
  quote: With support from Sweden and Norway, BlueBOT will be receiving up to $40,000 USD in financial
    support as well as benefiting from significant mentorship.
