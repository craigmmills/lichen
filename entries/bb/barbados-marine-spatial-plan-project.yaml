summary: An active marine spatial planning process launched by the Coastal Zone Management
  Unit in January 2023, which Barbados Today reported in November 2024 had reached
  about 80 per cent of data collection across 435 marine sites.
facts:
- claim: The CZMU launched the Marine Spatial Planning process on 18 January 2023.
  url: https://coastal.gov.bb/programmes-and-projects/barbados-marine-spatial-plan-project/
  fetched: 2026-11-15
  quote: The Coastal Zone Management Unit (CZMU) launched the Marine Spatial Planning
    process on Wednesday January 18th 2023
- claim: The CZMU page says the MSP process will be branded the Barbados Sustainable
    Oceans Programme.
  url: https://coastal.gov.bb/programmes-and-projects/barbados-marine-spatial-plan-project/
  fetched: 2026-11-15
  quote: which will be branded The Barbados Sustainable Oceans Programme
- claim: Barbados Today reported in November 2024 that the plan had reached about
    80 per cent completion in data collection, covering 435 marine sites around the
    island.
  url: https://barbadostoday.bb/?p=445280
  fetched: 2026-11-15
  quote: has reached some 80 per cent completion in data collection, covering 435
    marine sites around the island
- claim: The plan's Geospatial Programme collects, processes and analyses spatial
    data on marine habitats, fishery zones and coral reefs.
  url: https://barbadosmarinespatialplan.com/ourwork/
  fetched: 2026-11-15
  quote: our team collects, processes, and analyzes spatial data on marine habitats,
    fishery zones, coral reefs, and more
- claim: The plan's Natural Capital Programme combines ecosystem mapping, natural
    capital accounting and economic valuation.
  url: https://barbadosmarinespatialplan.com/ourwork/
  fetched: 2026-11-15
  quote: The Programme combines ecosystem mapping to understand where key habitats
    are located
- claim: Barbados Today reported cetacean surveys in 2025 carried out as part of the
    Barbados Marine Spatial Plan.
  url: https://barbadostoday.bb/2025/11/12/barbados-may-host-resident-bottlenose-dolphins/amp
  fetched: 2026-11-15
  quote: The surveys were conducted in February and March and again earlier this month
    as part of the Barbados Marine Spatial Plan
