facts:
- claim: A centre of The University of the West Indies at Cave Hill, Barbados.
  url: http://www.cavehill.uwi.edu/cermes/home.aspx
  fetched: 2026-11-12
  quote: The Centre for Resource Management and Environmental Studies (CERMES) promotes and facilitates
    sustainable development in the Caribbean and beyond.
- claim: Its director is Professor David Yawson.
  url: http://www.cavehill.uwi.edu/cermes/home.aspx
  fetched: 2026-11-12
  quote: I am Professor David Yawson, and it is my privilege to be of service to you as Director of CERMES
- claim: Publishes a Sub-regional Sargassum Outlook Bulletin with medium-range, three-month, island-scale
    forecasts of sargassum influxes to the Eastern Caribbean.
  url: https://cavehill.uwi.edu/cermes/projects/sargassum/outlook-bulletin.aspx
  fetched: 2026-11-12
  quote: Our Sub-regional Sargassum Outlook Bulletin provides medium-range (3-monthly) island-scale forecasts
    of sargassum influxes to the Eastern Caribbean, based on our validated sargassum transport model from
    the new source region in the equatorial Atlantic.
- claim: Publishes a Sargassum Monitoring Protocol for measuring sargassum abundance with drones, with
    flight plans made in DroneDeploy.
  url: https://www.cavehill.uwi.edu/cermes/research-projects/sargassum/docs/tools/smp_vol_01_drones_june_2022.aspx
  fetched: 2026-11-12
  quote: 'Sargassum Monitoring Protocol: monitoring sargassum abundance using drones.'
