id: ecoland-uzbekistan
kind: project
name: Integrated Conservation Management and Restoration of High-Value Landscapes in Uzbekistan
also_known_as:
- ECOLAND
- EcoLand
scope: uz
ai_label: conservation-tech
realms:
- land
status: active
summary: GEF-funded project implemented by UNDP and the National Committee on Ecology and Climate Change,
  with IUCN as partner, aiming to conserve 881,000 hectares of Key Biodiversity Areas and restore three
  landscapes.
facts:
- claim: Funded by the GEF and implemented by UNDP and the National Committee on Ecology and Climate Change,
    with IUCN as a project partner.
  url: https://www.undp.org/uzbekistan/press-releases/undp-and-uzdavyerloyiha-strengthen-cooperation-sustainable-land-use-planning-and-ecosystem-restoration
  fetched: 2026-11-08
  quote: funded by the Global Environment Facility and implemented by UNDP and the National Committee
    on Ecology and Climate Change of the Republic of Uzbekistan, with the International Union for Conservation
    of Nature (IUCN) as a project partner
- claim: Works on ecosystem restoration across the West Tian Shan, Nuratau and Kugitang landscapes.
  url: https://www.undp.org/uzbekistan/projects/integrated-conservation-management-and-restoration-high-value-landscapes-uzbekistan
  fetched: 2026-11-08
  quote: this project scales innovative, integrated approaches to ecosystem restoration across the West
    Tian Shan, Nuratau, and Kugitang landscapes
- claim: Aims to conserve 881,000 hectares of Key Biodiversity Areas.
  url: https://www.undp.org/uzbekistan/projects/integrated-conservation-management-and-restoration-high-value-landscapes-uzbekistan
  fetched: 2026-11-08
  quote: Conserve 881,000 hectares of Key Biodiversity Areas (KBAs).
- claim: In September 2026 UNDP handed GNSS surveying and GIS equipment to Uzdavyerloyiha for spatial
    data collection and GIS-based land-use planning, as a contribution to the project.
  url: https://www.undp.org/uzbekistan/press-releases/undp-and-uzdavyerloyiha-strengthen-cooperation-sustainable-land-use-planning-and-ecosystem-restoration
  fetched: 2026-11-08
  quote: The handover includes a Global Navigation Satellite System (GNSS) base station and GNSS rover
    receiver
