  quote: '[COMPLETED] Sustainable natural resource and forest management in mountainous areas'
- claim: Its expected results included better knowledge of snow leopard and prey populations.
  url: https://www.undp.org/uzbekistan/projects/sustainable-natural-resource-and-forest-management-key-mountainous-areas-important-globally-significant-biodiversity
  fetched: 2026-11-08
  quote: State of knowledge on snow leopard and prey populations enhanced;
- claim: The project was planned to cover the snow leopard range in Uzbekistan, with most outputs and
    activities focused on the Ugam-Chatkal and Gissar landscapes.
  url: https://www.undp.org/uzbekistan/projects/sustainable-natural-resource-and-forest-management-key-mountainous-areas-important-globally-significant-biodiversity
  fetched: 2026-11-08
  quote: The project will be spatially contained to the snow leopard distribution range in Uzbekistan.
- claim: From 2018 the project collected data on snow leopard distribution and abundance, and in July
    2019 its monitoring group ran a camera-trap survey that recorded at least three snow leopards.
  url: https://www.undp.org/node/131446
  fetched: 2026-11-08
  quote: After analyzing the obtained images of snow leopards, the monitoring team came to the conclusion
    that at least three individuals of snow leopards were captured.
