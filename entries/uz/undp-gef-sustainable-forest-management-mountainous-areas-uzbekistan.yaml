summary: UNDP-listed project completed, running January 2017 to May 2024, planned to cover Uzbekistan's
  snow leopard range, which collected distribution data from 2018 and recorded at least three snow leopards
  in a July 2019 camera-trap survey.
facts:
- claim: UNDP lists the project as completed, running from January 2017 to May 2024.
