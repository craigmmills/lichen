summary: Online geodatabase of flora, fauna, threatened species and biodiversity threats; UNDP reported
  a server installed and demo launched in February 2020, with staff training, and its current status is
  unknown.
facts:
- claim: An online geodatabase for storing and updating data on flora and fauna, threatened and economically
    important species and threats to biodiversity.
  url: https://www.undp.org/uzbekistan/news/introduction-innovative-biodiversity-information-management-system
  fetched: 2026-11-08
  quote: BCIMS is an online resource of the Geo-data base, which allows to include, store and update data
    on flora and fauna, including nationally and globally threatened, as well as economically important
    species of animals and plants and existing threats to biodiversity conservation
- claim: UNDP reported in February 2020 that a server had been installed and a demo version launched.
  url: https://www.undp.org/uzbekistan/news/introduction-innovative-biodiversity-information-management-system
  fetched: 2026-11-08
  quote: a server has been installed and a demo version of the BCIMS has been launched
- claim: UNDP named the international company GeneGIS GI as involved in its development and installation.
  url: https://www.undp.org/uzbekistan/news/biodiversity-conservation-information-management-system-will-be-developed-uzbekistan
  fetched: 2026-11-08
  quote: Currently, the international company GeneGIS GI is involved in the development and installation
    of BCIMS in Uzbekistan
- claim: In February 2020 UNDP reported that training on the system was being held for staff of the State
    Committee for Ecology, the Institute of Botany and Zoology and the State Committee for Land Resources,
    Geodesy, Cartography and State Cadaster.
  url: https://www.undp.org/uzbekistan/news/training-courses-use-biodiversity-information-management-system
  fetched: 2026-11-08
  quote: Courses are held for employees of the State Committee for Ecology, Institute of Botany and Zoology
    of the Academy of Sciences, as well as State Committee for Land Resources, Geodesy, Cartography and
    State Cadaster.
