summary: Platform incorporating forest mapping orthophotos, according to CAREC, with UzDaily reporting
  plans for real-time forest monitoring and a Digital Forestry Center using artificial intelligence.
facts:
- claim: CAREC reported on 4 June 2026, in an article datelined May 2026, that orthophotos from the forest
    boundary mapping were integrated into the platform.
  url: https://carececo.org/en/main/news/historic-achievement-uzbekistan-completes-first-ever-complete-mapping-of-its-forest-boundaries/
  fetched: 2026-11-08
  quote: integrated into the nation's SMART FORESTRY platform.
- claim: UzDaily reported that a Digital Forestry Center, to be set up as a subdivision of the forest
    agency, will be the sole operator of the platform and provide real-time monitoring of forest resources.
  url: https://www.uzdaily.ru/en/a-digital-forestry-center-is-being-established-in-uzbekistan-to-combat-desertification
  fetched: 2026-11-08
  quote: It will serve as the sole operator of the information platform "Smart Forestry," which will provide
    digitalization of forest resource management processes and enable real-time monitoring of their condition.
- claim: UzDaily reported that the planned centre would use technologies including artificial intelligence.
  url: https://www.uzdaily.ru/en/a-digital-forestry-center-is-being-established-in-uzbekistan-to-combat-desertification
  fetched: 2026-11-08
  quote: The Center will facilitate effective forest management through the application of modern technologies,
    including artificial intelligence and integrated information systems
