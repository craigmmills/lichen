summary: US$153 million World Bank-funded restoration project, run by the forest agency, whose forest
  mapping, reported by CAREC in 2026, found forest coverage over 513,000 hectares above earlier records.
facts:
- claim: The project is worth US$153 million, of which US$142 million is an IDA loan, US$8 million a PROGREEN
    Trust Fund grant and US$3 million a Korea World Bank Cooperation Fund grant.
  url: https://gov.uz/en/urmon/sections/view/81549
  fetched: 2026-11-08
  quote: Of these, $142 million is financed by an IDA loan, $8 million is a grant from the PROGREEN Trust
    Fund, and $3 million is a grant from the Korea World Bank Cooperation Fund (KWPF).
- claim: Subcomponent 1.2 is an ICT platform for forest landscape restoration and forest management, including
    the National Forest Monitoring System.
  url: https://gov.uz/en/urmon/sections/view/81549
  fetched: 2026-11-08
  quote: This subcomponent 1.2 constitutes the Information and Communication Technology (ICT) Platform
    for Forest Landscape Restoration (LLC) and Forest Management, including the National Forest Monitoring
    System (NLSMS).
- claim: CAREC reported on 4 June 2026, in an article datelined May 2026, that through the project Uzbekistan
    had mapped and digitised the full boundaries of its forest territories.
  url: https://carececo.org/en/main/news/historic-achievement-uzbekistan-completes-first-ever-complete-mapping-of-its-forest-boundaries/
  fetched: 2026-11-08
  quote: For the first time in its post-independence history, Uzbekistan has successfully mapped and digitized
    the complete boundaries of its forest territories
- claim: The mapping used an aircraft with a high-resolution camera, and the orthophotos were integrated
    into the SMART FORESTRY platform.
  url: https://carececo.org/en/main/news/historic-achievement-uzbekistan-completes-first-ever-complete-mapping-of-its-forest-boundaries/
  fetched: 2026-11-08
  quote: The resulting orthophotoplans—spatially precise digital images—have been processed into an electronic
    format accessible to forest administrators and integrated into the nation's SMART FORESTRY platform.
- claim: CAREC reports that the mapping found actual forest coverage more than 513,000 hectares above
    earlier records.
  url: https://carececo.org/en/main/news/historic-achievement-uzbekistan-completes-first-ever-complete-mapping-of-its-forest-boundaries/
  fetched: 2026-11-08
  quote: Researchers discovered that actual forest coverage exceeds earlier records by more than 513,000
    hectares
