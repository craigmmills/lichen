summary: Uzbek agency covering geodesy, cartography, the state cadastre and real estate registration,
  with subordinate bodies including a Geoinnovation Center; a November 2025 decree moved it to the National
  Committee for Sustainable Development of Urbanization and Housing Market.
facts:
- claim: Its main areas of work are geodesy and cartography, the state cadastre, registration of rights
    to real estate, and state land, cadastral and geodetic control.
  url: https://gov.uz/en/kadastr/pages/about
  fetched: 2026-11-08
  quote: The main areas of activity of the Agency are geodesy and cartography, state cadastre maintenance,
    state registration of rights to real estate, and ensuring state land, cadastral and geodetic control.
- claim: Its subordinate bodies include the Republican Center for Aerogeodesy, the State Cartography and
    Geodesy Fund and a Geoinnovation Center.
  url: https://gov.uz/en/kadastr/pages/about
  fetched: 2026-11-08
  quote: the Republican Center for Aerogeodesy, the State Cartography and Geodesy Fund, the State Scientific
    Production Enterprise "Cartography", "Geoinnovation Center" SE
- claim: A November 2025 decree moved it from the Ministry of Economy and Finance to the National Committee
    for Sustainable Development of Urbanization and Housing Market.
  url: https://gov.uz/en/kadastr/pages/about
  fetched: 2026-11-08
  quote: the organizational subordination of the Cadastre Agency under the Ministry of Economy and Finance
    was changed and transferred to the subordination of the National Committee for Sustainable Development
    of Urbanization and Housing Market.
