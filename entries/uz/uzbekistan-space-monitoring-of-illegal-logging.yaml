summary: Proposed nationwide year-end space monitoring from 2026 would involve Uzbekcosmos
  under a presidential decree, with on-site investigations within five days of receiving
  information about illegal felling.
facts:
- claim: From 2026, illegal logging is to be identified nationwide with space technologies
    at the end of each calendar year, under a presidential decree.
  url: https://kun.uz/en/news/2025/09/30/uzbekistan-to-use-space-monitoring-to-detect-illegal-logging-from-2026
  fetched: 2026-11-12
  quote: According to a presidential decree, from 2026, measures to identify illegal
    logging using space technologies will be conducted nationwide at the end of each
    calendar year
- claim: Uzbekcosmos is to carry out the monitoring with relevant government bodies.
  url: https://kun.uz/en/news/2025/09/30/uzbekistan-to-use-space-monitoring-to-detect-illegal-logging-from-2026
  fetched: 2026-11-12
  quote: Starting next year, the Agency “Uzbekcosmos” will carry out monitoring activities
    together with relevant government bodies.
- claim: Uzbekcosmos reports the same procedure for identifying illegal felling from
    2026.
  url: https://gov.uz/en/uzspace/news/view/90291
  fetched: 2026-11-12
  quote: starting in 2026, illegal tree logging will be identified throughout the
    country at the end of each calendar year using space monitoring capabilities.
- claim: When satellite data show illegal felling, the environment ministry and the
    Forestry Agency are to investigate on site within five days and upload documents
    to the SGM platform.
  url: https://gov.uz/en/uzspace/news/view/90291
  fetched: 2026-11-12
  quote: organize an on-site investigation within five days of receiving the information
    and upload supporting documents to the SGM platform via integration
