summary: Active project that began in summer 2021 to satellite tag Egyptian Vultures
  in Central Asia for the first time; the Hawk Conservancy Trust's page says 16 birds
  have been tagged in Uzbekistan so far.
facts:
- claim: The team set out to satellite tag Egyptian Vultures in Central Asia for the
    first time in summer 2021, to understand the movements and migration of birds
    from Uzbekistan.
  url: https://osme.org/2022/01/satellite-tagging-and-tracking-egyptian-vultures-in-uzbekistan/
  fetched: 2026-11-15
  quote: We identified a need to understand the movements and migration of birds from
    Uzbekistan to better plan for its future in Asia. And with this in mind, we set
    out to satellite tag, for the first time, Egyptian Vultures in Central Asia in
    Summer 2021.
- claim: The tags used were solar-powered Ornitela Ornitrack 30 GSM satellite tags
    recording GPS fixes sent over the mobile network.
  url: https://osme.org/2022/01/satellite-tagging-and-tracking-egyptian-vultures-in-uzbekistan/
  fetched: 2026-11-15
  quote: Ornitela Ornitrack 30 GSM satellite tags (Fig. 1). These are solar-powered
    and record a large amount of GPS fixes, which are then sent to us over the mobile
    network.
- claim: Fieldwork was funded by OSME, the Oriental Bird Club and the Hawk Conservancy
    Trust.
  url: https://osme.org/2022/01/satellite-tagging-and-tracking-egyptian-vultures-in-uzbekistan/
  fetched: 2026-11-15
  quote: The fieldwork was made possible with the financial support of OSME, the Oriental
    Bird Club and Hawk Conservancy Trust, UK.
- claim: In January 2022 the team said it would continue to monitor the movements
    of the three tagged birds.
  url: https://osme.org/2022/01/satellite-tagging-and-tracking-egyptian-vultures-in-uzbekistan/
  fetched: 2026-11-15
  quote: We will continue to monitor the movements of Timur, Anya and Arys
- claim: The Hawk Conservancy Trust's project page says 16 birds have been tagged
    in Uzbekistan so far, after five more in 2022 and four more adults in each of
    the third and fourth years.
  url: https://www.hawk-conservancy.org/conservation-research/overseas/egyptian-vulture-project/
  fetched: 2026-11-15
  quote: These sites were used to help the team tag five more individuals in 2022
    including the first adult, and four more adults in both the third and fourth years
    with 16 birds in total now tagged in Uzbekistan so far.
- claim: The page names the project's team as Robert (John) Burnside of the University
    of East Anglia, Vladimir Dobrev of the Bulgarian Society for Protection of Birds,
    and Anna Ten and Valentin Soldatov of the Institute of Zoology, Uzbekistan.
  url: https://www.hawk-conservancy.org/conservation-research/overseas/egyptian-vulture-project/
  fetched: 2026-11-15
  quote: The project is run by Dr Robert (John) Burnside (University of East Anglia),
    Dr Vladimir Dobrev (Bulgarian Society for Protection of Birds), Anna Ten and Valentin
    Soldatov (Institute of Zoology, Uzbekistan).
