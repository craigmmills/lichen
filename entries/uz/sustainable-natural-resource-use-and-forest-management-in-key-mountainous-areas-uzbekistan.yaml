id: sustainable-natural-resource-use-and-forest-management-in-key-mountainous-areas-uzbekistan
kind: project
name: Sustainable natural resource use and forest management in key mountainous areas important for globally
  significant biodiversity
also_known_as:
- Sustainable management of natural and forest resources in key mountain regions to protect biodiversity
scope: uz
ai_label: conservation-tech
realms:
- land
status: closed
summary: Completed joint UNDP, GEF and State Ecology Committee project whose 2019 camera-trap survey with
  two protected areas recorded at least three snow leopards.
facts:
- claim: UNDP describes it as its joint project with the GEF and the State Ecology Committee, and says
    the project developed the BCIMS and the ICBU portal.
  url: https://www.undp.org/uzbekistan/news/introduction-innovative-biodiversity-information-management-system
  fetched: 2026-11-08
  quote: These systems were developed by our joint project with GEF and State Ecology Committee "Sustainable
    natural resource use and forest management in key mountainous areas important for globally significant
    biodiversity".
- claim: UNDP lists the project as completed.
  url: https://www.undp.org/uzbekistan/projects/completed-sustainable-natural-resource-and-forest-management-mountainous-areas
  fetched: 2026-11-08
  quote: '[COMPLETED] Sustainable natural resource and forest management in mountainous areas'
- claim: Its expected results included better knowledge of snow leopard and prey populations.
  url: https://www.undp.org/uzbekistan/projects/completed-sustainable-natural-resource-and-forest-management-mountainous-areas
  fetched: 2026-11-08
  quote: State of knowledge on snow leopard and prey populations enhanced;
- claim: A UNDP page from the time said the project aimed to gather information on key ecosystems, habitats
    and animal species.
  url: https://www.undp.org/uzbekistan/news/training-courses-use-biodiversity-information-management-system
  fetched: 2026-11-08
  quote: Among other things, the project aims to obtain high-quality information on key ecosystems, habitats
    and animal species.
- claim: Its monitoring group installed 23 trail cameras in 2019 with Ugam-Chatkal National Natural Park
    and Chatkal State Biosphere Reserve, recording at least three snow leopards.
  url: https://www.undp.org/uzbekistan/news/october-23-international-snow-leopard-day
  fetched: 2026-11-08
  quote: In total, over the entire expedition, 23 trail cameras were installed in 14 spatial cells. After
    analyzing the obtained images of snow leopards, the monitoring team came to the conclusion that at
    least three individuals of snow leopards were captured.
