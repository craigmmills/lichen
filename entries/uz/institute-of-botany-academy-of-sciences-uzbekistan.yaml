summary: Tashkent research institute that publishes 100 datasets through GBIF and holds the National Herbarium
  of Uzbekistan (TASH), and ran the first national IUCN Red List training in 2025 with IUCN.
facts:
- claim: The GBIF registry lists 100 datasets published by the institute.
  url: https://api.gbif.org/v1/organization/e605f64f-2091-41b6-92d4-8c71008de217/publishedDataset?limit=100
  fetched: 2026-11-08
  quote: '"count":100'
- claim: Houses the National Herbarium of Uzbekistan (TASH), with over 1.5 million specimens, and publishes
    its type collection as an open dataset.
  url: https://api.gbif.org/v1/dataset/0c1237c3-be8c-498b-bb2d-d5cf3c930dec
  fetched: 2026-11-08
  quote: The National Herbarium of Uzbekistan (TASH), housed in the Institute of Botany of the Academy
    of Sciences of Uzbekistan in Tashkent, is the largest botanical collection in Central Asia included
    in the top-100 greatest herbaria of the world.
- claim: One of its 2026 datasets was produced within a 'Digital Nature' State Program of the institute.
  url: https://api.gbif.org/v1/dataset/2b432dab-3640-4b2d-8fc4-9afe0a899fd6
  fetched: 2026-11-08
  quote: Within the framework of the ‘Digital Nature’ State Program of the Institute of Botany of the
    Academy of Sciences of the Republic of Uzbekistan
- claim: Publishes 100 datasets through GBIF.
  url: https://api.gbif.org/v1/organization/e605f64f-2091-41b6-92d4-8c71008de217
  fetched: 2026-11-08
  quote: '"numPublishedDatasets":100'
- claim: Holds the National Herbarium of Uzbekistan (TASH).
  url: https://api.gbif.org/v1/organization/e605f64f-2091-41b6-92d4-8c71008de217
  fetched: 2026-11-08
  quote: The structure of the Institute includes the National Herbarium of Uzbekistan (TASH), which is
    one of the largest botanical collections in Central Asia.
- claim: Its stated research areas include monitoring, a national database, the Red Book of Uzbekistan
    and the state cadastre of flora.
  url: https://api.gbif.org/v1/organization/e605f64f-2091-41b6-92d4-8c71008de217
  fetched: 2026-11-08
  quote: formation of a national database, maintenance of the Red Book of the Republic of Uzbekistan and
