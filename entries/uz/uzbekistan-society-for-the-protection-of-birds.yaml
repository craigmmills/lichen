  quote: Established in 2007, the Uzbekistan Society for the Protection of Birds (UzSPB)
    works to conserve birds, their habitats and wider biodiversity in Uzbekistan.
- claim: The International Waterbird Census is held annually in Uzbekistan on its
    initiative; in 2023 it covered 15 water bodies in 10 regions with 70 participants.
  url: http://www.uzspb.uz/index_e.html
  fetched: 2026-11-12
  quote: The International Waterbird Census (IWC), held annually in our country on
    the initiative of Uzbekistan Society for the Protection of Birds (UzSPB), in January-February
    2023 covered 15 water bodies important for wintering birds in 10 regions of the
    country.
- claim: Has worked at Talimarzhan since 2012, where plant cover, autumn Sociable
    Lapwing and winter waterbird monitoring programmes were launched.
  url: https://birdfund.org/sociable-lapwing
  fetched: 2026-11-12
  quote: Monthly plant cover Monitoring Programme, autumn Sociable Lapwing Monitoring
    Programme and winter Waterbird Monitoring Programme were launched to assess conditions
    and track changes of the KBA’s ecosystems and biodiversity.
