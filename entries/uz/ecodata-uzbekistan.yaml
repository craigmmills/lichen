summary: Geoinformation database of Uzbek biodiversity and protected areas, launched on 28 July 2026 as
  a product of the Aral Sea Wetlands project, with an offline mobile module and public observation submission.
facts:
- claim: Launched on 28 July 2026 as a product of the Aral Sea Wetlands project.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: Uzbekistan officially launched ECODATA, Electronic Geoinformation Database for biodiversity and
    protected natural areas. The platform is a product of the Aral Sea Wetlands project
- claim: Holds information on animals, plants, protected areas, forests, water bodies and pastures, covering
    all 12 regions and Karakalpakstan.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: ECODATA centralizes information on animals, plants, protected areas, forests, water bodies, and
    pastures into a single digital space.
- claim: A mobile module lets specialists collect data with GPS coordinates and photos offline.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: a mobile module allows specialists to collect data with GPS coordinates and photos without an
    internet connection, synchronizing with the central database once restored.
- claim: Launched in Uzbekistan on World Nature Conservation Day as an electronic geoinformation database
    for biodiversity and protected natural areas.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: On World Nature Conservation Day, Uzbekistan officially launched ECODATA, Electronic Geoinformation
    Database for biodiversity and protected natural areas.
- claim: Holds information on animals, plants, protected areas, forests, water bodies and pastures, in
    7 main modules covering all 12 regions and Karakalpakstan.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: ECODATA centralizes information on animals, plants, protected areas, forests, water bodies, and
    pastures into a single digital space. The platform currently includes 7 main modules and over 60 related
    tables
- claim: Has a mobile module for collecting field data with GPS coordinates and photos offline.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: a mobile module allows specialists to collect data with GPS coordinates and photos without an
    internet connection
- claim: Allows researchers and the public to submit nature observations.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: allowing researchers and the public to submit nature observations
