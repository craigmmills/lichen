summary: Uzbek space agency that, as reported, signed a satellite monitoring memorandum with the Prosecutor
  General's Office, analyses farmland and water from space data, and presented AI-based satellite solutions
  in June 2026.
facts:
- claim: With the Fergana regional administration, it analyses gardens, farmland and reservoirs from space
    monitoring and feeds the data into the Space Water Monitoring platform.
  url: https://gov.uz/en/uzspace/news/view/188439
  fetched: 2026-11-08
  quote: Uzbekcosmos, together with the khokimiyat of the Fergana region, is analyzing gardens, agricultural
    lands and reservoirs based on space monitoring and integrating the data into the Space Water Monitoring
    platform.
- claim: At the Tashkent International Investment Forum in June 2026 it presented satellite data and AI-based
    solutions for monitoring farmland, water resources and green zones, among other things, and the SatGPT
    platform for satellite data analysis.
  url: https://gov.uz/en/uzspace/news/view/212797
  fetched: 2026-11-08
  quote: Within the framework of the forum, the Agency presented satellite data and AI-based solutions
    for monitoring agricultural lands, water resources, roads, railway tracks, energy networks, and green
    zones.
- claim: Tashkent Times reports that it signed a memorandum with the Chinese company STAR.VISION on AI
    technologies, under which a hyperspectral satellite named Samarkand-2028, with an AI module, is planned;
    the presidential press service said its images will also be used to monitor crops and forests.
  url: https://www.tashkenttimes.uz/national/16535-uzbekistan-and-china-set-to-launch-samarkand-2028-remote-sensing-satellite
  fetched: 2026-11-08
  quote: On November 24, Uzcosmos announced the signing of a strategic memorandum with the Chinese company
    STAR.VISION. The memorandum provides for the development of AI technologies, joint projects, the integration
    of scientific and technological solutions, and collaboration with universities.
