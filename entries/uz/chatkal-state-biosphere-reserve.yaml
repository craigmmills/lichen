summary: Biosphere reserve run by the National Committee on Ecology and Climate Change, whose staff joined
  2019 snow leopard camera-trap surveys and whose camera traps recorded Tien Shan brown bear and Siberian
  ibex in August 2026.
facts:
- claim: In August 2026 camera traps installed in the reserve recorded Tien Shan brown bear and Siberian
    ibex.
  url: https://gov.uz/en/eco/news/view/207985
  fetched: 2026-11-08
  quote: Camera traps installed in the Chatkal State Biosphere Reserve under the National Committee on
    Ecology and Climate Change have captured footage of representatives of Chatkal’s rich wildlife, including
    the Tien Shan brown bear and Siberian ibex.
- claim: Its researchers and inspectors took part in a 2019 UNDP/GEF camera-trap survey of snow leopards.
  url: https://www.undp.org/node/131446
  fetched: 2026-11-08
  quote: together with researchers and inspectors of the Ugam-Chatkal National Natural Park and Chatkal
    State Biosphere Reserve using camera traps
