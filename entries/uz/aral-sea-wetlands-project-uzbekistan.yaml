summary: GEF-funded project run by the ecology committee with UNDP, producing ECODATA and restoring wetlands,
  with UNDP reporting stronger conservation across protected areas exceeding four million hectares.
facts:
- claim: Implemented by the National Committee for Ecology and Climate Change with UNDP and funded by
    the GEF; ECODATA is a product of the project.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: The platform is a product of the Aral Sea Wetlands project, which is implemented by the National
    Committee for Ecology and Climate Change together with the United Nations Development Programme (UNDP)
    and funded by the Global Environment Facility (GEF).
- claim: Implemented by the National Committee for Ecology and Climate Change with UNDP and funded by
    the GEF.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: the Aral Sea Wetlands project, which is implemented by the National Committee for Ecology and
    Climate Change together with the United Nations Development Programme (UNDP) and funded by the Global
    Environment Facility (GEF)
- claim: UNDP says the project is strengthening biodiversity conservation across protected areas of more
    than four million hectares through management approaches and monitoring systems.
  url: https://www.undp.org/uzbekistan/blog/restoration-resilience-three-decades-partnership-uzbekistans-green-future
  fetched: 2026-11-08
  quote: biodiversity conservation efforts are being strengthened across protected areas covering more
    than four million hectares through improved management approaches and monitoring systems
- claim: Works on wetland restoration and water and land management across the Lower Amudarya basin.
  url: https://www.undp.org/uzbekistan/blog/restoration-resilience-three-decades-partnership-uzbekistans-green-future
  fetched: 2026-11-08
  quote: efforts are underway to restore wetlands, strengthen sustainable water and land management, conserve
    biodiversity, and support climate-resilient livelihoods across the Lower Amudarya basin
