summary: State programme for monitoring Uzbekistan's natural environment from 2026
  to 2030, approved by resolution No. 275 of 25 May 2026, covering migratory waterbirds,
  forest cover classification and a planned remote sensing vegetation monitoring tool.
facts:
- claim: Approved by resolution No. 275 of 25 May 2026 as the programme of state monitoring
    of the natural environment in Uzbekistan for 2026 to 2030.
  url: https://lex.uz/uz/docs/-8234056
  fetched: 2026-11-15
  quote: 275-сон 25.05.2026. 2026-2030-yillar uchun Oʻzbekiston Respublikasida atrof
    tabiiy muhitning davlat monitoringi dasturini tasdiqlash toʻgʻrisida
- claim: The programme provides for monitoring migratory waterbirds at the Tudakul
    and Kuyimazar reservoirs and at the Dengizkul, Tuzkan, Sudochye and Jiltirbas
    lakes.
  url: https://lex.uz/uz/docs/-8234056
  fetched: 2026-11-15
  quote: Toʻdakoʻl va Quyimozor suv omborlari, shuningdek Dengizkoʻl, Tuzkon, Sudochye,
    Jiltirbas koʻllari hududlarida koʻchib yuruvchi suv qushlari monitoringini oʻtkazish.
- claim: The programme provides for classifying forest cover on forest fund lands
    (sparse, dense, open) and monitoring its condition.
  url: https://lex.uz/uz/docs/-8234056
  fetched: 2026-11-15
  quote: Oʻrmon fondi yerlaridagi oʻrmon qoplami boʻyicha turlarga ajratish (siyrak,
    qalin, tutashmagan) va uning holatini monitoring qilish.
- claim: It includes a project to create an automated national software product for
    monitoring vegetation cover change from remote sensing data.
  url: https://lex.uz/uz/docs/-8234056
  fetched: 2026-11-15
  quote: Masofaviy zondlash maʼlumotlaridan foydalangan holda oʻsimlik qoplami oʻzgarishini
    monitoring qilish boʻyicha avtomatlashtirilgan milliy dasturiy mahsulot yaratish
    loyihasini amalga oshirish.
