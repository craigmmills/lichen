summary: National park whose rangers were reported in July 2026 to be training in SMART patrol data, with
  smartphones with SMART Mobile to replace paper logs, after receiving eight camera traps in 2024.
facts:
- claim: A July 2026 report said its rangers and specialists were receiving training to collect, manage
    and analyse patrol data with SMART during a course scheduled for July 13–17.
  url: https://gov.uz/en/eco/news/view/193170
  fetched: 2026-11-08
  quote: During the training, held on July 13-17, rangers and specialists from Zarafshan National Park
    are gaining both theoretical knowledge and practical skills in collecting, managing, and analyzing
    patrol data using the SMART system.
- claim: After the training its rangers are to replace paper patrol logs with smartphones running SMART
    Mobile.
  url: https://gov.uz/en/eco/news/view/193170
  fetched: 2026-11-08
  quote: Upon completion of the training, rangers will replace paper-based patrol logs with rugged smartphones
    equipped with the SMART Mobile application
- claim: In 2024 the Succow Foundation and local partners held biodiversity monitoring training in the
    park, and it received eight camera traps.
  url: https://succow-stiftung.de/en/succow-stiftung/news/detail/monitoring-trainings-for-rangers-in-the-zarafshan-valley
  fetched: 2026-11-08
  quote: Important part of the training was the introduction of camera-traps in the protected areas. Each
    of them got eight camera traps and now could make their monitoring more efficient.
