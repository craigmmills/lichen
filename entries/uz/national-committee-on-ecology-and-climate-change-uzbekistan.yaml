summary: Uzbek environmental body responsible for state control over forests and protected areas, with
  tasks including digital technologies and automated monitoring, partnering with UNDP and running Gissar
  State Reserve.
facts:
- claim: Its tasks include state environmental control over forests, protected natural areas and the protection
    of flora and fauna.
  url: https://gov.uz/en/eco/pages/tasks_and_functions
  fetched: 2026-11-08
  quote: Maintenance of state environmental control over nature conservation, including atmospheric air,
    land, subsoil, water, forests, protected natural areas, protection of flora and fauna, waste management;
- claim: Its tasks include bringing digital technologies into environmental protection and automating
    monitoring.
  url: https://gov.uz/en/eco/pages/tasks_and_functions
  fetched: 2026-11-08
  quote: Implementation of digital technologies in the field of environmental protection, establishment
    of a system for reducing and automating the human factor in monitoring;
- claim: In December 2024, as the Ministry of Ecology, Environmental Protection and Climate Change, it
    signed an agreement with UNDP on a GEF-8 project to update the national biodiversity strategy and
    action plan in line with the Kunming-Montreal Global Biodiversity Framework and to prepare the 7th
    National Report, planned to run to July 2027.
  url: https://gov.uz/en/eco/news/view/29423
  fetched: 2026-11-08
  quote: The aim of this project is to support Uzbekistan in revising and updating the NBSAPs to bring
    them into line with the recently agreed Kunming-Montreal Global Biodiversity Framework (GBF)
- claim: The Gissar State Reserve is administered by the committee.
  url: https://gov.uz/en/eco/news/view/189841
  fetched: 2026-11-08
  quote: A camera trap installed in the Gissar State Reserve, which is administered by the National Committee
    on Ecology and Climate Change, has recorded a snow leopard (Panthera uncia).
- claim: A 2025 news item says an Uzbek delegation presented the country's snow leopard monitoring, with
    attention to GPS tracking, camera traps and the SMART patrol system.
  url: https://gov.uz/en/eco/news/view/60666
  fetched: 2026-11-08
  quote: Particular attention was given to the use of modern technologies, including GPS tracking, camera
    traps, and the SMART patrol system
- claim: Its government portal section lists biodiversity, national natural parks, nature reserves and
    environmental monitoring.
  url: https://gov.uz/en/eco/sections/view/7698
  fetched: 2026-11-08
  quote: National Natural Parks Nature reserves Contests and tenders Environmental control Environmental
    Monitoring
- claim: Its portal section lists state monitoring of the natural environment.
  url: https://gov.uz/en/eco/sections/view/7698
  fetched: 2026-11-08
  quote: State monitoring of the natural environment
- claim: UNDP names it as its government partner on GEF work under the Rio Conventions in Uzbekistan.
  url: https://www.undp.org/uzbekistan/blog/restoration-resilience-three-decades-partnership-uzbekistans-green-future
  fetched: 2026-11-08
  quote: the GEF and UNDP have worked alongside the Government of Uzbekistan, National Committee on Ecology
    and Climate Change, national institutions, academia, civil society organizations, and local communities
- claim: Implements the Aral Sea Wetlands project with UNDP; the project produced the ECODATA platform.
  url: https://www.undp.org/uzbekistan/press-releases/ecodata-platform-launches-uzbekistan-digitize-biodiversity-and-protected-area-management
  fetched: 2026-11-08
  quote: The platform is a product of the Aral Sea Wetlands project, which is implemented by the National
    Committee for Ecology and Climate Change together with the United Nations Development Programme (UNDP)
