summary: Reportedly used chips and GPS trackers to monitor birds of prey, and recorded
  Uzbekistan’s first Turkmen long-eared bat during a September 2026 expedition.
facts:
- claim: The Academy of Sciences says electronic chips were fitted at the Institute
    of Zoology to protect and strengthen scientific monitoring of birds of prey.
  url: https://academy.uz/ru/page/pdf/tabiat-muhofazasi-va-monitoringida-yangi-tizim
  fetched: 2026-11-13
  quote: В целях защиты и усиления научного мониторинга хищных птиц в Институте зоологии
    Академии
- claim: The chipping is meant to count birds of prey, monitor their movements and
    prevent illegal trade.
  url: https://academy.uz/ru/page/pdf/tabiat-muhofazasi-va-monitoringida-yangi-tizim
  fetched: 2026-11-13
  quote: Эти работы направлены на учет хищных птиц, мониторинг их перемещений, предотвращение
- claim: A doctoral researcher of the institute monitored rare birds in the Zarafshan
    delta and lakes and reservoirs of Bukhara and Navoi regions, with new data on
    their distribution, numbers and breeding.
  url: https://academy.uz/ru/page/pdf/ozbekiston-suv-havzalarida-kamyob-qush-turlarining-monitoringi-olib-borildi
  fetched: 2026-11-13
  quote: Докторант Института Зоологии АН РУз Жавлон Ёркулов провел мониторинг редких
    птиц в дельте
- claim: An expedition of the institute recorded the Turkmen long-eared bat in South
    Ustyurt National Nature Park in September 2026, the first record of the species
    in Uzbekistan.
  url: https://gov.uz/ru/eco/news/view/232840
  fetched: 2026-11-13
  quote: Находка сделана в сентябре 2026 года на юге плато Устюрт, у границы с Туркменистаном,
    в ходе экспедиции Института зоологии Академии наук Республики Узбекистан.
- claim: In August 2024, the institute and the Research Institute of Environment and
    Nature Conservation Technologies were reported to be monitoring migratory birds
    of prey by fitting GPS trackers, under the project Conservation of Birds of Prey
    in Central Asia.
  url: https://gov.uz/en/eco/news/view/17654
  fetched: 2026-11-13
  quote: together with the Institute of Zoology of the Academy of Sciences, are conducting
    work on monitoring predatory migratory birds by fixing GPS trackers on them.
