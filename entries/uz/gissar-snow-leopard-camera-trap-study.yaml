status: closed
summary: Closed camera trap study led by Bakhtiyor Aromov in late 2013 in Gissar Nature
  Reserve, which took the first photographs of snow leopards in Uzbekistan alongside
  bear, lynx and ibex.
facts:
- claim: In late 2013 rangers and biologists ran a snow leopard camera trap study
    in the Kizilsu area of Gissar Nature Reserve.
  url: https://snowleopardblog.com/projects/uzbekistan/
  fetched: 2026-11-12
  quote: During late 2013, a team of rangers and biologists led by Bakhtiyor Aromov
    and Yelizaveta Protas, in collaboration with Panthera , WWF Central Asia Program
    and Uzbekistan BioControl Agency, conducted a snow leopard camera trap study in
    the Kizilsu area of Gissar Nature Reserve
- claim: The cameras took the first photographs of snow leopards in Uzbekistan and
    recorded bear, lynx, ibex and other mammals.
  url: https://news.mongabay.com/2014/01/snow-leopards-and-other-mammals-caught-on-camera-trap-in-uzbekistan-photos
  fetched: 2026-11-12
  quote: Camera traps in the Gissar Nature Reserve took photos of the big cats, along
    with bear, lynx, ibex, wild boar, and other mammals.
