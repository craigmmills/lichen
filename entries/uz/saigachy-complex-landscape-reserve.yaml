summary: Reserve run by the National Committee on Ecology and Climate Change that has introduced SMART
  patrolling and, in October 2026, installed ten cameras and ten camera traps at new watering points under
  the Aral Sea Wetlands project.
facts:
- claim: SMART patrolling has been introduced in the reserve.
  url: https://gov.uz/en/eco/news/view/193170
  fetched: 2026-11-08
  quote: In Uzbekistan, SMART patrolling has already been introduced in the South Ustyurt National Park,
    the "Saigachiy" Complex Landscape Reserve, and the Surkhan State Reserve, and now it is the turn of
    "Zarafshan".
- claim: A Succow Foundation project page lists the introduction of SMART as a standard patrol tool in
    the reserve.
  url: https://www.succow-stiftung.de/en/protected-areas-biosphere/uzbekistan-and-kazakhstan-strengthening-digital-conservation-practices-in-desert-protected-areas
  fetched: 2026-11-08
  quote: Introduction of SMART as a standard tool for patrolling in the Southern Ustyurt National Park
    and Saigachy Landscape Reserve in Uzbekistan
- claim: In August 2025 UNDP handed field equipment including camera traps to the reserve, among three
    protected areas in the Aral Sea region.
  url: https://www.undp.org/uzbekistan/press-releases/another-step-towards-strengthening-material-and-technical-base-protected-natural-areas-aral-sea-region
  fetched: 2026-11-08
  quote: 'UNDP Uzbekistan handed over modern field equipment to three protected natural areas (PNAs) in
    the Aral Sea region: the Kyzylkum State Reserve, the Saigachiy Integrated (Landscape) Reserve, and
    the Lower Amudarya Biosphere Reserve.'
- claim: In October 2026 ten cameras and ten camera traps were installed at new watering points in the
    reserve, under the Aral Sea Wetlands project, for round-the-clock wildlife monitoring.
  url: https://gov.uz/en/eco/news/view/227044
  fetched: 2026-11-08
  quote: In addition to the watering systems, 10 cameras and 10 camera traps have been installed in the
    area. They enable round-the-clock monitoring of wildlife
