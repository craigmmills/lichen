summary: A Yap Marine Resources Management Division aerial survey of the state's coral
  reefs, announced for 10 to 13 November 2026 using the Global Airborne Observatory
  aircraft, with results going to Yap's Department of Resources and Development.
facts:
- claim: Yap's Department of Resources and Development, through its Marine Resources
    Management Division, announced an aerial mapping survey of Yap's coral reefs from
    10 to 13 November 2026.
  url: https://yapstate.gov.fm/post/yap-s-coral-reefs-to-undergo-aerial-mapping-survey-this-week
  fetched: 2026-11-15
  quote: The Yap Department of Resources and Development, through its Marine Resources
    Management Division, announces an aerial mapping survey of Yap’s coral reefs from
    November 10 to 13, 2026.
- claim: The 10 November 2026 announcement said the Global Airborne Observatory research
    aircraft would fly daily from 6:00 AM to 2:00 PM to map coral reefs, monitor marine
    habitats and measure reef depth from the air.
  url: https://yapstate.gov.fm/post/yap-s-coral-reefs-to-undergo-aerial-mapping-survey-this-week
  fetched: 2026-11-15
  quote: using advanced technology to map coral reefs, monitor marine habitats, and
    measure reef depth without touching the water
- claim: The maps and findings will be given to the Yap Department of Resources and
    Development.
  url: https://yapstate.gov.fm/post/yap-s-coral-reefs-to-undergo-aerial-mapping-survey-this-week
  fetched: 2026-11-15
  quote: All collected maps and findings will be provided directly to the Yap Department
    of Resources and Development.
- claim: The Yap State Government says the information will help the government and
    communities decide which reef areas most need protection.
  url: https://yapstate.gov.fm/post/mapping-yap-s-coral-reefs-to-support-conservation-and-protection
  fetched: 2026-11-15
  quote: The information gathered will help the Yap State Government and local communities
    make informed decisions about which reef areas need the most protection
- claim: OneReef WorldWide Stewardship Micronesia supports the mission.
  url: https://yapstate.gov.fm/post/mapping-yap-s-coral-reefs-to-support-conservation-and-protection
  fetched: 2026-11-15
  quote: with support from OneReef WorldWide Stewardship Micronesia
