summary: Restoration project on Loosiep Island where Island Conservation reported
  removing feral pigs with the community in 2019, planning rat removal for March 2020
  and working towards removing monitor lizards.
facts:
- claim: Island Conservation's December 2019 article says it worked with the community
    to remove feral pigs from Loosiep Island that year and was working with One People
    One Reef toward removing invasive rats and monitor lizards to restore seabird
    and sea turtle populations. Rat removal was planned for March 2020.
  url: https://www.islandconservation.org/nesting-seabird-green-sea-turtle-ulithi-atoll/
  fetched: 2026-11-13
  quote: Island Conservation and our partners at One People One Reef are working together
    to remove invasive rats, monitor lizards, and feral pigs from Loosiep Island,
    Ulithi Atoll
- claim: The December 2019 article says the team had completed baseline biological
    monitoring on three of the turtle islands, with surveys of vegetation, reptiles,
    land crabs and seabirds.
  url: https://www.islandconservation.org/nesting-seabird-green-sea-turtle-ulithi-atoll/
  fetched: 2026-11-13
  quote: The team completed baseline biological monitoring on three of the turtle
    islands including surveys of vegetation, reptiles, land crabs, and seabirds
- claim: The December 2019 article says a team of community members had been trained
    to lead the marine turtle monitoring programme for the season.
  url: https://www.islandconservation.org/nesting-seabird-green-sea-turtle-ulithi-atoll/
  fetched: 2026-11-13
  quote: a team of community members was established and trained to complete trials
    and lead marine turtle monitoring program for the season
