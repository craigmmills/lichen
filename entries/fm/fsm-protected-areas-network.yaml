status: active
runner: unknown
summary: A national protected areas framework adopted by the FSM Congress in 2018,
  with a coordinator post advertised from 3 March 2026 to hold monitoring data and
  update the World Database on Protected Areas.
facts:
- claim: In 2018 the FSM Congress approved and adopted the Protected Areas Network
    National Guiding Policy Framework.
  url: https://cfsm.gov.fm/wp-content/uploads/2024/07/CR_20-87.pdf
  fetched: 2026-11-15
  quote: Approving and adopting the Protected Areas Network National Guiding Policy
    Framework for the National Government of the Federated States of Micronesia.
- claim: The FSM's sixth national report to the CBD (2020) says the framework provides
    for a nationwide network of protected areas, including state-level networks in
    Yap, Chuuk, Pohnpei and Kosrae.
  url: https://www.cbd.int/doc/nr/nr-06/fm-nr-06-en.pdf
  fetched: 2026-11-15
  quote: inclusive of state-level protected area networks in Yap, Chuuk, Pohnpei,
    and Kosrae.
- claim: The same report says protected areas are regularly monitored, with annual
    coral monitoring surveys of all marine protected areas.
  url: https://www.cbd.int/doc/nr/nr-06/fm-nr-06-en.pdf
  fetched: 2026-11-15
  quote: Protected areas are regularly monitored, for example annual coral monitoring
    surveys of all marine protected areas are undertaken.
- claim: A vacancy notice accepting applications from 3 March 2026 advertised a Protected
    Area Network Coordinator post at the FSM Department of Resources and Development.
  url: https://personnel.gov.fm/protected-area-network-coordinator-department-of-resource-development-pohnpei/?print=pdf
  fetched: 2026-11-15
  quote: Protected Area Network Coordinator, FSM National Government at the Department
    of Resources and Development.
- claim: The coordinator's duties include collecting and housing all monitoring and
    reporting information on the network's implementation.
  url: https://personnel.gov.fm/protected-area-network-coordinator-department-of-resource-development-pohnpei/?print=pdf
  fetched: 2026-11-15
  quote: Collect and house all monitoring and reporting information provided by the
    state focal points, MCT, and/or other sources related to the implementation of
    the Protected Areas Network.
- claim: The coordinator's duties include coordinating national data reviews and updates
    for the World Database on Protected Areas and contributing vetted protected area
    datasets to the national Environment data portal.
  url: https://personnel.gov.fm/protected-area-network-coordinator-department-of-resource-development-pohnpei/?print=pdf
  fetched: 2026-11-15
  quote: Coordinate national protected area data reviews and updates for the World
    Database on Protected Areas
