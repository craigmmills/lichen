summary: Community conservation project on Ulithi Atoll, Federated States of Micronesia,
  which by 2014 had tagged and monitored nearly 3,000 nesting green turtles with the
  Falalop community since 2005, largely funded by NOAA.
facts:
- claim: The State of the World's Sea Turtles (SWOT) describes it as a community conservation
    project based in Ulithi Atoll, Federated States of Micronesia.
  url: https://www.seaturtlestatus.org/articles/2014/continuity-in-a-community-setting-the-ulithi-marine-turtle-program
  fetched: 2026-11-13
  quote: The Ulithi Marine Turtle Program is a community conservation project based
    in Ulithi Atoll
- claim: The 2014 article says it had worked with the Falalop community since 2005
    to tag and monitor nearly 3,000 nesting green turtles.
  url: https://www.seaturtlestatus.org/articles/2014/continuity-in-a-community-setting-the-ulithi-marine-turtle-program
  fetched: 2026-11-13
  quote: Since 2005, the Ulithi Marine Turtle Program has worked with the local community
    of Falalop to tag and monitor nearly 3,000 green turtles
- claim: The article says 12 female green turtles were fitted with satellite transmitters
    and tracked to their foraging grounds.
  url: https://www.seaturtlestatus.org/articles/2014/continuity-in-a-community-setting-the-ulithi-marine-turtle-program
  fetched: 2026-11-13
  quote: 12 female green turtles were fitted with satellite transmitters and successfully
    tracked to their foraging grounds
- claim: The article says the field crew took tissue samples for DNA analysis.
  url: https://www.seaturtlestatus.org/articles/2014/continuity-in-a-community-setting-the-ulithi-marine-turtle-program
  fetched: 2026-11-13
  quote: taking tissue samples for DNA analysis
- claim: The article says the project had been sponsored by the Oceanic Society since
    2007 and largely funded by NOAA.
  url: https://www.seaturtlestatus.org/articles/2014/continuity-in-a-community-setting-the-ulithi-marine-turtle-program
  fetched: 2026-11-13
  quote: The project has been sponsored by the Oceanic Society since 2007 and largely
    funded by NOAA.
- claim: Oceanic Society's page, published in 2014 and updated in 2021, says the sea
    turtle research and conservation programme on Falalop was led by Jennifer Cruce
    and now by John Rulmal Jr.
  url: https://www.oceanicsociety.org/news-and-announcements/support-community-conservation-in-ulithi-atoll/
  fetched: 2026-11-13
  quote: a sea turtle research and conservation program led by Jennifer Cruce and
    now by John Rulmal Jr.
