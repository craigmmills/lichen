facts:
- claim: In November 2023, Island Times reported that Yap CAP and the division provided preliminary fish
    surveys alongside photomosaic imaging of reef sites in Yap.
  url: https://islandtimes.org/community-led-marine-monitoring-in-yap-and-palau/
  fetched: 2026-11-12
  quote: Other partners, such as the Yap Community Action Program (Yap CAP) and the Marine Resources Management
    Division (MRMD) provide complimentary support such as preliminary ﬁsh surveys alongside new photomosaic
    technology introduced by Scripps Institute of Oceanography.
- claim: In November 2023, Island Times reported the division's preliminary data from Ngulu Atoll indicating
    recovery from previous coral bleaching events.
  url: https://islandtimes.org/community-led-marine-monitoring-in-yap-and-palau/
  fetched: 2026-11-12
  quote: The MRMD reports that preliminary data from Ngulu Atoll indicate the coral reefs are recovering
    from previous bleaching events
- claim: Island Times reports that an officer of the division took part in a ReefCloud training workshop
    in Kosrae in April 2026.
  url: https://islandtimes.org/picrc-leads-regional-coral-monitoring-workshop-in-kosrae/
