  quote: Lee Hysan Foundation “Growing Mai Po” Project
- claim: Its "Smart Wetland 2.0" project, launched in July 2024, uses solar-powered camera traps and an
    AI-assisted mammal identification system at Mai Po.
  url: https://publications.wwf.org.hk/en/post/pioneering-tech-keeps-mai-pos-wildlife-safe
  fetched: 2026-11-12
  quote: Launched in July 2024, the new monitoring network is driven by solar-powered camera traps and
    an artificial intelligence-assisted mammal identification system (“AI system”).
