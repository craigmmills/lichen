facts:
- claim: Started in 2022 to apply innovation and technology to research, habitat management, education
    and site operations at Mai Po.
  url: https://www.wwf.org.hk/en/smart_conservation
  fetched: 2026-11-12
  quote: These initiatives aim to unlock the full potential of wetland conservation in terms of research,
    habitat management, education, and site operations.
- claim: Over 100 IoT devices have been deployed across Mai Po.
  url: https://www.wwf.org.hk/en/smart_conservation
  fetched: 2026-11-12
  quote: To date, over 100 IoT devices have been deployed across Mai Po’s complex landscapes, providing
    high-quality real-time data and insights.
- claim: Its applications include an AI-powered camera trap.
  url: https://www.wwf.org.hk/en/smart_conservation
  fetched: 2026-11-12
  quote: AI-Powered Camera Trap
