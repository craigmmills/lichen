facts:
- claim: Green Power is a charitable institution exempt from tax under section 88
    of the Inland Revenue Ordinance.
  url: https://www.greenpower.org.hk/en/about-us
  fetched: 2026-11-15
  quote: Green Power is a charitable institution exempt from tax under section 88
    of the Inland Revenue Ordinance.
- claim: Its Butterfly Survey, launched in 2008, is conducted by trained and certified
    citizen "Butterfly Surveyors" and typically runs from June or July to the following
    May or June.
  url: https://www.greenpower.org.hk/eng-press-release/20251019
  fetched: 2026-11-15
  quote: The survey is conducted by "Butterfly Surveyors", who are citizens that have
    been trained and certified.
- claim: The 2024-2025 survey, by 245 surveyors at six sites, recorded 184 butterfly
    species, about 70% of Hong Kong's total.
  url: https://www.greenpower.org.hk/eng-press-release/20251019
  fetched: 2026-11-15
  quote: The latest Butterfly Survey (2024 – 2025) was conducted by 245 butterfly
    surveyors across six sites.
- claim: Green Power's page on its Lantau dragonfly ecological survey lists yearly
    results by number of locations and dragonfly species recorded.
  url: https://greenpower.org.hk/en/eng-blog/lantau-dragonfly-ecological-survey
  fetched: 2026-11-15
  quote: Six locations were surveyed, with a total of 54 dragonfly species recorded
    between March and November, including 1 uncommon species.
