summary: Monitoring programme of Hong Kong mammals that AFCD launched in 2002 to estimate
  species numbers, abundance and distribution; its 2008 to 2018 camera trap survey
  recorded porcupine, wild pig and red muntjac at over 60% of traps.
facts:
- claim: AFCD launched a long-term monitoring programme of Hong Kong mammals in 2002
    to estimate species numbers, abundance and spatial distribution and to provide
    baseline information on population changes.
  url: https://www.afcd.gov.hk/english/conservation/hkbiodiversity/speciesgroup/speciesgroup_mammals.html
  fetched: 2026-11-15
  quote: AFCD launched a long term monitoring program of Hong Kong mammals in 2002.
- claim: East Asian porcupine, Eurasian wild pig and red muntjac were recorded by
    over 60% of camera traps in AFCD's camera trap survey from 2008 to 2018.
  url: https://www.afcd.gov.hk/english/conservation/hkbiodiversity/speciesgroup/speciesgroup_mammals.html
  fetched: 2026-11-15
  quote: They were recorded by over 60% of camera traps in our camera trap survey
    from 2008 to 2018.
