summary: Territory-wide ecological survey programme that AFCD's 2017-2018 annual report
  says it had conducted since 2002 to maintain a Hong Kong ecological database, which
  held over 311,400 species records by March 2018.
facts:
- claim: AFCD's 2017-2018 annual report says it had conducted a territory-wide ecological
    survey programme since 2002 to maintain and update an ecological database for
    Hong Kong.
  url: https://www.afcd.gov.hk/misc/download/annualreport2018/eng/nature.html
  fetched: 2026-11-15
  quote: The Department has been conducting a territory-wide ecological survey programme
    since 2002 with a view to maintaining and updating an ecological database for
    Hong Kong.
- claim: By March 2018 the database held over 311,400 species records.
  url: https://www.afcd.gov.hk/misc/download/annualreport2018/eng/nature.html
  fetched: 2026-11-15
  quote: As at March 2018, over 311 400 records of species had been collected and
    stored in the database.
