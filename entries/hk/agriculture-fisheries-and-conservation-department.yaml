summary: A Hong Kong government department that patrols and enforces against illegal wildlife feeding,
  and whose AI CCTV trial at two Kam Shan Country Park car parks led to 13 successful prosecutions.
facts:
- claim: Patrols and enforces against illegal feeding of monkeys and other wild animals at Kam Shan Country
    Park, Lion Rock Country Park and elsewhere.
  url: https://www.info.gov.hk/gia/general/202608/05/P2026080500629.htm
  fetched: 2026-11-12
  quote: The Agriculture, Fisheries and Conservation Department (AFCD) has stepped up patrols and enforcement
    operations at Kam Shan Country Park, Lion Rock Country Park and other locations since August 1
- claim: Has installed AI CCTV systems at two car parks in Kam Shan Country Park to identify illegal feeding;
    trial operation from early 2024 to August 4, 2026 led to 13 successful prosecution cases.
  url: https://www.info.gov.hk/gia/general/202608/05/P2026080500629.htm
  fetched: 2026-11-12
  quote: The AFCD has installed AI CCTV systems at two car parks in Kam Shan Country Park. These systems
    can effectively identify illegal feeding activities, thereby assisting the AFCD in arranging enforcement
    actions.
