summary: Biodiversity data hub launched in 2022, built by the Agriculture, Fisheries
  and Conservation Department, whose mapping system launched in January 2025 held
  over a million local species occurrence records.
facts:
- claim: The Biodiversity Geographic Information System, launched in January 2025,
    is the hub's second phase and an initiative under the Hong Kong Biodiversity Strategy
    and Action Plan.
  url: https://www.info.gov.hk/gia/general/202501/17/P2025011700245.htm
  fetched: 2026-11-14
  quote: The BGIS is the second development phase of the Hong Kong Biodiversity Information
    Hub (HKBIH), an initiative under the Hong Kong Biodiversity Strategy and Action
    Plan (BSAP) to facilitate capacity building and knowledge sharing.
- claim: In January 2025, the BGIS held more than a million local species occurrence
    records compiled by AFCD, partner organisations, and research and citizen science
    projects.
  url: https://www.info.gov.hk/gia/general/202501/17/P2025011700245.htm
  fetched: 2026-11-14
  quote: The BGIS contains more than a million occurrence records of local species
    compiled by the AFCD, its partner organisations, and scientific research and citizen
    science projects at present.
- claim: The hub launched in 2022; in January 2025, AFCD reported continuous data
    updates and over 10,000 visits each month.
  url: https://www.info.gov.hk/gia/general/202501/17/P2025011700245.htm
  fetched: 2026-11-14
  quote: Since the launch of the HKBIH in 2022, new data and information have been
    updated and added continuously, with over 10,000 visits recorded each month.
