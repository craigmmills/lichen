summary: AFCD-run reef survey involving over 1,150 divers across 33 sites in 2023
  and over 1,170 in 2024, first held by Hong Kong Reef Check Foundation in 1997.
facts:
- claim: The 2023 survey ran for five months and covered 33 sites, nine of them within
    marine parks.
  url: https://www.info.gov.hk/gia/general/202312/03/P2023120100625.htm
  fetched: 2026-11-15
  quote: Among the 33 survey sites, nine were within marine parks, including Hoi Ha
    Wan Marine Park, Yan Chau Tong Marine Park and Tung Ping Chau Marine Park.
- claim: In the 2023 survey, divers recorded coral coverage and health status and
    20 indicator species of fish and invertebrates, following international standards.
  url: https://www.info.gov.hk/gia/general/202312/03/P2023120100625.htm
  fetched: 2026-11-15
  quote: Reef Check divers recorded coral coverage and health status as well as other
    indicator species (including 20 species of fish and invertebrates).
- claim: In 2023, 103 dive teams with over 1,150 volunteer divers took part.
  url: https://www.info.gov.hk/gia/general/202312/03/P2023120100625.htm
  fetched: 2026-11-15
  quote: This year, 103 dive teams involving over 1150 volunteer divers took part
    in the exercise
- claim: The Hong Kong Reef Check Foundation held the first Reef Check in 1997; the
    December 2023 release says AFCD had collaborated with the Foundation in conducting
    the survey since 2000.
  url: https://www.info.gov.hk/gia/general/202312/03/P2023120100625.htm
  fetched: 2026-11-15
  quote: The AFCD has collaborated with the Foundation in conducting the survey since
    2000
- claim: In 2024, 106 dive teams with over 1,170 volunteer divers took part.
  url: https://www.info.gov.hk/gia/general/202412/08/P2024120600516.htm
  fetched: 2026-11-15
  quote: This year, 106 dive teams involving over 1 170 volunteer divers participated
    in the exercise.
