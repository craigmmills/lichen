    Association for Impact Assessment (IAIA) 2025 "Corporate Initiative Award".
- claim: The database it developed holds baseline data on environment and ecology
    from EIA reports.
  url: https://www.news.gov.hk/eng/2022/12/20221219/20221219_175626_516.html
  fetched: 2026-11-14
  quote: The database is developed by the Environmental Protection Department with
    the application of a geographic information system and a mapping system platform
    which encompasses various baseline data related to environment and ecology in
    the EIA reports.
