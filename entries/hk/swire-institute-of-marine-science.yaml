  quote: The Swire Institute of Marine Science (SWIMS) is a research facility of The University of Hong
    Kong's Faculty of Science, situated on the Cape d'Aguilar peninsula, on the shores of Hong Kong's
    only Marine Reserve.
- claim: Is compiling a marine biodiversity database of species occurrence and DNA-derived data from Hong
    Kong.
  url: https://api.gbif.org/v1/organization?country=HK&limit=30
  fetched: 2026-11-12
  quote: SWIMS is compiling a quality-assured marine biodiversity database to improve knowledge of marine
    biodiversity and enhance information sharing across different sectors. The database collates marine
    species occurrence and DNA-derived data from Hong Kong.
- claim: The first batch of data planned for upload is from a baseline evaluation of Hong Kong's rocky
    shores that recorded over 412 species at 44 sites, with 313 DNA barcodes deposited at SWIMS.
  url: https://api.gbif.org/v1/organization?country=HK&limit=30
  fetched: 2026-11-12
  quote: The study recorded over 412 species across 44 selected sites through regular intensive surveys,
    citizen science outreach events, and dedicated active searches.
