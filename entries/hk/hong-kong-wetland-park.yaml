summary: Park run by AFCD that carries out continuous ecological monitoring of wildlife
  and water quality, with bird surveys along fixed routes showing 300 bird species
  recorded at the Wetland Reserve as of 2025.
facts:
- claim: The park runs continuous ecological monitoring, collecting and analysing
    information on the diversity, distribution and behaviour of wildlife in the park.
  url: https://wetlandpark.gov.hk/en/biodiversity/index
  fetched: 2026-11-15
  quote: Through collecting and analysing information about the diversity, distribution
    and behaviour of wildlife in the Park, we could further enhance the habitat management
    measures accordingly.
- claim: Its monitoring records show 300 bird species recorded at the Wetland Reserve
    as of 2025.
  url: https://wetlandpark.gov.hk/en/biodiversity/index
  fetched: 2026-11-15
  quote: the cumulative number of bird species recorded at the Wetland Reserve has
    reached 300 as of 2025
- claim: Bird surveys are conducted along fixed routes, recording species and abundance
    at designated observation points.
  url: https://wetlandpark.gov.hk/en/biodiversity/index
  fetched: 2026-11-15
  quote: Bird surveys are conducted along fixed routes, with species and abundance
    of birds recorded at designated observation points by sighting and hearing of
    bird calls.
- claim: Water quality of the freshwater marshes and other water bodies is monitored
    regularly.
  url: https://wetlandpark.gov.hk/en/biodiversity/index
  fetched: 2026-11-15
  quote: Water quality monitoring is performed regularly for the freshwater marshes
    and other water bodies.
