summary: Project run by OPCFHK to document seahorse numbers, species, size, sex and
  distribution in shallow Hong Kong coral communities, with tagging begun in 2013
  to track survival, growth and home range.
facts:
- claim: The survey aims to document the number, species diversity, size, sex and
    distribution of seahorses in Hong Kong's shallow coral communities at depths of
    less than 7 metres and adjacent areas.
  url: https://www.opcf.org.hk/en/conservation-research/local-conservation-efforts/seahorse-survey-and-tagging-project
  fetched: 2026-11-15
  quote: The seahorse survey conducted by the Foundation aims to document the number,
    species diversity, size, sex and distribution of seahorses in shallow coral communities
    above 7 meters and adjacent areas in Hong Kong.
- claim: The survey plan calls for a team of four to six researchers to conduct a
    GPS underwater visual census.
  url: https://www.opcf.org.hk/en/conservation-research/local-conservation-efforts/seahorse-survey-and-tagging-project
  fetched: 2026-11-15
  quote: The survey team, consists of 4-6 researchers, will then conduct the Global
    Positioning System (GPS) underwater visual census.
- claim: In 2013 the Foundation began Hong Kong's first seahorse tagging, to monitor
    individual seahorses' survivorship, growth and home range.
  url: https://www.opcf.org.hk/en/conservation-research/local-conservation-efforts/seahorse-survey-and-tagging-project
  fetched: 2026-11-15
  quote: embarking on Hong Kong’s first-ever seahorse tagging initiative in 2013,
    which enables researchers to identify individual seahorses and monitor their long-term
    survivorship, growth and home range
