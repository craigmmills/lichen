summary: Funded by the Countryside Conservation Funding Scheme, this system at Fung Yuen could identify
  10 butterfly species in early 2025, with plans for 245 within two years.
facts:
- claim: In early 2025 the system could identify 10 butterfly species, with plans to reach 245 species
    within two years.
  url: https://news.gov.hk/eng/2025/02/20250221/20250221_163222_114.html
  fetched: 2026-11-12
  quote: The AI system can already identify 10 butterfly species, including Danaus genutia, and there
    are plans to expand its capabilities to recognise 245 species within two years.
- claim: In February 2025, the Environmental Association's chief executive described plans to use cameras
    in butterfly gardens for conservation analysis through the system.
  url: https://news.gov.hk/eng/2025/02/20250221/20250221_163222_114.html
  fetched: 2026-11-12
  quote: That means we can put a camera in butterfly gardens that we developed, and then the camera will
    capture images of butterflies.
