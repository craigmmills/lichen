summary: Annual January census run by the Hong Kong Bird Watching Society, whose 2024
  count across 11 regions recorded 6,988 Black-faced Spoonbills with over 200 experts
  and volunteers.
facts:
- claim: The Hong Kong Bird Watching Society initiates the census every January; the
    2024 census ran from 19 to 21 January with over 200 experts and volunteers.
  url: https://cms.hkbws.org.hk/cms/en/hkbws/work/endangered-species/bfs-en/bfs-census-2024-en
  fetched: 2026-11-14
  quote: HKBWS initiates the International Black-faced Spoonbill Census every January.
    This year's census took place from January 19th to 21st, mobilizing over 200 conservation
    experts and volunteers worldwide.
- claim: The 2024 count recorded 6,988 Black-faced Spoonbills.
  url: https://cms.hkbws.org.hk/cms/en/hkbws/work/endangered-species/bfs-en/bfs-census-2024-en
  fetched: 2026-11-14
  quote: The global count recorded a total of 6,988 Black-faced Spoonbills
- claim: The 2024 census covered 11 regions, including Taiwan, mainland China, Macao,
    Japan and Vietnam.
  url: https://cms.hkbws.org.hk/cms/en/hkbws/work/endangered-species/bfs-en/bfs-census-2024-en
  fetched: 2026-11-14
  quote: Among the 11 regions covered in this year's census, Taiwan remains the largest
    wintering habitat for Black-faced Spoonbill globally.
