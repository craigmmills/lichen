    CoralSCOP-LAT, a tool for labelling and analysing coral reef images.
  url: https://api.openalex.org/works/W4413884133?select=id,title,publication_year,corresponding_institution_ids,authorships,primary_location
  fetched: 2026-11-14
  quote: 'CoralSCOP-LAT: Labeling and analyzing tool for coral reef images with dense
    semantic mask'
- claim: Corresponding institution on a 2025 paper on cetacean-specific primers for
