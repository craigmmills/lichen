- claim: Corresponding institution on a 2023 study linking hidden heatwaves and severe
    coral bleaching to mesoscale eddies.
  url: https://api.openalex.org/works?filter=corresponding_institution_ids:I200769079,publication_year:2022-2026,primary_topic.subfield.id:2303&per_page=30&select=id,title,publication_year
  fetched: 2026-11-14
  quote: Hidden heatwaves and severe coral bleaching linked to mesoscale eddies and
    thermocline dynamics
- claim: From June 2018 worked with the Drainage Services Department on AI cameras
    at the Sha Tin Sewage Treatment Works and Penfold Park that distinguish types
    of egret and count them, according to a 2019 government news report.
  url: https://www.news.gov.hk/eng/2019/06/20190606/20190606_133241_198.html
  fetched: 2026-11-14
  quote: Last June, the Drainage Services Department began collaborating with the
    Hong Kong University of Science & Technology to use state of the art green artificial
    intelligence technology to monitor the birds.
- claim: The report quotes the project team saying they trained the model by telling
    it which egret species each example showed, against different backgrounds.
  url: https://www.news.gov.hk/eng/2019/06/20190606/20190606_133241_198.html
  fetched: 2026-11-14
  quote: We train the model. We tell the model this is a great egret.
