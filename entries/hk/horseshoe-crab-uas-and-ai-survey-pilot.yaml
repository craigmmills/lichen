summary: Two-year pilot at the Ha Pak Nai mudflat using drones and AI for horseshoe
  crab surveys, built by a CUHK department, which by June 2025 identified juveniles
  with accuracy above 90%.
facts:
- claim: A two-year pilot using autonomous unmanned aerial systems and AI for horseshoe
    crab population surveys at the Ha Pak Nai mudflat began the year before June 2025.
  url: https://www.opcf.org.hk/en/press-release/ocean-park-conservation-foundation-hong-kong-boosts-horseshoe-crab-conservation-with-drones-and-ai
  fetched: 2026-11-15
  quote: a two-year pilot programme using autonomous unmanned aerial systems (UASs)
    and artificial intelligence (AI) technology for horseshoe crab population surveys
    at the Ha Pak Nai mudflat was commenced
- claim: The team built and trained AI algorithms to detect and identify horseshoe
    crabs in drone images.
  url: https://www.opcf.org.hk/en/press-release/ocean-park-conservation-foundation-hong-kong-boosts-horseshoe-crab-conservation-with-drones-and-ai
  fetched: 2026-11-15
  quote: They then built and trained AI algorithms to detect and identify horseshoe
    crabs from the images collected by drones.
- claim: The CityU co-investigator described the pilot as combining domain expertise
    with AI deep learning.
  url: https://www.opcf.org.hk/en/press-release/ocean-park-conservation-foundation-hong-kong-boosts-horseshoe-crab-conservation-with-drones-and-ai
  fetched: 2026-11-15
  quote: we are combining domain expertise with AI deep learning technology
  ai_type: deep-learning
- claim: By June 2025 the system identified juvenile horseshoe crabs with accuracy
    above 90%.
  url: https://www.opcf.org.hk/en/press-release/ocean-park-conservation-foundation-hong-kong-boosts-horseshoe-crab-conservation-with-drones-and-ai
  fetched: 2026-11-15
  quote: the system's accuracy in identifying juvenile horseshoe crabs has reached
    over 90%
