summary: Project run by the Herbier National de Guinée, with Royal Botanic Gardens,
  Kew, and funded by Fondation Franklinia, covering 13 threatened tree species in
  three TIPAs, with a second phase planning community conservation committees.
facts:
- claim: A three-year Franklinia grant to HNG and RBG Kew covers 13 threatened tree
    species in three TIPAs in Maritime Guinea.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-12
  quote: Ce financement durant trois ans et le projet est axées sur 13 espèces d’arbres
    menacés dans 3 ZTIPs en Guinée Maritime.
- claim: The second phase aims to extend work with communities around three TIPAs
    and establish conservation committees to monitor planted threatened species.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-12
  quote: Ce projet vise à élargir les activités avec les communautés au tour de trois
    ZTIPs (Kakiwondi, Mt Gangan et Kounounkan) et la mise en place des comités de
    conservation pour la sensibilisation et le suivi des espèces menacées plantées.
