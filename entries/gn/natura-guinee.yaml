summary: EU-funded project under NaturAfrica, run by the Wild Chimpanzee Foundation, which held a first-year
  review in February 2025 and began camera-trap biomonitoring with 150 cameras in Badiar in May 2024.
facts:
- claim: Guinéenews reported in March 2025 that Natura Guinée, started under the EU's NaturAfrica initiative,
    held a first-year review in Conakry on 12 and 13 February 2025.
  url: https://guineenews.org/2025/02/14/biodiversite-le-projet-natura-guinee-pose-les-bases-dune-conservation-durable/
  fetched: 2026-11-08
  quote: Un an après son lancement, le projet Natura Guinée dresse un premier bilan lors d’un atelier
    organisé à Conakry les 12 et 13 février 2025.
- claim: The same report gives patrol coverage of 89.2% for the future Pinselli-Soyah-Sabouyah park and
    69% for Badiar National Park.
  url: https://guineenews.org/2025/02/14/biodiversite-le-projet-natura-guinee-pose-les-bases-dune-conservation-durable/
  fetched: 2026-11-08
  quote: avec une couverture de 89,2 % pour le futur Parc national PSS et 69 % pour le Parc national du
    Badiar
- claim: The Wild Chimpanzee Foundation's 2024 annual report says a first biomonitoring study under the
    project began in May 2024 with 150 camera traps in the proposed Badiar National Park.
  url: https://www.wildchimps.org/_files/ugd/0e1b0a_fde9100282b0428986d0a1fb28c6393b.pdf
  fetched: 2026-11-08
  quote: 2024 avec la mise en place de 150 caméras pièges afin de mieux identifier les espèces sauvages
