summary: Guinean mapping institute that a January 2023 decree, reported by Guinéenews, made responsible
  for the national geographic information system, base mapping and technical standards for geodesy and
  imaging.
facts:
- claim: A January 2023 decree, reported by Guinéenews, made the institute responsible for the national
    geographic information system.
  url: https://guineenews.org/2023/01/18/decret-les-attributions-de-linstitut-geographique-national-fixees/
  fetched: 2026-11-08
  quote: L’Institut Géographique National a pour attributions d’assurer la gestion du système d’information
    géographique.
- claim: The decree charges it with drawing up and updating the base mapping of the national territory.
  url: https://guineenews.org/2023/01/18/decret-les-attributions-de-linstitut-geographique-national-fixees/
  fetched: 2026-11-08
  quote: D’élaborer et de mettre à jour la cartographie de base du territoire national
- claim: The decree also charges it with upholding technical standards for geodesy, mapping and aerial
    and satellite imaging.
  url: https://guineenews.org/2023/01/18/decret-les-attributions-de-linstitut-geographique-national-fixees/
  fetched: 2026-11-08
  quote: De veiller au respect des normes techniques en matière de géodésie, de cartographie et de prise
    de vue aérienne et satellitaire
