status: closed
summary: Closed technical assistance project, led by IGN FI and funded by the World Bank, on a national
  forest monitoring system, with SalvaTerra reporting work from June 2023 to May 2025.
facts:
- claim: In its December 2023 project notice, IGN FI said the consortium was studying how to establish
    a national forest and land use monitoring system to track forests, land use changes and associated
    carbon emissions.
  url: https://ignfi.fr/en/national-forest-and-land-use-monitoring-system-in-guinea-snsf/
  fetched: 2026-11-08
  quote: This system will enable the monitoring and accessibility of data on the state of forests, land
    use changes, and the quantification of associated carbon emissions.
- claim: In its December 2023 project notice, IGN FI said binary forest/non-forest mapping of changes
    from 2014 to 2020 was under way.
  url: https://ignfi.fr/en/national-forest-and-land-use-monitoring-system-in-guinea-snsf/
  fetched: 2026-11-08
  quote: A binary forest/non-forest mapping, complying with the definitions of Guinea’s forest code, and
    its changes from 2014-2020, is currently underway
- claim: SalvaTerra gives its dates of intervention as June 2023 to May 2025, with the Government of Guinea
    as main beneficiary.
  url: https://www.salvaterra.fr/en/references/technical-assistance-to-guineas-national-forest-monitoring-system-nfms/
  fetched: 2026-11-08
  quote: 'Dates of intervention: 2023/06 - 2025/05'
- claim: SalvaTerra says it estimated activity data for 14 land use categories from the Agroecological
    Zoning of Guinea, refined with a sample of 1,700 plots of 1 km².
  url: https://www.salvaterra.fr/en/references/technical-assistance-to-guineas-national-forest-monitoring-system-nfms/
  fetched: 2026-11-08
  quote: data estimated from ZAEG data and refined with new analyses of a sample of 1,700 plots of 1 km²
