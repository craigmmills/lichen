summary: Guinean directorate under the Minister of Environment, Water and Forests,
  responsible for monitoring forest, wildlife and environment regulations, and listed
  by Wetlands International as home of Guinea's International Waterbird Census coordinator.
facts:
- claim: Wetlands International's list of International Waterbird Census coordinators
    gives Pierre Kabinet Kamano of the Direction Générale des Conservateurs de la
    Nature as the coordinator for Guinea.
  url: https://iwc.wetlands.org/index.php/coordinators/
  fetched: 2026-11-12
  quote: Guinea Pierre Kabinet Kamano Direction Générale des Conservateurs de la Nature
- claim: A ministerial order of 4 March 2021 places the directorate under the Minister
    of Environment, Water and Forests, with a mission that includes control and follow-up
    of forest, wildlife and environment regulations.
  url: https://legisguinee.com/textes/arrete-2021-239-attributions-organisation-fonctionnement-direction-generale-cons
  fetched: 2026-11-12
  quote: Sous l'autorité du Ministre de l'Environnement, des Eaux et Forèts, la Direction
    Générale des Conservateurs de la Nature & pour mission la coordination de la gestion
    des ressources humaines
- claim: Under the same order its Inspection Générale supervises the national brigade
    against wildlife and flora crime.
  url: https://legisguinee.com/textes/arrete-2021-239-attributions-organisation-fonctionnement-direction-generale-cons
  fetched: 2026-11-12
  quote: assurer la supervision de la Brigade Nationale de lutte contre la criminalité
    sur les espèces de faune et de flore sauvages
