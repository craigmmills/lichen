summary: Guinea's national herbarium, set up in 2009, which publishes plant data on GBIF and announced
  a verified checklist of 3,505 native vascular plant species.
facts:
- claim: Says its mission is research on and conservation of Guinea's botanical heritage.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-08
  quote: Notre mission est de faire la recherche et la conservation du patrimoine botanique de la Guinée
- claim: Says a JRS Biodiversity Foundation-funded project on improving access to data for identifying
    and protecting threatened plant species led to five new species being described by its researchers
    with Kew.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-08
  quote: financé par JRS Biodiversity Foundation, cinq nouvelles espèces ont été décrites par des chercheurs
    du HNG en partenariat avec les Jardins botaniques royaux de Kew
- claim: Announced a taxonomically verified checklist of the vascular plants of Guinea, downloadable from
    Zenodo, listing 3,505 native species.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-08
  quote: Au total, 3505 espèces de plantes vasculaires indigènes sont signalées
- claim: Says an earlier Darwin Initiative project identified 22 Tropical Important Plant Areas and 9
    threatened habitats in Guinea, and a GBIF-funded data mobilisation project produced conservation action
    plans for 20 plant species.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-08
  quote: le projet sur la mobilisation des données financée par GBIF qui a fourni les Plans d’Action de
    Conservation (PACs) pour 20 espèces végétales
- claim: Lists mapping of threatened habitats in Guinea among the key results of the Darwin Initiative
    project.
  url: https://www.herbierguinee.org/
  fetched: 2026-11-08
  quote: Cartographie des habitats menacés en Guinée
- claim: GBIF's publisher record describes it as a national institution that contributes to government
    policy on the study, knowledge and conservation of plants.
  url: https://api.gbif.org/v1/organization?country=GN&limit=50
  fetched: 2026-11-08
  quote: L'Herbier National de Guinée (HNG) est une institution nationale, qui a pour mission de contribuer
    à la mise en oeuvre de la politique du Gouvernement en matière de l'étude, de la connaissance, de
    la conservation des plantes
- claim: GBIF gives its address at Université Gamal Abdel Nasser in Conakry.
  url: https://api.gbif.org/v1/organization?country=GN&limit=50
  fetched: 2026-11-08
  quote: BP1147 Université Gamal Abdel Nasser
- claim: GBIF's citation for the Checklist of the Vascular Plants of the Republic of Guinea gives the
    herbarium as its publisher.
  url: https://api.gbif.org/v1/dataset/d49f60ba-a9f7-4be7-88e8-4758c41ee2e8
  fetched: 2026-11-08
  quote: Version 1.11. Herbier National de Guinée (HNG). Checklist dataset
- claim: It publishes geo-referenced specimen data from European herbaria gathered for Guinea's red list
    of threatened plants.
  url: https://api.gbif.org/v1/dataset/search?publishingCountry=GN&limit=60
  fetched: 2026-11-08
  quote: Géo-référencement des échantillons des herbiers européens pour la rapatriement des données pour
    la liste rouge de Guinée.
- claim: GBIF lists seven datasets published by it.
  url: https://api.gbif.org/v1/organization?country=GN&limit=50
  fetched: 2026-11-08
  quote: '"numPublishedDatasets":7'
- claim: The herbarium says its mission is research on and conservation of Guinea's botanical heritage,
    and building a network of regional herbaria and botanic gardens.
  url: http://www.herbierguinee.org
  fetched: 2026-11-08
  quote: Notre mission est de faire la recherche et la conservation du patrimoine botanique de la Guinée
    et de créer un réseau des herbiers et jardins botaniques régionaux
- claim: The herbarium says five new species were described by its researchers with Kew under the JRS-funded
    threatened plant data project.
  url: http://www.herbierguinee.org
  fetched: 2026-11-08
  quote: cinq nouvelles espèces ont été décrites par des chercheurs du HNG en partenariat avec les Jardins
    botaniques royaux de Kew
- claim: The herbarium says it handed the National Conservation Action Plan for Guinea's threatened trees,
    and the new vascular plant checklist, to the environment ministry's secretary general.
  url: http://www.herbierguinee.org
  fetched: 2026-11-08
  quote: nous avons remis le Plan d'Action National de Conservation des arbres menacés de Guinée au Secrétaire
    général du ministère de l'Environnement et du Développement durable (MEDD) à Conakry
- claim: Set up in 2009 and made a university research centre in 2011, it is based at Gamal Abdel Nasser
    University of Conakry.
  url: https://www.herbierguinee.org/a-propos-nous.html
  fetched: 2026-11-08
  quote: Érigé en centre de recherche universitaire par décret N°093 du18 Mars 2011, l’HNG est une institution
    de recherche à double vocation pédagogique et scientifique. Il est domicilié à l’Université Gamal
    Abdel Nasser de Conakry.
- claim: Says it is responsible for taxonomy, archiving and information on plant biodiversity.
  url: https://www.herbierguinee.org/a-propos-nous.html
  fetched: 2026-11-08
  quote: L’archivage, l’information sur la biodiversité végétale.
- claim: Its GBIF publisher record describes it as a national institution whose mission is to help carry
    out government policy on the study, knowledge and conservation of plants.
  url: https://api.gbif.org/v1/organization/751cb816-53a6-46e6-9e37-6ac2c43f10fd
  fetched: 2026-11-08
  quote: est une institution nationale, qui a pour mission de contribuer à la mise en oeuvre de la politique
    du Gouvernement en matière de l'étude, de la connaissance, de la conservation des plantes
- claim: Announced the publication of a taxonomically verified checklist of the vascular plants of the
    Republic of Guinea in the journal Scientific Data.
  url: http://www.herbierguinee.org
  fetched: 2026-11-08
  quote: Nous avons le plaisir d'annoncer la publication d'une « Checklist taxonomiquement vérifiée et
    justifiée des plantes vasculaires de la République de Guinée » dans le journal Scientific data
- claim: Publishes on GBIF a dataset of plant biodiversity data for Guinea, meant to give better knowledge
    of the country's flora.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=751cb816-53a6-46e6-9e37-6ac2c43f10fd&limit=10
  fetched: 2026-11-08
  quote: Data collection on the vegetal biodiversity of Guinea, aiming to provide a better knowledge of
    the country
- claim: Publishes floristic survey data collected with RBG Kew in Guinea between 2005 and 2019.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=751cb816-53a6-46e6-9e37-6ac2c43f10fd&limit=10
  fetched: 2026-11-08
  quote: Floristic data collected by RBG Kew and Herbier National de Guinée during surveys in Guinea between
    2005 and 2019 .
