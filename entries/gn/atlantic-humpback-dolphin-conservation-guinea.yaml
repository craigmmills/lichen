summary: Project on the Atlantic humpback dolphin in Guinea, whose first boat survey in June 2022 in Boké
  waters used line transects and fin photo-identification to build a catalogue of individuals.
facts:
- claim: Biotope says its teams carried out the first boat survey campaign for the project in the coastal
    waters of north-west Guinea, in the Boké region, in June 2022.
  url: https://www.biotope.fr/actualites/inventaire-en-bateau-du-projet-de-conservation-du-dauphin-a-bosse-de-latlantique-en-guinee/
  fetched: 2026-11-08
  quote: nos équipes ont réalisé en juin dernier l a première campagne d’observation en bateau dans les
    eaux côtières du nord-ouest de la Guinée (région de Boké)
- claim: Biotope says the survey used boat line transects combined with photo-identification of dorsal
    fins, to build a catalogue of individuals.
  url: https://www.biotope.fr/actualites/inventaire-en-bateau-du-projet-de-conservation-du-dauphin-a-bosse-de-latlantique-en-guinee/
  fetched: 2026-11-08
  quote: Pour cela nous avons réalisé des transects linéaires en bateau, couplé à la méthode de la photo-identification.
- claim: In October 2022, Biotope said the project was implemented jointly by Biotope and CCAHD with scientific
    collaboration from CNSHB, supported by Mubadala and its asset GAC, and managed by the Mohamed Bin
    Zayed Species Conservation Fund.
  url: https://www.biotope.fr/actualites/inventaire-en-bateau-du-projet-de-conservation-du-dauphin-a-bosse-de-latlantique-en-guinee/
  fetched: 2026-11-08
  quote: Ce projet est mis en œuvre conjointement par Biotope et le Consortium pour la Conservation des
    Dauphins à Bosses de l’Atlantique (CCAHD) avec la collaboration scientifique du Centre National de
    Sciences Halieutiques de Boussoura (CNSHB)
