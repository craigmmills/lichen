status: unknown
runner: unknown
summary: JRS-funded project with Kew and the National Herbarium of Guinea that published floristic survey
  data on GBIF and, according to the herbarium, led to five new species being described.
facts:
- claim: Floristic survey data collected by RBG Kew and the National Herbarium of Guinea were published
    on GBIF as part of this project, funded by the JRS Biodiversity Foundation.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=751cb816-53a6-46e6-9e37-6ac2c43f10fd&limit=10
  fetched: 2026-11-08
  quote: Enhancing data access to transform Guinea’s capacity to identify and protect its threatened plant
    species
- claim: The National Herbarium of Guinea says five new species were described by its researchers in partnership
    with RBG Kew under the project.
  url: http://www.herbierguinee.org
  fetched: 2026-11-08
  quote: cinq nouvelles espèces ont été décrites par des chercheurs du HNG en partenariat avec les Jardins
    botaniques royaux de Kew
- claim: The project page says its partners work to identify unnamed Guinean plant specimens, capture
    data on colonial-era specimens and gather private specimen records, which it says will add thousands
    of new records.
  url: https://www.herbierguinee.org/jrs-ameliorer-lacces-aux-donnes.html
  fetched: 2026-11-08
  quote: Les partenaires du projet travaillent pour identifier des spécimens de plantes guinéennes sans
    nom, capturer des données sur les spécimens coloniaux et rassembler des enregistrements de spécimens
    privés, ce qui entraînera l'ajout de milliers de nouveaux enregistrements
- claim: Its first objective is wider access to Guinean specimen data through GBIF, with 6,000 Guinean
    specimen records.
  url: https://www.herbierguinee.org/jrs-ameliorer-lacces-aux-donnes.html
  fetched: 2026-11-08
  quote: Accès accru pour tous aux données de spécimens guinéens via le GBIF avec 6 000 dossiers de spécimens
    guinéens
- claim: Among its objectives is a centralised online register of threats in protected areas and areas
    of high plant diversity, by the end of year 3.
  url: https://www.herbierguinee.org/jrs-ameliorer-lacces-aux-donnes.html
  fetched: 2026-11-08
  quote: grâce à un registre centralisé des risques de menaces développé et accessible en ligne d'ici
    la fin de l'année 3
