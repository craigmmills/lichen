id: guinea-threatened-plants-data-access-project
kind: project
name: Enhancing data access to transform Guinea's capacity to identify and protect its threatened plant
  species
also_known_as:
- Améliorer l'accès aux données pour identifier et protéger les espèces végétales menacées
scope: gn
ai_label: data-infrastructure
realms:
