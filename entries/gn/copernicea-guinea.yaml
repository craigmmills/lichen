summary: Guinea's part of a regional ecosystem natural capital accounting initiative
  launched in 2020 across six countries and run by the Sahara and Sahel Observatory,
  with national workshops in Conakry in February 2024 and September 2025.
facts:
- claim: COPERNICEA is a regional initiative implemented by the Sahara and Sahel Observatory,
    launched in 2020, covering six countries including Guinea, to give each an ecosystem
    natural capital accounting system.
  url: https://afrikenca.oss-online.org/en/about
  fetched: 2026-11-15
  quote: is a regional initiative implemented by the Sahara and Sahel Observatory
    (OSS) with the support of the French Development Agency (AFD)
- claim: The third national ENCA workshop, held in Conakry from 2 to 5 September 2025
    as part of COPERNICEA, presented and validated ENCA data and tools developed for
    Guinea.
  url: https://oss-online.org/en/node/1108
  fetched: 2026-11-15
  quote: focused on the presentation and validation of ENCA data and tools developed
    specifically for Guinea
- claim: The February 2024 national ENCA workshop in Conakry was convened as part
    of COPERNICEA by the National Centre for Environmental Observation (CNOE) and
    the Sahara and Sahel Observatory.
  url: https://oss-online.org/en/node/725
  fetched: 2026-11-15
  quote: The event was convened as part of the Copernicea project, by the National
    Centre for Environmental Observation (CNOE) and the Sahara and Sahel Observatory
    (OSS)
