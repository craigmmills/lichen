summary: Guinea's national parks office, listed as a biodiversity contact and WCF collaborator; Max Planck
  reports their joint chimpanzee and large mammal inventory from 2009 to 2012.
facts:
- claim: InforMEA lists the office, with its director general, among Guinea's contacts for biological
    diversity.
  url: https://www.informea.org/en/countries/gn/party-contacts-hub
  fetched: 2026-11-08
  quote: Office guinéen des parcs nationaux et réserves de faune
- claim: A 2026 paper gives the office's address in Conakry, as the employer of a staff member at Upper
    Niger National Park.
  url: https://orbi.uliege.be/handle/2268/347219
  fetched: 2026-11-08
  quote: Upper Niger National Park (UNNP), Guinean Office of National Parks and Wildlife Reserves (OGPNRF),
    Conakry P.O. Box 634, Guinea
- claim: A 2021 Max Planck Institute news item says WCF and the Office Guinéen des Parcs et Réserves (OGPR,
    printed as OGRP in the inventory sentence) carried out a national chimpanzee and large mammal inventory
    between 2009 and 2012.
  url: https://www.eva.mpg.de/press/news/article/creation-of-the-moyen-bafing-national-park
  fetched: 2026-11-08
  quote: An accurate inventory of chimpanzee and large mammal populations conducted by WCF and OGRP between
    2009 and 2012 in all areas of Guinea
- claim: WCF names it, with the environment ministry, as a national authority with which it supports law
    enforcement in Moyen-Bafing National Park and two proposed national parks.
  url: https://www.wildchimps.org/projects-guinea/law-enforcement
  fetched: 2026-11-08
  quote: Together with the national authorities Ministère de l’Environnement et du Développement Durable
    and Office Guinéen des Parcs Nationaux et Réserves de Faune
- claim: WCF says its biomonitoring in Guinea has been conducted in collaboration with the office.
  url: https://www.wildchimps.org/projects-guinea/biomonitoring
  fetched: 2026-11-08
  quote: in collaboration with Ministère de l’Environnement et du Développement Durable and Office Guinéen
    des Parcs Nationaux et Réserves de Faune
- claim: Biotope Guinée's GBIF publisher record names the office as a close partner in conservation programmes
    such as one for the Atlantic humpback dolphin.
  url: https://api.gbif.org/v1/organization?country=GN&limit=50
  fetched: 2026-11-08
  quote: en lien étroit avec l’Office Guinéen des Parcs Nationaux et Réserves de Faune (OGPNRF)
- claim: Registered in the GBIF publisher registry as the Office Guinéen des Parcs et Réserves, the Guinean
    office of parks and reserves.
  url: https://api.gbif.org/v1/organization/5a6920f5-19ca-4393-be3e-e97145005b69
  fetched: 2026-11-08
  quote: Office Guinéen des Parcs et Réserves
- claim: The National Herbarium of Guinea lists OGUIPAR among the competent authorities represented at
    the closing workshop of its Darwin Initiative project on Tropical Important Plant Areas.
  url: http://www.herbierguinee.org
