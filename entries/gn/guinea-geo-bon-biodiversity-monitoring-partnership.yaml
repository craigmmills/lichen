summary: Partnership announced at COP16 between Guinea's environment ministry and
  GEO BON, with Habitat and UPA Développement International, under which GEO BON is
  to implement BON in a Box for protected area indicators.
facts:
- claim: GEO BON announced at COP16 in Cali a partnership with the government of Guinea
    to support biodiversity monitoring and indicators.
  url: https://geobon.org/geo-bon-signs-a-new-partnership-with-the-government-of-guinea-to-support-biodiversity-monitoring/
  fetched: 2026-11-12
  quote: GEO BON is delighted to announce at COP16 in Cali, Colombia a new partnership
    with the government of Guinea to support biodiversity monitoring and indicators
    to guide conservation planning and action.
- claim: The agreement is between Guinea's Ministry of Environment and Sustainable
    Development, GEO BON, Habitat and UPA Développement International, to support
    indicators for the NBSAP under the KMGBF.
  url: https://geobon.org/geo-bon-signs-a-new-partnership-with-the-government-of-guinea-to-support-biodiversity-monitoring/
  fetched: 2026-11-12
  quote: This milestone agreement between Guinea’s Ministry of Environment and Sustainable
    Development, GEO BON, Habitat, and UPA Développement International will formalize
    a collaboration
- claim: GEO BON is to implement BON in a Box for Guinea to provide indicators on
    the effectiveness of its protected area network.
  url: https://geobon.org/geo-bon-signs-a-new-partnership-with-the-government-of-guinea-to-support-biodiversity-monitoring/
  fetched: 2026-11-12
  quote: GEO BON will implement BON in a Box for Guinea and so provide indicators
    to assess the effectiveness of their expanding protected area network
