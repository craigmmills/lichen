summary: JRS-funded project with Kew, awarded $274,721 over 36 months in 2022, aiming to add 6,000 Guinean
  records to GBIF and train botanists for Red Listing.
facts:
- claim: JRS lists a 2022 grant to the Royal Botanic Gardens, Kew for this project, of $274,721 over 36
    months.
  url: https://jrsbiodiversity.org/grant_primary_country/guinea/
  fetched: 2026-11-08
  quote: $274,721 (36 months)
- claim: JRS says Kew will work with the National Herbarium of Guinea, the Centre Forestière Nzérékoré
    and Guinée Ecologie to identify unnamed specimens, capture colonial specimen data from the Paris Herbarium
    and gather private specimen records for GBIF.
  url: https://jrsbiodiversity.org/grants/royal_botanic_gardens_kew/
  fetched: 2026-11-08
  quote: The Royal Botanic Gardens, Kew will work with partners from the National Herbarium of Guinea,
    the Centre Forestière Nzérékoré and Guinée Ecologie to identify unnamed Guinean plant specimens
- claim: JRS says the project will train Guinean botanists so that Red Listing can be completed for all
    of Guinea's threatened plant species.
  url: https://jrsbiodiversity.org/grants/royal_botanic_gardens_kew/
  fetched: 2026-11-08
  quote: this project will enable the completion of Red Listing for all of Guinea’s threatened plant species
- claim: JRS sets a target of 6,000 records to be added to GBIF by Guinea's GBIF focal point.
  url: https://jrsbiodiversity.org/grants/royal_botanic_gardens_kew/
  fetched: 2026-11-08
  quote: 6,000 records will be added to GBIF by the Guinean Focal Point (Saidou Doumbouya)
- claim: The national herbarium's floristic survey data on GBIF were published as part of this project.
  url: https://api.gbif.org/v1/dataset/search?publishingCountry=GN&limit=60
  fetched: 2026-11-08
  quote: funded by JRS Biodiversity Foundation
