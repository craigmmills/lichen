facts:
- claim: Guinéenews reported in October 2024 that the institute had launched a census of the chimpanzees
    of the Nimba Mountains with American, Swiss and Guinean researchers.
  url: https://guineenews.org/2024/10/15/monts-nimba-linstitut-de-recherche-environnementale-de-bossou-enquete-sur-ladn-des-chimpanzes/
  fetched: 2026-11-08
  quote: L’Institut de Recherche Environnementale de Bossou a récemment lancé une vaste campagne de recensement
    des chimpanzés des monts Nimba
- claim: The same report says the institute is mainly devoted to the study of primates.
  url: https://guineenews.org/2024/10/15/monts-nimba-linstitut-de-recherche-environnementale-de-bossou-enquete-sur-ladn-des-chimpanzes/
  fetched: 2026-11-08
  quote: l’Institut de Recherche Environnementale (IRE) se consacre principalement à l’étude des primates
- claim: A primatologist quoted in the report says the team has more than a hundred camera traps and that
    genetic studies are under way to identify the number of chimpanzee families.
  url: https://guineenews.org/2024/10/15/monts-nimba-linstitut-de-recherche-environnementale-de-bossou-enquete-sur-ladn-des-chimpanzes/
