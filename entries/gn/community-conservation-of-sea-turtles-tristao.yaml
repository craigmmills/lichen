summary: Closed community project (March 2021 to June 2024) on Katrack Island, run
  by Chelonee and the Mohamed bin Zayed Species Conservation Fund, involving beach
  patrols and relocating nine nests, with 150 green turtle hatchlings in February
  2022.
facts:
- claim: The March 2021 to June 2024 project planned to work with local communities
    to protect nests, prevent poaching, reduce habitat degradation and conduct DNA
    analysis of turtles nesting on Katrack Island.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/community-conservation-of-sea-turtles/
  fetched: 2026-11-12
  quote: This project will work with the local communities to protect the nests, prevent
    poaching, reduce habitat degradation, conduct DNA analysis and ensure this valuable
    population of endangered sea turtles continue to thrive.
- claim: During the March 2021 to June 2024 project, villagers and scientific teams
    carried out motorcycle patrols along the 20 km beach.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/community-conservation-of-sea-turtles/
  fetched: 2026-11-12
  quote: Patrols were carried out using a motorcycle which permitted a better, more
    widespread coverage of the 20km beach for the villagers and scientific teams.
- claim: Relocated nine nests to a protected enclosure in December 2021; 150 green
    turtle hatchlings emerged in February 2022 and other nests were being monitored.
  url: https://www.speciesconservation.org/biodiversity-nature-people/sustainable-alliances/mubadala/community-conservation-of-sea-turtles/
  fetched: 2026-11-12
  quote: The other nests are being closely monitored.
