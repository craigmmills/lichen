summary: Repeated species surveys focused on chimpanzees, conducted by WCF in Guinea with the environment
  ministry and national parks office in Moyen-Bafing, proposed national parks and other areas.
facts:
- claim: WCF says it has conducted biomonitoring since 2004, meaning repeated surveys of the distribution
    and frequency of a species, with a focus on chimpanzees.
  url: https://www.wildchimps.org/projects-guinea/biomonitoring
  fetched: 2026-11-08
  quote: Biomonitoring is conducted by the Wild Chimpanzee Foundation since 2004.
- claim: WCF says its biomonitoring in Guinea has been conducted with the environment ministry and the
    national parks office in Moyen-Bafing National Park, the proposed Badiar and Pinselli-Soyah-Sabouyah
    national parks, and other areas.
  url: https://www.wildchimps.org/projects-guinea/biomonitoring
