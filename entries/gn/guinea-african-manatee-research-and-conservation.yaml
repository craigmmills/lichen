summary: A conservation project managed by the MBZ fund with the African Aquatic Conservation
  Fund, which in 2022 reported baseline work on African manatees and sightings recorded by
  trained fellows along two rivers.
facts:
- claim: The MBZ fund's 2022 report says Mubadala and Guinea Alumina Corporation support three
    conservation projects in Guinea, all managed by the fund.
  url: https://reports.speciesconservation.org/?p=4204
  fetched: 2026-11-15
  quote: Mubadala and its asset GAC (Guinea Alumina Corporation) support three conservation
    projects in Guinea which are all managed by the Mohamed bin Zayed Species Conservation
    Fund.
- claim: The fund's 2022 report says it was determining baseline data and identifying and
    mitigating threats to African manatees with the African Aquatic Conservation Fund.
  url: https://reports.speciesconservation.org/?p=4204
  fetched: 2026-11-15
  quote: In conjunction with the African Aquatic Conservation Fund, apart from local capacity
    building, we are determining baseline data and identifying and mitigating dangers for
    the African manatee.
- claim: The 2022 report says biological samples were to be collected opportunistically and
    analysed for manatee population genetics, feeding ecology and habitat use in Guinea.
  url: https://reports.speciesconservation.org/?p=4204
  fetched: 2026-11-15
  quote: Biological samples will be collected opportunistically and analysed to provide the
    first information about manatee population genetics, feeding ecology and habitat use in
    Guinea.
- claim: In its account of progress in 2022, the report says trained Guinea Manatee Fellows
    recorded sightings along the Koulountou and Gambia rivers; it inconsistently abbreviates
    their name as GMF and GMT.
  url: https://reports.speciesconservation.org/?p=4204
  fetched: 2026-11-15
  quote: The GMT’s recorded various manatee sightings along the Koulountou and Gambia Rivers
