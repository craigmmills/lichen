summary: Research institute named as the affiliation of the lead author of a 2026
  Landsat study in Maritime Guinea, which found wooded or shrub savanna and open forest
  lost 47.4% and 45.7% of area between 2002 and 2024 in Damakhania.
facts:
- claim: The lead author of the 2026 paper on anthropogenic impacts on vegetation
    and soils in Maritime Guinea is a lecturer-researcher at IREG, Université Gamal
    Abdel Nasser de Conakry.
  url: https://wjarr.com/content/impact-anthropogenic-activities-agriculture-mining-urbanization-vegetation-and-soils
  fetched: 2026-11-12
  quote: 1 Lecturer-Researcher, Institute for Environmental Research of Guinea (IREG),
    Gamal Abdel Nasser University of Conakry, Guinea
- claim: The OpenAlex record lists the first author with that affiliation.
  url: https://api.openalex.org/works/W7218954171?select=id,display_name,doi,publication_year,authorships
  fetched: 2026-11-12
  quote: '"author_position":"first","author":{"id":"https://openalex.org/A5148457994","display_name":"Alpha
    Laho Diallo"'
- claim: The study analysed seven Landsat-derived indices and used Landsat land cover
    maps for 2002 and 2024 to measure change.
  url: https://wjarr.com/content/impact-anthropogenic-activities-agriculture-mining-urbanization-vegetation-and-soils
  fetched: 2026-11-12
  quote: LULC maps for 2002 (Landsat 5 TM) and 2024 (Landsat 8 OLI) were used to measure
    change and to build three prospective scenarios.
- claim: In the Damakhania sub-prefecture of Maritime Guinea, the study found that
    wooded or shrub savanna and open forest lost 47.4% and 45.7% of their area, respectively,
    between 2002 and 2024.
  url: https://wjarr.com/content/impact-anthropogenic-activities-agriculture-mining-urbanization-vegetation-and-soils
  fetched: 2026-11-12
  quote: Over 22 years, wooded/shrub savanna and open forest lost 47.4% and 45.7%
    of their area
