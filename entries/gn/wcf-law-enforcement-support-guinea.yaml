summary: WCF support for community eco-guards who patrol two proposed national parks, collect SMART data
  and report illegal activities and animal densities, done with the environment ministry and the national
  parks office.
facts:
- claim: WCF says it supports community eco-guards who patrol in two proposed national parks, collect
    SMART data and report monitoring results, including illegal human activities and animal densities,
    to the authorities.
  url: https://www.wildchimps.org/projects-guinea/law-enforcement
  fetched: 2026-11-08
  quote: They collect SMART data and report monitoring results to the authorities, with detailed results
    of illegal human activities and animal densities, so that law enforcement patrols can be most efficient.
- claim: WCF says this work is done together with the environment ministry and the national parks office.
  url: https://www.wildchimps.org/projects-guinea/law-enforcement
  fetched: 2026-11-08
  quote: Together with the national authorities Ministère de l’Environnement et du Développement Durable
    and Office Guinéen des Parcs Nationaux et Réserves de Faune, the Wild Chimpanzee Foundation has been
    supporting law enforcement activities
