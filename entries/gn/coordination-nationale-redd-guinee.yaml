summary: Guinea's national REDD+ coordination body, run by the environment ministry,
  which according to Guinea's UNFCCC reference level submission consolidates the data,
  prepares the reference level and coordinates the national MRV system.
facts:
- claim: Guinea's forest reference level and forest reference emission level submission
    to the UNFCCC says the National REDD+ Coordination, under the supervision of the
    MEDD, consolidates the data and prepares the reference level.
  url: https://redd.unfccc.int/media/nerf_de_la_guinee_2026.pdf
  fetched: 2026-11-15
  quote: consolide les données et prépare le NERF. Le Comité national REDD+
- claim: The submission says the REDD+ Executive Secretariat runs the REDD+ process
    day to day.
  url: https://redd.unfccc.int/media/nerf_de_la_guinee_2026.pdf
  fetched: 2026-11-15
  quote: Le Secrétariat exécutif REDD+ assure la gestion quotidienne du processus
    REDD+.
- claim: The submission links the National REDD+ Coordination with the National Forest
    Monitoring System (SNSF).
  url: https://redd.unfccc.int/media/nerf_de_la_guinee_2026.pdf
  fetched: 2026-11-15
  quote: Nationale REDD+ et le Système National de Suivi des Forêts (SNSF),
- claim: Among the tasks the submission lists is coordination of the national measurement,
    reporting and verification (MRV) system.
  url: https://redd.unfccc.int/media/nerf_de_la_guinee_2026.pdf
  fetched: 2026-11-15
  quote: Coordination du Système National de Mesure, Notification et Vérification
    (MRV) ;
