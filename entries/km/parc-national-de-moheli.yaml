summary: Comorian protected area described by UNDP in 2024 as the country's first and a leading sea turtle
  nesting site, with 30,000 landings a year, and named in 2024 as a RECOS pilot site.
facts:
- claim: UNDP described the park in October 2024 as the first protected area in the Comoros and as the
    world's leading nesting site for sea turtles, with 30,000 landings a year.
  url: https://www.undp.org/africa/stories/protecting-biodiversity-comoros-vital-priority-country-africa-and-world
  fetched: 2026-11-12
  quote: The park is now internationally recognized as the world's leading nesting site for sea turtles,
    with 30,000 landings each year.
- claim: The Indian Ocean Commission said in November 2024 that a Kelonia expert would support the park
    team in applying seagrass and sea turtle monitoring protocols.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2024/11/Communique-RECOS-Comores.pdf
  fetched: 2026-11-12
  quote: appuyer l’équipe du Parc national de Mohéli dans l’application des protocoles de suivi des herbiers
    et des tortues marines
- claim: The 2019 IOSEA site information sheet for Itsamia says the park had developed a nesting monitoring
    programme for all green turtle nesting sites inside the park.
  url: https://iosea-turtles.cms.int/sites/default/files/basic_page_documents/IOSEA_Site_Network-Itsamia_Comoros_2019.pdf
  fetched: 2026-11-12
  quote: The PNM has developed a specific nesting monitoring program for all green turtle nesting sites
- claim: In November 2024, the Indian Ocean Commission named the park as one of six RECOS pilot sites
    for coastal ecosystem restoration.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2024/11/Communique-RECOS-Comores.pdf
  fetched: 2026-11-12
  quote: Le Parc national de Mohéli  est l’un d’eux
