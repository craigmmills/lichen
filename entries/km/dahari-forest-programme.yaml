summary: Forest restoration programme run by Dahari on Anjouan and Grande Comore,
  funded by JRS to evaluate the Moya conservation agreements using satellite imagery
  and to support forest mapping in La Grille KBA, with Oxford.
facts:
- claim: JRS describes Dahari's forest programme as working to restore the forests
    of Anjouan and Grande Comore for endemic biodiversity and watershed services.
  url: https://jrsbiodiversity.org/?p=44368
  fetched: 2026-11-15
  quote: Dahari’s forest programme works to restore the forests of the islands of
    Anjouan and Grande Comore in the Comoros archipelago
- claim: Funding is to evaluate the impact of the Moya conservation agreements scheme
    on deforestation using satellite imagery, with University of Oxford academics.
  url: https://jrsbiodiversity.org/?p=44368
  fetched: 2026-11-15
  quote: Funding will continue and evaluate the impact of the scheme on deforestation
    using satellite imagery (in association with academics from the University of
    Oxford)
- claim: On Grande Comore, funding is to support forest mapping in the La Grille forest
    KBA, in partnership with the University of Oxford.
  url: https://jrsbiodiversity.org/?p=44368
  fetched: 2026-11-15
  quote: funding will support forest mapping (in partnership with the University of
    Oxford)
- claim: Dahari's work is one of the four projects named under a JRS grant to Tusk
    Trust to support biodiversity monitoring capacity.
  url: https://jrsbiodiversity.org/?p=44368
  fetched: 2026-11-15
  quote: JRS-TUSK Partnership to Support Biodiversity Monitoring Capacity for African
    Protected Areas and Conservation Leaders
