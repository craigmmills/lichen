summary: Described by IUCN NL as a Comorian NGO, it enhanced a mobile app through
  a completed CEPF-funded capacity-building project, with species data already used
  by community groups.
facts:
- claim: IUCN NL describes DAYIMA as an NGO from the Comoros working on environmental,
    climate and social challenges.
  url: https://www.iucn.nl/en/story/strengthening-civil-society-for-climate-action-in-the-comoros/
  fetched: 2026-11-15
  quote: DAYIMA is an NGO from the Comores and works to address the environmental,
    climate, and social challenges.
- claim: The mobile application enhanced through DAYIMA's completed capacity-building
    project lets users identify species, distinguish native from invasive ones and
    record observations with GPS coordinates.
  url: https://www.iucn.nl/en/story/strengthening-civil-society-for-climate-action-in-the-comoros/
  fetched: 2026-11-15
  quote: The app allows users to identify species, distinguish between native and
    invasive ones, and record observations with GPS coordinates.
- claim: The app holds a searchable database of plant and animal species in the Comoros.
  url: https://www.iucn.nl/en/story/strengthening-civil-society-for-climate-action-in-the-comoros/
  fetched: 2026-11-15
  quote: The app includes a searchable database of plant and animal species in the
    Comoros
- claim: The data were compiled and validated with support from the Herbier des Comores,
    and civil society and community groups already use the data in field activities.
  url: https://www.iucn.nl/en/story/strengthening-civil-society-for-climate-action-in-the-comoros/
  fetched: 2026-11-15
  quote: The data was compiled and validated with the support of the Herbier des Comores,
    and is already being used CSOs and community groups during field activities.
- claim: CEPF lists DAYIMA as grantee of a capacity-building project for environmental
    and climate action in the Comoros, funded from December 2024 to December 2025;
    IUCN NL reports that the project is completed.
  url: https://www.cepf.net/grants/grantee-projects/capacity-building-environmental-and-climate-action-comoros
  fetched: 2026-11-15
  quote: 'Grantee Name: DAYIMA'
