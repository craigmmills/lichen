facts:
- claim: UNDP reported in August 2025 that RNAP 2 was co-financed by the Comorian government, UNDP and
    the GEF to strengthen protected area management while involving local people.
  url: https://www.undp.org/fr/node/539601
  fetched: 2026-11-12
  quote: Le projet RNAP 2, cofinancé par le Gouvernement comorien, le PNUD et le FEM/GEF, vise à renforcer
    la gestion des aires protégées tout en impliquant activement les populations locales dans la conservation.
- claim: UNDP reported in August 2025 that an eco-guard supported by the project at Bazimini carried out
    surveillance and monitoring of fauna and flora.
  url: https://www.undp.org/fr/node/539601
  fetched: 2026-11-12
  quote: Surveillance, lutte contre les infractions, suivi de la faune et de la flore, éducation environnementale.
- claim: In August 2025, an eco-guard at Mont Ntringui quoted by UNDP said the project had provided monitoring
    tools and training.
