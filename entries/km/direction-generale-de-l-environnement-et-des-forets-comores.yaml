summary: UNDP reported in 2020 that this directorate acquired a specialised mapping drone with UNDP and
  GEF support, alongside online mapping of biodiversity and protected area boundaries.
facts:
- claim: UNDP reported in 2020 that the DGEF acquired the first specialised mapping drone with UNDP and
    GEF support, and that an online mapping solution geo-referenced biodiversity and protected area boundaries
    in the Comoros.
  url: https://www.undp.org/fr/node/218966
  fetched: 2026-11-12
  quote: La Direction Générale de l’Environnement et des Forêts (DGEF) a s’est doté, avec l’appui du PNUD
    et du GEF, du premier drone spécialisé permettant aux Comores d’utiliser des outils cartographiques
    performants.
- claim: The same UNDP story says that capacity building in ecological monitoring and the use of drones
    and Argos tags allowed the health of coral reefs and mangroves in all national parks to be mapped.
  url: https://www.undp.org/fr/node/218966
  fetched: 2026-11-12
  quote: l’utilisation des nouvelles technologies dont les drones et balises argos a permis d’établir
    une cartographie d’état de santé des récifs coralliens et des mangroves dans l’ensemble des parcs
    nationaux
