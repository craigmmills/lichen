facts:
- claim: The Indian Ocean Commission describes the Agence nationale des aires protégées as protecting
    biodiversity and managing the national protected area system, and names this site as the agency's
    new website.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2024/11/Communique-RECOS-Comores.pdf
  fetched: 2026-11-12
  quote: Le projet RECOS soutient l’Agence nationale des aires protégées (ANAP) dans sa mission de protection
- claim: CORDIO in 2026 describes Comoros National Parks as under the Ministry of Environment, in charge
    of Tourism.
  url: https://cordioea.net/consolidating-monitoring-in-comoros-2026/
  fetched: 2026-11-12
  quote: Comoros National Parks (Ministry of Environment, in charge of Tourism)
- claim: The agency's site says it has spent four years on co-management of the Comoros protected areas.
  url: https://www.parcs-nationaux-des-comores.org
  fetched: 2026-11-12
  quote: d'effort de cogestion des aires protégées des Comores
- claim: UNDP reported in 2020 that the Parcs Nationaux des Comores database was operational and hosted
    on ArcGIS Online, with protected area boundary layers.
  url: https://www.undp.org/fr/node/218966
  fetched: 2026-11-12
  quote: La base de données des Parcs Nationaux des Comores est opérationnelle et hébergée sur la plateforme
    ArcGIS online , y compris avec les couches de délimitations des aires protégées.
- claim: UNDP reported in 2020 that ecological monitoring of conservation targets counted 8,550 mongoose
    lemurs on Ndzuani and populations of endemic scops owls.
  url: https://www.undp.org/fr/node/218966
  fetched: 2026-11-12
  quote: Le suivi écologique des cibles de conservation a permis de recenser 8.550 individus d’Eulemur
    Mongoz à Ndzuani
