summary: CORDIO-run reef monitoring in Mohéli National Park, part of the R-POC programme, with sites monitored
  since 2010 and three sites surveyed in 2026 with park eco-guards.
facts:
- claim: CORDIO says it has supported coral reef monitoring in the Comoros since the late 1990s, and several
    sites in Mohéli National Park have been monitored since 2010.
  url: https://cordioea.net/consolidating-monitoring-in-comoros-2026/
  fetched: 2026-11-12
  quote: In Comoros, CORDIO has been supporting coral reef monitoring since the late 90’s, and in Mohéli
    National Park several sites have been monitored since 2010, creating valuable time-series datasets.
- claim: In 2026 the team, including two park eco-guards, monitored three sites, recording reef fish abundance
    and photo-quadrats of substrate cover.
  url: https://cordioea.net/consolidating-monitoring-in-comoros-2026/
  fetched: 2026-11-12
  quote: our team recorded coral reef species abundance (across 11 fish families) and collected photo-quadrats
    to assess substrate cover (corals, algae, rubbles, etc), essential components for tracking reef condition.
- claim: The work is part of CORDIO's engagement in the R-POC programme.
  url: https://cordioea.net/consolidating-monitoring-in-comoros-2026/
  fetched: 2026-11-12
  quote: As part of our ongoing engagement in the R-POC programme (Renforcement de la protection des océans
    aux Comores)
