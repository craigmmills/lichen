summary: A research and conservation centre in South Eleuthera, with whale acoustic
  surveys, a 2011 to 2023 turtle tagging initiative, and a 2026 paper on machine learning
  for turtle breathing.
facts:
- claim: Describes itself as a dedicated centre for research and innovation in South
    Eleuthera, The Bahamas, devoted to research, education and conservation.
  url: https://islandschool.org/?p=12106
  fetched: 2026-11-13
  quote: is a dedicated center for research and innovation in South Eleuthera, The
    Bahamas
- claim: A research faculty member at the institute uses line-transect surveys, photo-identification
    and acoustic monitoring to collect data on deep-diving toothed whales in the Exuma
    Sound.
  url: https://islandschool.org/cape-eleuthera-institute/about-us-cei/our-research-and-tech-team/
  fetched: 2026-11-13
  quote: uses a combination of visual line transect surveys, photo-identification,
    and acoustic monitoring to collect data on the abundance and distribution of deep-diving
    toothed whales in the Exuma Sound
- claim: Its sea turtle research page says the programme rests on a long-term mark-recapture
    initiative that used metal ID tags and photo ID to track turtles between 2011
    and 2023.
  url: https://islandschool.org/?p=11831
  fetched: 2026-11-13
  quote: The foundation of the sea turtle research program at CEI is a long-term mark-recapture
    initiative.
- claim: The same page says it has also used animal-borne cameras, drones, and radio,
    acoustic and satellite telemetry devices to study turtle ecology.
  url: https://islandschool.org/?p=11831
  fetched: 2026-11-13
  quote: animal-borne cameras, drones; radio, acoustic, and satellite telemetry devices
- claim: An OpenAlex record for a 2026 paper lists the Cape Eleuthera Institute among
    the first author's affiliations; the paper's title describes machine learning
    to identify breathing events in sea turtles from animal-borne cameras.
  url: https://api.openalex.org/works/W7161607569?select=id,display_name,publication_year,authorships,doi
  fetched: 2026-11-13
  quote: Classifying behaviors from animal-borne cameras using machine learning
- claim: The first author of that paper gives the affiliation as the Cape Eleuthera
    Institute, Cape Eleuthera Island School.
  url: https://api.openalex.org/works/W7161607569?select=id,display_name,publication_year,authorships,doi
  fetched: 2026-11-13
  quote: Cape Eleuthera Institute, Cape Eleuthera Island School
