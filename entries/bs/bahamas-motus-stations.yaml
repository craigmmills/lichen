summary: A BirdsCaribbean-run project, funded by the US Fish and Wildlife Service
  and American Bird Conservancy, which by December 2023 had installed two of four
  planned Motus radio telemetry stations, both on Grand Bahama.
facts:
- claim: A December 2023 BirdsCaribbean post says two Motus stations had recently
    been installed in The Bahamas.
  url: https://birdscaribbean.org/?p=23678
  fetched: 2026-11-15
  quote: Two stations were recently installed in The Bahamas, bringing the total to
    six stations in just over a year
- claim: 'The December 2023 post describes plans for four Bahamian Motus stations:
    two on Grand Bahama, whose installation it reports completed, with Eleuthera and
    Great Inagua to follow.'
  url: https://birdscaribbean.org/?p=23678
  fetched: 2026-11-15
  quote: Through the Caribbean Motus Collaboration, four new Motus stations will be
    installed across the country. Two stations will be set up on the northernmost
    island of Grand Bahama
- claim: The post describes Motus as a network that uses coordinated automated radio
    telemetry to study migratory animals.
  url: https://birdscaribbean.org/?p=23678
  fetched: 2026-11-15
  quote: an international collaborative research network that uses coordinated automated
    radio telemetry to facilitate research and education on the ecology and conservation
    of migratory animals
