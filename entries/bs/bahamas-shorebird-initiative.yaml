summary: An Audubon programme, with the Bahamas National Trust as partner, that identified
  critical shorebird sites, including ones holding half the Atlantic Piping Plover
  population, and bands wintering Piping Plovers.
facts:
- claim: Audubon's Bahamas page says its science teams, alongside the Bahamas National
    Trust and others, identified the most critical shorebird sites across the country,
    including sites holding half of the Atlantic Piping Plover population.
  url: https://audubon.org/our-work/americas/bahamas/international_bahamas?page=4
  fetched: 2026-11-15
  quote: Recently Audubon’s science teams, alongside Bahamas National Trust and other
    organizations, have identified the most critical shorebird sites across the country
    including sites that support half of the Atlantic Piping Plover population.
- claim: The page says Audubon studies the survival of these birds in The Bahamas
    and their links to breeding areas through its Citizen Science Plover Tracking
    Project.
  url: https://audubon.org/our-work/americas/bahamas/international_bahamas?page=4
  fetched: 2026-11-15
  quote: Audubon is working to improve scientific knowledge about the survival of
    these birds in the Bahamas and how they connect to breeding areas across the Atlantic
    Flyway through our Citizen Science Plover Tracking Project.
- claim: The page says Audubon scientists band Piping Plovers wintering in The Bahamas.
  url: https://audubon.org/our-work/americas/bahamas/international_bahamas?page=4
  fetched: 2026-11-15
  quote: Audubon scientists are banding Piping Plovers as they winter in the Bahamas
    to learn more about this tiny endangered bird.
