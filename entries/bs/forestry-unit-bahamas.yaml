summary: A Bahamas government unit that FAO says it trained in National Forest Inventory data collection
  using Android devices and the Silva Metricus app in July 2026, and the primary beneficiary of a GCF
  readiness proposal.
facts:
- claim: FAO says it worked with the Forestry Unit of The Bahamas on training in National Forest Inventory
    data collection with Android devices and the Silva Metricus app, delivered 17-24 July 2026.
  url: https://www.fao.org/americas/news/news-detail/digital-data-collection-training/en
  fetched: 2026-11-12
  quote: in collaboration with the Forestry Unit of The Bahamas, has successfully concluded a comprehensive
    training series aimed at strengthening the technical capacity of forestry personnel in National Forest
    Inventory (NFI) data collection
- claim: The GCF readiness proposal names the Forestry Unit as the primary beneficiary.
  url: https://www.greenclimate.fund/document/preparation-strategic-framework-reduce-deforestation-and-forest-degradation-and-enhance
  fetched: 2026-11-12
  quote: The primary beneficiary of this funding proposal is The Forestry Unit
- claim: A research team page places the Forestry Unit in the Ministry of The Environment and Housing.
  url: https://www.climate-loss-damage.eu/team/latonya-williams/
  fetched: 2026-11-12
  quote: Latonya is also employed with the Forestry Unit, Ministry of The Environment and Housing as Forest
    Supervisor.
