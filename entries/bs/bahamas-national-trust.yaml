  quote: 'During this trip, we piloted two technologies to help us with monitoring efforts: drones and
    motion sensor cameras.'
- claim: A November 2023 GCFI proceedings abstract says the Trust has adopted a small fleet of drones
    and used them to collect aerial imagery of several national parks for habitat monitoring.
