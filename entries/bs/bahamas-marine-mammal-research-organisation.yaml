summary: A small non-profit in Marsh Harbour, Abaco, which says it has documented
  marine mammals around The Bahamas since 1991, with over 5,000 sightings, the region's
  only long-term dataset of its kind.
facts:
- claim: Its own blog says it has documented marine mammal fauna around The Bahamas
    since 1991, with over 5,000 sightings, the only long-term marine mammal dataset
    in the region.
  url: https://bmmro.blogspot.com/p/about-us.html
  fetched: 2026-11-15
  quote: To date, we have had over 5,000 sightings in The Bahamas, providing the only
    long-term marine mammal dataset in the region.
- claim: The same page says the data are used for monitoring population trends and
    estimating abundance.
  url: https://bmmro.blogspot.com/p/about-us.html
  fetched: 2026-11-15
  quote: These data are being used to address conservation issues such as effects
    of noise, habitat needs and monitoring population trends and estimating abundance.
- claim: The page describes it as a small professional non-profit organisation, with
    a postal address in Marsh Harbour, Abaco.
  url: https://bmmro.blogspot.com/p/about-us.html
  fetched: 2026-11-15
  quote: To remain a small professional non-profit organisation, proportional to the
    needs of the Bahamas.
