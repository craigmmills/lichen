summary: Province Sud directorate that the 2025–2034 Grand Lagon Sud management plan names as main lead,
  in charge of 59 actions (87 per cent), including continued reef and seabird nesting site monitoring.
facts:
- claim: The 2025–2034 Grand Lagon Sud management plan says the DDDT is the main lead of the plan, in
    charge of 59 actions, 87 per cent of the action plan.
  url: https://www.province-sud.nc/wp-content/uploads/2026/07/Plan-de-gestion-GLS.pdf
  fetched: 2026-11-12
  quote: La DDDT est le pilote majeur de ce plan de gestion avec cinquante-neuf (59) actions (87 % du
    plan d’actions total) dont elle a la charge.
- claim: The plan gives the DDDT the action of continuing five-yearly monitoring of the reefs on the World
    Heritage list.
  url: https://www.province-sud.nc/wp-content/uploads/2026/07/Plan-de-gestion-GLS.pdf
  fetched: 2026-11-12
  quote: 2.1.3 Poursuivre le suivi quinquennal des récifs inscrits au patrimoine mondial 3 Parc DDDT (SGAP)
    CS
- claim: The plan gives the DDDT the action of continuing the monitoring of seabird nesting sites carried
    out by nature wardens on the Grand Lagon Sud islets.
  url: https://www.province-sud.nc/wp-content/uploads/2026/07/Plan-de-gestion-GLS.pdf
  fetched: 2026-11-12
  quote: 2.3.5 Poursuivre le suivi des sites de nidification des oiseaux marins réalisé par les gardes
