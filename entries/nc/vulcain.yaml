summary: Online fire map and dashboard built and run by OEIL, following the current
  year's fire impacts live, with a Vulcain Pro version for analyses on data back to
  2001 and an alert service.
facts:
- claim: An OEIL brochure says OEIL developed an online dynamic map called Vulcain
    for viewing current or past fires.
  url: https://oeil.nc/sites/default/files/pdf/Plaquettes/ESSENTIELS/N%C2%B004/PLAQUETTE%20INCENDIE%20PAGE%20A%20PAGE.pdf
  fetched: 2026-11-14
  quote: L’OEIL a mis au point une carte dynamique en ligne, dénommée Vulcain, permettant
    de visualiser les incendies
- claim: OEIL's press release of 14 December 2023 says the Vulcain dashboard follows
    the environmental impacts of the current year's fires live.
  url: https://oeil.nc/sites/default/files/pdf/Administratif/OEIL/Presse/231214_cp_oeil_point_impact_incendies_2023.pdf
  fetched: 2026-11-14
  quote: il permet de suivre en direct les impacts environnementaux des incendies
    de l’année en cours
- claim: The same release says Vulcain Pro lets users run their own analyses on data
    going back to 2001.
  url: https://oeil.nc/sites/default/files/pdf/Administratif/OEIL/Presse/231214_cp_oeil_point_impact_incendies_2023.pdf
  fetched: 2026-11-14
  quote: chacun peut faire ses propres analyses en explorant les données qui remontent
    jusqu’à 2001
- claim: The release gave first figures on the environmental impact of the 2023 fires
    drawn from Vulcain.
  url: https://oeil.nc/sites/default/files/pdf/Administratif/OEIL/Presse/231214_cp_oeil_point_impact_incendies_2023.pdf
  fetched: 2026-11-14
  quote: Voici les premières données sur l’impact environnemental des incendies 2023
    issus de Vulcain
- claim: OEIL's 2024 activity report names Vulcain, Vulcain Pro and the alert service.
  url: https://oeil.nc/sites/default/files/actualites/ra_2024_compresse.pdf
  fetched: 2026-11-14
  quote: Vulcain, Vulcain Pro et du service d’alertes
