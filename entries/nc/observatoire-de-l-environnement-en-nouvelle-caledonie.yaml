summary: Association under the 1901 law using satellites for fire reports and forest change, reporting
  274 fires detected by 31 October 2026 and announcing Kiwa-supported REPLANT'NC for revegetation data.
facts:
- claim: Its 2024 activity report says it took the legal form of an association under the law of 1901
    when it was created.
  url: https://oeil.nc/sites/default/files/actualites/ra_2024_compresse.pdf
  fetched: 2026-11-12
  quote: L ’Observatoire a adopté, lors de sa création, le statut d’association de loi 1901.
- claim: Reported 274 fires detected in New Caledonia by 31 October 2026 from the satellite observations
    it uses.
  url: https://www.oeil.nc
  fetched: 2026-11-12
  quote: Au 31 octobre 2026, 274 incendies ont été détectés en Nouvelle-Calédonie à partir des observations
    satellitaires utilisées par l'OEIL.
- claim: Publishes fire situation reports from VIIRS-SNPP and MODIS satellite data.
  url: https://www.oeil.nc
  fetched: 2026-11-12
  quote: L'OEIL publie son point de situation sur les incendies au 21 septembre 2026 à partir des données
    satellitaires VIIRS-SNPP et MODIS.
- claim: Its 2024 report describes work on forest loss and gain from global satellite data.
  url: https://oeil.nc/sites/default/files/actualites/ra_2024_compresse.pdf
  fetched: 2026-11-12
  quote: les dynamiques de perte et de gain forestiers à partir de données satellitaires mondiales et
    d’analyses croisées à l’échelle du territoire.
- claim: Its May 2015 brochure gave an address in Nouméa.
  url: https://oeil.nc/sites/default/files/pdf/Plaquettes/paquette_oeil_page_a_page.pdf
  fetched: 2026-11-12
  quote: 11 rue Guynemer - 98800 Nouméa
- claim: Announced the REPLANT'NC project, supported by the Kiwa Initiative, to centralise and analyse
    revegetation data in New Caledonia.
  url: https://www.oeil.nc
  fetched: 2026-11-12
  quote: Nous avons le plaisir de vous annoncer le lancement du projet REPLANT'NC, soutenu par la Kiwa
    Initiative !
