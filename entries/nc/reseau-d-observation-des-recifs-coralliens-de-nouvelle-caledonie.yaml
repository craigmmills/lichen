  quote: Il s'étend sur l'ensemble du territoire au travers plus de 100 points d'observation
    suivis annuellement par des bénévoles formés et encadrés par des scientifiques.
- claim: The page says the data will be updated every year to follow changes in the
    health of the reefs monitored.
  url: https://data.gouv.nc/explore/dataset/stations-de-suivi-du-reseau-dobservation-des-recifs-coralliens-rorc/
  fetched: 2026-11-14
  quote: Ces données seront actualisées tous les ans afin de prendre en compte les
    évolutions temporelles de l'état de santé des récifs suivis dans le cadre du RORC.
- claim: The page cites a 2024 monitoring campaign of the network.
  url: https://data.gouv.nc/explore/dataset/stations-de-suivi-du-reseau-dobservation-des-recifs-coralliens-rorc/
