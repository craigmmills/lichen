summary: A New Caledonian association monitoring and protecting loggerhead turtle
  nests at Bourail, which the Office français de la biodiversité says it added to
  Province Sud funding for and will support with nesting data work for three years.
facts:
- claim: The Office français de la biodiversité's New Caledonia page says it added
    to the Province Sud's funding for the association's monitoring and protection
    of loggerhead turtle nests at Bourail.
  url: https://ofb.gouv.fr/nouvelle-caledonie
  fetched: 2026-11-15
  quote: l’OFB est venu compléter le financement de la Province Sud pour le suivi
    et la protection des pontes de tortues Grosse tête (Caretta caretta) par l’association
    Bwara à Bourail
- claim: The same page says the OFB will support the collection and analysis of nesting
    data, among other work, for the next three years.
  url: https://ofb.gouv.fr/nouvelle-caledonie
