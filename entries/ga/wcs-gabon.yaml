summary: Active programme run by WCS, whose Gabon page describes Central African monitoring,
  including long-term work at Langoué Bai, and acoustic assessment of bais with the
  Elephant Listening Project.
facts:
- claim: WCS's Gabon page describes WCS monitoring programmes across Central Africa,
    including a long-term project at Langoué Bai in Gabon.
  url: https://gabon.wcs.org/en-us/Wild-Places/Gabons-Forests/Forest-Mammal-Monitoring.aspx
  fetched: 2026-11-12
  quote: WCS runs several bai monitoring programs in Central Africa, with the longest
    term projects at Langoué Bai in Gabon
- claim: With the Elephant Listening Project, acoustic techniques are used at bais,
    with the number of elephant calls recorded used to assess a bai's importance for
    elephants.
  url: https://gabon.wcs.org/en-us/Wild-Places/Gabons-Forests/Forest-Mammal-Monitoring.aspx
  fetched: 2026-11-12
  quote: In collaboration with the Elephant Listening Project , acoustic techniques
    are used as a complementary tool at bais.
- claim: WCS's Gabon page says WCS has worked with academic and conservation partners
    to improve ecological knowledge and develop standardised monitoring methods for
    forest mammals.
  url: https://gabon.wcs.org/en-us/Wild-Places/Gabons-Forests/Forest-Mammal-Monitoring.aspx
  fetched: 2026-11-12
  quote: WCS has striven to both improve our ecological knowledge of forest mammals
    and develop standardised monitoring methods.
