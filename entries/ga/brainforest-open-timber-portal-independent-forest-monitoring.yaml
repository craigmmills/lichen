summary: A Brainforest project, being implemented in June 2023, supports independent
  forest monitoring through the Open Timber portal, with a June 2023 workshop aiming
  to adopt an observation strategy and set up a report review committee in Gabon.
facts:
- claim: In June 2023, Brainforest was implementing the project ‘Soutenir la surveillance
    indépendante des forêts via le portail Open Timber’, and had held a multi-stakeholder
    workshop on independent forest observation in July 2022.
  url: https://www.gabonreview.com/observation-independante-des-forets-validation-de-la-strategie-de-la-societe-civile-et-relecture-des-rapports/
  fetched: 2026-11-15
  quote: Acteur de la gouvernance forestière promouvant l’observation indépendante
    des forêts à travers la mise en œuvre du projet «Soutenir la surveillance indépendante
    des forêts via le portail Open Timber»
- claim: A workshop on 12–13 June 2023 aimed to adopt the independent forest observation
    strategy and set up a committee to review reports of observation missions in Gabon.
  url: https://www.gabonreview.com/observation-independante-des-forets-validation-de-la-strategie-de-la-societe-civile-et-relecture-des-rapports/
  fetched: 2026-11-15
  quote: l’idée était d’adopter la version finale de ladite stratégie et mettre en
    place un comité de relecture des rapports de missions d’observation indépendante
    menées au Gabon.
- claim: Brainforest says the relevance of the data collected is checked with a quality
    tool (VQM-OI).
  url: https://www.gabonreview.com/observation-independante-des-forets-validation-de-la-strategie-de-la-societe-civile-et-relecture-des-rapports/
  fetched: 2026-11-15
  quote: La pertinence des données collectées, indique Brainforest, est vérifiée par
    un outil de qualité (VQM-OI).
