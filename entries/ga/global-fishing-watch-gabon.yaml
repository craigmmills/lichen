summary: A collaboration run by Global Fishing Watch with Gabon since 2020, including a June 2025 memorandum
  of understanding on sharing fisheries data for monitoring, control and surveillance.
facts:
- claim: The collaboration began in 2020 with demonstrations of Global Fishing Watch tools.
  url: https://globalfishingwatch.org/our-work-in-gabon
  fetched: 2026-11-08
  quote: Our collaboration with Gabon began in 2020 with a series of demonstrations highlighting our innovative
    tools
- claim: Global Fishing Watch and Gabon signed a memorandum of understanding in June 2025 on monitoring,
    control and surveillance through the sharing of fisheries data.
  url: https://globalfishingwatch.org/our-work-in-gabon
  fetched: 2026-11-08
  quote: In June 2025, Global Fishing Watch and Gabon signed a memorandum of understanding that lays the
    groundwork for accelerating initiatives aimed at improving the monitoring, control and surveillance
    (MCS) of the country's vast marine resources through the sharing of fisheries data.
- claim: Global Fishing Watch says it is involved in revising the management plans of Gabon's more than
    20 marine protected areas.
  url: https://globalfishingwatch.org/our-work-in-gabon
  fetched: 2026-11-08
  quote: Gabon is revising the management plans for its more than 20 MPAs, and we are actively involved
    in this process.
