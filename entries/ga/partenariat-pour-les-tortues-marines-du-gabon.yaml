summary: A Gabonese sea turtle conservation network that WCS says it created with governmental and non-governmental
  partners since 2005, monitoring conservation status through research along the whole coastline.
facts:
- claim: WCS says that since 2005 it has worked with governmental and non-governmental organisations in
    Gabon to create the partnership.
  url: https://gabon.wcs.org/en-us/wildplaces/gabonscoastocean/turtleconservation.aspx
  fetched: 2026-11-08
  quote: Since 2005, WCS has partnered with several governmental and non-governmental organisations present
    in Gabon to create the Partenariat pour les Tortues Marines du Gabon (Gabon Marine Turtle Partnership).
- claim: Members include the national parks agency, the fisheries bureau, CNDIO/CENAREST, WWF, Ibonga,
    Manga, Fondation Liambissi and Aventures Sans Frontières.
  url: https://gabon.wcs.org/en-us/wildplaces/gabonscoastocean/turtleconservation.aspx
  fetched: 2026-11-08
  quote: This network includes government authorities, such as the National Parks Agency , the General
    Bureau for Fisheries, the National Centre for Oceanographic Data and Information-CNDIO/CENAREST, and
    NGOs such as WWF, Ibonga , Manga, Fondation Liambissi and Avèntures Sans Frontières.
- claim: The network works to address threats to sea turtles and monitor their conservation status, with
    research activities along the whole coastline.
  url: https://gabon.wcs.org/en-us/wildplaces/gabonscoastocean/turtleconservation.aspx
  fetched: 2026-11-08
  quote: a formidable network is working synergistically to address the threats and monitor the conservation
    status of these iconic species.
