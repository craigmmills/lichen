summary: A research institute created in 1985 and run by CENAREST, which studies Gabon's ecosystems and,
  CAFI reports, now monitors 24 forest plots transferred from Duke University.
facts:
- claim: Gabonreview names Donald Midoko Iponga as director of IRET, explaining Pl@ntNet at the May 2025
    training.
  url: https://www.gabonreview.com/plntnet-au-coeur-de-la-foret-gabonaise-une-application-pour-reconnaitre-les-plantes-et-impliquer-les-citoyens/
  fetched: 2026-11-08
  quote: a expliqué le Pr Donald Midoko Iponga, directeur de l'Institut de recherche en écologie tropicale
    (IRET).
- claim: Created on 25 November 1985, it studies how ecosystems work in Gabon and has four departments,
    two laboratories and two research stations.
  url: https://cenarest-gabon.org/iret/
  fetched: 2026-11-08
  quote: L’IRET est un organisme de recherche spécialisé dans l’étude du fonctionnement global des écosystèmes
    en milieu gabonais. Il regroupe quatre(4) départements, deux laboratoires et deux stations de recherche.
- claim: One Forest Vision says the October 2026 Libreville training on DeepForestVision and DeepForestSound
    was co-organised by the MNHN and CENAREST through IRET.
  url: https://www.oneforestvision.org
  fetched: 2026-11-08
  quote: Coorganisée par le Muséum national d’Histoire naturelle (MNHN) et le CENAREST, à travers l’Institut
    de recherche en écologie tropicale (IRET)
- claim: CAFI reports that 24 forest plots from Duke University were transferred to IRET and are now monitored,
    and that historical transects at Ipassa have been restored.
  url: https://cafi.org/project/gabon-forest-ecosystem-research-and-monitoring/
  fetched: 2026-11-08
  quote: Historical transects at Ipassa have been restored, and new monitoring methods are being developed.
    Additionally, 24 forest plots from Duke University were officially transferred to IRET and are now
    being monitored.
