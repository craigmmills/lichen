summary: A closed national survey that reported in November 2021 an estimate of 95,000 forest elephants
  in Gabon, based on 4,058 dung samples from 18 sites, and used ANPN's genetics laboratory.
facts:
- claim: The survey reported in November 2021 estimated 95,000 forest elephants in Gabon, about 60 to
    70 per cent of the remaining population.
  url: https://gabonmediatime.com/gabon-95-000-elephants-de-foret-recenses-par-conservation-society/
  fetched: 2026-11-08
  quote: l’étude, menée par WCS, l’ANPN et Vulcan révèle que 95 000 éléphants vivent dans la forêt gabonaise.
- claim: The team covered 8,285 km and collected 4,058 dung samples at 18 sites across Gabon.
  url: https://gabonmediatime.com/gabon-95-000-elephants-de-foret-recenses-par-conservation-society/
  fetched: 2026-11-08
  quote: l'équipe a parcouru 8 285 km et collecté un total de 4 058 échantillons de crottes sur 18 sites
    à travers le Gabon.
- claim: ANPN's executive secretary at the time, Christian Tchemambela, said its teams had developed more
    reliable methods in its genetics laboratory.
  url: https://gabonmediatime.com/gabon-95-000-elephants-de-foret-recenses-par-conservation-society/
  fetched: 2026-11-08
  quote: Nos équipes ont développé des méthodes plus fiables, notamment dans notre laboratoire de génétique.
