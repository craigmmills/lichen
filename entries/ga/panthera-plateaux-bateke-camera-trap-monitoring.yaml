summary: A Panthera-run camera-trap programme in Plateaux Batéké National Park, which
  Panthera says showed a 99.5% fall in poacher capture rates between 2001-2003 and
  2017-2018, alongside a 2020–2022 lion restoration project.
facts:
- claim: Panthera says camera-trap data showed a 99.5% fall in poacher capture rates
    and steep increases in photographic rates for larger wildlife between 2001-2003
    and 2017-2018.
  url: https://panthera.org/blog-post/charting-new-territory-lions-gabon
  fetched: 2026-11-12
  quote: The camera trap data from those past surveys and today reveal a decrease
    of poacher capture rates of 99.5%
- claim: In September 2020, Panthera reported that its camera-trap monitoring showed
    the lone male lion first recorded in 2015 had taken up residency in the park.
  url: https://panthera.org/blog-post/charting-new-territory-lions-gabon
  fetched: 2026-11-12
  quote: Our camera trap monitoring established that the lone male lion first recorded
    in 2015 has since then taken up residency in the park.
- claim: IUCN SOS lists a related 2020–2022 project to restore lions and other large
    carnivores in the Batéké landscape, implemented by Panthera.
  url: https://iucnsos.org/projects/restoring-lions-and-other-large-carnivores-in-the-bateke-landscape/
  fetched: 2026-11-12
  quote: This project is implemented by Panthera.
