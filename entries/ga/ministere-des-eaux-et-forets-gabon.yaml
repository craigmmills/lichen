summary: Gabon's ministry for water, forests and the environment, which supervises and coordinates public
  policy on those areas and organised the launch of data collection for the seventh CBD national report
  in February 2026.
facts:
- claim: In July 2026 the minister of this portfolio, Maurice Ntossui Allogo, opened the national workshop
    to validate Gabon's national biodiversity strategy and action plan.
  url: https://www.gabonreview.com/maurice-ntossui-allogo-mobilise-les-acteurs-autour-dune-nouvelle-vision-pour-la-biodiversite-gabonaise/
  fetched: 2026-11-08
  quote: Le ministre des Eaux et Forêts, de l'Environnement, du Climat chargé du Conflit Homme-Faune,
    Maurice Ntossui Allogo, a présidé ce lundi 20 juillet 2026 l'ouverture de l'atelier national de validation
    de la Stratégie et du Plan d'action nationaux pour la biodiversité (SPANB).
- claim: The ministry organised the launch of data collection for Gabon's seventh national report to the
    CBD on 10 February 2026, assessing Gabon's contribution to the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://www.gabonreview.com/biodiversite-le-gabon-lance-la-collecte-des-donnees-pour-son-7e-rapport-national-a-la-cdb/
  fetched: 2026-11-08
  quote: Le Ministère des Eaux et Forêts a organisé, ce 10 février 2026, l'atelier de lancement de la
    collecte des données destinées au 7e rapport national sur la Convention sur la d iversité b iologique
    (CDB).
- claim: In October 2023 ATIBT reported a ministerial order directing Gabon’s whole forest sector to transition
    to the national timber traceability system within six months.
  url: https://www.atibt.org/en/news/13392/in-gabon-tracked-trees-transparent-forests-stresses-the-environmental-investigation-agency-eia
  fetched: 2026-11-08
  quote: through Ministerial Order
- claim: Its stated mission is to supervise and coordinate public policy on water, the environment, forests,
    wildlife and the sustainable management of water and forest resources.
  url: https://eaux-forets.gouv.ga/etablissements-services-et-organismes-sous-tutelles/
  fetched: 2026-11-08
  quote: 'a pour Mission générale : Superviser et coordonner les politiques publiques relatives à l’eau,
    à l’environnement, à la forêt, à la faune et à la gestion durable des ressources hydriques et forestières'
- claim: Lists the Agence Nationale des Parcs Nationaux and the Agence Gabonaise d'Etudes et d'Observations
    Spatiales among the bodies under its supervision.
  url: https://eaux-forets.gouv.ga/etablissements-services-et-organismes-sous-tutelles/
