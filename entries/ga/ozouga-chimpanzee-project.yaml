summary: An active study of a chimpanzee population in Gabon's rainforest since 2005,
  using camera traps shared with Chimp&See and faecal genetics that identified seven
  communities, led by Simone Pika and Tobias Deschner.
facts:
- claim: Has studied a chimpanzee population in Gabon's rainforest since 2005.
  url: https://en.ozouga.org/
  fetched: 2026-11-12
  quote: We have been conducting research on a chimpanzee population in the Central
    African rainforest of Gabon since 2005.
- claim: Uses camera traps for biomonitoring and made its recordings available to
    the Pan African Programme and the Chimp&See citizen science platform.
  url: https://en.ozouga.org/
  fetched: 2026-11-12
  quote: 'Recordings of our camera traps were as well made available to the Pan African
    Programme: The Cultured Chimpanzee ( PanAF ) and analyzed by citizen scientists
    on the Chimp&See platform.'
- claim: Used faecal samples for the first population genetic study in the area, identifying
    seven chimpanzee communities.
  url: https://en.ozouga.org/
  fetched: 2026-11-12
  quote: We used fecal samples to conduct the first population genetic study in our
    study area.
- claim: Led by Simone Pika of the University of Osnabrück and Tobias Deschner.
  url: https://en.ozouga.org/
  fetched: 2026-11-12
  quote: The project is led by Prof. Dr. Simone Pika employed at the University of
    Osnabrück and Dr. Tobias Deschner.
