summary: A five-week DLR-led airborne measurement campaign in Gabon, reported complete
  in August 2023, flew seven tropical rainforest areas and built on AfriSAR flights
  from 2016 to compare biomass loss or regrowth.
facts:
- claim: A DLR team initiated the five-week GABONX measurement campaign in Gabon,
    which DLR reported as completed in August 2023.
  url: https://www.dlr.de/en/latest/news/2023/03/studying-rainforests-from-the-skies-radar-technology-measures-biomass
  fetched: 2026-11-15
  quote: a research team from DLR Oberpfaffenhofen initiated the five-week GABONX
    measurement campaign, which has now been successfully completed in Gabon, Central
    Africa.
- claim: Its daily measurement flights covered seven tropical rainforest areas.
  url: https://www.dlr.de/en/latest/news/2023/03/studying-rainforests-from-the-skies-radar-technology-measures-biomass
  fetched: 2026-11-15
  quote: The daily measurement flights of GABONX covered a total of seven areas, each
    with different tropical rainforest characteristics.
- claim: The team had flown over most of the GABONX measurement areas during AfriSAR
    in 2016 and created new comparative images to show biomass loss or regrowth.
  url: https://www.dlr.de/en/latest/news/2023/03/studying-rainforests-from-the-skies-radar-technology-measures-biomass
  fetched: 2026-11-15
  quote: These data sets are valuable because, among other things, they provide information
    about how much biomass has been lost or regrown.
