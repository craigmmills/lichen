summary: A pilot public atlas of Gabon's forest sector, described by WRI in 2009,
  which WRI reported in 2012 was combining forestry, mining and conservation land-use
  data under two ministries.
facts:
- claim: In June 2009, WRI described the atlas as a pilot information management tool
    and decision aid containing publicly accessible, up-to-date and harmonised information
    on Gabon's forest sector.
  url: https://www.wri.org/data/interactive-forest-atlas-gabon-atlas-forestier-interactif-du-gabon
  fetched: 2026-11-12
  quote: It contains for the first time in a publicly accessible, user-friendly format,
    up-to-date and harmonized information on the Gabonese forest sector.
- claim: In April 2012, WRI reported that Gabon was combining forestry, mining and
    conservation land-use data into a single public atlas, in an initiative led by
    the Ministry of Mines, Petroleum, and Hydrocarbons with the Ministry of Water
    and Forests.
  url: https://www.wri.org/outcomes/new-open-approach-resource-management-gabon
  fetched: 2026-11-12
  quote: the Ministry of Mines, Petroleum, and Hydrocarbons led the initiative in
    collaboration with the Ministry of Water and Forests.
