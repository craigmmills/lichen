summary: A Nature Conservancy drone survey of 30 wetland transects in and outside
  the Bas-Ogooué Ramsar site, reported in September 2016, gathered 2-centimetre imagery
  to identify 15 habitat types for checking NASA radar data.
facts:
- claim: In a September 2016 report, a Nature Conservancy team had flown drone missions
    over 30 wetland transects in and outside the Bas-Ogooué Ramsar site, collecting
    2-centimetre resolution imagery.
  url: https://blog.nature.org/2016/09/27/flight-over-the-bas-ogooue-using-drones-to-map-gabons-wetlands/
  fetched: 2026-11-15
  quote: They used a 3DR Solo drone equipped with an Sony QX1 camera and a GoPro to
    collect 2-centimeter resolution imagery from 30 wetland transects in and outside
    of the Ramsar site.
- claim: A Conservancy freshwater scientist identified 15 wetland habitat types on
    the drone imagery, to be used to recognise each habitat on NASA radar data.
  url: https://blog.nature.org/2016/09/27/flight-over-the-bas-ogooue-using-drones-to-map-gabons-wetlands/
  fetched: 2026-11-15
  quote: Next, Conservancy freshwater scientist Allison Aldous identified 15 different
    types of wetland habitats on the drone imagery
- claim: NASA collected radar data of coastal Gabon, and the drone data provided the
    field data to verify wetland types on it.
  url: https://blog.nature.org/2016/09/27/flight-over-the-bas-ogooue-using-drones-to-map-gabons-wetlands/
  fetched: 2026-11-15
  quote: But what no one had was the field data to verify the wetland types on the
    radar data. This is where the drones came in.
