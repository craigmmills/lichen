summary: A long-term western gorilla study in Loango National Park begun in 2005 by
  Martha Robbins of the Max Planck Institute, whose field site added camera traps
  in 2009, including 45 traps over 60 km² in 2009 to 2010.
facts:
- claim: Martha Robbins of the Max Planck Institute for Evolutionary Anthropology
    began the long-term project on western gorillas in Loango National Park in 2005,
    studying one habituated group.
  url: https://www.eva.mpg.de/primat/staff/martha-robbins
  fetched: 2026-11-15
  quote: In 2005, I began a long-term project of western gorillas in Loango National
    Park, Gabon, where we are studying one group of habituated western gorillas.
- claim: An article by Josephine Head, Martha M. Robbins and colleagues, summarising
    their 2013 Ecology and Evolution paper, names the authors of the Loango field
    site's camera-trap study.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/using-remote-video-camera-traps-for-multi-species-assessments-in-gabon/
  fetched: 2026-11-15
  quote: Josephine Head, Christophe Boesch, Martha M. Robbins, Luisa Rabanal, Loïc
    Makaga and Hjalmar Kühl
- claim: The authors' Loango field site, set up in 2005, began using remote video
    camera traps in 2009 to monitor gorillas, chimpanzees and other mammals in the
    park.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/using-remote-video-camera-traps-for-multi-species-assessments-in-gabon/
  fetched: 2026-11-15
  quote: In 2009 we began using remote video camera traps to monitor these and other
    mammal species within the park.
- claim: From 2009 to 2010, 45 camera traps in a 1 km² grid over 60 km² were used
    to estimate densities with spatially explicit capture-recapture.
  url: https://www.berggorilla.org/en/home/news-archive/article-view/using-remote-video-camera-traps-for-multi-species-assessments-in-gabon/
  fetched: 2026-11-15
  quote: From 2009-2010 we set up 45 remote camera traps in a systematic 1 km² grid
    covering an area of 60 km².
