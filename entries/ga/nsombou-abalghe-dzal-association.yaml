summary: A local NGO supporting about twenty villages in Ogooué-Ivindo with sustainable
  hunting management, which installed camera traps in the Massaha area in 2023 and
  supports the Massaha community's proposed 11,300-hectare conserved area.
facts:
- claim: A Pulitzer Center article describes NADA as a local NGO supporting about
    twenty villages in Ogooué-Ivindo in sustainable hunting management.
  url: https://pulitzercenter.org/fr/node/29329
  fetched: 2026-11-15
  quote: En Ogooué-Ivindo, une vingtaine de village est engagée dans la gestion durable
    de la chasse avec l'appui d'une ONG locales appelée NADA.
- claim: RRI shows camera traps installed by NADA in the Massaha area in 2023.
  url: https://rightsandresources.org/blog/in-gabon-massaha-communities-make-a-case-for-community-led-conservation/
  fetched: 2026-11-15
  quote: 'Source: Surveillance cameras installed by NADA in the Massaha area of Gabon,
    2023.'
- claim: After data collection, Massaha and NADA staff consulted the government, followed
    by participatory mapping of the Massaha territories.
  url: https://rightsandresources.org/blog/in-gabon-massaha-communities-make-a-case-for-community-led-conservation/
  fetched: 2026-11-15
  quote: These consultations were followed by participatory mapping of the Massaha
    territories
- claim: In October 2024, RRI reported that, with NADA and RRI support, the Massaha
    community was proposing an 11,300-hectare community conserved area south of the
    Liboumba River and the Massaha Community Forest.
  url: https://rightsandresources.org/blog/in-gabon-massaha-communities-make-a-case-for-community-led-conservation/
  fetched: 2026-11-15
  quote: With support from the Nsombou Abalghe-Dzal Association (NADA) and the Rights
    and Resources Initiative (RRI), the community is proposing to create and legally
    manage a new conserved area spanning 11,300 hectares
- claim: RRI's October 2024 report identifies monitoring illegal logging on community
    lands as a next step for the Massaha communities and NADA.
  url: https://rightsandresources.org/blog/in-gabon-massaha-communities-make-a-case-for-community-led-conservation/
  fetched: 2026-11-15
  quote: this includes monitoring illegal logging activities by companies no longer
    permitted on community lands
