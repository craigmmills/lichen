summary: Gabon's national herbarium, created in 1984 within a CENAREST institute, which publishes six
  GBIF datasets including the Gabon Vascular Plant Occurrences dataset under CC BY 4.0.
facts:
- claim: Created in 1984 as a reference herbarium within IPHAMETRA, an institute of CENAREST, in Libreville
    (BP 1156).
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f
  fetched: 2026-11-08
  quote: Herbarium of Gabon was created in 1984 as a reference herbarium within Institut de Pharmacopée
    et de Médecine Traditionnelle (IPHAMETRA), one of the institutes of Centre National de la Recherche
    Scientifique et Technique (CENAREST).
- claim: Publishes Gabon Vascular Plant Occurrences, a national dataset of occurrences from its herbarium
    collections, under CC BY 4.0, mobilised through the BID-AF2020-194-USE project.
  url: https://api.gbif.org/v1/dataset/44d6b38d-af49-470a-b03c-438b636d947b
  fetched: 2026-11-08
  quote: The National Herbarium of Gabon, through the BID-AF2020-194-USE project, has enabled data mobilization
    of these collections.
- claim: Gabonreview reports that ecologists certified a sample of the Eramet-Comilog pilot's data with
    the support of the Herbier national du Gabon, for species identification and model training.
  url: https://www.gabonreview.com/eramet-comilog-drones-satellites-et-ia-le-google-earth-de-la-biodiversite-debarque-au-gabon/
  fetched: 2026-11-08
  quote: La robustesse scientifique du dispositif a été renforcée par la certification d'un échantillon
    de données par des écologues, avec l'appui de l'Herbier national du Gabon.
- claim: GBIF's publisher record gives its goal as studying the floristic diversity of Gabon through botanical
    collecting.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f
  fetched: 2026-11-08
  quote: Its goal is to study the floristic diversity in Gabon through botanical collects and to preserve
    this biodiversity in the form of herbarium sheets.
- claim: GBIF's publisher record shows six published datasets.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f
  fetched: 2026-11-08
  quote: '"numPublishedDatasets":6'
- claim: GBIF's publisher record gives the identifier of the GBIF-funded project it is associated with
    as BID-AF2015-0038-NAC.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f
  fetched: 2026-11-08
  quote: 'Project identifier: BID-AF2015-0038-NAC'
- claim: The GBIF publisher record says the herbarium was created in 1984 as a reference herbarium within
    IPHAMETRA, one of the institutes of CENAREST, and later became the Herbier National du Gabon.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f
  fetched: '2026-11-08'
  quote: Herbarium of Gabon was created in 1984 as a reference herbarium within Institut de Pharmacopée
    et de Médecine Traditionnelle (IPHAMETRA)
- claim: Publishes on GBIF a dataset of botanical specimens from Gabon.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f/publishedDataset
  fetched: '2026-11-08'
  quote: The Herbier National du Gabon dataset contains botanical specimens from Gabon
- claim: Publishes a sampling-event dataset on vegetation and forest dynamics across areas of Gabon from
    2000 to 2018.
  url: https://api.gbif.org/v1/organization/90a628e5-440e-43b6-9c8d-64a5bfafb39f/publishedDataset
  fetched: '2026-11-08'
  quote: Vegetation assessment and forest dynamic study of various areas in Gabon from 2000 to 2018
- claim: Through the BID-AF2020-194-USE project it mobilised data from its herbarium collections, published
    as the Gabon Vascular Plant Occurrences dataset.
  url: https://api.gbif.org/v1/dataset/44d6b38d-af49-470a-b03c-438b636d947b
  fetched: '2026-11-08'
  quote: The National Herbarium of Gabon, through the BID-AF2020-194-USE project, has enabled data mobilization
    of these collections
