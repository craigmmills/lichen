summary: Gabon's national parks agency, which runs a wildlife genetics laboratory, uses Skylight and EarthRanger,
  and is reported to have worked with partners on AI wildlife monitoring and camera trap and acoustic
  deployments.
facts:
- claim: Rainforest Trust describes ANPN as the agency for Gabon's protected area system, committed to
    basing conservation on scientific data.
  url: https://rainforesttrust.org/agence-nationauxnale-des-parcs-anpn
  fetched: 2026-11-08
  quote: Gabon's system of protected areas covers over 11% of the country's territory, and the Agence
    Nationale des Parcs Nationaux (ANPN) is committed to basing conservation action on high quality scientific
    data.
- claim: In March 2021 Gabonreview reported that ANPN had opened an operational wildlife genetics laboratory,
    intended to analyse DNA from ivory, hair, scales and faeces.
  url: https://www.gabonreview.com/criminalite-faunique-lanpn-sequipe-dun-laboratoire-de-genetique-de-la-faune/
  fetched: 2026-11-08
  quote: Ce laboratoire permettra d'analyser les échantillons d'ADN prélevés auprès de la faune locale,
    tels que l'ivoire, les poils, les écailles ou encore les fèces.
- claim: Skylight reported that it had supported ANPN in tracking fishing activity for the preceding four
    years, alerting Gabonese maritime analysts when a vessel entered an area of interest.
  url: https://skylight.global/news/stories-from-the-field-protecting-the-biggest-marine-national-park-system-in-africa
  fetched: 2026-11-08
  quote: Over the past four years, Skylight has been supporting ANPN's ability to better track fishing
    activites. Any time a vessel enters an area of interest, the platform alerts Gabonese maritime analysts.
- claim: In April 2021 Gabonreview reported that a team including ANPN, Stirling, Panthera and Appsilon
    researchers had designed AI algorithms for wildlife monitoring in Central Africa; it misnamed ANPN
    as the Agence nationale pour la protection de la nature.
  url: https://www.gabonreview.com/suivi-de-la-faune-le-gabon-mise-sur-lintelligence-artificielle
  fetched: 2026-11-08
  quote: Une équipe composée de chercheurs de l'Agence nationale pour la protection de la nature (ANPN),
    Panthera Corp de l'Université de Stirling et Appsilon Machine Learning Solutions, a conçu de puissants
    algorithmes d'intelligence artificielle
- claim: Hack the Planet describes it as Gabon's national parks authority and says it deploys AI camera
    traps and acoustic monitoring across the agency's rainforest network in collaboration with its teams.
  url: https://www.hack-the-planet.io/partners/
  fetched: 2026-11-08
  quote: Gabon's national parks authority. We deploy AI camera traps and acoustic monitoring across their
    rainforest network in close collaboration with their teams.
- claim: Listed by the Ministry of Water and Forests among the bodies under its supervision.
  url: https://eaux-forets.gouv.ga/etablissements-services-et-organismes-sous-tutelles/
  fetched: 2026-11-08
  quote: Agence Nationale des Parcs Nationaux (ANPN) Agence Nationale Des Parcs Nationaux Du Gabon
- claim: Appsilon says that in 2020 it contributed to biodiversity conservation work at the agency, with
    University of Stirling researchers, support from Panthera and funding from the Google for Education
    fund.
  url: https://appsilon.com/gabon-wildlife-ai-for-biodiversity-conservation/
  fetched: 2026-11-08
  quote: In 2020, Appsilon was given the opportunity to contribute to biodiversity conservation efforts
    at the National Parks Agency in Gabon.
- claim: Gabon’s national biodiversity clearing-house page gives parcsgabon.org as ANPN’s website.
  url: https://ga.chm-cbd.net/en/national-agency-national-parks-anpn
  fetched: 2026-11-08
  quote: National Agency for National Parks (ANPN)
- claim: The DeepForestVision paper thanks ANPN, among others, for authorisations and access to its study
    sites in Gabon.
  url: https://arxiv.org/html/2606.20223
  fetched: 2026-11-08
  quote: In Gabon, the authors thank ANPN, CENAREST, PWG-CEB, Station d’Etudes des Gorilles et Chimpanzés,
    and Lopé National Park for authorizations and access to the study sites
- claim: CAFI reports joint workshops between ANPN and IRET to align monitoring between the Lopé and Ipassa
    research sites, under its Forest Ecosystem Research and Monitoring project.
  url: https://cafi.org/project/gabon-forest-ecosystem-research-and-monitoring/
  fetched: 2026-11-08
  quote: two joint workshops were held between ANPN and IRET, and helped align monitoring efforts between
    the Lopé and Ipassa sites.
