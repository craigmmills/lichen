summary: Gabon's publicly funded space agency in Libreville, set up in 2010 to collect and analyse Earth
  observation data, which maintains a USGS Landsat ground station and completed a 2018 forest cover map.
facts:
- claim: A fully public institution funded by the state, located in Libreville and driving Gabon's space
    programme.
  url: https://spaceinafrica.com/2020/08/28/ageos-is-driving-the-development-of-gabons-national-space-policy-and-its-first-satellite/
  fetched: 2026-11-08
  quote: AGEOS is a fully public institution, and its budget comes from the state.
- claim: Its mission is to implement government policy on the acquisition, processing and analysis of
    Earth observation data for environmental management and natural resources.
  url: https://spaceinafrica.com/2020/08/28/ageos-is-driving-the-development-of-gabons-national-space-policy-and-its-first-satellite/
  fetched: 2026-11-08
  quote: AGEOS main mission is to implement the government's policy regarding the acquisition, processing
    and analysis of EO data for the sustainable development, environmental management, natural resources
- claim: Maintains a USGS Landsat ground station in Libreville and completed a map of Gabon's forest cover
    in 2018.
  url: https://spaceinafrica.com/2020/08/28/ageos-is-driving-the-development-of-gabons-national-space-policy-and-its-first-satellite/
  fetched: 2026-11-08
  quote: The agency maintains a USGS Landsat ground station in Libreville and in 2018, AGEOS completed
    the mapping of Gabon's forest cover
- claim: In 2022 AGEOS analysed results from an automatic disturbance detection chain; weekly meetings
    with CLS reviewed progress under SNORNF.
  url: https://mptf.undp.org/sites/default/files/documents/2023-09/2022_annual_report_cga_1224_cafi-gabon-rapport_annuel_2022_at_et_suivi_des_forets_afd.pdf
  fetched: 2026-11-08
  quote: l'AGEOS a procédé à des analyses des résultats de la chaîne de détection automatique des perturbations
- claim: Named in the December 2024 agreement on Forest Foresight as one of the bodies that will supply
    technical data to the system.
  url: https://www.gabonreview.com/deforestation-et-ia-le-gabon-deploie-son-garde-forestier-virtuel-avec-forest-foresight
  fetched: 2026-11-08
  quote: Ces entités fourniront les données techniques nécessaires au bon fonctionnement du Forest Foresight.
- claim: Its mission is to collect, analyse and make available satellite observation data of the national
    territory for the sustainable management of the environment, natural resources and land use.
  url: https://economie-numerique.gouv.ga/agence-gabonaise-detudes-et-dobservations-spatiales/
  fetched: 2026-11-08
  quote: de collecte, d’analyse et de mise à disposition des données de l’observation spatiale du territoire
    national pour la gestion durable de l’environnement, des ressources naturelles, de l’occupation des
    sols
- claim: Charged with evaluating and steering the SEAS-Gabon project, a satellite receiving antenna and
    a remote sensing and environmental monitoring centre, for the government.
  url: https://economie-numerique.gouv.ga/agence-gabonaise-detudes-et-dobservations-spatiales/
  fetched: 2026-11-08
  quote: d’assurer pour le compte du Gouvernement, l’évaluation et le pilotage du projet SEAS-Gabon d’installation
    d’une antenne de réception satellitaire et de la construction d’un centre de télédétection et de suivi
    de l’environnement
- claim: Established by an ordinance of 25 February 2010, ratified by Law 025/2010.
  url: https://economie-numerique.gouv.ga/agence-gabonaise-detudes-et-dobservations-spatiales/
  fetched: 2026-11-08
  quote: Loi N° 025/2010 du 27/07/2010 portant ratification de l’ordonnance n°002/PR/2010 du 25 février
    2010
- claim: Listed by the Ministry of Water and Forests among the bodies under its supervision.
  url: https://eaux-forets.gouv.ga/etablissements-services-et-organismes-sous-tutelles/
  fetched: 2026-11-08
  quote: Agence Gabonaise d’Etudes et d’Observations Spatiales (AGEOS)
