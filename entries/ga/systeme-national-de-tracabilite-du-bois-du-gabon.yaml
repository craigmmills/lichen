summary: Gabon's national timber traceability system, built by EIA and Code4Nature, which ATIBT reported
  in October 2023 had to be adopted by the whole forest sector within six months.
facts:
- claim: The system aims to make forest data electronically available to the public and track all timber
    products from stump to port; logging and wood processing companies were given six months to adopt
    it.
  url: https://www.atibt.org/en/news/13392/in-gabon-tracked-trees-transparent-forests-stresses-the-environmental-investigation-agency-eia
  fetched: 2026-11-08
  quote: The new national system aims to generate and make key forest data electronically available to
    the public and track all timber products from the stump to the port.
- claim: ATIBT reported in October 2023 that companies would record each supply-chain step in the SNTBG
    Android app; managers and officials could use its web application and geoportal.
  url: https://www.atibt.org/en/news/13392/in-gabon-tracked-trees-transparent-forests-stresses-the-environmental-investigation-agency-eia
  fetched: 2026-11-08
  quote: Company managers and government officials can manage their operations through the SNTBG Web Application
    and Geoportal.
- claim: Ministerial Order 001 required the whole forest sector to adopt the system within six months,
    according to ATIBT in October 2023.
  url: https://www.atibt.org/en/news/13392/in-gabon-tracked-trees-transparent-forests-stresses-the-environmental-investigation-agency-eia
  fetched: 2026-11-08
  quote: through Ministerial Order
