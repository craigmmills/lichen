  of forest degradation risk (MORIDEF, 2013 to 2014) and mangrove monitoring and modelling.
facts:
- claim: Part of the Department of Geographical, Environmental and Marine Sciences
    of Université Omar Bongo.
  url: https://lagrac.ga/
  fetched: 2026-11-12
  quote: Département des Sciences Géographiques, Environnementales et Marines, Faculté
    des Lettres et Sciences Humaines, Université Omar Bongo.
- claim: Its funded projects included MORIDEF in 2013–2014, monitoring changes and
    diagnosing the risk of forest ecosystem degradation by remote sensing.
  url: https://lagrac.ga/axe-recherche/
  fetched: 2026-11-12
  quote: Suivi des MOdifications du milieu et diagnostic du RIsque de Dégradation
    des Ecosystèmes Forestiers par télédétection et spatialisation d’indicateurs (MORIDEF)
- claim: Its funded projects included developing a platform for characterising and
    monitoring Gabon's mangroves, SUMAG-1, listed for 2023–2025 and begun in September
    2023.
  url: https://lagrac.ga/axe-recherche/
  fetched: 2026-11-12
  quote: Développement d’une plateforme de caractérisation et de suivi des mangroves
    du Gabon (SUMAG-1)
- claim: Its funded projects included modelling the dynamics of the mangroves of Libreville
    and their degradation risks in 2017–2018.
  url: https://lagrac.ga/axe-recherche/
  fetched: 2026-11-12
  quote: Modélisation de la Dynamique des Mangroves de Libreville et ses Environs
    et des Risques de leur Dégradation (MDMLERD)
