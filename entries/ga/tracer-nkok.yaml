summary: A dormant due diligence service on log suppliers to the Nkok special economic zone, in place
  since October 2018, whose activities the forest administration ordered suspended on 7 March 2023.
facts:
- claim: A due diligence service on log suppliers to the Nkok special economic zone, in place since October
    2018, commissioned by GSEZ.
  url: https://www.atibt.org/files/upload/news/GABON/TRACERNkok_CommuniqueATIBT_4avril2023.pdf
  fetched: 2026-11-08
  quote: service de diligence raisonné appliqué aux fournisseurs de grumes de la ZES de Nkok, service
    mis en œuvre depuis octobre 2018 et donnant pleine satisfaction à son commanditaire GSEZ.
- claim: The forest administration ordered TRACER's activities suspended on 7 March 2023, and its agents
    were prevented from checking log flows from 8 March; as of 4 April 2023 they had not resumed.
  url: https://www.atibt.org/files/upload/news/GABON/TRACERNkok_CommuniqueATIBT_4avril2023.pdf
  fetched: 2026-11-08
  quote: Le 7 mars 2023 dernier, nous avons reçu ordre de l'administration forestière de suspendre les
    activités de TRACER. Dès le 8 mars, nos agents ont été empêchés de mener leurs contrôles des flux
    de grumes entrant dans la ZES de Nkok.
