summary: Active Gabonese oceanographic data centre, created on the initiative of the IOC-UNESCO
  ODINAFRICA project, that holds the Gabon Marine Turtle Partnership's sea turtle database
  and manages oceanographic data collection, processing and distribution.
facts:
- claim: The Gabon Marine Turtle Partnership's sea turtle database is held at the CNDIO, which
    handles data entry, storage and analysis.
  url: https://www.seaturtle.org/groups/gabon/fr_coordination.html
  fetched: 2026-11-12
  quote: Notre base de données tortues marines se trouve au CNDIO (Centre National des Données
    et Informations Océanographiques), qui est chargé de la saisie des données, du stockage
    et de l'analyse.
- claim: The CNDIO was created on the initiative of the IOC-UNESCO ODINAFRICA project, by
    the will of the Gabonese authorities to have a reference decision-support tool for marine
    and coastal matters.
  url: https://www.seaturtle.org/groups/gabon/fr_coordination.html
  fetched: 2026-11-12
  quote: La création du CNDIO à l'initiative du projet ODINAFRICA de la COI-UNESCO, est une
    volonté des autorités gabonaises de disposer d'un outil de référence d'aide à la prise
    de décision dans les domaines marin et côtier.
- claim: Its director's profile gives its main missions as managing the collection, processing
    and distribution of oceanographic data and information, with research on coastal erosion
    and observation of the marine environment.
  url: https://labarcgabon.com/irsh_koumba_mabert_brice_didier.html
  fetched: 2026-11-12
  quote: Les principales missions du CNDIO sont de gérer (collecte, traitement et diffusion)
    les données et les informations océanographiques
