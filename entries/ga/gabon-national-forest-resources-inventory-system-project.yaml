summary: A JICA-run forest inventory project in Gabon that presented results in February
  2018 after five years of field work, producing stratification maps and a database,
  with 299 of 688 planned plots inventoried by end 2017.
facts:
- claim: Gabonreview reported that the project presented its results on 13 February
    2018 after five years of field work.
  url: https://www.gabonreview.com/gestion-durable-ressources-forestieres-pays-se-dote-dun-systeme-dinventaire/
  fetched: 2026-11-15
  quote: La cellule en charge de ce projet a procédé à la restitution des résultats,
    après cinq ans de travaux sur le terrain.
- claim: Its work produced forest stratification maps and a database of national forest
    resources.
  url: https://www.gabonreview.com/gestion-durable-ressources-forestieres-pays-se-dote-dun-systeme-dinventaire/
  fetched: 2026-11-15
  quote: Ces travaux ont permis la réalisation de cartes de stratification forestière
    et la conception d’une base de données sur les ressources forestières nationales.
- claim: It was carried out by JICA experts and staff of the ministry then named the
    Ministry of Forests, the Sea and the Environment, and installed close to 300 field
    plots.
  url: https://www.gabonreview.com/gestion-durable-ressources-forestieres-pays-se-dote-dun-systeme-dinventaire/
  fetched: 2026-11-15
  quote: ce projet a permis d’élaborer la carte forestière de base, d’installer près
    de 300 placettes sur le terrain et de développer une base de données renseignée.
- claim: JICA's report counts 299 of 688 planned plots as inventoried by the end of
    2017, including 22 plots that could not be reached because of obstacles.
  url: https://openjicareport.jica.go.jp/pdf/12304150.pdf
  fetched: 2026-11-15
  quote: Parmi les 688 placettes à réaliser, on n’a inventorié que 299
