status: closed
summary: A closed pilot in Lopé National Park, led and built by the University of
  Stirling and Hack the Planet, in which five AI camera systems recognised elephants
  with 82% accuracy and alerted rangers within seven minutes on average.
facts:
- claim: The project, jointly led by the University of Stirling and Hack the Planet,
    developed an AI-powered wildlife camera.
  url: https://www.stir.ac.uk/news/2023/january-2023-news/groundbreaking-ai-wildlife-camera-developed-to-improve-conservation/
  fetched: 2026-11-15
  quote: A new project, jointly led by the University of Stirling and Hack the Planet,
    has for the first time developed an artificial intelligence (AI) powered wildlife
    camera
- claim: During the pilot five camera systems took more than 800 photos in 72 days,
    the AI model recognised elephants with 82% accuracy, and rangers received alerts
    within seven minutes on average.
  url: https://www.stir.ac.uk/news/2023/january-2023-news/groundbreaking-ai-wildlife-camera-developed-to-improve-conservation/
  fetched: 2026-11-15
  quote: The AI model achieved an accuracy of 82% in recognising elephants. Rangers
    received an alert from the system within seven minutes on average.
- claim: The system combines an AI model, ready-made camera traps and custom hardware
    with a satellite connection.
  url: https://www.stir.ac.uk/news/2023/january-2023-news/groundbreaking-ai-wildlife-camera-developed-to-improve-conservation/
  fetched: 2026-11-15
  quote: By combining an AI model, ready-made camera traps and custom hardware with
    a satellite connection, it is now possible to send real-time information to rangers
    from remote locations.
