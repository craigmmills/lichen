summary: Gabon's national forest monitoring system, supported by CAFI since 2018, which CAFI reports sent
  18,370 deforestation alerts to authorities, 508 of them followed by field operations.
facts:
- claim: CAFI says the system is meant to monitor changes in national forest cover and detect deforestation
    events, including through an alert system, and to improve data on carbon stocks and flows reported
    under the Climate Convention.
  url: https://cafi.org/project/developing-a-national-land-use-plan-and-a-forest-monitoring-system-in-gabon/
  fetched: 2026-11-08
  quote: This will enable monitoring changes in national forest cover and to detect deforestation events,
    including an alert system, to understand which sectoral activities have an impact on forest conversion.
- claim: CAFI reports that by the close of its project the national forest monitoring system had sent
    18,370 deforestation alerts to the relevant authorities, 508 of them followed by field operations.
  url: https://cafi.org/project/developing-a-national-land-use-plan-and-a-forest-monitoring-system-in-gabon/
  fetched: 2026-11-08
  quote: The national forest monitoring system transmitted 18,370 deforestation alerts to relevant authorities,
    with 508 followed by field operations.
- claim: CAFI's Forest Ecosystem Research and Monitoring project page says CAFI has supported the system
    since 2018.
  url: https://cafi.org/project/gabon-forest-ecosystem-research-and-monitoring/
  fetched: 2026-11-08
  quote: This project is designed to strengthen the National Observation System for Natural and Forest
    Resources (French acronym is 'SNORNF') a project supported by CAFI since 2018
