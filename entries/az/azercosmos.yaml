summary: Azerbaijan space agency, as Report.az calls it, offering satellite-based forest and deforestation
  monitoring tools, and in March 2025 reporting a Papua New Guinea forest monitoring programme with an
  AI platform expected to launch.
facts:
- claim: Report.az calls it the Azerbaijan Space Agency.
  url: https://report.az/en/ict/azercosmos-launches-ai-powered-platerra-for-satellite-image-analysis
  fetched: 2026-11-09
  quote: The Azerbaijan Space Agency ( Azercosmos ) has launched Platerra
- claim: Its Earth observation page says its Deforestation Detection tool uses satellite imagery and machine
    learning to monitor forest loss.
  url: https://azercosmos.az/en/earth-observation/ai-products
  fetched: 2026-11-09
  quote: Our Deforestation Detection tool uses satellite imagery and advanced machine learning to monitor
    forest loss.
- claim: Its GEO360 platform lets users upload satellite imagery and apply its AI models, such as deforestation
    detection, in a web browser.
  url: https://azercosmos.az/en/earth-observation/ai-products
  fetched: 2026-11-09
  quote: GEO360 is a cloud-based data processing platform that unifies our AI tools in one place.
- claim: Its super-resolution product uses deep learning to sharpen satellite images, including for identifying
    vegetation.
  url: https://azercosmos.az/en/earth-observation/ai-products
  fetched: 2026-11-09
  quote: Satellite Imagery Super-Resolution uses advanced computational and deep learning techniques to
    enhance image resolution, enabling more precise identification and analysis of surface features such
    as structures, infrastructure, vegetation
  ai_type: deep-learning
- claim: Its Earth observation catalogue lists monitoring of forests and deforestation among its services.
  url: https://azercosmos.az/eoc/catalogue-eo-eng.pdf
  fetched: 2026-11-09
  quote: Monitoring of forests, deforestation
- claim: In March 2025 it said it had carried out a forest monitoring programme in Papua New Guinea with
    the Commonwealth of Nations, and that an AI-based forest monitoring platform from that programme was
    expected to launch in the following months.
  url: https://azercosmos.az/media-center/news/azercosmos-has-completed-monitoring-of-the-forests-in-papua-new-guinea
  fetched: 2026-11-09
  quote: Azercosmos, in collaboration with The Commonwealth of Nations , has carried out a forest monitoring
    program in Papua New Guinea.
- claim: In January 2018, Azernews reported that Azercosmos signed a protocol of intentions with the Institute
    of Geography of the National Academy of Sciences on aerospace forest monitoring.
  url: https://www.azernews.az/nation/125582.html
  fetched: 2026-11-09
  quote: Azerkosmos OJSC signed a protocol of intentions
