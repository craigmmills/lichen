summary: Camera traps installed by Azerbaijan's Ecology Ministry; AzVision reported
  in February 2023 that traps at Basitchay reserve recorded porcupine, common pheasant
  and wild boar over one week.
facts:
- claim: In August 2022, Azernews reported that Azerbaijan's Ecology and Natural Resources
    Ministry had installed camera traps in the liberated lands to monitor wild animals.
  url: https://www.azernews.az/nation/198417.html
  fetched: 2026-11-12
  quote: Azerbaijan’s Ecology and Natural Resources Ministry has installed camera
    traps in liberated lands to monitor wild animals,
- claim: In the August 2022 report, Firudin Aliyev was described as head of the Biodiversity
    Protection Service and discussed the work on the ministry's Expert Hour programme.
  url: https://www.azernews.az/nation/198417.html
  fetched: 2026-11-12
  quote: This was mentioned by Firudin Aliyev, Biodiversity Protection Service head,
    in the Expert Hour program on the ministry’s official
- claim: On 20 February 2023, AzVision reported that monitoring had begun in Basitchay
    State Nature Reserve in Zangilan district to assess the ecological environment
    and biodiversity of the Karabakh and Eastern Zangazur regions, according to the
    head of the Biological Diversity Protection Service.
  url: https://en.azvision.az/news/166508/news.html
  fetched: 2026-11-12
  quote: monitoring has begun in the Basitchay State Nature Reserve located on the
    territory of the Zangilan district, said the Head of the Biological Diversity
    Protection Service Firuddin Aliyev
- claim: AzVision reported on 20 February 2023 that camera traps in the reserve had
    recorded porcupine, common pheasant, wild boar and other fauna over the preceding
    week.
  url: https://en.azvision.az/news/166508/news.html
  fetched: 2026-11-12
  quote: The head of the service noted that over the past week, porcupine (Hystrix
    indica), common pheasant (phasianus colchicus), wild boar (sus scrofa) and other
    species of fauna have been recorded by camera-traps.
