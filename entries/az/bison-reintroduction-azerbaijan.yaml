status: active
summary: A bison release project in Shahdag National Park run by IDEA, the ecology ministry and WWF Azerbaijan,
  where IDEA says released bison are tracked with GPS collars.
facts:
- claim: IDEA says bison released in Shahdag National Park are collared with GPS devices and tracked for
    movement and survival.
  url: https://ideacampaign.org/en/projects/zubrlarin-reintroduksiyasi-899
  fetched: 2026-11-09
  quote: Collared with GPS devices, these animals are being tracked and monitored for their movement and
    survival, collecting valuable information that may benefit the wild population in the future.
- claim: IDEA says twenty bison were released into the wild in Shahdag National Park after two years of
    acclimatisation.
  url: https://ideacampaign.org/en/projects/zubrlarin-reintroduksiyasi-899
  fetched: 2026-11-09
  quote: twenty European bison were released into the wild in Shahdag National Park
- claim: WWF Azerbaijan says the project began by bringing 12 bison from zoos in Germany, France and Belgium
    to Shahdag National Park.
  url: https://www.wwf.az/about_us22/bison_project/
  fetched: 2026-11-09
  quote: The WWF reintroduction project activities started with selection and transportation of 12 bison
    from zoos in Germany, France and Belgium to the Shahdag National Park in Azerbaijan.
