- claim: The EU4Environment guidelines on Emerald sites say the society organises
    and carries out a five-year counting programme for threatened and significant
    bird species in Azerbaijan's protected areas.
  url: https://www.eu4environment.org/app/uploads/2024/07/Guidelines-for-Developing-Emerald-Sites-Management-Plans-in-Azerbaijan-final.pdf
