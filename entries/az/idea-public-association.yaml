summary: A Baku-based association founded by Leyla Aliyeva that runs the bison reintroduction, reports
  camera-trap evidence of six Caucasian leopards in 2015, and partners with the ecology ministry and Blue
  Marine Foundation.
facts:
- claim: A 2015 page on its site says camera-trap monitoring installed by IDEA and WWF in Hirkan and Zangazur
    National Parks showed that six Caucasian leopards lived in Azerbaijan.
  url: https://ideacampaign.org/en/blog/azerbaycan-biomuxtelifliyi-boyuk-itki-vermisdir-579
  fetched: 2026-11-09
  quote: Based on photo-trap monitoring installed in Hirkan and Zangazur National Parks by the IDEA Public
    Association
- claim: The same page says IDEA ran a project called "Protection of Caucasian Leopards" for people living
    near leopard habitats.
  url: https://ideacampaign.org/en/blog/azerbaycan-biomuxtelifliyi-boyuk-itki-vermisdir-579
  fetched: 2026-11-09
  quote: IDEA has implemented the “Protection of Caucasian Leopards” project.
- claim: Its site gives an address in Baku.
  url: https://ideacampaign.org/en/blog/azerbaycan-biomuxtelifliyi-boyuk-itki-vermisdir-579
  fetched: 2026-11-09
  quote: AZ 1005, Baku, Azerbaijan pr, 14
- claim: Names Leyla Aliyeva as its founder.
  url: https://ideacampaign.org/en/about
  fetched: 2026-11-09
  quote: The Founder Leyla Aliyeva
- claim: Gives a Baku address.
  url: https://ideacampaign.org/en/about
  fetched: 2026-11-09
  quote: AZ 1005, Baku, Azerbaijan pr, 14
- claim: Says bison released in Shahdag National Park under its joint project are tracked with GPS collars.
  url: https://ideacampaign.org/en/projects/zubrlarin-reintroduksiyasi-899
  fetched: 2026-11-09
  quote: Collared with GPS devices, these animals are being tracked and monitored for their movement and
    survival
- claim: Says it has worked with the ecology ministry and the Blue Marine Foundation for ten years on
    projects to rehabilitate sturgeon and other fish in the Caspian Sea.
  url: https://ideacampaign.org/en/projects/deniz-ekosistemlerinin-qorunmasi-900
  fetched: 2026-11-09
  quote: IDEA has continued its partnership with the Ministry of Ecology and Natural Resources and Blue
    Marine Foundation (BLUE) on various projects to rehabilitate the populations of sturgeon and other
    valuable fish species in the Caspian Sea.
