summary: A Baku-based branch of WWF International registered in January 2006, which runs the bison reintroduction
  and says it set up camera-trap leopard monitoring in the Hyrcan Forest and Zangezur.
facts:
- claim: Registered as a branch office of WWF International in Azerbaijan in January 2006, and works with
    the WWF Caucasus Programme Office in Tbilisi.
  url: https://www.wwf.az/about_us22/
  fetched: 2026-11-09
  quote: It was legally registered as a Branch Office of WWF International in Azerbaijan by the Ministry
    of Justice in January 2006. As a member of the global WWF family, WWF Azerbaijan works in close cooperation
    with the WWF Caucasus Program Office based in Tbilisi, Georgia.
- claim: Gives a Baku office address.
  url: https://www.wwf.az/about_us22/
  fetched: 2026-11-09
  quote: AZ1021 Sebail Baku, Azerbaijan
- claim: Its leopard project page says camera-trap monitoring of leopards and associated species was set
    up in the Hyrcan Forest and Zangezur (Nakhchivan).
  url: https://www.wwf.az/about_us22/leopard_project/
  fetched: 2026-11-09
  quote: Intensive monitoring of the leopard population and other associated species was established in
    both the Hyrcan Forest (Talish Mountains) and Zangezur (Nakhchivan), using camera traps.
- claim: Its bison project page describes the May 2019 opening, says five bison carried GPS collars, and
    says rangers would monitor them in the wild in future.
  url: https://www.wwf.az/about_us22/bison_project/
  fetched: 2026-11-09
  quote: 5 rangers are taking care of bison and will monitor them in the wild in future. 5 bison are collared
    with GPS collars to monitor them with VHF antennas.
