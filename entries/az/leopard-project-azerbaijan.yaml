summary: A joint leopard conservation project run by WWF Azerbaijan, IDEA and the ecology ministry, which
  WWF Azerbaijan says set up camera-trap monitoring in the Hyrcan Forest and Zangezur.
facts:
- claim: Leopard.az says WWF, IDEA and the ecology ministry carried out a joint project to conserve and
    increase the leopard population in Azerbaijan; its English text calls WWF “World Wildlife Fund”.
  url: https://leopard.az/?lang=en
  fetched: 2026-11-09
  quote: World Wildlife Fund (WWF), IDEA Public Union and the Ministry of Ecology and Natural Resources
    the Republic of Azerbaijan implemented an important joint project to conserve and increase the population
    of the leopard in the country.
- claim: WWF Azerbaijan says camera-trap monitoring of leopards and associated species was set up in the
    Hyrcan Forest and Zangezur (Nakhchivan).
  url: https://www.wwf.az/about_us22/leopard_project/
  fetched: 2026-11-09
  quote: Intensive monitoring of the leopard population and other associated species was established in
    both the Hyrcan Forest (Talish Mountains) and Zangezur (Nakhchivan), using camera traps.
- claim: WWF Azerbaijan says the first leopard was photographed by a camera trap in the Hyrcan Forest
    in 2007.
  url: https://www.wwf.az/about_us22/leopard_project/
  fetched: 2026-11-09
  quote: The first leopard was captured by photo trap in the Hyrcan Forest in 2007.
