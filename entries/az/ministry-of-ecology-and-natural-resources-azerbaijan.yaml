summary: Azerbaijan's ecology ministry, which was developing a National Biodiversity Monitoring System
  with 20 indicators and in May 2026 said it planned AI-based platforms for drone forest monitoring, starting
  in Ismayilli.
facts:
- claim: The CBD country profile for Azerbaijan says the ministry was developing a National Biodiversity
    Monitoring System, whose first version (2013) defines 20 indicators.
  url: https://www.cbd.int/countries/profile?country=az
  fetched: 2026-11-09
  quote: the Ministry of Ecology and Natural Resources (MENR) is developing a National Biodiversity Monitoring
    System (NBMS). The first version of the NBMS (2013) defines 20 pressure, state and response indicators
- claim: In May 2026 the minister, Rashad Ismayilov, told Trend News Agency that drones would be used
    to monitor forests against illegal logging, that contracts had been signed, and that the ministry
    planned to run the work through AI-based platforms, starting in the Ismayilli forests.
  url: https://www.trend.az/azerbaijan/society/4190243.html
  fetched: 2026-11-09
  quote: Contracts have already been signed, and our first drones will be deployed soon. We plan to organize
    this work through artificial intelligence-based platforms.
- claim: IDEA Public Association says the ministry adopted a national action plan in 2009 to strengthen
    the protection of leopards.
  url: https://ideacampaign.org/en/blog/azerbaycan-biomuxtelifliyi-boyuk-itki-vermisdir-579
  fetched: 2026-11-09
  quote: in 2009 the Ministry of Ecology and Natural Resources adopted a national action plan to strengthen
    the protection of leopards
- claim: The CBD lists a deputy director of the ministry's Service of the Protection of Biodiversity as
    Azerbaijan's primary national focal point.
  url: https://www.cbd.int/countries/nfp?country=az
  fetched: 2026-11-09
  quote: Deputy Director Service of the Protection of Biodiversity Ministry of Ecology and Natural Resources
    H.Aliyev ave. 50 AZ1073 Baku Azerbaijan CBD Primary NFP
- claim: The CBD lists a deputy director of the ministry's biodiversity and protected areas department
    as Azerbaijan's protected areas focal point.
  url: https://www.cbd.int/countries/nfp?country=az
  fetched: 2026-11-09
  quote: Department of Protection of Biodiversity and Development of Especially Protected Nature Reserves
    Ministry of Ecology and Natural Resources
- claim: Its site lists biodiversity, the Caspian Sea and forests among its areas of work, and gives the
    area of national parks.
  url: https://www.eco.gov.az/
  fetched: 2026-11-09
  quote: Fəaliyyət istiqamətləri Biomüxtəliflik Xəzər dənizi Meşələr
- claim: WWF Azerbaijan says its camera-trap leopard work was possible through coordinated work with the
    ministry.
  url: https://www.wwf.az/about_us22/leopard_project/
  fetched: 2026-11-09
  quote: All this success has been possible thanks to the coordinated work of the WWF team and the Ministry
    of Ecology and Natural Resources of Azerbaijan.
