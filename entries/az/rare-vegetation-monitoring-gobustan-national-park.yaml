summary: Closed Rufford-listed project under Yelena Gambarova that used satellite
  image classification and an NDVI comparison to find changes in rare vegetation from
  2004 to 2007.
facts:
- claim: The project built a geographical database and GIS environment, classified
    satellite images and used an NDVI comparison to find changes in rare vegetation
    from 2004 to 2007.
  url: https://www.rufford.org/projects/yelena-gambarova/rare-vegetation-monitoring-in-the-gobustan-national-park-azerbaijan/
  fetched: 2026-11-12
  quote: Finally, a comparative method using Normalized Difference Vegetation Index
    (NDVI) was applied for determination of Rare Vegetation change over time. NDVI
    change was taken an account on the changes which happen on rare vegetation distribution
    in the Study Area from 2004 to 2007.
- claim: Its methods included training in standardised monitoring and the use of satellite
    images to show rare vegetation distribution.
  url: https://www.rufford.org/projects/yelena-gambarova/rare-vegetation-monitoring-in-the-gobustan-national-park-azerbaijan/
