summary: A Baku agency whose affiliated researcher Tabriz Tahmazov co-authored a 2023 paper on estimating
  forest tree allometric indicators from satellite data, including a biomass formula derived from NDVI
  values.
facts:
- claim: A 2023 paper co-authored by Tabriz Tahmazov of the National Aerospace Agency in Baku sets out
    methods for determining allometric indicators of forest trees from satellite remote sensing data.
  url: https://doi.org/10.25587/svfu.2023.30.2.004
  fetched: 2026-11-09
  quote: О возможности определения аллометрических показателей деревьев с использованием данных спутникового
    дистанционного зондирования
- claim: The paper says such studies allow the state of large forest areas to be checked quickly, and
    derives a formula for forest tree biomass from NDVI values.
  url: https://doi.org/10.25587/svfu.2023.30.2.004
  fetched: 2026-11-09
  quote: Такие исследования позволяют не только оперативно контролировать состояние обширных лесных массивов
- claim: Co-author Tabriz Tahmazov gives the National Aerospace Agency as his affiliation.
  url: https://doi.org/10.25587/svfu.2023.30.2.004
