facts:
- claim: In September 2025, the team reported completing Bahrain's first dedicated eDNA surveys of shark
    and ray populations, following its first sampling season in August.
  url: https://saveourseas.com/update/investigating-the-lives-of-sharks-and-rays-in-the-hottest-sea-on-the-planet-through-edna-in-bahrains-waters/
  fetched: 2026-11-12
  quote: Just last week, our team completed Bahrain’s first dedicated environmental DNA (eDNA) surveys
    to study shark and ray populations.
- claim: The project aims to establish elasmobranch distribution, species composition, seasonality and
    potential nursery areas using eDNA.
  url: https://saveourseas.com/update/investigating-the-lives-of-sharks-and-rays-in-the-hottest-sea-on-the-planet-through-edna-in-bahrains-waters/
  fetched: 2026-11-12
  quote: 'With almost nothing known about shark populations in Bahrain, Reem is on a mission to work out
    elasmobranch communities: their distribution, species composition, seasonality and potential nursery
    areas.'
- claim: The team changed its sampling plan from sediment eDNA to water-based eDNA.
  url: https://saveourseas.com/update/investigating-the-lives-of-sharks-and-rays-in-the-hottest-sea-on-the-planet-through-edna-in-bahrains-waters/
  fetched: 2026-11-12
  quote: we shifted to water-based eDNA sampling, which has proven more effective in detecting these elusive
    species.
