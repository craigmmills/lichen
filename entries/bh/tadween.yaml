summary: Nuwat-run platform for recording plant and animal observations, intended
  to build a regional biodiversity database on Arabian Peninsula wildlife and seasonal
  change, which it says will be open to everyone.
facts:
- claim: A platform for recording observations of plants and animals to build a regional
    biodiversity database and track seasonal changes of Arabian Peninsula wildlife.
  url: https://nuwat.org/tadween/
  fetched: 2026-11-13
  quote: Tadween is a platform for recording observations of plants and animals to
    produce long term data that will help scientists in building a regional biodiversity
    database, and to track seasonal changes of the Arabian Peninsula’s Wildlife.
- claim: Says the collected data will flow into a visual regional biodiversity database
    open to everyone.
  url: https://nuwat.org/tadween/
  fetched: 2026-11-13
  quote: The collected data will automatically flow into the build up of a visual
    regional biodiversity database that will be accessible to everyone.
