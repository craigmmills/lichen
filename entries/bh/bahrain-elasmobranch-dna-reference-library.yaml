summary: Planned first DNA reference library for Bahrain's sharks and batoids; 329
  tissue samples came from market surveys documenting 577 specimens of 30 species,
  with sequencing still pending in January 2026.
facts:
- claim: A year of weekly fish market surveys collected 329 tissue samples towards
    Bahrain's first DNA reference library for sharks and batoids; in January 2026,
    sequencing was still planned.
  url: https://saveourseas.com/update/from-fish-markets-to-genetic-blueprints-building-bahrains-first-dna-library-for-sharks-and-batoids/
  fetched: 2026-11-13
  quote: successfully collected 329 tissue samples, creating Bahrain’s first DNA reference
    database for elasmobranchs
- claim: Between December 2024 and December 2025 the surveys documented 577 elasmobranch
    specimens of 30 species.
  url: https://saveourseas.com/update/from-fish-markets-to-genetic-blueprints-building-bahrains-first-dna-library-for-sharks-and-batoids/
  fetched: 2026-11-13
  quote: Between December 2024 and December 2025, we documented 577 individual elasmobranch
    specimens, confirming the presence of 30 shark and ray species in Bahraini waters.
- claim: In January 2026 the samples were being sent to a laboratory for sequencing,
    to enrich global and regional eDNA databases.
  url: https://saveourseas.com/update/from-fish-markets-to-genetic-blueprints-building-bahrains-first-dna-library-for-sharks-and-batoids/
  fetched: 2026-11-13
  quote: These samples are now being sent to a specialised laboratory, where they
    will be sequenced and used to enrich global and regional eDNA databases.
