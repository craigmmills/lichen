- claim: Its researchers, under the Finsight Bahrain Project, are mapping the distribution
    of sharks in Bahraini waters.
  url: https://nuwat.org/research/
  fetched: 2026-11-13
  quote: under the Finsight Bahrain Project , along with our collaborators, are working
    on mapping the distribution of sharks and investigating species presence in various
    areas within Bahraini waters.
- claim: Runs a project assessing the current status of coral reefs at Fasht Al Adhm,
    Fasht Al Jarim and Reef Bul Thamah and investigating trends in coral cover.
  url: https://nuwat.org/research/
  fetched: 2026-11-13
  quote: this project aims to assess the current status of coral reefs in these areas
    and investigate the trends of coral cover.
- claim: On 28 January 2026 it announced Juthoor, a citizen science programme designed
    to document Bahrain's natural terrestrial landscapes.
  url: https://nuwat.org/2026/02/18/launching-juthoor-a-citizen-science-initiative-rooted-in-community-and-nature/
  fetched: 2026-11-13
  quote: On 28 January 2026, Nuwat announced its newest citizen science programme
    named, Juthoor
- claim: Registered as a GBIF data publisher in June 2026, with no datasets published
    yet, and says it intends to publish occurrence and sampling-event datasets on
    Bahrain's marine and coastal ecosystems.
  url: https://api.gbif.org/v1/organization?country=BH&limit=20
  fetched: 2026-11-13
  quote: Nuwat intends to publish a range of biodiversity occurrence and sampling
    event datasets through GBIF
