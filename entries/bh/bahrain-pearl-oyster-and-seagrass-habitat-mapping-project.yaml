facts:
- claim: A national project to map pearl oyster and seagrass habitats in Bahrain's territorial waters,
    carried out by AGU in partnership with Danat.
  url: https://agu.edu.bh/en/events/arabian-gulf-university-confirms-success-its-research-collaboration-danat-mapping-pearl
