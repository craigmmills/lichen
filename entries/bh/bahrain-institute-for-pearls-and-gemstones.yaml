facts:
- claim: Mumtalakat's portfolio page gives its founding year as 2017.
  url: https://www.mumtalakat.bh/portfolio-companies/bahrain-institute-for-pearls-and-gemstones-danat
  fetched: 2026-11-13
  quote: Established in 2017
- claim: Mumtalakat established it as a closed Bahraini company.
  url: https://www.mumtalakat.bh/ar/news-media/press-releases/mumtalakat-establishes-the-bahrain-institute-for-pearls-and-gemstones-danat
  fetched: 2026-11-13
  quote: today established the Bahrain Institute for Pearls and Gemstones (Danat)
    as a closed Bahraini company.
- claim: Described by Mumtalakat as a gemmological laboratory, education and research
    centre.
  url: https://www.mumtalakat.bh/portfolio-companies/bahrain-institute-for-pearls-and-gemstones-danat
  fetched: 2026-11-13
  quote: The Bahrain Institute for Pearls and Gemstones (DANAT) is a world-class gemmological
    laboratory, education and research centre
- claim: Located in the East Tower of Bahrain's World Trade Centre.
  url: https://www.danat.bh
  fetched: 2026-11-13
  quote: is located in the East Tower of Bahrain’s prestigious World Trade Centre.
- claim: With the Supreme Council for Environment, concluded the first phase of a
    study assessing the state of Bahrain's pearl oyster beds.
  url: https://www.danat.bh
  fetched: 2026-11-13
  quote: in partnership with the Supreme Council for Environment, concluded the first
    phase of a study project to assess the state of Bahrain’s pearl oyster beds.
- claim: With Arabian Gulf University, completed an 11-month survey of Bahrain's waters
    mapping pearl oyster beds and seagrass habitats.
  url: https://www.gdnonline.com/Details/1399988
  fetched: 2026-11-13
  quote: have completed an 11-month survey of Bahrain’s marine waters to map pearl
    oyster beds and seagrass habitats
- claim: AGU reported in July 2026 that Danat experts were identifying pearl oyster
    species and density in the joint survey to help create a scientific database on
    Bahrain's marine habitats.
  url: https://agu.edu.bh/en/events/arabian-gulf-university-confirms-success-its-research-collaboration-danat-mapping-pearl
  fetched: 2026-11-13
  quote: while ‘Danat’ experts identify the species and density of pearl oysters,
    enabling the creation of an accurate scientific database on the state of marine
    habitats in the Kingdom.
- claim: In May 2026 its site reported that marine surveys and sample collection for
    its Blue Carbon project with Arabian Gulf University, on pearl oyster habitats
    and seagrass meadows, were complete and data analysis was under way.
  url: https://www.danat.bh/danat-receives-agu-delegation-to-advance-blue-carbon-research-and-natural-pearl-studies/
  fetched: 2026-11-13
  quote: Marine surveys and sample collection have been completed as part of the study,
    while data analysis is currently underway in preparation for the final research
    report.
