- claim: Its GBIF publisher record says it contributes through applied research, environmental
    monitoring and the management of biodiversity-related data in Samoa.
  url: https://api.gbif.org/v1/organization?country=WS&limit=50
  fetched: 2026-11-14
  quote: contributes to the mission of the Global Biodiversity Information Facility
    (GBIF) through applied research, environmental monitoring, and the management
    of biodiversity-related data in Samoa.
- claim: The same record says it intends to publish species occurrence records and
    sampling-event data such as invasive species monitoring datasets, much of it from
    ongoing monitoring work including habitat and ecosystem assessments. Its endorsement
    as a GBIF publisher was still awaited when fetched.
  url: https://api.gbif.org/v1/organization?country=WS&limit=50
