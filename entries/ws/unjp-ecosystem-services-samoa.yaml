summary: UNESCO-led Joint SDG Fund and Samoa Government programme planned to support
  ecosystem services policy, data collection and valuation, with SROS and MNRE implementing;
  its 2022 report lists scoping work.
facts:
- claim: The Joint SDG Fund says the programme will support policy and planning, collection
    of data and valuation of ecosystem services.
  url: https://www.jointsdgfund.org/programme/building-forward-better-safeguarding-natural-capital-and-ecosystem-services
  fetched: 2026-11-14
  quote: The UN Joint Programme will support the development of policy and planning,
    collection of data, and valuation of ecosystem services
- claim: It says the programme will include assessments, data and policies on how
    human-nature interactions affect ecosystem functioning and biodiversity.
  url: https://www.jointsdgfund.org/programme/building-forward-better-safeguarding-natural-capital-and-ecosystem-services
  fetched: 2026-11-14
  quote: This UNJP on Ecosystem Services will include assessments, data and policies
    that would clarify the influence of complex human-nature interactions on one another
    and impacts on the functioning of the ecosystems as well as biodiversity.
- claim: A July 2022 Joint SDG Fund release says the programme is a joint initiative
    of the Joint SDG Fund and the Government of Samoa, led by UNESCO with UNEP and
    UNESCAP, with SPREP as regional partner and MNRE and SROS as national implementing
    partners.
  url: https://www.jointsdgfund.org/article/un-joint-programme-ecosystem-services-building-forward-better-safeguarding-natural-capital
  fetched: 2026-11-14
  quote: It is led by UNESCO with UNEP and UNESCAP as the participating UN organizations
    and SPREP as the regional partner.
- claim: Its 2022 annual progress report on the UN MPTF site says its 2022 activities
    included facilitating Samoa's 4th State of Environment Report, scoping water quality
    monitoring and ocean accounts, and identifying existing data on terrestrial and
    marine plant species of medicinal value.
  url: https://mptf.undp.org/sites/default/files/documents/2023-05/samoa_0.pdf
  fetched: 2026-11-14
  quote: Facilitating the development of the 4th State of Environment Report (SOER)
