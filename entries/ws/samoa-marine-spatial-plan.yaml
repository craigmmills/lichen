summary: Active programme that Conservation International describes as a legally adopted framework to
  protect 30% and manage 100% of Samoa's ocean, with Waitt Foundation funding for monitoring and enforcement.
facts:
- claim: Conservation International describes the plan as a legally adopted framework to protect 30% and
    manage 100% of Samoa's ocean.
  url: https://www.conservation.org/press/government-of-samoa-secures-usd-2-million-to-protect-samoas-ocean
  fetched: 2026-11-12
  quote: The Government of Samoa has secured USD 2.5 million to implement its Marine Spatial Plan (MSP),
    a legally adopted framework to fully protect 30% and sustainably manage 100% of the country's 120,000-square-kilometre
    ocean.
- claim: The Waitt Foundation funding will support monitoring, enforcement, communications and capacity
    building.
  url: https://www.conservation.org/press/government-of-samoa-secures-usd-2-million-to-protect-samoas-ocean
  fetched: 2026-11-12
  quote: The Waitt Foundation will provide up to 2.5 million USD to support the implementation of Samoa’s
    MSP, which will support monitoring, enforcement, communications, and capacity building.
