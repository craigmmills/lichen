summary: Samoan ministry that the CBD country profile says consolidates land, water, forestry, parks and
  environmental protection; it has two GBIF datasets and partners with AIMS on reef monitoring.
facts:
- claim: The CBD country profile says MNRE consolidates the planning and management of land, water, forestry,
    national parks and reserves and environmental protection.
  url: https://www.cbd.int/countries/profile?country=ws
  fetched: 2026-11-12
  quote: the restructuring of the old Department of Lands, Surveys and Environment into a single ministry
    (MNRE) now consolidates the planning and management of land, water, forestry, national parks and reserves
- claim: The CBD country profile says MNRE has prioritised an NBSAP monitoring plan with measurable indicators.
  url: https://www.cbd.int/countries/profile?country=ws
  fetched: 2026-11-12
  quote: the MNRE has prioritized the development of an NBSAP monitoring plan, with relevant and measurable
    indicators
- claim: Its GBIF publisher record gives an address in Apia and two published datasets.
  url: https://api.gbif.org/v1/organization/9883fb4c-5a83-4fe9-8500-fb3010df3ea5
  fetched: 2026-11-12
  quote: '"city":"Apia","country":"WS"'
- claim: Its home page has an Environment and Conservation section.
  url: http://www.mnre.gov.ws
  fetched: 2026-11-12
  quote: Environment and Conservation
- claim: In October 2022, GCRMN described a Pacific Coral Reef Monitoring partnership between Samoa through
    MNRE, Australia, AIMS and SPREP as ReefCloud’s second phase; it planned a framework by September 2023,
    a Samoa trial and Pacific implementation in 2024.
  url: https://gcrmn.net/?p=4310
  fetched: 2026-11-12
  quote: The Pacific Coral Reef Monitoring project is a promising new partnership between the Government
    of Samoa through its Ministry of Natural Resources and Environment (MNRE), the Government of Australia,
    the Australian Institute of Marine Science (AIMS)
- claim: Pristine Seas' scientific lead for its 2026 Samoa expedition says MNRE regularly surveys and
    monitors Samoa's resources on land and in the ocean.
  url: https://pina.com.fj/2026/08/07/scientists-explore-samoa-in-support-of-nations-trailblazing-plan-already-achieved-to-trotect-30-percent-of-its-ocean/
  fetched: 2026-11-12
  quote: MNRE — which regularly surveys and monitors Samoa’s resources both on land and in the ocean
