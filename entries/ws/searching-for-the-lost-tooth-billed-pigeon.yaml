summary: A project run by the Colossal Foundation with the Samoa Conservation Society
  and BirdLife International, aiming to develop AI algorithms that detect tooth-billed
  pigeon calls in audio from microphones deployed in Samoa's forests.
facts:
- claim: The Colossal Foundation says it is working with the Samoa Conservation Society,
    BirdLife International and the IUCN SSC Pigeon and Dove Specialist Group to locate
    the tooth-billed pigeon using AI-powered bioacoustic technology.
  url: https://colossalfoundation.org/?p=254
