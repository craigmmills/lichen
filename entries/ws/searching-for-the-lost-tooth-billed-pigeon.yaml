  quote: In partnership with the Samoa Conservation Society, BirdLife International,
    and the IUCN SSC Pigeon and Dove Specialist Group, The Colossal Foundation is
    working to locate the lost tooth-billed pigeon using AI-powered bioacoustic technology.
- claim: The project aims to develop AI algorithms to detect and identify tooth-billed
    pigeon calls captured on microphones deployed in Samoa's forests.
  url: https://colossalfoundation.org/?p=254
  fetched: 2026-11-14
  quote: This project aims to develop AI algorithms to detect and identify tooth-billed
    pigeon calls captured on microphones deployed on the forests of Samoa.
- claim: The foundation says audio from the microphones will be analysed with machine
    learning algorithms to identify the pigeon's calls; a 2025 arXiv preprint funded
    by Colossal Biosciences describes the classification pipeline, which lets users
    train and deploy classifiers for a chosen bird species.
  url: https://arxiv.org/html/2504.16276v1
