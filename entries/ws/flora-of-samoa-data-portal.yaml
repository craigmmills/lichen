summary: Online dataset of native and naturalised flowering plants of the Samoan archipelago,
  covering 810 species, which the portal says combines Whistler's 40 years of work
  with specimen collections; it partners with Samoa's environment ministry and is
  still uploading datasets.
facts:
- claim: The portal says it synthesises existing floristic data and publishes online
    the flora of native and naturalised flowering plants of the Samoan archipelago,
    including both American Samoa and Independent Samoa, following the Darwin Core
    standard.
  url: https://florasamoa.net/about.php
  fetched: 2026-11-15
  quote: This project synthesizes existing floristic data and electronically publish
    the flora of native and naturalized flowering plants (excluding ferns and fern
    allies) of the Samoan archipelago, including both American Samoa and the Independent
    State of Samoa.
- claim: It says the project covers 810 species, with distributions, checklists of
    herbarium specimens, images and conservation status.
  url: https://florasamoa.net/about.php
  fetched: 2026-11-15
  quote: This project completes the synthesis of taxonomic treatments and plant descriptions
    of 810 species
- claim: It says it unites the work of W. Art Whistler over 40 years with specimen
    collections from the archipelago.
  url: https://florasamoa.net/about.php
  fetched: 2026-11-15
  quote: The Flora of Samoa unites and synthesize a disparate body of work authored
    by Dr. W. Art Whistler over the past 40 years as well as specimen collections
    from the Samoan archipelago.
- claim: Its collection pages give occurrence statistics for herbarium datasets, such
    as 678 occurrences from the Royal Botanic Gardens, Kew.
  url: https://florasamoa.net/collections/misc/collprofiles.php?collid=2
  fetched: 2026-11-15
  quote: 678 occurrence
- claim: Its usage policy asks users to cite records as accessed through The Flora
    of Samoa Data Portal.
  url: https://www.florasamoa.net/misc/usagepolicy.php
  fetched: 2026-11-15
  quote: (Accessed through The Flora of Samoa Data Portal,
- claim: Its pages say datasets are still being uploaded.
  url: https://florasamoa.net/about.php
  fetched: 2026-11-15
  quote: We are currently actively uploading datasets for this project.
