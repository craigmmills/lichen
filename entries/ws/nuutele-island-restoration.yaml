summary: Active island restoration project led by the environment ministry, with Island Conservation,
  BirdLife and SPREP as partners, who Island Conservation says are committing to long-term monitoring
  and possible species reintroductions.
facts:
- claim: Island Conservation says MNRE leads the project, Island Conservation gives technical expertise,
    and BirdLife and SPREP-PRISMSS give regional knowledge and support.
  url: https://www.islandconservation.org/restoring-nuutele-island-samoa-building-climate-resilience-and-reviving-biodiversity/
  fetched: 2026-11-12
  quote: MNRE is the project lead, guiding community consultations and decision-making. Island Conservation
    provides technical expertise, while BirdLife and SPREP-PRISMSS contribute regional knowledge and support.
- claim: Island Conservation's Head of Operations for the Pacific says the partners are committing to
    long-term monitoring and possible species reintroductions on Nu'utele.
  url: https://www.islandconservation.org/restoring-nuutele-island-samoa-building-climate-resilience-and-reviving-biodiversity/
  fetched: 2026-11-12
  quote: committing to long-term monitoring and potential species reintroductions on Nu’utele, including
    the culturally significant Maomao bird
