summary: Active GEF-funded project run by the environment ministry, aiming to protect native species and
  ecosystems from invasive species and unsustainable land use; NIT reports it funded an invasive species
  database.
facts:
- claim: The GEF gives the project's objective as equipping communities to safeguard Samoa's native species
    and ecosystems from invasive alien species and unsustainable land use.
  url: https://www.thegef.org/projects-operations/projects/10410
  fetched: 2026-11-12
  quote: To equip and empower local communities to safeguard Samoa’s indigenous species, natural ecosystems
    and food production systems from Invasive Alien Species (IAS) and unsustainable land use practices.
- claim: NIT reports that the Samoa National Invasive Alien Species Database was funded under the project.
  url: https://nit.com.au/26-05-2026/24476/national-environment-week-drives-local-action-across-samoa
  fetched: 2026-11-12
  quote: Both initiatives were funded under the GEF-7 Samoa Invasive Alien Species Project, funded by
    the Global Environment Facility (GEF) and implemented by the ministry in partnership with the United
    Nations Development Programme (UNDP).
