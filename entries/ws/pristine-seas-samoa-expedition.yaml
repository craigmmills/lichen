summary: Expedition run by National Geographic Pristine Seas, described in an August 2026 release as a
  planned four-week survey of sea life and geology in Samoa's protected marine areas, using eDNA sampling.
facts:
- claim: In an August 2026 release, Pristine Seas said it would conduct formal scientific surveys of sea
    life and geology in Samoa’s newly protected marine areas during a four-week expedition.
  url: https://pina.com.fj/2026/08/07/scientists-explore-samoa-in-support-of-nations-trailblazing-plan-already-achieved-to-trotect-30-percent-of-its-ocean/
  fetched: 2026-11-12
  quote: Over the course of four weeks, National Geographic Pristine Seas will survey marine life in Samoa’s
    newly-protected marine areas, home to a dazzling array of fish, whales and turtles
- claim: The August 2026 release said the team would use eDNA sampling to identify organisms not always
    seen with cameras or the naked eye.
  url: https://pina.com.fj/2026/08/07/scientists-explore-samoa-in-support-of-nations-trailblazing-plan-already-achieved-to-trotect-30-percent-of-its-ocean/
  fetched: 2026-11-12
  quote: Using environmental DNA (eDNA) sampling, the team will collect small bits of matter that can
    later be sequenced to identify organisms not always seen with cameras or the naked eye.
