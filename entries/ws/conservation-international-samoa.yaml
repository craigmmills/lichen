summary: Programme run by Conservation International that says its fieldwork since April 2016 included
  natural capital mapping and biodiversity surveys, and that it works with government on coral reef monitoring.
facts:
- claim: Says its fieldwork from April 2016 included natural capital mapping, rapid biodiversity assessment
    surveys, fish biodiversity surveys and MPA monitoring surveys.
  url: https://samoa.conservation.org/our-focus
  fetched: 2026-11-12
  quote: Fieldwork from April, 2016 includes the natural capital mapping for biodiversity, field surveys
    including Biodiversity Rapid Assessment surveys, Fish Biodiversity surveys, MPA monitoring surveys,
    and Crown of Thorn surveys and control missions.
- claim: Says it works with the Samoan government on marine resource monitoring of coral reefs.
  url: https://samoa.conservation.org/our-focus
  fetched: 2026-11-12
  quote: In partnership with the Samoan government, we are working to improve the knowledge on and value
    of Samoa’s coral reefs through marine resource monitoring.
