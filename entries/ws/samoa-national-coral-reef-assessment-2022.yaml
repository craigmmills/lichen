summary: Closed national coral reef assessment, led by the environment ministry in September 2022, which
  GCRMN reports was one of Samoa's most comprehensive and feeds into marine spatial planning.
facts:
- claim: GCRMN reports that the September 2022 expedition was one of the most comprehensive national assessments
    of coral reef health in Samoa, led by MNRE and the Ministry of Agriculture and Fisheries with the
    Waitt Institute and Conservation International.
  url: https://gcrmn.net/2025/04/22/samoa-2022/
  fetched: 2026-11-12
  quote: Led by Samoa’s Ministry of Natural Resources and Environment and Ministry of Agriculture and
    Fisheries, in partnership with the Waitt Institute and Conservation International, the survey returned
    encouraging signs of recovery, particularly on the reefs of Upolu.
- claim: GCRMN says the expedition feeds into marine spatial planning under the Samoa Ocean Strategy.
  url: https://gcrmn.net/2025/04/22/samoa-2022/
  fetched: 2026-11-12
  quote: The expedition also supports the Samoa Ocean Strategy , feeding directly into marine spatial
    planning and coastal management efforts.
