summary: Closed WSU and WCS camera-trap survey across about 1,500 square kilometres
  over two dry seasons, recording 26 species, with similar richness across community-managed
  forest and neighbouring protected areas.
facts:
- claim: Scientists from WSU and WCS published a study in Conservation Biology finding
    similar community-level species richness and occupancy for medium to large mammals
    and birds in Uaxactún's community-managed forest and neighbouring protected areas;
    some vulnerable species avoided areas with high human access.
  url: https://programs.wcs.org/5greatforests/es-es/Noticias/ID/25556/En-la-Selva-Maya-hasta-los-jaguares-posan-para-la-camara
  fetched: 2026-11-12
  quote: En un nuevo estudio publicado en Conservation Biology , científicos de WSU
    y de Wildlife Conservation Society encontraron que un bosque de manejo comunitario
    en la Reserva de la Biosfera Maya de Guatemala alberga una rica variedad de vida
    silvestre.
- claim: Over two dry seasons the team deployed a grid of camera traps across about
    1,500 square kilometres, recording 26 species of mammals and birds.
  url: https://programs.wcs.org/5greatforests/es-es/Noticias/ID/25556/En-la-Selva-Maya-hasta-los-jaguares-posan-para-la-camara
  fetched: 2026-11-12
  quote: A lo largo de dos temporadas secas, desplegaron una extensa cuadrícula de
    cámaras trampa en aproximadamente 1,500 kilómetros cuadrados
- claim: Daniel Thornton of WSU is described as the study's principal author and Lucy
    Perera-Romero as its lead author.
  url: https://programs.wcs.org/5greatforests/es-es/Noticias/ID/25556/En-la-Selva-Maya-hasta-los-jaguares-posan-para-la-camara
  fetched: 2026-11-12
  quote: Daniel Thornton, profesor asociado en la Escuela de Medio Ambiente de WSU
    y autor principal del estudio.
- claim: The Uaxactún community used preliminary results to help renew its forest
    concession.
  url: https://programs.wcs.org/5greatforests/es-es/Noticias/ID/25556/En-la-Selva-Maya-hasta-los-jaguares-posan-para-la-camara
  fetched: 2026-11-12
  quote: La comunidad de Uaxactún utilizó resultados preliminares de este estudio
    para ayudar a renovar su concesión forestal integral
