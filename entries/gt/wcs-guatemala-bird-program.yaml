summary: Run by WCS Guatemala, the programme uses Motus tracking in Tikal and Laguna del Tigre;
  Marcial Córdova was identified as coordinator at a September 2024 festival.
facts:
- claim: After a 2024 bird banding certification workshop at Las Guacamayas, scientific monitoring
    in the Selva Maya added Motus radio tracking.
  url: https://guatemala.wcs.org/es-es/Sobre-nosotros/Noticias/articleType/ArticleView/articleId/25321/Migracion-monitoreo-y-manos-unidas-avances-por-las-aves-en-la-Selva-Maya.aspx
  fetched: 2026-11-12
  quote: el monitoreo científico en la Selva Maya ha incorporado la tecnología Motus (Motus
    Wildlife Tracking System)
- claim: Two Motus stations were installed in Tikal and Laguna del Tigre national parks with
    Zumbro Valley Audubon and SELVA.
  url: https://guatemala.wcs.org/es-es/Sobre-nosotros/Noticias/articleType/ArticleView/articleId/25321/Migracion-monitoreo-y-manos-unidas-avances-por-las-aves-en-la-Selva-Maya.aspx
  fetched: 2026-11-12
  quote: se han instalado dos estaciones Motus en los Parques Nacionales Tikal y Laguna del
    Tigre en Guatemala.
- claim: WCS Guatemala's October 2025 article identified Marcial Córdova as coordinator of
    its bird programme when describing his participation in a September 2024 festival.
  url: https://guatemala.wcs.org/es-es/Sobre-nosotros/Noticias/articleType/ArticleView/articleId/25321/Migracion-monitoreo-y-manos-unidas-avances-por-las-aves-en-la-Selva-Maya.aspx
