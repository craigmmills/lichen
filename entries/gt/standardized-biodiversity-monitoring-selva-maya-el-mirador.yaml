summary: Closed Rufford-listed project in El Mirador National Park, dated 14 December 2020, that aimed
  to train and equip CONAP staff for monitoring and to trial acoustic surveys of birds and bats.
facts:
- claim: The Rufford project page lists the project by José António Lemos Barão Nóbrega in El Mirador
    National Park, Guatemala, dated 14 December 2020.
  url: https://www.rufford.org/projects/jos%C3%A9-ant%C3%B3nio-lemos-bar%C3%A3o-n%C3%B3brega/standardized-biodiversity-monitoring-to-assess-the-impact-of-climate-change-in-the-selva-maya/
  fetched: 2026-11-08
  quote: José António Lemos Barão Nóbrega - Standardized Biodiversity Monitoring to Assess the Impact
    of Climate Change in the Selva Maya
- claim: The project aimed to train and equip CONAP personnel in El Mirador to run monitoring using Operation
    Wallacea’s Calakmul methods; the page calls CONAP the National Commission of Protected Areas, while
    the CBD page names it the National Council for Protected Areas.
  url: https://www.rufford.org/projects/jos%C3%A9-ant%C3%B3nio-lemos-bar%C3%A3o-n%C3%B3brega/standardized-biodiversity-monitoring-to-assess-the-impact-of-climate-change-in-the-selva-maya/
  fetched: 2026-11-08
  quote: by training and equipping personnel from the local environmental authority (National Commission
    of Protected Areas - CONAP) operating in El-Mirador National Park (MNP) in Guatemala to conduct their
    own monitoring project
- claim: The plan included trialling acoustic surveys for birds and bats and building a call library for
    the Selva Maya.
  url: https://www.rufford.org/projects/jos%C3%A9-ant%C3%B3nio-lemos-bar%C3%A3o-n%C3%B3brega/standardized-biodiversity-monitoring-to-assess-the-impact-of-climate-change-in-the-selva-maya/
  fetched: 2026-11-08
  quote: Acoustic survey methods for birds and bats will then be trialled in CBR, including building up
    a species-specific call library for the Selva Maya
