summary: Guatemala's first satellite, built by Universidad del Valle de Guatemala and handed to JAXA for
  launch in November 2019, with a mission to measure cyanobacteria chlorophyll in Lake Atitlán.
facts:
- claim: The Universidad del Valle de Guatemala handed Quetzal 1, the first Guatemalan satellite, to JAXA
    in November 2019 for launch.
  url: https://www.laestrella.com.pa/cafe-estrella/ciencia/191105/191106-primer-satelite-guatemalteco-saldra-espacio-marzo
  fetched: 2026-11-08
  quote: La Universidad del Valle de Guatemala entregó este martes el primer satélite guatemalteco llamado
    Quetzal 1 a la Agencia de Exploración Aeroespacial Japonesa (JAXA)
- claim: Its mission was to measure from space the chlorophyll of the cyanobacteria affecting Lake Atitlán.
  url: https://www.laestrella.com.pa/cafe-estrella/ciencia/191105/191106-primer-satelite-guatemalteco-saldra-espacio-marzo
  fetched: 2026-11-08
  quote: verificar desde el espacio la clorofila de la cianobacteria que afecta al lago de Atitlán
- claim: In November 2019 its co-director said the aim was to test the sensor and analyse whichever of
    the country's water bodies it could capture.
  url: https://www.laestrella.com.pa/cafe-estrella/ciencia/191105/191106-primer-satelite-guatemalteco-saldra-espacio-marzo
