summary: Project the UK Space Agency said in 2017 it would fund with £5.3 million over three years, using
  satellite data and GNSS apps to improve timber traceability and reduce deforestation causes.
facts:
- claim: The UK Space Agency said in 2017 it would fund a three-year £5.3 million project in Guatemala
    on illegal logging.
  url: https://www.gov.uk/government/news/inab-and-the-uk-space-agency-sign-agreement-to-protect-guatemalas-forests
  fetched: 2026-11-08
  quote: The UK Space Agency will fund a three-year £5.3 million project in Guatemala to use cutting edge
    technology to tackle illegal logging.
- claim: INAB signed the agreement to implement the Forestry Management and Protection system.
  url: https://www.gov.uk/government/news/inab-and-the-uk-space-agency-sign-agreement-to-protect-guatemalas-forests
  fetched: 2026-11-08
  quote: Guatemala’s National Institute of Forestry (INAB) signed the agreement to implement a system
    of Forestry Management and Protection (FMAP).
- claim: The project aimed to upgrade timber traceability systems with space-based data and GNSS mobile
    applications.
  url: https://www.gov.uk/government/news/inab-and-the-uk-space-agency-sign-agreement-to-protect-guatemalas-forests
  fetched: 2026-11-08
  quote: To upgrade and improve existing traceability systems through the addition of space-based data
    and GNSS mobile applications
- claim: It was to use satellite remote sensing and GNSS to reduce the causes of deforestation in Petén,
    Alta Verapaz and Baja Verapaz.
  url: https://www.gov.uk/government/news/inab-and-the-uk-space-agency-sign-agreement-to-protect-guatemalas-forests
  fetched: '2026-11-08'
  quote: The main objective of the agreement is to reduce the causes of deforestation in the departments
    of Peten, Alta Verapaz and Baja Verapaz by using cutting edge technology such as satellite remote
    sensing and the Global Navigation Satellite System (GNSS).
