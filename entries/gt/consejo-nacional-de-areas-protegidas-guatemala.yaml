summary: Public body responsible, per the CBD secretariat's draft profile, for implementing Guatemala's
  biodiversity policy; it runs CEMEC, hosts the GBIF node's homepage and led a national forest monitoring
  roadmap workshop.
facts:
- claim: The CBD secretariat's draft country profile says responsibility for implementing all biodiversity
    policy in Guatemala is assigned to CONAP.
  url: https://www.cbd.int/countries/profile?country=gt
  fetched: 2026-11-08
  quote: Responsibility for implementation of all policy related to biodiversity is assigned to the National
    Council for Protected Areas (CONAP).
- claim: The CBD lists CONAP's Executive Secretary as Guatemala's CBD primary national focal point, with
    its office in Edificio IPM, zona 1, Guatemala City.
  url: https://www.cbd.int/countries/nfp?country=gt
  fetched: 2026-11-08
  quote: 5a. Avenida 6-06 zona 1, Edificio IPM, Séptimo Nivel
- claim: GBIF's directory gives Guatemala's GBIF participant node as the National Information System on
    Biological Diversity of Guatemala (SNIBgt), with a homepage on CONAP's domain.
  url: https://api.gbif.org/v1/node?q=Guatemala
  fetched: 2026-11-08
  quote: National Information System on Biological Diversity of Guatemala -SNIBgt
- claim: GBIF's publisher record describes it as a public entity working on the conservation and sustainable
    use of Guatemala's protected areas and biological diversity.
  url: https://api.gbif.org/v1/organization/35bbc10c-2ce9-4644-992c-1f9f0ae8b398
  fetched: '2026-11-08'
  quote: CONAP is a public entity, recognized for its effective work with other stakeholders in ensuring
    the conservation and sustainable use of Guatemala's protected areas and biological diversity.
- claim: GBIF's publisher record gives its address in Zona 1, Guatemala City.
  url: https://api.gbif.org/v1/organization/35bbc10c-2ce9-4644-992c-1f9f0ae8b398
  fetched: '2026-11-08'
  quote: 5 avenida 6-06 Edificio IPM 7 nivel, Zona 1
- claim: GFOI reports that it led the third interinstitutional workshop on implementing Guatemala's national
    forest monitoring system roadmap.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: '2026-11-08'
  quote: The latest step in this journey was an interinstitutional workshop led by the National Council
    of Protected Areas (CONAP)
