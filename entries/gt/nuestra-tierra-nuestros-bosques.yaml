summary: EU-funded forest governance project run by ACOFOP and ICCO Cooperación, which
  in September 2018 was reported to have held a drone workshop for community forest
  monitoring and fire early warning.
facts:
- claim: In September 2018 the EU delegation reported that young members of ACOFOP's
    community monitoring network took part in a workshop on drones for community forest
    monitoring.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-12
  quote: 'Jóvenes miembros de la Red de Monitoreo Comunitario de Asociación de Comunidades
    Forestales de Petén (ACOFOP), participaron en el taller "Drones: su aplicación
    para el Monitoreo Forestal Comunitario".'
- claim: During the workshop reported in September 2018, participants used drones
    donated by the EU and other donors to document community forest protection work
    and for monitoring and early warning of fires in or near the forest reserve.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-12
  quote: para documentar las labores que sus comunidades realizan para protección
    de los bosques así como para monitoreo y alerta temprana de posibles incendios
    dentro o cerca de la reserva forestal.
- claim: The activities were carried out through the project, executed by ACOFOP and
    ICCO Cooperación and funded by the European Union.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-12
  quote: 'Estas actividades se realizan por medio del Proyecto Gobernanza Forestal:
    "Nuestra Tierra, Nuestros Bosques", ejecutado por ACOFOP e ICCO Cooperación y
    financiado por la Unión Europea.'
