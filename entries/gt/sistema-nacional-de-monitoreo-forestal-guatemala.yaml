summary: Guatemala's national forest monitoring system, which GFOI reports government institutions have
  worked on jointly since 2024, producing a nationally owned roadmap reviewed at a 2026 workshop of CONAP,
  MARN, MAGA and INAB.
facts:
- claim: Since 2024 government institutions have worked together on a common framework to strengthen the
    national forest monitoring system.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: 2026-11-08
  quote: Since 2024, government institutions have worked together to define priorities and establish a
    common framework to strengthen the NFMS.
- claim: The third inter-institutional workshop on the roadmap was led by CONAP, with MARN, MAGA and INAB.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: 2026-11-08
  quote: The latest step in this journey was an interinstitutional workshop led by the National Council
    of Protected Areas (CONAP)
- claim: GFOI's Country-Led Planning support is funded by FAO's AIM4Forests programme.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: 2026-11-08
  quote: The GFOI CLP programme of support is implemented by the GFOI Office with funding from the AIM4Forests
    programme of the Food and Agriculture Organization of the United Nations
- claim: GFOI reports that since 2024 government institutions have worked on a common framework for the
    system, leading to a nationally owned roadmap for implementing it.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: '2026-11-08'
  quote: this collaborative process led to the development of a nationally owned and transformational
    roadmap for implementing Guatemala's forest monitoring system
- claim: A 2026 workshop brought together CONAP, MARN, MAGA and INAB to review progress on the roadmap.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: '2026-11-08'
  quote: convening representatives from the Ministry of Environment and Natural Resources (MARN); the
    Ministry of Agriculture, Livestock and Food (MAGA); the National Forest Institute (INAB) and other
    supporting partners
- claim: The agreed information priorities include early deforestation warning systems.
  url: https://www.fao.org/gfoi/news-and-events/news/news-detail/guatemala-leads-the-way-in-institutionalizing-its-national-forest-monitoring-system/en
  fetched: '2026-11-08'
  quote: early deforestation warning systems
