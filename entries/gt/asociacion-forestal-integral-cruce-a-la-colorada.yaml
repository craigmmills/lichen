facts:
- claim: Mongabay reports that the association holds a long-term concession contract with CONAP to protect
    the Maya Biosphere Reserve.
  url: https://news.mongabay.com/2025/08/local-forest-governance-helps-jaguars-and-forests-flourish-in-guatemala/
  fetched: 2026-11-08
  quote: The Cruce a la Colorada Integral Forestry Association (AFICC), along with the 12 other forest
    community concessions in the reserve, have long-term contracts with Guatemala’s National Council of
    Protected Areas (CONAP)
- claim: The concession communities use their earnings to pay for drones to track fires, camera traps
    in restoration areas and phone apps to detect species.
  url: https://news.mongabay.com/2025/08/local-forest-governance-helps-jaguars-and-forests-flourish-in-guatemala/
  fetched: 2026-11-08
  quote: They use the earnings to pay for drones to track wildfires, camera traps to monitor wildlife
    in restoration areas, and phone apps to detect species.
- claim: In February 2024 WCS reported that association personnel were among those trained in SMART by
    CEMEC and WCS; that page renders the acronym AFFIC, while Mongabay uses AFICC.
  url: https://guatemala.wcs.org/es-es/Sobre-nosotros/Noticias/articleType/ArticleView/articleId/22303/Fortalecimiento-de-Capacidades-y-Colaboracion-para-Reforzar-la-Gobernanza-y-la-Conservacion-de-la-Selva-Maya.aspx
