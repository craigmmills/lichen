summary: Non-profit climate research institute founded in 2010 by sugar sector companies,
  which monitors aquatic fauna twice a year and breeds and releases three native fish
  species in four south coast rivers.
facts:
- claim: Describes itself as a non-profit, non-political and non-religious institution
    for climate change mitigation and adaptation research.
  url: https://icc.org.gt/en/whoweare/
  fetched: 2026-11-12
  quote: We are a non-profit, non-political and non-religious institution dedicated
    to the research and development of projects for climate change mitigation and
    adaptation in the Mesoamerican region.
- claim: Founded on 27 July 2010 by companies from the sugar sector.
  url: https://icc.org.gt/en/whoweare/
  fetched: 2026-11-12
  quote: a group of visionary companies from the sugar sector decided to invest in
    scientific research
- claim: Monitors the richness and abundance of aquatic fauna twice a year.
  url: https://www.icc.org.gt/es/diversidadbiologica/
  fetched: 2026-11-12
  quote: Además, realizamos dos monitoreos al año, para verificar la riqueza y abundancia
    de la fauna acuática.
- claim: Permanent forest measurement plots in the Pacific mangroves were set up and
    remeasured each year by INAB, ICC and other bodies.
  url: https://icc.org.gt/es/publican-ubicacion-e-informacion-de-parcelas-de-medicion-forestal-en-mangle/
  fetched: 2026-11-12
  quote: Estas parcelas fueron instaladas y remedidas año con año por el INAB, ICC,
    y las siguientes instituciones y empresas
- claim: Published a poster of aquatic fauna records from its monitoring between 2015
    and 2025 in four Pacific slope river basins.
  url: https://www.icc.org.gt/books/fauna-acuatica-de-los-rios-de-la-costa-sur-de-guatemala-primera-edicion/
  fetched: 2026-11-12
  quote: Este póster es producto de monitoreos de fauna hidrobiológica realizados
    entre 2015 y 2025
- claim: Breeds and releases three native fish species in four south coast rivers.
  url: https://www.icc.org.gt/es/diversidadbiologica/
  fetched: 2026-11-12
  quote: Realizamos la reproducción y liberación de tres especies nativas de peces
    en cuatro ríos de la costa sur.
