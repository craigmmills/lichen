summary: Biological station with bird and participatory biodiversity monitoring in
  Laguna del Tigre, administered by Asociación Balam in 2008, which joined the MoSI
  network through work with WCS Guatemala.
facts:
- claim: In 2008, the station was under Asociación Balam's administration.
  url: https://www.lasguacamayas.org/portal/inicio/historia-de-la-ebg
  fetched: 2026-11-12
  quote: En 2008, bajo la administración de la Asociación Balam, fortalecimos nuestra
    infraestructura y consolidamos nuestras acciones de investigación y protección
    ambiental.
- claim: Runs a biological monitoring programme to record the biodiversity of Laguna
    del Tigre National Park, including bird monitoring.
  url: https://www.lasguacamayas.org/portal/investigacion/aves-del-parque-nacional-laguna-del-tigre
  fetched: 2026-11-12
  quote: La Estación Biológica Las Guacamayas desarrolla un Programa de Monitoreo
    Biológico dedicado al registro y conocimiento de la biodiversidad del Parque Nacional
    Laguna del Tigre.
- claim: Runs participatory biological monitoring as a citizen science programme,
    covering plants, insects, butterflies, reptiles and amphibians, and birds.
  url: https://lasguacamayas.org/portal/proyectos/ciencia-ciudadana
  fetched: 2026-11-12
  quote: El monitoreo biológico participativo de la Estación Biológica Las Guacamayas
    es una herramienta esencial en los esfuerzos de conservación de la biodiversidad
    del Parque Nacional Laguna del Tigre.
- claim: Became a station of the MoSI winter survival bird banding network through
    joint work with WCS Guatemala's science department.
  url: https://lasguacamayas.org/portal/blog/noticias-y-eventos/monitoreo-de-la-sobrevivencia-invernal-de-aves-mosi
  fetched: 2026-11-12
  quote: Estación Biológica Las Guacamayas ya es parte de las estaciones MoSI, gracias
    al trabajo conjunto con el Departamento Científico de WCS-Guatemala.
