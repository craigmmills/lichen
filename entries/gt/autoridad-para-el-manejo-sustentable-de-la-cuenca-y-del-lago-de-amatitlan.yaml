summary: Authority for the Lake Amatitlán basin whose monitoring division checks water
  periodically and assesses biodiversity through fish and bird health, and which publishes
  a March 2023 to March 2024 bird report.
facts:
- claim: Its Division of Control, Environmental Quality and Lake Management monitors
    the lake's and main rivers' water periodically and assesses the basin's biodiversity
    through the health of fish and birds.
  url: https://amsa.gob.gt/division-de-control-calidad-ambiental-y-manejo-de-lagos/
  fetched: 2026-11-12
  quote: así como evaluar la Biodiversidad de la cuenca a través de análisis del estado
    de salud de los peces y las aves
- claim: The division's functions include periodic monitoring of physical, chemical
    and biological characteristics of the water of Lake Amatitlán and the basin's
    main rivers.
  url: https://amsa.gob.gt/division-de-control-calidad-ambiental-y-manejo-de-lagos/
  fetched: 2026-11-12
  quote: el monitoreo periódico de las características fisicoquímicas, biológicas,
    Metales pesados y Contaminantes Orgánicos Persistentes del agua del Lago de Amatitlán
- claim: Publishes a bird monitoring report for Lake Amatitlán covering March 2023
    to March 2024.
  url: https://amsa.gob.gt/division-de-control-calidad-ambiental-y-manejo-de-lagos/
  fetched: 2026-11-12
  quote: Monitoreo de Avifauna en el Lago de Amatitlán 2023-2024
- claim: Its molecular biology laboratory aims to analyse viral, bacterial and planktonic
    DNA fragments in the water of the lake and its rivers.
  url: https://amsa.gob.gt/biolgia-molecular/
  fetched: 2026-11-12
  quote: Generar resultados de análisis de fragmentos de ADN viral, bacteriano y planctónico
    al agua de los ríos y el lago de Amatitlán.
