summary: Community forestry association whose young monitoring network trained in 2018 on drones; Mongabay
  reported in 2025 that youths from 13 concessions were trained in drones, satellite data analysis, camera
  traps and biological monitoring.
facts:
- claim: In 2018 young members of ACOFOP's community monitoring network took part in a workshop on drones
    for community forest monitoring.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-08
  quote: Jóvenes miembros de la Red de Monitoreo Comunitario de Asociación de Comunidades Forestales de
    Petén (ACOFOP)
- claim: They used drones donated by the EU and others to document forest protection and for monitoring
    and early warning of fires.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-08
  quote: así como para monitoreo y alerta temprana de posibles incendios dentro o cerca de la reserva
    forestal.
- claim: The work was part of the EU-funded forest governance project Nuestra Tierra, Nuestros Bosques,
    carried out by ACOFOP and ICCO Cooperación.
  url: https://eeas.europa.eu/delegations/guatemala/49989/drones-para-cuidar-nuestra-tierra-nuestros-bosques%C2%A0_en
  fetched: 2026-11-08
  quote: ejecutado por ACOFOP e ICCO Cooperación y financiado por la Unión Europea.
- claim: Mongabay reported in 2025 that ACOFOP had trained young people from 13 community concessions
    to use drones, satellite data analysis, camera traps and biological monitoring, according to its biodiversity
    monitoring assistant.
  url: https://news.mongabay.com/2025/08/local-forest-governance-helps-jaguars-and-forests-flourish-in-guatemala/
  fetched: 2026-11-08
  quote: we trained young people from 13 community concessions, such as Cruce a la Colorada, to use drones,
    satellite data analysis, camera traps and biological monitoring
- claim: Mongabay credits a camera-trap image to ACOFOP's community monitoring unit.
  url: https://news.mongabay.com/2025/08/local-forest-governance-helps-jaguars-and-forests-flourish-in-guatemala/
  fetched: 2026-11-08
  quote: Image courtesy of Unidad de Monitoreo Comunitario – ACOFOP.
