summary: Guatemalan conservation and community development organisation, established in 1990, that partners
  with Panthera on remote cameras for wild cats and, per World Land Trust, has monitored birds for 32
  years.
facts:
- claim: Panthera describes FUNDAECO as its partner in Guatemala.
  url: https://panthera.org/blog-post/partnering-fundaeco-protect-biodiversity-and-people-guatemala
  fetched: 2026-11-08
  quote: Panthera supports our partners FUNDAECO (Fundación para el Ecodesarrollo y la Conservación) in
    Guatemala
- claim: Panthera says the partners deploy remote cameras to monitor wild cats.
  url: https://panthera.org/blog-post/partnering-fundaeco-protect-biodiversity-and-people-guatemala
  fetched: 2026-11-08
  quote: Deploy remote cameras to monitor wild-cat species that shape Guatemala’s forests.
- claim: Patrols with FUNDAECO rangers and community guardians covered more than 1,000 km in 2023 and
    2024.
  url: https://panthera.org/blog-post/partnering-fundaeco-protect-biodiversity-and-people-guatemala
  fetched: 2026-11-08
  quote: Conduct patrols with FUNDAECO rangers and local community guardians — covering more than 1,000
    kilometers during 2023-2024 alone.
- claim: A Guatemalan organisation established in 1990, working on nature conservation and sustainable
    community development.
  url: https://fundaeco.org.gt/fe/
  fetched: '2026-11-08'
  quote: FUNDAECO es una organización Guatemala establecida en 1990 y dedicada a la conservación de la
    naturaleza y a la promoción del desarrollo comunitario sostenible.
- claim: Says it has run a bird monitoring programme for 27 years and has supported the establishment
    and management of 26 conservation areas.
  url: https://fundaeco.org.gt/fe/
  fetched: '2026-11-08'
  quote: FUNDAECO ha apoyado el establecimiento y manejo de 26 áreas de conservación en Guatemala, se
    ha aliado con más de 100 comunidades para la promoción de desarrollo sostenible, ha implementado un
    programa de monitoreo de aves durante 27 años
- claim: World Land Trust says FUNDAECO has spent 32 years monitoring birds in Caribbean Guatemala.
  url: https://www.worldlandtrust.org/partner/foundation-for-ecodevelopment-and-conservation-fundaeco/
  fetched: '2026-11-08'
  quote: FUNDAECO have spent 32 years monitoring birds in Caribbean Guatemala
- claim: Says it manages and conserves marine and coastal ecosystems of Guatemala and the Gulf of Honduras.
  url: https://fundaeco.org.gt/fe/
  fetched: '2026-11-08'
  quote: Manejamos y conservamos los ecosistemas y recursos marino costeros de Guatemala y el Golfo de
    Honduras.
