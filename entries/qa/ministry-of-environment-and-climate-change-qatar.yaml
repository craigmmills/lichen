summary: QNA’s 2026 reports describe its geographic database of around 1,500 rawdas, reported use of GIS,
  aerial imagery and drones to detect violations, and remotely operated marine sampling boat.
facts:
- claim: QNA reported in January 2026 that the ministry has identified around 1,500 rawdas and built a
    geographic database with environmental information on each.
  url: https://qna.org.qa/en/News-Area/News/2026-1/1/qatar-steps-up-efforts-to-protect-fragile-rawda-ecosystems-1
  fetched: 2026-11-12
  quote: Authorities have also identified around 1,500 rawdas nationwide and created a comprehensive geographic
    database containing detailed environmental information on each site to support planning and decision-making.
- claim: Its Director of Wildlife Development said the ministry uses geographic information systems, aerial
    imagery and drones to track environmental changes and detect violations.
  url: https://qna.org.qa/en/News-Area/News/2026-1/1/qatar-steps-up-efforts-to-protect-fragile-rawda-ecosystems-1
  fetched: 2026-11-12
  quote: This includes the use of advanced technologies such as geographic information systems, aerial
    imagery and drones to track environmental changes and detect violations.
- claim: Its Natural Reserves Department carries out continuous monitoring of vegetation in protected
    areas.
  url: https://qna.org.qa/en/News-Area/News/2026-1/1/qatar-steps-up-efforts-to-protect-fragile-rawda-ecosystems-1
  fetched: 2026-11-12
  quote: Field measures include continuous monitoring of vegetation, preventing encroachments
- claim: In August 2026 QNA reported that the ministry showed its Smart Observer boat, which uses remote
    operation and sensors to collect marine environmental data and samples, after a successful pilot phase.
  url: https://qna.org.qa/en/News-Area/News/2026-8/6/mecc-showcases-smart-observer-boat-for-marine-environment-monitoring
  fetched: 2026-11-12
  quote: The boat uses remote operation technologies and advanced sensing systems to automatically and
    periodically collect environmental data
