summary: A research-intensive academic medical institution, a joint venture of Qatar
  Foundation and Cornell University, whose site offers the 2012 Arabian oryx genome
  draft assembly and SNP data for oryx breeding.
facts:
- claim: Describes itself as a research-intensive academic medical institution, a
    joint venture between Qatar Foundation and Cornell University.
  url: https://qatar-weill.cornell.edu/about-us
  fetched: 2026-11-15
  quote: Weill Cornell Medicine-Qatar, a pioneering joint venture between Qatar Foundation
    and Cornell University, is a research-intensive, academic medical institution.
- claim: Its site offers the files of a Version 1.0 draft assembly of the Arabian
    oryx genome, credited to its Genomics Core on 3 June 2012.
  url: https://qatar-weill.cornell.edu/research/research-highlights/arabian-oryx-genome-sequence
  fetched: 2026-11-15
  quote: The files on this site are for the Version 1.0 draft assembly of the Arabian
    oryx (Oryx leucoryx) genome generated by whole genome shotgun next-generation
    sequencing.
- claim: The page offers single nucleotide polymorphism data in the hope that it can
    help oryx breeding strategies keep genetic diversity.
  url: https://qatar-weill.cornell.edu/research/research-highlights/arabian-oryx-genome-sequence
  fetched: 2026-11-15
  quote: We provide the Single Nucleotide Polymorphism data in hopes it can be used
    for improving breeding strategies by maintaining as much genetic diversity as
    possible.
- claim: A WCM-Q news story dated 11 November 2019 announced that its associate professor
    of biology Kuei-Chiu Chen would lead a study documenting the species at Al Karaana
    Lagoons and their numbers.
  url: https://qatar-weill.cornell.edu/media-center/news/story/wcm-q-researcher-and-students-investigate-biodiversity-at-al-karaana-lagoons
  fetched: 2026-11-15
  quote: Dr. Kuei-Chiu Chen, associate professor of biology at WCM-Q, will now lead
    a study documenting the many different species at the site and the numbers in
    which they are found.
