- claim: The project also includes coral transplantation from healthy sites to affected
    areas and the rehabilitation of reef structures.
  url: https://qna.org.qa/en/News-Area/News/2026-6/1/qatar-advances-coral-reef-protection-and-restoration-project-ministry-says
