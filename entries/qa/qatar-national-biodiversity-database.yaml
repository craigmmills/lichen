summary: A biodiversity database project run by Qatar's environment ministry with
  UNEP, planned to hold species lists and distribution maps, with a June 2025 launch
  reported by the University of Doha for Science and Technology.
facts:
- claim: QNA reported in April 2025 that the ministry's Wildlife Development Department
    held preparatory workshops for the Qatar Biodiversity Database Project with UNEP's
    West Asia Office.
  url: https://qna.org.qa/en/News-Area/News/2025-4/17/moecc-concludes-preparatory-workshops-on-qatar-s-biodiversity-database-platform
  fetched: 2026-11-15
  quote: concluded Thursday a series of preparatory workshops for the Qatar Biodiversity
    Database Project, in cooperation with the UN Environment Programme's West Asia
    Office.
- claim: In April 2025, an assistant director of the Wildlife Development Department
    said the planned platform would include species lists and spatial and temporal
    distribution maps.
  url: https://qna.org.qa/en/News-Area/News/2025-4/17/moecc-concludes-preparatory-workshops-on-qatar-s-biodiversity-database-platform
  fetched: 2026-11-15
  quote: the digital platform will include comprehensive data, including species lists
    and spatial and temporal distribution maps
- claim: The University of Doha for Science and Technology says it took part in the
    June 2025 launch of Qatar's National Biodiversity Database Project, an initiative
    aimed at documenting and preserving Qatar's ecosystems through a centralised digital
    platform.
  url: https://www.udst.edu.qa/node/4729
  fetched: 2026-11-15
  quote: participated in the official launch of Qatar’s National Biodiversity Database
    Project; a national initiative aimed at documenting and preserving Qatar’s ecosystems
    through a centralized digital platform.
- claim: QNA reported in May 2026 that the head of the Nature Conservators Centre
    noted the launch of the Biodiversity Database Project.
  url: https://qna.org.qa/en/News-Area/News/2026-5/21/international-day-for-biological-diversity-qatar-launches-distinguished-initiatives-to-maintain-ecological-balance
  fetched: 2026-11-15
  quote: He noted the launch of the Biodiversity Database Project and the Arabian
    Oryx Genome Project
