summary: Ministry-run Qatari wildlife department that held a 2022 biodiversity database
  workshop with UNEP, aimed at a digital approved species list, and was said in 2026
  to have led whale shark research since 2010.
facts:
- claim: In October 2022 the ministry, represented by the department, held a workshop
    on the biodiversity database project with the UN Environment Programme's Regional
    Office for West Asia.
  url: https://www.qna.org.qa/en/News-Area/News/2022-10/25/0075-ministry-of-environment-organizes-workshop-on-biodiversity-database-project
  fetched: 2026-11-14
  quote: The Ministry of Environment and Climate Change, represented by the Department
    of Wildlife Development which is affiliated to the Protection and Natural Reserves
    Sector, organized today a workshop on the biodiversity database project in the
    State of Qatar
- claim: The project aimed to issue a digital list of the plant and animal species
    recorded in Qatar as an approved reference.
  url: https://www.qna.org.qa/en/News-Area/News/2022-10/25/0075-ministry-of-environment-organizes-workshop-on-biodiversity-database-project
  fetched: 2026-11-14
  quote: this project aims to issue a digital list of plant and animal species registered
    in the State of Qatar, to be an approved reference
- claim: In August 2026 the ministry said the department had led research since 2010
    on whale shark population structure and the identification of individual whale
    sharks.
  url: https://qna.org.qa/en/News-Area/News/2026-8/30/mecc-reaffirms-commitment-to-protecting-marine-biodiversity-whale-sharks
  fetched: 2026-11-14
  quote: the ministry highlighted the key research and studies that the Wildlife Development
    Department has been leading since 2010, focusing on examining whale shark population
    structure and identifying individual whale sharks
