  quote: which is designed to monitor the marine environment and equipped with advanced
    systems to track environmental changes and collect samples and data from marine
    sites.
- claim: The boat uses remote operation and sensing systems to collect environmental
    data automatically and periodically.
  url: https://qna.org.qa/en/News-Area/News/2026-8/6/mecc-showcases-smart-observer-boat-for-marine-environment-monitoring
