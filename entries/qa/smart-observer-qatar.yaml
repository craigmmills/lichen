summary: A marine monitoring boat built and run by Qatar's environment ministry, which
  uses remote operation and sensing to collect data automatically; the ministry reported
  in August 2026 that its pilot succeeded and expansion was under way.
facts:
- claim: QNA reported in August 2026 that the ministry showed the Smart Observer boat,
    designed to monitor the marine environment and collect samples and data from marine
    sites.
