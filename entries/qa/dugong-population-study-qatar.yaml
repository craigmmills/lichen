  quote: the ministry conducted a scientific and field study between 2023 and 2026
    to monitor dugong populations in Qatari waters and explore ways to preserve them.
- claim: The study used aerial survey technologies and drones, and researchers identified
    individual dugongs from drone imagery by markings on their bodies.
  url: https://qna.org.qa/en/News-Area/News/2026-5/29/moecc-highlights-efforts-to-monitor-and-protect-dugongs
