summary: Qatar's Ministry of Municipality GIS centre, which the ministry says has run the country's GIS
  work since 1990, set up an aerial survey system and supplies government bodies with geographic databases
  and imagery through the National GISNet.
facts:
- claim: Gulf Times reported that the ministry says Qatar's GIS work has been run by the Ministry of Municipality's
    CGIS since 1990.
  url: https://www.gulf-times.com/article/687243/qatar/ministry-of-municipality-receives-35-years-of-excellence-in-gis-award
  fetched: 2026-11-12
  quote: which has been administrated by the Ministry of Municipality's CGIS since 1990
- claim: Has set up an aerial survey system using drones or manned aircraft for land and sea mapping.
  url: https://www.gulf-times.com/article/687243/qatar/ministry-of-municipality-receives-35-years-of-excellence-in-gis-award
  fetched: 2026-11-12
  quote: it has established an integrated system for aerial surveys using unmanned aerial vehicles (drones)
    or manned aircraft equipped with the latest aerial photography cameras and scanners for land and sea
    mapping
- claim: Provides core digital geographic databases and updated aerial and satellite imagery to government
    institutions, linked through the National GISNet.
  url: https://www.gulf-times.com/article/687243/qatar/ministry-of-municipality-receives-35-years-of-excellence-in-gis-award
