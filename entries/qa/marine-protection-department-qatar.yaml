summary: Conducts marine environment assessments, with a new ministry vessel reported
  in May 2026 to support sample collection and monitoring of red tides and fish die-offs.
facts:
- claim: In May 2026 the Qatar News Agency reported that the ministry's new vessel
    would enhance marine environment assessment programmes carried out by the Marine
    Protection Department.
  url: https://qna.org.qa/en/News-Area/News/2026-5/9/mecc-unveils-advanced-vessel-to-boost-qatars-marine-environmental-surveillance
  fetched: 2026-11-14
  quote: it will also enhance marine environment assessment programs carried out by
    the Marine Protection Department in coordination with the Environmental Monitoring
    and Inspection Department
- claim: The department's director said the vessel would support marine sample collection
    and the monitoring of red tides and fish die-offs.
  url: https://qna.org.qa/en/News-Area/News/2026-5/9/mecc-unveils-advanced-vessel-to-boost-qatars-marine-environmental-surveillance
  fetched: 2026-11-14
  quote: the vessel will support a wide range of operations, including marine sample
    collection, preliminary analysis, and the monitoring of environmental phenomena
    such as red tides and fish die-offs.
