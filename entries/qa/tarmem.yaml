  planned next.
facts:
- claim: In April 2021, CMU reported that the project was using artificial intelligence to
    coordinate small unmanned aerial and marine robots to gather marine environment data over
    a large area, with validation and outdoor marine testing planned next.
  url: https://www.cmu.edu/news/stories/archives/2021/april/qatar-waters.html
  fetched: 2026-11-12
  quote: Di Caro's team has rethought the process and is using artificial intelligence to
    coordinate a fleet of unmanned and relatively small aerial and marine robots to gather
    data over a large area.
- claim: In April 2021, CMU reported that AI methods were used in the system for online distributed
    planning of sampling, navigation and data sharing between the robots.
  url: https://www.cmu.edu/news/stories/archives/2021/april/qatar-waters.html
  fetched: 2026-11-12
  quote: AI methods allow for the online distributed planning of sampling activities, collision-free
    navigation while maintaining network connectivity, distributed data sharing
- claim: In April 2021 the project was to move next to validation and outdoor testing in marine
    environments.
  url: https://www.cmu.edu/news/stories/archives/2021/april/qatar-waters.html
  fetched: 2026-11-12
  quote: The multi-year project will next focus on validation and outdoor testing in marine
    environments.
