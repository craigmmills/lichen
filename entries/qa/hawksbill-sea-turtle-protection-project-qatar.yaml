summary: Ministry-run turtle protection project launched in 2003 with QatarEnergy
  and Qatar University's Environmental Science Center, reported in 2025 to use environmental
  data, tagging, DNA sampling and satellite tracking, with 2026 beach monitoring patrols.
facts:
- claim: For the 2026 nesting season the ministry said it ran field programmes and
    patrols to monitor key hawksbill nesting beaches.
  url: https://qna.org.qa/en/News-Area/News/2026-8/1/moecc-announces-end-of-2026-hawksbill-sea-turtle-nesting-season
  fetched: 2026-11-14
  quote: The ministry said it provided suitable conditions for turtle nesting throughout
    the season by implementing specialized field programs and deploying patrols to
    monitor key nesting beaches.
- claim: The ministry said the project was launched in 2003 in partnership with QatarEnergy
    and the Environmental Science Center at Qatar University.
  url: https://qna.org.qa/en/News-Area/News/2026-8/1/moecc-announces-end-of-2026-hawksbill-sea-turtle-nesting-season
  fetched: 2026-11-14
  quote: the Hawksbill Sea Turtle Protection Project was launched in 2003 in partnership
    with QatarEnergy and the Environmental Science Center at Qatar University.
- claim: In August 2025 the Qatar News Agency reported that the project's measures
    included collecting environmental data, tagging, DNA sampling and satellite tracking
    of turtles.
  url: https://qna.org.qa/en/News-Area/Special-News/2025-8/6/protecting-sea-turtles-on-qatars-beaches-ongoing-efforts-to-preserve-biodiversity
  fetched: 2026-11-14
  quote: the project included various measures such as closing beaches during nesting
    season, relocating nests to safe areas, collecting environmental data, tagging,
    DNA sampling, and satellite tracking of turtles.
