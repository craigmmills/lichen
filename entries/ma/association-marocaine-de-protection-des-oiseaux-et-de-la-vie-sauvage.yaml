summary: Moroccan bird and wildlife association that, with partners, colour-ringed
  and fitted GPS transmitters to White-backed Vultures at the Jbel Moussa centre in
  May to June 2024, reported as three or four birds.
facts:
- claim: A Moroccan Birds page says that between May and June 2024 four White-backed
    Vultures were colour-ringed and fitted with GPS transmitters at the Jbel Moussa
    Vulture Rehabilitation Centre, work carried out by AMPOVIS with AMPR and other
    partners.
  url: https://magornitho.org/2024/08/movements-gps-tagged-white-backed-vultures/
  fetched: 2026-11-13
  quote: This work was carried out by AMPOVIS (Association Marocaine de Protection
    des Oiseaux et de la Vie Sauvage) in collaboration with AMPR
- claim: A Bladi article quotes AMPOVIS as saying three vultures were fitted with
    GPS beacons at the Jbel Moussa centre, and says the monitoring is part of a scientific
    programme on African vultures jointly conducted by AMPOVIS and the National Agency
    of Water and Forests.
  url: https://en.bladi.net/morocco-vultures-return-from-europe-long-migratory-journey,117848.html
  fetched: 2026-11-13
  quote: The monitoring of these raptors is part of a scientific program on African
    vultures, jointly conducted by Ampovis and the National Agency of Water and Forests
