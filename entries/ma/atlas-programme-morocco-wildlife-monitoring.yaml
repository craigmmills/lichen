summary: A wildlife monitoring programme, described by IUCN in 2019, meant to provide basic information
  on Morocco's threatened fauna, including the first survey of cliff-nesting raptors, run by two named
  bodies.
facts:
- claim: IUCN said in 2019 that the programme is a wildlife monitoring programme meant to provide basic
    information on Morocco's threatened fauna.
  url: https://iucn.org/news/mediterranee/201902/first-programme-census-raptors-morocco-released
  fetched: 2026-11-08
  quote: This wildlife monitoring programme, known as the Atlas Programme, aims to provide basic information
    on the threatened fauna of Morocco.
- claim: IUCN said the first programme to survey and monitor diurnal cliff-nesting raptors in Morocco
    was part of it, with Moroccan NGOs GOMAC and ASARA among those on the first expedition.
  url: https://iucn.org/news/mediterranee/201902/first-programme-census-raptors-morocco-released
  fetched: 2026-11-08
  quote: The first programme to carry out a survey and monitor diurnal cliff-nesting raptors in Morocco
    – an action integrated in the ATLAS Programme
- claim: IUCN said the programme was part of the Safe Flyways project on infrastructure-related bird mortality
    in the Mediterranean, sponsored by the MAVA Foundation.
  url: https://iucn.org/news/mediterranee/201902/first-programme-census-raptors-morocco-released
  fetched: 2026-11-08
  quote: The Atlas Programme is integrated in the " Safe Flyways – reducing infrastructure-related bird
    mortality in the Mediterranean " Project, sponsored by the Mava Foundation.
