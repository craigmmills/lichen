summary: CEPF-funded monitoring platform for water resources, biodiversity and ecosystems
  of the Atlas Cedar Biosphere Reserve, with a scientific council and accredited observers,
  described in its final report as a first in Morocco.
facts:
- claim: AMEPN's CEPF small-grant final report describes the observatory as a monitoring
    platform for the water resources of lakes and rivers, biodiversity and the state
    of natural ecosystems in the Atlas Cedar Biosphere Reserve.
  url: https://www.cepf.net/sites/default/files/final-project-report-113761.pdf
  fetched: 2026-11-13
  quote: L’observatoire se veut une plateforme de suivi
- claim: The report says the observatory has a scientific council and relies on a
    group of accredited observers whose task is to work daily on monitoring the state
    of the reserve's wetlands.
  url: https://www.cepf.net/sites/default/files/final-project-report-113761.pdf
  fetched: 2026-11-13
  quote: L’Observatoire des Zones Humides s’est doté d’un Conseil Scientifique regroupant
    des personnalités de haut
- claim: The report calls the observatory a first in Morocco.
  url: https://www.cepf.net/sites/default/files/final-project-report-113761.pdf
  fetched: 2026-11-13
  quote: L’Observatoire des Zones humides est une première au Maroc
