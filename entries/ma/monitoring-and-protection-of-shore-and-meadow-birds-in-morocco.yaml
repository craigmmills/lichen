summary: According to Dutch agriculture ministry news, this six-month citizen science
  project finished in late 2025, training over 70 volunteers and producing Morocco's
  first wintering shore and meadow bird atlas.
facts:
- claim: The Dutch agriculture ministry's news page says the project was completed
    at the end of 2025 after six months of implementation.
  url: https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/01/29/protecting-migratory-birds-along-a-shared-flyway
  fetched: '2026-11-12'
  quote: The project "Monitoring and Protection of Shore and Meadow Birds in Morocco"
    was completed at the end of 2025 after six months of implementation.
- claim: The page says the citizen science project focused on training volunteers
    as bird observers to improve the quality and long-term use of monitoring data.
  url: https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/01/29/protecting-migratory-birds-along-a-shared-flyway
  fetched: '2026-11-12'
  quote: The citizen science project therefore placed strong emphasis on capacity
    building of volunteers, with the objective of reducing these gaps by training
    a new generation of bird observers.
- claim: The page says more than 70 participants were trained in bird identification,
    population estimation, survey techniques and data recording at Smir Lagoon, Merja
    Zerga and Sidi Boughaba.
  url: https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/01/29/protecting-migratory-birds-along-a-shared-flyway
  fetched: '2026-11-12'
  quote: They were trained in bird identification, population estimation, survey techniques,
    data recording and reporting
- claim: The page says the project produced the first atlas of wintering shore and
    meadow birds in Morocco.
  url: https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/01/29/protecting-migratory-birds-along-a-shared-flyway
  fetched: '2026-11-12'
  quote: In addition, the first atlas of wintering shore and meadow birds in Morocco
    was produced.
- claim: The page says a follow-up project is planned for 2026.
  url: https://www.agroberichtenbuitenland.nl/actueel/nieuws/2026/01/29/protecting-migratory-birds-along-a-shared-flyway
  fetched: '2026-11-12'
  quote: a follow-up project is planned for 2026 as part of LAN Rabat's activity plan
