summary: A conservation programme run by Morocco's national forest agency (ANEF),
  reported in September 2026 as launched with Spain for the Andalusian buttonquail,
  combining wild monitoring, captive breeding and preservation of genetic diversity.
facts:
- claim: Morocco World News (18 September 2026) reports that Morocco and Spain launched
    a conservation programme for the Andalusian buttonquail, whose last known population
    survives on Morocco's Atlantic coast.
  url: https://www.moroccoworldnews.com/2026/09/338835/morocco-spain-launch-joint-program-to-save-the-andalusian-buttonquail/
  fetched: '2026-11-15'
  quote: Marrakech – Morocco and Spain have launched a conservation program for the
    Andalusian buttonquail (Turnix sylvaticus sylvaticus), a threatened bird subspecies
    whose last known population survives along Morocco’s Atlantic coast.
- claim: The article says ANEF's programme combines monitoring of wild populations,
    captive breeding and the preservation of genetic diversity.
  url: https://www.moroccoworldnews.com/2026/09/338835/morocco-spain-launch-joint-program-to-save-the-andalusian-buttonquail/
  fetched: '2026-11-15'
  quote: ANEF announced this week the implementation of its ex situ conservation program,
    which combines monitoring of wild populations, captive breeding, and the preservation
    of genetic diversity.
- claim: The article says Moroccan and Spanish experts carried out field surveys that
    made it possible to set up a captive breeding group.
  url: https://www.moroccoworldnews.com/2026/09/338835/morocco-spain-launch-joint-program-to-save-the-andalusian-buttonquail/
  fetched: '2026-11-15'
  quote: A team of Moroccan and Spanish experts conducted field surveys, which made
    it possible to establish a group of captive-bred birds to serve as breeding stock.
