summary: This Moroccan bird conservation organisation participates in waterbird monitoring
  and, under a CEPF grant, revised 42 inland wetland site sheets and compiled flora and fauna
  data.
facts:
- claim: A report on Morocco's 2009–2018 winter waterbird counts says GREPOM strengthened
    the effort from 1993; the national counts involved 20 to 30 volunteers and 43 to 115 sites
    per year.
  url: https://tourduvalat.org/download/33250
  fetched: 2026-11-08
  quote: Cet effort, renforcé à partir de 1993 par le GREPOM, puis par le réseau Réseau Oiseaux
    d'Eau Méditerranée (ROEM) a
- claim: Took part in a CEPF-funded project set up by Tour du Valat to monitor North African
    waterbirds; the page calls the Moroccan partner “GREPON/Birdlife Morocco”.
  url: https://tourduvalat.org/actualites-projets/film-sur-le-projet-suivi-des-oiseaux-deau-en-afrique-du-nord-pour-la-conservation-des-zones-humides
  fetched: 2026-11-08
  quote: le GREPON/Birdlife Morocco et la Libyan Society for Birds
- claim: Under CEPF grant CEPF-111550 it revised 42 inland wetland site sheets and built a
    flora and fauna database meant as the core of an information system on Morocco's inland
    wetlands.
  url: https://www.cepf.net/resources/final-project-report/final-project-report-2724
  fetched: 2026-11-08
  quote: Ce travaille a permis d’avoir une base de données Excel de flore et de faune des
    Sites d'Intérêt Biologique et Ecologique et Sites Ramsar inscrits
- claim: Launched a project to revise Morocco's 46 Important Bird and Biodiversity Areas and
    identify new ones, and held a national workshop on it in Rabat on 13 February 2025.
  url: https://www.grepom.org/?p=7541
  fetched: 2026-11-08
  quote: GREPOM/BirdLife Morocco organized a national workshop on February 13, 2025, in Rabat
- claim: The national clearing-house site says GREPOM initiated the workshop, held at the
    Scientific Institute of Rabat in December 2025, to validate the Red List of Birds of Morocco.
  url: https://ma.chm-cbd.net/en/news/validation-de-la-liste-rouge-des-oiseaux-du-maroc-une-etape-cle-pour-la-conservation-de-la
  fetched: 2026-11-08
  quote: This event, initiated by GREPOM/BirdLife Morocco, brought together a panel of scientific
    experts
- claim: IUCN's member directory lists GREPOM as a member and says it runs a research and
    waterbird monitoring programme in Morocco.
  url: https://iucn.org/our-union/members/iucn-members/groupe-de-recherche-pour-la-protection-des-oiseaux-au-maroc
  fetched: 2026-11-08
  quote: GREPOM runs extensive research and waterbird monitoring programme in Morocco
