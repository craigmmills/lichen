  quote: We’ve hired 10 local scouts to monitor the macaque population by patrolling 125.000 ha every
    day and every night
- claim: IFAW reports an average macaque population increase of 31.1% in 13 monitored groups since 2017.
  url: https://www.ifaw.org/africa/projects/born-to-be-wild-morocco
  fetched: 2026-11-08
  quote: This is an annual increase of 9.5% in 13 monitored macaque groups.
