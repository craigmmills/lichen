summary: A Moroccan agency that in July 2024 was reported to use an AI-based system to identify
  likely forest fire areas, and in December 2025 held a workshop on updating protected-area
  planning.
facts:
- claim: Organised a national workshop in Rabat in December 2025 on updating the Protected
    Areas Master Plan (PDAP).
  url: https://ecoactu.ma/plan-directeur-des-aires-protegees/
  fetched: 2026-11-08
  quote: un atelier national de restitution consacré à l’actualisation du Plan Directeur des
    Aires Protégées (PDAP)
- claim: The updated plan raised the number of Sites of Biological and Ecological Interest
    from 154 to 197.
  url: https://ecoactu.ma/plan-directeur-des-aires-protegees/
  fetched: 2026-11-08
  quote: De 154 à 197 Sites d’Intérêt Biologique et Écologique (SIBEs)
- claim: Its Director General, Abderrahim Houmy, described the new plan as a new generation
    of protected-area planning.
  url: https://ecoactu.ma/plan-directeur-des-aires-protegees/
  fetched: 2026-11-08
  quote: Nous entrons dans une nouvelle génération de planification des aires protégées
- claim: In July 2024, Hespress reported its Director General saying the agency used an AI-based
    information system to identify areas most likely to have forest fires.
  url: https://fr.hespress.com/375217-comment-le-maroc-utilise-lia-pour-reduire-de-50-les-feux-de-foret.html
  fetched: 2026-11-08
  quote: Il a expliqué que l’Agence utilise un système d’information basé sur l’intelligence
    artificielle pour identifier les zones les plus susceptibles de connaître des incendies.
- claim: Hespress reported in July 2024 that the agency published daily fire-risk forecast
    maps, citing an agency statement.
  url: https://fr.hespress.com/375217-comment-le-maroc-utilise-lia-pour-reduire-de-50-les-feux-de-foret.html
  fetched: 2026-11-08
  quote: l’Agence publie quotidiennement, selon le communiqué, des « cartes de prévision précises
    des zones sensibles et à risque d’incendie « .
- claim: Has a Directorate of National Parks, Protected Areas and Nature Protection, according
    to GREPOM/BirdLife Maroc.
  url: https://www.grepom.org/?p=7541
  fetched: 2026-11-08
  quote: the Directorate of National Parks, Protected Areas, and Nature Protection (ANEF)
- claim: Earth Fire Alliance lists it on its partners page, in the list of FireSat early adopters.
  url: https://www.earthfirealliance.org/partners
  fetched: 2026-11-08
  quote: Moroccan National Agency for Water and Forests (ANEF)
- claim: The environment ministry's site lists the agency among its affiliated sites, with
    the address of its website.
  url: https://www.environnement.gov.ma/fr/plan-du-site
  fetched: 2026-11-08
  quote: l’Agence Nationale des Eaux et Forêts
- claim: IUCN quotes the Head of its Department of National Parks and Protected Areas.
  url: https://iucn.org/news/202509/morocco-adopts-its-first-national-strategy-conservation-birds-prey
  fetched: 2026-11-08
  quote: says Zouhair AMHAOUCH , Head of the Department of National Parks and Protected Areas
    at ANEF
- claim: IUCN says the agency and IUCN launched the National Strategy for the Conservation
    of Birds of Prey 2024 to 2034 in September 2025, and that the agency initiated it.
  url: https://iucn.org/news/202509/morocco-adopts-its-first-national-strategy-conservation-birds-prey
  fetched: 2026-11-08
  quote: This strategy, initiated by the Agence Nationale des Eaux et Forêts (National Water
    and Forestry Agency) and coordinated with IUCN Med and the IUCN Conservation Planning
    Specialist Group
