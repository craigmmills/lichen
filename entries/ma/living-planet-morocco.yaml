summary: A Moroccan non-profit reports working with the national forestry agency since
  early 2023 on Atlas Cedar Biosphere Reserve wildlife monitoring, supporting seven
  eco-guards geolocating sightings for monthly maps.
facts:
- claim: Its wildlife monitoring page says it has worked with the Agence Nationale
    des Eaux et Forêts since early 2023 to develop a wildlife monitoring system in
    the Atlas Cedar Biosphere Reserve.
  url: https://lpm.org.ma/?p=6150
  fetched: '2026-11-12'
  quote: Since the beginning of 2023, Living Planet Morocco has been working with
    the Agence National des Eaux et Forêts to develop a wildlife monitoring system
    in the Atlas Cedar Biosphere Reserve (ACBR).
- claim: The page says the NGO takes charge of seven eco-guards from the local population
    who regularly collect data on wild and reintroduced species.
  url: https://lpm.org.ma/?p=6150
  fetched: '2026-11-12'
  quote: The NGO takes charge of 7 eco-guards from the local population to regularly
    collect data on the presence of wild and reintroduced species.
- claim: In September 2023 it organised a workshop that trained 15 reserve eco-guards
    in the use of a wildlife monitoring application.
  url: https://lpm.org.ma/?p=6150
  fetched: '2026-11-12'
  quote: The event provided an opportunity to train 15 Reserve eco-guards in the use
    of a wildlife monitoring application.
- claim: The page says eco-guards geolocate sightings and a map of sightings is generated
    monthly as a decision-making tool.
  url: https://lpm.org.ma/?p=6150
  fetched: '2026-11-12'
  quote: A map of the sightings is generated monthly to serve as a decision-making
    tool
- claim: The site gives a Casablanca address and says it is a non-profit with public-interest
    status granted by the Government of Morocco.
  url: https://lpm.org.ma/?p=6150
  fetched: '2026-11-12'
  quote: Living Planet Morocco is a non-profit organization officially granted public-interest
    status by the Government of Morocco
