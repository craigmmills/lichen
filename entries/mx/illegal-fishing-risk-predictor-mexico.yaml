  quote: to build an illegal fishing risk predictor to identify hot spots where IUU fishing might be taking
    place
- claim: In November 2020, the first planned step was a predictor for the pilot site of Loreto Bay in
    Baja California Sur.
  url: https://globalfishingwatch.org/article/illegal-fishing-risk-in-mexico/
  fetched: '2026-11-03'
  quote: The first step in developing this tool will be to create an illegal fishing risk predictor specifically
    for the pilot site of Loreto Bay in Baja California Sur.
- claim: The November 2020 plan was to use information on small-scale fishing events previously identified
    as illegal by CONANP.
  url: https://globalfishingwatch.org/article/illegal-fishing-risk-in-mexico/
  fetched: '2026-11-03'
