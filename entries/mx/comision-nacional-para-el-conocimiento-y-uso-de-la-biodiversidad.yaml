summary: Inter-ministerial commission created in 1992 that runs the National Biodiversity
  Information System, receives MODIS, VIIRS and AVHRR imagery, and is the focal point for
  Mexico's Global Biodiversity Framework process.
facts:
- claim: Described itself in a 2014 release as a permanent inter-ministerial commission that
    keeps the national biodiversity information system up to date.
  url: https://www.gob.mx/conabio/prensa/conabio-y-conanp-impulsan-ciencia-y-conciencia-ciudadana-hacia-la-conservacion
  fetched: 2026-11-03
  quote: conformar y mantener actualizado el Sistema Nacional de Información sobre Biodiversidad
    (SNIB)
- claim: In June 2025, UNDP recognised its leadership in preparing Mexico's seventh national
    biodiversity report, which was to report on 48 national targets aligned with the Kunming-Montreal
    framework.
  url: https://www.undp.org/es/mexico/noticias/mexico-inicia-la-integracion-de-su-septimo-informe-nacional-sobre-biodiversidad-con-el-respaldo-del-pnud
  fetched: 2026-11-03
  quote: Reconocemos el liderazgo de la CONABIO
- claim: A 2026 SEMARNAT vacancy says ecosystem monitoring systems based on satellites and
    field sensors serve CONABIO's mandate.
  url: https://dof.gob.mx/vacantes/22016/014308.html
  fetched: 2026-11-03
  quote: PARA CUMPLIR CON EL MANDATO DE LA CONABIO
- claim: Is a permanent inter-ministerial commission that maintains the National Biodiversity
    Information System.
  url: https://www.gob.mx/conabio/prensa/crece-como-la-espuma-naturalista-la-red-de-ciencia-ciudadana-mas-grande-de-mexico?idiom=es
  fetched: '2026-11-03'
  quote: La CONABIO es una comisión intersecretarial de carácter permanente
- claim: An intersecretarial commission created by presidential agreement in 1992.
  url: http://www.conabio.gob.mx/web/transparencia.html
  fetched: 2026-11-03
  quote: La CONABIO es una Comisión intersecretarial creada por Acuerdo presidencial en 1992
- claim: The commission is made up of the federal executive, who chairs it, and the heads
    of ten ministries.
  url: http://www.conabio.gob.mx/web/transparencia.html
  fetched: 2026-11-03
  quote: La Comisión Nacional está conformada por el Ejecutivo Federal, quien la preside,
    y las personas titulares de diez Secretarías
- claim: Says it has developed bioinformatic systems, platforms and software tools to hold
    and share the data it compiles or generates.
  url: http://www.conabio.gob.mx/web/transparencia.html
  fetched: 2026-11-03
  quote: ha desarrollado diversos sistemas bioinformáticos, plataformas y herramientas informáticas
- claim: A 2013 presentation by CONABIO says it operates as Mexico's clearing-house mechanism
    under the Convention on Biological Diversity.
  url: https://www.cbd.int/doc/meetings/chm/chm-rw-2013-la/other/chm-rw-2013-la-item-05-mx-es.pdf
  fetched: 2026-11-03
  quote: La CONABIO opera como el Mecanismo Facilitador de Información en México
- claim: Its Geoportal is a geospatial data platform for viewing and downloading multi-scale
    geographic information.
  url: http://www.conabio.gob.mx/informacion/gis/
  fetched: 2026-11-03
  quote: El Geoportal es una plataforma de datos geoespaciales de la CONABIO que permite consultar
    , visualizar y descargar información geográfica multiescala.
