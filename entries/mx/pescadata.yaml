summary: A free iOS and Android app for small-scale fishers to record catches and share data, built by
  Comunidad y Biodiversidad, which reports 2,915 active users and over 1,047 people trained since 2020.
facts:
- claim: Fishers can record and share data such as costs, daily catches, gear types and bycatch.
  url: https://oceanriskalliance.org/project/pescadata-app/
  fetched: 2026-11-03
  quote: fishers can record and share data (such as costs, daily catches, gear types, bycatch)
- claim: Focuses on small-scale fisheries in Mexico, Honduras, Colombia and Ecuador, according to FishWise.
  url: https://fishwise.org/designing-pescadata-using-seafood-principles/
  fetched: 2026-11-03
  quote: Currently, this mobile application focuses on small-scale fisheries in Mexico, Honduras, Colombia,
    and Ecuador.
- claim: Free iOS and Android app designed by and for small-scale fishers in Latin America and the Caribbean.
  url: https://cobi.org.mx/solucion/pescadata/
  fetched: '2026-11-03'
  quote: PescaData es una aplicación móvil gratuita, disponible en iOS y Android, diseñada por y para
    personas dedicadas a la pesca en pequeña escala en América Latina y el Caribe.
- claim: COBI reports 2, 915 active users and more than 1, 047 people trained since 2020.
  url: https://cobi.org.mx/solucion/pescadata/
  fetched: '2026-11-03'
  quote: Desde 2020, más de 1,047 personas han sido capacitadas en el uso de PescaData, con 2,915 usuarios
    activos
