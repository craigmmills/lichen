summary: A CONABIO-built and run platform, partnered with the Carlos Slim Foundation and iNaturalist,
  that identifies images automatically for curator review and reached 5 million observations in Mexico
  by 9 March 2023.
facts:
- claim: By March 2023, it had reached 5 million observations of more than 45,000 species from more than
    138,000 users, according to the Carlos Slim Foundation.
  url: https://fundacioncarlosslim.org/english/mexico-reaches-5-million-observations-of-plants-animals-and-fungi-in-naturalista/
  fetched: 2026-11-03
  quote: with records of more than 45 thousand species, and with the participation of more than 138 thousand
    users
- claim: Images are automatically identified and then reviewed by participants and curators.
  url: https://fundacioncarlosslim.org/english/mexico-reaches-5-million-observations-of-plants-animals-and-fungi-in-naturalista/
  fetched: 2026-11-03
  quote: The images are automatically identified and reviewed by the participants of the international
    network and the curators.
- claim: CONABIO says the platform uses artificial intelligence to identify images automatically or give
    suggestions that curators confirm.
  url: https://www.gob.mx/conabio/prensa/crece-como-la-espuma-naturalista-la-red-de-ciencia-ciudadana-mas-grande-de-mexico?idiom=es
  fetched: '2026-11-03'
  quote: A través del desarrollo de inteligencia artificial, la plataforma identifica automáticamente
    las imágenes o proporciona sugerencias
- claim: Reached 5 million observations of more than 45,000 species in Mexico by 9 March 2023.
  url: https://www.gob.mx/conabio/prensa/mexico-llega-a-5-millones-de-observaciones-de-plantas-animales-y-hongos-en-naturalista?idiom=es
  fetched: '2026-11-03'
  quote: México alcanza los 5 millones de observaciones de plantas, animales y hongos
- claim: In March 2023 the Carlos Slim Foundation reported 5 million observations, more than 45 thousand
    species and more than 138 thousand users.
  url: https://fundacioncarlosslim.org/english/mexico-reaches-5-million-observations-of-plants-animals-and-fungi-in-naturalista/
  fetched: 2026-11-03
  quote: Mexico has reached 5 million observations of plants, animals and fungi that inhabit our country,
    with records of more than 45 thousand species, and with the participation of more than 138 thousand
    users
