- claim: In December 2022, it described using the M2 system, with a long-range camera, radar
    and software recording vessel movements.
  url: https://pronatura-noroeste.org/en/conservation-technology-protect-wildlife-manage-fishery/
  fetched: '2026-11-03'
  quote: The M2 system, also known as Marine Monitor, consists of a long-range camera, radar
    and software for registering vessel movements within certain areas
- claim: In September 2022, it described monitoring migratory birds through a network of Motus
    stations in a transnational alliance.
  url: https://pronatura-noroeste.org/en/motus-monitoring-network/
  fetched: '2026-11-03'
  quote: there is a transnational alliance that, among other things, includes the monitoring
    of flocks of birds through a network of MOTUS stations.
