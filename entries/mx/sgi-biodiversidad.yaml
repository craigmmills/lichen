  quote: crearon el Sistema de Gestión de la Información de Biodiversidad (SGI-BIODIVERSIDAD)
- claim: Ejidos and communities must register and use the platform to capture, store
    and consult the field data of BIOCOMUNI monitoring.
  url: https://sgi-biodiversidad.cnf.gob.mx/
  fetched: '2026-11-12'
  quote: Los ejidos y comunidades deben registrarse y usar la plataforma digital SGI-BIODIVERSIDAD
- claim: Access to records is by passwords held by the brigade representative; the
