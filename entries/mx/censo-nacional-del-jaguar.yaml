summary: Closed national jaguar census, led by Gerardo Ceballos and run by the Alianza Nacional
  para la Conservación del Jaguar, using 920 camera traps over 90 days in 2024 and reported
  to show 5,326 jaguars.
facts:
- claim: La Crónica de Hoy reports the third census used 920 camera traps, with 30 points
    per site, active for 90 days.
  url: https://www.cronica.com.mx/academia/2025/09/29/aumenta-la-poblacion-del-jaguar-en-mexico-pero-sigue-en-peligro-de-extincion/
  fetched: 2026-11-03
  quote: se utilizaron 920 cámaras trampa distribuidas en 30 puntos por sitio, activadas durante
    90 días
- claim: La Crónica de Hoy reports the population rose from 4,800 in 2018 to 5,326 in 2024.
  url: https://www.cronica.com.mx/academia/2025/09/29/aumenta-la-poblacion-del-jaguar-en-mexico-pero-sigue-en-peligro-de-extincion/
  fetched: 2026-11-03
  quote: creció de 4,800 en 2018 a 5,326 ejemplares en 2024
- claim: Global Conservation reports 5, 326 jaguars in Mexico in 2024, a 30% rise on 2010.
  url: https://globalconservation.org/news/mexicos-jaguar-numbers-jump-up-30-in-newest-national-census-finding
  fetched: '2026-11-03'
  quote: The group’s latest census found that in 2024 there were 5,326 jaguars in Mexico,
    a 30% increase compared with 2010.
- claim: The 2024 census ran over 90 days in 15 states with 920 motion-capture cameras.
  url: https://globalconservation.org/news/mexicos-jaguar-numbers-jump-up-30-in-newest-national-census-finding
  fetched: '2026-11-03'
  quote: The census took place over 90 days across 15 states, using 920 motion-capture cameras
- claim: Used 40 automatic cameras per sampling site, 920 in total.
  url: https://www.ancjaguar.mx/censo-nacional-del-jaguar
  fetched: '2026-11-03'
  quote: En cada sitio de muestreo se usaron 40 cámaras automáticas distribuidas en 30 puntos
