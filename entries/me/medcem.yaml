summary: A Montenegrin NGO and CEPF grantee (grant CEPF-108820) that monitored Posidonia
  oceanica markers and monk seals in the 2018 to 2021 Katič project, and installed
  10 pilot ecological moorings in 2013.
facts:
- claim: A CEPF environmental assessment for grant CEPF-108820 names the grantee organisation
    as the NGO Mediterranean Center for Environmental Monitoring (MedCEM), for a project
    in Montenegro.
  url: https://www.cepf.net/sites/default/files/safeguard-eia-ecological-moorings-108820.pdf
  fetched: 2026-11-15
  quote: Grantee organization – NGO Mediterranean Center for Environmental Monitoring
    - MedCEM
- claim: The CEPF final report on the Katič project (2018 to 2021) says MedCEM worked
    on monitoring of permanent markers for Posidonia oceanica and on monitoring of
    monk seals.
  url: https://cepf.net/resources/final-project-report/final-project-report-2556
  fetched: 2026-11-15
  quote: on Monitoring of permanent markers (balissages) for Posidonia oceanica and
    monitoring of Monk seals.
- claim: The same CEPF assessment says MedCEM installed the first 10 pilot ecological
    moorings in Montenegro in 2013.
  url: https://www.cepf.net/sites/default/files/safeguard-eia-ecological-moorings-108820.pdf
  fetched: 2026-11-15
  quote: First 10 pilot ecological moorings in Montenegro where installed in 2013
    by MedCEM
