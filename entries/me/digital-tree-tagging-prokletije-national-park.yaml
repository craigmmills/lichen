summary: Active project introducing digital tree tags in Prokletije National Park to improve forest monitoring,
  with partners including national parks and the ministry; it created a digital inventory of 20,000 trees.
facts:
- claim: Introduces a digital tree tagging system to improve forest monitoring in Prokletije National
    Park, in response to pests, illegal logging and a lack of forestry data.
  url: https://agritechobservatory.review.fao.org/en/innovative-technology-for-forest-protection-in-montenegro
  fetched: 2026-11-12
  quote: The project strengthens forest protection by introducing a digital tree tagging system that improves
    monitoring and conservation in National Park Prokletije.
- claim: Each tree's tag records species, age, health and location, feeding a forest inventory database
    used to follow changes and illegal logging threats.
  url: https://agritechobservatory.review.fao.org/en/innovative-technology-for-forest-protection-in-montenegro
  fetched: 2026-11-12
  quote: Each tree receives a digital tag that records species age, health status, and geolocation which
    enables accurate monitoring of forest conditions.
- claim: It created a digital inventory of 20,000 trees.
  url: https://agritechobservatory.review.fao.org/en/innovative-technology-for-forest-protection-in-montenegro
  fetched: 2026-11-12
  quote: The initiative created a digital inventory of 20 000 trees
