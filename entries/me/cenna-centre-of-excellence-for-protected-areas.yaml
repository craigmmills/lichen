summary: Active project, led by the University of Montenegro with Antwerp and Aarhus, planning a centre
  for smart environmental monitoring; it says it will address AI analytics, with pilots at Skadar Lake
  and Durmitor, from November 2026 to October 2032.
facts:
- claim: Its aim is to set up a Centre of Excellence for Smart Environmental Monitoring and Nature-Based
    Solutions for Protected Areas.
  url: https://cordis.europa.eu/project/id/101250506
  fetched: 2026-11-12
  quote: The main goal of the project CENNA is to establish a new Centre of Excellence for Smart Environmental
    Monitoring and Nature-Based Solutions for Protected Areas (CoE CENNA)
- claim: Among the challenges it says it will address are sensor networks, multi-sensor fusion and AI-driven
    environmental analytics.
  url: https://cordis.europa.eu/project/id/101250506
  fetched: 2026-11-12
  quote: multi-sensor fusion, autonomous vehicle coordination, AI-driven environmental analytics, and
    adaptive ecosystem restoration
- claim: Pilot projects at Skadar Lake and Durmitor National Park will serve as test sites.
  url: https://cordis.europa.eu/project/id/101250506
  fetched: 2026-11-12
  quote: Flagship pilot projects at Skadar Lake and Durmitor National Park will serve as test environments
    for developing and improving environment monitoring systems
- claim: It runs from 1 November 2026 to 31 October 2032.
  url: https://cordis.europa.eu/project/id/101250506
  fetched: 2026-11-12
  quote: 1 November 2026
