  funding.
facts:
- claim: Its mission is to protect birds and other biodiversity groups and their habitats through scientific
    research, education and advocacy.
  url: https://czip.me/
  fetched: 2026-11-12
  quote: Misija CZIP-a je zaštita ptica i drugih biodiverzitetskih grupa i njihovih staništa kroz naučna
    istraživanja
- claim: Its website lists a Podgorica address and registration number 978.
  url: https://czip.me/
  fetched: 2026-11-12
  quote: 'Registarski broj: 978'
- claim: Its 2024 annual report describes camera traps recording during monitoring in Piva Nature Park.
  url: https://czip.me/wp-content/uploads/2025/11/godisnji-izvjestaj-czip-2024-2.pdf
  fetched: 2026-11-12
  quote: kamere-zamke zabilježile tokom monitoringa u PP Piva.
- claim: Its 2023 annual report says it began the first monitoring of common bird species.
  url: https://czip.me/wp-content/uploads/2025/02/godisnji-izvjestaj-czip-2023-2.pdf
  fetched: 2026-11-12
  quote: Započeli smo prvi monitoring uobičajenih vrsta ptica (Common Birds Monitoring).
- claim: Its 2024 annual report describes monitoring of illegal activities over 25 days.
  url: https://czip.me/wp-content/uploads/2025/11/godisnji-izvjestaj-czip-2024-2.pdf
  fetched: 2026-11-12
  quote: Sproveli smo monitoring ilegalnih aktivnosti u trajanju od 25
- claim: The 2022 national waterbird census report names CZIP as BirdLife Montenegro among the census
    partners.
  url: https://iwc60.pmcg.co.me/wp-content/uploads/2026/03/Vizi-NM14IWC-izvjestaj-2022.pdf
  fetched: 2026-11-12
  quote: ptica (CZIP) – BirdLife Montenegro i Društv a prirodnjaka Crne Gore (DPCG). Redovni u česnik
- claim: Its CEPF grant for Ecotourism in Ulcinj Salina (May 2013 to March 2017) included regular monitoring
    of bird species in the salt pans.
  url: https://www.cepf.net/grants/grantee-projects/ecotourism-ulcinj-salina
