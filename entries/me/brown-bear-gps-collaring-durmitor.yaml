summary: 'A project run by CZIP in Durmitor National Park: a brown bear was fitted
  with a GPS/GSM collar on 10 June 2025, and the same bear was recaptured and recollared
  on 18 June 2026.'
facts:
- claim: On 10 June 2025 a CZIP research team captured a brown bear in Durmitor National
    Park and fitted it with a GPS/GSM collar, with support from Durmitor National
    Park and Piva Nature Park.
  url: https://interreg-danube.eu/projects/forestconnect/news/brown-bear-captured-and-tagged-with-gps-collar-in-durmitor-national-park
  fetched: 2026-11-15
  quote: a brown bear was successfully captured and fitted with a GPS/GSM collar in
    Durmitor National Park by a research team from the Centre for Protection and Research
    of Birds of Montenegro (CZIP)
- claim: The page says the satellite telemetry allows continuous monitoring of the
    bear's movements and behaviour.
  url: https://interreg-danube.eu/projects/forestconnect/news/brown-bear-captured-and-tagged-with-gps-collar-in-durmitor-national-park
  fetched: 2026-11-15
  quote: This satellite telemetry method enables continuous monitoring of the bear's
    movements and behavior
- claim: The page, dated 2 July 2025, says CZIP planned to collar at least one more
    bear by the end of 2025.
  url: https://interreg-danube.eu/projects/forestconnect/news/brown-bear-captured-and-tagged-with-gps-collar-in-durmitor-national-park
  fetched: 2026-11-15
  quote: By the end of 2025, CZIP plans to collar at least one more bear as part of
    this research initiative.
- claim: A ForestConnect page of July 2026 says CZIP carried out another capture and
    GPS telemetry collaring operation in Durmitor National Park, recapturing the same
    bear on 18 June 2026 and fitting a new GPS/GSM collar, with camera traps at feeding
    sites showing it beforehand.
  url: https://interreg-danube.eu/projects/forestconnect/news/aleksandar-the-bear-in-forestconnect-focus-again
  fetched: 2026-11-15
  quote: On the evening of 18 June 2026, however, curiosity and perhaps a healthy
    appetite, finally tipped the scales in our favour. Aleksandar was safely captured
    in Durmitor National Park and fitted with a new GPS/GSM tracking collar.
