summary: Montenegrin NGO in Podgorica, funded by CEPF, with projects on Skadar frogs,
  oak, bats, Natura 2000 habitats and fish, and a 2025 to 2026 project aiming to improve
  herpetofauna data.
facts:
- claim: CEPF's final report gives its legal name as an NGO.
  url: https://cepf.net/resources/final-project-report/final-project-report-2608
  fetched: 2026-11-13
  quote: 'Organization Legal Name: NGO Montenegrin Ecologists Society'
- claim: Its Skadar frog project in the Bojana Delta ran from March 2019 to August
    2021.
  url: https://cepf.net/resources/final-project-report/final-project-report-2608
  fetched: 2026-11-13
  quote: 'Project Dates: 1 March 2019 – 31 August 2021'
- claim: The project used a data entry protocol for sampling chytridiomycosis on green
    frogs.
  url: https://cepf.net/resources/final-project-report/final-project-report-2608
  fetched: 2026-11-13
  quote: Data entry protocol for sampling chitridiomycosis on green frogs
- claim: Its 2025 to 2026 project aims to improve data on the status of Natura 2000
    and nationally protected herpetofauna species in Montenegro.
  url: https://drustvoekologa.me/en/?p=5154
  fetched: 2026-11-13
  quote: To improve the availability, quality and applicability of data on the status
    of selected Natura 2000 and nationally protected herpetofauna species in Montenegro
- claim: Its CEPF-funded Skadar oak project, dated June 2020 to June 2022, listed
    an inventory of old trees and habitat modelling among its objectives.
  url: https://www.cepf.net/grants/grantee-projects/inventory-monumental-skadar-pedunculate-oak-restoration-its-forests-and
  fetched: 2026-11-13
  quote: Conduct inventory of old individual trees and habitat modelling.
- claim: Its 2021–2022 project on high-priority Natura 2000 habitats set out to map
    habitats and assess key species in four river catchments and contribute to updating
    Montenegro's habitat type database.
  url: https://drustvoekologa.me/en/projects/mapping-high-priority-natura-2000-habitats-for-nature-protection-in-montenegro/
  fetched: 2026-11-13
  quote: The project will also contribute to updating Montenegro’s existing habitat
    type database
- claim: Its Lake Skadar bat project carried out the first winter census of bats in
    the area, using photography and counting and identification software or bat detectors,
    under a protocol developed by the project team.
  url: https://drustvoekologa.me/en/?p=4676
  fetched: 2026-11-13
  quote: the first winter census of bats in the Lake Skadar area was carried out through
    direct cave visits and observations of bat individuals
- claim: A CEPF-funded project of the society in the catchment around Nikšić set out
    to establish a scientific database of significant fish species.
  url: https://www.cepf.net/grants/grantee-projects/updating-conservation-status-important-fish-species-and-raising-awareness
  fetched: 2026-11-13
  quote: Establish a scientific database of significant fish species.
