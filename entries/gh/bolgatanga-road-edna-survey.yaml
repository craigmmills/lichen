facts:
- claim: NatureMetrics says the team used its eDNA technology to survey biodiversity along the Bolgatanga
    road and detected 59 species from ten water samples.
  url: https://www.naturemetrics.com/case-study/qgmi-sustainable-road-construction
  fetched: 2026-11-08
  quote: the team used NatureMetrics’ eDNA technology to survey biodiversity along the Bolgatanga road.
    From just ten water samples, the survey detected 59 species, including the Vulnerable Senegal flapshell
    turtle.
- claim: NatureMetrics says the data fed the project's environmental and social impact assessment and
    Biodiversity Action Plan.
  url: https://www.naturemetrics.com/case-study/qgmi-sustainable-road-construction
