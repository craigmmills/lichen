facts:
- claim: A harmonised method for assessing cocoa-linked deforestation risk so that efforts can be prioritised.
  url: https://www.wri.org/research/mapping-cocoa-assessing-deforestation-risk-cocoa-cote-divoire-ghana
  fetched: '2026-11-08'
  quote: Second is the Cocoa Deforestation Risk Assessment, a harmonized method of assessing cocoa-linked
    deforestation risk to enable prioritization of efforts to tackle deforestation before it happens.
- claim: Recent forest loss as a variable had a significant influence on its results.
  url: https://www.wri.org/research/mapping-cocoa-assessing-deforestation-risk-cocoa-cote-divoire-ghana
  fetched: '2026-11-08'
  quote: The inclusion of recent forest loss as a variable had a significant influence on the results
    of the Cocoa Deforestation Risk Assessment.
- claim: The technical note says it will be made publicly available and updated annually.
  url: https://www.wri.org/research/mapping-cocoa-assessing-deforestation-risk-cocoa-cote-divoire-ghana
  fetched: '2026-11-08'
  quote: The Cocoa Deforestation Risk Assessment will be made publicly available and updated annually.
