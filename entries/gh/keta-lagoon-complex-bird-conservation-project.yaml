- claim: An eight-day field trip organised by A Rocha Ghana and A Rocha France in
    February 2025 updated bird inventories and trained local wildlife officers.
  url: https://ghana.arocha.org/wp-content/uploads/sites/42/2025/11/Dry-Season-Bird-inventory-Keta-lagoon_022025.pdf
  fetched: 2026-11-12
  quote: Rocha Ghana and A Rocha France in order to update bird inventories and train
    local wildlife officers.
- claim: Sound recorders were deployed during the February 2025 ringing sessions to
    record birds.
  url: https://ghana.arocha.org/wp-content/uploads/sites/42/2025/11/Dry-Season-Bird-inventory-Keta-lagoon_022025.pdf
  fetched: 2026-11-12
  quote: We deployed 2 sound recorders (Song Meter Micro 2 / Wildlife Acoustics, Figure
    3) during each
- claim: In February 2025, five ringing sessions caught 63 birds of 35 species, and
    counts at nine sites recorded 894 birds of at least 49 species.
  url: https://ghana.arocha.org/wp-content/uploads/sites/42/2025/11/Dry-Season-Bird-inventory-Keta-lagoon_022025.pdf
