summary: An active project, partnering with A Rocha Ghana, that aims to produce updated
  habitat maps and bird lists; a February 2025 field trip caught 63 birds of 35 species
  and counted 894 birds at nine sites.
facts:
- claim: The project aims to produce updated habitat maps and bird species lists.
  url: https://ghana.arocha.org/wp-content/uploads/sites/42/2025/11/Dry-Season-Bird-inventory-Keta-lagoon_022025.pdf
