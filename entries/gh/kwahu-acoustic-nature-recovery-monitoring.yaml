facts:
- claim: In March 2025, Oriel College said Bawa Suleman was deploying audio recorders across
    Kwahu and planned to use an AI model to measure biodiversity trends.
  url: https://www.oriel.ox.ac.uk/news/ecologist-explores-using-artificial-intelligence-to-monitor-nature-recovery/
  fetched: 2026-11-08
  quote: Suleman is deploying a network of audio recording devices across Kwahu. He will then
    use a sophisticated AI model to process the collected acoustic data and measure biodiversity
    trends and ecological function across time.
- claim: In March 2025, Oriel College said he was exploring unsupervised models that work
    with minimal labelled data.
  url: https://www.oriel.ox.ac.uk/news/ecologist-explores-using-artificial-intelligence-to-monitor-nature-recovery/
  fetched: 2026-11-08
  quote: Suleman is therefore exploring emerging “unsupervised” models that can function effectively
    with only “minimal labelled data” for his research.
  ai_type: ml-unsupervised
- claim: In March 2025, Oriel College said AJA Climate Solutions, a Singapore-based company,
    was undertaking the nature recovery project in Kwahu.
  url: https://www.oriel.ox.ac.uk/news/ecologist-explores-using-artificial-intelligence-to-monitor-nature-recovery/
