summary: A Wildlife Division programme in which, the World Bank reported in February
  2024, analysts staff a 24-hour control room tracking real-time sightings, with the
  division deciding to pilot EarthRanger.
facts:
- claim: In February 2024, the World Bank reported that the park’s control room was
    staffed 24 hours a day by analysts monitoring real-time human and wildlife sightings,
    with information passed to rangers by smartphone.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-12
  quote: The control room at Mole National Park is staffed 24 hours a day, with analysts
    monitoring real-time data that pinpoints humans and wildlife sightings in the
    vast expanse.
- claim: In February 2024, the World Bank reported that the Wildlife Division had
    decided to pilot EarthRanger, a platform integrating and displaying real-time
    wildlife monitoring data.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-12
  quote: the Wildlife Division decided to pilot Earth Ranger 2 – a technology platform
    that integrates and displays real-time wildlife monitoring data
- claim: The work stems from the Ghana Landscape Restoration and Small-Scale Mining
    Project, funded by PROGREEN and the GEF.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-12
  quote: The work stems from the Ghana Landscape Restoration and Small-Scale Mining
    Project (GLRSSMP) 1 a World Bank program, with funding from PROGREEN and the Global
    Environment Facility
