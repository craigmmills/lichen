summary: Organisation that, in a December 2020 post, says it used drones, including night
  flights with a thermal camera, to count hippos at Bui for the Tyndall Centre.
facts:
- claim: In a December 2020 post, says it used drones to count hippos and get aerial footage
    of them at Bui.
  url: https://flyinglabs.org/blog/using-drones-to-protect-the-hippo-population-in-ghanas-bui-lake
  fetched: 2026-11-08
  quote: Ghana Flying Labs used drones to ascertain the hippo population and get aerial footage
    of the animals in their natural habitat.
- claim: Says the Tyndall Centre of the University of East Anglia approached it in February
    2020 for field data, including a drone-based method of counting hippos.
  url: https://flyinglabs.org/blog/using-drones-to-protect-the-hippo-population-in-ghanas-bui-lake
  fetched: 2026-11-08
  quote: In February 2020, the Tyndall Centre for Climate Change Research of the University
    of East Anglia approached Ghana Flying Labs to provide the field data
- claim: In the same 2020 fieldwork, says it repeated flights at night with a thermal camera
    and counted hippos from orthomosaics.
  url: https://flyinglabs.org/blog/using-drones-to-protect-the-hippo-population-in-ghanas-bui-lake
  fetched: 2026-11-08
  quote: At night, we repeated the same process but with a thermal camera.
