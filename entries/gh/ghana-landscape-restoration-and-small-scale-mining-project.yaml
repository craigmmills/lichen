summary: Joint World Bank and Government of Ghana project that aims to strengthen natural resource management
  in degraded savannah and cocoa landscapes and, the World Bank says, supports Wildlife Division monitoring.
facts:
- claim: The Ministry of Lands and Natural Resources describes it as a joint World Bank and Government
    of Ghana project under an IDA credit facility.
  url: https://mlnr.gov.gh/project/landscape-restoration-mining-project/
  fetched: 2026-11-08
  quote: The Ghana Land Restoration and Small-Scale Mining (GLRSSMP) Project is a joint World Bank and
    Government of Ghana project under an IDA credit facility.
- claim: Its stated objective is to strengthen integrated natural resource management in degraded savannah
    and cocoa landscapes.
  url: https://mlnr.gov.gh/project/landscape-restoration-mining-project/
  fetched: 2026-11-08
  quote: To strengthen integrated natural resource management and increase benefits to communities in
    the targeted degraded savannah and cocoa landscapes
- claim: The World Bank says the project, with funding from PROGREEN and the GEF, supports the Wildlife
    Division with wildlife monitoring approaches.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-08
  quote: a World Bank program, with funding from PROGREEN and the Global Environment Facility, that is
    supporting the Government of Ghana and its Wildlife Division with wildlife monitoring approaches
