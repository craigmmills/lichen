  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: 'Address: Annie Jiagge Road, University of Ghana-Legon - Accra'
- claim: Offers a Ghana land cover and land use classification scheme developed by CERSGIS
    and GERMP in 1999.
  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: Take a look at our Land Cover and Land Use classification scheme developed by CERSGIS/GERMP,
    (1999).
- claim: Says it led an effort, with support from the Lacuna Fund and WRI, to map Ghana's
    cocoa landscape through open-source field data.
  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: CERSGIS, with support from the Lacuna Fund and WRI, led a locally driven effort to
    map Ghana’s cocoa landscape through open-source field data.
- claim: Lists monitoring portals for artisanal and small-scale gold mining and for charcoal
