  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: Artisanal and Small Scale Gold Mining Monitoring Portal
- claim: WRI said in 2013 that IUCN, CERSGIS and WRI had spent two years developing and applying
    a method to evaluate Ghana's national forest and landscape restoration opportunities.
  url: https://www.wri.org/outcomes/ghana-secures-50-million-forest-investment-plan-based-restoration-analysis
  fetched: '2026-11-08'
