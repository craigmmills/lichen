summary: Non-profit that began in 1990 as a University of Ghana remote sensing laboratory,
  runs the SERVIR-West Africa programme, and lists monitoring portals for small-scale gold
  mining and charcoal production among its projects.
facts:
- claim: Says it started in 1990 as a remote sensing laboratory at the University of Ghana's
    Department of Geography and Resource Development.
  url: https://cersgis.org/
  fetched: 2026-11-08
  quote: The Centre for Remote Sensing and Geographic Information Services started as a Remote
    Sensing Application Laboratory in 1990 at the Department of Geography and Resource Development,
    University of Ghana, Legon.
- claim: Says it became a self-sustaining non-profit organisation providing geographic information
    and remote sensing services.
  url: https://cersgis.org/
  fetched: 2026-11-08
  quote: a self-sustaining Non-profit Organization that focused on providing geographic information
    and remote sensing services for sustainable development planning and management of resources
- claim: Lists an Artisanal and Small Scale Gold Mining Monitoring Portal and a Charcoal Production
    Site Monitoring Portal among its projects.
  url: https://cersgis.org/
  fetched: 2026-11-08
  quote: Artisanal and Small Scale Gold Mining Monitoring Portal Charcoal Production Site
    Monitoring Portal
- claim: Says it and partners use data and AI to support cocoa farmers facing the EU Deforestation
    Regulation.
  url: https://cersgis.org/
  fetched: 2026-11-08
  quote: CERSGIS and partners use data and AI to support sustainable practices, focusing on
    land tenure, awareness, and adaptation.
- claim: Says the SERVIR geoportal was developed by CERSGIS under the SERVIR-West Africa programme.
  url: https://cersgis.org/
  fetched: 2026-11-08
  quote: The Geoportal has been developed by kind coutesy of Centre for Remote Sensing and
    Geographic Information Services
- claim: Started in 1990 as a remote sensing laboratory in the Department of Geography and
    Resource Development, University of Ghana, and became CERSGIS in 2000.
  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: In 2000, the status of the Remote Sensing Application Unit changed to Centre for
    Remote Sensing and Geographic Information Services (CERSGIS).
