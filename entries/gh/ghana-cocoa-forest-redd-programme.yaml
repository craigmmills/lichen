summary: Programme run by the Forestry Commission and COCOBOD, which GNA reports began in 2019, is expected
  to end in 2027, and covers 5.9 million hectares and over 140,000 cocoa farmers.
facts:
- claim: GNA reports it is a joint initiative of the Forestry Commission and COCOBOD that aims to halt
    deforestation.
  url: https://gna.org.gh/2026/06/world-bank-satisfied-with-redd-interventions-in-atewa-hia/
  fetched: 2026-11-08
  quote: The Ghana Cocoa Forest REDD+ Programme (GCFRP), a joint initiative of the Forestry Commission
    and COCOBOD, aims to halt deforestation and promote sustainable, climate-smart cocoa farming.
- claim: GNA reports it began in 2019, is expected to end in 2027, and is funded by the FCPF with performance-based
    carbon payments.
  url: https://gna.org.gh/2026/06/world-bank-satisfied-with-redd-interventions-in-atewa-hia/
  fetched: 2026-11-08
  quote: The programme, which commenced in 2019 and is expected to end in 2027, is funded by the World
    Bank’s Forest Carbon Partnership Facility (FCPF) and linked to performance-based carbon payments.
- claim: GNA reports it covers 5.9 million hectares and more than 140,000 cocoa farmers in six hotspot
    intervention areas.
  url: https://gna.org.gh/2026/06/world-bank-satisfied-with-redd-interventions-in-atewa-hia/
  fetched: 2026-11-08
  quote: Covering 5.9 million hectares in Ghana’s High Forest Zone, the programme supports more than 140,000
    cocoa farmers across six hotspot intervention areas, including Atewa.
- claim: FAO says the Carbon Fund awarded Ghana USD 4.86 million in 2022 after validation and verification
    of its first monitoring report.
  url: https://www.fao.org/in-action/openforis/news-and-events/news/news-detail/unlocking-climate-finance--ghana-s-measurement-reporting-and-verification-best-practice/en
  fetched: 2026-11-08
  quote: in 2022, the Carbon Fund awarded Ghana USD 4.86 million for reducing 972 thousand tCO2.
