facts:
- claim: Aims to improve knowledge of the species' distribution and breeding ecology, update Key Biodiversity
    Area designations and monitor habitat change.
  url: https://www.ghanawildlifesociety.org/a-g-leventis-foundation-threatened-species-project/
  fetched: '2026-11-08'
  quote: improving knowledge of its distribution and breeding ecology, updating Key Biodiversity Area
    designations, monitoring habitat change
- claim: Its activities include field surveys of known nesting sites and new reports of Picathartes colonies.
  url: https://www.ghanawildlifesociety.org/a-g-leventis-foundation-threatened-species-project/
  fetched: '2026-11-08'
  quote: Field surveys to revisit known nesting sites and investigate new reports of Picathartes colonies
- claim: In 2024 it confirmed six new nesting sites, leading to an updated national distribution map.
  url: https://www.ghanawildlifesociety.org/a-g-leventis-foundation-threatened-species-project/
  fetched: '2026-11-08'
  quote: In 2024, the project confirmed six new White-necked Picathartes nesting sites across Fum Headwaters,
    Nyame Bepo, and Bosomtwe Range Forest Reserves, culminating in an updated national distribution map
