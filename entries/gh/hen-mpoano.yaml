  in a US Forest Service-funded project.
facts:
- claim: Global Forest Watch describes it as a nonprofit based in Ghana and a two-time
    recipient of the GFW Small Grants Fund.
  url: https://globalnaturewatch.org/blog/users-in-action/gfw-voices-justice-camillus-mensah/
  fetched: 2026-11-12
  quote: Hen Mpoano , a two-time recipient of GFW’s Small Grants Fund (SGF), is a
    nonprofit organization based in Ghana
- claim: In March 2024, GFW reported that it used community forest monitoring teams
    trained on GFW data and tools to collect data regularly.
  url: https://globalnaturewatch.org/blog/users-in-action/gfw-voices-justice-camillus-mensah/
  fetched: 2026-11-12
  quote: We use a community-based approach to forest monitoring and protection. Members
    from forest fringing communities have been resourced through hands-on training
    on Global Forest Watch data and tools
- claim: In March 2024, GFW reported that it applied GFW tools and data to monitor
    mangrove and freshwater swamp in a US Forest Service-funded project.
  url: https://globalnaturewatch.org/blog/users-in-action/gfw-voices-justice-camillus-mensah/
  fetched: 2026-11-12
  quote: Hen Mpoano now applies GFW tools and data to monitor mangrove and freshwater
    swamp in a project funded by the U.S. Forest Service
