summary: A closed four-year project led by the Centre for Biodiversity Conservation
  Research, aiming for multi-taxa monitoring in at least four sites by December 2024,
  which introduced camera traps at Ankasa/Nini Suhien and Digya, per a November 2025
  report.
facts:
- claim: Aimed for multi-taxa monitoring systems tracking biodiversity and threats
    in at least four protected forest and wetland sites by December 2024.
  url: https://www.speciesmonitoring.org/projects.html
  fetched: 2026-11-12
  quote: 'Project goal: By December 2024, multi-taxa monitoring systems using the
    latest tools and technology are tracking the status of, and threats to, biodiversity
    in at least four protected forest and wetland sites in Ghana'
- claim: First project sites were Shai Hills Resource Reserve and Songor Lagoon Ramsar
    site.
  url: https://www.speciesmonitoring.org/projects.html
  fetched: 2026-11-12
  quote: establishing biodiversity monitoring in the first two project sites (Shai
    Hills Resource Reserve and Songor Lagoon Ramsar site)
- claim: A November 2025 report says the four-year collaboration introduced camera
    traps at Ankasa/Nini Suhien Conservation Area and Digya National Park.
  url: https://atta.travel/resource/university-of-ghana-hosts-west-africa-biodiversity-monitoring-dialogue.html
  fetched: 2026-11-12
  quote: a four‑year CBCR collaboration with the IUCN SSC Species Monitoring Specialist
    Group that introduced technologies such as camera traps and built capacity in
    the Ankasa/Nini Suhien Conservation Area and Digya National Park
