summary: According to Global Voices, this EJF-built and maintained app captures illegal fishing evidence
  in real time, launched first in Ghana and has been used in Liberia and Senegal.
facts:
- claim: Global Voices describes it as a smartphone app developed and maintained by EJF for capturing
    evidence of illegal fishing in real time, with or without an internet connection.
  url: https://globalvoices.org/2024/02/15/environmental-justice-foundation-seeks-a-solution-with-the-dase-app-to-battle-illegal-fishing/
  fetched: '2026-11-08'
  quote: Dase is a smartphone application developed and maintained by EJF, enabling users to capture video
    or photo evidence of destructive IUU fishing in real-time, regardless of internet connection.
- claim: Global Voices says the name comes from the Fante dialect of Ghana, where the app was first launched.
  url: https://globalvoices.org/2024/02/15/environmental-justice-foundation-seeks-a-solution-with-the-dase-app-to-battle-illegal-fishing/
  fetched: '2026-11-08'
  quote: it originates from the Fante dialect spoken in Ghana, where the app was first launched.
- claim: Global Voices says it has been used against illegal fishing in Ghana, Liberia and Senegal.
  url: https://globalvoices.org/2024/02/15/environmental-justice-foundation-seeks-a-solution-with-the-dase-app-to-battle-illegal-fishing/
  fetched: '2026-11-08'
  quote: The Dase app has proven effective in combating IUU fishing in Ghana, Liberia, and Senegal
- claim: Global Voices says EJF introduced a Cameroon version in late 2023.
  url: https://globalvoices.org/2024/02/15/environmental-justice-foundation-seeks-a-solution-with-the-dase-app-to-battle-illegal-fishing/
  fetched: '2026-11-08'
  quote: EJF introduced the Dase Cameroon app in late 2023.
