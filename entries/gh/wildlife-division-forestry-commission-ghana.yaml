summary: Run by Ghana’s Forestry Commission, this Mole National Park manager had decided
  to pilot EarthRanger by February 2024 and reportedly used SMART, drones and camera
  traps that year.
facts:
- claim: In February 2024, the World Bank described it as the manager of Mole National
    Park.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-12
  quote: Monitoring key species is a critical challenge that the Wildlife Division
    of the Ghana Forestry Commission, managers of the park, need to handle by the
    hour.
- claim: A February 2024 World Bank report said it had decided to pilot EarthRanger
    at Mole National Park.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-12
  quote: Once the needs were identified, the Wildlife Division decided to pilot Earth
    Ranger
- claim: Its public relations manager told GNA in 2024 that park officials use smartphones
    to gather data and SMART and EarthRanger to store and map it.
  url: https://gna.org.gh/2024/03/digital-innovation-enhancing-park-management-in-ghana-wildlife-division/
  fetched: 2026-11-12
  quote: She noted that smart phones were assisting park officials to gather data
    while the Spatial Monitoring and Reporting Tool and EarthRanger system were being
    used to store, analyze the data into visual maps for decision making.
- claim: In March 2024, its public relations manager told GNA that drones were helping
    Mole National Park officials monitor wildlife in hard-to-reach areas, especially
    during flooding.
  url: https://gna.org.gh/2024/03/digital-innovation-enhancing-park-management-in-ghana-wildlife-division/
  fetched: 2026-11-12
  quote: drones for instance, were helping officials at Mole National Park to monitor
    wildlife activities of hard-to-reach areas, especially during flooding
- claim: In March 2024, its public relations manager told GNA that camera traps had
    helped officials record new wildlife species and deal with poaching missed by
    regular monitoring.
  url: https://gna.org.gh/2024/03/digital-innovation-enhancing-park-management-in-ghana-wildlife-division/
  fetched: 2026-11-12
  quote: the setting of camera traps had enabled officials to take visuals of new
    wildlife species and deal with poaching, which their regular monitoring exercise
    had not observed
