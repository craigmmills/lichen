summary: Non-profit conservation organisation belonging to BirdLife International, which runs
  a threatened species project and says its Important Bird Areas work has informed national
  programmes and policies.
facts:
- claim: Its 2022 annual report names a long-term monitoring scheme on marine turtles and
    marine mammals as a flagship project.
  url: https://www.ghanawildlifesociety.org/wp-content/uploads/2024/02/GWS-Annual-Report-2022.pdf
  fetched: 2026-11-08
  quote: our long-term monitoring scheme on marine turtles and marine mammals
- claim: Says its work on Important Bird Areas has produced information for national programmes
    and policies.
  url: https://www.ghanawildlifesociety.org/wp-content/uploads/2024/02/GWS-Annual-Report-2022.pdf
  fetched: 2026-11-08
  quote: work on Important Bird Areas (IBA's) has produced information for several national
    programmes and policies.
- claim: Says it held a 2022 KBA workshop under the project Building Networks for KBA Monitoring
    and Protection in the Guinean Forest of West Africa, funded by the RSPB and CEPF.
  url: https://www.ghanawildlifesociety.org/wp-content/uploads/2024/02/GWS-Annual-Report-2022.pdf
  fetched: 2026-11-08
  quote: Monitoring and Protection in the Guinean Forest of West Africa” project funded by
    the Royal Society funded for the Protection of Birds (RSPB) and the Critical Ecosystem
    Partnership Fund (CEPF).
- claim: Describes itself as a non-profit conservation organisation belonging to BirdLife
    International.
  url: https://www.ghanawildlifesociety.org/
  fetched: '2026-11-08'
  quote: Ghana Wildlife Society (GWS) is a non-profit conservation organisation. We belong
    to BirdLife International
- claim: Implements a long-term project on the White-necked Picathartes that combines research,
    habitat monitoring and community engagement in forest reserves.
  url: https://www.ghanawildlifesociety.org/a-g-leventis-foundation-threatened-species-project/
  fetched: '2026-11-08'
  quote: The Ghana Wildlife Society is implementing a long-term conservation project focused
    on the White-necked Picathartes ( Picathartes gymnocephalus )
- claim: Has run monthly birdwalks since 2012 to promote bird knowledge and conservation through
    citizen science.
  url: https://www.ghanawildlifesociety.org/
  fetched: '2026-11-08'
  quote: Since 2012, we have been organising monthly birdwalks as part of our activities to
    promote the conservation of birds and promote the knowledge and conservation of birds
    through citizen science.
- claim: Says it is a registered non-profit in Ghana.
  url: https://www.ghanawildlifesociety.org/partners/
  fetched: '2026-11-08'
  quote: Ghana Wildlife Society is a registered non-profit in Ghana (registration number X0283).
