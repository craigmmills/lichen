summary: GNA reports a 2025–2030 project planning a national biodiversity monitoring plan and data platform,
  built by the environment ministry and funded by the International Climate Initiative.
facts:
- claim: GNA reports the project runs from 2025 to 2030 to strengthen monitoring and reporting under the
    Kunming-Montreal framework.
  url: https://gna.org.gh/2026/05/ghana-launches-national-initiative-to-strengthen-biodiversity-monitoring-systems/
  fetched: 2026-11-08
  quote: The project, running from 2025 to 2030, aims to strengthen Ghana’s capacity to monitor and report
    on biodiversity commitments under the Kunming–Montreal Global Biodiversity Framework (KMGBF).
- claim: GNA reports it plans a National Biodiversity Monitoring Plan and a national biodiversity data
    platform linked to global systems.
  url: https://gna.org.gh/2026/05/ghana-launches-national-initiative-to-strengthen-biodiversity-monitoring-systems/
  fetched: 2026-11-08
  quote: developing a National Biodiversity Monitoring Plan, building technical capacity across institutions
    and establishing a national biodiversity data platform linked to global systems
