facts:
- claim: A January 2026 UNDP report says Ghanaian institutions led by MEST, which
    it names as the Ministry of Science and Technology, and Conservation Alliance
    used UNBL and ELSA with the UNDP Country Office and UNBL team for biodiversity
    data, monitoring and reporting.
  url: https://www.undp.org/ghana/press-releases/biodiversity-monitoring-ghana-how-un-biodiversity-lab-supporting-evidence-based-implementation-global-biodiversity-framework
  fetched: 2026-11-12
  quote: Ghanaian institutions, led by the Ministry of Science and Technology (MEST)
    and a national NGO, Conservation Alliance, in partnership with the UNDP Country
    Office and UNBL team
- claim: Its outcomes include Ghana-specific biodiversity priority and opportunity
    maps made with the ELSA tool.
  url: https://www.undp.org/ghana/press-releases/biodiversity-monitoring-ghana-how-un-biodiversity-lab-supporting-evidence-based-implementation-global-biodiversity-framework
  fetched: 2026-11-12
  quote: One of the most tangible outcomes of the UNBL process has been the co-creation
    of Ghana-specific biodiversity priority and opportunity maps
