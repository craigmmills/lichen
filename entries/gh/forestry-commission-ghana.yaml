summary: Government body whose Wildlife Division administers 16 wildlife protected areas and
  five coastal Ramsar sites, and which uses EarthRanger, with a World Bank-reported pilot
  at Mole National Park.
facts:
- claim: Its Wildlife Division is one of the three divisions of the Forestry Commission and
    administers 16 wildlife protected areas, five coastal Ramsar sites and the Accra and Kumasi
    zoos.
  url: https://fc.stlghana.com/?p=2039
  fetched: 2026-11-08
  quote: It is responsible for all wildlife in the country and administers 16 Wildlife-Protected
    Areas (PAs), 5 coastal Ramsar Sites and the Accra and Kumasi Zoos.
- claim: The Wildlife Division's stated aim includes managing wildlife protected areas.
  url: https://fc.stlghana.com/?p=2039
  fetched: 2026-11-08
  quote: To conserve wildlife in Ghana in general and manage wildlife protected areas in particular
    within representative ecological zones of the country.
- claim: FAO says the Ghana Forestry Commission used an FAO analysis on nesting to address
    double issuance issues in REDD+.
  url: https://www.fao.org/in-action/aim4forests/news-and-events/news/news-detail/enhancing-the-institutionalization-and-transparency-of-forest-data-in-ghana/en
  fetched: 2026-11-08
  quote: FAO conducted a strategic analysis on the need for nesting in Ghana, which the Ghana
    Forestry Commission used to address double issuance issues within the REDD+ context.
- claim: GNA reports the Wildlife Division said drones help officials at Mole National Park
    monitor wildlife in hard-to-reach areas, and camera traps have recorded species its regular
    monitoring had not observed.
  url: https://gna.org.gh/2024/03/digital-innovation-enhancing-park-management-in-ghana-wildlife-division/
  fetched: 2026-11-08
  quote: Madam Anie said the setting of camera traps had enabled officials to take visuals
    of new wildlife species and deal with poaching, which their regular monitoring exercise
    had not observed.
- claim: The World Bank says the Wildlife Division manages Mole National Park and decided
    to pilot EarthRanger there under the Ghana Landscape Restoration and Small-Scale Mining
    Project.
  url: https://www.worldbank.org/en/news/feature/2024/02/27/afw-ghana-a-game-changer-for-mole-national-park
  fetched: 2026-11-08
  quote: Once the needs were identified, the Wildlife Division decided to pilot Earth Ranger
    2 – a technology platform that integrates and displays real-time wildlife monitoring data.
- claim: The Wildlife Division is one of the three divisions of the Forestry Commission.
  url: https://fc.gov.gh/about-wd/
  fetched: '2026-11-08'
  quote: The Wildlife Division is one of the three divisions of the reconstituted Forestry
    Commission.
- claim: The Wildlife Division is responsible for all wildlife in Ghana and administers 16
    wildlife protected areas, 5 coastal Ramsar sites and the Accra and Kumasi zoos.
  url: https://fc.gov.gh/about-wd/
  fetched: '2026-11-08'
  quote: It is responsible for all wildlife in the country and administers 16 Wildlife-Protected
    Areas (PAs), 5 coastal Ramsar Sites and the Accra and Kumasi Zoos.
- claim: The Wildlife Division's mandate is to conserve wildlife and manage wildlife protected
    areas.
  url: https://fc.gov.gh/about-wd/
  fetched: '2026-11-08'
  quote: To conserve wildlife in Ghana in general and manage wildlife protected areas in particular
    within representative ecological zones of the country.
- claim: GBIF's registry describes it as responsible for regulating the use of forest and
    wildlife resources and for their conservation and management.
  url: https://api.gbif.org/v1/organization/50562649-0223-4321-bdfd-4387f587ca5b
  fetched: 2026-11-08
  quote: The Forestry Commission of Ghana is responsible for the regulation of utilization
    of forest and wildlife resources, the conservation and management of those resources
