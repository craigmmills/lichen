status: active
summary: A waterbird count run by the Centre for Biodiversity Conservation Research
  and the Wildlife Division, begun in January 2026 and extended from coastal to inland
  wetlands, with data meant to feed national and global databases.
facts:
- claim: In January 2026, CBCR and the Wildlife Division of the Forestry Commission
    began the 2026 census in Ghana.
  url: https://gna.org.gh/2026/01/cbcr-wildlife-division-begin-2026-international-waterbird-census-across-ghana/
  fetched: 2026-11-12
  quote: The Centre for Biodiversity Conservation Research (CBCR), in collaboration
    with the Wildlife Division of the Forestry Commission, has commenced the 2026
    International Waterbird Census (IWC) in Ghana.
- claim: The 2026 census extended beyond coastal wetlands to inland wetlands across
    the middle belt and the north.
  url: https://gna.org.gh/2026/01/cbcr-wildlife-division-begin-2026-international-waterbird-census-across-ghana/
  fetched: 2026-11-12
  quote: This year’s census goes beyond the usual coastal wetlands to include inland
    wetlands across the middle belt and up to the northern parts of the country
- claim: The January 2026 report said census data would contribute to national and
    global databases tracking waterbird population trends.
  url: https://gna.org.gh/2026/01/cbcr-wildlife-division-begin-2026-international-waterbird-census-across-ghana/
  fetched: 2026-11-12
  quote: The data gathered from the census will contribute to national and global
    databases used to track trends in waterbird populations
