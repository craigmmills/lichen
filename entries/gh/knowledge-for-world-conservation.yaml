summary: A not-for-profit in Kumasi that ran WRI-funded ATEM-OFD, onboarded all nine
  Offinso District ranges to GFW Forest Watcher in September 2024 and contracted a
  wood-tracking developer in 2026.
facts:
- claim: Describes itself as a not-for-profit organisation working on forest and environmental
    activities and projects.
  url: https://kwcgh.org/offinso-forest-services-division-and-kwc-launch-20-community-resource-management-committees-and-mark-atem-ofd-project-close-out/
  fetched: 2026-11-15
  quote: KWC is a not-for-profit organization that supports and undertakes forest
    and environmental related activities and projects
- claim: Its address is in Kumasi, Ashanti Region.
  url: https://kwcgh.org/offinso-forest-services-division-and-kwc-launch-20-community-resource-management-committees-and-mark-atem-ofd-project-close-out/
  fetched: 2026-11-15
  quote: Kentinkrono, Off Kumasi-Accra Highway
- claim: In September 2024 KWC, with the Offinso District Forestry Commission, ran
    a three-day training on Global Forest Watch tools for forest monitoring, under
    the WRI-funded ATEM-OFD project.
  url: https://kwcgh.org/offinso-forestry-personnel-introduced-to-cutting-edge-forest-monitoring-technology/
  fetched: 2026-11-15
  quote: concluded a successful three-day training workshop on utilizing Global Forest
    Watch (GFW) tools for forest monitoring in Ghana
- claim: By the end of that training all nine ranges in Offinso District had been
    onboarded to the GFW Forest Watcher platform.
  url: https://kwcgh.org/offinso-forestry-personnel-introduced-to-cutting-edge-forest-monitoring-technology/
  fetched: 2026-11-15
  quote: all nine ranges within the Offinso District had been successfully onboarded
    to the GFW Forest Watcher platform
- claim: At the project's close-out in June 2025 a member of KWC's project team reported
    the deployment of satellite-based forest alert systems.
  url: https://kwcgh.org/offinso-forest-services-division-and-kwc-launch-20-community-resource-management-committees-and-mark-atem-ofd-project-close-out/
  fetched: 2026-11-15
  quote: He highlighted the deployment of satellite-based forest alert systems
- claim: In 2026 it contracted a software developer to enhance Ghana's Domestic Wood
    Tracking System and integrate it into the Ghana Wood Tracking and Decision Support
    System.
  url: https://kwcgh.org/kwc-advances-digital-wood-tracking-and-womens-leadership-in-ghanas-forest-sector/
  fetched: 2026-11-15
  quote: successful selection and contracting of an IT software developer to enhance
    Ghana’s existing Domestic Wood Tracking System (DWTS)
