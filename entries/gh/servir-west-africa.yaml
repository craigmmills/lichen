facts:
- claim: SERVIR lists it as its West Africa hub, implemented by CERSGIS in Accra, CSE in Dakar and ICRISAT
    in Bamako.
  url: https://www.servirglobal.net/team/
  fetched: '2026-11-08'
  quote: Implemented by the – Centre for Remote Sensing and Geographic Information Services (CERSGIS)
    in Accra, Ghana, Centre de Suivi Écologique (CSE) in Dakar, Senegal, and the International Crops Research
    Institute for the Semi-Arid Tropics (ICRISAT) in Bamako, Mali.
- claim: CERSGIS says its initial phase focuses on Burkina Faso, Ghana, Niger and Senegal.
  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: 'In this initial phase, the program focuses on four countries: Burkina Faso, Ghana, Niger and
    Senegal.'
- claim: CERSGIS says it works across the region to improve access to geospatial information and the capacity
    to use it.
  url: https://cersgis.org/
  fetched: '2026-11-08'
  quote: It also works across the region to increase awareness, and improve access to and the capacity
    to use geospatial information.
