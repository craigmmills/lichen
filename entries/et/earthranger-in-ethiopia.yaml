summary: Project funded by the Darwin Initiative, in which EPIF says it has supported EarthRanger implementation
  with equipment and EWCA staff training, and is working with EWCA on operations rooms.
facts:
- claim: EPIF says that through a Darwin Initiative funded project it has supported EarthRanger implementation
    with equipment and by training EWCA staff.
  url: https://www.elephantprotectioninitiative.org/post/building-a-smarter-future-for-conservation-earthranger-in-ethiopia
  fetched: 2026-11-08
  quote: Through a Darwin Initiative funded project, the EPIF have been supporting the implementation
    of EarthRanger, through provision of equipment and most recently by training selected EWCA staff in
    its use.
- claim: EPIF says it is working with EWCA on operations rooms at EWCA headquarters and a prototype at
    Nechisar National Park.
  url: https://www.elephantprotectioninitiative.org/post/building-a-smarter-future-for-conservation-earthranger-in-ethiopia
  fetched: 2026-11-08
  quote: we are working with EWCA to create centralized operations rooms in key locations, starting with
    their Headquarters in Addis and a prototype at Nechisar National Park (NNP).
