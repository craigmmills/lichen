facts:
- claim: EWCA lists it as a national park in the Amhara Region.
  url: https://ewca.gov.et/simien-mountains-national-park/
  fetched: 2026-11-12
  quote: Amhara Region, Ethiopia
- claim: An EWCA officer wrote in 2026 that it is one of two parks using the SMART
    desktop application to monitor wildlife and habitats.
  url: https://wildhub.community/posts/using-smart-connect-to-improve-wildlife-protection-data-management-in-ethiopia-60756c9c-29e6-4af9-bfba-f32d7425116a
  fetched: 2026-11-12
  quote: Currently, only two parks, Nechisar National Park and Simien Mountains National
    Park, use the SMART desktop application to monitor wildlife and habitats.
- claim: AWF says its TRACTS Sites tool is deployed in the park to monitor fire risk
    and activity and grazing trends.
  url: https://www.awf.org/leading-for-wildlife/applying-mapping-tools
  fetched: 2026-11-12
  quote: This tool has been successfully deployed in Ethiopia’s Simien Mountains National
    Park, with a focus on monitoring fire risk and activity to plan fire management
    responses.
- claim: In April 2026, EWCA reported capacity-building training in Gondar with the
    African Wildlife Foundation to implement EarthRanger in Semien Mountains National
    Park.
  url: https://ewca.gov.et/the-ethiopian-wildlife-protection-authority-is-working-without-focus-on-establishing-a-technology-assisted-wildlife-protection-and-control-system/
  fetched: 2026-11-12
  quote: EarthRanger and he is giving capacity building training to implement the
    technology in the Semien Mountains National Park
