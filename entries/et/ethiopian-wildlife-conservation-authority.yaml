summary: Government body responsible for Ethiopia's wildlife, national parks and protected
  areas, based in Addis Ababa; the Elephant Protection Initiative Foundation says it plans
  to scale EarthRanger to 20 protected areas by 2030.
facts:
- claim: Describes itself as a government organisation responsible for conserving Ethiopia's
    wildlife, national parks and protected areas.
  url: https://www.ewca.gov.et/
  fetched: 2026-11-08
  quote: The Ethiopian Wildlife Conservation Authority is a government organization responsible
    for conserving Ethiopia’s wildlife, national parks, and protected areas while promoting
    sustainable tourism.
- claim: Gives its address in Addis Ababa.
  url: https://www.ewca.gov.et/
  fetched: 2026-11-08
  quote: Addis Ababa, Mexico Sengatera , Yobek Plaza , 9th floor
- claim: Reports EarthRanger capacity-building training for Simien Mountains National Park,
    with the African Wildlife Foundation, and work to use it in other parks and sanctuaries.
  url: https://ewca.gov.et/the-ethiopian-wildlife-protection-authority-is-working-without-focus-on-establishing-a-technology-assisted-wildlife-protection-and-control-system/
  fetched: 2026-11-08
  quote: One of these technological achievements is EarthRanger and he is giving capacity
    building training to implement the technology in the Semien Mountains National Park.
- claim: The Elephant Protection Initiative Foundation says EWCA plans to scale EarthRanger
    to 20 protected areas by 2030, starting with Nechisar National Park as the pilot.
  url: https://www.elephantprotectioninitiative.org/post/building-a-smarter-future-for-conservation-earthranger-in-ethiopia
  fetched: 2026-11-08
  quote: To ensure nationwide implementation, EWCA has outlined a phased integration of parks,
    beginning with NNP as the pilot site.
- claim: AWF describes it as the Ethiopian government body responsible for conserving and
    managing Ethiopia's protected areas.
  url: https://www.awf.org/news/new-partnership-launched-support-simien-mountains-national-park
  fetched: '2026-11-08'
  quote: The Ethiopian Wildlife Conservation Authority is an authorized organ of the Government
    of the Federal Democratic Republic of Ethiopia entrusted with the responsibility of conserving
    and managing the Ethiopian protected areas.
- claim: In 2018 it launched a four-year project with KfW financing and AWF to conserve and
    develop Simien Mountains National Park.
  url: https://www.awf.org/news/new-partnership-launched-support-simien-mountains-national-park
  fetched: '2026-11-08'
  quote: have launched a four-year project to conserve and develop the Simien Mountains National
    Park (SMNP), a World Heritage Site.
- claim: In May 2026 it convened a wildlife judicial and prosecutorial training in Addis Ababa
    with AWF.
  url: https://www.awf.org/pressroom/awf-and-ewca-partner-strengthen-wildlife-law-enforcement-and-judicial-responses-ethiopia
  fetched: '2026-11-08'
  quote: in partnership with the Ethiopian Wildlife Conservation Authority (EWCA), convened
    a three-day Wildlife Judicial and Prosecutorial Assistance Training (WJPAT) in Addis Ababa
    from May 26-28, 2026.
- claim: Says it was established under proclamation 575/2008 with responsibility for the conservation
    and development of wildlife.
  url: https://ewca.gov.et/about-us/
  fetched: '2026-11-08'
  quote: The Ethiopian Wildlife Conservation Authority is established under proclamation number
    575/2008 having the responsibility to undertake appropriate conservation and development
    of wildlife for its sustainable use
- claim: Develops and administers the wildlife conservation areas established under it.
  url: https://ewca.gov.et/duties/
  fetched: '2026-11-08'
  quote: Develops and administers wildlife conservation areas established under it and controls
    illegal activities committed in relation thereto.
- claim: Conducts research and collects, processes and provides information on wildlife conservation.
  url: https://ewca.gov.et/duties/
  fetched: '2026-11-08'
  quote: Conducts research and training programs and collects, processes and provides to users
    up to date information on the conservation, development and utilization of wildlife.
- claim: Prepares draft wildlife policies and laws for the Ministry of Culture and Tourism.
  url: https://ewca.gov.et/duties/
  fetched: '2026-11-08'
  quote: Prepares and submits to the Ministry of Culture and Tourism draft policies and laws
    relating to the development and sustainable utilization of wildlife resources
