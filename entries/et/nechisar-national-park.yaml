facts:
- claim: EWCA lists it as a national park in southern Ethiopia.
  url: https://ewca.gov.et/nechisar-national-park/
  fetched: 2026-11-12
  quote: Southern Ethiopia
- claim: An EWCA officer wrote in 2026 that it is one of two parks using the SMART
    desktop application to monitor wildlife and habitats.
  url: https://wildhub.community/posts/using-smart-connect-to-improve-wildlife-protection-data-management-in-ethiopia-60756c9c-29e6-4af9-bfba-f32d7425116a
  fetched: 2026-11-12
  quote: Currently, only two parks, Nechisar National Park and Simien Mountains National
    Park, use the SMART desktop application to monitor wildlife and habitats.
- claim: In its December 2024 post, updated in January 2025, the Elephant Protection
    Initiative Foundation said it was working with EWCA to create a prototype operations
    room at Nechisar, the pilot site for planned phased EarthRanger integration of
    parks.
  url: https://www.elephantprotectioninitiative.org/post/building-a-smarter-future-for-conservation-earthranger-in-ethiopia
  fetched: 2026-11-12
  quote: EWCA has outlined a phased integration of parks, beginning with NNP as the
    pilot site.
