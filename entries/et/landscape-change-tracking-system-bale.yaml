summary: Digital system built by Wondo Genet College, piloted in 20 woredas in and
  around Bale with Royal Norwegian Embassy funding; a scale-up workshop was held on
  28 March 2026.
facts:
- claim: Farm Africa and SOS Sahel Ethiopia held a dissemination and scale-up workshop
    on 28 March 2026 for the system, which was piloted in 16 woredas of the Bale Ecoregion
    and 4 East Bale adjacent woredas and financed by the Royal Norwegian Embassy.
  url: https://www.hu.edu.et/blog/discover-the-latest-happenings-2/farm-africa-sos-sahel-ethiopia-organize-high-level-dissemination-and-scale-up-workshop-for-landscape-change-tracking-system-lscts-71
  fetched: '2026-11-15'
  quote: piloted in 16 woredas of Bale Ecoregion and 4 East Bale Adjacent woredas,
    financed by the Royal Norwegian Embassy.
- claim: Farm Africa's deputy head of programmes said the digital system helps overcome
    the difficulty of physically monitoring forest cover and landscape change.
  url: https://www.hu.edu.et/blog/discover-the-latest-happenings-2/farm-africa-sos-sahel-ethiopia-organize-high-level-dissemination-and-scale-up-workshop-for-landscape-change-tracking-system-lscts-71
  fetched: '2026-11-15'
  quote: the digital system helps to overcome the challenges of physically monitoring
    forest coverage and changes in the landscape
- claim: A presenter from the college said the system had been piloted across twenty
    woredas of the Bale ecosystem and was ready for scale-up.
  url: https://www.hu.edu.et/blog/discover-the-latest-happenings-2/farm-africa-sos-sahel-ethiopia-organize-high-level-dissemination-and-scale-up-workshop-for-landscape-change-tracking-system-lscts-71
  fetched: '2026-11-15'
  quote: it has been piloted across twenty woredas in Bale Ecosystem, and ready for
    scale up
- claim: The college, with Farm Africa Ethiopia and the Oromia Environmental Protection
    Authority, organised and launched two weeks of training for 15 experts on applying
    the system, aiming to build skills in geospatial data acquisition, management
    and analysis for scale-up to Oromia.
  url: https://www.hu.edu.et/blog/discover-the-latest-happenings-2/hawassa-university-farm-africa-ethiopia-organize-training-on-landscape-change-tracking-system-lcts-application-78
  fetched: '2026-11-15'
  quote: equipping forest management and environmental protection experts recruited
    from different zones in Oromia regional state and the office of environmental
    protection authority with practical skills in applying the system for geospatial
    data acquisition, management, and analysis
