summary: Restoration initiative led by WeForest, which says over 23,000 hectares of degraded land are
  under restoration; the UN recognised it as a World Restoration Flagship on 29 October 2026.
facts:
- claim: WeForest says the initiative is led by WeForest and local communities and has brought more than
    23,000 hectares of degraded land under restoration.
  url: https://www.weforest.org/blog/press-release/ethiopias-project-recognized-as-un-world-restoration-flagship/
  fetched: '2026-11-08'
  quote: The initiative has brought more than 23,000 hectares of degraded land under restoration.
- claim: Recognised by the UN as a World Restoration Flagship on 29 October 2026.
  url: https://www.weforest.org/blog/press-release/ethiopias-project-recognized-as-un-world-restoration-flagship/
  fetched: '2026-11-08'
  quote: The UN today recognized Ethiopia's Great Rift Valley Renaissance as a World Restoration Flagship
- claim: WeForest says it works with field teams to confirm what satellites see and to improve its machine
    learning models, and names Desa'a as one of its project areas.
  url: https://www.weforest.org/blog/research/how-satellite-technology-is-supporting-global-reforestation/
  fetched: '2026-11-08'
  quote: WeForest works closely with field teams to regularly confirm what the satellites see and continuously
    improve the machine learning models.
- claim: WeForest's Airbus Foundation grant was to assess the impact of soil and water conservation work
    in Desa'a with very high resolution imagery.
  url: https://www.weforest.org/blog/research/how-satellite-technology-is-supporting-global-reforestation/
  fetched: '2026-11-08'
  quote: We applied to assess the impact of soil and water conservation activities in Desa'a, Ethiopia.
- claim: The Desa'a project is in the Eastern and South Eastern zones of Tigray region.
  url: https://www.weforest.org/programmes/eastern-afromontane-biodiversity-hotspot/desaa-forest/
  fetched: '2026-11-08'
  quote: Eastern and South Eastern zone, Tigray region
