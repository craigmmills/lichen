summary: Platform that ATTA reports is being piloted across 106 protected areas, first deployed in Bale
  Mountains National Park and Senkele sanctuary, combining satellite data, geospatial tools and unmanned
  systems.
facts:
- claim: ATTA, an African tourism association, reports the platform is being tested on a pilot basis across
    106 protected areas.
  url: https://atta.travel/resource/ethiopia-launches-digital-wildlife-monitoring-platform-across-106-protected-areas.html
  fetched: 2026-11-08
  quote: Ethiopia has introduced a digital wildlife monitoring platform on a pilot basis, currently being
    tested across 106 protected areas nationwide.
- claim: The same report says it was first deployed at Bale Mountains National Park and the Senkele Swayne's
    Hartebeest Sanctuary and combines satellite data, geospatial tools and unmanned systems.
  url: https://atta.travel/resource/ethiopia-launches-digital-wildlife-monitoring-platform-across-106-protected-areas.html
  fetched: 2026-11-08
  quote: the platform integrates satellite data, geospatial tools, and unmanned systems to analyse land-use
    patterns, predict potential conflicts between competing land uses, and provide early warnings of environmental
    changes that could affect biodiversity
- claim: The report quotes Ethiopia's State Minister for Tourism, Seleshi Girma, on the platform.
  url: https://atta.travel/resource/ethiopia-launches-digital-wildlife-monitoring-platform-across-106-protected-areas.html
  fetched: 2026-11-08
  quote: Ethiopia's State Minister for Tourism, Seleshi Girma, highlighted the platform's dual role in
    conservation and tourism development
