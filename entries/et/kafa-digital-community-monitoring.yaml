summary: Smartphone-based monitoring in which, according to NABU's page, rangers in
  the Kafa Biosphere Reserve collect forest and biodiversity data monthly, a system
  the page says is now used across Ethiopia.
facts:
- claim: NABU's page says digital community monitoring was introduced in which rangers
    collect forest and biodiversity data monthly with smartphones, a system now used
    across the country.
  url: https://www.nabu.de/wir-ueber-uns/aktionen-und-projekte/das-kafa-biosphaerenreservat-in-aethiopien
  fetched: '2026-11-15'
  quote: Parallel wurde ein digitales Community-Monitoring eingeführt, bei dem Ranger*innen
    mithilfe von Smartphones monatlich Wald- und Biodiversitätsdaten erheben – ein
    System, das inzwischen landesweit Anwendung findet.
- claim: The same page says the biodiversity surveys of 2014 and 2019 set indicator
    species and introduced a digital monitoring system now also used in other Ethiopian
    protected areas.
  url: https://www.nabu.de/wir-ueber-uns/aktionen-und-projekte/das-kafa-biosphaerenreservat-in-aethiopien
  fetched: '2026-11-15'
  quote: Außerdem wurden Indikatorarten für verschiedene Lebensräume bestimmt und
    ein digitales Monitoring-System eingeführt, das heute auch in anderen äthiopischen
    Schutzgebieten eingesetzt wird.
