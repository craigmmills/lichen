summary: Project run by Melkam Getachew Gebru that aims to study beisa oryx in Awash and Omo
  National Parks using GPS telemetry, with collars planned for 20 adults.
facts:
- claim: Aims to use GPS telemetry and habitat modelling to study movement patterns, habitat
    preferences and threats to beisa oryx in Awash and Omo National Parks.
  url: https://iucnsos.org/?p=8216
  fetched: 2026-11-12
  quote: Using GPS telemetry and habitat modelling, the study aims to generate vital data
    on movement patterns, habitat preferences, and threats such as habitat fragmentation and
    bush encroachment.
- claim: Plans to fit GPS collars on 20 adult beisa oryx.
  url: https://iucnsos.org/?p=8216
  fetched: 2026-11-12
  quote: Capture and fit GPS collars on 20 adult Beisa Oryx to track movement and habitat
    use.
- claim: The Rufford Foundation's January 2024 page proposed collars with a VHF beacon, a
    GPS device and two motion sensors.
  url: https://www.rufford.org/projects/melkam-getachew-gebru/spatial-ecology-and-conservation-endangered-beisa-oryx-oryx-beisa-omo-national-park-ethiopia/
  fetched: 2026-11-12
  quote: radio-collars (Vectronic Aerospace GmbH, Germany) will be used, which equipped with
    VHF (very high frequency) beacon sender, a GPS (global positioning system) device and
    two bidirectional motion sensors.
