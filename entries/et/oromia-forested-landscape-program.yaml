summary: Programme under which Ethiopia signed a February 2023 agreement with the BioCarbon Fund ISFL,
  unlocking up to $40 million, which the World Bank says will be paid for verified emission reductions.
facts:
- claim: The World Bank says Ethiopia signed an Emission Reductions Purchase Agreement with the BioCarbon
    Fund ISFL in February 2023, unlocking up to $40 million, under the Oromia Forested Landscape Program.
  url: https://www.worldbank.org/en/news/press-release/2023/02/09/world-bank-and-ethiopia-sign-40-million-agreement-to-cut-carbon-emissions-through-sustainable-landscape-management
  fetched: 2026-11-08
  quote: This ERPA marks the first of its kind for ISFL, which will reward efforts to reduce around 4
    million metric tons of CO 2 e [Carbon Dioxide equivalent] emissions through 2030 under Ethiopia’s
    ambitious Oromia Forested Landscape Program .
- claim: The World Bank says the payments will be for verified emission reductions.
  url: https://www.worldbank.org/en/news/press-release/2023/02/09/world-bank-and-ethiopia-sign-40-million-agreement-to-cut-carbon-emissions-through-sustainable-landscape-management
  fetched: 2026-11-08
  quote: the ERPA will bring significant additional funding to the program in the form of results-based
    payments for the verified emission reductions
- claim: The IATI record on DevTracker for its emission reduction project says it will generate measured,
    reported and verified emission reductions from reduced deforestation and forest degradation in Oromia;
    status implementation.
  url: https://devtracker.fcdo.gov.uk/programme/XI-IATI-WBTF-P151294/summary
  fetched: 2026-11-08
  quote: The project will generate measured, reported and verified Emissions Reductions (ER) from reduced
    deforestation, forest degradation,enhancement of forest carbon stocks (REDD+), agriculture and other
    land use sectors
- claim: FAO's SEPAL team lists OFLP among the national institutions at its October 2023 forest monitoring
    workshop.
  url: https://www.fao.org/in-action/sepal/news-and-events/news/detail/strengthening-forest-monitoring-in-ethiopia-through-sepal's-technical-workshop/en
  fetched: 2026-11-08
  quote: Oromia Forested Landscape Program (OFLP)
