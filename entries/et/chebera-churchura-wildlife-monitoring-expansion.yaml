facts:
- claim: The 2019 project aimed to roll out the national wildlife monitoring strategy
    in Chebera Churchura National Park using remote sensing, habitat sampling areas
    and wildlife transects, and to train park managers.
  url: https://e-c-o.at/project-details-en.html?id=304
  fetched: 2026-11-12
  quote: All monitoring approaches of ecological monitoring such as remote sensing,
    habitat sampling areas and wildlife transects are to be applied.
- claim: E.C.O.'s 2019 page says it was adapting a SMART database sheet to record
    field status digitally, with GIZ as client.
  url: https://e-c-o.at/project-details-en.html?id=304
  fetched: 2026-11-12
  quote: E.C.O. is adapting a corresponding data sheet in the SMART database, which
    makes it possible to digitally record the status of development in the field.
- claim: A related 2018 E.C.O. project for GIZ aimed to establish a national wildlife
    monitoring strategy for Ethiopia's protected areas, using four national parks
    as examples.
  url: https://e-c-o.at/project-details-en.html?id=265
  fetched: 2026-11-12
  quote: The project aims to establish a national wildlife monitoring strategy for
    protected areas in Ethiopia, using the example of four different national parks
    for a later up-scaling.
