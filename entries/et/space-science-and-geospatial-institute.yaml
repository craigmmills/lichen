summary: Ethiopian government institute for space science and geospatial work, set up in 2022
  by merging two bodies; ENA reports it inaugurated satellite data stations in December 2025,
  and Fana reports free high-resolution data.
facts:
- claim: ENA reports that SSGI inaugurated a network of satellite data collection stations
    in Addis Ababa and several regional cities in December 2025.
  url: https://www.ena.et/web/eng/w/eng_7825046
  fetched: 2026-11-08
  quote: Space Science and Geospatial Institute (SSGI) has inaugurated a new network of satellite
    data collection stations in Addis Ababa and several regional cities
- claim: ENA reports SSGI will use the stations for surveying, mapping and research across
    the country.
  url: https://www.ena.et/web/eng/w/eng_7825046
  fetched: 2026-11-08
  quote: SSGI will make extensive use of the new stations to enhance surveying, mapping, and
    research activities across the country.
- claim: Fana Broadcasting reports SSGI made high-resolution satellite data freely available
    to stakeholders, collected through a project with China's Ministry of Natural Resources.
  url: https://www.fanabc.com/english/?p=59415
  fetched: 2026-11-08
  quote: The Ethiopian Space Science and Geospatial Institute (SSGI) announced that it has
    made high-resolution satellite data freely available to stakeholders in the country.
- claim: Fana reports the data can be used for natural resources, agriculture and livestock.
  url: https://www.fanabc.com/english/?p=59415
  fetched: 2026-11-08
  quote: The data can be used for various purposes, including natural resources, agriculture
    and livestock, it was learned.
- claim: The Pan-African Network for Planetary Science and Technology (PAP2SN) describes it
    as a government-established institution in Ethiopia for space science and technology.
  url: https://pap2sn.com/ssgi.html
  fetched: '2026-11-08'
  quote: is a governmentestablished institution in Ethiopia focused on promoting research,
    development, and education in space
