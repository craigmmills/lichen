summary: Programme run by Frankfurt Zoological Society, partnered with the Ethiopian Wolf Conservation
  Programme, monitoring key park ecosystem components in wet and dry seasons through counts and surveys.
facts:
- claim: FZS describes Ecological Threat Monitoring as a programme to monitor the status of the park's
    key ecosystem components in wet and dry seasons.
  url: https://fzs.org/en/programs/ethiopia/bale-mountains-national-park/
  fetched: '2026-11-08'
  quote: Ecological Threat Monitoring is a program designed to monitor the status of the key ecosystem
    components of the Bale Mountains National Park (BMNP) during both wet and dry seasons.
- claim: The work listed includes livestock counts, alpine lake size, mountain nyala surveys, settlement
    counts and forest resource use surveys.
  url: https://fzs.org/en/programs/ethiopia/bale-mountains-national-park/
  fetched: '2026-11-08'
  quote: 'Their work includes: Livestock counts in the Park Monitoring the size of Alpine lakes Mountain
    nyala surveys Noting the number of settlements in the Park Forest resource use surveys'
