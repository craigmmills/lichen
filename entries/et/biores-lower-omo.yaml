summary: Active project that aims to fill biodiversity data gaps in the Lower Omo
  by combining scientific monitoring with local knowledge, and donated 53 camera traps
  to Arba Minch University, which hosted an October 2025 workshop.
facts:
- claim: Arba Minch University says BioRES aims to fill biodiversity data gaps by
    combining scientific biodiversity monitoring with local ethnobotanical and ethnozoological
    knowledge.
  url: https://amu.edu.et/en/amu-along-with-others-holds-camera-trapping-techniques-workshop
  fetched: 2026-11-12
  quote: It focuses on filling major biodiversity data gaps in the region by combining
    scientific biodiversity monitoring with local ethnobotanical and ethnozoological
    knowledge.
- claim: Local communities are to be trained in biodiversity assessment and monitoring,
    leading to the area's first biodiversity datasets and management tools.
  url: https://amu.edu.et/en/amu-along-with-others-holds-camera-trapping-techniques-workshop
  fetched: 2026-11-12
  quote: leading to the creation of the first biodiversity datasets and management
    tools for the area
- claim: The project donated 53 camera traps to Arba Minch University, which hosted
    a camera-trapping workshop in October 2025.
  url: https://amu.edu.et/en/amu-along-with-others-holds-camera-trapping-techniques-workshop
  fetched: 2026-11-12
  quote: He also expressed his gratitude for the donation of 53 camera traps through
    BioRES project.
