summary: Customised for near real-time forest loss warnings in Ethiopia, with a Sentinel-1
  alert prototype at 10 m resolution; a 2024 record describes piloting in Bench Maji
  Zone.
facts:
- claim: A tool customised to detect forest change and vegetation loss in near real
    time to give early warning of forest loss in Ethiopia.
  url: https://cgspace.cgiar.org/items/38eaf18d-86b3-4d6e-a3b8-39e19ce7c6fc
  fetched: 2026-11-12
  quote: Terra-i Ethiopia, is a tool customized to detect forest change and loss vegetation
    in near-real-time for providing early warning on forest losses in Ethiopia.
- claim: Adds a prototype of forest loss alerts from Sentinel-1 at 10 m resolution,
    generated every 12 days for 2020 to 2022.
  url: https://cgspace.cgiar.org/items/38eaf18d-86b3-4d6e-a3b8-39e19ce7c6fc
  fetched: 2026-11-12
  quote: the tool introduces a prototype for alerts on forest loss derived from Sentinel-1
    image analysis, at a 10-meter spatial resolution.
- claim: In pilot phase in REDD participatory forest management sites in Bench Maji
    Zone, south-west Ethiopia (record dated 2024).
  url: https://cgspace.cgiar.org/items/38eaf18d-86b3-4d6e-a3b8-39e19ce7c6fc
  fetched: 2026-11-12
  quote: Currently, the tool is undergoing a pilot phase in REDD PFM sites within
    the Bench Maji Zone in southwest Ethiopia.
