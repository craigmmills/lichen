summary: Conservation programme founded in 1995 and run by the Wildlife Conservation Research
  Unit, which monitored 41 wolf packs at 17 locations across six populations from April 2024
  to March 2025.
facts:
- claim: In April 2024 to March 2025 it monitored 41 wolf packs in 17 locations across six
    populations.
  url: https://www.ethiopianwolf.org/monitoring-ethiopian-wolves-the-reward-of-a-successful-breeding-season
  fetched: 2026-11-08
  quote: Last year, from April 2024 to March 2025, EWCP monitored 41 separate wolf packs in
    17 different locations across 6 populations.
- claim: JRS Biodiversity Foundation lists a technology development grant of $64,600 over
    36 months to WCN - Ethiopian Wolf Conservation Program for improving Ethiopian wolf monitoring.
  url: https://jrsbiodiversity.org/grant_approach/technology-development
  fetched: 2026-11-08
  quote: WCN - Ethiopian Wolf Conservation Program
- claim: Says pack monitoring is the backbone of its long-term work, done by its own monitoring
    teams.
  url: https://www.ethiopianwolf.org/monitoring-ethiopian-wolves-the-reward-of-a-successful-breeding-season
  fetched: 2026-11-08
  quote: The monitoring of Ethiopian wolf packs is the backbone of EWCP’s long-term conservation
    work.
- claim: Founded in 1995 by Claudio Sillero, Edriss Ebu and Karen Laurenson.
  url: https://www.ethiopianwolf.org/about-us/about-ewcp
  fetched: '2026-11-08'
  quote: The Ethiopian Wolf Conservation Programme (EWCP) was founded in 1995 by Claudio Sillero,
    Edriss Ebu, and Karen Laurenson
- claim: Its monitoring project works with monitors and Wolf Ambassadors across the Ethiopian
    highlands to detect changes in the status of and threats to wolf populations.
  url: https://www.ethiopianwolf.org/projects/monitoring-and-research
  fetched: '2026-11-08'
  quote: The aim of this project is to detect changes in the status and threats to Ethiopian
    wolf populations
- claim: Says it monitors wolf packs across six populations at 17 sites.
  url: https://www.ethiopianwolf.org/projects/monitoring-and-research
  fetched: '2026-11-08'
  quote: wolf packs monitored across 6 populations over 17 sites
- claim: Operates in Ethiopia under memoranda of understanding with EWCA at federal level
    and with regional bodies in Oromia and Amhara.
  url: https://www.ethiopianwolf.org/about-us/about-ewcp
  fetched: '2026-11-08'
  quote: EWCP operates in Ethiopia under Memoranda of Understanding agreements between the
    WildCRU and the Ethiopian Wildlife Conservation Authority (EWCA) at a federal level
