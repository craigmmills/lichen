summary: Active use of SMART in Ethiopia, where an EWCA officer wrote in April 2026
  that only Nechisar and Simien Mountains use the desktop application, and a first
  SMART Connect attempt was not fully implemented.
facts:
- claim: An EWCA officer wrote in April 2026 that only Nechisar and Simien Mountains
    national parks use the SMART desktop application to monitor wildlife and habitats.
  url: https://wildhub.community/posts/using-smart-connect-to-improve-wildlife-protection-data-management-in-ethiopia-60756c9c-29e6-4af9-bfba-f32d7425116a
  fetched: 2026-11-12
  quote: Currently, only two parks, Nechisar National Park and Simien Mountains National
    Park, use the SMART desktop application to monitor wildlife and habitats.
- claim: The same post says a first attempt to deploy SMART Connect was not fully
    implemented because of technical and resource limits.
  url: https://wildhub.community/posts/using-smart-connect-to-improve-wildlife-protection-data-management-in-ethiopia-60756c9c-29e6-4af9-bfba-f32d7425116a
  fetched: 2026-11-12
  quote: Although the attempt demonstrated strong potential, technical and resource
    limitations prevented full implementation.
- claim: GIZ's BMZ-funded Biodiversity and Forestry Programme introduced SMART at
    Nech Sar National Park.
  url: https://gsapskills.org/resources/smart-a-digital-monitoring-system-for-effective-management-of-protected-areas-2/
  fetched: 2026-11-12
  quote: the BMZ-funded and GIZ-implemented Biodiversity and Forestry Programme introduced
    the Spatial Monitoring and Reporting Tool (SMART)
