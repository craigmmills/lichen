summary: Operations room using EarthRanger, which Chengeta Wildlife says combines patrol tracking, GPS
  collars and camera traps in one system in Bale for the first time.
facts:
- claim: Chengeta Wildlife says EarthRanger brings patrol tracking, GPS collars and camera traps together
    in one system in Bale for the first time.
  url: https://chengetawildlife.org/proudly-presenting-the-operations-room-in-bale-mountains-national-park-ethiopia/
  fetched: 2026-11-08
  quote: For the first time in Bale, EarthRanger is bringing together all available conservation technologies—patrol
    tracking, GPS collars, camera traps, and more—into a single, connected system.
- claim: Says data in the room comes from rangers, camera traps, GPS collars and bio-acoustic units.
  url: https://chengetawildlife.org/proudly-presenting-the-operations-room-in-bale-mountains-national-park-ethiopia/
  fetched: 2026-11-08
  quote: The data, collected by rangers, camera traps, GPS collars, bio-acoustic units, and a range of
    other processes
