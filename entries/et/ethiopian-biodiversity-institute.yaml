facts:
- claim: The CBD's country page for Ethiopia lists the Ethiopian Biodiversity Institute under
    national websites, with the national clearing-house mechanism.
  url: https://www.cbd.int/countries?country=et
  fetched: 2026-11-08
  quote: Ethiopian Biodiversity Institute
- claim: Says it has the responsibility to implement international conventions and obligations
    on biodiversity to which Ethiopia is a party.
  url: http://www.ebi.gov.et
  fetched: 2026-11-08
  quote: The Institute, on the basis of national legislation, has the responsibility and duty
    to implement international conventions, agreements and obligations on biodiversity to
    which Ethiopia is a party.
- claim: Renamed the Ethiopian Biodiversity Institute in 2013; re-established in 1998 as the
    Institute of Biodiversity Conservation and Research.
  url: http://www.ebi.gov.et
  fetched: 2026-11-08
  quote: Finally, in 2013 the institute has the current structure and renamed as Ethiopian
    Biodiversity Institute (EBI).
- claim: Its home page reports that Ethiopia validated a new five-year National Biodiversity
    Strategy and Action Plan.
  url: http://www.ebi.gov.et
  fetched: 2026-11-08
  quote: Ethiopia Validates New Five-Year National Biodiversity Strategy and Action Plan
- claim: The director general says its researchers document and map genetic resources and
    will use digital tools for this.
  url: http://www.ebi.gov.et
  fetched: 2026-11-08
  quote: We will continue to uncover, identify, and understand Ethiopia’s genetic resource
    potential through the implementation of digital tools.
