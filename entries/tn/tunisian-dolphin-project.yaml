facts:
- claim: In April 2022, Rufford described the Tunisian Dolphin Project as a long-term
    programme studying Tunisia's bottlenose dolphin population since 2015, using photo-identification
    and mark-recapture.
  url: https://www.rufford.org/projects/ibrahem-ben-amer/tunisian-dolphin-project-tdp/
  fetched: 2026-11-12
  quote: The Tunisian Dolphin Project is a long-term monitoring programme studying
    the bottlenose dolphin population (Tursiops truncatus) in Tunisia since 2015.
- claim: For 2022-2023 it planned to extend monitoring to southern Tunisia towards
    a national photo-ID catalogue and abundance estimate, and to model the species'
    habitat.
  url: https://www.rufford.org/projects/ibrahem-ben-amer/tunisian-dolphin-project-tdp/
  fetched: 2026-11-12
  quote: Extend the monitoring programme to the southern part of Tunisia to know more
    about the extent of the population in a step to create a national-wide photo-ID
    catalogue and abundance estimate
