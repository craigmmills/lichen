summary: Active project in which, La Presse reported in November 2025, Tunisian forest
  guards were trained in the SMART data tool, with 30 tablets handed to forest agents
  after field exercises in Djebel Zaghouan reserve.
facts:
- claim: La Presse reported in November 2025 that Tunisian forest guards had been
    trained to use SMART, a digital tool for collecting and analysing data for biodiversity
    conservation and wildlife monitoring in protected areas.
  url: https://www.lapresse.tn/2025/11/01/conservation-lapplication-smart-deployee-aupres-des-agents-forestiers-tunisiens/
  fetched: 2026-11-13
  quote: Les gardiens de forêts tunisiens ont été formés à l’utilisation de la plateforme
    SMART
- claim: The training, organised in Hammamet with the DGF, was part of the project
    L'engagement citoyen pour la biodiversité.
  url: https://www.lapresse.tn/2025/11/01/conservation-lapplication-smart-deployee-aupres-des-agents-forestiers-tunisiens/
  fetched: 2026-11-13
  quote: s’inscrit dans le cadre du projet « L’engagement citoyen pour la biodiversité
    »
- claim: Field exercises were held in the Djebel Zaghouan nature reserve, and 30 tablets
    carrying the application were handed to forest agents.
  url: https://www.lapresse.tn/2025/11/01/conservation-lapplication-smart-deployee-aupres-des-agents-forestiers-tunisiens/
  fetched: 2026-11-13
