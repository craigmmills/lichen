summary: Marine science institute in Salammbô whose Observatoire de la Mer, created in 1992, centralises
  research project data in databases and builds thematic GIS map bases on aquatic environments, according
  to a 2004 page.
facts:
- claim: A 2004 page on its site says the Observatoire de la Mer, created in 1992, is the institute's
    centre for disseminating scientific information.
  url: http://www.instm.agrinet.tn/fr/observatoire/observatoire.html
  fetched: 2026-11-08
  quote: L'Observatoire de la Mer est le centre de l'INSTM pour la diffusion et la mise en valeur de l'information
    scientifique.
- claim: The same page says the observatory centralises data from research projects in databases reachable
    over the intranet or internet.
  url: http://www.instm.agrinet.tn/fr/observatoire/observatoire.html
  fetched: 2026-11-08
  quote: Centralisation des données produites dans le cadre des projets de recherche sous la forme de
    bases de données accessibles par le biais de l'intranet et/ou l'internet.
- claim: The same page says the observatory builds thematic GIS map bases on aquatic environments.
  url: http://www.instm.agrinet.tn/fr/observatoire/observatoire.html
  fetched: 2026-11-08
  quote: Développement de bases cartographiques thématiques, en utilisant les systèmes d'Information Géographiques
    (SIG), concernant les données portant sur les milieux aquatiques.
- claim: Its current site lists a marine environment laboratory with the OMELI observatory.
  url: http://www.instm.agrinet.tn
  fetched: 2026-11-08
  quote: Recherche Laboratoires Milieu Marin "LMM" Observatoire OMELI
