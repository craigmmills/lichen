facts:
- claim: Describes itself as a registered Tunisian not-for-profit organisation, formerly
    ATRAkouda, founded in 2014.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: Our organization NAWT "North African Wild Traces" (Ex. ATRAkouda) has been
    at the forefront of nature conservation and scientific expeditions since the organization's
    inception in 2014.
- claim: Operates as a registered Tunisian not-for-profit organisation.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: We operate as a registered Tunisian not-for-profit organization administered
    by a volunteer board of directors and a small team of staff.
- claim: Its team focuses mainly on wildlife monitoring and tracking in Bouhedma National
    Park, where its research has been active since 2019.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: Our team focuses mainly on wildlife monitoring and tracking to fill data
    gaps and ensure a continuous update of biodiversity assessments in the region.
- claim: Its site lists camera trapping among its research methods.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: Camera trapping
- claim: It has set up a participatory wildlife observatory bringing together scientists,
    students, naturalists and local communities.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: We have established a Participatory Wildlife Observatory that brings together
    scientists, students, naturalists, and local communities in collaborative fieldwork.
- claim: Its Bouhedma Biodiversity and Research Center in the national park serves
    as a research workspace and a station for ecological survey equipment.
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: The observatory is functioning as a work space for researchers, an ecological
    library (ecotheque), a station for ecological survey equipment and supplies and
    a place for field courses.
- claim: Its formal base is in Akouda (Sousse).
  url: https://www.biorecbouhedma.com/
  fetched: 2026-11-13
  quote: Our association has its formal base in Akouda (Sousse).
