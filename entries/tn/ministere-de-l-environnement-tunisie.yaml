- claim: At COP17 of the Convention on Biological Diversity in October 2026, the ministry presented Tunisia's
    national biodiversity strategy and action plan and the state of their implementation, according to
    a ministry statement reported by La Presse.
  url: https://www.lapresse.tn/2026/10/28/cop17-sur-la-biodiversite-a-erevan-la-tunisie-plaide-pour-la-protection-des-ecosystemes/
