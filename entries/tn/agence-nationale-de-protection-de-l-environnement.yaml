summary: Tunisian agency that monitors climate, water levels and salinity daily at
  Lake Ichkeul, water quality monthly at 11 stations, and wintering waterbirds monthly
  from December to March.
facts:
- claim: Runs daily monitoring of climate, water levels and salinity at Lake Ichkeul
    and monthly water quality monitoring at 11 stations.
  url: https://www.anpe.nat.tn/Fr/activites_11_109
  fetched: 2026-11-12
  quote: L’ANPE effectue un suivi journalier des paramètres climatiques, des niveaux
    d’eau et de la salinité des eaux du lac et un suivi mensuel de la qualité des
    eaux du lac dans 11 stations ainsi que dans les oueds
- claim: Carries out monthly counts of the main wintering waterbird species at Ichkeul
    between December and March.
  url: https://www.anpe.nat.tn/Fr/activites_11_109
