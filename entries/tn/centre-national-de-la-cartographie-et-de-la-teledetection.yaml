summary: Tunisian public body created in 1988 under the Ministry of National Defence as the National Remote
  Sensing Centre, covering mapping, geodesy and remote sensing, and renamed in 2009.
facts:
- claim: Created in 1988 under the Ministry of National Defence; African Manager says it plays a central
    role in remote sensing, scientific research and training in geospatial work and Earth observation.
  url: https://africanmanager.com/la-tunisie-entame-le-developpement-de-son-premier-satellite-gouvernemental/
  fetched: 2026-11-08
  quote: le CNCT joue un rôle central dans le développement des technologies de télédétection, la conduite
    de recherches scientifiques et la formation spécialisée dans les domaines géospatial et d’observation
    de la Terre.
- claim: GMES and Africa lists it, with this website, as a Tunisian member of a consortium.
  url: https://gmes4africa.blogspot.com/p/consortia.html?m=0
  fetched: '2026-11-08'
  quote: National Center for Cartography and Remote Sensing (CNCT) - Tunisia, https://cnct.defense.tn/
- claim: The Ministry of National Defence says the centre was created by law in 1988 as the National Remote
    Sensing Centre, a public body under the ministry charged with promoting remote sensing techniques,
    research and training.
  url: https://defense.tn/centre-national-de-la-cartographie-et-de-la-teledetection/?lang=fr
  fetched: 2026-11-08
  quote: le Centre National de la Télédétection (CNT) est une entreprise publique à caractère non administratif
    sous la tutelle du Ministère de la Défense Nationale, chargée de promouvoir les techniques de télédétection,
    de recherche et de la formation dans ses domaines.
- claim: The ministry says its name became Centre National de la Cartographie et de la Télédétection in
    2009.
  url: https://defense.tn/centre-national-de-la-cartographie-et-de-la-teledetection/?lang=fr
  fetched: 2026-11-08
  quote: est remplacée par l’appellation «Centre National de la Cartographie et de la Télédétection »
    (CNCT).
- claim: The ministry says its missions cover mapping, geodesy, topography, photogrammetry and gravimetry.
  url: https://defense.tn/centre-national-de-la-cartographie-et-de-la-teledetection/?lang=fr
  fetched: 2026-11-08
  quote: Ses missions ont été élargies par le décret 2004-121 pour couvrir les domaines de la cartographie,
    la géodésie, la topographie et la photogrammétrie et de la gravimétrie.
- claim: The ministry says its tasks include map production at several scales, aerial photography, and
    validation and technical control of GIS products.
  url: https://defense.tn/centre-national-de-la-cartographie-et-de-la-teledetection/?lang=fr
  fetched: 2026-11-08
  quote: la production cartographique à plusieurs échelles, les activités de prises de vues aériennes,
    la validation des cahiers des charges relatifs au SIG, le contrôle technique des produits SIG.
- claim: A ministry news item from February 2025 says the minister, visiting the centre, examined its
    role in using remote sensing in fields including coastal and forest protection.
  url: https://defense.tn/le-ministre-de-la-defense-nationale-en-visite-au-centre-national-de-la-cartographie-et-de-la-teledetection/?lang=fr
  fetched: 2026-11-08
  quote: techniques de télédétection dans des domaines tels que la protection des côtes et des forêts,
    la préservation des ressources en eau et des richesses naturelles.
