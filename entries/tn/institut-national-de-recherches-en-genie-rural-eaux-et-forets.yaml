summary: Research institute in Tunis created in 1996 by merging INRF and CRGR, whose forest ecology laboratory
  lists a forest fire history database with an interactive map among its project results.
facts:
- claim: Created in 1996 by merging INRF and CRGR, under the oversight of IRESA.
  url: http://www.inrgref.agrinet.tn/
  fetched: 2026-11-08
  quote: Cet établissement a fusionné l’INRF et le CRGR, il est doté d’une autonomie financière et placé
    sous la tutelle de l’IRESA.
- claim: Its forest ecology laboratory runs a research programme on the diversity and dynamics of Tunisia's
    forests.
  url: http://inrgref.agrinet.tn/fr/laboratoire-decologie-forestiere-lef/
  fetched: 2026-11-08
  quote: Le Laboratoire mène un programme de recherche visant à comprendre la diversité et la dynamique
    des forêts tunisiennes.
- claim: Under the results of its forest growth and rehabilitation project, the laboratory page lists
    creating a forest fire history database with an interactive, updatable map.
  url: http://inrgref.agrinet.tn/fr/laboratoire-decologie-forestiere-lef/
  fetched: 2026-11-08
  quote: Créer une base de données sur l’historique du feu de forêts (une carte interactive et actualisable
    )
- claim: The same page lists maps for forest district heads to help follow burned areas.
  url: http://inrgref.agrinet.tn/fr/laboratoire-decologie-forestiere-lef/
  fetched: 2026-11-08
  quote: Fournir des supports (des cartes) pour les chefs de triage et des séries forestières pour faciliter
    le suivie des zones incendiées
- claim: Based in El Menzah IV, Tunis.
  url: http://www.inrgref.agrinet.tn/
  fetched: 2026-11-08
