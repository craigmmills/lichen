summary: National park where Marwell says scimitar-horned oryx have been re-established
  and reports analysing oryx population data collected by park staff in 2022.
facts:
- claim: Marwell says the scimitar-horned oryx has been re-established in Bou Hedma
    and three other protected areas.
  url: https://www.marwell.org.uk/zoo-news/conserving-priority-wildlife-species-in-tunisian-protected-areas/
  fetched: '2026-11-12'
  quote: The Extinct In The Wild scimitar-horned oryx Oryx dammah has been re-established
    in Bou Hedma, Dghoumes and Sidi Toui National Parks (NPs) and Oued Dekouk National
    Reserve (NR).
- claim: Marwell reports that in 2022 its team analysed oryx population data collected
    by park staff in Bou Hedma, Dghoumes and Sidi Toui National Parks and Oued Dekouk
    National Reserve.
  url: https://www.marwell.org.uk/zoo-news/conserving-priority-wildlife-species-in-tunisian-protected-areas/
  fetched: '2026-11-12'
  quote: Our team visited each several times across the seasons to survey population
    sizes and body condition, analyse population data collected by park staff, and
    manage the camera-traps that monitor wider biodiversity.
