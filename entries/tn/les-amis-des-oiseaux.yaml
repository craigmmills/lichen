summary: Tunisian non-profit, described by Kapitalis as working on biodiversity monitoring and protection,
  which completed the International Waterbird Census count on 31 January 2022 and in late 2025 published
  a 2019 to 2023 report recording 105 species.
facts:
- claim: AAO completed the International Waterbird Census count of wintering waterbirds in Tunisia on
    31 January 2022.
  url: https://europe.wetlands.org/successful-international-waterbird-census-and-training-in-tunisia/
  fetched: 2026-11-08
  quote: The Association “Les Amis des Oiseaux” AAO/BirdLife in Tunisia completed the international count
    of wintering waterbirds (IWC 2022) in Tunisia on 31 January 2022.
- claim: In late 2025 AAO published a report on waterbird counts in Tunisia for 2019 to 2023, which recorded
    105 species.
  url: https://kapitalis.com/tunisie/?p=18207963
  fetched: 2026-11-08
  quote: c’est ce qui ressort du rapport sur le Dénombrement des oiseaux d’eau en Tunisie pour la période
    2019-2023 publié, fin 2025, par l’association « Les Amis des Oiseaux ».
- claim: Kapitalis describes AAO as a non-profit NGO working on knowledge, monitoring and protection of
    biodiversity in Tunisia, especially birds and their habitats.
  url: https://kapitalis.com/tunisie/?p=18207963
  fetched: 2026-11-08
  quote: L’AAO est une Ong à but non lucratif qui œuvre pour une meilleure connaissance, le suivi et la
    protection de la biodiversité en Tunisie et plus particulièrement des oiseaux et leurs habitats.
