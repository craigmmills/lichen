summary: Described by Marwell as a 6,300-hectare protected area in south-western Tunisia
  within oryx range, where it reported in February 2021 that rangers were managing
  camera traps.
facts:
- claim: In February 2021, Marwell reported that Sidi Toui's rangers were managing
    the camera traps, with support from colleagues or Marwell if needed.
  url: https://www.marwell.org.uk/conservation/under-watchful-eyes-monitoring-the-tunisian-scimitar-horned-oryx-population/
  fetched: 2026-11-12
  quote: The rangers in Sidi Toui are now managing the cameras with support from their
    colleagues or Marwell if needed.
- claim: Marwell describes it as a 6,300-hectare protected area in south-western Tunisia
    within the oryx's range.
  url: https://www.marwell.org.uk/conservation/under-watchful-eyes-monitoring-the-tunisian-scimitar-horned-oryx-population/
  fetched: 2026-11-12
  quote: In October 2020, we were eager to start similar work in Sidi Toui National
    Park, another 6,300ha-protected area located in south-western Tunisia, within
    the SH oryx range.
- claim: Marwell reports that in 2022 its team analysed oryx population data collected
    by park staff in Bou Hedma, Dghoumes and Sidi Toui National Parks and Oued Dekouk
    National Reserve.
  url: https://www.marwell.org.uk/zoo-news/conserving-priority-wildlife-species-in-tunisian-protected-areas/
  fetched: '2026-11-12'
  quote: Our team visited each several times across the seasons to survey population
    sizes and body condition, analyse population data collected by park staff, and
    manage the camera-traps that monitor wider biodiversity.
