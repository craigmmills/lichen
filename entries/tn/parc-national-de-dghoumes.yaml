facts:
- claim: In February 2021, Marwell reported that it had trained Dghoumes guards to
    use and manage camera traps, and they had shared that expertise with Sidi Toui
    staff.
  url: https://www.marwell.org.uk/conservation/under-watchful-eyes-monitoring-the-tunisian-scimitar-horned-oryx-population/
  fetched: 2026-11-12
  quote: Guards from Dghoumes National Park, who Marwell had previously trained to
    use and manage the devices, assisted by sharing their expertise with the staff
    of Sidi Toui.
- claim: In February 2021, Marwell reported an ongoing camera-trap survey in the park
    that it had implemented since 2018.
  url: https://www.marwell.org.uk/conservation/under-watchful-eyes-monitoring-the-tunisian-scimitar-horned-oryx-population/
  fetched: 2026-11-12
  quote: Since 2018, we have implemented an ongoing largescale camera-trap survey
    in Dghoumes National Park
- claim: Marwell reports that in 2022 its team analysed oryx population data collected
    by park staff in Bou Hedma, Dghoumes and Sidi Toui National Parks and Oued Dekouk
    National Reserve.
  url: https://www.marwell.org.uk/zoo-news/conserving-priority-wildlife-species-in-tunisian-protected-areas/
  fetched: '2026-11-12'
  quote: Our team visited each several times across the seasons to survey population
    sizes and body condition, analyse population data collected by park staff, and
    manage the camera-traps that monitor wider biodiversity.
