summary: Tunisian public establishment created by law in 1995 under the Ministry of the Environment and
  Sustainable Development, working on coastal protection and marine protected areas, and offering a geographic
  information system and open data inventory.
facts:
- claim: In December 2025, APAL released an educational animation on the management and creation of marine
    and coastal protected areas in Tunisia.
  url: https://africanmanager.com/lapal-lance-une-animation-pour-sensibiliser-a-la-creation-des-aires-marines-protegees-en-tunisie/
  fetched: 2026-11-08
  quote: L’Agence de Protection et d’Aménagement du Littoral (APAL) a lancé vendredi une animation éducative
    intitulée « Vers la gestion et la création des Aires Marines et Côtières Protégées en Tunisie »
- claim: African Manager reports that APAL's actions include scientific monitoring of Posidonia seagrass
    meadows and fish stocks, and management plans drawn up with coastal communities.
  url: https://africanmanager.com/lapal-lance-une-animation-pour-sensibiliser-a-la-creation-des-aires-marines-protegees-en-tunisie/
  fetched: 2026-11-08
  quote: un suivi scientifique rigoureux des herbiers de posidonie et des stocks de poissons, l’élaboration
    participative de plans de gestion avec les communautés côtières
- claim: APAL leads integrated coastal zone management and coastal protection work, according to its acting
    director general in September 2025.
  url: https://kapitalis.com/tunisie/2025/09/26/tunis-celebre-la-journee-mediterraneenne-du-littoral/
  fetched: 2026-11-08
  quote: Mehdi Ben Haj, directeur général par intérim de l’Apal est revenu sur les interventions de l’Apal,
    qui pilote les efforts de gestion intégrée des zones côtières et les actions de protection du littoral.
- claim: A public establishment created by law in 1995, under the Ministry of the Environment and Sustainable
    Development.
  url: http://www.apal.nat.tn/site_web/index.html
  fetched: 2026-11-08
  quote: L'Agence de Protection et d'Aménagement du Littoral (APAL) est un établissement public à caractère
    non administratif, créé par la loi N°95-72 promulguée le 24/07/1995.
- claim: Its site lists the creation and management of marine and coastal protected areas among its conservation
    work.
  url: http://www.apal.nat.tn/site_web/index.html
  fetched: 2026-11-08
  quote: Création et gestion des AMCP
