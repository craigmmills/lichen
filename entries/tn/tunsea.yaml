facts:
- claim: Describes itself as a Tunisian citizen science platform for marine sciences,
    linking youth groups, associations, fishers, scientists and citizens.
  url: https://tunsea.com/qui-somme-nous/
  fetched: 2026-11-12
  quote: TunSea est une plateforme tunisienne de science participative et citoyenne
    qui vise à promouvoir les actions éducatives et l’innovation
- claim: Set up by researchers and nature conservation activists in September 2020.
  url: https://tunsea.com/qui-somme-nous/
  fetched: 2026-11-12
  quote: Groupe a été créé par un nombre de chercheurs et d’activistes dans le domaine
    de conservation de la nature en Septembre 2020
- claim: In June 2026, La Presse reported that the association called on citizens
    to record, monitor and protect sea turtle nesting sites and share photos and GPS
    positions on its platforms.
  url: https://www.lapresse.tn/2026/06/06/la-saison-de-ponte-des-tortues-marines-debute-sur-les-cotes-tunisiennes/
  fetched: 2026-11-12
  quote: l’Association TunSea pour la Science Participative lance un appel à la mobilisation
    citoyenne afin de recenser, surveiller et protéger les sites de nidification.
- claim: In June 2026, La Presse reported that collected reports were passed to experts
    and local associations so they could secure nests and monitor future hatchings.
  url: https://www.lapresse.tn/2026/06/06/la-saison-de-ponte-des-tortues-marines-debute-sur-les-cotes-tunisiennes/
