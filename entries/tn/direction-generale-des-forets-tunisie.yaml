  quote: La Direction Générale des Forêts (DGF) a appelé toute personne souhaitant visiter les parcs nationaux
    et les réserves naturelles à obtenir une autorisation préalable
- claim: The DGF says it may refuse requests according to a park's capacity and may charge entry fees
    for protected areas.
  url: https://lapresse.tn/2025/10/09/une-autorisation-prealable-desormais-exigee-pour-la-visite-des-parcs-nationaux-et-des-reserves-naturelles/
