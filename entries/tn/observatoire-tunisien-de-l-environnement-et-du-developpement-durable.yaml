summary: Permanent system for collecting, analysing and publishing information on
  Tunisia's environment and sustainable development, hosted by ANPE and, per the Ministry
  of the Environment, the national focal point for UNESCO's MAB programme.
facts:
- claim: ANPE's site describes OTEDD as a permanent system for collecting, producing,
    analysing, managing and publishing information on the state of the environment
    and sustainable development.
  url: https://www.anpe.nat.tn/Fr/presentation-de-l-otedd_11_213
  fetched: 2026-11-13
  quote: est un dispositif permanent de collecte, de production, d’analyse, de gestion
    et de diffusion de l’information sur l’état de l’environnement et le développement
    durable
- claim: Its indicators are meant to describe how the state of the natural environment
    changes.
  url: https://www.anpe.nat.tn/Fr/presentation-de-l-otedd_11_213
  fetched: 2026-11-13
  quote: décrivant le plus fidèlement possible l’évolution de l’état du milieu naturel
- claim: Among its missions are monitoring the state of the environment at national
    and regional level and setting up environmental information systems.
  url: https://www.anpe.nat.tn/Fr/presentation-de-l-otedd_11_213
  fetched: 2026-11-13
  quote: Développer et mettre en place des systèmes d'informations relatifs à l'environnement
    et au développement durable.
- claim: The Ministry of the Environment's page (updated 22 May 2026) says OTEDD acts
    as the national focal point for UNESCO's MAB programme.
  url: https://www.environnement.gov.tn/observatoire/presentation-otedd
  fetched: 2026-11-13
  quote: Assurer le point focal national du programme MAB (UNESCO).
- claim: The ministry says OTEDD is hosted by ANPE.
  url: https://environnement.gov.tn/developpement-durable/suivi-et-evaluation-des-etapes-de-realisation-du-developpement-durable/indicateurs-de-developpement-durable
  fetched: 2026-11-13
  quote: l’OTEDD (hébergé par l’ANPE)
