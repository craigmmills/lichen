summary: Monitoring programme for Ichkeul National Park, run by the national environment
  agency, that maps aquatic vegetation annually and produces an annual report sent
  periodically to UNESCO.
facts:
- claim: Aquatic vegetation is monitored through an annual map of the main benthic
    plant stands with density estimates.
  url: https://www.anpe.nat.tn/Fr/activites_11_109
  fetched: 2026-11-12
  quote: Le suivi de la végétation aquatique du lac est réalisé à partir d’une cartographie
    annuelle des principaux peuplements phytobenthiques (phanérogames et algues) avec
    estimation de leurs densités.
- claim: Field data are analysed into an annual report on the scientific monitoring
    of Ichkeul National Park, sent periodically to UNESCO.
  url: https://www.anpe.nat.tn/Fr/activites_11_109
  fetched: 2026-11-12
  quote: Les données du suivi sur le terrain sont analysées et interprétées puis misent
    dans un rapport annuel (rapport sur le suivi scientifique du Parc National de
    l’Ichkeul).
- claim: Tour du Valat says that from 2002-2003 existing monitoring was grouped into
    a wider monitoring system it proposed, which ANPE put in place.
  url: https://tourduvalat.org/dossier-newsletter/initiative-3-lac-ichkeul-un-programme-de-suivi-unique-en-mediterranee/
  fetched: '2026-11-12'
  quote: ont été regroupés dans un système plus global de suivi proposé par la Tour
    du Valat qui fut efficacement mis en place par l’ANPE Tunisie
