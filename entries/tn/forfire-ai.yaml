summary: Three-year Interreg NEXT Italy-Tunisia project, running 15 May 2025 to 15 May 2028,
  that aims to use AI, satellite imagery, sensors and drones against Mediterranean forest
  fires, with first Tunisian tests planned at Dar Chichou.
facts:
- claim: The project aims to use AI, geospatial data, satellite imagery, sensors and drones
    to prevent and manage forest fires in the Mediterranean, under the Interreg NEXT Italy-Tunisia
    programme.
  url: https://kapitalis.com/tunisie/2026/09/09/tunisie-italie-lia-contre-les-incendies-de-foret/
  fetched: 2026-11-08
  quote: 'Utiliser l’intelligence artificielle, les données géospatiales, l’imagerie satellitaire,
    les capteurs et les drones pour prévenir et gérer les incendies de forêt en Méditerranée
    : tel est l’objectif du projet Forfire-AI.'
- claim: Runs for three years, from 15 May 2025 to 15 May 2028.
  url: https://kapitalis.com/tunisie/2026/09/09/tunisie-italie-lia-contre-les-incendies-de-foret/
  fetched: 2026-11-08
  quote: D’une durée de trois ans, le projet a débuté le 15 mai 2025 et s’achèvera le 15 mai
    2028.
- claim: The first Tunisian tests are planned in the Dar Chichou forest at El Haouaria.
  url: https://kapitalis.com/tunisie/2026/09/09/tunisie-italie-lia-contre-les-incendies-de-foret/
  fetched: 2026-11-08
  quote: Côté tunisien, les premiers tests sont prévus dans la forêt de Dar Chichou, dans
    la zone d’El Haouaria
- claim: Remote sensing with hyperspectral and SAR images, combined with AI, is being studied
    to assess the state of coastal Mediterranean forest ecosystems.
  url: https://kapitalis.com/tunisie/2026/09/09/tunisie-italie-lia-contre-les-incendies-de-foret/
  fetched: 2026-11-08
  quote: des techniques de télédétection fondées sur des images hyperspectrales et radar SAR
    ( Synthetic Aperture Radar ) — intégrées à des systèmes d’intelligence artificielle —
    sont à l’étude pour évaluer l’état des écosystèmes forestiers côtiers méditerranéens
