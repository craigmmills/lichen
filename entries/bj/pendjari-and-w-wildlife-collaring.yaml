summary: Africa Geographic reports that African Parks ran satellite collaring in Pendjari and W National
  Parks involving 25 elephants and 14 antelopes, concluding on 12 December 2020.
facts:
- claim: Africa Geographic reports that the two parks fitted satellite collars on 25 elephants and 14
    antelopes.
  url: https://africageographic.com/stories/largest-collaring-initiative-to-protect-wildlife-in-pendjari-and-w-national-parks-benin/
  fetched: 2026-11-08
  quote: fitting satellite collars on 25 elephants and 14 antelopes to increase the surveillance and protection
    of these species in this transboundary landscape
- claim: The report says the operation concluded on 12 December 2020 after almost three weeks.
  url: https://africageographic.com/stories/largest-collaring-initiative-to-protect-wildlife-in-pendjari-and-w-national-parks-benin/
  fetched: 2026-11-08
  quote: On December 12th specialist veterinarians and park teams concluded an almost three-week operation.
- claim: The report says the W National Park collaring was made possible by Norwegian government financial
    support through UNESCO and the Elephant Crisis Fund.
  url: https://africageographic.com/stories/largest-collaring-initiative-to-protect-wildlife-in-pendjari-and-w-national-parks-benin/
  fetched: 2026-11-08
  quote: The collaring initiative was made possible thanks to the Norwegian Government’s financial support
    through UNESCO and the Elephant Crisis Fund for W National Park-Benin
