summary: NGO reported to have launched an environmental education programme near northern
  Benin's parks, with RBT-WAP support, in which pupils record biodiversity on iNaturalist,
  aiming for at least 7,200 observations.
facts:
- claim: Journal Santé Environnement reports that SOS Savane-ONG launched an environmental
    education programme near the parks of northern Benin with support from the RBT-WAP programme.
  url: https://journalsantenvironnement.com/education-environnementale-au-nord-benin-sos-savane-ong-pour-la-preservation-des-reserves-naturelles/?print=pdf
  fetched: 2026-11-08
  quote: SOS Savane-ONG, avec le soutien du programme RBT-WAP, a lancé un programme d’éducation
    environnementale
- claim: The report says pupils use the iNaturalist app to record local biodiversity, with
    about fifteen observations per session.
  url: https://journalsantenvironnement.com/education-environnementale-au-nord-benin-sos-savane-ong-pour-la-preservation-des-reserves-naturelles/?print=pdf
  fetched: 2026-11-08
  quote: L’un des aspects les plus novateurs du programme est l’utilisation de l’application
    iNaturalist, qui permet aux élèves de documenter leurs observations de la biodiversité
    locale.
- claim: The report says the programme aims to log at least 7,200 observations by its end.
  url: https://journalsantenvironnement.com/education-environnementale-au-nord-benin-sos-savane-ong-pour-la-preservation-des-reserves-naturelles/?print=pdf
