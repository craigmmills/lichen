summary: Organisation funded by CEBioS and RAMPAO, reported in October 2022 to be training
  about twenty ecoguards in Cotonou to record field data on smartphones with SMART instead
  of paper forms.
facts:
- claim: Journal Santé Environnement reported that about twenty ecoguards were attending training
    at Nature Tropicale’s headquarters in Cotonou on 20 October 2022.
  url: https://journalsantenvironnement.com/gestion-de-laire-marine-protegee-amp-de-donaten-nature-tropicale-ong-forme-les-ecogardes-a-lutilisation-efficace-de-lapplication-smart/?print=pdf
  fetched: 2026-11-08
  quote: Une vingtaine d’écogardes sont en formation depuis la matinée de ce jeudi 20 octobre
    2022, au siège de Nature Tropicale à Cotonou (Akpakpa).
- claim: The October 2022 report said the ecoguards would receive two days of training in
    the SMART application to collect field data more effectively.
  url: https://journalsantenvironnement.com/gestion-de-laire-marine-protegee-amp-de-donaten-nature-tropicale-ong-forme-les-ecogardes-a-lutilisation-efficace-de-lapplication-smart/?print=pdf
  fetched: 2026-11-08
  quote: Deux jours durant, ils seront formés à l’utilisation de l’application SMART, dans
    l’objectif de mener, sur le terrain, une collecte de donnée plus efficace.
- claim: In the October 2022 report, its president said the ecoguards would be able to enter
    data directly on smartphones with SMART after the training, instead of using paper forms.
  url: https://journalsantenvironnement.com/gestion-de-laire-marine-protegee-amp-de-donaten-nature-tropicale-ong-forme-les-ecogardes-a-lutilisation-efficace-de-lapplication-smart/?print=pdf
  fetched: 2026-11-08
  quote: ces écogardes pourront inscrire directement les données sur leur smartphone
