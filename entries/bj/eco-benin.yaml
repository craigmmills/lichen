facts:
- claim: Mission is local and national human development through natural resources for ecotourism
    and eco-development.
  url: https://api.gbif.org/v1/organization/b1198535-cd0d-4628-863a-571a0b1b5f42
  fetched: '2026-11-08'
  quote: To promote human development at the local and national level through the development
    and enhancement of natural resources for ecotourism and ecodevelopment.
- claim: Its Alerte Biodiversité mobile app was designed for regular monitoring of mangroves
    and reporting illegal exploitation, with menus to recognise mangrove species and report
    threats or discoveries.
  url: https://www.ecobenin.org/alerte-biodiversite/
  fetched: '2026-11-08'
  quote: C’est dans la perspective d’ assurer un suivi régulier des mangroves , signaler les
    exploitations illégales, et promouvoir la gestion durable des mangroves que cette application
    a été conçue.
- claim: Publishes a privacy policy for the Alerte Biodiversité app.
  url: https://www.ecobenin.org/alerte-biodiversite/
  fetched: '2026-11-08'
  quote: Politique de Confidentialité – Application Alerte Biodiversité – Eco-Bénin
- claim: In September 2023, Eco-Bénin reported a volunteer student field mission under the
    Outcome MANGROVES programme, with a goal of developing an application to monitor key ecological
    values of the Lac Ahémé community conservation area.
  url: https://www.ecobenin.org/outil-de-collecte-de-donnees-et-de-suivi-de-la-biodiversite-dans-laccb-lac-aheme-des-etudiants-en-sciences-informatiques-et-bioingenierie-mobilises/
