summary: Beninese association founded in 2005 that monitors biodiversity, including bio-indicator
  species in the Vallée du Sitatunga park, and was funded by Fondation Ensemble to study red-bellied
  monkeys, with about ten individuals observed by 2019.
facts:
- claim: Fondation Ensemble's project page says Credi-ONG teams would study red-bellied monkey
    populations with a specific monitoring protocol to measure population size and map the
    species' distribution.
  url: https://fondationensemble.org/en/projet/trees-and-bees-helping-red-bellied-monkey-populations-in-the-sitatunga-valley-community-nature-reserve-pncvs
  fetched: 2026-11-08
  quote: A specific monitoring protocol will be developed to measure the size of the population
    and produce a species distribution map and actogram for the red-bellied monkeys living
    on the Nature Reserve.
- claim: The November 2019 final report summary says about ten individuals were observed over
    the funding period.
  url: https://fondationensemble.org/en/projet/trees-and-bees-helping-red-bellied-monkey-populations-in-the-sitatunga-valley-community-nature-reserve-pncvs
  fetched: 2026-11-08
  quote: Over the funding period, approximately ten individuals were observed.
- claim: The November 2019 final report summary said the NGO would continue studying the species
    with camera traps and GPS.
  url: https://fondationensemble.org/en/projet/trees-and-bees-helping-red-bellied-monkey-populations-in-the-sitatunga-valley-community-nature-reserve-pncvs
  fetched: 2026-11-08
  quote: The NGO will continue to study the species, in particular thanks to the young volunteers
    in the communities, via camera traps and GPS
