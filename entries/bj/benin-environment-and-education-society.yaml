summary: Organisation that DroneBelow reported in 2018 had held drone mapping workshops on
  Lake Nokoué fish parks and trained six other environmental associations, in partnership
  with the Dutch IUCN committee.
facts:
- claim: DroneBelow reported in 2018 that BEES proposed to Benin's authorities to map zones
    threatened by erosion or human installations with drones.
  url: https://dronebelow.com/2018/03/09/bees-drone-flies-to-the-rescue-in-benin/
  fetched: 2026-11-08
  quote: The Benin Environment and Education Society ( BEES ) have proposed to local authorities
    in Benin, a country in West Africa, to visualize zones threatened by erosion or by abusive
    human installations, with the use of UAVs.
- claim: The article says that in November 2017 BEES held three days of workshops with the
    Department of Fisheries Production to map Lake Nokoué's fish parks with drones.
  url: https://dronebelow.com/2018/03/09/bees-drone-flies-to-the-rescue-in-benin/
  fetched: 2026-11-08
  quote: In November 2017, the activists decided to change their strategy by inviting the
    Department of Fisheries Production (DPH), an agency attached to the Ministry of Agriculture,
    Livestock and Fisheries, to participate in three days of workshops to map the area using
    drones
- claim: The article says BEES trained six other environmental associations in its network
    to use the drone, through a partnership with the Dutch committee of IUCN.
  url: https://dronebelow.com/2018/03/09/bees-drone-flies-to-the-rescue-in-benin/
  fetched: 2026-11-08
  quote: BEES teams have already trained six other environmental associations in their network
    to use the drone, thanks to a partnership with the Dutch committee of IUCN
