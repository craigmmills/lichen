summary: EU DeSIRA-funded project led by CIRAD and partners, aiming to track Benin’s
  agricultural and landscape change using high-resolution satellite images; Parakou
  restitution workshops announced for November 2026.
countries: []
facts:
- claim: A ULiège project page says OBSYDYA is funded by the EU DeSIRA programme,
    led by CIRAD and carried out by a consortium of the University of Parakou, INRAB,
    CIRAD, the University of Liège and IRD.
  url: https://www.agroecosens.uliege.be/cms/c_10592814/fr/identification-developpement-et-suivi-par-teledetection-d-indicateurs-de-durabilite-ecologique-des-systemes-agricoles-au-centre-et-au-nord-du-benin
  fetched: 2026-11-15
  quote: Il est piloté par le CIRAD et mis en oeuvre par un consortium de chercheurs
    Béninois (l’Université de Parakou (UP) et l’Institut National des Recherches Agricoles
    du Bénin (INRAB)) et Européens (CIRAD, Université de Liège et IRD).
- claim: The ULiège page describes the project's aim to use recent high-resolution
    satellite images to follow changes in agricultural systems and landscapes.
  url: https://www.agroecosens.uliege.be/cms/c_10592814/fr/identification-developpement-et-suivi-par-teledetection-d-indicateurs-de-durabilite-ecologique-des-systemes-agricoles-au-centre-et-au-nord-du-benin
  fetched: 2026-11-15
  quote: tirer parti de la disponibilité récente des images satellitaires à haute
    résolution pour suivre les transformations au niveau des systèmes agricoles et
    des paysages
- claim: Its three components are a map base of landscapes and agricultural systems
    and their change, landscape and sustainability indicators, and a platform for
    processing and sharing spatial information.
  url: https://www.agroecosens.uliege.be/cms/c_10592814/fr/identification-developpement-et-suivi-par-teledetection-d-indicateurs-de-durabilite-ecologique-des-systemes-agricoles-au-centre-et-au-nord-du-benin
  fetched: 2026-11-15
  quote: la création d’une base cartographique des paysages et systèmes agricoles
    ainsi que leur évolution
- claim: In September 2026 its site announced an article on a multi-site, multi-year
    labelled polygon dataset for agricultural land use and land cover mapping in central
    and northern Benin.
  url: https://www.obsydya.org
  fetched: 2026-11-15
  quote: A Multi-Site, Multi-Year Labeled Polygon Dataset for Agricultural Land Use
    and Land Cover Mapping in Central and Northern Benin
- claim: Its site announced project restitution workshops in Parakou in November 2026.
  url: https://www.obsydya.org
  fetched: 2026-11-15
  quote: Nous organisons deux ateliers de restitution du projet OBSYDYA à Parakou
    le 10 novembre
