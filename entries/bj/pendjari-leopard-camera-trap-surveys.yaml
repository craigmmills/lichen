summary: Mongabay reports biennial Pendjari leopard surveys from 2017, using 81 camera traps in 2021 and
  50 in 2023 across a quarter of the 2021 area.
facts:
- claim: Mongabay says a team of ecologists, rangers and researchers began biennial camera-trap surveys
    of leopards in Pendjari National Park in 2017.
  url: https://news.mongabay.com/2026/07/endangered-west-african-leopards-show-signs-of-recovery-despite-odds-its-a-win/
  fetched: 2026-11-08
  quote: To find out how leopards were faring within Pendjari NP, a team of ecologists, rangers and researchers
    began biennial camera trap surveys in 2017, the first long-term study of leopards in West Africa.
- claim: Mongabay says the 2021 survey set 81 camera traps and the 2023 survey 50, in a quarter of the
    2021 area.
  url: https://news.mongabay.com/2026/07/endangered-west-african-leopards-show-signs-of-recovery-despite-odds-its-a-win/
  fetched: 2026-11-08
  quote: For example, in the 2021 leopard survey, the team set up 81 camera traps, but in 2023, they could
    only set 50, in just a quarter of the 2021 survey area.
- claim: Mongabay says the team uses camera traps designed by Panthera.
  url: https://news.mongabay.com/2026/07/endangered-west-african-leopards-show-signs-of-recovery-despite-odds-its-a-win/
  fetched: 2026-11-08
  quote: camera traps that were designed by Panthera to withstand harsh field conditions for extended
    periods without maintenance
- claim: Mongabay names the study's lead author as Marine Drouilly, a biologist with Panthera.
  url: https://news.mongabay.com/2026/07/endangered-west-african-leopards-show-signs-of-recovery-despite-odds-its-a-win/
