summary: National directorate under the ministry for the living environment that implements
  forest policy and manages forests, wildlife and protected areas, and says it has collected
  biodiversity data, including Pendjari and W animal counts.
facts:
- claim: The CBD's list of national focal points for Benin names the directorate, in Cotonou,
    under the ministry for the living environment.
  url: https://www.cbd.int/countries/nfp?country=bj
  fetched: 2026-11-08
  quote: Direction Générale des Eaux, Forêts et Chasse
- claim: The CBD lists the directorate's secretariat as Benin's focal point for protected
    areas, marine and coastal biodiversity and other areas.
  url: https://www.cbd.int/countries/nfp?country=bj
  fetched: 2026-11-08
  quote: CBD Secondary NFP, CHM NFP, Protected Areas NFP, GTI NFP, Marine and Coastal Biodiversity
    NFP, Gender and Biodiversity NFP, GSPC NFP
- claim: A national institution whose mission is to implement national forest policy and the
    sustainable management of forests, wildlife and protected areas, according to its GBIF
    publisher record.
  url: https://api.gbif.org/v1/organization/616e379f-90ed-4c21-9793-8e20f982e9d1
  fetched: 2026-11-08
  quote: is a national institution which mission is to implement the nation forest policy
    and ensure the sustainable management of forest, wildlife and protected area at country
    level.
