summary: Organisation that deployed 15 camera traps on Agonvè island in May 2025 and coordinated
  a June 2026 bird inventory in Benin.
facts:
- claim: In May 2025 a Naben team deployed 15 camera traps in the swamp forest of Agonvè island
    to inventory its fauna.
  url: https://naben.org/
  fetched: '2026-11-08'
  quote: a déployé 15 caméras trap dans la forêt marécageuse de l’île d’Agonvè. L’objectif
    principal de cette mission était d’inventorier les espèces de faune du milieu
- claim: In June 2026 it coordinated the first bird inventory of the Agbogon community biological
    reserve in central Benin.
  url: https://naben.org/
  fetched: '2026-11-08'
  quote: En juin 2026, Naben a coordonné le tout premier inventaire ornithologique de la Réserve
    Biologique Communautaire d’Agbogon (RBCA)
- claim: From April 2025 to February 2026 it ran a community conservation project for the
    red-bellied monkey and its wetlands on Agonvè island, funded by the Rufford Foundation.
  url: https://naben.org/
  fetched: '2026-11-08'
  quote: D’avril 2025 à février 2026, Naben a conduit sur l’île d’Agonvè, dans la commune
    de Zagnanado, un projet de conservation communautaire du singe à ventre rouge
