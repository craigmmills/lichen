summary: A body established in January 2000 to coordinate oceanographic research in Mauritius, with projects
  on coral culture and ecological monitoring and satellite oceanography capacity built with the Indian
  Ocean Commission.
facts:
- claim: Established in January 2000 under the MOI Act to rationalise and coordinate oceanographic research
    and development in Mauritius.
  url: https://ecofish-programme.org/wp-content/uploads/2024/02/MOI_Profile.pdf
  fetched: 2026-11-09
  quote: The Mauritius Oceanography Institute (MOI), was established in January 2000 by the proclamation
    of the MOI Act (Act No. 24 of 1999), to rationalise and co - ordinate oceanographic research and development
    activities in the Republic of Mauritius.
- claim: Its research projects include Long Term Ecological Monitoring of the Nearshore Waters of Mauritius
    and Coral Culture for Reef Rehabilitation.
  url: https://ecofish-programme.org/wp-content/uploads/2024/02/MOI_Profile.pdf
  fetched: 2026-11-09
  quote: Long Term Ecological Monitoring of the Nearshore Waters of Mauritius, Coral Culture for Reef
    Rehabilitation and Ocean Acidification.
- claim: With the Indian Ocean Commission it has built satellite oceanography capacity through EU and
    African Union funded projects including MESA and GMES & Africa.
  url: https://ecofish-programme.org/wp-content/uploads/2024/02/MOI_Profile.pdf
  fetched: 2026-11-09
  quote: the Institute has enhanced satellite oceanography capabilities in the African region through
    European Union (EU) and African Union Commission (AUC) funded projects
- claim: Based at Albion, Mauritius.
  url: https://ecofish-programme.org/wp-content/uploads/2024/02/MOI_Profile.pdf
  fetched: 2026-11-09
  quote: Avenue des Anchois, Morcellement de Chazal Albion, 91005, Republic of Mauritius
- claim: Its address is in Albion, Mauritius.
  url: https://moi.govmu.org
  fetched: 2026-11-09
  quote: Avenue des Anchois, Morcellement de Chazal Albion, Mauritius
- claim: Its site lists a biological survey of Port Mathurin Harbour to detect introduced species.
  url: https://moi.govmu.org
  fetched: 2026-11-09
  quote: Biological Survey of Port Mathurin Harbour to Detect Introduced Species
- claim: Its site lists the African Monitoring of the Environment for Sustainable Development (AMESD)
    project and a second phase of coral farming.
  url: https://moi.govmu.org
  fetched: 2026-11-09
  quote: African Monitoring of the Environment for Sustainable Development (AMESD) Coral Farming-Second
    phase
- claim: Reef Conservation's site says UNDP implements an Adaptation Fund coral restoration project in
    collaboration with the MOI, and places the MOI under the aegis of the Ministry of Blue Economy, Marine
    Resources, Fisheries and Shipping.
  url: https://reefconservation.mu/research_coral_restoration_project
  fetched: 2026-11-09
  quote: in collaboration with the Albion Fisheries Research Centre (AFRC) and the Mauritius Oceanography
    Institute (MOI), both under the aegis of the Ministry of Blue Economy, Marine Resources, Fisheries
    and Shipping
- claim: Lists a project mapping the oceanic and coastal environments of the Republic of Mauritius, with
    plankton assessments in its exclusive economic zone.
  url: https://moi.govmu.org
  fetched: 2026-11-09
  quote: 'Mapping of oceanic and coastal environments of the Republic of Mauritius: Component - Plankton
    assessments in the EEZ of Mauritius including outer islands (Seamounts and FADs)'
- claim: Lists a second phase of coral farming among its projects.
  url: https://moi.govmu.org
  fetched: 2026-11-09
  quote: Coral Farming-Second phase
