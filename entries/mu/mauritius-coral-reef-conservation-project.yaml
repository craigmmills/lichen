summary: A closed Huawei-funded Tech4Nature project run by EcoMode Society; Huawei reports solar buoys,
  underwater cameras and 25,000 coral fragments transplanted at Pointe-aux-Feuilles by August 2023.
facts:
- claim: Huawei reports that the project deployed solar-powered buoys with underwater sensors measuring
    environmental conditions and marine life, transmitting data to shore for cloud analysis.
  url: https://www.huawei.com/en/tech4all/stories/restoring-mauritius-coral-reef-ecosystem
  fetched: 2026-11-09
  quote: The project team deployed solar-powered buoys on the sea surface, under which underwater sensors
    were hung at different depths to measure environmental data
- claim: Huawei reports that underwater cameras were fitted to monitor the growth and survival of coral
    fragments in the nursery.
  url: https://www.huawei.com/en/tech4all/stories/restoring-mauritius-coral-reef-ecosystem
  fetched: 2026-11-09
  quote: the underwater cameras fitted with special lenses to monitor the growth and survival of coral
    fragments in the nursery
- claim: Huawei reports that 25,000 coral fragments had been transplanted to degraded reef by August 2023.
  url: https://www.huawei.com/en/tech4all/stories/restoring-mauritius-coral-reef-ecosystem
  fetched: 2026-11-09
  quote: By August 2023, 25,000 coral fragments had been transplanted from the coral nursery to 20 square
    kilometers of degraded reef at Point-aux-Feuilles
- claim: Huawei's Tech4Nature report gives it as case study 3, on technology and AI for reef restoration
    in Mauritius.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: 2026-11-09
  quote: 'Using Advance Technology and AI for Reef Restoration: Implications of Active Management to declare
    a Marine Protected Area in Mauritius'
- claim: The restoration site at Pointe-aux-Feuilles covers about 2,000 ha.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: 2026-11-09
  quote: The restoration site at Pointe-aux-Feuilles covers an area of approximately 2,000 ha (20km2)
- claim: Underwater cameras allowed live viewing and monitoring of reef areas.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: 2026-11-09
  quote: Using underwater cameras allowed for live viewing and monitoring of areas that were previously
    inaccessible
- claim: The report says about 25,000 coral fragments were grown in nurseries and over 15,000 planted.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: 2026-11-09
  quote: To date, around 25,000 coral fragments have been grown in the nurseries, with over 15,000 of
    them planted in deteriorated reefs
- claim: Tech4Nature phase 1 ran from 2020 to 2023 and included live viewing and monitoring of community-run
    coral reef projects in Mauritius.
  url: https://prnewswire.com/il/news-releases/huawei-and-iucn-host-tech4nature-summit-to-promote-innovation-in-nature-conservation-302166109.html
  fetched: 2026-11-09
  quote: Advanced systems for live viewing and monitoring of coral reef conservation and restoration projects
    run by local communities in Mauritius
- claim: The case study's photograph is credited to Ecomode Society.
  url: https://www.huawei.com/en/tech4all/publications/a-partnership-for-our-planet
  fetched: 2026-11-09
  quote: 6.3 Case Study 3 - MAURITIUS © Ecomode Society
