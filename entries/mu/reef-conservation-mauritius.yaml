summary: A Mauritian NGO founded in 2004 that monitors marine ecosystems, with a 2023 to 2024 mangrove
  report recording drone mapping and aims for an eDNA inventory and a volunteer mangrove app.
facts:
- claim: An NGO directory says it conducts scientific research and monitoring of the health of marine
    ecosystems.
  url: https://www.actogether.mu/find-an-ngo/reef-conservation/
  fetched: 2026-11-09
  quote: Conducting scientific research and monitoring of the health of marine ecosystems to better inform
    conservation strategies.
- claim: Scientific monitoring is carried out in the Voluntary Marine Conservation Areas it has developed
    since 2009.
  url: https://www.actogether.mu/find-an-ngo/reef-conservation/
  fetched: 2026-11-09
  quote: Scientific monitoring is also conducted in these areas to better understand their functioning
    and validate the preservation effects on the lagoon.
- claim: Founded in 2004 as the Marine Conservation Management Consortium, later renamed Reef Conservation.
  url: https://www.actogether.mu/find-an-ngo/reef-conservation/
  fetched: 2026-11-09
  quote: Reef Conservation was established in 2004 under the original name "Marine Conservation Management
    Consortium"
