  url: https://www.reefconservation.mu/
  fetched: 2026-11-09
  quote: Research, Restore and Educate about the Coastal and Marine resources of Mauritius
- claim: Its office is in Pereybere, Mauritius.
  url: https://www.reefconservation.mu/
  fetched: 2026-11-09
  quote: Les Flammants Branch Road Morcellement Pereyscape Pereybere, Mauritius
- claim: Registered as an association in 2004.
  url: https://www.reefconservation.mu/about
  fetched: 2026-11-09
  quote: Reef Conservation was registered as an association in 2004
- claim: Its 2023 to 2024 SOS Mangrove report records visual surveys at 15 sites and post-Wakashio monitoring
    with AFRC.
  url: https://www.mol-mauritius-fund.jp/Portals/0/Reports/Reef%20conservation_SOS%20Mangrove%20project_2023~2024%20report.pdf
  fetched: 2026-11-09
  quote: 18 visual surveys conducted in 15 sites 6 Post-Wakashio (IEMP) Monitoring conducted in impacted
    sites collaboration with AFRC
- claim: The report records drone mapping flights around Mauritius.
  url: https://www.mol-mauritius-fund.jp/Portals/0/Reports/Reef%20conservation_SOS%20Mangrove%20project_2023~2024%20report.pdf
  fetched: 2026-11-09
  quote: Several Mapping flights were conducted around Mauritius in Melville, Paletuviers, Anse La Raie
- claim: The report sets an aim of an eDNA inventory of commercially important species in mangrove forests.
  url: https://www.mol-mauritius-fund.jp/Portals/0/Reports/Reef%20conservation_SOS%20Mangrove%20project_2023~2024%20report.pdf
  fetched: 2026-11-09
  quote: Inventory of commercially important species diversity across spatial and temporal scale in mangrove
    forests through eDNA analysis.
- claim: The report sets an aim of volunteer mangrove monitoring through a newly developed mangrove app.
  url: https://www.mol-mauritius-fund.jp/Portals/0/Reports/Reef%20conservation_SOS%20Mangrove%20project_2023~2024%20report.pdf
  fetched: 2026-11-09
  quote: Promote citizen science and mangrove monitoring using the newly developed mangrove app that allows
    the collection of reliable visual data on mangrove by trained volunteers.
- claim: Following a 2022 call for proposals, Reef Conservation was selected as one of two NGOs to help
    implement coral restoration in Blue Bay Marine Park under an Adaptation Fund project directly implemented
    by UNDP.
  url: https://reefconservation.mu/research_coral_restoration_project
  fetched: 2026-11-09
  quote: Following a Call for Proposal in 2022, Reef Conservation is one of two NGOs selected to implement,
    contribute, and support the achievement of specific project outcomes and activities in coral restoration
    in the Blue Bay Marine Park
