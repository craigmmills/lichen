summary: RECOS-financed Mauritius pilot for 2024 to 2026, led by Reef Conservation
  with NatureMetrics as partner, using eDNA to strengthen monitoring in the Bel Ombre
  watershed; NatureMetrics' service is priced at about 20,000 euros.
facts:
- claim: An Indian Ocean Commission good-practice sheet says Reef Conservation, with
    NatureMetrics, chose eDNA for an in-depth ecological diagnosis of a river in a
    south-west Mauritius watershed, as part of the Mauritius pilot project financed
    by RECOS.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2025/09/Bonne-pratique-e-DNA_Final.pdf
  fetched: 2026-11-13
  quote: Nature Metrics, a opté pour l’emploi de cet outil pour réaliser le diagnostic
- claim: It says the pilot runs from 2024 to 2026 and aims to restore freshwater and
    coastal ecosystems in the Bel Ombre watershed, especially the Jacotet river, with
    eDNA used to strengthen monitoring of ecosystem health.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2025/09/Bonne-pratique-e-DNA_Final.pdf
  fetched: 2026-11-13
  quote: Le projet pilote de Maurice, dont la mise en œuvre s’étend de 2024 à 2026,
    vise à restaurer les écosystèmes d'eau
- claim: It puts NatureMetrics' service for the project at about 20,000 euros, including
    around fifty eDNA sampling kits and their laboratory analysis.
  url: https://www.commissionoceanindien.org/wp-content/uploads/2025/09/Bonne-pratique-e-DNA_Final.pdf
  fetched: 2026-11-13
  quote: proposés par Nature Metrics dans le cadre du projet de Reef Conservation
    (voir ci-dessous) s’élèvent
