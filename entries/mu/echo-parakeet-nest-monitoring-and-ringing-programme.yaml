summary: Mauritian Wildlife Foundation programme checking nest boxes and cavities
  each breeding season and ringing chicks, yielding a 1994 to 2022 capture-mark-recapture
  dataset of 2,734 known-aged wild individuals.
facts:
- claim: A Dryad dataset page says field biologists from the Mauritian Wildlife Foundation
    systematically check all known nest boxes and natural cavities to identify breeding
    pairs and record reproductive success each austral summer breeding season.
  url: https://datadryad.org/dataset/doi:10.5061/dryad.dz08kpsdk
  fetched: 2026-11-13
  quote: Field biologists from the Mauritian Wildlife Foundation systematically check
    all known nest boxes and natural cavities
- claim: It says ringing records began in 1991 and that individuals are ringed in
    the nest before fledging, enabling long-term tracking.
  url: https://datadryad.org/dataset/doi:10.5061/dryad.dz08kpsdk
  fetched: 2026-11-13
  quote: While ringing records began in 1991, the first chicks to successfully fledge
    were marked in 1994
- claim: The dataset is a 29-year capture-mark-recapture record (1994 to 2022) covering
    2,734 known-aged wild individuals.
  url: https://datadryad.org/dataset/doi:10.5061/dryad.dz08kpsdk
  fetched: 2026-11-13
  quote: We leverage a 29-year capture-mark-recapture dataset (1994 - 2022) from the
    echo parakeet population
