summary: A registered charity founded in 1984 and described as the largest Mauritian NGO focused only
  on endangered species, which in 2021 used AudioMoth recorders and a sound classifier to detect Echo
  Parakeets.
facts:
- claim: An NGO directory describes it as the largest NGO in Mauritius concerned only with conserving
    endangered plant and animal species.
  url: https://www.actogether.mu/fr/trouver-une-ong/mauritian-wildlife-foundation
  fetched: 2026-11-09
  quote: The Mauritian Wildlife Foundation (MWF) is the largest non-governmental organisation (NGO) in
    Mauritius to be exclusively concerned with the conservation and preservation of endangered plant and
    animal species in Mauritius.
- claim: Registered charity established in 1984, with headquarters in Vacoas and a branch in Rodrigues.
  url: https://www.actogether.mu/fr/trouver-une-ong/mauritian-wildlife-foundation
  fetched: 2026-11-09
  quote: The headquarters are located in Vacoas, Mauritius, with a branch in Solitude, Rodrigues.
