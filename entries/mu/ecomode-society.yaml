summary: An NGO whose 2021 to 2024 Tech4Nature coral programme at Pointe-aux-Feuilles planned camera monitoring
  and a proof of concept of AI for coral monitoring, with no progress reports submitted.
facts:
- claim: Huawei says Huawei Mauritius teamed up with EcoMode Society in 2021 to carry out a three-year
    conservation programme at Pointe-aux-Feuilles under Tech4Nature.
  url: https://www.huawei.com/en/tech4all/stories/restoring-mauritius-coral-reef-ecosystem
  fetched: 2026-11-09
  quote: Under the Tech4Nature initiative launched by IUCN and Huawei, Huawei Mauritius teamed up with
    local partner EcoMode Society in 2021 to implement a three-year conservation program at Pointe-aux-Feuilles
    off the east coast of Mauritius.
- claim: Its UN SDG Action commitment, running from July 2021 to June 2024, sets out an advanced camera
    system for live viewing and monitoring at Pointe-aux-Feuilles as the flagship site for the Tech4Nature
    partnership.
  url: https://sdgs.un.org/partnerships/using-advance-technology-and-ai-reef-restoration-implications-active-management
  fetched: 2026-11-09
  quote: 'IMPLEMENTATION OF ADVANCE CAMERA SYSTEM FOR LIVE VIEWING AND MONITORING: support EcoMode Society
    as the flagship Pointe-aux-Feuilles site for ‘TECH4NATURE’ partnership'
- claim: The commitment lists as an expected result a proof of concept of AI technology for coral monitoring;
    the page says no progress reports have been submitted.
  url: https://sdgs.un.org/partnerships/using-advance-technology-and-ai-reef-restoration-implications-active-management
  fetched: 2026-11-09
  quote: 'Advance Camera Setup Result: Proof-of-concept tested for AI technology for coral monitoring'
- claim: An NGO working on terrestrial and marine environmental protection.
  url: https://www.mol-mauritius-fund.jp/en/projects/tabid116.html
  fetched: 2026-11-09
  quote: The EcoMode Society (EMS) is an NGO working to preserve our environment be it terrestrial or
    marine.
- claim: The 2022 project planned regular monitoring of its coral nurseries at Pointe aux Feuilles, with
    coral growth to be analysed using an AI algorithm.
  url: https://www.mol-mauritius-fund.jp/en/projects/tabid116.html
  fetched: 2026-11-09
  quote: Monitoring of coral nurseries will be done on a regular basis. Dimensions of coral fragments
    will be recorded for coral growth to be analysed using an AI algorithm.
- claim: The MOL Mauritius International Fund lists a completed 2022 EcoMode Society project on coral
    reef conservation using an AI algorithm.
  url: https://www.mol-mauritius-fund.jp/en/projects/
  fetched: 2026-11-09
  quote: EcoMode Society <Coral reefs> Protection and proactive conservation of coral reefs using AI algorithm
    1 year (2022)
- claim: The summary for its completed 2023–2025 coral-farming project planned to grow corals from near
    the Wakashio accident site and generate data on coral growth and survival.
  url: https://www.mol-mauritius-fund.jp/en/projects/tabid151.html
  fetched: 2026-11-09
  quote: We expect to generate scientific data on coral growth and survivorship.
