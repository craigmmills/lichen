status: closed
summary: Closed project that established a thermal drone survey protocol for Mauritius's
  macaques; its 2025 final report gives a baseline of around 60,000 animals from 1,550
  hectares surveyed.
facts:
- claim: The Rufford Foundation's project page, dated 16 January 2024, says the project
    aims to test drone-mounted thermal infrared cameras for counting macaques in Mauritius
    and to develop a method for surveying them on an island scale.
  url: https://rufford.org/projects/raphael-reinegger/systematic-survey-long-tailed-macaques-mauritius-using-drone-mounted-thermal-infrared-cameras
  fetched: 2026-11-15
  quote: we aim to test the suitability of drone-mounted thermal infrared (TIR) cameras
    for counting macaques in Mauritius
- claim: The final evaluation report, dated 9 July 2025, says the team established
    a thermal drone survey protocol for monitoring the macaques at large spatial and
    temporal scales in Mauritius and provided a baseline population estimate.
  url: https://media.rufford.org/media/project_reports/39995-D_Reinegger_Updated_Final_Report_to_upload_-_final.pdf
  fetched: 2026-11-15
  quote: We established a thermal drone survey protocol for monitoring M. fascicularis
- claim: The report says 1,550 hectares were surveyed at the landscape scale and that
    two statistical methods put the population at around 60,000 macaques.
  url: https://media.rufford.org/media/project_reports/39995-D_Reinegger_Updated_Final_Report_to_upload_-_final.pdf
  fetched: 2026-11-15
  quote: we found that the population is around 60,000
- claim: The report is headed as the project's final evaluation report.
  url: https://media.rufford.org/media/project_reports/39995-D_Reinegger_Updated_Final_Report_to_upload_-_final.pdf
  fetched: 2026-11-15
  quote: Final Evaluation Report
- claim: The report says the National Parks and Conservation Service intends to buy
    and use thermal drones with the project's protocol for long-term monitoring of
    the macaques.
  url: https://media.rufford.org/media/project_reports/39995-D_Reinegger_Updated_Final_Report_to_upload_-_final.pdf
  fetched: 2026-11-15
  quote: The NPCS benefitted from this project as they intend to now purchase and  use
