summary: A Mauritian marine conservation NGO supporting reserve selection, whose 2007
  report records reef monitoring since 1999 and an address at Pointe Monier, Rodrigues.
facts:
- claim: A 2012 GEF news page calls Shoals Rodrigues a marine conservation NGO from
    Mauritius and says its GEF Small Grants Programme project to improve management
    of Rodrigues' marine reserves ran from July 2010 to May 2012.
  url: https://thegef.org/newsroom/news/gef-sgp-mauritius-grantee-presents-marine-conservation-efforts-international-coral
  fetched: 2026-11-13
  quote: Science Officer at Shoals Rodrigues, a marine conservation NGO from Mauritius
- claim: The same page says four marine reserves in the north of the lagoon were selected
    by local communities with the support of Shoals Rodrigues and GEF SGP.
  url: https://thegef.org/newsroom/news/gef-sgp-mauritius-grantee-presents-marine-conservation-efforts-international-coral
  fetched: 2026-11-13
  quote: The newly established MPAs include four marine reserves in the North, which
    were selected by local communities with the support of Shoals Rodrigues and GEF
    SGP.
- claim: Its 2007 lagoon monitoring report gives its address at Pointe Monier, Rodrigues,
    and says it has monitored reef slope and reef flat areas around Rodrigues since
    1999.
