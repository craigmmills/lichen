summary: Saudi giga project spanning 26,500 square kilometres, carrying out habitat restoration,
  species reintroduction and marine conservation; Asharq Al-Awsat reported over 1,100 animals
  of six species reintroduced by June 2025.
facts:
- claim: Asharq Al-Awsat, citing the Saudi Press Agency, reported in June 2025 that NEOM had
    reintroduced more than 1,100 animals of six species to its nature reserve.
  url: https://english.aawsat.com/varieties/5150462-neom-nature-reserve-reintroduces-six-animal-species
  fetched: 2026-11-03
  quote: NEOM has reintroduced more than 1,100 animals across six species to its expansive
    Nature Reserve
- claim: The June 2025 report says wild ibex in the reserve were often caught on camera by
    NEOM’s monitoring programme.
  url: https://english.aawsat.com/varieties/5150462-neom-nature-reserve-reintroduces-six-animal-species
  fetched: 2026-11-03
  quote: adding to the population of several wild Ibex who have naturally returned to the
    area and are often caught on camera as part of NEOM's monitoring program.
- claim: KAUST describes NEOM as a giga project initiated by Saudi Arabia, and its partner
    in the Reefscape coral restoration project.
  url: https://www.kaust.edu.sa/news/kaust-reefscape-restoration-initiative-at-shushah-island
  fetched: 2026-11-03
  quote: NEOM , a sustainable-focused giga project initiated by the Kingdom of Saudi Arabia
    (KSA) to improve the quality of working, living and natural environments.
- claim: KAUST says NEOM provides operational infrastructure and sites for coral propagation
    and planting in the Reefscape project.
  url: https://www.kaust.edu.sa/news/kaust-reefscape-restoration-initiative-at-shushah-island
  fetched: 2026-11-03
  quote: NEOM brings the umbrella vision, operational infrastructure and dedicated sites for
    coral propagation and in-situ planting.
- claim: Says it spans 26,500 square kilometres and 468 kilometres of coastline and carries
    out habitat restoration, species reintroduction and marine conservation.
  url: https://www.neom.com/en-us/about/nature
  fetched: '2026-11-03'
  quote: Spanning 26,500 square kilometers of mountains, deserts, plains and 468 kilometers
    of coastline, NEOM is committed to safeguarding the region’s natural heritage.
- claim: Says its nature work is driven by research, planning, adaptive management, regulatory
    compliance and long-term ecological monitoring.
  url: https://www.neom.com/en-us/about/nature
  fetched: '2026-11-03'
  quote: Our work is driven by research, strategic planning, adaptive management, regulatory
    compliance and long‑term ecological monitoring.
- claim: Says it has mapped marine habitat to support restoration and protection of coastal
    ecosystems.
  url: https://www.neom.com/en-us/about/nature
  fetched: '2026-11-03'
  quote: of marine habitat mapped to support restoration and protection of coastal ecosystems
- claim: The ReefNet paper says the research was funded by the Ocean Science and Solutions
    Applied Research Institute (OSSARI), NEOM Company.
  url: https://arxiv.org/html/2510.16822v2
  fetched: '2026-11-03'
  quote: This research was funded by the Ocean Science and Solutions Applied Research Institute
    (OSSARI), NEOM Company
- claim: NEOM Nature Reserve initiated, funded and oversaw the KAUST marine megafauna surveys.
  url: https://www.kaust.edu.sa/en/news/preserving-marine-wildlife-kaust-supports-neom-s-visionary-conservation-efforts
  fetched: 2026-11-03
  quote: NEOM Nature Reserve initiated, funded, and has overseen these activities as part
    of its comprehensive conservation strategy
- claim: In KAUST’s November 2024 report, NEOM Nature Reserve’s marine director described
    the use of drones and AI monitoring.
  url: https://www.kaust.edu.sa/en/news/preserving-marine-wildlife-kaust-supports-neom-s-visionary-conservation-efforts
  fetched: 2026-11-03
  quote: The use of drones and AI monitoring is a testament to NEOM's focus on innovation,
    embedded across our programs.
