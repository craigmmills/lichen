summary: KAUST-built project begun in 2023 to assess the environmental quality of 15 NEOM coral reefs
  and inventory reef biodiversity using visual surveys, DNA barcoding and eDNA metabarcoding.
facts:
- claim: Began in 2023 to evaluate the environmental quality and status of 15 coral reefs in NEOM and
    inventory reef-associated biodiversity from bacteria to fish.
  url: https://bemlab.kaust.edu.sa/projects/benthic-biodiversity-across-the-neom-region
