summary: Six-week Red Sea expedition by NEOM and OceanX with 30 experts, which 3D-mapped about 1,500 square
  kilometres of seabed over 42 days; findings announced in October 2021 informed marine protected area
  design.
facts:
- claim: NEOM and OceanX ran a six-week expedition with 30 experts working on oceanography, mapping and
    genetics, meant to lay the foundations for NEOM's conservation programme.
  url: https://www.neom.com/en-us/our-business/partners/oceanx
  fetched: '2026-11-03'
  quote: Over six weeks, 30 world-renowned experts carried out pioneering work in the deep sea and shallow
    reefs - focused on oceanography, mapping and genetics.
- claim: Spent 42 days 3D-mapping some 1,500 square kilometres of seabed.
  url: https://www.neom.com/en-us/our-business/partners/oceanx
  fetched: '2026-11-03'
  quote: After 42 days spent 3D mapping some 1,500 km2 of seabed, the crew made some astounding discoveries.
- claim: Used underwater microphones to monitor dolphins and whales at night, and carried out the first
    Red Sea tagging of hawksbill turtles, silvertip reef sharks and whale sharks.
  url: https://www.neom.com/en-us/our-business/partners/oceanx
  fetched: '2026-11-03'
  quote: The expedition resulted in the first Red Sea tagging of hawksbill sea turtles, silvertip reef
    sharks and whale sharks.
- claim: NEOM announced the findings in October 2021 and said they were being used to design and implement
    marine protected areas.
  url: https://www.neom.com/en-us/newsroom/neom-oceanx
  fetched: '2026-11-03'
  quote: The findings from the expedition are being used to drive the design and implementation of marine
    protected areas
