facts:
- claim: KAUST describes it as a coral reef restoration programme for the Red Sea, supported
    by KAUST, with a collaboration with NEOM.
  url: https://www.kaust.edu.sa/en/innovate/kcri
  fetched: 2026-11-03
  quote: This groundbreaking initiative, supported by KAUST, utilizes cutting-edge technology,
    scientific research, and strategic partnerships—including a collaboration with NEOM—to
    ensure a sustainable marine environment for future generations.
- claim: KAUST says the KAUST-NEOM partnership is a 30-year collaborative agreement.
  url: https://www.kaust.edu.sa/en/innovate/kcri
  fetched: 2026-11-03
  quote: The KAUST-NEOM partnership is a 30-year collaborative agreement to establish Saudi
    Arabia as a global leader in coral restoration.
- claim: KAUST says the programme integrates eCoral, a KAUST-developed platform combining
    AI and machine learning analytics for monitoring and decisions.
  url: https://www.kaust.edu.sa/en/innovate/kcri
  fetched: 2026-11-03
  quote: KCRI integrates eCoral™, an end-to-end digital ecosystem developed by KAUST. This
    platform combines AI and ML-driven analytics to streamline coral restoration, scenario
    modeling, and decision-making.
- claim: KAUST's community news site reported the KAUST Coral Nursery was commissioned on
    14 May 2026, with capacity for 340,000 corals a year.
