summary: Marine survey project run by KAUST Beacon Development and funded by NEOM; KAUST reported in November
  2024 an AI model processing 180,000 first-phase images to detect dugongs, turtles, dolphins, sharks
  and rays.
facts:
- claim: KAUST reported in November 2024 that it had been conducting marine megafauna surveys through
    KAUST Beacon Development since January 2024.
  url: https://www.kaust.edu.sa/en/news/preserving-marine-wildlife-kaust-supports-neom-s-visionary-conservation-efforts
  fetched: 2026-11-03
  quote: Since January 2024, through KAUST Beacon Development, KAUST has been conducting a series of marine
    megafauna surveys.
- claim: Researchers relied on an AI model to process the 180,000 images from the first phase.
  url: https://www.kaust.edu.sa/en/news/preserving-marine-wildlife-kaust-supports-neom-s-visionary-conservation-efforts
  fetched: 2026-11-03
  quote: Researchers relied heavily on an artificial intelligence model to process the 180,000 images
    collected during the first phase of this joint effort by KAUST and NEOM
- claim: The model was reported to detect dugongs, turtles, dolphins, sharks and rays reliably.
  url: https://www.kaust.edu.sa/en/news/preserving-marine-wildlife-kaust-supports-neom-s-visionary-conservation-efforts
  fetched: 2026-11-03
  quote: We've now reached a point where it's reliably detecting dugongs, turtles, dolphins, sharks and
    rays
