    to document the country's biodiversity on land.
  url: https://fastcompanyme.com/news/saudi-arabia-launches-expedition-to-build-nations-first-terrestrial-ecosystem-database/
  fetched: 2026-11-03
  quote: has launched the Decade Land Expedition for Terrestrial Ecosystem Exploration , a large-scale
    research initiative aimed at documenting the Kingdom's biodiversity on land.
- claim: The report says the expedition is to create a national database and interactive maps of recorded
    species and sites.
  url: https://fastcompanyme.com/news/saudi-arabia-launches-expedition-to-build-nations-first-terrestrial-ecosystem-database/
  fetched: 2026-11-03
