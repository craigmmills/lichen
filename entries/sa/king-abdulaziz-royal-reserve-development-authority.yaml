summary: A Saudi reserve authority which Al Riyadh Daily reported in February 2026 had deployed
  103 camera traps, producing the first confirmed golden jackal record in the reserve and
  central Saudi Arabia.
facts:
- claim: Al Riyadh Daily reported in February 2026 that the authority’s environmental monitoring
    programme had deployed 103 camera traps across the reserve in the Riyadh and Eastern regions.
  url: https://alriyadhdaily.com/article/320537a1ef4543cc9172a5ff8811cef5
  fetched: 2026-11-03
  quote: The authority stated that the monitoring was conducted as part of its environmental
    monitoring program using camera traps. A total of 103 cameras were deployed across diverse
    habitats within the reserve, covering both Riyadh and Eastern regions
- claim: The February 2026 report says the cameras made the first confirmed record of the
    golden jackal in the reserve and in central Saudi Arabia.
  url: https://alriyadhdaily.com/article/320537a1ef4543cc9172a5ff8811cef5
  fetched: 2026-11-03
  quote: This represents the first confirmed documentation of the species' presence within
    the King Abdulaziz Royal Reserve and, more broadly, in central Saudi Arabia.
