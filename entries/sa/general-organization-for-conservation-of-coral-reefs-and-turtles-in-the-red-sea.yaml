website: https://shams.gov.sa/
summary: A Saudi government body in Jeddah protecting Red Sea reefs and turtle nesting sites,
  issuing research permits and developing a reef baseline survey expected to take three years.
facts:
- claim: Says it was founded by Council of Ministers resolution 250 of 25/04/1443 AH.
  url: https://shams.gov.sa/
  fetched: 2026-11-03
  quote: was founded by the Saudi government under the Council of Ministers Resolution No.
    (250) on 04/25/1443 AH.
- claim: Says its mission is to coordinate, oversee and safeguard coral reefs and turtle nesting
    habitats in the Red Sea.
  url: https://shams.gov.sa/
  fetched: 2026-11-03
  quote: Our mission at SHAMS is to coordinate, oversee, and safeguard the coral reefs and
    turtle nesting habitats in the Red Sea
- claim: Says it works on baseline assessments and habitat maps of Saudi Red Sea reefs and
    on the status of sea turtle populations.
  url: https://shams.gov.sa/
  fetched: 2026-11-03
  quote: we are strategically working on a series of projects that focus on establishing baseline
    assessments and habitat maps to estimate the natural capital of Red Sea reefs in Saudi
    Arabia and assess the overall status of sea turtle populations.
- claim: Gives an address in Jeddah.
  url: https://shams.gov.sa/
  fetched: 2026-11-03
  quote: 3677 Saad Al-Ansari, 7817, Ash Shati District, Jeddah 23412, Saudi Arabia
- claim: Its 2024 Red Sea Outlook Report, presented at ICRI, is described as the first of
    its kind for Saudi Arabia's Red Sea, based on a review of published literature.
  url: https://icriforum.org/wp-content/uploads/2025/01/Mohammed_New-outlook-report-upd-with-comments.pdf
  fetched: 2026-11-03
  quote: This is the inaugural
- claim: Its home page lists news of a coral propagation and restoration project in Jeddah.
  url: https://shams.gov.sa/
  fetched: 2026-11-03
  quote: Coral Propagation and Restoration Project in Jeddah
- claim: A Saudi government conservation organisation with a mandate to protect, manage and
    sustain Red Sea coral reefs and marine turtle populations and their nesting sites.
  url: https://shams.gov.sa/about-us/
  fetched: '2026-11-03'
  quote: is a Saudi government conservation organization, founded in 1443 AH.
- claim: Manages the issuance of research permits for scientific activities on coral reefs
    and sea turtles, and permits for coral restoration and relocation.
  url: https://shams.gov.sa/permits/
  fetched: '2026-11-03'
  quote: we manage the issuance of research permits for all scientific activities related
    to coral reefs and sea turtles
- claim: Says it is developing and implementing a Red Sea-wide coral reef baseline survey
    in Saudi waters, expected to take three years.
  url: https://shams.gov.sa/coral-reefs-what-is-shams-doing/
  fetched: '2026-11-03'
  quote: SHAMS is developing and implementing an extensive, Red Sea-wide coral reef baseline
    survey within the KSA
- claim: Says it will produce habitat maps of Saudi coral reef ecosystems.
  url: https://shams.gov.sa/coral-reefs-what-is-shams-doing/
  fetched: '2026-11-03'
  quote: SHAMS will produce accurate habitat maps for the Kingdom of Saudi Arabia coral reef
    ecosystems.
- claim: In October 2026, SHAMS described its coral nurseries in Jeddah, with monthly monitoring
    visits and weekly checks of survival, health, disease and predators.
  url: https://shams.gov.sa/news/
  fetched: '2026-11-03'
  quote: The colonies also undergo weekly checks to assess survival rates, health, diseases,
    and predators, while growth is measured every three months.
- claim: In October 2026, SHAMS said it was developing a national system to monitor marine
    turtles in the Red Sea and respond to cases needing intervention.
  url: https://shams.gov.sa/news/
  fetched: '2026-11-03'
  quote: The Organization is developing a national system to monitor marine turtles and respond
    to cases requiring intervention in the Red Sea.
- claim: Its 2023 memorandum of understanding with King Khalid University lists collaboration
    on developing AI technologies for environmental conservation among its terms.
  url: https://shams.gov.sa/news/
  fetched: '2026-11-03'
  quote: 'Environmental AI Technology Development: Collaboration on developing AI technologies
    for environmental conservation.'
- claim: Hosts the secretariat of the International Coral Reef Initiative, which Saudi Arabia
    chairs.
  url: https://icriforum.org/meet-the-secretariat/
  fetched: '2026-11-03'
  quote: is currently the Host Secretariat of ICRI.
