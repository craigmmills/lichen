summary: NEOM programme launched in 2021 to document local vegetation; in December 2024 NEOM said it had
  documented 345 plant species, including 28 rare and eight not previously recorded in the Kingdom.
facts:
- claim: Launched in 2021 as one of NEOM's key initiatives to document and conserve the region's natural
    heritage and improve knowledge of local vegetation.
  url: https://www.neom.com/en-us/newsroom/mewa-and-neom-discover-eight-new-native-plant-species
  fetched: '2026-11-03'
  quote: Launched in 2021, the ‘Flora Program’ is one of NEOM's key initiatives to document and conserve
    the region's natural heritage.
- claim: In December 2024, NEOM said the programme had documented 345 local plant species, 28 rare species
    and eight species not previously recorded in the Kingdom.
  url: https://www.neom.com/en-us/newsroom/mewa-and-neom-discover-eight-new-native-plant-species
  fetched: '2026-11-03'
  quote: including documenting 345 local plant species, 28 rare species and eight new registered plant
    species not previously recorded in the Kingdom.
- claim: In the December 2024 release, MEWA said the new plant species had been documented at the National
    Herbarium in Riyadh.
  url: https://www.neom.com/en-us/newsroom/mewa-and-neom-discover-eight-new-native-plant-species
  fetched: '2026-11-03'
  quote: The new plant species have been documented at the National Herbarium within Seed Center and Plant
    Genetic Resources Bank in Riyadh.
