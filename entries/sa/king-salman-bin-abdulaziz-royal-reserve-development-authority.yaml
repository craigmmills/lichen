summary: Saudi reserve authority that Ajel reports received an IUCN technological innovation
  certificate and, with stc through Huawei's Tech4Nature, introduced AI-based smart camera
  monitoring of wildlife.
facts:
- claim: Ajel reports the reserve received IUCN's Technological Innovation Certificate, the
    first nature reserve in the Middle East and West Asia to do so.
  url: https://english.ajel.sa/business/king-salman-reserve-authority-awarded-iucn-certificate-for-technological-innovation
  fetched: 2026-11-03
  quote: The King Salman bin Abdulaziz Royal Reserve has been awarded the Technological Innovation
    Certificate by the International Union for Conservation of Nature (IUCN), becoming the
    first nature reserve in the Middle East and West Asia to receive this recognition.
- claim: Ajel reports that a collaboration with stc through Huawei's Tech4Nature initiative
    introduced a smart monitoring system based on AI.
  url: https://english.ajel.sa/business/king-salman-reserve-authority-awarded-iucn-certificate-for-technological-innovation
  fetched: 2026-11-03
  quote: This achievement is the result of a strategic collaboration between the reserve and
    stc, through Huawei's Tech4Nature initiative, which introduced a smart monitoring system
    based on AI and advanced communications technologies.
- claim: Ajel reports the system monitors wildlife through smart cameras with real-time observation
    and data analysis.
  url: https://english.ajel.sa/business/king-salman-reserve-authority-awarded-iucn-certificate-for-technological-innovation
  fetched: 2026-11-03
  quote: This innovative technology enables highly accurate wildlife monitoring through smart
    cameras that provide real-time observation, data analysis, and continuous 24/7 biodiversity
    tracking.
- claim: KSA.com reports that the authority enforces a hunting ban in all areas under its
    jurisdiction.
  url: https://www.ksa.com/ksa-news/king-salman-royal-reserve-hunting-ban/
  fetched: 2026-11-03
  quote: The King Salman bin Abdulaziz Royal Reserve Development Authority has reaffirmed
    that hunting is strictly prohibited within all areas under its jurisdiction
- claim: KSA.com reports that its monitoring teams use drones, camera traps and satellite
    imagery for surveillance.
  url: https://www.ksa.com/ksa-news/king-salman-royal-reserve-hunting-ban/
  fetched: 2026-11-03
  quote: Monitoring teams use advanced technologies such as drones, camera traps, and satellite
    imagery to conduct surveillance and detect illegal hunting activities across the vast
    reserve.
