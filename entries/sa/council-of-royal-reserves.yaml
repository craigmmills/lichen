summary: Body set up by royal decree to set strategic directions for the royal reserves
  and resettle wildlife; it approved 2030 goals in August 2023, covering seven reserves
  that Saudipedia reports as 13.5 percent of the Kingdom's area.
facts:
- claim: Established by royal decree to set the strategic directions of the royal
    reserves, preserve their environmental components and resettle wildlife, with
    a development authority for each reserve to carry out the plans.
  url: https://saudipedia.com/en/council-of-royal-reserves
  fetched: 2026-11-17
  quote: The council was established by royal decree to identify the strategic directions
    of the royal reserve ecosystem, preserve its environmental and natural components,
    resettle wildlife therein
- claim: The council approved strategic goals for the royal reserves for 2030 in August
    2023. Saudipedia reports that the seven reserves covered by those goals accounted
    for 13.5 percent of the Kingdom's area.
  url: https://saudipedia.com/en/council-of-royal-reserves
  fetched: 2026-11-17
  quote: The seven royal reserves constitute 13.5 percent of the total area of the
    Kingdom
- claim: An August 2024 news report said eight royal reserves had been established
    by royal decree and were overseen by the Royal Reserves Council, chaired by the
    Crown Prince.
  url: https://english.aawsat.com/gulf/5048722-prince-mohammed-bin-salman-royal-reserve-development-authority-board-announces-launch
  fetched: 2026-11-17
  quote: one of eight Royal Reserves established by Royal Decree and overseen by the
    Royal Reserves Council chaired by the Crown Prince
