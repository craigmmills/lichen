facts:
- claim: The conversion of al-Thumamah Wildlife Park into a royal reserve was approved
    on 2 October 2019. Saudipedia lists Prince Turki bin Mohammed bin Fahd as chair
    of the reserve's board.
  url: https://saudipedia.com/en/king-khalid-royal-reserve
  fetched: 2026-11-17
  quote: On October 2, 2019, the approval was issued to transform the park into a
    Royal reserve.
- claim: The reserve spans about 720 km2 and is overseen by the Council of Royal Reserves.
  url: https://saudipedia.com/en/king-khalid-royal-reserve
  fetched: 2026-11-17
  quote: The King Khalid Royal Reserve spans an area of approximately 720 km and is
    overseen by the Council of Royal Reserves
- claim: The reserve includes the King Khalid Wildlife Research Center. Saudipedia
    reports that biodiversity at the reserve has thrived under more than two decades
    of protection.
  url: https://saudipedia.com/en/king-khalid-royal-reserve
  fetched: 2026-11-17
  quote: Biodiversity and ecodiversity have been thriving at the reserve, thanks to
    more than two decades of protection.
