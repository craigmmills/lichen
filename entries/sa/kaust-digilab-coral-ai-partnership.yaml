summary: Announced in July 2025, this KAUST–digiLab coral AI partnership envisaged two years
  of integration and a 22-petabyte digital twin to be managed by digiLab’s chatReef.
facts:
- claim: In July 2025, KAUST said it was partnering with digiLab to develop AI for coral conservation
    within KCRI, with integration expected to take two years.
  url: https://www.kaust.edu.sa/en/news/adoption-of-ai-to-accelerate-world%27s-largest-coral-restoration-project
  fetched: '2026-11-03'
  quote: The integration, which is expected to take two years and is supported by KCRI's Dr.
    Liz Goergen and led by digiLab co-founder Dr. Anhad Sandhu
- claim: In July 2025, KAUST said digiLab's technology would assist with computer vision,
    cutting monitoring time from two months to two weeks, and with sensor placement.
  url: https://www.kaust.edu.sa/en/news/adoption-of-ai-to-accelerate-world%27s-largest-coral-restoration-project
  fetched: '2026-11-03'
  quote: Specifically, digiLab's technology will assist with computer vision, significantly
    reducing the monitoring time from two months to two weeks
- claim: In July 2025, KAUST said a 22-petabyte digital twin managed by digiLab's chatReef
    platform would let its researchers monitor the ecosystem.
  url: https://www.kaust.edu.sa/en/news/adoption-of-ai-to-accelerate-world%27s-largest-coral-restoration-project
  fetched: '2026-11-03'
  quote: a massive 22-petabyte digital twin, managed by digiLab's chatReef platform, will
    enable KAUST researchers to easily monitor the ecosystem
  ai_type: digital-twins
- claim: In July 2025, digiLab said its AI tools were already enhancing the capabilities of
    environmental sensors across the reefscape.
  url: https://www.digilab.ai/news/digilab-developing-world-first-ai-for-planets-largest-coral-reef-restoration-programme
  fetched: '2026-11-03'
  quote: By deploying the AI tools, digiLab is already enhancing the capabilities of environmental
    sensors across the reefscape.
- claim: In July 2025, digiLab said it was developing a computer vision analysis pipeline
    for more efficient video monitoring of corals.
  url: https://www.digilab.ai/news/digilab-developing-world-first-ai-for-planets-largest-coral-reef-restoration-programme
  fetched: '2026-11-03'
  quote: digiLab is assisting KAUST with computer vision by developing an analysis pipeline
    to enable more efficient video monitoring.
- claim: In July 2025, digiLab said it was integrating its agentic LLM platform into chatReef
    to search structured and unstructured data within the reefscape's digital twin.
  url: https://www.digilab.ai/news/digilab-developing-world-first-ai-for-planets-largest-coral-reef-restoration-programme
  fetched: '2026-11-03'
  quote: digiLab is integrating its agentic LLM platform to interact with the vast unstructured
    and structured data within the digital twin.
  ai_type: agentic-ai
- claim: The same passage names chatReef's platform as an LLM platform.
  url: https://www.digilab.ai/news/digilab-developing-world-first-ai-for-planets-largest-coral-reef-restoration-programme
  fetched: '2026-11-03'
  quote: digiLab is integrating its agentic LLM platform to interact with the vast unstructured
    and structured data within the digital twin.
  ai_type: large-language-models
