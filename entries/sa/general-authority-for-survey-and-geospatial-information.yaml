facts:
- claim: Says its regulations task it with regulating the surveying, geospatial information
    and imaging sector in Saudi Arabia.
  url: https://www.geosa.gov.sa/en/About/Pages/AboutUS.aspx
  fetched: 2026-11-03
  quote: assigning it responsibility for regulating the surveying and geospatial information
    sector and related imaging activities in the Kingdom.
- claim: Says it grew out of the Central Department of Survey at the Ministry of Defense,
    later the General Commission for Survey.
  url: https://www.geosa.gov.sa/en/About/Pages/AboutUS.aspx
  fetched: 2026-11-03
  quote: Approval was granted to transform the Central Department of Survey at the Ministry
    of Defense into an authority named the General Authority for Survey
- claim: Aims to regulate, develop and oversee surveying, geospatial information and related
    imaging in Saudi Arabia, excluding Ministry of Defense activities.
  url: https://www.geosa.gov.sa/
  fetched: 2026-11-03
  quote: GEOSA aims to regulate, develop, oversee and monitor the surveying, geospatial information
    and related imaging sector in the Kingdom
- claim: Provides open geospatial data for reuse.
  url: https://www.geosa.gov.sa/
  fetched: 2026-11-03
  quote: The General Authority for Survey and Geospatial Information provides open geospatial
    data so beneficiaries can access, use and reuse it in accordance with the approved publication
    policy.
