summary: A Saudi reserve authority set up by royal order in 2018, which International Business
  Magazine reported in June 2023 launched a drone monitoring project using more than 40 drones
  within a digital system including AI.
facts:
- claim: International Business Magazine reported in June 2023 that the authority launched
    a project using more than 40 drones for monitoring and protection.
  url: https://intlbm.com/2023/06/15/itba-to-use-40-drones-to-monitor-project-in-line-with-saudi-vision-2030/
  fetched: 2026-11-03
  quote: the reserve's Development Authority has launched a new project to use more than 40
    drones for monitoring and protection purposes in line with the goals of Saudi Vision 2030.
- claim: The report says the drone project is part of the reserve's digital system, which
    incorporates artificial intelligence and IoT.
  url: https://intlbm.com/2023/06/15/itba-to-use-40-drones-to-monitor-project-in-line-with-saudi-vision-2030/
  fetched: 2026-11-03
  quote: It is also part of the reserve's digital system at large, as it incorporates artificial
    intelligence, IoT, and other applications
- claim: The reserve's development authority was set up by royal order in 2018 to protect
    its biodiversity and heritage.
  url: https://itba.gov.sa/
  fetched: 2026-11-03
  quote: انطلقت في عام 2018م، وبأمر ملكي كريم، مسيرة محمية الإمام تركي بن عبدالله الملكية
    عبر هيئة تطوير متخصصة، لتصون تنوعها الحيوي
- claim: KSA.com reports that the reserve uses more than 40 drones, IoT devices, AI software
    and data science tools to monitor and protect the environment.
  url: https://www.ksa.com/science/imam-turki-bin-abdullah-royal-reserve-world-ranger-day/
  fetched: 2026-11-03
  quote: The reserve uses more than 40 drones, Internet of Things (IoT) devices, artificial
    intelligence (AI) software, and data science tools to monitor and protect the environment.
- claim: KSA.com reports that the authority has trained over 100 rangers and staff in environmental
    protection and monitoring.
  url: https://www.ksa.com/science/imam-turki-bin-abdullah-royal-reserve-world-ranger-day/
  fetched: 2026-11-03
  quote: The authority trained over 100 rangers and staff members, accumulating more than
    8,000 hours of instruction in environmental protection and monitoring.
