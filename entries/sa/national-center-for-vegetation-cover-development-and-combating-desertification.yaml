summary: Saudi centre established by Council of Ministers decision 417 to oversee grazing
  lands, forests and national parks and combat desertification; it built a vegetation monitoring
  programme and partners with KAUST.
facts:
- claim: Says it was established by Council of Ministers decision 417 to oversee grazing lands,
    forests and national parks and to combat desertification.
  url: https://ncvc.gov.sa/en/AboutCenter/Overview/Pages/default.aspx
  fetched: 2026-11-03
  quote: The establishment of the center aims to oversee the management and investment of
    grazing lands, forests, national parks, and to preserve the plant genetic resources and
    vegetative cover outside the protected areas in the Kingdom in all its environments, as
    well as combating desertification.
- claim: Lists sustainable management of grazing lands and national parks among its responsibilities.
  url: https://ncvc.gov.sa/en/AboutCenter/Overview/Pages/default.aspx
  fetched: 2026-11-03
  quote: Sustainable management of grazing lands and national parks
- claim: Saudi Gazette reported in August 2023 that a programme to monitor vegetation cover
    with remote sensing and AI was launched by the minister who chairs its board.
  url: https://saudigazette.com.sa/article/634956
  fetched: 2026-11-03
  quote: has launched a program to monitor, evaluate and study the vegetation cover areas
    using remote sensing techniques and artificial intelligence.
- claim: Ajel reports a planned NCVC assessment of degraded vegetation sites in Riyadh and
    the Eastern Province using remote sensing and GIS.
  url: https://english.ajel.sa/news/saudi-arabia/ncvc-launches-project-to-assess-degraded-vegetation-cover-sites-in-eastern-central-saudi-arabia
  fetched: 2026-11-03
  quote: As part of the project, the NCVC will carry out a thorough assessment using remote
    sensing and geographic information systems (GIS) to determine the extent of degradation.
- claim: Established by Council of Ministers decision to oversee the management and investment
    of grazing lands, forests and national parks and to combat desertification.
  url: https://ncvc.gov.sa/en/AboutCenter/Overview/Pages/default.aspx
  fetched: '2026-11-03'
  quote: The establishment of the center aims to oversee the management and investment of
    grazing lands, forests, national parks
- claim: Lists protecting and developing forests among its seven main responsibilities.
  url: https://ncvc.gov.sa/en/AboutCenter/Overview/Pages/default.aspx
  fetched: '2026-11-03'
  quote: Protecting and developing forests and ensuring their sustainability
- claim: Says it collaborated with KAUST on analysing the genomes of 15 native plant species
    used in afforestation.
  url: https://ncvc.gov.sa/en/AboutCenter/Departments/Dept8/Pages/default.aspx
  fetched: '2026-11-03'
  quote: focusing on the analysis and characterization of the genomes of 15 native plant species
    of environmental significance
- claim: Says it is establishing a long-term partnership with KAUST by creating a research
    and environmental monitoring station.
  url: https://ncvc.gov.sa/en/AboutCenter/Departments/Dept8/Pages/default.aspx
  fetched: '2026-11-03'
  quote: Establishing a long-term partnership with King Abdullah University of Science and
    Technology (KAUST) by creating a research and environmental monitoring station.
- claim: Its Arabic home page offers an interactive map of national parks, forests and rangelands
    across the regions of the Kingdom.
  url: https://ncvc.gov.sa/en/Pages/default.aspx
  fetched: '2026-11-03'
  quote: الخريطة التفاعلية، بما يشمل المنتزهات الوطنية، والغابات،
- claim: Established by Council of Ministers decision 417 to oversee grazing lands, forests
    and national parks and to combat desertification.
  url: https://ncvc.gov.sa/en/AboutCenter/Overview/Pages/default.aspx
  fetched: 2026-11-03
  quote: The Council of Ministers issued decision number 417 on 19/07/1440H to establish the
    center. The establishment of the center aims to oversee the management and investment
    of grazing lands, forests, national parks
- claim: Says it develops, protects and monitors vegetation sites across the Kingdom.
  url: https://ncvc.gov.sa/en/MediaCenter/news/Pages/News-05112023.aspx
  fetched: 2026-11-03
  quote: The NCVC is dedicated to developing, protecting, and monitoring vegetation sites
    across the Kingdom.
