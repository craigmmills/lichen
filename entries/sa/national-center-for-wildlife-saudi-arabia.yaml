summary: Saudi wildlife body set up in 2019, replacing the Saudi Wildlife Authority, with
  a KAUST memorandum of understanding; Makkah Newspaper reports it used GIS, drones and AI
  to map baboon hotspots.
facts:
- claim: Saudipedia describes it as the body responsible for conserving wildlife and biodiversity
    in Saudi Arabia's terrestrial and marine environments, and for planning, proposing and
    managing protected areas.
  url: https://saudipedia.com/en/article/469/government-and-politics/centers/national-center-for-wildlife
  fetched: 2026-11-03
  quote: It is also involved in planning and proposing terrestrial and marine protected areas,
    as well as managing them sustainably, and managing endangered animal breeding centers
    and their relocation.
- claim: Saudipedia says it was set up in 2019 by the Council of Ministers, replacing the
    Saudi Wildlife Authority.
  url: https://saudipedia.com/en/article/469/government-and-politics/centers/national-center-for-wildlife
  fetched: 2026-11-03
  quote: In 2019, the Council of Ministers issued a decision to dissolve the authority and
    establish the National Center for Wildlife.
- claim: Saudipedia says it is headquartered in Riyadh, with a board chaired by the Minister
    of Environment, Water and Agriculture.
  url: https://saudipedia.com/en/article/469/government-and-politics/centers/national-center-for-wildlife
  fetched: 2026-11-03
  quote: The center is headquartered in the capital, Riyadh, and has a board of directors
    chaired by the Minister of Environment, Water, and Agriculture.
- claim: Saudipedia says it monitors the country's biodiversity across seven groups.
  url: https://saudipedia.com/en/article/469/government-and-politics/centers/national-center-for-wildlife
  fetched: 2026-11-03
  quote: The biodiversity in the Kingdom is monitored by the National Center for Wildlife
    and includes seven categories
- claim: KAUST says it signed a memorandum of understanding with KAUST at COP16 in Riyadh
    covering research, databases and ecosystem monitoring programmes.
  url: https://www.kaust.edu.sa/news/kaust-and-national-center-for-wildlife-join-forces-to-protect-saudi-biodiversity
  fetched: 2026-11-03
  quote: Additionally, it specifies the establishment of monitoring programs designed to assess
    the health of ecosystems by international standards.
- claim: OceanX says more than 20 scientists from NCW and KAUST joined its 2022 Red Sea expedition
    and worked on metagenomics sequencing, benthic assemblages, acoustic mapping and megafauna
    survey methods.
  url: https://www.oceanx.org/missions/red-sea-2022
  fetched: '2026-11-03'
  quote: More than 20 local scientists from NCW and KAUST joined the expedition.
- claim: NEOM says Arabian oryx, ibex, ostriches, sooty falcons and other native species have
    returned to NEOM in partnership with the National Center for Wildlife.
  url: https://www.neom.com/en-us/about/nature
  fetched: '2026-11-03'
  quote: In partnership with the National Center for Wildlife, Arabian oryx, ibex, ostriches,
    sooty falcons and other native species have now returned to NEOM.
- claim: A KAUST research chair's site lists a 2023 visit to NCW reserves in Taif.
  url: https://tajrc.kaust.edu.sa/
  fetched: '2026-11-03'
  quote: Visiting NCW Reserves in Taif 2023
- claim: Has a representative on the SHAMS board of directors.
  url: https://shams.gov.sa/board-of-directors/
  fetched: '2026-11-03'
  quote: NCW Representative
- claim: The CBD lists the director of the centre's Department of Protected Areas Planning
    as Saudi Arabia's protected areas focal point.
  url: https://www.cbd.int/countries/nfp/default.shtml?country=sa&details=true
  fetched: 2026-11-03
  quote: Department of Protected Areas Planning National Center for Wildlife
- claim: Makkah Newspaper reports that the centre used GIS, drones and AI to map 500 hotspots
    holding 41,000 habituated baboons.
  url: https://makkahnewspaper.com/article/1605514/%D8%A7%D9%84%D8%A8%D9%84%D8%AF/%D8%B0%D9%83%D8%A7%D8%A1-%D8%A7%D8%B5%D8%B7%D9%86%D8%A7%D8%B9%D9%8A-%D9%88%D8%B7%D8%A7%D8%A6%D8%B1%D8%A7%D8%AA-%D8%AF%D8%B1%D9%88%D9%86-%D9%84%D8%B1%D8%B5%D8%AF-%D8%A8%D8%A4%D8%B1-%D9%82%D8%B1%D9%88%D8%AF-%D8%A7%D9%84%D8%A8%D8%A7%D8%A8%D9%88%D9%86
  fetched: 2026-11-03
  quote: استخدم المركز الوطني لتنمية الحياة الفطرية التكنولوجيا الحديثة كنظم المعلومات الجغرافية
    وطائرات الدرون والذكاء الاصطناعي، لرصد 500 بؤرة
- claim: The Convention on Biological Diversity lists the director of the centre's Department
    of Protected Areas Planning, in Riyadh, as Saudi Arabia's protected areas national focal
    point.
  url: https://www.cbd.int/countries/nfp?country=sa
  fetched: '2026-11-03'
  quote: Director Department of Protected Areas Planning National Center for Wildlife P.O.
    Box 61681 Riyadh 11575 Saudi Arabia Protected Areas NFP
