summary: A KAUST-run project, part of its Coral Restoration Initiative, to restore about 100
  hectares of reef around Shushah Island by 2040, with plans to incorporate data and AI into
  a working model.
facts:
- claim: KAUST says the project will preserve and enhance about 100 hectares of reef around
    Shushah Island, about 20 km off NEOM.
  url: https://www.kaust.edu.sa/news/kaust-reefscape-restoration-initiative-at-shushah-island
  fetched: 2026-11-03
  quote: The KAUST Reefscape Restoration Initiative at Shushah Island will preserve and enhance
    ~100 hectares of reefscape around Shushah Island, located approximately 20 km offshore
    NEOM in the Red Sea.
- claim: KAUST says the project will use new approaches to robotics and 3D adaptive manufacturing.
  url: https://www.kaust.edu.sa/news/kaust-reefscape-restoration-initiative-at-shushah-island
  fetched: 2026-11-03
  quote: they will innovate project delivery with new approaches to robotics and 3D adaptive
    manufacturing
- claim: The KAUST director overseeing it said the team wants to incorporate data and AI into
    a working model.
  url: https://www.kaust.edu.sa/news/kaust-reefscape-restoration-initiative-at-shushah-island
  fetched: 2026-11-03
  quote: modern innovative approaches and the incorporation of data and AI in establishing
    a working model that will last into the future.
- claim: KAUST now describes it as the Reefscape Project of the KAUST Coral Restoration Initiative,
    covering 100 hectares next to Shushah Island, to be restored by 2040.
  url: https://www.kaust.edu.sa/en/innovate/kcri
  fetched: 2026-11-03
  quote: KCRI's Reefscape Project is an ambitious restoration effort covering 100 hectares
    of coral reef adjacent to Shushah Island.
