summary: An expedition run by OceanX with NCW and KAUST researchers, which OceanX says mapped mesophotic
  and deep-sea reefs, established a biodiversity baseline and contributed seafloor maps.
facts:
- claim: OceanX says scientists aboard mapped mesophotic and deep-sea coral reefs and collected biodiversity
    inventory through aerial surveys, eDNA samples and ROV specimens, establishing a biodiversity baseline.
  url: https://www.oceanx.org/missions/red-sea-2022
  fetched: '2026-11-03'
  quote: Scientists aboard also mapped both mesophotic and deep-sea coral reefs, collecting biodiversity
    inventory via aerial surveys, eDNA samples, and sampling of specimens collected by ROV dives.
- claim: More than 20 local scientists from NCW and KAUST joined, working on metagenomics sequencing,
    benthic assemblages, acoustic mapping and megafauna surveys; King Abdulaziz University provided the
    R/V Al Azzizi.
  url: https://www.oceanx.org/missions/red-sea-2022
  fetched: '2026-11-03'
  quote: More than 20 local scientists from NCW and KAUST joined the expedition.
- claim: OceanX says the expedition contributed high-resolution seafloor maps.
  url: https://www.oceanx.org/missions/red-sea-2022
  fetched: '2026-11-03'
  quote: The Red Sea Decade expedition contributed high-resolution seafloor maps that will inform scientific
    understanding and ocean management for decades to come.
