summary: An active programme, run by the National Center for Vegetation Cover Development
  and Combating Desertification, inviting the public to photograph biodiversity at
  vegetation sites to help find species and monitor plant health.
facts:
- claim: Invites the public to photograph and document plants, insects, birds and
    other biodiversity at vegetation sites.
  url: https://ncvc.gov.sa/en/CitizenScience/Pages/default.aspx
  fetched: 2026-11-09
  quote: This program invites you to capture and document photos of plants, insects,
    birds, and other biodiversity within our rich vegetation sites.
- claim: The records are meant to help find new or lost plant species, monitor plant
    health and gather information on plant diversity.
  url: https://ncvc.gov.sa/en/CitizenScience/Pages/default.aspx
  fetched: 2026-11-09
  quote: Your findings could help researchers and environmental scientists uncover
    new or lost plant species, monitor plant health
