facts:
- claim: Says it is the national entity responsible for leading and sustaining the environment,
    water and agriculture sectors in Saudi Arabia.
  url: https://www.mewa.gov.sa/en/Ministry/AboutMinistry/Pages/AboutUs.aspx
  fetched: 2026-11-03
  quote: The Ministry of Environment, Water and Agriculture (MEWA) is the national entity
    responsible for leading and sustaining the three vital sectors in the Kingdom of Saudi
    Arabia.
- claim: Formed in 2016 by a royal order merging the sectors under its current name.
  url: https://www.mewa.gov.sa/en/Ministry/AboutMinistry/Pages/AboutUs.aspx
  fetched: 2026-11-03
  quote: Issuance of Royal Order No. (133/A) merging the sectors under the name (Ministry
    of Environment, Water and Agriculture).
- claim: Saudi Gazette reported in August 2023 that the minister, who chairs the vegetation
    cover centre's board, launched a programme to monitor vegetation cover with remote sensing
    and artificial intelligence.
  url: https://saudigazette.com.sa/article/634956
  fetched: 2026-11-03
  quote: who is also the Chairman of the Board of Directors of the National Center for Vegetation
    Development and Combating Desertification (NCVC), has launched a program to monitor, evaluate
    and study the vegetation cover areas using remote sensing techniques and artificial intelligence.
- claim: Lists preserving the environment and natural resources among its objectives.
  url: https://www.mewa.gov.sa/en/Ministry/AboutMinistry/Pages/AboutUs.aspx
  fetched: '2026-11-03'
  quote: Preserving the environment and natural resources, and ensuring their sustainable
    development.
- claim: The CBD lists Saudi Arabia's primary CBD focal point at the ministry.
  url: https://www.cbd.int/countries/nfp/default.shtml?country=sa&details=true
  fetched: 2026-11-03
  quote: Ministry of Environment, Water and Agriculture Riyadh Saudi Arabia CBD Primary NFP,
    CHM NFP, SBSTTA NFP
- claim: Its AI Center of Excellence works with generative AI, machine learning and computer
    vision, among other methods.
  url: https://www.mewa.gov.sa/en/Ministry/AIEWA/Pages/default.aspx
  fetched: 2026-11-03
  quote: technologies, including generative AI, machine learning, computer vision, and predictive
    and geospatial analytics
  ai_type: generative-ai
