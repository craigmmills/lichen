summary: A body that says it manages the Sharaan reserve with rangers, partners with IUCN
  and Panthera, and uses EarthRanger, which Design Middle East reports covers 12,160 square
  kilometres.
facts:
- claim: Says it manages the Sharaan reserve with a team of trained rangers, reintroducing
    native species and restricting hunting and camel grazing.
  url: https://rcu.gov.sa/en/strategic-initiatives/sharaan-nature-reserve
  fetched: 2026-11-03
  quote: By reintroducing indigenous species and enforcing restrictions on hunting and camel
    grazing, our team of trained rangers ensures the reserve is managed to global standards
- claim: Says it partners with IUCN to restore and monitor AlUla's nature reserves.
  url: https://rcu.gov.sa/en/strategic-initiatives/sharaan-nature-reserve
  fetched: 2026-11-03
  quote: RCU partners with the International Union for Conservation of Nature (IUCN) on its
    efforts to restore and monitor AlUla's nature reserves, including Sharaan.
- claim: Panthera says the commission committed $20 million to leopard conservation over the
    decade following their 2019 partnership agreement.
  url: https://panthera.org/arabian-leopard-initiatives
  fetched: 2026-11-03
  quote: The RCU has committed $20 million to leopard conservation in the Kingdom of Saudi
    Arabia and around the world over the next decade.
