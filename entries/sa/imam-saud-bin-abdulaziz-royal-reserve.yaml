summary: Royal reserve created by a 2018 decree from the Mahazat as-Sayd Protected
  Area, about 180 km from Taif, overseen by the Council of Royal Reserves, where Arabian
  oryx and other species have been released since 1990.
facts:
- claim: A 2018 royal decree turned the Mahazat as-Sayd Protected Area into the royal
    reserve, about 180 km from Taif.
  url: https://saudipedia.com/en/imam-saud-bin-abdulaziz-royal-reserve
  fetched: 2026-11-17
  quote: In 2018, a Royal Decree was issued to transform the Mahazat as-Sayd Protected
    Area into a Royal Reserve under the name of Imam Saud Bin Abdulaziz Royal Reserve
- claim: The reserve is overseen by the Council of Royal Reserves.
  url: https://saudipedia.com/en/imam-saud-bin-abdulaziz-royal-reserve
  fetched: 2026-11-17
  quote: It is overseen by the Council of Royal Reserves, chaired by the Crown Prince
    and Prime Minister
- claim: A resettlement programme released Arabian oryx and other species at the reserve
    from 1990.
  url: https://saudipedia.com/en/imam-saud-bin-abdulaziz-royal-reserve
  fetched: 2026-11-17
  quote: In 1990, the resettlement program released seventeen Arabian oryx at the
    reserve
- claim: Saudipedia says each royal reserve is governed by a board of directors with
    legal personality and financial and administrative independence, and lists this
    reserve as chaired by Prince Abdullah bin Bandar bin Abdulaziz Al Saud.
  url: https://saudipedia.com/en/list-of-royal-reserves-in-saudi-arabia
  fetched: 2026-11-17
  quote: Each reserve is governed by a board of directors with legal personality and
    financial and administrative independence.
