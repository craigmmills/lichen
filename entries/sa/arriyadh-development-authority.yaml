summary: Saudi public body that directed the 2001 Wadi Hanifah restoration plan near
  Riyadh, acting as the High Commission's executive arm, with native plants grown
  from locally collected cuttings and seeds installed along the wadi bed.
facts:
- claim: Directed the 2001 Wadi Hanifah plan to restore the wadi corridor, within
    a natural basin of 1,737 square miles around Riyadh.
  url: https://landscapeperformance.org/case-study-briefs/wadi-hanifah
  fetched: 2026-11-17
  quote: Under the direction of the Arriyadh Development Authority, the 2001 Wadi
    Hanifah Comprehensive Development Plan established a strategy for the environmental
    restoration of the wadi corridor
- claim: The authority and its contractors grew native trees, shrubs and grasses from
    locally collected cuttings and seeds. The plants were installed along the wadi
    bed.
  url: https://landscapeperformance.org/case-study-briefs/wadi-hanifah
  fetched: 2026-11-17
  quote: the Arriyadh Development Authority and its contractors collected cuttings
    and seeds from the least damaged portions of the wadi and began the process of
    growing thousands of trees, shrubs and grasses
- claim: During the Wadi Hanifah restoration, the authority served as the High Commission's
    executive, technical and administrative branch, with legal authority over infrastructure
    projects in Riyadh.
  url: https://landscapeperformance.org/case-study-briefs/wadi-hanifah
  fetched: 2026-11-17
  quote: The Arriyadh Development Authority (ADA) is the High Commission’s executive,
    technical, and administrative branch and has legal authority to control, coordinate,
    and implement infrastructural projects in Riyadh.
