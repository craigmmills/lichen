  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: Over a 24-month period, 3928 images captured 685 positive detections of 13 different
    mammal species.
