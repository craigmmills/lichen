summary: Reserve of about 24,500 square kilometres in north-west Saudi Arabia that reported
  over 100 trail cameras in February 2025, with camera trap data used with Special Forces
  for Environmental Security against poaching.
facts:
- claim: Says the reserve covers about 24,500 square kilometres in north-west Saudi Arabia,
    including mountains, sand plains and Red Sea mangroves.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: In north west Saudi Arabia, Prince Mohammed bin Salman Royal Reserve covers about
    24,500 square kilometers, the area of a small country.
- claim: In February 2025, the reserve said more than 100 trail cameras had been set up across
    its ecosystems.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: So far, over 100 high-definition trail cameras have been set up in various ecosystems
    within the Reserve.
- claim: Says its camera trap programme made the first confirmed record of the golden jackal
    in north-western Saudi Arabia in 2021.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: 'In 2021, the camera trap program led to an important discovery: the first confirmed
    sighting of the Golden Jackal ( Canis aureus ) in northwestern Saudi Arabia.'
- claim: Says camera trap data are used with the Special Forces for Environmental Security
    to detect poaching and unauthorised entry.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: Working with the Special Forces for Environmental Security (SFES), the data collected
    has become a key tool for compliance in the Reserve.
- claim: Its newest news items listed on the page cover wildlife breeding at a solar park
    and griffon vultures released from the reserve.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
  fetched: 2026-11-03
  quote: Rehabilitated Griffon Vultures Settle in Armenia and Iraq After Crossing Eight Countries,
    Three Years After Release from Prince Mohammed bin Salman Royal Reserve
- claim: Covers about 24,500 square kilometres in north-west Saudi Arabia.
  url: https://pmbsrr.gov.sa/unseen-guardians-how-camera-traps-unveil-the-secrets-of-prince-mohammed-bin-salman-royal-reserve/
