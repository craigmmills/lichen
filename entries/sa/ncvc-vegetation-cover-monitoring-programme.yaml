summary: Programme built by the vegetation cover centre, launched, Saudi Gazette reported in August 2023,
  to monitor vegetation with remote sensing and AI; Ajel reports it covers over 99,000 square kilometres.
facts:
- claim: Saudi Gazette reported in August 2023 that the programme was launched to monitor and study vegetation
    cover with remote sensing and AI, supporting afforestation and the Saudi Green Initiative.
  url: https://saudigazette.com.sa/article/634956
  fetched: 2026-11-03
  quote: The program will also contribute in achieving the goals of the afforestation projects and the
    Saudi Green Initiative.
- claim: The centre's chief executive said the techniques are used to follow mangrove forests along the
    coasts.
  url: https://saudigazette.com.sa/article/634956
  fetched: 2026-11-03
  quote: He stated that the AI and the remote sensing techniques contribute in monitoring and following
    up the mangrove forests extending along the coasts of Saudi Arabia.
- claim: Ajel reports the programme covers more than 99,000 square kilometres of vegetation cover.
  url: https://ajel.sa/local/83rznw8pnx
  fetched: 2026-11-03
  quote: برنامج تقنيات الاستشعار عن بعد والذكاء الاصطناعي لدراسة واقع مناطق الغطاء النباتي على مساحة تتجاوز
    99 ألف كم2
- claim: Launched in August 2023 by the minister, who chaired NCVC's board, to study vegetation
    with remote sensing and AI in support of afforestation targets and the Saudi Green Initiative.
  url: https://ncvc.gov.sa/en/MediaCenter/news/Pages/News-05112023.aspx
  fetched: 2026-11-03
  quote: launched today a program utilizing remote sensing and artificial intelligence technologies
    to study the current state of vegetation areas and contribute to the achievement of afforestation
    project targets and the Saudi Green Initiative.
- claim: NCVC's chief executive said the technologies aim to monitor afforestation sites,
    land cover, rainfall, vegetation density and plant health.
  url: https://ncvc.gov.sa/en/MediaCenter/news/Pages/News-05112023.aspx
  fetched: 2026-11-03
  quote: these technologies aim to monitor changes in vegetation cover at afforestation project
    sites, track land cover and its changes, measure rainfall amounts and vegetation density,
    and monitor and assess plant health.
- claim: The same release names mangrove monitoring, drone tracking of afforestation and tree
    counting among the uses.
  url: https://ncvc.gov.sa/en/MediaCenter/news/Pages/News-05112023.aspx
  fetched: 2026-11-03
  quote: help monitor and track mangrove forests along the Kingdom's coasts, track afforestation
    and irrigation efforts using drones, count trees and field progress rates
