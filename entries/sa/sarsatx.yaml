summary: A KAUST spin-off founded in 2019 that operates small radar and optical satellites,
  plans a 16-satellite constellation, offers the AI platform EarthLife, and reportedly raised
  a $2.6 million seed round in 2025.
facts:
- claim: Wamda reports it was founded in 2019 as a spin-off from KAUST's TAQADAM accelerator
    and lists deforestation monitoring among its applications.
  url: https://www.wamda.com/2025/05/saudi-spacetech-sarsatx-raises-2-6-million-seed
  fetched: 2026-11-03
  quote: Its applications include deforestation monitoring, oil leakage detection, disaster
    management, border security, urban development, and search and rescue.
- claim: Its KAUST technology sheet says it designs, develops and operates small satellites
    with radar and optical payloads, serving sectors including agriculture and environment.
  url: https://www.kaust.edu.sa/docs/kaustlibraries/downloads/sarsatx-tech-sheet-content_white.pdf
  fetched: 2026-11-03
  quote: SARsatX designs, develops and operates small satellites carrying Synthetic Aperture
    Radar and optical payloads, then
- claim: The technology sheet describes ArabiaEye as a planned constellation of 16 small Earth
    observation satellites.
  url: https://www.kaust.edu.sa/docs/kaustlibraries/downloads/sarsatx-tech-sheet-content_white.pdf
  fetched: 2026-11-03
  quote: ArabiaEye — planned 16 small EO satellites, owned and operated from within KSA
- claim: Wamda reports a $2.6 million seed round in 2025 led by TONOMUS, with Wa'ed Ventures,
    Access Bridge Ventures and KAUST Innovation Ventures.
  url: https://www.wamda.com/2025/05/saudi-spacetech-sarsatx-raises-2-6-million-seed
  fetched: 2026-11-03
  quote: Saudi Arabia-based spacetech SARsatX has raised $2.6 million in a Seed round, led
    by TONOMUS, with participation from Wa'ed Ventures (Aramco), Access Bridge Ventures, and
    KAUST Innovation Ventures.
- claim: KAUST describes EarthLife as an AI-powered geospatial analytics platform combining
    optical and SAR remote sensing with AI.
  url: https://www.kaust.edu.sa/en/innovate/sarsatx
  fetched: 2026-11-03
  quote: EarthLife is an AI-powered geospatial analytics platform that combines optical and
    SAR remote sensing with AI to deliver near real-time, satellite-based insights.
- claim: Its automated reports cover land use, environmental shifts and infrastructure.
  url: https://www.kaust.edu.sa/en/innovate/sarsatx
  fetched: 2026-11-03
  quote: Automated insights deliver instant reports on land use, environmental shifts and
    infrastructure.
