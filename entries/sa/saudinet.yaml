summary: A national ecological observation network built by KAUST and NCVC, intended to collect standardised
  long-term biodiversity, vegetation, soil and climate data and train NCVC staff in monitoring.
facts:
- claim: KAUST's dryland ecology lab describes it as a national initiative jointly launched by KAUST and
    NCVC to build an ecological observation network.
  url: https://maestrelab.kaust.edu.sa/research
  fetched: 2026-11-03
  quote: SaudiNet is a national initiative jointly launched by KAUST and the National Center for Vegetation
    Cover (NCVC) to transform terrestrial ecology research and monitoring across Saudi Arabia.
- claim: The network is to collect standardised long-term data on biodiversity, vegetation, soil health
    and climate.
  url: https://maestrelab.kaust.edu.sa/research
  fetched: 2026-11-03
  quote: observation network that collects standardized, long-term data on biodiversity, vegetation dynamics,
    soil health, and climate across the Kingdom's diverse landscapes.
- claim: NCVC staff are to be trained in biodiversity monitoring, with samples analysed in KAUST laboratories.
  url: https://ncvc.gov.sa/en/MediaCenter/news/Pages/NCVC-KAUST-Launch-SAUDINet.aspx
  fetched: 2026-11-03
  quote: NCVC's workforce will receive specialized training in biodiversity monitoring and ecological
    sampling, with collected samples analyzed in KAUST's cutting-edge laboratories.
