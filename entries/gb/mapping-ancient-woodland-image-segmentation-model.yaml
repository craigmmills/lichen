  url: https://www.gov.uk/algorithmic-transparency-records/welsh-government-mapping-ancient-woodland-image-segmentation-model
  quote: Uses an image segmentation model to predict areas of woodland on OS Landmark maps
    using a sample of manually labelled data.
  fetched: '2026-10-31'
- claim: Uses a Masked R-CNN, a convolutional neural network.
  url: https://www.gov.uk/algorithmic-transparency-records/welsh-government-mapping-ancient-woodland-image-segmentation-model
