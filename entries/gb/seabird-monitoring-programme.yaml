summary: A programme run by the British Trust for Ornithology that has monitored 25
  regularly breeding seabird species in Britain and Ireland annually since 1986, coordinated
  by JNCC before July 2022.
facts:
- claim: Annual monitoring of 25 seabird species that breed regularly in Britain and
    Ireland has been undertaken through the programme since 1986.
  url: https://jncc.gov.uk/our-work/seabird-monitoring
  fetched: 2026-11-09
  quote: Through the Seabird Monitoring Programme (SMP) , annual monitoring of 25
    species of seabird that breed regularly in Britain and Ireland has been undertaken
    since 1986.
- claim: Before July 2022 it was coordinated by JNCC and its predecessor through a
    partnership of 19 organisations.
  url: https://jncc.gov.uk/our-work/seabird-monitoring
  fetched: 2026-11-09
  quote: Prior to July 2022, the Seabird Monitoring Programme was co-ordinated by
    JNCC (and its predecessor NCC), through the SMP partnership, which consisted of
    19 organisations.
