summary: A bird observatory on North Ronaldsay where, according to a Visit Orkney
  article quoting its assistant warden, staff run a daily census across six zones
  and ring chicks in July.
facts:
- claim: A Visit Orkney article quotes its assistant warden saying staff conduct a
    daily census, recording everything seen and heard across six zones of the island.
  url: https://visitorkney.com/news/nrbo
  fetched: 2026-11-09
  quote: Apart from ringing we also conduct a daily census, recording and logging
    everything we see and hear in our census areas.
- claim: The same article says that in July staff ring the chicks of breeding birds
    in colonies across the island.
  url: https://visitorkney.com/news/nrbo
  fetched: 2026-11-09
  quote: Our attention is moved away from our daily census duties and onto ringing
    the chicks once they are of a suitable size.
- claim: Named on the Bird Observatories Council's map of the observatories of Britain
    and Ireland.
