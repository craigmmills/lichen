facts:
- claim: Manages twelve locations where it creates and restores native woodland and
    other habitats.
  url: http://www.thefutureforestcompany.com
  fetched: 2026-11-22
  quote: we manage twelve unique locations where we create and restore native woodlands
    and diverse habitats.
- claim: Restores ancient woodland, peatland, meadows, wetlands and heathland across
    sites in Scotland and northern England.
  url: http://www.thefutureforestcompany.com
  fetched: 2026-11-22
  quote: restoring ecosystems such as ancient woodland, peatlands, meadows, wetlands,
