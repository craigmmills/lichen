summary: A programme run by NatureScot which, with NERC, funded methods using satellite
  radar measures of peatland surface motion to map peatland condition, aiming to support
  monitoring of restoration investment in Scotland.
facts:
- claim: Funded, with NERC, the development of methods that use satellite radar measures
    of peatland surface motion to map peatland condition and change in condition.
  url: https://www.nature.scot/doc/naturescot-research-report-1355-summary-surface-motion-remote-sensing-methods-monitoring-peatland
  fetched: 2026-11-09
  quote: The work was funded by NatureScot Peatland ACTION and the Natural Environment
    Research Council, Landscape Decisions Grant NE/T010118/1.
- claim: Has a Data and Evidence team, which supported the research.
  url: https://www.nature.scot/doc/naturescot-research-report-1355-summary-surface-motion-remote-sensing-methods-monitoring-peatland
