  quote: We would like to acknowledge the NatureScot Peatland ACTION Data and Evidence
    team for supporting this research.
- claim: The methods aim to support monitoring and reporting on the outcomes of large
    investments in peatland restoration in Scotland.
  url: https://www.nature.scot/doc/naturescot-research-report-1355-summary-surface-motion-remote-sensing-methods-monitoring-peatland
