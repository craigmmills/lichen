summary: A bird observatory maintaining long-term monitoring, with past daily point
  counts at twelve locations, Wetland Bird Survey counts since 1965, ringing and a
  Motus receiver acquired in 2019.
facts:
- claim: Maintains long-term monitoring at Spurn alongside its daily bird log and
    bird ringing.
  url: https://spurnbirdobservatory.co.uk/science-and-research/projects
  fetched: 2026-11-09
  quote: maintaining the long-term monitoring already taking place. This is in addition
    to the daily bird log and general bird ringing activities.
- claim: Observatory staff and long-term volunteers carried out daily point counts
    at twelve locations, giving a standardised data set for spring and autumn.
  url: https://spurnbirdobservatory.co.uk/science-and-research/projects
  fetched: 2026-11-09
  quote: Between Observatory staff and long-term volunteers, Point Counts were carried
    out at each site, daily, in all weather resulting in a highly standardised dataset
    for the spring and autumn seasons.
- claim: Wetland Bird Survey counts at Spurn are organised by the Observatory Warden
    and have taken place since 1965.
  url: https://spurnbirdobservatory.co.uk/science-and-research/projects
  fetched: 2026-11-09
  quote: At Spurn, counts are organised by the Observatory Warden and have taken place
    since 1965!
- claim: In 2019 it was one of the first UK bird observatories to get a Motus receiver,
    which listens for tagged birds or bats.
  url: https://spurnbirdobservatory.co.uk/science-and-research/projects
  fetched: 2026-11-09
  quote: During 2019, Spurn was one of the first UK bird observatories to get a receiver,
    allowing the Observatory to ‘listen’ for passing tagged birds or bats from the
    continent.
- claim: Has a Science and Research sub-committee whose aims include enhancing monitoring
    and the digitisation and storage of data.
  url: https://spurnbirdobservatory.co.uk/science-and-research
  fetched: 2026-11-09
  quote: core aims of enhancing monitoring as well as continuing and supporting existing
    recording, digitalisation and storage of data
