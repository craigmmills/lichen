facts:
- claim: Designs, builds, finances and maintains peatland restoration projects with
    landowners and tenants across the UK.
  url: http://www.ridgecarboncapture.com/our-projects/
  fetched: 2026-11-22
  quote: design, build, finance, and maintain peatland restoration projects across
    the UK
- claim: Completed the first phase of its Ridge Graham peatland restoration project,
    covering 227 hectares in Cumbria, England.
  url: http://www.ridgecarboncapture.com/our-projects/
  fetched: 2026-11-22
  quote: 'Status: Completed

    Location: Cumbria, England

    Size: 227 ha'
- claim: Is restoring the 77-hectare Ridge Rottal site in Angus, Scotland, as a pilot
    that plans to monitor biodiversity with invertebrate stations, bird bioacoustic
    recorders and drone imagery.
  url: http://www.ridgecarboncapture.com/our-projects/
  fetched: 2026-11-22
  quote: biodiversity metrics will be monitored to track improvements in species richness
    and evenness as a result of our restoration with techniques including invertebrate
    monitoring stations, bird bioacoustic recorders and drone imagery
- claim: Plans to restore bare peat at Ridge Dell in Inverness-shire using a living
    carpet intended to re-establish sphagnum mosses.
  url: http://www.ridgecarboncapture.com/our-projects/
  fetched: 2026-11-22
  quote: The bare peat on the site will be restored using a ‘living carpet’, an innovative
    technique meant to reestablish sphagnum mosses and restabilise the degraded areas.
