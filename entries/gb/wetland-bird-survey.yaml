summary: UK-wide scheme monitoring wildfowl, waders and other waterbirds, with 3,801
  registered volunteers making 43,640 visits to 3,325 core sites in 2022/2023, funded
  by the BTO, RSPB and JNCC.
facts:
- claim: A UK-wide monitoring scheme for wildfowl, waders and other waterbirds that
    produces population abundance and distribution trends and identifies important
    sites.
  url: https://hub.jncc.gov.uk/our-work/wetland-bird-survey
  fetched: 2026-11-09
  quote: WeBS is a UK-wide monitoring scheme which targets wildfowl, waders and other
    waterbirds to produce population abundance and distribution trends and determine
    important sites for waterbirds in the UK.
- claim: In the 2022/2023 season 3,801 registered volunteers made 43,640 visits to
    3,325 core sites.
  url: https://hub.jncc.gov.uk/our-work/wetland-bird-survey
  fetched: 2026-11-09
  quote: In the 2022/2023 season, there were 3,801 registered volunteers who made
    43,640 visits to 3,325 core sites and additional visits to 19 estuaries.
- claim: Its data contribute to the International Waterbird Census.
  url: https://hub.jncc.gov.uk/our-work/wetland-bird-survey
  fetched: 2026-11-09
  quote: WeBS data also contribute to the International Waterbird Census which monitors
    waterfowl populations across the African-Eurasian migration paths.
