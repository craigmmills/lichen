facts:
- claim: The UK's long-term ecosystem research network, collecting, managing, analysing
    and interpreting environmental data from a network of sites across the UK.
  url: https://ecn.ac.uk/what-we-do/about
  fetched: 2026-11-09
  quote: The Environmental Change Network is the UK’s long-term ecosystem research
    network. We collect, manage, analyse and interpret environmental data collected
    at a network of sites across the UK.
- claim: Launched in 1992, with formal data collection from 1993 at terrestrial sites
    and 1994 at freshwater sites.
  url: https://ecn.ac.uk/what-we-do/about
  fetched: 2026-11-09
  quote: ECN was launched in 1992 and the collection of data started formally in 1993
    at terrestrial sites and 1994 at freshwater sites.
- claim: A multi-agency programme funded and monitored by a consortium of UK government
    departments and agencies.
  url: https://ecn.ac.uk/what-we-do/about
  fetched: 2026-11-09
  quote: ECN is a multi-agency programme with funding and monitoring by a consortium
    of UK government departments and agencies.
