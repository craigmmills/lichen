name: Natural Capital Laboratory
ai_label: ai
summary: Living laboratory on 100 acres of rewilded land near Loch Ness, set up in 2019 by
  AECOM, The Lifescape Project and the landowners, to test drones, AI and remote sensing for
  capturing environmental change.
facts:
