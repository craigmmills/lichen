facts:
- claim: Established by Statutory Instrument No. 137 of 1999 under the Science and Technology Act.
  url: https://www.nrsc.org.zm/
  fetched: 2026-11-08
  quote: The National Remote Sensing Centre (NRSC) was established through the issuance of Statutory Instrument
    No. 137 of 1999 of the Science and Technology Act (No. 26 of 1997).
- claim: Says its mandate is to provide remote sensing data and geo-information products to support decisions
    at local, national and regional level.
  url: https://www.nrsc.org.zm/
  fetched: 2026-11-08
  quote: To provide timely remote sensing data and other geo-information products and services to contribute
    to decision making at local, national and regional level.
- claim: Describes itself as specialising in remote sensing, GIS, surveying, environmental monitoring
    and disaster management.
  url: https://www.nrsc.org.zm/
  fetched: 2026-11-08
  quote: NRSC is Zambia’s leading institution in geospatial technologies, specializing in remote sensing,
    GIS, surveying, environmental monitoring, and disaster management .
- claim: Says it uses optical, radar and hyperspectral satellite imagery, including Sentinel-2, Landsat-8
    and Sentinel-1.
  url: https://www.nrsc.org.zm/
  fetched: 2026-11-08
  quote: We utilize imagery from optical (e.g., Sentinel-2, Landsat-8), radar (e.g., Sentinel-1), and
    hyperspectral satellites for various applications.
- claim: Listed as a member of the WeMAST consortium, the GMES and Africa wetland monitoring service for
    transboundary basins in southern Africa led by SASSCAL.
