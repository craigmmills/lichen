summary: Accounts the World Bank said in April 2025 Zambia was updating under its Natural Capital Accounting
  Programme, intended to track wildlife using aerial surveys and ranger reports.
facts:
- claim: The World Bank wrote in April 2025 that Zambia is updating its Wildlife and Protected Areas Accounts
    under the Zambia Natural Capital Accounting Programme.
  url: https://www.worldbank.org/en/news/feature/2025/04/10/enhancing-conservation-through-data-driven-decision-making-in-zambia
  fetched: 2026-11-08
  quote: Zambia is updating its WPAA under the Zambia Natural Capital Accounting Program, supported by
    the World Bank’s Global Program for Sustainability.
- claim: The World Bank says the accounts will track wildlife population trends using aerial surveys and
    ranger reports.
  url: https://www.worldbank.org/en/news/feature/2025/04/10/enhancing-conservation-through-data-driven-decision-making-in-zambia
  fetched: 2026-11-08
  quote: The WPAA will help track wildlife population trends, using aerial surveys and ranger reports
    to assess key species such as elephants, buffalos, and big cats.
- claim: The World Bank gave finalising the updated accounts later in 2025 as a next step.
  url: https://www.worldbank.org/en/news/feature/2025/04/10/enhancing-conservation-through-data-driven-decision-making-in-zambia
  fetched: 2026-11-08
  quote: The next steps will include finalizing the updated WPAA sometime later in 2025
