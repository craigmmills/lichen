summary: Non-governmental organisation that, with Rinato Space, launched a youth-led
  forest change monitoring project, with young people in three districts trained by
  August 2025 to map forest sites using mobile survey tools.
facts:
- claim: Works in partnership with the government, other non-governmental organisations
    and churches, with a portfolio of child sponsorship, grant funded projects and
    gifts in kind.
  url: https://www.wvi.org/zambia/about-us
  fetched: 2026-11-17
  quote: It also conducts targeted emergency relief projects in partnership with the
    government, other non-governmental organisations and churches.
- claim: An August 2025 report said World Vision Zambia, with Rinato Space, had launched
    the Youth-Led Forest Change Monitoring Technology Project.
  url: https://www.wvi.org/stories/zambia/zambian-youth-harness-technology-combat-deforestation-and-climate-change
  fetched: 2026-11-17
  quote: World Vision Zambia, in collaboration with Rinato Space , has launched the
    Youth-Led Forest Change Monitoring Technology Project.
- claim: By August 2025, young people in Chibombo, Katete and Sinda Districts had
    been trained to use mobile survey tools to map forest sites and monitor ecological
    changes.
  url: https://www.wvi.org/stories/zambia/zambian-youth-harness-technology-combat-deforestation-and-climate-change
  fetched: 2026-11-17
  quote: young people from Chibombo, Katete, and Sinda Districts have been trained
    to operate mobile survey tools for mapping forest sites, collecting geographic
    coordinates, and monitoring ecological changes.
