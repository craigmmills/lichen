summary: A Panthera-run programme that, as Panthera said in July 2021, had used SMART in Kafue National
  Park since 2016 to monitor carnivore distribution and movement.
facts:
- claim: In July 2021, Panthera said it had run the SMART programme in Kafue National Park since 2016
    to monitor carnivore distribution and movement.
  url: https://panthera.org/blog-post/using-smart-technology-protect-wild-cats-southern-africa
  fetched: 2026-11-08
  quote: We have been running this SMART program in Kafue National Park since 2016 in order to monitor
    the distribution and movement of the carnivores within the park.
- claim: In July 2021, Panthera said it used SMART in Kafue to record samples such as fur or scat and
    direct animal observations on transects.
  url: https://panthera.org/blog-post/using-smart-technology-protect-wild-cats-southern-africa
  fetched: 2026-11-08
  quote: in Kafue National Park, Zambia, we use SMART to record samples such as fur or scat, as well as
    direct animal observations during transects
- claim: In July 2021, Panthera said safari guides across the landscape were given SMART devices and taught
    to record large carnivore sightings on game drives.
  url: https://panthera.org/blog-post/using-smart-technology-protect-wild-cats-southern-africa
  fetched: 2026-11-08
  quote: Safari guides across the landscape are given SMART devices and taught to record all large carnivore
    sightings on their game drives.
