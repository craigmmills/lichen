summary: Project led by Zambia's national parks department with Peace Parks Foundation
  that, in May 2025, used EarthRanger in an operations room and on scouts' phones,
  and supported elephant collaring.
facts:
- claim: In May 2025 the Simalaha Smart Park Project was described as in full swing
    in Simalaha Community Conservancy.
  url: https://www.peaceparkstv.com/?p=9647
  fetched: 2026-11-17
  quote: we visit the Simalaha Community Conservancy in Zambia, where the Simalaha
    Smart Park Project is in full swing.
- claim: In May 2025, the operations room at Simalaha headquarters was reported to
    use EarthRanger to collect and integrate real-time data.
  url: https://www.peaceparkstv.com/?p=9647
  fetched: 2026-11-17
  quote: The ops room uses EarthRanger, a platform that collects and integrates real-time
    data from various sources to help manage the park more effectively and make better-informed
    decisions.
- claim: Community scouts were given phones with EarthRanger Mobile, adapted to Simalaha,
    to identify and record incidents.
  url: https://www.peaceparkstv.com/?p=9647
  fetched: 2026-11-17
  quote: we have also provided each of the community scouts with a mobile phone that
    has EarthRanger Mobile, which we have adapted specifically to Simalaha so the
    scouts can identify and record incidents
- claim: Through the project, Peace Parks supported the collaring of elephants to
    trace their movements across corridors.
  url: https://www.peaceparkstv.com/?p=9647
  fetched: 2026-11-17
  quote: Peace Parks has supported the collaring of elephants to trace their movements
    across corridors
