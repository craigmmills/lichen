summary: Online Kafue Flats biodiversity platform, launched 30 October 2026, documenting 480
  bird species and, the International Crane Foundation said, combining data from GBIF, eBird,
  iNaturalist and others.
facts:
- claim: The Ministry of Tourism says the system is an online platform giving access to information
    on the Kafue Flats' biodiversity, supported by the JRS Biodiversity Foundation.
  url: https://www.mot.gov.zm/?p=5472
  fetched: 2026-11-12
  quote: The Kafue Flats Wetland Information System, supported by the JRS Biodiversity Foundation,
    is an online platform designed to provide accessible information on the area’s biodiversity.
- claim: Documents 480 bird species as well as mammals, fish, reptiles and amphibians.
  url: https://www.mot.gov.zm/?p=5472
  fetched: 2026-11-12
  quote: The system documents 480 bird species alongside mammals, fish, reptiles and amphibians
- claim: Launched by the Ministry of Tourism in Lusaka on 30 October 2026, with the Kafue
    Flats Ecological Monitoring Plan and the 2025 dry-season aerial survey report.
  url: https://www.mot.gov.zm/?p=5472
  fetched: 2026-11-12
  quote: The documents launched were, the Kafue Flats Wetland Information System, the Kafue
    Flats Ecological Monitoring Plan and the 2025 Dry-Season Aerial Survey Report of Large
    Mammals and Waterbirds.
- claim: The International Crane Foundation said at the launch that the system brings together
    data from GBIF, EarthRanger, SMART, Survey123, eBird and iNaturalist.
  url: https://www.mot.gov.zm/?p=5472
  fetched: 2026-11-12
  quote: the Wetland Information System integrated biodiversity data from platforms such as
    Global Biodiversity Information Facility, EarthRanger, SMART, Survey123, eBird and iNaturalist
    into one accessible system
- claim: JRS said in February 2025 that the platform was being developed with FBIS, an open-access
    freshwater biodiversity platform developed by the Freshwater Research Centre.
  url: https://jrsbiodiversity.org/biodiversity-milestones-in-zambias-kafue-flats/
  fetched: 2026-11-12
  quote: Kafue Flats Wetlands Information System (KFWIS), a platform being developed in hand
    with FBIS
