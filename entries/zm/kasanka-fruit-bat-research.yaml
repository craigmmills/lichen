summary: Research at Kasanka on straw-coloured fruit bats, involving cameras, tags and a drone in November
  2019, with annual camera counts planned by Kasanka Trust.
facts:
- claim: Kasanka Trust says seven researchers affiliated with the Max Planck Institute for Animal Behavior
    visited in November 2019 for an ongoing project on straw-coloured fruit bats.
  url: https://kasanka.com/kasanka-bat-research/
  fetched: 2026-11-08
  quote: A group of 7 researchers affiliated with the Max Planck Institute for Animal Behavior visited
    Kasanka in November 2019 for an on-going project on the Straw-Coloured Fruit Bats (Eidolon helvum).
- claim: During the November 2019 visit, the team set up 10 GoPro cameras to record bats leaving the roost
    and planned to use software to count them.
  url: https://kasanka.com/kasanka-bat-research/
  fetched: 2026-11-08
  quote: the team set up 10 GoPro cameras around the bat forest to record the fly out. The team will use
    these videos, in combination with a very clever software, to count the bats moving in one direction
    across the screen.
- claim: In November 2019, the team tagged four bats with tags intended to record daily positions and
    send them by SMS, with monitoring planned on Movebank.
  url: https://kasanka.com/kasanka-bat-research/
  fetched: 2026-11-08
  quote: We will be watching these bats closely on Movebank (www.movebank.org) and we will let you know
    what they are up to.
- claim: During the November 2019 visit, the team used a drone to monitor the bats’ swirling flights and
    emergence.
  url: https://kasanka.com/kasanka-bat-research/
  fetched: 2026-11-08
  quote: the team used a drone to monitor the swirling flights and then the fly out to assess emergence
    patterns.
- claim: In its account of the November 2019 visit, Kasanka Trust said it planned to use the camera method
    to count the bats annually.
  url: https://kasanka.com/kasanka-bat-research/
  fetched: 2026-11-08
  quote: Kasanka plans to use this method to count the bats annually
