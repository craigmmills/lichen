facts:
- claim: Describes itself as a partnership between FZS and DNPW to conserve North
    Luangwa National Park and its adjoining game management areas, about 22,000 square
    kilometres.
  url: https://northluangwa.org/conservation/
  fetched: 2026-11-12
  quote: The North Luangwa Conservation Programme (NLCP) is a partnership between
    the Frankfurt Zoological Society (FZS) and the ZambianDepartment of National Parks
    and Wildlife (DNPW)
- claim: Says it monitors elephant herds across the North Luangwa ecosystem with tracking
    collars.
  url: https://northluangwa.org/conservation/
  fetched: 2026-11-12
  quote: The NLCP constantly monitors vulnerable herds in remote locations across
    the North Luangwa ecosystem using tracking collars
- claim: Its ecological monitoring uses regular transects, ecological surveys, tracking
    devices and camera traps.
  url: https://northluangwa.org/conservation/
  fetched: 2026-11-12
  quote: by conducting detailed and regular transects; ecological surveys; and using
    tracking devices and camera traps
- claim: The black rhinos are monitored by a DNPW ranger unit for sightings and range
    mapping.
  url: https://northluangwa.org/conservation/
  fetched: 2026-11-12
  quote: They are monitored by a special DNPW ranger unit to get regular sightings
    and update range mapping for their protection
