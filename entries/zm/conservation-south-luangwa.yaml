  quote: our SMART databases have been merged, are managed from a central
- claim: Its 2019 annual report said the joint aviation programme with the Zambian Carnivore Programme
    had operated since 2012 for anti-poaching and large carnivore research in South Luangwa.
  url: https://static1.squarespace.com/static/56ec3b690442625503c916f7/t/5e382a93e0e43424447046b9/1580739320769/Annual_Report_2019_CSL.pdf
  fetched: 2026-11-08
  quote: Since 2012, the joint CSL/ZCP Aviation Program continues to be an essential part of conservation
    efforts focused
- claim: In 2019, the aircraft flew over 305 hours in total, including 177 for anti-poaching, 89 for animal
    tracking and 38 supporting other programmes.
  url: https://static1.squarespace.com/static/56ec3b690442625503c916f7/t/5e382a93e0e43424447046b9/1580739320769/Annual_Report_2019_CSL.pdf
  fetched: 2026-11-08
  quote: In 2019, the aircraft flew over 305 hours in support of anti-poaching efforts and animal tracking
- claim: Panthera says it partnered with CSL on joint data collection training to implement SMART in South
    Luangwa National Park.
  url: https://panthera.org/blog-post/using-smart-technology-protect-wild-cats-southern-africa
  fetched: 2026-11-08
  quote: such as our partnership with Conservation South Luangwa, to implement SMART in South Luangwa
    National Park in Zambia
- claim: Has partnered with DNPW since registering in 2003 to protect wildlife and reduce human-wildlife
    conflict in the South Luangwa Valley, covering 1.4 million hectares.
  url: https://cslzambia.org/
  fetched: 2026-11-08
  quote: Since officially registering in 2003, Conservation South Luangwa (CSL) has partnered with Zambia’s
    Department of National Parks and Wildlife (DNPW) to protect wildlife and mitigate human-wildlife conflict
    (HWC) in the South Luangwa Valley.
- claim: Its aerial unit detects illegal activity and contributes to wildlife monitoring and research.
  url: https://cslzambia.org/
  fetched: 2026-11-08
  quote: detecting illegal activities such as poachers’ camps, bush fires and bushmeat drying racks, whilst
    also contributing to wildlife monitoring and research efforts.
- claim: Its aircraft support the Zambian Carnivore Programme's large carnivore research through aerial
    tracking and record carcasses, deforestation and illegal fires.
  url: https://cslzambia.org/aerial-unit
  fetched: 2026-11-08
  quote: while also contributing to the Zambian Carnivore Programme ’s large carnivore research via aerial
    tracking operations. The team collects valuable intelligence data, identifying carcass locations,
    areas of deforestation, illegal fires, as well as poachers’ camps and bushmeat drying racks.
- claim: Has a data and technology team, with a Head of Data & Technology and a Conservation Technology
    Manager.
  url: https://cslzambia.org/meet-the-team
  fetched: 2026-11-08
  quote: Aerial and Conservation Technology Kaluba Tembo - Head of Data & Technology Lloyd Malwa - Conservation
    Technology Manager
- claim: Hack the Planet says CSL runs its detection tools alongside ranger patrols in the South Luangwa
    Valley.
  url: https://www.hack-the-planet.io/partners/
  fetched: 2026-11-08
  quote: Anti-poaching unit working across Zambia's South Luangwa Valley. They run our detection tools
    alongside their ranger patrols in one of Africa's richest wildlife landscapes.
