status: closed
summary: Closed International Crane Foundation project funded by JRS ($249,359, July 2023–July
  2026), which the Foundation said in October 2026 trained 13 DNPW officers in SMART.
facts:
- claim: JRS lists the grantee as the International Crane Foundation, Zambia, with a grant
    of $249,359 from July 2023 to July 2026.
  url: https://jrsbiodiversity.org/grants/icrane_zambia/
  fetched: 2026-11-12
  quote: July 2023 - July 2026
- claim: Aimed to implement an ecological monitoring, assessment and management plan for the
    Kafue Flats wetlands in southern Zambia.
  url: https://jrsbiodiversity.org/grants/icrane_zambia/
  fetched: 2026-11-12
  quote: This project will implement a much-needed ecological monitoring, assessment, and
    management plan for the Kafue Flats wetlands in Southern Zambia.
- claim: JRS says the team ran ground counts, vegetation monitoring, biannual waterbird counts,
    gill net surveys and camera trapping in 2024, sharing data on iNaturalist.
  url: https://jrsbiodiversity.org/biodiversity-milestones-in-zambias-kafue-flats/
  fetched: 2026-11-12
  quote: to undertake the systematic ground counts, vegetation monitoring, biannual waterbird
    counts, gill net surveys, and camera trapping. Data is being shared on iNaturalist
- claim: The International Crane Foundation said in October 2026 that the project trained
    13 DNPW officers in the Spatial Monitoring and Reporting Tool (SMART).
  url: https://www.mot.gov.zm/?p=5472
  fetched: 2026-11-12
  quote: the project had strengthened local capacity in biodiversity monitoring through training
    13 DNPW officers, including ecologists, park rangers, wildlife police officers and community
    scouts, in the use of the Spatial Monitoring and Reporting Tool (SMART).
