summary: A Zambian company limited by guarantee with public benefit status that says it supports DNPW
  with a pangolin rehabilitation centre and better information gathering against wildlife trafficking.
facts:
- claim: Says it is a company limited by guarantee under Zambian law with public benefit organisation
    status, with memoranda of understanding with DNPW, the Forestry Department and other agencies.
  url: https://www.wildlifecrimeprevention.com/
  fetched: 2026-11-08
  quote: WCP Zambia, a registered company limited by guarantee under Zambian law with public benefit organisation
    (PBO) status, collaborates with several key government institutions through memoranda of understanding
    (MoUs).
- claim: Says it supports DNPW with a pangolin rehabilitation centre, with post-release monitoring of
    survival and distribution.
  url: https://www.wildlifecrimeprevention.com/
  fetched: 2026-11-08
  quote: Post-release monitoring helps assess survival rates and distribution, improving conservation
    strategies and understanding the impact of rehabilitation efforts on wild populations.
- claim: Says it supports DNPW by improving information gathering and analysis against wildlife trafficking.
  url: https://www.wildlifecrimeprevention.com/
  fetched: 2026-11-08
  quote: WCP supports DNPW and other Government partners in combating wildlife trafficking by enhancing
    investigative resources, improving information gathering and analysis
- claim: Names the illegal timber trade among the crimes it works against in the region.
  url: https://www.wildlifecrimeprevention.com/
  fetched: 2026-11-08
  quote: The trafficking of illegal wildlife products and the illegal timber trade constitute serious,
    organised crime conducted by networks operating across borders in the Southern African region.
