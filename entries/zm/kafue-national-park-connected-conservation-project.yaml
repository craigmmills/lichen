summary: A USAID-funded anti-poaching project at Lake Itezhi-Tezhi, where WWF Zambia reported in 2020
  thermal cameras covering about 20 km and ivory poaching down almost 50% from 2015.
facts:
- claim: WWF Zambia wrote in 2020 that four masts across Lake Itezhi-Tezhi carried FLIR thermal cameras
    covering a virtual fence line of about 20 km, linked to an anti-poaching control room.
  url: https://www.wwfzm.panda.org/the_connected_conservation_project_in_kafue
  fetched: 2026-11-08
  quote: The erected masts across the lake created a virtual fence line covering about 20 kilometers,
    and composed of FLIR thermal fixed and pan and tilt cameras with a range of 5 kilometers
- claim: WWF Zambia wrote in 2020 that ivory poaching had fallen by almost 50% against the 2015 baseline.
  url: https://www.wwfzm.panda.org/the_connected_conservation_project_in_kafue
  fetched: 2026-11-08
  quote: poaching for ivory has significantly reduced by almost 50% compared to the 2015 baseline
- claim: In March 2022, Game Rangers International said the project team was developing FLIR Analytics
    to detect boats entering the park automatically, with alerts planned for EarthRanger.
  url: https://gamerangersinternational.org/single-post/gri-virtual-fence-line
  fetched: 2026-11-08
  quote: The project team is currently developing, through the same grant, the inbuilt FLIR Analytics
    technology to detect boats entering the park automatically
- claim: FairPlanet reports that Game Rangers International's Connected Conservation Initiative and the
    Department of National Parks and Wildlife used artificial intelligence to build the virtual fence
    around Lake Itezhi-Tezhi.
  url: https://www.fairplanet.org/story/tech-for-wildlife-how-ai-saves-animals
  fetched: 2026-11-08
  quote: have embraced artificial intelligence to build a virtual fence around Lake Itezhi-Tezhi with
    infrared thermal cameras installed to capture the movement of all boats entering the park around the
    clock
