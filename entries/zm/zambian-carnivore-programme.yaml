summary: Field-based non-profit, headquartered at Chinzombo, Mfuwe, that conserves Zambia's large carnivores
  through long-term monitoring, and says it intensively monitored 483 lions and 455 wild dogs in 2024.
facts:
- claim: Describes itself as a field-based non-profit dedicated to conserving large carnivores in Zambia.
  url: https://www.zambiacarnivores.org/meet-the-team
  fetched: 2026-11-08
  quote: Zambian Carnivore Programme (ZCP) is a field-based non-profit organization dedicated to the conservation
    of large carnivore species in Zambia.
- claim: Runs long-term research and monitoring of the threats facing Zambia's large carnivores.
  url: https://www.zambiacarnivores.org/our-work
  fetched: 2026-11-08
  quote: monitoring to identify and evaluate the limiting factors and the myriad, ever-changing threats
    facing Zambia’s large carnivores and ecosystems.
- claim: Has its headquarters at Chinzombo, Mfuwe, in Eastern Province.
  url: https://www.zambiacarnivores.org/our-work
  fetched: 2026-11-08
  quote: ZCP Headquarters, Department of National Parks and Wildlife, Chinzombo, Mfuwe, Eastern Province,
