summary: Pilot forest inventory run by Zambia's Forestry Department with FAO, UN-REDD
  and AIM4Forests support, assessing 44 three-plot clusters in 2024, expected to inform
  an updated district management plan.
facts:
- claim: In March 2025, the Forestry Department was reported to be working on district-level
    forest data collection, with support from FAO through the UN-REDD Programme and
    AIM4Forests.
  url: https://www.un-redd.org/post/strengthening-zambias-forest-management-and-data-build-capacity-manyinga
  fetched: 2026-11-17
  quote: The Forestry Department of Zambia, with support from the Food and Agriculture
    Organization of the United Nations (FAO) through the UN-REDD Programme and the
    affiliated AIM4Forests Initiative, is working on district-level forest data collection
- claim: Officers carried out a three-week field inventory in Manyinga District from
    13 July to 3 August 2024.
  url: https://www.un-redd.org/post/strengthening-zambias-forest-management-and-data-build-capacity-manyinga
  fetched: 2026-11-17
  quote: embarked in a three-week field inventory in Manyinga District from 13 July
    to 3 August 2024
- claim: The teams assessed 44 clusters of three plots each, and the pilot inventory
    was completed.
  url: https://www.un-redd.org/post/strengthening-zambias-forest-management-and-data-build-capacity-manyinga
  fetched: 2026-11-17
  quote: they successfully assessed a grand total of 44 clusters — each consisting
    of three plots
- claim: The March 2025 article said the data would contribute to an updated district
    forest management plan.
  url: https://www.un-redd.org/post/strengthening-zambias-forest-management-and-data-build-capacity-manyinga
  fetched: 2026-11-17
  quote: the data will contribute to the development of updated district forest management
    plan
