summary: The Zambian government department, under the Ministry of Tourism, that administers national parks,
  created by Act of Parliament in 2015 and partnering with many conservation organisations.
facts:
- claim: Administers Zambia's national parks and is part of the Ministry of Tourism.
  url: https://en.wikipedia.org/wiki/Zambia_Wildlife_Authority
  fetched: 2026-11-08
  quote: The national parks are administered by the Department of National Parks and Wildlife
- claim: Created by Act of Parliament in 2015; the same act wound up the Zambia Wildlife Authority.
  url: https://en.wikipedia.org/wiki/Zambia_Wildlife_Authority
  fetched: 2026-11-08
  quote: The same act also wound up the department's predecessor, the Zambia Wildlife Authority (ZAWA).
- claim: WWF Zambia says the Kafue Connected Conservation Project was built to let the department detect
    and respond to poaching threats.
  url: https://www.wwfzm.panda.org/the_connected_conservation_project_in_kafue
  fetched: 2026-11-08
  quote: to enable DNPW to intelligently detect and respond to poaching threats, before poaching takes
    place
- claim: Says it is mandated, under the Ministry of Tourism and Arts, to manage and conserve wildlife
    in Zambia.
  url: https://www.mot.gov.zm/dnpw
  fetched: 2026-11-08
  quote: The Department Of National and Wildlife (DNPW) under the Ministry of Tourism and Arts is mandated
    to manage and conserve wildlife in Zambia.
- claim: Says Zambia has 20 national parks and 36 game management areas, about 30% of the country's land.
  url: https://www.mot.gov.zm/dnpw
  fetched: 2026-11-08
  quote: Zambia is endowed with 20 National Parks and 36 Game Management Areas (GMAs), that together account
    for about 30% of the country’s total land area
- claim: The Zambian embassy in Washington gives www.mot.gov.zm/dnpw as the department's website.
  url: https://www.zambiaembassy.org/page/tourism
  fetched: 2026-11-08
  quote: Department of National Parks and Wildlife www.mot.gov.zm/dnpw
