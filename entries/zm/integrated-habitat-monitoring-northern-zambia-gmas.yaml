summary: Active project, funded by JRS Biodiversity Foundation, on plant diversity,
  habitat and land cover in the Tondwa Game Management Areas; 274 herbarium specimens
  were collected in 2024 and maps and tools were reported almost ready in August 2024.
facts:
- claim: In August 2024, JRS described Conserve Global's project as improving understanding
    of plant diversity, habitat and land cover patterns across the Tondwa Game Management
    Areas.
  url: https://jrsbiodiversity.org/surveys-reveal-undescribed-species-in-zambias-tondwa-game-management-area/
  fetched: 2026-11-12
  quote: The project is achieving its aims for a better understanding of the region’s
    plant diversity, habitat, and land cover patterns across the Tondwa Game Management
    Areas.
- claim: A second field survey series in March and April 2024 collected 274 herbarium
    specimens for analysis at the Forestry Research Herbarium in Kitwe.
  url: https://jrsbiodiversity.org/surveys-reveal-undescribed-species-in-zambias-tondwa-game-management-area/
  fetched: 2026-11-12
  quote: A total of 274 herbarium specimens were collected and will be analyzed at
    the Forestry Research Herbarium in Kitwe.
- claim: In August 2024 JRS said the project's maps and tools were almost ready to
    be shared.
  url: https://jrsbiodiversity.org/surveys-reveal-undescribed-species-in-zambias-tondwa-game-management-area/
  fetched: 2026-11-12
  quote: the project is approaching a place where the maps and tools are almost ready
    to be shared with a whole range of audiences
