summary: Camera trap and distance sampling survey run by Lion Landscapes in 2021,
  with 104 camera traps at 52 stations, aiming to build a biodiversity monitoring
  system for the Lower Zambezi REDD+ Project area and LCFP.
facts:
- claim: In a July 2021 post, Lion Landscapes reported that 104 camera traps had been
    deployed at 52 stations across Rufunsa Conservancy, Munyamadzi Game Reserve and
    Kazumba Game Ranch for the 2021 survey.
  url: https://www.lionlandscapes.org/post/camera-traps-deployed-for-new-survey-in-zambia
  fetched: 2026-11-12
  quote: 104 camera traps across 52 stations have been successfully deployed across
    the Zambia project areas for a brand new 2021 survey
- claim: Early dry season distance sampling transects at Munyamadzi were run with
    trained anti-poaching scouts.
  url: https://www.lionlandscapes.org/post/camera-traps-deployed-for-new-survey-in-zambia
  fetched: 2026-11-12
  quote: The early dry season distance sampling transects at Munyamadzi took place
    in the beginning of June
- claim: In July 2021, Lion Landscapes said the project aimed to build a biodiversity
    monitoring system for the Lower Zambezi REDD+ Project area and LCFP, tracking
    population densities of large herbivores, carnivores and southern ground hornbill.
  url: https://www.lionlandscapes.org/post/camera-traps-deployed-for-new-survey-in-zambia
  fetched: 2026-11-12
  quote: The goal of the project is to develop a robust biodiversity monitoring system
    for the Lower Zambezi REDD+ Project area (LZRP) and LCFP
