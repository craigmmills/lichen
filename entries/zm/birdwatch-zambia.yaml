summary: Zambian membership NGO, established in 1969 and the BirdLife International
  partner there, that says it leads national bird monitoring; it received a $15,000
  JRS planning grant in 2016.
facts:
- claim: Describes itself as a membership-based environmental NGO, established in
    1969, and the BirdLife International partner in Zambia.
  url: https://www.birdwatchzambia.org/aboutus
  fetched: 2026-11-12
  quote: BirdWatch Zambia (BWZ) is a membership-based environmental NGO dedicated
    to the conservation of Zambia’s birds and their habitats. Established in 1969
- claim: Began as the Zambian Ornithological Society and took the name BirdWatch Zambia
    in 2012.
  url: https://www.birdwatchzambia.org/aboutus
  fetched: 2026-11-12
  quote: In 2012 the organisation officially became BirdWatch Zambia, and in 2018
    it was recognised as a full BirdLife International partner.
- claim: Says it leads national bird monitoring.
  url: https://www.birdwatchzambia.org/aboutus
  fetched: 2026-11-12
  quote: Today, BWZ continues to lead national bird monitoring, community conservation
    initiatives, and public education
- claim: Says it uses science-based monitoring at Important Bird Areas and Key Biodiversity
    Areas to collect ecological data.
  url: https://www.birdwatchzambia.org/
  fetched: 2026-11-12
  quote: Our work extends across key sites—IBAs and KBAs—where we collect vital ecological
    data that informs land-use decisions
- claim: Its species programme covers field surveys and population monitoring.
  url: https://www.birdwatchzambia.org/programmes
  fetched: 2026-11-12
  quote: From field surveys and population monitoring to researching threats and implementing
    species-specific action plans
- claim: JRS said in 2016 that its Research and Conservation Officer had coordinated
    biannual waterbird counts and biodiversity monitoring in the Kafue Flats, Bangweulu
    swamps and Zambezi floodplain.
  url: https://jrsbiodiversity.org/grants/BirdWatch-Zambia/
  fetched: 2026-11-12
  quote: bi-annual waterbird counts and biodiversity monitoring in several of Zambia’s
    wetlands including the Kafue Flats, Bangweulu swamps and the Zambezi floodplain
- claim: Received a JRS planning grant of $15,000 in 2016 to plan databases for Zambia's
    wetland birds and habitats.
  url: https://jrsbiodiversity.org/grants/BirdWatch-Zambia/
  fetched: 2026-11-12
  quote: BirdWatch Zambia will undertake planning for potential development of databases
    for wetland birds and their habitats
