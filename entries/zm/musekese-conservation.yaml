summary: A Zambian organisation founded in 2018 that monitors wildlife across the Greater Kafue Ecosystem
  using camera traps, acoustic monitoring, surveys and remote sensing, and is registered with GBIF.
facts:
- claim: Runs a field research programme that monitors predator populations and habitat change with tracking
    technology, ecological surveys and community science.
  url: https://www.musekeseconservation.org/
  fetched: 2026-11-08
  quote: Our field-based research programme combines tracking technology, ecological surveys, and community
    science to monitor predator populations and habitat change.
- claim: Has used camera traps since 2021 to run density surveys establishing large carnivore baselines
    in its core area.
  url: https://naturespy.org/blogs/journal/growing-conservation-impact-in-kafue-national-park
  fetched: 2026-11-08
  quote: their camera traps helped us run density surveys across our core area establishing large carnivore
    baselines
- claim: In August 2025, said its Mumbwa Game Management Area surveys combined lion vehicle transects
    scheduled for August–October with a planned September–November camera-trap deployment for leopards,
    spotted hyenas and other mammals.
  url: https://naturespy.org/blogs/journal/growing-conservation-impact-in-kafue-national-park
  fetched: 2026-11-08
  quote: Leopards, Spotted Hyenas, and Other Mammals – Surveyed via a three-month NatureSpy camera trap
    deployment from September 1st to November 30th.
- claim: Registered as a data publisher in GBIF, listed under Zambia.
  url: https://api.gbif.org/v1/organization?country=ZM&limit=50
  fetched: 2026-11-08
  quote: Musekese Conservation
- claim: Says it leads operations in the game management areas around Kafue, using technology, patrols
    and community partnerships.
  url: https://www.musekeseconservation.org/
  fetched: 2026-11-08
  quote: Musekese Conservation leads operations in the Game Management Areas surrounding Kafue, using
    technology, patrols, and community partnerships to deter illegal activity and secure critical landscapes.
- claim: Its GBIF publisher record says it runs biodiversity monitoring across the Greater Kafue Ecosystem
    using camera trapping, acoustic monitoring, field surveys and remote sensing.
  url: https://api.gbif.org/v1/organization/d002c8e8-4918-4a6b-923c-ee7171443bd0
  fetched: 2026-11-08
  quote: such as camera trapping, acoustic monitoring, field surveys, and remote sensing to better understand
    biodiversity patterns across different land-use areas and support evidence-based conservation management
- claim: Its GBIF publisher record describes it as a Zambian organisation working with the Department
    of National Parks and Wildlife.
  url: https://api.gbif.org/v1/organization/d002c8e8-4918-4a6b-923c-ee7171443bd0
  fetched: 2026-11-08
  quote: Musekese Conservation is a Zambian organisation working with the Department of National Parks
    and Wildlife.
- claim: Says it launched a Research and Monitoring Programme in 2020, focused on large carnivore population
    assessments.
  url: https://www.musekeseconservation.org/about
  fetched: 2026-11-08
  quote: The Research & Monitoring Programme is launched, focused on large carnivore population assessments.
- claim: Says it expanded camera trap networks in 2021.
  url: https://www.musekeseconservation.org/about
  fetched: 2026-11-08
  quote: begins citizen science partnerships with tourism operators, and expands camera trap networks
- claim: Its GBIF publisher record says it implements biodiversity monitoring across the Greater Kafue
    Ecosystem using camera trapping, acoustic monitoring, field surveys and remote sensing.
  url: https://api.gbif.org/v1/organization/d002c8e8-4918-4a6b-923c-ee7171443bd0
  fetched: 2026-11-08
  quote: These activities integrate a range of monitoring approaches such as camera trapping, acoustic
    monitoring, field surveys, and remote sensing
- claim: Founded in 2018 by Phil Jeffery and Tyrone McKeith.
  url: https://www.musekeseconservation.org/about
  fetched: 2026-11-08
  quote: Musekese Conservation is founded by Phil Jeffery and Tyrone McKeith
