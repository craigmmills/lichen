facts:
- claim: In September 2020 WWF, DNPW and Panthera collared a female wild dog, a male
    lion and a lioness in Sioma Ngwezi National Park.
  url: https://wwf.panda.org/discover/wildlife/bigcats/collaring_the_lions_in_kaza_
  fetched: 2026-11-17
  quote: In September 2020, WWF, the Department of National Parks and Wildlife (DNPW),
    and Panthera collared three large carnivores including a female wild dog, a male
    lion, and a lioness in the Sioma Ngwezi National Park of Silowana Complex.
- claim: The page said the September 2020 collaring would provide information on the
    large carnivore guild, predator-prey and spatial dynamics, prey preferences, threats
    and limiting factors.
  url: https://wwf.panda.org/discover/wildlife/bigcats/collaring_the_lions_in_kaza_
  fetched: 2026-11-17
  quote: The collaring will provide new information about the large carnivore guild,
    predator-prey and spatial dynamics, prey preferences, threats, and limiting factors.
- claim: The team was to go on collecting data on the collared lions' location and
    movement.
  url: https://wwf.panda.org/discover/wildlife/bigcats/collaring_the_lions_in_kaza_
  fetched: 2026-11-17
  quote: Shadrach and his team will continue to collect the data on their location,
