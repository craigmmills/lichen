summary: Irish state agency for marine research and innovation, which co-led the 2017 to 2019 SeaRover
  reef survey with INFOMAR and runs INFOMAR seabed mapping jointly with Geological Survey Ireland.
facts:
- claim: Co-led SeaRover with INFOMAR, a three-year survey in 2017–2019 of Ireland's offshore reef habitats
    that mapped 154 locations using the Marine Institute's remotely operated vehicle ROV Holland 1.
  url: https://marine.ie/node/2289
  fetched: 2026-11-09
  quote: The three year project, called SeaRover (Sensitive Ecosystem Assessment and ROV Exploration of
    Reef) is led by the Marine Institute and INFOMAR, the national seabed mapping programme
- claim: The SeaRover survey used the institute's remotely operated vehicle to film reef habitats up to
    3,000 metres deep.
  url: https://marine.ie/node/2289
  fetched: 2026-11-09
  quote: The survey utilised the Marine Institute's Remotely Operated Vehicle, ROV Holland 1 to capture
    high-definition footage of reef habitats up to 3000 m deep
- claim: Jointly manages the INFOMAR seabed mapping programme with Geological Survey Ireland, funded by
    the Department of the Environment, Climate and Communications, according to its EMFAF project site.
  url: https://emfaf.marine.ie/projects/marine-biodiversity/irish-shelf-upper-slope-habitat-assessment
  fetched: 2026-11-09
  quote: Extensive regional scale acoustic mapping is ongoing on the Irish shelf through the DECC funded
    jointly managed Marine Institute and Geological Survey Ireland INFOMAR programme.
- claim: Says it is the state agency responsible for marine research, technology development and innovation
    in Ireland.
  url: https://www.marine.ie/site-area/about-us/about-us
  fetched: 2026-11-09
  quote: We are the State agency responsible for marine research, technology development and innovation
    in Ireland.
- claim: Carries out environmental, fisheries and aquaculture surveys and monitoring programmes to meet
    Ireland's legal requirements.
  url: https://www.marine.ie/site-area/about-us/about-us
  fetched: 2026-11-09
  quote: We carry out environmental, fisheries, and aquaculture surveys and monitoring programmes to meet
    Ireland’s national and international legal requirements.
- claim: Says it aims to safeguard Ireland's marine heritage through research and environmental monitoring.
  url: https://www.marine.ie/site-area/about-us/about-us
  fetched: 2026-11-09
  quote: We aim to safeguard Ireland’s unique marine heritage through research and environmental monitoring.
- claim: Set up under the Marine Institute Act 1991 and now has over 170 staff.
  url: https://www.marine.ie/site-area/about-us/about-us
  fetched: 2026-11-09
  quote: Since then, we have grown from a staff of one to over 170
