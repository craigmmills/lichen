summary: Volunteer transect scheme run by the National Biodiversity Data Centre since 2008, whose index
  of the 15 commonest species shows a 65% decline in 2025 compared with 2008.
facts:
- claim: One of the butterfly monitoring schemes the National Biodiversity Data Centre lists, which count
    butterflies to a standard method so that population trends can be detected.
  url: https://biodiversityireland.ie/monitoring/
  fetched: 2026-11-09
  quote: All require counting the number of butterflies seen structured around a standard methodology
    so that any statistically significant population trends can be detected.
- claim: Established by the National Biodiversity Data Centre in 2008; volunteers walk fixed transects
    to track the population status of Ireland's widespread butterfly species.
  url: https://biodiversityireland.ie/surveys/butterfly-monitoring-scheme/
  fetched: 2026-11-09
  quote: It tracks the population status of Ireland’s widespread butterfly species based on a network
    of fixed routes (transects) established and walked by volunteer recorders.
- claim: Its multi-species index, based on the 15 commonest butterfly species, shows a 65% decline in
    2025 compared with 2008.
  url: https://biodiversityireland.ie/surveys/butterfly-monitoring-scheme/
  fetched: 2026-11-09
  quote: shows that in 2025 overall butterfly populations have declined by 65% since 2008
- claim: One of 22 schemes that make up the European Butterfly Monitoring Scheme.
  url: https://biodiversityireland.ie/surveys/butterfly-monitoring-scheme/
  fetched: 2026-11-09
  quote: The Irish Butterfly Monitoring Scheme is one of 22 monitoring schemes across Europe that form
    the European Butterfly Monitoring Scheme.
- claim: One of the butterfly monitoring schemes listed by the National Biodiversity Data Centre, which
    operates several such schemes.
  url: https://biodiversityireland.ie/monitoring/
  fetched: 2026-11-09
  quote: Irish Butterfly Monitoring Scheme
