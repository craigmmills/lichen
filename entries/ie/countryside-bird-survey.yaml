summary: Breeding bird survey run by BirdWatch Ireland and funded by NPWS, in which over 200 volunteers
  and staff walk 1 km squares each summer, producing the Common Bird Index.
facts:
- claim: Counters record all birds seen and heard on two early morning walks in pre-assigned 1km grid
    squares during the breeding season.
  url: https://birdwatchireland.ie/?p=8523
  fetched: 2026-11-09
  quote: During the breeding season, CBS counters record all birds seen and heard during two early morning
    walks in pre-assigned 1km grid squares.
- claim: Publishes the Common Bird Index and Common Farmland Bird Index.
  url: https://birdwatchireland.ie/?p=8523
  fetched: 2026-11-09
  quote: Common Bird Index (CBI) and Common Farmland Bird Index (CFBI).
- claim: Each summer over 200 volunteers, NPWS rangers and BirdWatch Ireland staff survey breeding birds
    across the Irish countryside.
  url: https://birdwatchireland.ie/our-work/surveys-research/research-surveys/countryside-bird-survey/
  fetched: 2026-11-09
  quote: Each summer over 200 skilled volunteers, NPWS Rangers and BirdWatch Ireland staff survey breeding
    birds across the Irish countryside.
- claim: Counters record all birds seen and heard on two early morning walks in pre-assigned 1 km grid
    squares.
  url: https://birdwatchireland.ie/our-work/surveys-research/research-surveys/countryside-bird-survey/
  fetched: 2026-11-09
  quote: CBS counters record all birds seen and heard during two early morning walks in pre-assigned 1km
    grid squares.
- claim: BirdWatch Ireland's staff page says the survey has run since 1998 to monitor breeding bird populations
    in the Republic of Ireland.
  url: https://birdwatchireland.ie/about-us/our-staff/
  fetched: 2026-11-09
  quote: CBS has been in operation since 1998 and its primary aim is to monitor breeding bird populations
    in the Republic of Ireland.
