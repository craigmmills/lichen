summary: Project run and built by ORCA Ireland that uses AI to classify cetacean sounds from a buoy launched
  off Ireland's south coast on 18 March 2021; Rainforest Connection reports 98% accuracy.
facts:
- claim: Uses AI to monitor underwater soundscapes in areas of biological importance for cetaceans and
    potential marine protected areas in Irish waters.
  url: https://rfcx.org/projects/ireland
  fetched: 2026-11-09
  quote: The 'Smart Whale Sounds' initiative demonstrates the application of AI in advancing our understanding
    and monitoring of underwater soundscapes within areas of biological importance for cetaceans
- claim: Developed an AI model, a convolutional neural network, trained to recognise and classify cetacean
    sounds.
  url: https://rfcx.org/projects/ireland
  fetched: 2026-11-09
  quote: Leveraging a Convolutional Neural Network (CNN), the initiative has developed an AI model trained
    to recognize and classify cetacean sounds amid the cacophony of marine noise.
  ai_type: deep-learning
- claim: Hydrophones were deployed in a biodiversity hotspot and potential marine protected area off the
    south coast of Ireland.
  url: https://rfcx.org/projects/ireland
  fetched: 2026-11-09
  quote: High-sensitivity underwater hydrophones were deployed in a biodiversity “hotspot” and a potential
    MPA off the south coast of Ireland
- claim: Rainforest Connection reports a 98% accuracy rate in identifying specific cetacean sounds, particularly
    those of delphinids.
  url: https://rfcx.org/projects/ireland
  fetched: 2026-11-09
  quote: The Smart Whale Sounds Initiative proudly achieved a 98% accuracy rate in identifying specific
    cetacean sounds, particularly those of delphinids
- claim: Launched a static acoustic monitoring buoy, nicknamed the Gannet, off the south coast of Ireland
    on 18 March 2021.
  url: http://www.orcaireland.org/smartwhalesounds
  fetched: 2026-11-09
  quote: On March 18th 2021, they launched Ireland's first "Whale Phone", a static acoustic monitoring
- claim: Following the March 2021 launch, recordings were transferred to Huawei's cloud in real time and
    uploaded to ARBIMON for identification.
  url: http://www.orcaireland.org/smartwhalesounds
  fetched: 2026-11-09
  quote: Recordings were transferred to Huawei's Cloud Server in real-time, where they are automatically
    uploaded to ARBIMON for identification.
- claim: Its first phase collects data to train convolutional neural networks to identify species automatically.
  url: http://www.orcaireland.org/smartwhalesounds
  fetched: 2026-11-09
  quote: The first phase of the project is to collect data to train deep learning convolutional neural
    networks to automate species specific identification.
  ai_type: deep-learning
- claim: Aims to create an Irish Marine Bioacoustics Network of near real-time static acoustic monitoring
    systems.
  url: http://www.orcaireland.org/smartwhalesounds
  fetched: 2026-11-09
  quote: Irish Marine Bioacoustics Network of near real-time AI empowered static acoustic monitoring (SAM)
    systems
