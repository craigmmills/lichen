facts:
- claim: Ireland's national competitive research and innovation funding agency, established on 1 August
    2024 by merging the activities of Science Foundation Ireland and the Irish Research Council.
  url: https://www.sfi.ie/challenges/future-digital/ai2peat
  fetched: 2026-11-09
  quote: Research Ireland is the new national competitive research and innovation funding agency, established
    through the amalgamation of the activities and functions of SFI and the IRC.
