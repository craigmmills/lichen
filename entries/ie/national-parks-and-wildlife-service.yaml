summary: Part of the Heritage Division of the Department of Housing, Local Government and Heritage, it
  manages national parks and nature reserves, designates protected sites, and surveys Irish seals and
  habitats.
facts:
- claim: Manages, maintains and develops state-owned national parks and nature reserves.
  url: https://www.npws.ie/about-us
  fetched: 2026-11-09
  quote: To manage, maintain and develop State-owned National Parks and Nature Reserves.
- claim: Designates and advises on the protection of Natural Heritage Areas, Special Areas of Conservation
    and Special Protection Areas.
  url: https://www.npws.ie/about-us
  fetched: 2026-11-09
  quote: To designate and advise on the protection of habitats and species identified for nature conservation
- claim: Its remit includes biodiversity policy, international issues and data management.
  url: https://www.npws.ie/about-us
  fetched: 2026-11-09
  quote: Scientific Support, Biodiversity policy and international issues, CITES and exotic species, Agri-Environment
    policy and schemes, Marine and aquaculture issues, Education Service and Data management.
- claim: Since 2009 has surveyed all major grey seal breeding colonies in Ireland under a national monitoring
    programme, and runs a national aerial thermal imaging survey of harbour seals within each six-year
    Habitats Directive reporting cycle.
  url: https://www.npws.ie/node/33318
  fetched: 2026-11-09
  quote: a national aerial thermal imaging survey within the 6-year Habitats Directive reporting cycle
- claim: Prepared the 2025 report on the implementation of Ireland's National Biodiversity Action Plan
    2023-2030, published in February 2026.
  url: https://www.npws.ie/news/minister-o%E2%80%99sullivan-publishes-national-biodiversity-action-plan-progress-report
  fetched: 2026-11-09
  quote: Prepared by the National Parks and Wildlife Service with input from the Inter-departmental Biodiversity
    Working Group
- claim: Part of the Heritage Division of the Department of Housing, Local Government and Heritage.
  url: https://www.npws.ie/about-npws
  fetched: 2026-11-09
  quote: The National Parks and Wildlife Service is part of the Heritage Division of the Department of
    Housing, Local Government & Heritage.
- claim: Manages, maintains and develops state-owned national parks and nature reserves.
  url: https://www.npws.ie/about-npws
  fetched: 2026-11-09
  quote: To manage, maintain and develop State-owned National Parks and Nature Reserves.
- claim: Designates and advises on the protection of Natural Heritage Areas, Special Areas of Conservation
    and Special Protection Areas.
  url: https://www.npws.ie/about-npws
  fetched: 2026-11-09
  quote: To designate and advise on the protection of habitats and species identified for nature conservation
- claim: Its Scientific Unit undertakes surveys and research to provide baseline and monitoring data on
    habitats and species.
  url: https://www.npws.ie/about-npws/business-units/scientific-unit
  fetched: 2026-11-09
  quote: Undertake scientific surveys and research to provide baseline and monitoring data to underpin
    policy, designations, protection and management of wildlife habitats and species.
- claim: Its Parks and Reserves Unit administers lands acquired by the State for nature conservation,
    that is national parks and nature reserves.
  url: https://www.npws.ie/about-npws/business-units/parks-and-reserves-unit
  fetched: 2026-11-09
  quote: Administration of lands acquired by the State for nature conservation purposes (i.e. National
    Parks & Nature Reserves )
- claim: Its Parks and Reserves Unit prepares the designation of nature reserves under the Wildlife (Amendment)
    Act 2000.
  url: https://www.npws.ie/about-npws/business-units/parks-and-reserves-unit
  fetched: 2026-11-09
  quote: The designation of Nature Reserves under the Wildlife (Amendment) Act, 2000
- claim: Runs a project for a national map of ecosystems and ecosystem services.
  url: https://www.npws.ie/
  fetched: 2026-11-09
  quote: NPWS project for a National Ecosystem and Ecosystem Services map.
