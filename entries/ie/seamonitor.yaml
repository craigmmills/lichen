summary: Marine research project around Ireland, Western Scotland and Northern Ireland,
  led by the Loughs Agency and funded with 4.6 million euros from EU INTERREG VA,
  which planned spatial models and an extended acoustic receiver network.
facts:
- claim: A marine research project in the seas around Ireland, Western Scotland and
    Northern Ireland, led by the Loughs Agency with eight research institutions, using
    species tracking technology.
  url: https://www.gla.ac.uk/research/az/scene/research/current%20research/seamonitor/
  fetched: 2026-11-22
  quote: The project is led by the Loughs Agency and supported by another eight leading
    marine research institutions using innovative marine species tracking technology
- claim: The project plan called for five spatial models for basking shark, skate,
    salmonids, seals and cetaceans, and management plans for three areas.
  url: https://www.gla.ac.uk/research/az/scene/research/current%20research/seamonitor/
  fetched: 2026-11-22
  quote: SeaMonitor will deliver five spatial models for basking shark, skate, salmonids,
    seals and cetaceans and three Management Plans
- claim: The project planned to extend the acoustic receiver network to connect Ireland
    and Scotland.
  url: https://www.gla.ac.uk/research/az/scene/research/current%20research/seamonitor/
  fetched: 2026-11-22
  quote: The project will achieve this by extending the existing network of buoys
    with acoustic receivers
- claim: Funded with 4.6 million euros from the EU INTERREG VA Programme, with match
    funding from governments in Northern Ireland and Ireland.
  url: https://www.gla.ac.uk/research/az/scene/research/current%20research/seamonitor/
  fetched: 2026-11-22
  quote: Funding for the SeaMonitor project has been provided by the EU’s INTERREG
    VA Programme (Environment Theme)
