summary: Irish body that protects, manages and conserves inland fisheries and sea angling resources under
  the 2010 Act, and has deployed an AquaWatch float with five water quality sensors.
facts:
- claim: Its principal function is to protect, manage and conserve Ireland's inland fisheries and sea
    angling resources.
  url: https://www.fisheriesireland.ie/who-we-are/our-organisation
  fetched: 2026-11-09
  quote: Our principal function is to protect, manage and conserve Ireland's inland fisheries and sea
    angling resources.
- claim: Its work rests on the Inland Fisheries Ireland Act 2010.
  url: https://www.fisheriesireland.ie/who-we-are/our-organisation
  fetched: 2026-11-09
  quote: 'Download the act: Inland Fisheries Ireland Act 2010'
- claim: Carries out applied research to assess the conservation status of Ireland's fish species and
    the environmental issues affecting fish and their habitats.
  url: https://www.fisheriesireland.ie/research
  fetched: 2026-11-09
  quote: Inland Fisheries Ireland carries out applied fisheries research to assess the conservation status
    of Ireland's fish species, to monitor fisheries stocks in inland and coastal waters and to explore
    environmental issues that have an impact on fish and their habitats.
- claim: Has deployed an AquaWatch water monitoring float with five sensors measuring dissolved oxygen,
    turbidity, temperature, pH and conductivity.
  url: https://www.fisheriesireland.ie/what-we-do/protection/environmental-protection/water-monitoring-sensor
  fetched: 2026-11-09
  quote: The AquaWatch water monitoring float consists of five sensors that measure dissolved oxygen,
    turbidity, temperature, pH and conductivity, key measures of water quality.
- claim: The sensor provides real-time water quality data that can inform decisions on water management
    and the protection of aquatic ecosystems.
  url: https://www.fisheriesireland.ie/what-we-do/protection/environmental-protection/water-monitoring-sensor
  fetched: 2026-11-09
  quote: The water monitoring sensor provides real-time data on key water quality indicators, which can
    be used to make informed decisions about water management and protection of aquatic ecosystems.
