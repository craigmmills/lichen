summary: Forest Service report undertaken every four years, according to Hometree, which said the 2022
  inventory found 5,000 hectares converted from forest to other uses since 2017.
facts:
- claim: In February 2023, Hometree described the inventory as a report undertaken every four years by
    the Forest Service to assess the extent, constitution and health of Ireland's forests.
  url: https://hometree.ie/hometree-blog/2022-irish-forest-inventory
  fetched: 2026-11-09
  quote: This major report undertaken every four years by the Forest Service assesses the extent, constitution,
    and health of Ireland's forests.
- claim: According to Hometree, the 2022 inventory found 5,000 hectares of forest no longer present since
    the 2017 inventory, converted to other land uses.
  url: https://hometree.ie/hometree-blog/2022-irish-forest-inventory
  fetched: 2026-11-09
  quote: The final point of interest is the finding that 5000 hectares of forest are "no longer been present"
    since the last inventory in 2017.
