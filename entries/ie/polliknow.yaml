summary: Company funded by Enterprise Ireland, charging fees, with solar-powered AI sensors monitoring
  pollinator numbers and species richness for four to six weeks, according to November 2025 Irish Times
  reporting.
facts:
- claim: In November 2025, the Irish Times reported that its AI device used solar-powered ground sensors
    to report species richness and pollinator count and density, typically monitoring for eight hours
    a day over four to six weeks.
  url: https://www.irishtimes.com/business/innovation/2025/11/27/meet-the-irish-tech-watching-over-the-insects-that-feed-the-world
  fetched: 2026-11-09
  quote: The Polliknow device, which is being made here, uses AI and solar-powered ground sensors to continuously
    monitor an area without disturbing the ecosystem.
- claim: Its founder says it uses vision to identify insects.
  url: https://www.irishtimes.com/business/innovation/2025/11/27/meet-the-irish-tech-watching-over-the-insects-that-feed-the-world
  fetched: 2026-11-09
  quote: We use vision for identification purposes, and if required, our data can be sent off for verification
    to an expert in the field
- claim: Charges an annual fee for its service based on the size of the area surveyed, with trial projects
    generating revenue (as of November 2025).
  url: https://www.irishtimes.com/business/innovation/2025/11/27/meet-the-irish-tech-watching-over-the-insects-that-feed-the-world
  fetched: 2026-11-09
  quote: The company charges an annual fee for its service based on the size of the area to be surveyed.
