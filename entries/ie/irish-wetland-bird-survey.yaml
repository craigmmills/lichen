summary: Winter waterbird survey run by BirdWatch Ireland and funded by NPWS, with counts from September
  to March and a database covering about 25 years, publishing species and site trends.
facts:
- claim: Each winter close to 500 volunteers, NPWS rangers and BirdWatch Ireland staff survey waterbird
    populations and wetland sites across the Republic of Ireland.
  url: https://birdwatchireland.ie/13101-2
  fetched: 2026-11-09
  quote: Each winter close to 500 skilled volunteers, NPWS Rangers and BirdWatch Ireland staff survey
    waterbird populations and wetland sites across the Republic of Ireland.
- claim: Its database holds information on waterbirds from across Ireland over about 25 years, used to
    track species trends and important sites.
  url: https://birdwatchireland.ie/13101-2
  fetched: 2026-11-09
  quote: The I-WeBS database holds detailed information on waterbirds from across Ireland over the last
    25 years.
- claim: Each winter over 400 volunteers, NPWS rangers and BirdWatch Ireland staff monitor wintering waterbirds
    at wetland sites across the Republic of Ireland.
  url: https://birdwatchireland.ie/our-work/surveys-research/research-surveys/irish-wetland-bird-survey/
  fetched: 2026-11-09
  quote: Each winter over 400 skilled volunteers, NPWS Rangers and BirdWatch Ireland staff monitor wintering
    waterbird populations at their wetland sites across the Republic of Ireland.
- claim: Counts run from September to March, at sites from wet grasslands to large estuaries.
  url: https://birdwatchireland.ie/our-work/surveys-research/research-surveys/irish-wetland-bird-survey/
  fetched: 2026-11-09
  quote: I-WeBS counters record waterbirds at wetland sites across the country during the winter ‘non-breeding’
    season (September to March).
- claim: Publishes national species trends, trends by site and site peak counts, and takes requests for
    more detailed data.
  url: https://birdwatchireland.ie/our-work/surveys-research/research-surveys/irish-wetland-bird-survey/
  fetched: 2026-11-09
  quote: Population trends of waterbird species monitored through I-WeBS.
