  Wildlife Alliance.
facts:
- claim: A Prince Albert II of Monaco Foundation page for a 2018–2020 follow-on project describes
    WWF Greece’s CYCLADES project as implemented from 2013 with EU LIFE and Foundation support.
  url: https://www.fpa2.org/en/projets/securing-gyaros-mpa-sustainibility-through-pioneer-remote-surveillance-system-00496
  fetched: '2026-11-03'
  quote: WWF Greece's CYCLADES project that has been implemented since 2013 with the generous
    support of the European Commission (LIFE funding instrument) and the Prince Albert II
    of Monaco Foundation
- claim: iefimerida reports that WWF Greece installed the Gyaros remote surveillance system
    in 2015, using radar, an infrared camera and a drone.
  url: https://www.iefimerida.gr/ellada/gyaros-mnimonio-fylaxi-prostasia-thalassia-periohi
  fetched: '2026-11-03'
  quote: Το συγκεκριμένο σύστημα έχει εγκατασταθεί στο νησί από το WWF Ελλάς το 2015
- claim: Its forests report says it develops tools, with the university community, for continuous
    monitoring of the state of Greece's forests, with emphasis on burnt forest land.
  url: https://contentarchive.wwf.gr/forests/axis2.html
  fetched: '2026-11-03'
  quote: Το WWF Ελλάς σε συνεργασία με την πανεπιστημιακή κοινότητα και με την υποστήριξη
    ενεργών πολιτών, αναπτύσσει τα απαραίτητα εργαλεία για τη συνεχή παρακολούθηση της κατάστασης
    του δασικού πλούτου της χώρας.
- claim: Says it used satellite imagery to detect land cover change and assess fire effects,
    working with the Laboratory of Forest Management and Remote Sensing at Aristotle University
    of Thessaloniki.
  url: https://contentarchive.wwf.gr/forests/axis2.html
  fetched: '2026-11-03'
  quote: Στη δράση αυτή συνεργαστήκαμε με το Εργαστήριο Δασικής Διαχειριστικής και Τηλεπισκόπησης,
    του Τμήματος Δασολογίας και Φυσικού Περιβάλλοντος του Αριστοτελείου Πανεπιστημίου Θεσσαλονίκης
    (ΑΠΘ).
- claim: Published historical and recent land cover mapping of Greece on Oikoskopio, its web
    application.
  url: https://contentarchive.wwf.gr/forests/axis2.html
  fetched: '2026-11-03'
  quote: Αποτυπώθηκαν στο χάρτη του Οικοσκοπίου , τη διαδικτυακή εφαρμογή του WWF Ελλάς, η
    ιστορική και πρόσφατη καταγραφή των καλύψεων γης στην Ελλάδα .
- claim: The MAVA Foundation lists it among its partners.
  url: https://mava-foundation.org/partners/
  fetched: '2026-11-03'
  quote: WWF Greece
- claim: NECCA says WWF Greece installed the Gyaros surveillance system in 2015.
  url: https://necca.gov.gr/nea-anakoinoseis-deltia-typou/systima-apomakrismenis-fylaxis-gyaros/
  fetched: 2026-11-03
  quote: Το σύστημα αυτό έχει εγκατασταθεί στη Γυάρο από το WWF Ελλάς το 2015
- claim: Coordinates the Greek Wildlife Alliance initiative.
  url: https://greekwildlifealliance.gr/en/the-alliance/
