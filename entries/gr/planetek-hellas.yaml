summary: Company contracted by ESA to deliver the data hub for Greece's planned Earth observation
  satellites, and prime contractor for a safety and security service including wildfire analysis.
facts:
- claim: Contracted by ESA to deliver the hub that processes and distributes data from Greece's
    planned Earth observation satellites.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: Planetek will deliver an integrated end-to-end hub capable of processing and disseminating
    data generated by the Earth observation satellites that Greece plans to launch.
- claim: Prime contractor for the safety and security service, which includes wildfire analysis
    and surveillance.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: Planetek Hellas as prime contractor, with sub-contractors NTUA, NOA, FORTH, KEMEA
    and KETYAK, to implement the safety and security service, focusing on flood risk assessment,
    wildfire analysis and surveillance
- claim: Developed PARC-Archipelago in cooperation with the Archipelagos Institute.
  url: https://www.planetek.gr/projects/parc_archipelago
  fetched: 2026-11-03
  quote: Planetek Hellas in cooperation with Archipelagos Institute has developed PARC-Archipelago
- claim: The project monitored Posidonia oceanica seagrass beds around Arki island with IKONOS,
    Landsat and MERIS satellite images.
  url: https://www.planetek.gr/projects/parc_archipelago
  fetched: 2026-11-03
  quote: The specific project is about monitoring Posidonia Oceanica seagrass beds in East
    Greece and specifically the area around the Arki island, by using satellite images (IKONOS,
    LANDSAT, MERIS).
