summary: A Greek sea turtle conservation society that has recorded loggerhead nesting every
  summer since 1983 and, with partners, had fitted 150 satellite and GSM tags by March 2025.
facts:
- claim: By March 2025, ARCHELON and its partners had placed 150 satellite and GSM tags on
    sea turtles since 2002, mostly in Greece, with one in Syria.
  url: https://archelon.gr/en/news/150-satellite-tags-for-the-protection-of-sea-turtles-1
  fetched: '2026-11-03'
  quote: Since then, ARCHELON and its partners have placed 150 satellite and GSM tags on sea
    turtles in various areas of Greece.
- claim: In summer 2024 it tagged 20 turtles at nesting areas as part of the LIFE MareNatura
    project.
  url: https://archelon.gr/en/news/150-satellite-tags-for-the-protection-of-sea-turtles-1
  fetched: '2026-11-03'
  quote: In the summer of 2024, as part of the LIFE MareNatura project, ARCHELON installed
    satellite tags on 20 turtles in various nesting areas.
- claim: In March 2025, ARCHELON named Aliki Panagopoulou as its head of research activities.
  url: https://archelon.gr/en/news/150-satellite-tags-for-the-protection-of-sea-turtles-1
  fetched: '2026-11-03'
  quote: says Aliki Panagopoulou (PhD), Head of Research Activities at ARCHELON
- claim: Has systematically recorded loggerhead nesting activity and protected nests on Greece's
    most important nesting beaches every summer since 1983.
  url: https://archelon.gr/en/who-we-are
  fetched: '2026-11-03'
  quote: ARCHELON has been systematically recording the nesting activity of the loggerhead
    sea turtles and protecting their nests on the most important nesting beaches in Greece,
    every summer since 1983.
- claim: Set up the nationwide Sea Turtle Rescue Network in 1991, which records sea turtle
    strandings.
  url: https://archelon.gr/en/who-we-are
  fetched: '2026-11-03'
  quote: The nationwide Sea Turtle Rescue Network was established by ARCHELON in 1991 and
    has been recording sea turtle strandings with the help of port authorities and citizens
    ever since.
- claim: Fitted satellite transmitters to 20 turtles on nesting beaches in the Peloponnese
    and Crete in July 2024, within LIFE MareNatura, in which it is a partner.
  url: https://archelon.gr/en/what-we-do/monitoring
  fetched: '2026-11-03'
  quote: In July 2024 ARCHELON's team of researchers successfully completed the placement
    of satellite transmitters on 20 sea turtles located on the nesting beaches of Western
    and Southern Peloponnese and Crete.
- claim: The MAVA Foundation lists ARCHELON among its direct partners that received funding
    between 1994 and 2022.
  url: https://mava-foundation.org/partners/
  fetched: '2026-11-03'
  quote: The Sea Turtle Protection Society of Greece (ARCHELON)
- claim: Researchers and volunteers tag and identify nesting females on beaches in Zakynthos,
    the Peloponnese and Crete.
  url: https://archelon.gr/en/what-we-do/monitoring
  fetched: 2026-11-03
  quote: At the nesting beaches of Zakynthos, Peloponnese and Crete ARCHELON researchers/volunteers
    tag and identify nesting females, following international protocols for the species.
- claim: Fitted satellite transmitters to 20 sea turtles in July 2024 within LIFE MareNatura.
  url: https://archelon.gr/en/what-we-do/monitoring
  fetched: 2026-11-03
  quote: In July 2024 ARCHELON's team of researchers successfully completed the placement
    of satellite transmitters on 20 sea turtles
