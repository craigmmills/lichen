summary: Pilot that installed two autonomous camera prototypes near possible monk seal caves on Greek
  Ionian islands in early 2018, with footage to be analysed by AI, built by the Octopus Foundation.
facts:
- claim: In early 2018, two autonomous surveillance camera prototypes were installed near two potential
    monk seal caves on the Greek Ionian islands.
  url: https://www.iucn.org/news/mediterranean/201903/when-artificial-intelligence-spots-monk-seal
  fetched: '2026-11-03'
  quote: two autonomous surveillance camera prototypes were installed in the areas of two different potential
    monk seal caves on the Greek Ionian islands
- claim: Drones using image recognition tried to locate and film the seals, and the footage was to be
    analysed by an AI recognition system.
  url: https://www.iucn.org/news/mediterranean/201903/when-artificial-intelligence-spots-monk-seal
  fetched: '2026-11-03'
  quote: Using image recognition technology, a fleet of aerial drones attempted to locate and film the
    elusive monk seal individuals.
- claim: IUCN describes it as the first open-source autonomous system to monitor monk seals in a remote
    place.
  url: https://www.iucn.org/news/mediterranean/201903/when-artificial-intelligence-spots-monk-seal
  fetched: '2026-11-03'
  quote: This is the first open source and autonomous system to monitor Monk seals in a remote place.
