summary: Wildfire-monitoring system of four thermal infrared satellites, a ground station in Greece and
  OroraTech's platform, whose launch OroraTech announced in May 2026.
facts:
- claim: OroraTech announced the launch and deployment of four wildfire monitoring satellites for Greece
    in May 2026.
  url: https://ororatech.com/resources/news-blog/greece-launches-world-s-first-national-wildfire-satellite-system
  fetched: '2026-11-03'
  quote: today announced the successful launch and deployment of the Hellenic Fire System, four dedicated
    wildfire monitoring satellites for Greece
- claim: The system is four satellites with thermal infrared cameras, a ground station in Greece and OroraTech's
    Wildfire Solution platform.
  url: https://ororatech.com/resources/news-blog/greece-launches-world-s-first-national-wildfire-satellite-system
  fetched: '2026-11-03'
  quote: The system consists of four satellites equipped with advanced thermal infrared cameras, a ground
    station located in Greece, and OroraTech's Wildfire Solution platform integrated into the country's
    emergency services programs.
- claim: Part of the Small-Satellites project of Greece's National Recovery and Resilience Plan, funded
    by the EU Recovery and Resilience Facility.
  url: https://ororatech.com/resources/news-blog/greece-launches-world-s-first-national-wildfire-satellite-system
  fetched: '2026-11-03'
  quote: The project is part of the National Recovery and Resilience Plan 'Greece 2.0', which is funded
    by the Recovery and Resilience Facility (RRF), core programme of the European Union-NextGenerationEU.
- claim: ESA describes it as a world first for a national satellite capability dedicated to wildfire detection
    and tracking.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: A constellation of four new satellites has been launched for Greece, marking a world first for
    a national satellite capability dedicated to wildfire detection and tracking.
- claim: Intended for detection, monitoring and characterisation of fire activity, with systematic coverage
    across Greece.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: reliable detection, monitoring and characterisation of fire activity, with systematic coverage
    across the country
- claim: Each satellite carries two infrared imagers to detect active fires, identify thermal anomalies
    and assess fire radiative intensity.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: The satellites carry two infrared imagers operating in the midwave and longwave infrared spectral
    bands
- claim: At the time of the article OroraTech was commissioning the constellation for service within a
    few months.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: 2026-11-03
  quote: The constellation is now being closely monitored by OroraTech, who will ensure that the satellites
    are fully commissioned and ready for service in a few months.
