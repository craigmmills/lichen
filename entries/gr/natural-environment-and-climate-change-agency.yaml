summary: Greek protected-area agency created by Law 4685/2020, with 24 management units covering
  the 446 Natura 2000 sites, which monitors species and habitats and funded a 330,000 euro
  research programme, as reported by CNN Greece.
facts:
- claim: Established by Law 4685/2020 as part of the National System of Governance of Protected
    Areas.
  url: https://necca.gov.gr/en/n-e-c-c-a
  fetched: '2026-11-03'
  quote: the National System of Governance of Protected Areas is defined and the Natural Environment
    and Climate Change Agency (N.E.C.C.A.) is established
- claim: Aims to implement the policy of the Ministry of Environment and Energy for managing
    protected areas.
  url: https://necca.gov.gr/en/n-e-c-c-a
  fetched: '2026-11-03'
  quote: N.E.C.C.A aims to implement the policy formulated by the MEEN for the management
    of protected areas.
- claim: The 36 former protected area management bodies were integrated into it as 24 Protected
    Area Management Units.
  url: https://necca.gov.gr/en/n-e-c-c-a
  fetched: '2026-11-03'
  quote: are integrated into N.E.C.C.A. as 24 Protected Area Management Units (PAMUs) operating
    at a department level
- claim: CNN Greece reported on 30 January 2023 that the Hellenic Foundation for Research
    and Innovation approved 32 research projects on endemic and threatened Greek species under
    an agreement with NECCA, in a 330,000 euro programme of field studies funded by NECCA.
  url: https://www.cnn.gr/perivallon/story/348031/prostasia-tis-viopoikilotitas-egkrisi-32-ergon-gia-tin-erevna-ton-apeiloymenon-eidon-tis-elladas
  fetched: '2026-11-03'
  quote: «Μελέτες πεδίου ενδημικών, απειλούμενων και εθνικής σημασίας ειδών της Ελλάδας»,
    συνολικού προϋπολογισμού 330.000 ευρώ , που χρηματοδοτείται από τον ΟΦΥΠΕΚΑ
- claim: LIFE MareNatura describes it as a private-law legal entity supervised by the Ministry
    of Environment and Energy, implementing ministry policy on protected areas and biodiversity.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: The Natural Environment and Climate Change Agency of Greece (NECCA) is a Legal Entity
    of Private Law supervised by the Ministry of Environment and Energy
- claim: Its 24 Protected Area Management Units cover the 446 sites of the Natura 2000 network.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: its 24 decentralized Protected Area Management Units operate throughout the country,
    covering the 446 sites of the Natura 2000 network
- claim: Conducts scientific research and monitoring of species and habitats.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: Conducts scientific research and monitoring of species and habitats.
- claim: Its own site lists the 24 management units of national parks and protected areas.
  url: https://necca.gov.gr
  fetched: '2026-11-03'
  quote: 24. Μ.Δ. Προστατευόμενων Περιοχών Νότιας Πελοποννήσου
- claim: Its founding law of 2020 set up 24 Protected Areas Management Units covering all
    of Greece's protected areas.
  url: https://necca.gov.gr/en/areas-of-action/protected-areas/
  fetched: 2026-11-03
  quote: N.E.C.C.A.’s founding law 4685/2020 established twenty-four (24) Protected Areas
    Management Units (PAMUs) which operate at the department level.
- claim: Acts as the central coordinating body for governing and managing the natural environment.
  url: https://necca.gov.gr/en/areas-of-action/protected-areas/
  fetched: 2026-11-03
  quote: N.E.C.C.A. assumes the role of a central coordinating body for the governance and
    management of the natural environment.
- claim: Implements and operates the information management system for protected-area policy.
  url: https://necca.gov.gr/en/areas-of-action/protected-areas/
  fetched: 2026-11-03
  quote: the Information Management System of the policy for PAs which is implemented and
    operated by N.E.C.C.A
- claim: Address in Athens.
  url: https://necca.gov.gr/en/areas-of-action/protected-areas/
  fetched: 2026-11-03
  quote: Leoforos Mesogeion 207 Athens 115 25
