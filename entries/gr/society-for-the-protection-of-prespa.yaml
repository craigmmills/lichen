summary: Conservation society with long-term waterbird monitoring using drone photography,
  Pelican Watch and Follow the Pelican apps, and funding from MAVA and the Aage V. Jensen
  Charity Foundation.
facts:
- claim: Runs a long-term programme monitoring waterbird populations, using drone photography
    of colonies among other methods.
  url: https://spp.gr/project/waterbird-monitoring/
  fetched: '2026-11-03'
  quote: The programme uses a combination of methods, such as drone photography of colonies,
    counting birds flying to-and-from breeding colonies, monitoring feeding sites
- claim: Says its monitoring results are used by stakeholders and the protected area Management
    Unit in management decisions.
  url: https://spp.gr/project/waterbird-monitoring/
  fetched: '2026-11-03'
  quote: they continue to be used by different relevant stakeholders and the Management Unit
    when taking management decisions
- claim: Its programme aims include continuing pelican monitoring and conservation at Prespa
    and giving technical support to partners monitoring other breeding colonies in Greece
    and the Balkans.
  url: https://spp.gr/project/conservation-pelekanon/
  fetched: '2026-11-03'
  quote: η συνέχιση του έργου παρακολούθησης και διατήρησης των πελεκάνων στην Πρέσπα
- claim: Its Pelican Watch app lets users record pelican feeding success and register ringed
    birds.
  url: https://spp.gr/resources/spp-apps/
  fetched: '2026-11-03'
  quote: users can record the feeding success of pelicans, observe and register ringed birds
- claim: Its Follow the Pelican app shows the routes of tracked pelicans across the Balkan
    Peninsula in real time.
  url: https://spp.gr/resources/spp-apps/
  fetched: '2026-11-03'
  quote: you can track in real time the routes of pelicans as they travel from wetland to
    wetland across the Balkan Peninsula
- claim: Under Pelican Way of LIFE, led by Rewilding Europe, it trained protected-area staff
    in pelican monitoring and Hellenic Ornithological Society staff in marking birds and fitting
    transmitters.
  url: https://spp.gr/project/conservation-pelekanon/
  fetched: '2026-11-03'
  quote: το Pelican Way of LIFE, υπό την ηγεσία του Rewilding Europe και με την υποστήριξη
    της Ελληνικής Ορνιθολογικής Εταιρείας (ΕΟΕ)
- claim: Names the MAVA Foundation and the Aage V. Jensen Charity Foundation as long-standing
    investors, and WWF Greece and Tour du Valat as member organisations.
  url: https://spp.gr/ourstory/
  fetched: '2026-11-03'
  quote: the longstanding investments made by the Swiss MAVA Foundation and the Aage V. Jensen
    Charity Foundation from Denmark have crucially allowed the SPP to build and follow a stable
    long-term strategic path
