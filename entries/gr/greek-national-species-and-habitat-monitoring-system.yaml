summary: Planned national monitoring system in Greece's Recovery and Resilience Plan, with uniform protocols
  for species and habitats and surveillance plans for all 446 protected sites.
facts:
- claim: A February 2024 document on the NECCA site describes the project as including uniform scientific
    monitoring protocols for species groups and habitat types, with permanent systematic annual sampling.
  url: https://necca.gov.gr/wp-content/uploads/2024/02/9%CE%A6%CE%96%CE%9446%CE%9C%CE%91%CE%96%CE%A4-%CE%A3%CE%97%CE%A9.pdf
  fetched: '2026-11-03'
  quote: την κατάρτιση ομοιόμορφων πρωτοκόλλων επιστημονικής παρακολούθησης για τις διάφορες ομάδες ειδών
    και φυσικών τύπων οικοτόπων
- claim: The February 2024 document plans purchases of monitoring equipment including radar, high-definition
    cameras, drones and bioacoustic recorders, and use of remote sensing and Internet of Things technologies.
  url: https://necca.gov.gr/wp-content/uploads/2024/02/9%CE%A6%CE%96%CE%9446%CE%9C%CE%91%CE%96%CE%A4-%CE%A3%CE%97%CE%A9.pdf
  fetched: '2026-11-03'
  quote: εξοπλισμού παρακολούθησης με τη χρήση νέων τεχνολογιών (ραντάρ, κάμερες υψηλής ευκρίνειας, drone,
    βιοακουστικές καταγραφικές συσκευές)
- claim: Plans a digital store for collecting, processing and storing 20,000 satellite data items, and
    products such as vegetation indices and land cover maps.
  url: https://necca.gov.gr/wp-content/uploads/2024/02/9%CE%A6%CE%96%CE%9446%CE%9C%CE%91%CE%96%CE%A4-%CE%A3%CE%97%CE%A9.pdf
  fetched: '2026-11-03'
  quote: παραγωγή προϊόντων όπως δείκτες βλάστησης, χάρτες κάλυψης γης, αλλαγές στο φυσικό περιβάλλον
- claim: Included in the Greek Recovery and Resilience Plan, Greece 2.0.
  url: https://necca.gov.gr/wp-content/uploads/2024/02/9%CE%A6%CE%96%CE%9446%CE%9C%CE%91%CE%96%CE%A4-%CE%A3%CE%97%CE%A9.pdf
  fetched: '2026-11-03'
  quote: οποίο έχει ενταχθεί στο Εθνικό Σχέδιο Ανάκαμψης και Ανθεκτικότητας «Ελλάδα 2.0»
- claim: Covers uniform scientific monitoring protocols for species groups and habitat types, with permanent
    systematic sampling each year.
