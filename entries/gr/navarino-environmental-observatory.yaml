summary: Collaboration between Stockholm University, BRFAA and TEMES, with a Costa
  Navarino field station, water monitoring stations and planned fish, benthic and
  bird monitoring.
facts:
- claim: Described as a collaboration between Stockholm University, the Biomedical
    Research Foundation of the Academy of Athens and the Tourism Enterprises of Messinia
    S.A.
  url: https://www.lter-greece.gr/sites/navarino-environmental-observatory/
  fetched: 2026-11-09
  quote: The Navarino Environmental Observatory (NEO) is a collaboration between Stockholm
    University , the Biomedical Research Foundation of the Academy of Athens (BRFAA)
    and the Tourism Enterprises of Messinia S.A. (TEMES)
- claim: Its field station is at Costa Navarino; the page gives the location as 'Messina',
    while elsewhere identifying the area as Messinia.
  url: https://www.lter-greece.gr/sites/navarino-environmental-observatory/
  fetched: 2026-11-09
  quote: NEO Field Station is located at Costa Navarino, Messina, Greece
- claim: Its monitoring equipment includes water monitoring stations in transitional
    waters and groundwater, with seasonal fish and benthic sampling and monthly bird
    monitoring planned.
  url: https://www.lter-greece.gr/sites/navarino-environmental-observatory/
  fetched: 2026-11-09
  quote: several water monitoring stations in transitional waters (Conductivity, Temperature,
    Depth, Dissolved Oxygen, Redox potential, pH) and groundwater (CTD)
- claim: Bird responses to hydrological changes are to be monitored monthly in the
    breeding period.
  url: https://www.lter-greece.gr/sites/navarino-environmental-observatory/
  fetched: 2026-11-09
  quote: Birds response to hydrological changes, especially during the breeding period
    (Apr-Jul), will be monitored on a monthly basis.
- claim: A member of LTER-Greece.
  url: https://www.lter-greece.gr/sites/navarino-environmental-observatory/
  fetched: 2026-11-09
  quote: and LTER-Greece , the Greek Long-term Ecosystem Research Network
