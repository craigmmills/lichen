summary: Programme funded by the EU Recovery and Resilience Facility, under which ESA signed six contracts
  for services monitoring agriculture, forests, water, land, and safety and security.
facts:
- claim: ESA signed six contracts under the programme for services to monitor agriculture, forests, water,
    land, and safety and security.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: the monitoring of agriculture, forests, water, land, and for safety and security
- claim: The forest monitoring service went to Aristotle University of Thessaloniki as prime with Geosystems
    Hellas as co-prime.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: Aristotle University of Thessaloniki as prime contractor with Geosystems Hellas as co-prime contractor,
    and sub-contractors NERCO and MPLegal, to implement the forest monitoring service
- claim: The land monitoring service, covering land use and land cover mapping, went to Geosystems Hellas
    as prime with FORTH and NOA as co-primes.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: Geosystems Hellas as prime contractor with FORTH and NOA as co-prime contractors
- claim: Planetek Hellas holds the contract for the governmental hub that processes and distributes the
    satellite data.
  url: https://www.esa.int/Applications/Observing_the_Earth/ESA_signs_contracts_advancing_Greece_s_Earth_observation_capabilities
  fetched: '2026-11-03'
  quote: Planetek Hellas, with sub-contractors Space Hellas, Neuropublic and Knowledge, for the governmental
    hub of the Greek satellite constellation.
- claim: Funded by the European Union's Recovery and Resilience Facility.
  url: https://hsc.gov.gr/about/the-activities-of-the-agency/national-microsatellite-program/
  fetched: 2026-11-03
  quote: Είναι χρηματοδοτούμενο από τον Μηχανισμό Ανάκαμψης και Ανθεκτικότητας της Ευρωπαϊκής Ένωσης
- claim: Includes a programme to develop a constellation of 13 Earth observation microsatellites; the
    page says some optical satellites are still awaiting launch.
  url: https://hsc.gov.gr/about/the-activities-of-the-agency/national-microsatellite-program/
  fetched: 2026-11-03
  quote: Σμήνος 13 επιχειρησιακών μικροδορυφόρων Παρατήρησης Γης
- claim: One aim is to meet the Greek public sector's needs for Earth observation services and products
    from space.
  url: https://hsc.gov.gr/about/the-activities-of-the-agency/national-microsatellite-program/
  fetched: 2026-11-03
  quote: Η κάλυψη των αναγκών του ελληνικού δημοσίου σε υπηρεσίες και προϊόντα παρατήρησης της Γης από
    το διάστημα.
- claim: The page says the four thermal satellites have been in orbit since 3 May 2026 and the two radar
    satellites since 28 October 2025.
  url: https://hsc.gov.gr/about/the-activities-of-the-agency/national-microsatellite-program/
  fetched: 2026-11-03
  quote: 'Κατάσταση δορυφόρων: Σε τροχιά από τις 03-05-2026'
