summary: Project using multimodal sensing and 3D forest models for early wildfire detection and forecasting;
  it has completed its final technical review, demonstrating AI models for wildfire and smoke detection.
facts:
- claim: Uses continuous multimodal sensing for early wildfire detection, evolution forecasting and assessment.
  url: https://dryads.scanlab.gr/
  fetched: 2026-11-03
  quote: Dryads uses continuous multimodal sensing to extract microclimate profiles, identify anthropogenic
    risk factors and sources of high environmental risk to enable early wildfire detection, evolution
    forecasting and assessment.
- claim: Builds 3D geospatial models of forest areas from IoT time series, drone imagery and forest parameters.
  url: https://dryads.scanlab.gr/
  fetched: 2026-11-03
  quote: Create accurate 3D geospatial models of forest areas by integrating time series IoT data, drone
    imagery, and forest parameters
- claim: The project has completed its final technical review, where it demonstrated AI models for wildfire
    and smoke detection.
  url: https://dryads.scanlab.gr/
  fetched: 2026-11-03
  quote: We recently completed the final technical review of the Dryads Project, supported by the ICLEI
    Europe Action Fund and Google.org.
