    αιχμής δημιουργούν ένα σύστημα καταγραφής και παρακολούθησης απειλούμενων ζώων
- claim: Says 18 sound recorders ran around the clock from July 2019 to January 2020 in Natura
    and wildlife refuge areas of the Rodopi Mountain Range National Park.
