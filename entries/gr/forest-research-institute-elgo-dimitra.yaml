  url: https://www.agres.elgo.gr/el/institute-forest-research
  fetched: 2026-11-03
  quote: Διευθυντής του είναι ο Δρ Σ. Καζαντζίδης, Διευθυντής Ερευνών.
- claim: In January 2023, ELGO-DIMITRA said its Forest Research Institute researchers were
    creating a system to record and monitor threatened animals and human activities in Greek
    protected areas.
