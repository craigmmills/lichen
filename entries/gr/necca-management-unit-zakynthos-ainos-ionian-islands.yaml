summary: Management unit run by the Natural Environment and Climate Change Agency,
  which monitors loggerhead nesting with ARCHELON and plans monitoring using unmanned
  vehicles, video cameras and hydrophones.
facts:
- claim: Monitors loggerhead turtle nesting each year, recording nests by GPS, in
    cooperation with ARCHELON.
  url: https://necca.gov.gr/mdpp/m-d-ethnikon-parkon-zakynthou-ainou-kai-prostatevomenon-periochon-ionion-nison/
  fetched: 2026-11-09
  quote: Το πρόγραμμα αυτό υλοποιείται κάθε χρόνο σε συνεργασία με τον ΑΡΧΕΛΩΝ – Σύλλογο
    για την Προστασία της Θαλάσσιας Χελώνας.
- claim: Records and monitors biodiversity in its protected areas through its own
    staff and outside collaborators, and maps habitats of Community interest.
  url: https://necca.gov.gr/mdpp/m-d-ethnikon-parkon-zakynthou-ainou-kai-prostatevomenon-periochon-ionion-nison/
  fetched: 2026-11-09
  quote: Καταγραφή και παρακολούθηση της βιοποικιλότητας των προστατευόμενων περιοχών
    από το προσωπικό της Μονάδας Διαχείρισης κι εξωτερικούς συνεργάτες
- claim: Lists planned monitoring of turtle nesting and feeding beaches with unmanned
    vehicles and creation of GIS infrastructure for the monitoring data.
  url: https://necca.gov.gr/mdpp/m-d-ethnikon-parkon-zakynthou-ainou-kai-prostatevomenon-periochon-ionion-nison/
  fetched: 2026-11-09
  quote: με τη χρήση μη επανδρωμένων οχημάτων και δημιουργία υποδομής για την καταγραφή
    των δεδομένων παρακολούθησης με GIS
- claim: Lists planned monitoring of monk seal caves with wildlife video cameras.
  url: https://necca.gov.gr/mdpp/m-d-ethnikon-parkon-zakynthou-ainou-kai-prostatevomenon-periochon-ionion-nison/
  fetched: 2026-11-09
  quote: Παρακολούθηση ενδιαιτημάτων (σπηλαίων) της μεσογειακής φώκιας μοναχού Monachus
    monachus με ειδικές βιντεοκάμερες για την άγρια πανίδα
