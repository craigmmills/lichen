summary: Project that deployed acoustic sensors linked to cloud AI in the Aoos Gorge to detect poachers'
  gunshots; Huawei reported in August 2021 more than five gunshots recorded since April.
facts:
- claim: Guardian acoustic sensors networked to cloud AI were deployed in the Aoos Gorge to detect gunshots
    of poachers targeting wolves, bears and Balkan chamois.
  url: https://blog.huawei.com/2021/08/10/tech4all-wolves-aoos-gorge/
  fetched: '2026-11-03'
  quote: Nature Guardians – acoustics sensors networked to cloud AI – have been deployed to detect the
    gunshots of poachers and hunters who target local wildlife
- claim: Huawei reported in August 2021 that the AI recognised sounds such as chainsaws, trucks and gunshots
    and sent alerts to forest rangers.
  url: https://blog.huawei.com/2021/08/10/tech4all-wolves-aoos-gorge/
  fetched: '2026-11-03'
  quote: Trained to recognise certain sounds, such as the chainsaws of illegal logging, trucks, and gunshots,
    AI analytics sends an alert to forest rangers if a threat is detected.
- claim: Huawei reported in August 2021 that more than five gunshots had been recorded since deployment
    in April.
  url: https://blog.huawei.com/2021/08/10/tech4all-wolves-aoos-gorge/
  fetched: '2026-11-03'
  quote: Since deployment in April, more than five gunshots have been recorded
