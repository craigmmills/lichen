id: gyaros-remote-surveillance-system
kind: project
name: Gyaros marine protected area remote surveillance system
also_known_as:
- Securing Gyaros MPA sustainibility through pioneer remote surveillance system
scope: gr
ai_label: conservation-tech
realms:
- ocean
countries:
- gr
status: closed
summary: Closed project (2018 to 2020) continuing remote surveillance of the Gyaros marine protected area
  against illegal activity, using radar, an infrared camera and a drone.
facts:
- claim: The project to secure the Gyaros MPA through continued remote surveillance ran from January 2018
    to December 2020.
  url: https://www.fpa2.org/en/projets/securing-gyaros-mpa-sustainibility-through-pioneer-remote-surveillance-system-00496
  fetched: '2026-11-03'
  quote: January 2018 - December 2020 / 3 years
- claim: Centred on the continuous operation of a remote surveillance system against illegal activities
    at the site.
  url: https://www.fpa2.org/en/projets/securing-gyaros-mpa-sustainibility-through-pioneer-remote-surveillance-system-00496
  fetched: '2026-11-03'
  quote: This purpose is primarily served by the continuous operation of a state-of-the-art remote surveillance
    system that ensures the active intervention against illegal activities taking place on the site
- claim: Built on WWF Greece's CYCLADES project, supported since 2013 by EU LIFE funding and the Prince
    Albert II of Monaco Foundation.
  url: https://www.fpa2.org/en/projets/securing-gyaros-mpa-sustainibility-through-pioneer-remote-surveillance-system-00496
  fetched: '2026-11-03'
  quote: The project builds on the successful implementation of WWF Greece's CYCLADES project that has
    been implemented since 2013
- claim: iefimerida reports that WWF Greece installed the system on the island in 2015.
  url: https://www.iefimerida.gr/ellada/gyaros-mnimonio-fylaxi-prostasia-thalassia-periohi
  fetched: '2026-11-03'
  quote: Το συγκεκριμένο σύστημα έχει εγκατασταθεί στο νησί από το WWF Ελλάς το 2015
- claim: The system uses radar, an infrared camera and a drone.
  url: https://www.iefimerida.gr/ellada/gyaros-mnimonio-fylaxi-prostasia-thalassia-periohi
  fetched: '2026-11-03'
  quote: με τη χρήση καινοτόμων και τελευταίας τεχνολογίας μέσων (ραντάρ, υπέρυθρη κάμερα, drone)
- claim: Under a memorandum between the environment ministry, the coast guard ministry, NECCA and WWF
    Greece, the system is to be handed to NECCA for use.
  url: https://www.iefimerida.gr/ellada/gyaros-mnimonio-fylaxi-prostasia-thalassia-periohi
  fetched: '2026-11-03'
  quote: θα παραδοθεί προς αξιοποίηση στον ΟΦΥΠΕΚΑ ένα ολοκληρωμένο σύστημα απομακρυσμένης επιτήρησης
    θαλάσσιας περιοχής της Γυάρου
- claim: According to WWF, from 2015 to 2022 the system, with traditional patrols, helped prevent and
    reduce illegal fishing.
  url: https://www.iefimerida.gr/ellada/gyaros-mnimonio-fylaxi-prostasia-thalassia-periohi
  fetched: '2026-11-03'
  quote: Σύμφωνα με τη WWF, κατά το διάστημα 2015-2022, η λειτουργία αυτού του συστήματος απομακρυσμένης
    εποπτείας
- claim: Installed on Gyaros by WWF Greece in 2015 under a memorandum with the environment and shipping
    ministries.
  url: https://necca.gov.gr/nea-anakoinoseis-deltia-typou/systima-apomakrismenis-fylaxis-gyaros/
  fetched: 2026-11-03
  quote: Το σύστημα αυτό έχει εγκατασταθεί στη Γυάρο από το WWF Ελλάς το 2015
- claim: A May 2023 announcement said NECCA would operate, maintain and insure the system under a new
    memorandum, with final acceptance to follow staff training.
  url: https://necca.gov.gr/nea-anakoinoseis-deltia-typou/systima-apomakrismenis-fylaxis-gyaros/
  fetched: 2026-11-03
  quote: η λειτουργία, συντήρηση καθώς και η ασφάλιση του συστήματος επιτήρησης θα πραγματοποιείται από
    τον ΟΦΥΠΕΚΑ
