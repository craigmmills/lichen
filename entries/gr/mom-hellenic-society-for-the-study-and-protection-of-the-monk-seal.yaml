summary: Non-profit monk seal society that set up a sightings network in 1991 with more than
  4,500 sightings, and says it was first in the Mediterranean to use remote monitoring in
  seal caves.
facts:
- claim: Set up the Hellenic Monk Seal Rescue and Information Network in 1991 to collect monk
    seal sightings from across Greece; the network has registered more than 4,500 sightings.
  url: https://www.mom.gr/achievements
  fetched: '2026-11-03'
  quote: In 1991, ΜΟm established the Hellenic Monk Seal Rescue and Information Network (
    RINT ) in order to collect and evaluate information of monk seal sightings from throughout
    Greece.
- claim: Says its research team was the first in the Mediterranean to systematically use automatic
    and remote-controlled monitoring systems to study monk seals in marine caves.
  url: https://www.mom.gr/achievements
  fetched: '2026-11-03'
  quote: The research team of MOm was the first in the Mediterranean Sea to systematically
    use automatic and remote-controlled monitoring systems
- claim: Established the Mediterranean Monk Seal Sample Bank, with more than 2,000 tissue
    samples from more than 140 seals.
  url: https://www.mom.gr/achievements
  fetched: '2026-11-03'
  quote: MOm has established the Mediterranean Monk Seal Sample Bank , a unique biological
    collection with more than 2,000 tissue samples from more than 140 individual monk seals.
- claim: MEDASSET reported in June 2025 that the MOm team installed a solar-powered remote
    camera system in Zone A around Piperi Island for continuous monitoring of monk seals,
    as part of LIFE MareNatura fieldwork.
  url: https://medasset.org/?p=34927
  fetched: '2026-11-03'
  quote: the MOm team installed a remote camera system powered by solar panels
- claim: Says its research team was the first in the Mediterranean to use automatic and remote-controlled
    monitoring systems systematically to study monk seals in marine caves.
  url: https://www.mom.gr/achievements
  fetched: '2026-11-03'
  quote: The research team of MOm was the first in the Mediterranean Sea to systematically
    use automatic and remote-controlled monitoring systems to study the cryptic behavior of
    Mediterranean monk seals in their inaccessible marine caves.
- claim: LIFE MareNatura describes it as a non-profit association, a member of IUCN since
    1996.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: Since 1996, MOm has been a member of IUCN
- claim: Set up the Hellenic Monk Seal Rescue and Information Network in 1991 to collect sightings;
    it has more than 2,000 members and more than 4,500 sightings.
  url: https://www.mom.gr/achievements
  fetched: 2026-11-03
  quote: The Network has currently more than 2,000 members and has registered more than 4,500
    monk seal sightings.
