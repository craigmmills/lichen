facts:
- claim: Implemented by twelve organisations with the Ministry of Environment and Energy as coordinating
    beneficiary.
  url: https://necca.gov.gr/en/erga/sustainable-development-and-climate-change/integrated-actions-for-the-conservation-and-management-of-natura-2000-network-sites-species-habitats-and-ecosystems-in-greece/
  fetched: 2026-11-03
  quote: It is implemented by a partnership of twelve (12) organisations, with the Ministry of Environment
    and Energy as coordinating beneficiary
- claim: Includes mapping and assessing ecosystems and their services across all Natura 2000 sites in
    Greece.
  url: https://necca.gov.gr/en/erga/sustainable-development-and-climate-change/integrated-actions-for-the-conservation-and-management-of-natura-2000-network-sites-species-habitats-and-ecosystems-in-greece/
  fetched: 2026-11-03
  quote: the mapping and assessment of ecosystems and their services across all Natura 2000 sites in the
    country,
- claim: Includes developing management-support tools such as decision-support systems and webGIS.
  url: https://necca.gov.gr/en/erga/sustainable-development-and-climate-change/integrated-actions-for-the-conservation-and-management-of-natura-2000-network-sites-species-habitats-and-ecosystems-in-greece/
  fetched: 2026-11-03
  quote: the development of innovative management-support tools (DSS, ppGIS/webGIS),
- claim: The Region of Attica describes it as the first LIFE integrated project approved for Greece.
  url: https://www.patt.gov.gr/koinonia/perivallon/life/life_patt/
  fetched: 2026-11-03
  quote: Το LIFE-IP 4 NATURA, το πρώτο ολοκληρωμένο έργο Life (Life Integrated Project – LIFE IP) που
    εγκρίνεται για την Ελλάδα
- claim: One planned action is to ensure the compatibility of existing data for monitoring the Natura
    2000 network at national level.
  url: https://www.patt.gov.gr/koinonia/perivallon/life/life_patt/
  fetched: 2026-11-03
  quote: A2. Διασφάλιση της συμβατότητας και βελτιστοποίηση των προδιαγραφών όλων των υπαρχόντων δεδομένων
    για την παρακολούθηση του δικτύου Natura 2000 σε εθνικό επίπεδο
- claim: Another planned action is to develop and operate a decision support system for managing Natura
    2000 sites.
  url: https://www.patt.gov.gr/koinonia/perivallon/life/life_patt/
  fetched: 2026-11-03
  quote: C3. Ανάπτυξη και Λειτουργία Συστήματος Υποστήριξης Αποφάσεων (DSS) για τη διαχείριση των περιοχών
    Natura 2000
- claim: Runs from December 2017 to May 2029, with a budget of 17 million euros.
  url: https://www.patt.gov.gr/koinonia/perivallon/life/life_patt/
  fetched: 2026-11-03
  quote: 'Διάρκεια Έργου : Δεκέμβριος 2017 – Μάιος 2029'
