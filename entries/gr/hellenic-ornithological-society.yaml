summary: Greek BirdLife partner whose data manager said in 2021 she coordinated all national
  voluntary monitoring schemes and the national Important Bird Areas programme.
facts:
- claim: In a 2021 EBCC interview, its data manager said she coordinated all national voluntary
    monitoring schemes and the national Important Bird Areas programme.
  url: https://www.ebcc.info/wp-content/uploads/2022/02/lehikoinen-portolou-bcn-34-2.pdf
  fetched: '2026-11-03'
  quote: I am the data manager of the Hellenic Ornithological Society / BirdLife Gr eece,
