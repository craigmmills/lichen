- claim: The Hellenic Common Bird Monitoring Scheme began in 2007 and contributes to the Pan-European
    Common Bird Monitoring Scheme dataset, according to the same interview.
  url: https://www.ebcc.info/wp-content/uploads/2022/02/lehikoinen-portolou-bcn-34-2.pdf
  fetched: '2026-11-03'
  quote: The Hellenic Common Bird Monitoring Scheme (HCBM) commenced in 2007
- claim: The Society for the Protection of Prespa says HOS carries out an annual spring census
    of south-east Europe's pelicans, continuing an SPP initiative to estimate the total population.
  url: https://spp.gr/project/conservation-pelekanon/
  fetched: '2026-11-03'
  quote: Η ΕΟΕ έχει επίσης εντάξει στη δράση της την πραγματοποίηση, κάθε άνοιξη, ετήσιας
    απογραφής των πελεκάνων της ΝΑ Ευρώπης.
