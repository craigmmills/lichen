summary: A marine conservation institute monitoring cetaceans, monk seals and sea turtles
  with hydrophones and research vessels, which has partnered with the Norwegian University
  of Life Sciences.
facts:
- claim: Its marine mammal team monitors habitat use, abundance and distribution of cetaceans,
    monk seals and sea turtles.
  url: https://archipelago.gr/el/marine-mammals-internships/
  fetched: '2026-11-03'
  quote: Monitoring the habitat use, abundance and distribution of cetaceans, Mediterrenean
    monk seals and sea turtles.
- claim: Uses a hydrophone to collect acoustic data and is developing an online photo-ID network.
  url: https://archipelago.gr/el/marine-mammals-internships/
  fetched: '2026-11-03'
  quote: Using a hydrophone to collect acoustic data.
- claim: In September 2014, Archipelagos reported that it and the Norwegian University of
    Life Sciences had developed a programme to monitor wild animal behaviour remotely with
    specialised camera systems in the Arki and North Patmos wildlife refuge.
  url: https://archipelago.gr/cooperation-of-archipelagos-and-the-norwegian-university-of-life-sciences/
  fetched: '2026-11-03'
  quote: have developed an innovative research programme to monitor the behaviour of wild
    animals with the use of specialized camera systems to monitor them from a distance
- claim: Its sailing boat Pinelopi carries a towed hydrophone array and a real-time acoustic
    monitoring system for marine mammal research.
  url: https://archipelago.gr/facilities-technology/
  fetched: 2026-11-03
  quote: Aquarian AS-1 hydrophone (20m cable), real-time acoustic monitoring system and a
    marine mammal observation platform
- claim: Its main research vessel carries multibeam sonar, ROV systems, an underwater robotic
    camera system, drones and an autonomous surface vehicle.
  url: https://archipelago.gr/facilities-technology/
  fetched: 2026-11-03
  quote: The Aegean Explorer is equipped with an array of important scientific tools including
    a multibeam sonar, biomass scanner, structure scanner, multiple ROV systems, underwater
    robotic camera system, drones
- claim: Its vessel Naftilos surveyed between Crete, Libya and Malta for the ACCOBAMS Survey
    Initiative.
  url: https://archipelago.gr/facilities-technology/
  fetched: 2026-11-03
  quote: in the framework of the ACCOBAMS Survey Initiative
