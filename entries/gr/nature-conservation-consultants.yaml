summary: Greek consultancy established in 2010 that identifies fauna from photographs, video
  and audio using AI and uses BirdWeather with recording stations along an Aegean migratory
  corridor.
facts:
- claim: Uses artificial intelligence to identify fauna species from photographs, videos and
    audio files.
  url: https://n2c.gr/en/innovation-2/
  fetched: '2026-11-03'
  quote: NCC uses artificial intelligence to identify various species of fauna from recorded
    files, such as photographs, videos, and audio files, as a fully automated and rapid method.
- claim: Uses the BirdWeather platform for automated detection and identification of birds
    by their calls, with recording stations along a migratory corridor in the Aegean.
  url: https://n2c.gr/en/innovation-2/
  fetched: '2026-11-03'
  quote: The use of the BirdWeather platform represents a new and innovative approach, as
    it enables the automated detection and identification of birds through their calls.
- claim: Has fitted more than 100 telemetry transmitters to seabirds and birds of prey in
    Greece.
  url: https://n2c.gr/en/innovation-2/
  fetched: '2026-11-03'
  quote: The NCC team has fitted more than 100 telemetry transmitters to seabirds and birds
    of prey in Greece
- claim: Has an internal team, iNCC, that works with AI, remote sensing and predictive modelling
    for environmental monitoring and nature conservation.
  url: https://n2c.gr/incc/
  fetched: '2026-11-03'
  quote: Η iNCC ασχολείται σε υψηλό επίπεδο με την επεξεργασία δεδομένων με τεχνητή νοημοσύνη.
- claim: LIFE MareNatura describes it as a consultancy set up in 2010 that specialises in
    biodiversity monitoring with radar, drones, bioacoustics and thermal methods.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: It specializes in monitoring of biodiversity with the use of innovative technologies,
    such as radar, drones, bioacoustics and thermal methods.
- claim: Its boat surveys are visual and acoustic, using towed, directional and drifting hydrophones
    and drones.
  url: https://n2c.gr/en/project/brm-marine-environment/
  fetched: 2026-11-03
  quote: The boat surveys are visual and acoustic, using towed and directional hydrophones,
    drifting hydrophones, and drones.
- claim: Recording in colonies uses bioacoustic sensors and automatic cameras for birds and
    seals.
  url: https://n2c.gr/en/project/brm-marine-environment/
  fetched: 2026-11-03
  quote: They also include recordings in colonies with bioacoustic sensors and automatic cameras,
    both for birds and seals.
- claim: Its survey vessel has the infrastructure for eDNA sampling.
  url: https://n2c.gr/en/project/brm-marine-environment/
  fetched: 2026-11-03
  quote: It has the appropriate infrastructure for eDNA sampling.
- claim: Registered in the Greek business register (GEMI).
  url: https://n2c.gr/en/project/brm-marine-environment/
