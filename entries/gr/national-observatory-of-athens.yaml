summary: Greek research centre founded in 1842 with three institutes, including astronomy
  and remote sensing, whose BEYOND unit combines Earth observation and AI and lists fire monitoring
  services.
facts:
- claim: Its Institute for Environmental Research and Sustainable Development says NOA is
    the oldest research centre in Greece and the Balkans and has three institutes.
  url: https://www.iersd.noa.gr/en/?p=13176
  fetched: '2026-11-03'
  quote: The Institute for Environmental Research and Sustainable Development (IERSD) is one
    of the three Institutes of the National Observatory of Athens (NOA)
- claim: The BEYOND Centre of Earth Observation Research, which combines Earth observation
    and AI, is an operational unit of NOA, according to the European Commission.
  url: https://research-and-innovation.ec.europa.eu/events/special-features/science4eu/partners/beyond-advancing-europes-vision-science-serving-society_en
  fetched: '2026-11-03'
  quote: It is an operational unit of the National Observatory of Athens.
- claim: LIFE MareNatura describes it as the first research centre in modern Greece, established
    in 1842, with three institutes.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: The National Observatory of Athens (NOA) is the first Research Center in modern Greece,
    established in 1842
- claim: Its BEYOND operational unit develops research and provides disaster management services
    for south-eastern Europe, the Mediterranean, North Africa, the Middle East and the Balkans.
  url: https://www.astro.noa.gr/en/operational-services/monada-tilepiskopisis-beyond/
  fetched: '2026-11-03'
  quote: The BEYOND operational Unit develops research and provides disaster management services
    addressing priorities and needs in South Eastern Europe, Mediterranean, N. Africa, Middle
    East and the Balkans.
- claim: BEYOND is funded through competitive EU, ESA and national programmes and international
    funders, at 1.2 to 1.5 million euros a year.
  url: https://www.astro.noa.gr/en/operational-services/monada-tilepiskopisis-beyond/
  fetched: '2026-11-03'
  quote: The BEYOND Unit is funded from competitive programs (EU, ESA, National Programs),
    as well as from International Funding Organisations amounting 1.2-1.5 million Euros per
    year.
- claim: The institute's BEYOND page lists a Fire Monitoring Service (FireHub).
