id: greek-national-small-satellite-programme
kind: programme
name: Greek National Small Satellite Programme
scope: gr
ai_label: data-infrastructure
realms:
- land
- ocean
techniques:
- remote-sensing
status: active
summary: Programme intended to comprise 13 satellites, some already operational, funded by Greece through
  the EU Recovery and Resilience Facility, with disaster response and environmental monitoring among its
  aims.
facts:
- claim: The programme will consist of 13 satellites in four groups, by instrument and mission objective.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: The programme will ultimately consist of 13 satellites organised into four groups based on their
    instruments and mission objectives.
- claim: Funded by Greece through the EU Recovery and Resilience Facility, with disaster response, environmental
    monitoring and national security among its aims.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: strengthen capabilities in disaster response, environmental monitoring and national security
- claim: HSC said in July 2024 that the programme was designed by the Ministry of Digital Governance,
    through the General Secretariat of Telecommunications and Posts, and HSC, with a 60 million euro budget
    for seven satellites by 2026 to support environmental protection.
  url: https://hsc.gov.gr/en/greece-acquires-7-earth-observation-microsatellites-within-2026/
  fetched: '2026-11-03'
  quote: with a total budget of 60 million euros, with the aim of satellite data and products that will
    result from their processing, to support national efforts related to environmental protection and
    tackling climate change
- claim: The Hellenic Fire System is the second operational Earth observation mission under the programme,
    after two ICEYE radar satellites.
  url: https://www.esa.int/Applications/Observing_the_Earth/Hellenic_Fire_System_satellites_launched_for_Greece
  fetched: '2026-11-03'
  quote: Following the launch of two ICEYE radar satellites launched at the end of last year, the Hellenic
    Fire System, developed by OroraTech, is the second operational Earth observation mission developed
    under the Greek National Small Satellite Programme.
