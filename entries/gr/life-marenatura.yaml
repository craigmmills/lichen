website: https://www.lifemarenatura.eu/en/
summary: LIFE project run by HCMR from 2023 to 2029, with a budget of almost 11 million euros,
  planning satellite telemetry, eDNA and an early warning system for marine protected areas.
facts:
- claim: Plans to use satellite telemetry and visual surveys from floating and aerial vehicles.
  url: https://archelon.gr/en/news/life-mare-natura-the-largest-marine-biodiversity-program-in-greece
  fetched: '2026-11-03'
  quote: modern biomonitoring techniques will be used such as telemetry (using satellite transmitters
    that will be placed on the animals), visual recordings from floating and aerial vehicles
- claim: Plans to use hydrophone recordings and environmental DNA to find the most important
    areas for the target species.
  url: https://archelon.gr/en/news/life-mare-natura-the-largest-marine-biodiversity-program-in-greece
  fetched: '2026-11-03'
  quote: recordings with hydrophones for the sound detection of whales and dolphins, and detection
    of species through environmental DNA, in order to determine the most important areas for
    these species
- claim: Total budget of almost 11 million euros, 75 per cent co-financed by the EU, according
    to ARCHELON.
  url: https://archelon.gr/en/news/life-mare-natura-the-largest-marine-biodiversity-program-in-greece
  fetched: '2026-11-03'
  quote: The LIFE MareNatura program, with a total budget of almost 11 million euros, is 75%
    co-financed by the European Union
- claim: Runs from 2023 to 2029; HCMR's page showed it 56 per cent complete.
  url: https://imbbc.hcmr.gr/project/life-marenatura/
  fetched: '2026-11-03'
  quote: 'Project Progress: 56%'
- claim: Will develop a system for monitoring marine protected areas and target species after
    the project ends, with early warning tools.
  url: https://archelon.gr/en/news/life-mare-natura-the-largest-marine-biodiversity-program-in-greece
  fetched: '2026-11-03'
  quote: a system will be developed for the comprehensive monitoring of marine protected areas
    and target species after the end of the program
- claim: Has a total budget of almost 11 million euros, 75% co-funded by the European Union;
    a significant portion of its actions is planned for 44 Natura 2000 areas, 41 in Greece.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: The LIFE MareNatura project with a total budget of almost 11 million euros, is co-funded
    by the European Union (75%).
- claim: Started in July 2023 in Greece and Italy and is due to finish by June 2029.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: the environmental project LIFE MareNatura started in July 2023 in Greece and Italy
    and is expected to be completed until June 2029
- claim: Field surveys record species and habitats by direct observation, drones, thermal
    cameras, radar and eDNA.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: the identification and recording of the species and their habitats in the field (direct
    observation, drones, thermal cameras, radar, e-DNA, etc.)
- claim: Plans to fit more than 200 satellite transmitters to individuals of all target species.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: the installation of more than 200 satellite transmitters on a corresponding number
    of individuals of all species
- claim: Plans an early warning system and tools for monitoring marine areas and protected
    species.
  url: https://www.lifemarenatura.eu/en/project/
  fetched: '2026-11-03'
  quote: the project will develop suitable tools for monitoring significant marine areas and
    protected species
