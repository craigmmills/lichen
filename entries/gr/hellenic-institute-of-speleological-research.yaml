summary: Non-profit scientific organisation based in Crete, established in 2001, whose Cave
  Fauna of Greece database holds 8,880 records on more than 980 species and more than 780
  caves.
facts:
- claim: Its Cave Fauna of Greece database holds data on more than 980 species and more than
    780 caves from all 14 administrative regions, with 8,880 records.
  url: https://database.inspee.gr/statistics/
  fetched: '2026-11-03'
  quote: The Cave Fauna of Greece database currently holds data on more than 980 species and
    more than 780 caves from all 14 administrative regions
- claim: Lists monitoring of terrestrial caves and terrestrial fauna other than birds in the
    Samaria–Lefka Ori National Forest, carried out from June 2020 to October 2023.
  url: https://inspee.gr/what-we-do/projects/
  fetched: '2026-11-03'
  quote: The object of the program is a three-year systematic monitoring of terrestrial caves
    (H.T. 8310) and terrestrial species of fauna other than birds within the boundaries of
    the Samaria – Lefka Ori National Forest.
- claim: Lists a 2023 project on conservation of cave-dwelling bats and underground habitats
    in Greece.
