summary: A wildlife organisation founded in 1992, according to Greek News Agenda, that has
  identified and monitored 250 bears, used infrared cameras and studies bear behaviour with
  GPS collars.
facts:
- claim: Founded in 1992 to protect wildlife and its habitat, especially large carnivores
    such as the bear and the wolf, according to Greek News Agenda.
  url: https://www.greeknewsagenda.gr/arcturos-greek-ngo-brown-bear/
  fetched: '2026-11-03'
  quote: ARCTUROS , one of the most recognizable Greek environmental NGOs, was founded in
    1992 with a focus on the protection of wildlife fauna and its natural habitat
- claim: Established in 2005 and maintains the National Bear Register, which collects bear
    hair samples for DNA through traps on utility poles, according to Greek News Agenda.
  url: https://www.greeknewsagenda.gr/arcturos-greek-ngo-brown-bear/
  fetched: '2026-11-03'
  quote: In 2005, ARCTUROS established and maintains the National Bear Register , a groundbreaking
    initiative that collects bear DNA samples (hair) through specially designed traps placed
    on utility poles.
- claim: Launched Greece's first genetic study of brown bears in 2003; the work is now in
    the register of brown bears in Greece, which has identified and monitored 250 bears.
  url: https://www.arcturos.gr/en/activities/scientific-research/
  fetched: 2026-11-03
  quote: so far they have identified and systematically monitored 250 bears in Greece!
- claim: Has used automatic infrared camera systems to study bears in the Pindos and Rhodope
    mountains.
  url: https://www.arcturos.gr/en/activities/scientific-research/
  fetched: 2026-11-03
  quote: In Greece, ARCTUROS has used such systems for the study of bears in the Pindos and
    the Rhodopes Mountains.
- claim: Studies bear behaviour with GPS collars that send positions over the mobile phone
    network.
  url: https://www.arcturos.gr/en/activities/scientific-research/
  fetched: 2026-11-03
  quote: The new collars use GPS satellites to calculate the position of an animal, and send
    this information via the mobile phone network, directly to a researcher’s computer.
