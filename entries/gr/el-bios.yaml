summary: LIFE-funded Greek national biodiversity information system, run by the Natural Environment and
  Climate Change Agency and the Green Fund, whose database holds 681,929 entries from 16 existing databases.
facts:
- claim: The LIFE database reports the development and operation of the first national biodiversity information
    system in Greece, using Earth observation workflows, UAV, LiDAR, wireless monitoring and data cubes.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE20-GIE-GR-001317/hellenic-bioodiversity-information-system-an-innovative-tool-for-biodiversity-conservation
  fetched: '2026-11-03'
  quote: development and operation of the first national biodiversity information system in Greece (EL-BIOS),
    exploiting information and communication technology, including Earth Observation workflows, satellite
    data processing, UAV applications, LiDAR technologies
- claim: Its national biodiversity database holds 681,929 entries from 16 existing databases, made accessible
    to the public.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE20-GIE-GR-001317/hellenic-bioodiversity-information-system-an-innovative-tool-for-biodiversity-conservation
  fetched: '2026-11-03'
  quote: development of a national biodiversity database with 681 929 entries, integrating data from 16
    existing biodiversity databases, made accessible to the public and other stakeholders
- claim: A Hellenic Earth Observation Biodiversity Data Cube was first run over the two pilot areas.
  url: https://webgate.ec.europa.eu/life/publicWebsite/project/LIFE20-GIE-GR-001317/hellenic-bioodiversity-information-system-an-innovative-tool-for-biodiversity-conservation
  fetched: '2026-11-03'
  quote: operation of the first instance of a Hellenic Earth Observation Biodiversity Data Cube in Greece
    over the 2 pilot areas
- claim: An October 2025 webinar agenda lists searches through a webGIS and through catalogues including
    a Geoportal and a GBIF IPT tool.
  url: https://ekby.gr/wp-content/uploads/%CE%91%CF%84%CE%B6%CE%AD%CE%BD%CF%84%CE%B1-EL-BIOS-31.10.2025_v4.pdf
  fetched: '2026-11-03'
  quote: 'σε καταλόγους δεδομένων: Geoportal, GBIF IPT tool'
- claim: Aimed to create a web-based information system collecting and integrating Greek biodiversity
    data from field monitoring, remote sensing and Earth observation.
  url: https://ekby.gr/en/our-actions/research-monitoring/life-el-bios/
  fetched: 2026-11-03
  quote: aims to create a web-based Information System (IS), which will collect, integrate, combine and
    disseminate in an easy-to-understand way, data on the biodiversity of Greece
- claim: The project site says the first National Information System for the Biodiversity of Greece has
    been developed within the project.
  url: https://biodiversity-greece.gr/en/
  fetched: 2026-11-03
  quote: The first National Information System for the Biodiversity of Greece, has been developed within
    the framework of the LIFE EL-BIOS
- claim: Data from autonomous wireless sensor networks in the pilot areas feed artificial intelligence
    algorithms.
  url: https://biodiversity-greece.gr/en/new/video-life-el-bios-innovative-methods-amp-technologies-for-recording-biodiversity-related-data-in-protected-areas/
  fetched: 2026-11-03
  quote: are subsequently processed and used to feed artificial intelligence algorithms, that provide
    the necessary information for timely and informed decision-making
- claim: Ten sensing nodes recording sounds were installed in the National Forest of Pindos (Valia Calda).
  url: https://biodiversity-greece.gr/en/new/video-life-el-bios-innovative-methods-amp-technologies-for-recording-biodiversity-related-data-in-protected-areas/
  fetched: 2026-11-03
  quote: 10 sensing nodes that collect biodiversity data and record sounds, were installed within the
    National Forest of Pindos (Valia Calda)
- claim: The system is expected to be operated and used by NECCA and the 24 Protected Area Management
    Units.
  url: https://biodiversity-greece.gr/en/ethniko-pliroforiako-systima-gia-ti-viopoikilotita-stin-ellada/
  fetched: 2026-11-03
  quote: The system is expected to be the main national tool for Greece’s biodiversity that will be operated
    and used by N.E.C.C.A. and the 24 Protected Area Management Units
