summary: Greek AI company founded in 2021, associated with nvbird, an edge-based bird detection
  and deterrence platform for wind farms with over 300 installations, according to PES Wind.
facts:
- claim: PES Wind describes nvisionist as a Greek AI company founded in 2021 that develops
    nvbird.
  url: https://pes.eu.com/hubfs/PES%20W%201%2026%20nvisionist.pdf
  fetched: '2026-11-03'
  quote: The technology is developed by nvisionist, a Greek AI-native DeepT ech company founded
    in 2021.
- claim: nvbird is an AI, edge-based bird detection and deterrence platform for working wind
    farms.
  url: https://pes.eu.com/hubfs/PES%20W%201%2026%20nvisionist.pdf
  fetched: '2026-11-03'
  quote: as an AI-native, edge-based avian detection and deterrence platform designed for
    real-time operation in active wind farms.
- claim: More than 300 nvbird systems have been installed, including in Greece, Spain, Italy,
    France and Japan.
  url: https://pes.eu.com/hubfs/PES%20W%201%2026%20nvisionist.pdf
  fetched: '2026-11-03'
  quote: Since its commercial deployment, 300+ nvbird® systems have been installed globally,
    including projects in Greece, Spain, Italy, France and Japan.
- claim: A reseller page says nvbird uses machine learning and deep learning to detect and
    recognise birds, including protected species.
  url: https://internet-idee.net/en/nvbird.php
  fetched: '2026-11-03'
  quote: Nvbird, using machine learning and deep learning techniques, can handle the detection
    and recognition of birds to deter and prevent collisions against wind turbines.
  ai_type: ml-supervised
