summary: A regional environmental agency partnering with Politecnico di Torino, whose work
  includes multimodal Alpine land cover research and acoustic monitoring through “Cosa canta?”,
  started in March 2025.
facts:
- claim: The agency developed a multimodal deep learning framework for high-resolution Alpine
    land use and land cover maps with the Politecnico di Torino and DigiSky, published in
    Remote Sensing.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
  fetched: 2026-11-08
  quote: Lo studio, “A Multi-Modal Deep Learning Framework for High-Resolution Alpine Land
    Use/Land Cover” , sviluppato da ARPA Valle d'Aosta insieme al Politecnico di Torino e
    a DigiSky
  ai_type: deep-learning
- claim: The method fuses several kinds of information about the same ground.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
  fetched: 2026-11-08
  quote: Questa fusione multimodale è il cuore del metodo.
  ai_type: multimodal
- claim: The aerial survey was the first piloted-aircraft campaign carried out for the agency's
    monitoring of high-altitude forest ecosystems.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
  fetched: 2026-11-08
  quote: È la prima campagna aerea con velivolo pilotato condotta per ARPA Valle d'Aosta per
    la sorveglianza ambientale degli ecosistemi forestali d'alta quota.
- claim: The "Cosa canta?" project, started in March 2025, uses acoustic recorders and sound
    level meters to study the relations between fauna, environmental variables and human perception
    of sound.
  url: https://www.arpa.vda.it/contenuti/news/rumore/progetto-cosa-canta-monitoraggio-acustico-passivo-per-lo-studio-della-biodiversita-animale
  fetched: 2026-11-08
  quote: Si tratta di un progetto di monitoraggio partito a marzo 2025 e finalizzato allo
    studio dell’ambiente sonoro attraverso l’impiego di registratori acustici e di fonometri
- claim: The project is carried out by a team of agency staff in climate change, animal biodiversity,
    bioacoustics, acoustics and data analysis.
  url: https://www.arpa.vda.it/contenuti/news/rumore/progetto-cosa-canta-monitoraggio-acustico-passivo-per-lo-studio-della-biodiversita-animale
  fetched: 2026-11-08
  quote: L’iniziativa è condotta da un team multidisciplinare di tecnici ARPA esperti in cambiamenti
    climatici, biodiversità animale, bioacustica e acustica, analisi informatica dei dati.
- claim: Its acoustic recorders were funded from PNRR funds under "Agile Arvier".
  url: https://www.arpa.vda.it/contenuti/news/rumore/progetto-cosa-canta-monitoraggio-acustico-passivo-per-lo-studio-della-biodiversita-animale
  fetched: 2026-11-08
  quote: 'vede l''utilizzo di registratori acustici finanziati da fondi PNRR nell’ambito di
    "Agile Arvier: La cultura del cambiamento"'
