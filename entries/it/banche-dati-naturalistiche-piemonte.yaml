summary: A database of Piedmont fauna and flora records from surveys, literature and
  collections, supplied by volunteers and institutions, built by IPLA and the Gruppo
  Piemontese Studi Ornitologici, with a tiered-access web platform.
facts:
- claim: Holds fauna and flora records collected over the years by the Piedmont region
    from field surveys and observations, literature and collections.
