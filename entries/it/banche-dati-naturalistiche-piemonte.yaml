  quote: Le Banche Dati Naturalistiche (BDN) sono costituite dalle informazioni faunistiche
    e floristiche raccolte nel corso degli anni da Regione Piemonte
- claim: Records are supplied by volunteers, professionals, collaborators, protected-area
    bodies and other institutions.
  url: https://www.regione.piemonte.it/web/temi/ambiente-territorio/biodiversita-aree-naturali/servizi-informativi-biodiversita-aree-naturali
