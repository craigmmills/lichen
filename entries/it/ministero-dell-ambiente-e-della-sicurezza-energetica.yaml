summary: Italian environment ministry. Its minister adopted the national biodiversity strategy
  to 2030, and it holds the recovery plan measure for digitising national parks and marine
  protected areas.
facts:
- claim: ISPRA, which it supervises, says it gives the ministry technical, scientific and
    negotiating support on biodiversity policy, including the Kunming-Montreal Global Biodiversity
    Framework.
  url: https://www.isprambiente.gov.it/it/attivita/biodiversita/attivita-internazionali/le-funzioni-le-attivita-e-i-ruoli-internazionali-di-ispra-nel-campo-della-conservazione-della-natura
  fetched: 2026-10-31
  quote: ISPRA fornisce supporto tecnico-scientifico e negoziale al MASE nei processi di definizione
    e implementazione di politiche e strategie
- claim: ISPRA reports that the minister signed the decree adopting the national biodiversity
    strategy to 2030.
  url: https://www.isprambiente.gov.it/it/archivio/notizie-e-novita-normative/notizie-ispra/2023/08/adottata-la-strategia-nazionale-per-la-biodiversita-al-2030
  fetched: 2026-10-31
  quote: ha firmato il decreto che adotta la Strategia nazionale per la Biodiversità al 2030
- claim: Biodiversa+ lists it as an Italian partner; partners include ministries in charge
    of environmental policy.
  url: https://www.biodiversa.eu/partners/
  fetched: '2026-10-31'
  quote: Italy MASE Ministry of Environment and Energy Security
- claim: ISPRA says it promoted and implemented DigitAP.
  url: https://www.isprambiente.gov.it/en/news/the-digitap-project-results-capture-the-biodiversity
  fetched: '2026-10-31'
  quote: The project was promoted and implemented by MASE with the support of ISPRA
- claim: The National Biodiversity Network site says it promoted the network in support of
    the National Biodiversity Strategy.
  url: https://www.nnb.isprambiente.it/
  fetched: '2026-10-31'
  quote: Il Ministero dell'Ambiente e della Sicurezza Energetica (MASE) ha promosso il progetto
- claim: ISPRA reports that the environment minister signed the decree adopting the National
    Biodiversity Strategy to 2030. The ministry's own site refused the fetcher, so this comes
    from ISPRA.
  url: https://www.isprambiente.gov.it/it/archivio/notizie-e-novita-normative/notizie-ispra/2023/08/adottata-la-strategia-nazionale-per-la-biodiversita-al-2030?set_language=it
  fetched: '2026-10-31'
  quote: ha firmato il decreto che adotta la Strategia nazionale per la Biodiversità al 2030
