summary: National biodiversity data network promoted by the environment ministry and
  managed by ISPRA. It shares data held by national and regional bodies, published
  as open data under CC-BY 4.0.
facts:
- claim: Provides biodiversity information for the national territory through a network
    that is continually filled with data from national and regional bodies, including
    research bodies.
  url: https://www.nnb.isprambiente.it/
  fetched: 2026-10-31
  quote: NNB fornisce e gestisce le informazioni in tema di biodiversità relative
    al territorio nazionale attraverso un sistema a rete
- claim: All data published in the network are open data under CC-BY 4.0.
  url: https://www.nnb.isprambiente.it/
  fetched: 2026-10-31
  quote: Tutti i dati pubblicati in NNB sono disponibili in formato open data e con
    licenza CC-BY 4.0
- claim: Promoted by the environment ministry in support of the National Biodiversity
    Strategy.
  url: https://www.nnb.isprambiente.it/
  fetched: '2026-10-31'
  quote: ha promosso il progetto “Network Nazionale della Biodiversità” che svolge
