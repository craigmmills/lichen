summary: Open-source AI application trialled in the Abruzzo, Lazio and Molise National Park
  that detects and classifies wild animals in camera feeds and alerts operators in real time,
  to reduce conflict with people, with a focus on Marsican bears.
facts:
- claim: An open-source project. The application detects animals in camera images and video,
    classifies them by species and notifies operators in real time.
  url: https://www.meteoweb.eu/2025/04/wadas-ai-supporto-salvaguardia-della-selvatica/1001776514/
  fetched: 2026-10-31
  quote: WADAS è un progetto open source coadiuvato dalle tecnologie di Intel e Reolink.
- claim: Press coverage reports that the park published pilot results of 97.4% correct classification.
  url: https://www.techfinitive.com/intel-backed-ai-helps-protect-endangered-bears/
  fetched: 2026-10-31
  quote: WADAS is able to accurately classify the animals seen in the park 97.4% of the time,
    it said.
- claim: Open-source project to build AI-based software for wild animal conservation and coexistence.
  url: https://www.wadas.it/
  fetched: '2026-10-31'
  quote: è un progetto open-source nato dalla collaborazione tra l’associazione “Salviamo
    L’Orso” e l’Università degli studi dell’Aquila
