  quote: the tender to map the coastal habitats of the entire Italian coast was assigned
- claim: The survey maps Posidonia oceanica and Cymodocea nodosa meadows using LiDAR,
    airborne optical and satellite sensors, among others.
  url: https://www.isprambiente.gov.it/en/news/pnrr-ispra-the-mer-project-begins-to-restore-the-italian-seas
  fetched: 2026-10-31
  quote: include the mapping of the Posidonia oceanica and Cymodocea nodosa meadows,
