id: digitap
kind: programme
name: DigitAP
also_known_as:
- Digitalizzazione dei parchi nazionali e delle aree marine protette
- Digitalisation of national parks and marine protected areas
scope: it
ai_label: ai
realms:
- land
- ocean
- freshwater
status: active
summary: Recovery plan measure held by the environment ministry to digitise Italy's national
  parks and marine protected areas, including monitoring with drones and terrestrial laser
  scanners under ISPRA's technical and scientific coordination.
facts:
- claim: Aims to set standardised, digital procedures for the running of protected areas.
  url: https://www.isprambiente.gov.it/it/progetti/cartella-progetti-in-corso/biodiversita-1/digitap-digitalizzazione-dei-parchi-nazionali-e-delle-aree-marine-protette
  fetched: 2026-10-31
  quote: mira a stabilire procedure standardizzate e digitalizzate per la modernizzazione,
    l'efficienza e l'efficace funzionamento delle aree protette
- claim: A press release on the Alta Murgia park says the work uses drones and terrestrial
    laser scanners.
  url: https://www.nnb.isprambiente.it/api/it/file/cs_progetto_digitap.pdf
  fetched: 2026-10-31
  quote: strumenti innovativi come droni e Terrestrial Laser Scanner
- claim: Coordinated monitoring of biodiversity across 24 national parks and 31 marine protected
    areas; work closed on 15 October.
  url: https://www.isprambiente.gov.it/en/news/the-digitap-project-results-capture-the-biodiversity
  fetched: '2026-10-31'
  quote: a shared digital infrastructure for the coordinated monitoring of biodiversity across
    Italy’s 24 National Parks and 31 Marine Protected Areas
- claim: The project's work came to a close on 15 October 2026 at the ministry.
  url: https://www.isprambiente.gov.it/en/news/the-digitap-project-results-capture-the-biodiversity
  fetched: '2026-10-31'
  quote: came to a close on 15 October at the Ministry of the Environment and Energy Security
    (MASE)
- claim: A closing presentation shows machine learning models that turn drone and field surveys
    into habitat maps.
  url: https://digitap.nnb.isprambiente.it/wp-content/uploads/2026/10/perez.pdf
  fetched: '2026-10-31'
  quote: 'Dal rilievo alla mappa: il machine learning'
- claim: A closing presentation refers to acoustic monitoring and the correct use of AI for
    reporting under the Birds Directive.
  url: https://digitap.nnb.isprambiente.it/wp-content/uploads/2026/10/franzetti.pdf
  fetched: '2026-10-31'
  quote: Il monitoraggio acustico e il corretto uso dell’AI per
- claim: Interventions include monitoring by drones and terrestrial laser scanner, and by
    biomolecular techniques.
  url: https://digitap.nnb.isprambiente.it/
  fetched: '2026-10-31'
  quote: Monitoraggio degli habitat terrestri tramite droni e Terrestrial Laser Scanner (TLS)
- claim: Data from monitoring are to be made available through the National Biodiversity Network.
  url: https://digitap.nnb.isprambiente.it/il-progetto-digitap/
  fetched: '2026-10-31'
  quote: I dati delle attività di monitoraggio saranno resi disponibili nell’infrastruttura
    del Network Nazionale della Biodiversità (NNB)
- claim: Covers 24 national parks and 31 marine protected areas; the work concluded on 15
    October at the ministry.
  url: https://digitap.nnb.isprambiente.it/i-risultati-del-progetto-digitap-fotografano-la-biodiversita-delle-aree-protette-italiane/
  fetched: '2026-10-31'
  quote: si sono conclusi il 15 ottobre al Ministero dell’Ambiente e della Sicurezza Energetica
    (MASE) i lavori del progetto DigitAP
- claim: The camera-trap work includes a central system for automatic image analysis with
    artificial intelligence.
  url: https://digitap.nnb.isprambiente.it/studio-pilota-per-il-monitoraggio-mediante-fototrappole-delle-comunita-di-meso-e-grandi-mammiferi-allinterno-dei-parchi-nazionali/
  fetched: '2026-10-31'
  quote: creare un sistema centralizzato di raccolta e analisi automatica delle immagini tramite
    intelligenza artificiale
- claim: Camera traps were supplied to all national parks through a public tender won by Scubla
    S.r.l.
  url: https://digitap.nnb.isprambiente.it/studio-pilota-per-il-monitoraggio-mediante-fototrappole-delle-comunita-di-meso-e-grandi-mammiferi-allinterno-dei-parchi-nazionali/
  fetched: '2026-10-31'
  quote: aggiudicata a Scubla S.r.l.
- claim: Includes biomolecular monitoring from DNA in biological or environmental samples.
  url: https://digitap.nnb.isprambiente.it/progetto/progetto-dna-ambientale/
  fetched: '2026-10-31'
  quote: Attraverso l’analisi del DNA contenuto in campioni biologici o ambientali
- claim: Funded by the European Union through NextGenerationEU.
  url: https://digitap.nnb.isprambiente.it/i-risultati-del-progetto-digitap-fotografano-la-biodiversita-delle-aree-protette-italiane/
  fetched: '2026-10-31'
  quote: (Finanziamento dell’Unione Europea – NextGenerationEU)
