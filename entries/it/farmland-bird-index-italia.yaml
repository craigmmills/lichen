summary: Italian bird monitoring project run by Lipu for the agriculture ministry
  since 2009, building on the Mito2000 census that began in 2000. It gives indices
  of farmland birds and mountain grassland species, published with the National Rural
  Network.
facts:
- claim: Picks up from the earlier Mito2000 census, which began in 2000 on a voluntary
    basis and used the same data collection protocol.
  url: https://www.lipu.it/sites/default/files/2025-02/Uccelli%20Comuni%202024%20WEB.pdf
  fetched: 2026-10-31
  quote: progetto di censimento denominato Mito2000 (Monitoraggio Italiano Ornitologico),
    iniziato nel 2000 su base volontaria
- claim: ISPRA publishes the index as an environmental indicator, with Lipu staff
    among its authors.
  url: https://indicatoriambientali.isprambiente.it/en/node/5450
  fetched: 2026-10-31
  quote: Gaia Bazzi, Matteo Fontanella (LIPU), Simona Imperio, Federica Luoni (LIPU),
    Roberta Righini (LIPU)
- claim: Covers 41 bird species.
  url: https://www.lipu.it/cosa-facciamo/proteggiamo-uccelli/fbi-farmland-bird-index
  fetched: '2026-10-31'
  quote: l'Fbi riguarda 41 specie di uccelli
- claim: The national index fell 33.5% from 2000 to 2025.
  url: https://www.lipu.it/cosa-facciamo/proteggiamo-uccelli/fbi-farmland-bird-index
  fetched: '2026-10-31'
  quote: Dal 2000 al 2025, l'indice Fbi complessivo nazionale è -33.5%.
