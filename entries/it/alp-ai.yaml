  quote: ALP.AI 678.640,00 €
- claim: DronEzine reports that thermal camera images will be used by Politecnico
    di Milano to train AI for recognising and counting animals.
  url: https://www.dronezine.it/?p=459570
  fetched: 2026-10-31
  quote: Le immagini raccolte dalla termocamera saranno utilizzate dal Politecnico
