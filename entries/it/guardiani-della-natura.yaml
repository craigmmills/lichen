summary: WWF Italia and Huawei project using audio devices, cloud and AI in reserves
  managed by WWF, on a model built with Rainforest Connection. Its first three months
  at Astroni, Burano and Orbetello gave over 300,000 recordings and over 1,000 alerts
  of possible illegal activity.
