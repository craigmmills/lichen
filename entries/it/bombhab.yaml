summary: A project in the Appennino Lucano Val d'Agri-Lagonegrese National Park that
  plans environmental DNA detection of the Apennine yellow-bellied toad, an online
  microclimate database and a studbook of sampled animals.
facts:
- claim: Plans to use environmental DNA to detect the Apennine yellow-bellied toad;
    the page spells its scientific name inconsistently as B. pchypus and B. Pacypus.
  url: https://www.biodiversitygateway.it/azioni-di-biodiversita/bobhab/
  fetched: 2026-11-08
  quote: Attraverso pratiche innovative come l’utilizzo di DNA ambientale per l’individuazione
    di B. pchypus .
- claim: Plans an online database with microclimate data for the sites and an individual
    studbook of the genotype and phenotype of every sampled animal.
  url: https://www.biodiversitygateway.it/azioni-di-biodiversita/bobhab/
  fetched: 2026-11-08
  quote: Creazione di un database on line (con caratterizzazione microclimatica dei
    siti), di uno studbook individuale del genotipo e del fenotipo di tutti gli individui
    campionati.
- claim: Takes place in the Appennino Lucano Val d'Agri-Lagonegrese National Park.
