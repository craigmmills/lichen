facts:
- claim: Collaborative initiative in spatial animal ecology running since 2007.
  url: https://euromammals.org/
  fetched: '2026-10-31'
  quote: The EUROMAMMALS bottom-up initiative has pioneered collaborative science in spatial
    animal ecology since 2007.
- claim: Its database mainly holds tracking and bio-logging data.
  url: https://euromammals.org/
  fetched: '2026-10-31'
  quote: The main focus of the database is tracking and bio-logging data (i.e. GPS, VHF, activity)
    of the mammal species studied by the networks
- claim: Access to data is limited to contributors or a specific question, and needs agreement
    with data owners.
