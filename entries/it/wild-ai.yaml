summary: University of Florence project building a platform for camera-trap wildlife data
  that combines AI and computer vision with ecological tools. A Foreste Casentinesi report
  describes its use there to sort images.
facts:
- claim: Its general aim is a platform for managing camera-trap wildlife data, combining AI
    and computer vision with ecological tools.
  url: https://micc.unifi.it/seidenari/project/wild.ai
  fetched: 2026-10-31
  quote: to set-up a platform to manage data on wildlife obtained from camera traps, by integrating
    Artificial Intelligence (AI) and computer vision with ecological tools
- claim: A report for the Foreste Casentinesi park says the web platform classifies images
    as empty, animals or people, and in future may identify species.
  url: https://www.parcoforestecasentinesi.it/sites/default/files/Report_UNIFI_camtrap_anno_2_marzo2022.pdf
  fetched: 2026-10-31
  quote: l’intelligenza artificiale per classificare le immagini per categorie (bianche, animali,
    persone) e, in prospettiva, anche per identificare le specie stesse.
- claim: Aims to set up a platform for managing wildlife data from camera traps by combining
