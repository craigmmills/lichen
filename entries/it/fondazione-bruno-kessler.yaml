summary: Italian research foundation and an academic and research partner in WildDrone, a
  project on autonomous drones for wildlife monitoring, where it hosts a doctoral student.
facts:
- claim: FBK says it will host one of the project's 13 doctoral students, working on automated
    drones to track and monitor wild animals.
  url: https://magazine.fbk.eu/en/news/wilddrone-autonomous-drones-to-monitor-and-preserve-wild-animals/pdf/0f6beef585
  fetched: 2026-10-31
  quote: FBK will also host one of the 13 doctoral students involved
- claim: WildDrone describes it as founded in 1962 as a public research centre of the Autonomous
    Province of Trento.
  url: https://wilddrone.eu/consortium-wilddrone/
  fetched: '2026-10-31'
  quote: FBK was founded in 1962 (then Istituto Trentino di Cultura ) as a public research
    centre of the Autonomous Province of Trento, Italy.
- claim: Its 3DOM unit developed and field-tested the WildDrone technologies with the project's
    partners.
  url: https://magazine.fbk.eu/en/news/robots-ai-and-3d-reconstructions-to-help-conserve-endangered-animal-species/
  fetched: '2026-10-31'
  quote: The technologies were developed and field-tested by FBK’s 3DOM unit at the Center
    for Digital Industry , together with the project’s international partners.
- claim: Its AI and photogrammetry system reconstructs individual animals in three-dimensional
    space.
  url: https://magazine.fbk.eu/en/news/robots-ai-and-3d-reconstructions-to-help-conserve-endangered-animal-species/
  fetched: '2026-10-31'
  quote: Using specific artificial intelligence algorithms and photogrammetry, the system
    can reconstruct individual animals in three-dimensional space
- claim: Its 3DOM unit developed and validated technologies in WildDrone with international
    partners.
  url: https://www.fbk.eu/it/press-releases/robot-ia-e-ricostruzioni-3d-per-aiutare-la-conservazione-delle-specie-animali-a-rischio/
  fetched: '2026-10-31'
  quote: Le tecnologie sono state sviluppate e validate sul campo dall’unità 3DOM del Centro
    Digital Industry di FBK
