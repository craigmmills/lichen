summary: Italian Earth observation programme under the recovery plan, developed by
  ESA with support from the Italian Space Agency, serving public bodies on hazards
  including fires and coasts. ESA gave a budget of about 1.1 billion euros in 2023.
facts:
- claim: ESA says the Italian government entrusted it with developing the system in
    December 2021.
  url: https://www.esa.int/Space_in_Member_States/Italy/IRIDE_La_squadra_e_al_completo
  fetched: 2026-10-31
  quote: A dicembre 2021 il Governo italiano ha affidato all'Agenzia Spaziale Europea
    l'impegnativo incarico di sviluppare il sistema IRIDE.
- claim: ESA said the programme had a budget of about 1.1 billion euros.
  url: https://www.esa.int/Space_in_Member_States/Italy/IRIDE_La_squadra_e_al_completo
  fetched: 2026-10-31
  quote: Il programma è dotato di un budget complessivo di circa 1.1 miliardi di euro
- claim: Meant to serve public bodies, including work on fires and protecting coasts.
  url: https://www.esa.int/Space_in_Member_States/Italy/IRIDE_La_squadra_e_al_completo
  fetched: 2026-10-31
  quote: per contrastare il dissesto idrogeologico e gli incendi, tutelare le coste
- claim: National Earth observation infrastructure owned by ASI.
  url: https://www.asi.it/scienze-della-terra/iride/
  fetched: '2026-10-31'
  quote: IRIDE è l’infrastruttura nazionale per l’Osservazione della Terra, di proprietà
    dell’ Agenzia Spaziale Italiana (ASI)
- claim: ESA coordinates development with ASI's support.
  url: https://www.asi.it/scienze-della-terra/iride/
  fetched: '2026-10-31'
  quote: che coordina lo sviluppo del programma con il supporto di ASI
- claim: Planetek reports that the marketplace opened on 1 October 2026 with first
    services for public administration.
  url: https://www.planetek.it/
  fetched: '2026-10-31'
  quote: Dal 1° ottobre 2026 apre il Marketplace del programma nazionale di Osservazione
    della Terra IRIDE
- claim: Its land cover and land use services support forest management and biodiversity
    protection.
  url: https://www.asi.it/scienze-della-terra/iride/
  fetched: '2026-10-31'
  quote: la gestione sostenibile delle foreste e delle aree agricole, la tutela della
    biodiversità
