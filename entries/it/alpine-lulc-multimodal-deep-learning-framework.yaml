  ai_type: deep-learning
- claim: Combines several kinds of information about the same ground; the multimodal
    fusion is the core of the method.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
  fetched: 2026-11-08
  quote: Questa fusione multimodale è il cuore del metodo.
  ai_type: multimodal
- claim: Experts drew 2,517 polygons on the orthophotos and the model inferred the
    rest.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
  fetched: 2026-11-08
  quote: Qui gli esperti hanno tracciato sulle ortofoto 2.517 poligoni, ciascuno associato
    a una classe, e il modello ha dedotto da solo il resto
- claim: Reaches a mIoU of 0.777 across the 14 classes.
  url: https://www.arpa.vda.it/notizie/clima/come-unintelligenza-artificiale-impara-a-leggere-il-paesaggio-alpino
