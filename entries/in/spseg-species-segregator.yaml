facts:
- claim: A machine-learning tool for species-level sorting of camera-trap images,
    trained for the Central Indian landscape.
  url: https://github.com/bhlab/SpSeg
  fetched: 2026-11-22
  quote: '''SpSeg'' (short for ''Species Segregator) is a Machine-learning tool for
    species-level segregation of camera-trap images originating from wildlife census
    and studies.'
- claim: The team trained several Keras CNN architectures and tested two well-performing
    models, Xception and ResNet152v2, on field datasets.
  url: https://github.com/bhlab/SpSeg
  fetched: 2026-11-22
  quote: We found two models performing well - SpSeg_x.hdf5 and SpSeg_r152v2.hdf5
    - and have tested those on various field datasets.
  ai_type: deep-learning
- claim: Works as a second step after Microsoft's MegaDetector.
  url: https://github.com/bhlab/SpSeg
  fetched: 2026-11-22
  quote: SpSeg is part of Microsoft's MegaDetector ecosystem and works as a second-step
    to species level segregation of camera-trap images.
- claim: Can sort 36 commonly encountered species or taxonomic classes in camera-trap
    surveys in the Eastern Vidarbha Landscape, Maharashtra.
  url: https://github.com/bhlab/SpSeg
  fetched: 2026-11-22
  quote: SpSeg models can currently segregate 36 commonly encountered species (or
    taxonomic class) in camera-trap surveys in the Eastern Vidarbha Landscape, Maharashtra,
    India.
