summary: Mobile phone application used in India's national tiger assessment to record
  field data and geotag photo evidence by GPS.
facts:
- claim: The National Tiger Conservation Authority says the application records field
    data and geotags photo evidence by GPS.
  url: https://ntca.gov.in/a/monitoring-tigers/
  quote: mobile phone application like M-STrIPES (Monitoring System for tigers – intensive
    protection and ecological status), that uses GPS to geotag photo-evidences
  fetched: '2026-10-31'
- claim: Uses GPS, GPRS and remote sensing to collect field information.
  url: https://ntca.gov.in/our-work-m-stripes/
  fetched: '2026-10-31'
  quote: The MSTrIPES program uses Global Positioning System (GPS), General Packet
    Radio Services (GPRS), and remote sensing, to collect information from the field
- claim: Used to assist patrolling, assess ecological status and mitigate conflict.
  url: https://ntca.gov.in/our-work-m-stripes/
  fetched: '2026-10-31'
  quote: It is a platform where modern technology is used to assist effective patrolling,
    assess ecological status and mitigate human-wildlife conflict in and around tiger
    reserves.
- claim: An Android application with Patrol, Ecological and Conflict modules.
  quote: This is an android application which has three distinct modules namely Patrol
    module, Ecological module and Conflict module.
  url: https://ntca.gov.in/faqs/
  fetched: '2026-10-31'
- claim: Used by State Forest Department staff in ground surveys for the national
    tiger assessment.
  quote: ground surveys are conducted across all potential tiger-bearing forests by
    State Forest Department personnel using the M-STrIPES mobile application
  url: https://ntca.gov.in/faqs/
  fetched: '2026-10-31'
