summary: State forest department whose Wildlife Wing and the Nature Conservation Foundation
  prepared a Spiti management plan, and whose snow leopard project, accepted from
  2010-11, aimed at India's first comprehensive radio-collaring.
facts:
- claim: The Wildlife Wing and the Nature Conservation Foundation prepared a management
    plan for the entire Spiti Wildlife Division.
  url: https://hpforest.gov.in/project-snow-leopard
  fetched: 2026-11-08
  quote: The HPFD and NCF have also prepared a detailed landscape based and participatory
    Management Plan for the entire Spiti Wildlife Division.
- claim: Its snow leopard project, accepted by the environment ministry from 2010-11,
    set out to run India's first comprehensive radio-collaring project on snow leopards.
  url: https://hpforest.gov.in/project-snow-leopard
  fetched: 2026-11-08
  quote: Conduct the first comprehensive snow leopard radio-collaring project in India
- claim: Its site publishes camera trap images of snow leopards from the Spiti Valley
