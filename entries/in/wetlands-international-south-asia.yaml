summary: New Delhi organisation, established in 1996, that jointly coordinates the
  Asian Waterbird Census in India with the Bombay Natural History Society, and says
  the data is available to agencies and NGOs.
facts:
- claim: Established in New Delhi in 1996 as part of the Wetlands International network
    and registered in 2005 under the Societies Registration Act.
  url: https://south-asia.wetlands.org/
  fetched: 2026-11-08
  quote: In 2005, Wetlands International South Asia was registered under the Societies
    Registration Act of the Government of India.
- claim: Jointly coordinates the Asian Waterbird Census in India with the Bombay Natural
    History Society, a volunteer count of waterbirds and wetlands held each winter
    since 1987.
  url: https://south-asia.wetlands.org/asian-waterbird-census-new/
  fetched: 2026-11-08
  quote: the AWC in India is jointly coordinated by Bombay Natural History Society
    (BNHS) and Wetlands International South Asia
- claim: Says the census data is available to government agencies and NGOs.
  url: https://south-asia.wetlands.org/asian-waterbird-census-new/
  fetched: 2026-11-08
  quote: The AWC data is available to a wide range of government agencies and non-government
    organisations
