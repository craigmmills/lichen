summary: Park and tiger reserve that runs Kaziranga drone surveillance; the Assam
  Tribune reported its 2024 report counted 148 adult tigers using camera traps, and
  a 2025 director account of daily technology use.
facts:
- claim: The Assam Tribune reports that its 2024 tiger status report counted 148 adult
    tigers across three divisions, using remotely triggered camera traps under the
    NTCA and Wildlife Institute of India Phase IV protocol.
  url: https://assamtribune.com/assam/kaziranga-third-globally-in-tiger-density-with-18-big-cats-per-100-sq-km-report-1586589
  fetched: 2026-11-08
  quote: methodology for the tiger count included the deployment of remotely triggered
    camera traps as per the Phase IV Protocol of the National Tiger Conservation Authority
    (NTCA) and the Wildlife Institute of India
- claim: In July 2025, its director told the Assam Tribune that camera traps, drones
    and an infrared electronic surveillance system were part of daily operations.
  url: https://assamtribune.com/assam/kaziranga-third-globally-in-tiger-density-with-18-big-cats-per-100-sq-km-report-1586589
  fetched: 2026-11-08
  quote: along with camera traps, drones, and infrared-based electronic surveillance
    systems ("Electronic Eye"), are now integral to daily operations
