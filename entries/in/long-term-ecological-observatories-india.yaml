summary: Environment ministry programme, with several partner institutions, on climate
  change impacts on Indian ecosystems, with work planned at six index landscapes and
  a planned Andaman marine monitoring theme.
facts:
- claim: Launched by the environment ministry as a multi-institutional programme on
    the impacts of climate change on India's ecosystems and taxa, with work planned
    at six index landscapes.
  url: https://dakshin.org/?p=5144
  fetched: 2026-11-08
  quote: will be carried out at six index landscapes across the country
- claim: Its themes include soil, forests, grasslands, invertebrates, fish, herpetofauna,
    birds, animal movement and marine ecosystems.
  url: https://dakshin.org/?p=5144
  fetched: 2026-11-08
  quote: The programme covers a wide range of themes including soil, forests, grasslands,
    invertebrates, fish, herpetofauna, birds, animal movement and marine ecosystems
- claim: The marine theme plans long-term monitoring of coral reefs, reef fish, seagrass,
    sea turtles and water quality in the Andaman islands.
  url: https://dakshin.org/?p=5144
  fetched: 2026-11-08
  quote: we will be carrying out long term monitoring studies to understand trends
    in coral reef and reef fish communities, seagrass ecosystems, sea turtles and
    water quality parameters in the Andaman islands
