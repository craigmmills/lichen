summary: Zoo whose genetic biobank, established in June 2024, worked with CCMB and
  held 21 DNA samples from nine species by December 2024, according to Indian Masterminds.
facts:
- claim: Indian Masterminds reports that the zoo set up a genetic biobank in June
    2024 to preserve DNA and genetic material of endangered Himalayan animals.
  url: https://indianmasterminds.com/news/padmaja-naidu-zoo-pioneering-conservation-efforts-for-himalayan-species-105538/
  fetched: 2026-11-08
  quote: In June 2024, the zoo established a genetic biobank facility, the first of
    its kind in India, to preserve the DNA and genetic material of endangered Himalayan
    animals.
- claim: Indian Masterminds reported in December 2024 that the biobank, working in
    collaboration with CCMB, held 21 DNA samples from nine species.
  url: https://indianmasterminds.com/feature-stories-on-bureaucrats-changemakers/how-darjeelings-red-panda-conservation-programme-sets-a-global-standard-for-wildlife-preservation-101249/
  fetched: 2026-11-08
  quote: The biobank currently holds 21 DNA samples from nine species, including the
    Himalayan pheasant, leopard cat, and red panda.
- claim: Its director told Indian Masterminds that each red panda released is tracked
    after release.
  url: https://indianmasterminds.com/feature-stories-on-bureaucrats-changemakers/how-darjeelings-red-panda-conservation-programme-sets-a-global-standard-for-wildlife-preservation-101249/
  fetched: 2026-11-08
  quote: its rigorous post-release monitoring, where each animal’s progress is carefully
    tracked to ensure they thrive in their natural habitat
