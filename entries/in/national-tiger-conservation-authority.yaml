summary: India's statutory tiger authority under the Wildlife (Protection) Act. Its national
  tiger assessment sorts camera-trap photographs by species with AI.
facts:
- claim: Constituted under section 38 L (1) of the Wildlife (Protection) Act, 1972.
  url: https://ntca.gov.in/about-us/
  quote: The National Tiger Conservation Authority (NTCA) has been constituted under section
    38 L (1) of Wildlife (Protection) Act, 1972.
  fetched: '2026-10-31'
- claim: Says the fourth national assessment sorted camera-trap photographs to species with
    neural network models.
  url: https://ntca.gov.in/a/monitoring-tigers/
  quote: automated segregation of camera trap photographs to species using artificial intelligence
    and neural network models
  ai_type: deep-learning
  fetched: '2026-10-31'
- claim: Runs a four-yearly national tiger assessment with state forest departments and the
    Wildlife Institute of India.
  url: https://ntca.gov.in/our-work-m-stripes/
  fetched: '2026-10-31'
  quote: the National Tiger Conservation Authority in collaboration with the State Forest
    Departments, the Wildlife Institute of India and conservation partners conducts a National
    assessment
- claim: Its tiger assessment used artificial intelligence and neural network models to sort
    camera-trap photographs to species.
  ai_type: deep-learning
  quote: automated segregation of camera trap photographs to species using artificial intelligence
    and neural network models (software CaTRAT
  url: https://www.ntca.gov.in/milestone_initiatives
  fetched: '2026-10-31'
- claim: Requires tiger source areas to run yearly camera-trap monitoring, with data archived
    in a national repository.
  url: https://ntca.gov.in/faqs/
  quote: The collected data is archived in the National Repository of Camera Trap Photographs
    of Tigers (NRCTPT).
  fetched: '2026-10-31'
