summary: Indian charitable trust working on wildlife and communities around tiger reserves
  and other sites. It runs waterbird monitoring and nesting surveys of Indian vultures, and
  assists a satellite telemetry study of birds in Gujarat.
facts:
- claim: Charitable trust.
  url: http://www.corbettfoundation.org/
  fetched: '2026-10-31'
  quote: The Corbett Foundation is a charitable trust
- claim: GBIF record gives an address at Aligarh Muslim University.
  url: https://api.gbif.org/v1/organization/61e2a404-0642-4d2b-b978-0a97dbd88ab4
  fetched: '2026-10-31'
  quote: Department of Wildlife Sciences, Aligarh Muslim University, Aligarh
- claim: Runs systematic nesting surveys of Indian vultures with the Mohamed bin Zayed Raptor
    Conservation Fund.
  url: http://www.corbettfoundation.org/our-works/joint-conservation-efforts-for-indian-vultures
  fetched: '2026-10-31'
  quote: This initiative includes systematic nesting surveys to map breeding sites, evaluate
    nest occupancy, and assess breeding success.
- claim: Has monitored winter migratory waterfowl at three reservoirs for over 20 years.
  url: http://www.corbettfoundation.org/our-works/waterbird-monitoring
  fetched: '2026-10-31'
  quote: has been monitoring winter migratory waterfowl in the Haripura, Baur, and Tumaria
    reservoirs of the Corbett Landscape for over 20 years
- claim: Supports the Gujarat Forest Department's bird telemetry project.
  url: http://www.corbettfoundation.org/our-works/satellite-telemetry-project-gujarat
  fetched: '2026-10-31'
  quote: TCF’s role has included supporting the Wildlife Division of Sasan-Gir in monitoring
    these tagged birds and analysing the collected data.
