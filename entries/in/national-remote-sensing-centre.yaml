summary: Centre under India's Department of Space. Its forestry and ecology work maps forest
  types, canopy density and land cover for biosphere reserves and forest working plans.
facts:
- claim: Generated baseline forest and land cover information for four biosphere reserves.
  url: https://www.nrsc.gov.in/nrscnew/Apps_Forestry_Ecology.php
  quote: This project has generated baseline spatial information on forest types, forest canopy
    density and land cover on 1:50,000 scale at every five years interval for four Biosphere
    Reserves
  fetched: '2026-10-31'
- claim: Its site names it under the Department of Space.
  url: https://www.nrsc.gov.in/nrscnew/Apps_Forestry_Ecology.php
  quote: Government of India · Department of Space
  fetched: '2026-10-31'
- claim: Receives satellite data and distributes data products.
  url: https://www.nrsc.gov.in/nrscnew/about.php
  fetched: '2026-10-31'
  quote: NRSC has the mandate for establishment of ground stations for receiving satellite
    data, generation of data products, dissemination to the users
- claim: Main campus in Hyderabad.
  url: https://www.nrsc.gov.in/nrscnew/about.php
  fetched: '2026-10-31'
  quote: Main Campus at Balanagar, Hyderabad
- claim: Works on forest change, biomass and fire alerts.
  url: https://www.nrsc.gov.in/nrscnew/Apps_Forestry_Ecology_Overview.php
  fetched: '2026-10-31'
  quote: Analysis of forest cover change, spatial biomass estimation, Community Biodiversity
    characterization, Forest fire alert system
- claim: Land use and land cover maps made from satellite data are hosted on Bhuvan portals.
  quote: The LULC-50K information is hosted on Bhuvan –LULC 50K.
  url: https://www.nrsc.gov.in/nrscnew/Apps_LULC.php
  fetched: '2026-10-31'
- claim: Describes the Natural Resources Census programme of the Indian Space Research Organisation,
    which produces yearly land use and land cover maps.
  quote: The Natural Resources Census programme of ISRO has scope for generation of maps of
    Land Use Land Cover
  url: https://www.nrsc.gov.in/nrscnew/Apps_LULC.php
  fetched: '2026-10-31'
