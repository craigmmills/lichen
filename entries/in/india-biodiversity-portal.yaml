summary: Open portal that aggregates biodiversity data for India, with species pages, citizen
  observations, maps and documents. Its own site refuses automated reading, so this comes
  from Strand Life Sciences.
facts:
- claim: Strand Life Sciences says the portal aggregates biodiversity data and gives free,
    open access.
  url: https://us.strandls.com/biodiversity-informatics
  quote: IBP aggregates biodiversity data and provides free, open access to all.
  fetched: '2026-10-31'
- claim: GBIF's publisher record describes it as a repository on the biodiversity of the Indian
    subcontinent.
  url: https://api.gbif.org/v1/organization/62431bdf-fa0c-452b-afce-be14884a47ff
  fetched: '2026-10-31'
  quote: The India Biodiversity Portal (IBP) is a repository of information designed to harness
    and disseminate collective intelligence on the biodiversity of the Indian subcontinent.
- claim: GBIF publisher record describes it as a repository of biodiversity information for
    the Indian subcontinent.
  url: https://api.gbif.org/v1/organization/62431bdf-fa0c-452b-afce-be14884a47ff
  fetched: '2026-10-31'
  quote: is a repository of information designed to harness and disseminate collective intelligence
    on the biodiversity of the Indian subcontinent
- claim: Mongabay India reported 26,000 species from 1.3 million observations in 2017.
  url: https://india.mongabay.com/2017/12/enthusiasts-and-experts-document-biodiversity-on-a-digital-platform/
  fetched: '2026-10-31'
  quote: Since 2008, the India Biodiversity Portal has recorded above 26,000 species from
    1.3 million observations.
- claim: Mongabay India reported that after CEPF funding ended the portal was run as a consortium.
  url: https://india.mongabay.com/2017/12/enthusiasts-and-experts-document-biodiversity-on-a-digital-platform/
  fetched: '2026-10-31'
  quote: Now it is run as a consortium.
- claim: Publishes a publication-grade dataset on GBIF.
  url: https://api.gbif.org/v1/dataset/c6b86c40-ff71-4e5e-902c-111f400d0d56
  fetched: '2026-10-31'
  quote: A dataset comprising all observation data from the India Biodiversity Portal that
    are evaluated to be of publication grade
