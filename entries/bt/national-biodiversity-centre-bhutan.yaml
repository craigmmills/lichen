summary: A Thimphu-based body set up in 1998 under the Ministry of Agriculture and Livestock, serving
  as national biodiversity information clearing house and secretariat to the Bhutan Biodiversity Portal.
facts:
- claim: GBIF's publisher record says NBC, under the Ministry of Agriculture and Livestock, was set up
    in 1998 to coordinate and implement biodiversity conservation programmes in Bhutan.
  url: https://api.gbif.org/v1/organization/dcf2223a-5eae-4977-904c-ebd1819c603d
  fetched: 2026-11-12
  quote: National Biodiversity Centre (NBC), Ministry of Agriculture and Livestock was established in
    1998 to coordinate and implement biodiversity conservation and sustainable use programmes in Bhutan.
- claim: Its mandates include coordinating Bhutan's obligations under biodiversity conventions.
  url: https://api.gbif.org/v1/organization/dcf2223a-5eae-4977-904c-ebd1819c603d
  fetched: 2026-11-12
  quote: To coordinate and implement obligations under regional and international conventions, treaties
    and protocols related to biodiversity.
- claim: It serves as the national clearing house for biodiversity information.
  url: https://api.gbif.org/v1/organization/dcf2223a-5eae-4977-904c-ebd1819c603d
  fetched: 2026-11-12
  quote: To serve as the national clearing house for biodiversity information.
- claim: It is secretariat to the Bhutan Biodiversity Portal and manages biodiversity information.
  url: https://api.gbif.org/v1/organization/dcf2223a-5eae-4977-904c-ebd1819c603d
  fetched: 2026-11-12
  quote: NBC is secretariat to the consortium-based online platform, Bhutan Biodiversity Portal (www.biodiversity.bt)
    and manages biodiversity information.
- claim: Its address is at Serbithang, Thimphu.
  url: https://api.gbif.org/v1/organization/dcf2223a-5eae-4977-904c-ebd1819c603d
  fetched: 2026-11-12
  quote: 'Serbithang, Ministry of Agriculture and Livestock, PO Box.: 875, Thimphu, Bhutan.'
- claim: The Ministry of Agriculture and Livestock says NBC and the Department of Environment and Climate
    Change jointly led preparation of Bhutan's 5th NBSAP, launched on 16 September 2025.
  url: https://www.moal.gov.bt/?p=8330
  fetched: 2026-11-12
  quote: The National Biodiversity Centre under the Ministry of Agriculture and Livestock and the Department
    of Environment and Climate Change under the Ministry of Energy and Natural Resources jointly led the
    preparation of the 5 th NBSAP
