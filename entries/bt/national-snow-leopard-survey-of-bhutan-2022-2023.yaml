summary: A closed survey run by DoFPS and funded by Bhutan for Life, using 310 camera-trap stations over
  9,000 km² and confirming 134 snow leopards, up from 96 in 2016 (announced September 2023).
facts:
- claim: The survey installed 310 camera-trap stations across over 9,000 km² of snow leopard habitat.
  url: https://www.dofps.gov.bt/?p=4552
  fetched: 2026-11-12
  quote: Snow leopard habitats spanning over 9000 km sq. across the northern alpine landscape of Bhutan
    were surveyed by installing 310 camera trap stations.
- claim: It confirmed 134 snow leopards, up from 96 in the 2016 baseline (results announced September
    2023).
  url: https://www.dofps.gov.bt/?p=4552
  fetched: 2026-11-12
  quote: The survey confirmed the presence of 134 snow leopards in Bhutan, with an overall density of
    1.34 snow leopards per 100 km sq.
