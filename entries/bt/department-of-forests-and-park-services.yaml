summary: Bhutan's forest and park agency reportedly uses SMART patrolling, invests in drone and AI-enabled
  surveillance, and participated in a Mangdechhu eDNA pilot detecting 201 vertebrate taxa.
facts:
- claim: Asia News Network reports that DoFPS has used SMART patrolling since March 2020, with the v6
    model deployed in July 2025, and that SMART Connect would roll out nationally.
  url: https://asianews.network/?p=225966
  fetched: 2026-11-12
  quote: SMART patrolling has been in use since March 2020, with the latest v6 model deployed in July
    2025.
- claim: The same report says the department is investing in drone and AI-enabled surveillance.
  url: https://asianews.network/?p=225966
  fetched: 2026-11-12
  quote: The department is also investing in drone and AI-enabled surveillance, forensic evidence capacity,
    and frontline training in investigation and legal documentation.
- claim: BBS reports that the department's foresters and officials were undergoing six-day SMART Connect
    training to support monitoring of forest cover, wildlife populations, poaching and illegal logging;
    it also reports SMART active in over 1,200 sites across Bhutan.
  url: https://www.bbs.bt/foresters-to-step-up-conservation-efforts-through-use-of-online-system-that-provides-real-time-data-in
  fetched: 2026-11-12
  quote: Initially developed as a law enforcement tool and piloted in a few sites, SMART is now active
    in over 1200 sites across the country.
- claim: Its site lists a Forest Monitoring and Information Division among its functional divisions.
  url: https://www.dofps.gov.bt/?p=4552
  fetched: 2026-11-12
  quote: Forest Monitoring and Information Division Organogram
- claim: Its site lists protected areas such as Jigme Dorji National Park and Royal Manas National Park
    under the department.
  url: https://www.dofps.gov.bt/?p=4552
  fetched: 2026-11-12
  quote: Royal Manas National Park Introduction
- claim: The Bhutanese reports that DoFPS carried out a pilot eDNA project in the Mangdechhu river basin,
    with WWF-Bhutan, Bhutan for Life and ETH Zurich, which detected 201 unique vertebrate taxa.
  url: https://thebhutanese.bt/bhutan-establishes-first-edna-lab-with-support-from-wwf-bhutan-to-strengthen-biodiversity-monitoring/
  fetched: 2026-11-12
  quote: The establishment of the lab follows a successful pilot eDNA project in the Mangdechhu river
    basin, carried out by the Department of Forests and Park Services with support from WWF-Bhutan, Bhutan
    for Life, and ETH Zurich.
- claim: An MBZ Species Conservation Fund page records an $8,500 grant awarded on 6 December 2024, naming
    Tashi Dhendup with a Nature Conservation Division, Department of Forests and Park Services affiliation,
    for wild felid occupancy, health monitoring and threat assessment in Bhutan.
  url: https://speciesconservation.org/small-grant/clouded-leopard/35378
  fetched: 2026-11-12
  quote: 'Enhancing Conservation Efforts through Occupancy, Health Monitoring, Threat Assessment of Wild
    Felids in Bhutan: Capacity Building and Advanced Survey Techniques'
