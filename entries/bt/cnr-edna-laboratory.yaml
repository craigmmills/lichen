facts:
- claim: The CNR Science Laboratory site says the eDNA Laboratory detects and analyses
    genetic material released by organisms into soil, water and air, to study biodiversity
    and monitor species.
  url: https://sites.google.com/rub.edu.bt/science-laboratory/explore-our-labs/edna-lab
  fetched: 2026-11-15
  quote: This non-invasive technique helps to study biodiversity, monitor species,
    and assess ecosystem health without the need to capture or observe organisms directly.
- claim: The same page says the College celebrated the launch of the lab on 25 April
    2025.
  url: https://sites.google.com/rub.edu.bt/science-laboratory/explore-our-labs/edna-lab
  fetched: 2026-11-15
  quote: On April 25th 2025, the College celebrated the launch of the eDNA laboratory.
- claim: The Bhutanese reports that it is Bhutan's first eDNA laboratory, established
    with support from ETH Zurich and WWF-Bhutan and contributions from Bhutan for
    Life, and equipped to carry out DNA analysis within the country.
  url: https://thebhutanese.bt/bhutan-establishes-first-edna-lab-with-support-from-wwf-bhutan-to-strengthen-biodiversity-monitoring/
  fetched: 2026-11-15
  quote: It is equipped to carry out DNA analysis within the country, a task that
    previously required sending samples abroad
