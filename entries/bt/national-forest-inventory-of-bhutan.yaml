summary: Bhutan's first full national forest inventory, run by the Royal Government of Bhutan, was reported
  complete by UN-REDD in August 2019, with results in two reports.
facts:
- claim: In August 2019, UN-REDD reported that the Royal Government of Bhutan had completed its first
    full National Forest Inventory, with results presented in two reports.
  url: https://www.un-redd.org/post/understanding-forests-beyond-forest-cover-bhutans-redd-journey
  fetched: 2026-11-12
  quote: RGoB has also successfully completed its first full National Forest Inventory (NFI), supported
    by SNV, Bhutan Trust Fund for Environmental Conservation, European Union, United Nations Development
    Programme (UNDP), the Food and Agriculture Organization of the United Nations (FAO) and FCPF.
- claim: UN-REDD identified a National Forest Monitoring System and its Measurement, Reporting and Verification
    function as parts of the intended main outcome of Bhutan's REDD+ readiness programme.
  url: https://www.un-redd.org/post/understanding-forests-beyond-forest-cover-bhutans-redd-journey
