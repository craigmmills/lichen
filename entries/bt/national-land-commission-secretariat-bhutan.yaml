summary: BBS reports it leads a satellite data initiative with the Bhutan Foundation
  and Planet Labs, and quotes its land use and land cover mapping mandate.
facts:
- claim: BBS quotes the Chief of the Geo-Informatics Division, Department of Survey
    and Mapping, National Land Commission Secretariat, saying the commission has the
    mandate to update the national land use and land cover mapping.
  url: https://www.bbs.bt/241828/
  fetched: 2026-11-15
  quote: The National Land Commission has the mandate to update the national land
    use and land cover mapping.
- claim: BBS reports that the Bhutan Foundation and the National Land Commission Secretariat,
    with Planet Labs, are leading an initiative on satellite data for conservation,
    disaster preparedness and planning.
  url: https://www.bbs.bt/241828/
  fetched: 2026-11-15
  quote: The Bhutan Foundation and the National Land Commission Secretariat, in collaboration
    with Planet Labs, are leading the initiative.
- claim: A 2024 ISPRS paper by authors at the secretariat says the National Land Use
    Zoning exercise was conducted by the NLCS with other agencies of the Royal Government
    of Bhutan, to integrate spatial data across agencies.
  url: https://isprs-archives.copernicus.org/articles/XLVIII-4-2024/453/2024/
  fetched: 2026-11-15
  quote: The National Land Use Zoning (NLUZ) exercise was conducted by the National
    Land Commission Secretariat (NLCS) in collaboration with other agencies of the
    Royal Government of Bhutan.
