  1,500 square kilometres.
facts:
- claim: Explorers Against Extinction's project page describes M3D as the flagship
    project of the Bhutan Ecological Society and the School for Field Studies, which
    it began supporting in 2026.
  url: https://explorersagainstextinction.co.uk/?p=18582
  fetched: 2026-11-15
  quote: In 2026, Explorers Against Extinction began supporting their flagship Monitoring
    Mountain Mammalian Diversity (M3D) project in western Bhutan.
- claim: The page says the project, building on a pilot that documented 20 mammal
    species, will expand monitoring to about 150 camera trap stations covering around
    1,500 square kilometres.
  url: https://explorersagainstextinction.co.uk/?p=18582
