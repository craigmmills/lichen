    and Indian pangolins were recorded at four camera stations.
  url: https://www.bhutanfound.org/advancing-pangolin-conservation-in-bhutan/
  fetched: 2026-11-13
  quote: A total of 285 camera traps were installed across a 1 × 1 km grid
- claim: It says seven AudioMoth recorders detected no confirmed pangolin calls and
    ten biological samples were collected for genetic analysis.
  url: https://www.bhutanfound.org/advancing-pangolin-conservation-in-bhutan/
