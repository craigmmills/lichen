summary: An active project with DoFPS, WWF Bhutan and the College of Natural Resources to make Bhutan's
  first nationwide eDNA biodiversity map, setting a baseline from around 200 river catchment sampling
  locations.
facts:
- claim: WSL says WildinSync is working with the Nature Conservation Division, DoFPS, WWF Bhutan and the
    College of Natural Resources on the first nationwide biodiversity map using eDNA.
  url: https://www.wsl.ch/en/news/wildinsync-using-edna-for-nationwide-biodiversity-mapping-in-bhutan/
  fetched: 2026-11-12
  quote: In Bhutan, WildinSync is working with the Nature Conservation Division, the Department of forest
    and park services, WWF Bhutan, and the College of Natural Ressources to support the first nationwide
    biodiversity map using eDNA.
- claim: Around 200 sampling locations across river catchments will set a baseline, processed in Bhutan's
    first eDNA laboratory, operational since spring 2025 and co-founded by WildinSync.
  url: https://www.wsl.ch/en/news/wildinsync-using-edna-for-nationwide-biodiversity-mapping-in-bhutan/
  fetched: 2026-11-12
  quote: Around 200 sampling locations across river catchments will establish a baseline that can be updated
    over time.
- claim: In February 2026 WildinSync led a workshop at the College of Natural Resources that trained rangers
    in eDNA sampling.
  url: https://www.wsl.ch/en/news/wildinsync-using-edna-for-nationwide-biodiversity-mapping-in-bhutan/
  fetched: 2026-11-12
  quote: On 9 February 2026, WildinSync led a workshop at Bhutan’s College of Natural Resources.
