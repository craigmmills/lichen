  quote: 'Citation: DoFPS, WWF & ETH. 2024. eDNA for biodiversity monitoring in'
- claim: The 2024 report describes an eDNA pilot in south-central Bhutan to assess
    biodiversity and re-evaluate detection of tigers and their prey.
  url: https://files.worldwildlife.org/wwfcmsprod/files/Publication/file/vlf29nqkv_Bhutan_eDNA_Pilot_Report_176_x_250_mm_.pdf_print_version.pdf
  fetched: 2026-11-15
  quote: Bhutan is piloting eDNA sampling techniques in the south-central part of
    the country
- claim: One of the pilot study's objectives was to test eDNA as a complementary tool
    for tiger and prey monitoring.
  url: https://files.worldwildlife.org/wwfcmsprod/files/Publication/file/vlf29nqkv_Bhutan_eDNA_Pilot_Report_176_x_250_mm_.pdf_print_version.pdf
