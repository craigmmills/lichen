summary: Research, education, outreach and policy centre established under the Department
  of Forests and Park Services; in 2022 its team satellite-collared a tiger responsible
  for cattle kills, per the Bhutan Foundation.
facts:
- claim: The department's page says the Bhutan Tiger Center was established under
    the direction of the Department of Forests and Park Services, Royal Government
    of Bhutan.
  url: https://www.dofps.gov.bt/?p=1655
  fetched: 2026-11-15
  quote: under the direction of the Department of Forests and Park Services , Ministry
    of Agriculture and Forests , Royal Government of Bhutan
- claim: The same page says the centre serves as a centre for research, education,
    outreach and policy, and lists understanding the ecology of mountain tigers and
    other cats among its work.
  url: https://www.dofps.gov.bt/?p=1655
  fetched: 2026-11-15
  quote: Understanding the ecology of mountain tigers and other cats
- claim: A Bhutan Foundation post dated 26 October 2022 says a team from the Bhutan
    Tiger Centre and the department captured a tiger responsible for cattle kills
    the previous month, fitted it with a satellite collar and released it to allow
    its movement to be monitored.
  url: https://www.bhutanfound.org/?p=10475
  fetched: 2026-11-15
  quote: a team from the Bhutan Tiger Centre and the Department of Forests and Park
    Services was able to capture a tiger that was responsible for multiple cattle
    kills
- claim: The same post says the Bhutan Foundation helped build the BTC team's capacity
    to capture tigers.
  url: https://www.bhutanfound.org/?p=10475
  fetched: 2026-11-15
  quote: the Bhutan Foundation played a huge role in helping build this capacity over
    the years
