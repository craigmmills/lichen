summary: An online forest data repository run by Bhutan's Department of Forests and
  Park Services, developed in 2017, holds human-wildlife conflict reports and poaching
  records.
facts:
- claim: The department's site describes FIRMS as an online data repository of DoFPS
    developed in 2017.
  url: https://www.dofps.gov.bt/page/15
  fetched: 2026-11-13
  quote: an online data repository of DoFPS was developed in 2017
- claim: The department's FIRMS data management document, undated and giving 2021
    examples, said FIRMS was housed in the Forest Resources Management Division.
  url: https://www.dofps.gov.bt/download/2615/
  fetched: 2026-11-13
  quote: FIRMS is currently housed in the Forest Resources Management Division
- claim: The department's page on the Forest Monitoring and Information Division,
    set up in 2023, says that division manages FIRMS among its digital platforms.
  url: https://dofps.gov.bt/?p=1602
  fetched: 2026-11-13
  quote: Coordinate field inventories and manage digital platforms such as FIRMS,
    OFS and SDSS
- claim: The same document lists human-wildlife conflict field reports from beat and
    range offices, with SMART information use, among the data held.
  url: https://www.dofps.gov.bt/download/2615/
  fetched: 2026-11-13
  quote: 8 Human Wildlife Conflict Beat office and Range Office Field report, SMART
    information use
- claim: It also lists poaching and wildlife crime records from range offices, divisions
    and parks.
  url: https://www.dofps.gov.bt/download/2615/
  fetched: 2026-11-13
  quote: 23 Poaching & Wildlife Crime Range office/ Division/Park Money receipt, compounding
    sheet
- claim: The document says data in the FIRMS database is sought by researchers, academics
    and policy makers.
  url: https://www.dofps.gov.bt/download/2615/
  fetched: 2026-11-13
  quote: FIRMS database system is being sought by different researchers, academicians,
    policy makers,
