summary: Running from July 2024 to June 2027 under Naturhistorisches Museum Wien,
  the project plans forest mapping, uses Google Earth Engine and develops avian malaria
  sampling.
facts:
- claim: The OeAD project page gives the project's duration as 1 July 2024 to 30 June
    2027.
  url: https://oead.at/en/kooperationen/internationale-hochschulkooperationen/kooperation-entwicklungsforschung/koef189-epic
  fetched: 2026-11-13
  quote: 'Project duration : 01.07.2024 - 30.06.2027'
- claim: The page says the project will map forest cover and types with GIS and remote
    sensing and correlate them with biodiversity metrics and the health of bird species.
  url: https://oead.at/en/kooperationen/internationale-hochschulkooperationen/kooperation-entwicklungsforschung/koef189-epic
  fetched: 2026-11-13
  quote: the project will map forest cover and types, assess changes, and correlate
    these with biodiversity metrics and the health of avian species
- claim: A workshop report on the page says the team uses Google Earth Engine to analyse
    multi-temporal satellite imagery of the White-bellied Heron's watershed.
  url: https://oead.at/en/kooperationen/internationale-hochschulkooperationen/kooperation-entwicklungsforschung/koef189-epic
  fetched: 2026-11-13
  quote: We use remote sensing tools, particularly Google Earth Engine, to analyze
    multi-temporal satellite imagery, assess vegetation changes
- claim: The page says the team is developing a sampling design for avian malaria
    screening in Bhutan's forest birds.
  url: https://oead.at/en/kooperationen/internationale-hochschulkooperationen/kooperation-entwicklungsforschung/koef189-epic
  fetched: 2026-11-13
  quote: we develop a sampling design for avian malaria screening
