summary: One of four functional divisions of Bhutan's forest department, set up in
  the 2023 restructuring, that runs national forest inventories, remote sensing for
  forest health, cover and carbon, and the FIRMS platform.
facts:
- claim: The department's site says FMID is one of its four functional divisions,
    established in the 2023 restructuring to strengthen the department's monitoring
    system.
  url: https://dofps.gov.bt/?p=1602
  fetched: 2026-11-13
  quote: It was established during the organizational restructuring exercise of 2023
    with the primary objective of strengthening the Department’s monitoring system
    and enhancing service delivery.
- claim: The page says the division conducts national inventories and remote sensing
    to generate data on forest health, cover and carbon stocks.
  url: https://dofps.gov.bt/?p=1602
  fetched: 2026-11-13
  quote: 'Monitoring and Measuring: Conduct national inventories and remote sensing
    to generate critical data on forest health, cover, and carbon stocks.'
- claim: Its Forest Resources Inventory Section is responsible for periodic forest
    inventories, including the National Forest Inventory.
  url: https://dofps.gov.bt/?p=1602
  fetched: 2026-11-13
  quote: The section is responsible for periodic inventories of forests including
    National Forest Inventory (NFI)
- claim: The page says the division manages digital platforms including FIRMS.
  url: https://dofps.gov.bt/?p=1602
  fetched: 2026-11-13
  quote: Coordinate field inventories and manage digital platforms such as FIRMS,
    OFS and SDSS
