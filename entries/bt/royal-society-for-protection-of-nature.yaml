summary: A citizen-based NGO established in 1987, reporting a week-long drone study that located a White-bellied
  Heron nest and plans to introduce AI-powered conservation technologies.
facts:
- claim: RSPN says it was set up in 1987 as a citizen-based non-governmental organisation for conservation
    of Bhutan's environment.
  url: https://rspnbhutan.org/
  fetched: 2026-11-12
  quote: Royal Society for Protection of Nature (RSPN) was established in 1987 under the Royal Command
    of His Majesty The Fourth King of Bhutan as a citizen-based Non-Governmental Organization
- claim: RSPN ran a week-long feasibility study of drones to monitor the White-bellied Heron, which located
    a new nest.
  url: https://rspnbhutan.org/?p=20770
  fetched: 2026-11-12
  quote: During the feasibility study, drone usage led to the successful location of a new nest and the
    observation of five herons.
- claim: RSPN says it plans to keep using drones for heron and other wildlife monitoring, and to introduce
    AI-powered conservation technologies.
  url: https://rspnbhutan.org/?p=20770
  fetched: 2026-11-12
  quote: Later this year, RSPN also plans to introduce other conservation technologies powered by AI to
    streamline data collection and further enhance WBH monitoring efforts.
