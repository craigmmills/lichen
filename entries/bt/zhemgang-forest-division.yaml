facts:
- claim: The department's site lists a Zhemgang Division among its divisional forest
    offices.
  url: https://www.dofps.gov.bt/?p=4552
  fetched: 2026-11-13
  quote: Zhemgang Division
- claim: BBS reported that the division office installed camera traps in its territory,
    and that footage from them showed a tigress last seen in 2014 with three cubs.
  url: https://www.bbs.bt/tigress-spotted-with-three-cubs-after-seven-years
  fetched: 2026-11-13
  quote: The division office installed the camera traps in April last year.
- claim: BBS reported that a report on tiger numbers, density, movement, habitat and
    food sources in Zhemgang was expected, with the work supported by WWF Bhutan's
    CA|TS programme and the UNDP GEF Small Grants Programme.
  url: https://www.bbs.bt/tigress-spotted-with-three-cubs-after-seven-years
  fetched: 2026-11-13
  quote: The works were carried out with the support from WWF Bhutan’s CA|TS Programme
    and the UNDP GEF Small Grants Programme.
