summary: Environment Authority centre in Oman that runs coastal ecosystem field surveys;
  in September 2026 its monitoring unit described bird monitoring at Khor Al Har as
  part of a periodic biodiversity programme.
facts:
- claim: In September 2026, the centre's Environmental Monitoring Unit supervisor
    said that observers' bird monitoring at Khor Al Har formed part of a periodic
    biodiversity monitoring programme (Oman Observer, from ONA).
  url: https://www.omanobserver.om/article/1196321/oman/environment-authority-monitors-biodiversity-in-masirah
  fetched: 2026-11-15
  quote: the monitoring activities carried out by observers at Khor Al Har are part
    of the periodic biodiversity monitoring programme
- claim: Oman Observer reported in September 2026 that Environment Authority monitoring
    at sites in Masirah tracked wildlife and added observations to the biodiversity
    database.
  url: https://www.omanobserver.om/article/1196321/oman/environment-authority-monitors-biodiversity-in-masirah
  fetched: 2026-11-15
  quote: track wildlife and document observations and findings, thereby strengthening
    the database of biodiversity and helping to track changes within ecosystems
- claim: The centre carries out coastal ecosystem field surveys on behalf of the Environment
    Authority.
  url: https://www.omanobserver.om/article/1194209/oman/ea-conducts-field-surveys-of-coastal-ecosystems-in-masirah
  fetched: 2026-11-15
  quote: The Environment Authority, represented by the Environment Centre in the Wilayat
    of Masirah, Al Sharqiyah South Governorate, has commenced field survey work
