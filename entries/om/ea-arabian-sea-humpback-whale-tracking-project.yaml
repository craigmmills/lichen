  by drone, meant to allow remote measurement and threat mapping.
facts:
- claim: The Special Economic Zone at Duqm reported in February 2024 that the Environment
    Authority began the project in December 2023 and fitted a satellite tracking chip
    and an 8-hour acoustic recorder to a humpback whale using a drone.
  url: https://duqm.gov.om/en/sezad/media/news/2024/ea-successfully-installs-a-tracking-chip-on-an-arabian-sea-humpback-whale-in-duqm
