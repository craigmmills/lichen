  quote: In December 2023, EA kicked off an Arabian Sea humpback whale tracking chip
    project and managed to install a satellite tracking chip and an 8-hour acoustic
    recorder
- claim: The project is meant to allow remote measurement by satellite and mapping
    of threats to the species.
