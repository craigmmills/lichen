summary: Official body for producing, reviewing and approving Oman's map, according to the Ministry of
  Defence, which says it was renamed in August 2024 from the National Survey Authority.
facts:
- claim: The Ministry of Defence page says the authority is the official body charged with producing,
    reviewing and approving the map of Oman.
  url: https://mod.gov.om/Home/NSA
  fetched: 2026-11-08
  quote: الهيئة الوطنية للمساحة هي الجهة الرسمية الموكل إليها إنتاج ومراجعة واعتماد خريطة سلطنة عمان
- claim: The Ministry of Defence page says it produces military and civil maps and carries out aerial
    photography across Oman.
  url: https://mod.gov.om/Home/NSA
  fetched: 2026-11-08
  quote: إنتاج الخرائط العسكرية والمدنية، وعمليات التصوير الجوي في جميع أرجاء سلطنة عمان
- claim: The Ministry of Defence page says its name changed in August 2024 from the National Survey Authority
    to the National Survey and Geospatial Information Authority.
  url: https://mod.gov.om/Home/NSA
  fetched: 2026-11-08
