summary: Active platform, built by the Arabian Sea Whale Network and Wild Me, that matches humpback and
  sperm whale tail fluke images by computer vision and archives genetic and tagging data.
facts:
- claim: Flukebook matches humpback and sperm whale tail fluke images using computer vision.
  url: https://arabianseawhalenetwork.org/aswn-flukebook-data-platform/
  fetched: 2026-11-08
  quote: Flukebook.org was originally developed as an open-source online tool to assist with digital matching
    of humpback whale and sperm whale tail fluke images, using Computer Vision matching technology.
- claim: The platform archives data on genetic sampling and satellite tagging of individual whales.
