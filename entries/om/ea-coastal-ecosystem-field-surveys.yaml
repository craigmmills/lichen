status: active
summary: Active Environment Authority programme of coastal and wetland field surveys
  that aims to assess coastal condition and add to the national biodiversity database,
  using offline electronic field forms at the Masirah centre.
facts:
- claim: The surveys aim to evaluate the condition of coasts and coastal wetlands
    and add to the national biodiversity database.
  url: https://www.omanobserver.om/article/1194209/oman/ea-conducts-field-surveys-of-coastal-ecosystems-in-masirah
  fetched: 2026-11-13
  quote: aiming to evaluate the environmental condition of coasts and coastal wetlands
    and enhance the national biodiversity database.
- claim: The wetland surveys measure lagoon water connectivity and hydrology and document
    biodiversity at the sites surveyed.
  url: https://www.omanobserver.om/article/1194209/oman/ea-conducts-field-surveys-of-coastal-ecosystems-in-masirah
  fetched: 2026-11-13
  quote: in addition to documenting biodiversity components at the sites covered by
    the survey work.
- claim: The Masirah centre uses electronic field forms that work offline and record
    site coordinates automatically.
  url: https://www.omanobserver.om/article/1194209/oman/ea-conducts-field-surveys-of-coastal-ecosystems-in-masirah
  fetched: 2026-11-13
  quote: the Environment Centre in the Wilayat of Masirah has introduced electronic
    field forms that allow teams to record data directly from the devices used in
    the survey
