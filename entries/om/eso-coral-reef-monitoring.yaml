summary: Active project run by the Environment Society of Oman with National Geographic Society funding,
  using eight monitoring sites and introducing AI analysis tools ReefCloud and MERMAID at an April 2025
  workshop.
facts:
- claim: Two years of funding were secured from the National Geographic Society in January 2025.
  url: https://eso.org.om/?p=8235
  fetched: 2026-11-08
  quote: Funding over a 2-year project cycle was secured from The National Geographic Society in January
    2025.
- claim: Eight monitoring sites were set up, four inside the Ad Dimaniyyat Islands Nature Reserve.
  url: https://eso.org.om/?p=8235
  fetched: 2026-11-08
  quote: A total of 8 monitoring sites were established, including 4 sites within the Ad Dimaniyyat Islands
    Nature Reserve (DINR).
- claim: Surveys run twice a year, before and after summer, to capture bleaching and recovery.
  url: https://eso.org.om/?p=8235
  fetched: 2026-11-08
  quote: Surveys are conducted twice a year, before summer and after summer in order to capture bleaching
    and recovery.
- claim: The April 2025 launch workshop, organised with NYU Abu Dhabi, introduced participants to AI-driven
    analysis tools such as ReefCloud and MERMAID.
  url: https://eso.org.om/?p=8235
  fetched: 2026-11-08
