summary: Active Oman-based organisation named as coordinator of the November to December
  2023 humpback whale survey in the Gulf of Masirah, and as a collaborator in the
  Environment Society of Oman's turtle programme.
facts:
- claim: The Arabian Sea Whale Network says the November to December 2023 humpback
    whale survey in the Gulf of Masirah was coordinated by Future Seas, based in Oman.
  url: https://arabianseawhalenetwork.org/2024/01/15/collaboration-and-innovation-for-endangered-arabian-sea-humpback-whales-in-oman/
  fetched: 2026-11-13
  quote: At the height of the survey, which was coordinated by Future Seas, based
    in Oman, three boats were working in parallel in the Gulf of Masirah
- claim: The survey used photo-identification, genetic and acoustic sampling, satellite
    tags and drones to deploy suction cup tags.
  url: https://arabianseawhalenetwork.org/2024/01/15/collaboration-and-innovation-for-endangered-arabian-sea-humpback-whales-in-oman/
  fetched: 2026-11-13
  quote: implementing photo-identification, genetic sampling, acoustic sampling, body
    condition measurements, deployment of long-term satellite tags, and innovative
    new technology using drones to deploy short-term suction cup tags.
- claim: The Environment Society of Oman names Future Seas Global SPC among the collaborators
    implementing its turtle programme.
  url: https://eso.org.om/turtles/
