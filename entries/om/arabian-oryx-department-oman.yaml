summary: Oman's Arabian Oryx Reserve unit reported in January 2024 that it used a
  tracking collar and habitat monitoring, with about 900 Arabian oryx, 1,140 sand
  gazelles and 140 Arabian gazelles.
facts:
- claim: In January 2024, the reserve reported using a tracking collar to record oryx
    coordinates and historical distribution, and monitoring their natural habitats.
  url: https://www.omanobserver.om/ampArticle/1149044
  fetched: '2026-11-12'
  quote: the reserve worked to document the steps of the natural migration of the
    oryx by installing a tracking collar on the oryx to know the coordinates of its
    presence and the extent of its historical distribution, as well as monitoring
    its natural habitats throughout the region.
- claim: In January 2024, the reserve reported about 900 Arabian oryx, 1,140 sand
    gazelles and 140 Arabian gazelles.
  url: https://www.omanobserver.om/ampArticle/1149044
  fetched: '2026-11-12'
  quote: The reserve also includes 1,140 sand gazelle and 140 heads of Arabian gazelle
- claim: In January 2024, the Director of the Arabian Oryx Department described the
    Arabian Oryx Reserve as Oman's first nature reserve, covering about 2,824 square
    kilometres.
  url: https://www.omanobserver.om/ampArticle/1149044
  fetched: '2026-11-12'
  quote: 'Sultan bin Mohammed al Balushi, Director of the Arabian Oryx Department,
    said: “The Arabian Oryx Reserve is the first natural reserve in Oman'
