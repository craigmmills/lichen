summary: Active project run by the Environment Society of Oman, funded by the National Geographic Society,
  surveying eight sites twice yearly for bleaching and recovery, launched in April 2025 with AI tool training.
facts:
- claim: Eight monitoring sites were set up, four of them in the Ad Dimaniyyat Islands Nature Reserve,
    and are surveyed twice a year to capture bleaching and recovery.
  url: https://eso.org.om/coral-research-and-conservation/
  fetched: 2026-11-08
  quote: A total of 8 monitoring sites were established, including 4 sites within the Ad Dimaniyyat Islands
    Nature Reserve (DINR). Surveys are conducted twice a year, before summer and after summer in order
    to capture bleaching and recovery.
- claim: Planned monitoring includes coral cover, coral genus diversity and stressors such as bleaching
    and disease.
  url: https://eso.org.om/coral-research-and-conservation/
  fetched: 2026-11-08
  quote: Monitoring will include coral cover, coral genus diversity, and the presence of stressors like
    bleaching and disease
- claim: The project was launched in April 2025 with a workshop that introduced participants to reef monitoring
    protocols and to AI tools such as ReefCloud and MERMAID.
  url: https://eso.org.om/coral-research-and-conservation/
  fetched: 2026-11-08
  quote: data archiving and the use of AI driven tools such as ReefCloud and Mermaid to support analysis
    and reporting.
