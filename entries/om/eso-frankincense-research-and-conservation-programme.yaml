summary: Running since 2010, this ESO programme studies Boswellia sacra health and
  distribution in Dhofar; its 2025 report records a published rapid assessment and
  ongoing Wadi Dawkah baseline surveys.
facts:
- claim: Began in 2010 and aims to carry out health assessment and distribution studies
    of Boswellia sacra in Dhofar to support an updated population assessment.
  url: https://eso.org.om/frankincense/
  fetched: 2026-11-13
  quote: Conduct health assessment and distribution studies of Boswellia sacra in
    Dhofar to support an updated population assessment.
- claim: ESO undertook a rapid population and distribution assessment of the trees.
  url: https://eso.org.om/frankincense/
  fetched: 2026-11-13
  quote: More recently ESO undertook a rapid population and distribution assessment
    (results pending publication).
- claim: ESO's 2025 annual report says the results of earlier tree assessments were
    published in a 2025 paper on a rapid population assessment of frankincense trees
    in Oman.
