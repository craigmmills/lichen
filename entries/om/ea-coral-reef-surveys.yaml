  quote: Environmental studies and periodic surveys conducted by the Authority provide
    data on living coral cover, growth rates and the impact of coral bleaching
- claim: Surveys for the Daymaniyat coral project use 30-metre transects at five-metre
    intervals.
  url: https://timesofoman.com//article/171872-environment-authority-expands-coral-reef-restoration-projects-to-protect-marine-biodiversity
  fetched: 2026-11-13
  quote: Survey operations are conducted according to the International Maritime Organization
    survey strategy through 30-meter cross-sections distributed at five-meter intervals.
