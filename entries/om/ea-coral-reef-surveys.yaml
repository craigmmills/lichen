summary: Active programme of periodic coral reef surveys run by the Environment Authority,
  reported in 2026 as giving data on live coral cover, growth rates and bleaching
  impact, using 30-metre transects at Daymaniyat.
facts:
- claim: Times of Oman reported in 2026 that the Environment Authority's periodic
    surveys give data on living coral cover, growth rates and the impact of coral
    bleaching.
  url: https://timesofoman.com//article/171872-environment-authority-expands-coral-reef-restoration-projects-to-protect-marine-biodiversity
