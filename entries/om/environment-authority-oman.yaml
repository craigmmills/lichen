summary: Established in August 2020 by Royal Decree, it implements Oman's nature conservation laws, issues
  permits and publishes four GBIF datasets; its pages report 20 declared reserves.
facts:
- claim: Prepares and implements nature conservation laws and develops and follows up the national biodiversity
    strategy and action plan.
  url: https://ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: developing and following up the national strategy and bio-diversity action plan
- claim: Develops proposals for nature reserves and other protected sites and prepares their management
    plans.
  url: https://ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: It also develops proposals for the establishment of natural reserves, temporary protected sites
    and sites of special importance and the preparation of their management plans
- claim: Prepares reports on the status of wildlife in Oman.
  url: https://ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: preparing reports on the status of wildlife in the Sultanate
- claim: Registered as an endorsed data publisher with GBIF, with an address in Muscat.
  url: https://api.gbif.org/v1/organization?country=OM&limit=50
  fetched: 2026-11-08
  quote: '"endorsementStatus":"ENDORSED","title":"Environment Authority"'
- claim: Prepares and implements laws and decisions on nature conservation and wildlife, and develops
    and follows up the national biodiversity strategy and action plan.
  url: https://www.ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: The authority is concerned with preparing and implementing laws, regulations, regulations and
    decisions related to nature conservation and preserving the vocabulary of wildlife, developing and
    following up the national strategy and bio-diversity action plan
- claim: Develops proposals for nature reserves and other protected sites and prepares their management
    plans.
  url: https://www.ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: It also develops proposals for the establishment of natural reserves, temporary protected sites
    and sites of special importance and the preparation of their management plans
- claim: Issues permits for biological diversity work and for entry to reserves.
  url: https://www.ea.gov.om/en/the-authority/authority-mandates/nature-conservation/
  fetched: 2026-11-08
  quote: It also issues permits for biological diversity, entry to reserves and diving.
- claim: Publishes on its site statistics of green turtles in Ras Al Hadd Reserve for 2012 to 2019.
  url: https://www.ea.gov.om/en/the-authority/about-authority/green-turtles-in-ras-al-hadd-reserve/
  fetched: 2026-11-08
  quote: Statistics of green turtles in Ras Al Hadd during the period (2012-2019)
- claim: A news release dated 22 March 2022 reports the closing ceremony of its three-month Turtle Commando
    Program to protect and monitor sea turtles nesting on Omani beaches, with several participating parties.
  url: https://www.ea.gov.om/en/media-center/media-news/news/closing-ceremony-of-the-turtle-commando-program/
  fetched: 2026-11-08
  quote: the Environment Agency concludes the program specialized in the protection, control and monitoring
    of sea turtles (the Turtle Commando Program), which is concerned with the protection, control and
    monitoring of sea turtles, in which many parties participated and for a period of three months.
- claim: Registered with GBIF as a data publisher in Muscat, with four published datasets.
  url: https://api.gbif.org/v1/organization?country=OM
  fetched: 2026-11-08
  quote: '"address":["Muscat-Alkhwair"],"city":"Alkhwair","province":"Muscat","country":"OM","postalCode":"100","numPublishedDatasets":4'
- claim: Yale's Center for Biodiversity and Global Change lists the authority among its national partners,
    and says its staff ran workshops with the authority's leadership and staff during Oman Climate Week
    in February 2025.
  url: https://bgc.yale.edu/partnerships
  fetched: 2026-11-08
  quote: Alex and Claire were invited by the Chairman of the Oman Environment Authority (OEA) to attend
    Oman Climate Week, where they participated in the conference sessions and conducted workshops with
    leadership and staff of the OEA.
- claim: Established on 18 August 2020 by Royal Decree No. 106/2020.
  url: https://www.ea.gov.om/en/the-authority/about-authority/overview/
  fetched: 2026-11-08
  quote: The Environment Authority was established on the eighteenth of August 2020 AD according to the
    Royal Decree No. 106/2020
- claim: Tasked with implementing the laws on nature reserves, the marine environment and biological diversity.
  url: https://www.ea.gov.om/en/the-authority/about-authority/overview/
  fetched: 2026-11-08
  quote: implementing laws and legislations related to natural reserves, the marine environment and biological
