summary: Non-profit founded in 2004 that researches whales and dolphins, aims to survey turtles on Masirah
  Island, tracks vultures and partners with the Environment Authority.
facts:
- claim: Has done whale and dolphin research in Oman since it was founded in 2004, with a focus on the
    Arabian Sea humpback whale.
  url: https://eso.org.om/whales-and-dolphins
  fetched: 2026-11-08
  quote: ESO has been engaged in whale and dolphin research in Oman since the organisation’s inception
    in 2004, with a particular focus on the Arabian Sea humpback whale.
- claim: Its whale and dolphin work has included satellite tagging, photo-identification and acoustics.
  url: https://eso.org.om/whales-and-dolphins
  fetched: 2026-11-08
  quote: Previous work has included fieldwork and research on themes related to status assessments, abundance
    estimates, genetic analysis, satellite tagging, photo-identification, acoustics, spatial ecology and
    stranding assessments.
- claim: Published the Marine Mammal Atlas of Oman, drawn from 20 years of research.
  url: https://eso.org.om/whales-and-dolphins
  fetched: 2026-11-08
  quote: ESO’s Marine Mammal Atlas of Oman, a publication that is the culmination of 20 years of scientific
    research
