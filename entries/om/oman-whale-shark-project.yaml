summary: Active whale shark project run by the Marine Megafauna Foundation, whose
  June 2025 field season photo-identified 30 sharks and deployed nine satellite tags,
  the first on whale sharks in Omani waters, and which uses Sharkbook.ai.
facts:
- claim: MMF's Oman programme began in 2024 and ran its first dedicated whale shark
    field season in Omani waters in June 2025.
  url: https://marinemegafauna.org/projects/oman-whale-sharks
  fetched: 2026-11-13
  quote: We ran our first dedicated whale shark field season in Omani waters in June
    2025, working from Al Mouj Marina in Muscat with local dive operators.
- claim: The June 2025 season photo-identified 30 sharks and deployed nine satellite
    tags, the first on whale sharks in Omani waters.
  url: https://marinemegafauna.org/projects/oman-whale-sharks
  fetched: 2026-11-13
  quote: 19 days at sea from Muscat, 30 sharks photo-identified, and nine satellite
    tags deployed, the first ever placed on whale sharks in Omani waters.
- claim: The regional catalogue, linked to the Sharkbook.ai identification database,
    holds 319 whale sharks identified in Oman's waters.
  url: https://marinemegafauna.org/projects/oman-whale-sharks
  fetched: 2026-11-13
  quote: Reactivated and expanded the Sharkwatch Arabia network across Oman and the
    UAE, linked to the Sharkbook.ai identification database.
