summary: Diwan office whose researcher set Dhofar cameras, per a 2012 project page,
  and which reportedly recorded Nubian ibex and Arabian wolf in Jabal Samhan by September
  2022.
facts:
- claim: A Felidae Conservation Fund project page of 2012 says an OCE researcher worked
    with a field team to set and monitor remote cameras in the Qamar region of the
    Dhofar Mountains.
  url: https://felidaefund.org/projects/archive/arabian-leopards-in-oman
  fetched: '2026-11-12'
  quote: Hadi al Hickmani, a researcher with the Office of Conservation of the Environment,
    Diwan of Royal Court, works closely with Khaled al Hickmani, and the field team
    to set and monitor remote cameras in the Qamar region of the Dhofar Mountains.
- claim: The Oman News Agency reported in September 2022 that the Office for Conservation
    of Environment in Dhofar had also recorded Nubian ibex and Arabian wolf in Jabal
    Samhan Nature Reserve.
  url: https://www.omanobserver.om/article/1125179/oman/environment/arabian-leopard-cub-spotted-in-jabal-samhan-nature-reserve
  fetched: '2026-11-12'
  quote: The Office for Conservation of Environment in the Governorate of Dhofar also
    spotted other species of the Nubian ibex and the Arabian wolf in the Reserve.
