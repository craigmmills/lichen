summary: Active Environment Society of Oman programme, funded by the US Fish and Wildlife Service, that
  aims to run regular Masirah Island beach surveys, with a seasonal field team doing track counts.
facts:
- claim: Its objectives include regular beach surveys on Masirah Island to monitor turtle population trends,
    nesting activity and threats.
  url: https://eso.org.om/turtles/
  fetched: 2026-11-08
  quote: To undertake regular beach surveys on Masirah Island to record and monitor population trends,
    nesting activity and threats to nesting turtles.
- claim: ESO says it manages a seasonal field team that carries out early-morning track counts.
  url: https://eso.org.om/turtles/
  fetched: 2026-11-08
  quote: We manage a field team seasonally employed to conduct early-morning track counts
