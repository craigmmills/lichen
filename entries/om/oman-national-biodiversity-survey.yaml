summary: Environment Authority survey building a national wild mammal database, which Oman Daily reported
  in June 2024 had covered 804 squares, installed 683 camera traps and documented 80 species.
facts:
- claim: Oman Daily reported in June 2024 that the Environment Authority carries out the survey to build
    a national database of wild mammal species and update where they occur.
  url: https://www.omandaily.om/ampArticle/1159665
  fetched: 2026-11-08
  quote: وبناء قاعدة بيانات وطنية لأنواع الثدييات البرية وتحديث مناطق وجودها والتغيرات التي طرأت عليها
- claim: Oman Daily reported that 804 survey squares in nine governorates had been surveyed and 683 camera
    traps installed, with 80 species documented.
  url: https://www.omandaily.om/ampArticle/1159665
  fetched: 2026-11-08
  quote: وقد تم توثيق 80 نوعًا خلال هذه الفترة من الأعمال الميدانية
- claim: Oman Daily reported that field work was planned to run for three years, to the end of 2024.
  url: https://www.omandaily.om/ampArticle/1159665
  fetched: 2026-11-08
  quote: وسوف تستمر أعمال المشروع الميدانية على مدى 3 سنوات أي حتى نهاية عام 2024م
