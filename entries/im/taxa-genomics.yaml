facts:
- claim: Manx Radio reports that the company is based in Douglas and operates globally across commercial
    sectors.
  url: https://motorsport.manxradio.com/news/isle-of-man-news/local-company-launches-biodiversity-grant-to-support-conservation-and-research/
  fetched: 2026-11-12
  quote: Taxa Genomics, based in Douglas, operates globally across commercial sectors.
- claim: In May 2026, Manx Radio reported that its Biodiversity Grant offered each successful applicant
    eDNA or species identification analysis worth between £1,000 and £5,000.
  url: https://motorsport.manxradio.com/news/isle-of-man-news/local-company-launches-biodiversity-grant-to-support-conservation-and-research/
  fetched: 2026-11-12
  quote: The Taxa Genomics Biodiversity Grant delivers testing services directly, with each successful
    applicant receiving eDNA and/or species identification analysis equivalent in value to between £1,000
    and £5,000.
- claim: A presentation by Rachel Glover of Taxa Genomics, hosted by University College Isle of Man, reports
    that European eel appears extremely abundant in Isle of Man rivers, based on 2024 samples taken for
    internal research and development rather than a designed river survey; it says the finding warrants
    further investigation.
  url: https://www.ucm.ac.im/media/5444/rachel-glover-2025-ucm-taxa-genomics.pdf
