summary: Active monitoring station about two nautical miles off Port Erin, run by
  the Department of Environment, Food and Agriculture, where a buoy deployed in 2023
  measures water variables and fortnightly samples are analysed.
facts:
- claim: In 2023 the Environmental Protection Unit deployed a marine monitoring buoy
    at the Cypris station, about two nautical miles off Port Erin.
  url: https://biosphere.im/news/marine-monitoring
  fetched: 2026-11-13
  quote: deployed a marine monitoring buoy roughly two nautical miles off the coast
    of Port Erin at the Cypris marine monitoring station.
- claim: The buoy measures temperature, salinity, pH, turbidity, dissolved oxygen,
    chlorophyll and other variables.
  url: https://biosphere.im/news/marine-monitoring
  fetched: 2026-11-13
  quote: The Cypris buoy monitors for temperature, salinity, conductivity, pH, turbidity,
    dissolved oxygen, chlorophyll
- claim: The station is visited about every two weeks, and water samples are analysed
    for nutrients, phytoplankton and zooplankton.
  url: https://biosphere.im/news/marine-monitoring
  fetched: 2026-11-13
  quote: Water samples are collected using various techniques for the analysis of
    nutrients, phytoplankton and zooplankton.
- claim: Phytoplankton samples receive a full community analysis to identify species
    and abundances, and the Isle of Man has monitored phytoplankton species since
    1995.
  url: https://biosphere.im/news/marine-monitoring
  fetched: 2026-11-13
  quote: The Isle of Man has been monitoring phytoplankton species since 1995
