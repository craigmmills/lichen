summary: A Manx bird conservation charity that conducted the 2017–18 seabird census and, Manx Lottery
  Trust reports, received £28,618 in 2026 to recruit a warden supporting the National Ornithological Database.
facts:
- claim: The NBN Atlas Isle of Man page describes it as a Manx bird conservation charity that uses an
    ongoing programme of research to underpin its conservation work.
  url: https://isleofman.nbnatlas.org/about-nbn-atlas
  fetched: 2026-11-12
  quote: Manx BirdLife is a Manx bird conservation charity that uses an on-going programme of research
    to under-pin its conservation work.
- claim: An article by its Managing Director on the Biosphere Isle of Man site says it carried out the
    island's first seabird census for nearly twenty years in 2017-18.
  url: https://biosphere.im/news/isle-man-seabird-census-2017-2018
  fetched: 2026-11-12
  quote: Hence, we set about the first census of the island's seabirds for nearly twenty years.
- claim: Manx Lottery Trust reports that it was awarded £28,618 from the Dormant Asset Fund, managed by
    Manx Lottery Trust, in 2026 to recruit a warden.
  url: https://www.mlt.org.im/news/manx-birdlife-strengthens-team-with-funding-from-dormant-asset-fund/
  fetched: 2026-11-12
  quote: Manx BirdLife has been awarded £28,618 from the Dormant Asset Fund, managed by Manx Lottery Trust,
    to support the recruitment of a new warden.
- claim: The same page says the warden will support the Island's National Ornithological Database, so
    that bird data is collated, verified and shared.
  url: https://www.mlt.org.im/news/manx-birdlife-strengthens-team-with-funding-from-dormant-asset-fund/
  fetched: 2026-11-12
  quote: supporting the Island’s National Ornithological Database, ensuring that bird data is collated,
    verified and shared to support national and local conservation efforts
