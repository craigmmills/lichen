summary: Closed four-year project led by the Department of Environment, Food and Agriculture on carbon
  storage in Manx seas; Manx Radio reports it mapped 50,000 hectares of offshore muddy seabed, 196 hectares
  of seagrass and 7.4 hectares of saltmarsh.
facts:
- claim: Manx Radio reports that the project, led by DEFA, studied how Manx seas store carbon, support
    biodiversity and provide ecosystem services, over a four-year programme.
  url: https://www.manxradio.com/news/isle-of-man-news/island-at-forefront-of-british-isles-blue-carbon-research/
  fetched: 2026-11-12
  quote: The project was led by the Department of Environment, Food and Agriculture, the report sought
    to understand how seas store carbon, support biodiversity, and provide vital ecosystem services.
- claim: Manx Radio reports that scientists mapped 50,000 hectares of offshore muddy seabed, 196 hectares
    of seagrass and 7.4 hectares of saltmarsh.
  url: https://www.manxradio.com/news/isle-of-man-news/island-at-forefront-of-british-isles-blue-carbon-research/
  fetched: 2026-11-12
  quote: Scientists have mapped the habitats across Manx waters which include 50,000 hectares of offshore
    muddy seabed, 196 hectares of seagrass and 7.4 hectares of coastal wetlands or saltmarsh.
