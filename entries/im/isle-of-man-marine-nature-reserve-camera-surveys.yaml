    species records and habitat monitoring.
  url: https://www.biosphere.im/news/underwater-footage-highlights-success-closed-areas-managing-long-term-fishery-sustainability
  fetched: 2026-11-15
  quote: The camera footage that has been collected in the marine nature reserves
