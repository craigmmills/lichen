facts:
- claim: A UNESCO Biosphere Isle of Man news item of December 2019 says the marine
    nature reserves are surveyed by DEFA and Bangor University using underwater cameras.
  url: https://www.biosphere.im/news/underwater-footage-highlights-success-closed-areas-managing-long-term-fishery-sustainability
  fetched: 2026-11-15
  quote: Marine nature reserves are surveyed by DEFA and Bangor University using underwater
    cameras, providing us with a wealth of information on species distributions, scallop
    abundance and habitat types.
- claim: The same page says DEFA's surveys use underwater cameras on a towable sledge.
  url: https://www.biosphere.im/news/underwater-footage-highlights-success-closed-areas-managing-long-term-fishery-sustainability
