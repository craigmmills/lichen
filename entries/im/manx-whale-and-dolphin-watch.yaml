  quote: 'Address: 23 Michael St, Peel, Isle of Man, IM5 1HB'
- claim: Says it has worked on marine mammal science on the Isle of Man since 2006,
    through non-invasive research and public engagement.
  url: https://mwdw.net/
  fetched: 2026-11-13
  quote: We work year round to ensure the safeguarding of whales, dolphins and porpoises
    (cetaceans), as well as basking sharks, through non-invasive research and public
    engagement.
- claim: Keeps photo-identification catalogues of individual animals, split into three
