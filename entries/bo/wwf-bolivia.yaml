summary: Established in Santa Cruz in 1993, this WWF office aims to study dolphins
  using four satellite trackers, describes a draft early warning protocol and partners
  with Faunagua.
facts:
- claim: WWF says it set up in Bolivia in 1993 with a programme office in Santa Cruz.
  url: https://www.wwf.org.bo/sobre_nosotros/nuestra_historia/
  fetched: 2026-11-15
  quote: En 1993, WWF se estableció en Bolivia con una oficina de programas en Santa
    Cruz
- claim: The planning ministry's register of foreign NGOs, as of 30 November 2025,
    lists World Wildlife Fund, Inc. (WWF) from the United States.
  url: https://www.planificacion.gob.bo/uploads/ong-ext_30112025.pdf
  fetched: 2026-11-15
  quote: WORLD WILDLIFE FUND, INC - WWF WWF 15 ago 2027 ESTADOS
- claim: Its river dolphin page sets the aim of generating information on dolphin
    movements and habitat use from four satellite trackers.
  url: https://www.wwf.org.bo/bufeo/
  fetched: 2026-11-15
  quote: Generar información sobre movimiento de delfines y uso de hábitats en zonas
    priorizadas de su área de distribución a partir de la aplicación de 4 rastreadores
    satelitales.
- claim: Its river dolphin conservation page describes a draft early warning protocol
    for dolphin risk events that combines remote sensors, drone field checks and alerts
    from local people.
  url: https://www.wwf.org.bo/conservacion_bufeo/
  fetched: 2026-11-15
  quote: El sistema de alerta temprana combina información obtenida de sensores remotos,
    verificaciones en campo utilizando drones y alertas realizadas por actores locales.
