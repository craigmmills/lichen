facts:
- claim: Its mission is to conserve Bolivia's birds and their habitats.
  url: https://armoniabolivia.org/about-armonia-bolivia/conservation-achievements-in-bolivia/
  fetched: 2026-11-08
  quote: The mission of Armonía is to conserve Bolivia's birds and their habitats
- claim: Says it has run population monitoring programmes on seven threatened bird species.
  url: https://armoniabolivia.org/about-armonia-bolivia/conservation-achievements-in-bolivia/
  fetched: 2026-11-08
  quote: We have conducted population monitoring programs on the Titicaca Grebe , Masked Antpitta , Andean
    Condor , Horned Curassow , Wattled Curassow , Red-fronted Macaw , and the Blue-throated Macaw .
- claim: Says it carries out yearly shorebird monitoring in the Barba Azul Nature Reserve.
  url: https://armoniabolivia.org/about-armonia-bolivia/conservation-achievements-in-bolivia/
  fetched: 2026-11-08
  quote: carrying out yearly shorebird monitoring in the Barba Azul Nature Reserve
- claim: Says it has worked since 1996 on conservation strategies, coordinating with local communities
    to protect wildlife and habitats.
  url: https://armoniabolivia.org/es/
  fetched: 2026-11-08
  quote: Desde 1996, la Asociación Armonía se ha dedicado a implementar estrategias de conservación eficaces
- claim: Runs an annual monitoring of long-distance migratory shorebirds in the Barba Azul Nature Reserve,
    in the Llanos de Moxos in Beni.
  url: https://armoniabolivia.org/el-monitoreo-de-aves-playeras-se-expande-de-la-reserva-barba-azul-a-tres-sitios-adicionales-en-los-llanos-de-moxos/
  fetched: 2026-11-08
  quote: la Asociación Armonía realiza el monitoreo anual de aves playeras migratorias de larga distancia
- claim: The monitoring records how many birds rest at each site, grass height and the presence of cattle.
  url: https://armoniabolivia.org/el-monitoreo-de-aves-playeras-se-expande-de-la-reserva-barba-azul-a-tres-sitios-adicionales-en-los-llanos-de-moxos/
  fetched: 2026-11-08
  quote: El monitoreo consiste en registrar cuántas aves descansan en cada sitio, la altura del pasto
    y la presencia de ganado
- claim: Carried out a landscape-scale shorebird census in 2021 with support from Manomet, covering 764
    points.
  url: https://armoniabolivia.org/el-monitoreo-de-aves-playeras-se-expande-de-la-reserva-barba-azul-a-tres-sitios-adicionales-en-los-llanos-de-moxos/
  fetched: 2026-11-08
  quote: el primer censo a escala de paisaje realizado en 2021 por Armonía con apoyo de Manomet, cuando
    se recorrieron 764 puntos
