summary: A Bolivian forest fire early-warning and monitoring system, run by Fundación Amigos de la Naturaleza,
  offering maps, near-real-time data, a mobile app and a burned-area tool, with a statistical model emphasising
  prevention.
facts:
- claim: Offers interactive tools to view, query, analyse and download maps and historical and near-real-time
    data for regions of Bolivia.
  url: https://incendios.fan-bo.org/Satrifo/
  fetched: 2026-11-08
  quote: SATRIFO ofrece información y herramientas dinámicas e interactivas, que permiten visualizar,
    consultar, analizar y descargar mapas y datos históricos y en tiempo casi real para diferentes regiones
    de Bolivia.
- claim: Its monitoring tools include version 5.0, a mobile app and a burned-area detection tool.
  url: https://incendios.fan-bo.org/Satrifo/
  fetched: 2026-11-08
  quote: Detección de áreas quemadas (AQLSGEE v02)
- claim: A FAN article says SATRIFO stresses prevention, using a statistical model that combines variables.
  url: https://incendios.fan-bo.org/Satrifo/wp-content/uploads/2015/11/Articulo_SATRIFO.pdf
  fetched: 2026-11-08
  quote: SATRIFO hace énfasis en la fase preventiva, a partir de un modelo estadístico que combina variables
- claim: Its purpose is to give useful and timely information for the prevention and control of forest
    fires in Bolivia.
  url: https://www.fan-bo.org/
  fetched: 2026-11-08
  quote: El Sistema de monitoreo y alerta temprana de riesgos de incendios forestales (SATRIFO) tiene
    la finalidad de brindar información útil y oportuna para la prevención y control de incendios forestales
    en Bolivia.
