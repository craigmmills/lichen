summary: Closed UNDP-run project, July 2023 to April 2026, which aimed to strengthen
  national forest monitoring, including a biomass density map, with USD 1,068,416
  from Spanish and UK funders.
facts:
- claim: Aimed to strengthen the national forest monitoring system, including by producing
    an above-ground biomass density map.
  url: https://www.undp.org/es/bolivia/proyectos/mejora-de-las-capacidades-para-el-monitoreo-forestal-y-la-reduccion-de-la-deforestacion-en-bolivia
  fetched: 2026-11-15
  quote: 'Fortalecer el sistema nacional de monitoreo forestal: A través del desarrollo
    de mecanismos avanzados, como la elaboración de un mapa de densidad de biomasa
    aérea'
- claim: Planned better above-ground biomass estimates by calibrating satellite, aerial
    and ground observations.
  url: https://www.undp.org/es/bolivia/proyectos/mejora-de-las-capacidades-para-el-monitoreo-forestal-y-la-reduccion-de-la-deforestacion-en-bolivia
  fetched: 2026-11-15
  quote: incluyendo la mejora en la estimación de biomasa aérea mediante calibración
    de observaciones satelitales, aéreas y terrestres
- claim: Planned implementation of a monitoring system for emissions from degradation
    and mapping of affected areas.
  url: https://www.undp.org/es/bolivia/proyectos/mejora-de-las-capacidades-para-el-monitoreo-forestal-y-la-reduccion-de-la-deforestacion-en-bolivia
  fetched: 2026-11-15
  quote: Implementación de un sistema de monitoreo para emisiones por degradación
    y mapeo de áreas afectadas.
