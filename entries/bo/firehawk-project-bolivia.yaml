summary: Closed drone project, run by Bolivia Flying Labs and funded by WeRobotics, which mapped forest
  areas to identify high-risk fire zones, flying about 100 hectares each at two sites near Roboré in July
  2023.
facts:
- claim: Created to use drones to map and monitor forest areas and identify high-risk fire zones.
  url: https://flyinglabs.org/blog/the-firehawk-project-preventing-forest-fires-in-bolivia-using-drone-technology/
  fetched: 2026-11-08
  quote: The project was created to utilize drones for mapping and monitoring forest areas, providing
    vital information to identify high-risk zones susceptible to fires.
- claim: In July 2023 it flew missions over about 100 hectares each at El Portón and the Peniel community,
    in the Roboré area.
  url: https://flyinglabs.org/blog/the-firehawk-project-preventing-forest-fires-in-bolivia-using-drone-technology/
  fetched: 2026-11-08
  quote: we carried out the flights in El Portón and the Peniel community, covering an extensive area
    of around 100 hectares each
- claim: Bolivia Flying Labs says the project has concluded.
