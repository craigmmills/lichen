summary: Non-profit founded in 2004, based in Cochabamba, reporting research on Bolivian aquatic resources
  and wetlands and a dolphin citizen-science project aiming to involve fishers, boat owners and tourists.
facts:
- claim: Founded in 2004 as a non-profit non-governmental organisation, with legal personality registered
    in the department of Cochabamba.
  url: https://faunagua.org/sobre-faunagua/
  fetched: 2026-11-08
  quote: FAUNAGUA nacio el año 2004, como una Organización No Gubernamental, de carácter social no lucrativa
    y con autonomía propia.
- claim: Its head office is in Cochabamba.
  url: https://faunagua.org/sobre-faunagua/
  fetched: 2026-11-08
  quote: Cochabamba (Sede central)
- claim: Says it has carried out research projects on the management of aquatic biological resources and
    wetlands of Bolivia since 2004.
  url: https://faunagua.org/sobre-faunagua/
  fetched: 2026-11-08
  quote: Desde 2004 FAUNAGUA ejecutó una serie de proyectos de investigación orientada al desarrollo sostenible
    y manejo de los recursos hidrobiológicos y los humedales de Bolivia.
- claim: Runs a project combining scientific research and citizen science on the Bolivian river dolphin
    (bufeo), which aims to involve fishers, boat owners and tourists in monitoring its presence and threats.
  url: https://faunagua.org/programas/especies-en-peligro-de-extincion/
  fetched: 2026-11-08
  quote: El proyecto busca que actores locales (pescadores, propietarios de embarcaciones, turistas) participen
    activamente en el monitoreo del bufeo, registrando su presencia y amenazas.
- claim: Says it has led key research on the movements, abundance and threats of the Bolivian river dolphin.
  url: https://faunagua.org/programas/especies-en-peligro-de-extincion/
  fetched: 2026-11-08
  quote: ha liderado investigaciones clave sobre sus movimientos, abundancia y amenazas
