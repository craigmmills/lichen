summary: Reportedly EU-financed within GBIF’s Biodiversity Information for Development programme, planned
  for February 2026–December 2027 across Argentina, Bolivia and Paraguay, mobilising over 35,000 biodiversity
  records under planned Fundación ProYungas leadership.
facts:
- claim: The report says the project sits within GBIF's Biodiversity Information for Development programme
    and is financed by the European Union.
  url: https://eju.tv/2026/03/bolivia-aportara-mas-de-35-000-registros-para-fortalecer-la-biodiversidad-de-sudamerica/
  fetched: 2026-11-08
  quote: La propuesta se desarrolla en el marco del programa Información sobre Biodiversidad para el Desarrollo
    del Global Biodiversity Information Facility (GBIF) y cuenta con financiamiento de la Unión Europea.
- claim: A news report says the initiative will mobilise more than 35,000 biodiversity records from landscapes
    where farming and conservation coexist.
  url: https://eju.tv/2026/03/bolivia-aportara-mas-de-35-000-registros-para-fortalecer-la-biodiversidad-de-sudamerica/
  fetched: 2026-11-08
  quote: una iniciativa que movilizará más de 35.000 registros de biodiversidad generados en paisajes
    donde conviven la producción agropecuaria y la conservación
- claim: The report says it is planned to run from February 2026 to December 2027 across Argentina, Bolivia
    and Paraguay.
  url: https://eju.tv/2026/03/bolivia-aportara-mas-de-35-000-registros-para-fortalecer-la-biodiversidad-de-sudamerica/
  fetched: 2026-11-08
  quote: Su ejecución está prevista entre febrero de 2026 y diciembre de 2027, mediante un trabajo conjunto
    entre Argentina, Bolivia y Paraguay.
