summary: Initiative announced in July 2026 by the Bolivian and German governments, backed by €15 million
  from KfW, to strengthen forest protection, governance and monitoring systems and reduce deforestation.
facts:
- claim: In July 2026, the governments of Bolivia and Germany announced the launch of an initiative backed
    by €15 million to strengthen forest protection and reduce deforestation.
  url: https://www.conservation.org/press/bolivia-and-germany-launch-an-initiative-to-protect-forests-and-unlock-climate-finance-
  fetched: 2026-11-08
  quote: The governments of Bolivia and Germany have launched a new initiative backed by a €15 million
    contribution, to strengthen forest protection, reduce deforestation
- claim: In Pando it will strengthen local capacity to reduce deforestation, including stronger governance
    and monitoring systems.
  url: https://www.conservation.org/press/bolivia-and-germany-launch-an-initiative-to-protect-forests-and-unlock-climate-finance-
  fetched: 2026-11-08
  quote: it will strengthen local capacity to reduce deforestation through the development of sustainable
    economic alternatives, stronger governance and monitoring systems
- claim: The press release says the project will be led by the Bolivian government through the Ministry
    of Development Planning and Environment and the environment vice-ministry.
  url: https://www.conservation.org/press/bolivia-and-germany-launch-an-initiative-to-protect-forests-and-unlock-climate-finance-
