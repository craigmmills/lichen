summary: Wildlife Conservation Society programme and listed Amazon.ia partner, reporting work in Greater
  Madidi and Llanos de Moxos in 2024 and 225 camera-trap stations in its 2025 report.
facts:
- claim: Its 2025 report says it installed 225 video camera-trap stations, set systematically 1 km apart
    over 500 square kilometres.
  url: https://bolivia.wcs.org/Portals/14/InformesAnuales/INFORME_ANUAL%202025_WCS_DIGITAL.pdf
  fetched: 2026-11-08
  quote: se instalaron 225 estaciones de cámaras trampa de video, distribuidas sistemáticamente a 1 km
    de distancia
- claim: Its site offers a web GIS platform with geographic information on national conservation priorities,
    for applying the mitigation hierarchy to infrastructure and extractive projects.
  url: https://bolivia.wcs.org/
  fetched: 2026-11-08
  quote: WCS pone a disposición una plataforma –GIS WEB– con información geográfica sobre valores prioritarios
    de conservación a nivel nacional.
- claim: Its site says WCS helped build fire-risk monitoring capacity among protected-area staff, indigenous
    territorial organisations and five municipal governments.
  url: https://bolivia.wcs.org/
  fetched: 2026-11-08
  quote: WCS contribuyó a desarrollar capacidades para el monitoreo de riesgos de incendio
- claim: Its site says the Madidi landscape was selected as one of the first heritage landscapes of the
    Legacy Landscapes Fund.
  url: https://bolivia.wcs.org/
  fetched: 2026-11-08
  quote: el Paisaje Madidi ha sido seleccionado como uno de los primeros paisajes patrimonio por el Legacy
    Landscapes Fund (LLF)
- claim: 'Its 2024 report says the programme worked in two landscapes: the Greater Madidi Landscape in
    northern La Paz and the Llanos de Moxos in Beni.'
  url: https://bolivia.wcs.org/Portals/14/InformesAnuales/WCS-Bolivia-InformeAnual2024.pdf
  fetched: 2026-11-08
  quote: Actualmente, el Programa de Conservación de WCS Bolivia se desarrolla en dos paisajes que contienen
    valores naturales y culturales excepcionales
- claim: In 2024 field campaigns introduced acoustic recording devices to record birds, amphibians, bats
    and mammals.
  url: https://bolivia.wcs.org/Portals/14/InformesAnuales/WCS-Bolivia-InformeAnual2024.pdf
  fetched: 2026-11-08
  quote: En las campañas de campo en 2024 se introdujeron dispositivos de grabación acústica
- claim: Its 2024 report gives 40 multitemporal maps of mechanised mining points on the upper Tuichi river
    inside Madidi, with deforestation quantified for 2021 to 2024.
  url: https://bolivia.wcs.org/Portals/14/InformesAnuales/WCS-Bolivia-InformeAnual2024.pdf
  fetched: 2026-11-08
  quote: 40 mapas de 40 puntos identiﬁcados en la minería mecanizada en la parte alta del río Tuichi
- claim: Its office is in Calacoto, La Paz.
  url: https://bolivia.wcs.org/es-es/Nosotros.aspx
  fetched: 2026-11-08
  quote: Calle 22 de Calacoto. Centro Empresarial Calacoto N° 8232
