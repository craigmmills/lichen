summary: Santa Cruz natural history museum, part of a university faculty, holding over a million specimens,
  with a geography area doing GIS and remote sensing and a JRS-funded biodiversity data centre.
facts:
- claim: The JRS Biodiversity Foundation says the museum in Santa Cruz created the Geospatial Center for
    Biodiversity with its funding.
  url: https://jrsbiodiversity.org/grant/geospacial-center-for-biodiversity/
  fetched: 2026-11-08
  quote: With the funding from the Foundation, the Noel Kempff Natural History Museum in Santa Cruz is
    responding through creation of the Geospatial Center for Biodiversity.
- claim: The JRS page reports more than 80,000 vertebrate records uploaded to the platform and made public.
  url: https://jrsbiodiversity.org/grant/geospacial-center-for-biodiversity/
  fetched: 2026-11-08
  quote: We have uploaded and made available to the public > 80,000 records of vertebrate data into the
    GCB system.
- claim: The GBIF registry lists it among data publishers registered in Bolivia.
  url: https://api.gbif.org/v1/organization?country=BO&limit=50
  fetched: 2026-11-08
  quote: Museo de Historia Natural Noel Kempff Mercado
- claim: Describes itself as one of Bolivia's centres of basic and applied research in biodiversity conservation,
    part of the Faculty of Agricultural Sciences of the Universidad Autónoma Gabriel René Moreno.
  url: https://museonoelkempff.org/sitio/index.php
  fetched: 2026-11-08
  quote: El Museo de Historia Natural Noel Kempff Mercado es uno de los centros de investigación básica
    y aplicada en conservación de la biodiversidad de Bolivia.
- claim: A page of its site carrying a 2011 copyright lists among its projects a study of thirty years
    of deforestation in the Bolivian lowlands and the Amazon forest inventory network.
  url: https://museonoelkempff.org/sitio/index.php
  fetched: 2026-11-08
  quote: '"Treinta Años de Deforestación en las Tierras bajas de Bolivia"'
- claim: Gives its address as Avenida Irala 565, Santa Cruz.
  url: https://museonoelkempff.org/sitio/index.php
  fetched: 2026-11-08
  quote: Av. Irala 565 - Casilla 2489
- claim: Listed as a Bolivian institution on the RAINFOR partners page.
  url: https://rainfor.org/en/partners/
  fetched: 2026-11-08
  quote: Museo de Historia Natural Noel Kempff Mercado BOLIVIA
- claim: Describes itself as a scientific institution that promotes research for the knowledge and conservation
    of biodiversity.
  url: http://museonoelkempff.org/museo/
  fetched: 2026-11-08
  quote: Somos una institución científica y de interacción social, cuyo lema es promover la investigación
    para contribuir al conocimiento y conservación de la biodiversidad.
- claim: Says it holds more than a million biological and geological specimens.
  url: http://museonoelkempff.org/museo/
  fetched: 2026-11-08
  quote: Tiene a su cargo la custodia de más de un millón de muestras biológicas y geológicas
- claim: Its geography area carries out geospatial analysis with GIS and environmental remote sensing,
    and keeps a digital archive of more than 500 satellite images covering the whole country.
  url: https://museonoelkempff.org/museo/geografia/
  fetched: 2026-11-08
  quote: Actualmente, tiene un archivo histórico digital, desde los 70s, con más de 500 imágenes satelitales
    que cubren todo el país
- claim: The geography area lists monitoring of deforestation and of changes in natural cover and land
    use among its work.
  url: https://museonoelkempff.org/museo/geografia/
  fetched: 2026-11-08
  quote: Monitoreo de deforestación, cambios en la cobertura natural y uso de la tierra.
- claim: Says the geography area has carried out or taken part in more than 40 projects documenting land
    cover and change in Bolivia and its protected areas.
  url: https://museonoelkempff.org/museo/geografia/
  fetched: 2026-11-08
  quote: El área de Geografía ha ejecutado y/o participado en más de 40 proyectos con el objetivo principal
    de documentar la cobertura de la tierra y los cambios ocurridos en Bolivia y sus áreas protegidas
- claim: Its GBIF publisher record describes it as a research centre holding scientific collections of
    invertebrates, vertebrates and flora of Bolivia.
  url: https://api.gbif.org/v1/organization/a8031394-e8c9-459e-93f0-b15276f4375a
  fetched: 2026-11-08
  quote: Centro de investigación que alberga colecciones científicas de invertebrados, vertebrados y flora
    de Bolivia.
