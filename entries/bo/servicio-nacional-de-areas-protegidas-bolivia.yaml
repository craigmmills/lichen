summary: Bolivia's national protected-area service, created in 1997, which administers the 22 national
  protected areas (17% of the country) and issues compatible-use certificates for projects inside them.
facts:
- claim: A news report says SERNAP is the body that safeguards and coordinates the country's protected
    areas.
  url: https://eju.tv/2025/12/con-el-objetivo-de-preservar-la-biodiversidad-de-bolivia-juran-nuevas-autoridades-del-sernap-y-la-autoridad-de-la-madre-tierra/
  fetched: 2026-11-08
  quote: El SERNAP es la institución encargada de salvaguardar y coordinar el funcionamiento de las áreas
    protegidas del país.
- claim: The government portal describes SERNAP as the state institution charged with safeguarding Bolivia’s
    protected areas and lists it under the Ministry of Development Planning and Environment.
  url: https://www.gob.bo/entidades/servicio-nacional-de-areas-protegidas
  fetched: 2026-11-08
  quote: Entidad bajo tuición de Ministerio de Planificación del Desarrollo y Medio Ambiente
- claim: Created in 1997, it coordinates the National System of Protected Areas (SNAP).
  url: https://www.gob.bo/entidades/servicio-nacional-de-areas-protegidas
  fetched: 2026-11-08
  quote: se encarga de coordinar el funcionamiento del Sistema Nacional de Áreas Protegidas (SNAP)
- claim: The 22 national protected areas, 17% of the country, are administered by SERNAP.
  url: https://www.gob.bo/entidades/servicio-nacional-de-areas-protegidas
  fetched: 2026-11-08
  quote: Actualmente estas 22 áreas se encuentran bajo la administración del Servicio Nacional de Áreas
    Protegidas (SERNAP)
- claim: Its Directorate of Environmental Monitoring issues the certificate of compatible use for projects
    inside protected areas.
  url: https://www.gob.bo/entidades/servicio-nacional-de-areas-protegidas
  fetched: 2026-11-08
  quote: Este certificado es emitido por la Dirección de Monitoréo Ambiental del SERNAP
- claim: WCS Bolivia's 2024 report says SERNAP approved an intervention and legal defence plan against
    illegal mining in Madidi.
  url: https://bolivia.wcs.org/Portals/14/InformesAnuales/WCS-Bolivia-InformeAnual2024.pdf
  fetched: 2026-11-08
  quote: aprobado por el SERNAP mediante Resolución Administrativa N° 146/2024
