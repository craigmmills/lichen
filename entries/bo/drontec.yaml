summary: Bolivian company that, according to a July 2024 UNDP page, joined a digital forest mapping workshop
  and uses satellite technology, drones and artificial intelligence to analyse forests and territorial
  change.
facts:
- claim: A July 2024 UNDP page described Drontec as a Bolivian company that participated in its digital
    forest mapping workshop, bringing experience in collecting forest data with satellite technology and
    drones.
  url: https://www.undp.org/es/node/476601
  fetched: 2026-11-08
  quote: También participó la empresa boliviana Drontec, que aporta su experiencia en la recolección de
    datos forestales mediante tecnología satelital y drones.
- claim: The same page says Drontec and Bioverse both use artificial intelligence to analyse forest wealth
    and how territories change.
  url: https://www.undp.org/es/node/476601
  fetched: 2026-11-08
  quote: Ambas empresas utilizan inteligencia artificial para ofrecer análisis precisos sobre la riqueza
    forestal, así como sobre la evolución y cambios en los territorios.
