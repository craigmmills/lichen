summary: Project where UNDP says Bioverse mapped Cavineño Brazil-nut forests with local partners, with
  satellite maps reported in August 2024 as accessible through a mobile app.
facts:
- claim: A UNDP page says Bioverse worked with UNDP to map Brazil-nut forests in the Cavineño territory,
    with CIRABO, the APMT and the Cavineño people, under the GEF Amazonía project and Digital X.
  url: https://www.undp.org/es/node/476601
  fetched: 2026-11-08
  quote: la empresa Bioverse, que ha colaborado con el PNUD para mapear los bosques de castaña en el Territorio
    Indígena Originario Campesino Cavineño de la Amazonía
- claim: The same page says Bioverse and Drontec both use artificial intelligence to analyse forest wealth
    and change.
  url: https://www.undp.org/es/node/476601
  fetched: 2026-11-08
  quote: Ambas empresas utilizan inteligencia artificial para ofrecer análisis precisos sobre la riqueza
    forestal, así como sobre la evolución y cambios en los territorios.
- claim: An August 2024 UNDP page said satellite-based maps were accessible through a mobile app and that
    Indigenous peoples would validate and complement the information.
  url: https://www.undp.org/es/node/480246
  fetched: 2026-11-08
  quote: Gracias a las imágenes satelitales se cuenta ahora con mapas digitales que pueden ser accedidos
    a través de una aplicación móvil.
