  of Amazon.ia.
facts:
- claim: Describes itself as a decentralised public institution for research, preservation and custody
    of Bolivia's natural and cultural heritage.
  url: https://mnhn.gob.bo/
  fetched: 2026-11-08
  quote: Somos una institución pública descentralizada de investigación, preservación y custodia del patrimonio
    natural y cultural del Estado Plurinacional de Bolivia
- claim: Develops and maintains scientific collections of the country's flora, fauna and fossils as a
    permanent record of its biological diversity.
  url: https://mnhn.gob.bo/
  fetched: 2026-11-08
  quote: El desarrollo y mantenimiento de colecciones científicas sobre la flora, fauna y fósiles del
    país, que constituyen un registro permanente de la diversidad biológica actual y pasada
- claim: Its functions include research, management plans, monitoring and expert opinions on the components
