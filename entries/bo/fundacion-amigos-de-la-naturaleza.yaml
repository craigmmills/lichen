  url: https://www.fan-bo.org/index.php/home/
  fetched: 2026-11-08
  quote: The purpose of the Forest Fire Risk Monitoring and Early Warning System (SATRIFO) is to provide
    useful and timely information for the prevention and control of forest fires in Bolivia.
