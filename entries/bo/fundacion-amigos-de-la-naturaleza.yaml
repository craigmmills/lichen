facts:
- claim: Describes itself as a Bolivian civil society organisation.
  url: https://fan-bo.org/
  fetched: 2026-11-08
  quote: La Fundación Amigos de la Naturaleza es una organización de la sociedad civil boliviana
- claim: Lists SATRIFO, a monitoring and early-warning system for forest-fire risk, among its platforms.
  url: https://fan-bo.org/
  fetched: 2026-11-08
  quote: El Sistema de monitoreo y alerta temprana de riesgos de incendios forestales (SATRIFO) tiene
    la finalidad de brindar información útil y oportuna para la prevención y control de incendios forestales
    en Bolivia.
- claim: Lists AMA, a platform for monitoring forest fires and deforestation in the Amazon where users
    can download maps and data.
  url: https://fan-bo.org/
  fetched: 2026-11-08
  quote: AMA es una plataforma de monitoreo de incendios forestales y deforestación en la Amazonía
- claim: Lists MapBiomas Bolivia Collection 1.0, with annual land cover and land use data from 1985 to
