  url: https://fan-bo.org/
  fetched: 2026-11-08
  quote: MapBiomas Bolivia Colección 1.0 incluye datos anuales de cobertura y uso del suelo para el período
    de 1985 a 2021.
- claim: Gives an address at Km. 7 1/2 Doble Vía La Guardia with a Bolivian telephone number.
  url: https://fan-bo.org/
  fetched: 2026-11-08
  quote: 'Dirección: Km. 7 1/2 Doble Vía La Guardia'
- claim: Describes itself as an organisation of Bolivian civil society working so that Bolivia values,
