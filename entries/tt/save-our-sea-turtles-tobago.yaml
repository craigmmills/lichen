summary: Community-based organisation formed in 2000, which in a 2018 presentation
  described nesting beach patrols, leatherback tagging begun in 2005 to 2007, ten
  years of Courland Bay monitoring by 2014 to 2017, and patrols expanded in 2011-12.
facts:
- claim: In a 2018 WIDECAST meeting presentation it describes itself as a community-based
    organisation formed in 2000.
  url: https://www.widecast.org/What/AnnualMeeting/2018/Clovis,%20Brief%20History%20of%20SOS%20Tobago.pdf
  fetched: 2026-11-12
  quote: We are a community based organization (CBO), formed in 2000
- claim: In its 2018 presentation, it described nightly and daytime research patrols
    on nesting beaches, including the leatherback index beaches.
  url: https://www.widecast.org/What/AnnualMeeting/2018/Clovis,%20Brief%20History%20of%20SOS%20Tobago.pdf
  fetched: 2026-11-12
  quote: 'RESEARCH: Nightly and daytime patrols on nesting beaches'
- claim: Leatherback tagging began on the original index beaches in 2005 to 2007,
    and by 2014 to 2017 it marked ten years of consistent nesting season monitoring
    at Courland Bay.
  url: https://www.widecast.org/What/AnnualMeeting/2018/Clovis,%20Brief%20History%20of%20SOS%20Tobago.pdf
  fetched: 2026-11-12
  quote: marking 10 years of consistent nesting season monitoring at Courland Bay
- claim: Patrols expanded in 2011-12 with Green Fund support through Turtle Village
    Trust and the THA's Department of Natural Resources and the Environment.
  url: https://www.widecast.org/What/AnnualMeeting/2018/Clovis,%20Brief%20History%20of%20SOS%20Tobago.pdf
  fetched: 2026-11-12
  quote: support of the Green Fund through Turtle Village Trust (TVT) and DNRE, THA.
