summary: Run by the Institute of Marine Affairs, annual benthic monitoring of ten permanent Tobago reef
  sites begun at four sites in 2010; its 2010 to 2021 data are on GBIF as 2,026 records.
facts:
- claim: Established by the Institute of Marine Affairs to survey coral reef health throughout Tobago,
    starting at four sites in 2010.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: '2026-11-09'
  quote: The long-term coral reef monitoring programme was established by the Institute of Marine Affairs
    to establish baseline surveys of coral reef health throughout Tobago.
- claim: Ten permanent sites are monitored once a year for benthic cover.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: '2026-11-09'
  quote: Sites are monitored annually between the months of May – July when the conditions are calmest.
    All sites are monitored for benthic cover.
- claim: From 2019 to 2021 the point counts were done on the CoralNet platform.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: '2026-11-09'
  quote: From 2019 to 2021, CPC method was done on CoralNet Platform (coralnet.ucsd.edu).
- claim: CoralNet's deep-learning annotation tool labels points above 75% confidence and suggests labels
    below it, with expert annotators checking.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: '2026-11-09'
  quote: CoralNet uses a deep-learning annotation tool where the trained machine using image annotations
    for previous years automatically annotated points with greater than 75 % confidence.
  ai_type: deep-learning
- claim: The GBIF dataset record gives the funding as the Government of Trinidad and Tobago.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: '2026-11-09'
  quote: '"funding":"Government of Trinidad and Tobago"'
- claim: The data for 2010 to 2021 are published on GBIF as a sampling-event dataset of 2,026 records.
  url: https://api.gbif.org/v1/dataset/search?publishingOrg=215671db-9a23-4cb0-9d3b-060dc7d7c65d&q=monitoring&limit=5
  fetched: '2026-11-09'
  quote: '"projectIdentifier":"BID-CA2020-004-INS","recordCount":2026'
- claim: Ten permanent monitoring sites around Tobago, the first four set up in 2010 and the tenth in
    2019, are monitored annually between May and July.
  url: https://api.gbif.org/v1/dataset/d4b2cffe-c429-4733-89d3-ef01e74bf052
  fetched: 2026-11-09
  quote: Sites are monitored annually between the months of May – July when the conditions are calmest.
- claim: The monitoring data for 2010 to 2021 are published on GBIF as a sampling event dataset of 2,026
