summary: Centre at UWI St Augustine, reported in June 2025 as operational, set up
  with the Government of Mexico and INEGI, using the Open Data Cube platform for satellite
  imagery across Latin America and the Caribbean.
facts:
- claim: UWI Today reported in June 2025 that the Caribbean Geospatial Observation
    Centre at UWI St Augustine is officially operational.
  url: https://sta.uwi.edu/uwitoday/archive/june_2025/article9.asp
  fetched: 2026-11-15
  quote: Now officially operational, the Caribbean Geospatial Observation Centre (CGOC)
    at UWI St Augustine is revolutionising how the region monitors environmental change
- claim: The article says the centre came from a collaboration between The UWI, the
    Government of Mexico and Mexico's National Institute of Statistics and Geography
    (INEGI).
  url: https://sta.uwi.edu/uwitoday/archive/june_2025/article9.asp
  fetched: 2026-11-15
  quote: Born from a landmark collaboration between The UWI, the Government of Mexico,
    and the National Institute of Statistics and Geography (INEGI) of Mexico
- claim: The article says the centre uses the Open Data Cube platform to let users
    across Latin America and the Caribbean access, process and interpret satellite
    imagery.
  url: https://sta.uwi.edu/uwitoday/archive/june_2025/article9.asp
  fetched: 2026-11-15
  quote: Using the Open Data Cube (ODC) platform, the centre allows researchers, policymakers,
    and students across Latin America and the Caribbean to easily access, process,
    and interpret satellite imagery.
- claim: The article says the centre supports applications including mangrove loss,
    forest fires, illegal quarrying and sargassum monitoring.
  url: https://sta.uwi.edu/uwitoday/archive/june_2025/article9.asp
  fetched: 2026-11-15
  quote: The centre supports dozens of applications, including climate change tracking,
    agricultural planning, mangrove loss, forest fires, illegal quarrying, and sargassum
    monitoring.
- claim: The Department of Geomatics Engineering and Land Management says GIS specialists
    will be trained to use the facilities to manage mangroves, monitor sargassum and
    map forest cover and land use change.
  url: https://sta.uwi.edu/eng/geomatics/observation-geospatial-center
  fetched: 2026-11-15
  quote: to produce data for applications to mitigate flooding, manage mangroves,
    monitor the movement of Sargassum seaweed, and to map forest cover and land use
    changes
- claim: The article names Dr Olabanji Aladejana, a lecturer in the Department of
    Geomatics Engineering and Land Management, as the centre's current technical lead.
  url: https://sta.uwi.edu/uwitoday/archive/june_2025/article9.asp
  fetched: 2026-11-15
  quote: Dr Olabanji Aladejana, Lecturer in the Department of Geomatics Engineering
    and Land Management, and the centre’s current technical lead
