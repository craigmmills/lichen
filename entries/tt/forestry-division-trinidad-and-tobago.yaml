summary: Government sources report forest reserve, prohibited area and game sanctuary
  management, Ramsar and CITES technical focal point duties, and GEF project assistance
  with a GPS-GIS workshop for officers.
facts:
- claim: The national biodiversity clearing-house says the Forestry Division manages
    the forest reserves, prohibited areas and game sanctuaries.
  url: https://biodiversity.gov.tt/index.php/key-organisations.html
  fetched: 2026-11-13
  quote: The Forestry Division has responsibility for managing the Forest Reserves,
    Prohibited Areas and Game Sanctuaries
- claim: It has two specialised sections responsible for wildlife and national parks
    management.
  url: https://biodiversity.gov.tt/index.php/key-organisations.html
  fetched: 2026-11-13
  quote: The Division also has two specialized sections that are responsible for wildlife
    and national parks management.
- claim: It is the country's technical focal point for the Ramsar Convention and CITES.
  url: https://biodiversity.gov.tt/index.php/key-organisations.html
  fetched: 2026-11-13
  quote: The Division also functions as the country’s technical focal point for the
    Ramsar Convention on Wetlands and the Convention on the International Trade in
    Endangered Species (CITES).
- claim: The environment ministry's EPPD blog reports that the GEF forest and protected
    areas project helped run a GPS-GIS workshop for Forestry Division officers.
  url: https://eppd-tt.blogspot.com/p/gef-improving-forest-and-protected-areas.html
  fetched: 2026-11-13
  quote: recently assisted in facilitating a GPS-GIS Workshop for officers of the
    Forestry Division.
