summary: Not-for-profit in Charlotteville, Tobago, with monitoring programmes including Reef Check surveys
  and a turtle sightings database, and says it is the southern Caribbean's only Reef Check training facility.
facts:
- claim: Says it works towards sustainability for the people and ecosystems of North East Tobago.
  url: http://www.eric-tobago.org/
  fetched: 2026-11-09
  quote: the Environmental Research Institute Charlotteville works towards sustainability for the people
    and ecosystems of North East Tobago.
- claim: Its dive centre offers coral reef ecology, survey and monitoring training.
  url: http://www.eric-tobago.org/
  fetched: 2026-11-09
  quote: the ERIC Dive Centre offers dive training, coral reef ecology, survey and monitoring training
- claim: Its site lists an underwater turtle monitoring protocol.
  url: http://www.eric-tobago.org/
  fetched: 2026-11-09
  quote: Research Underwater Turtle Monitoring Protocol
- claim: Reef Check lists an EcoDiver training facility in Trinidad and Tobago under the name Environmental
    Research Institute Charlottesville; ERIC names itself Environmental Research Institute Charlotteville.
  url: https://www.reefcheck.org/country/trinidad-tobago/
  fetched: 2026-11-09
  quote: 'Training Facility: Environmental Research Institute Charlottesville'
- claim: Cari-Bois reported in 2020 that ERIC was approved Green Fund funding for an underwater turtle
    monitoring project, the first Green Fund approval for a Tobago-based project.
  url: https://caribois.org/2020/09/new-environmental-projects-underway-as-green-fund-disburses-funding/
  fetched: 2026-11-09
  quote: the Environmental Research Institute of Charlotteville (ERIC) for an underwater turtle monitoring
    project which represents the first Green Fund approval for a Tobago-based project
- claim: Describes itself as a not-for-profit organisation based at Man-O-War Bay Cottages, Charlotteville,
    Tobago.
  url: https://eric-tobago.org/index.html
  fetched: 2026-11-09
  quote: As a not-for-profit organisation ERIC invests all proceeds in the pursuit of our mission statement.
- claim: Its community-based field technicians work in its environmental monitoring programmes, which
    include Reef Check, a coral nursery and a turtle sightings database.
  url: https://www.eric-tobago.org/environmental-monitoring
  fetched: 2026-11-09
  quote: Our community-based field technicians are directly involved in our environmental monitoring programmes.
- claim: Keeps an ongoing database of turtle sightings, including hawksbill, green and leatherback turtles.
  url: https://www.eric-tobago.org/environmental-monitoring
  fetched: 2026-11-09
  quote: Turtle Sightings - an ongoing database recording all sightings of turtles
- claim: Conducts Reef Check surveys throughout north-east Tobago as part of its coral reef monitoring
    programme.
  url: https://www.eric-tobago.org/reef-check-trinidad-and-tobago
  fetched: 2026-11-09
  quote: ERIC conducts Reef Check surveys throughout northeast Tobago as part of our coral reef monitoring
    programme
- claim: Says it is the centre for Reef Check Trinidad and Tobago and the only Reef Check training facility
    in the southern Caribbean.
  url: https://www.eric-tobago.org/reef-check-trinidad-and-tobago
  fetched: 2026-11-09
  quote: Uniquely placed as the centre for Reef Check Trinidad and Tobago, the only Reef Check Training
    facility in the southern Caribbean
- claim: Says it collaborates with Global FinPrint on population assessment and monitoring of sharks and
    rays in north-east Tobago with baited remote underwater video (BRUVs).
  url: https://www.eric-tobago.org/shark-and-rays
  fetched: 2026-11-09
  quote: ERIC collaborates with Global FinPrint to conduct population assessments and monitoring of sharks
    and rays in northeast Tobago through the use of Baited Remote Underwater Videos (BRUVs).
