summary: Closed GEF-funded project run by FAO, reportedly deploying 20 cameras in
  Main Ridge Forest Reserve in April 2017 to estimate mammal abundance, with a monitoring
  programme planned.
facts:
- claim: The EPPD blog reports that 20 cameras were deployed in the Main Ridge Forest
    Reserve on 6 to 10 April 2017 to estimate local mammal abundance and model species
    activity patterns.
  url: https://eppd-tt.blogspot.com/p/gef-improving-forest-and-protected-areas.html
  fetched: 2026-11-13
  quote: For the first time in history 20 cameras were deployed in the Main Ridge
    Forest Reserve in Tobago to capture imagery to inform an estimation of local abundance
    of mammals and model activity patterns of species.
- claim: The blog lists development of an ecological research and monitoring programme
    to guide protected areas management as a planned project output.
  url: https://eppd-tt.blogspot.com/p/gef-improving-forest-and-protected-areas.html
  fetched: 2026-11-13
  quote: Development of an ecological research and monitoring programme to guide protected
    areas management
- claim: The ministry chose FAO as its GEF implementation agency for the project.
  url: https://eppd-tt.blogspot.com/p/gef-improving-forest-and-protected-areas.html
  fetched: 2026-11-13
  quote: The Ministry selected the Food and Agriculture Organisation (FAO) because
    of the long history of collaboration between Trinidad and Tobago's Forestry Division
    and the FAO's Department of Forestry.
