summary: Non-governmental organisation registered in Trinidad and Tobago, focused
  on marine research, education and conservation, which surveyed bleaching on Tobago's
  reefs after 2005 and is reported to have monitored reefs with the Tobago House of
  Assembly.
facts:
- claim: The GEF Small Grants Programme project record describes it as a non-governmental
    organisation registered in Trinidad and Tobago that focuses on marine research,
    education and conservation.
  url: https://sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=10291&view=projectdetail
  fetched: 2026-11-15
  quote: The Buccoo Reef Trust (BRT) is a non-governmental organisation registered
    in Trinidad and Tobago that focuses on marine research, education and conservation.
- claim: After the 2005 coral bleaching event it worked with the Tobago House of Assembly
    and Coral Cay Conservation to survey the extent of bleaching on Tobago's coral
    reefs.
  url: https://sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=10291&view=projectdetail
  fetched: 2026-11-15
  quote: worked closely with the UK-based Non-Governmental Organisation, Coral Cay
    Conservation (CCC) to undertake a survey of the extent of this bleaching event
    on the coral reefs of Tobago
- claim: The same record says the Tobago Coastal Ecosystem Mapping Project would provide
    baseline data on the coral reef, mangrove and seagrass ecosystems around Tobago.
  url: https://sgp.undp.org/spacial-itemid-projects-landing-page/spacial-itemid-project-search-results/spacial-itemid-project-detailpage.html?id=10291&view=projectdetail
  fetched: 2026-11-15
  quote: will provide a baseline data on the current status of the coral reef, mangrove
    and seagrass ecosystems around the island of Tobago
- claim: Trinidad and Tobago's third national report to the Convention on Biological
    Diversity reported that the Buccoo Reef Trust and the Tobago House of Assembly
    monitored coral reefs in Tobago.
  url: https://www.cbd.int/doc/world/tt/tt-nr-03-en.pdf
  fetched: 2026-11-15
  quote: NGO, Buccoo Reef Trust and the Tobago House of Assembly monitor coral reefs
    in Tobago.
- claim: ReefSystems says it started a collaboration with the Buccoo Reef Trust, the
    Tobago House of Assembly, the Institute of Marine Affairs and Boskalis on a coral
    reef restoration plan. Its team arrived in Tobago and received approval for pilot
    reefs in early 2024; the page reports three reefs installed at three locations
    within Buccoo Reef.
  url: https://www.reefsystems.org/projects/tobago
  fetched: 2026-11-15
  quote: we have started a collaboration with the Buccoo Reef Trust, the Tobago House
    of Assembly, Institute of Marine Affairs and Boskalis, a coral reef restoration
    plan has been developed
