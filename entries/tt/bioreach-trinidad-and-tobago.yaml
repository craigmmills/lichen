facts:
- claim: A four-year project aimed at conserving biodiversity, restoring degraded landscapes and improving
    rural livelihoods.
  url: https://www.ema.co.tt/?p=12150
  fetched: 2026-11-09
  quote: is a 4 year initiative aimed at conserving local biodiversity, restoring degraded landscapes
    and improving the livelihoods of rural communities throughout Trinidad and Tobago
- claim: TTT News reports that researchers have collected bird-banding data under the project since 2023,
    with the Trinidad and Tobago Bird Observatory.
  url: https://www.ttt.live/?p=152012
  fetched: 2026-11-09
  quote: Since 2023, researchers have been collecting data through bird banding, an initiative under the
    BIOREACH Project, in collaboration with the Trinidad and Tobago Bird Observatory.
