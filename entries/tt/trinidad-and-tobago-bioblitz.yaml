summary: Annual species-recording event held since 2012 and run by UWI's Department of Life Sciences;
  the 14th, in 2025, recorded about 1,498 species using iNaturalist.
facts:
- claim: The 2025 event was the 14th annual Bioblitz and brought more than 250 people together over 24
    hours.
  url: https://sta.uwi.edu/fst/lifesciences/node/355
  fetched: '2026-11-09'
  quote: The 14th annual Trinidad & Tobago BioBlitz explored the popular North Coast of Trinidad. Over
    a 24-hour period, more than 250 scientists, students, and nature enthusiasts collaborated to document
    the area’s rich biodiversity.
- claim: The 2025 event recorded about 1,498 species.
  url: https://sta.uwi.edu/fst/lifesciences/node/355
  fetched: '2026-11-09'
  quote: 'Species Recorded: Approximately 1,498'
- claim: The 2025 event used the iNaturalist app to log species in a publicly accessible database.
  url: https://sta.uwi.edu/fst/lifesciences/node/355
  fetched: '2026-11-09'
  quote: 'Data Collection: Utilized the iNaturalist app to log species, contributing to a publicly accessible
    database'
- claim: Held every year since 2012.
  url: https://sta.uwi.edu/news/releases/release.asp?id=23045
  fetched: '2026-11-09'
  quote: The annual Trinidad and Tobago Bioblitz, a tradition since 2012
- claim: TTT News reported more than 1,000 species recorded at the 2026 Bioblitz in Matura.
  url: https://www.ttt.live/keeping-it-green-matura-reveals-more-than-1000-species-during-bioblitz/
  fetched: '2026-11-09'
  quote: More than 1,000 species have so far been recorded during this year’s Bioblitz, organised by the
    Trinidad and Tobago Field Naturalists’ Club and UWI’s Department of Life Sciences.
- claim: Before the 2025 event a team deployed camera traps for terrestrial mammals.
  url: https://sta.uwi.edu/fst/lifesciences/sites/default/files/lifesciences/documents/Final%20Report%20Maracas%202025.pdf
  fetched: '2026-11-09'
  quote: Prior to the Bioblitz weekend a team led by Zak Ali deployed camera traps to capture terrestrial
