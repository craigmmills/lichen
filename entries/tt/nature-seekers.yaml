summary: Local sea turtle conservation organisation, according to the Wildlife Society; over 52 thermal
  drone flights, researchers recorded and identified 394 leatherback turtles and moved rangers to high-activity
  areas.
facts:
- claim: The Wildlife Society describes Nature Seekers as a local sea turtle conservation organisation.
  url: https://wildlife.org/wsb-thermal-drones-help-count-nesting-sea-turtles/
  fetched: 2026-11-09
  quote: Nature Seekers, a local sea turtle conservation organization
- claim: Its rangers use beach surveys to monitor the turtle population.
  url: https://wildlife.org/wsb-thermal-drones-help-count-nesting-sea-turtles/
  fetched: 2026-11-09
  quote: Nature Seekers rangers, who used to patrol the beach looking for poachers, now use these surveys
    to monitor the population and protect them.
- claim: Over 52 drone flights, thermal drones helped researchers record and identify 394 leatherback
    turtles and move rangers to high-activity areas.
  url: https://wildlife.org/wsb-thermal-drones-help-count-nesting-sea-turtles/
  fetched: 2026-11-09
  quote: Over the course of 52 flights, the drones helped researchers record and identify 394 leatherback
    sea turtles as well as relocate rangers to high-activity areas.
- claim: Nature Seekers is the lead affiliation on a 2025 Wildlife Society Bulletin paper on thermal drone
    imagery of sea turtles at Matura Beach; the record gives its address on the Toco Main Road, Matura.
  url: https://api.openalex.org/works/W4410501670?select=id,title,publication_year,doi,authorships
  fetched: 2026-11-09
  quote: Mile Mark Toco Main Road Matura Trinidad and Tobago
- claim: Nature Seekers is also the lead affiliation on a 2026 paper using a geospatial approach to assess
    leatherback nest loss from erosion.
  url: https://api.openalex.org/works/W7161719911?select=id,title,publication_year,authorships
  fetched: 2026-11-09
  quote: A Geospatial Approach for Preliminary Assessment of Erosion-Induced Leatherback Nest Loss on
    Dynamic Coastlines
