summary: Atlas built by the BirdLife Malta Ringing Scheme combining ringing recoveries,
  sightings and tracking data on bird movements in the Maltese Islands, still early
  in development, with live tracking and Flight for Insight gull data.
facts:
- claim: The atlas says it was developed by the BirdLife Malta Ringing Scheme and
    brings together ringing recoveries, sightings and tracking data on bird movements
    in the Maltese Islands.
  url: https://migrationatlas.birdlifemalta.org/
  fetched: 2026-11-14
  quote: Developed by the BirdLife Malta Ringing Scheme, this interactive atlas brings
    together ringing recoveries, bird sightings and tracking data to document bird
    movements to, from and within the Maltese Islands.
- claim: It describes itself as still in its early days, with species accounts and
    datasets added progressively.
  url: https://migrationatlas.birdlifemalta.org/
  fetched: 2026-11-14
  quote: This atlas is still in its early days, with new species accounts and datasets
    being added progressively.
- claim: It says part of the data in its Yellow-legged Gull account comes from BirdLife
    Malta's "Flight for Insight" gull monitoring project.
  url: https://migrationatlas.birdlifemalta.org/
  fetched: 2026-11-14
  quote: 'Part of the data comes from the "Flight for Insight: Monitoring Yellow-legged
    Gulls" project by BirdLife Malta.'
- claim: It offers live tracking of individual birds tracked through BirdLife Malta's
    research projects.
  url: https://migrationatlas.birdlifemalta.org/
  fetched: 2026-11-14
  quote: Follow individual birds tracked through our research projects.
