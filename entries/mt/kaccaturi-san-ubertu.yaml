summary: Voluntary organisation reported in April 2024 to have captured 20 turtle
  doves in Malta since 2021 for satellite tagging, and listed in 2025 with a EUR 19,118.40
  grant for satellite tagging of common quail.
facts:
- claim: MaltaToday reported in April 2024 that 20 turtle doves had been captured
    in Malta since 2021 for a satellite tagging study by KSU, overseen by the Wild
    Birds Regulation Unit.
  url: https://www.maltatoday.com.mt/news/national/128545/how_a_turtle_dove_tagged_in_malta_ended_up_in_ukraine
  fetched: 2026-11-15
  quote: as part of a satellite tagging study by Kaċċaturi San Ubertu (KSU), a hunting
    organisation, overseen by the Wild Birds Regulation Unit
- claim: Its president told MaltaToday the study is part of its efforts to collect
    scientific data on turtle dove migration patterns.
  url: https://www.maltatoday.com.mt/news/national/128545/how_a_turtle_dove_tagged_in_malta_ended_up_in_ukraine
  fetched: 2026-11-15
  quote: the study is part of the organisation’s efforts to collect scientific data
    related to migration patterns for turtle dove
- claim: The Conservation of Wild Birds Fund 2025 call results list it among voluntary
    organisations, with a grant of EUR 19,118.40 for satellite tagging of common quail.
