summary: A non-profit voluntary organisation founded in 2008 researching sharks, rays
  and skates, whose 2011–2024 bull ray data yielded 135 individuals across 407 sightings,
  according to a 2025 paper.
facts:
- claim: Its European Solidarity Corps listing describes it as a registered non-profit,
    voluntary organisation in Malta, founded in 2008, dedicated to research, education
    and awareness about sharks, rays and skates.
  url: https://youth.europa.eu/volunteering/organisation/50270_fr
  fetched: 2026-11-14
  quote: Founded in 2008, Sharklab-Malta is a registered non-profit, voluntary organisation
    in Malta dedicated to research, education and raising greater awareness about
    elasmobranches (sharks, rays and skates) and the marine world.
- claim: A 2025 paper in Frontiers in Marine Science says members of Sharklab-Malta
    collected photo-identification data on bull rays from 2011 to 2024.
  url: https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2025.1653284/full
  fetched: 2026-11-14
  quote: photo-identification data were collected by members of Sharklab-Malta in
    conjunction with the Fly With Bull Rays (FWBR) program
- claim: The paper reports 859 surveys around the Maltese archipelago, with 407 sightings
    and 135 individual bull rays identified.
  url: https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2025.1653284/full
  fetched: 2026-11-14
  quote: A total of 859 surveys were conducted around the MA, with a total of 407
    sightings of A. bovinus and the identification of 135 individuals.
- claim: The 2025 paper also refers to a then-ongoing fisheries verification study
    by Sharklab-Malta of sharks and rays passing through the central fish market.
  url: https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2025.1653284/full
  fetched: 2026-11-14
  quote: ongoing separate fisheries verification study conducted by Sharklab-Malta
- claim: Its own site says it has identified over 100 bull rays across more than 400
    sightings.
  url: https://www.sharklab-malta.org
  fetched: 2026-11-14
  quote: Over 100 bull rays identified across 400+ sightings
