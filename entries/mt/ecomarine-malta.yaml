summary: For-profit enterprise set up by Patrizia Patti, whose DelfishPAM project
  collected over 1,000 hours of underwater acoustic recordings, which ECHO-AI plans
  to catalogue into labelled datasets for machine-learning models.
facts:
- claim: A 2018 THINK magazine article says Patrizia Patti set up EcoMarine Malta
    as a for-profit enterprise, not an NGO.
  url: https://thinkmagazine.mt/chasing-the-white-whale-the-pursuit-of-sustainable-tourism-in-malta
  fetched: 2026-11-15
  quote: Setting up EcoMarine Malta as a for-profit enterprise to prove these people
    wrong, however, has led to another kettle of fish. Because they’re not an NGO
- claim: A January 2026 University of Malta page says its DelfishPAM project collected
    over 1,000 hours of underwater acoustic recordings through passive acoustic monitoring.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
  fetched: 2026-11-15
  quote: Building on the EcoMarine Malta DelfishPAM project, which collected over
    1,000 hours of underwater acoustic recordings through Passive Acoustic Monitoring
- claim: The page says the ECHO-AI project will catalogue the recordings into labelled
    datasets and train machine-learning models to identify key sound patterns.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
  fetched: 2026-11-15
  quote: to train and optimise machine-learning models capable of identifying key
    sound patterns
- claim: The page says the recordings will be manually reviewed and catalogued to
    create labelled datasets for the models.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
  fetched: 2026-11-15
  quote: catalogued to create high-quality labelled datasets
  ai_type: ml-supervised
