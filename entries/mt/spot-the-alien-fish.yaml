summary: Campaign launched by the University of Malta in 2016 with partners including ISPRA, aiming at
  long-term monitoring of selected alien fish species through an informal network across Malta, Tunisia
  and Sicily.
facts:
- claim: The University of Malta says it launched the campaign in 2016 through Alan Deidun, with the IOI,
    the Department of Fisheries and Aquaculture, Friends of the Earth and ISPRA.
  url: https://www.um.edu.mt/newspoint/news/2016/11/spotthealienfishcampaignlaunched
  fetched: 2026-11-12
  quote: the University of Malta, through Prof. Alan Deidun (Department of Geosciences, Faculty of Science),
    has teamed up once again with the IOI (International Ocean Institute)
- claim: Its aim is long-term monitoring of population changes of selected alien fish species, within
    an informal observation network between Malta, Tunisia and Sicily.
  url: https://www.um.edu.mt/newspoint/news/2016/11/spotthealienfishcampaignlaunched
  fetched: 2026-11-12
  quote: The ultimate aim of this campaign is to monitor in the long-term any population changes within
    our waters of the selected alien fish species
