summary: Project launched in January 2026 by EcoMarine Malta with the University of
  Malta, funded through Xjenza Malta, that plans to train machine-learning models
  on acoustic recordings to identify key sound patterns.
facts:
- claim: A January 2026 University of Malta page announces the launch of ECHO-AI by
    EcoMarine Malta with the University, funded through Xjenza Malta's Technology
    Extension Support.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
  fetched: 2026-11-15
  quote: is proud to announce the launch of ECHO-AI – Enhancing Cetacean Habitat Observation
    through Artificial Intelligence , a new initiative funded through Xjenza Malta’s
    Technology Extension Support
- claim: The page says the project will use existing and new acoustic recordings to
    train machine-learning models that identify key sound patterns.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
  fetched: 2026-11-15
  quote: The project will use both existing acoustic datasets and new field recordings
    to train and optimise machine-learning models capable of identifying key sound
    patterns.
- claim: The page says the recordings will be catalogued into labelled datasets for
    the models.
  url: https://www.um.edu.mt/newspoint/discuss/2026/departmentofaiandecomarinemaltalaunchecho-aiproject.html
