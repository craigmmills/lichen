summary: Voluntary organisation, enrolled since 2008, which a June 2026 post says
  is doing biodiversity monitoring and citizen science on Comino using wildlife cameras
  and iNaturalist, with Xjenza Malta funding.
facts:
- claim: Its history page says it has been enrolled with the Commissioner for Voluntary
    Organisations since 2008, registered number VO/0091.
  url: https://foemalta.org/about-us/our-history/
  fetched: 2026-11-14
  quote: Since 2008 FoE Malta has been enrolled with the Commissioner for Voluntary
    Organisations in accordance with the Voluntary Organisations Act. Registered No.
    VO/0091
- claim: A June 2026 post says it has been carrying out biodiversity monitoring and
    citizen science around the Old Bakery on Comino, with support from Xjenza Malta's
    National STEM Community Fund.
  url: https://foemalta.org/blog/discovering-cominos-hidden-wildlife-through-citizen-science/
  fetched: 2026-11-14
  quote: Friends of the Earth Malta has been carrying out biodiversity monitoring
    and citizen science activities around Il-Forn ta’ Kemmuna (the Old Bakery in Comino)
- claim: The post says wildlife cameras, bird monitoring equipment and iNaturalist
    were introduced to support environmental monitoring.
  url: https://foemalta.org/blog/discovering-cominos-hidden-wildlife-through-citizen-science/
  fetched: 2026-11-14
  quote: wildlife cameras, bat boxes, bird monitoring equipment, telescopes, and online
    biodiversity platforms such as iNaturalist were introduced and installed to support
    environmental monitoring
- claim: The post says the wider Wild Kemmuna iNaturalist project, to which its walk
    contributed, had passed 1,020 observations and more than 226 species.
  url: https://foemalta.org/blog/discovering-cominos-hidden-wildlife-through-citizen-science/
  fetched: 2026-11-14
  quote: The wider project has now surpassed 1020 observations and helped identify
    more than 226 species associated with the island and its surrounding habitats.
