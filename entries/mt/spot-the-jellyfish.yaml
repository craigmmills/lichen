summary: Citizen science project described in July 2021 as one of Malta's largest, with over
  4,000 verified reports then, and a neural network trained on 1,000 images to recognise five
  jellyfish.
facts:
- claim: In July 2021, THINK magazine described Spot the Jellyfish as one of Malta's largest
    citizen science projects, with more than 4,000 verified reports at that time.
  url: https://thinkmagazine.mt/juggling-jellyfish-how-ai-can-improve-citizen-science-projects/
  fetched: 2026-11-12
  quote: The campaign has been hugely popular, with more than 4,000 verified reports to date.
- claim: The team trained a convolutional neural network on 1,000 labelled images to recognise
    the five most commonly reported jellyfish.
  url: https://thinkmagazine.mt/juggling-jellyfish-how-ai-can-improve-citizen-science-projects/
  fetched: 2026-11-12
  quote: Taking 1,000 images, each one labelled with the jellyfish species in the photo, they
    began training a tailor-designed Convolution Neural Network (CNN) to recognise individual
    features.
  ai_type: deep-learning
- claim: The July 2021 article says the team had produced a highly accurate algorithm for
    the five most commonly reported jellyfish and planned to put it on the website.
  url: https://thinkmagazine.mt/juggling-jellyfish-how-ai-can-improve-citizen-science-projects/
  fetched: 2026-11-12
  quote: The team managed to produce a highly accurate algorithm capable of recognising these
    five most common jellyfish
