summary: Closed BirdLife Malta-led project, running September 2011 to June 2016, that tracked shearwaters
  with GPS loggers and geolocators and monitored colonies by mark-recapture and boat transect counts.
facts:
- claim: BirdLife Malta says the project was led by BirdLife Malta with the Ministry for Sustainable Development,
    the Environment and Climate Change, the RSPB and SPEA, and ran from September 2011 to June 2016.
  url: https://birdlifemalta.org/conservation/malta-seabird-project/
  fetched: 2026-11-12
  quote: The project started in September 2011 and ran until June 2016.
- claim: GPS loggers were attached to Yelkouan and Scopoli's shearwaters to record foraging trips at sea,
    and geolocators tracked the birds for a year.
  url: https://birdlifemalta.org/conservation/malta-seabird-project/
  fetched: 2026-11-12
  quote: GPS loggers are attached to the back of Yelkouan and Scopoli’s shearwaters, for a few days at
    a time, to record where the birds have been on their foraging trips out at sea.
- claim: Seabird colonies were monitored by mark-recapture, and boat transect counts were made in 2012
    and 2013 following the European Seabirds at Sea method.
  url: https://birdlifemalta.org/conservation/malta-seabird-project/
  fetched: 2026-11-12
  quote: Seabird colonies are monitored using a mark-recapture method
