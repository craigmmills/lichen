facts:
- claim: The University of Malta describes it as a research programme on benthic habitats in Maltese waters
    to support marine Natura 2000 site designation, 50% co-financed by the EU LIFE+ programme.
  url: https://www.um.edu.mt/science/biology/ourresearch/externally-fundedprojects/lifebaharforn2k/
  fetched: 2026-11-12
  quote: is a research programme that aims to conduct research on benthic habitats in Maltese waters to
    support marine Natura 2000 site designation and is 50% co-financed by the EU LIFE+ Funding Programme.
- claim: Oceana says it was the partner tasked with the marine surveys and explored areas down to 1,039
    m deep.
  url: https://europe.oceana.org/press-releases/extensive-marine-research-malta-concludes-after-140-days-sea/
  fetched: 2026-11-12
  quote: Oceana, the project partner tasked with carrying out marine surveys, has concluded its at-sea
    research in Malta to explore deep-sea areas, underwater caves and sandbanks
