summary: Closed BirdLife Malta project from March 2022 to March 2023 that followed
  Mediterranean and Yellow-legged Gulls, especially around Salina Nature Reserve,
  using satellite transmitters, funded by the Conservation of Wild Birds Funding Scheme
  2021.
facts:
- claim: The project page dates the project from March 2022 to March 2023 and says
    BirdLife Malta developed it to study the movements and ecology of two gull species,
    in particular around Salina Nature Reserve.
  url: https://migrationatlas.birdlifemalta.org/projects/4
  fetched: 2026-11-14
  quote: The Tracking Mediterranean Gulls and Yellow-legged Gulls project was developed
    by BirdLife Malta to improve our understanding of the movements and ecology of
    two gull species
- claim: The page says lightweight GSM satellite transmitters (written "Ornitelia")
    were used to follow individual birds.
  url: https://migrationatlas.birdlifemalta.org/projects/4
  fetched: 2026-11-14
  quote: Lightweight Ornitelia GSM satellite transmitters were used to follow individual
    birds
