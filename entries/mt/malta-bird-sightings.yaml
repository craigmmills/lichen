summary: Portal built by BirdLife Malta in January 2021 for local birders' records,
  with more than 19,000 sessions logged by about 80 users by 1 October 2024 and nightly
  data sent to EuroBirdPortal since September 2024.
facts:
- claim: A January 2025 EuroBirdPortal news item says BirdLife Malta launched Malta
    Bird Sightings in January 2021 as a portal for local birders to submit their records.
  url: https://life.eurobirdportal.org/news/Malta-Bird-Sightings-improves-its-capacity-to-collect-complete-list-1746555748
  fetched: 2026-11-15
  quote: In January 2021 BirdLife Malta launched a new online bird recording portal,
    named Malta Bird Sightings (MBS)
- claim: The item says that by 1 October 2024 more than 19,000 birding sessions had
    been logged by about 80 users.
  url: https://life.eurobirdportal.org/news/Malta-Bird-Sightings-improves-its-capacity-to-collect-complete-list-1746555748
  fetched: 2026-11-15
  quote: more than 19 thousand birding sessions have been logged by approximately
    80 users
- claim: The item says the portal was modified in 2022 for standardised data collection,
    including migration monitoring and breeding bird surveys.
  url: https://life.eurobirdportal.org/news/Malta-Bird-Sightings-improves-its-capacity-to-collect-complete-list-1746555748
  fetched: 2026-11-15
  quote: modified to facilitate standardized data collection for various types of
    surveying including migration monitoring and breeding bird surveys
- claim: The item says live data has been pushed to the EuroBirdPortal every night
    since September 2024, with over 160,000 records from Malta in it.
  url: https://life.eurobirdportal.org/news/Malta-Bird-Sightings-improves-its-capacity-to-collect-complete-list-1746555748
  fetched: 2026-11-15
  quote: with over 160 thousand records from Malta now present in the EBP
