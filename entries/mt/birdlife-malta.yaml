summary: Malta's oldest environmental NGO by its own account, established in 1962 and a BirdLife International
  partner, which led a seabird project using GPS loggers and runs LIFE PanPuffinus!.
facts:
- claim: Says it was established in 1962 and is the oldest environmental NGO in Malta, and a partner organisation
    of BirdLife International.
  url: https://birdlifemalta.org/about/work/
  fetched: 2026-11-12
  quote: Established in 1962, BirdLife Malta is the oldest environmental NGO in Malta.
- claim: Led the LIFE+ Malta Seabird Project (2011 to 2016), which tracked shearwaters with GPS loggers
    and monitored colonies by mark-recapture.
  url: https://birdlifemalta.org/conservation/malta-seabird-project/
  fetched: 2026-11-12
  quote: The LIFE+ Malta Seabird Project is led by BirdLife Malta
- claim: Its Malta Bird Migration Atlas records a Yelkouan shearwater tracked with a GPS logger in 2021
    under LIFE PanPuffinus!.
  url: https://migrationatlas.birdlifemalta.org/taggedbird/5
  fetched: 2026-11-12
  quote: In 2021, as part of LIFE Panpuffinus we tracked it with a gps-logger during the chick-rearing
    period.
