summary: Closed project, September 2021 to June 2023, led by Ambjent Malta and funded by MCST, that aimed
  to map Posidonia oceanica using remote sensing including Sentinel-2, drones and SCUBA dives.
facts:
- claim: MAARES ran from September 2021 to June 2023, funded by the MCST Space Research Fund and led by
    Ambjent Malta, with ERA and PIXAM Ltd as other partners. It aimed to map Posidonia oceanica using
    remote sensing.
  url: https://um.edu.mt/research/oceanographymalta/projects/maares
  fetched: 2026-11-12
  quote: MAARES is funded by the Malta Council for Science and Technology (MCST) Space Research Fund.
    The project is led by Ambjent Malta, with Environment & Resources Authority and PIXAM Ltd. as other
    partners.
- claim: In August 2022 the project reported that SCUBA dives, drone flights and high-resolution satellite
    data such as Sentinel-2 let researchers distinguish seagrass meadows from other seabed habitats.
  url: https://www.um.edu.mt/newspoint/news/2022/08/maares-project-delivers-its-first-results
  fetched: 2026-11-12
  quote: researchers collaborating on the project managed to accurately distinguish seagrass meadows from
    other benthic habitats within the mapped embayments
- claim: The project was co-funded by the MCST Space Fund Programme and Malta's Ministry for the Environment,
    Energy and Enterprise.
  url: https://www.um.edu.mt/newspoint/news/2022/08/maares-project-delivers-its-first-results
