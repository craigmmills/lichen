summary: Project led by MCAST, with AquaBioTech Group researchers, that developed
  a system identifying Mediterranean benthic habitats using computer vision and machine
  learning, trained on more than 20,000 images from Maltese waters.
facts:
- claim: A September 2024 MCAST page says the project, led by MCAST and AquaBioTech
    Group researchers, developed a system that identifies Mediterranean benthic marine
    habitats using image processing, computer vision and machine learning.
  url: https://mcast.edu.mt/2024/09/20/ambulant-research-project-helps-develop-innovative-marine-monitering-system/
  fetched: 2026-11-15
  quote: has developed an innovative system capable of identifying Mediterranean benthic
    marine habitats using image processing, computer vision, and machine learning.
- claim: The page says a dataset of more than 20,000 images from Maltese waters was
    used to train an AI model for object detection and instance segmentation of underwater
    species.
  url: https://mcast.edu.mt/2024/09/20/ambulant-research-project-helps-develop-innovative-marine-monitering-system/
  fetched: 2026-11-15
  quote: The dataset was then used to train an AI model that not only performs object
    detection
  ai_type: ml-supervised
- claim: The page says the system helps track changes in benthic organisms as indicators
    of ecosystem health.
  url: https://mcast.edu.mt/2024/09/20/ambulant-research-project-helps-develop-innovative-marine-monitering-system/
  fetched: 2026-11-15
  quote: The system created through AMBULANT helps to track these changes
