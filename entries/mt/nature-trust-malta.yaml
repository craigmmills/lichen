summary: Maltese environmental NGO that, per Malta's 2023 EUROBATS report, rescues and rehabilitates bats
  with ERA funding, and in July 2024 was reported to have found a turtle nest and sought monitoring volunteers.
facts:
- claim: Malta's 2023 EUROBATS report describes Nature Trust-FEE Malta as a local environmental NGO that
    rescues and rehabilitates bats, with financial help from ERA.
  url: https://www.eurobats.org/sites/default/files/documents/pdf/National_Reports/NationalReport%20Malta%202023.pdf
  fetched: 2026-11-12
  quote: a local environmental NGO, implements rescue and rehabilitation of bats in Malta
- claim: On 16 July 2024, MaltaToday reported that Nature Trust Malta volunteers had spotted a turtle
    nest during a routine morning patrol.
  url: https://maltatoday.com.mt/environment/nature/130275/fourth_turtle_nesting_site_at_golden_bay
  fetched: 2026-11-12
  quote: A fourth turtle nesting site of this season has been spotted during a routine morning patrol
    by Nature Trust Malta (NTM-FEE) volunteers.
- claim: The July 2024 report says Nature Trust called for volunteers to monitor that nesting site.
  url: https://maltatoday.com.mt/environment/nature/130275/fourth_turtle_nesting_site_at_golden_bay
  fetched: 2026-11-12
  quote: Nature Trust calls for volunteers to monitor nesting site as ERA issues emergency conservation
    order
