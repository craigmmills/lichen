facts:
- claim: A THINK magazine article (issue 46) says the University of Malta teamed up
    with Ambjent Malta to map invasive alien plants, with funding from the Malta Information
    Technology Agency.
  url: https://www.um.edu.mt/library/oar/bitstream/123456789/135660/1/THINK46-From%20Drones.pdf
  fetched: 2026-11-15
  quote: Therefore, the UM teamed up with Ambjent Malta, a government entity tasked
    with preserving and enhancing Malta’s natural capital and biodiversity, to map
    plants that are foreign to Malta
- claim: The article says the team used open-source convolutional neural network models,
    implemented as deep learning models, on labelled drone image mosaics.
  url: https://www.um.edu.mt/library/oar/bitstream/123456789/135660/1/THINK46-From%20Drones.pdf
