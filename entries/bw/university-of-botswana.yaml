summary: Botswana's first institution of higher learning, established in 1982 and based in Gaborone, whose
  Okavango Research Institute, set up in 1994, was tasked with monitoring for the Okavango Delta Management
  Plan.
facts:
- claim: An Esri South Africa user story says the university was established in 1982 as the first institution
    of higher learning in Botswana.
  url: https://www.esri-southafrica.com/?p=2072
  fetched: 2026-11-08
  quote: The University of Botswana (UB) was established in 1982 as the first institution of higher learning
    in Botswana.
- claim: The same story says the Okavango Research Institute is at its Maun campus.
  url: https://www.esri-southafrica.com/?p=2072
  fetched: 2026-11-08
  quote: Maun campus where the Okavango Research Institute (ORI) is located
- claim: Its Okavango Research Institute was established by the Botswana Government under the auspices
    of the university in 1994.
  url: https://ori.ub.bw/about-ori
  fetched: 2026-11-08
  quote: The need for scientific information on the Okavango Delta ecosystem resulted in the Botswana
    Government establishing the ORI under the auspices of the University of Botswana in 1994.
- claim: Based on Notwane Road, Gaborone.
  url: https://www.ub.bw/faculties-and-departments/okavango-research-institute
