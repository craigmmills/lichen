facts:
- claim: Registered as a charity in England and Wales and as an NGO in Botswana.
  url: https://www.elephantsforafrica.org/about-elephants-for-africa/study-sites/
  fetched: 2026-11-12
  quote: Elephants for Africa is a registered charity in England & Wales (number 1179318)
    and a registered NGO in Botswana (number CR12058).
- claim: Runs a research camp on the Boteti River inside Makgadikgadi Pans National
    Park.
  url: https://www.elephantsforafrica.org/about-elephants-for-africa/study-sites/
  fetched: 2026-11-12
  quote: The Elephants for Africa research camp is based on the banks of the Boteti
    River inside the National Park
- claim: Set up a network of camera traps on elephant pathways to the Boteti River,
    which ran from 2014 to April 2017, according to its Zooniverse project page.
  url: https://www.zooniverse.org/projects/shuebner729/snapshot-elephants-for-africa/about/research
  fetched: 2026-11-12
  quote: EFA set up a network of camera traps which were running from 2014, until
    April 2017
- claim: Says its camera trap data forms a large part of its species monitoring in
    Makgadikgadi Pans National Park and will be fed back to the Department of Wildlife
    and National Parks.
  url: https://www.zooniverse.org/projects/shuebner729/snapshot-elephants-for-africa/about/research
  fetched: 2026-11-12
  quote: this important information will be fed back to the Department of Wildlife
    and National Parks, who manage the Park.
