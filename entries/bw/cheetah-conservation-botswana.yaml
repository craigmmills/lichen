facts:
- claim: In December 2020 it reported taking down 132 motion-activated cameras from the Ghanzi ranches,
    placed as part of long-term wildlife monitoring.
  url: https://cheetahconservationbotswana.org/news/archives/12-2020
  fetched: 2026-11-08
  quote: Last month our research team took down the 132 motion-activated cameras that they had placed
    out across the Ghanzi commercial ranches as part of a long-term wildlife monitoring exercise.
- claim: It said the cameras are placed for three months every year and indicate whether cheetah populations
    are rising, falling or stable.
  url: https://cheetahconservationbotswana.org/news/archives/12-2020
  fetched: 2026-11-08
  quote: The cameras, which are placed out for three consecutive months every year, monitor changes in
    wildlife numbers and distribution
- claim: It said it had sent the photos to Wageningen University to trial automated photo-analysis software.
  url: https://cheetahconservationbotswana.org/news/archives/12-2020
  fetched: 2026-11-08
  quote: we have sent the photos to the Wageningen University in the Netherlands to trial their automated
    photo-analysis software
