  quote: KWT remains the only entity carrying out regular wildlife monitoring and
    anti-poaching surveillance patrols in NG3
- claim: In 2024 it analysed part of its patrol spoor data to estimate species densities
    and map density gradients.
  url: https://www.kalahariwildlandstrust.com/what-we-are-up-to
  fetched: 2026-11-12
  quote: we were able to analyze a portion of our accumulated wildlife spoor data
