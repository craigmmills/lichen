- claim: Its NG3 wildlife monitoring and data collection programme has been running
    since 2019.
  url: https://www.kalahariwildlandstrust.com/what-we-are-up-to
  fetched: 2026-11-12
  quote: KWT's NG3 wildlife monitoring and data collection program, which also incorporates
    human-wildlife conflict mitigation, anti-poaching surveillance, early burning
    woodland restoration, and traditional knowledge transfer, has been ongoing since
    2019.
- claim: KWT says it remains the only body carrying out regular wildlife monitoring
    and anti-poaching patrols in NG3.
  url: https://www.kalahariwildlandstrust.com/what-we-are-up-to
