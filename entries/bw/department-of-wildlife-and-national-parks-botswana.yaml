summary: Government department, run by the environment ministry, responsible for fish and wildlife; its
  Maun office received donated drones in November 2025, and it was named a partner in a planned EarthRanger
  project.
facts:
- claim: The ministry's page says the department is responsible for conserving and managing fish and wildlife
    resources and their habitats.
  url: https://www.gov.bw/ministries/ministry-environment-and-tourism
  fetched: 2026-11-08
  quote: Responsible for conserving and managing fish and wildlife resources and their habitats in consultation
    with local, regional and international stakeholders
- claim: Its address is Plot 50380, Moedi House, Fairgrounds, Gaborone.
  url: https://www.gov.bw/environmental-management/application-environmental-education-program-educational-parks
  fetched: 2026-11-08
  quote: Plot 50380, Moedi House
- claim: In November 2025 its Maun office received drones, trail cameras and tablets donated by And Beyond
    Safari with Wild Impact.
  url: https://dailynews.gov.bw/news-detail/89176
  fetched: 2026-11-08
  quote: The donation package include drones, trail cameras, tablets, and camping equipment, among other
    items.
- claim: Its acting regional wildlife coordinator said the drones would be used for patrols, animal tracking
    and wildlife population monitoring.
  url: https://dailynews.gov.bw/news-detail/89176
  fetched: 2026-11-08
  quote: The new drones equipped with visual cameras, he said, would enhance patrols, animal tracking,
    and wildlife population monitoring.
- claim: Responsible for conserving and managing fish and wildlife resources and their habitats.
  url: https://www.gov.bw/ministries/ministry-environment-and-tourism
  fetched: 2026-11-08
  quote: Department of Wildlife and National Parks Responsible for conserving and managing fish and wildlife
    resources and their habitats
- claim: A November 2022 GEF release named it as a partner of AI2 and Conservation International in a
    planned EarthRanger project for protected areas in Botswana, Mozambique and the Republic of Congo,
    scheduled for July 2022–March 2026.
  url: https://www.thegef.org/newsroom/press-releases/new-project-deploys-earthranger-strengthen-protected-areas-africa
  fetched: 2026-11-08
  quote: Conservation International will execute the project in partnership with Botswana’s Department
    of Wildlife and National Parks
