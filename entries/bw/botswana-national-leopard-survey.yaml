summary: Closed SCIF-run survey, with the Department of Wildlife and National Parks,
  covering 20 sites with over 1,000 trail camera stations from September 2022 to December
  2024, used for national leopard maps; final report completed August 2026.
facts:
- claim: SCIF and its partners surveyed 20 sites with more than 1,000 trail camera
    stations from September 2022 to December 2024.
  url: https://safariclubfoundation.org/sci-foundation-completes-first-national-scale-leopard-assessment-in-botswana/
  fetched: 2026-11-12
  quote: From September 2022 through December 2024, SCIF and its partners carried
    out an unprecedented field effort across Botswana, surveying 20 sites with more
    than 1,000 trail camera stations.
- claim: SCIF researchers used the survey data to build national maps of predicted
    leopard abundance and distribution.
  url: https://safariclubfoundation.org/sci-foundation-completes-first-national-scale-leopard-assessment-in-botswana/
  fetched: 2026-11-12
  quote: Using the survey data, SCIF researchers also developed national maps of predicted
    leopard abundance and distribution.
- claim: The final report was completed in August 2026.
  url: https://safariclubfoundation.org/sci-foundation-completes-first-national-scale-leopard-assessment-in-botswana/
  fetched: 2026-11-12
  quote: This work culminated in the completion of the final report in August 2026
