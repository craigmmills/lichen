summary: NGO described in a March 2018 interview as focused on vulture conservation
  in Botswana and southern Africa, which worked with the FitzPatrick Institute to
  quantify vulture population change over 30 years.
facts:
- claim: In a March 2018 interview, Richard Reading described Raptors Botswana as
    an NGO focused on vulture conservation throughout Botswana and southern Africa,
    studying nesting ecology, population dynamics, movement patterns and sources of
    mortality.
  url: https://www.africanraptors.org/interview-with-richard-reading-about-raptors-in-botswana/
  fetched: 2026-11-12
  quote: Our collective work has focused on nesting ecology, population dynamics,
    movement patterns, and sources of mortality.
- claim: Worked with the FitzPatrick Institute of African Ornithology to quantify
    changes in vulture populations in Botswana over 30 years by repeating road transects
    from the early 1990s and aerial surveys of key colonies.
  url: https://science.uct.ac.za/fitzpatrick/research-maintaining-biodiversity-species-level-conservation/vulture-conservation
  fetched: 2026-11-12
  quote: We have worked with the conservation NGO Raptors Botswana to quantify changes
    in vulture populations in Botswana over the last 30 years by repeating road transects
    undertaken in the early 1990s and repeating aerial surveys of key colonies.
