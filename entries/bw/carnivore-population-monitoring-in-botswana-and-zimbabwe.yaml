summary: WildCRU-run programme reporting 53 camera-trap surveys across Botswana and Zimbabwe to establish
  baseline large carnivore densities, classifying images with the AI tool TrapTagger.
facts:
- claim: WildCRU says it has conducted camera-trap surveys across Botswana and Zimbabwe for over a decade
    to establish baseline densities of large carnivores in protected areas.
  url: https://www.wildcru.org/?p=4326
  fetched: 2026-11-08
  quote: For over a decade WildCRU, in collaboration with the WildCAT Trust Zimbabwe, have conducted extensive
    camera trap surveys across Botswana and Zimbabwe to establish baseline population densities of large
    carnivores in protected areas.
- claim: Images are first classified to species with TrapTagger, an AI tool co-developed by WildCRU.
  url: https://www.wildcru.org/?p=4326
  fetched: 2026-11-08
  quote: These images are first processed and classified to the species level using advanced AI tools
    (TrapTagger) that were co-developed by WildCRU.
- claim: The programme reports 53 camera-trap surveys across the two countries.
  url: https://www.wildcru.org/?p=4326
  fetched: 2026-11-08
  quote: camera trap surveys carried out across Botswana and Zimbabwe to estimate baseline populations
