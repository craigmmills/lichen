summary: Closed pilot run by the Ministry of Homeland Security and Technology that collected baseline
  sound data at the damaged Rasfari reef in April 2025 and trained 17 stakeholders.
facts:
- claim: Baseline sound data were collected at the damaged Rasfari reef and a control site from 7 to 28
    April 2025.
  url: https://www.plus.mv/?p=125588
  fetched: 2026-11-12
  quote: Baseline sound data were collected from the affected site and a nearby control site between 7
    and 28 April 2025
- claim: The pilot trained 17 stakeholders, including representatives from the EPA, Maldives National
    University and Maldives Marine Research Institute.
  url: https://www.plus.mv/?p=125588
  fetched: 2026-11-12
  quote: The pilot trained 17 stakeholders, including representatives from the EPA, Maldives National
    University (MNU), the Maldives Marine Research Institute (MMRI), and the private sector.
- claim: Training was given by marine biologists from Ocean World of Sound.
  url: https://www.plus.mv/?p=125588
  fetched: 2026-11-12
  quote: The training sessions, conducted by marine biologists from Ocean World of Sound
- claim: MV+ reported the pilot as completed in May 2025.
  url: https://www.plus.mv/?p=125588
  fetched: 2026-11-12
  quote: following the completion of a pilot programme
