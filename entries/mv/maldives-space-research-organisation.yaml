summary: A non-governmental organisation describing itself as the first dedicated
  to the Maldives space sector, whose 2023 Goidhoo Atoll pilot used UAV, satellite,
  survey and citizen science data on seagrass, coral and mangroves.
facts:
- claim: Describes itself as a non-governmental organisation and the first organisation
    dedicated to advancing the space sector in the Maldives.
  url: https://www.iafastro.org/companies/the-maldives-space-research-organisation-msro.html
  fetched: 2026-11-14
  quote: As a non-governmental organization, MSRO is committed to harnessing space
    science, technology, and applications to address some of the most pressing challenges
    facing island nations in the era of climate change.
- claim: Its Goidhoo Atoll Earth observation pilot investigated seagrass trends, coral
    reef health and changing mangrove ecosystems, with fieldwork from 25 February
    to 2 March 2023.
  url: https://parispeaceforum.org/projects/goidhoo-atoll-earth-observation-pilot-maldives/
  fetched: 2026-11-14
  quote: seagrass trends, inconsistent agricultural yield, coastal erosion, coral
    reef health, and changing mangrove ecosystems
- claim: The pilot collected data through expert observations, citizen science, surveys,
    UAV imaging and satellite imagery.
  url: https://parispeaceforum.org/projects/goidhoo-atoll-earth-observation-pilot-maldives/
  fetched: 2026-11-14
  quote: Data was collected through expert observations, citizen science, surveys,
    UAV imaging, and satellite imagery.
- claim: The 2023 pilot presentation reports data analysis and hyperspectral imagery
    at over 12 locations in the atoll, with further expeditions planned at that time.
  url: https://parispeaceforum.org/projects/goidhoo-atoll-earth-observation-pilot-maldives/
  fetched: 2026-11-14
  quote: Data analysis and hyperspectral imagery was carried out in over 12 locations
    of interest within the atoll, with preliminary results presented to stakeholders
    and further expeditions planned.
