summary: Online national repository for Maldivian coral reef data, relaunched in December
  2021, which a World Bank paper said held only citizen science data at the time of
  writing.
facts:
- claim: The Maldives' member report to ICRI describes CoralDatabase as the online
    national repository for coral reef ecosystem data and says it was relaunched in
    December 2021.
  url: https://icriforum.org/wp-content/uploads/2024/09/ICRIGM38-Members_Report-template_240705_MEECC.pdf
  fetched: 2026-11-15
  quote: CoralDatabase, the online national repository to collect and manage data
    on coral reef
- claim: The same report says the database was relaunched in December 2021.
  url: https://icriforum.org/wp-content/uploads/2024/09/ICRIGM38-Members_Report-template_240705_MEECC.pdf
  fetched: 2026-11-15
  quote: ecosystems was relaunched in December 2021
- claim: The report lists promoting the database to citizen scientists and marine
    biologists who carry out coral reef monitoring.
  url: https://icriforum.org/wp-content/uploads/2024/09/ICRIGM38-Members_Report-template_240705_MEECC.pdf
  fetched: 2026-11-15
  quote: Promoting CoralDatabase for citizen scientists and marine biologists carrying
    out coral
- claim: A World Bank background paper says an online repository for monitoring data
    exists for the Maldives, the Coral Database, and that it held only citizen science
    data at the time.
  url: https://documents1.worldbank.org/curated/en/099120224122531951/pdf/P180529-cfd196cd-80e4-498d-a2d4-8d1030d906de.pdf
  fetched: 2026-11-15
  quote: Maldives – the Coral Database - though it currently houses only citizen science
    data.
- claim: The same paper suggests that data sharing can be improved by using existing
    online databases such as the Maldives' Coral Database.
  url: https://documents1.worldbank.org/curated/en/099120224122531951/pdf/P180529-cfd196cd-80e4-498d-a2d4-8d1030d906de.pdf
  fetched: 2026-11-15
  quote: Data sharing can also be improved  by utilizing existing online databases
    like the Maldives'
- claim: The World Bank's completion report for the Maldives Climate Change Adaptation
    Project says the database was accepted as the standard for collecting, storing
    and analysing reef health data.
  url: https://documents1.worldbank.org/curated/en/408441551394380744/pdf/Implementation-Completion-and-Results-Report-ICR-Document-Climate-Change-Adaptation-Project-P153301.pdf
  fetched: 2026-11-15
  quote: database was accepted as the standard for the collection, storage and analysis
    of reef health data.
