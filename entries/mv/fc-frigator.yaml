summary: Maldivian NGO from Haa Alif Hoarafushi Island associated with GEF-funded
  lesser noddy research that UNDP says involved the Maldives’ first satellite tracking
  of seabirds.
facts:
- claim: In March 2023, UNDP described NGO FC Frigator from Haa Alif Hoarafushi Island
    as running a seabird research project on lesser noddy colonies and roosting sites
    in Ihavandhippolhu Atoll, funded under the GEF Small Grants Programme and in collaboration
    with the British Antarctic Survey.
  url: https://undp.org/node/384636
  fetched: 2026-11-15
  quote: Project Manager for NGO FC Frigator from Haa Alif Hoarafushi Island, for
    a seabird research project funded under the Global Environment Facility Small
    Grants Programme
- claim: UNDP says that in this research seabirds were tracked with satellite transmitters
    for the first time in the Maldives.
  url: https://undp.org/node/384636
  fetched: 2026-11-15
  quote: Seabirds were tracked via satellite transmitters for the first time in Maldives
    to trace the little-known path of the migration of lesser noddies after they depart
    the country.
