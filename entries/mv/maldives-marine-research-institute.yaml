summary: Institute with the official mandate to monitor the Maldives' coral reefs, which uses the machine
  learning tool ReefCloud and, AIMS reports, has increased its data collection rate and scale.
facts:
- claim: ICRI's Maldives page says MMRI carries the official mandate to monitor the status of coral reefs
    in the country.
  url: https://icriforum.org/members/maldives/
  fetched: 2026-11-12
  quote: The Maldives Marine Research Institute (MMRI) carries the official mandate of monitoring the
    status of coral reefs in the country.
- claim: AIMS reports that MMRI increased the rate and scale of its data collection and reduced data processing
    time with ReefCloud.
  url: https://aims.gov.au/about/aims-impact/democratising-reef-monitoring-data-cloud
  fetched: 2026-11-12
  quote: In the Maldives, MMRI increased the rate and scale of data collection and reduced data processing
    time.
- claim: AIMS describes ReefCloud, which MMRI uses, as a tool using machine learning to extract data from
    images of coral reefs.
  url: https://aims.gov.au/about/aims-impact/democratising-reef-monitoring-data-cloud
  fetched: 2026-11-12
  quote: ReefCloud is a digital tool that uses machine learning and advanced analysis to rapidly extract
    and share data from images of coral reefs
- claim: AIMS reports that MMRI used resort-based marine biologists to collect and enter field data into
    ReefCloud during COVID-19 lockdowns.
  url: https://aims.gov.au/about/aims-impact/democratising-reef-monitoring-data-cloud
  fetched: 2026-11-12
  quote: the Maldives Marine Research Institute (MMRI) and Wildlife Conservation Society Fiji (WCS) overcame
    COVID-19 lockdowns using resort-based marine biologists to collect and enter field data into ReefCloud
