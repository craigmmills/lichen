  quote: L'Office français de la biodiversité (OFB) est un établissement public créé en 2020
    pour relever le défi de la protection et de la restauration de la biodiversité dans l'hexagone
    et les Outre-mer.
  fetched: '2026-10-31'
- claim: It works under the joint oversight of the ministries for the environment and agriculture.
