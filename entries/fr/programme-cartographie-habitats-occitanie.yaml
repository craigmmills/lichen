summary: Three-year programme in the Occitanie region that combines satellite data, field
  ecology and a frugal AI approach to make a dynamic map of natural habitats over nearly 72,000
  square kilometres.
facts:
- claim: The programme combines satellite Earth observation, field expertise and frugal AI
    to map natural habitats.
  url: https://www.cls.fr/en/france-launches-biodiversity-mapping-program-using-ai-and-satellites/
  fetched: '2026-10-31'
  quote: Over the next three years, the Region will combine satellite Earth Observation, ecological
    field expertise and a frugal artificial intelligence approach to create a unique dynamic
    map of its natural habitats
- claim: AI models analyse the data to identify and classify hundreds of habitat types.
  url: https://www.cls.fr/en/france-launches-biodiversity-mapping-program-using-ai-and-satellites/
  fetched: '2026-10-31'
  quote: Artificial intelligence models will then analyse these data to identify and classify
    hundreds of different habitat types across the region.
