summary: A French consortium in the Challenge IA-Biodiv that uses machine learning to fill
  gaps in coastal marine biodiversity data and build indicators, drawing on plankton images.
facts:
- claim: Carried by a French consortium including the Laboratoire d'océanographie de Villefranche.
  url: https://anr.fr/fr/actus/details/news/lintelligence-artificielle-au-service-de-la-biodiversite-marine-demarrage-dun-challenge-scientif/
  quote: Le projet SMART-BIODIV ( Technologies d'intelligence artificielle pour la recherche
    en biodiversité ) est porté par un consortium français
  fetched: '2026-10-31'
- claim: Uses plankton images from quantitative imaging systems.
  url: https://anr.fr/fr/actus/details/news/challenge-ia-biodiv-quand-lintelligence-artificielle-se-met-au-service-de-la-biodiversite-marine/
  quote: Les données utilisées proviennent notamment d'images individuelles de plancton
  fetched: '2026-10-31'
- claim: Selected and funded by the ANR in the IA-Biodiv challenge on AI technologies for
    biodiversity research.
  url: https://anr.fr/fileadmin/aap/2021/selection/AAP-ChallengeIABiodiv-selection-2021.pdf
  fetched: '2026-10-31'
  quote: Smart-Biodiv Technologies d'Intelligence Artificielle pour la recherche en biodiversité
- claim: The proposal rests on machine learning to complete sparse and unbalanced data, and
    on designing indicators.
  url: https://anr.fr/Projet-ANR-21-AAFI-0002
  fetched: '2026-10-31'
  quote: exploiter la puissance des algorithmes d'apprentissage automatique pour compléter
    et traiter les données éparses et déséquilibrées
- claim: The consortium brings together expertise in deep learning, computer vision, oceanography
    and plankton imaging.
  url: https://anr.fr/Projet-ANR-21-AAFI-0002
  fetched: '2026-10-31'
  quote: notre consortium rassemble des expertises complémentaires en apprentissage profond,
    vision par ordinateur, océanographie, imagerie du plancton et bioindication en eau douce
  ai_type: deep-learning
