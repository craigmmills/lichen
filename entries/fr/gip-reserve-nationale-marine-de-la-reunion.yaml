summary: Public interest group managing La Réunion's marine reserve, which coordinates reef
  monitoring run since 1998 across 14 sentinel stations and has monitored the reserve effect
  since 2007.
facts:
- claim: Management of the marine protected area has been entrusted to the GIP-RNMR.
  url: https://www.reservemarinereunion.fr/non-classe/1179/les-suivis-ecologiques-du-milieu/
  fetched: '2026-11-07'
  quote: La gestion de l'aire marine protégée a été confiée au Groupement d'Intérêt Public
    - Réserve Nationale Marine de La Réunion (GIP-RNMR) par...
- claim: Coordinates the GCRMN-type reef monitoring, run since 1998, with scientific partners
    including the university and the IRD.
  url: https://www.reservemarinereunion.fr/non-classe/1179/les-suivis-ecologiques-du-milieu/
  fetched: '2026-11-07'
  quote: Depuis sa création, c’est le GIP-RNMR (et avant cela l’association du Parc marin)
    qui coordonne ce suivi en collaboration avec les partenaires scientifiques tels que l’Université
    et l’IRD.
- claim: The monitoring covers 14 sentinel stations on the four reef complexes of La Réunion.
  url: https://www.reservemarinereunion.fr/non-classe/1179/les-suivis-ecologiques-du-milieu/
  fetched: '2026-11-07'
  quote: Il comporte actuellement 14 stations dites « sentinelles » (7 de platier et 7 de
    pente externe)
- claim: Monitors the reserve effect with a BACIPS design since the reserve was created in
    2007.
  url: https://www.reservemarinereunion.fr/non-classe/1179/les-suivis-ecologiques-du-milieu/
  fetched: '2026-11-07'
  quote: Le suivi de l’effet réserve, dont l’objectif est de mesurer l’efficacité des mesures
    de gestion de la Réserve Naturelle Marine de la Réunion, existe depuis sa création en
    2007.
