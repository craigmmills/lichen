summary: A project run by CEN Guyane to develop tools and methods for assessing forest
  and aquatic ecosystems in French Guiana's protected areas, considering camera traps,
  acoustic recorders, eDNA, lidar and remote sensing.
facts:
- claim: Develops tools and methods to assess the state of forest and aquatic ecosystems
    in French Guiana's protected areas.
  url: https://www.cen-guyane.org/nos-missions-menu/connaissance-et-suivi-de-la-biodiversite/projet-rio/
  fetched: '2026-11-07'
  quote: qui vise à développer des outils et des méthodes permettant d’évaluer l’état
    des écosystèmes forestiers et aquatiques des espaces protégés de Guyane
- claim: Aims to test methods and equipment in the field, run the analyses and train
    the network's staff.
  url: https://www.cen-guyane.org/nos-missions-menu/connaissance-et-suivi-de-la-biodiversite/projet-rio/
  fetched: '2026-11-07'
  quote: L’objectif est d’aboutir à des protocoles clairs et directement opérationnels,
    de tester le matériel, réaliser les analyses et former les agents du réseau.
- claim: The tools it considers include camera traps, acoustic recorders, environmental
    DNA, lidar and remote sensing.
  url: https://www.cen-guyane.org/nos-missions-menu/connaissance-et-suivi-de-la-biodiversite/projet-rio/
  fetched: '2026-11-07'
  quote: L’analyse de traces d’ADN présentes dans l’eau et le sol permet de détecter
    la présence d’espèces, même difficiles à observer.
