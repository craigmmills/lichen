facts:
- claim: Is a company founded in 2008 that develops landscape restoration projects.
  url: https://pur.co/what-we-do/
  fetched: 2026-11-22
  quote: Founded in 2008, PUR develops projects within our clients’ value chains to
    regenerate landscapes and protect vital ecosystems.
- claim: Says it has implemented nature-based solutions across 400,000 hectares in
    30 countries.
  url: https://pur.co/what-we-do/
  fetched: 2026-11-22
  quote: PUR has implemented nature-based solutions across 400,000 hectares in 30
    countries.
- claim: Supports the Biocorredor Martin Sagrado project, which protects about 300,000
    hectares of rainforest in San Martin, Peru.
  url: https://pur.co/project/sustainable-landscapes-bms/
  fetched: 2026-11-22
  quote: PUR has been supporting the Biocorredor Martin Sagrado project since 2010
    for more than a decade with three partner organizations, protecting and conserving
    approximately 300,000 hectares of primary Amazonian rainforest
- claim: The Jubilación Segura project in Peru has worked to restore degraded pastures
    by planting 230,000 trees across 19 native species.
  url: https://pur.co/project/sustainable-landscapes-js/
  fetched: 2026-11-22
  quote: The project has worked to restore degraded pastures by planting 230,000 trees
    with 19 different native species.
- claim: Implements forest and coastal conservation projects.
  url: https://pur.co/what-we-do/
  fetched: 2026-11-22
  quote: We also implement forest and coastal conservation projects.
- claim: Uses data collection and software tools in its projects.
  url: https://pur.co/what-we-do/
  fetched: 2026-11-22
  quote: PUR leverages data collection and advanced software tools to facilitate the
    design and implementation of our global projects
