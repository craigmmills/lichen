summary: Active project that builds on NEWTRAP, an earlier FNR-funded underwater camera trap
  with AI image analysis, and aims to turn it into a freshwater wildlife monitoring tool.
facts:
- claim: Builds on NEWTRAP, an underwater camera trap from an earlier FNR proof-of-concept
    project, for which AI methods were introduced to automate image analysis.
  url: https://researchportal.list.lu/projects/detail/camphibian
  fetched: 2026-11-08
  quote: Artificial intelligence (AI) methods were also introduced to automate image analysis
    and interpretation.
- claim: Aims to turn NEWTRAP into a tool for freshwater wildlife monitoring, called NEWCAM
    in the development section and NEWTCAM elsewhere on the page.
  url: https://researchportal.list.lu/projects/detail/camphibian
  fetched: 2026-11-08
  quote: This project builds on the NEWTRAP foundation and further develop it into a versatile,
    user-friendly tool for freshwater wildlife monitoring
