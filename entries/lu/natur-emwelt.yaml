summary: Luxembourg conservation organisation with more than 9,000 members across member associations,
  which runs the Centrale Ornithologique and names bird census and protection as a main field of work.
facts:
- claim: The second European Breeding Bird Atlas lists two people affiliated with natur&ëmwelt as Luxembourg’s
    main data providers.
