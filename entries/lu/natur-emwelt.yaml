  quote: Main data providers Katharina Klein¹, Cindy Redel¹ ¹ natur&ëmwelt a.s.b.l.
- claim: The same atlas page lists the field ornithological working group of natur&ëmwelt as Luxembourg's
    fieldworkers.
  url: https://ebba2.info/about/organization/data-provider-lu/
