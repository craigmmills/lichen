summary: National agency set up by the Ministry of the Economy in 2018 that represents Luxembourg in European
  and UN space programmes and lists a data centre giving free Copernicus Earth observation access.
facts:
- claim: Implements the national space strategy and represents Luxembourg within European and UN space
    programmes.
  url: https://space-agency.public.lu/en/agency/mission.html
  fetched: 2026-11-08
  quote: It drives landmark initiatives such as SpaceResources.lu, implements national space strategy,
    manages international partnerships, represents Luxembourg within European and UN space programmes
- claim: Represents Luxembourg within the European Space Agency and the space programmes of the European
    Union.
  url: https://space-agency.public.lu/en/agency/mission.html
  fetched: 2026-11-08
  quote: Represents Luxembourg within the European Space Agency and space-related programmes of the European
    Union;
- claim: Established by the Ministry of the Economy in 2018 to develop the national space sector.
  url: https://space-agency.public.lu/en/agency.html
  fetched: 2026-11-08
  quote: Established by the Ministry of Economy in 2018 with the goal of developing the national space
    sector
- claim: Represents Luxembourg within the European Space Agency and the space programmes of the EU and
    UN.
  url: https://space-agency.public.lu/en/agency.html
  fetched: 2026-11-08
  quote: The LSA also represents Luxembourg within the European Space Agency, as well as the space related
    programs of the European Union and the United Nations.
- claim: The LSA Data Center, listed among its milestones, is a national platform giving companies and
    researchers free access to Copernicus Earth observation data.
  url: https://space-agency.public.lu/en/agency.html
  fetched: 2026-11-08
  quote: This national platform provides companies and researchers with free and easy access to vast amounts
    of Earth observation data from the Copernicus programme.
