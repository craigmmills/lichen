summary: Luxembourg's environment ministry, responsible for protecting nature and water, which
  reported in October 2026 it was finalising a first national biodiversity finance plan and
  funds a pollinator monitoring scheme.
facts:
- claim: Its minister, Serge Wilmes, took part in the 17th Conference of the Parties to the
    Convention on Biological Diversity on 26 and 27 October 2026.
  url: https://gouvernement.lu/fr/actualites/toutes_actualites/communiques/2026/10-octobre/26-27-wilmes-cop17.html
  fetched: 2026-11-08
  quote: Le ministre de l'Environnement, du Climat et de la Biodiversité, Serge Wilmes, a
    participé les 26 et 27 octobre 2026 à la 17ᵉ Conférence des parties à la Convention des
    Nations unies sur la diversité biologique (COP17)
- claim: Reported in October 2026 that Luxembourg was finalising its first national biodiversity
    finance plan, including an inventory of subsidies harmful to biodiversity, under target
    18 of the Global Biodiversity Framework.
  url: https://gouvernement.lu/fr/actualites/toutes_actualites/communiques/2026/10-octobre/26-27-wilmes-cop17.html
  fetched: 2026-11-08
  quote: le Luxembourg finalise actuellement son premier Plan national de financement de la
    biodiversité, qui comprend notamment un inventaire des subventions nuisibles à la biodiversité,
    conformément à l'objectif 18 du Cadre mondial
- claim: Said in October 2026 that lessons from the first global review of the Kunming-Montreal
    framework would feed into the mid-term revision of the third national nature protection
    plan (PNPN3).
  url: https://gouvernement.lu/fr/actualites/toutes_actualites/communiques/2026/10-octobre/26-27-wilmes-cop17.html
  fetched: 2026-11-08
  quote: Les enseignements tirés de cet exercice contribueront directement à la révision à
    mi-parcours du troisième Plan national concernant la protection de la nature (PNPN3),
    actuellement en cours.
- claim: Presented the results of the third National Forest Inventory (IFN 3) in November
    2025, with the Administration de la nature et des forêts.
  url: https://gouvernement.lu/fr/actualites/toutes_actualites/communiques/2025/11-novembre/27-wilmes-inventaire-forestier.html
  fetched: 2026-11-08
  quote: Serge Wilmes, en collaboration avec l'Administration de la nature et des forêts,
    a présenté aujourd'hui les résultats du troisième cycle de l'Inventaire forestier national
    (IFN 3)
- claim: Its main tasks include taking measures to protect the natural and human environment.
  url: https://mecb.gouvernement.lu/en/service.html
  fetched: 2026-11-08
  quote: take all appropriate measures to protect the natural and human environment and in
    the fight against climate change
- claim: Three administrations operate under its legal authority, among them the Nature and
    Forest Agency (ANF).
  url: https://mecb.gouvernement.lu/en/service.html
  fetched: 2026-11-08
  quote: the ministry is backed by three administrations operating under its legal authority
- claim: Its mandate includes protection of the natural environment, covering nature and water.
  url: https://mecb.gouvernement.lu/en/service.html
  fetched: 2026-11-08
  quote: Protection of the natural environment (in French)
- claim: Its minister, Serge Wilmes, took part in the 17th Conference of the Parties to the
    Convention on Biological Diversity (COP17) in Yerevan in October 2026.
  url: https://environnement.public.lu/fr.html
  fetched: 2026-11-08
  quote: Serge Wilmes à la COP17 sur la biodiversité à Erevan, en Arménie
