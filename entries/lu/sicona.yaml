summary: A nature conservation syndicate of two municipal associations, SICONA Centre
  and SICONA Sud-Ouest, whose scientific department surveys flora and fauna and which
  supports state conservation under an agreement with the environment ministry.
facts:
- claim: Made up of two municipal special-purpose associations, SICONA Centre in Mersch
    and SICONA Sud-Ouest in Bertrange.
  url: https://sicona.lu/ueber_uns/
  fetched: 2026-11-12
  quote: 'Das Naturschutzsyndikat SICONA setzt sich aus zwei kommunalen Zweckverbänden
    zusammen: SICONA Centre mit Sitz in Mersch und SICONA Sud-Ouest mit Sitz in Bartringen.'
- claim: Its scientific department surveys flora and fauna and monitors populations
    of target species to check conservation measures.
  url: https://sicona.lu/ueber_uns/abteilungen/
  fetched: 2026-11-12
  quote: Außerdem kümmert sie sich um das Monitoring der Schutzmaßnahmen, indem sie
    die Bestände von Zielarten überwacht.
- claim: Supports state nature conservation through an agreement with the environment
    ministry on the national nature protection plan and biodiversity programmes.
  url: https://sicona.lu/ueber_uns/
  fetched: 2026-11-12
  quote: Außerdem unterstützt SICONA den staatlichen Naturschutz ebenfalls über eine
    Konvention mit dem Umweltministerium.
- claim: Gives an address in Olm.
