summary: National scheme run by the Luxembourg Institute of Science and Technology that integrates wild
  pollinator and butterfly monitoring, using transects and pan traps with trained citizen scientists and
  partner organisations.
facts:
- claim: Integrates two programmes, the Wild Pollinator Monitoring Programme Luxembourg (MONIPOL) and
    the Luxembourg Butterfly Monitoring Scheme (LUBMS).
  url: https://researchportal.list.lu/projects/detail/lupoms
  fetched: 2026-11-08
  quote: 'integrates two complementary programmes: the Wild Pollinator Monitoring Programme Luxembourg
    ( MONIPOL ) and the Luxembourg Butterfly Monitoring Scheme ( LUBMS )'
- claim: Uses standardised field methods including transect walks and pan trapping, on a stratified random
    sample of sites.
  url: https://researchportal.list.lu/projects/detail/lupoms
  fetched: 2026-11-08
  quote: They rely on standardized and quantitative field methods , including transect walks and pan trapping,
    ensuring consistency and comparability over time.
- claim: Fieldwork is done by LIST researchers with trained citizen scientists and partner organisations.
  url: https://researchportal.list.lu/projects/detail/lupoms
  fetched: 2026-11-08
  quote: Fieldwork is conducted by LIST researchers in collaboration with trained citizen scientists and
    partner organizations .
- claim: Is aligned with the European Pollinator Monitoring Scheme and the European Butterfly Monitoring
    Scheme.
  url: https://researchportal.list.lu/projects/detail/lupoms
  fetched: 2026-11-08
  quote: The programme is aligned with European initiatives such as the European Pollinator Monitoring
    Scheme ( EUPoMS ) and the European Butterfly Monitoring Scheme ( eBMS )
- claim: LIST describes LUPoMS as Luxembourg's pollinator monitoring scheme that informs biodiversity
    conservation.
  url: https://www.list.lu/expertise/natural-environment/environmental-systems-and-climate-change
  fetched: 2026-11-08
  quote: LUPoMS , Luxembourg’s pollinator monitoring scheme that informs biodiversity conservation
