summary: Programme run by natur&ëmwelt that collects and analyses all data on Luxembourg's bird fauna,
  including ringing at three stations and, since 2011, observations entered on ornitho.lu.
facts:
- claim: Linked by an agreement to the environment ministry, it oversees the ringing and field ornithology
    working groups.
  url: https://www.naturemweltasbl.lu/centrale-ornithologique/
  fetched: 2026-11-08
  quote: La Centrale Ornithologique, liée par une convention au Ministère de l’Environnement, du Climat
    et du Développement durable, encadre les deux groupes de travail « Baguage » (Beringung) et « Ornithologie
    de terrain » (Feldornithologie).
- claim: All data on Luxembourg's bird fauna are collected and analysed by the Centrale Ornithologique.
  url: https://www.naturemweltasbl.lu/centrale-ornithologique/
  fetched: 2026-11-08
  quote: Toutes les données relatives à la faune aviaire du Luxembourg sont recueillies et analysées par
    la Centrale Ornithologique.
- claim: Bird ringing takes place at three main stations, Übersyren, Schifflingen and Remerschen.
  url: https://www.naturemweltasbl.lu/centrale-ornithologique/
  fetched: 2026-11-08
  quote: En plus des trois principales stations de baguage à Übersyren, Schifflingen et Remerschen
- claim: Rare species such as black stork, white stork, eagle owl and peregrine falcon are checked every
    year.
  url: https://www.naturemweltasbl.lu/centrale-ornithologique/
  fetched: 2026-11-08
  quote: Ainsi, des espèces comme la cigogne noire, la cigogne blanche, le pie-grièche, le hibou grand-duc
    et le faucon pèlerin sont contrôlées chaque année
- claim: Since 2011 all bird observations in Luxembourg can be entered on the ornitho.lu platform.
  url: https://www.naturemweltasbl.lu/centrale-ornithologique/
  fetched: 2026-11-08
  quote: Depuis 2011, toutes les observations d’oiseaux au Luxembourg peuvent être saisies sur la plateforme
    Internet www.ornitho.lu .
