summary: Public research centre formed by merger in 2015, whose biodiversity group coordinates national
  monitoring using cameras and acoustic recorders, and which says it develops AI-powered insect monitoring
  tools.
facts:
- claim: Its environmental work includes FORLUX on forest health and resilience, WATERWEAVE on aquatic
    ecosystems, and LUPoMS, the national pollinator monitoring scheme.
  url: https://www.list.lu/expertise/natural-environment/environmental-systems-and-climate-change
  fetched: 2026-11-08
  quote: Key initiatives include FORLUX , which strengthens forest health and resilience; WATERWEAVE ,
    which integrates ecological and social knowledge to support sustainable aquatic ecosystems; and LUPoMS
    , Luxembourg's pollinator monitoring scheme that informs biodiversity conservation.
- claim: Its doctoral project FORFUS-RT3.4 aims to develop forest trait mapping from satellite data using
    the Invertible Forest Reflectance Model with shallow and deep learning methods.
  url: https://researchportal.list.lu/projects/detail/forfus-rt34
  fetched: 2026-11-08
  quote: The doctoral candidate will develop and apply an existing fast and efficient forest trait mapping
    method based on the existing Invertible Forest Reflectance Model and hybrid methods with shallow and
    deep learning algorithms.
  ai_type: deep-learning
- claim: Its Biodiversity Monitoring and Assessment group describes itself as a national coordinator of
    biodiversity monitoring in Luxembourg, monitoring groups such as wild pollinators, forest mammals,
    freshwater invertebrates and diatoms.
  url: https://researchportal.list.lu/organisation/detail/sd-envision-biodiv
  fetched: 2026-11-08
  quote: Assessing ecosystem health through the monitoring of key taxonomic groups (e.g. wild pollinators
    , forest mammals , freshwater invertebrates, diatoms)
- claim: Has its address at the Maison de l'innovation in Esch-sur-Alzette.
  url: https://researchportal.list.lu/projects/detail/lupoms
  fetched: 2026-11-08
  quote: Maison de l'innovation 5, avenue des hauts-fourneaux L-4362 Esch-sur-Alzette
- claim: Describes itself as the interdisciplinary public research centre for natural and engineering
    sciences in Luxembourg and the Greater Region.
  url: https://www.list.lu
  fetched: 2026-11-08
  quote: LIST is the interdisciplinary public research centre for natural and engineering sciences in
    Luxembourg and the Greater Region.
- claim: Says it develops non-invasive AI-powered monitoring tools to track insects, with a focus on pollinators.
  url: https://www.list.lu/expertise/natural-environment/environmental-systems-and-climate-change
  fetched: 2026-11-08
  quote: Focusing on vulnerable species like pollinators, we develop non-invasive AI-powered monitoring
    tools to track insects, generate high-resolution data, and ensure resilient, sustainable ecosystems.
- claim: Says it develops monitoring technology using sensors, the Internet of Things and Earth observation,
    and builds AI-driven environmental models.
  url: https://www.list.lu/expertise/natural-environment/environmental-systems-and-climate-change
  fetched: 2026-11-08
  quote: We develop cutting-edge technologies for monitoring natural resources using sensors, Internet
    of Things (IoT), and Earth Observation, and create AI-driven environmental models that deliver actionable
    insights.
- claim: Says it uses digital twin models to track and manage natural resources.
  url: https://www.list.lu/expertise/natural-environment/environmental-systems-and-climate-change
  fetched: 2026-11-08
  quote: Using Digital Twin models, we dynamically track and manage natural resources
  ai_type: digital-twins
- claim: Its GBIF publisher record says the Biodiversity Monitoring and Assessment (BIODIV) group coordinates
    large-scale monitoring programmes, including of wild pollinators, forest mammals, freshwater invertebrates
    and diatoms.
  url: https://api.gbif.org/v1/node/b0ccbf42-26b3-412e-b38a-339889154d77/organization?limit=100
  fetched: 2026-11-08
  quote: the BIODIV group coordinates large-scale monitoring programmes
- claim: The same record lists monitoring of key taxonomic groups among the group's work.
  url: https://api.gbif.org/v1/node/b0ccbf42-26b3-412e-b38a-339889154d77/organization?limit=100
  fetched: 2026-11-08
  quote: Assessing ecosystem health through the monitoring of key taxonomic groups (e.g. wild pollinators,
    forest mammals, freshwater invertebrates, diatoms)
- claim: Publishes on GBIF national forest monitoring records for wildcat, pine marten and polecat for
    2020–2022 and 2023–2025. The scheme uses hair traps and camera traps in 72 one-kilometre squares with
    more than 10% forest cover, surveying one-third of the squares each year in rotation.
  url: https://api.gbif.org/v1/organization/d56a3183-3603-4313-925a-a13ddc2eefec/publishedDataset?limit=100
  fetched: 2026-11-08
  quote: Selection of 72 1km-squares with &gt;10% of forest coverage using a stratified random sampling.
- claim: The monitoring places three camera traps on game routes in each sampled square.
  url: https://api.gbif.org/v1/organization/d56a3183-3603-4313-925a-a13ddc2eefec/publishedDataset?limit=100
  fetched: 2026-11-08
  quote: 3 camera traps on game routes, 1 camera trap on Polecat habitats
- claim: Its Biodiversity Monitoring and Assessment (BIODIV) group lists the application of artificial
    intelligence to image and sound analysis among its expertise.
  url: https://researchportal.list.lu/organisation/detail/sd-envision-biodiv
  fetched: 2026-11-08
  quote: Application of artificial intelligence for image and sound analysis (computer vision, bioacoustics)
- claim: The BIODIV group describes itself as a national coordinator of biodiversity monitoring in Luxembourg.
  url: https://researchportal.list.lu/organisation/detail/sd-envision-biodiv
  fetched: 2026-11-08
  quote: As a national coordinator of biodiversity monitoring in Luxembourg, the BIODIV group plays a
    central role in
- claim: The group uses camera traps, acoustic recorders and environmental DNA and metabarcoding in its
    monitoring.
  url: https://researchportal.list.lu/organisation/detail/sd-envision-biodiv
  fetched: 2026-11-08
  quote: molecular tools (e.g. environmental DNA and metabarcoding) enable efficient assessment of biodiversity
    in aquatic and soil ecosystems
- claim: Its DiMON project uses multi-angle imaging of invertebrates, which the page says improves species
    identification, particularly when combined with deep learning models.
  url: https://researchportal.list.lu/projects/detail/dimon
  fetched: 2026-11-08
  quote: particularly when combined with state-of-the-art deep learning models
  ai_type: deep-learning
- claim: Formed by the merger of the public research centres Henri Tudor and Gabriel Lippmann on 1 January
    2015.
  url: https://www.list.lu/media-events/news/news-detail/an-alumni-network-coming-soon
