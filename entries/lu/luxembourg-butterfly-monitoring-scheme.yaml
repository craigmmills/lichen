summary: A butterfly monitoring scheme begun in 2010 with repeated standardised counts
  across the country, run by LIST and funded by the environment ministry, whose long-term
  abundance data fed a Nature Ecology & Evolution study projecting trends to 2050.
facts:
- claim: Butterfly population monitoring in Luxembourg began in 2010, with standardised
    counts at sites across the country visited repeatedly with the same method.
  url: https://www.list.lu/media-events/news/news-detail/from-butterflies-in-luxembourg-to-global-assessments-of-biodiversity-change
  fetched: 2026-11-12
  quote: The monitoring of butterfly populations in Luxembourg began in 2010 and uses
    standardized counts at sites distributed across the country, visited repeatedly
    using the same methodology.
- claim: LIST contributed long-term butterfly abundance data from the scheme to a
    study in Nature Ecology & Evolution projecting biodiversity trends to 2050.
  url: https://www.list.lu/media-events/news/news-detail/from-butterflies-in-luxembourg-to-global-assessments-of-biodiversity-change
  fetched: 2026-11-12
  quote: For this work, LIST contributed long-term butterfly abundance data collected
    through the Luxembourg Butterfly Monitoring Scheme .
