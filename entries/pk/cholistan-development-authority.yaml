facts:
- claim: Under the Cholistan Development Authority Act 1976 it is responsible for
    the preservation of forests, conservation of vegetation and wildlife in Cholistan.
  url: https://urbanunit.gov.pk/Download/publications/Files/8/2025/LSNP%20(fv)-%20Park%20Management%20Plan.pdf
  fetched: '2026-11-17'
  quote: vegetation and wildlife and exploration of mineral resources in Cholistan
    is the responsibility of Cholistan Development Authority.
- claim: The Lal Suhanra National Park management plan calls for integrating the park
    plan with the Authority's regional master plan, which was still in development
    at the time.
  url: https://urbanunit.gov.pk/Download/publications/Files/8/2025/LSNP%20(fv)-%20Park%20Management%20Plan.pdf
  fetched: '2026-11-17'
  quote: 'Since Integrated Master Plan of Cholistan Development Authority is in the
    making, it is important to

    develop and integrate a management plan for Lal Suhanra National Park with this
    regional plan.'
