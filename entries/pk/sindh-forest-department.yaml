summary: Sindh Climate reported 1.125 million hectares (8% of Sindh) under departmental
  control in 2022, and the 2015 60-year Indus Delta Capital partnership aimed to restore
  225,000 hectares of mangroves.
facts:
- claim: In 2022, Sindh Climate reported that the department controlled 1.125 million
    hectares, or 8% of Sindh, including riverine forests, irrigated plantations, mangrove
    forests and rangelands.
  url: https://sindhclimate.com/2022/09/25/sindh-forest-department/
  fetched: '2026-11-17'
  quote: an area of 1.125 million ha. (2.782 million acres) is under the control of
    Sindh Forest Department, which is 8% of the total area of the province.
- claim: In 2022, Sindh Climate reported that the department controlled 241,198 hectares
    of riverine forests along the Indus that had been declared reserved forests.
  url: https://sindhclimate.com/2022/09/25/sindh-forest-department/
  fetched: '2026-11-17'
  quote: Sindh Forest Department controls an area of 241,198 hectares in the Riverine
    tract of the province which are categorized as “Riverine Forests”
- claim: A 2024 report says the department established a mangrove conservation wing
    in 1990 and was working to increase Sindh's mangrove cover to 350,000 hectares.
  url: https://news.mongabay.com/2024/02/pakistan-bucks-global-trend-with-30-year-mangrove-expansion/
  fetched: '2026-11-17'
  quote: Under the recovery program, mangroves have since expanded to 240,000 hectares
    (593,000 acres), and the goal is to get them up to 350,000 hectares (865,000 acres)
    in the future.
- claim: Entered a 60-year public-private partnership in 2015 with Indus Delta Capital
    to restore and protect 225,000 hectares of mangroves.
  url: https://news.mongabay.com/2024/02/pakistan-bucks-global-trend-with-30-year-mangrove-expansion/
  fetched: '2026-11-17'
  quote: in 2015 the Sindh Forest Department entered a 60-year public-private partnership
    with U.K-based blue-carbon developer Indus Delta Capital that aims to restore
    and protect 225,000 hectares (556,000 acres) of mangroves
- claim: A 2024 report describes community members the department hired during restoration
    initiatives preparing to patrol natural and restored mangrove forest in Ibrahim
    Hyderi.
  url: https://news.mongabay.com/2024/02/pakistan-bucks-global-trend-with-30-year-mangrove-expansion/
  fetched: '2026-11-17'
  quote: The guards are community members hired by the Sindh Forest Department during
    restoration initiatives.
