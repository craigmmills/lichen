summary: Project built by WWF-Pakistan with WWF-Italy, launched in 2018 in Khunjerab
  National Park, which WWF-Pakistan says brought SMART into two provincial wildlife
  departments' management systems.
facts:
- claim: Launched in 2018 by WWF-Pakistan with WWF-Italy, first in Khunjerab National
    Park and later in Chitral Gol and Central Karakoram national parks.
  url: https://wwf.org.pk/eoffice/consultancy/consultupload/617-90443-164-617-90727-164-TORs%20for%20SMART%20Project%20Revised.pdf
  fetched: 2026-11-09
  quote: WWF-Pakistan in collaboration with WWF-Italy, launched the SMART project
    in 2018
- claim: WWF-Pakistan says the project brought SMART into the management systems of
    the Gilgit-Baltistan and Khyber Pakhtunkhwa wildlife departments.
  url: https://wwf.org.pk/eoffice/consultancy/consultupload/617-90443-164-617-90727-164-TORs%20for%20SMART%20Project%20Revised.pdf
  fetched: 2026-11-09
  quote: enabled the integration of SMART into the management systems of the Wildlife
    Departments of Gilgit-Baltistan and Khyber Pakhtunkhwa
- claim: A 2024 scaling-up component piloted Sheroes, a women-led group in three community
    controlled hunting areas in Gojal using SMART-Collect.
  url: https://wwf.org.pk/eoffice/consultancy/consultupload/617-90443-164-617-90727-164-TORs%20for%20SMART%20Project%20Revised.pdf
  fetched: 2026-11-09
  quote: As part of the 2024 scaling-up component, WWF-Pakistan piloted the concept
    of Sheroes Pakistan’s first women-led wildlife conservation group
