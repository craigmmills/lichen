summary: According to APP, its February 2026 GIS dolphin census recorded 135 dolphins along
  154 km; the ministry names it as a provincial snow leopard programme coordinating agency
  from 2018.
facts:
- claim: Ran a GIS-based census of Indus dolphins in the D.I. Khan section of the Indus, as
    reported by APP.
  url: https://www.app.com.pk/kp/wildlifes-census-using-gis-records-135-dolphins-in-154-km-stretch-of-indus-river-at-d-i-khan/
  fetched: 2026-11-03
  quote: A historic GIS-based scientific census by the Khyber Pakhtunkhwa Wildlife Department
    has recorded a stable population of Indus Dolphins in D.I. Khan section of the mighty
    Indus River
- claim: The six-day survey in February 2026 recorded 135 dolphins along 154 km of river.
  url: https://www.app.com.pk/kp/wildlifes-census-using-gis-records-135-dolphins-in-154-km-stretch-of-indus-river-at-d-i-khan/
  fetched: 2026-11-03
  quote: The six days survey conducted from February 19 to 24, 2026 registered 135 number
    of Indus Dolphins in 154 kilometre stretch of Indus river from Chasma Barrage to Ramak
    Boundry
- claim: Observation points were geo-referenced and recorded with GPS and GIS.
  url: https://www.app.com.pk/kp/wildlifes-census-using-gis-records-135-dolphins-in-154-km-stretch-of-indus-river-at-d-i-khan/
  fetched: 2026-11-03
  quote: All observation points were accurately identified, geo-referenced, and recorded using
    GPS coordinates and GIS technology.
- claim: Was a coordinating agency for the GEF-funded five-year Pakistan Snow Leopard and
    Ecosystem Protection Program starting in September 2018, according to the climate change
    ministry.
  url: https://mocc.gov.pk/Detail/MmQxOTIzZDYtM2FhMi00MzM5LWI2NDQtMDQwMjhmYmQ4YTkz
  fetched: 2026-11-03
  quote: Wildlife departments of Khyber Pakhtunkhwa (KP), Gilgit Baltistan (GB) and AJ&K are
    the coordinating agencies at province/State level.
- claim: The FAO-hosted Mountain Partnership member profile says the department conserves
    and manages wildlife resources, ecosystems and habitats.
  url: https://www.fao.org/mountain-partnership/members/detail/wildlife-department-of-the-government-of-khyber-pakhtunkhwa--pakistan/en
  fetched: '2026-11-03'
  quote: is dedicated to conserving and managing wildlife resources, ecosystems and habitats
- claim: The same profile says its work covers protected area management and wildlife research.
  url: https://www.fao.org/mountain-partnership/members/detail/wildlife-department-of-the-government-of-khyber-pakhtunkhwa--pakistan/en
  fetched: '2026-11-03'
  quote: focusing on protected area management, wildlife research, habitat conservation
- claim: Wikipedia's Snow Leopard Trust article says the 2006 GPS-collar study of a snow leopard
    in Chitral Gol National Park was carried out with the North West Frontier Province Wildlife
    Department and WWF-Pakistan.
  url: https://en.wikipedia.org/wiki/Snow_Leopard_Trust
  fetched: '2026-11-03'
  quote: conducted by the Snow Leopard Trust in conjunction with Pakistan's North West Frontier
    Province Wildlife Department and WWF–Pakistan
