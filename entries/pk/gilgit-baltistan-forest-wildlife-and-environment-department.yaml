summary: An independent department created in 2010 that holds the wildlife and habitat conservation
  mandate in Gilgit-Baltistan, manages protected areas, and lists a REDD+ coordinator and
  a GIS specialist.
facts:
- claim: Created as an independent department in 2010, with Forest, Parks & Wildlife and the
    Environmental Protection Agency as attached departments.
  url: https://fwegb.gov.pk/tenders/expression-of-interest-for-wildlife-census-surveys/
  fetched: 2026-11-03
  quote: The department has two attached departments i.e. Forest, Parks & Wildlife and Environmental
    Protection Agency.
- claim: Issued an expression of interest for wildlife census and surveys.
  url: https://fwegb.gov.pk/tenders/expression-of-interest-for-wildlife-census-surveys/
  fetched: 2026-11-03
  quote: Expression of Interest for Wildlife Census/Surveys
- claim: Its wildlife department was a coordinating agency for the GEF-funded five-year Pakistan
    Snow Leopard and Ecosystem Protection Program starting in September 2018, according to
    the climate change ministry.
  url: https://mocc.gov.pk/Detail/MmQxOTIzZDYtM2FhMi00MzM5LWI2NDQtMDQwMjhmYmQ4YTkz
  fetched: 2026-11-03
  quote: Wildlife departments of Khyber Pakhtunkhwa (KP), Gilgit Baltistan (GB) and AJ&K are
    the coordinating agencies at province/State level.
- claim: The department says its Parks and Wildlife circle holds the custodian and management
    mandate for wildlife and habitat conservation in Gilgit-Baltistan.
  url: https://fwegb.gov.pk/parks-and-widlife/
  fetched: '2026-11-03'
  quote: The circle is the line department which maintains custodian and management mandate
    for conservation of wildlife and its habitat
- claim: Its protected areas include national parks, game reserves, wildlife sanctuaries and
    community managed areas.
  url: https://fwegb.gov.pk/parks-and-widlife/
  fetched: '2026-11-03'
  quote: Protected Areas Include; National Parks, Game Reserves, Wildlife sanctuaries, Community
    Managed Areas.
- claim: Created as an independent department in 2010, with Forest, Parks and Wildlife and
    the Environmental Protection Agency as attached departments.
  url: https://fwegb.gov.pk/our-team/
  fetched: '2026-11-03'
  quote: The department has two attached departments i.e. Forest, Parks & Wildlife and Environmental
