id: bunji-dmtd-community-managed-protected-areas-project
kind: project
name: Community-managed protected areas for threatened species in Gilgit-Baltistan
also_known_as:
- Conservation of globally important populations of highly-threatened species through the creation of
  new, community-managed protected areas in the Gilgit-Baltistan region of Pakistan
scope: pk
ai_label: conservation-tech
realms:
- land
countries:
- pk
status: unknown
summary: A WCS Pakistan project, funded by Van Tienhoven Foundation, to monitor mountain ungulates and
  deploy Community Wildlife Rangers; joint surveys in 2018–2019 counted 594 markhor and 68 urial in December
  2018.
facts:
- claim: The project was to monitor mountain ungulate populations and train and deploy Community Wildlife
    Rangers.
  url: https://www.vantienhovenfoundation.com/projects/conservation-of-globally-important-populations-of-highly-threatened-species-through-the-creation-of-new-community-managed-protected-areas-in-the-gilgit-baltistan-region-of-pakistan/
  fetched: '2026-11-03'
  quote: As part of this project, we will monitor mountain ungulate populations, conduct participatory
    wildlife management planning and monitoring
- claim: WCS and the Gilgit-Baltistan wildlife department organised joint winter and spring surveys of
    markhor and urial in Bunji-DMTD in 2018–2019.
  url: https://www.vantienhovenfoundation.com/projects/conservation-of-globally-important-populations-of-highly-threatened-species-through-the-creation-of-new-community-managed-protected-areas-in-the-gilgit-baltistan-region-of-pakistan/
  fetched: '2026-11-03'
  quote: WCS and P&WD-GB organized joint winter and spring surveys in Bunji-DMTD to assess the population
    sizes of markhor and urial
- claim: 594 markhor and 68 urial were counted in December 2018.
  url: https://www.vantienhovenfoundation.com/projects/conservation-of-globally-important-populations-of-highly-threatened-species-through-the-creation-of-new-community-managed-protected-areas-in-the-gilgit-baltistan-region-of-pakistan/
  fetched: '2026-11-03'
  quote: In December 2018, 594 markhor were counted in Bunji, DMT and Doyan conservancies and 68 urial
    in Bunji and Doyan.
