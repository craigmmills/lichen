summary: Active survey inaugurated in Lahore in April 2025 at an estimated Rs530 million, built by IUCN
  Pakistan, using GPS, camera traps, drones and GIS, with a second phase being prepared as of August 2026.
facts:
- claim: Recorded initial counts including 5,128 Punjab urials and 540 Indus River dolphins.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: with the survey recording 5,128 Punjab urials, 1,276 chinkaras, 540 Indus River dolphins
- claim: Used GPS, camera traps, drones and GIS, with data kept in a digital database.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: Modern technologies, including GPS, camera traps, drones and Geographic Information System (GIS),
    were used during the survey. The data collected is being preserved in a digital database.
- claim: Inaugurated in Lahore in April 2025 with an estimated cost of Rs530 million.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: The project was formally inaugurated in Lahore in April 2025, with an official estimated cost
    of Rs530 million.
- claim: A second phase was being prepared, as reported in August 2026.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: preparations for the second phase of the wildlife survey were under way
- claim: A Business Recorder supplement in February 2025 said the census project would use AI-based drone
    technology.
  url: https://www.brecorder.com/news/40350244
  fetched: 2026-11-03
  quote: including the province’s first-ever Wildlife Census project, which will utilize AI-based drone
    technology to monitor and census species of concern
- claim: The same supplement said Pakistan's first AI drone-based wildlife survey, on blackbuck, was initiated.
  url: https://www.brecorder.com/news/40350244
  fetched: 2026-11-03
  quote: Pakistan’s first AI drone-based wildlife survey was initiated, marking the world’s first such
    survey on black buck.
