summary: A 2002 case study says the Torghar Conservation Project team registered the
  NGO in 1994 and its markhor and urial programme, begun around 1995, appointed 62
  local guards.
facts:
- claim: An August 2002 case study says the people behind the Torghar Conservation
    Project formed STEP to sustain their work and registered it as an NGO in 1994.
  url: https://rspn.org/wp-content/uploads/2013/04/Man-Mountain-and-the-Markhor.pdf
  fetched: '2026-11-17'
  quote: registered as an NGO in 1994 under the Balochistan Small Industries Act,
    1860
- claim: Started the Torghar biodiversity conservation and sustainable use programme
    for markhor and urial around 1995.
  url: https://rspn.org/wp-content/uploads/2013/04/Man-Mountain-and-the-Markhor.pdf
  fetched: '2026-11-17'
  quote: Around 1995 STEP initiated the Torghar biodiversity conservation and sustainable
    use programme
- claim: The August 2002 case study reports that the programme had appointed 62 local
    tribesmen as game guards.
  url: https://rspn.org/wp-content/uploads/2013/04/Man-Mountain-and-the-Markhor.pdf
  fetched: '2026-11-17'
  quote: programme now accommodates 62 tribesmen appointed as game guards
- claim: Is cited in the same document as the Society for Torghar Environmental Protection
    of District Killa Saifullah.
  url: https://rspn.org/wp-content/uploads/2013/04/Man-Mountain-and-the-Markhor.pdf
