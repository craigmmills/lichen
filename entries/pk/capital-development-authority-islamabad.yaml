facts:
- claim: Its Environment Directorate (Regional) says it protects, conserves and manages
    Margalla Hills National Park and does soil conservation in the Simly Dam catchment.
  url: https://www.cda.gov.pk/public/environmentalProtectionCell
  fetched: '2026-11-17'
  quote: The Environment Directorate (Regional) plays a crucial role in the protection,
    conservation, and management of the Margallah Hills National Park (MHNP) and carries
    out soil conservation activities in the catchment areas of Simly Dam.
- claim: Its Forests Division works to prevent illegal logging and encroachment, control
    forest fires and afforest blank areas within the park.
  url: https://www.cda.gov.pk/public/environmentalProtectionCell
  fetched: '2026-11-17'
  quote: Initiating reforestation efforts to restore areas within the MHNP that have
    been previously deforested or are lacking in vegetation cover.
- claim: Its Environment Directorate (Regional) lists management of the Simly Dam
    catchment among its duties.
  url: https://www.cda.gov.pk/public/environmentalProtectionCell
  fetched: '2026-11-17'
  quote: Management of Watershed/ Catchment Area of Simly Dam (135.68 Sq. Km. = 38000
    Acres)
- claim: Its sanitation directorate serves various areas within the municipal limits
    of Islamabad.
  url: https://www.cda.gov.pk/public/environmentalProtectionCell
  fetched: '2026-11-17'
  quote: The directorate of sanitation, a part of the Capital Development Authority
    (CDA), extends its sanitation services to various areas within the municipal limits
    of Islamabad
