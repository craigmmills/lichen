summary: A non-profit conservation organisation founded in 2008 that works on carnivores across
  Pakistan, and built a Karakoram and Himalaya bio-monitoring framework; its 2010 to 2019
  study estimated 167 snow leopards, as reported by Dawn.
facts:
- claim: Its study conducted between 2010 and 2019 estimated 167 snow leopards in Pakistan,
    using camera trapping over 40,000 square kilometres, as reported by Dawn.
  url: https://www.dawn.com/news/1950902
  fetched: 2026-11-03
  quote: Conducted between 2010 and 2019, the study used extensive camera trapping over 40,000
    square kilometres, with 1,000 cameras and 1,200 genetic samples.
- claim: Launched a bio-monitoring framework in the Karakoram and Himalaya, as reported by
    Dawn.
  url: https://www.dawn.com/news/1964705
  fetched: 2026-11-03
  quote: The Snow Leopard Foundation (SLF) has launched a next-generation bio-monitoring framework
    in the Karakoram–Himalayan region
- claim: The framework combines double-observer surveys, eDNA, non-invasive genetics and camera
    trapping.
  url: https://www.dawn.com/news/1964705
  fetched: 2026-11-03
  quote: The newly launched bio-monitoring framework integrates advanced techniques including
    double-observer surveys, environmental DNA (eDNA), non-invasive genetics and camera trapping.
- claim: Trained Baltistan University students and Gilgit-Baltistan Wildlife Department field
    staff as part of the framework.
  url: https://www.dawn.com/news/1964705
  fetched: 2026-11-03
  quote: SLF organised a two-day training workshop in Skardu for students from Baltistan University
    and field staff of the Gilgit-Baltistan Wildlife Department.
- claim: Describes itself as a non-profit conservation organisation working on carnivores
    across Pakistan.
  url: https://slf.org.pk/about/
  fetched: '2026-11-03'
  quote: The Snow Leopard Foundation (SLF) is a non-profit conservation organization.
- claim: Founded in 2008 and works in Gilgit-Baltistan, Khyber Pakhtunkhwa and Azad Jammu
    and Kashmir.
  url: https://slf.org.pk/about/
  fetched: '2026-11-03'
  quote: SLF has been working with remote and impoverished mountain communities in Gilgit-Baltistan,
    Khyber Pakhtunkhwa, and Azad Jammu & Kashmir
- claim: Its site says it uses camera traps and genetic tools to track snow leopard populations.
  url: https://slf.org.pk/snow-leopard-conservation-in-pakistan-world-wildlife-day-2026/
  fetched: '2026-11-03'
  quote: Uses camera traps and genetic tools to track populations.
- claim: Organised the Pakistan Wildlife Protection Awards 2026 with the Ministry of Climate
    Change and Environmental Coordination and the British High Commission.
  url: https://slf.org.pk/pakistan-honors-wildlife-rangers-and-community-champions-at-2026-pwpa/
  fetched: '2026-11-03'
  quote: The awards ceremony, organised by the Snow Leopard Foundation (SLF) in collaboration
    with the Ministry of Climate Change and Environmental Coordination (MoCC&EC) and the British
    High Commission Pakistan
- claim: IUCN's member profile says its staff work through programme offices in Gilgit and
    Chitral.
  url: https://iucn.org/our-union/members/iucn-members/snow-leopard-foundation
  fetched: '2026-11-03'
  quote: operating through program offices in Gilgit and Chitral
- claim: A registered non-profit working to conserve snow leopards and other wild carnivores.
  url: https://slf.org.pk/
  fetched: 2026-11-03
  quote: Snow Leopard Foundation (SLF) is a registered non-profit and non-governmental organization
    dedicated to conserving viable populations of snow leopards and other wild carnivores
- claim: Uses camera trapping and statistical methods to build data on small carnivore populations.
  url: https://slf.org.pk/
  fetched: 2026-11-03
  quote: By taking advantage of advanced technology such as camera trapping and advanced statistical
    methods, SLF is developing data on the small carnivore population.
- claim: Its 2024-25 annual report records 65 camera traps installed in the Hindu Kush landscape
    to estimate occupancy and abundance of snow leopard, brown bear, wolf and ungulates.
  url: https://slf.org.pk/wp-content/uploads/2026/02/SLF-Annual-Progress-Report-2024-25.pdf
  fetched: 2026-11-03
  quote: a total of 65 camera traps were installed across key habitats.
- claim: The same report says field teams in Chitral were trained in eDNA collection and were
    sampling air, water and soil.
  url: https://slf.org.pk/wp-content/uploads/2026/02/SLF-Annual-Progress-Report-2024-25.pdf
  fetched: 2026-11-03
  quote: Additionally, field teams  in Chitral  were trained in environmental DNA
