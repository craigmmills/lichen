summary: An independent third-party monitoring effort for the Ten Billion Tree Tsunami Programme, which
  a government coordinator said in November 2024 was led by IUCN, with WWF-Pakistan and FAO also contributing.
facts:
- claim: At the November 2024 donors’ meeting, the Prime Minister’s Coordinator on Climate Change said
    IUCN had led the consortium for independent third-party monitoring of the programme.
