summary: A university whose AI camera trap collaboration with WWF-Pakistan and NCRA-ARL reportedly
  detects predators and alerts authorities within a minute, with five units installed according
  to Dawn.
facts:
- claim: Worked with WWF-Pakistan to install five AI-enabled camera traps where snow leopards
    attacked livestock, as reported by Dawn.
  url: https://dawn.com/news/1867228/ai-powered-cameras-foster-harmonious-human-wildlife-bond
  fetched: 2026-11-03
  quote: In collaboration with the Lahore University of Management Sciences (Lums), WWF-Pakistan
    installed five AI-enabled camera traps
- claim: A researcher from its School of Science and Engineering presented an AI early warning
    system for human-snow leopard conflict in July 2026.
  url: https://coldregions.wlu.ca/news/2026/lunch-and-learn-with-dr-murtaza-taj.html
  fetched: 2026-11-03
  quote: '“Watching the Glacier’s Edge: An AI Early Warning System for Human-Snow Leopard
    Conflict in the Karakoram.”'
- claim: LUMS says the system was developed in collaboration with NCRA-ARL at LUMS and WWF
    Pakistan.
  url: https://lums.edu.pk/academic-report/ar2024/centre-tpi.php
  fetched: 2026-11-03
  quote: In collaboration with the National Centre for Robotics and Automation, Agriculture
    & Robotics Lab (NCRA-ARL) at LUMS, and WWF Pakistan, has developed an AI-based camera
    trap system for wildlife detection.
- claim: Developed, with NCRA-ARL and WWF Pakistan, an AI camera trap system that detects
    predators such as the snow leopard and notifies authorities within a minute.
  url: https://lums.edu.pk/academic-report/ar2024/centre-tpi.php
  fetched: 2026-11-03
  quote: This system functions as an early warning tool, quickly detecting predators like
    the snow leopard and notifying relevant authorities within a minute via SMS and a GIF
    image.
