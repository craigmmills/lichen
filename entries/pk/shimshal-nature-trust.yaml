summary: Community trust set up by educated young people of Shimshal, which started
  the area's community-based hunting programme, and which a 2020 report says contributed
  members to Khunjerab National Park's management group.
facts:
- claim: A July 2020 report says the Trust contributed members to the community-led
    management group set up to run Khunjerab National Park.
  url: https://gulfnews.com/world/asia/pakistan/in-green-jobs-boost-communities-get-bigger-role-running-pakistans-national-parks-1.72646970
  fetched: '2026-11-17'
  quote: a founding member of the local Shimshal Nature Trust, which contributed members
    to a community-led management group set up to run the park.
- claim: Was set up by educated young people of Shimshal with community support to
    make use of the valley's natural resources for the community's benefit.
  url: https://pamirtimes.net/2010/12/30/role-of-volunteer-organization-in-the-development-of-shimshal/
  fetched: '2026-11-17'
  quote: The purpose of this trust was maximum utilization of existing natural resources
    for betterment of the community.
- claim: Started the community-based hunting programme in the Shimshal area.
  url: https://pamirtimes.net/2010/12/30/role-of-volunteer-organization-in-the-development-of-shimshal/
  fetched: '2026-11-17'
  quote: The prime achievement of SNT is to start community based hunting programme
    in the area, which is a major source of income for the community.
- claim: The Gilgit-Baltistan Forest, Wildlife & Environment Department lists Shimshal
    as a 168.3-square-kilometre community managed conservation area in Gojal, Hunza.
  url: https://fwegb.gov.pk/cmcas/
  fetched: '2026-11-17'
  quote: Shimshal, situated in the Gojal Tehsil of Hunza District, is home to Ibex,
    Blue Sheep, and Snow Leopard and is spread across an area of 168.3 Sq Km.
