summary: Survey launched in 2019 by the climate change ministry, led by Mohammad Suleman Khan
  Warraich, to compile Pakistan's first Red Data List of threatened wildlife species, as reported
  by Dawn.
facts:
- claim: Launched in 2019 as a survey for the first Pakistan Red Data List of threatened wildlife
    species, as reported by Dawn.
  url: https://www.dawn.com/news/amp/1512422
  fetched: 2026-11-03
  quote: The Ministry of Climate Change on Tuesday launched a survey for the first ‘Pakistan
    Red Data List’ of threatened wildlife species in the country.
- claim: Survey teams visited parts of the country to record wild animals, plants and threats
    to them.
  url: https://www.dawn.com/news/amp/1512422
  fetched: 2026-11-03
  quote: They are visiting various parts of the country for the data survey of existing wild
    animals, plants and other organisms and threats to their survival
