facts:
- claim: Leads mangrove protection, restoration and sustainable management through
    Delta Blue Carbon in partnership with the Government of Sindh.
  url: https://deltabluecarbon.com/
  fetched: '2026-11-17'
  quote: The protection, restoration and sustainable management of this natural resource
    is being led by Indus Delta Capital in partnership with the Government of Sindh.
- claim: The Delta Blue Carbon homepage describes a public-private partnership across
    350,000 hectares on the south-east coast of Sindh and separately lists a project
    area of 300,000 hectares.
  url: https://deltabluecarbon.com/
  fetched: '2026-11-17'
  quote: A public-private partnership across 350,000 hectares on the south-east coast
    of Sindh in Pakistan.
- claim: Is a private carbon developer in a public-private partnership with the Sindh
    provincial government to restore mangroves.
  url: https://impactalpha.com/pakistans-mangrove-revival-offers-a-blueprint-for-global-restoration-efforts/
  fetched: '2026-11-17'
  quote: The public-private partnership between the provincial government and Indus
    Delta Capital, a private carbon developer
- claim: Entered a partnership with the Government of Sindh in 2015 under which Indus
    Delta Capital was to finance the establishment of the mangrove restoration project.
  url: https://verra.org/case-studies/delta-blue-carbon/
  fetched: '2026-11-17'
  quote: Indus Delta Capital entered into a partnership with the government of Sindh
    in 2015. Under this collaboration, the ARR activities would take place on mangroves
    found in Sindh, and Indus Delta Capital would provide the finance to establish
    the project.
- claim: The project names IUCN for community engagement and Inverto for digital monitoring,
    reporting and verification.
  url: https://deltabluecarbon.com/
