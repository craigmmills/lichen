summary: Programme reported by Gulf News as launched in 2021 as Pakistan's first national forest monitoring
  system, using satellite land monitoring and a web portal that includes a REDD+ registry.
facts:
- claim: Launched in 2021 as Pakistan's first national forest monitoring system, as reported by Gulf News.
  url: https://gulfnews.com/world/asia/pakistan/pakistan-launches-first-forest-monitoring-system-to-tackle-climate-change-1.76896599
  fetched: 2026-11-03
  quote: 'Islamabad: Pakistan has launched its first ever national forest monitoring system to curb illegal
    deforestation and degradation of land and to mitigate the effects of climate change.'
- claim: Uses satellite land monitoring systems for activity data.
  url: https://gulfnews.com/world/asia/pakistan/pakistan-launches-first-forest-monitoring-system-to-tackle-climate-change-1.76896599
  fetched: 2026-11-03
  quote: Satellite land monitoring systems (SLMS) and other data collection providing information for
    activity data
- claim: Includes a national monitoring web portal with a server hosted at the Global Change Impact Studies
    Centre, according to the ministry's secretary as reported by Gulf News.
  url: https://gulfnews.com/world/asia/pakistan/pakistan-launches-first-forest-monitoring-system-to-tackle-climate-change-1.76896599
  fetched: 2026-11-03
  quote: The system also involves a national monitoring web portal with a dedicated server hosted at Global
    Change Impact Studies Centre (GCISC) with supported geodatabase of the forestry sector
- claim: The launch event was organised by the Ministry of Climate Change with the World Bank-supported
    REDD+ readiness project.
  url: https://gulfnews.com/world/asia/pakistan/pakistan-launches-first-forest-monitoring-system-to-tackle-climate-change-1.76896599
  fetched: 2026-11-03
  quote: The event was organised by the Ministry of Climate Change jointly with the World Bank-supported
    $7.81 million reducing emissions from deforestation and forest degradation (REDD+) readiness project
- claim: In 2014 WWF-Pakistan signed a letter of agreement with FAO to prepare the NFMS action plan and
    build capacity.
  url: https://un-redd.org/sites/default/files/2021-10/Pakistan%20NFMS%20Action%20Plan%20inception%20workshop%20proceedings.pdf
  fetched: 2026-11-03
  quote: UN (FAO)  for the preparation of Action Plan and Capacity Building for a National Forest
- claim: The Ministry of Climate Change and Environmental Coordination's home page lists the National
    Forest Monitoring System under Climate Change Dashboards.
  url: https://mocc.gov.pk/
  fetched: '2026-11-03'
  quote: National Forest Monitoring System
- claim: UN-REDD says its support helped Pakistan develop an NFMS Action Plan, which was finalised at
    a national workshop and endorsed by the Office of the Inspector General of Forests.
  url: https://www.un-redd.org/partner-countries/asia-pacific/pakistan
  fetched: '2026-11-03'
  quote: The NFMS Action Plan was also finalized and validated by multi-stakeholder national workshop,
    and endorsed by OIGF.
- claim: Describes itself as a platform to manage, monitor and analyse forest resources across Pakistan.
  url: https://nfmspak.org/about
  fetched: 2026-11-03
  quote: The National Forest Monitoring System (NFMS) is a comprehensive platform designed to manage,
    monitor, and analyze forest resources across Pakistan.
- claim: Includes a REDD+ registry of carbon projects and credits.
  url: https://nfmspak.org/about
  fetched: 2026-11-03
  quote: Track carbon projects and credits for climate change mitigation initiatives.
- claim: Its contact address is the National REDD+ Office at the Ministry of Climate Change in Islamabad.
  url: https://nfmspak.org/about
  fetched: 2026-11-03
  quote: 'Address: National REDD+ Office, Ministry of Climate Change Waheed Plaza'
- claim: Its document library holds a forest cover atlas of Pakistan whose maps were developed with WWF-Pakistan's
    GIS Lab.
  url: https://nfmspak.org/documents
  fetched: 2026-11-03
  quote: Forest cover maps of Pakistan developed with WWF-Pakistan's GIS Lab and Forest Inventory team.
