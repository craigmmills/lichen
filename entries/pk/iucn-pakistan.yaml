summary: Reportedly launched Punjab’s wildlife survey with the provincial wildlife department,
  plans a Red Data Book according to its project manager, and reportedly joined 2019 Red Data
  List data collection.
facts:
- claim: Launched the Punjab wildlife survey with the Punjab Wildlife and Parks Department,
    as reported by the Express Tribune.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: The survey was launched through a collaboration between the International Union for
    Conservation of Nature (IUCN) Pakistan and the Punjab Wildlife and Parks Department.
- claim: Plans a Red Data Book based on the Punjab survey findings, according to its project
    manager.
  url: https://tribune.com.pk/story/2625039/initial-results-emerge-from-wildlife-survey
  fetched: 2026-11-03
  quote: He said preparation of a Red Data Book based on the survey findings was also an important
    component of the project.
- claim: Took part in data collection for the 2019 Pakistan Red Data List survey, as reported
    by Dawn.
  url: https://www.dawn.com/news/amp/1512422
  fetched: 2026-11-03
  quote: International Union for Conservation of Nature Pakistan (IUCN-Pakistan), World Wide
    Fund for Nature-Pakistan (WWF), Zoological Survey of Pakistan and Wildlife Conservation
    Society Pakistan had been engaged for the data collection
