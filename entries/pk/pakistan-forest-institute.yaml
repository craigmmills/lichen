summary: Established in 1947, it reportedly published over 2,100 studies by 2012 and became
  attached to Khyber Pakhtunkhwa’s Environment Department after devolution in 2011, according
  to Dawn.
facts:
- claim: Established in 1947; by 2012 it had completed and published over 2,100 studies and
    1,200 articles in the Pakistan Journal of Forestry, as reported by Dawn.
  url: https://www.dawn.com/news/714628
  fetched: 2026-11-03
  quote: Established in 1947, PFI has produced 2555 forestry graduates including 122 foreigners
    and 199 female besides completing and publishing over 2100 studies and 1200 articles in
    Pakistan Journal of Forestry
- claim: In 2012 it reported a GIS and remote sensing mapping exercise to monitor forest cover
    in all districts of the country.
  url: https://www.dawn.com/news/714628
  fetched: 2026-11-03
  quote: The official said mapping exercise has been undertaken to plan monitor forests cover
    in all districts of the country with the help of Geographic Information System (GIS) and
    Remote Sensing Technology (RST).
- claim: Became an attached department of the Khyber Pakhtunkhwa Environment Department after
    devolution in 2011, as reported by Dawn.
  url: https://www.dawn.com/news/714628
  fetched: 2026-11-03
  quote: The official lauded the support of Khyber Pakthunkhwa for making PFI as attached
    department of Environment Department after its devolution in 2011.
