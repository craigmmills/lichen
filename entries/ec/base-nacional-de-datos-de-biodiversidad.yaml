summary: Ecuadorian national biodiversity database run by the national biodiversity institute, which Lexis
  reported in March 2026 was established by ministry rule as the single, official, compulsory system for
  biological information.
facts:
- claim: On 2 March 2026, Lexis reported the ministry's technical rule establishing it as the single,
    official and compulsory national system for registering biological information.
  url: https://www.lexis.com.ec/noticias/registro-oficial-del-dia-ecuador-establece-la-base-nacional-de-datos-de-biodiversidad-como-sistema-unico-oficial
  fetched: '2026-11-03'
  quote: como el sistema nacional único, oficial y obligatorio para el registro de información biológica
    en el país
- claim: The National Assembly records it as developed with South Korean cooperation and an
    investment of about USD 9 million.
  url: https://www.asambleanacional.gob.ec/es/node/119137
  fetched: 2026-11-02
  quote: Banco Nacional de Datos de Biodiversidad, desarrollado con cooperación de la República
    de Corea del Sur y una inversión aproximada de USD 9 millones
- claim: It is meant to strengthen information on ecosystems, species and genetic resources.
  url: https://www.asambleanacional.gob.ec/es/node/119137
  fetched: 2026-11-02
  quote: disponibilidad de información sobre los ecosistemas, especies y recursos genéticos
    del Ecuador
