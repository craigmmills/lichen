facts:
- claim: Noticias Ambientales describes it as created to manage the funds of the debt-for-nature
    swap.
  url: https://noticiasambientales.com/environment-en/ecuador-allocates-6-million-dollars-for-the-protection-of-the-galapagos-islands/
  fetched: 2026-11-02
  quote: an entity created to manage the funds from the debt-for-nature swap carried out by
    the Government in 2022
- claim: Its May 2025 allocation included plans to implement an interinstitutional remote
    monitoring system covering the Hermandad reserve.
  url: https://noticiasambientales.com/environment-en/ecuador-allocates-6-million-dollars-for-the-protection-of-the-galapagos-islands/
  fetched: 2026-11-02
  quote: Interinstitutional remote monitoring system
- claim: Mongabay says it provides grants for conservation projects in the two marine reserves.
  url: https://news.mongabay.com/2025/02/ecuadors-next-debt-for-nature-deal-falls-short-of-indigenous-involvement/
  fetched: 2026-11-02
  quote: which provides grants for conservation projects in the Galápagos Marine Reserve and
    the Hermandad Marine Reserve
- claim: It approved and delivered a grant of 6 million dollars.
  url: https://galapagoslifefund.org.ec/es/galapagos-refuerza-la-vigilancia-de-sus-reservas-marinas-con-apoyo-del-galapagos-life-fund-glf/
  fetched: '2026-11-02'
  quote: aprobó y entregó una subvención de 6 millones de dólares
- claim: It signed a contract for 2,000 vessel monitoring devices.
  url: https://galapagoslifefund.org.ec/technology-for-a-safer-more-protected-ocean/
  fetched: '2026-11-02'
  quote: for the acquisition, installation, and operation of 2,000 VMS devices
- claim: It says the devices will allow real-time satellite monitoring of vessels.
  url: https://galapagoslifefund.org.ec/technology-for-a-safer-more-protected-ocean/
  fetched: '2026-11-02'
  quote: These devices will enable real-time satellite monitoring of vessels
