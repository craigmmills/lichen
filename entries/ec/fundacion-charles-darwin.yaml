summary: International non-profit working in the Galápagos since 1959, with a Research Station
  in Puerto Ayora, that uses drones, geospatial analysis and machine learning and shares data
  through its dataZone.
facts:
- claim: Its species database openly shares the natural history collections database.
  url: https://datazone.darwinfoundation.org/en/checklist
  fetched: 2026-11-02
  quote: we openly share the information from the Charles Darwin Research Station Natural
    History Collections database
- claim: Its 2023 impact report says its technical teams supported the Floreana programme
    with geospatial analysis, drones and image analysis.
  url: https://www.darwinfoundation.org/es/documents/632/22_8_24-Reporte_de_Impacto_-_2023.pdf
  fetched: 2026-11-02
  quote: geoespacial y el uso de tecnología de drones y análisis de imágenes
- claim: OpenAlex lists a 2025 paper on Galápagos coral reefs using machine learning with
    authors at the foundation.
  url: https://api.openalex.org/works?filter=institutions.country_code:ec,title_and_abstract.search:deep%20learning%20species%7Cconvolutional%20wildlife%7Cmachine%20learning%20deforestation%7Cmachine%20learning%20mangrove%7CGalapagos%20machine%20learning,from_publication_date:2018-01-01&sort=cited_by_count:desc&per_page=50&select=display_name,publication_year,cited_by_count,doi,authorships
  fetched: 2026-11-02
  quote: using differential alignment of 3D models and Machine-Learning
