facts:
- claim: Its ordinance declares a Conservation and Sustainable Use Area within the
    province, with a surface of 41,888.55 hectares.
  url: https://napo.gob.ec/wp-content/uploads/1-ordenanza-para-la-creacion-del-area-de-conservacion-y-uso-sustentable-acus.pdf
  fetched: '2026-11-17'
  quote: de la presente Ordenanza, con una superficie de 41.888,55 hectáreas.
- claim: The ordinance assigns preparation of the ACUS management plan to the provincial
    Environmental Management Directorate, with participation from Pueblo Kichwa Rukullakta
    technicians.
  url: https://napo.gob.ec/wp-content/uploads/1-ordenanza-para-la-creacion-del-area-de-conservacion-y-uso-sustentable-acus.pdf
  fetched: '2026-11-17'
  quote: 'elaborará el correspondiente Plan de

    Manejo con la participación de los técnicos del PKR.'
- claim: The ordinance requires the GADP de Napo to update the ACUS management plan
    every six years, subject to a prior resolution by Pueblo Kichwa Rukullakta, or
    as operational needs and technical recommendations warrant.
  url: https://napo.gob.ec/wp-content/uploads/1-ordenanza-para-la-creacion-del-area-de-conservacion-y-uso-sustentable-acus.pdf
  fetched: '2026-11-17'
  quote: El Plan de Manejo será actualizado por el GADP de Napo cada 6
