summary: Ecuador's environment ministry, which held the November 2025 workshop for the seventh
  national biodiversity report, and which the president ordered merged with the energy and
  mines ministry in 2025.
facts:
- claim: In November 2025, the ministry held the national workshop for Ecuador's seventh national
    biodiversity report under the Convention on Biological Diversity, with technical support
    from UNDP and GEF funding.
  url: https://www.undp.org/es/ecuador/noticias/ecuador-avanza-en-la-construccion-del-septimo-informe-nacional-de-biodiversidad-con-taller-nacional-realizado-en-quito
  fetched: 2026-11-02
  quote: El Ministerio de Ambiente y Energía (MAE), con el apoyo técnico del Programa de las
    Naciones Unidas para el Desarrollo (PNUD)
- claim: The workshop was framed by the Kunming-Montreal Global Biodiversity Framework.
  url: https://www.undp.org/es/ecuador/noticias/ecuador-avanza-en-la-construccion-del-septimo-informe-nacional-de-biodiversidad-con-taller-nacional-realizado-en-quito
  fetched: 2026-11-02
  quote: en el marco del Marco Mundial de Biodiversidad Kunming-Montreal, adoptado en 2022
- claim: In 2025 the president ordered the merger of the Ministry of Environment, Water and
    Ecological Transition with the Ministry of Energy and Mines.
  url: https://es.mongabay.com/2025/08/ecuador-fusion-ministerios-ambiente-energia-minas-crisis-controles-ambientales/
  fetched: 2026-11-02
  quote: El presidente Daniel Noboa ordenó la fusión del Ministerio de Ambiente, Agua y Transición
    Ecológica con el Ministerio de Energía y Minas
- claim: Under its earlier name the ministry carried out continuous forest monitoring through
    the national forest monitoring system.
  url: https://proamazonia.org/wp-content/uploads/2025/02/arte-informe-de-bosques_V7.pdf
  fetched: 2026-11-02
  quote: (SNMB) realiza el monitoreo continuo de los bosques
- claim: Its GBIF record says it designs environmental policy and coordinates strategies,
    projects and programmes for ecosystems.
  url: https://api.gbif.org/v1/organization/c54097e6-0972-4acb-b849-eaeba29c917d
  fetched: '2026-11-02'
  quote: es el organismo del Estado ecuatoriano encargado de diseñar las políticas ambientales
- claim: Publishes datasets including monitoring of green turtle nesting in the Galápagos
    to GBIF.
  url: https://api.gbif.org/v1/organization/c54097e6-0972-4acb-b849-eaeba29c917d/publishedDataset?limit=40
  fetched: '2026-11-02'
  quote: Monitoreo de anidación de la tortuga verde (Chelonia mydas) en las Islas Galápagos
- claim: Its GBIF record gives an address in Quito.
  url: https://api.gbif.org/v1/organization/c54097e6-0972-4acb-b849-eaeba29c917d
  fetched: '2026-11-02'
  quote: '"address":["Madrid y Andalucía"],"city":"Quito"'
- claim: Its mission is stewardship, regulation and control of the environment, water, electricity,
    hydrocarbon and mining sectors.
  url: https://www.ambienteyenergia.gob.ec/planificacion-estrategica-2/
  fetched: '2026-11-02'
  quote: Ejercer la rectoría, regulación y control de los sectores de ambiente, agua, electricidad,
    hidrocarburos y minería
- claim: A page on its site says that the ministry, then named MAATE, has exclusive competence
    over all management categories of the National System of Protected Areas.
  url: https://www.ambienteyenergia.gob.ec/ambiente/la-autoridad-ambiental-nacional-es-responsable-de-la-gestion-y-administracion-de-las-areas-protegidas-garantizando-su-conservacion-restauracion-y-el-uso-sostenible-de-la-biodiversidad-a-nivel-de-eco/
  fetched: '2026-11-02'
  quote: tiene la competencia exclusiva sobre todas las categorías de manejo que conforman
    el Sistema Nacional de Áreas Protegidas (SNAP)
- claim: The ministry and the national government presented the results of the seventh national
    biodiversity report.
  url: https://www.ambienteyenergia.gob.ec/ecuador-presenta-resultados-de-su-septimo-informe-de-biodiversidad-con-mas-de-usd-2-076-millones-destinados-a-conservacion/
  fetched: '2026-11-02'
  quote: El Gobierno Nacional y el Ministerio de Ambiente y Energía presentaron los resultados
    del Séptimo Informe Nacional de Biodiversidad
- claim: The ministry says the report is the first national assessment aligned to the Kunming-Montreal
    framework.
  url: https://www.ambienteyenergia.gob.ec/ecuador-presenta-resultados-de-su-septimo-informe-de-biodiversidad-con-mas-de-usd-2-076-millones-destinados-a-conservacion/
  fetched: '2026-11-02'
  quote: El informe constituye la primera evaluación nacional alineada al Marco Global de
    Biodiversidad de Kunming-Montreal
- claim: The environment authority's GBIF Ecuador site says it is a GBIF member and administrator
    of the national node.
  url: https://gbif.ambiente.gob.ec/about/
  fetched: '2026-11-02'
  quote: como miembro de GBIF y administrador del nodo nacional
- claim: Its indicators system gives an address in Quito.
  url: https://sinias.ambiente.gob.ec/proyecto-sinias-web/start.jsf
  fetched: '2026-11-02'
  quote: Av. República de El Salvador N36-64 y Suecia, Quito, Ecuador
- claim: The GBIF publisher record describes it as the state body that designs environmental
    policy and coordinates programmes for the care of ecosystems.
  url: https://api.gbif.org/v1/organization/c54097e6-0972-4acb-b849-eaeba29c917d
  quote: El Ministerio de Ambiente y Energía es el organismo del Estado ecuatoriano encargado
    de diseñar las políticas ambientales
  fetched: '2026-11-02'
- claim: Ecuador's fourth REDD+ summary of information cites the ministry as its author in
    2025.
  url: https://redd.unfccc.int/media/20260119_ecuador_iv_ris.pdf
  quote: Ministerio del Ambiente y Energía. (2025). Cuarto Resumen de Información del Abordaje
    y
  fetched: '2026-11-02'
