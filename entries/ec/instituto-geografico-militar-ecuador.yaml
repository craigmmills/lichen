summary: Ecuador's national cartography body, responsible under law for national cartography
  and the geographic data archive, which kept thematic geoinformation after Decree 143 and
  created a space research directorate under Decree 714.
facts:
- claim: The national cartography law, as quoted in a paper the institute gave to a UN regional
    cartographic conference, makes it responsible for the national cartography and the country's
    geographic and cartographic data archive.
  url: https://unstats.un.org/unsd/geoinfo/RCC/docs/rcca10/E_Conf.103_21_IGM_ECUADOR.pdf
  fetched: 2026-11-02
  quote: de la Cartografía Nacional y del Archivo de Datos Geográficos y Cartográficos del
    País
- claim: After Executive Decree 143 it keeps management of thematic geoinformation, including
    natural resource inventories.
  url: https://www.teleamazonas.com/actualidad/noticias/politica/noboa-transfirio-atribuciones-instituto-geografico-fuerza-aerea-ecuatoriana-102696/
  fetched: 2026-11-02
  quote: de la gestión de geoinformación temática orientada a la defensa , apoyo al desarrollo
    e inventario de recursos naturales
- claim: It is responsible for coordinating, carrying out, approving and controlling the production
    of national cartography.
  url: https://www.geoportaligm.gob.ec/portal_geodesia/pages/liberacion-de-datos-GNSS1.html
  fetched: '2026-11-02'
  quote: coordinación, ejecución, aprobación y control de las actividades tendientes a la
    elaboración de la Cartografía
- claim: Decree 714 abolished the Instituto Espacial Ecuatoriano.
  url: https://www.geoportaligm.gob.ec/dicge/legislacion.html
  fetched: '2026-11-02'
  quote: Decreto Nº 714 - Suprime el Instituto Espacial Ecuatoriano
- claim: Under Decree 714 it created a directorate for cartographic, geographic and space
    research.
  url: https://www.geoportaligm.gob.ec/dicge/legislacion.html
  fetched: '2026-11-02'
  quote: el Decreto Ejecutivo N° 714, el IGM crea la Dirección de Investigación Cartográfica,
    Geográfica y Espacial
