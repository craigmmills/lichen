summary: Body managing the two Galápagos protected areas, including research and monitoring,
  with satellite vessel monitoring and THEMIS; its rangers received drone training.
facts:
- claim: Its institutional plan describes it as the body responsible for administering and
    managing the archipelago's two protected areas.
  url: https://www.galapagos.gob.ec/wp-content/uploads/2024/01/Plan_institucional_dpng_2021-2025-final.pdf
  fetched: 2026-11-02
  quote: Dirección del Parque Nacional Galápagos (DPNG) es la entidad responsable de la administración
    y manejo
- claim: Mongabay Latam reports that park staff on Santa Cruz view the positions of vessels
    inside and outside the marine reserve on a satellite control and monitoring system.
  url: https://es.mongabay.com/2021/10/galapagos-como-se-protege-la-reserva-de-ingresos-ilegales/
  fetched: 2026-11-02
  quote: cuenta con un sistema de control y monitoreo satelital propio para resguardar su
    perímetro
- claim: Its site is titled for the national directorate of the park.
  url: https://galapagos.gob.ec/
  fetched: '2026-11-02'
  quote: Parque Nacional Galápagos – Dirección Nacional del Parque Nacional Galápagos
- claim: Texas A&M says a shark study was done under a research permit issued by the Directorate.
  url: https://stories.tamu.edu/news/2026/07/28/researchers-shed-light-on-elusive-sharks-of-galapagos-islands/
  fetched: '2026-11-02'
  quote: research permit PC-18-24 issued by the Galapagos National Park Directorate
- claim: Its contact page lists a public use office in Puerto Ayora.
  url: https://galapagos.gob.ec/contacto/
  fetched: '2026-11-02'
  quote: Oficina de Uso Público de la Dirección del Parque Nacional Galápagos en Puerto Ayora
- claim: The ministry says the directorate is responsible for conserving and restoring the
    island and marine ecosystems of the Galápagos protected areas.
  url: https://www.ambienteyenergia.gob.ec/planificacion-estrategica-2/
  fetched: '2026-11-02'
  quote: la Dirección del Parque Nacional Galápagos es la responsable de la conservación y
    restauración de los ecosistemas insulares y marinos de las áreas protegidas de Galápagos
- claim: Its functions include administering and evaluating all research and monitoring in
    the Galápagos protected areas.
  url: https://galapagos.gob.ec/conocimiento-cientifico/
  fetched: '2026-11-02'
  quote: la DPNG tiene entre sus funciones la administración, difusión, gestión, seguimiento
    y evaluación de todas las actividades de investigación y monitoreo
- claim: Its control and surveillance centre uses THEMIS to follow permitted activity in the
    marine reserve.
  url: https://galapagos.gob.ec/capacitacion-en-tecnologias-para-control-de-la-reserva-marina/
  fetched: '2026-11-02'
  quote: plataforma que utiliza el centro de control y vigilancia para seguimiento de las
    actividades permitidas en el área protegida
- claim: A group of its rangers was trained to operate drones as a management tool.
  url: https://galapagos.gob.ec/uso-de-drones-como-herramienta-de-manejo/
  fetched: '2026-11-02'
  quote: recibió una capacitación sobre “Operación de aeronaves no tripuladas (drones)”
