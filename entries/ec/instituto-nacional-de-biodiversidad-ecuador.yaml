- claim: Heifer Ecuador says it signed a letter of understanding with INABIO on biodiversity
    in coffee and cocoa agroforestry.
  url: https://heifer-ecuador.org/heifer-ecuador-inabio-fortalecen-investigacion-sobre-biodiversidad-sistemas-agroforestales-cafe-cacao/
