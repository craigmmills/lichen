summary: A public biodiversity institute in Quito, created in 2016, that holds biological
  collections, publishes herbarium data to GBIF, promotes citizen science, and partners with
  international-barcode-of-life and alianza-aguas-amazonicas.
facts:
- claim: An INABIO director told the National Assembly that its aims include biodiversity
    research, science, technology and innovation.
  url: https://www.asambleanacional.gob.ec/es/node/119137
  fetched: 2026-11-02
  quote: tiene entre sus objetivos promover y ejecutar procesos de investigación, ciencia,
    tecnología e innovación relacionados con la biodiversidad
- claim: Its deputy director explained a national citizen science bioblitz on iNaturalist
    in May 2025, saying Ecuador had passed 1.8 million records of about 34,000 species there.
  url: https://www.teleamazonas.com/actualidad/noticias/sociedad/ecuador-inicia-maraton-fotografia-e-identificacion-especies-mediante-app-95815/
  fetched: 2026-11-03
  quote: en iNaturalist ya han superado los 1,8 millones de datos referentes a unas 34.000
    especies registradas en Ecuador
- claim: Its GBIF record describes it as the biological collections of the former museum and
    national herbarium.
  url: https://api.gbif.org/v1/organization/9cf743f8-3a4d-42df-9d1a-fd9cbcc3508f
  fetched: '2026-11-02'
  quote: Colecciones Biológicas del Ex Museo Ecuatoriano de Ciencias Naturales y Herbario
    Nacional.
- claim: Publishes the National Herbarium's vascular plant collection to GBIF.
