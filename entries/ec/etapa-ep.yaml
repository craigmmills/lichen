facts:
- claim: In January 2020, a newspaper reported that Cuenca's municipal company ETAPA
    EP had recorded spectacled bears mating with one of its camera traps in Cajas
    National Park.
  url: https://elmercurio.com.ec/cuenca/2020/01/25/camara-de-etapa-ep-capto-apareamiento-de-dos-osos/
  fetched: '2026-11-12'
  quote: La Empresa de Telecomunicaciones, Agua Potable y Alcantarillado (ETAPA EP),
    del Municipio de Cuenca, captó con una de sus cámaras trampa el apareamiento de
    dos osos de anteojos en el Parque Nacional Cajas (PNC).
- claim: In 2020 the paper reported a circuit of about 50 camera traps next to the
    park, collecting data for about ten years.
  url: https://elmercurio.com.ec/cuenca/2020/01/25/camara-de-etapa-ep-capto-apareamiento-de-dos-osos/
  fetched: '2026-11-12'
  quote: ETAPA EP ha completado un circuito de cerca de 50 cámaras trampa en los bosques
    adyacentes al PNC. Han servido para recoger información desde hace 10 años.
- claim: Ecuador's 2025 to 2030 biodiversity strategy names its terrestrial mammal
    monitoring programme for the Cajas massif.
