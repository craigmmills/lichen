- claim: NAWE says the programme combines ancestral knowledge with contemporary technologies.
  url: https://nawe.org.ec/monitoreo_kengiwe/
  fetched: '2026-11-02'
  quote: En este programa combinamos nuestros conocimientos ancestrales con tecnologías contemporáneas
- claim: Monitors record events and threats in the field on digital forms.
  url: https://nawe.org.ec/monitoreo_kengiwe/
  fetched: '2026-11-02'
  quote: Son quienes registran en campo los eventos, amenazas y hallazgos mediante formularios digitales
- claim: Information is turned into monthly reports and maps by a GIS professional.
  url: https://nawe.org.ec/monitoreo_kengiwe/
  fetched: '2026-11-02'
