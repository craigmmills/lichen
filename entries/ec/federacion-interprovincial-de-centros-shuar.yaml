summary: Shuar federation that signed the 2021 agreement beginning the Tarímiat Pujutaí
  Nunka Reserve process, and which a Shuar author describes as a pioneer in defending
  Shuar territory.
realms:
- land
facts:
- claim: Signed the 2021 agreement with the Morona Santiago provincial government
    and three other Indigenous organisations that began the process of creating the
    Tarímiat Pujutaí Nunka Reserve.
  url: https://www.natureandculture.org/directory/historic-creation-of-the-tarimiat-pujutai-nunka-reserve/
  fetched: '2026-11-17'
  quote: 'the four Indigenous nationalities that live within the Tarímiat Pujutaí
    Nunka Reserve: The Interprovincial Federation of Shuar Centers (FICSH)'
- claim: A Shuar author describes the federation as a pioneer in defending Shuar territory.
    An agreement between the federation and IERAC prioritised allocating community
    lands among Shuar centres during the federation’s 1975–1982 representation period
    in Quito.
  url: https://revista.drclas.harvard.edu/territory-of-the-shuar-people
  fetched: '2026-11-17'
  quote: priority was given to the allocation of community lands among the different
    Shuar Centers following a formal agreement with the Ecuadorian Institute of Agrarian
    Reform and Colonization—IERAC and FICSH.
