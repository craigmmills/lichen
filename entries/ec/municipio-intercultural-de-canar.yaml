summary: Municipality whose "La Fauna Vive" unit has led camera-trap monitoring in
  Sangay National Park and two páramos, with April to November 2025 results confirming
  spectacled bear, deer and páramo fox.
facts:
- claim: Through its environmental management unit "La Fauna Vive", the municipality
    has led a biological monitoring programme with camera traps.
  url: https://www.canar.gob.ec/noticias/53-noticias/1181-camaras-trampa-revelan-la-riqueza-oculta-de-los-paramos-en-canar
  fetched: 2026-11-09
  quote: el Municipio Intercultural de Cañar, a través de su Unidad de Gestión Ambiental
    “La Fauna Vive”, ha liderado un programa de monitoreo biológico mediante “cámaras
    trampa”
- claim: Cameras were placed in Sangay National Park and the Patococha and La Capilla
    páramos.
  url: https://www.canar.gob.ec/noticias/53-noticias/1181-camaras-trampa-revelan-la-riqueza-oculta-de-los-paramos-en-canar
  fetched: 2026-11-09
  quote: en zonas clave como el Parque Nacional Sangay y los páramos de Patococha
    y La Capilla
- claim: Results for April to November 2025 confirm spectacled bear, deer and páramo
    fox.
  url: https://www.canar.gob.ec/noticias/53-noticias/1181-camaras-trampa-revelan-la-riqueza-oculta-de-los-paramos-en-canar
  fetched: 2026-11-09
  quote: Entre los hallazgos más destacados del periodo abril-noviembre de 2025, se
    confirma el registro de osos de anteojos, venados, lobos de páramo (zorros) y
    una gran diversidad de aves.
