summary: Organisation of Indigenous people from four Ecuadorian Amazon nationalities that
  trains community guards and cartographers to monitor and map territory; it reports over
  200 guards covering 500,000 hectares and a 2026 Gulbenkian Prize.
facts:
- claim: Says it is made up of Indigenous people of four nationalities of the Ecuadorian Amazon.
  url: https://www.alianzaceibo.org/
  fetched: '2026-11-02'
  quote: Somos gente indígena de cuatro nacionalidades de la Amazonía ecuatoriana
- claim: Trains and equips Indigenous community guards who patrol to monitor and document
    illegal invaders.
  url: https://www.alianzaceibo.org/programas/monitoreo/
  fetched: '2026-11-02'
  quote: Capacitamos y equipamos a Guardias Comunitarios Indígenas que realizan recorridos
    para monitorear, documentar y expulsar a los invasores ilegales
- claim: Says more than 50 Indigenous cartographers have been trained and are mapping over
    400,000 hectares.
  url: https://www.alianzaceibo.org/programas/mapeo/
  fetched: '2026-11-02'
  quote: Más de 50 cartógrafos indígenas han sido capacitados y están mapeando más de 400.000
    hectáreas de territorio.
- claim: Reports that it received the 2026 Gulbenkian Prize.
  url: https://www.alianzaceibo.org/
  fetched: '2026-11-02'
  quote: Alianza Ceibo recibe el Premio Gulbenkian 2026 por su labor en defensa de la Amazonía
