scale: regional
status: proposed
summary: Proposed project, funded by CEDIA, to determine scale insect incidence in Ecuadorian
  coastal dry forest using high-resolution images, environmental variables and AI, with a
  planned 25 sensor nodes.
facts:
- claim: Aims to determine the incidence of scale insects in tropical dry forest on the Ecuadorian
    coast by combining high-resolution images, biological and micrometeorological variables
    and AI techniques.
  url: https://www.cidis.espol.edu.ec/content/aceptaci%C3%B3n-de-proyecto-en-convocatoria-2024-n%C2%BA-xix-fondo-idi-cedia
  fetched: 2026-11-09
  quote: integrando imágenes de alta resolución espacial, variables biológicas y micrometeorológicas,
    junto con técnicas de inteligencia artificial, para la comprensión de su impacto en el
    entorno forestal
- claim: Plans 25 sensor nodes in sampling plots to record temperature, humidity and solar
    radiation continuously.
  url: https://www.cidis.espol.edu.ec/content/aceptaci%C3%B3n-de-proyecto-en-convocatoria-2024-n%C2%BA-xix-fondo-idi-cedia
  fetched: 2026-11-09
  quote: se prevé el desarrollo de 25 nodos de sensores distribuidos estratégicamente en parcelas
    de muestreo
