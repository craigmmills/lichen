id: innovacion-verde-cochinilla-bosque-seco
kind: project
name: 'Innovación verde: tecnologías vanguardistas para el manejo sostenible de la cochinilla
  en bosques secos y zonas de conservación en la costa ecuatoriana'
scope: ec
ai_label: ai
realms:
