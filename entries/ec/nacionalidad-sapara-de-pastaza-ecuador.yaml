summary: Sápara Indigenous nationality whose 376,300 hectares in Pastaza were demarcated
  as its territory in 2009; a Puyo court returned disputed land to the Sápara in October
  2021.
realms:
- land
facts:
- claim: In 2009, 376,300 hectares in Pastaza province were recognised and demarcated
    as Sápara territory held by NASE. The disputed part of that territory was later
    registered in NASE’s name again.
  url: https://www.rainforest-rescue.org/updates/10719/ecuador-the-sapara-people-reclaim-251503-hectares-of-rainforest
  fetched: '2026-11-17'
  quote: However, due to legal and administrative loopholes, NASE had to repeatedly
    apply for the correction of the ownership structure, so that only now, months
    later, the area is finally registered in its name again.
- claim: A court in Puyo returned disputed land to the Sápara in October 2021 after
    the territory had been transferred to an outside association.
  url: https://www.rainforest-rescue.org/updates/10719/ecuador-the-sapara-people-reclaim-251503-hectares-of-rainforest
  fetched: '2026-11-17'
  quote: On October 18, 2021, a court in Puyo upheld the constitutional claim and
    returned the disputed territory to the Sápara.
