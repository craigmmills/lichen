facts:
- claim: Has flora, fauna and bird survey teams and a GIS unit.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: Geographic Information Systems Unit (GIS)
- claim: Lists implementing monitoring programmes in nature reserves among its objectives.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: 2. Implement monitoring programs in nature reserves.
- claim: Says its survey teams carry out an annual work plan of field research and periodic monitoring
    programmes.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: The first three units implement the annual work plan in the form of field research and periodically
    monitored scientific programs designed to deal with threats.
- claim: Grew out of the surveys and studies section RSCN set up in 1994, which was renamed the National
    Conservation Monitoring Center.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: the Research and Studies Section, which was renamed to National Conservation Monitoring Center
- claim: Has flora, fauna and bird survey teams and a Geographic Information Systems unit.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: Flora Surveys Team Fauna Surveys Team Birds Surveys Team Geographic Information Systems Unit
    (GIS)
- claim: Lists as objectives an updated and accessible biodiversity database and monitoring programmes
    in nature reserves.
  url: https://www.rscn.org.jo/ncmc?lang=en
  fetched: 2026-11-08
  quote: 1. Establish an updated, archived, and easily accessible biodiversity database. 2. Implement
    monitoring programs in nature reserves.
- claim: RSCN's 2019 annual report says the centre carried out eight ecological studies and a number of
    monitoring programmes in the reserves that year.
  url: https://www.rscn.org.jo/uploaded_files/media-center/annual-report/63e23e0dda20d1675771405.pdf
