summary: Closed RSCN project, 2014 to 2016, to develop a national biodiversity monitoring and information
  system, which also lists studies of tourism's effect on Dibeen Forest Reserve.
facts:
- claim: RSCN's 2014 annual report dates the project 2014 to 2016 and says it aims to develop a national
    monitoring and information system for biodiversity.
  url: https://www.rscn.org.jo/uploaded_files/media-center/annual-report/63e2426c5d4371675772524.pdf
  fetched: 2026-11-08
  quote: This project aims to develop a national monitoring and information system specialized in biodiversity
    as part of a project to integrate biodiversity conservation with the tourism sector funded by UNDP/
    Global Environmental Facility.
- claim: The report lists studies of tourism's effect on biodiversity in Dibeen Forest Reserve, including
    vegetation cover.
  url: https://www.rscn.org.jo/uploaded_files/media-center/annual-report/63e2426c5d4371675772524.pdf
  fetched: 2026-11-08
  quote: 'Undergoing studies of tourism’s impact on biodiversity in Dibeen Forest Reserve which includes:
    study of vegetation cover'
