facts:
- claim: Funded by UNDP Jordan, with key technical tasks assigned to IUCN ROWA, and
    targets three coral reef sites in Aqaba.
  url: https://iucn.org/node/46523
  fetched: 2026-11-12
  quote: This project is funded by UNDP Jordan with key technical tasks assigned to
    IUCN ROWA. the project targets three priority coral reef sites in Aqaba
- claim: One objective is to generate baselines, assess coral reef climate refugia
    and strengthen existing monitoring through field training and citizen science.
  url: https://iucn.org/node/46523
  fetched: 2026-11-12
  quote: Generate ecological and socio-economic baselines, assess coral reef climate
    refugia, and strengthen existing monitoring systems through field training and
    citizen science.
- claim: Its climate refugia report draws on monitoring data from the Marine Science
    Station's national monitoring programme, ASEZA and the Aqaba Marine Reserve.
  url: https://iucn.org/node/46523
  fetched: 2026-11-12
  quote: 'drawing on the monitoring data from three sources: the Marine Science Station''s
    national monitoring program, ASEZA, and the Aqaba Marine Reserve'
