  fetched: 2026-11-08
  quote: Under the patronage of H.E. Dr. Nedal Al-Ouran, Commissioner for Environment and Public Safety
    at the Aqaba Special Economic Zone Authority (ASEZA)
- claim: The University of Jordan says the authority was set up in 2000 and the National Monitoring Program
    came under its Environment Commission.
