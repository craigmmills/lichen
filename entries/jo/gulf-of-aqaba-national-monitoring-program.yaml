summary: Programme begun in 2001 to record baseline coral cover, reef health and fish abundance, which
  the University of Jordan page (updated 2017) says ASEZA committed to finance and manage.
facts:
- claim: The University of Jordan says implementation began in 2001.
  url: https://marine.ju.edu.jo/Lists/Acheivements/Disp_Acheivements.aspx?ID=44
  fetched: 2026-11-08
  quote: Implementation of NMP was commenced in 2001.
- claim: The University of Jordan lists generating baseline records of live coral cover, reef health,
    and fish abundance and biodiversity in coral reef and seagrass habitats among the programme’s objectives.
  url: https://marine.ju.edu.jo/Lists/Acheivements/Disp_Acheivements.aspx?ID=44
  fetched: 2026-11-08
  quote: (v) generate baseline records of fish abundance and biodiversity of coral reef and sea grass
    habitat
- claim: The University of Jordan says the programme came under the responsibility of ASEZA's Environment
    Commission and that ASEZA declared a commitment to finance and manage it. The page was last updated
    in 2017.
  url: https://marine.ju.edu.jo/Lists/Acheivements/Disp_Acheivements.aspx?ID=44
  fetched: 2026-11-08
  quote: The long term outcome of NMP was the declared commitment of the ASEZA to finance and manage a
    sustainable NMP of the coastal environment for the entire coastal line of Gulf of Aqaba.
