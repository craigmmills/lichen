facts:
- claim: Says 271 bird species have been recorded at the observatory, over 61% of those recorded in Jordan.
  url: https://www.rscn.org.jo/page/Aqaba%20Bird%20Observatory?lang=en
  fetched: 2026-11-08
  quote: A total of 271 bird species have been recorded at Aqaba Bird Observatory, representing over 61%
