facts:
- claim: In April 2020, Euronews described Eco Consult as a renewable energy advisory
    in Jordan whose bird observer watched for birds at risk of colliding with power
    lines and wind turbines.
  url: https://www.euronews.com/2020/04/17/how-are-conservationists-in-jordan-taking-action-to-protect-migratory-birds
  fetched: 2026-11-12
  quote: Malik Awaji is a bird observer for Eco Consult, a renewable energy advisory
    in Jordan. He watches the skies to try and prevent birds from colliding with power
    lines and wind turbines.
- claim: In April 2020, Euronews reported that Laith El Moghrabi, then an ecological
    research manager at Eco Consult, had designed a monitoring technique for heavy
    bird traffic, building on Scottish guidelines.
  url: https://www.euronews.com/2020/04/17/how-are-conservationists-in-jordan-taking-action-to-protect-migratory-birds
  fetched: 2026-11-12
  quote: Laith El Moghrabi, an ecological research manager at Eco Consult, designed
    a monitoring technique for heavy bird traffic, expanding upon Scottish guidelines
    for bird protection.
