summary: Jordanian marine reserve designated by Royal Decree in June 2020 and established
  by Cabinet in December 2020, with a 2022-2026 management plan, Norwegian-supported
  monitoring and a GIS-based marine database from 2022 to 2024.
facts:
- claim: The 2022-2026 Aqaba Marine Reserve Management Plan combined conservation,
    biodiversity monitoring, sustainable tourism and community engagement.
  url: https://www.undp.org/jordan/stories/seven-kilometres-matter-world
  fetched: 2026-11-12
  quote: The 2022–2026 Aqaba Marine Reserve Management Plan brought conservation,
    biodiversity monitoring, sustainable tourism and community engagement into a single
    framework.
- claim: Support from Norway in 2022 to 2024 added stronger monitoring and a GIS-based
    marine database.
  url: https://www.undp.org/jordan/stories/seven-kilometres-matter-world
  fetched: 2026-11-12
  quote: 'Support from the Government of Norway between 2022 and 2024 added another
    layer: clearer land and sea boundaries, stronger monitoring, a marine database
    based on geographic information systems'
- claim: The World Heritage Committee's statement noted ASEZA's leadership, a management
    plan and biodiversity monitoring among how the reserve is cared for.
  url: https://www.undp.org/jordan/stories/seven-kilometres-matter-world
  fetched: 2026-11-12
  quote: ASEZA's leadership, a management committee and plan, rules for fishing and
    tourism, biodiversity monitoring
- claim: Hosted a Reef Check EcoDiver training in December 2024 to build another team
    of qualified divers for reef monitoring of the Jordanian Red Sea coast.
  url: https://www.reefcheck.org/the-aqaba-marine-reserve-and-undp-jordan-add-divers-to-reef-check-monitoring-team/
  fetched: 2026-11-12
  quote: The Aqaba Marine Reserve-AMP hosted a Reef Check EcoDiver Training in Aqaba,
    Jordan in December 2024 with the cooperation of Aqaba Special Economic Zone Authority-ASEZA
    and United Nations Development Programme (UNDP)-Jordan.
- claim: A Royal Decree of 3 June 2020 designated the Aqaba Marine Park as the Aqaba
    Marine Reserve, and the Cabinet formally established the reserve in December 2020.
  url: https://www.jordannews.jo/Section-114/All/Aqaba-Marine-Reserve-s-Journey-to-UNESCO-World-Heritage-Status-Spanned-Nearly-Half-a-Century-53472
  fetched: 2026-11-12
  quote: On June 3, 2020, a Royal Decree officially designated the Aqaba Marine Park
    as the Aqaba Marine Reserve and incorporated it into Jordan's national protected
    areas network.
