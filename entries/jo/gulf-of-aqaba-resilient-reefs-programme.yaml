summary: Programme covering three priority Aqaba reef sites, with a GFCR budget of
  USD 1,628,754 in its 2025 annual report, UNDP Jordan convening, and activities including
  citizen science monitoring and environmental DNA training.
facts:
- claim: Its 2025 annual report names UNDP Jordan as convening agent, IUCN ROWA and
    Reef World Foundation as implementing partners, and a GFCR budget of USD 1,628,754.
  url: https://mptf.undp.org/sites/default/files/documents/2026-03/jordan_annual_narrative_report_2025_29_mar2026.docx.pdf
  fetched: 2026-11-12
  quote: 'Implementing Partner/s: IUCN ROWA & Reef World Foundation Total Approved
    Budget Total GFCR Budget: USD 1,628,754 Convening Agent: UNDP Jordan'
- claim: Covers three priority reef sites, the Aqaba Marine Reserve, the Northern
    Deep Corals and the Southern Industrial Site.
  url: https://mptf.undp.org/sites/default/files/documents/2026-03/jordan_annual_narrative_report_2025_29_mar2026.docx.pdf
  fetched: 2026-11-12
  quote: 'Priority Coral Reef Site/s: [1) Aqaba Marine Reserve (AMR); 2) Northern
    Deep Corals (NDC); and 3) Southern Industrial Site (SIS)]'
- claim: One activity strengthens coral reef monitoring systems with community participation
    and citizen science.
  url: https://mptf.undp.org/sites/default/files/documents/2026-03/jordan_annual_narrative_report_2025_29_mar2026.docx.pdf
  fetched: 2026-11-12
  quote: Activity 1.1.3 – Monitoring systems strengthened for coral reef ecosystems
    in the Gulf of Aqaba with community participation applying citizen science principles
- claim: Training with Swiss partners on environmental DNA techniques was delivered
    in coordination with the Aqaba Marine Reserve.
  url: https://mptf.undp.org/sites/default/files/documents/2026-03/jordan_annual_narrative_report_2025_29_mar2026.docx.pdf
  fetched: 2026-11-12
  quote: technical training delivered in collaboration with Swiss partners, focusing
    on the application of environmental DNA (eDNA) techniques in coordination with
    the Aqaba Marine Reserve
