summary: A jaguar monitoring programme in Madre de Dios, run by SERNANP since 2021 according to Mongabay,
  whose first camera-trap survey over 830 square kilometres recorded 15 individual jaguars.
facts:
- claim: Mongabay reports that SERNANP has been implementing the Programa Jaguar in Madre de Dios since
    2021.
  url: https://es.mongabay.com/2026/06/peru-inteligencia-artificial-conservacion-jaguares-reserva-nacional-tambopata/
  fetched: 2026-11-03
  quote: Desde 2021, el Servicio Nacional de Áreas Naturales Protegidas por el Estado (Sernanp) viene
    implementando, en el departamento de Madre de Dios, el Programa Jaguar
- claim: Two surveys used 101 camera traps in 2021 to 2022 and 90 in 2024, over 830 square kilometres.
  url: https://es.mongabay.com/2026/06/peru-inteligencia-artificial-conservacion-jaguares-reserva-nacional-tambopata/
  fetched: 2026-11-03
  quote: En ambos casos se distribuyeron en un área de 830 kilómetros cuadrados.
- claim: The first survey recorded 15 individual jaguars in 28 photographs, as determined with Matchy
    Patchy.
  url: https://es.mongabay.com/2026/06/peru-inteligencia-artificial-conservacion-jaguares-reserva-nacional-tambopata/
  fetched: 2026-11-03
  quote: se obtuvieron 28 fotografías en las que fueron captados 15 individuos , tal como determinó el
    procesamiento hecho con Matchy Patchy.
- claim: Mongabay reports that San Diego Zoo Wildlife Alliance-Peru processes the photographs with AI.
  url: https://es.mongabay.com/2026/06/peru-inteligencia-artificial-conservacion-jaguares-reserva-nacional-tambopata/
  fetched: 2026-11-03
  quote: La SDZWA–Perú también participa, precisamente procesando las fotografías obtenidas con la ayuda
    de la IA.
- claim: Mongabay reports 101 camera traps in the 2021 to 2022 survey and 90 in the 2024 survey.
  url: https://es.mongabay.com/2026/06/peru-inteligencia-artificial-conservacion-jaguares-reserva-nacional-tambopata/
  fetched: 2026-11-03
  quote: se instalaron 101 cámaras trampa al interior de la reserva
