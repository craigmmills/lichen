summary: AI project launched in March 2025 by Peru's environment ministry with Microsoft, planned to analyse
  satellite images, bioacoustic recordings and camera-trap images, with a 2025 work plan expecting databases,
  algorithms and training.
facts:
- claim: Launched in March 2025 by the environment ministry in alliance with Microsoft, to use AI for
    monitoring, analysing and protecting Peru's ecosystems and natural resources.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: El Ministerio del Ambiente (Minam), en alianza con Microsoft, realizaron el lanzamiento del Proyecto
    Guacamaya Perú, iniciativa que permitirá usar la inteligencia artificial para el monitoreo, análisis
    y protección de nuestros ecosistemas y recursos naturales.
- claim: The ministry says joining will strengthen the ministry and its attached bodies Senamhi, IIAP,
    Inaigem and SERNANP in data-based decisions.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: La adhesión al Proyecto Guacamaya permitirá fortalecer las capacidades del Minam y de las entidades
    adscritas como el Senamhi, IIAP, Inaigem y Sernanp
- claim: The 2025 work plan with Microsoft is expected to produce databases, AI algorithms for large data
    volumes and training of ministry specialists.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: se firmó el plan de trabajo para el 2025 entre el Minam y Microsoft, que tendrá como resultados
    esperados la generación de bases de datos georeferenciales y no georeferenciales; el desarrollo e
    implementación de algoritmos de IA
- claim: Launched in March 2025 by the environment ministry with Microsoft to use AI to monitor ecosystems
    and natural resources.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: El Ministerio del Ambiente (Minam), en alianza con Microsoft, realizaron el lanzamiento del Proyecto
    Guacamaya Perú
- claim: The March 2025 launch announcement said the platform would analyse satellite images, bioacoustic
    recordings and camera-trap images.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: plataforma que analizará datos masivos y complejos; imágenes satelitales, grabaciones bioacústicas
    y cámaras trampa
- claim: A 2025 work plan between the ministry and Microsoft expected databases, AI algorithms and training
    of ministry specialists.
  url: https://www.gob.pe/institucion/minam/noticias/1128778-minam-y-microsoft-lanzan-proyecto-para-monitorear-ecosistemas-usando-inteligencia-artificial
  fetched: 2026-11-03
  quote: el desarrollo e implementación de algoritmos de IA para análisis de grandes volúmenes de datos
    y la capacitación de especialistas del Minam
