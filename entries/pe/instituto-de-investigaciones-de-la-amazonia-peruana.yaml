  url: https://caretas.pe/?p=812882
  fetched: 2026-11-03
  quote: El IIAP emplea drones para realizar el conteo de palmeras de aguaje
- claim: A body attached to the environment ministry that has started a science and technology
    programme using AI on the Amazon's environmental problems.
  url: https://www.gob.pe/institucion/iiap/noticias/1195843-iiap-impulsa-la-conservacion-amazonica-con-inteligencia-artificial-aplicada-a-problemas-criticos-del-ambiente
