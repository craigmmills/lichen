summary: Public research body attached to Peru's environment ministry that runs an AI laboratory
  and, as reported by Caretas, uses AI, drones and sensors to monitor Amazon biodiversity.
facts:
- claim: A specialised technical public body that researches, evaluates and controls natural
    resources in the Peruvian Amazon.
  url: https://www.gob.pe/institucion/iiap/institucional
  fetched: 2026-11-03
  quote: El Instituto de Investigaciones de la Amazonía Peruana (IIAP), es un organismo público
    técnico especializado, y desarrolla actividades de investigación, evaluación y control
    de los recursos naturales
- claim: Caretas, citing the environment ministry, reports that IIAP uses artificial intelligence,
    drones and smart sensors to monitor biodiversity and detect environmental threats.
  url: https://caretas.pe/?p=812882
  fetched: 2026-11-03
  quote: El IIAP , organismo adscrito al Minam , viene utilizando inteligencia artificial
    , drones y sensores inteligentes para monitorear la biodiversidad, detectar amenazas ambientales
- claim: Caretas reports that IIAP has developed an automated system that uses artificial
    intelligence to count fish post-larvae.
  url: https://caretas.pe/?p=812882
  fetched: 2026-11-03
  quote: El IIAP ha desarrollado un sistema automatizado que utiliza inteligencia artificial
    para realizar el conteo de postlarvas de peces
