summary: Lima-based organisation that maps community lands and monitors deforestation in the
  Peruvian Amazon, and runs SICNA, its information system on native communities.
facts:
- claim: Caretas quotes Renzo Piana, executive director of IBC, on MapBiomas Alerta Perú crossing
    deforestation data with protected areas and indigenous territories.
  url: https://caretas.pe/?p=799143
  fetched: 2026-11-03
  quote: Renzo Piana, director ejecutivo del Instituto del Bien Común (IBC) , destacó que
    contar con información ambiental confiable es fundamental para la toma de decisiones informadas
- claim: Actualidad Ambiental reports that IBC's Information System on Native Communities
    of the Peruvian Amazon (SICNA) produced the 2012 directory of native communities.
  url: https://www.actualidadambiental.pe/ibc-633-comunidades-nativas-que-no-tienen-titulo-de-propiedad/
  fetched: 2026-11-03
  quote: Dicho documento, elaborado por el Sistema de Información sobre Comunidades Nativas
    de la Amazonía Peruana (SICNA) del Instituto del Bien Común (IBC)
- claim: Lists deforestation monitoring, territorial mapping and the SICNA information system
    among its services.
  url: https://ibcperu.org/
  fetched: 2026-11-03
  quote: SICNA SICCAM Ordenamiento Territorial Mapeo territorial Monitoreo de deforestación
- claim: LandMark says IBC has mapped community lands in Peru for 15 years and is a member
    of the RAISG mapping group.
  url: https://www.landmarkmap.org/about/who-is-involved
  fetched: 2026-11-03
  quote: IBC has been mapping community lands in Peru for 15 years and is a member of the
    RAISG mapping group for the Amazon Basin.
- claim: Signed an agreement with the Ministerio del Ambiente on the use of territorial information
    for ecosystem recovery.
  url: https://ibcperu.org/
  fetched: 2026-11-03
  quote: Minam y el Instituto del Bien Común suscribieron acuerdo sobre uso de información
    territorial para la recuperación de ecosistemas
- claim: In October 2026, IBC reported that its specialists had strengthened their biodiversity
    monitoring skills through a course facilitated by Smithsonian Institution scientists.
  url: https://ibcperu.org/
  fetched: 2026-11-03
  quote: Mediante un curso facilitado por científicos del Smithsonian Institution, especialistas
    del Instituto del Bien Común fortalecieron sus capacidades en monitoreo de la biodiversidad
    en áreas naturales protegidas.
- claim: Lists MapBiomas Perú among its special projects.
