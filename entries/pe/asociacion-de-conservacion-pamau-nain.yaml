summary: Nature and Culture International says it helped create this association of
  leaders from nine Awajún communities, who will coordinate activities on a concession
  protecting about 46,544 hectares of rainforest.
facts:
- claim: Nature and Culture International says it helped create the Pamau Nain Conservation
    Association, which brings together leaders of nine Awajún communities who will
    coordinate environmental, cultural and sustainable development activities.
  url: https://www.natureandculture.org/es/pamau-nain-conservation-concession/
  fetched: '2026-11-17'
  quote: colaboramos en la creación de la Asociación de Conservación Pamau Nain. Esta
    organización reúne a los líderes de nueve comunidades Awajún. Juntos, coordinarán
    actividades ambientales, culturales y de desarrollo sostenible.
- claim: The same page says the Awajún obtained the legal right to administer their
    ancestral territory through the concession, which protects about 46,544 hectares
    of rainforest in northern Peru.
  url: https://www.natureandculture.org/es/pamau-nain-conservation-concession/
  fetched: '2026-11-17'
  quote: obtuvieron el derecho legal de administrar su territorio ancestral.
