- claim: The same page says members of the community lodged complaints about invaders
    and asked police and prosecutors to secure the people who protect the dry forests
    of the reserve.
  url: https://www.actualidadambiental.pe/1200-hectareas-invadidas-y-violencia-en-la-primera-area-de-conservacion-privada-del-peru/
  fetched: '2026-11-17'
  quote: Los denunciantes, de la comunidad campesina Muchik Santa Catalina de Chongoyape,
    piden apoyo de la Policía Nacional y de la Fiscalía para echar a los invasores
    y garantizar la seguridad de los que protegen los bosques secos y toda su biodiversidad.
