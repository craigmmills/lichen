facts:
- claim: CONIDA reported in January 2018 that PerúSAT-1 was an Earth observation satellite producing images
    at 70 centimetres resolution.
  url: https://www.gob.pe/institucion/conida/noticias/84706-perusat-1-satelite-de-observacion-de-la-tierra
