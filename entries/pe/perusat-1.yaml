  quote: el satélite más potente de su clase (observación de la tierra) en la región puesto que genera
    imágenes con una resolución de 70 centímetros
- claim: CONIDA reported in January 2018 that its images were processed into products for uses including
    planning, agriculture and forestry.
  url: https://www.gob.pe/institucion/conida/noticias/84706-perusat-1-satelite-de-observacion-de-la-tierra
