summary: Platform built and run by CONIDA that gives institutions, researchers and citizens high-resolution
  satellite imagery, mainly from PerúSAT-1, and which CONIDA says uses AI to detect land-use change.
facts:
- claim: Gives public institutions, researchers and citizens access to high-resolution satellite imagery,
    for problems including illegal mining and deforestation.
  url: https://www.gob.pe/institucion/conida/noticias/1225540-geoapp-el-satelite-peruano-que-vigila-y-protege-el-futuro-del-pais
  fetched: 2026-11-03
  quote: la primera plataforma nacional que permite a cualquier institución pública, investigador o ciudadano
    acceder a imágenes satelitales de alta resolución
- claim: CONIDA says the platform uses AI to detect changes in land use, water bodies or deforestation.
  url: https://www.gob.pe/institucion/conida/noticias/1225540-geoapp-el-satelite-peruano-que-vigila-y-protege-el-futuro-del-pais
  fetched: 2026-11-03
  quote: La plataforma integra inteligencia artificial para detectar cambios en uso de suelo, cuerpos
    de agua o deforestación en lapsos muy cortos
- claim: Built with free software; its main data source is PerúSAT-1.
  url: https://www.gob.pe/institucion/conida/noticias/1225540-geoapp-el-satelite-peruano-que-vigila-y-protege-el-futuro-del-pais
  fetched: 2026-11-03
  quote: GeoAPP ha sido desarrollada con herramientas de software libre y capacidades técnicas nacionales.
    Su principal fuente de datos es el PeruSAT-1
