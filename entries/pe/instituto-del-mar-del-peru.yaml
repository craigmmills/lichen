summary: Public research institute attached to the Ministry of Production, based in Callao,
  that lists SOSMAP among its online services and catalogues marine biodiversity.
facts:
- claim: Attached to the Ministry of Production, it generates scientific knowledge for the
    sustainable use of living marine and inland water resources.
  url: https://www.gob.pe/institucion/imarpe/institucional
  fetched: 2026-11-03
  quote: Somos un organismo adscrito al Ministerio de la Producción, cuyas funciones se orientan
    a la generación de conocimiento científico
- claim: Has run port biological surveys in Callao since 2022 to set a biological baseline
    for assessing bioinvasion risk.
  url: https://www.gob.pe/institucion/imarpe/noticias/1457899-imarpe-fortalece-capacidades-para-el-monitoreo-y-deteccion-de-especies-exoticas-invasoras-en-ambientes-marinos
  fetched: 2026-11-03
  quote: la investigación que desarrolla el IMARPE desde 2022 mediante la línea “Evaluaciones
    Biológicas Portuarias en el Callao”
- claim: Took part in a September 2026 training run by the Smithsonian Environmental Research
    Center's BRIDGE programme, which covered eDNA detection techniques.
  url: https://www.gob.pe/institucion/imarpe/noticias/1457899-imarpe-fortalece-capacidades-para-el-monitoreo-y-deteccion-de-especies-exoticas-invasoras-en-ambientes-marinos
  fetched: 2026-11-03
  quote: técnicas de detección mediante ADN ambiental (eDNA), que permiten ampliar las posibilidades
    de identificar especies y mejorar el monitoreo de las bioinvasiones marinas
