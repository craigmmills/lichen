summary: Consortium of fisher and gatherer organisations that, according to FAO, signed
  a 20-year agreement with Sernanp to co-manage the Los Manglares de Tumbes National
  Sanctuary.
facts:
- claim: FAO says the consortium, formed by organisations of fishers and gatherers,
    signed a 20-year agreement with Sernanp to co-manage the Los Manglares de Tumbes
    National Sanctuary.
  url: https://www.fao.org/newsroom/story/Fisherfolk-in-Peru-preserve-mangroves-and-ocean-resources-through-co-management/es
  fetched: '2026-11-17'
  quote: los pescadores del Consorcio han firmado un acuerdo de 20 años con el Servicio
    Nacional Áreas Naturales Protegidas (SERNANP) del Perú para cogestionar el Santuario
    Nacional Los Manglares de Tumbes.
- claim: FAO says consortium members monitor and manage their resources, maintain
    biodiversity and forest cover, and run an ecotourism business and a seafood processing
    plant.
  url: https://www.fao.org/newsroom/story/Fisherfolk-in-Peru-preserve-mangroves-and-ocean-resources-through-co-management/es
