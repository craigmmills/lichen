facts:
- claim: In August 2022, was one of three protected areas collecting data on Andean
    bear occupancy in Peru.
  url: https://www.elperuano.pe/noticia/183988-sernanp-realiza-monitoreo-del-oso-de-anteojos-en-areas-naturales-protegidas
  fetched: 2026-11-09
  quote: 'son tres las áreas naturales protegidas que se encuentran levantando información
    sobre la ocupación del oso andino en el Perú: el Parque Nacional del Manu (Cusco
    y Madre de Dios), el Santuario Histórico de Machupicchu (Cusco) y el Parque Nacional
    Yanachaga Chemillén (Pasco).'
