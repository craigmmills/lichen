summary: Peru's official platform for monitoring forest cover change, launched in 2016 and run by the
  national forest conservation programme, showing forest loss and early deforestation alerts.
facts:
- claim: Launched in 2016 as the official platform for monitoring changes in Peru's forest cover.
  url: https://www.gob.pe/institucion/bosques/noticias/1423122-minam-celebra-los-10-anos-de-geobosques-la-plataforma-que-democratizo-el-acceso-a-la-informacion-sobre-los-bosques-del-peru
  fetched: 2026-11-03
  quote: con el lanzamiento de Geobosques, la plataforma oficial de monitoreo de los cambios en la cobertura
    de los bosques del Perú.
- claim: Shows forest area, forest cover loss and early deforestation alerts.
  url: https://www.gob.pe/institucion/bosques/noticias/1423122-minam-celebra-los-10-anos-de-geobosques-la-plataforma-que-democratizo-el-acceso-a-la-informacion-sobre-los-bosques-del-peru
  fetched: 2026-11-03
  quote: La plataforma permite conocer la superficie de bosques existentes, la pérdida de cobertura de
    bosques, alertas tempranas de deforestación y otros datos estratégicos para la toma de decisiones.
- claim: Its data come from the Forest Cover Monitoring Module, which has submodules for annual deforestation,
    early alerts, land-use change and reference levels.
  url: https://www.gob.pe/966-plataforma-de-monitoreo-de-bosques-geobosques
  fetched: 2026-11-03
  quote: La información difundida se genera con la medición que hace el Módulo de Monitoreo de la Cobertura
    de Bosques (MMCB)
- claim: A platform that monitors changes in the cover of Peru's forests and distributes the results as
    reports, maps and viewers.
  url: https://www.gob.pe/institucion/minam/pages/966-plataforma-de-monitoreo-de-bosques-geobosques
  fetched: 2026-11-03
  quote: Geobosques es una plataforma que monitorea los cambios de cobertura de los bosques peruanos.
- claim: Includes an early warning submodule giving georeferenced alerts of forest disturbance shortly
    after it happens.
  url: https://www.gob.pe/institucion/minam/pages/966-plataforma-de-monitoreo-de-bosques-geobosques
  fetched: 2026-11-03
  quote: 'Alerta temprana: genera alertas georreferenciadas de alteraciones en los bosques en periodos
    cortos de tiempo'
- claim: Its land-use change data feed the land-use sector of Peru's national greenhouse gas inventories.
  url: https://www.gob.pe/institucion/minam/pages/966-plataforma-de-monitoreo-de-bosques-geobosques
  fetched: 2026-11-03
  quote: brindando información oficial del sector uso de suelos, cambio de uso de suelos y silvicultura
    (USCUSS) en los Inventarios Nacionales de Gases de Efecto Invernado (INGEI)
