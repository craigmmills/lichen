summary: Native community of the Kukama-Kukamiria people whose 3,421-hectare private
  conservation area was recognised for an initial ten years, according to Actualidad
  Ambiental, with support building its surveillance and planning capacity.
facts:
- claim: Actualidad Ambiental says the Ministry of the Environment recognised a new
    private conservation area, Comunidad Nativa Nueva York, belonging to the Kukama-Kukamiria
    people, protecting 3,421 hectares for an initial ten years.
  url: https://www.actualidadambiental.pe/loreto-reconocen-area-de-conservacion-privada-del-pueblo-kukama-kukamiria/
  fetched: '2026-11-17'
  quote: 'Una nueva área de conservación privada (ACP) ha sido reconocida en Loreto:
    se trata de «Comunidad Nativa Nueva York», perteneciente al pueblo kukama-kukamiria
    .'
- claim: The same page says support let the community strengthen its capacity for
    territorial surveillance, strategic planning and sustainable management of its
    natural resources.
  url: https://www.actualidadambiental.pe/loreto-reconocen-area-de-conservacion-privada-del-pueblo-kukama-kukamiria/
  fetched: '2026-11-17'
  quote: la comunidad pudo fortalecer sus capacidades para la vigilancia del territorio
    , la planificación estratégica y el manejo sostenible de sus recursos naturales.
