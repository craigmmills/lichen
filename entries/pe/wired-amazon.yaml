summary: A Rainforest Expeditions initiative using Zooniverse for AmazonCam Tambopata's 200-square-kilometre
  camera grid, sending specimens for DNA barcoding, and monitoring trees with drones through Aerobotany,
  launched in 2016.
facts:
- claim: An initiative of Rainforest Expeditions.
  url: https://rainforestexpeditions.com/wired-amazon
  fetched: 2026-11-03
  quote: The Wired Amazon Program is a groundbreaking initiative by Rainforest Expeditions
- claim: AmazonCam Tambopata has a grid of camera traps over 200 square kilometres, with images uploaded
    to Zooniverse for citizen scientists to identify species.
  url: https://rainforestexpeditions.com/wired-amazon
  fetched: 2026-11-03
  quote: a vast grid of camera traps has been installed across 200 km² of rainforest — from Refugio Amazonas
    to the Tambopata Research Center.
- claim: Specimens are sent for DNA barcoding with the International Barcode of Life at the University
    of Guelph.
  url: https://rainforestexpeditions.com/wired-amazon
  fetched: 2026-11-03
  quote: Each specimen collected by the researcher is sent for DNA barcoding in collaboration with the
    International Barcode of Life (IBoL) at Guelph University in Canada
- claim: Aerobotany, launched in 2016, uses drones and citizen science to monitor the life cycles of Amazon
    trees.
  url: https://rainforestexpeditions.com/wired-amazon
  fetched: 2026-11-03
  quote: Wired Amazon launched Aerobotany in 2016, combining drones and citizen science to monitor the
    life cycles of Amazonian trees without climbing them.
- claim: The AmazonCam Tambopata page says the camera array spans the Tambopata National Reserve and Bahuaja
    Sonene National Park, and calls it, to the team's knowledge, the largest permanent camera trap monitoring
    programme in South America.
  url: https://www.zooniverse.org/projects/rainforestexpeditions/amazoncam-tambopata/about/research
  fetched: 2026-11-03
  quote: To our knowledge, this is the largest permanent camera trap monitoring program in South America.
