summary: Satellite monitoring units of the public prosecutor's office whose fourth unit, Actualidad Ambiental
  reported in June 2018, opened in Lima to issue early alerts on environmental crimes.
facts:
- claim: In June 2018, Actualidad Ambiental reported the inauguration of a fourth satellite monitoring
    unit in Lima, joining units in Madre de Dios, Loreto and Ucayali under the national coordination of
    the environmental prosecutors’ offices.
  url: https://www.actualidadambiental.pe/?p=50728
  fetched: 2026-11-03
  quote: Esta cuarta Unidad de Monitoreo Georreferencial Satelital operará en la sede principal del Ministerio
    Público bajo la dirección de la Coordinación Nacional de las Fiscalías Especializadas en Materia Ambiental
- claim: The June 2018 report said the Lima unit would work with optical satellite images, drone images,
    the Peruvian satellite and radar, and issue early alerts against environmental crimes.
  url: https://www.actualidadambiental.pe/?p=50728
  fetched: 2026-11-03
  quote: La Unidad de Monitoreo Georreferencial Satelital inaugurada trabajará con fotos satelitales ópticas,
    imágenes de drones, del satélite peruano y tecnología radar-satelital.
