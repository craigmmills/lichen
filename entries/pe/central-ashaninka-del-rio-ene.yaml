summary: An organisation saying it represents 45 Asháninka communities in the Ene basin, with
  a geospatial viewer covering over 235,000 hectares and the SAT-CARE early warning system.
facts:
- claim: Says it represents 45 Asháninka communities in the Ene river basin, in Satipo province,
    Junín.
  url: https://careashaninka.org.pe/
  fetched: 2026-11-03
  quote: Representamos a 45 comunidades asháninkas en la cuenca del río Ene.
- claim: Developed a geospatial viewer that monitors more than 235,000 hectares.
  url: https://careashaninka.org.pe/
  fetched: 2026-11-03
  quote: La herramienta, desarrollada por la Central Asháninka del Río Ene (CARE), monitorea
    más de 235 mil hectáreas
- claim: Its SAT-CARE early warning system strengthens community territorial surveillance.
  url: https://careashaninka.org.pe/
  fetched: 2026-11-03
  quote: El SAT-CARE fortalece la vigilancia territorial que históricamente han ejercido las
    comunidades asháninkas
- claim: In September 2026, CARE announced that ten SAT-CARE command members, including two
    women, would receive specialised training in drone operation.
  url: https://careashaninka.org.pe/
  fetched: 2026-11-03
  quote: Diez integrantes del Comando SAT-CARE, entre ellos dos mujeres, recibirán capacitación
    especializada en operación de drones
- claim: Says it was the first Peruvian Indigenous organisation to join a satellite programme
    to prevent forest fires.
  url: https://careashaninka.org.pe/
  fetched: 2026-11-03
  quote: CARE, primera organización indígena peruana en unirse a un programa satelital para
    prevenir incendios forestales
