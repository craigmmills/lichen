summary: An open-access monitoring centre built by the environment ministry which, as described in June
  2024, would use satellite data and Google Earth Engine to report ecosystem state and project future
  loss.
facts:
- claim: In June 2024, the ministry said SIMON would use satellite information on degraded areas with
    Google Earth Engine data to report on ecosystem state and project scenarios of future loss of natural
    areas.
  url: https://www.gob.pe/institucion/minam/noticias/970979-centro-de-monitoreo-territorial-del-minam-fortalecera-acciones-contra-la-deforestacion-y-contaminacion-de-rios-en-el-pais
  fetched: 2026-11-03
  quote: Este innovador sistema, denominado SIMON, utilizará información satelital de los mecanismos de
    vigilancia de áreas degradadas de dicho sector complementadas con los datos de la plataforma Google
    Earth Engine.
- claim: In June 2024, the ministry described the centre as open access.
  url: https://www.gob.pe/institucion/minam/noticias/970979-centro-de-monitoreo-territorial-del-minam-fortalecera-acciones-contra-la-deforestacion-y-contaminacion-de-rios-en-el-pais
