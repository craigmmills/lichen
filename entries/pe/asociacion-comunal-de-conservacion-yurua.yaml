facts:
- claim: Upper Amazon Conservancy says ACC-Yurúa is made up of nine Indigenous communities
    and has led efforts to conserve more than 45,000 hectares of rainforest on the
    Peru-Brazil border for over a decade.
  url: https://www.upperamazon.org/news/ddddd-6pfec-c9h33-dd6y3-mebbz-ynalw-75y8d-jzahz-7dcan-ezmx5-awpsh-9p69e-nhtw4-bbrd9-8jtpy-6tpzp-p98by-p3nhr-y7z5t-rd6eb-zfwtb-g83mm-ha2eh-s6fl6-kk78s-tn6yz-2pg27-7rhjw-lk2n2
  fetched: '2026-11-17'
  quote: made up of nine Indigenous communities from the Asháninka, Yaminahua, Amahuaca,
    and Yanesha peoples of the Yurúa River basin, has been leading efforts to conserve
    more than 45,000 hectares of Amazon rainforest along the Peru–Brazil border
- claim: Upper Amazon Conservancy says Indigenous communities secured a conservation
    concession that was officially granted in 2019. ACC-Yurúa has since led forest
    protection and territorial monitoring initiatives.
  url: https://www.upperamazon.org/news/ddddd-6pfec-c9h33-dd6y3-mebbz-ynalw-75y8d-jzahz-7dcan-ezmx5-awpsh-9p69e-nhtw4-bbrd9-8jtpy-6tpzp-p98by-p3nhr-y7z5t-rd6eb-zfwtb-g83mm-ha2eh-s6fl6-kk78s-tn6yz-2pg27-7rhjw-lk2n2
