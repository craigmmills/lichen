summary: The environment ministry agency leading Peru's state protected areas system said
  in June 2025 it had over 80 species monitoring protocols in nationally administered protected
  areas.
facts:
- claim: Leads the national system of state protected natural areas, SINANPE, as its technical
    and regulatory authority.
  url: https://www.gob.pe/institucion/sernanp/institucional
  fetched: 2026-11-03
  quote: El Sernanp es el ente rector del Sistema Nacional de Áreas Naturales Protegidas por
    el Estado– SINANPE
- claim: Andina describes Sernanp as a body attached to the Ministerio del Ambiente.
  url: https://andina.pe/ingles/noticia-usaran-drones-para-optimizar-monitoreo-las-areas-naturales-protegidas-827090.aspx
  fetched: 2026-11-03
  quote: el Servicio Nacional de Áreas Naturales Protegidas por el Estado (Sernanp), organismo
    adscrito al Ministerio del Ambiente
- claim: Offers geographic information on Peru's protected natural areas (Geo ANP) on its
    government page.
  url: https://www.gob.pe/sernanp
  fetched: 2026-11-03
  quote: Conocer la información geográfica de las Áreas Naturales Protegidas - Geo ANP
- claim: Offers information on the conservation status of protected natural areas.
  url: https://www.gob.pe/sernanp
  fetched: 2026-11-03
  quote: Conocer el estado de conservación de las Áreas Naturales Protegidas (ANP)
- claim: In December 2020, Andina reported a workshop at which Sernanp rangers and specialists
    worked with San Diego Zoo Global Peru and Linn Aerospace Peru experts on guidelines for
    drones in protected areas.
  url: https://andina.pe/ingles/noticia-usaran-drones-para-optimizar-monitoreo-las-areas-naturales-protegidas-827090.aspx
  fetched: 2026-11-03
  quote: especialistas y guardaparques del Sernanp con expertos del San Diego Zoo Global Peru
    y Linn Aerospace Peru, iniciaron el establecimiento de los lineamientos del uso de drones.
- claim: Registered as a GBIF data publisher endorsed by GBIF Peru.
  url: https://api.gbif.org/v1/node/46e3639a-27f8-45af-bfbe-d19b77efb040/organization?limit=200
  fetched: 2026-11-03
  quote: '"title":"Servicio Nacional de Areas Naturales Protegidas por el Estado"'
- claim: An agency attached to the environment ministry.
  url: https://www.gob.pe/institucion/sernanp/institucional
  fetched: 2026-11-03
  quote: Servicio Nacional de Áreas Naturales Protegidas por el Estado Entidad adscrita a
    Ministerio del Ambiente .
- claim: In June 2025, SERNANP said it had more than 80 species monitoring protocols in nationally
    administered protected areas.
  url: https://www.gob.pe/institucion/sernanp/noticias/1186146-la-inteligencia-artificial-se-une-a-la-conservacion-peru-desarrollara-primer-asistente-de-biodiversidad
  fetched: 2026-11-03
  quote: El Sernanp cuenta con más de 80 protocolos de monitoreo de especies en las áreas
    naturales protegidas de administración nacional
- claim: In December 2025 rangers and specialists from five protected areas in Loreto were
    trained to use Wildlife Insights and the WI-ASL data explorer to classify camera-trap
    images.
  url: https://www.gob.pe/institucion/sernanp/noticias/1305048-fortalecen-capacidades-en-monitoreo-de-la-biodiversidad-de-guardaparques-y-especialistas-de-cinco-areas-naturales-protegidas-de-loreto
  fetched: 2026-11-03
  quote: fueron entrenados en el uso de Wildlife Insights y el Explorador de Datos WI-ASL
- claim: Its GBIF record says it is attached to the Ministry of the Environment and sets the
    technical and administrative criteria for conserving protected natural areas.
  url: https://api.gbif.org/v1/organization/2e3408a2-7d79-478f-875b-2b6a669b9026
  fetched: '2026-11-03'
  quote: encargado de dirigir y establecer los criterios técnicos y administrativos para la
    conservación de las Áreas Naturales Protegidas
- claim: Its GBIF record names it the governing body of SINANPE.
  url: https://api.gbif.org/v1/organization/2e3408a2-7d79-478f-875b-2b6a669b9026
  fetched: '2026-11-03'
  quote: El SERNANP es el ente rector del Sistema Nacional de Áreas Naturales Protegidas por
    el Estado – SINANPE
- claim: Its GBIF record gives an address in San Isidro, Lima.
  url: https://api.gbif.org/v1/organization/2e3408a2-7d79-478f-875b-2b6a669b9026
  fetched: '2026-11-03'
  quote: '"city":"San Isidro","province":"Lima","country":"PE"'
