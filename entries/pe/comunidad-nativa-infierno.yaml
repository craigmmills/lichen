summary: Native community that reserved almost 2,000 hectares for conservation, recognised
  in 2016 as the Ebio Kiabamene private conservation area, then the largest in Madre
  de Dios, according to Actualidad Ambiental.
facts:
- claim: Actualidad Ambiental reported in 2016 that the Infierno Native Community
    had reserved almost 2,000 hectares of its territory for biodiversity conservation.
    The Ministry of the Environment recognised it that year as the Ebio Kiabamene
    private conservation area, then the largest in Madre de Dios.
  url: https://www.actualidadambiental.pe/historico-minam-reconocio-el-acp-mas-extenso-de-madre-de-dios/
  fetched: '2026-11-17'
  quote: la comunidad nativa Infierno, ubicada en las proximidades de la Reserva Nacional
    Tambopata , en la región de Madre de Dios, con una visión a futuro, decidió reservar
    un espacio de casi 2000 hectáreas de su territorio comunal para la conservación
    de la biodiversidad que ahí habita.
