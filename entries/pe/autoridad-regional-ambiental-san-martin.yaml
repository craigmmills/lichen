facts:
- claim: In June 2026, the San Martín regional government said its Autoridad Regional
    Ambiental signed four conservation agreements involving civil society and the
    private sector to strengthen protection of two regional conservation areas.
  url: https://www.gob.pe/institucion/regionsanmartin/noticias/1400991-goresam-consolida-modelo-de-gobernanza-ambiental-con-acuerdos-de-conservacion
