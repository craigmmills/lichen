summary: IIAP project led by Giussepe Gagliardi that studies forest sounds to assess human
  impact on Amazon biodiversity, with more than 800,000 minutes recorded by July 2026.
facts:
- claim: Caretas reports that the researchers have collected more than 800,000 minutes of
    recordings, to be processed by AI systems that recognise species from their vocalisations.
  url: https://caretas.pe/medio-ambiente/iiap-utiliza-inteligencia-artificial-para-medir-el-impacto-humano-en-la-biodiversidad-amazonica/
  fetched: 2026-11-03
  quote: Hasta el momento, los investigadores han recopilado más de 800 000 minutos de grabaciones
    , que posteriormente serán procesadas mediante sistemas de inteligencia artificial capaces
    de reconocer especies a partir de sus vocalizaciones.
- claim: Caretas reports that IIAP is building an acoustic library of Amazon species from
    the recordings.
  url: https://caretas.pe/medio-ambiente/iiap-utiliza-inteligencia-artificial-para-medir-el-impacto-humano-en-la-biodiversidad-amazonica/
  fetched: 2026-11-03
  quote: Como parte de los resultados del proyecto, el IIAP desarrolla una biblioteca acústica
    de especies amazónicas
- claim: Studies forest sounds to assess human impact on Amazon biodiversity, and is building
    a reference database for AI analysis to identify species and changes in soundscapes.
  url: https://www.gob.pe/institucion/iiap/noticias/1419364-cientificos-del-iiap-registran-sonidos-de-la-amazonia-para-medir-impacto-humano
  fetched: 2026-11-03
  quote: La investigación analiza los sonidos del bosque con apoyo de inteligencia artificial
    para identificar especies y medir el impacto de la intervención humana en distintos ecosistemas.
- claim: Had gathered more than 800,000 minutes of recordings by July 2026.
  url: https://www.gob.pe/institucion/iiap/noticias/1419364-cientificos-del-iiap-registran-sonidos-de-la-amazonia-para-medir-impacto-humano
  fetched: 2026-11-03
  quote: Hasta el momento, el equipo reunió más de 800 000 minutos de grabaciones.
- claim: Supported by IIAP's AI laboratory and its Manatí supercomputer.
  url: https://www.gob.pe/institucion/iiap/noticias/1419364-cientificos-del-iiap-registran-sonidos-de-la-amazonia-para-medir-impacto-humano
  fetched: 2026-11-03
  quote: Este trabajo cuenta con el respaldo del Laboratorio de Inteligencia Artificial del
    IIAP, equipado con la supercomputadora Manatí
