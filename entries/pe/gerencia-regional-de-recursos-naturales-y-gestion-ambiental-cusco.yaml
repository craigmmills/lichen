facts:
- claim: In July 2026, Actualidad Ambiental reported that the Cusco regional government’s
    natural resources office was organising the III National Congress of Regional
    Conservation Areas, scheduled for 6 to 9 September 2026. Regional governments
    administer these areas in coordination with Sernanp.
  url: https://www.actualidadambiental.pe/cusco-iii-congreso-nacional-areas-conservacion-regional/
  fetched: '2026-11-17'
  quote: El Gobierno Regional del Cusco, con el apoyo del Servicio Nacional de Áreas
    Naturales Protegidas por el Estado (Sernanp), lanzó oficialmente el III Congreso
    Nacional de Áreas de Conservación Regional (ACR), que se desarrollará del 6 al
    9 de septiembre
- claim: The same page says Cusco has five regional conservation areas, Ausangate,
    Choquequirao, Chuyapi Urusayhua, Q'eros Kosñipata and Tres Cañones, protecting
    more than 345,000 hectares.
  url: https://www.actualidadambiental.pe/cusco-iii-congreso-nacional-areas-conservacion-regional/
