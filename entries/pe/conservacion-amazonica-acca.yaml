summary: Organisation saying it protects over 5 million hectares of the Amazonian Andes using
  satellites, drones, acoustic monitoring and camera traps, and running the Monitoring of
  the Andes Amazon Program.
facts:
- claim: Uses acoustic monitoring, camera traps and environmental DNA analysis to track biodiversity,
    and combines satellite technology with drones.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: Utilizamos herramientas como el monitoreo acústico, cámaras trampa y análisis de
    ADN ambiental para mejorar el seguimiento de la biodiversidad y la salud ecológica.
- claim: Says it conserves and protects more than 5 million hectares of the Amazonian Andes
    in southern Peru.
  url: https://acca.org.pe/
  fetched: 2026-11-03
  quote: Conservamos y protegemos más de 5 millones de hectáreas de los Andes Amazónicos al
    sur del Perú.
- claim: Says it aims to develop a deep learning approach for automated large-scale surveillance
    of selective logging.
  url: https://acca.org.pe/conservation-technology-hub-en-los-amigos/
  fetched: 2026-11-03
  quote: Buscamos desarrollar un nuevo enfoque basado en el uso de algoritmos de Aprendizaje
    Profundo (Deep Learning) para contar en el futuro con un sistema de vigilancia automatizada
    aplicable a gran escala.
- claim: In August 2023 it led a TensorFlow training on Earth science applications in the
    Amazon with SERVIR-Amazonia, NASA, USAID, Development Seed and UTEC.
  url: https://acca.org.pe/inteligencia-artificial-y-machine-learning-innovaciones-claves-para-la-preservacion-de-la-amazonia/
  fetched: 2026-11-03
  quote: 'La organización sin fines de lucro Conservación Amazónica-ACCA del 8 al 11 de Agosto,
    2023 lideró el evento “TensorFlow Training: Earth Science Application in Amazonia”'
- claim: Its specialists demonstrated automated counting of Brazil nut fruit with artificial
    intelligence at AmazonTEC 2026.
  url: https://acca.org.pe/amazontec-2026-como-los-drones-y-la-inteligencia-artificial-se-usan-para-enfrentar-la-deforestacion-y-restaurar-la-amazonia/
  fetched: 2026-11-03
  quote: el conteo automatizado de frutos de castaña mediante inteligencia artificial, tal
    como lo demostraron los especialistas de ACCA
- claim: Says it conserves and protects more than 5 million hectares of the Amazonian Andes
    in southern Peru using science, technology and strategic action.
  url: https://acca.org.pe/
  fetched: 2026-11-03
  quote: Conservamos y protegemos más de 5 millones de hectáreas de los Andes Amazónicos al
    sur del Perú. Utilizamos la ciencia, la tecnología y acciones estratégicas para garantizar
    su conservación.
- claim: Says it monitors forests with the latest technology, illustrated with drone work.
  url: https://acca.org.pe/
  fetched: 2026-11-03
  quote: Monitoreamos los bosques con lo último en tecnología
- claim: Runs three biological stations (Wayqecha, Manu and Los Amigos) and the Los Amigos
    conservation concession.
  url: https://acca.org.pe/
  fetched: 2026-11-03
  quote: Conoce nuestras tres Estaciones Biológicas y la primera Concesión para Conservación
    del mundo, Los Amigos.
- claim: Net Zero Compare reports that the proposed monitoring structure of Amazon.ia, an
    AI biodiversity initiative announced by Planet, includes Los Amigos Biological Station
    in Peru among its core sites.
  url: https://netzerocompare.com/articles/planet-launches-amazonia-to-scale-ai-powered-biodiversity-monitoring-across-the-amazon
  fetched: 2026-11-03
  quote: These include existing research locations such as Tiputini Biodiversity Station in
    Ecuador, Los Amigos Biological Station in Peru and the Mamirauá Reserve in Brazil.
- claim: Registered as a GBIF data publisher endorsed by GBIF Peru, under the name Asociación
    para la Conservación de la Cuenca Amazónica.
  url: https://api.gbif.org/v1/node/46e3639a-27f8-45af-bfbe-d19b77efb040/organization?limit=200
  fetched: 2026-11-03
  quote: '"title":"Asociación para la Conservación de la Cuenca Amazónica - ACCA"'
- claim: Lists RAMI, a radar-based satellite platform for near-real-time information on deforestation
    and gold mining in the southern Peruvian Amazon, among its conservation technologies.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: La plataforma Monitoreo de Minería Aurífera con Radar, denominada RAMI , es la herramienta
    de monitoreo satelital, diseñada con tecnología geoespacial de la NASA
- claim: Lists a drone project, Numba Wachokkeri, supporting control and surveillance of the
    Amarakaeri Communal Reserve.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: Este proyecto desarrolla acciones complementarias para el sistema de control y vigilancia
    de la Reserva Comunal Amarakaeri (RCA) y su Zona de Amortiguamiento (ZA) mediante el uso
    de tecnología de drones de alto performance.
- claim: Lists a conservation technology hub at Los Amigos Biological Station using acoustic
    and visual technologies to detect illegal activity and monitor biodiversity.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: El Consorcio de Tecnología en la Estación Biológica Los Amigos cuenta con proyectos
    de científicos líderes, donde se usan las tecnologías auditivas y visuales más innovadoras
    para la detección de actividades ilegales y el monitoreo de la biodiversidad.
- claim: Says that with strategic allies it has developed applications based on radar satellites
    and instruments monitoring atmospheric gases, with results published through its MAAP
    reports or sent privately to authorities.
  url: https://acca.org.pe/monitoreo-satelital/
  fetched: 2026-11-03
  quote: con el apoyo de aliados estratégicos, hemos desarrollado aplicaciones basadas en
    otros recursos espaciales, como los con satélites de radar y los instrumentos para el
    monitoreo de la presencia de gases atmosféricos
- claim: Sets up real-time monitoring systems to detect threats.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: Establecemos sistemas integrales de monitoreo en tiempo real para detectar y abordar
    las amenazas
- claim: Has a technology consortium at the Los Amigos Biological Station using acoustic and
    visual technology to detect illegal activity and monitor biodiversity.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: El Consorcio de Tecnología en la Estación Biológica Los Amigos cuenta con proyectos
    de científicos líderes
- claim: In April 2026 it donated S/ 159,288 to SERNANP, with funding from the Andes Amazon
    Fund, for creating new protected areas.
  url: https://www.gob.pe/institucion/sernanp/noticias/1380987-sernanp-y-conservacion-amazonica-acca-fortalecen-procesos-de-establecimiento-de-nuevas-areas-naturales-protegidas-en-el-peru
  fetched: 2026-11-03
  quote: el Sernanp recibió una donación ascendente a S/ 159,288 por parte de ACCA, gracias
    al valioso apoyo financiero de Andes Amazon Fund
- claim: Holds an annual platform that brings together Indigenous communities, civil society,
    authorities and international cooperation to build technology solutions for Amazon forests.
  url: https://acca.org.pe/conservamos-con-ciencia-y-tecnologia/tecnologias-para-la-conservacion/
  fetched: 2026-11-03
  quote: Es la plataforma anual donde reunimos a representantes de comunidades indígenas,
    sociedad civil, autoridades locales, regionales, nacionales y organizaciones de cooperación
    internacional
- claim: Said in September 2026 that it was part of Amazon.ia, an initiative that planned
    to combine AI, satellite images and field data to monitor Amazon biodiversity, and would
    contribute its work at Los Amigos Biological Station.
  url: https://acca.org.pe/en/inteligencia-artificial-y-colaboracion-masiva-para-entender-como-cambia-la-biodiversidad-de-la-amazonia/
  fetched: 2026-11-03
  quote: Conservación Amazónica – ACCA forma parte de esta iniciativa y aportará la experiencia
    científica acumulada durante más de 25 años en la Estación Biológica Los Amigos
- claim: Its site names drone technology work.
  url: https://acca.org.pe/
  fetched: '2026-11-03'
  quote: Trabajo de tecnología de drones
- claim: Its GBIF record says it manages the Los Amigos Conservation Concession.
  url: https://api.gbif.org/v1/organization/7412f07b-efce-435a-9f81-17e76d6e3bef
  fetched: '2026-11-03'
  quote: ACCA manages the Los Amigos Conservation Concession
- claim: Its GBIF record names science and technology for conservation, including real-time
    monitoring such as MAAP, as one of its four programme areas.
  url: https://api.gbif.org/v1/organization/7412f07b-efce-435a-9f81-17e76d6e3bef
  fetched: '2026-11-03'
  quote: (4) science and technology for conservation, driving innovation and real-time monitoring
    (e.g., MAAP—Monitoring of the Andean Amazon Project) to address threats such as deforestation
- claim: Its GBIF record gives an address in Miraflores, Lima.
  url: https://api.gbif.org/v1/organization/7412f07b-efce-435a-9f81-17e76d6e3bef
  fetched: '2026-11-03'
  quote: '"city":"Lima","province":"Lima","country":"PE"'
