summary: American Bird Conservancy says it helped this organisation (founded 2000)
  create nine community-managed conservation areas spanning 21,285 acres in the Cordillera
  Vilcanota and plant over 1.5 million Polylepis trees.
facts:
- claim: American Bird Conservancy says ECOAN, founded in 2000, has with ABC worked
    on protecting and restoring the forests of the Cordillera Vilcanota, creating
    nine private, community-managed conservation areas of 21,285 acres and planting
    over 1.5 million Polylepis trees.
  url: https://abcbirds.org/news/milestone-trail-network-and-tree-nurseries-improving-lives-in-the-high-andes/
  fetched: '2026-11-17'
  quote: accomplishments include the creation of nine private, community-managed conservation
    areas spanning 21,285 acres
- claim: In 2020, American Bird Conservancy reported that ECOAN and the communities
    developed the annual Queuña Raymi reforestation event and that it depended on
    a network of nurseries. ECOAN and community members built a new nursery at Abra
    Málaga Thastayoc.
  url: https://abcbirds.org/news/milestone-trail-network-and-tree-nurseries-improving-lives-in-the-high-andes/
  fetched: '2026-11-17'
  quote: ECOAN and community members constructed a new nursery with a capacity of
    25,000 plants at Abra Málaga Thastayoc
- claim: A CEPF safeguards document says ECOAN established the Abra Patricia reserve
    in 2005 and that the reserve protected more than 25,000 acres when the document
    was written.
  url: https://www.cepf.net/sites/default/files/66164-social-awareness-and-process-framework.pdf
  fetched: '2026-11-17'
  quote: La reserva Abra Patricia ahora protege más de 25, 000 acres
