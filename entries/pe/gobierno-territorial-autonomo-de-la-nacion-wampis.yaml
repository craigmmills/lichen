summary: Mongabay says 27 communities’ representatives declared this Wampis government
  on 29 November 2015 to defend their territory from extractive industries and that
  economic activity there required Wampis consent.
facts:
- claim: Mongabay reports that representatives of 27 Wampis communities declared the
    Wampis Nation autonomous territorial government on 29 November 2015 to defend
    their territory and resources from extractive industries.
  url: https://news.mongabay.com/2019/04/perus-first-autonomous-indigenous-govt-strikes-back-against-deforestation/?n3wsletter
  fetched: '2026-11-17'
  quote: declared the creation of an autonomous territorial government called the
    Wampis Nation – the first of its kind in Peru – to defend its territory and resources
    from the growing pressures of extractive industries.
- claim: In 2019, Mongabay quoted Shámpion Noningo, then technical director of the
    Wampis territorial government, saying they wanted to manage their territory and
    had the partnership of the Peruvian government. Mongabay also reported that economic
    activity in the territory required Wampis consent.
  url: https://news.mongabay.com/2019/04/perus-first-autonomous-indigenous-govt-strikes-back-against-deforestation/?n3wsletter
  fetched: '2026-11-17'
  quote: We do not want independence, but to manage our territory, and we have the
    partnership of the government of Peru.
