summary: Satellite tool built and run by ACCA using NASA geospatial technology and Sentinel-1 imagery
  for near-real-time deforestation and mining information, with gold mining alerts in Madre de Dios.
facts:
- claim: A satellite monitoring tool built with NASA geospatial technology to produce near-real-time information
    on deforestation and mining in the southern Peruvian Amazon.
  url: https://acca.org.pe/radarminingmonitoring-rami/
  fetched: 2026-11-03
  quote: es una herramienta de monitoreo satelital, diseñada con tecnología geoespacial de la NASA, que
    tiene como objetivo principal la generación de información en tiempo casi real sobre la deforestación
    y la actividad minera en el sur de la Amazonía peruana.
- claim: Uses Sentinel-1 radar imagery from the European Space Agency, which sees through cloud.
  url: https://acca.org.pe/radarminingmonitoring-rami/
  fetched: 2026-11-03
  quote: a través del radar Sentinel-1, de la agencia espacial europea (ESA)
- claim: Focused on detecting the advance of gold mining in Madre de Dios.
  url: https://acca.org.pe/radarminingmonitoring-rami/
  fetched: 2026-11-03
  quote: Este sistema de monitoreo está enfocado en detectar el avance de la minería de oro en la región
