summary: Kandozi territorial government that Caretas reported in February 2026 was
  on the TICCA follow-up committee after over 200 leaders from 54 communities agreed
  to protect 1,030,000 hectares in Loreto.
facts:
- claim: Caretas reports that more than 200 leaders from 54 Kandozi communities agreed
    to protect 1,030,000 hectares of ancestral territory in Loreto through international
    TICCA recognition.
  url: https://caretas.pe/?p=791471
  fetched: '2026-11-17'
  quote: Más de 200 líderes de 54 comunidades del pueblo Kandozi acordaron proteger
    1,030,000 hectáreas de territorio ancestral en Loreto mediante el reconocimiento
    internacional TICCA
- claim: In February 2026, Caretas reported that a follow-up committee had been formed
    with GTA Kandozi, CORPI SL and AIDESEP, alongside technical allies including Nature
    and Culture International and WWF. The committee was to lead the international
    TICCA registration process.
