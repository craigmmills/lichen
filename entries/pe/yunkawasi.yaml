summary: An organisation Mongabay reports led an eight-month thermal drone trial with community
  monitors, whose director ACCA reports presented a monkey detection drone project at AmazonTEC
  2026.
facts:
- claim: In March 2026, Mongabay described Yunkawasi as an organisation dedicated to protecting
    the yellow-tailed woolly monkey that worked with community monitors on an eight-month
    trial combining ground tracking with aerial surveillance.
  url: https://es.mongabay.com/2026/03/peru-monitores-comunitarios-dron-siguen-rastro-mono-choro-cola-amarilla/
  fetched: 2026-11-03
  quote: junto con especialistas de Yunkawasi —organización dedicada a la protección del mono
    choro cola amarilla—, pusieron en marcha un programa de monitoreo que combina el seguimiento
    de la especie desde tierra con la vigilancia desde el aire
- claim: Mongabay reports that the eight-month thermal drone trial was led by Yunkawasi with
    the monitoring committee of the Asociación de Conservación Oso Dorado.
  url: https://es.mongabay.com/2026/03/peru-monitores-comunitarios-dron-siguen-rastro-mono-choro-cola-amarilla/
  fetched: 2026-11-03
  quote: Esta experiencia duró ocho meses y estuvo a cargo de la organización Yunkawasi en
    coordinación con el comité de monitoreo de la Asociación de Conservación Oso Dorado
- claim: ACCA reports that Yunkawasi's director presented a project at AmazonTEC 2026 using
    thermal-sensor drones to detect yellow-tailed woolly monkey populations.
  url: https://acca.org.pe/amazontec-2026-como-los-drones-y-la-inteligencia-artificial-se-usan-para-enfrentar-la-deforestacion-y-restaurar-la-amazonia/
  fetched: 2026-11-03
  quote: la directora ejecutiva de Yunkawasi presentó un innovador proyecto en los Andes peruanos
    que utiliza drones con sensores térmicos para detectar poblaciones del mono choro de cola
    amarilla
