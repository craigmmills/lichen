summary: IIAP-run laboratory that analyses drone, satellite, sensor and acoustic data, including automatic
  palm counts from drone images published in Nature Communications and species identification from forest
  recordings.
facts:
- claim: Caretas reports that the laboratory can analyse acoustic recordings from Amazon forests, identifying
    animal species from their sounds.
  url: https://caretas.pe/?p=812882
  fetched: 2026-11-03
  quote: Uno de los desarrollos más destacados del laboratorio consiste en la capacidad de analizar grabaciones
    acústicas realizadas en los bosques amazónicos.
- claim: Caretas reports that the laboratory has the Manatí supercomputer and other high-performance processing
    systems.
  url: https://caretas.pe/medio-ambiente/iiap-utiliza-inteligencia-artificial-para-medir-el-impacto-humano-en-la-biodiversidad-amazonica/
  fetched: 2026-11-03
  quote: El estudio cuenta con el respaldo del Laboratorio de Inteligencia Artificial del IIAP , que dispone
    de la supercomputadora Manatí y otros sistemas de procesamiento de alto rendimiento
- claim: The environment ministry says the laboratory develops tools that turn large volumes of forest
    data, images and sounds into information for biodiversity conservation.
  url: https://www.gob.pe/institucion/minam/noticias/1400660-minam-iiap-incorpora-inteligencia-artificial-que-convierte-datos-imagenes-y-sonidos-del-bosque-en-informacion-para-cuidar-la-amazonia
  fetched: 2026-11-03
  quote: Desde su Laboratorio de Inteligencia Artificial, desarrolla herramientas innovadoras que convierten
    grandes volúmenes de datos, imágenes y sonidos del bosque en información estratégica para la conservación
    de la biodiversidad
- claim: Analyses large volumes of data from drones, satellites, phones, environmental sensors and acoustic
    recordings.
  url: https://www.gob.pe/institucion/iiap/noticias/1195843-iiap-impulsa-la-conservacion-amazonica-con-inteligencia-artificial-aplicada-a-problemas-criticos-del-ambiente
  fetched: 2026-11-03
  quote: Este laboratorio aplica tecnologías emergentes para analizar grandes volúmenes de información
    obtenida mediante drones, satélites, celulares, sensores ambientales y grabaciones acústicas.
- claim: Counts aguaje, ungurahui and huasaí palms automatically from drone images, work published in
    Nature Communications.
  url: https://www.gob.pe/institucion/iiap/noticias/1195843-iiap-impulsa-la-conservacion-amazonica-con-inteligencia-artificial-aplicada-a-problemas-criticos-del-ambiente
  fetched: 2026-11-03
  quote: el conteo automatizado de palmeras como el aguaje, ungurahui y huasaí mediante imágenes de drones
    y algoritmos de IA. Este trabajo ha sido publicado en la revista Nature Communications
- claim: Uses AI to identify species from forest recordings and to separate human, natural and biological
    noise, including logging and mining.
  url: https://www.gob.pe/institucion/minam/noticias/1400660-minam-iiap-incorpora-inteligencia-artificial-que-convierte-datos-imagenes-y-sonidos-del-bosque-en-informacion-para-cuidar-la-amazonia
  fetched: 2026-11-03
  quote: Esta tecnología también distingue entre ruidos de origen humano, natural y biológico
