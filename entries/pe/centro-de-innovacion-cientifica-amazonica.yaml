facts:
- claim: Describes itself as a research and innovation institution in the Amazon that builds
    scientific capacity and knowledge for productive and environmental management.
  url: https://cincia.org/acerca-de-nosotros/
  fetched: 2026-11-03
  quote: Institución referente en investigación e innovación en la Amazonía, genera capacidad
    y conocimiento científico, integrándolas en las iniciativas de gestión productiva y ambiental
- claim: Has a laboratory of artificial intelligence, drones and spatial analysis.
  url: https://cincia.org/acerca-de-nosotros/
  fetched: 2026-11-03
  quote: Responsable del Laboratorio de Inteligencia Artificial, Drones y Análisis Espacial
- claim: AmazonTEC lists a 2026 presentation from CINCIA on drones for planning the restoration
    of Amazonian landscapes.
  url: https://amazontec.pe/presentaciones/
  fetched: 2026-11-03
  quote: 'Drones para la planificación de la restauración de paisajes amazónicos Presentado
    por Martin Pillaca Institución: Centro de Innovación Científica Amazónica – CINCIA'
- claim: Office in Puerto Maldonado and a base in Iquitos.
  url: https://cincia.org/acerca-de-nosotros/
  fetched: 2026-11-03
  quote: 'Oficina Madre de Dios: Av. Ucayali Mz 4-Z Lt. 9-A | Puerto Maldonado, Madre de Dios,
    Perú'
- claim: Wake Forest's Sabin Center says CINCIA was established in 2016 by Wake Forest conservation
    biologist Miles Silman.
  url: https://sabincenter.wfu.edu/2022/08/cees-researchers-share-results-of-nasa-funded-research-with-key-scientific-collaborators-in-madre-de-dios-peru/
  fetched: 2026-11-03
  quote: Madre de Dios is home to the Centro de Innovación Científica Amazónica (CINCIA),
    known in English as the Center for Amazonian Scientific Innovation, established by Wake
    Forest University conservation biologist and CEES founding director, Miles Silman, in
    2016.
- claim: Runs a Laboratory of Artificial Intelligence, Drones and Spatial Analysis (LIDAE),
    which it describes as Peru's most advanced drone programme, with AI-enhanced analysis
    of satellite data to detect mining impacts.
  url: https://cincia.org/ciencia/
  fetched: 2026-11-03
  quote: Es el programa de drones más avanzado del Perú con la capacidad de análisis mejorada
    por IA de datos satelitales multisensor y de alta resolución para optimizar la detección
    de los impactos de la minería en los paisajes amazónicos.
