facts:
- claim: In June 2020, Actualidad Ambiental reported that Gran Mirador de Juningue
    had been protected as a conservation concession and said this would help the Juningue
    hamlet’s ronda campesina guard its biodiversity.
  url: https://www.actualidadambiental.pe/san-martin-crean-concesion-de-conservacion-que-protegera-la-biodiversidad-de-moyobamba
  fetched: '2026-11-17'
  quote: Este es un sueño cumplido para la ronda campesina del caserío de Juningue
    porque ahora podrán resguardar de mejor manera la rica biodiversidad de esta zona.
- claim: The same page says the concession covers 635.46 hectares of humid forest
    and was granted for 40 renewable years, with the ronda campesina, with AMPA and
    the regional environmental authority, working on it for over two years.
  url: https://www.actualidadambiental.pe/san-martin-crean-concesion-de-conservacion-que-protegera-la-biodiversidad-de-moyobamba
