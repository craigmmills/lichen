summary: An organisation ANECAP says was formed in 2005 to represent native communities, signing
  its administration contract in 2006, and a co-creator of the Earth Defenders Toolkit.
facts:
- claim: ANECAP says ECA Amarakaeri was constituted in 2005 to represent native communities
    and signed its administration contract in 2006, with its office in Puerto Maldonado.
  url: https://www.anecap.org/ejecutores/eca-amarakaeri/
  fetched: 2026-11-03
  quote: El 18 de diciembre de 2006 el ECA firmó su contrato de administración. Su oficina
    se encuentra en la ciudad de Puerto Maldonado (Madre de Dios).
- claim: ANECAP says its members include FENAMAD and COHARYIMA as well as ten native communities.
  url: https://www.anecap.org/ejecutores/eca-amarakaeri/
  fetched: 2026-11-03
  quote: 'Además de estas 10 CCNN, también está conformado por dos OOII: la Federación Nativa
    del Río Madre de Dios y Afluentes (FENAMAD) y el Consejo Harakbut Yine Matsiguenka (COHARYIMA).'
- claim: Named by Digital Democracy as a co-creator of the Earth Defenders Toolkit.
  url: https://www.earthdefenderstoolkit.com/about/
  fetched: 2026-11-03
  quote: The Earth Defenders Toolkit is a project of Digital Democracy and co-created by Alianza
    Ceibo , Amazon Conservation Team , Amazon Frontlines , ECA Amarakaeri
- claim: Awana Digital says it coordinates communal guards from ten communities who, with
    Sernanp park rangers, use Mapeo to monitor and map threats such as illegal gold mining
    and logging.
  url: https://awana.digital/partners/eca-amarakaeri
  fetched: 2026-11-03
  quote: ECA Amarakaeri coordinates a team of communal guards from the ten Harakbut, Yine
    and Matsigenka communities surrounding the reserve. Together with SERNANP’s park ranger,
    they use Mapeo to monitor and map the threats that the area is facing
- claim: Awana Digital says it co-manages the Amarakaeri Communal Reserve with Sernanp.
  url: https://awana.digital/partners/eca-amarakaeri
  fetched: 2026-11-03
  quote: is an Indigenous-led team that comanages the Reserve alongside the National Service
    of Protected Areas (SERNANP).
