summary: Private aerospace company that says it designs its own drones for conservation, and
  that ACCA names as a co-organiser of AmazonTEC 2026.
facts:
- claim: ACCA names it as a co-organiser of AmazonTEC 2026.
  url: https://acca.org.pe/amazontec-2026-como-los-drones-y-la-inteligencia-artificial-se-usan-para-enfrentar-la-deforestacion-y-restaurar-la-amazonia/
  fetched: 2026-11-03
  quote: en coorganización con el CITE Productivo Madre de Dios , YUNKAWASI , Centro de Innovación
    Científica Amazónica y Linn Aerospace Perú.
- claim: ACCA describes Linn Aerospace as a drone company whose manager demonstrated drone
    applications at the event.
  url: https://acca.org.pe/amazontec-2026-como-los-drones-y-la-inteligencia-artificial-se-usan-para-enfrentar-la-deforestacion-y-restaurar-la-amazonia/
  fetched: 2026-11-03
  quote: tal como lo demostraron los especialistas de ACCA así como el gerente de la empresa
    de drones Linn Aerospace.
- claim: Says it is a private company specialising in aerospace technology applied to conservation,
    development and commercial activities, and designs and builds its own drones.
  url: https://linnaero.pe/
  fetched: 2026-11-03
  quote: Somos una empresa privada especializada en tecnología aeroespacial y enfocada en
    la aplicación de ésta en actividades de conservación, desarrollo y actividades comerciales.
- claim: Lists macaw nest monitoring among its representative projects.
  url: https://linnaero.pe/
  fetched: 2026-11-03
  quote: Monitoreo de nidos de guacamayos
- claim: Lists a multispectral survey of the Pampas del Heath under remote sensing and surveillance.
  url: https://linnaero.pe/
  fetched: 2026-11-03
  quote: Pampas del Heath Multiespectral Teledetección y vigilancia
- claim: Andina reports that its experts took part in a Sernanp workshop on guidelines for
    drone use in protected areas.
  url: https://andina.pe/ingles/noticia-usaran-drones-para-optimizar-monitoreo-las-areas-naturales-protegidas-827090.aspx
  fetched: 2026-11-03
  quote: especialistas y guardaparques del Sernanp con expertos del San Diego Zoo Global Peru
    y Linn Aerospace Peru, iniciaron el establecimiento de los lineamientos del uso de drones.
- claim: AmazonTEC lists a 2026 talk by David Segurado of Linn Aerospace on new sensors and
    methods for biodiversity monitoring.
  url: https://amazontec.pe/presentaciones/
  fetched: 2026-11-03
  quote: 'Nuevos Sensores y métodos para el monitoreo de la biodiversidad Presentado por David
    Segurado Institución: Linn Aerospace'
