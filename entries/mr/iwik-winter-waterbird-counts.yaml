summary: Annual winter waterbird counts in the Iwik region of Banc d'Arguin park,
  run by NIOZ since December 2003, recorded numbers falling from 120,000 to 80,000
  between 2003 and 2023.
facts:
- claim: Teams from NIOZ have carried out winter counts in the Iwik region of the
    park every year since December 2003.
  url: https://www.waderstudygroup.org/news/spotlight-two-decades-of-monitoring-in-mauritania-2/
  fetched: 2026-11-15
  quote: teams from the Royal Netherlands Institute for Sea Research (NIOZ) have conducted
    winter counts within the Iwik region of PNBA every year since December 2003
- claim: For the 2003–2023 study, the area around Iwik was split into six counting
    units covering all roost sites.
  url: https://www.waderstudygroup.org/news/spotlight-two-decades-of-monitoring-in-mauritania-2/
  fetched: 2026-11-15
  quote: The study area around the village of Iwik was subdivided into six counting
    units that covered all the roost sites
- claim: Between 2003 and 2023, waterbird numbers in the Iwik study area fell from
    120,000 to 80,000.
  url: https://www.waderstudygroup.org/news/spotlight-two-decades-of-monitoring-in-mauritania-2/
  fetched: 2026-11-15
  quote: waterbird numbers decreased from 120,000 to 80,000 birds in the Iwik study
    area
