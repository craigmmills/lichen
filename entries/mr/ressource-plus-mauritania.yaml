id: ressource-plus-mauritania
kind: project
name: RESSOURCE+ in Mauritania
also_known_as:
- Renforcement d’expertise au sud du Sahara sur les oiseaux d'eau et leur utilisation
  rationnelle en faveur des communautés et de leur environnement
scope: mr
ai_label: conservation-tech
realms:
- freshwater
techniques: []
countries: []
status: active
summary: An active project, run by the Sustainable Wildlife Management Programme and
  funded by the French Global Environment Facility, whose agreement was signed on
  13 January 2026 and which plans tests of AI-assisted drone and satellite waterbird
  counting in Senegal River valley wetlands.
facts:
- claim: The EU delegation's project page says the Mauritania project agreement was
    signed by the environment minister on 13 January 2026.
  url: https://www.eeas.europa.eu/delegations/mauritanie/ressource-renforcement-d%E2%80%99expertise-au-sud-du-sahara-sur-les-oiseaux-deau-et-leur-utilisation_fr
  fetched: 2026-11-13
  quote: Ministre de l’Environnement et du Développement Durable de la Mauritanie,
    le 13 janvier 2026.
- claim: Planned activities in pilot inland wetlands in Mauritania's Senegal River
    valley include targeted support to waterbird counts and tests of AI-assisted drone
    and satellite counting methods.
  url: https://www.eeas.europa.eu/delegations/mauritanie/ressource-renforcement-d%E2%80%99expertise-au-sud-du-sahara-sur-les-oiseaux-deau-et-leur-utilisation_fr
  fetched: 2026-11-13
  quote: tests de méthodes innovantes de dénombrement par télédétection (drone et
    satellitaire) assistées par IA
- claim: Planned activities include support to updating national wetland inventories.
  url: https://www.eeas.europa.eu/delegations/mauritanie/ressource-renforcement-d%E2%80%99expertise-au-sud-du-sahara-sur-les-oiseaux-deau-et-leur-utilisation_fr
  fetched: 2026-11-13
  quote: Appui à l’actualisation des inventaires nationaux des zones humides
- claim: The page says all project activities will be carried out in close partnership
    with the ministry's directorate for the coast, wetlands and protected areas (DiLZAP).
  url: https://www.eeas.europa.eu/delegations/mauritanie/ressource-renforcement-d%E2%80%99expertise-au-sud-du-sahara-sur-les-oiseaux-deau-et-leur-utilisation_fr
  fetched: 2026-11-13
  quote: Toutes les activités du projet seront mises en œuvre en partenariat étroit
    avec la Direction de la Protection du Littoral, des Zones Humides et des Aires
    Protégées (DiLZAP).
- claim: The page lists the project as under way.
  url: https://www.eeas.europa.eu/delegations/mauritanie/ressource-renforcement-d%E2%80%99expertise-au-sud-du-sahara-sur-les-oiseaux-deau-et-leur-utilisation_fr
  fetched: 2026-11-13
  quote: En cours
- claim: The SWM Programme's page on its Sahelian wetlands site, which names Mauritania
    among the project's countries, says RESSOURCE+ activities are coordinated by FAO
    and implemented by technical partners.
  url: https://www.fao.org/in-action/swm-programme/where-we-work/sahelian-wetlands/en
  fetched: 2026-11-14
  quote: The RESSOURCE+ activities, coordinated by FAO, are implemented by technical
    partners recognized for their expertise
