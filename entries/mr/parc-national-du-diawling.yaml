summary: A Mauritanian national park whose eco-guards received waterbird monitoring
  training, with a planned ornithological station agreed with Nature Mauritanie and
  OrnithoSchool, and a 2017 census report giving 122,259 birds counted there.
facts:
- claim: A 2019 AEWA news item says a project contributed to the waterbird monitoring
    capacity of the park's eco-guards.
  url: https://www.unep-aewa.org/en/news/capacity-waterbird-monitoring-reinforced-mauritania
  fetched: 2026-11-13
  quote: The project thus contributed to enhancing the technical capacity for waterbird
    monitoring of PND eco-guards
- claim: The same item says the park co-delivered a waterbird identification and monitoring
    course with AMISO, BirdLife International and Nature Mauritanie.
  url: https://www.unep-aewa.org/en/news/capacity-waterbird-monitoring-reinforced-mauritania
  fetched: 2026-11-13
  quote: The training was jointly organized and delivered by AMISO, Diawling National
    Park, BirdLife International
- claim: The park, Nature Mauritanie and the OrnithoSchool network signed an agreement
    to create an ornithological station, which will conduct ornithological research.
  url: https://birdring.net/?p=4883
  fetched: 2026-11-13
  quote: Diawling National Park, the NGO Nature Mauritania, and the OrnithoSchool
    Bird Observatory network have signed a tripartite agreement for the creation of
    Mauritania’s first ornithological station
- claim: A representative of the park joined a September 2025 aquatic warbler survey
    and ringing mission in southern Mauritania.
  url: https://europe.wetlands.org/mauritania-braving-heat-and-humidity-to-study-aquatic-warblers/
  fetched: 2026-11-13
  quote: a representative from the National Park Diawling
- claim: The 2017 Wadden Sea Flyway Initiative census report has a chapter on the
    park and gives a total of 122,259 birds counted there.
  url: https://www.waddensea-worldheritage.org/sites/default/files/2017_Flyway%20census%20report_0.pdf
  fetched: 2026-11-14
  quote: 'Le Parc National du Diawling: 122 259 indi'
- claim: Fondation Ensemble's page on a 2015 to 2020 project in the park says its
    final report found monthly ecological monitoring of biodiversity in place through
    a new observation system.
  url: https://www.fondationensemble.org/en/projet/conservation-de-la-biodiversite-du-parc-national-du-diawling-par-la-gestion-durable-et-participative/
  fetched: 2026-11-14
  quote: Monthly ecological monitoring of biodiversity is now ensured, thanks to the
    creation of an observation system.
