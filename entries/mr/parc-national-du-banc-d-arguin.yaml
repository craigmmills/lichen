  url: https://www.waderstudygroup.org/?p=18492
  fetched: 2026-11-12
  quote: Based on yearly systematic counts that started in 2003 at the Iwik peninsula of Banc d’Arguin,
    we evaluated temporal changes in the numbers of waterbirds, including shorebirds, wading birds, pelicans,
    cormorants, gulls and terns, over a period of 21 years.
