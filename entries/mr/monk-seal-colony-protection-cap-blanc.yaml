summary: A closed 2014 to 2016 project, partnered with IUCN Save Our Species and the
  CBD Habitat Foundation, to support surveillance of a Mauritanian monk seal reserve;
  IUCN reported 67 births in 2014 and growth from 109 to 250 animals.
facts:
- claim: An IUCN story of November 2014 says the project team counted 67 seal births
    at the colony that season.
  url: https://www.iucn.org/content/best-breeding-season-yet-mediterranean-monk-seal-colony
  fetched: 2026-11-14
  quote: So far the project team have counted 67 seal births at the colony and the
    2014 breeding season has not yet closed!
- claim: The same story says the colony grew from 109 to 250 animals since conservation
    work began in the late 1990s.
  url: https://www.iucn.org/content/best-breeding-season-yet-mediterranean-monk-seal-colony
  fetched: 2026-11-14
  quote: the colony’s population has more than doubled from 109 to 250 animals
- claim: Fondation Segré lists the project with a 2014 to 2016 timeframe.
  url: https://www.fondationsegre.org/protection-of-the-mediterranean-monk-seal-colony-of-the-cabo-blanco-peninsula-in-mauritania/
  fetched: 2026-11-14
  quote: 'Timeframe: 2014-2016'
- claim: Fondation Segré lists IUCN Save Our Species and the CBD Habitat Foundation
    as the project's partners.
  url: https://www.fondationsegre.org/protection-of-the-mediterranean-monk-seal-colony-of-the-cabo-blanco-peninsula-in-mauritania/
  fetched: 2026-11-14
  quote: 'Partner: IUCN Save Our Species // CBD Habitat Foundation'
- claim: The project was to support permanent surveillance of the participative reserve
    "Coast of the Seals".
  url: https://www.fondationsegre.org/protection-of-the-mediterranean-monk-seal-colony-of-the-cabo-blanco-peninsula-in-mauritania/
  fetched: 2026-11-14
  quote: Support a permanent surveillance of the participative reserve “Coast of the
    Seals”
