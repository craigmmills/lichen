summary: The park's observatory, run by the national park, coordinates and monitors
  its indicators and produces and stores data, but its 2025 to 2029 management plan
  notes it has no online database covering all themes.
facts:
- claim: The 2025 to 2029 management plan says the observatory coordinates and monitors
    the park's indicators.
  url: https://pnba.mr/wp-content/uploads/2025/12/PAG-PNBA-2025-2029-decembre-2025-VF.pdf
  fetched: 2026-11-13
  quote: L’Observatoire du PNBA est chargé de la coordination et du suivi de ces indicateurs.
- claim: The plan says the observatory has a key role in producing and storing data.
  url: https://pnba.mr/wp-content/uploads/2025/12/PAG-PNBA-2025-2029-decembre-2025-VF.pdf
  fetched: 2026-11-13
  quote: L’Observatoire joue également un rôle clé dans la capitalisation des données
    (production, stockage
- claim: The plan says the observatory ran the monitoring of sea turtle strandings
    in the park.
  url: https://pnba.mr/wp-content/uploads/2025/12/PAG-PNBA-2025-2029-decembre-2025-VF.pdf
  fetched: 2026-11-13
  quote: l’échouage des tortues marines au PNBA, mené par l’Observatoire du parc
- claim: The plan notes the observatory has no online database covering all of the
    park's themes.
  url: https://pnba.mr/wp-content/uploads/2025/12/PAG-PNBA-2025-2029-decembre-2025-VF.pdf
  fetched: 2026-11-13
  quote: L’Observatoire ne dispose pas d’une base de données en ligne où toutes les
    thématiques du PNBA
- claim: The park's 2024 dashboard report, which tracks its monitoring indicators,
    was produced by the observatory department.
  url: https://pnba.mr/wp-content/uploads/2025/11/Rapport-TDB-VF-2024.pdf
  fetched: 2026-11-14
  quote: Le présent document a été réalisé par le Département de l’Observatoire du
    Parc National du Banc d’Arguin
- claim: The 2024 dashboard says collected data are sent monthly to the observatory
    department.
  url: https://pnba.mr/wp-content/uploads/2025/11/Rapport-TDB-VF-2024.pdf
  fetched: 2026-11-14
  quote: Les données collectées sont transmises mensuellement au Département de l’Observatoire
