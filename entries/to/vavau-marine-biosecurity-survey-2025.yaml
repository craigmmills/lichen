summary: Marine biosecurity survey and training in Vava'u, run by Earth Sciences NZ
  in November 2025, the programme's first fieldwork; 102 specimens were taken to New
  Zealand for analysis.
facts:
- claim: In November 2025 Earth Sciences NZ completed a marine biosecurity survey
    and training programme in Vava'u, the first field activities under the Protect
    Our Marine Areas programme.
  url: https://niwa.co.nz/pacific/pasifika-panui/issue-3-march-2026/strengthening-pacific-marine-biosecurity
  fetched: 2026-11-14
  quote: In November 2025, Earth Sciences NZ completed the first field activities
    under POMA through a successful marine biosecurity survey and training programme
    in Vava’u, Tonga.
- claim: The team collected 102 marine specimens and took them to New Zealand for
    identification and molecular analysis.
  url: https://niwa.co.nz/pacific/pasifika-panui/issue-3-march-2026/strengthening-pacific-marine-biosecurity
  fetched: 2026-11-14
  quote: A total of 102 marine specimens were collected and safely imported into New
    Zealand for identification and molecular analysis.
- claim: The wider Protect Our Marine Areas programme aims to prevent the spread of
    marine invasive species from high-risk areas such as ports and marinas to ecologically
    and culturally significant sites.
  url: https://niwa.co.nz/pacific/pasifika-panui/issue-3-march-2026/strengthening-pacific-marine-biosecurity
  fetched: 2026-11-14
  quote: to prevent the spread of marine invasive species from high-risk areas such
    as ports and marinas to ecologically and culturally significant sites
