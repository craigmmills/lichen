summary: A closed 2019 to 2021 project, funded by the Italian Ministry of the Environment,
  Land and Sea, in which ENEA mapped over 998 km2 of Tongan marine coastal habitat
  from Copernicus satellite images.
facts:
- claim: ENEA's project page gives the period as 2019 to 2021 and says the project
    was funded by the Italian Ministry of the Environment, Land and Sea.
  url: https://www.atlanteperlacooperazioneallosviluppo.enea.it/en/projects/strengthening-protected-area-management-in-the-kingdom-of-tonga.html
  fetched: 2026-11-15
  quote: Funded by the Italian Ministry of the Environment, Land and Sea, the project
    is aimed at encouraging the management of coastal areas by monitoring and protecting
    the most valuable coastal habitats
- claim: ENEA's activities were satellite imagery interpretation for digital mapping
    of Tonga's marine coastal habitat and monitoring of habitat change.
  url: https://www.atlanteperlacooperazioneallosviluppo.enea.it/en/projects/strengthening-protected-area-management-in-the-kingdom-of-tonga.html
  fetched: 2026-11-15
  quote: Satellite imagery interpretation for the digital mapping of the marine coastal
    habitat of Tonga
- claim: The page lists monitoring of the habitat's change among ENEA's activities.
  url: https://www.atlanteperlacooperazioneallosviluppo.enea.it/en/projects/strengthening-protected-area-management-in-the-kingdom-of-tonga.html
  fetched: 2026-11-15
  quote: Monitoring of the habitat’s change
- claim: ENEA says over 998 km2 of marine coastal habitat was mapped in Tonga, about
    40% of it valuable habitat with the maximum Ecological Quality Index value.
  url: https://www.media.enea.it/en/press-releases-and-news/years-archive/year-2023/climate-cop28-enea-presents-atlas-of-marine-and-coastal-habitats.html
  fetched: 2026-11-15
  quote: for the archipelago of the Kingdom of Tonga, over 998 km2 of marine-coastal
    habitats were mapped
- claim: ENEA says the atlases were made by processing Copernicus satellite images
    and are queryable and updatable on QGIS.
  url: https://www.media.enea.it/en/press-releases-and-news/years-archive/year-2023/climate-cop28-enea-presents-atlas-of-marine-and-coastal-habitats.html
  fetched: 2026-11-15
  quote: dynamic, queryable and updatable on the QGiS platform, created by processing
    satellite images of the Copernicus Project
