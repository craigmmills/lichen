facts:
- claim: A five-day monitoring visit to Late Island in May 2024 was carried out by
    a Vava'u association, Tonga's Department of Environment and Island Conservation,
    the technical lead for the PRISMSS Predator Free Pacific Programme.
  url: https://www.islandconservation.org/tongas-late-island-shows-promising-results/
  fetched: 2026-11-14
  quote: During a recent monitoring visit to Late Island in May 2024, conducted by
    members of the Vava’u Protection Association , Tonga Department of Environment
    , and Island Conservation as the technical lead for the PRISMSS Predator Free
    Pacific (PFP) Programme
- claim: The team re-deployed biodiversity monitors, including camera traps and acoustic
    recorders, to assess native species populations.
  url: https://www.islandconservation.org/tongas-late-island-shows-promising-results/
  fetched: 2026-11-14
  quote: the team worked on re-deploying biodiversity monitors, including camera traps
    and acoustic recorders, programmed to continuously assess native species population
    dynamics
- claim: A bird point-count survey found the number of birds had doubled in nine months
    after rat removal.
  url: https://www.islandconservation.org/tongas-late-island-shows-promising-results/
  fetched: 2026-11-14
  quote: a bird point-count survey was conducted during the five-day monitoring visit,
    demonstrating that the number of birds on Late Island had doubled in just nine
    short months
