summary: Tonga's environment department, established in 2001 according to GBIF, has published 17 datasets
  there and, as reported by Island Conservation, had staff help with a 2024 project and a May 2024 Late
  Island monitoring visit.
facts:
- claim: GBIF's publisher record says the department was established in 2001 with a mission to promote
    the conservation of biological diversity and sustainable use of natural resources.
  url: https://api.gbif.org/v1/organization/43160fcd-f183-4d8f-b629-d13c982f1abe
  fetched: 2026-11-12
  quote: The Department of Environment was established in 2001 with a mission to promote the conservation
    of biological diversity, sustainable use and management of natural resources, whilst maintaining ecosystem
    services.
- claim: GBIF's record gives its address as Vuna Road, Nuku'alofa.
  url: https://api.gbif.org/v1/organization/43160fcd-f183-4d8f-b629-d13c982f1abe
  fetched: 2026-11-12
  quote: '"address":["Vuna Road"],"city":"Nukuálofa"'
- claim: GBIF's record shows 17 published datasets.
  url: https://api.gbif.org/v1/organization/43160fcd-f183-4d8f-b629-d13c982f1abe
  fetched: 2026-11-12
  quote: '"numPublishedDatasets":17'
- claim: Island Conservation says young staff from the Department of the Environment (MEIDECC) assisted
    in all phases of implementation of a 2024 project and were trained in the instruments used.
  url: https://www.islandconservation.org/?p=11488
  fetched: 2026-11-12
  quote: The implementation phase of the project included young women and man in their twenties from the
    Department of the Environment (MEIDECC) who assisted in all phases of the implementation
- claim: GCRMN acknowledges the Ministries of Fisheries and Environment of the Government of Tonga for
    providing coral reef monitoring data from Tonga for its Pacific status report.
  url: https://gcrmn.net/?p=5612
  fetched: 2026-11-12
  quote: We gratefully acknowledge the Ministries of Fisheries and Environment of the Government of Tonga
- claim: Island Conservation reports that department members took part in a five-day monitoring visit
    to Late Island in May 2024, which included a bird point-count survey after rat removal.
  url: https://www.islandconservation.org/tongas-late-island-shows-promising-results/
  fetched: 2026-11-12
  quote: During a recent monitoring visit to Late Island in May 2024, conducted by members of the Vava’u
    Protection Association , Tonga Department of Environment , and Island Conservation
