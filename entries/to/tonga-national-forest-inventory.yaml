summary: Active programme run by the Department of Forestry, with GGGI reporting it uses 50 cm satellite
  imagery and AI, and a 2024 pilot tree census that identified over 2.2 million trees on Tongatapu.
facts:
- claim: GGGI reports that it worked with the Tongan Department of Forestry on two activities to prepare
    the inventory in July 2024, the handover of the inventory document and training on satellite imagery.
  url: https://gggi.org/supporting-tongas-national-forest-inventory-preparation/
  fetched: 2026-11-12
  quote: In collaboration with the Tongan Department of Forestry , the Global Green Growth Institute (GGGI),
    as an implementing partner of the Regional Pacific NDC Hub, conducted two major activities to support
    the preparation of Tonga’s National Forest Inventory (NFI)
- claim: In July 2024, the acting head of the Forestry Division said the government was progressing towards
    the start of the inventory.
  url: https://gggi.org/supporting-tongas-national-forest-inventory-preparation/
  fetched: 2026-11-12
  quote: W e are progressing towards the start of our national forest inventory
- claim: In July 2024, GGGI said the preparation focused on assessing the carbon sequestration potential
    of forests and mangroves from satellite imagery.
  url: https://gggi.org/supporting-tongas-national-forest-inventory-preparation/
  fetched: 2026-11-12
  quote: The preparation also focuses on assessing the carbon sequestration potential of forests and mangroves
    through satellite imagery.
- claim: GGGI says the inventory uses high-resolution satellite imagery and advanced analysis, including
    50 cm imagery and artificial intelligence.
  url: https://gggi.org/multi-partner-consultation-strengthens-tongas-climate-readiness-in-agriculture-and-forestry-sector/
  fetched: 2026-11-12
  quote: The project uses high-resolution satellite imagery and advanced analysis, including 50cm resolution
    imagery and artificial intelligence, to generate a detailed inventory of forest resources.
- claim: GGGI says a pilot tree census completed in 2024 identified over 2.2 million trees on Tongatapu.
  url: https://gggi.org/multi-partner-consultation-strengthens-tongas-climate-readiness-in-agriculture-and-forestry-sector/
  fetched: 2026-11-12
  quote: A pilot tree census completed in 2024 identified over 2.2 million individual trees on Tongatapu
    alone
