- claim: Its stated objective is to develop local programmes for the Ministry of Fisheries
    and the association to monitor the status of Special Management Areas in Vava'u.
  url: https://www.waittfoundation.org/projects-2/vepa%3A-conservation-monitoring-and-assessment-in-tonga
  fetched: 2026-11-14
  quote: The overall objective of this project is to develop comprehensive local programs
    for the MoF and VEPA to monitor the status of Special Management Areas (SMAs)
    in the Vava’u Archipelago, Tonga.
- claim: The page says fishes needing species identification by genetic techniques
    are to be sent to the SAFS/Burke Museum Collection.
