summary: Pilot of the OroraTech satellite fire detection platform, described in a 24 June 2024 report
  as the first of its kind in Croatia, with county operations centre staff training begun and two weeks
  of summer use planned.
facts:
- claim: A report dated 24 June 2024 says training of Zadar county operations centre staff on the OroraTech
    early fire detection platform began in cooperation with New Age Solutions and Croatian fire bodies.
  url: https://zastita.info/hr/novosti/pocela-obuka-djelatnika-zoc-zadar-za-rad-s-ororatech-platformom-za-ranu%2C35652.html
  fetched: 2026-11-08
  quote: U Zadru, u ŽVOC-u, u suradnji s New Age Solutions OroraTech, Hrvatska vatrogasna zajednica, JVP
    Zadar i Vatrogasna zajednica Zadarske županije počela je obuka djelatnika županijskog operativnog
    centra Zadar za rad s Ororatech platformom za ranu detekciju požara iz svemira.
- claim: The 24 June 2024 report describes it as the first pilot of its kind in Croatia, with the application
    planned for two weeks of use that summer.
  url: https://zastita.info/hr/novosti/pocela-obuka-djelatnika-zoc-zadar-za-rad-s-ororatech-platformom-za-ranu%2C35652.html
  fetched: 2026-11-08
  quote: Aplikacija će se koristiti u ljetnom periodu, kada postoji najveća mogućnost nastanka požara,
    u trajanju od dva tjedna.
- claim: The planned training included integrating the platform with existing systems, including Croatian
    Forests’ video surveillance cameras.
  url: https://zastita.info/hr/novosti/pocela-obuka-djelatnika-zoc-zadar-za-rad-s-ororatech-platformom-za-ranu%2C35652.html
  fetched: 2026-11-08
  quote: Obuka će uključivati metode integracije Ororatech platforme s postojećim sustavima za nadzor
    i upravljanje u slučaju izvanrednih situacija (video nadzor - kamere Hrvatskih šuma, praćenje vatrogasnih
    vozila i osoba na intervencijama i dodatni GIS alati).
