facts:
- claim: Is the bird ringing centre for Croatia and has organised ringing since 1910.
  url: https://www.info.hazu.hr/jedinice/zavod-za-ornitologiju-u-zagrebu/znanstveno-prstenovanje-ptica/
  fetched: 2026-11-08
  quote: Zavod za ornitologiju je prstenovačka centrala za Hrvatsku, a organiziranjem prstenovanja od
    1910. predstavlja šestu prstenovački centralu u svijetu
- claim: Ringers send it their annual reports; it collects, digitises and analyses the data and sends
    its annual ringing report to EURING and other European ringing centres.
  url: https://www.info.hazu.hr/jedinice/zavod-za-ornitologiju-u-zagrebu/znanstveno-prstenovanje-ptica/
  fetched: 2026-11-08
  quote: U Zavodu se podaci prikupljaju, digitaliziraju i analiziraju. Kao rezultat dobivamo godišnji
    izvještaj o prstenovanju Zavoda, koji se potom šalje EURING-u, svim prstenovačkim centralama u Europi
    i svim suradnicima te se objavljuje u časopisu LARUS.
- claim: Works with about sixty ringers who ring around 30,000 birds a year, and has coordinated ringing
    in Croatia since 1991.
  url: https://www.info.hazu.hr/jedinice/zavod-za-ornitologiju-u-zagrebu/znanstveno-prstenovanje-ptica/
