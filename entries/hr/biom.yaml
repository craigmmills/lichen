summary: Organisation based in Zagreb that says it tested MegaDetector on about 70,000 photographs and
  videos from LIFE Artina seabird nests, and whose 2025 report describes GPS-transmitter bird monitoring.
facts:
- claim: Says it turned to artificial intelligence to process camera-trap data from seabird colonies.
  url: https://www.biom.hr/en/2025/12/05/using-ai-to-protect-adriatic-seabirds/
  fetched: 2026-11-08
  quote: For this reason, we turned to artificial intelligence as a new method of data processing in order
    to build upon existing knowledge of seabirds.
- claim: Says it tested MegaDetector on about 70,000 photographs and videos from LIFE Artina seabird nests.
  url: https://www.biom.hr/en/2025/12/05/using-ai-to-protect-adriatic-seabirds/
  fetched: 2026-11-08
  quote: we decided to test MegaDetector, one of the most widely used artificial-intelligence models for
    wildlife detection.
