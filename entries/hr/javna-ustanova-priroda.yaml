summary: In 2025, this county institution monitored all Kvarner griffon vulture colonies,
  tracked large carnivores using camera traps and tracks, and added field data to
  its information system using Mergin.
facts:
- claim: In 2025 the institution monitored all griffon vulture colonies in Kvarner.
  url: https://ju-priroda.hr/wp-content/uploads/2026/04/1.-Obrazlozenje-izvrsenja-rashoda-i-izdataka-razdjela-2025_JU-Priroda.html
  fetched: '2026-11-12'
  quote: Ustanova je tijekom godine provela monitoring svih kolonija bjeloglavih supova
    na Kvarneru.
- claim: Its routine monitoring in 2025 covered large carnivores, with emphasis on
    lynx and wolf, by camera traps and tracks.
  url: https://ju-priroda.hr/wp-content/uploads/2026/04/1.-Obrazlozenje-izvrsenja-rashoda-i-izdataka-razdjela-2025_JU-Priroda.html
  fetched: '2026-11-12'
  quote: s posebnim naglaskom na pojavnost risa i vuka praćenjem putem fotozamki i
    tragova
- claim: In 2025 it maintained a remote monitoring system for griffon vultures on
    Plavnik island and video surveillance at the feeding station it managed.
  url: https://ju-priroda.hr/wp-content/uploads/2026/04/1.-Obrazlozenje-izvrsenja-rashoda-i-izdataka-razdjela-2025_JU-Priroda.html
  fetched: '2026-11-12'
  quote: održavan je sustav daljinskog praćenja bjeloglavih supova na otoku Plavniku
    u cilju smanjenja utjecaja uznemiravanja tijekom gniježđenja
- claim: In 2025 it continuously added data from surveillance, monitoring, natural
    history research, rescues and interventions to its information system using the
    Mergin application.
  url: https://ju-priroda.hr/wp-content/uploads/2026/04/1.-Obrazlozenje-izvrsenja-rashoda-i-izdataka-razdjela-2025_JU-Priroda.html
  fetched: '2026-11-12'
  quote: Tijekom godine vršena je kontinuirana nadopuna informacijskog sustava podacima
    prikupljenim kroz aktivnosti nadzora, monitoringa i prirodoslovnih istraživanja,
