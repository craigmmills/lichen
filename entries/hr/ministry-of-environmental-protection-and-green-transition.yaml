summary: Croatian ministry whose staff include Croatia's primary CBD national focal point and which has
  published bird observations and saproxylic beetle records through GBIF.
facts:
- claim: The ministry's own site names it the Ministry of Environmental Protection and Green Transition
    of the Republic of Croatia.
  url: https://mzozt.gov.hr/
  fetched: 2026-11-08
  quote: Ministarstvo zaštite okoliša i zelene tranzicije Republike Hrvatske - Naslovna
- claim: The CBD lists Ana Kobašlić, Head of Service for Biodiversity Mainstreaming in the ministry's
    Nature Protection Directorate, as Croatia's primary CBD national focal point.
  url: https://www.cbd.int/countries/nfp?country=hr
  fetched: 2026-11-08
  quote: CBD Primary NFP, SBSTTA NFP
- claim: The CBD lists a Head of Section for Protected Areas Management in the ministry's Nature Protection
    Directorate.
  url: https://www.cbd.int/countries/nfp?country=hr
  fetched: 2026-11-08
  quote: Head of Section for Protected Areas Management
- claim: Its address is given as Radnička cesta 80, Zagreb.
  url: https://bioportal.hr/en/gbif-croatia
  fetched: 2026-11-08
  quote: Radnička cesta 80
- claim: Its GBIF publisher record describes IEN-MESD as a Croatian GBIF node and national focal point
    for biodiversity inventory and monitoring; the record notes a July 2024 change from the Ministry of
    Economy and Sustainable Development, Institute for Environment and Nature, following restructuring.
  url: https://api.gbif.org/v1/organization/0f285de3-932e-483b-b915-b2377786ee90
  fetched: 2026-11-08
  quote: IEN-MESD is a Croatian GBIF node and national focal point for inventory and monitoring of biodiversity
- claim: Its GBIF publisher record gives an address on Radnička cesta in Zagreb.
  url: https://api.gbif.org/v1/organization/0f285de3-932e-483b-b915-b2377786ee90
  fetched: 2026-11-08
  quote: Radnička cesta 80
- claim: Has published through GBIF bird observations collected for the development of monitoring programmes
    in 2022 and 2023.
  url: https://api.gbif.org/v1/organization/0f285de3-932e-483b-b915-b2377786ee90/publishedDataset
  fetched: 2026-11-08
  quote: Project OPKK Monitoring Birds - bird observations collected for the development of monitoring
    programs during 2022-2023
- claim: Has published through GBIF records of saproxylic beetles from the citizen science campaign "Jeste
    li ih vidjeli?".
  url: https://api.gbif.org/v1/organization/0f285de3-932e-483b-b915-b2377786ee90/publishedDataset
  fetched: 2026-11-08
  quote: Records of saproxylic beetles collected through citizen science campaign - Jeste li ih vidjeli?
- claim: The haop.hr page on "Jeste li ih vidjeli?" says the public wildlife sighting campaigns under
    that name have run since 2015, with results published on BioAtlas.
  url: https://www.haop.hr/hr/tematska-podrucja/prirodne-vrijednosti-stanje-i-ocuvanje/ukljucite-se-u-zastitu/jeste-li-ih-vidjeli
  fetched: 2026-11-08
  quote: Akcije prikupljanja podataka o opažanjima divljih vrsta od strane javnosti pod zajedničkim imenom
    “Jeste li ih vidjeli?” provode se još od 2015. godine.
