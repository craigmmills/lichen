- claim: Broad-scale methods included acoustic surveys and orthophoto and satellite
    imagery.
  url: https://irb.hr/content/download/35571/1660286
  fetched: 2026-11-12
  quote: Detaljno kartiranje provodilo se metodama širokog obuhvata kao što su akustična
    snimanja te daljinska snimanja korištenjem ortofoto i satelitskih snimaka.
- claim: The project ran from 2018 to 2023 with a total value of EUR 11.9 million,
