summary: Project run by the Ministry of Economy and Sustainable Development, completed
  with the January 2024 launch of a map covering 51 per cent of Croatia's Adriatic
  seabed, of which 82 per cent was modelled.
facts:
- claim: The National Marine Habitat Map was launched at the Institute of Oceanography
    and Fisheries in Split on 3 January 2024, completing the project.
  url: https://irb.hr/content/download/35571/1660286
  fetched: 2026-11-12
  quote: Nacionalna karta morskih staništa danas je uspješno lansirana na Institutu
    za oceanografiju i ribarstvo u Splitu.
- claim: The project mapped 51 per cent of Croatia's Adriatic seabed using field surveys
    and neural network modelling; the model drew on over 850 sediment samples and
    fisheries expedition data. Direct observations covered 18 per cent of the project
    area and the remaining 82 per cent was modelled.
  url: https://irb.hr/content/download/35571/1660286
