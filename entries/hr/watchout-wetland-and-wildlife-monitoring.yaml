  ai_type: deep-learning
- claim: Planned to use drone recordings and satellite images to assess land, wetland and water habitats.
  url: https://pp-kopacki-rit.hr/wetland-and-wildlife-monitoring-using-technology-and-acoustics-watchout/?lang=en
  fetched: 2026-11-08
  quote: Using aerial recordings taken by drones and satellite images representation and spatial coverage
    of certain land, wetland and water habitat will be assessed
- claim: Names the white-tailed eagle, red deer, great spotted woodpecker, European tree frog and golden
    jackal as priority species for machine learning.
  url: https://pp-kopacki-rit.hr/wetland-and-wildlife-monitoring-using-technology-and-acoustics-watchout/?lang=en
  fetched: 2026-11-08
  quote: The priority species for the application of machine learning in the project are white-tailed
    eagle, red deer, great spotted woodpecker, European tree frog and golden jackal.
