summary: Project with Rainforest Connection and partners that, it says, recorded at 95 sites in the park
  in April to June 2023, reporting 75 species detected and training a neural network on spectrograms.
facts:
- claim: Rainforest Connection says recordings were made at 95 sites in the park from April to June 2023.
  url: https://rfcx.org/projects/croatia
  fetched: 2026-11-08
  quote: From April to June 2023, our on-ground partners collected data at 95 sampling sites in Kopački
    Rit Nature Park using passive acoustic recorders.
- claim: Rainforest Connection says it used validated detections to train a convolutional neural network
    that classifies species from spectrogram images.
  url: https://rfcx.org/projects/croatia
  fetched: 2026-11-08
  quote: We used the validated PM detections as presence/absence data to train a Convolutional Neural
    Network (CNN) model to classify species from spectrogram images.
  ai_type: deep-learning
- claim: Rainforest Connection reports 75 species detected across 95 sites between April and June 2023.
  url: https://rfcx.org/projects/croatia
  fetched: 2026-11-08
  quote: We detected 75 species (67 birds, 4 mammals, and 4 amphibians) across 95 sites
