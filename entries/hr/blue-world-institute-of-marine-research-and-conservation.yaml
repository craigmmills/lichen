facts:
- claim: Says it runs research, education and conservation programmes to protect the Adriatic
    marine environment.
  url: https://www.plavi-svijet.org/?p=5526
  fetched: 2026-11-08
  quote: the Blue World Institute operates three programmes – research , education and conservation
- claim: Says its research focuses mainly on large marine vertebrates such as dolphins, whales,
    sea turtles and sharks.
  url: https://www.plavi-svijet.org/?p=5526
  fetched: 2026-11-08
  quote: Our research focuses mainly on large marine vertebrates
- claim: Organises its work in research, education and conservation programmes, with research
    focused on large marine vertebrates.
  url: https://www.blue-world.org/what-we-do/
  fetched: 2026-11-08
  quote: The first focuses on large marine vertebrates (mostly Cetaceans, sea turtles and
    cartilaginous fish) aiming at improving their protection and conservation
- claim: Runs long-term acoustic monitoring of sea ambient noise in the Cres-Lošinj archipelago
    with a hydrophone and digital recorder.
  url: https://www.blue-world.org/marine-conservation-research-blue-world-institute/research-methods/marine-bioacoustics-research-blue-world-institute/
  fetched: 2026-11-08
  quote: Long-term acoustic monitoring of sea ambient noise in the Cres –Lošinj archipelago
    is carried out on predefined locations using a hydrophone connected to a digital recorder.
- claim: Has tagged loggerhead sea turtles with satellite transmitters since 2006 and publishes
    the tracking data.
  url: https://www.blue-world.org/marine-conservation-research-blue-world-institute/research-methods/satellite-tracking-marine-turtles/
  fetched: 2026-11-08
  quote: Satellite tracking data of marine turtles we tagged can be found here !
- claim: Office in Veli Lošinj, incorporated on 17 December 1999.
  url: https://www.blue-world.org/about-blue-world-marine-conservation-organization/about-us-2/
  fetched: 2026-11-08
  quote: Kaštel 24, HR-51551 Veli Lošinj, Croatia
- claim: Its President leads its activities and serves as its official representative.
  url: https://www.blue-world.org/about-blue-world-marine-conservation-organization/governance-structure/
  fetched: 2026-11-08
  quote: organising and leading the activities of the Blue World Institute and serving as
    its official representative
