summary: Applied ecology institute in Zagreb, established 1997, leading the GEOAI4ESRSE4 consortium, which
  says it will develop GIS, Earth observation and AI tools for ESRS E4 reporting.
facts:
- claim: Leads the GEOAI4ESRSE4 consortium, which started on 1 October 2025 for 18 months.
  url: https://oikon.hr/?p=12821
  fetched: 2026-11-08
  quote: The project started on 1 October 2025 and will run for 18 months
- claim: Says it will develop tools combining GIS, Earth observation and AI for biodiversity and ecosystem
    reporting under ESRS E4.
  url: https://oikon.hr/?p=12821
  fetched: 2026-11-08
  quote: we will develop an integrated set of tools combining GIS, Earth Observation (EO), and AI to enable
    companies to report on biodiversity and ecosystems more accurately and efficiently
- claim: Its site lists a Laboratory for Remote Sensing and GIS.
  url: https://oikon.hr/?p=12821
  fetched: 2026-11-08
  quote: Laboratory for Remote Sensing and GIS – LADIGIS
- claim: Its site lists a Laboratory for Monitoring and Research of Large Carnivores and Ecology of Vertebrates.
  url: https://oikon.hr/?p=12821
  fetched: 2026-11-08
  quote: Laboratory for Monitoring and Research of Large Carnivores and Ecology of Vertebrates
- claim: Wind Systems Magazine reports that Boulder Imaging is teaming up with Oikon to bring AI-powered
    bird protection technology to wind farms across southeast Europe.
  url: https://www.windsystemsmag.com/boulder-imaging-oikon-deploy-tech-for-bird-protection/
  fetched: 2026-11-08
  quote: Boulder Imaging is teaming up with Oikon Ltd., a Croatian environmental consultancy, to bring
    AI-powered bird protection technology to wind farms across southeast Europe.
- claim: Based in Zagreb.
  url: https://oikon.hr/basic-information/
  fetched: 2026-11-08
  quote: Address Trg senjskih uskoka 1-2, HR-10020 Zagreb
- claim: Established in 1997.
  url: https://oikon.hr/basic-information/
  fetched: 2026-11-08
  quote: Year of establishment 1997
- claim: Houses five laboratories, including ones for remote sensing and GIS, large carnivore monitoring,
    data science, and biodiversity and population genetics.
  url: https://oikon.hr/about-us-2/
  fetched: 2026-11-08
  quote: the Laboratory for Remote Sensing and GIS – LaDIGIS, the Laboratory for Research and Monitoring
    of Large Carnivores and Ecology of Vertebrates, the Laboratory for Fish and Aquatic Ecosystems, the
    Laboratory for Data Science, and the Laboratory for Biodiversity and Population Genetics
- claim: Says it works on several ESA-financed projects, including detection of invasive plant species
    with Sentinel data and Sentinel-based mapping of infralittoral sea habitats.
  url: https://oikon.hr/about-us-2/
  fetched: 2026-11-08
  quote: 'We are working on several projects financed by the European Space Agency (ESA): “Human-Induced
    Coastal Change Monitoring”, “Development of detection method for invasive plant species using Sentinel
    data”, and “Sentinel-based infralittoral sea habitat type mapping”.'
- claim: Founded a Laboratory for Data Science in January 2020, whose methods include artificial intelligence
    and machine learning.
  url: https://oikon.hr/laboratory-for-data-science/
  fetched: 2026-11-08
  quote: 'Methods include: statistical analysis, mathematical modelling, artificial intelligence, machine
    learning and other big data processing technologies.'
- claim: Acts as regional representative in Croatia and South-East Europe for shutdown-on-demand bird
    protection systems for wind farms, some of which use AI and cameras to identify bird species.
  url: https://oikon.hr/bird-protection-technologies-for-wind-farms/
  fetched: 2026-11-08
  quote: as regional representatives in Croatia and other countries of Southeast Europe
- claim: Its large carnivore laboratory monitors wildlife with GPS and VHF collars and digital photo trapping,
    including wolf monitoring for Biokovo Nature Park in 2013 to 2015.
  url: https://oikon.hr/our-departments/laboratory-for-research-and-monitoring-of-large-carnivores/
  fetched: 2026-11-08
  quote: we use modern methods such as telemetric animal tracking using GPS/VHF collars, digital photo
    trapping methods, GIS analysis of the data obtained etc.
