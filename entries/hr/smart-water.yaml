summary: Project led by the Ruđer Bošković Institute that aims to assess water quality at
  lakes in Croatia, Bosnia and Herzegovina and Montenegro by analysing satellite and sensor
  data with AI.
facts:
- claim: Covers Lake Vrana in Croatia, Lake Deransko in Bosnia and Herzegovina and Lake Skadar
    in Montenegro.
  url: https://irb.hr/eng/News/SMART-Water-Project-Putting-AI-to-Work-for-the-Environment
  fetched: 2026-11-08
  quote: 'At the core of this cross-border effort are three major lakes: Lake Vrana in Croatia,
    Lake Deransko in Bosnia and Herzegovina, and Lake Skadar in Montenegro.'
- claim: Aims to analyse satellite and sensor data with AI algorithms to assess water quality;
    the page describes calibration and data integration work in progress.
  url: https://irb.hr/eng/News/SMART-Water-Project-Putting-AI-to-Work-for-the-Environment
  fetched: 2026-11-08
  quote: Thanks to satellites and state-of-the-art sensors, scientists can now gather continuous
    streams of environmental data, which are then analysed by AI algorithms.
- claim: Has a total value of EUR 1.5 million.
  url: https://irb.hr/eng/News/SMART-Water-Project-Putting-AI-to-Work-for-the-Environment
  fetched: 2026-11-08
  quote: With a total value of €1.5 million
