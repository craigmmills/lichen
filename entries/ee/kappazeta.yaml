summary: Active company specialising in synthetic aperture radar satellite imagery, which told Tehnopol
  it aims to launch its 3d-SAR mission in 2028 and lists national governments among customers.
facts:
- claim: Tehnopol says it uses satellite imagery to deliver insights for agriculture, defence and forestry,
    specialising in synthetic aperture radar.
  url: https://www.tehnopol.ee/en/startup-story-kappazeta-x-esa-bic-estonia/
  fetched: 2026-11-08
  quote: KappaZeta is harnessing the power of satellite imagery to deliver actionable insights for agriculture,
    defence, and forestry. Specializing in the use of synthetic aperture radar (SAR)
- claim: Told AIN it plans a constellation of companion satellites to make Sentinel-1 data three-dimensional
    and create a global, frequently updated dataset on forest biomass and carbon stock.
  url: https://en.ain.ua/2023/09/26/startup-of-the-day-estonian-space-tech-kappazeta
  fetched: 2026-11-08
  quote: We will build a constellation of companion satellites, which will make Sentinel-1 data three-dimensional
    to create a global and frequently updated data set about forest biomass and carbon stock.
- claim: Told Tehnopol it aims to launch its 3d-SAR mission in 2028.
  url: https://www.tehnopol.ee/en/startup-story-kappazeta-x-esa-bic-estonia/
  fetched: 2026-11-08
  quote: Launch our 3d-SAR mission in 2028
- claim: Said in 2023 it had 16 staff and was looking for a machine learning engineer or data scientist.
  url: https://en.ain.ua/2023/09/26/startup-of-the-day-estonian-space-tech-kappazeta
  fetched: 2026-11-08
  quote: Currently, we have 16 people in our team and are looking for an experienced machine learning
    engineer/ data scientist.
- claim: Lists national governments and environmental protection companies among its customers.
  url: https://en.ain.ua/2023/09/26/startup-of-the-day-estonian-space-tech-kappazeta
  fetched: 2026-11-08
  quote: We are the service provider for national governments (insurance, forestry, defence, open-area
    mining, and environmental protection compamies)
