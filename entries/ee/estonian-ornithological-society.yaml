summary: Active society, a BirdLife International partner, that carried out the 2021 breeding bird point
  counts for the national monitoring programme and uses PlutoF for observations.
facts:
- claim: Coordinated the Põõsaspea autumn bird migration count project announced in June 2024.
  url: https://www.eoy.ee/poosaspea/vaatlused/start-of-2024-poosapsea-count-project
  fetched: 2026-11-08
  quote: Projekti koordineerib Eesti Ornitoloogiaühing
- claim: The June 2024 announcement said the count would run daily until the end of November, with observations
    available the next day in Trektellen and PlutoF.
  url: https://www.eoy.ee/poosaspea/vaatlused/start-of-2024-poosapsea-count-project
  fetched: 2026-11-08
  quote: The observations can be seen next day in Trektellen and in PlutoF.
- claim: Carried out the 2021 breeding bird point counts of the national environmental monitoring programme,
    commissioned by the Estonian Environment Agency.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-08
  quote: 'Töö teostaja: Eesti Ornitoloogiaühing'
- claim: The report says the Estonian point count project is part of the Pan-European Common Bird Monitoring
    Scheme.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-08
  quote: Pan-European Common Bird Monitoring Scheme (PECBMS)
- claim: Gives its address as Veski 4, Tartu.
  url: https://www.eoy.ee/poosaspea/vaatlused/start-of-2024-poosapsea-count-project
  fetched: 2026-11-08
  quote: Veski 4, Tartu 51005
