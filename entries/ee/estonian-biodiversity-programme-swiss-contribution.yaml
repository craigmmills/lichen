summary: Four-year programme launched in 2024 with 6.93 million Swiss francs to improve
  Estonian wildlife monitoring and protected-area effectiveness; eDNA, mobile 3D bird
  radar and AI are to be tested.
facts:
- claim: Launched in 2024 with Swiss funding for four years of work to improve wildlife
    monitoring and protected-area effectiveness in Estonia.
  url: https://balticnews.com/?p=4305
  fetched: 2026-11-12
  quote: An initiative titled “Biodiversity Program,” sponsored by Switzerland and
    launched on Wednesday, will provide funding for four years of work to improve
    wildlife monitoring and the effectiveness of biodiversity protection in protected
    areas in Estonia.
- claim: The funding agreement provides 6.93 million Swiss francs.
  url: https://balticnews.com/?p=4305
  fetched: 2026-11-12
  quote: The funding agreement signed by the two countries will see 6.93 million Swiss
    francs, or more than seven million euros, provided towards nature protection in
    Estonia.
- claim: The Environment Agency's director named eDNA, mobile 3D bird radar and artificial
    intelligence as technologies to be tested for wildlife monitoring.
  url: https://balticnews.com/?p=4305
  fetched: 2026-11-12
  quote: Examples include environmentalDNA, mobile 3D bird radar, the use of artificial
    intelligence and so on.
