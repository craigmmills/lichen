facts:
- claim: Says its field of activity is carrying out the national environmental monitoring programme, organising
    environmental data exchange, and collecting and analysing data.
  url: https://www.keskkonnaagentuur.ee/
  fetched: 2026-11-08
  quote: Keskkonnaagentuuri tegevusvaldkond on riikliku keskkonnaseire programmi täitmine, keskkonnaga
    seotud riigisisese ja rahvusvahelise andmevahetuse korraldamine, andmete kogumine ja analüüs
- claim: Its site lists a nature observations database and a nature observations smartphone app among
    its e-services.
  url: https://www.keskkonnaagentuur.ee/
  fetched: 2026-11-08
  quote: Loodusvaatluste nutirakendus
- claim: On 8 June 2023, ERR reported that the agency published statistical forest inventory (SMI) data
    showing forest covered 51.3 per cent of Estonia.
  url: https://www.err.ee/1609001795/riiklik-metsainventuur-raiemaht-kasvas-mullu-pool-miljonit-kuupmeetrit
  fetched: 2026-11-08
  quote: Keskkonnaagentuuri neljapäeval avaldatud statistilise metsainventeerimise (SMI) andmete kohaselt
    on Eestis metsaga kaetud 51,3 protsenti pindalast.
- claim: The Estonian Ornithological Society's 2021 breeding bird point count report, commissioned by
    the agency, says that from 2021 the agency calculates bird species population indices.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-08
  quote: Linnuliikide populatsiooniindeksid arvutab alates 2021. aastast Keskkonnaagentuur
- claim: Its ELME report says the agency planned a procurement in the second quarter of 2023 to further
    develop the camera-trap species identification system.
  url: https://www.keskkonnaagentuur.ee/sites/default/files/documents/2024-01/KOONDKOKKUV6TE-ELME-II-plokk_02-2023.pdf
  fetched: 2026-11-08
  quote: KAURil on plaanis 2023. aasta teises kvartalis viia läbi hange
