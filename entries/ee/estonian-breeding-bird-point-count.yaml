summary: Point count monitoring operating since 1983, run by the Estonian Ornithological
  Society, with counts on 61 routes in 2025, its 43rd counting season.
facts:
- claim: 2025 was the project's 43rd counting season, with counts on 61 routes.
  url: https://www.eoy.ee/pics/2537_Haudelinnustiku_punktloendused_aruanne_2025.pdf
  fetched: 2026-11-12
  quote: 2025. aasta oli punktloenduste seireprojekti 43. loendushooaeg. Loendused
    tehti 61 rajal
- claim: The point count project has run since 1983, and since 1994 within the biodiversity
    and landscape sub-programme of the state environmental monitoring.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-12
  quote: Eestis on punktloenduste seireprojekt käigus juba alates 1983. aastast alates
    ja 1994. aastast tehakse punktloendusi Eesti riikliku keskkonnaseire eluslooduse
    ja maastike seire
- claim: In 2021 counts were made on 58 routes, a project record at that time.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-12
  quote: 2021. aastal tehti loendused 58 rajal ( tabel 1), mis on punktloenduste seireprojekti
    rekord läbi
- claim: The 2021 work was commissioned by the Environment Agency.
  url: https://www.eoy.ee/pics/1336_Haudelinnustiku_punktloendused_aruanne_2021.pdf
  fetched: 2026-11-12
