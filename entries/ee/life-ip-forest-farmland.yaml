facts:
- claim: Runs from 2020 to 2029 with a total cost of €19,561,784, led by the Ministry of the Environment.
  url: https://www.kliimaministeerium.ee/en/biodiversity-environmental-protection/nature-conservation/life-ip-forestfarmland
  fetched: 2026-11-08
  quote: The project (2020-2029) is led by the Ministry of the Environment and the total cost of the project
    is € 19,561,784.
- claim: Plans to restore 3,500 ha of wet forest and 500 ha of dry forest and monitor their condition.
  url: https://www.kliimaministeerium.ee/en/biodiversity-environmental-protection/nature-conservation/life-ip-forestfarmland
  fetched: 2026-11-08
  quote: Based on the action plans 3500 ha wet forest and 500 ha dry forest will be restored, and their
    conditions will be monitored.
- claim: Says a new IT system will be developed to gather the data needed for coordinating and managing
    nature conservation work.
  url: https://www.kliimaministeerium.ee/en/biodiversity-environmental-protection/nature-conservation/life-ip-forestfarmland
  fetched: 2026-11-08
  quote: During the project, a new IT-system will be developed, which should gather all the necessary
    data and become a universal tool for coordinating and managing nature conservation work.
