summary: Monitoring of game species, for which the Environment Agency published a
  2026 report with hunting recommendations; it uses trail cameras and a track-count
  index, and reported 650 to 800 lynx in autumn 2025.
facts:
- claim: In 2026 the Environment Agency published a report on game species populations
    with hunting recommendations for that season.
