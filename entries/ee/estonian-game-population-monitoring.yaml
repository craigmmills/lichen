    ulukiliikide asurkondade seisundist ja küttimissoovitused tänavuseks jahihooajaks.
- claim: In spring 2026 trail cameras in monitoring areas recorded hare observations;
    monitoring also used a track-count index.
  url: https://www.err.ee/1610078854/eestis-suureneb-karude-arv-rebaseid-ja-metskitsi-jaab-vahemaks
