summary: Active ringing scheme in which ringers report the birds they ring and the
  data go to an international database; a birdwatcher quoted by ERR put it at about
  100 ringers and 60,000 to 80,000 birds a year.
facts:
- claim: Ringers must report on the birds they ring, and the data go to an international
    database, which the Environment Agency submits for Estonia.
  url: https://www.err.ee/1609585640/lindude-rongastamine-voib-eestis-tasuliseks-muutuda
  fetched: 2026-11-12
  quote: Rõngastajatel on alati kohustus esitada aruandlus oma rõngastatud lindude
    kohta, mis lähevad rahvusvahelisse andmebaasi, mida Eesti poolt esitab Keskkonnaagentuur.
- claim: ERR reported that ringing had been the Environmental Board's duty and that
    there was a wish to hand all ringing activities over to the Environment Agency.
  url: https://www.err.ee/1609585640/lindude-rongastamine-voib-eestis-tasuliseks-muutuda
  fetched: 2026-11-12
  quote: Seni oli kogu rõngastamisega seonduv keskkonnaameti kohustus ja rõngaid tuli
    väljastada tasuta.
- claim: A birdwatcher quoted by ERR said about 100 ringers ring 60,000 to 80,000
    birds a year in Estonia.
  url: https://www.err.ee/1609585640/lindude-rongastamine-voib-eestis-tasuliseks-muutuda
  fetched: 2026-11-12
  quote: Eestis rõngastatakse ligikaudu 100 rõngastaja poolt aastas 60 000-80 000
    lindu.
- claim: Rings are held at the Matsalu ringing centre.
  url: https://www.err.ee/1609585640/lindude-rongastamine-voib-eestis-tasuliseks-muutuda
  fetched: 2026-11-12
