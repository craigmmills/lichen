summary: Citizen science BioBlitz initiative run by the University of Tartu Natural
  History Museum and Botanical Garden, whose ninth marathon in June 2026 produced
  10,199 observations from nearly 200 observers.
facts:
- claim: The ninth marathon, in June 2026, had nearly 200 observers making 10,199
    nature observations over 24 hours.
