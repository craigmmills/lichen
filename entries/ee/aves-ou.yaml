summary: Company that carried out the 2017 Pärnu Bay and 2016 Pakri bird area inventories,
  with breeding counts and spring and autumn migration counts for Pärnu Bay.
facts:
- claim: Aves OÜ carried out the 2017 bird inventory of the Pärnu Bay bird area.
  url: https://www.eoy.ee/pics/1309_Parnu_lahe_linnuala_linnustiku_inventuuri_aruanne_2017.pdf
  fetched: 2026-11-15
  quote: 'Töö teostaja: Aves OÜ'
- claim: The 2017 report describes one morning and one night count for breeding birds
    on the Pärnu Bay coast and Kihnu, with exceptions for national monitoring sites,
    and migration counts in spring and autumn.
  url: https://www.eoy.ee/pics/1309_Parnu_lahe_linnuala_linnustiku_inventuuri_aruanne_2017.pdf
  fetched: 2026-11-15
  quote: Seire toimus ühekordse hommikuse ja ühekordse öise loendusena.
- claim: Aves OÜ also carried out the 2016 Pakri bird area inventory, with fieldwork
    by its ornithologists Kaarel Võhandu and Uku Paal.
  url: https://www.eoy.ee/pics/1319_Pakri_linnuala_linnustiku_inventuuri_aruanne_2016.pdf
