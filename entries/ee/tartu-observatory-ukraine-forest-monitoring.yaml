summary: In May 2024, Tartu Observatory reported cooperation with Ukrainian institutions
  on forest and water-body monitoring, using Estonian datasets for forest height,
  wood volume and carbon estimates.
facts:
- claim: In May 2024 Tartu Observatory reported cooperation with Ukrainian institutions
    to apply its scientists’ remote sensing methods to forest and water-body monitoring.
  url: https://kosmos.ut.ee/en/content/tartu-observatory-helps-ukraine-develop-monitoring-systems-forests-and-water-bodies
  fetched: 2026-11-12
  quote: Tartu Observatory , University of Tartu, is cooperating with Ukrainian institutions
    to apply remote sensing methods and applications developed in Tõravere by our
    scientists for monitoring forests and water-bodies.
- claim: In May 2024 the observatory reported using Estonian datasets for forest inventory
    scenarios to estimate forest height, wood volume and carbon while helping implement
    similar methods in Ukraine.
  url: https://kosmos.ut.ee/en/content/tartu-observatory-helps-ukraine-develop-monitoring-systems-forests-and-water-bodies
  fetched: 2026-11-12
  quote: Tartu Observatory has developed a method for airborne laser scanning data-based
    forest inventories and monitoring.
