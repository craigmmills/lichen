    advance biodiversity and carbon dynamics research.
  url: https://talks.osgeo.org/foss4g-2025/talk/DUSEKB/
  fetched: 2026-11-08
  quote: Our project aims to create a comprehensive data cube for Estonia, utilizing remote sensing and
