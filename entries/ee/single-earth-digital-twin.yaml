    an in-house tool using Sentinel-1 satellite data and machine learning models.
  url: https://www.single.earth/digital-twin-of-earth
  fetched: 2026-11-08
  quote: Bi-weekly, we monitor the intactness of the forest canopy cover of the lands onboarded to the
