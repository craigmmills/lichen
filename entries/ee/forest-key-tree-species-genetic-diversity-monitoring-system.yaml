summary: Active 2025 to 2028 project led by Vytautas Magnus University to build a cross-border genetic
  diversity monitoring system for four key forest tree species, with a 1.915 million euro budget.
facts:
- claim: Aims to create, pilot and put in place a cross-border genetic diversity monitoring system that
    can assess genetic diversity and warn of a risk of its decline in key forest tree species.
  url: https://rmk.ee/spetsialist/sihtfinantseeringud/kaimasolevad-projektid/euroopa-regionaalarengu-fond-metsa-votmepuuliikide-geneetilise-mitmekesisuse-vahenemise-varajase-prognoosimise-ja-seire-susteem/
  fetched: 2026-11-08
  quote: luua, piloteerida ja rakendada riikidevahelist geneetilise mitmekesisuse (GM) seiresüsteemi
- claim: Its methods rest on DNA genotypes, phenotypes and remote sensing.
  url: https://rmk.ee/spetsialist/sihtfinantseeringud/kaimasolevad-projektid/euroopa-regionaalarengu-fond-metsa-votmepuuliikide-geneetilise-mitmekesisuse-vahenemise-varajase-prognoosimise-ja-seire-susteem/
  fetched: 2026-11-08
  quote: GM meetodeid, mis tuginevad DNA genotüüpidele, fenotüüpidele ja kaugseirele
- claim: The key tree species covered are pedunculate oak, Norway spruce, small-leaved lime and ash.
  url: https://rmk.ee/spetsialist/sihtfinantseeringud/kaimasolevad-projektid/euroopa-regionaalarengu-fond-metsa-votmepuuliikide-geneetilise-mitmekesisuse-vahenemise-varajase-prognoosimise-ja-seire-susteem/
  fetched: 2026-11-08
  quote: Võtmepuuliikidena käsitletakse projekti raames harilikku tamme (Quercus robur) , harilikku kuuske
    (Picea abies) , harilikku pärna (Tilia cordata) ja harilikku saart (Fraxinus excelsior) .
- claim: Runs from 2025 to 2028.
  url: https://rmk.ee/spetsialist/sihtfinantseeringud/kaimasolevad-projektid/euroopa-regionaalarengu-fond-metsa-votmepuuliikide-geneetilise-mitmekesisuse-vahenemise-varajase-prognoosimise-ja-seire-susteem/
