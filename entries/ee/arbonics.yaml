summary: Founded in early 2022, this forestry company says it monitors forests using remote sensing and
  over 50 data layers and launched Impact Forestry in Estonia in September 2024.
facts:
- claim: Says it uses remote sensing, from satellites and aerial tools such as LiDAR, to detect changes
    and measure biomass on its projects.
  url: https://www.arbonics.com/knowledge-hub/monitoring-afforestation-projects
  fetched: 2026-11-08
  quote: Remote sensing technology—which involves using satellites and aerial tools like LiDAR to monitor
    land from above—allows us to detect changes on the ground and accurately measure biomass without needing
    to visit every site in person.
- claim: Says it combines over 50 data layers with growth and baseline models to monitor forest health.
  url: https://www.arbonics.com/knowledge-hub/understanding-arbonics-technology
  fetched: 2026-11-08
  quote: We combine over 50 data layers with advanced growth and baseline behaviour models to accurately
    monitor forest health
- claim: Its launch release is datelined Tallinn, Estonia, and says it was founded in early 2022 by Kristjan
    Lepik and Lisett Luik.
  url: https://www.arbonics.com/knowledge-hub/launch-press-release
  fetched: 2026-11-08
  quote: Founded by Kristjan Lepik and Lisett Luik in early 2022
- claim: Says it launched Impact Forestry in Estonia in September 2024 and then expanded into Latvia,
    with a Carbon Opportunity Assessment for mature forests.
  url: https://www.arbonics.com/knowledge-hub/arbonics-forest-conservation-assessment-launch
  fetched: 2026-11-08
  quote: In September 2024, we launched Impact Forestry in Estonia, an impactful solution that enables
    landowners with mature forests to delay harvest for 40+ years and continue capturing carbon. Subsequently,
    we expanded into Latvia.
