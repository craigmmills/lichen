summary: Group that collected soil DNA and habitat data at about 170 ECOGRID test
  areas and launched a nationwide cowslip citizen science survey.
facts:
- claim: With the macroecology work group, developed the Greenmeter application for
    assessing the natural diversity of Estonian landscapes.
  url: https://landscape.ut.ee/greenmeter/?lang=en
  fetched: 2026-11-12
  quote: Our work group, together with the macroecology work group, developed an application
    called greenmeter that helps to assess the natural diversity of Estonian landscapes.
- claim: Created the Estonian-wide ECOGRID test area network and collected soil DNA
    and habitat data at about 170 test areas.
  url: https://landscape.ut.ee/estonian-wide-test-area-network-fieldwork-started-this-summer/?lang=en
  fetched: 2026-11-12
  quote: This year we created Estonian wide test area network called ECOGRID, which
    included different natural and semi-natural habitats in both good and bad state.
- claim: Launched a nationwide citizen science survey of cowslip flower morphs with
    the Estonian Fund for Nature and Let's Do It, to estimate the condition of grassland
    plants.
  url: https://landscape.ut.ee/estonia-is-looking-for-cowslips/?lang=en
  fetched: 2026-11-12
  quote: With nationwide data, we will be able to estimate the condition of cowslip
    and also other grassland plants in our landscapes.
- claim: Based at J. Liivi 2, Tartu.
  url: https://landscape.ut.ee/what-we-do/projects/the-center-of-excellence-for-sustainable-land-use-futurescapes/?lang=en
  fetched: 2026-11-12
  quote: J. Liivi 2, 50409, Tartu, ESTONIA
