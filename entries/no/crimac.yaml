  url: https://www.hi.no/hi/forskning/prosjekter/sfi-crimac
  fetched: '2026-11-02'
  quote: Senteret har ei finansiering på om lag 28 millionar kroner i året i åtte år.
- claim: Aims to improve and automate the interpretation of data and images from broadband
