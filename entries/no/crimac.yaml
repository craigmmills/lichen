  fetched: '2026-11-02'
  quote: Vi i CRIMAC-prosjektet er stolte av å dele ei splitter ny samling av kvalitetssikra
    testdatasett for breibands ekkolodd.
- claim: Aims to improve and automate interpretation of acoustic images.
  url: https://www.hi.no/hi/forskning/prosjekter/sfi-crimac
  fetched: '2026-11-02'
  quote: CRIMAC vil forbetre og automatisere tolkinga av bilde frå moderne breidbandsakustikk
    på forskingsfartøy og fiskebåtar.
- claim: Plans to use AI, field research, drones and other technology to improve acoustic
    image interpretation.
  url: https://www.hi.no/hi/forskning/prosjekter/sfi-crimac
  fetched: '2026-11-02'
  quote: Det ved hjelp av tokt og feltforsking, kunstig intelligens, dronar og annan teknologi.
