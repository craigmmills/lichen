id: crimac
kind: programme
name: CRIMAC
scope: 'no'
summary: Institute of Marine Research-led programme (October 2020 to September 2028) aiming
  to automate interpretation of broadband acoustics, with funding of about 28 million kroner
  a year for eight years.
facts:
- claim: With COGMAR it organised the workshop on machine learning in fisheries acoustics
    documented in a 2021 report.
  url: https://www.hi.no/templates/reporteditor/report-pdf?id=42975
  fetched: '2026-11-02'
  quote: This report documents a workshop organised by the COGMAR and CRIMAC projects.
- claim: Contributed the active acoustics review to a survey of 1,000 publications.
  url: https://skoleportalen.imr.no/en/havforskningsinstituttet/new/prosjekter/crimac-en/news/new-paper-machine-learning-algorithms-demonstrate-their-utility-in-marine-science
  fetched: '2026-11-02'
  quote: CRIMAC contributed with the review of active acoustics.
- claim: Aims to improve and automate the interpretation of broadband acoustics using field
    research, AI, drones and inspection technology.
  url: https://www.hi.no/en/hi/forskning/projects/crimac
  fetched: '2026-11-02'
  quote: CRIMAC will improve and automate the interpretation of data and images from modern
    broadband acoustics on research vessels and fishing boats
- claim: Period 1 October 2020 to 30 September 2028.
  url: https://www.hi.no/en/hi/forskning/projects/crimac
  fetched: '2026-11-02'
  quote: 01. oktober 2020 - 30. september 2028
