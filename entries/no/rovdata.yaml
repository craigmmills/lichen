summary: Programme set up in October 2010, run by the Norwegian Institute for Nature Research, supplying
  monitoring data and population figures on lynx, wolverine, brown bear, wolf and golden eagle.
facts:
- claim: Supplies monitoring data and population figures on lynx, wolverine, brown bear, wolf and golden
    eagle.
  url: https://rovdata.no/Rovdata.aspx
  fetched: '2026-11-02'
  quote: Rovdata er en uavhengig leverandør av overvåkingsdata og bestandstall på gaupe, jerv, brunbjørn,
    ulv og kongeørn i Norge.
- claim: Set up in October 2010 and responsible for the national programme.
  url: https://rovdata.no/Rovdata.aspx
  fetched: '2026-11-02'
  quote: Rovdata ble etablert 1. oktober 2010 og har ansvaret for formidling, drift og utvikling av Nasjonalt
    overvåkingsprogram for rovvilt.
- claim: Set up Skandobs with the Norwegian Biodiversity Information Centre and Sweden's environment agency.
  url: https://rovdata.no/Rovdata.aspx
  fetched: '2026-11-02'
  quote: i samarbeid med Artsdatabanken i Norge og Naturvårdsverket i Sverige, etablert en publikumsløsning
    for innmelding av observasjoner
- claim: The Environment Agency's page says the reporting deadlines are set in a contract with Rovdata.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/rovvilt/
