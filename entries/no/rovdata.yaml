  quote: Rapporteringfrister er fastsatt i egen kontrakt med Rovdata.
- claim: Responsible for operating the Norwegian Large Predator Monitoring Program.
  url: https://rovdata.no/Hjem/English.aspx
  fetched: '2026-11-02'
  quote: Rovdata is responsible for operating, communicating and developing the Norwegian Large Predator
    Monitoring Program.
- claim: Collects, analyses and reports monitoring data on five species.
  url: https://rovdata.no/Hjem/English.aspx
  fetched: '2026-11-02'
  quote: We collect, analyze, and report monitoring data on the Eurasian lynx, wolverine, brown bear,
    wolf and golden eagle.
