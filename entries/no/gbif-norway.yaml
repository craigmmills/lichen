summary: Norwegian participant node in GBIF, established in 2005 and hosted by the University
  of Oslo's Natural History Museum, funded by the Research Council of Norway.
facts:
- claim: The Norwegian participant node is hosted at the museum.
  url: https://stilling.forskning.no/ingenior-job-ads-oslo/senior-engineer-biodiversity-research-infrastructure-data-mobilization/2059929
  fetched: '2026-11-02'
  quote: The Norwegian Participant node in GBIF (www.gbif.no) is hosted at the UiO-NHMO.
- claim: DiSSCo says it is supported long term by the Research Council of Norway.
  url: https://www.dissco.eu/no
  fetched: '2026-11-02'
  quote: GBIF Norway is supported longterm by the Research Council of Norway and hosted by
    the Natural History Museum, University of Oslo.
- claim: A 2022 University of Oslo job advert names GBIF Secretariat and GBIF Norway at UiO
    as leads of BioDT work package 4, on data content streams, for the 2022–2025 project.
  url: https://stilling.forskning.no/ingenior-job-ads-oslo/senior-engineer-biodiversity-research-infrastructure-data-mobilization/2059929
  fetched: '2026-11-02'
  quote: GBIF, represented by GBIF Secretariat and GBIF Norway at UiO, lead work package 4
    on data content streams.
- claim: The Norwegian participant node in GBIF.
  url: https://gbif.no/
  fetched: '2026-11-02'
  quote: GBIF Norway is the Norwegian participant node in the Global Biodiversity Information
    Facility, GBIF .
- claim: Its main task is to make primary biodiversity data freely available and coordinate
    GBIF activities in Norway.
  url: https://gbif.no/
  fetched: '2026-11-02'
  quote: Our main task is to make primary data on biological diversity from the Norwegian
    collections and observation databases freely available
- claim: GBIF's node record gives its address at the Natural History Museum of the University
    of Oslo.
  url: https://api.gbif.org/v1/node/4f829580-180d-46a9-9c87-ed8ec959b545
  fetched: '2026-11-02'
  quote: UiO Natural History Museum of the University of Oslo
- claim: Its Data Manager won the GBIF Ebbe Nielsen Challenge in 2025, sharing first prize.
  url: https://gbif.no/
  fetched: '2026-11-02'
  quote: The Ebbe Nielsen 2025 1st prize was shared between Rukaya and colleagues from Australia.
- claim: Works to make information from Norwegian collections available to the GBIF network.
  url: https://www.gbif.no/about/
  fetched: '2026-11-02'
  quote: established at the UiO Natural History Museum in 2005 with the mission to make information
    from Norwegian collections and other sources available to the international GBIF network
- claim: Funded by the Research Council of Norway since 2005.
  url: https://www.nhm.uio.no/english/research/groups/mana/
  fetched: '2026-11-02'
  quote: Funded by the Research Council of Norway (since 2005).
- claim: Established in 2005 and hosted by the Natural History Museum of the University of
    Oslo.
  url: https://www.nhm.uio.no/english/research/projects/gbif/
  fetched: &id001 2026-11-02
  quote: was established in 2005 and is hosted by the Natural History Museum of the University
    in Oslo (NHM, UiO).
- claim: Says it contributes to developing the DiSSCo MAS SpLAT service, supported by a GBIF
    programme named AI for Specimen Label.
  url: https://gbif.no/
  fetched: *id001
  quote: 'GBIF Norway is proud to contribute to the development of the new DiSSCo MAS SpLAT
    service , supported by the GBIF CESP program, CESP2024-016: AI for Specimen Label .'
