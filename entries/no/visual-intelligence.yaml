id: visual-intelligence
kind: programme
name: Visual Intelligence
scope: 'no'
summary: Research Council of Norway-funded Centre for Research-based Innovation on deep learning
  for visual data, with marine work including fish acoustics with the Institute of Marine
  Research and oil spills with KSAT.
facts:
- claim: Explores deep learning for visual data.
  url: https://nr.no/en/about/research-centres/visual-intelligence/
  fetched: '2026-11-02'
  quote: we explore the next generation of deep learning for visual data
  ai_type: deep-learning
- claim: With KSAT, explores foundation models for Earth observation to map marine oil spills.
  url: https://nr.no/en/about/research-centres/visual-intelligence/
  fetched: '2026-11-02'
  quote: we are exploring the use of foundation models for Earth observation to detect and
    map marine oil spills
  ai_type: foundation-models
- claim: Its marine work aims to improve monitoring, stock assessment and understanding of
    marine ecosystems.
  url: https://nr.no/en/about/research-centres/visual-intelligence/
  fetched: '2026-11-02'
  quote: Our objective is to improve work in monitoring, stock assessment and general understanding
    of marine ecosystems.
- claim: A Centre for Research-based Innovation, funded by the Research Council of Norway
    and consortium partners.
  url: https://www.visual-intelligence.no/about
  fetched: '2026-11-02'
  quote: Visual Intelligence is a Centre for research-based innovation, funded by the Research
    Council of Norway, project number 309439, and consortium partners.
- claim: Works on deep learning-based solutions for complex image analysis.
  url: https://www.visual-intelligence.no/about
  fetched: '2026-11-02'
  quote: Visual Intelligence aims to be the lead provider of novel deep learning-based solutions
    for cutting-edge complex image analysis.
  ai_type: deep-learning
- claim: Works with the Institute of Marine Research on deep learning models for fish in acoustic
    data.
  url: https://www.visual-intelligence.no/projects/detection-and-classification-of-fish-species-from-acoustic-data
  fetched: '2026-11-02'
  quote: The output is annotated by experts and will be utilized to train our deep learning
    models
- claim: Researches deep learning for visual data across health, marine science, energy and
    Earth observation.
  url: https://www.visual-intelligence.no/
  fetched: '2026-11-02'
  quote: We research the next generation of deep learning methodology for visual data and
    produce solutions for our consortium partners across innovation areas in medicine and
    health, marine science, energy, and earth observation.
- claim: Developed methods for detecting and classifying fish species from acoustic data.
  url: https://www.visual-intelligence.no/research-and-innovation/marine-science
  fetched: '2026-11-02'
  quote: detecting and classifying fish species from acoustic data using semi-supervised learning.
  ai_type: ml-semi-supervised
- claim: Develops deep learning models for marine monitoring.
  url: https://www.visual-intelligence.no/research-and-innovation/marine-science
  fetched: '2026-11-02'
  quote: We develop deep learning models and applications for monitoring the marine environment.
  ai_type: deep-learning
- claim: Worked with KSAT on detecting oil spills.
  url: https://www.visual-intelligence.no/research-and-innovation/earth-observation?ec035a48_page=1
  fetched: '2026-11-02'
  quote: detecting oil spills and characterizing their thickness, together with KSAT.
- claim: A Centre for Research-Based Innovation that specialises in AI for complex image data.
  url: https://nr.no/en/areas/visual-intelligence/
  fetched: &id001 2026-11-02
  quote: NR is part of Visual Intelligence, a Centre for Research-Based Innovation (SFI) that
    specialises in the use of artificial intelligence for complex image data.
- claim: Applications include marine science and Earth observation.
  url: https://nr.no/en/areas/visual-intelligence/
  fetched: *id001
  quote: Applications include medicine and healthcare, marine science, energy and Earth observation.
- claim: Says it develops solutions based on deep learning for visual data.
  url: https://nr.no/en/areas/visual-intelligence/
  fetched: *id001
  quote: We develop solutions based on deep learning for visual data
  ai_type: deep-learning
- claim: NR's marine work includes models that count seal pups in aerial images.
  url: https://nr.no/en/areas/visual-intelligence/
  fetched: *id001
  quote: developing models that count seal pups in aerial images on ice-covered landmass in
