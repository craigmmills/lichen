summary: Agency of 700 employees under the Ministry of Climate and Environment, managing Norwegian
  nature, running Rovbase, and using remote sensing and AI to develop a national nature map.
facts:
- claim: A government agency under the Ministry of Climate and Environment, with 700 employees.
  url: https://www.environmentagency.no/norwegian-environment-agency/about-us/
  fetched: '2026-11-02'
  quote: We are a government agency under the Ministry of Climate and Environment and have
    700 employees at our two offices in Trondheim and Oslo
- claim: Its primary tasks include managing Norwegian nature.
  url: https://www.environmentagency.no/norwegian-environment-agency/about-us/
  fetched: '2026-11-02'
  quote: Our primary tasks are to reduce greenhouse gas emissions, manage Norwegian nature,
    and prevent pollution.
- claim: Carries out conservation work with the county governors and the governor of Svalbard.
  url: https://www.environmentagency.no/norwegian-environment-agency/our-responsibilities/
  fetched: '2026-11-02'
  quote: the Norwegian Environment Agency, the country governors, and the governor of Svalbard
