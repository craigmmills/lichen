- claim: Has tested sensors in remote sensing pilots with the Norwegian Space Agency through
    Copernicus.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/fjernmaling/
