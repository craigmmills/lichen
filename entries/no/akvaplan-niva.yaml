- claim: Leads the eDepthNA project with NIVA.
  url: https://akvaplan.niva.no/no/nyhet/2026-06-08/autonomous-gliders-in-the-quest-for-ocean-biodiversity-the-edepthna-project-509271
  fetched: '2026-11-02'
  quote: The eDepthNA project is led by Akvaplan-niva in collaboration with the Norwegian
