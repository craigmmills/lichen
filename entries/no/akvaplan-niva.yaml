- claim: In the GLIDER project, three autonomous surface and underwater vehicles were deployed
    off Lofoten and Vesterålen in 2018.
  url: https://akvaplan.no/en/news/autonomous-vehicles-for-ecosystem-monitoring-in-the-arctic-435582
  fetched: *id001
  quote: three autonomous surface and underwater vehicles were deployed along the Lofoten–Vesterålen
    (LoVe) shelf-slope-oceanic system, in Arctic Norway.
- claim: From March to September 2018, the vehicles mapped zooplankton and recorded cetacean
    vocalisations and man-made noise.
  url: https://akvaplan.no/en/news/autonomous-vehicles-for-ecosystem-monitoring-in-the-arctic-435582
  fetched: *id001
  quote: map the spatiotemporal distribution of zooplankton, and record cetacean vocalizations
    and anthropogenic noise.
- claim: In a 2021 release it says it operated a Sailbuoy with an echosounder to identify
    adult fish around a wind farm for Equinor.
  url: https://akvaplan.no/en/pressrelease/2021-10-02/akvaplan-niva-operates-autonomous-glider-to-map-fish-presence-and-biomass-quantity-around-hywind-scotland-for-equinor-3133013
  fetched: *id001
  quote: The Sailbuoy, operated by Akvaplan-niva, is equipped with an echosounder to identify
