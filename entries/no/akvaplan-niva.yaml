  quote: NIVA owns the research company Akvaplan-niva with headquarters in Tromsø
- claim: In January 2021, the Fram Centre reported its use of machine learning to analyse
    plastic litter in drone and satellite images.
  url: https://framsenteret.no/hunting-for-plastic-new-digital-technology-to-find-and-map-marine-litter/
  fetched: '2026-11-02'
  quote: The first results from using artificial intelligence to analyse satellite images
    clearly demonstrate that lost fishing gear can be detected and identified.
