summary: A nationwide dataset of Norway's forest resources on a 16 by 16 metre grid, combining field plots
  with remote sensing data, run by the Norwegian Institute of Bioeconomy Research.
facts:
- claim: Gives detailed information about Norway's forest at a 16 by 16 metre grid.
  url: https://nibio.no/en/news/digital-forest-maps-provide-new-opportunities
  fetched: '2026-11-02'
  quote: SR16 stands for "SkogRessurskart" (forest resource map), on which the pixel size (grid) is 16
    x 16 meters.
- claim: Combines field plots with remote sensing data.
  url: https://nibio.no/en/news/digital-forest-maps-provide-new-opportunities
  fetched: '2026-11-02'
  quote: It is based on a combination of the National Forest Inventory's ground-based field sample plots
    and remote sensing data.
- claim: Made by automatic processing of remote sensing, terrain and map data.
  url: https://nibio.no/tema/skog/kart-over-skogressurser/skogressurskart-sr16
  fetched: '2026-11-02'
  quote: Datasettet er fremstilt gjennom automatisk prosessering av 3D fjernmålingsdata (fotogrammetri
    og laser), terrengmodeller, satellittdata, eksisterende kartdata (AR5) og data fra Landsskogflater.
- claim: Available from Kilden and for download on Geonorge.
  url: https://nibio.no/en/news/digital-forest-maps-provide-new-opportunities
  fetched: '2026-11-02'
  quote: is available from Kilden and for download on Geonorge
- claim: A complete dataset giving an overview of the extent and properties of Norway's forest resources.
  url: https://www.nibio.no/tema/skog/kart-over-skogressurser/skogressurskart-sr16
  fetched: '2026-11-02'
  quote: SR16 er et heldekkende datasett som gir oversikt over utbredelsen og egenskaper ved landets skogressurser.
- claim: Produced through automatic processing of 3D remote sensing data, terrain models, satellite data
    and existing map data.
  url: https://www.nibio.no/tema/skog/kart-over-skogressurser/skogressurskart-sr16
  fetched: '2026-11-02'
  quote: Datasettet er fremstilt gjennom automatisk prosessering av 3D fjernmålingsdata
- claim: A nationwide dataset showing the distribution and characteristics of Norway's forest resources.
  url: https://nibio.no/tema/skog/kart-over-skogressurser/skogressurskart-sr16
  fetched: &id001 2026-11-02
  quote: SR16 er et heldekkende datasett som gir oversikt over utbredelsen og egenskaper ved landets skogressurser.
- claim: Based on National Forest Inventory plots and remote sensing data, with information on tree species,
