facts:
- claim: An article updated in February 2024 describes its work with Naturvernforbundet
    Nordhordland, landowners, local farmers and Nordhordland Biosfæreområde IKS to
    restore heathlands at Rapeneset, an area of about 400 decares on Radøy in Alver
    municipality.
  url: https://naturvernforbundet.no/hordaland/?p=1346
  fetched: '2026-11-17'
  quote: Naturvernforbundet Hordaland and Naturvernforbundet Nordhordland are working
    together to restore the heathlands along with landowners, local farmers, and Nordhordland
    Biosfæreområde IKS.
- claim: Helped clear Sitka spruce from coastal heathland at Hatten farm in Øygarden
    at a volunteer work day on 29 February 2020.
  url: https://naturvernforbundet.no/hordaland/restaurering-av-kystlynghei-ved-hatten-i-oygarden/
  fetched: '2026-11-17'
  quote: Naturvernforbundet Hordaland (NVH) har bidratt ved flere dugnader for å rydde
    områder for sitkagran, noe vi håper kan være med å redusere tap av biologisk mangfold.
