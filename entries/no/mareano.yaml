id: mareano
kind: programme
name: MAREANO
scope: 'no'
summary: Programme running since January 2006, run by the Norwegian Environment Agency, mapping seabed
  depth, sediments, biodiversity, habitats and pollution offshore Norway, and using machine learning to
  model biotopes.
facts:
- claim: Maps the seabed and its habitats.
  url: https://www.ices.dk/news-and-events/news-archive/news/Pages/ICES-reviews-the-MAREANO-programme.aspx
  fetched: '2026-11-02'
  quote: The MAREANO program maps seabed terrain and depth, sediments, benthic habitats, species diversity
    and sediment pollutants.
- claim: Data are shown in the Mareano web portal.
  url: https://www.ices.dk/news-and-events/news-archive/news/Pages/ICES-reviews-the-MAREANO-programme.aspx
  fetched: '2026-11-02'
  quote: Data are presented in the Mareano web portal
- claim: In July 2023, Fugro said it had been involved since 2006 and had acquired over 142,000 km2 of
    data.
  url: https://fugro.com/news/business-news/2023/fugro-to-continue-mapping-norway-s-seabed-to-help-preserve-marine-resources
  fetched: '2026-11-02'
  quote: Fugro has been actively involved in the programme since 2006
- claim: Maps depth and topography, sediment composition, biodiversity, habitats and pollution in the
    seabed in Norwegian offshore areas.
  url: https://www.mareano.no/en/about_mareano
  fetched: '2026-11-02'
  quote: MAREANO maps depth and topography, sediment composition, biodiversity, habitats and biotopes,
    and pollution in the seabed in Norwegian offshore areas.
- claim: Running since 2 January 2006.
  url: https://www.hi.no/en/hi/forskning/projects/mareano
  fetched: '2026-11-02'
  quote: 02. januar 2006 -
- claim: Maps seabed depth, sediments, biodiversity, habitats and pollution in Norwegian offshore areas.
  url: https://mareano.no/en/about_mareano
  fetched: '2026-11-02'
  quote: MAREANO maps depth and topography, sediment composition, biodiversity, habitats and biotopes,
    and pollution in the seabed in Norwegian offshore areas.
- claim: Uses machine learning to classify, model and predict biotope distribution.
  url: https://www.mareano.no/en/topics/habitats/general-biotope-map
  fetched: '2026-11-02'
  quote: MAREANO uses multivariate statistics and machine learning for the classification, modelling and
    prediction of biotope distribution.
