  fetched: '2026-11-02'
  quote: Artsdatabanken publiserer digitale, ekspertskrevne bestemmelsesnøkler
- claim: Its App Store listing says Artsorakel tries to identify species in images with AI.
  url: https://apps.apple.com/no/app/artsorakel/id1522271415
  fetched: '2026-11-02'
  quote: Artsdatabankens Artsorakel prøver å artsbestemme bilder ved hjelp av kunstig intelligens.
- claim: GBIF's publisher record says it publishes datasets from government bodies and citizen
    science observation services.
  url: https://api.gbif.org/v1/organization/d3978a37-635a-4ae3-bb85-7b4d41bc0b88
  fetched: '2026-11-02'
  quote: Publishing datasets from governmental organizations and Citizen Science observations
