summary: National biodiversity knowledge bank set up in 2005 in Trondheim, supplying information
  on Norwegian biodiversity and running Artsobservasjoner; it also publishes identification
  keys and datasets.
facts:
- claim: The national data catalogue says it publishes digital expert-written identification
    keys.
