id: seabee
kind: programme
name: SeaBee
scope: 'no'
summary: A NIVA-led drone research infrastructure for coastal and aquatic studies in Norway,
  using deep learning on image data; NIVA gives its project period as 2020 to 2029.
facts:
- claim: Supports research, mapping and monitoring of habitats and animal communities.
  url: https://nr.no/en/projects/seabee
  fetched: '2026-11-02'
  quote: It facilitates research, mapping and monitoring of habitats, animal communities and
    human-made impacts in these environments.
- claim: Outputs include habitat maps and automated recognition of marine mammals and sea
    birds.
  url: https://nr.no/en/projects/seabee
  fetched: '2026-11-02'
  quote: Typical outputs include maps of marine habitats in coastal areas and automated recognition
    of marine mammals and sea birds.
- claim: Its analysis uses deep learning.
  url: https://nr.no/en/projects/seabee
  fetched: '2026-11-02'
  quote: Using advanced deep learning algorithms
  ai_type: deep-learning
- claim: Developed SeaBee GeoNode, a data storage and visualisation platform.
  url: https://www.niva.no/en/labs/dronelab
  fetched: '2026-11-02'
  quote: SeaBee has developed a data storage and visualization platform (SeaBee GeoNode)
- claim: Described by NIVA as a national research infrastructure led and coordinated by NIVA.
  url: https://www.niva.no/lab/dronelab
  fetched: '2026-11-02'
  quote: SeaBee er en nasjonal forskningsinfrastruktur ledet og koordinert av NIVA
- claim: Image data and other data products are used to train AI and machine learning algorithms
    that identify objects and habitat types.
  url: https://www.niva.no/lab/dronelab
  fetched: '2026-11-02'
  quote: inngår dessuten til trening av AL/ML algoritmer (KI) som brukes til å identifisere
    objekter og naturtyper
- claim: SeaBee has developed a data storage and visualisation platform, SeaBee GeoNode.
  url: https://www.niva.no/lab/dronelab
  fetched: '2026-11-02'
  quote: SeaBee har utviklet en datalagrings- og visualiseringsplattform
- claim: The NIVA-led project applied to the Research Council of Norway for 79 million kroner.
  url: https://www.niva.no/nyheter/flying-start-for-seabee
  fetched: '2026-11-02'
  quote: Det NIVA-ledede prosjektet SeaBee søkte om 79 millioner.
- claim: NIVA's release gave a funding period lasting to the end of 2024.
  url: https://www.niva.no/nyheter/flying-start-for-seabee
  fetched: '2026-11-02'
  quote: har en finansieringsperiode som varer ut 2024
- claim: An infrastructure project for drone-based research services for coastal and aquatic
    studies.
  url: https://nr.no/en/projects/seabee/
  fetched: '2026-11-02'
  quote: SeaBee is a Norwegian infrastructure project for drone-based research services for
    coastal and aquatic studies.
- claim: Uses deep learning to analyse drone data.
  url: https://nr.no/en/projects/seabee/
  fetched: '2026-11-02'
  quote: NR heads the development of AI algorithms, specifically deep learning
  ai_type: deep-learning
- claim: NIVA gives the project period as 2020 to 2029.
  url: https://www.niva.no/prosjekter/seabee
  fetched: &id001 2026-11-02
  quote: Prosjektperiode 2020 - 2029
- claim: Provides drones, equipment and staff, AI-based image analysis tools, and cloud-based
    storage and visualisation.
  url: https://nr.no/en/projects/seabee
  fetched: *id001
  quote: AI-based tools that enable easy and reliable image analysis
