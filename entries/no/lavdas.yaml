facts:
- claim: Aims to improve the map base for bog and wetland across Norway.
  url: https://kartverket.no/forskning-og-utvikling-fou/lavdas-landsdekkende-vatmarksdatasett/landsdekkende-vatmarksdatasett
  fetched: '2026-11-02'
  quote: Målet er å bedre kartgrunnlaget for myr og våtmark på landsdekkende basis i Norge.
- claim: Runs from 1 April 2024 to 31 March 2027 with a total budget of 14 million kroner.
  url: https://kartverket.no/forskning-og-utvikling-fou/lavdas-landsdekkende-vatmarksdatasett/landsdekkende-vatmarksdatasett
  fetched: '2026-11-02'
  quote: Prosjektet har en total kostnadsramme på 14 millioner kroner over tre år, fra 1. april 2024 –
    31. mars 2027.
- claim: Plans to use AI, satellite images and other data sources to improve wetland mapping.
  url: https://kartverket.no/forskning-og-utvikling-fou/lavdas-landsdekkende-vatmarksdatasett/landsdekkende-vatmarksdatasett
  fetched: '2026-11-02'
  quote: Ved hjelp av kunstig intelligens, satellittbilder og andre datakilder skal Kartverket sammen
    med Norsk institutt for bioøkonomi (NIBIO), Norsk institutt for naturforskning (NINA), Norsk regnesentral
    og Miljødirektoratet prøve å forbedre det offentlige kartgrunnlaget for våtmark.
