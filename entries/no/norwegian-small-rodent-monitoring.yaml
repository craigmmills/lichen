techniques:
- computer-vision
status: active
summary: A monitoring programme launched by the Norwegian Environment Agency in 2023
  using camera traps and an AI algorithm to identify rodent species, with five mountain
  stations set up that year.
facts:
- claim: The Norwegian Environment Agency launched monitoring with automated camera
    traps in 2023, photographing rodents year-round, including under snow. NINA and
    UiT operated it for the agency in 2023–2025.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/smagnager-overvaking/
  fetched: '2026-11-08'
  quote: Fra 2023 har Miljødirektoratet satt i gang en ny smågnagerovervåking basert
    på automatiserte kamerafeller som står ute og tar bilder av gnagerne hele året
    - også under snøen på vinteren.
- claim: Images are downloaded once a year and analysed with an artificial intelligence
    algorithm that recognises species.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/smagnager-overvaking/
  fetched: '2026-11-08'
  quote: Bildene blir lastet ned en gang i året og analysert med en kunstig intelligens-algoritme,
    som kjenner igjen arter.
- claim: Each station is a mountain area of about 5 square kilometres with 30 camera
    traps in different habitats.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/smagnager-overvaking/
  fetched: '2026-11-08'
  quote: Hver stasjon er et fjellområde på ca. 5 kvadratkilometer hvor det er plassert
    ut 30 kamerafeller i ulike habitater (lynghei, tuemark og snøleie).
- claim: 'Five stations were set up in 2023: Finse, Dovrefjell, Børgefjell, Joatka
    and the Varanger peninsula.'
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/smagnager-overvaking/
  fetched: '2026-11-08'
  quote: 'I 2023 ble det satt opp fem stasjoner (områder) for overvåking: på Finse,
    Dovrefjell (Snøheim), Børgefjell (Reinfjella), Joatka og Varangerhalvøya (Komagdalen).'
