summary: A volunteer monitoring programme recording bumblebees and butterflies to
  species on fixed transects three times each summer, with Sabima and NINA, supplying
  European butterfly indicator data and covering the whole country as of 2026.
facts:
- claim: Bumblebees and butterflies are recorded to species along fixed transects
    three times each summer, by volunteers administered and trained by Sabima, with
    NINA scientifically responsible.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/humler-og-sommerfugler/
  fetched: '2026-11-08'
  quote: Registreringene gjøres av frivillige som administreres og kurses av Sabima,
    i samarbeid med NINA som er faglig ansvarlig.
- claim: Delivers data to the European Environment Agency's European Grassland Butterfly
    Indicator.
  url: https://www.miljodirektoratet.no/ansvarsomrader/overvaking-arealplanlegging/miljoovervaking/overvakingsprogrammer/natur-pa-land/humler-og-sommerfugler/
  fetched: '2026-11-08'
  quote: Leverer data til arbeidet med det Europeiske Miljøbyråets (EEAs) "European
