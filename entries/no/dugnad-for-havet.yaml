summary: A citizen science programme, built and run by the Institute of Marine Research,
  where people register marine finds such as a new crab or many jellyfish; launched
  officially on 16 October 2020.
facts:
- claim: At dugnadforhavet.no people can register what they find, such as a crab new
    to Norway or large numbers of jellyfish.
  url: https://www.hi.no/hi/nyheter/2020/oktober/na-lanseres-dugnad-for-havet
  fetched: '2026-11-08'
  quote: 'På dugnadforhavet.no kan du nå bli med og registrere det du finner: Kanskje
    er det en krabbe som er ny her til lands'
- claim: Officially launched on 16 October 2020 at the Flødevigen research station
    in Arendal by the institute's then director, Sissel Rogne.
  url: https://www.hi.no/hi/nyheter/2020/oktober/na-lanseres-dugnad-for-havet
