  fetched: '2026-11-02'
  quote: The SmartForest project has a budget of NOK 234 million.
- claim: An eight-year research project that began in 2020.
  url: https://kommunikasjon.ntb.no/pressemelding/18314030/kunstig-intelligens-testet-i-skogforvaltningen?publisherId=17848410
  fetched: '2026-11-02'
  quote: et åtteårig forskningsprosjekt som startet i 2020
- claim: Works on AI models for segmenting and classifying laser data.
  url: https://www.finn.no/432329038
  fetched: '2026-11-02'
  quote: utvikling og implementering av KI-modeller og metoder som forbedret segmentering
    og klassifisering av laser data
- claim: Part of the Research Council of Norway's Centres for Research-based Innovation scheme,
    with a project period from 2020 to 2028.
  url: https://smartforest.no/about-us/
  fetched: '2026-11-02'
  quote: with a project period from 2020 – 2028
- claim: Its main aim is to improve the efficiency of the Norwegian forest sector through
    digital change.
  url: https://smartforest.no/
  fetched: '2026-11-02'
  quote: The primary objective of SmartForest is to improve the efficiency of the Norwegian
    forest sector by enabling a digital revolution
- claim: Total budget 234 million Norwegian kroner, per NIBIO's project page.
  url: https://www.nibio.no/en/projects/sfi-smartforest-bringing-industry-4.0-to-the-norwegian-forest-sector
  fetched: '2026-11-02'
  quote: Total budget 234 Mio. NOK
- claim: In December 2022, NIBIO reported plans for researchers to develop ForestSens, a cloud
    system using AI to analyse sensor data from forests.
  url: https://www.nibio.no/nyheter/kunstig-intelligens-i-skyen-skal-hjelpe-skogsektoren-med-gode-beslutninger
  fetched: '2026-11-02'
  quote: Nå skal skogforskere utvikle skyløsningen ForestSens som gjør det mulig å bruke kunstig
    intelligens til å analysere ulike data samlet i skogen.
- claim: A work package consolidates AI development, including point-cloud and image models
    and LLM-orchestrated decision-support layers.
  url: https://nibio.no/en/projects/sfi-smartforest-bringing-industry-4.0-to-the-norwegian-forest-sector
  fetched: &id001 2026-11-02
  quote: 'WP 5 consolidates AI development across modalities to support forest operations:
    advanced point-cloud and image models, real-time lidar processing for robotic applications,
    and LLM-orchestrated decision-support layers integrating model outputs and user inputs.'
  ai_type: large-language-models
- claim: A 2022 trade article says annotated point clouds are used to train deep learning
    models aimed at segmenting trees.
  url: https://www.geoweeknews.com/articles/norway-s-answer-to-the-smart-city-is-a-smart-forest/
  fetched: *id001
  quote: A part of the point clouds have been annotated and are used to train deep learning
    models.
  ai_type: deep-learning
