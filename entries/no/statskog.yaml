- claim: Is landowner in a number of national parks.
  url: https://www.statskog.no/eiendom/statskogs-eiendommer
  fetched: '2026-11-17'
  quote: Vesentlige deler av Statskogs areal er underlagt vern, og Statskog er grunneier
    i en rekke nasjonalparker.
- claim: Is organised as a state enterprise (statsforetak) and owns nearly 60 million
    decares, about 20 per cent of mainland Norway.
  url: https://www.statskog.no/om-statskog/dette-er-statskog
  fetched: '2026-11-17'
  quote: Statskog er organisert som et statsforetak med eget styre. Selskapet eier
