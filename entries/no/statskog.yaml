summary: A state enterprise that manages the state's forest and outfield land, owning
  nearly 60 million decares (about 20 per cent of mainland Norway), of which about
  43 per cent is protected.
facts:
- claim: Develops and manages the state's forest and outfield land.
  url: https://www.statskog.no/om-statskog
  fetched: '2026-11-17'
  quote: Statskog utvikler og forvalter alle verdier på statens skog- og utmarksarealer,
    og har en særskilt rolle i å legge til rette for allmennhetens tilgang til jakt-,
    fiske- og friluftsliv.
- claim: Owns land that is protected under nature conservation law, about 43 per cent
    of its holdings.
  url: https://www.statskog.no/eiendom/statskogs-eiendommer
  fetched: '2026-11-17'
  quote: Over 25 millioner dekar av Statskogs grunn er vernet i medhold av naturvernlovgivning.
