status: closed
summary: Closed CEPF-funded Wildlife Conservation Society project (June 2014 to December
  2016) that developed a SMART-based monitoring system in Kabobo-Luama, built two
  monitoring stations, and reported 20 local monitors still active in 2017.
facts:
- claim: CEPF grant 64756 to the Wildlife Conservation Society ran from June 2014
    to December 2016, and its final completion report is dated May 2017.
  url: https://www.cepf.net/sites/default/files/final-report-64756.pdf
  fetched: 2026-11-12
  quote: 'Project Dates: June 01, 2014 - December 31, 2016'
- claim: The project developed a monitoring system based on SMART in the Kabobo-Luama
    landscape.
  url: https://www.cepf.net/sites/default/files/final-report-64756.pdf
  fetched: 2026-11-12
  quote: 4. Development of a monitoring system based on SMART in the Kabobo-Luama
    landscape
- claim: The final report says 20 local monitors were still active and their data
    were managed with SMART software.
  url: https://www.cepf.net/sites/default/files/final-report-64756.pdf
  fetched: 2026-11-12
  quote: 20 local monitors are still active in the landscape. As such, data collected
    are managed with SMART software and results used for planning and community awareness.
- claim: The project built two monitoring stations, one in Kabobo and one in Ngandja.
  url: https://www.cepf.net/sites/default/files/final-report-64756.pdf
  fetched: 2026-11-12
  quote: two monitoring stations were constructed in the landscape including one in
    Kabobo and one in Ngandja
