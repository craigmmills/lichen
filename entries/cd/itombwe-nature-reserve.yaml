summary: A reserve run by ICCN that, with Primate Expertise, set up camera-trap and
  transect biomonitoring, reporting Grauer's gorillas recorded regularly by camera
  traps in September 2026.
facts:
- claim: The reserve says it is managed by ICCN with the support of its partners.
  url: https://rnitombwe.org/page/a-propos-de-nous
  fetched: 2026-11-15
  quote: Gérée par l'Institut Congolais pour la Conservation de la Nature (ICCN) avec
    l'appui de ses partenaires
- claim: With Primate Expertise, the reserve set up a biomonitoring programme across
    its sectors using camera traps and transects.
  url: https://www.rnitombwe.org/post/itombwe-revele-ses-tresors--les-gorilles-de-plaine-de-lest-filmes-pour-la-premiere-fois-par-des-cameras-traps-
  fetched: 2026-11-15
  quote: En partenariat avec Primate Expertise, nous avons mis en place un programme
    de Biomonitoring dans les différents secteurs de la Réserve Naturelle d’Itombwe
- claim: In September 2026 the reserve reported Grauer's gorillas recorded regularly
    by camera traps installed in the reserve.
  url: https://www.rnitombwe.org/post/journee-mondiale-du-gorille-2026-a-itombwe-les-cameras-racontent-une-histoire-de-conservation
  fetched: 2026-11-15
  quote: des gorilles de Grauer enregistré régulièrement dans leur habitat naturel
    par des caméras-traps installées dans la réserve
- claim: Camera-trap wildlife monitoring was developed with technical and financial
    support from Primate Expertise and Wild Earth Allies.
  url: https://www.rnitombwe.org/post/journee-mondiale-du-gorille-2026-a-itombwe-les-cameras-racontent-une-histoire-de-conservation
  fetched: 2026-11-15
  quote: Le développement du suivi de la faune par caméra-trap grâce à l’appui technique
    et financier de Primate Expertise (PEx) - Wild Earth Allies (WEA)
- claim: In August 2026, ICCN and Strong Roots Congo signed a public-private partnership
    to improve the effectiveness of the reserve's management.
  url: https://www.rnitombwe.org/post/rni-liccn-et-strong-roots-congo-scellent-un-partenariat-public-prive-pour-une-conservation-durable-de-la-biodiversite
  fetched: 2026-11-15
  quote: En août 2026, l’Institut Congolais pour la Conservation de la Nature (ICCN)
    et Strong Roots Congo ont signé un contrat de Partenariat Public-Privé (PPP)
