summary: Collaborative mapping initiative on resource issues in the DRC, built on customised OpenStreetMap,
  whose management passed in 2013 to an IIASA-led project, with no current operator identified.
facts:
- claim: OSFAC describes it as a collaborative mapping initiative for transparency and accountability
    on resource issues in the DRC.
  url: https://www.osfac.net/moabi-dr-congo
  fetched: 2026-11-08
  quote: Moabi DRC is a collaborative mapping initiative that aims to increase transparency and accountability
    on resource issues in DRC.
- claim: The platform is built on a customised version of OpenStreetMap.
  url: https://www.osfac.net/moabi-dr-congo
  fetched: 2026-11-08
  quote: The platform is built on a customized version of OpenStreetMap .
- claim: OSFAC's page says management passed in 2013 to the IIASA-led Improving Forest Governance through
    Independent Monitoring in DRC project; no page read gives who runs it today.
  url: https://www.osfac.net/moabi-dr-congo
  fetched: 2026-11-08
  quote: In 2013, management of Moabi DRC was handed over to the IIASA lead Improving Forest Governance
    through Independent Monitoring in DRC project.
