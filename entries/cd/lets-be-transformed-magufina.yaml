summary: Community organisation that Global Nature Watch said in July 2026 trained monitors who documented
  illegal logging and unauthorised mining across 450,000 hectares of Indigenous lands, with a planned
  Forest Watcher training and dashboard.
facts:
- claim: In July 2026, Global Nature Watch, formerly Global Forest Watch, said MAGUFINA had trained community
    monitors who documented illegal logging camps and unauthorised mining across 450,000 hectares of Indigenous
    lands over the preceding three years.
  url: https://www.globalforestwatch.org/blog/users-in-action/2026-global-nature-watch-small-grants-fund-recipients/
  fetched: 2026-11-08
  quote: Over the past three years, MAGUFINA trained community monitors who documented illegal logging
    camps and unauthorized mining across 450,000 hectares of Indigenous lands.
- claim: Its grant project plans to train community monitors to use the Forest Watcher app and to build
    a MapBuilder dashboard combining GNW alerts with concession data and field reports.
  url: https://www.globalforestwatch.org/blog/users-in-action/2026-global-nature-watch-small-grants-fund-recipients/
