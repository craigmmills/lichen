facts:
- claim: Describes itself as a large-scale collaborative research network designed
    to document bonobo diversity and study sympatric species across 30 sites in the
    DRC.
  url: https://bondiv.org/
  fetched: 2026-11-12
  quote: allowing for simultaneous study of multiple sympatric species across 30 sites
    within the Democratic Republic of Congo
- claim: Installs a 25 km2 grid monitored for 12 months at each site and collects
    camera-trap, vegetation, behavioural, eDNA and climate data.
  url: https://bondiv.org/
  fetched: 2026-11-12
  quote: 'Data Collection: Camera traps, vegetation plots, behavioural observations,
    eDNA, climate data & more.'
