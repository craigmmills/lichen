summary: A Congolese independent forest monitoring NGO created in September 2012 that Global Forest Watch
  says used alerts and trained monitors from 25 organisations in 2023 and 2024.
facts:
- claim: A Congolese environmental NGO created in September 2012 to continue independent forest observation
    in the DRC.
  url: https://www.ogfrdc.cd
  fetched: 2026-11-08
  quote: est une organisation non gouvernementale environnementale de droit congolais créée en septembre
    2012 dans le but de pérenniser l'action de l'Observation Indépendante des forêts en RDC
- claim: Aims to develop and carry out monitoring of forest management and logging.
  url: https://www.ogfrdc.cd
  fetched: 2026-11-08
  quote: L'OGF vise à développer et conduire le monitoring des activités de gestion et d'exploitation
    ressources forestières
- claim: Global Forest Watch's blog says OGF used GFW deforestation alerts to identify causes of deforestation
    in a reserve.
  url: https://www.globalforestwatch.org/blog/users-in-action/gfw-voices-serge-bondo/
  fetched: 2026-11-08
  quote: OGF used GFW's deforestation alerts to identify the different causes of deforested activities
- claim: Global Forest Watch's blog says that in 2023 and 2024, with support from GFW's Small Grants Fund,
    OGF trained a network of independent forest monitors of 25 organisations.
  url: https://www.globalforestwatch.org/blog/users-in-action/gfw-voices-serge-bondo/
  fetched: 2026-11-08
  quote: In 2023 and 2024, with support from GFW's Small Grants Fund (SGF), OGF worked on building the
    skills of a network of independent forest monitors, which currently consists of 25 organizations
- claim: OSFAC's Moabi DRC page describes it as an independent forest monitoring NGO in the DRC whose
    main aim is monitoring forest management and exploitation.
  url: https://www.osfac.net/moabi-dr-congo
  fetched: 2026-11-08
  quote: The primary aim of OGF is to develop and conduct monitoring activities on forest management and
    exploitation in DRC.
- claim: The same page says it is a mandated independent observer for FLEG in the DRC and took over the
    DRC operations of Resource Extraction Monitoring.
  url: https://www.osfac.net/moabi-dr-congo
  fetched: 2026-11-08
  quote: They are a mandated Independent Observer for FLEG DRC and have conducted monitoring missions
    in partnership with the World Bank and FAO.
