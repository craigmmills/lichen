summary: Kisangani biodiversity monitoring centre, created by University of Kisangani decision in January
  2011, specialising in field research, holding Boyekoli Ebale Congo 2010 collections and registered as
  a GBIF data publisher.
facts:
- claim: Works on biodiversity monitoring in the DRC, with researchers supervised by professors of the
    University of Kisangani's science faculty, specialising in field research.
  url: https://cd.chm-cbd.net/fr/ministeres-ou-instituts-gouvernementaux/centre-de-surveillance-de-la-biodiversite-csb
  fetched: 2026-11-08
  quote: Le Centre de Surveillance de la Biodiversité œuvre pour le monitoring de la biodiversité en RDC.
    Avec son équipe de chercheurs encadrée par des Professeurs de la Faculté des Sciences de l'Université
    de Kisangani, ce Centre est spécialisé dans les recherches sur terrain.
- claim: Named the DRC's secondary focal point for the Clearing House Mechanism of the Convention on Biological
    Diversity, working with the ministry's sustainable development directorate.
  url: https://cd.chm-cbd.net/fr/ministeres-ou-instituts-gouvernementaux/centre-de-surveillance-de-la-biodiversite-csb
  fetched: 2026-11-08
  quote: Le CSB a été institué Point Focal Secondaire de la RDC pour le Centre d'échange d'informations
    (CHM – Clearing House Mechanism) de la Convention sur la Diversité Biologique (CDB)
- claim: Its address is 04 Avenue Kithima, Makiso, Kisangani.
  url: https://centresurveillancebiodiversite.org/
  fetched: 2026-11-08
  quote: 04 Avenue Kithima, Commune Makiso, Kisangani, Province de la Tshopo, RDC
- claim: Holds biological collections gathered during the Boyekoli Ebale Congo 2010 expedition and added
    to since.
  url: https://centresurveillancebiodiversite.org/
  fetched: 2026-11-08
  quote: Ses collections biologiques ont été récoltées durant la grande expédition internationale « Boyekoli
    Ebale Congo 2010 » et ont constamment été enrichies depuis lors.
