  provinces.
facts:
- claim: Launched as a new three-year programme of community-led forest monitoring in the DRC, announced
    on 30 July 2026.
  url: https://www.rainforestfoundationuk.org/rfuk-and-partners-launch-new-phase-of-community-forest-monitoring-in-the-drc/
  fetched: 2026-11-08
  quote: RFUK and our partners have officially launched a new phase of community-led forest monitoring
    in the Democratic Republic of the Congo (DRC), marking the start of an ambitious new three-year programme
- claim: Partners were trained on ForestLink and ForestEye to support communities in Equateur, Mongala,
    Mai-Ndombe and North Kivu.
  url: https://www.rainforestfoundationuk.org/rfuk-and-partners-launch-new-phase-of-community-forest-monitoring-in-the-drc/
