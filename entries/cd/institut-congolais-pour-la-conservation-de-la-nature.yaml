summary: State protected-area body in the DRC, named as planned manager of the 2024 Okapi census and partner
  in Salonga ranger training and Upemba National Park management.
facts:
- claim: Listed by the environment ministry's site among the bodies under the ministry.
  url: https://www.medd.gouv.cd
  fetched: 2026-11-08
  quote: Etablissements ACE ICCN FFN
- claim: The CBD clearing-house for the DRC, citing an Okapi Conservation Project release, says ICCN was
    to manage the June to December 2024 okapi census in the Okapi Wildlife Reserve, the first full wildlife
    count there since 2013.
  url: https://cd.chm-cbd.net/fr/news/liccn-lance-un-nouveau-recensement-des-okapis-dans-la-rfo
  fetched: 2026-11-08
  quote: Ce recensement est prévu de juin à décembre 2024, et sera géré par l'Institut Congolais pour
    la Conservation de la Nature (ICCN).
- claim: Chengeta Wildlife says its ranger training in Salonga is in partnership with ICCN and WWF DRC,
    and that the operations-room team needs to be able to work with SMART, Earth Ranger and QGIS.
  url: https://chengetawildlife.org/exciting-updates-from-salonga/
  fetched: 2026-11-08
  quote: the team in the Operations Room needs to able to work with systems like SMART, Earth Ranger and
    QGIS to understand landscape dynamics
- claim: A Forgotten Parks Foundation report describes ICCN as the state body that manages protected areas
    in the DRC.
  url: https://forgottenparks.org/participation-de-forgotten-parks-au-colloque-international-organise-par-liccn-et-lunilu-tenu-a-lubumbashi-en-rdc-du-19-au-21-octobre-2022/
  fetched: 2026-11-08
  quote: en tant qu’organe étatique de gestion des aires protégées, le gouvernement a mis à la disposition
    de l’ICCN un corps militaire spécialisé dans la protection des aires protégées (CorPPN)
- claim: The Forgotten Parks Foundation says it signed a public-private partnership with the Congolese
    government through ICCN to manage Upemba National Park.
  url: https://forgottenparks.org/project/upemba/
  fetched: 2026-11-08
  quote: On July 7, 2017, Forgotten Parks Foundation (FPF) signed a Public-Private Partnership (PPP) agreement
    with the Congolese government through the Institut Congolais pour la Conservation de la Nature (ICCN)
