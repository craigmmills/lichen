summary: A Yangambi tower studying forest greenhouse gas exchange, built by ERAIFT, CIFOR-ICRAF and Ghent
  University, which ERAIFT says has operated since October 2020 and promises open data.
facts:
- claim: ERAIFT says Yangambi now hosts the first flux tower in the heart of the Congo Basin for studying
    greenhouse gas exchange between forest and atmosphere.
  url: https://eraift-rdc.org/fr/tour-a-flux-yangambi
  fetched: 2026-11-08
  quote: Yangambi abrite désormais la première tour à flux au cœur du bassin du Congo pour l’étude des
    échanges de gaz à effet de serre entre la forêt et l’atmosphère.
- claim: ERAIFT says the tower has operated since early October 2020.
  url: https://eraift-rdc.org/fr/tour-a-flux-yangambi
  fetched: 2026-11-08
  quote: la tour est opérationnelle depuis début octobre 2020
- claim: ERAIFT says all data produced will be open and free to the international scientific community.
  url: https://eraift-rdc.org/fr/tour-a-flux-yangambi
  fetched: 2026-11-08
  quote: Toutes les données produites seront ouvertes et gratuites pour la communauté scientifique internationale.
- claim: ERAIFT says the tower is managed by Congolese technicians working with INERA.
  url: https://eraift-rdc.org/fr/tour-a-flux-yangambi
  fetched: 2026-11-08
  quote: La tour est gérée par des techniciens congolais travaillant avec l’INERA, qui ont reçu toute
    la formation nécessaire sur les aspects techniques et opérationnels.
- claim: ERAIFT says the tower is part of a project funded by the European Union and Belgium to make Yangambi
    a scientific hub.
  url: https://eraift-rdc.org/fr/tour-a-flux-yangambi
  fetched: 2026-11-08
  quote: Cette initiative fait partie d’un projet financé par l’Union européenne et la Belgique pour faire
    de Yangambi un pôle scientifique au bénéfice des populations et de la biodiversité de la RDC.
