summary: Jane Goodall Institute project announced in February 2024 with a $5 million Bezos Earth Fund
  grant over three years, covering areas in the DRC and Republic of the Congo, including satellite and
  mobile monitoring.
facts:
- claim: In February 2024 JGI announced a $5 million Bezos Earth Fund grant for work over the next three
    years in three DRC regions covering 701,660 hectares and five Republic of the Congo areas covering
    805,828 hectares.
  url: https://janegoodall.org/news/furthering-conservation-in-the-congo-basin-with-bezos-earth-fund/
  fetched: 2026-11-08
  quote: The focus will be on three regions covering 701,660 hectares in the DRC and five areas covering
    805,828 hectares in the RoC, with plans scheduled over the next three years.
- claim: JGI says the work includes monitoring of biodiversity threats using mobile technology and high-resolution
    satellite sensors.
  url: https://janegoodall.org/news/furthering-conservation-in-the-congo-basin-with-bezos-earth-fund/
  fetched: 2026-11-08
  quote: monitoring of biodiversity threats using cutting-edge mobile technologies and new high-resolution
    satellite sensors
