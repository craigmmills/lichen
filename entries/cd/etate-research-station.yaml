facts:
- claim: The station is the Salonga Conservation Initiative's base of operations in
    Salonga National Park.
  url: https://www.salongaconservation.org/our-work
  fetched: 2026-11-12
  quote: The Etate (Et-TAH-Tay) Research Station is SCI’s base of operations in the
    Salonga National Park.
- claim: It has 13 resident staff who conduct field work year-round.
  url: https://www.salongaconservation.org/our-work
  fetched: 2026-11-12
  quote: The site has grown in the last decade to accommodate 13 resident staff who
    conduct field work year-round.
- claim: SCI says it has re-surveyed four major forest blocks covering about 30% of
    the park since 2020 and shares the data with the park's ICCN and WWF management
    unit.
  url: https://www.salongaconservation.org/our-work
  fetched: 2026-11-12
  quote: SCI shares survey data and results with Salonga’s park management unit, formed
    by ICCN/WWF co-managers
- claim: SCI supports a long-term elephant bai monitoring project with trail cameras,
    with over 500,000 images since 2018.
  url: https://www.salongaconservation.org/our-work
  fetched: 2026-11-12
  quote: We have amassed over 500,000 images since 2018.
