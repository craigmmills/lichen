summary: A 5,127 km2 park managed by African Parks, according to a 2020 JRS grant
  page that reports satellite tracking of elephants and giraffes and community chimpanzee
  monitoring, which COVID-19 had halted for primate research.
facts:
- claim: A JRS Biodiversity Foundation page for a 2020 grant says African Parks manages
    the 5,127 km2 park.
  url: https://jrsbiodiversity.org/grants/african-parks-2020/
  fetched: 2026-11-15
  quote: African Parks manages the 5,127 km 2 Garamba National Park
- claim: The 2020 grant page reports satellite tracking of the park's elephant and
    giraffe populations.
  url: https://jrsbiodiversity.org/grants/african-parks-2020/
  fetched: 2026-11-15
  quote: Satellite tracking technology is used on elephant and giraffe populations
- claim: The 2020 grant page describes regular chimpanzee tracking and monitoring
    involving community members in the park and surrounding reserves, but says primate
    research had been halted by COVID-19 impacts.
  url: https://jrsbiodiversity.org/grants/african-parks-2020/
  fetched: 2026-11-15
  quote: Chimpanzee tracking and monitoring efforts involve community members and
    are regularly conducted within the park and surrounding reserves.
- claim: A JRS grant to African Parks for research and monitoring in Garamba and Zakouma
    was to fund, in Garamba, chimpanzee monitoring, giraffe research and the biodiversity
    offset programme over 18 months.
  url: https://jrsbiodiversity.org/grants/african-parks-2020/
  fetched: 2026-11-15
  quote: JRS support over 18 months will fund chimpanzee monitoring, giraffe research,
    and the biodiversity offset program.
