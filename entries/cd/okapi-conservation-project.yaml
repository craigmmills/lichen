summary: Programme run by Wildlife Conservation Global, partnering with ICCN, whose
  2025 highlights report camera-trap deployment near Epulu and an informer network
  of 50 people guiding eco-guard patrols.
facts:
- claim: Its 2025 highlights report camera-trap deployment in the Bianje sector, 16
    km east of Epulu, recording okapi, chimpanzees, forest elephants and other species.
  url: https://www.okapiconservation.org/blog/2025-okapi-conservation-project-highlights
  fetched: 2026-11-12
  quote: Through the successful deployment of camera traps in the Bianje sector, 16
    km East of Epulu, OCP documented evidence of conservation success
- claim: Its 2025 highlights describe an informer network of 50 individuals whose
    intelligence guided eco-guard patrols.
  url: https://www.okapiconservation.org/blog/2025-okapi-conservation-project-highlights
  fetched: 2026-11-12
  quote: A discreet, area-wide informer network of 50 individuals—each operating independently—delivered
    vital intelligence on illegal activities.
- claim: In 2016 it formed a camera-trap team of OCP staff, ICCN rangers and volunteers
    to monitor okapi populations.
  url: https://www.wildlifeglobal.org/initial-phase-of-camera-trap-study-proves-successful/
  fetched: 2026-11-12
  quote: to train a team of OCP staff, ICCN rangers and volunteers to set up, monitor,
    collect and sort images and be able to move the camera traps around the forest
