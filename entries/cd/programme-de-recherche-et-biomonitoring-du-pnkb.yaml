  quote: Cette formation s’inscrit dans le cadre du Programme de Recherche et Biomonitoring
    du PNKB.
- claim: An April 2026 report says the park produces and uses a large volume of geospatial
    data every day through the programme.
  url: https://kivuinfo.com/sud-kivu-une-formation-strategique-pour-renforcer-le-suivi-des-elephants-de-foret-au-parc-national-de-kahuzi-biega/
