summary: Programme run by Kahuzi-Biega National Park, partnering with the Université
  Evangélique en Afrique, which began a five-day ecological monitoring training on
  13 April 2026 covering GPS, camera traps, SMART Conservation and QGIS.
facts:
- claim: A five-day ecological monitoring training for park staff and local community
    members began on 13 April 2026 as part of the programme.
