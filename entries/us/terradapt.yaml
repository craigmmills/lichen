  quote: TerrAdapt co-develops cutting edge tools and dynamic datasets to serve regional-scale
    conservation planning needs, anywhere.
- claim: Monitors habitat and connectivity with remote sensing and cloud computing,
    updating maps each year.
  url: https://terradapt.org/
  fetched: 2026-11-21
