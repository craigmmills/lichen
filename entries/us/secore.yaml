facts:
- claim: Describes itself as a conservation organisation for coral reef restoration,
    founded in 2015, that turns findings into engineered tools.
  url: https://www.secore.org/en/about-us
  fetched: 2026-11-22
  quote: is a leading conservation organization for the restoration of coral reefs
    founded in 2015.
- claim: Is a US nonprofit corporation based in Ohio.
  url: https://www.secore.org/en/support/donate
  fetched: 2026-11-22
  quote: The corporation is based in Ohio (USA).
- claim: Says its mission is creating and sharing tools and technologies to restore
    coral reefs.
  url: https://www.secore.org/
  fetched: 2026-11-22
  quote: creating and sharing the tools and technologies to sustainably restore coral
    reefs worldwide
- claim: Has developed a floating coral rearing basin (CRIB) for rearing and settling
    coral larvae without a land-based facility.
  url: https://www.secore.org/en/our-work/technology
  fetched: 2026-11-22
  quote: SECORE has developed a floating coral CRIB (aka Coral Rearing In-Situ Basin
    or CRIB)
- claim: Collects coral spawn with specially designed nets and settles larvae on custom
    tiles called Seeding Units.
  url: https://www.secore.org/en/our-work/technology
  fetched: 2026-11-22
  quote: we use custom designed settlement tiles, so called Seeding Units that can
    be outplanted effectively.
- claim: Pilots new tools with implementation partners and makes them available to
    its partner network.
  url: https://www.secore.org/en/our-work/technology
  fetched: 2026-11-22
  quote: We pilot new coral seeding technology together with our implementation partners
    .
