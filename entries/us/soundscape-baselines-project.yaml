- claim: Shares AI-assisted bird vocalisation and mammal detections from tropical
    and temperate forests.
  url: https://www.soundforestlab.org/soundscapebaselines
  fetched: 2026-11-21
  quote: AI-assisted bird vocalization and mammal detections from tropical and temperate
    forests worldwide.
- claim: Also uses camera traps and remote sensing alongside the recorders.
  url: https://www.soundforestlab.org/soundscapebaselines
  fetched: 2026-11-21
