    and Canadian province have been operated for at least one year by IBP and its
    collaborators.
  url: https://www.birdpop.org/pages/mapsMap.php
  fetched: 2026-11-09
  quote: Since the MAPS program began in 1989, more than 1400 stations covering nearly
    every state and Canadian province have been operated for at least one year by
    IBP and our many collaborators.
- claim: Operates the Monitoreo de Sobrevivencia Invernal (MoSI) programme with international
    partners; its stations have operated in 15 countries.
  url: https://birdpop.org/pages/programs.php
