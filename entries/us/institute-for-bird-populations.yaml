    Invernal (MoSI) Program
- claim: Has started studies of bumble bee ecology and other pollinators in the Sierra
    Nevada region.
  url: https://birdpop.org/pages/programs.php
  fetched: 2026-11-09
  quote: IBP has initiated multiple studies of bumble bee ecology, Rufous Hummingbird,
