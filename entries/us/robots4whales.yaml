summary: Led by Mark Baumgartner at Woods Hole Oceanographic Institution, the project dates
  its mission archive to 2012 and uses autonomous platforms for near-real-time satellite reporting
  of marine mammal sounds.
facts:
- claim: Autonomous platforms automatically detect marine mammal sounds, identify the species
    and report them to researchers by satellite in near real time.
  url: http://robots4whales.whoi.edu/
  fetched: 2026-11-21
  quote: The robots automatically detect those sounds, identify the species based on characteristics
    of the sounds, and report which species have been heard to researchers on shore via satellite
    in near real time.
- claim: Verified detections are shared with scientists, industry and managers, for measures
    such as NOAA Slow Zones for Right Whales.
  url: http://robots4whales.whoi.edu/
  fetched: 2026-11-21
  quote: Human analysts verify this information, after which it is automatically shared with
    scientists, industry, and state and federal managers to inform and enable research and
    conservation measures
- claim: Lists active missions using moored buoys and Slocum gliders, and archived missions
    dating back to 2012.
  url: http://robots4whales.whoi.edu/
  fetched: 2026-11-21
  quote: Explore our active missions that feature robots listening for marine mammals right
    now as well as our archived missions dating back to 2012.
