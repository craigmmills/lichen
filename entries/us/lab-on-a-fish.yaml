summary: Biotelemetry sensor built by Pacific Northwest National Laboratory that combines
  edge computing with wireless sensing of fish physiology and environment, validated
  in rainbow trout, white sturgeon and walleye.
facts:
- claim: A biotelemetry sensor combining edge computing with wireless sensing of physiology,
    behaviour and the ambient environment of fish or small aquatic species.
  url: https://www.pnnl.gov/available-technologies/lab-on-a-fish
  fetched: 2026-11-21
  quote: Lab-on-a-Fish simultaneously evaluates and monitors the health, behavior,
    and environment of fish or small aquatic species.
- claim: Can give the 3-D location of a tagged animal and has been validated in rainbow
    trout, white sturgeon and walleye.
  url: https://www.pnnl.gov/available-technologies/lab-on-a-fish
  fetched: 2026-11-21
  quote: The technology can provide the 3-D locations of a tagged animal
