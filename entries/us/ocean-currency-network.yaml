facts:
- claim: Maps a nation's seagrass from satellite as a first-pass model, and watches
    coasts with open satellite data.
  url: https://www.ocn.ai/sovereign
  fetched: 2026-11-21
  quote: We map a nation's seagrass from satellite as a first-pass model. It is modeled
    until field checks confirm it.
- claim: Names the satellite sources it uses to watch coasts.
  url: https://www.ocn.ai/sovereign
  fetched: 2026-11-21
  quote: We watch coasts with open satellite data (Sentinel-2, Landsat, Sentinel-1,
    MODIS, PACE) and vessel tracking (AIS).
- claim: Offers insurers a read of how well reefs and mangroves protect coastal assets,
    taken from space and from the water.
  url: https://www.ocn.ai/coastal
  fetched: 2026-11-21
  quote: A read on how well the reef and mangroves protect each asset, taken from
    space and from the water.
- claim: Says it checks carbon credits before purchase and monitors the asset afterwards.
  url: https://www.ocn.ai
  fetched: 2026-11-21
  quote: We check the credit. Then we keep watching it.
