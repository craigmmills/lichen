summary: NASA-funded project in Sonoma County, California, combining volunteer AudioMoth recordings
  with satellite data to monitor bird diversity; UC Merced collaborators developed a prototype
  deep learning bird identification framework.
facts:
- claim: Combines citizen-science bioacoustic data with satellite and environmental data to
    monitor bird diversity in Sonoma County, California.
  url: https://www.calstate.edu/impact-of-the-csu/research/highlights/sonoma/Pages/soundscapes.aspx
  fetched: 2026-11-22
  quote: S2L combines bioacoustic data collected by citizen scientists with satellite and
    environmental data to monitor bird diversity in Sonoma County, California.
- claim: Collaborators at UC Merced developed a prototype deep learning framework to identify
    bird species in noisy recordings.
  url: https://www.calstate.edu/impact-of-the-csu/research/highlights/sonoma/Pages/soundscapes.aspx
  fetched: 2026-11-22
  ai_type: deep-learning
  quote: University of California, Merced (UCM) developed a prototype deep learning framework
    to identify bird species in noisy audio recordings.
- claim: Volunteers place low-cost AudioMoth recorders in habitats across the county.
  url: https://www.calstate.edu/impact-of-the-csu/research/highlights/sonoma/Pages/soundscapes.aspx
  fetched: 2026-11-22
  quote: The volunteers place low-cost, portable sound recorders, called AudioMoths, in various
    habitats in the county.
- claim: The team planned to combine field bioacoustic data with remote sensing and other
    variables in models estimating the probability of bird species occupancy.
  url: https://www.calstate.edu/impact-of-the-csu/research/highlights/sonoma/Pages/soundscapes.aspx
  fetched: 2026-11-22
  quote: species distribution models (SDM) that estimate the probability of occupancy for
    a given bird species
