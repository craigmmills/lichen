facts:
- claim: The Artisanal Mining Grand Challenge entry proposed an open mapping platform
    using public radar satellite imagery and other data to detect land affected by
    mining in tropical forests.
  url: https://www.artisanalminingchallenge.com/innovation/project-inambari
  fetched: 2026-11-21
  quote: An open mapping platform that uses publicly available SAR (Synthetic Aperture
    Radar) satellite imagery in combination with other data sources for detecting
    mining affected lands in tropical forests.
- claim: At the time of the challenge pitch, the team was developing a model based
    on Sentinel-1 radar imagery and planned to use drone imagery from partners in
    Peru for development and validation.
  url: https://www.artisanalminingchallenge.com/innovation/project-inambari
  fetched: 2026-11-21
  quote: we are developing a mining detection model primarily based on a novel source
    of open source imagery, satellite radar from European Space Agency’s Sentinel-1
    satellites
- claim: Field testing took place in Tambopata, Madre de Dios, Peru, and the platform
    is meant for local communities, regulators and conservation groups.
  url: https://www.artisanalminingchallenge.com/innovation/project-inambari
  fetched: 2026-11-21
  quote: The platform will also provide an essential tool for government regulators
    and groups advocating for conservation.
