summary: An international non-profit with US and Dutch legal entities, it facilitates
  a public research consortium and uses AI-enabled spatial models based on plant samples
  to trace traded forest products.
facts:
- claim: Describes itself as an international nonprofit protecting forests through
    science-based product verification.
  url: https://worldforestid.org/
  fetched: 2026-11-22
  quote: World Forest ID is an international nonprofit protecting forests through
    science-based product verification.
- claim: Its website lists World Forest ID Association as a US 501(c)(3) nonprofit
    with a Washington, DC address and World Forest ID Stichting as a foundation registered
    in the Netherlands.
  url: https://worldforestid.org/
  fetched: 2026-11-22
  quote: World Forest ID Association A US 501(c)(3) nonprofit 1 Thomas Cir NW, Suite
    700 Washington, DC 20005, USA
- claim: Builds AI-enabled spatial models from georeferenced plant samples to show
    the source location of traded products.
  url: https://worldforestid.org/
  fetched: 2026-11-22
  quote: World Forest ID creates AI-enabled spatial models that make it possible to
    understand the source location of traded products.
- claim: Combines chemical analysis of samples with environmental data using AI to
    build spatial reference models.
  url: https://worldforestid.org/
  fetched: 2026-11-22
  quote: The chemical analysis data from samples and environmental data are combined
    using AI to create spatial reference models
- claim: Facilitates a consortium of public research institutions whose mission includes
    expanding the data needed to make forest-connected supply chains transparent.
  url: https://worldforestid.org/
  fetched: 2026-11-22
  quote: Facilitated by World Forest ID, its mission is to scale the data necessary
    to make forest-connected supply chains transparent for all stakeholders
