facts:
- claim: Describes itself as an applied science lab working at the intersection of
    remote sensing and ecology for carbon and biodiversity credit projects.
  url: https://thegazelle.co
  fetched: 2026-11-22
  quote: Gazelle is an applied science lab building technologies at the intersection
    of remote sensing & ecology to support carbon & biodiversity credit projects
- claim: Says it is building a large verified biomass dataset on grasslands.
  url: https://thegazelle.co
  fetched: 2026-11-22
  quote: Gazelle is building one of the world's largest verified biomass datasets
