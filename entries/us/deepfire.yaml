summary: AI platform built at Louisiana State University combining prediction, satellite detection
  and spread forecasting, with LSU reporting 96% confirmation of its XPRIZE final-round New
  South Wales fire reports.
facts:
- claim: Is an AI-based platform that can detect wildfires early, built at LSU and recognised
    in the XPRIZE Wildfire competition.
  url: https://www.lsu.edu/mediacenter/news/2026/09/23_deepfire_award.php
  fetched: 2026-11-21
  quote: DeepFire is an AI-based platform that can detect wildfires early, before they become
    destructive, and was recognized by XPRIZE for demonstrating its operational capability.
- claim: Combines a prediction model, a detection model fed by satellite feeds and a spread
    forecasting model.
  url: https://www.lsu.edu/mediacenter/news/2026/09/23_deepfire_award.php
  fetched: 2026-11-21
  quote: DeepFire is three AI models working as one.
- claim: Says the prediction model uses fire history, weather, lightning forecasts, land cover
    and vegetation, and the detection model focuses satellite feeds on the highest-risk ground.
  url: https://www.lsu.edu/mediacenter/news/2026/09/23_deepfire_award.php
  fetched: 2026-11-21
  quote: Those risk maps tell a detection model where to look, focusing satellite feeds on
    the highest-risk ground so it can spot a fire while it is still small enough to stop.
- claim: Says 96 percent of the fires it reported in the final XPRIZE round over New South
    Wales were independently confirmed.
  url: https://www.lsu.edu/mediacenter/news/2026/09/23_deepfire_award.php
  fetched: 2026-11-21
  quote: 96 percent of the fires DeepFire reported were independently confirmed
