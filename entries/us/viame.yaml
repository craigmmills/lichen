summary: Open-source AI system that automates the processing of underwater video and images,
  developed by NOAA with Mississippi State University's Northern Gulf Institute and Kitware.
facts:
- claim: NOAA's Southeast Fisheries Science Center partnered with Mississippi State University-Northern
    Gulf Institute and Kitware to automate processing of Gulf of Mexico videos.
  url: https://www.fisheries.noaa.gov/feature-story/increasing-efficiency-video-surveys-artificial-intelligence
  fetched: '2026-10-30'
  quote: We partnered with Mississippi State University-Northern Gulf Institute and Kitware
    Inc. to develop an Artificial Intelligence and Machine Learning process to automate the
    processing of videos collected in the Gulf.
- claim: Software is open to anyone who wants to use it.
  url: https://www.fisheries.noaa.gov/feature-story/increasing-efficiency-video-surveys-artificial-intelligence
  fetched: '2026-10-30'
  quote: The project is taking an Open Science approach by making the software accessible
    to anyone who would like to use it.
- claim: Open source computer vision platform for do-it-yourself AI.
  url: https://www.viametoolkit.org/
  fetched: '2026-10-30'
  quote: VIAME is an open source computer vision software platform designed for do-it-yourself
    artificial intelligence (AI).
- claim: Trackers use techniques including deep learning.
  ai_type: deep-learning
  url: https://www.viametoolkit.org/
  fetched: '2026-10-30'
  quote: that use different techniques, such as deep learning
- claim: It was first aimed at marine species analytics and is available as a desktop or web
    application.
  url: https://www.viametoolkit.org/
  quote: Originally targeting marine species analytics
  fetched: '2026-10-30'
