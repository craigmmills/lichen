  cheaper methods and focusing on underrepresented countries.
facts:
- claim: Aims to bring environmental DNA analysis out of the lab and into routine
    practice around the world.
  url: https://www.ednacollab.org/
  fetched: 2026-11-21
  quote: The eDNA Collaborative aims to disseminate, accelerate and reinforce science
    that brings environmental DNA (eDNA) analysis and techniques out of the lab and
    into routine practice around the world.
- claim: Develops cheaper and more robust lab and field methods for eDNA, focusing
    on countries historically underrepresented in molecular-ecological research.
  url: https://www.ednacollab.org/
  fetched: 2026-11-21
  quote: developing cheaper and more robust lab and field methods for eDNA and publicizing
