summary: Collaboration of the Cornell Lab of Ornithology, UMass Amherst and Oregon State University
  using weather radar and machine learning to map and forecast bird migration across the US.
facts:
- claim: A collaboration funded by NSF and the Leon Levy Foundation.
  url: https://news.cornell.edu/node/299366
  fetched: '2026-10-30'
  quote: BirdCast is a collaboration among the Cornell Lab of Ornithology , University of
    Massachusetts Amherst and Oregon State University , and was funded by grants from the
    National Science Foundation and Leon Levy Foundation.
- claim: Trained a machine learning model on radar data; it explained 80 percent of variation
    in migration intensity.
  url: https://birdcast.org/creating-a-continental-bird-migration-forecast/
  fetched: '2026-10-30'
  quote: Eighty percent of variation in bird migration intensity was explained by the model.
- claim: Collaboration of four institutions.
  url: https://birdcast.info/about/
  fetched: '2026-10-30'
  quote: Presently, the collaboration includes the Cornell Lab, UMass Amherst, University
    of Illinois Urbana-Champaign , and Purdue University
- claim: Provides real-time predictions of bird migrations.
  url: https://birdcast.info/about/
  fetched: '2026-10-30'
  quote: proposed to provide real-time predictions of bird migrations on a daily basis
- claim: Sheldon's lab pioneered machine learning methods to measure migration from radar
    data and he has contributed to BirdCast since 2007.
  url: https://birdcast.org/our-team/daniel-sheldon/
  quote: Dan has contributed to the science behind BirdCast since 2007.
