facts:
- claim: Listed by the Rufford Foundation as a Sierra Leone project dated 10 August
    2023, with Ambrose Bockarie Kanneh as grantee.
  url: https://www.rufford.org/projects/country/SL/
  fetched: 2026-11-15
  quote: Primates Biomonitoring, and Capacity Building of Local Community Members
    for Ecotourism and Conservation Gains in Jaibui Island and Adjacent Human Communities
- claim: The project was to use SMART software, fitted to the Jaibui Island conservation
    area, for wildlife biomonitoring throughout its one-year cycle.
  url: https://www.rufford.org/projects/ambrose-bockarie-kanneh/primates-biomonitoring-and-capacity-building-local-community-members-ecotourism-and-conservation-gains-jaibui-island-and-adjacent-human-communities/
  fetched: 2026-11-15
  quote: The project will use Spatial Monitoring and Reporting Tool (SMART) Software
    that will be designed to fit the Jaibui Island conservation area for wildlife
    biomonitoring throughout the one-year life cycle.
- claim: It planned to employ six community members as bio-monitors and train them
    in biomonitoring protocols and forest patrols.
  url: https://www.rufford.org/projects/ambrose-bockarie-kanneh/primates-biomonitoring-and-capacity-building-local-community-members-ecotourism-and-conservation-gains-jaibui-island-and-adjacent-human-communities/
  fetched: 2026-11-15
  quote: The project will create employment for six community members as community
    bio-monitors and enhance their capacity in wildlife biomonitoring protocols and
    forest patrols during the project lifetime.
- claim: The Rufford page lists a final evaluation report dated October 2024.
  url: https://www.rufford.org/projects/ambrose-bockarie-kanneh/primates-biomonitoring-and-capacity-building-local-community-members-ecotourism-and-conservation-gains-jaibui-island-and-adjacent-human-communities/
