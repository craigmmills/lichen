summary: Government division, run by the Ministry of Environment and Climate Change,
  which with FAO started a two-week training and data collection activity in April
  2024, reported as producing land cover data for designing a national forest inventory.
facts:
- claim: Forum News reported in April 2024 that FAO and the Forestry Division started
    a two-week training and data collection activity.
  url: https://forumnews-sl.com/?p=25574
  fetched: 2026-11-12
  quote: In this regard, FAO and the Forestry Division of the Ministry of Environment
    and Climate Change started a two-week training and data collection activity from
    April 15th to 26th.
- claim: The report says the activity produced data for estimating land cover distribution
    in Sierra Leone to design a national forest inventory.
  url: https://forumnews-sl.com/?p=25574
  fetched: 2026-11-12
  quote: This event generated data relevant for estimating the distribution of land
    cover in Sierra Leone for the purpose of designing a National Forest Inventory.
