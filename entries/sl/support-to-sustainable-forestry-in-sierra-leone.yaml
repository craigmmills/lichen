summary: Project launched in 2023, funded by the EU Delegation in Freetown with FAO technical help, which
  in April 2024 aimed to build an inventory design for the planned national forest inventory.
facts:
- claim: Launched in 2023, funded by the EU Delegation in Freetown with technical help from FAO.
  url: https://forumnews-sl.com/fao-european-union-delegation-kick-off-forest-inventory-capacity-development
  fetched: 2026-11-12
  quote: The “Support to Sustainable Forestry in Sierra Leone” initiative, launched in 2023 and Funded
    by the European Union Delegation in Freetown with technical help from the Food and Agriculture Organisation
    of the United Nations
- claim: In April 2024, the project aimed to build an inventory design for the planned national forest
    inventory, the foundation of the National Forest Monitoring System.
  url: https://forumnews-sl.com/fao-european-union-delegation-kick-off-forest-inventory-capacity-development
  fetched: 2026-11-12
  quote: The National Forest Inventory (NFI) is the foundation of the National Forest Monitoring System
    (NFMS)
- claim: FAO and the Forestry Division of the Ministry of Environment and Climate Change started a training
    and data collection activity scheduled for 15 to 26 April 2024, using Collect Earth Online.
  url: https://forumnews-sl.com/fao-european-union-delegation-kick-off-forest-inventory-capacity-development
  fetched: 2026-11-12
  quote: The training programme aimed to help create strong skills for collecting land cover information
    using an online geospatial technology called Collect Earth Online (CEO).
