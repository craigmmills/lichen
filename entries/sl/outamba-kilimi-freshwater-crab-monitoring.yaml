summary: Rufford-listed Sierra Leone project, dated January 2025, that aims to collect
  population, reproduction and water quality data on a Critically Endangered freshwater
  crab, for an IUCN Red List reassessment.
facts:
- claim: Listed by the Rufford Foundation as a Sierra Leone project dated 21 January
    2025, with Hassan Sesay as grantee.
  url: https://www.rufford.org/projects/country/SL/
  fetched: 2026-11-15
  quote: Conservation of the Critically Endangered Freshwater Crab (Afrithelphusa
    Gerhildae) at the Outamba-Kilimi National Park, Sierra Leone, Through Monitoring
    Strategies
- claim: The project aims to collect data on the crab's population structure and trends,
    including distribution and abundance, and on its reproductive biology.
  url: https://www.rufford.org/projects/hassan-sesay/conservation-of-the-critically-endangered-freshwater-crab-afrithelphusa-gerhildae-at-the-outamba-kilimi-national-park-sierra-leone-through-monitoring-strategies/
  fetched: 2026-11-15
  quote: 'The current project aims to collect data on: (1) the population structure
    and trends (sex ratio, size, distribution, and abundance)'
- claim: The project also aims to investigate how water quality indicators and biotic
    factors influence population dynamics.
  url: https://www.rufford.org/projects/hassan-sesay/conservation-of-the-critically-endangered-freshwater-crab-afrithelphusa-gerhildae-at-the-outamba-kilimi-national-park-sierra-leone-through-monitoring-strategies/
  fetched: 2026-11-15
  quote: water quality indicators such as oxygen, dissolved ions, and pH
- claim: The grantee says the data will be used with members of the IUCN Freshwater
    Crustacean Specialist Group for an IUCN Red List reassessment of the species.
  url: https://www.rufford.org/projects/hassan-sesay/conservation-of-the-critically-endangered-freshwater-crab-afrithelphusa-gerhildae-at-the-outamba-kilimi-national-park-sierra-leone-through-monitoring-strategies/
  fetched: 2026-11-15
  quote: All the data collected in this project will allow them, in conjunction with
    myself, to carry out an IUCN Red List reassessment for A. gerhildae after the
    lifetime of this project.
