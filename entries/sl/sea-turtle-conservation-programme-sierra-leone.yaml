summary: Run by the Conservation Society of Sierra Leone, the programme hired youths
  for monitoring; a case study reports five nesting species, with green turtles the
  most common bycatch species.
facts:
- claim: A case study for MBZF grant 10251545 (US$20,000, awarded 18 November 2010)
    describes STCP-SL as a local initiative managed by the Conservation Society of
    Sierra Leone.
  url: https://www.speciesconservation.org/small-grant/green-turtle/1545
  fetched: 2026-11-15
  quote: The Sea Turtle Conservation Programme in Sierra Leone (STCP-SL) is a local
    initiative managed by the Conservation Society of Sierra Leone (CSSL).
- claim: The programme has hired community youths for beach and bycatch monitoring.
  url: https://www.speciesconservation.org/small-grant/green-turtle/1545
  fetched: 2026-11-15
  quote: hiring of community youths for beach and bycatch monitoring
- claim: The case study says the programme recorded all five turtle species nesting
    on Sierra Leone's beaches, and that its bycatch record shows more green turtles
    caught in artisanal fisheries than other species.
  url: https://www.speciesconservation.org/small-grant/green-turtle/1545
  fetched: 2026-11-15
  quote: Our bycatch record shows that there are more green turtles caught in the
    artisanal fisheries than the other species
