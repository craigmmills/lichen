summary: Closed pilot project, led by the Conservation Society of Sierra Leone and
  funded by JRS with US$34,500 (July 2024 to June 2025), to develop a national Key
  Biodiversity Area assessment protocol.
facts:
- claim: JRS announced the pilot grant on 6 August 2024, with the Conservation Society
    of Sierra Leone as organisation lead and researchers from Fourah Bay College and
    Njala University.
  url: https://jrsbiodiversity.org/university-consortium-begins-kba-assessment-protocol-in-sierra-leone/
  fetched: 2026-11-15
  quote: Assembled under the organization lead of the Conservation Society of Sierra
    Leone (CSSL) , researchers from Fourah Bay College (FBC), University of Sierra
    Leone , and Njala University will work together on a vital pilot project
- claim: The August 2024 announcement says Sierra Leone's 10 Important Bird Areas
    and 15 Key Biodiversity Areas had not been surveyed to update their biodiversity
    status for nearly three decades.
  url: https://jrsbiodiversity.org/university-consortium-begins-kba-assessment-protocol-in-sierra-leone/
  fetched: 2026-11-15
  quote: For nearly three decades, the 10 identified Important Bird Areas (IBAs) and
    the 15 Key Biodiversity Areas (KBAs) of Sierra Leone have not been surveyed to
    update critical information about their biodiversity status.
- claim: The August 2024 announcement planned activities over the following 12 months,
    including a survey of plants, birds, mammals, amphibians and reptiles in Western
    Area Peninsula National Park and meetings to develop the protocol.
  url: https://jrsbiodiversity.org/university-consortium-begins-kba-assessment-protocol-in-sierra-leone/
  fetched: 2026-11-15
  quote: This project has a number of activities and milestones planned over the next
    12 months including a survey of plants birds, mammals, amphibians and reptiles
    in the WAP-NP
- claim: The JRS grant record for the Conservation Society of Sierra Leone gives funding
    dates of July 2024 to June 2025 and an amount of US$34,500.
  url: https://jrsbiodiversity.org/grants/cssl/
  fetched: 2026-11-15
  quote: July 2024 - June 2025
