summary: Freetown non-profit that, reported in April 2026, monitors sea turtles and
  manatees in bycatch yearly with local fishermen and youths, and is listed by IUCN
  as implementer of a 2014-2015 turtle project.
facts:
- claim: A Freetown directory listing describes it as registered as a non-profit,
    non-governmental environmental organisation, with an address in Murray Town, Freetown.
  url: https://fambul.com/directory/rap-sl
  fetched: 2026-11-12
  quote: RAP-SL is registered as a non-profit making, non-governmental environmental
    organization with membership open to the general public.
- claim: Forum News reported in April 2026 that its founder said it conducts yearly
    monitoring of sea turtles and manatees in the bycatch and monitors nesting beaches.
  url: https://forumnews-sl.com/?p=49703
  fetched: 2026-11-12
  quote: Mr. Edward Aruna went on to disclose that they conduct yearly monitoring
    to ascertain the number of sea turtles and manates in the bycatch while also monitoring
    nesting beaches.
- claim: The same report says it works with local fishermen and youths as turtle monitors.
  url: https://forumnews-sl.com/?p=49703
  fetched: 2026-11-12
  quote: RAP-SL is also working with locals fishermen and youths as turtle monitors
- claim: IUCN Save Our Species lists it as implementer of a 2014-2015 community marine
    turtle project whose objectives included training more than 50 community members
    in beach and bycatch monitoring.
  url: https://iucnsos.org/?p=3176
  fetched: 2026-11-12
  quote: This project is implemented by the Reptiles and Amphibians Program.
- claim: The IUCN SOS project's objectives for 2014-2015 included training community
    members in data collection and beach and bycatch monitoring.
  url: https://iucnsos.org/?p=3176
  fetched: 2026-11-12
  quote: More than 50 community members are trained in data collection, beach and
    bycatch monitoring skills;
