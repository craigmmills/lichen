- claim: It is a company limited by guarantee formed by the Forestry Division, CSSL, the RSPB and the
    people of the seven Gola chiefdoms.
  url: https://golarainforest.org/research-monitoring
  fetched: 2026-11-12
  quote: Gola Rainforest Conservation - Limited by Guarantee (GRC-LG) is formed by the partnership of
    the Forestry Division of the Government of Sierra Leone, the Conservation Society of Sierra Leone
    (CSSL), the Royal Society for the Protection of Birds (RSPB)
- claim: Its core monitoring includes remote sensing of forest cover, forest carbon measurement, camera-trap
    surveys of large mammals and primate, bird and amphibian surveys, run on a regular cycle by its research
    team.
