- claim: A 2025 EGU abstract by West Africa Blue says a mangrove biodiversity baseline
    in Sierra Leone was carried out with CSSL using surveys, camera traps, transects
    and eDNA analysis.
  url: https://meetingorganizer.copernicus.org/EGU25/EGU25-9117.html
  fetched: 2026-11-12
  quote: a local conservation organization in Sierra Leone called the Conservation
    Society of Sierra Leone (CSSL) using a mix of innovative and traditional methodologies,
    including Local Ecological Knowledge (LEK) surveys, camera traps, transects, and
    environmental DNA (eDNA)
- claim: A case study for a grant awarded in November 2010 on the Mohamed bin Zayed
