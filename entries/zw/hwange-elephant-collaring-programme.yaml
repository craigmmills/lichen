summary: ZimParks-led programme with IFAW, funded by Nationale Postcode Loterij, which fitted six more
  elephants with GPS satellite collars in September 2026, bringing the total since early 2024 to 30.
facts:
- claim: Six more elephants were fitted with GPS satellite collars in September 2026, bringing the total
    collared through the ZimParks-IFAW partnership since early 2024 to 30.
  url: https://www.ifaw.org/press-releases/six-elephants-collared-hwange-landscape
  fetched: 2026-11-09
  quote: bringing the total number of elephants collared through the ZimParks-IFAW partnership to 30
- claim: The collars send location data by satellite so that teams can track elephant movements and identify
    areas where human-wildlife conflict may occur.
  url: https://www.ifaw.org/press-releases/six-elephants-collared-hwange-landscape
  fetched: 2026-11-09
  quote: The collars transmit location data via satellite, enabling conservation teams to track elephant
    movements, identify areas where human-wildlife conflict may occur
