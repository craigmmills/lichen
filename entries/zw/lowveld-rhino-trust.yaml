summary: Trust that, according to Save the Rhino International in 2024, has monitored Bubye Valley Conservancy
  rhinos since 2002 by ear notch identification, averaging over 160 identifications a month in 2023.
facts:
- claim: Save the Rhino International reported in 2024 that LRT has monitored the Bubye Valley Conservancy
    rhino population since moving rhinos there in 2002, identifying each rhino by its ear notches.
  url: https://savetherhino.org/africa/zimbabwe/rhino-monitoring-continues-on-the-bubye-valley-conservancy
  fetched: 2026-11-09
  quote: Since those early days, this population has been carefully monitored by LRT.
- claim: The same report says LRT's team averaged more than 160 rhino identifications a month in 2023,
    supported by camera traps and aerial identifications.
  url: https://savetherhino.org/africa/zimbabwe/rhino-monitoring-continues-on-the-bubye-valley-conservancy
  fetched: 2026-11-09
  quote: the team achieved an impressive average of more than 160 IDs each month, supported by the use
    of camera traps and aerial IDs.
