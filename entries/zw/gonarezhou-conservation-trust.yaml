summary: Manages Gonarezhou National Park through a ZimParks and Frankfurt Zoological Society partnership,
  with aerial surveys, lion satellite tracking, vegetation monitoring and ecological databases.
facts:
- claim: Runs biannual aerial surveys of elephants and other large herbivores in Gonarezhou National Park
    and adjacent areas, by fixed-wing aircraft and helicopter.
  url: https://gonarezhou.org/conservation-2/research/research-work/
  fetched: 2026-11-09
  quote: Elephants and other large herbivores, wild and domestic, are censused biannually in Gonarezhou
    National Park and some adjacent areas to the Park.
- claim: Tracks lions in the park with satellite collars.
  url: https://gonarezhou.org/conservation-2/research/research-work/
  fetched: 2026-11-09
  quote: Several male and female lions are being tracked with satellite collars and closely monitored.
- claim: Its ecological monitoring includes databases on freshwater ecosystems, fire trends, wildlife
    mortality, black rhinos and vultures.
  url: https://gonarezhou.org/conservation-2/research/research-work/
  fetched: 2026-11-09
  quote: Ecological monitoring work involves monitoring and establishing databases appropriate for freshwater
    ecosystems, trends of fire and their impact, climate variabilities, wildlife mortality
- claim: Its postal address is in Chiredzi, Zimbabwe.
  url: https://gonarezhou.org/conservation-2/research/research-work/
  fetched: 2026-11-09
  quote: Chiredzi, Zimbabwe
- claim: Manages Gonarezhou National Park day to day as a partnership between ZimParks and the Frankfurt
    Zoological Society.
  url: https://gonarezhou.org/
  fetched: 2026-11-09
  quote: the Park is managed on a day-to-day basis by the Gonarezhou Conservation Trust
- claim: Gives its address as P Bag 7003, Chiredzi, Zimbabwe.
  url: https://gonarezhou.org/
  fetched: 2026-11-09
  quote: P Bag 7003
- claim: Runs vegetation monitoring of plant species abundance, cover, diversity and distribution in the
    park.
  url: https://gonarezhou.org/conservation-2/research/research-work/
  fetched: 2026-11-09
  quote: The goal of vegetation monitoring is to determine the status of and trends in plant species abundance,
    coverage, diversity, and distribution in Gonarezhou.
- claim: The Frankfurt Zoological Society says the Trust partners with others to monitor predators through
    spoor and camera trap surveys.
  url: https://fzs.org/en/programs/zimbabwe/gonarezhou/
  fetched: 2026-11-09
  quote: Gonarezhou Conservation Trust partners with other stakeholders to monitor predator numbers, through
    spoor and camera trap surveys.
