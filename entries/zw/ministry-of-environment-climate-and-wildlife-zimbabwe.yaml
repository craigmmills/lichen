  with UNDP in 2021.
facts:
- claim: Its functions include developing, implementing and monitoring policies, strategies, plans and
    legislation on environment and natural resources.
  url: https://zim.gov.zw/index.php/my-government/government-ministries/environment,-climate-and-wildlife
  fetched: 2026-11-09
  quote: Develop, implement and monitor policies, strategies, plans and legislation on environment and
    natural resources issues for sustainable development;
- claim: It coordinates the domestication and implementation of bilateral and multilateral environmental
    agreements.
  url: https://zim.gov.zw/index.php/my-government/government-ministries/environment,-climate-and-wildlife
  fetched: 2026-11-09
  quote: Co-ordinate the domestication and implementation of Bilateral and Multilateral Agreements (MEAs);
- claim: The government portal names Sithembiso Nyoni as minister.
  url: https://zim.gov.zw/index.php/my-government/government-ministries/environment,-climate-and-wildlife
  fetched: 2026-11-09
  quote: Minister, Hon. Sithembiso G.G Nyoni, M.P.
- claim: The Forestry Commission describes itself as a parastatal under the Ministry of Environment, Climate
    and Wildlife.
  url: https://forestry.co.zw/
  fetched: 2026-11-09
  quote: The Forestry Commission is a parastatal under the Ministry of Environment, Climate and Wildlife,
    established in 1954 through the Forest Act.
- claim: A clearing-house entry published on 2 May 2020 lists the Ministry of Environment, Climate, Tourism
    and Hospitality Industry as responsible for environmental protection policy and legislation.
  url: https://zw.chm-cbd.net/en/organizations/ministry-environment-climate-tourism-and-hospitality-industry
  fetched: 2026-11-09
  quote: Responsible for formulation, review and implementation of policies and legislation for environmental
    protection.
- claim: The clearing-house site says the government, through the ministry and with UNDP, was implementing
