facts:
- claim: A non-profit conservation and research organisation active since 1997.
  url: http://www.dambari.com/
  fetched: 2026-11-09
  quote: Dambari Wildlife Trust (DWT) is a non-profit conservation and research organisation that has
    been active since 1997.
- claim: A year-long study of white rhino in Matobo National Park used direct observations, camera traps
    and belt transects.
  url: https://www.dambari.com/large-herbivore-research/
  fetched: 2026-11-09
  quote: a year-long study of white rhino used direct observations, camera traps and belt transects to
    understand what influenced the selection of habitats for foraging and resting
- claim: Says results from these research projects have been provided to Matobo National Park management.
  url: https://www.dambari.com/large-herbivore-research/
  fetched: 2026-11-09
  quote: Results from these research projects have been provided to Matobo National Park management
- claim: Maintains an electronic database of natural resource trends from its schools monitoring project.
  url: https://www.dambari.com/schools-biodiversity-monitoring-project/
  fetched: 2026-11-09
  quote: DWT carry out further analysis and maintain an electronic database that logs natural resource
    trends across seasons and years.
- claim: With the Natural History Museum of Zimbabwe, holds a JRS Biodiversity Foundation grant of $155,667
    for 2025 to 2027 for biodiversity surveys of the Somabhula grassland and capacity building in Mozambique
    and Zimbabwe, according to JRS.
  url: https://jrsbiodiversity.org/grants/dambari_trust-2025/
