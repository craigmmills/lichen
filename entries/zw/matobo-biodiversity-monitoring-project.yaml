- claim: Students set up transects, quadrats and pitfall traps at their schools.
  url: https://www.dambari.com/schools-biodiversity-monitoring-project/
  fetched: 2026-11-09
  quote: they learn a variety of sampling techniques and set up transects, quadrats and pitfall traps
    at their schools
- claim: The trust analyses the data and keeps an electronic database of natural resource trends.
  url: https://www.dambari.com/schools-biodiversity-monitoring-project/
  fetched: 2026-11-09
  quote: DWT carry out further analysis and maintain an electronic database that logs natural resource
    trends across seasons and years.
