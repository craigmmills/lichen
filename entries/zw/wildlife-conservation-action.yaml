facts:
- claim: Founded in 2019, it promotes human-wildlife coexistence in Zimbabwe's wildlife areas and conducts
    research on wildlife behaviour and trends to guide its interventions.
  url: https://wildlifeconservationaction.org/
  fetched: 2026-11-09
  quote: we conduct research to understand wildlife behaviour and trends, which guides our interventions
- claim: Its research project studies elephants and lions in the Sebungwe area and their impact on the
    landscape.
  url: https://wildlifeconservationaction.org/
  fetched: 2026-11-09
  quote: Our research efforts are driven by a desire to understand key human-wildlife conflict species,
    such as elephants and lions, in the Sebungwe area.
- claim: Its Mbire District project aims to improve human-wildlife conflict mitigation and monitoring
