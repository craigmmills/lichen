facts:
- claim: Describes itself as a Zimbabwean non-profit working within the 50,000 ha Malilangwe Wildlife
    Reserve.
  url: https://www.malilangwe.org/
  fetched: 2026-11-09
  quote: The Malilangwe Trust is a proudly Zimbabwean, non-profit organisation. Our conservation activities
    are focused within 50 000 ha of the Malilangwe Wildlife Reserve in south-eastern Zimbabwe.
- claim: Gives its address as Lonestar Ranch, P Bag 7085, Chiredzi.
  url: https://www.malilangwe.org/
  fetched: 2026-11-09
  quote: Lonestar Ranch
- claim: Since 1998 its scouts have recorded wildlife sightings with GPS on patrol.
  url: https://www.malilangwe.org/contributions-to-science/animal-population-management-database/
  fetched: 2026-11-09
  quote: Since 1998, our Scouts have been issued with a GPS and a set of books specially designed to record
    sightings of wildlife and other related events that they encounter during their patrols.
- claim: Uses information from its Animal Population Management Database to explain wildlife population
    trends and guide management.
  url: https://www.malilangwe.org/contributions-to-science/animal-population-management-database/
  fetched: 2026-11-09
  quote: Information extracted from the APMD has been used to explain trends in wildlife populations and
    guide management decisions.
