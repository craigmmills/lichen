summary: Its 2024 report records 70 adult wild dogs and three collared dogs in Savé Valley Conservancy,
  with Gonarezhou surveys planned for 2027.
facts:
- claim: The 2024 annual report filed by AWCF (UK) with the charity register says intensive monitoring
    of African wild dogs in Savé Valley Conservancy continued in 2024, with an annual count of 70 adult
    dogs.
  url: https://opencharities.uk/ew/1186260/files/2024-12-31-accounts.md
  fetched: 2026-11-09
  quote: Intensive species monitoring continued in 2024. The annual count totalled **70 adult dogs compared
    to 63** in the previous year **.**
- claim: The same report says AWCF uses satellite collars to monitor wild dog packs seen outside protected
    areas, and that three wild dogs in Savé Valley Conservancy carried collars.
  url: https://opencharities.uk/ew/1186260/files/2024-12-31-accounts.md
  fetched: 2026-11-09
  quote: We have expanded our monitoring efforts to include satellite collaring to monitor packs that
    have been sighted beyond the boundaries of protected areas.
- claim: The same report says AWCF agreed with the Gonarezhou Conservation Trust to carry out direct wild
    dog monitoring surveys in the park every two to three years, next in 2027.
  url: https://opencharities.uk/ew/1186260/files/2024-12-31-accounts.md
  fetched: 2026-11-09
  quote: AWCF would carry out direct monitoring surveys of the wild dogs in the park every 2-3 years to
    calibrate trend data
