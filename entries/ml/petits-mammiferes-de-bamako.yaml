summary: Closed 2021 to 2024 small mammal trapping project in Bamako, run and funded by the
  IER and IRD, whose peripheral-district dataset covers 7,433 trap nights and 835 captured
  animals, openly licensed.
facts:
- claim: The project was conducted by the IER and IRD between 2021 and 2024.
  url: https://doi.org/10.23708/rf67h4
  fetched: 2026-11-15
  quote: The project ‘Petits mammifères de Bamako’ conducted by the Institute of Rural Economy
    (IER) and IRD between 2021 and 2024
- claim: Trapping was extended to peripheral districts in a second phase continuing beyond
    2024.
  url: https://doi.org/10.23708/rf67h4
  fetched: 2026-11-15
  quote: then extended to peripheral districts located in neighboring municipalities in a
    second phase continuing beyond 2024
- claim: Monitoring the peripheral districts is meant to document the spread of exotic rodents
    within the city.
  url: https://doi.org/10.23708/rf67h4
  fetched: 2026-11-15
  quote: Monitoring these peripheral districts, where exotic rodents remain only marginally
    established, provides a valuable opportunity to document their ongoing spatial expansion
- claim: The peripheral dataset covers 7,433 trap nights and 835 captured small mammals.
  url: https://doi.org/10.23708/rf67h4
  fetched: 2026-11-15
  quote: Overall, thes dataset represents a trapping effort of 7,433 trap nights and includes
    835 captured small mammals.
